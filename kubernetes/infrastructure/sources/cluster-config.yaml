---
# CRITICAL: cluster identity for Flux postBuild substitution, paired with
# cluster-versions; every stage after `sources` substitutes from both and this
# tree is not substituted itself. Key names are a contract with every manifest
# here: kustomize-controller runs with StrictPostBuildSubstitutions, so an
# unknown ${placeholder} FAILS the reconcile.
# scripts/check-cluster-literals.py owns the placeholder rule, its literal
# exceptions and agreement with ansible/inventories/prod/ (docs/29).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-config
  namespace: flux-system
data:
  # Split-horizon DNS: internal names resolve on the LAN/tailnet only; external
  # names are published to the public Cloudflare zone (docs/08).
  cluster_internal_domain: "esweiss.com"
  cluster_external_domain: "ericsweiss.com"
  # WAN A records the cloudflare-ddns CronJob owns, as `label[:proxied]` pairs;
  # `@` is the apex and proxied defaults to true.
  cluster_ddns_records: "direct:false, git:false, vpn:false, @:true"

  # Prefix for this repo's own label, taint and annotation keys (<prefix>/nas,
  # <prefix>/gpu, ...). Equal to the internal domain, but a separate key: the k3s
  # Ansible layer labels nodes with this prefix or no affinity rule ever matches.
  cluster_node_label_domain: "esweiss.com"

  cluster_lan_cidr: "10.0.10.0/24"
  # Default gateway on the LAN (UniFi gateway). downloads:verify-vpn dials it
  # to prove the qbittorrent pod cannot reach the LAN directly.
  cluster_lan_gateway: "10.0.10.1"
  # Home VLAN (UniFi VLAN 20 — docs/46): client devices, trusted enough for the
  # internal ingress allowlists and nothing else. No inventory counterpart — no
  # host this repo manages lives on it.
  cluster_home_cidr: "10.0.20.0/24"
  # Admin-device block inside the Home VLAN, the same /29 the Proxmox `admin_lan`
  # set carries (group_vars/all.yml, as a list entry rather than a named key), so
  # lan-tailscale-strict can mirror admin_lan instead of the whole VLAN.
  cluster_home_admin_cidr: "10.0.20.8/29"
  cluster_pod_cidr: "10.42.0.0/16"
  cluster_service_cidr: "10.43.0.0/16"
  # CGNAT range (RFC 6598) Tailscale allocates from.
  cluster_tailnet_cidr: "100.64.0.0/10"
  # MagicDNS suffix from the Tailscale admin console; apps/tailnet-dns CNAMEs
  # internal names into it.
  cluster_tailnet_dns_suffix: "taile792d8.ts.net"

  # MetalLB VIPs, sourced here: configs/metallb-ip-pools.yaml reads them, and the
  # AdGuard rewrites in group_vars/dns.yml answer with them and must move too.
  cluster_metallb_public_vip: "10.0.10.100"
  cluster_metallb_internal_vip: "10.0.10.101"
  # wg-easy's WAN endpoint VIP, independent of the two ingress VIPs (docs/38).
  # Mirrored in proxmox_firewall_wan_wireguard_vips in group_vars/all.yml.
  cluster_wg_easy_vip: "10.0.10.99"
  # alloy-syslog receiver VIP, its own /32 pool so the gateway's remote-syslog
  # target is stable. Mirrored by the sg-syslog-vip guest-firewall rule in
  # group_vars/all.yml — both must move together (docs/31).
  cluster_syslog_vip: "10.0.10.162"
  # kube-vip's API VIP, owned by Ansible (`k3s_api_vip` in group_vars/k3s.yml);
  # check-cluster-literals.py holds the two equal.
  cluster_api_vip: "10.0.10.161"

  # Host-side services, mirroring the hosts.yml entries that define them. The
  # NFS one is spelled by NAME: the wildcard cert carries no IP SAN, so an IP
  # mount fails the TLS handshake (docs/24).
  cluster_nas_host: "pve-nas-01.esweiss.com"
  cluster_smtp_host: "smtp-relay.esweiss.com"

  # Prometheus jobs that scrape node-exporter: the in-cluster DaemonSet and the
  # host exporter (observability/exporters/node-exporter-host.yaml). Filesystem
  # and host panels select on this so a host pool cannot page unseen.
  cluster_node_exporter_job_regex: "node-exporter|node-exporter-host"

  # LAN resolvers, space-separated — the form CoreDNS's `forward` needs, and the
  # same pair as `dns_servers` in group_vars/all.yml.
  cluster_upstream_dns_servers: "10.0.10.150 10.0.10.160"

  # Site timezone, mirrored from `timezone` in group_vars/all.yml. Container TZ
  # env values and CronJob spec.timeZone read it instead of a literal.
  cluster_timezone: "America/Los_Angeles"

  # ACME registration contact for the letsencrypt-prod ClusterIssuer, and the
  # Alertmanager email recipient.
  cluster_acme_email: "ericsweiss1@gmail.com"
  cluster_alert_email: "ericsweiss1@gmail.com"

  # Prefix every alert's runbook_url gets. Composed from the canonical GitLab
  # remote, so a 3am alert link and the repo Flux reconciles from cannot drift.
  cluster_runbook_base_url: "https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs"
