---
# Scheduling priority for the two workload classes this cluster has to separate:
# `platform` (applied per HelmRelease) and `ci-jobs`.
#
# `ci-jobs` at a NEGATIVE value is the load-bearing half: every unclassed pod
# sits at 0 and therefore outranks a CI job pod without needing a class of its
# own. preemptionPolicy Never makes a CI pod queue rather than displace.
#
# Consumers and the per-chart value path each one uses: docs/33 § Scheduling
# priority. NOT applied to metrics-server or kured — both carry a HIGHER
# built-in class, so setting it would be a downgrade.
#
# Lives in sources/ because the Priority admission plugin rejects a pod naming a
# missing class, and the `wait: true` controllers stage creates such pods before
# configs is reached (see sources/kustomization.yaml).
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform
value: 100000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: >-
  Platform workloads that must win scheduling against ordinary apps and CI job
  pods. Applied per workload — nothing inherits it.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ci-jobs
value: -10
globalDefault: false
preemptionPolicy: Never
description: >-
  GitLab CI job pods. Ranked below every unclassed workload and never preempts —
  a burst queues rather than displacing running workloads. Set via
  [runners.kubernetes] priority_class_name in the runner TOMLs.
