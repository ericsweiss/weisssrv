---
# Scheduling classes: `platform` (applied per HelmRelease) and `ci-jobs`, whose
# negative value plus preemptionPolicy Never queues CI pods below every
# unclassed pod. Consumers: docs/33 § Scheduling priority.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform
  # `.value` is immutable: force re-creates the class, and pods naming it are
  # rejected during that window.
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
value: 100000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: >-
  Platform workloads that must win scheduling against ordinary apps and CI job
  pods. Applied per workload — nothing inherits it.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ci-jobs
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
value: -10
globalDefault: false
preemptionPolicy: Never
description: >-
  GitLab CI job pods. Ranked below every unclassed workload and never preempts —
  a burst queues rather than displacing running workloads. Set via
  [runners.kubernetes] priority_class_name in the runner TOMLs.
