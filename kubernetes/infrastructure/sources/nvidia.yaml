---
# NVIDIA k8s-device-plugin Helm chart repo. Source for the
# nvidia-device-plugin HelmRelease (controllers/nvidia-device-plugin), which
# advertises nvidia.com/gpu on the labelled GPU node (pve-prec-01's agent).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nvidia
  namespace: flux-system
spec:
  interval: 1h
  url: https://nvidia.github.io/k8s-device-plugin
