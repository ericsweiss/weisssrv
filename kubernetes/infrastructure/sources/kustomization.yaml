---
# First stage, no dependencies: HelmRepository sources, the cluster-versions and
# cluster-config substitution ConfigMaps, and the PriorityClasses (Priority admission
# rejects a pod naming a missing class). Nothing here may contain a ${...} placeholder.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - authentik.yaml
  - external-dns.yaml
  - external-secrets.yaml
  - fairwinds-stable.yaml
  - gitlab.yaml
  - grafana-community.yaml
  - grafana.yaml
  - jetstack.yaml
  - kured.yaml
  - metallb.yaml
  - metrics-server.yaml
  - nvidia.yaml
  - onepassword-connect.yaml
  - prometheus-community.yaml
  - stakater.yaml
  - tailscale.yaml
  - traefik.yaml
  # Not HelmRepositories.
  - cluster-config.yaml
  - priorityclasses.yaml
  - versions-configmap.yaml
