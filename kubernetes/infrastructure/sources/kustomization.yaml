---
# sources/ is the earliest-reconciling layer: HelmRepository sources (where
# helm-controller pulls charts from) and the cluster-versions ConfigMap
# (which controllers/ and apps/ read for postBuild substitution).
#
# versions-configmap.yaml lives here intentionally — it MUST exist before
# controllers/ reconciles so that `${helm_chart_versions_*}` placeholders
# resolve when HelmReleases render.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-secrets.yaml
  - metallb.yaml
  - jetstack.yaml
  - traefik.yaml
  - external-dns.yaml
  - authentik.yaml
  - gitlab.yaml
  - prometheus-community.yaml
  - grafana.yaml
  - grafana-community.yaml
  - onepassword-connect.yaml
  - fairwinds.yaml
  - kured.yaml
  - stakater.yaml
  - tailscale-operator.yaml
  - versions-configmap.yaml
