---
# The earliest-reconciling layer: HelmRepository sources plus the
# cluster-versions ConfigMap. The ConfigMap lives here because it must exist
# before controllers/ renders any `${...}` placeholder.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-secrets.yaml
  - metallb.yaml
  - jetstack.yaml
  - traefik.yaml
  - external-dns.yaml
  - authentik.yaml
  - gitlab.yaml
  - prometheus-community.yaml
  - grafana.yaml
  - grafana-community.yaml
  - onepassword-connect.yaml
  - fairwinds.yaml
  - kured.yaml
  - stakater.yaml
  - tailscale-operator.yaml
  - nvidia.yaml
  - versions-configmap.yaml
