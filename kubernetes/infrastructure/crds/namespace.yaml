---
# Home for the CRD-only HelmRelease (prometheus-operator-crds) and its Helm
# storage Secret. Created in this stage so it exists before the controllers
# stage, which depends on the monitoring.coreos.com CRDs this release installs.
apiVersion: v1
kind: Namespace
metadata:
  name: prometheus-operator-crds
  annotations:
    # Same opt-out as the HelmRelease (release.yaml): pruning this Namespace
    # would cascade-delete the namespaced HelmRelease and trigger a
    # `helm uninstall` of every monitoring CRD.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/name: prometheus-operator-crds
    app.kubernetes.io/part-of: kube-prometheus-stack
    app.kubernetes.io/managed-by: flux
    # Nothing runs here — the release is CRDs only (no pods, no chart hooks), so
    # the strictest profile is free and any pod that ever appears is a surprise
    # worth blocking.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
