---
# prometheus-operator-crds: the monitoring.coreos.com CRDs in their own stage so
# controllers (Traefik) can render ServiceMonitors on a fresh bootstrap. Keep the
# prometheus_operator_crds pin in all.yml in lockstep with kube_prometheus_stack.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: prometheus-operator-crds
  annotations:
    # Garbage-collecting this HelmRelease would trigger a `helm uninstall`, so it
    # opts out of prune: deleting it has to be a deliberate manual act.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 30m
  releaseName: prometheus-operator-crds
  # Revert out-of-band CRD edits (see traefik/release.yaml for the repo rule).
  # Safe: this release is CRDs only, with no webhook and no workload.
  driftDetection:
    mode: enabled
  timeout: 10m
  chart:
    spec:
      chart: prometheus-operator-crds
      version: "${helm_chart_versions_prometheus_operator_crds}"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  install:
    # CRITICAL: RetryOnFailure, not the default. Install remediation otherwise
    # uninstalls, which for a Helm-owned CRD release cascade-deletes every
    # monitoring CR in the cluster. A stuck install is recoverable.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # CRITICAL: resource-policy keep, so a helm uninstall leaves the CRDs and
    # every monitoring CR standing. The CRDs are chart templates, not a crds/
    # directory, so no install.crds field applies. Recovery: docs/29.
    crds:
      annotations:
        helm.sh/resource-policy: keep
