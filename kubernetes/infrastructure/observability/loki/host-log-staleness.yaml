# Host journald-shipping staleness alerts. One alert per alloy_host host
# (ansible/playbooks/site.yml: base_managed + plex/gitlab/nextcloud/immich/
# immich-ml + k3s servers/agents = 23 hosts). Fires when NO journald line has
# reached Loki from a host in 45m — i.e. its host-side Alloy (alloy_host) stopped
# shipping (Alloy dead, host down, or the Loki-push path is broken past the WAL
# buffer). alloy_host labels its stream {job="journal", host="<inventory_hostname>"}
# (config.alloy.j2); job="journal" distinguishes host-side alloy_host (journald)
# from the in-cluster Alloy DaemonSet (container logs).
#
# severity: warning -> Alertmanager routes to the discord-default receiver.
# instance:<host> groups the alert per-host under the existing route
# group_by:[alertname,namespace,instance]. for:15m on top of the [45m] window is
# ~1h of silence before paging (deliberately conservative: alloy_host WAL
# backfills brief Loki outages, so a real "shipping stopped" is sustained). A
# fully-down host also raises KubeNodeNotReady/node-down alerts; this Discord-only
# warning is corroborating, not the primary page.
#
# Keep this host list in sync with the alloy_host play in
# ansible/playbooks/site.yml (home/HAOS and windows are excluded — they cannot
# run Ansible/alloy_host).
groups:
  - name: host-log-staleness
    interval: 1m
    rules:
      - alert: HostLogShippingStale
        expr: absent_over_time({job="journal", host="pve-nas-01"}[45m])
        for: 15m
        labels: { severity: warning, component: logging, host: pve-nas-01, instance: pve-nas-01 }
        annotations:
          summary: "No journald logs from pve-nas-01 in 45m (alloy_host shipping stopped)"
      - alert: HostLogShippingStale
        expr: absent_over_time({job="journal", host="pve-laptop-01"}[45m])
