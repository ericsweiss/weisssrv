        annotations:
          summary: "No journald logs from {{ $labels.host }} in 45m (alloy_host shipping stopped)"
          description: "No journald line has reached Loki from {{ $labels.host }} in 45m. Its host-side Alloy is dead, the host is down, or the Loki push path is broken past the on-disk WAL. Check `systemctl status alloy` on {{ $labels.host }}, then the loki.${cluster_internal_domain} IngressRoute and the Loki pod."
          runbook_url: "${cluster_runbook_base_url}/12-runbooks.md"
