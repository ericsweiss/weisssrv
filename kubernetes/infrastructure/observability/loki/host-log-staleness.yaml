# Host journald-shipping staleness, one alert per alloy_host host. Fires when no
# journald line has reached Loki from a host in 45m — its host-side Alloy is
# dead, the host is down, or the push path is broken past the on-disk WAL.
# {job="journal"} is what distinguishes these host streams from the in-cluster
# Alloy DaemonSet's container logs. for:15m on top of the [45m] window is ~1h of
# silence before paging, because alloy_host WAL-backfills brief Loki outages.
#
# These rules are evaluated by LOKI's ruler and pushed straight to Alertmanager,
# so nothing in Prometheus sees them fail — LokiRulerRulesMissing compares the
# live ruler's rule COUNT against this file. Keep the host list in sync with the
# alloy_host play in ansible/playbooks/site.yml (home/HAOS and windows cannot run
# it); scripts/test_host_log_staleness.py enforces both the list and the count.
groups:
  - name: host-log-staleness
    interval: 1m
    rules:
      - alert: HostLogShippingStale
        expr: absent_over_time({job="journal", host="pve-nas-01"}[45m])
        for: 15m
        labels: { severity: warning, component: logging, host: pve-nas-01, instance: pve-nas-01 }
        annotations:
          summary: "No journald logs from pve-nas-01 in 45m (alloy_host shipping stopped)"
          description: "No journald line has reached Loki from pve-nas-01 in 45m. Its host-side Alloy is dead, the host is down, or the Loki push path is broken past the on-disk WAL. Check `systemctl status alloy` on pve-nas-01, then the loki.esweiss.com IngressRoute and the Loki pod."
          runbook_url: "https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md"
      - alert: HostLogShippingStale
        expr: absent_over_time({job="journal", host="pve-laptop-01"}[45m])
