---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - storage.yaml
  - release.yaml

# Loki ruler rule files, delivered by the loki-sc-rules sidecar. loki_rule:"1"
# matches the sidecar's label; k8s-sidecar-target-directory makes it write into
# /rules/fake, the tenant directory the ruler's local storage scans.
generatorOptions:
  # Stable name (no content-hash suffix) so the sidecar keeps discovering it and
  # no orphan rule ConfigMaps accumulate.
  disableNameSuffixHash: true
  labels:
    loki_rule: "1"
  annotations:
    k8s-sidecar-target-directory: /rules/fake
configMapGenerator:
  - name: loki-rules-host-log-staleness
    files:
      - host-log-staleness.yaml
  - name: loki-rules-runner-reaper
    files:
      - runner-reaper.yaml
  - name: loki-rules-unifi-syslog
    files:
      - unifi-syslog.yaml
