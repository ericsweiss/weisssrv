---
# Grafana Loki — log aggregation in single-binary (monolithic) mode.
# Pinned to NAS node for local ZFS zvol storage (WAL + chunks).
# Retention: 30 days. Ingested by Alloy DaemonSet.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: observability
spec:
  interval: 30m
  releaseName: loki
  timeout: 10m
  chart:
    spec:
      chart: loki
      version: "${helm_chart_versions_loki}"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    deploymentMode: Monolithic  # Renamed from SingleBinary in chart 12.0.0; singleBinary: values block name unchanged

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage:
        type: filesystem
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      limits_config:
        retention_period: 720h
        max_query_length: 720h
        # Ingestion rate caps so a log storm cannot fill the 75Gi zvol before
        # the time-based compactor deletion catches up. Single-tenant homelab
        # volume sits well under these.
        ingestion_rate_mb: 8
        ingestion_burst_size_mb: 16
        per_stream_rate_limit: 4MB
        per_stream_rate_limit_burst: 8MB
        # Stream ceiling, pinned rather than left at Loki's 5000 default so the
        # cardinality budget is reviewable next to the labels that spend it.
        # Live: 117 in-memory streams, 7d peak 449. The host journal senders add
        # a `unit` stream label (alloy_host config.alloy.j2) worth ~285 streams
        # fleet-wide, measured over 16 hosts; `priority`/`hostname` were dropped
        # there rather than pay another ~1.4x. Every stream holds an open chunk
        # for up to max_chunk_age (6h below), so this is a memory bound as much
        # as an index one — the ingester runs under a 1Gi limit at a 554MB 7d
        # peak. 2000 leaves ~3x headroom over the post-change projection and
        # still stops a relabel mistake (a per-pid or per-message-id label) from
        # taking the log plane down.
        max_global_streams_per_user: 2000
      # Out-of-order accept window. Loki takes a push whose timestamps are up to
      # max_chunk_age/2 behind the stream's newest entry and rejects the rest as
      # `too_far_behind` — 1.93M lines were dropped that way in a 7-day sample,
      # in short bursts shaped like sender restarts. The senders' backfill
      # horizon is the alloy_host journal re-read (loki.source.journal max_age,
      # pinned to 3h in that role's defaults) plus its ~1h on-disk WAL replay,
      # so the chart default (2h -> a 1h window) was narrower than what the
      # senders are configured to resend. 6h gives a 3h window that covers both.
      # Cost is bounded: an open chunk is cut on chunk_target_size long before
      # this age for any busy stream, so only idle streams hold memory longer.
      # Raising this REQUIRES raising alloy_host_journal_max_age with it (and
      # vice versa) — scripts/test_alloy_journal_pipeline.py enforces the pair.
      ingester:
        max_chunk_age: 6h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
        working_directory: /var/loki/compactor
      # Ruler: evaluate LogQL alerting rules in-process (ruler.replicas stays 0,
      # so this runs under the monolithic -target=all, not a separate ruler
      # StatefulSet) and push firing alerts to the in-cluster Alertmanager. The
      # rule files themselves are delivered by the k8s-sidecar (already running as
      # loki-sc-rules) into /rules/fake — the auth_enabled:false single tenant is
      # "fake", and the ruler's local storage scans <directory>/<tenant>/, so the
      # rules must land in /rules/fake (see sidecar.rules.folderAnnotation below
      # + the loki-rules-* ConfigMap annotation in kustomization.yaml).
      rulerConfig:
        wal:
          dir: /var/loki/ruler-wal
        storage:
          type: local
          local:
            directory: /rules
        rule_path: /var/loki/ruler-rule-tmp
        alertmanager_url: http://kube-prometheus-stack-alertmanager.observability.svc:9093
        enable_alertmanager_v2: true
        enable_api: true
        evaluation_interval: 1m
        poll_interval: 1m

    # Route each loki_rule ConfigMap into the "fake" (auth-disabled) tenant subdir
    # so the ruler's local storage (directory: /rules) finds them under
    # /rules/fake/. The sidecar reads the k8s-sidecar-target-directory annotation
    # on each rule ConfigMap (set in kustomization.yaml). singleBinary.sidecar and
    # sidecar.rules.enabled stay at their true chart defaults (do not touch).
    sidecar:
      rules:
        folderAnnotation: k8s-sidecar-target-directory

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 75Gi
        # storageClass "-" is LOAD-BEARING and must NOT be removed or changed to
        # a plain "". The chart (_workload.tpl) renders the volumeClaimTemplate
        # storageClassName via `{{- with $storageClass }}`: the "-" sentinel emits
        # a literal `storageClassName: ""` (statically bind ONLY the pre-provisioned
        # loki-data zvol PV, hostPath /mnt/loki-data), whereas a plain "" is falsy
        # to `with` and DROPS the field entirely -> the cluster-default local-path
        # class captures the claim onto the k3s-agt-nas-01 VM bootdisk (excluded
        # from backups). Drift incident: storage-loki-0 was observed bound to a
        # dynamically-provisioned local-path PV while the intended loki-data PV sat
        # Released (a past PVC recreation predating this guard; StatefulSet
        # volumeClaimTemplates are immutable, so the live PVC keeps its old class
        # until an operator rebinds it). The LocalPathPVExists alert
        # (kube-prometheus-stack release.yaml) now catches any recurrence. The
        # live rebind/rsync is a deploy-time runbook step (docs/29) — this manifest
        # is the git-side guard only.
        storageClass: "-"
      nodeSelector:
        esweiss.com/nas: "true"
      tolerations:
        - key: esweiss.com/nas
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi

    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    monitoring:
      serviceMonitor:
        enabled: true
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false

    gateway:
      enabled: false

    test:
      enabled: false

    lokiCanary:
      enabled: false

    chunksCache:
      enabled: false

    resultsCache:
      enabled: false
