---
# Grafana Loki — log aggregation in single-binary (monolithic) mode, RF=1, 30-day
# retention, pinned to the NAS agent for its ZFS zvol PV (WAL + chunks).
# Ingested by the in-cluster Alloy DaemonSet (container logs) and the host-side
# alloy_host units (journald). Sizing and limits: docs/31-observability.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: observability
spec:
  interval: 30m
  releaseName: loki
  # Correct out-of-band edits to chart-rendered objects — see the rationale on
  # controllers/traefik/release.yaml. Safe here: no webhook, no autoscaler.
  driftDetection:
    mode: enabled
  timeout: 10m
  chart:
    spec:
      chart: loki
      version: "${helm_chart_versions_loki}"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    global:
      # `platform` (sources/priorityclasses.yaml). global is the chart's
      # documented all-pods override; it reaches the singleBinary StatefulSet
      # (the only component enabled here) and the gateway if it is ever turned
      # on. The canary and the two caches carry their own keys — all three are
      # disabled below.
      priorityClassName: platform

    deploymentMode: Monolithic  # Renamed from SingleBinary in chart 12.0.0; singleBinary: values block name unchanged

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage:
        type: filesystem
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      limits_config:
        retention_period: 720h
        max_query_length: 720h
        # Ingestion caps, sized to absorb a fleet-wide WAL replay after an
        # outage rather than steady-state volume — a rejected line is lost
        # (RF=1, senders do not retry a 4xx). Retention, not these caps, is
        # what bounds the 75Gi zvol.
        ingestion_rate_mb: 16
        ingestion_burst_size_mb: 32
        per_stream_rate_limit: 8MB
        per_stream_rate_limit_burst: 16MB
        # A host that has been down for days replays journald older than Loki's
        # 7-day default, which lands as `greater_than_max_sample_age`. 14 days is
        # inside the 30-day retention, so nothing is accepted that would be
        # compacted away immediately.
        reject_old_samples_max_age: 336h
        # Stream ceiling, pinned rather than left at Loki's 5000 default so the
        # cardinality budget is reviewable next to the labels that spend it.
        # Every stream holds an open chunk for up to max_chunk_age, so this is a
        # memory bound as much as an index one; 2000 leaves several times the
        # live headroom and still stops a relabel mistake (a per-pid or
        # per-message-id label) from taking the log plane down.
        max_global_streams_per_user: 2000
      # Out-of-order accept window: Loki takes a push up to max_chunk_age/2
      # behind the stream's newest entry and rejects the rest as
      # `too_far_behind`. The senders' backfill horizon is the alloy_host journal
      # re-read (alloy_host_journal_max_age) plus its ~1h on-disk WAL replay, so
      # 12h (a 6h window) covers a multi-hour Loki outage instead of only the
      # replay itself. Cost is bounded: a busy stream's chunk is cut on
      # chunk_target_size long before this age, so only idle streams hold memory
      # longer. alloy_host_journal_max_age (3h by default) must stay inside the
      # 6h window. Nothing enforces the pair — it is a hand-maintained
      # convention, stated on both halves: see the alloy_host role README
      # ("Sender/receiver pair") in the weisssrv.infra collection.
      ingester:
        max_chunk_age: 12h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
        working_directory: /var/loki/compactor
      # Ruler: evaluate LogQL alerting rules in-process (ruler.replicas stays 0,
      # so it runs under the monolithic -target=all) and push firing alerts to
      # Alertmanager. Rule files are delivered by the loki-sc-rules sidecar into
      # /rules/fake — with auth_enabled:false the single tenant is "fake" and the
      # ruler's local storage scans <directory>/<tenant>/.
      rulerConfig:
        wal:
          dir: /var/loki/ruler-wal
        storage:
          type: local
          local:
            directory: /rules
        rule_path: /var/loki/ruler-rule-tmp
        alertmanager_url: http://kube-prometheus-stack-alertmanager.observability.svc:9093
        enable_alertmanager_v2: true
        enable_api: true
        evaluation_interval: 1m
        poll_interval: 1m

    # Route each loki_rule ConfigMap into the "fake" (auth-disabled) tenant
    # subdir so the ruler finds them under /rules/fake/. The sidecar reads this
    # annotation off each rule ConfigMap (set in kustomization.yaml).
    # singleBinary.sidecar and sidecar.rules.enabled stay at their chart defaults.
    sidecar:
      rules:
        folderAnnotation: k8s-sidecar-target-directory

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 75Gi
        # storageClass "-" is LOAD-BEARING and must NOT be changed to a plain "".
        # The chart renders storageClassName via `{{- with $storageClass }}`: the
        # "-" sentinel emits a literal `storageClassName: ""` (bind ONLY the
        # pre-provisioned loki-data zvol PV), whereas a plain "" is falsy to
        # `with` and DROPS the field, letting the default local-path class
        # capture the claim onto the stateless VM bootdisk. LocalPathPVExists
        # (rules/storage.yaml) catches any recurrence; StatefulSet
        # volumeClaimTemplates are immutable, so a live rebind is a runbook step
        # (docs/29), not something this manifest can fix.
        storageClass: "-"
      nodeSelector:
        ${cluster_node_label_domain}/nas: "true"
      tolerations:
        - key: ${cluster_node_label_domain}/nas
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
      # Request tracks the VPA's recorded Off-tier target (729Mi — docs/33
      # §Applying an Off-tier recommendation); the limit stays 1Gi.
      resources:
        requests:
          cpu: 100m
          memory: 768Mi
        limits:
          memory: 1Gi

    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    monitoring:
      serviceMonitor:
        enabled: true
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false

    gateway:
      enabled: false

    test:
      enabled: false

    lokiCanary:
      enabled: false

    chunksCache:
      enabled: false

    resultsCache:
      enabled: false
