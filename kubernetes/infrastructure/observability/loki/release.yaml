---
# Grafana Loki in single-binary mode, RF=1, 90-day retention, pinned to the NAS
# agent for its ZFS zvol PV. Fed by the in-cluster Alloy DaemonSet and the
# host-side alloy_host units. Sizing and limits: docs/31-observability.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: observability
spec:
  interval: 30m
  releaseName: loki
  # Correct out-of-band edits to chart-rendered objects — see the rationale on
  # controllers/traefik/release.yaml. Safe here: no webhook, no autoscaler.
  driftDetection:
    mode: enabled
  timeout: 10m
  chart:
    spec:
      chart: loki
      version: "${helm_chart_versions_loki}"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    global:
      # priorityClassName `platform`: global is the chart's documented all-pods
      # override and reaches the singleBinary StatefulSet, the only component
      # enabled here.
      priorityClassName: platform

    # Monolithic is configured through the values block still keyed singleBinary.
    deploymentMode: Monolithic

    # The rules sidecar watches its own namespace (searchNamespace unset) and
    # reads only loki_rule ConfigMaps, so a namespace Role replaces the chart's
    # default cluster-wide configmaps+secrets grant to the Loki ServiceAccount.
    rbac:
      namespaced: true

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage:
        type: filesystem
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      limits_config:
        # 90 days holds about 24 GiB of the 75Gi volume (docs/31 owns the
        # sizing); max_query_length must track retention or the extra is
        # unqueryable.
        retention_period: 2160h
        max_query_length: 2160h
        # Ingestion caps sized to absorb a fleet-wide WAL replay, since a
        # rejected line is lost at RF=1. Retention, not these caps, bounds the
        # 75Gi zvol.
        ingestion_rate_mb: 16
        ingestion_burst_size_mb: 32
        per_stream_rate_limit: 8MB
        per_stream_rate_limit_burst: 16MB
        # A host down for days replays journald older than Loki's 7-day default,
        # which lands as `greater_than_max_sample_age`. 14 days is inside
        # retention, so nothing accepted is compacted away immediately.
        reject_old_samples_max_age: 336h
        # Stream ceiling, pinned so the cardinality budget sits next to the
        # labels that spend it. Every stream holds an open chunk for up to
        # max_chunk_age, so a relabel mistake here takes the log plane down.
        max_global_streams_per_user: 2000
      # Out-of-order accept window = max_chunk_age/2; anything older is rejected
      # as `too_far_behind`. alloy_host_journal_max_age must stay inside that 6h
      # window — an unenforced convention (alloy_host role README).
      ingester:
        max_chunk_age: 12h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
        working_directory: /var/loki/compactor
      # Ruler: evaluate LogQL alerting rules in-process (ruler.replicas stays 0)
      # and push firing alerts to Alertmanager. The loki-sc-rules sidecar
      # delivers rule files into /rules/fake, the auth_enabled:false tenant dir.
      rulerConfig:
        wal:
          dir: /var/loki/ruler-wal
        storage:
          type: local
          local:
            directory: /rules
        rule_path: /var/loki/ruler-rule-tmp
        alertmanager_url: http://kube-prometheus-stack-alertmanager.observability.svc:9093
        enable_alertmanager_v2: true
        enable_api: true
        evaluation_interval: 1m
        poll_interval: 1m

    # Route each loki_rule ConfigMap into the "fake" (auth-disabled) tenant
    # subdir so the ruler finds them under /rules/fake/. The sidecar reads this
    # annotation off each rule ConfigMap (set in kustomization.yaml).
    sidecar:
      # The chart ships the rules sidecar with no requests and no OOM ceiling.
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi
      rules:
        folderAnnotation: k8s-sidecar-target-directory
        resource: configmap

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 75Gi
        # CRITICAL: storageClass "-" must not become "". The chart's `with`
        # drops a falsy value and local-path then captures the claim onto the
        # stateless VM bootdisk; the "-" sentinel binds the loki-data PV.
        storageClass: "-"
      nodeSelector:
        ${cluster_node_label_domain}/nas: "true"
      tolerations:
        - key: ${cluster_node_label_domain}/nas
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
      # Off-tier VPA: the request is hand-applied from the recorded target
      # (docs/33 §Applying an Off-tier recommendation). The recommendation
      # counts reclaimable page cache, so it is not a capacity signal.
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          memory: 1Gi

    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    monitoring:
      serviceMonitor:
        enabled: true
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false

    gateway:
      enabled: false

    test:
      enabled: false

    lokiCanary:
      enabled: false

    chunksCache:
      enabled: false

    resultsCache:
      enabled: false
