---
# Loki data persistent storage (chunks + WAL)
# Uses hostPath pointing to /mnt/loki-data on k3s-agt-nas-01.
# The PV pre-binds to storage-loki-0 (the PVC name created by the
# Loki StatefulSet's volumeClaimTemplate).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: loki-data
  labels:
    type: local
    app: loki
spec:
  capacity:
    storage: 75Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: observability
    name: storage-loki-0
  hostPath:
    path: /mnt/loki-data
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-agt-nas-01
