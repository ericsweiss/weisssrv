---
# Loki data persistent storage (chunks + WAL)
# Uses hostPath pointing to /mnt/loki-data on k3s-agt-nas-01.
# This directory is an ext4 filesystem on a ZFS zvol (ssd/appdata/loki/data).
# Pinned to NAS node for WAL write performance and query latency.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: loki-data
  labels:
    type: local
    app: loki
spec:
  capacity:
    storage: 75Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/loki-data
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-agt-nas-01

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: observability
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 75Gi
  volumeName: loki-data
