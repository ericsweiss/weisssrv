# Catches the reaper's invisible failure: a partial sweep exits 0 and says so
# only in its "BUDGET STOP" log line (docs/13 § Runner garbage collection).
# Loki's ruler evaluates it; the 25h window spans a day of */15 sweeps.
groups:
  - name: runner-reaper
    interval: 5m
    rules:
      - alert: GitlabRunnerReaperPartialSweep
        expr: sum(count_over_time({namespace="gitlab-runner-reaper"} |= "BUDGET STOP" [25h])) > 0
        for: 15m
        labels: { severity: warning, component: ci }
        annotations:
          summary: "Runner reaper hit its budget without finishing a sweep in the last 25h"
          description: "gitlab-runner-reaper logged a BUDGET STOP: it exited cleanly but did not finish reaping every runner namespace, and repeated stops mean orphan CI pods/Secrets are accumulating unreaped. Read the CronJob logs for the namespaces it skipped; a persistent stop means raising the budget or investigating what bloats the sweep (docs/13 § Runner garbage collection)."
          runbook_url: "${cluster_runbook_base_url}/13-ci-cd.md"
