---
# Emergency-fallback NodePort for the Loki push API. Hosts running Alloy
# normally ship journald logs via https://loki.esweiss.com (Traefik); set
# alloy_host_loki_url per-host to use http://<any-k3s-node>:31100 instead.
apiVersion: v1
kind: Service
metadata:
  name: loki-external
  namespace: observability
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      nodePort: 31100
