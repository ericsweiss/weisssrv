---
# Alertmanager configuration, rendered from 1Password through an ExternalSecret
# template. discord_configs takes webhook_url, not webhook_url_file. Values go
# through `quote` so a rotated secret with special characters stays valid.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: alertmanager-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            smtp_smarthost: "${cluster_smtp_host}:587"
            smtp_from: "Alertmanager <alertmanager@${cluster_internal_domain}>"
            smtp_require_tls: true
            smtp_auth_username: {{ .smtpUsername | quote }}
            smtp_auth_password: {{ .smtpPassword | quote }}

          inhibit_rules:
            - source_matchers:
                - severity="critical"
              target_matchers:
                - severity="warning"
              equal:
                - alertname
                - namespace
            # Custom warning/critical pairs use distinct alertnames, so the generic
            # rule never matches them. Storage pairs on instance+chip below: one host
            # reports many drives under a single component label.
            - source_matchers:
                - severity="critical"
                - component=~"cpu|gpu|network"
              target_matchers:
                - severity="warning"
                - component=~"cpu|gpu|network"
              equal:
                - instance
                - component
            - source_matchers:
                - alertname="SATADriveTempCritical"
              target_matchers:
                - alertname="SATADriveTempWarning"
              equal:
                - instance
                - chip
            - source_matchers:
                - alertname="NVMeDriveTempCritical"
              target_matchers:
                - alertname="NVMeDriveTempWarning"
              equal:
                - instance
                - chip
            - source_matchers:
                - alertname="DiskUsageCritical"
              target_matchers:
                - alertname="DiskUsageWarning"
              equal:
                - instance
                - mountpoint
            # Above 80% the two alerts are the same condition on the same
            # filesystem; equal on mountpoint so another filling mount still pages.
            # image-gc-high-threshold must stay under 80 or this mutes it for good.
            - source_matchers:
                - alertname="DiskUsageWarning"
              target_matchers:
                - alertname="KubeletImageGCIneffective"
              equal:
                - instance
                - mountpoint
            - source_matchers:
                - alertname="InodeUsageCritical"
              target_matchers:
                - alertname="InodeUsageWarning"
              equal:
                - instance
                - mountpoint
            - source_matchers:
                - alertname="PVCUsageCritical"
              target_matchers:
                - alertname="PVCUsageWarning"
              equal:
                - namespace
                - persistentvolumeclaim
            # instance + pool: all five compute hosts name their pool local-ssd.
            - source_matchers:
                - alertname="ZFSPoolSpaceCritical"
              target_matchers:
                - alertname="ZFSPoolSpaceWarning"
              equal:
                - instance
                - pool
            - source_matchers:
                - alertname="CertExpiringCritical"
              target_matchers:
                - alertname="CertExpiringWarning"
              equal:
                - namespace
                - name
            # The textfile cert metric carries instance, not namespace/name.
            - source_matchers:
                - alertname="CertExpiringSoonCritical"
              target_matchers:
                - alertname="CertExpiringSoon"
              equal:
                - instance
            # Same expr at two durations, so the generic alertname-equal rule
            # cannot pair them.
            - source_matchers:
                - alertname="ZfsEncryptedMountStuckCritical"
              target_matchers:
                - alertname="ZfsEncryptedMountStuck"
              equal:
                - instance
            - source_matchers:
                - alertname="GitLabBackupStaleCritical"
              target_matchers:
                - alertname="GitLabBackupStale"
              equal:
                - instance
            - source_matchers:
                - alertname="EndpointDownCritical"
              target_matchers:
                - alertname="EndpointDown"
              equal:
                - instance
            # Different alertnames for the same failing integration, so the
            # generic pair cannot match them.
            - source_matchers:
                - alertname="AlertmanagerClusterFailedToSendAlerts"
              target_matchers:
                - alertname="AlertmanagerFailedToSendAlerts"
              equal:
                - integration
            # ExternalIngressDown is a count(), so it carries no instance label and
            # no `equal:` is possible. The two instance matchers together reproduce
            # the aggregate's own selector, so the suppression cannot outrun it.
            - source_matchers:
                - alertname="ExternalIngressDown"
              target_matchers:
                - alertname="EndpointDown"
                - instance=~"https://.*\\.ericsweiss\\.com"
                - instance!~"https://(git|registry\\.git|pages\\.git|auth|photos)\\.ericsweiss\\.com"
            # CRITICAL: `equal: [namespace]` is load-bearing — without it one
            # namespace's info condition suppresses every info alert in the cluster.
            # The exempted names must still reach Discord: one drops the namespace
            # label, and the other two fire in namespaces that are otherwise healthy.
            # Each must resolve to a rule or upstream_alerts; unmatched is inert.
            - source_matchers:
                - alertname="InfoInhibitor"
              target_matchers:
                - severity="info"
                - alertname!~"AlertmanagerNotificationsDropping|SwapCleanStoppedGuests|VPARecommendationExceedsRequest"
              equal:
                - namespace
            # CRITICAL: node-outage storm control mutes per-pod and per-workload
            # warnings CLUSTER-WIDE while a node is down; these alertnames carry
            # no node label, so no `equal:` scoping is possible. Bounded at 7d by
            # NodeOutageStormControl, and no critical is on the list.
            - source_matchers:
                - alertname="NodeOutageStormControl"
              target_matchers:
                - alertname=~"KubePodNotReady|KubeContainerWaiting|KubeDaemonSetRolloutStuck|KubeDaemonSetMisScheduled|KubeDeploymentReplicasMismatch|KubeStatefulSetReplicasMismatch|KubeAggregatedAPIDown|NodeSystemSaturation|HindsightDown|RegistryCacheDown|TailscaleProxyDown|GitLabAgentDown|AuthentikWorkerDown"

            # Backup-tier escalations: each critical sibling silences the warning it
            # escalates so a multi-day failure pages once, not twice.
            - source_matchers:
                - alertname="ArchiveBackupFailedProlonged"
              target_matchers:
                - alertname="ArchiveBackupFailed"
              equal:
                - instance
            - source_matchers:
                - alertname="ArchiveBackupStaleCritical"
              target_matchers:
                - alertname="ArchiveBackupStale"
              equal:
                - instance
            - source_matchers:
                - alertname="ResticOffsiteFailedProlonged"
              target_matchers:
                - alertname="ResticOffsiteFailed"
              equal:
                - instance
            - source_matchers:
                - alertname="ResticOffsiteStaleCritical"
              target_matchers:
                - alertname="ResticOffsiteStale"
              equal:
                - instance
            - source_matchers:
                - alertname="ResticOffsiteVerifyStaleCritical"
              target_matchers:
                - alertname="ResticOffsiteVerifyStale"
              equal:
                - instance
            - source_matchers:
                - alertname="ResticOffsiteIncompleteProlonged"
              target_matchers:
                - alertname="ResticOffsiteIncomplete"
              equal:
                - instance
            - source_matchers:
                - alertname="VzdumpBackupStaleCritical"
              target_matchers:
                - alertname="VzdumpBackupStale"
              equal:
                - instance
            # BackupArtifactStale is per-app on one host, so the pair must key on
            # app as well as instance.
            - source_matchers:
                - alertname="BackupArtifactStaleCritical"
              target_matchers:
                - alertname="BackupArtifactStale"
              equal:
                - instance
                - app
            - source_matchers:
                - alertname="CertRenewalFailedProlonged"
              target_matchers:
                - alertname="CertRenewalFailed"
              equal:
                - instance

          route:
            receiver: discord-default
            # instance groups host-level alerts (thermals, ZFS/corosync,
            # node-exporter-host) per host instead of one empty-namespace bucket.
            # Namespaced alerts carrying instance (PVCUsage*, Postgres*) group per target.
            group_by:
              - alertname
              - namespace
              - instance
            group_wait: 30s
            group_interval: 10m
            repeat_interval: 4h
            routes:
              # Dead-man's switch (docs/17). MUST precede the severity=none null
              # route: Watchdog carries severity=none and the other severity=none
              # alerts stay null-routed.
              - receiver: watchdog-heartbeat
                matchers:
                  - alertname="Watchdog"
                group_wait: 0s
                group_interval: 1m
                repeat_interval: 1m
              - receiver: "null"
                matchers:
                  - severity="none"
              # The generated per-host rules fan out to one group per host
              # under the root instance key and the webhook 429s on the burst.
              # The thermal/ZFS/SMART families stay per-instance: own faults.
              - receiver: discord-default
                matchers:
                  - alertname="HostLogShippingStale"
                group_by:
                  - alertname
                group_wait: 60s
                group_interval: 10m
                repeat_interval: 12h
              - receiver: email-and-discord
                matchers:
                  - severity="critical"
              - receiver: discord-default
                matchers:
                  - severity="warning"
                repeat_interval: 12h
              # severity=info is a notice, not a fault; without this branch it
              # would inherit the route's 4h repeat, more often than a warning.
              - receiver: discord-default
                matchers:
                  - severity="info"
                repeat_interval: 24h

          receivers:
            - name: "null"
            # Any POST counts as a ping; send_resolved false because Watchdog
            # never resolves (the DMS pages on silence, not on content).
            - name: watchdog-heartbeat
              webhook_configs:
                - url: {{ .healthchecksPingUrl | quote }}
                  send_resolved: false
                  # Bounds one attempt. Unset, a stalled request consumes the whole
                  # 1m notify window and the ping is dropped instead of retried.
                  timeout: 10s
            - name: discord-default
              discord_configs:
                - webhook_url: {{ .discordWebhookUrl | quote }}
                  send_resolved: true
            - name: email-and-discord
              email_configs:
                - to: "${cluster_alert_email}"
                  send_resolved: true
              discord_configs:
                - webhook_url: {{ .discordWebhookUrl | quote }}
                  send_resolved: true
  data:
    - secretKey: discordWebhookUrl
      remoteRef:
        key: Discord Alert Webhook
        property: url
    # Both halves from the same item, so a relay-user rename is a vault edit.
    - secretKey: smtpUsername
      remoteRef:
        key: SMTP Relay Auth
        property: username
    - secretKey: smtpPassword
      remoteRef:
        key: SMTP Relay Auth
        property: password
    # healthchecks.io ping URL for the Watchdog dead-man's switch (docs/17).
    - secretKey: healthchecksPingUrl
      remoteRef:
        key: Healthchecks Watchdog
        property: ping url
