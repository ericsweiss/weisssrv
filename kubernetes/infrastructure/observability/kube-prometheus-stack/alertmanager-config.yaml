---
# Raw Alertmanager configuration as a Secret.
# Referenced by alertmanagerSpec.configSecret in the HelmRelease values.
# This bypasses both the Prometheus Operator's config schema validation
# and the AlertmanagerConfig CRD (which lacks a status subresource and
# blocks Flux health checks).
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: observability
stringData:
  alertmanager.yaml: |
    global:
      smtp_smarthost: "smtp-relay.esweiss.com:587"
      smtp_from: "Alertmanager <alertmanager@esweiss.com>"
      smtp_require_tls: true
      smtp_auth_username: relayuser
      smtp_auth_password_file: /etc/alertmanager/secrets/observability-secrets/smtp-password

    route:
      receiver: discord-default
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: email-and-discord
          matchers:
            - severity="critical"
        - receiver: discord-default
          matchers:
            - severity="warning"

    receivers:
      - name: discord-default
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/observability-secrets/discord-webhook-url
            send_resolved: true
      - name: email-and-discord
        email_configs:
          - to: "ericsweiss1@gmail.com"
            send_resolved: true
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/observability-secrets/discord-webhook-url
            send_resolved: true
