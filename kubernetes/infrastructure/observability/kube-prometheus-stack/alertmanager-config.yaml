---
# Alertmanager configuration via ExternalSecret template.
# Pulls Discord webhook URL and SMTP password from 1Password and renders
# them into alertmanager.yaml. Uses webhook_url (not webhook_url_file)
# because the Prometheus Operator's config parser does not support the
# _file suffix for discord_configs.
#
# Constraint: secrets injected via template must not contain characters
# that break YAML double-quoted scalars (" or \). The Discord webhook URL
# is a plain HTTPS URL (safe). The SMTP password is operator-controlled —
# avoid " and \ when setting it in 1Password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: alertmanager-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            smtp_smarthost: "smtp-relay.esweiss.com:587"
            smtp_from: "Alertmanager <alertmanager@esweiss.com>"
            smtp_require_tls: true
            smtp_auth_username: relayuser
            smtp_auth_password: "{{ .smtpPassword }}"

          inhibit_rules:
            - source_matchers:
                - severity="critical"
              target_matchers:
                - severity="warning"
              equal:
                - alertname
                - namespace
            # The custom warning/critical pairs use different alertnames
            # (DiskUsageWarning vs DiskUsageCritical, CPUTempWarning vs
            # CPUTempCritical, ...) so the rule above never matches them;
            # pair them on instance+component instead.
            - source_matchers:
                - severity="critical"
                - component=~".+"
              target_matchers:
                - severity="warning"
                - component=~".+"
              equal:
                - instance
                - component
            - source_matchers:
                - alertname="DiskUsageCritical"
              target_matchers:
                - alertname="DiskUsageWarning"
              equal:
                - instance
                - mountpoint
            # Same pattern for the other warning/critical pairs that use
            # distinct alertnames and carry no component label, so neither
            # generic rule above matches them. Pair each on its own identity
            # labels so crossing the critical threshold doesn't page twice.
            - source_matchers:
                - alertname="PVCUsageCritical"
              target_matchers:
                - alertname="PVCUsageWarning"
              equal:
                - namespace
                - persistentvolumeclaim
            - source_matchers:
                - alertname="ZFSPoolSpaceCritical"
              target_matchers:
                - alertname="ZFSPoolSpaceWarning"
              equal:
                - pool
            - source_matchers:
                - alertname="CertExpiringCritical"
              target_matchers:
                - alertname="CertExpiringWarning"
              equal:
                - namespace
                - name
            - source_matchers:
                - alertname="InfoInhibitor"
              target_matchers:
                - severity="info"
            # Node outage storm control: while a node is down, per-pod /
            # per-target warnings are pure noise (2026-06-10 outage produced
            # ~25 distinct warnings and Discord rate-limiting). Tradeoff:
            # an unrelated pod failure elsewhere is also suppressed during
            # the outage window.
            - source_matchers:
                - alertname=~"KubeNodeNotReady|KubeNodeUnreachable"
              target_matchers:
                - alertname=~"KubePodNotReady|KubeContainerWaiting|KubeDaemonSetRolloutStuck|KubeDaemonSetMisScheduled|KubeDeploymentReplicasMismatch|KubeStatefulSetReplicasMismatch|KubeletInstanceUnreachable|TargetDown|EndpointDown"

          route:
            receiver: discord-default
            group_by:
              - alertname
              - namespace
            group_wait: 30s
            group_interval: 10m
            repeat_interval: 4h
            routes:
              - receiver: "null"
                matchers:
                  - severity="none"
              - receiver: email-and-discord
                matchers:
                  - severity="critical"
              - receiver: discord-default
                matchers:
                  - severity="warning"
                repeat_interval: 12h

          receivers:
            - name: "null"
            - name: discord-default
              discord_configs:
                - webhook_url: "{{ .discordWebhookUrl }}"
                  send_resolved: true
            - name: email-and-discord
              email_configs:
                - to: "ericsweiss1@gmail.com"
                  send_resolved: true
              discord_configs:
                - webhook_url: "{{ .discordWebhookUrl }}"
                  send_resolved: true
  data:
    - secretKey: discordWebhookUrl
      remoteRef:
        key: Discord Alert Webhook
        property: url
    - secretKey: smtpPassword
      remoteRef:
        key: SMTP Relay Auth
        property: password
