---
# Alertmanager configuration, rendered from 1Password through an ExternalSecret
# template (Discord webhook, SMTP password, healthchecks.io ping URL).
# webhook_url, not webhook_url_file: the Prometheus Operator's config parser does
# not support the _file suffix for discord_configs. Values go through `quote` so
# a rotated secret with special characters stays valid.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: alertmanager-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            smtp_smarthost: "smtp-relay.esweiss.com:587"
            smtp_from: "Alertmanager <alertmanager@esweiss.com>"
            smtp_require_tls: true
            smtp_auth_username: relayuser
            smtp_auth_password: {{ .smtpPassword | quote }}

          inhibit_rules:
            - source_matchers:
                - severity="critical"
              target_matchers:
                - severity="warning"
              equal:
                - alertname
                - namespace
            # The custom warning/critical pairs use distinct alertnames, so the
            # generic rule above never matches them; each is paired explicitly
            # below on its own identity labels. CPU/GPU/NIC carry one temp alert
            # per host+component, so instance+component dedups cleanly. Storage is
            # excluded here — SATA/NVMe report many drives per host under one
            # component, so that pairing would let one drive's critical silence a
            # different drive's warning. They pair on instance+chip below.
            - source_matchers:
                - severity="critical"
                - component=~"cpu|gpu|network"
              target_matchers:
                - severity="warning"
                - component=~"cpu|gpu|network"
              equal:
                - instance
                - component
            - source_matchers:
                - alertname="SATADriveTempCritical"
              target_matchers:
                - alertname="SATADriveTempWarning"
              equal:
                - instance
                - chip
            - source_matchers:
                - alertname="NVMeDriveTempCritical"
              target_matchers:
                - alertname="NVMeDriveTempWarning"
              equal:
                - instance
                - chip
            - source_matchers:
                - alertname="DiskUsageCritical"
              target_matchers:
                - alertname="DiskUsageWarning"
              equal:
                - instance
                - mountpoint
            - source_matchers:
                - alertname="InodeUsageCritical"
              target_matchers:
                - alertname="InodeUsageWarning"
              equal:
                - instance
                - mountpoint
            # Same pattern for the other warning/critical pairs that use
            # distinct alertnames and carry no component label, so neither
            # generic rule above matches them. Pair each on its own identity
            # labels so crossing the critical threshold doesn't page twice.
            - source_matchers:
                - alertname="PVCUsageCritical"
              target_matchers:
                - alertname="PVCUsageWarning"
              equal:
                - namespace
                - persistentvolumeclaim
            # instance + pool: the space alerts are fed by the per-host
            # textfile collector and all five compute hosts name their pool
            # local-ssd — pool alone would let one host's critical silence
            # another host's warning.
            - source_matchers:
                - alertname="ZFSPoolSpaceCritical"
              target_matchers:
                - alertname="ZFSPoolSpaceWarning"
              equal:
                - instance
                - pool
            - source_matchers:
                - alertname="CertExpiringCritical"
              target_matchers:
                - alertname="CertExpiringWarning"
              equal:
                - namespace
                - name
            # The textfile cert metric carries instance, not namespace/name.
            - source_matchers:
                - alertname="CertExpiringSoonCritical"
              target_matchers:
                - alertname="CertExpiringSoon"
              equal:
                - instance
            - source_matchers:
                - alertname="GitLabBackupStaleCritical"
              target_matchers:
                - alertname="GitLabBackupStale"
              equal:
                - instance
            - source_matchers:
                - alertname="EndpointDownCritical"
              target_matchers:
                - alertname="EndpointDown"
              equal:
                - instance
            # Upstream's InfoInhibitor pairing. `equal: [namespace]` is
            # load-bearing: without it one namespace's info condition suppresses
            # every info alert in the cluster, including the non-namespaced
            # host-level ones.
            - source_matchers:
                - alertname="InfoInhibitor"
              target_matchers:
                - severity="info"
              equal:
                - namespace
            # Node-outage storm control: while a node is down, per-pod and
            # per-workload warnings are noise. The source is deliberately
            # NodeOutageStormControl, not KubeNodeNotReady — it stops firing
            # after 6h, so a multi-day outage cannot silently suppress the whole
            # cluster (rules/monitoring.yaml). Nothing critical is inhibited, and
            # neither are EndpointDown/TargetDown, which cover off-cluster infra
            # whose health is independent of k3s node readiness.
            #
            # Every name here must resolve to a rule in observability/rules/ or
            # to scripts/check-alertmanager-behaviour.py's UPSTREAM_ALERTS —
            # an unmatched member of an alternation is an inert matcher that
            # nothing surfaces at runtime. KubeletInstanceUnreachable was one:
            # it matches no chart rule (upstream ships KubeNodeUnreachable /
            # KubeletDown / KubeNodeNotReady, all node-level truths that must
            # stay visible during an outage), so it was dropped rather than
            # remapped.
            - source_matchers:
                - alertname="NodeOutageStormControl"
              target_matchers:
                - alertname=~"KubePodNotReady|KubeContainerWaiting|KubeDaemonSetRolloutStuck|KubeDaemonSetMisScheduled|KubeDeploymentReplicasMismatch|KubeStatefulSetReplicasMismatch|KubeAggregatedAPIDown|NodeSystemSaturation|HindsightDown|RegistryCacheDown|TailscaleProxyDown|GitLabAgentDown|AuthentikWorkerDown"

            # The warning-tier custom *Down alerts are on the target list too:
            # they are deployment/statefulset-availability rules, so a node
            # outage is exactly what makes them noise. Nothing critical is
            # inhibited here.
            #
            # Backup-tier escalations: each critical sibling silences the warning
            # it escalates so a multi-day failure pages once, not twice.
            - source_matchers:
                - alertname="ArchiveBackupFailedProlonged"
              target_matchers:
                - alertname="ArchiveBackupFailed"
              equal:
                - instance
            - source_matchers:
                - alertname="ArchiveBackupStaleCritical"
              target_matchers:
                - alertname="ArchiveBackupStale"
              equal:
                - instance
            - source_matchers:
                - alertname="ResticOffsiteFailedProlonged"
              target_matchers:
                - alertname="ResticOffsiteFailed"
              equal:
                - instance
            - source_matchers:
                - alertname="ResticOffsiteStaleCritical"
              target_matchers:
                - alertname="ResticOffsiteStale"
              equal:
                - instance
            - source_matchers:
                - alertname="ResticOffsiteVerifyStaleCritical"
              target_matchers:
                - alertname="ResticOffsiteVerifyStale"
              equal:
                - instance
            - source_matchers:
                - alertname="VzdumpBackupStaleCritical"
              target_matchers:
                - alertname="VzdumpBackupStale"
              equal:
                - instance
            # BackupArtifactStale is per-app on one host, so the pair must key on
            # app as well as instance.
            - source_matchers:
                - alertname="BackupArtifactStaleCritical"
              target_matchers:
                - alertname="BackupArtifactStale"
              equal:
                - instance
                - app
            - source_matchers:
                - alertname="CertRenewalFailedProlonged"
              target_matchers:
                - alertname="CertRenewalFailed"
              equal:
                - instance

          route:
            receiver: discord-default
            # instance is included so host-level (non-namespaced) alerts —
            # thermals, ZFS/corosync, node-exporter-host — group per-host
            # instead of collapsing under one empty-namespace bucket.
            # Namespaced cluster alerts (which carry no instance label) still
            # group on alertname+namespace as before.
            group_by:
              - alertname
              - namespace
              - instance
            group_wait: 30s
            group_interval: 10m
            repeat_interval: 4h
            routes:
              # Dead-man's switch (docs/17): Watchdog always fires, so
              # healthchecks.io alarms when the pings STOP — the only signal that
              # survives a total observability-plane outage. MUST precede the
              # severity=none null route: Watchdog carries severity=none, and the
              # other severity=none alerts (InfoInhibitor, NodeOutageStormControl)
              # must stay null-routed.
              - receiver: watchdog-heartbeat
                matchers:
                  - alertname="Watchdog"
                group_wait: 0s
                group_interval: 1m
                repeat_interval: 1m
              - receiver: "null"
                matchers:
                  - severity="none"
              - receiver: email-and-discord
                matchers:
                  - severity="critical"
              - receiver: discord-default
                matchers:
                  - severity="warning"
                repeat_interval: 12h
              # severity=info is a notice, not a fault (e.g.
              # SwapCleanStoppedGuests). Without this branch it would inherit the
              # route's 4h repeat — more often than a warning.
              - receiver: discord-default
                matchers:
                  - severity="info"
                repeat_interval: 24h

          receivers:
            - name: "null"
            # Any POST counts as a ping; send_resolved false because Watchdog
            # never resolves (the DMS pages on silence, not on content).
            - name: watchdog-heartbeat
              webhook_configs:
                - url: {{ .healthchecksPingUrl | quote }}
                  send_resolved: false
            - name: discord-default
              discord_configs:
                - webhook_url: {{ .discordWebhookUrl | quote }}
                  send_resolved: true
            - name: email-and-discord
              email_configs:
                - to: "ericsweiss1@gmail.com"
                  send_resolved: true
              discord_configs:
                - webhook_url: {{ .discordWebhookUrl | quote }}
                  send_resolved: true
  data:
    - secretKey: discordWebhookUrl
      remoteRef:
        key: Discord Alert Webhook
        property: url
    - secretKey: smtpPassword
      remoteRef:
        key: SMTP Relay Auth
        property: password
    # healthchecks.io ping URL for the Watchdog dead-man's switch (docs/17).
    - secretKey: healthchecksPingUrl
      remoteRef:
        key: Healthchecks Watchdog
        property: ping url
