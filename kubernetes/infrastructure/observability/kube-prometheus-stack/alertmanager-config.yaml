---
# Alertmanager configuration via ExternalSecret template.
# Pulls the Discord webhook URL, SMTP password, and healthchecks.io ping
# URL from 1Password and renders them into alertmanager.yaml. Uses
# webhook_url (not webhook_url_file) because the Prometheus Operator's
# config parser does not support the _file suffix for discord_configs.
# Secret values are rendered through the `quote` template function so a
# rotated password or webhook URL with any special characters stays valid.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: alertmanager-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            smtp_smarthost: "smtp-relay.esweiss.com:587"
            smtp_from: "Alertmanager <alertmanager@esweiss.com>"
            smtp_require_tls: true
            smtp_auth_username: relayuser
            smtp_auth_password: {{ .smtpPassword | quote }}

          inhibit_rules:
            - source_matchers:
                - severity="critical"
              target_matchers:
                - severity="warning"
              equal:
                - alertname
                - namespace
            # The custom warning/critical pairs use different alertnames
            # (DiskUsageWarning vs DiskUsageCritical, CPUTempWarning vs
            # CPUTempCritical, ...) so the rule above never matches them.
            # CPU/GPU/NIC carry one temp alert per host+component, so pairing
            # on instance+component dedups warning->critical cleanly. Storage
            # is deliberately excluded here: SATA/NVMe report many drives per
            # host (all component=storage), and equal:[instance,component]
            # would let one drive crossing critical silence a *different*
            # drive's warning on the same host. The per-device storage pairs
            # below key on instance+chip instead.
            - source_matchers:
                - severity="critical"
                - component=~"cpu|gpu|network"
              target_matchers:
                - severity="warning"
                - component=~"cpu|gpu|network"
              equal:
                - instance
                - component
            - source_matchers:
                - alertname="SATADriveTempCritical"
              target_matchers:
                - alertname="SATADriveTempWarning"
              equal:
                - instance
                - chip
            - source_matchers:
                - alertname="NVMeDriveTempCritical"
              target_matchers:
                - alertname="NVMeDriveTempWarning"
              equal:
                - instance
                - chip
            - source_matchers:
                - alertname="DiskUsageCritical"
              target_matchers:
                - alertname="DiskUsageWarning"
              equal:
                - instance
                - mountpoint
            - source_matchers:
                - alertname="InodeUsageCritical"
              target_matchers:
                - alertname="InodeUsageWarning"
              equal:
                - instance
                - mountpoint
            # Same pattern for the other warning/critical pairs that use
            # distinct alertnames and carry no component label, so neither
            # generic rule above matches them. Pair each on its own identity
            # labels so crossing the critical threshold doesn't page twice.
            - source_matchers:
                - alertname="PVCUsageCritical"
              target_matchers:
                - alertname="PVCUsageWarning"
              equal:
                - namespace
                - persistentvolumeclaim
            # instance + pool: the space alerts are fed by the per-host
            # textfile collector and all five compute hosts name their pool
            # local-ssd — pool alone would let one host's critical silence
            # another host's warning.
            - source_matchers:
                - alertname="ZFSPoolSpaceCritical"
              target_matchers:
                - alertname="ZFSPoolSpaceWarning"
              equal:
                - instance
                - pool
            - source_matchers:
                - alertname="CertExpiringCritical"
              target_matchers:
                - alertname="CertExpiringWarning"
              equal:
                - namespace
                - name
            # The textfile cert metric carries instance, not namespace/name.
            - source_matchers:
                - alertname="CertExpiringSoonCritical"
              target_matchers:
                - alertname="CertExpiringSoon"
              equal:
                - instance
            - source_matchers:
                - alertname="GitLabBackupStaleCritical"
              target_matchers:
                - alertname="GitLabBackupStale"
              equal:
                - instance
            - source_matchers:
                - alertname="EndpointDownCritical"
              target_matchers:
                - alertname="EndpointDown"
              equal:
                - instance
            - source_matchers:
                - alertname="InfoInhibitor"
              target_matchers:
                - severity="info"
            # Node outage storm control: while a node is down, per-pod /
            # per-workload warnings are pure noise (2026-06-10 outage produced
            # ~25 distinct warnings and Discord rate-limiting). Tradeoff:
            # an unrelated pod failure elsewhere is also suppressed during
            # the outage window.
            #
            # Deliberately does NOT suppress EndpointDown or TargetDown:
            # EndpointDown (blackbox probe_success) covers OFF-cluster infra
            # (DNS .150/.160, GitLab, Authentik, Plex, Home Assistant) whose
            # health is independent of k3s node readiness — masking it
            # cluster-wide during any node-down window would hide a genuinely
            # down external service. TargetDown likewise spans non-node scrape
            # jobs. BlackboxExporterDown still covers total probe blindness.
            - source_matchers:
                - alertname=~"KubeNodeNotReady|KubeNodeUnreachable"
              target_matchers:
                - alertname=~"KubePodNotReady|KubeContainerWaiting|KubeDaemonSetRolloutStuck|KubeDaemonSetMisScheduled|KubeDeploymentReplicasMismatch|KubeStatefulSetReplicasMismatch|KubeletInstanceUnreachable"

          route:
            receiver: discord-default
            # instance is included so host-level (non-namespaced) alerts —
            # thermals, ZFS/corosync, node-exporter-host — group per-host
            # instead of collapsing under one empty-namespace bucket.
            # Namespaced cluster alerts (which carry no instance label) still
            # group on alertname+namespace as before.
            group_by:
              - alertname
              - namespace
              - instance
            group_wait: 30s
            group_interval: 10m
            repeat_interval: 4h
            routes:
              # Dead-man's switch (docs/17): the chart's Watchdog alert always
              # fires; healthchecks.io alarms when the pings STOP — i.e. when
              # Prometheus, Alertmanager, the NAS node, or notification egress
              # is down. This is the only signal that survives a total
              # observability-plane outage (including both DNS resolvers, on
              # which the SMTP and Discord receivers depend for name
              # resolution). Must precede the severity=none null route:
              # Watchdog carries severity=none, and InfoInhibitor (also
              # severity=none) must stay null-routed.
              - receiver: watchdog-heartbeat
                matchers:
                  - alertname="Watchdog"
                group_wait: 0s
                group_interval: 1m
                repeat_interval: 1m
              - receiver: "null"
                matchers:
                  - severity="none"
              - receiver: email-and-discord
                matchers:
                  - severity="critical"
              - receiver: discord-default
                matchers:
                  - severity="warning"
                repeat_interval: 12h

          receivers:
            - name: "null"
            # Any POST counts as a ping; send_resolved false because Watchdog
            # never resolves (the DMS pages on silence, not on content).
            - name: watchdog-heartbeat
              webhook_configs:
                - url: {{ .healthchecksPingUrl | quote }}
                  send_resolved: false
            - name: discord-default
              discord_configs:
                - webhook_url: {{ .discordWebhookUrl | quote }}
                  send_resolved: true
            - name: email-and-discord
              email_configs:
                - to: "ericsweiss1@gmail.com"
                  send_resolved: true
              discord_configs:
                - webhook_url: {{ .discordWebhookUrl | quote }}
                  send_resolved: true
  data:
    - secretKey: discordWebhookUrl
      remoteRef:
        key: Discord Alert Webhook
        property: url
    - secretKey: smtpPassword
      remoteRef:
        key: SMTP Relay Auth
        property: password
    # healthchecks.io check ping URL for the Watchdog dead-man's switch.
    # Until the 1Password item exists, ESO keeps serving the last rendered
    # Secret and ExternalSecretSyncFailure fires — create the item promptly
    # after merge (docs/15).
    - secretKey: healthchecksPingUrl
      remoteRef:
        key: Healthchecks Watchdog
        property: ping url
