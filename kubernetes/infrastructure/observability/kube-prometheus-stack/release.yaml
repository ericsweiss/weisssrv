---
# kube-prometheus-stack HelmRelease — deploys Prometheus, Grafana, Alertmanager,
# node-exporter, and kube-state-metrics into the observability namespace.
# Chart version substituted from cluster-versions ConfigMap.
# Prometheus pinned to NAS node for local ZFS zvol storage.
# Grafana configured with Authentik OIDC and Loki datasource.
# Alertmanager sends alerts via email (SMTP relay) and Discord webhook.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  releaseName: kube-prometheus-stack
  # CRD installation and Prometheus startup can take several minutes
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "${helm_chart_versions_kube_prometheus_stack}"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # -------------------------------------------------------------------------
    # Prometheus
    # -------------------------------------------------------------------------
    prometheus:
      prometheusSpec:
        # Prometheus runs as nobody (65534); fsGroup ensures the PVC is writable
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534

        # Pin to NAS node for local ZFS zvol storage
        nodeSelector:
          esweiss.com/nas: "true"
        tolerations:
          - key: esweiss.com/nas
            operator: Equal
            value: "true"
            effect: PreferNoSchedule

        # Use existing PVC backed by ZFS zvol on k3s-agt-nas-01
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ""
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 150Gi
              volumeName: prometheus-data

        # Retention
        # retentionSize bounds only persisted block storage; the WAL, the
        # in-memory head being flushed, and compaction scratch consume more
        # on-disk space on top of it. Held to 120GB (vs the 150Gi/~161GB PV)
        # to leave ~40GB headroom for those non-block on-disk costs.
        retention: 365d
        retentionSize: 120GB

        # Discover ServiceMonitors, PodMonitors, and PrometheusRules in ALL namespaces
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleNamespaceSelector: {}

        # Working set runs 2-2.6Gi at 365d retention; request must reflect
        # that for honest scheduling (VPA is Off here — hand-tuned).
        resources:
          requests:
            cpu: 200m
            memory: 2Gi
          limits:
            memory: 4Gi

    # -------------------------------------------------------------------------
    # Alertmanager
    # -------------------------------------------------------------------------
    alertmanager:
      alertmanagerSpec:
        configSecret: alertmanager-config
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi

    # -------------------------------------------------------------------------
    # Grafana
    # -------------------------------------------------------------------------
    grafana:
      # Ingress handled by Traefik IngressRoute
      ingress:
        enabled: false

      grafana.ini:
        server:
          root_url: https://grafana.esweiss.com
        auth:
          disable_login_form: true
        analytics:
          check_for_updates: false
          check_for_plugin_updates: false
          reporting_enabled: false
          feedback_links_enabled: false

      # Static OIDC configuration (Authentik)
      # Access: users in grafana-users group can log in, grafana-admins get Admin role.
      # Create both groups in Authentik and assign users accordingly.
      env:
        GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
        GF_AUTH_GENERIC_OAUTH_NAME: "Authentik"
        GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
        GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
        GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://auth.esweiss.com/application/o/authorize/"
        GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://auth.esweiss.com/application/o/token/"
        GF_AUTH_GENERIC_OAUTH_API_URL: "https://auth.esweiss.com/application/o/userinfo/"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups, 'grafana-admins') && 'Admin' || contains(groups, 'grafana-users') && 'Viewer' || ''"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"

      # Secret OIDC credentials from observability-secrets
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
          secretKeyRef:
            name: observability-secrets
            key: grafana-oidc-client-id
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: observability-secrets
            key: grafana-oidc-client-secret

      # Dashboard sidecar — auto-discovers ConfigMaps with grafana_dashboard label
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
          folderAnnotation: grafana_folder
        datasources:
          # Set fixed UID so custom dashboard JSON can reference "prometheus"
          uid: prometheus

      # Additional datasource: Loki for log queries
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          url: http://loki.observability.svc.cluster.local:3100
          access: proxy
          isDefault: false

      # Persistent storage for Grafana's SQLite DB (service accounts, prefs)
      persistence:
        enabled: true
        type: pvc
        existingClaim: grafana-data

      # Disable init-chown-data — NFS with all_squash maps all operations to
      # 1000:2000 and does not permit chown. Grafana writes succeed because
      # the NFS squash UID matches the directory owner.
      initChownData:
        enabled: false

      # NFS-ESTALE self-heal: grafana-data (/var/lib/grafana) is an NFS-backed
      # PV. After a NAS/NFS reboot the established mount returns stale file
      # handles that grafana does not recover from on its own — the pod had to be
      # manually deleted to remount. Override the grafana subchart's livenessProbe
      # (default httpGet /api/health) with a stat of the NFS mount: it surfaces
      # ESTALE (immediate error) or a hung hard-mount (probe timeout); either
      # fails the probe so kubelet restarts the pod and it remounts. The subchart
      # readinessProbe (httpGet /api/health) is left at its default, so app-health
      # de-rotation is preserved. Conservative timing so a brief NFS blip can't
      # flap-restart. stat needs only search perm on the mount parents, so it
      # works as the grafana user (472) under NFS all_squash.
      #
      # httpGet MUST be explicitly nulled: helm deep-merges these values into
      # the grafana subchart's defaults, whose livenessProbe carries httpGet —
      # without the null the rendered probe has BOTH handlers and the apiserver
      # rejects the Deployment ("may not specify more than 1 handler type").
      # That exact failure blocked the 87.17.0 upgrade for 24h (4 upgrade
      # attempts -> rollback -> HelmRelease Stalled) — kubeconform can't catch
      # it (semantic apiserver validation, not schema), so only a live upgrade
      # surfaces it.
      livenessProbe:
        httpGet: null
        exec:
          command:
            - sh
            - -c
            - stat /var/lib/grafana >/dev/null 2>&1 || exit 1
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3

      # SQLite on NFS cannot tolerate two writers; RollingUpdate would run
      # old+new pods against the same DB during every upgrade.
      # rollingUpdate must be explicitly nulled: the live Deployment
      # carries rollingUpdate defaults from its RollingUpdate days, and
      # a patch that only sets type=Recreate leaves them in place — the
      # API rejects the combination ("rollingUpdate: Forbidden ... when
      # strategy type is 'Recreate'", v106 upgrade failure post-!81).
      deploymentStrategy:
        type: Recreate
        rollingUpdate: null

      # p95 working set ~470Mi — the old 512Mi limit left no headroom.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi

    # -------------------------------------------------------------------------
    # node-exporter
    # -------------------------------------------------------------------------
    nodeExporter:
      enabled: true

    prometheus-node-exporter:
      # Tolerate ALL taints so node-exporter runs on every node in the cluster
      tolerations:
        - operator: Exists
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          # No CPU limit: node-exporter bursts during scrape collection and CFS
          # throttling at 500m was the dominant CPUThrottlingHigh source. Matches
          # the request-only pattern used for the proxmox/adguard/redis exporters.
          # Memory limit kept (OOM is a real failure mode); raised to 128Mi to
          # match the node-exporter VPA maxAllowed. The node-exporter VPA is set
          # to controlledValues: RequestsOnly so it cannot re-impose a CPU limit.
          memory: 128Mi

    # -------------------------------------------------------------------------
    # kube-state-metrics
    # -------------------------------------------------------------------------
    kube-state-metrics:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      # Flux controllers stopped exporting per-resource readiness
      # (gotk_reconcile_condition) — readiness now comes from kube-state-metrics
      # customResourceState, per the flux2-monitoring-example pattern.
      rbac:
        extraRules:
          - apiGroups:
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
            resources:
              - kustomizations
              - helmreleases
            verbs: [list, watch]
          - apiGroups:
              - source.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - helmrepositories
              - helmcharts
            verbs: [list, watch]
          - apiGroups:
              - autoscaling.k8s.io
            resources:
              - verticalpodautoscalers
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux Kustomization readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux HelmRelease readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux GitRepository readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux HelmRepository readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmChart
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux HelmChart readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              # VPA recommendation visibility: the VPA components export no
              # recommendation metrics themselves, so a recommendation clamped
              # at maxAllowed (workload outgrew its ceiling) was auditable only
              # via manual kubectl. Emits one series per container and resource
              # (labels: container, resource, unit; quantities parsed to base
              # units) for both the capped and uncapped recommendation —
              # consumed by the VPARecommendationCapped alert below.
              - groupVersionKind:
                  group: autoscaling.k8s.io
                  version: v1
                  kind: VerticalPodAutoscaler
                metricNamePrefix: vpa
                labelsFromPath:
                  verticalpodautoscaler: [metadata, name]
                  exported_namespace: [metadata, namespace]
                  target_kind: [spec, targetRef, kind]
                  target_name: [spec, targetRef, name]
                # One entry per (metric, resource): valueFrom must resolve to a
                # scalar quantity, so target/uncappedTarget are split into their
                # cpu and memory members. commonLabels carries the resource/unit
                # so the cpu and memory series never collide and the alert's
                # resource/unit annotations are populated.
                metrics:
                  - name: recommendation_target
                    # Same metric family as the memory series below: the HELP text must
                    # match (resource/unit labels carry the cpu-cores vs memory-bytes split).
                    help: VPA recommended resource request after minAllowed/maxAllowed capping (see resource/unit labels)
                    commonLabels:
                      resource: cpu
                      unit: core
                    each:
                      type: Gauge
                      gauge:
                        path: [status, recommendation, containerRecommendations]
                        labelsFromPath:
                          container: [containerName]
                        valueFrom: [target, cpu]
                  - name: recommendation_target
                    help: VPA recommended resource request after minAllowed/maxAllowed capping (see resource/unit labels)
                    commonLabels:
                      resource: memory
                      unit: byte
                    each:
                      type: Gauge
                      gauge:
                        path: [status, recommendation, containerRecommendations]
                        labelsFromPath:
                          container: [containerName]
                        valueFrom: [target, memory]
                  - name: recommendation_uncappedtarget
                    # Same metric family as the memory series below — keep HELP identical.
                    help: VPA recommended resource request ignoring minAllowed/maxAllowed (see resource/unit labels)
                    commonLabels:
                      resource: cpu
                      unit: core
                    each:
                      type: Gauge
                      gauge:
                        path: [status, recommendation, containerRecommendations]
                        labelsFromPath:
                          container: [containerName]
                        valueFrom: [uncappedTarget, cpu]
                  - name: recommendation_uncappedtarget
                    help: VPA recommended resource request ignoring minAllowed/maxAllowed (see resource/unit labels)
                    commonLabels:
                      resource: memory
                      unit: byte
                    each:
                      type: Gauge
                      gauge:
                        path: [status, recommendation, containerRecommendations]
                        labelsFromPath:
                          container: [containerName]
                        valueFrom: [uncappedTarget, memory]

    # -------------------------------------------------------------------------
    # Disable components not present in k3s
    # -------------------------------------------------------------------------
    # k3s bundles kube-scheduler and kube-controller-manager into the server
    # process without separate metrics endpoints. kube-proxy is embedded in
    # the k3s binary without a standalone metrics endpoint. Disabling prevents
    # false-positive *Down critical alerts and removes dashboards that always
    # show "No data".
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    # k3s embeds etcd but does expose its metrics: the server nodes run with
    # etcd-expose-metrics: true (ansible/roles/k3s), which serves the standard
    # etcd metrics on :2381 over plain HTTP. The chart builds a Service with
    # explicit Endpoints from the server-node IPs; enabling this also
    # re-enables the upstream etcd alert rules (quorum, leader flapping, DB
    # size) which are gated on kubeEtcd.enabled. Port 2381 is restricted to
    # k3s_nodes by the Proxmox firewall (docs/11).
    kubeEtcd:
      enabled: true
      endpoints:
        - 192.168.0.222
        - 192.168.0.223
        - 192.168.0.227
      service:
        enabled: true
        port: 2381
        targetPort: 2381
      serviceMonitor:
        enabled: true
        scheme: http

    # -------------------------------------------------------------------------
    # Upstream default-rule overrides
    # -------------------------------------------------------------------------
    defaultRules:
      disabled:
        # KubeCPUOvercommit fires transiently on every heavy privileged-CI
        # burst: the gitlab-runner-privileged ResourceQuota deliberately
        # over-requests CPU (by-design burst scheduling), which trips the
        # upstream "cluster can't tolerate one node failure" check for the
        # 15-30m a burst runs. The ResourceQuota is correctly sized, so the
        # right fix is a tuned copy — re-added under homelab-kubernetes-resources
        # below — that subtracts the gitlab-runner* namespaces' requests so only
        # genuine steady-state overcommit alerts. 15m for: was too short to ride
        # out the flap; excluding the CI namespaces removes the flap at source.
        KubeCPUOvercommit: true

    # -------------------------------------------------------------------------
    # Custom alert rules
    # -------------------------------------------------------------------------
    # Every custom alert below carries a runbook_url annotation pointing at the
    # canonical runbook doc (docs/12-runbooks.md) — a section anchor where one
    # maps cleanly, otherwise the doc root. Upstream chart-shipped rules are
    # intentionally not annotated here.
    additionalPrometheusRulesMap:
      homelab-storage:
        groups:
          - name: homelab.storage
            rules:
              # efivarfs is the kernel's NVRAM-backed virtual fs at
              # /sys/firmware/efi/efivars; it commonly sits above 70% (filled
              # with EFI variables) and isn't a real disk-usage signal.
              # devtmpfs/iso9660 are also virtual / read-only.
              - alert: DiskUsageWarning
                expr: >-
                  (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"}
                  / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"})
                  * 100 > 80
                for: 10m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'Disk usage above 80% on {{ $labels.instance }}:{{ $labels.mountpoint }}'
                  description: >-
                    Disk usage is {{ $value | printf "%.1f" }}%
                    on {{ $labels.instance }}
                    mount {{ $labels.mountpoint }}.

              - alert: DiskUsageCritical
                expr: >-
                  (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"}
                  / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"})
                  * 100 > 90
                for: 5m
                labels:
                  severity: critical
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'Disk usage above 90% on {{ $labels.instance }}:{{ $labels.mountpoint }}'
                  description: >-
                    Disk usage is {{ $value | printf "%.1f" }}%
                    on {{ $labels.instance }}
                    mount {{ $labels.mountpoint }}.

              - alert: PVCUsageWarning
                expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 80
                for: 10m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} above 80%'
                  description: 'PVC usage is {{ $value | printf "%.1f" }}%.'

              - alert: PVCUsageCritical
                expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 90
                for: 5m
                labels:
                  severity: critical
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} above 90%'
                  description: 'PVC usage is {{ $value | printf "%.1f" }}%.'

              # Inode exhaustion: byte-usage rules above miss a filesystem that
              # fills its inode table (many tiny files) while still having free
              # bytes. The chart's default NodeFilesystemAlmostOutOfFiles only
              # covers the in-cluster node-exporter; this fires across both that
              # job and the bare-metal node-exporter-host job (port 9101) so a
              # Proxmox host root running out of inodes is caught too.
              - alert: InodeUsageWarning
                expr: >-
                  (node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"}
                  / node_filesystem_files{fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"})
                  * 100 < 10
                for: 10m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'Inodes below 10% free on {{ $labels.instance }}:{{ $labels.mountpoint }}'
                  description: >-
                    Only {{ $value | printf "%.1f" }}% of inodes are free
                    on {{ $labels.instance }}
                    mount {{ $labels.mountpoint }}.

              - alert: InodeUsageCritical
                expr: >-
                  (node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"}
                  / node_filesystem_files{fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"})
                  * 100 < 5
                for: 5m
                labels:
                  severity: critical
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'Inodes below 5% free on {{ $labels.instance }}:{{ $labels.mountpoint }}'
                  description: >-
                    Only {{ $value | printf "%.1f" }}% of inodes are free
                    on {{ $labels.instance }}
                    mount {{ $labels.mountpoint }}.

              # Per-device SMART health, fed by the smartmon textfile collector
              # (node_exporter_host role, every 5m). Complements the ZFS pool
              # alerts: those catch corruption after it reaches a pool, these
              # catch the drive-level precursors (SMART FAIL, growing bad
              # sectors, NVMe media errors) and attribute them to a serial.
              #
              # Standby tolerance: `smartctl -n standby` never wakes a sleeping
              # drive, so a drive in standby emits only smartmon_device_active=0
              # and its attribute series go absent for that cycle. Every rule
              # below reads through an over_time window so an absent-while-asleep
              # series neither false-fires nor prematurely resolves a confirmed
              # bad reading (finding 497).
              - alert: SMARTDeviceUnhealthy
                # min_over_time stays 0 once a drive has reported FAILED, riding
                # through subsequent standby gaps; a healthy (1) or never-probed
                # (absent) drive never trips it.
                expr: min_over_time(smartmon_device_smart_healthy[6h]) == 0
                for: 15m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#handling-disk-failure-zfs'
                  summary: 'SMART overall-health FAILED on {{ $labels.device }} ({{ $labels.instance }})'
                  description: >-
                    smartmon_device_smart_healthy for {{ $labels.device }} on
                    {{ $labels.instance }} has reported FAILED within the last
                    6 hours. The drive's own SMART self-assessment predicts
                    imminent failure — plan replacement and check the ZFS pool
                    it backs.

              # Reallocated sectors: a stable nonzero count from a years-old
              # event is not actionable, but growth means active surface
              # degradation. max-min over 24h detects an increase while
              # tolerating standby gaps (both ends computed over samples that
              # actually exist in the window).
              - alert: SMARTReallocatedSectorsGrowing
                expr: >-
                  max_over_time(smartmon_reallocated_sector_count[24h])
                  - min_over_time(smartmon_reallocated_sector_count[24h]) > 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#handling-disk-failure-zfs'
                  summary: 'Reallocated sectors growing on {{ $labels.device }} ({{ $labels.instance }})'
                  description: >-
                    Reallocated_Sector_Ct on {{ $labels.device }} on
                    {{ $labels.instance }} grew by
                    {{ $value | printf "%.0f" }} in the last 24 hours. A drive
                    actively remapping sectors is degrading — watch it closely
                    and plan replacement.

              # Pending / offline-uncorrectable sectors are acute: any nonzero
              # value is a sector currently unreadable or awaiting reallocation,
              # not a healed-over historical event. max_over_time bridges standby.
              - alert: SMARTPendingSectors
                expr: max_over_time(smartmon_current_pending_sector_count[6h]) > 0
                for: 15m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#handling-disk-failure-zfs'
                  summary: 'Current pending sectors on {{ $labels.device }} ({{ $labels.instance }})'
                  description: >-
                    Current_Pending_Sector on {{ $labels.device }} on
                    {{ $labels.instance }} is {{ $value | printf "%.0f" }} —
                    sectors are unreadable and awaiting reallocation. A scrub
                    of the backing pool will surface any affected data.

              - alert: SMARTOfflineUncorrectable
                expr: max_over_time(smartmon_offline_uncorrectable_count[6h]) > 0
                for: 15m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#handling-disk-failure-zfs'
                  summary: 'Offline-uncorrectable sectors on {{ $labels.device }} ({{ $labels.instance }})'
                  description: >-
                    Offline_Uncorrectable on {{ $labels.device }} on
                    {{ $labels.instance }} is {{ $value | printf "%.0f" }} —
                    sectors that could not be corrected on read. Strong
                    replace-soon signal.

              # NVMe media & data-integrity errors — the SSD-side equivalent of
              # reallocated/uncorrectable sectors. Any nonzero is worth a look.
              - alert: SMARTMediaErrors
                expr: max_over_time(smartmon_media_errors_count[6h]) > 0
                for: 15m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#handling-disk-failure-zfs'
                  summary: 'NVMe media errors on {{ $labels.device }} ({{ $labels.instance }})'
                  description: >-
                    Media and Data Integrity Errors on {{ $labels.device }} on
                    {{ $labels.instance }} is {{ $value | printf "%.0f" }}. The
                    NVMe controller has logged uncorrectable data errors —
                    investigate and plan replacement.

              # Collector meta-failure: the smartmon script ran but is stuck, or
              # was never deployed on a host. Mirrors ZFSPoolCollectorStale /
              # CorosyncHealthCollectorStale — the absent() arm makes an
              # undeployed collector loud instead of silently blind.
              - alert: SMARTCollectorStale
                expr: >-
                  (time() - smartmon_collector_last_success_seconds > 900)
                  or absent(smartmon_collector_last_success_seconds)
                for: 5m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#handling-disk-failure-zfs'
                  summary: 'smartmon collector is degraded or missing on {{ $labels.instance }}'
                  description: >-
                    smartmon_collector_last_success_seconds is stale (>15m) or
                    entirely absent — the SMART device alerts on this host are
                    serving stale or no inputs. Check
                    `journalctl -u smartmon-collector.service` and
                    `systemctl status smartmon-collector.timer`.

      homelab-infrastructure:
        groups:
          - name: homelab.infrastructure
            rules:
              # VPN health for the Gluetun-fronted qbittorrent pod. The
              # gluetun-exporter sidecar (downloads/qbittorrent.yaml) emits
              # gluetun_vpn_status: 1 = running, 0 = stopped/unreachable,
              # -1 = error, -2 = unknown. !=1 covers every non-healthy state.
              #
              # Only qbittorrent carries the exporter (VPN-always-on); nzbget
              # ships VPN-off and emits no series, so this can't false-fire on
              # its direct mode. 15m comfortably exceeds a Recreate rollout +
              # OpenVPN reconnect (~2-3m), so normal restarts stay quiet.
              - alert: VPNDown
                # Scoped to the downloads namespace (the only place the
                # gluetun-exporter runs) so a future gluetun_vpn_status series
                # elsewhere can't trigger this download-stack alert.
                expr: gluetun_vpn_status{namespace="downloads"} != 1
                for: 15m
                labels:
                  severity: critical
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'Gluetun VPN unhealthy on {{ $labels.pod }}'
                  description: >-
                    gluetun_vpn_status is {{ $value }} (1 = running) on
                    {{ $labels.pod }} for 15m. The download client is
                    killswitched — no egress until the VPN reconnects.

              # Exporter/pod gone entirely (metric absent, not non-1) -> VPN
              # state unknown. Warning not critical: the killswitch blocks egress
              # while the tunnel is down, so this is "blind" not "leaking"
              # (VPNDown covers a confirmed-unhealthy tunnel).
              - alert: VPNExporterDown
                # Namespace-scoped so a gluetun_vpn_status series in another
                # namespace can't mask qbittorrent's exporter being gone.
                expr: absent(gluetun_vpn_status{namespace="downloads"})
                for: 15m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'Gluetun VPN-health metric missing for qbittorrent'
                  description: >-
                    No gluetun_vpn_status series for 15m — the qbittorrent pod
                    or its gluetun-exporter sidecar may be down. VPN state is
                    unknown, but the killswitch still blocks egress while the
                    tunnel is down; investigate when convenient.

              # wg-easy internet-exit VPN (kubernetes/apps/wg-easy). Keyed on
              # kube-state-metrics deployment availability, NOT the app's own
              # /metrics scrape: wg-easy only serves Prometheus metrics after a
              # one-time UI enablement (Admin Panel > General + Bearer token), so
              # a metrics-based `up==0` would false-fire until then. Deployment
              # availability is true from first reconcile. The `or absent(...)`
              # arm (same pattern as OnePasswordConnectDown) keeps the page
              # covering the outage if the series itself vanishes — deployment
              # pruned/renamed or kube-state-metrics down — instead of silently
              # never evaluating. 15m rides out a Recreate rollout. When the pod
              # is down, the VPN endpoint is dead (no client can connect) — page
              # it. Blackbox EndpointDown (vpn.esweiss.com) covers the UI/ingress
              # path separately.
              - alert: WgEasyDown
                expr: >-
                  kube_deployment_status_replicas_available{namespace="wg-easy", deployment="wg-easy"} == 0
                  or absent(kube_deployment_status_replicas_available{namespace="wg-easy", deployment="wg-easy"})
                for: 15m
                labels:
                  severity: critical
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/38-wireguard-vpn.md'
                  summary: 'wg-easy VPN has no available replica'
                  description: >-
                    The wg-easy Deployment has 0 available replicas for 15m — the
                    WireGuard internet-exit VPN endpoint is down and no client can
                    connect. See docs/38-wireguard-vpn.md.

              # Loki is a single-replica RF=1 SPOF pinned to the NAS (accepted
              # homelab tradeoff); senders do not buffer, so silent ingestion
              # breakage loses logs without surfacing. This catches a sustained
              # 5xx rate on Loki's HTTP API (push/query) so the breakage pages.
              - alert: LokiRequestFailures
                expr: >-
                  sum(rate(loki_request_duration_seconds_count{status_code=~"5..",
                  job="observability/loki"}[5m]))
                  /
                  sum(rate(loki_request_duration_seconds_count{job="observability/loki"}[5m]))
                  > 0.05
                  and sum(rate(loki_request_duration_seconds_count{job="observability/loki"}[5m])) > 0
                for: 15m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'Loki is returning 5xx on more than 5% of requests'
                  # $value is a 0-1 ratio; humanizePercentage emits the % sign.
                  description: >-
                    Loki is serving HTTP 5xx on
                    {{ $value | humanizePercentage }} of requests over the last
                    5 minutes (push/query). Log ingestion may be silently
                    failing — senders do not buffer.

              # 429 rate-limit drops (sender exceeds loki limits_config caps) take
              # a 2xx/4xx path, so LokiRequestFailures (5xx) misses them. Senders
              # don't buffer (RF=1), so dropped samples are lost — alert on a
              # sustained discard rate.
              - alert: LokiIngestionRateLimited
                expr: >-
                  sum by (reason) (rate(loki_discarded_samples_total{job="observability/loki"}[5m])) > 0
                for: 15m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'Loki is discarding samples ({{ $labels.reason }})'
                  description: >-
                    Loki has been discarding incoming samples at
                    {{ $value | printf "%.1f" }}/s for 15 minutes
                    (reason: {{ $labels.reason }}) — typically a 429
                    ingestion / per-stream rate-limit. Those log lines are
                    lost (RF=1, senders do not buffer). Raise the
                    limits_config caps in loki/release.yaml or find the
                    runaway log source.

              - alert: FluxReconciliationFailure
                expr: sum by (controller) (rate(controller_runtime_reconcile_errors_total{job="observability/flux-system"}[5m])) > 0
                for: 15m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'Flux controller {{ $labels.controller }} has reconciliation errors'
                  description: >-
                    Flux controller {{ $labels.controller }}
                    has been producing reconciliation errors
                    at {{ $value | printf "%.2f" }} errors/s for 15 minutes.

              # Catches the class of failure where a HelmRelease/Kustomization
              # is durably not Ready (e.g. InvalidChartReference from a stale
              # chart cache, missing CRD, failing values-render). Complements
              # FluxReconciliationFailure which fires on error-rate; this fires
              # on durable Ready=False regardless of error rate.
              - alert: FluxResourceNotReady
                # gotk_resource_info comes from kube-state-metrics
                # customResourceState (the controllers no longer export
                # per-resource readiness themselves).
                expr: gotk_resource_info{ready="False", suspended!="true"} == 1
                for: 15m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: >-
                    Flux resource {{ $labels.customresource_kind }}/{{ $labels.exported_namespace }}/{{ $labels.name }}
                    not Ready
                  description: >-
                    Flux resource {{ $labels.customresource_kind }}
                    {{ $labels.exported_namespace }}/{{ $labels.name }}
                    has had Ready=False for 15 minutes. Run
                    `flux get all -A | grep -v True` and
                    `kubectl describe {{ $labels.customresource_kind }} {{ $labels.name }}
                    -n {{ $labels.exported_namespace }}` to investigate.

              - alert: OnePasswordConnectDown
                expr: >-
                  kube_deployment_status_replicas_available{namespace="external-secrets", deployment="onepassword-connect"} == 0
                  or absent(kube_deployment_status_replicas_available{namespace="external-secrets", deployment="onepassword-connect"})
                for: 5m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: '1Password Connect has no available replicas'
                  description: >-
                    1Password Connect deployment in external-secrets namespace
                    has had 0 available replicas for 5 minutes (or the metric
                    is absent, indicating kube-state-metrics is also down).
                    Connect is the secrets backend for all ExternalSecrets in the cluster —
                    no new secrets can be created or rotated until it recovers.

              - alert: ExternalSecretSyncFailure
                expr: externalsecret_status_condition{condition="Ready", status="False"} == 1
                for: 15m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'ExternalSecret {{ $labels.name }} sync failing'
                  description: 'ExternalSecret {{ $labels.name }} in {{ $labels.namespace }} has not synced for 15 minutes.'

              # The cloudflare-ddns CronJob runs every 5m to keep the public-IP
              # A records current. KubeJobFailed catches hard pod failures; this
              # catches the silent case where successful runs stop advancing
              # (token revoked → jobs fail, schedule stuck) so external services
              # don't break unnoticed on the next WAN IP change. (It does not
              # detect an IP that drifted while a run "succeeded" — that needs a
              # blackbox/textfile IP-match probe, not yet deployed.)
              - alert: DDNSStale
                expr: >-
                  (time() - kube_cronjob_status_last_successful_time{namespace="cloudflare-ddns", cronjob="cloudflare-ddns"} > 3600)
                  or absent(kube_cronjob_status_last_successful_time{namespace="cloudflare-ddns", cronjob="cloudflare-ddns"})
                for: 15m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#updating-dns-records'
                  summary: 'Cloudflare DDNS has not had a successful run in over 1 hour'
                  description: >-
                    The cloudflare-ddns CronJob (every 5m) has had no successful
                    completion for more than an hour, or the metric is absent.
                    Public-IP A records (ericsweiss.com, direct/git) may go stale
                    on the next WAN IP change.

              - alert: CertExpiringWarning
                expr: certmanager_certificate_expiration_timestamp_seconds - time() < 86400 * 14
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#certificate-renewal-issues'
                  summary: 'Certificate {{ $labels.name }} expiring in less than 14 days'
                  description: >-
                    Certificate {{ $labels.name }}
                    in {{ $labels.namespace }}
                    expires in {{ $value | humanizeDuration }}.

              - alert: CertExpiringCritical
                expr: certmanager_certificate_expiration_timestamp_seconds - time() < 86400 * 3
                for: 1h
                labels:
                  severity: critical
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#certificate-renewal-issues'
                  summary: 'Certificate {{ $labels.name }} expiring in less than 3 days'
                  description: >-
                    Certificate {{ $labels.name }}
                    in {{ $labels.namespace }}
                    expires in {{ $value | humanizeDuration }}.

              - alert: TraefikHighErrorRate
                expr: >-
                  sum(rate(traefik_service_requests_total{code=~"5.."}[5m]))
                  /
                  sum(rate(traefik_service_requests_total[5m]))
                  > 0.05
                  and sum(rate(traefik_service_requests_total[5m])) > 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'Traefik 5xx error rate above 5%'
                  # $value is a 0-1 ratio; humanizePercentage emits the % sign.
                  description: 'Traefik is returning 5xx errors at {{ $value | humanizePercentage }} over the last 5 minutes.'

              # Fed by the kube-state-metrics customResourceState VPA config
              # above. uncappedTarget above target means the recommendation is
              # clamped at maxAllowed — the workload has outgrown its ceiling.
              # 24h hold: recommendations swing with daily load, so a brief
              # clamp during a burst is expected; a full day clamped is a real
              # capacity signal. Not written as target == spec.maxAllowed:
              # containerPolicies keyed by containerName "*" make that PromQL
              # join unresolvable against per-container recommendations.
              - alert: VPARecommendationCapped
                expr: vpa_recommendation_uncappedtarget > vpa_recommendation_target
                for: 24h
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: >-
                    VPA {{ $labels.exported_namespace }}/{{ $labels.verticalpodautoscaler }}
                    recommendation capped at maxAllowed
                  description: >-
                    The VPA recommendation for container {{ $labels.container }}
                    ({{ $labels.resource }}) in
                    {{ $labels.exported_namespace }}/{{ $labels.verticalpodautoscaler }}
                    has been clamped by maxAllowed for 24 hours — it wants
                    {{ $value }} {{ $labels.unit }} uncapped. Raise the cap in
                    infrastructure/configs/vpa/ or investigate the growth.

      homelab-monitoring:
        groups:
          - name: homelab.monitoring
            rules:
              - alert: ProxmoxHostDown
                expr: >-
                  min by (id) (max_over_time(pve_up{id=~"node/.*"}[5m])) == 0
                  or absent(pve_up{id=~"node/.*"})
                for: 5m
                labels:
                  severity: critical
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'Proxmox host {{ $labels.id }} is down'
                  description: >-
                    Proxmox host {{ $labels.id }} has been unreachable for 5 minutes.
                    If id is empty, the Proxmox exporter itself may be down.

              # ProxmoxHostDown only covers id=~"node/.*", so the HA-managed
              # infra guests are invisible there. A stopped/crashed DNS resolver
              # (lxc/150 dns-01, lxc/160 dns-02), the mail relay (lxc/151
              # smtp-relay), or the Home Assistant VM (qemu/154) is critical —
              # cluster-wide name resolution, alert email egress, and home
              # automation depend on them. HA restarts the guest on another
              # node within a couple of minutes, so the 5m hold avoids paging on
              # a normal failover/migration.
              - alert: HAInfraGuestDown
                expr: max by (id) (pve_up{id=~"lxc/(150|151|160)|qemu/154"}) == 0
                for: 5m
                labels:
                  severity: critical
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'HA infrastructure guest {{ $labels.id }} is stopped'
                  description: >-
                    Proxmox guest {{ $labels.id }} (a DNS resolver, the SMTP
                    relay, or the Home Assistant VM) has reported stopped for 5
                    minutes. HA should have restarted it on another node — if it
                    has not, investigate the guest and its host.

              # nfsd on pve-nas-01 is the single NFS server behind every k3s
              # NFS PV, Grafana's storage, and the HAOS media mount. nfsd
              # stop-hangs are a documented failure mode; a hung/stopped nfsd
              # otherwise only surfaces indirectly as pod I/O errors. Zero
              # kernel nfsd threads means the server is not serving; metric
              # absence means the NAS node-exporter-host itself is dark —
              # both page.
              - alert: NFSServerDown
                expr: >-
                  node_nfsd_server_threads{instance="192.168.0.102:9101"} == 0
                  or absent(node_nfsd_server_threads{instance="192.168.0.102:9101"})
                for: 5m
                labels:
                  severity: critical
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#nfs-server-recovery-pve-nas-01'
                  summary: 'NFS server on pve-nas-01 is not serving'
                  description: >-
                    node_nfsd_server_threads on 192.168.0.102 has been 0 (or
                    absent) for 5 minutes — all NFS-backed storage (k3s PVs,
                    Grafana, HAOS media) is stalled. Check
                    `systemctl status nfs-server` on pve-nas-01; after a
                    stop-hang, `systemctl reset-failed nfs-server` then start
                    it. Pods with established mounts may need deleting after
                    recovery (stale handles).

              # A k3s node left unschedulable (Ready,SchedulingDisabled) long after
              # a reboot — a kured uncordon failure (kubereboot/kured #955) or a
              # drain that timed out with forceReboot:false — is invisible to
              # KubeNodeNotReady (the node is Ready). 30m is well past a normal
              # kured cycle (~5m) or op-3 cordon (~2m), so this only fires on a
              # genuinely stuck cordon.
              - alert: NodeStuckCordoned
                expr: kube_node_spec_unschedulable == 1
                for: 30m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'Node {{ $labels.node }} cordoned (unschedulable) for 30m'
                  description: >-
                    Node {{ $labels.node }} has been SchedulingDisabled for 30
                    minutes. If maintenance is not in progress, suspect a stuck
                    kured uncordon or a timed-out drain — investigate, then
                    `kubectl uncordon {{ $labels.node }}`.

              # _reboot-if-needed.yml writes the maintenance_reboot_deferred
              # node_exporter textfile metric when it DEFERS a host reboot to an
              # operator (pve-nas-01's encrypted pools, an etcd-server host running
              # the CI executor, or a fail-closed detection). It self-clears once
              # the host no longer needs a reboot.
              - alert: MaintenanceRebootDeferred
                expr: maintenance_reboot_deferred == 1
                for: 10m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'Host {{ $labels.host }} has a maintenance-deferred reboot pending'
                  description: >-
                    Maintenance deferred a kernel reboot of {{ $labels.host }} to an
                    operator. Reboot it manually when convenient (unlock ZFS keys +
                    start its VMs after, for pve-nas-01); the alert clears on the
                    next run once the host no longer needs a reboot.

              # corosync CPU wedge — incident 2026-05-09: corosync PID stuck at
              # ~99% CPU on pve-nas-01, process alive (so ProxmoxHostDown stayed
              # green and the systemd unit stayed "active") but pmxcfs frozen.
              # Caught by the textfile metric written by
              # ansible/roles/node_exporter_host/files/corosync-health-collector.sh.
              # Normal corosync CPU is 1-2%; brief spikes during membership
              # changes are bounded well below 10m.
              - alert: CorosyncWedged
                expr: avg_over_time(proxmox_corosync_cpu_percent[10m]) > 90
                for: 5m
                labels:
                  severity: critical
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'corosync stuck at high CPU on {{ $labels.instance }}'
                  description: >-
                    corosync on {{ $labels.instance }}
                    has averaged
                    {{ $value | printf "%.1f" }}%
                    CPU over the last 10 minutes. Likely wedged
                    — pmxcfs replication has probably stopped on this node.
                    Mitigation: `systemctl restart corosync` on that host;
                    check `journalctl -u corosync` for the last log line
                    before the silence to file an upstream bug.

              # pmxcfs split-brain — detected via age of
              # /etc/pve/ha/manager_status, which the HA CRM master rewrites
              # every few seconds. A 10-minute-old file on any node means
              # either HA itself is fully broken cluster-wide (catastrophic,
              # but bounded by HostDown alerts) OR this specific node has
              # stopped receiving pmxcfs updates (silent split-brain). Same
              # textfile source as CorosyncWedged above; we use a long
              # threshold (10m) because legitimate idle updates aren't
              # strictly per-second.
              #
              # A deleted manager_status file shows up as mtime=0, which
              # `time() - 0` evaluates as huge → alert fires. That's the
              # desired behavior: the only legitimate way to see mtime=0 on
              # our cluster is HA being intentionally disabled on the host
              # (in which case the operator silences). A previous version of
              # this rule guarded `> 0` to skip such hosts, but that meant a
              # deliberate or accidental file delete silently suppressed the
              # split-brain signal it was supposed to detect.
              - alert: PmxcfsStale
                expr: >-
                  time() - proxmox_pmxcfs_manager_status_mtime_seconds > 600
                for: 5m
                labels:
                  severity: critical
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'pmxcfs on {{ $labels.instance }} appears stale (split-brain)'
                  description: >-
                    /etc/pve/ha/manager_status on {{ $labels.instance }}
                    has not been updated in
                    {{ $value | humanizeDuration }}.
                    pmxcfs replication has stopped on this node — its
                    view of the cluster is frozen. Compare
                    `sudo cat /etc/pve/ha/manager_status` across nodes
                    to confirm, then `systemctl restart corosync pve-cluster`
                    on the affected node.

              # I/O + memory pressure (PSI) on the bare-metal Proxmox hosts — the
              # gap that let the 2026-07-13 pve-nas-01 freeze go un-alerted. The
              # nightly cluster `all` backup fired on every node at 03:30 and they
              # all wrote to pve-nas-01's tank-proxmox NFS target at once,
              # saturating the (spinning) tank pool (io-PSI 0.47-0.59, load 26);
              # stalled dirty-writeback then stalled memory reclaim and the host
              # wedged in the KVM guest-page-fault path ~6 min later — with ZERO
              # warning, because the stock NodeDiskIOSaturation / NodeMemory*
              # alerts are scoped to the k3s node-exporter job, NOT the bare-metal
              # node-exporter-host (:9101). PSI is the earliest saturation signal
              # we collect. Codified guard for the trigger is bwlimit on the
              # vzdump job (host_vars/pve-nas-01.yml). See docs/12-runbooks.md.
              - alert: ProxmoxHostIOPressure
                expr: >-
                  rate(node_pressure_io_waiting_seconds_total{job="node-exporter-host", instance=~"192\\.168\\.0\\.10[2-7]:9101"}[5m]) > 0.20
                for: 5m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'Proxmox host {{ $labels.instance }} is I/O-pressure stalled'
                  description: >-
                    {{ $labels.instance }} has spent
                    {{ $value | humanizePercentage }}
                    of the last 5 minutes with tasks stalled waiting on disk I/O.
                    Sustained pool saturation — on pve-nas-01 this precedes a
                    dirty-writeback -> memory-reclaim stall -> whole-host freeze.
                    Find the heavy writer (`iotop`; usually vzdump/scrub) and
                    throttle or reschedule it; bwlimit on the vzdump job is the
                    codified guard.
              - alert: ProxmoxHostMemoryPressure
                expr: >-
                  rate(node_pressure_memory_waiting_seconds_total{job="node-exporter-host", instance=~"192\\.168\\.0\\.10[2-7]:9101"}[5m]) > 0.10
                for: 5m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'Proxmox host {{ $labels.instance }} is under memory-reclaim pressure'
                  description: >-
                    {{ $labels.instance }} has spent
                    {{ $value | humanizePercentage }}
                    of the last 5 minutes with tasks stalled on memory reclaim.
                    On the memory-over-committed NAS this cascades from I/O
                    saturation (stalled dirty-page writeback) into a KVM
                    page-fault wedge. Check swap use / ARC / a heavy writer and
                    correlate with ProxmoxHostIOPressure.

              # Companion: detects collector meta-failure (the textfile
              # script ran but is stuck). Per-instance, with usable labels.
              #
              # Limitation: this alert is silent when the metric is wholly
              # absent on a host — i.e. the timer never fires, the unit was
              # removed, the host fell off the inventory, etc. We don't try
              # to detect that case here because `up` is on a different
              # exporter / instance label and joining cleanly across them
              # needs a recording-rule that doesn't exist yet (tracked as a
              # follow-up). The shipped failure mode we care about is
              # "script runs but degrades", which this catches.
              - alert: CorosyncHealthCollectorStale
                expr: >-
                  time() - proxmox_corosync_health_collector_last_success_seconds > 300
                for: 5m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'corosync-health-collector textfile script is degraded on {{ $labels.instance }}'
                  description: >-
                    proxmox_corosync_health_collector_last_success_seconds
                    on {{ $labels.instance }}
                    has not advanced in over 5 minutes. The CorosyncWedged +
                    PmxcfsStale alerts on this host are now serving stale
                    inputs. Check
                    `journalctl -u corosync-health-collector.service` and
                    `systemctl status corosync-health-collector.timer`.

              # ZFS pool integrity — fed by the zpool-status textfile
              # collector (node_exporter_host role) on every Proxmox host,
              # so compute-node local-ssd pools are covered, not just the
              # NAS. Exists because pool HEALTH alone misses the silent-
              # corruption mode that ate pve-laptop-01's local-ssd
              # (2026-06-12): vdev checksum errors accumulate while the
              # pool stays ONLINE — a May 10 scrub had already counted
              # errors and no alert fired. Counters survive `zpool clear`
              # only by resetting to 0, so a firing alert clears once the
              # operator has investigated and cleared the pool.
              - alert: ZFSPoolDeviceErrors
                expr: sum by (instance, pool) (zfs_pool_status_errors_total) > 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#handling-disk-failure-zfs'
                  summary: 'ZFS pool {{ $labels.pool }} on {{ $labels.instance }} has device errors'
                  description: >-
                    zpool status reports {{ $value | printf "%.0f" }}
                    read/write/cksum errors on pool {{ $labels.pool }}
                    ({{ $labels.instance }}). The pool may still show
                    ONLINE — this is the silent-corruption signature.
                    Run `zpool status -v {{ $labels.pool }}` on the host,
                    identify affected datasets, and `zpool clear` only
                    after investigating.

              - alert: ZFSPoolDataErrors
                expr: zfs_pool_status_data_errors > 0
                for: 5m
                labels:
                  severity: critical
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#handling-disk-failure-zfs'
                  summary: 'ZFS pool {{ $labels.pool }} on {{ $labels.instance }} has permanent data errors'
                  description: >-
                    zpool status -v lists {{ $value | printf "%.0f" }}
                    entries with unrecoverable data on pool
                    {{ $labels.pool }} ({{ $labels.instance }}). Affected
                    files/zvols need restore-or-rebuild; on a single-vdev
                    pool ZFS cannot self-heal these.

              - alert: ZFSPoolNotOnline
                expr: zfs_pool_status_health_code > 0
                for: 5m
                labels:
                  severity: critical
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#handling-disk-failure-zfs'
                  summary: 'ZFS pool {{ $labels.pool }} on {{ $labels.instance }} is not ONLINE'
                  description: >-
                    Pool {{ $labels.pool }} on {{ $labels.instance }}
                    reports DEGRADED or worse (health code
                    {{ $value | printf "%.0f" }}).

              # The == 0 branch covers never-scrubbed pools (and makes a
              # scrub-timestamp parser regression loud instead of silent —
              # the collector emits 0 when it cannot parse a completion
              # time). New pools alert after the 6h hold-off: a nudge to
              # run the first scrub, not noise.
              - alert: ZFSPoolScrubStale
                expr: >-
                  (zfs_pool_status_last_scrub_seconds == 0)
                  or (
                    zfs_pool_status_last_scrub_seconds > 0
                    and time() - zfs_pool_status_last_scrub_seconds > 35 * 86400
                  )
                for: 6h
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#handling-disk-failure-zfs'
                  summary: 'ZFS pool {{ $labels.pool }} on {{ $labels.instance }} has no recent completed scrub'
                  description: >-
                    Pool {{ $labels.pool }} on {{ $labels.instance }}
                    either has never completed a scrub (timestamp 0) or
                    its last scrub finished more than 35 days ago.
                    Without scrubs, latent corruption surfaces only when
                    something reads the bad blocks (e.g. vzdump).

              # The `or ... unless` branch closes the missing-series blind
              # spot: a staleness expression produces nothing if the
              # collector never wrote a sample at all. The corosync
              # sentinel (same hosts, same scrape job) acts as the
              # existence witness — any instance reporting corosync but
              # not zpool metrics has a broken/undeployed zpool collector.
              - alert: ZFSPoolCollectorStale
                expr: >-
                  (time() - zfs_pool_status_collector_last_success_seconds > 900)
                  or on(instance) (
                    proxmox_corosync_health_collector_last_success_seconds
                    unless on(instance) zfs_pool_status_collector_last_success_seconds
                  )
                for: 5m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#handling-disk-failure-zfs'
                  summary: 'zpool-status-collector is degraded or missing on {{ $labels.instance }}'
                  description: >-
                    zfs_pool_status_collector_last_success_seconds on
                    {{ $labels.instance }} is stale (>15m) or entirely
                    absent while the host reports other collector metrics —
                    the ZFS pool alerts on this host are serving stale or
                    no inputs. Check
                    `journalctl -u zpool-status-collector.service` and
                    `systemctl status zpool-status-collector.timer`.

              # ZFS pool capacity — fed by the zpool-status textfile collector
              # (zpool list -Hp alloc/size, node_exporter_host role) on every
              # Proxmox host, so the five compute local-ssd pools are covered
              # too. node_filesystem math cannot stand in for compute pools:
              # a dataset's size shrinks as zvols fill the pool (size =
              # used + avail of the dataset), so DiskUsage* stays low on a
              # nearly-full pool while VM I/O is about to stall. Series carry
              # (instance, pool) — required since all five compute hosts name
              # their pool local-ssd; keeping both labels also stops one
              # host's critical from inhibiting another host's warning.
              - alert: ZFSPoolSpaceWarning
                expr: (zfs_pool_status_allocated_bytes / zfs_pool_status_size_bytes) * 100 > 80
                for: 10m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#handling-disk-failure-zfs'
                  summary: 'ZFS pool {{ $labels.pool }} on {{ $labels.instance }} above 80% capacity'
                  description: 'ZFS pool {{ $labels.pool }} on {{ $labels.instance }} is at {{ $value | printf "%.1f" }}% capacity.'

              - alert: ZFSPoolSpaceCritical
                expr: (zfs_pool_status_allocated_bytes / zfs_pool_status_size_bytes) * 100 > 90
                for: 5m
                labels:
                  severity: critical
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#handling-disk-failure-zfs'
                  summary: 'ZFS pool {{ $labels.pool }} on {{ $labels.instance }} above 90% capacity'
                  description: 'ZFS pool {{ $labels.pool }} on {{ $labels.instance }} is at {{ $value | printf "%.1f" }}% capacity.'

              - alert: EndpointDown
                # The Windows VM RDP target (192.168.0.155:3389) is excluded and
                # routed to the purpose-built WindowsRdpDown (30m) below: it's an
                # on-demand desktop that is legitimately powered off much of the
                # time, so a 5m catch-all warning would be noise.
                expr: max by (instance) (probe_success{instance!="192.168.0.155:3389"}) == 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#network-connectivity-issues'
                  summary: 'Endpoint {{ $labels.instance }} is down'
                  description: 'Blackbox probe for {{ $labels.instance }} has failed for 5 minutes.'

              # Immich native-metrics liveness (immich-server 8081/8082). Both
              # ports live on the one monolithic server, so a full outage takes
              # them down together — but min by (job) also fires if EITHER
              # endpoint stops scraping (a partial failure max by (job) would
              # mask while the other stays up), still as a single alert. absent()
              # catches the whole target vanishing (VM off inventory / stack
              # removed). EndpointDown covers the photos.esweiss.com path too.
              - alert: ImmichDown
                expr: min by (job) (up{job="immich-metrics"}) == 0 or absent(up{job="immich-metrics"})
                for: 5m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/36-immich.md'
                  summary: 'Immich is down'
                  description: >-
                    Prometheus has been unable to scrape Immich's native metrics
                    (immich-server 8081/8082) for 5 minutes — the compose stack on
                    the Immich VM (192.168.0.157) is down or unreachable, or the
                    scrape target is missing. Photo access is offline.
              # Purpose-built RDP-down alert for the Windows 11 desktop VM. INERT
              # until the windows-rdp blackbox target is uncommented post-install
              # (no probe_success series -> nothing to evaluate). The 30m `for`
              # tolerates the VM being briefly/occasionally powered off; the
              # windows target is excluded from EndpointDown above so only this
              # fires. Uncomment the target in exporters/blackbox-exporter.yaml
              # to arm it. See docs/39-windows-vm.md.
              - alert: WindowsRdpDown
                expr: probe_success{instance="192.168.0.155:3389"} == 0
                for: 30m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/39-windows-vm.md'
                  summary: 'Windows VM RDP (192.168.0.155:3389) unreachable'
                  description: >-
                    The Windows 11 VM has not answered an RDP (3389) blackbox
                    probe for 30 minutes. If it is intentionally powered off this
                    is expected; otherwise check `task windows:status` and the
                    Proxmox console. See docs/39-windows-vm.md.

              # Uniform warning severity is wrong for the load-bearing three:
              # Authentik is the OIDC front door for every SSO app, GitLab is
              # the GitOps source of truth, Home Assistant is the HA-managed
              # home controller. A full outage of these pages email, not just
              # Discord. instance carries the full probe URL. EndpointDown
              # still fires alongside; the alertmanager inhibit pair
              # (EndpointDownCritical -> EndpointDown on instance) dedups.
              - alert: EndpointDownCritical
                expr: >-
                  max by (instance) (
                    probe_success{instance=~"https://(auth|git|home)\\.esweiss\\.com"}
                  ) == 0
                for: 5m
                labels:
                  severity: critical
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#network-connectivity-issues'
                  summary: 'Key endpoint {{ $labels.instance }} is down'
                  description: >-
                    Blackbox probe for {{ $labels.instance }} has failed for 5
                    minutes. This endpoint is load-bearing infrastructure
                    (SSO front door, GitOps source, or home automation).

              # App-level Nextcloud health from the nextcloud-exporter on the VM
              # (192.168.0.156:9205). nextcloud_up flips to 0 when the exporter
              # cannot reach Nextcloud's serverinfo API (Nextcloud/DB down or in
              # maintenance mode); absent() covers the exporter or scrape being
              # down. EndpointDown (blackbox cloud.esweiss.com) covers the
              # ingress/TLS path separately.
              - alert: NextcloudDown
                expr: max(nextcloud_up) == 0 or absent(nextcloud_up)
                for: 10m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/35-nextcloud.md'
                  summary: 'Nextcloud is unreachable'
                  description: >-
                    The nextcloud-exporter reports Nextcloud unreachable
                    (nextcloud_up == 0) for 10 minutes, or the metric is absent
                    (exporter/scrape down). Check the compose stack on the
                    Nextcloud VM (192.168.0.156): `task nextcloud:status`.

              # EndpointDown fires per-resolver at warning severity; this is the
              # critical aggregate for total DNS loss — every AdGuard blackbox
              # DNS probe (.150 and .160) failing at once takes name resolution
              # down cluster-wide. The failed count is compared against the
              # number of resolver probes present (not a hardcoded 2) so a
              # target dropped from the blackbox config cannot silently disarm
              # the aggregate — DNSResolverProbeMissing below catches the drop
              # itself. Also catches the service-level outage (AdGuard down
              # but the container still running) that HAInfraGuestDown's
              # guest-stopped check misses.
              - alert: DNSResolutionDown
                expr: >-
                  count(
                    max by (instance) (probe_success{instance=~"192\\.168\\.0\\.(150|160):53"}) == 0
                  )
                  ==
                  count(
                    max by (instance) (probe_success{instance=~"192\\.168\\.0\\.(150|160):53"})
                  )
                for: 5m
                labels:
                  severity: critical
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#network-connectivity-issues'
                  summary: 'All DNS resolvers are failing to answer'
                  description: >-
                    Every probed AdGuard resolver (192.168.0.150 /
                    192.168.0.160) has failed its DNS blackbox probe for 5
                    minutes — name resolution is down cluster-wide.

              # Config-drift guard for the self-scaling aggregate above: a
              # resolver whose blackbox target is removed or renamed vanishes
              # from both sides of the DNSResolutionDown count, silently
              # shrinking its coverage. BlackboxExporterDown only covers
              # whole-exporter absence, so pin each resolver's series here.
              - alert: DNSResolverProbeMissing
                expr: >-
                  absent(probe_success{instance="192.168.0.150:53"})
                  or absent(probe_success{instance="192.168.0.160:53"})
                for: 15m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#network-connectivity-issues'
                  summary: 'DNS resolver probe for {{ $labels.instance }} is missing'
                  description: >-
                    No probe_success series for {{ $labels.instance }} — its
                    blackbox target was removed or renamed, and the
                    DNSResolutionDown aggregate no longer covers this resolver.
                    Restore the target in exporters/blackbox-exporter.yaml.

              - alert: BlackboxExporterDown
                expr: absent(up{job=~".*blackbox.*"} == 1)
                for: 5m
                labels:
                  severity: critical
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#network-connectivity-issues'
                  summary: 'Blackbox exporter is down'
                  description: 'All endpoint monitoring is blind — blackbox exporter has been down for 5 minutes.'

              - alert: NodeMemoryPressure
                expr: kube_node_status_condition{condition="MemoryPressure", status="true"} == 1
                for: 5m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'Node {{ $labels.node }} is under memory pressure'
                  description: 'Kubelet on {{ $labels.node }} has been reporting memory pressure for 5 minutes. Pods may be evicted.'

      homelab-scripts:
        groups:
          - name: homelab.scripts
            rules:
              # archive_backup_last_run_success flips to 0 only on a genuine
              # zfs send/receive error; a vzdump-quiesce deferral no longer
              # zeroes it (that surfaces per-dataset via
              # ArchiveBackupDatasetStale / ArchiveBackupChronicallyDeferred).
              - alert: ArchiveBackupFailed
                expr: archive_backup_last_run_success == 0
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#backup-and-recovery'
                  summary: 'Archive backup hit a replication error'
                  description: >-
                    The nightly archive backup exited with a zfs send/receive
                    error (not a vzdump-quiesce deferral, which is tracked
                    per-dataset). Durability may be at risk — check
                    `journalctl -u archive-backup.service` on pve-nas-01.

              - alert: ArchiveBackupStale
                expr: (time() - archive_backup_last_success_timestamp_seconds > 86400 * 2) or absent(archive_backup_last_success_timestamp_seconds)
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#backup-and-recovery'
                  summary: 'Archive backup has not run in over 2 days'
                  description: 'No successful archive backup has been recorded for more than 48 hours, or the metric is missing.'

              # Per-dataset durability: a vzdump-quiesce deferral preserves the
              # previous per-dataset success timestamp (re-emitted, not zeroed),
              # so a chronically deferred dataset still goes stale here without
              # zeroing the whole-run success metric.
              - alert: ArchiveBackupDatasetStale
                expr: time() - archive_backup_dataset_last_success_timestamp_seconds > 86400 * 2
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#backup-and-recovery'
                  summary: 'Archive dataset {{ $labels.dataset }} has not replicated in over 2 days'
                  description: >-
                    Dataset {{ $labels.dataset }} has had no successful archive
                    replication for more than 48 hours (last success
                    {{ $value | humanizeDuration }} ago). If it is repeatedly
                    deferred, the 03:30 vzdump is overrunning the 06:30 archive
                    window — see the runbook.

              # First-run edge: a dataset deferred from its very first run has no
              # last-success timestamp, so ArchiveBackupDatasetStale cannot fire.
              # archive_backup_dataset_deferred_runs counts consecutive deferrals
              # (reset to 0 on any success or genuine error).
              - alert: ArchiveBackupChronicallyDeferred
                expr: archive_backup_dataset_deferred_runs >= 3
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#backup-and-recovery'
                  summary: 'Archive dataset {{ $labels.dataset }} deferred {{ $value | printf "%.0f" }} runs in a row'
                  description: >-
                    Dataset {{ $labels.dataset }} has been deferred (vzdump not
                    quiesced within the archive window) for
                    {{ $value | printf "%.0f" }} consecutive runs — the 03:30
                    vzdump is overrunning the 06:30 archive-backup timer. See the
                    runbook.

              - alert: MediaMoverFailed
                expr: media_mover_last_run_success == 0
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'Media mover failed'
                  description: 'The media mover script has not completed successfully.'

              - alert: MediaMoverStale
                expr: (time() - media_mover_last_success_timestamp_seconds > 86400 * 2) or absent(media_mover_last_success_timestamp_seconds)
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'Media mover has not run in over 2 days'
                  description: 'No successful media mover run has been recorded for more than 48 hours, or the metric is missing.'

              - alert: CertRenewalFailed
                expr: cert_renewal_last_run_success == 0
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#certificate-renewal-issues'
                  summary: 'Certificate renewal failed'
                  description: 'The certificate renewal and distribution script has not completed successfully.'

              - alert: CertExpiringSoon
                expr: (cert_local_expiry_timestamp_seconds - time() < 86400 * 14) or absent(cert_local_expiry_timestamp_seconds)
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#certificate-renewal-issues'
                  summary: 'Host-distributed wildcard cert expires in under 14 days'
                  description: >-
                    The acme.sh-distributed *.esweiss.com cert is within 14 days
                    of its notAfter (so acme.sh renewal/distribution has stopped
                    working), or the metric is missing (host off inventory).
                    Tracks real expiry, not time-since-renewal — acme.sh renews
                    ~60d apart, so a renewal-timestamp staleness proxy false-fires
                    for most of each cycle. cert-manager's CertExpiring alerts
                    cover in-cluster certs but not these host-distributed certs.

              # Critical escalation at 3 days, mirroring the cert-manager
              # CertExpiringWarning/Critical pair — this cert terminates
              # NFS-over-TLS on pve-nas-01, AdGuard TLS, and the Loki ingest
              # ingress, so expiry breaks storage and logging, not just web
              # UIs. No absent() arm: metric absence stays warning-tier via
              # CertExpiringSoon above (matching the cert-manager critical,
              # which has no absent branch either).
              - alert: CertExpiringSoonCritical
                expr: cert_local_expiry_timestamp_seconds - time() < 86400 * 3
                for: 1h
                labels:
                  severity: critical
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#certificate-renewal-issues'
                  summary: 'Host-distributed wildcard cert expires in under 3 days'
                  description: >-
                    The acme.sh-distributed *.esweiss.com cert on
                    {{ $labels.instance }} expires in
                    {{ $value | humanizeDuration }}. NFS-over-TLS (k3s PV
                    mounts), AdGuard TLS, and the Loki ingress all break at
                    expiry — fix renewal and redistribute now.

              - alert: GitLabBackupFailed
                expr: gitlab_backup_last_run_success == 0
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#backup-and-recovery'
                  summary: 'GitLab backup failed'
                  description: 'The nightly gitlab-backup run did not complete successfully.'

              - alert: GitLabBackupStale
                expr: (time() - gitlab_backup_last_success_timestamp_seconds > 86400 * 2) or absent(gitlab_backup_last_success_timestamp_seconds)
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#backup-and-recovery'
                  summary: 'GitLab backup has not succeeded in over 2 days'
                  description: >-
                    No successful GitLab backup has been recorded for more than
                    48 hours, or the metric is missing (backup wrapper not run,
                    node_exporter on the GitLab VM unreachable, or VM off
                    inventory). GitLab data lives on a zvol; Proxmox VM
                    snapshots are the only other DR path.

              # Critical escalation: four days is two more failed nightly
              # cycles past the warning — repo data-loss exposure compounds
              # silently at Discord-only warning severity. No absent() arm:
              # metric absence stays warning-tier via GitLabBackupStale above.
              - alert: GitLabBackupStaleCritical
                expr: time() - gitlab_backup_last_success_timestamp_seconds > 86400 * 4
                for: 1h
                labels:
                  severity: critical
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#backup-and-recovery'
                  summary: 'GitLab backup has not succeeded in over 4 days'
                  description: >-
                    No successful GitLab backup for more than 4 days. GitLab
                    data lives on a zvol; Proxmox VM snapshots are the only
                    other DR path. Investigate the backup wrapper on the
                    GitLab VM now.

              # Nextcloud nightly PostgreSQL logical dump (nextcloud-backup.timer
              # on the VM). The wrapper writes nextcloud_backup_last_run_success +
              # _last_success_timestamp_seconds to the node_exporter textfile dir,
              # mirroring the gitlab/archive backup collectors. The dump rides the
              # app zvol -> archive + nightly vzdump; file data is on
              # tank/nextcloud-data (raw-encrypted archive replication).
              - alert: NextcloudBackupFailed
                expr: nextcloud_backup_last_run_success == 0
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/35-nextcloud.md'
                  summary: 'Nextcloud database backup failed'
                  description: >-
                    The nightly Nextcloud pg_dump did not complete successfully.
                    Check `journalctl -u nextcloud-backup.service` on the
                    Nextcloud VM (192.168.0.156).

              - alert: NextcloudBackupStale
                expr: (time() - nextcloud_backup_last_success_timestamp_seconds > 86400 * 2) or absent(nextcloud_backup_last_success_timestamp_seconds)
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/35-nextcloud.md'
                  summary: 'Nextcloud database backup has not succeeded in over 2 days'
                  description: >-
                    No successful Nextcloud pg_dump has been recorded for more
                    than 48 hours, or the metric is missing (timer not run,
                    node_exporter on the VM unreachable, or VM off inventory).

              # Immich nightly pg_dumpall onto the app zvol (rides ssd/appdata ->
              # archive raw-encrypted). The immich-backup-run.sh wrapper writes
              # immich_backup_last_run_success + _last_success_timestamp_seconds
              # to the node_exporter textfile dir, mirroring the gitlab/archive
              # backup collectors. 48h staleness window like GitLab (nightly + grace).
              - alert: ImmichBackupFailed
                expr: immich_backup_last_run_success == 0
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#backup-and-recovery'
                  summary: 'Immich database backup failed'
                  description: 'The nightly Immich pg_dumpall did not complete successfully.'

              - alert: ImmichBackupStale
                expr: (time() - immich_backup_last_success_timestamp_seconds > 86400 * 2) or absent(immich_backup_last_success_timestamp_seconds)
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#backup-and-recovery'
                  summary: 'Immich database backup has not succeeded in over 2 days'
                  description: >-
                    No successful Immich database backup has been recorded for
                    more than 48 hours, or the metric is missing (backup timer not
                    run, node_exporter on the Immich VM unreachable, or VM off
                    inventory). The photo library and DB live on encrypted zvols;
                    the pg_dumpall is the point-in-time DB recovery path.

              # Off-node etcd snapshot copy (k3s servers -> pve-nas-01,
              # docs/17). The copy timer on each server node writes
              # etcd_snapshot_last_copy_timestamp_seconds after each transfer;
              # k3s snapshots every 12h, so >26h means two consecutive copy
              # cycles failed on that server. The absent() arm makes an
              # undeployed or removed collector loud, mirroring
              # ArchiveBackupStale/GitLabBackupStale.
              - alert: EtcdSnapshotStale
                expr: (time() - etcd_snapshot_last_copy_timestamp_seconds > 93600) or absent(etcd_snapshot_last_copy_timestamp_seconds)
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#backup-and-recovery'
                  summary: 'etcd snapshot off-node copy is stale'
                  description: >-
                    The newest etcd snapshot copied to pve-nas-01 is more than
                    26 hours old (two 12h snapshot cycles), or the copy metric
                    is missing. Losing all three server nodes without an
                    off-node snapshot loses etcd — check the copy timer on the
                    k3s server nodes.

              # Proxmox vzdump nightly guest-image backup to tank-proxmox
              # (job managed by the proxmox_backup role). A vzdump hookscript
              # deployed to every Proxmox host by node_exporter_host writes
              # vzdump_backup_last_run_success + _last_success_timestamp_seconds
              # to the node_exporter textfile dir, mirroring the gitlab/archive
              # backup collectors. Cadence is nightly, so the staleness window
              # is one cycle plus grace (~26h), tighter than the 48h GitLab/
              # archive windows.
              - alert: VzdumpBackupFailed
                expr: vzdump_backup_last_run_success == 0
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#backup-and-recovery'
                  summary: 'Proxmox vzdump backup failed'
                  description: >-
                    The nightly Proxmox vzdump job (guest images -> tank-proxmox)
                    did not complete successfully. Guest VM/LXC images are the DR
                    path for the compute-node guests.

              - alert: VzdumpBackupStale
                expr: (time() - vzdump_backup_last_success_timestamp_seconds > 93600) or absent(vzdump_backup_last_success_timestamp_seconds)
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#backup-and-recovery'
                  summary: 'Proxmox vzdump backup has not succeeded in over 26 hours'
                  description: >-
                    No successful Proxmox vzdump backup has been recorded for more
                    than 26 hours (one nightly cycle + grace) on
                    {{ $labels.instance }}, or the metric is absent on every
                    Proxmox host (hookscript not deployed anywhere). The metric is
                    now per-node, so a single node_exporter being unreachable is
                    covered by the node-down alerts, not this one. Guest VM/LXC
                    images on tank-proxmox are the DR path for the compute-node
                    guests.

      # The former homelab-backup group's ZFSPoolDegraded (zfs_exporter,
      # zfs_pool_health, NAS-only) was removed: it double-fired with the
      # textfile-collector ZFSPoolNotOnline above (zfs_pool_status_health_code,
      # all hosts, same critical severity) on a single degraded pool. There is
      # still no snapshot-staleness alert — the zfs_exporter exposes no
      # snapshot-level timestamp metric.

      homelab-temperature:
        groups:
          - name: homelab.temperature
            rules:
              # SATA drive temperatures via the drivetemp kernel module.
              # Threshold sized for the archive-pool ST6000NM0024 spinning
              # disks whose spec ceiling is 55C. Scoped to the NAS host
              # specifically because:
              #   * The other Proxmox hosts have local-ssd Samsung 870 EVO
              #     drives that the kernel's drivetemp module also reports
              #     as `chip_name="drivetemp"` (same SATA SMART path), but
              #     consumer SSDs spec a 70-85C operating ceiling and
              #     routinely run at 55-60C under k3s workloads — the alert
              #     would page on a healthy SSD.
              #   * The HDDs that this alert actually exists to protect
              #     are physically only on pve-nas-01 (archive + tank
              #     pools). Restricting `instance` keeps the alert tight.
              # If we add HDDs to another host, also extend this filter.
              - alert: SATADriveTempWarning
                expr: >-
                  max by (instance, chip) (
                    node_hwmon_temp_celsius{job="node-exporter-host", instance=~"192\\.168\\.0\\.102:.*"}
                    * on (instance, chip) group_left(chip_name)
                    node_hwmon_chip_names{job="node-exporter-host", chip_name=~"drivetemp.*"}
                  ) >= 50
                for: 15m
                labels:
                  severity: warning
                  component: storage
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: >-
                    SATA drive on {{ $labels.instance }}
                    ({{ $labels.chip }}) at
                    {{ $value | printf "%.0f" }}C
                  description: >-
                    SATA drive {{ $labels.chip }} on {{ $labels.instance }}
                    has been at {{ $value | printf "%.0f" }}C for 15 minutes
                    (warn threshold 50C). Check airflow for that drive bay.

              - alert: SATADriveTempCritical
                expr: >-
                  max by (instance, chip) (
                    node_hwmon_temp_celsius{job="node-exporter-host", instance=~"192\\.168\\.0\\.102:.*"}
                    * on (instance, chip) group_left(chip_name)
                    node_hwmon_chip_names{job="node-exporter-host", chip_name=~"drivetemp.*"}
                  ) >= 55
                for: 5m
                labels:
                  severity: critical
                  component: storage
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: >-
                    SATA drive on {{ $labels.instance }}
                    ({{ $labels.chip }}) at
                    {{ $value | printf "%.0f" }}C
                  description: >-
                    SATA drive {{ $labels.chip }} on {{ $labels.instance }}
                    is at {{ $value | printf "%.0f" }}C — at or above the
                    archive-pool drives' spec ceiling. Sustained over-temp is the strongest
                    accelerant for HDD failure.

              # NVMe via the in-tree nvme hwmon driver. Warning threshold is set
              # below the typical 80-82C composite warning so we get advance
              # notice; critical is set just below the throttle threshold.
              - alert: NVMeDriveTempWarning
                expr: >-
                  max by (instance, chip) (
                    node_hwmon_temp_celsius{job="node-exporter-host"}
                    * on (instance, chip) group_left(chip_name)
                    node_hwmon_chip_names{job="node-exporter-host", chip_name="nvme"}
                  ) >= 65
                for: 10m
                labels:
                  severity: warning
                  component: storage
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: >-
                    NVMe drive on {{ $labels.instance }}
                    ({{ $labels.chip }}) at
                    {{ $value | printf "%.0f" }}C
                  description: >-
                    NVMe drive {{ $labels.chip }} on {{ $labels.instance }}
                    has been at {{ $value | printf "%.0f" }}C for 10 minutes.
                    NVMe drives throttle around 80C and warn around 82C; investigate before
                    that happens.

              - alert: NVMeDriveTempCritical
                expr: >-
                  max by (instance, chip) (
                    node_hwmon_temp_celsius{job="node-exporter-host"}
                    * on (instance, chip) group_left(chip_name)
                    node_hwmon_chip_names{job="node-exporter-host", chip_name="nvme"}
                  ) >= 75
                for: 2m
                labels:
                  severity: critical
                  component: storage
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: >-
                    NVMe drive on {{ $labels.instance }}
                    ({{ $labels.chip }}) at
                    {{ $value | printf "%.0f" }}C
                  description: >-
                    NVMe drive {{ $labels.chip }} on {{ $labels.instance }}
                    is at {{ $value | printf "%.0f" }}C — within a few degrees of
                    thermal throttle.

              # CPU package + per-core temps via the coretemp driver. Threshold
              # is below most consumer-CPU TJunction (~100C) but well above
              # idle/normal load; 80C is the typical "high" warning level.
              - alert: CPUTempWarning
                expr: >-
                  max by (instance) (
                    node_hwmon_temp_celsius{job="node-exporter-host"}
                    * on (instance, chip) group_left(chip_name)
                    node_hwmon_chip_names{job="node-exporter-host", chip_name="coretemp"}
                  ) >= 80
                for: 10m
                labels:
                  severity: warning
                  component: cpu
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'CPU on {{ $labels.instance }} sustained {{ $value | printf "%.0f" }}C'
                  description: >-
                    CPU on {{ $labels.instance }} has been at or above
                    80C for 10 minutes. Check load and fan health.

              - alert: CPUTempCritical
                expr: >-
                  max by (instance) (
                    node_hwmon_temp_celsius{job="node-exporter-host"}
                    * on (instance, chip) group_left(chip_name)
                    node_hwmon_chip_names{job="node-exporter-host", chip_name="coretemp"}
                  ) >= 90
                for: 2m
                labels:
                  severity: critical
                  component: cpu
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'CPU on {{ $labels.instance }} at {{ $value | printf "%.0f" }}C'
                  description: >-
                    CPU on {{ $labels.instance }} hit
                    {{ $value | printf "%.0f" }}C — close to TJunction.
                    Thermal throttle is imminent if not already underway.

              # GPU temperatures: covers Intel xe (Arc/Battlemage on pve-nas-01
              # for Plex transcoding), nouveau (legacy NVIDIA on pve-prec-01,
              # pve-laptop-01), and amdgpu if added later.
              - alert: GPUTempWarning
                expr: >-
                  max by (instance, chip_name) (
                    node_hwmon_temp_celsius{job="node-exporter-host"}
                    * on (instance, chip) group_left(chip_name)
                    node_hwmon_chip_names{job="node-exporter-host", chip_name=~"xe|nouveau|nvidia|amdgpu|radeon"}
                  ) >= 85
                for: 5m
                labels:
                  severity: warning
                  component: gpu
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: >-
                    GPU ({{ $labels.chip_name }}) on
                    {{ $labels.instance }} at
                    {{ $value | printf "%.0f" }}C
                  description: >-
                    GPU ({{ $labels.chip_name }}) on {{ $labels.instance }}
                    has been at or above 85C for 5 minutes.

              - alert: GPUTempCritical
                expr: >-
                  max by (instance, chip_name) (
                    node_hwmon_temp_celsius{job="node-exporter-host"}
                    * on (instance, chip) group_left(chip_name)
                    node_hwmon_chip_names{job="node-exporter-host", chip_name=~"xe|nouveau|nvidia|amdgpu|radeon"}
                  ) >= 95
                for: 1m
                labels:
                  severity: critical
                  component: gpu
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: >-
                    GPU ({{ $labels.chip_name }}) on
                    {{ $labels.instance }} at
                    {{ $value | printf "%.0f" }}C
                  description: >-
                    GPU ({{ $labels.chip_name }}) on {{ $labels.instance }}
                    is at {{ $value | printf "%.0f" }}C — at or beyond the
                    typical thermal-shutdown threshold for consumer GPUs.

              # NIC temperature — only fires on hosts where node_exporter
              # actually publishes a nic chip (currently pve-nas-01's AQC113).
              - alert: NICTempWarning
                expr: >-
                  max by (instance, chip_name) (
                    node_hwmon_temp_celsius{job="node-exporter-host"}
                    * on (instance, chip) group_left(chip_name)
                    node_hwmon_chip_names{job="node-exporter-host", chip_name=~"nic.*"}
                  ) >= 90
                for: 10m
                labels:
                  severity: warning
                  component: network
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md'
                  summary: 'NIC on {{ $labels.instance }} at {{ $value | printf "%.0f" }}C'
                  description: >-
                    NIC {{ $labels.chip_name }} on {{ $labels.instance }}
                    has been at or above 90C for 10 minutes — high NIC temps correlate with
                    link instability on the AQC113.

      homelab-mail:
        groups:
          - name: homelab.mail
            rules:
              # Postfix relay health, fed by the postfix-queue textfile collector
              # (smtp_relay role) scraped from smtp-relay (192.168.0.151:9101).
              # Exists because a wedged Gmail hop (expired app password,
              # rate-limit) queues mail silently: the LXC stays up, postfix stays
              # active, and only the growing deferred queue reveals the break.
              - alert: PostfixQueueBacklog
                expr: postfix_queue_depth > 5
                for: 30m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#smtp-relay-postfix-alerts'
                  summary: 'Postfix queue backing up on {{ $labels.instance }}'
                  description: >-
                    The Postfix relay has held more than 5 messages queued for
                    30 minutes ({{ $value | printf "%.0f" }} now). The Gmail hop
                    is likely wedged (expired app password, rate-limit) — alert
                    email egress may be delayed or stuck.

              # postfix_up == 0 -> the relay service is not active. Critical: all
              # alert email egress (Alertmanager email, host cron, backup
              # notifications) flows through this one relay. Not absent-armed —
              # a wholly-dark smtp-relay is covered by HAInfraGuestDown (lxc/151)
              # and PostfixQueueCollectorStale below.
              - alert: PostfixDown
                expr: postfix_up == 0
                for: 10m
                labels:
                  severity: critical
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#smtp-relay-postfix-alerts'
                  summary: 'Postfix service is not active on {{ $labels.instance }}'
                  description: >-
                    postfix_up has been 0 for 10 minutes — the SMTP relay's
                    postfix service is not active. All alert email egress
                    (Alertmanager, host cron, backup notifications) is down
                    until it recovers.

              # Collector meta-failure: the queue collector ran but is stuck, or
              # was never deployed. Mirrors the other *CollectorStale rules — the
              # absent() arm makes an undeployed collector loud, so the two rules
              # above aren't silently serving stale inputs.
              - alert: PostfixQueueCollectorStale
                expr: >-
                  (time() - postfix_queue_collector_last_success_seconds > 900)
                  or absent(postfix_queue_collector_last_success_seconds)
                for: 5m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/12-runbooks.md#smtp-relay-postfix-alerts'
                  summary: 'postfix-queue collector is degraded or missing on smtp-relay'
                  description: >-
                    postfix_queue_collector_last_success_seconds is stale (>15m)
                    or entirely absent — the Postfix queue/health alerts are
                    serving stale or no inputs. Check
                    `journalctl -u postfix-queue-collector.service` and its
                    timer on smtp-relay.

      homelab-kubernetes-resources:
        groups:
          - name: homelab.kubernetes-resources
            rules:
              # Tuned replacement for the upstream KubeCPUOvercommit (disabled via
              # defaultRules.disabled above). Same shape as upstream — requests
              # must fit after removing the largest node so a single node failure
              # is survivable — but the gitlab-runner* namespaces' requests are
              # subtracted from the total. Those namespaces deliberately
              # over-request CPU for burst CI (their ResourceQuota is correctly
              # sized), which flapped the upstream alert for 15-30m per burst.
              # for: stays at the upstream 10m — with the CI burst removed from
              # the numerator the residual is genuine steady-state overcommit.
              - alert: KubeCPUOvercommit
                expr: >-
                  sum(namespace_cpu:kube_pod_container_resource_requests:sum{namespace!~"gitlab-runner.*"})
                  - (sum(kube_node_status_allocatable{resource="cpu"})
                     - max(kube_node_status_allocatable{resource="cpu"})) > 0
                  and
                  (sum(kube_node_status_allocatable{resource="cpu"})
                   - max(kube_node_status_allocatable{resource="cpu"})) > 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  runbook_url: 'https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubecpuovercommit/'
                  summary: 'Cluster has overcommitted CPU resource requests (CI namespaces excluded).'
                  description: >-
                    Non-CI CPU requests exceed the allocatable capacity that
                    would remain after the largest node fails, so the cluster
                    cannot tolerate a single node loss. The gitlab-runner*
                    namespaces are excluded because their ResourceQuota
                    deliberately over-requests for burst CI.
