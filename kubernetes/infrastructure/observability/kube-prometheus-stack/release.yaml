---
# kube-prometheus-stack HelmRelease: Prometheus, Grafana, Alertmanager,
# node-exporter, kube-state-metrics. Prometheus is single-replica, pinned to
# the NAS agent for its zvol PV (docs/31); rules live in observability/rules/.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  releaseName: kube-prometheus-stack
  # CRD installation and Prometheus startup can take several minutes
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "${helm_chart_versions_kube_prometheus_stack}"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  install:
    # The monitoring.coreos.com CRDs are owned by the infrastructure-crds stage,
    # which runs before controllers. crds.enabled below stops this chart
    # shipping its own crds/-dir copies.
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # CRDs owned by the infrastructure-crds stage (see install.crds above).
    crds:
      enabled: false
    prometheus:
      prometheusSpec:
        # priorityClassName `platform` is set per component — the chart has no
        # global key. Grafana, kube-state-metrics and node-exporter are subcharts
        # and stay unclassed.
        priorityClassName: platform

        # Pins the operator default so a chart bump cannot move `for:` semantics.
        evaluationInterval: 30s

        # Prometheus runs as nobody (65534); fsGroup ensures the PVC is writable
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534

        # NAS-pinned: the TSDB PV is node-local on k3s-agt-nas-01.
        nodeSelector:
          ${cluster_node_label_domain}/nas: "true"
        tolerations:
          - key: ${cluster_node_label_domain}/nas
            operator: Equal
            value: "true"
            effect: PreferNoSchedule

        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ""
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 150Gi
              volumeName: prometheus-data

        # retentionSize binds; 365d is an outer bound. 110GB is sized against
        # the ext4 filesystem (not the PV's nominal 150Gi) so a full disk lands
        # at ~75% with room for compaction scratch.
        retention: 365d
        retentionSize: 110GB

        # The static-target exporters ship hand-written discovery.k8s.io/v1
        # EndpointSlices, not core/v1 Endpoints. The operator's default
        # Endpoints role finds no targets for them.
        serviceDiscoveryRole: EndpointSlice

        # Discover ServiceMonitors, PodMonitors, and PrometheusRules in ALL namespaces
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleNamespaceSelector: {}

        # Request tracks the recorded Off-tier target; the limit equals the VPA's
        # maxAllowed, so a clamp shows as uncappedTarget above target and
        # VPARecommendationExceedsLimit reads the uncapped side (docs/33).
        resources:
          requests:
            cpu: 200m
            memory: 4608Mi
          limits:
            memory: 6Gi

    alertmanager:
      alertmanagerSpec:
        priorityClassName: platform
        configSecret: alertmanager-config
        # Two gossiping replicas over an emptyDir, no volumeClaimTemplate:
        # local-path would pin Alertmanager to one node, an NFS PV would tie the
        # alerting plane to the NAS. The pair replicates silences and the nflog.
        replicas: 2
        # The chart already spreads the pair with a preferred podAntiAffinity
        # over kubernetes.io/hostname; an `affinity:` here duplicates that key
        # and fails the render.
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            memory: 192Mi
      # Two replicas are only HA if a drain cannot take the survivor: without a
      # PDB a kured reboot can evict both in sequence.
      podDisruptionBudget:
        enabled: true
        minAvailable: 1

    grafana:
      ingress:
        enabled: false

      # The app container gets no ServiceAccount token; the projected volume
      # below hands it to the two sidecars. extraContainerVolumes, not
      # extraVolumes: the latter renders a projected volume as an emptyDir.
      automountServiceAccountToken: false
      extraContainerVolumes:
        - name: sidecar-kube-api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace

      # The chart's ClusterRole and Binding are replaced by the pair in
      # grafana-rbac.yaml, so Grafana's SA loses cluster-wide `secrets` read.
      rbac:
        create: false

      grafana.ini:
        server:
          root_url: https://grafana.${cluster_internal_domain}
        # SSO-only needs BOTH: disable_login_form removes the browser form and
        # auth.basic.enabled=false closes `curl -u` against the chart-generated
        # admin credential.
        auth:
          disable_login_form: true
        auth.basic:
          enabled: false
        analytics:
          check_for_updates: false
          check_for_plugin_updates: false
          reporting_enabled: false
          feedback_links_enabled: false

      # Static OIDC (Authentik): grafana-users can log in, grafana-admins get
      # the Admin role. The issuer host is the external one; the AdGuard
      # split-horizon rewrite keeps the traffic on the LAN (docs/31).
      env:
        GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
        GF_AUTH_GENERIC_OAUTH_NAME: "Authentik"
        GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
        GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
        GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://auth.${cluster_external_domain}/application/o/authorize/"
        GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://auth.${cluster_external_domain}/application/o/token/"
        GF_AUTH_GENERIC_OAUTH_API_URL: "https://auth.${cluster_external_domain}/application/o/userinfo/"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups, 'grafana-admins') && 'Admin' || contains(groups, 'grafana-users') && 'Viewer' || ''"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"

      # Secret OIDC credentials from observability-secrets
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
          secretKeyRef:
            name: observability-secrets
            key: grafana-oidc-client-id
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: observability-secrets
            key: grafana-oidc-client-secret

      # Dashboard sidecar: auto-discovers ConfigMaps labelled grafana_dashboard.
      # `resource: configmap` keeps it off Secrets, which the SA cannot read and
      # would log Forbidden on. skipReload: that endpoint is closed under SSO.
      sidecar:
        # Applies to both sidecars; the chart ships neither requests nor limits.
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 256Mi
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
          folderAnnotation: grafana_folder
          resource: configmap
          # folderAnnotation is inert without this: the provider needs
          # foldersFromFilesStructure for the sidecar's per-folder directories
          # to become Grafana folders, otherwise every dashboard lands in root.
          provider:
            foldersFromFilesStructure: true
          skipReload: true
          extraMounts:
            - name: sidecar-kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        datasources:
          # Fixed UID: dashboard JSON references this datasource as "prometheus".
          uid: prometheus
          resource: configmap
          # With the reload endpoint closed, the datasources must be written
          # before Grafana starts rather than pushed in afterwards.
          skipReload: true
          initDatasources: true
          extraMounts:
            - name: sidecar-kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true

      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          url: http://loki.observability.svc.cluster.local:3100
          access: proxy
          isDefault: false

      persistence:
        enabled: true
        type: pvc
        existingClaim: grafana-data

      # Disable init-chown-data — NFS with all_squash maps all operations to
      # 1000:2000 and does not permit chown. Grafana writes succeed because
      # the NFS squash UID matches the directory owner.
      initChownData:
        enabled: false

      # NFS-ESTALE self-heal: liveness stats /var/lib/grafana so a stale handle
      # restarts the pod. httpGet must stay explicitly nulled: helm merges into
      # the subchart's default probe and the apiserver rejects two handlers.
      livenessProbe:
        httpGet: null
        exec:
          command:
            - sh
            - -c
            - stat /var/lib/grafana >/dev/null 2>&1 || exit 1
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3

      # SQLite on NFS cannot tolerate two writers, so Recreate not
      # RollingUpdate. rollingUpdate must stay explicitly nulled: leftover
      # fields under type=Recreate are rejected by the API.
      deploymentStrategy:
        type: Recreate
        rollingUpdate: null

      # Page-cache-dominated, so the recommendation is not a capacity signal
      # (docs/33): the 1Gi limit is the ceiling and the request is raised to
      # meet it. maxAllowed in observability/vpa.yaml tracks this value.
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          memory: 1Gi

    nodeExporter:
      enabled: true

    prometheus-node-exporter:
      tolerations:
        - operator: Exists
      # --collector.processes is off by default; node_processes_* fills the
      # node-exporter-full dashboard's "System Processes" row for the k3s nodes.
      extraArgs:
        - --collector.processes
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          # No CPU limit: node-exporter bursts during scrape collection and CFS
          # throttling was the dominant CPUThrottlingHigh source. The memory
          # limit matches its VPA's maxAllowed.
          memory: 128Mi

    kube-state-metrics:
      # Sized per docs/33: the values the pod admits when the VPA webhook is
      # unavailable. The VPA is RequestsOnly, so this limit is the binding OOM
      # ceiling; move it with maxAllowed in observability/vpa.yaml.
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          memory: 384Mi
      # Flux controllers export no per-resource readiness, so it comes from
      # kube-state-metrics customResourceState (flux2-monitoring-example pattern).
      rbac:
        extraRules:
          - apiGroups:
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
            resources:
              - kustomizations
              - helmreleases
            verbs: [list, watch]
          - apiGroups:
              - source.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - helmrepositories
              - helmcharts
            verbs: [list, watch]
          - apiGroups:
              - autoscaling.k8s.io
            resources:
              - verticalpodautoscalers
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux Kustomization readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux HelmRelease readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux GitRepository readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux HelmRepository readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmChart
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux HelmChart readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              # The VPA components export no recommendation metrics, so this
              # emits one series per container and resource for both the capped
              # and uncapped recommendation. Consumed by rules/infrastructure.yaml.
              - groupVersionKind:
                  group: autoscaling.k8s.io
                  version: v1
                  kind: VerticalPodAutoscaler
                metricNamePrefix: vpa
                labelsFromPath:
                  verticalpodautoscaler: [metadata, name]
                  exported_namespace: [metadata, namespace]
                  target_kind: [spec, targetRef, kind]
                  target_name: [spec, targetRef, name]
                  # Policy shape, needed by VPARecommendationExceedsLimit. The
                  # [key=value] selector matches exactly, so "*" is a literal
                  # entry name: a VPA without a "*" entry gets no label.
                  update_mode: [spec, updatePolicy, updateMode]
                  controlled_values: [spec, resourcePolicy, containerPolicies, "[containerName=*]", controlledValues]
                # One entry per (metric, resource): valueFrom must resolve to a
                # scalar, so target/uncappedTarget split into cpu and memory with
                # commonLabels carrying resource/unit so the two never collide.
                metrics:
                  - name: recommendation_target
                    # Same metric family as the memory series below — the HELP
                    # text must match exactly.
                    help: VPA recommended resource request after minAllowed/maxAllowed capping (see resource/unit labels)
                    commonLabels:
                      resource: cpu
                      unit: core
                    each:
                      type: Gauge
                      gauge:
                        path: [status, recommendation, containerRecommendations]
                        labelsFromPath:
                          container: [containerName]
                        valueFrom: [target, cpu]
                  - name: recommendation_target
                    help: VPA recommended resource request after minAllowed/maxAllowed capping (see resource/unit labels)
                    commonLabels:
                      resource: memory
                      unit: byte
                    each:
                      type: Gauge
                      gauge:
                        path: [status, recommendation, containerRecommendations]
                        labelsFromPath:
                          container: [containerName]
                        valueFrom: [target, memory]
                  - name: recommendation_uncappedtarget
                    help: VPA recommended resource request ignoring minAllowed/maxAllowed (see resource/unit labels)
                    commonLabels:
                      resource: cpu
                      unit: core
                    each:
                      type: Gauge
                      gauge:
                        path: [status, recommendation, containerRecommendations]
                        labelsFromPath:
                          container: [containerName]
                        valueFrom: [uncappedTarget, cpu]
                  - name: recommendation_uncappedtarget
                    help: VPA recommended resource request ignoring minAllowed/maxAllowed (see resource/unit labels)
                    commonLabels:
                      resource: memory
                      unit: byte
                    each:
                      type: Gauge
                      gauge:
                        path: [status, recommendation, containerRecommendations]
                        labelsFromPath:
                          container: [containerName]
                        valueFrom: [uncappedTarget, memory]

    prometheusOperator:
      # Templated by the chart but absent from its values.yaml, so it is spelled
      # here rather than inherited — confirmed against the rendered Deployment.
      priorityClassName: platform
      # The chart ships `resources: {}`, so without this the operator has no OOM
      # ceiling at all — its paired VPA (Auto) can set requests but cannot
      # introduce a limit where the pod has none.
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          memory: 384Mi
      # Feeds both config-reloader sidecars (Prometheus and Alertmanager); the
      # chart ships them with no requests and no OOM ceiling.
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 96Mi

    # k3s bundles kube-scheduler and kube-controller-manager into the server
    # process and embeds kube-proxy, none with standalone metrics endpoints.
    # Disabling prevents false-positive *Down criticals and empty dashboards.
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false

    # On a k3s server, :10250/metrics serves the whole embedded registry, so
    # those series are stored twice; dropping the server copies trims the head.
    # Helm replaces this list rather than merging, so the chart default repeats.
    kubelet:
      serviceMonitor:
        metricRelabelings:
          # Chart default (kube-prometheus-stack values.yaml) — keep in sync on
          # a chart bump.
          - action: drop
            sourceLabels: [__name__, le]
            regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
          # rest_client_* is deliberately NOT in this list: it is duplicated too,
          # but the chart's Kubelet dashboard plots it under job="kubelet" and it
          # is a small fraction of what this drops.
          - action: drop
            sourceLabels: [__name__, node]
            separator: ;
            regex: (apiserver|etcd|scheduler|workqueue|lasso)_.*;k3s-srv-.*
    # k3s servers run with etcd-expose-metrics: true, serving etcd metrics on
    # :2381 over plain HTTP (restricted to k3s_nodes by the Proxmox firewall,
    # docs/11). Enabling this also re-enables the upstream etcd alert rules.
    kubeEtcd:
      enabled: true
      endpoints:
        - 10.0.10.222
        - 10.0.10.223
        - 10.0.10.227
      service:
        enabled: true
        port: 2381
        targetPort: 2381
      serviceMonitor:
        enabled: true
        scheme: http

    # Upstream default-rule overrides. Each disabled rule has a homelab
    # replacement in observability/rules/ — never a silent removal.
    defaultRules:
      disabled:
        # Fires on every privileged-CI burst, which over-requests CPU by design.
        # Replaced by the CI-namespace-excluding copy in
        # rules/kubernetes-resources.yaml (docs/33).
        KubeCPUOvercommit: true
        # Both select job="node-exporter", which runs without the systemd
        # collector. Every node_systemd_* series carries job="node-exporter-host"
        # instead, which is what rules/host-exporter.yaml selects.
        NodeSystemdServiceFailed: true
        NodeSystemdServiceCrashlooping: true
        # 5m pages on a pair of transient webhook timeouts. Replaced by the
        # 15m copy in rules/monitoring.yaml.
        AlertmanagerClusterFailedToSendAlerts: true

    # Custom alert rules live in observability/rules/ as standalone
    # PrometheusRule CRs, one file per group, discovered through the
    # nil-selector settings above and linted by scripts/lint-prometheus-config.sh.
