---
# kube-prometheus-stack HelmRelease — Prometheus, Grafana, Alertmanager,
# node-exporter and kube-state-metrics. Prometheus is single-replica and pinned
# to the NAS agent for its ZFS zvol PV (accepted SPOF, docs/31); Alertmanager
# runs two gossiping replicas. Custom alert rules live in observability/rules/.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  releaseName: kube-prometheus-stack
  # CRD installation and Prometheus startup can take several minutes
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "${helm_chart_versions_kube_prometheus_stack}"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  install:
    # The monitoring.coreos.com CRDs are owned by the infrastructure-crds stage
    # (prometheus-operator-crds), which runs before controllers so a fresh
    # bootstrap has them when Traefik renders a ServiceMonitor. crds.enabled
    # below stops this chart shipping its own crds/-dir copies.
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # CRDs owned by the infrastructure-crds stage (see install.crds above).
    crds:
      enabled: false
    prometheus:
      prometheusSpec:
        # Prometheus runs as nobody (65534); fsGroup ensures the PVC is writable
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534

        # Pin to NAS node for local ZFS zvol storage
        nodeSelector:
          esweiss.com/nas: "true"
        tolerations:
          - key: esweiss.com/nas
            operator: Equal
            value: "true"
            effect: PreferNoSchedule

        # Use existing PVC backed by ZFS zvol on k3s-agt-nas-01
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ""
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 150Gi
              volumeName: prometheus-data

        # retentionSize is the limit that binds; 365d is an outer bound. The cap
        # is sized against the FILESYSTEM, not the PV's nominal 150Gi:
        # /mnt/prometheus-data is ext4 with a 5% root reserve that
        # node_filesystem_avail_bytes excludes, so DiskUsageWarning would trip
        # near 117GB of data. 110GB lands the full-disk case at ~75% with room
        # for compaction scratch, and retention.size covers the WAL and head
        # chunks as well as persisted blocks.
        retention: 365d
        retentionSize: 110GB

        # The static-target exporters (node-exporter-host, zfs, unbound, and the
        # gitlab/home-assistant/immich/nextcloud ServiceMonitors) ship hand-written
        # discovery.k8s.io/v1 EndpointSlices, not core/v1 Endpoints. The operator
        # defaults to the Endpoints role, which would find no targets for them.
        serviceDiscoveryRole: EndpointSlice

        # Discover ServiceMonitors, PodMonitors, and PrometheusRules in ALL namespaces
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleNamespaceSelector: {}

        # Sized off the measured peak, not the steady state: an OOMKill here
        # takes metrics, every HPA's input and the VPA recommender's input with
        # it. The 6Gi limit matches the VPA's maxAllowed so the recorded
        # recommendation is never clamped, and VPARecommendationExceedsLimit is
        # the automated guard if it ever crosses. Sizing method and the current
        # numbers live in docs/33 §Applying an Off-tier recommendation.
        resources:
          requests:
            cpu: 200m
            memory: 3Gi
          limits:
            memory: 6Gi

    alertmanager:
      alertmanagerSpec:
        configSecret: alertmanager-config
        # Two gossiping replicas over an emptyDir. No volumeClaimTemplate on
        # purpose: the only dynamic class is local-path (node-local, would pin
        # Alertmanager to one node) and an NFS-backed static PV would make the
        # alerting plane hard-depend on the NAS. The pair replicates silences and
        # the nflog instead, so a rescheduled replica re-syncs from its peer
        # rather than starting blank. The chart's default soft pod anti-affinity
        # keeps them apart without blocking scheduling during maintenance.
        replicas: 2
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            memory: 192Mi
      # Two replicas are only HA if a drain cannot take the survivor: without a
      # PDB a kured reboot can evict both in sequence.
      podDisruptionBudget:
        enabled: true
        minAvailable: 1

    grafana:
      # Ingress handled by Traefik IngressRoute
      ingress:
        enabled: false

      # The app container gets NO ServiceAccount token; only the two sidecars
      # talk to the apiserver. automountServiceAccountToken is pod-level, so the
      # token is handed back to just those containers via the projected volume
      # below + their extraMounts. extraContainerVolumes, NOT extraVolumes: the
      # latter's template understands only claim/hostPath/csi/configMap/emptyDir
      # and would silently render a projected volume as an emptyDir.
      automountServiceAccountToken: false
      extraContainerVolumes:
        - name: sidecar-kube-api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace

      # Cluster-wide `secrets` read is dropped from the Grafana SA: the chart's
      # ClusterRole AND ClusterRoleBinding are replaced by the configmaps-only
      # pair in grafana-rbac.yaml, which carries the rationale. NOT
      # `useExistingClusterRole` — that keeps the chart's fixed-name binding and
      # only rewrites its roleRef, which the RBAC API forbids.
      rbac:
        create: false

      grafana.ini:
        server:
          root_url: https://grafana.esweiss.com
        auth:
          disable_login_form: true
        analytics:
          check_for_updates: false
          check_for_plugin_updates: false
          reporting_enabled: false
          feedback_links_enabled: false

      # Static OIDC configuration (Authentik)
      # Access: users in grafana-users group can log in, grafana-admins get Admin role.
      # Create both groups in Authentik and assign users accordingly.
      env:
        GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
        GF_AUTH_GENERIC_OAUTH_NAME: "Authentik"
        GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
        GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
        GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://auth.esweiss.com/application/o/authorize/"
        GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://auth.esweiss.com/application/o/token/"
        GF_AUTH_GENERIC_OAUTH_API_URL: "https://auth.esweiss.com/application/o/userinfo/"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups, 'grafana-admins') && 'Admin' || contains(groups, 'grafana-users') && 'Viewer' || ''"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"

      # Secret OIDC credentials from observability-secrets
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
          secretKeyRef:
            name: observability-secrets
            key: grafana-oidc-client-id
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: observability-secrets
            key: grafana-oidc-client-secret

      # Dashboard sidecar — auto-discovers ConfigMaps with grafana_dashboard label.
      # `resource: configmap` (chart default is `both`): with `secrets` gone from
      # the SA's ClusterRole, a sidecar watching Secrets would log Forbidden every
      # cycle. Every dashboard/datasource here is a ConfigMap.
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
          folderAnnotation: grafana_folder
          resource: configmap
          extraMounts:
            - name: sidecar-kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        datasources:
          # Set fixed UID so custom dashboard JSON can reference "prometheus"
          uid: prometheus
          resource: configmap
          extraMounts:
            - name: sidecar-kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true

      # Additional datasource: Loki for log queries
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          url: http://loki.observability.svc.cluster.local:3100
          access: proxy
          isDefault: false

      # Persistent storage for Grafana's SQLite DB (service accounts, prefs)
      persistence:
        enabled: true
        type: pvc
        existingClaim: grafana-data

      # Disable init-chown-data — NFS with all_squash maps all operations to
      # 1000:2000 and does not permit chown. Grafana writes succeed because
      # the NFS squash UID matches the directory owner.
      initChownData:
        enabled: false

      # NFS-ESTALE self-heal: after a NAS reboot the established /var/lib/grafana
      # mount returns stale handles grafana never recovers from. A stat surfaces
      # ESTALE or a hung hard-mount, so kubelet restarts the pod and it remounts.
      #
      # httpGet MUST be explicitly nulled: helm deep-merges into the subchart's
      # defaults, whose livenessProbe carries httpGet, and the apiserver rejects
      # a probe with BOTH handlers ("may not specify more than 1 handler type").
      # kubeconform cannot catch it — only a live upgrade surfaces it.
      livenessProbe:
        httpGet: null
        exec:
          command:
            - sh
            - -c
            - stat /var/lib/grafana >/dev/null 2>&1 || exit 1
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3

      # SQLite on NFS cannot tolerate two writers; RollingUpdate would run
      # old+new pods against the same DB during every upgrade.
      # rollingUpdate must be explicitly nulled: the live Deployment
      # carries rollingUpdate defaults from its RollingUpdate days, and
      # a patch that only sets type=Recreate leaves them in place — the
      # API rejects the combination ("rollingUpdate: Forbidden ... when
      # strategy type is 'Recreate'").
      deploymentStrategy:
        type: Recreate
        rollingUpdate: null

      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi

    nodeExporter:
      enabled: true

    prometheus-node-exporter:
      # Tolerate ALL taints so node-exporter runs on every node in the cluster
      tolerations:
        - operator: Exists
      # The processes collector is off by default; node_processes_* gives
      # process/thread/PID-limit visibility on the memory-tight NAS and fills the
      # node-exporter-full dashboard's "System Processes" panels.
      extraArgs:
        - --collector.processes
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          # No CPU limit: node-exporter bursts during scrape collection and CFS
          # throttling was the dominant CPUThrottlingHigh source. Its VPA is
          # controlledValues: RequestsOnly so it cannot re-impose one. The memory
          # limit matches that VPA's maxAllowed.
          memory: 128Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      # Flux controllers export no per-resource readiness, so it comes from
      # kube-state-metrics customResourceState (flux2-monitoring-example pattern).
      rbac:
        extraRules:
          - apiGroups:
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
            resources:
              - kustomizations
              - helmreleases
            verbs: [list, watch]
          - apiGroups:
              - source.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - helmrepositories
              - helmcharts
            verbs: [list, watch]
          - apiGroups:
              - autoscaling.k8s.io
            resources:
              - verticalpodautoscalers
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux Kustomization readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux HelmRelease readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux GitRepository readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux HelmRepository readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmChart
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux HelmChart readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              # The VPA components export no recommendation metrics, so this
              # emits one series per container and resource (labels: container,
              # resource, unit) for both the capped and uncapped recommendation.
              # Consumed by VPARecommendationCapped/ExceedsLimit in
              # observability/rules/infrastructure.yaml.
              - groupVersionKind:
                  group: autoscaling.k8s.io
                  version: v1
                  kind: VerticalPodAutoscaler
                metricNamePrefix: vpa
                labelsFromPath:
                  verticalpodautoscaler: [metadata, name]
                  exported_namespace: [metadata, namespace]
                  target_kind: [spec, targetRef, kind]
                  target_name: [spec, targetRef, name]
                  # Policy shape, needed by VPARecommendationExceedsLimit to
                  # tell "nothing will ever apply this recommendation" from "the
                  # VPA rewrites the limit itself on the next admission".
                  # kube-state-metrics' [key=value] selector is an exact string
                  # match, so "*" is the literal entry name, not a wildcard: a
                  # per-container controlledValues is invisible here, and a VPA
                  # that names every container instead of carrying a "*" entry
                  # gets no label at all. An unset path simply omits the label.
                  update_mode: [spec, updatePolicy, updateMode]
                  controlled_values: [spec, resourcePolicy, containerPolicies, "[containerName=*]", controlledValues]
                # One entry per (metric, resource): valueFrom must resolve to a
                # scalar quantity, so target/uncappedTarget are split into their
                # cpu and memory members. commonLabels carries the resource/unit
                # so the cpu and memory series never collide and the alert's
                # resource/unit annotations are populated.
                metrics:
                  - name: recommendation_target
                    # Same metric family as the memory series below — the HELP
                    # text must match exactly.
                    help: VPA recommended resource request after minAllowed/maxAllowed capping (see resource/unit labels)
                    commonLabels:
                      resource: cpu
                      unit: core
                    each:
                      type: Gauge
                      gauge:
                        path: [status, recommendation, containerRecommendations]
                        labelsFromPath:
                          container: [containerName]
                        valueFrom: [target, cpu]
                  - name: recommendation_target
                    help: VPA recommended resource request after minAllowed/maxAllowed capping (see resource/unit labels)
                    commonLabels:
                      resource: memory
                      unit: byte
                    each:
                      type: Gauge
                      gauge:
                        path: [status, recommendation, containerRecommendations]
                        labelsFromPath:
                          container: [containerName]
                        valueFrom: [target, memory]
                  - name: recommendation_uncappedtarget
                    help: VPA recommended resource request ignoring minAllowed/maxAllowed (see resource/unit labels)
                    commonLabels:
                      resource: cpu
                      unit: core
                    each:
                      type: Gauge
                      gauge:
                        path: [status, recommendation, containerRecommendations]
                        labelsFromPath:
                          container: [containerName]
                        valueFrom: [uncappedTarget, cpu]
                  - name: recommendation_uncappedtarget
                    help: VPA recommended resource request ignoring minAllowed/maxAllowed (see resource/unit labels)
                    commonLabels:
                      resource: memory
                      unit: byte
                    each:
                      type: Gauge
                      gauge:
                        path: [status, recommendation, containerRecommendations]
                        labelsFromPath:
                          container: [containerName]
                        valueFrom: [uncappedTarget, memory]

    prometheusOperator:
      # The chart ships `resources: {}`, so without this the operator has no OOM
      # ceiling at all — its paired VPA (Auto) can set requests but cannot
      # introduce a limit where the pod has none.
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          memory: 384Mi

    # k3s bundles kube-scheduler and kube-controller-manager into the server
    # process and embeds kube-proxy, none with standalone metrics endpoints.
    # Disabling prevents false-positive *Down criticals and removes dashboards
    # that always show "No data".
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false

    # The flip side of that bundling: on a k3s SERVER, :10250/metrics serves the
    # whole embedded registry, so those series are stored twice (job="kubelet"
    # and job="apiserver"). Dropping the server copies removes roughly a quarter
    # of the head series; agents keep everything, since nothing there is
    # duplicated. Scoped by the `node` target label so replacing a server needs
    # no edit here. Helm REPLACES this list rather than merging it, so the
    # chart's own default rule is repeated below.
    kubelet:
      serviceMonitor:
        metricRelabelings:
          # Chart default (kube-prometheus-stack values.yaml) — keep in sync on
          # a chart bump.
          - action: drop
            sourceLabels: [__name__, le]
            regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
          # rest_client_* is deliberately NOT in this list: it is duplicated too,
          # but the chart's Kubelet dashboard plots it under job="kubelet" and it
          # is a small fraction of what this drops.
          - action: drop
            sourceLabels: [__name__, node]
            separator: ;
            regex: (apiserver|etcd|scheduler|workqueue|lasso)_.*;k3s-srv-.*
    # k3s embeds etcd but exposes its metrics: the server nodes run with
    # etcd-expose-metrics: true (the weisssrv.infra.k3s role), serving standard etcd
    # metrics on :2381 over plain HTTP. Enabling this also re-enables the
    # upstream etcd alert rules, which are gated on kubeEtcd.enabled. Port 2381
    # is restricted to k3s_nodes by the Proxmox firewall (docs/11).
    kubeEtcd:
      enabled: true
      endpoints:
        - 192.168.0.222
        - 192.168.0.223
        - 192.168.0.227
      service:
        enabled: true
        port: 2381
        targetPort: 2381
      serviceMonitor:
        enabled: true
        scheme: http

    # Upstream default-rule overrides. Each disabled rule has a homelab
    # replacement in observability/rules/ — never a silent removal.
    defaultRules:
      disabled:
        # Fires transiently on every privileged-CI burst: the
        # gitlab-runner-privileged ResourceQuota deliberately over-requests CPU,
        # tripping the "cluster can't tolerate one node failure" check for the
        # 15-30m a burst runs. Replaced by the CI-namespace-excluding copy in
        # rules/kubernetes-resources.yaml.
        KubeCPUOvercommit: true
        # Both select job="node-exporter", the in-cluster DaemonSet, which runs
        # without the systemd collector and exports zero node_systemd_* series.
        # The collector is enabled only on the host exporter
        # (node_exporter_host_systemd_collector), so every node_systemd_* series
        # carries job="node-exporter-host" — which is what the replacements in
        # rules/host-exporter.yaml select.
        NodeSystemdServiceFailed: true
        NodeSystemdServiceCrashlooping: true

    # Custom alert rules live in observability/rules/ as standalone
    # PrometheusRule CRs, one file per group — kubeconform-validated, diffed
    # without re-rendering this release, and linted (with the promtool unit
    # tests) by scripts/lint-prometheus-config.sh. Prometheus discovers them
    # through the nil-selector settings above. Every custom alert carries a
    # runbook_url; upstream chart rules deliberately do not.
