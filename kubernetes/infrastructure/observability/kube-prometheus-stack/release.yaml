---
# kube-prometheus-stack HelmRelease — deploys Prometheus, Grafana, Alertmanager,
# node-exporter, and kube-state-metrics into the observability namespace.
# Chart version substituted from cluster-versions ConfigMap.
# Prometheus pinned to NAS node for local ZFS zvol storage.
# Grafana configured with Authentik OIDC and Loki datasource.
# Alertmanager sends alerts via email (SMTP relay) and Discord webhook.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  releaseName: kube-prometheus-stack
  # CRD installation and Prometheus startup can take several minutes
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "${helm_chart_versions_kube_prometheus_stack}"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # -------------------------------------------------------------------------
    # Prometheus
    # -------------------------------------------------------------------------
    prometheus:
      prometheusSpec:
        # Prometheus runs as nobody (65534); fsGroup ensures the PVC is writable
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534

        # Pin to NAS node for local ZFS zvol storage
        nodeSelector:
          esweiss.com/nas: "true"
        tolerations:
          - key: esweiss.com/nas
            operator: Equal
            value: "true"
            effect: PreferNoSchedule

        # Use existing PVC backed by ZFS zvol on k3s-agt-nas-01
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ""
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 150Gi
              volumeName: prometheus-data

        # Retention
        retention: 365d
        retentionSize: 140GB

        # Discover ServiceMonitors, PodMonitors, and PrometheusRules in ALL namespaces
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleNamespaceSelector: {}

        # Working set runs 2-2.6Gi at 365d retention; request must reflect
        # that for honest scheduling (VPA is Off here — hand-tuned).
        resources:
          requests:
            cpu: 200m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi

    # -------------------------------------------------------------------------
    # Alertmanager
    # -------------------------------------------------------------------------
    alertmanager:
      alertmanagerSpec:
        configSecret: alertmanager-config
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

    # -------------------------------------------------------------------------
    # Grafana
    # -------------------------------------------------------------------------
    grafana:
      # Ingress handled by Traefik IngressRoute
      ingress:
        enabled: false

      grafana.ini:
        server:
          root_url: https://grafana.esweiss.com
        auth:
          disable_login_form: true
        analytics:
          check_for_updates: false
          check_for_plugin_updates: false
          reporting_enabled: false
          feedback_links_enabled: false

      # Static OIDC configuration (Authentik)
      # Access: users in grafana-users group can log in, grafana-admins get Admin role.
      # Create both groups in Authentik and assign users accordingly.
      env:
        GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
        GF_AUTH_GENERIC_OAUTH_NAME: "Authentik"
        GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
        GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
        GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://auth.esweiss.com/application/o/authorize/"
        GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://auth.esweiss.com/application/o/token/"
        GF_AUTH_GENERIC_OAUTH_API_URL: "https://auth.esweiss.com/application/o/userinfo/"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups, 'grafana-admins') && 'Admin' || contains(groups, 'grafana-users') && 'Viewer' || ''"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"

      # Secret OIDC credentials from observability-secrets
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
          secretKeyRef:
            name: observability-secrets
            key: grafana-oidc-client-id
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: observability-secrets
            key: grafana-oidc-client-secret

      # Dashboard sidecar — auto-discovers ConfigMaps with grafana_dashboard label
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
          folderAnnotation: grafana_folder
        datasources:
          # Set fixed UID so custom dashboard JSON can reference "prometheus"
          uid: prometheus

      # Additional datasource: Loki for log queries
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          url: http://loki.observability.svc.cluster.local:3100
          access: proxy
          isDefault: false

      # Persistent storage for Grafana's SQLite DB (service accounts, prefs)
      persistence:
        enabled: true
        type: pvc
        existingClaim: grafana-data

      # Disable init-chown-data — NFS with all_squash maps all operations to
      # 1000:2000 and does not permit chown. Grafana writes succeed because
      # the NFS squash UID matches the directory owner.
      initChownData:
        enabled: false

      # SQLite on NFS cannot tolerate two writers; RollingUpdate would run
      # old+new pods against the same DB during every upgrade.
      # rollingUpdate must be explicitly nulled: the live Deployment
      # carries rollingUpdate defaults from its RollingUpdate days, and
      # a patch that only sets type=Recreate leaves them in place — the
      # API rejects the combination ("rollingUpdate: Forbidden ... when
      # strategy type is 'Recreate'", v106 upgrade failure post-!81).
      deploymentStrategy:
        type: Recreate
        rollingUpdate: null

      # p95 working set ~470Mi — the old 512Mi limit left no headroom.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi

    # -------------------------------------------------------------------------
    # node-exporter
    # -------------------------------------------------------------------------
    nodeExporter:
      enabled: true

    prometheus-node-exporter:
      # Tolerate ALL taints so node-exporter runs on every node in the cluster
      tolerations:
        - operator: Exists
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 64Mi

    # -------------------------------------------------------------------------
    # kube-state-metrics
    # -------------------------------------------------------------------------
    kube-state-metrics:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      # Flux controllers stopped exporting per-resource readiness
      # (gotk_reconcile_condition) — readiness now comes from kube-state-metrics
      # customResourceState, per the flux2-monitoring-example pattern.
      rbac:
        extraRules:
          - apiGroups:
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
            resources:
              - kustomizations
              - helmreleases
            verbs: [list, watch]
          - apiGroups:
              - source.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - helmrepositories
              - helmcharts
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux Kustomization readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux HelmRelease readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux GitRepository readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux HelmRepository readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmChart
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux HelmChart readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]

    # -------------------------------------------------------------------------
    # Disable components not present in k3s
    # -------------------------------------------------------------------------
    # k3s bundles kube-scheduler and kube-controller-manager into the server
    # process without separate metrics endpoints. kube-proxy is embedded in
    # the k3s binary without a standalone metrics endpoint. Disabling prevents
    # false-positive *Down critical alerts and removes dashboards that always
    # show "No data".
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    # k3s embeds etcd without exposing standard metrics endpoints
    kubeEtcd:
      enabled: false

    # -------------------------------------------------------------------------
    # Custom alert rules
    # -------------------------------------------------------------------------
    additionalPrometheusRulesMap:
      homelab-storage:
        groups:
          - name: homelab.storage
            rules:
              # efivarfs is the kernel's NVRAM-backed virtual fs at
              # /sys/firmware/efi/efivars; it commonly sits above 70% (filled
              # with EFI variables) and isn't a real disk-usage signal.
              # devtmpfs/iso9660 are also virtual / read-only.
              - alert: DiskUsageWarning
                expr: >-
                  (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"}
                  / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"})
                  * 100 > 80
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: 'Disk usage above 80% on {{ $labels.instance }}:{{ $labels.mountpoint }}'
                  description: >-
                    Disk usage is {{ $value | printf "%.1f" }}%
                    on {{ $labels.instance }}
                    mount {{ $labels.mountpoint }}.

              - alert: DiskUsageCritical
                expr: >-
                  (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"}
                  / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"})
                  * 100 > 90
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: 'Disk usage above 90% on {{ $labels.instance }}:{{ $labels.mountpoint }}'
                  description: >-
                    Disk usage is {{ $value | printf "%.1f" }}%
                    on {{ $labels.instance }}
                    mount {{ $labels.mountpoint }}.

              - alert: PVCUsageWarning
                expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 80
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: 'PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} above 80%'
                  description: 'PVC usage is {{ $value | printf "%.1f" }}%.'

              - alert: PVCUsageCritical
                expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 90
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: 'PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} above 90%'
                  description: 'PVC usage is {{ $value | printf "%.1f" }}%.'

              # Inode exhaustion: byte-usage rules above miss a filesystem that
              # fills its inode table (many tiny files) while still having free
              # bytes. The chart's default NodeFilesystemAlmostOutOfFiles only
              # covers the in-cluster node-exporter; this fires across both that
              # job and the bare-metal node-exporter-host job (port 9101) so a
              # Proxmox host root running out of inodes is caught too.
              - alert: InodeUsageWarning
                expr: >-
                  (node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"}
                  / node_filesystem_files{fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"})
                  * 100 < 10
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: 'Inodes below 10% free on {{ $labels.instance }}:{{ $labels.mountpoint }}'
                  description: >-
                    Only {{ $value | printf "%.1f" }}% of inodes are free
                    on {{ $labels.instance }}
                    mount {{ $labels.mountpoint }}.

              - alert: InodeUsageCritical
                expr: >-
                  (node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"}
                  / node_filesystem_files{fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"})
                  * 100 < 5
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: 'Inodes below 5% free on {{ $labels.instance }}:{{ $labels.mountpoint }}'
                  description: >-
                    Only {{ $value | printf "%.1f" }}% of inodes are free
                    on {{ $labels.instance }}
                    mount {{ $labels.mountpoint }}.

      homelab-infrastructure:
        groups:
          - name: homelab.infrastructure
            rules:
              # VPN health for the Gluetun-fronted qbittorrent pod. The
              # gluetun-exporter sidecar (downloads/qbittorrent.yaml) emits
              # gluetun_vpn_status: 1 = running, 0 = stopped/unreachable,
              # -1 = error, -2 = unknown. !=1 covers every non-healthy state.
              #
              # Only qbittorrent carries the exporter (VPN-always-on); nzbget
              # ships VPN-off and emits no series, so this can't false-fire on
              # its direct mode. 15m comfortably exceeds a Recreate rollout +
              # OpenVPN reconnect (~2-3m), so normal restarts stay quiet.
              - alert: VPNDown
                expr: gluetun_vpn_status != 1
                for: 15m
                labels:
                  severity: critical
                annotations:
                  summary: 'Gluetun VPN unhealthy on {{ $labels.pod }}'
                  description: >-
                    gluetun_vpn_status is {{ $value }} (1 = running) on
                    {{ $labels.pod }} for 15m. The download client is
                    killswitched — no egress until the VPN reconnects.

              # Catches the case where the qbittorrent pod or its exporter is
              # gone entirely (metric absent, not just non-1). VPN state is then
              # unknown, which for an always-on VPN client warrants a page.
              - alert: VPNExporterDown
                expr: absent(gluetun_vpn_status)
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: 'Gluetun VPN-health metric missing for qbittorrent'
                  description: >-
                    No gluetun_vpn_status series for 15m — the qbittorrent pod
                    or its gluetun-exporter sidecar may be down. VPN state is
                    unknown.

              # Loki is a single-replica RF=1 SPOF pinned to the NAS (accepted
              # homelab tradeoff); senders do not buffer, so silent ingestion
              # breakage loses logs without surfacing. This catches a sustained
              # 5xx rate on Loki's HTTP API (push/query) so the breakage pages.
              - alert: LokiRequestFailures
                expr: >-
                  sum(rate(loki_request_duration_seconds_count{status_code=~"5..",
                  job="observability/loki"}[5m]))
                  /
                  sum(rate(loki_request_duration_seconds_count{job="observability/loki"}[5m]))
                  > 0.05
                  and sum(rate(loki_request_duration_seconds_count{job="observability/loki"}[5m])) > 0
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: 'Loki is returning 5xx on more than 5% of requests'
                  description: >-
                    Loki is serving HTTP 5xx on
                    {{ $value | printf "%.1f" }}% of requests over the last
                    5 minutes (push/query). Log ingestion may be silently
                    failing — senders do not buffer.

              - alert: FluxReconciliationFailure
                expr: sum by (controller) (rate(controller_runtime_reconcile_errors_total{job="observability/flux-system"}[5m])) > 0
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: 'Flux controller {{ $labels.controller }} has reconciliation errors'
                  description: >-
                    Flux controller {{ $labels.controller }}
                    has been producing reconciliation errors
                    at {{ $value | printf "%.2f" }} errors/s for 15 minutes.

              # Catches the class of failure where a HelmRelease/Kustomization
              # is durably not Ready (e.g. InvalidChartReference from a stale
              # chart cache, missing CRD, failing values-render). Complements
              # FluxReconciliationFailure which fires on error-rate; this fires
              # on durable Ready=False regardless of error rate.
              - alert: FluxResourceNotReady
                # gotk_resource_info comes from kube-state-metrics
                # customResourceState (the controllers no longer export
                # per-resource readiness themselves).
                expr: gotk_resource_info{ready="False", suspended!="true"} == 1
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: >-
                    Flux resource {{ $labels.customresource_kind }}/{{ $labels.exported_namespace }}/{{ $labels.name }}
                    not Ready
                  description: >-
                    Flux resource {{ $labels.customresource_kind }}
                    {{ $labels.exported_namespace }}/{{ $labels.name }}
                    has had Ready=False for 15 minutes. Run
                    `flux get all -A | grep -v True` and
                    `kubectl describe {{ $labels.customresource_kind }} {{ $labels.name }}
                    -n {{ $labels.exported_namespace }}` to investigate.

              - alert: OnePasswordConnectDown
                expr: >-
                  kube_deployment_status_replicas_available{namespace="external-secrets", deployment="onepassword-connect"} == 0
                  or absent(kube_deployment_status_replicas_available{namespace="external-secrets", deployment="onepassword-connect"})
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: '1Password Connect has no available replicas'
                  description: >-
                    1Password Connect deployment in external-secrets namespace
                    has had 0 available replicas for 5 minutes (or the metric
                    is absent, indicating kube-state-metrics is also down).
                    Connect is the secrets backend for all ExternalSecrets in the cluster —
                    no new secrets can be created or rotated until it recovers.

              - alert: ExternalSecretSyncFailure
                expr: externalsecret_status_condition{condition="Ready", status="False"} == 1
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: 'ExternalSecret {{ $labels.name }} sync failing'
                  description: 'ExternalSecret {{ $labels.name }} in {{ $labels.namespace }} has not synced for 15 minutes.'

              # The cloudflare-ddns CronJob runs every 5m to keep the public-IP
              # A records current. KubeJobFailed catches hard pod failures; this
              # catches the silent case where successful runs stop advancing
              # (token revoked → jobs fail, schedule stuck) so external services
              # don't break unnoticed on the next WAN IP change. (It does not
              # detect an IP that drifted while a run "succeeded" — that needs a
              # blackbox/textfile IP-match probe, not yet deployed.)
              - alert: DDNSStale
                expr: >-
                  (time() - kube_cronjob_status_last_successful_time{namespace="cloudflare-ddns", cronjob="cloudflare-ddns"} > 3600)
                  or absent(kube_cronjob_status_last_successful_time{namespace="cloudflare-ddns", cronjob="cloudflare-ddns"})
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: 'Cloudflare DDNS has not had a successful run in over 1 hour'
                  description: >-
                    The cloudflare-ddns CronJob (every 5m) has had no successful
                    completion for more than an hour, or the metric is absent.
                    Public-IP A records (ericsweiss.com, direct/git) may go stale
                    on the next WAN IP change.

              - alert: CertExpiringWarning
                expr: certmanager_certificate_expiration_timestamp_seconds - time() < 86400 * 14
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: 'Certificate {{ $labels.name }} expiring in less than 14 days'
                  description: >-
                    Certificate {{ $labels.name }}
                    in {{ $labels.namespace }}
                    expires in {{ $value | humanizeDuration }}.

              - alert: CertExpiringCritical
                expr: certmanager_certificate_expiration_timestamp_seconds - time() < 86400 * 3
                for: 1h
                labels:
                  severity: critical
                annotations:
                  summary: 'Certificate {{ $labels.name }} expiring in less than 3 days'
                  description: >-
                    Certificate {{ $labels.name }}
                    in {{ $labels.namespace }}
                    expires in {{ $value | humanizeDuration }}.

              - alert: TraefikHighErrorRate
                expr: >-
                  sum(rate(traefik_service_requests_total{code=~"5.."}[5m]))
                  /
                  sum(rate(traefik_service_requests_total[5m]))
                  > 0.05
                  and sum(rate(traefik_service_requests_total[5m])) > 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: 'Traefik 5xx error rate above 5%'
                  description: 'Traefik is returning 5xx errors at {{ $value | printf "%.1f" }}% over the last 5 minutes.'

      homelab-monitoring:
        groups:
          - name: homelab.monitoring
            rules:
              - alert: ProxmoxHostDown
                expr: >-
                  min by (id) (max_over_time(pve_up{id=~"node/.*"}[5m])) == 0
                  or absent(pve_up{id=~"node/.*"})
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: 'Proxmox host {{ $labels.id }} is down'
                  description: >-
                    Proxmox host {{ $labels.id }} has been unreachable for 5 minutes.
                    If id is empty, the Proxmox exporter itself may be down.

              # corosync CPU wedge — incident 2026-05-09: corosync PID stuck at
              # ~99% CPU on pve-nas-01, process alive (so ProxmoxHostDown stayed
              # green and the systemd unit stayed "active") but pmxcfs frozen.
              # Caught by the textfile metric written by
              # ansible/roles/node_exporter_host/files/corosync-health-collector.sh.
              # Normal corosync CPU is 1-2%; brief spikes during membership
              # changes are bounded well below 10m.
              - alert: CorosyncWedged
                expr: avg_over_time(proxmox_corosync_cpu_percent[10m]) > 90
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: 'corosync stuck at high CPU on {{ $labels.instance }}'
                  description: >-
                    corosync on {{ $labels.instance }}
                    has averaged
                    {{ $value | printf "%.1f" }}%
                    CPU over the last 10 minutes. Likely wedged
                    — pmxcfs replication has probably stopped on this node.
                    Mitigation: `systemctl restart corosync` on that host;
                    check `journalctl -u corosync` for the last log line
                    before the silence to file an upstream bug.

              # pmxcfs split-brain — detected via age of
              # /etc/pve/ha/manager_status, which the HA CRM master rewrites
              # every few seconds. A 10-minute-old file on any node means
              # either HA itself is fully broken cluster-wide (catastrophic,
              # but bounded by HostDown alerts) OR this specific node has
              # stopped receiving pmxcfs updates (silent split-brain). Same
              # textfile source as CorosyncWedged above; we use a long
              # threshold (10m) because legitimate idle updates aren't
              # strictly per-second.
              #
              # A deleted manager_status file shows up as mtime=0, which
              # `time() - 0` evaluates as huge → alert fires. That's the
              # desired behavior: the only legitimate way to see mtime=0 on
              # our cluster is HA being intentionally disabled on the host
              # (in which case the operator silences). A previous version of
              # this rule guarded `> 0` to skip such hosts, but that meant a
              # deliberate or accidental file delete silently suppressed the
              # split-brain signal it was supposed to detect.
              - alert: PmxcfsStale
                expr: >-
                  time() - proxmox_pmxcfs_manager_status_mtime_seconds > 600
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: 'pmxcfs on {{ $labels.instance }} appears stale (split-brain)'
                  description: >-
                    /etc/pve/ha/manager_status on {{ $labels.instance }}
                    has not been updated in
                    {{ $value | humanizeDuration }}.
                    pmxcfs replication has stopped on this node — its
                    view of the cluster is frozen. Compare
                    `sudo cat /etc/pve/ha/manager_status` across nodes
                    to confirm, then `systemctl restart corosync pve-cluster`
                    on the affected node.

              # Companion: detects collector meta-failure (the textfile
              # script ran but is stuck). Per-instance, with usable labels.
              #
              # Limitation: this alert is silent when the metric is wholly
              # absent on a host — i.e. the timer never fires, the unit was
              # removed, the host fell off the inventory, etc. We don't try
              # to detect that case here because `up` is on a different
              # exporter / instance label and joining cleanly across them
              # needs a recording-rule that doesn't exist yet (tracked as a
              # follow-up). The shipped failure mode we care about is
              # "script runs but degrades", which this catches.
              - alert: CorosyncHealthCollectorStale
                expr: >-
                  time() - proxmox_corosync_health_collector_last_success_seconds > 300
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: 'corosync-health-collector textfile script is degraded on {{ $labels.instance }}'
                  description: >-
                    proxmox_corosync_health_collector_last_success_seconds
                    on {{ $labels.instance }}
                    has not advanced in over 5 minutes. The CorosyncWedged +
                    PmxcfsStale alerts on this host are now serving stale
                    inputs. Check
                    `journalctl -u corosync-health-collector.service` and
                    `systemctl status corosync-health-collector.timer`.

              # ZFS pool integrity — fed by the zpool-status textfile
              # collector (node_exporter_host role) on every Proxmox host,
              # so compute-node local-ssd pools are covered, not just the
              # NAS. Exists because pool HEALTH alone misses the silent-
              # corruption mode that ate pve-laptop-01's local-ssd
              # (2026-06-12): vdev checksum errors accumulate while the
              # pool stays ONLINE — a May 10 scrub had already counted
              # errors and no alert fired. Counters survive `zpool clear`
              # only by resetting to 0, so a firing alert clears once the
              # operator has investigated and cleared the pool.
              - alert: ZFSPoolDeviceErrors
                expr: sum by (instance, pool) (zfs_pool_status_errors_total) > 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: 'ZFS pool {{ $labels.pool }} on {{ $labels.instance }} has device errors'
                  description: >-
                    zpool status reports {{ $value | printf "%.0f" }}
                    read/write/cksum errors on pool {{ $labels.pool }}
                    ({{ $labels.instance }}). The pool may still show
                    ONLINE — this is the silent-corruption signature.
                    Run `zpool status -v {{ $labels.pool }}` on the host,
                    identify affected datasets, and `zpool clear` only
                    after investigating.

              - alert: ZFSPoolDataErrors
                expr: zfs_pool_status_data_errors > 0
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: 'ZFS pool {{ $labels.pool }} on {{ $labels.instance }} has permanent data errors'
                  description: >-
                    zpool status -v lists {{ $value | printf "%.0f" }}
                    entries with unrecoverable data on pool
                    {{ $labels.pool }} ({{ $labels.instance }}). Affected
                    files/zvols need restore-or-rebuild; on a single-vdev
                    pool ZFS cannot self-heal these.

              - alert: ZFSPoolNotOnline
                expr: zfs_pool_status_health_code > 0
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: 'ZFS pool {{ $labels.pool }} on {{ $labels.instance }} is not ONLINE'
                  description: >-
                    Pool {{ $labels.pool }} on {{ $labels.instance }}
                    reports DEGRADED or worse (health code
                    {{ $value | printf "%.0f" }}).

              # The == 0 branch covers never-scrubbed pools (and makes a
              # scrub-timestamp parser regression loud instead of silent —
              # the collector emits 0 when it cannot parse a completion
              # time). New pools alert after the 6h hold-off: a nudge to
              # run the first scrub, not noise.
              - alert: ZFSPoolScrubStale
                expr: >-
                  (zfs_pool_status_last_scrub_seconds == 0)
                  or (
                    zfs_pool_status_last_scrub_seconds > 0
                    and time() - zfs_pool_status_last_scrub_seconds > 35 * 86400
                  )
                for: 6h
                labels:
                  severity: warning
                annotations:
                  summary: 'ZFS pool {{ $labels.pool }} on {{ $labels.instance }} has no recent completed scrub'
                  description: >-
                    Pool {{ $labels.pool }} on {{ $labels.instance }}
                    either has never completed a scrub (timestamp 0) or
                    its last scrub finished more than 35 days ago.
                    Without scrubs, latent corruption surfaces only when
                    something reads the bad blocks (e.g. vzdump).

              # The `or ... unless` branch closes the missing-series blind
              # spot: a staleness expression produces nothing if the
              # collector never wrote a sample at all. The corosync
              # sentinel (same hosts, same scrape job) acts as the
              # existence witness — any instance reporting corosync but
              # not zpool metrics has a broken/undeployed zpool collector.
              - alert: ZFSPoolCollectorStale
                expr: >-
                  (time() - zfs_pool_status_collector_last_success_seconds > 900)
                  or on(instance) (
                    proxmox_corosync_health_collector_last_success_seconds
                    unless on(instance) zfs_pool_status_collector_last_success_seconds
                  )
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: 'zpool-status-collector is degraded or missing on {{ $labels.instance }}'
                  description: >-
                    zfs_pool_status_collector_last_success_seconds on
                    {{ $labels.instance }} is stale (>15m) or entirely
                    absent while the host reports other collector metrics —
                    the ZFS pool alerts on this host are serving stale or
                    no inputs. Check
                    `journalctl -u zpool-status-collector.service` and
                    `systemctl status zpool-status-collector.timer`.

              # ZFS pool capacity — fed by zfs_exporter on pve-nas-01
              # (NAS pools only; compute pools get capacity via the
              # node_exporter zfs collector if ever needed — the
              # integrity alerts above already cover them).
              - alert: ZFSPoolSpaceWarning
                expr: (max by (pool) (zfs_pool_allocated_bytes) / max by (pool) (zfs_pool_size_bytes)) * 100 > 80
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: 'ZFS pool {{ $labels.pool }} above 80% capacity'
                  description: 'ZFS pool {{ $labels.pool }} is at {{ $value | printf "%.1f" }}% capacity.'

              - alert: ZFSPoolSpaceCritical
                expr: (max by (pool) (zfs_pool_allocated_bytes) / max by (pool) (zfs_pool_size_bytes)) * 100 > 90
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: 'ZFS pool {{ $labels.pool }} above 90% capacity'
                  description: 'ZFS pool {{ $labels.pool }} is at {{ $value | printf "%.1f" }}% capacity.'

              - alert: EndpointDown
                expr: max by (instance) (probe_success) == 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: 'Endpoint {{ $labels.instance }} is down'
                  description: 'Blackbox probe for {{ $labels.instance }} has failed for 5 minutes.'

              - alert: BlackboxExporterDown
                expr: absent(up{job=~".*blackbox.*"} == 1)
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: 'Blackbox exporter is down'
                  description: 'All endpoint monitoring is blind — blackbox exporter has been down for 5 minutes.'

              - alert: NodeMemoryPressure
                expr: kube_node_status_condition{condition="MemoryPressure", status="true"} == 1
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: 'Node {{ $labels.node }} is under memory pressure'
                  description: 'Kubelet on {{ $labels.node }} has been reporting memory pressure for 5 minutes. Pods may be evicted.'

      homelab-scripts:
        groups:
          - name: homelab.scripts
            rules:
              - alert: ArchiveBackupFailed
                expr: archive_backup_last_run_success == 0
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: 'Archive backup failed'
                  description: 'The nightly archive backup has not completed successfully.'

              - alert: ArchiveBackupStale
                expr: (time() - archive_backup_last_success_timestamp_seconds > 86400 * 2) or absent(archive_backup_last_success_timestamp_seconds)
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: 'Archive backup has not run in over 2 days'
                  description: 'No successful archive backup has been recorded for more than 48 hours, or the metric is missing.'

              - alert: MediaMoverFailed
                expr: media_mover_last_run_success == 0
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: 'Media mover failed'
                  description: 'The media mover script has not completed successfully.'

              - alert: MediaMoverStale
                expr: (time() - media_mover_last_success_timestamp_seconds > 86400 * 2) or absent(media_mover_last_success_timestamp_seconds)
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: 'Media mover has not run in over 2 days'
                  description: 'No successful media mover run has been recorded for more than 48 hours, or the metric is missing.'

              - alert: CertRenewalFailed
                expr: cert_renewal_last_run_success == 0
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: 'Certificate renewal failed'
                  description: 'The certificate renewal and distribution script has not completed successfully.'

              - alert: CertRenewalStale
                expr: (time() - cert_renewal_last_success_timestamp_seconds > 86400 * 2) or absent(cert_renewal_last_success_timestamp_seconds)
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: 'Certificate renewal has not succeeded in over 2 days'
                  description: >-
                    No successful acme.sh certificate renewal/distribution has
                    been recorded for more than 48 hours, or the metric is
                    missing (timer removed, host off inventory). cert-manager's
                    CertExpiring alerts cover in-cluster certs but not these
                    host-distributed acme.sh certs.

      # The former homelab-backup group's ZFSPoolDegraded (zfs_exporter,
      # zfs_pool_health, NAS-only) was removed: it double-fired with the
      # textfile-collector ZFSPoolNotOnline above (zfs_pool_status_health_code,
      # all hosts, same critical severity) on a single degraded pool. There is
      # still no snapshot-staleness alert — the zfs_exporter exposes no
      # snapshot-level timestamp metric.

      homelab-temperature:
        groups:
          - name: homelab.temperature
            rules:
              # SATA drive temperatures via the drivetemp kernel module.
              # Threshold sized for the archive-pool ST6000NM0024 spinning
              # disks whose spec ceiling is 55C. Scoped to the NAS host
              # specifically because:
              #   * The other Proxmox hosts have local-ssd Samsung 870 EVO
              #     drives that the kernel's drivetemp module also reports
              #     as `chip_name="drivetemp"` (same SATA SMART path), but
              #     consumer SSDs spec a 70-85C operating ceiling and
              #     routinely run at 55-60C under k3s workloads — the alert
              #     would page on a healthy SSD.
              #   * The HDDs that this alert actually exists to protect
              #     are physically only on pve-nas-01 (archive + tank
              #     pools). Restricting `instance` keeps the alert tight.
              # If we add HDDs to another host, also extend this filter.
              - alert: SATADriveTempWarning
                expr: >-
                  max by (instance, chip) (
                    node_hwmon_temp_celsius{job="node-exporter-host", instance=~"192\\.168\\.0\\.102:.*"}
                    * on (instance, chip) group_left(chip_name)
                    node_hwmon_chip_names{job="node-exporter-host", chip_name=~"drivetemp.*"}
                  ) >= 50
                for: 15m
                labels:
                  severity: warning
                  component: storage
                annotations:
                  summary: >-
                    SATA drive on {{ $labels.instance }}
                    ({{ $labels.chip }}) at
                    {{ $value | printf "%.0f" }}C
                  description: >-
                    SATA drive {{ $labels.chip }} on {{ $labels.instance }}
                    has been at {{ $value | printf "%.0f" }}C for 15 minutes
                    (warn threshold 50C). Check airflow for that drive bay.

              - alert: SATADriveTempCritical
                expr: >-
                  max by (instance, chip) (
                    node_hwmon_temp_celsius{job="node-exporter-host", instance=~"192\\.168\\.0\\.102:.*"}
                    * on (instance, chip) group_left(chip_name)
                    node_hwmon_chip_names{job="node-exporter-host", chip_name=~"drivetemp.*"}
                  ) >= 55
                for: 5m
                labels:
                  severity: critical
                  component: storage
                annotations:
                  summary: >-
                    SATA drive on {{ $labels.instance }}
                    ({{ $labels.chip }}) at
                    {{ $value | printf "%.0f" }}C
                  description: >-
                    SATA drive {{ $labels.chip }} on {{ $labels.instance }}
                    is at {{ $value | printf "%.0f" }}C — at or above the
                    archive-pool drives' spec ceiling. Sustained over-temp is the strongest
                    accelerant for HDD failure.

              # NVMe via the in-tree nvme hwmon driver. Warning threshold is set
              # below the typical 80-82C composite warning so we get advance
              # notice; critical is set just below the throttle threshold.
              - alert: NVMeDriveTempWarning
                expr: >-
                  max by (instance, chip) (
                    node_hwmon_temp_celsius{job="node-exporter-host"}
                    * on (instance, chip) group_left(chip_name)
                    node_hwmon_chip_names{job="node-exporter-host", chip_name="nvme"}
                  ) >= 65
                for: 10m
                labels:
                  severity: warning
                  component: storage
                annotations:
                  summary: >-
                    NVMe drive on {{ $labels.instance }}
                    ({{ $labels.chip }}) at
                    {{ $value | printf "%.0f" }}C
                  description: >-
                    NVMe drive {{ $labels.chip }} on {{ $labels.instance }}
                    has been at {{ $value | printf "%.0f" }}C for 10 minutes.
                    NVMe drives throttle around 80C and warn around 82C; investigate before
                    that happens.

              - alert: NVMeDriveTempCritical
                expr: >-
                  max by (instance, chip) (
                    node_hwmon_temp_celsius{job="node-exporter-host"}
                    * on (instance, chip) group_left(chip_name)
                    node_hwmon_chip_names{job="node-exporter-host", chip_name="nvme"}
                  ) >= 75
                for: 2m
                labels:
                  severity: critical
                  component: storage
                annotations:
                  summary: >-
                    NVMe drive on {{ $labels.instance }}
                    ({{ $labels.chip }}) at
                    {{ $value | printf "%.0f" }}C
                  description: >-
                    NVMe drive {{ $labels.chip }} on {{ $labels.instance }}
                    is at {{ $value | printf "%.0f" }}C — within a few degrees of
                    thermal throttle.

              # CPU package + per-core temps via the coretemp driver. Threshold
              # is below most consumer-CPU TJunction (~100C) but well above
              # idle/normal load; 80C is the typical "high" warning level.
              - alert: CPUTempWarning
                expr: >-
                  max by (instance) (
                    node_hwmon_temp_celsius{job="node-exporter-host"}
                    * on (instance, chip) group_left(chip_name)
                    node_hwmon_chip_names{job="node-exporter-host", chip_name="coretemp"}
                  ) >= 80
                for: 10m
                labels:
                  severity: warning
                  component: cpu
                annotations:
                  summary: 'CPU on {{ $labels.instance }} sustained {{ $value | printf "%.0f" }}C'
                  description: >-
                    CPU on {{ $labels.instance }} has been at or above
                    80C for 10 minutes. Check load and fan health.

              - alert: CPUTempCritical
                expr: >-
                  max by (instance) (
                    node_hwmon_temp_celsius{job="node-exporter-host"}
                    * on (instance, chip) group_left(chip_name)
                    node_hwmon_chip_names{job="node-exporter-host", chip_name="coretemp"}
                  ) >= 90
                for: 2m
                labels:
                  severity: critical
                  component: cpu
                annotations:
                  summary: 'CPU on {{ $labels.instance }} at {{ $value | printf "%.0f" }}C'
                  description: >-
                    CPU on {{ $labels.instance }} hit
                    {{ $value | printf "%.0f" }}C — close to TJunction.
                    Thermal throttle is imminent if not already underway.

              # GPU temperatures: covers Intel xe (Arc/Battlemage on pve-nas-01
              # for Plex transcoding), nouveau (legacy NVIDIA on pve-prec-01,
              # pve-laptop-01), and amdgpu if added later.
              - alert: GPUTempWarning
                expr: >-
                  max by (instance, chip_name) (
                    node_hwmon_temp_celsius{job="node-exporter-host"}
                    * on (instance, chip) group_left(chip_name)
                    node_hwmon_chip_names{job="node-exporter-host", chip_name=~"xe|nouveau|nvidia|amdgpu|radeon"}
                  ) >= 85
                for: 5m
                labels:
                  severity: warning
                  component: gpu
                annotations:
                  summary: >-
                    GPU ({{ $labels.chip_name }}) on
                    {{ $labels.instance }} at
                    {{ $value | printf "%.0f" }}C
                  description: >-
                    GPU ({{ $labels.chip_name }}) on {{ $labels.instance }}
                    has been at or above 85C for 5 minutes.

              - alert: GPUTempCritical
                expr: >-
                  max by (instance, chip_name) (
                    node_hwmon_temp_celsius{job="node-exporter-host"}
                    * on (instance, chip) group_left(chip_name)
                    node_hwmon_chip_names{job="node-exporter-host", chip_name=~"xe|nouveau|nvidia|amdgpu|radeon"}
                  ) >= 95
                for: 1m
                labels:
                  severity: critical
                  component: gpu
                annotations:
                  summary: >-
                    GPU ({{ $labels.chip_name }}) on
                    {{ $labels.instance }} at
                    {{ $value | printf "%.0f" }}C
                  description: >-
                    GPU ({{ $labels.chip_name }}) on {{ $labels.instance }}
                    is at {{ $value | printf "%.0f" }}C — at or beyond the
                    typical thermal-shutdown threshold for consumer GPUs.

              # NIC temperature — only fires on hosts where node_exporter
              # actually publishes a nic chip (currently pve-nas-01's AQC113).
              - alert: NICTempWarning
                expr: >-
                  max by (instance, chip_name) (
                    node_hwmon_temp_celsius{job="node-exporter-host"}
                    * on (instance, chip) group_left(chip_name)
                    node_hwmon_chip_names{job="node-exporter-host", chip_name=~"nic.*"}
                  ) >= 90
                for: 10m
                labels:
                  severity: warning
                  component: network
                annotations:
                  summary: 'NIC on {{ $labels.instance }} at {{ $value | printf "%.0f" }}C'
                  description: >-
                    NIC {{ $labels.chip_name }} on {{ $labels.instance }}
                    has been at or above 90C for 10 minutes — high NIC temps correlate with
                    link instability on the AQC113.
