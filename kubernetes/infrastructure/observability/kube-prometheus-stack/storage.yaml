---
# Prometheus TSDB persistent storage
# Uses hostPath pointing to /mnt/prometheus-data on k3s-agt-nas-01.
# This directory is an ext4 filesystem on a ZFS zvol (ssd/appdata/prometheus/data).
# The zvol is attached to the VM as a SCSI disk and mounted at /mnt/prometheus-data.
# Data survives pod and VM recreation since the zvol persists on the Proxmox host's ZFS pool.
# Managed by proxmox_vm role via vm_additional_disks in hosts.yml.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-data
  labels:
    type: local
    app: prometheus
spec:
  capacity:
    storage: 150Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/prometheus-data
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-agt-nas-01

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: observability
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 150Gi
  volumeName: prometheus-data
