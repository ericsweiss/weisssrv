---
# Prometheus TSDB storage: a hostPath on k3s-agt-nas-01 backed by an ext4
# filesystem on the ssd/appdata/prometheus/data zvol, attached to the VM by the
# proxmox_vm role (vm_additional_disks in hosts.yml). Data survives pod and VM
# recreation because the zvol lives on the Proxmox host's pool.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-data
  labels:
    type: local
    app: prometheus
spec:
  capacity:
    storage: 150Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/prometheus-data
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-agt-nas-01

# Note: No PVC defined here. The kube-prometheus-stack Helm chart creates its own
# PVC via the volumeClaimTemplate in the Prometheus StatefulSet spec. The
# volumeClaimTemplate references this PV by name (volumeName: prometheus-data).
