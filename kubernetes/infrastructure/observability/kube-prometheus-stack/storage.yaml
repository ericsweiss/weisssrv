---
# Prometheus TSDB on a hostPath on k3s-agt-nas-01, backed by the
# ssd/appdata/prometheus/data zvol attached by proxmox_vm (vm_additional_disks in
# hosts.yml). Data survives pod and VM recreation.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-data
  labels:
    type: local
    app: prometheus
spec:
  capacity:
    storage: 150Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  # Pre-bound: a classless RWO PV is otherwise claimable by any classless RWO PVC
  # <=150Gi in any namespace. The claim name moves with a release rename.
  claimRef:
    namespace: observability
    name: prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0
  hostPath:
    path: /mnt/prometheus-data
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-agt-nas-01
