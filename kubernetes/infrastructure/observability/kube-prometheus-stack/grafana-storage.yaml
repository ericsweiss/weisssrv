---
# Grafana persistent storage via NFS.
# Uses the NAS appdata export (/mnt/ssd/appdata/grafana) to persist
# Grafana's SQLite database (service accounts, user preferences).
# NFS allows Grafana to float to any node in the cluster.
#
# Prerequisite: create the NFS directory on the NAS before deploying:
#   ssh eric@192.168.0.102 "sudo mkdir -p /mnt/ssd/appdata/grafana && sudo chown 1000:2000 /mnt/ssd/appdata/grafana"
# Grafana runs as UID 472 in the container, but the NFS export uses
# all_squash,anonuid=1000,anongid=2000 — all NFS operations are mapped
# to 1000:2000 regardless of client UID. The directory must be owned by
# 1000:2000 for writes to succeed.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-data
  annotations:
    # Lets Flux delete+recreate this PV when an immutable field (server,
    # mountOptions) changes, instead of stalling the Kustomization. Retain
    # reclaim policy keeps the NFS data — data safe.
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    app: grafana
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: observability
    name: grafana-data
  nfs:
    # Hostname, not IP: xprtsec=tls verifies the server cert (SAN *.esweiss.com).
    # The IP fails cert verification; pve-nas-01.esweiss.com resolves to .102 via
    # AdGuard and matches the wildcard. See docs/07 Transport Security.
    server: pve-nas-01.esweiss.com
    path: /appdata/grafana
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    # NFSv4-over-TLS: tlshd runs on every k3s agent (nfs_tls role). The
    # /appdata k3s client lines require TLS (xprtsec=tls); this option
    # completes the encrypted mount. Changing server: on a bound PV is
    # immutable — the force annotation above lets Flux delete+recreate this
    # PV (Retain → data safe) instead of stalling. See docs/16.
    - xprtsec=tls
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: observability
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: grafana-data
  resources:
    requests:
      storage: 1Gi
