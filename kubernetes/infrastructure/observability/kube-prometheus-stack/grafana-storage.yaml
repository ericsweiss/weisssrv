---
# Grafana's SQLite DB (service accounts, preferences) on the NAS appdata NFS
# export, so Grafana can float to any node. The NAS-side directory is provisioned
# by nas_storage — a from-scratch build needs `task storage:deploy`, not a mkdir.
# The export is all_squash,anonuid=1000,anongid=2000, so every write lands as
# 1000:2000 regardless of Grafana's in-container UID (472) and the directory must
# be owned by 1000:2000.
#
# NFS-over-TLS PV; hostname (not IP) + force annotation rationale:
# apps/download-clients/_nfs-pv/resources.yaml and docs/07.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-data
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    app: grafana
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: observability
    name: grafana-data
  nfs:
    server: pve-nas-01.${cluster_internal_domain}
    path: /appdata/grafana
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    - xprtsec=tls
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: observability
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: grafana-data
  resources:
    requests:
      storage: 1Gi
