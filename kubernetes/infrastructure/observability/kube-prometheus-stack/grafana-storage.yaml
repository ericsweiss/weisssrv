---
# Grafana's SQLite DB on the NAS appdata NFS export, so Grafana can float to any
# node. The export squashes writes to 1000:2000, which the NAS directory is owned
# by; provisioned by nas_storage (`task storage:deploy`). See docs/07.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-data
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    app: grafana
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: observability
    name: grafana-data
  nfs:
    server: ${cluster_nas_host}
    path: /appdata/grafana
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    - xprtsec=tls
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: observability
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: grafana-data
  resources:
    requests:
      storage: 1Gi
