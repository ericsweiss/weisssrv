---
# Observability stack secrets sourced from 1Password via ESO.
# Consumed by Grafana (OIDC SSO credentials).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-secrets
  namespace: observability
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: observability-secrets
    creationPolicy: Owner
  data:
    # Grafana OIDC credentials (Authentik)
    - secretKey: grafana-oidc-client-id
      remoteRef:
        key: Grafana SSO
        property: oidc-client-id
    - secretKey: grafana-oidc-client-secret
      remoteRef:
        key: Grafana SSO
        property: oidc-client-secret
