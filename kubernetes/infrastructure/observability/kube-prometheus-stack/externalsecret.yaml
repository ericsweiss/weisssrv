---
# Observability stack secrets sourced from 1Password via ESO.
# Consumed by Alertmanager (SMTP + Discord) and Grafana (OIDC).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-secrets
  namespace: observability
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: observability-secrets
    creationPolicy: Owner
  data:
    # SMTP credentials for Alertmanager email alerts
    - secretKey: smtp-username
      remoteRef:
        key: t7467o7ebr72s2ao223mtbv6ba/username  # SMTP Relay Auth
    - secretKey: smtp-password
      remoteRef:
        key: t7467o7ebr72s2ao223mtbv6ba/password  # SMTP Relay Auth
    # Discord webhook for Alertmanager notifications
    - secretKey: discord-webhook-url
      remoteRef:
        key: fv3snwstrvyzmosirlw4hl6cdm/url  # Discord Alert Webhook
    # Grafana OIDC credentials (Authentik)
    - secretKey: grafana-oidc-client-id
      remoteRef:
        key: 5qwvn5zvsskqeyahrsdjqzbxcy/oidc-client-id  # Grafana SSO    - secretKey: grafana-oidc-client-secret
      remoteRef:
        key: 5qwvn5zvsskqeyahrsdjqzbxcy/oidc-client-secret  # Grafana SSO