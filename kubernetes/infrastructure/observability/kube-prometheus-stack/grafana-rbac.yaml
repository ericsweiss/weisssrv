---
# Replaces the grafana subchart's ClusterRole + Binding (`grafana.rbac.create: false`):
# the chart grants cluster-wide `secrets` get/list/watch whenever a sidecar is on,
# and both sidecars here are configmap-only. docs/31 Grafana RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-prometheus-stack-grafana-configmaps
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: kube-prometheus-stack
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "watch", "list"]
---
# The matching binding; the chart's own pair is suppressed by grafana.rbac.create: false.
# Subject stays in sync with the chart's ServiceAccount name
# (`grafana.fullname` = <release>-grafana), whose token the sidecars mount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-prometheus-stack-grafana-configmaps
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: kube-prometheus-stack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-prometheus-stack-grafana-configmaps
subjects:
  - kind: ServiceAccount
    name: kube-prometheus-stack-grafana
    namespace: observability
