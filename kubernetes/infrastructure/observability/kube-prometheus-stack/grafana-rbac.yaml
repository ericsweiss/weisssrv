---
# Replacement for the grafana subchart's own ClusterRole + ClusterRoleBinding,
# selected by `grafana.rbac.create: false` in release.yaml.
#
# WHY: the chart hard-codes `resources: ["configmaps", "secrets"]` whenever any
# sidecar is enabled, so the stock install gives the Grafana ServiceAccount
# cluster-wide `secrets` get/list/watch — every credential in the cluster, on a
# user-facing web app reachable from the LAN, the tailnet and every pod. Nothing
# here needs Secrets: both sidecars are pinned to `resource: configmap` in
# release.yaml, so re-adding `secrets` would take two deliberate edits.
#
# WHY BOTH OBJECTS, and NOT `rbac.useExistingClusterRole`: that keeps the chart's
# fixed-name binding and only swaps its roleRef, which is IMMUTABLE — the apply
# is rejected, and because the binding sorts before the Deployment the whole
# release upgrade rolls back on every reconcile. Disabling the chart's RBAC makes
# the binding below a NEW object and lets Helm delete the two it used to own.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-prometheus-stack-grafana-configmaps
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: kube-prometheus-stack
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "watch", "list"]
---
# The binding the chart no longer ships. Subject must stay in sync with the
# chart's ServiceAccount name (`grafana.fullname` = <release>-grafana); the
# sidecars mount that SA's token via the projected volume in release.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-prometheus-stack-grafana-configmaps
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: kube-prometheus-stack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-prometheus-stack-grafana-configmaps
subjects:
  - kind: ServiceAccount
    name: kube-prometheus-stack-grafana
    namespace: observability
