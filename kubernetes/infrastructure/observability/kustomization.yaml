---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - kube-prometheus-stack
  - loki
  - alloy
  - exporters
  - service-monitors
  - ingress
  - dashboards
  - vpa.yaml

# default-deny-ingress from the shared baseline component (see
# kubernetes/components/netpol-baseline).
components:
  - ../../components/netpol-baseline
