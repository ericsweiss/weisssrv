---
# The observability stack: kube-prometheus-stack (Prometheus/Grafana/
# Alertmanager/kube-state-metrics), Loki + Alloy, the exporters and their
# ServiceMonitors, the custom PrometheusRules, ingress and the VPA policies.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - kube-prometheus-stack
  - loki
  - alloy
  - alloy-syslog
  - exporters
  - service-monitors
  - rules
  - ingress
  - dashboards
  - vpa.yaml

components:
  - ../../components/netpol-baseline
