---
# Blackbox exporter + its probe target list. Every https target feeds the generic
# EndpointDown alert; the three load-bearing hostnames also feed
# EndpointDownCritical, and every *.ericsweiss.com target feeds
# BlackboxCertExpiringSoon (rules/monitoring.yaml). The icmp_ping targets are
# the exception: they are excluded from EndpointDown and feed the purpose-built
# NetworkGearProbeFailed instead.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: observability
spec:
  interval: 30m
  releaseName: blackbox-exporter
  # Correct out-of-band edits to chart-rendered objects — see the rationale on
  # controllers/traefik/release.yaml. Safe here: no webhook, no autoscaler.
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: "${helm_chart_versions_prometheus_blackbox_exporter}"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 10s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            follow_redirects: true
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: false
        # For targets fronted by an auth gate. The probe verifies ingress + TLS +
        # backend reachability, not an authenticated session: 301/302 is a
        # redirect to a login, 401/403 an auth or IP-allowlist rejection — all
        # proof the router and backend are alive, while a real outage still
        # returns 502/503 or times out.
        http_sso:
          prober: http
          timeout: 10s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            valid_status_codes: [200, 301, 302, 401, 403]
            follow_redirects: false
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: false
        # http_sso plus 404, for the GitLab Pages apex hosts: no project is
        # mapped to the apex, so 404 is the healthy answer there.
        http_pages:
          prober: http
          timeout: 10s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            valid_status_codes: [200, 301, 302, 401, 403, 404]
            follow_redirects: false
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: false
        dns_resolution:
          prober: dns
          timeout: 5s
          dns:
            query_name: ${cluster_internal_domain}
            query_type: A
            valid_rcodes:
              - NOERROR
        icmp_ping:
          prober: icmp
          timeout: 5s
        tcp_connect:
          prober: tcp
          timeout: 5s
    serviceMonitor:
      enabled: true
      defaults:
        interval: 60s
      targets:
        - name: grafana
          url: https://grafana.${cluster_internal_domain}
          module: http_2xx
        - name: authentik
          url: https://auth.${cluster_internal_domain}
          module: http_2xx
        - name: traefik
          url: https://traefik.${cluster_internal_domain}
          # SSO-fronted since the dashboard gained forward-auth: a 302 to
          # Authentik is the healthy shape.
          module: http_sso
        - name: sonarr
          url: https://tv.${cluster_internal_domain}
          module: http_sso
        - name: radarr
          url: https://movies.${cluster_internal_domain}
          module: http_sso
        - name: lidarr
          url: https://music.${cluster_internal_domain}
          module: http_sso
        - name: prowlarr
          url: https://prowlarr.${cluster_internal_domain}
          module: http_sso
        - name: nzbget
          url: https://nzbget.${cluster_internal_domain}
          module: http_sso
        - name: qbittorrent
          url: https://qbittorrent.${cluster_internal_domain}
          module: http_sso
        - name: mealie
          url: https://food.${cluster_internal_domain}
          module: http_sso
        - name: bar-assistant
          url: https://bar.${cluster_internal_domain}
          module: http_sso
        - name: hermes
          url: https://agent.${cluster_internal_domain}
          module: http_sso
        # Separate Traefik router from the dashboard above; `/` is a 404, so
        # probe /health.
        - name: hermes-api
          url: https://agent-api.${cluster_internal_domain}/health
          module: http_2xx
        - name: homarr
          url: https://dashboard.${cluster_internal_domain}
          module: http_sso
        # Uptime Kuma, internal PUBLIC router: `/` 302s to the entry status
        # page, and the probe must FOLLOW it — http_sso accepts the 302
        # itself, which would stay green even when the redirect target is
        # broken. RED until the docs/45 first-run checklist sets the entry
        # status page.
        - name: uptime-kuma
          url: https://status.${cluster_internal_domain}
          module: http_2xx
        # Uptime Kuma, internal ADMIN router: a separate Traefik router with the
        # forward-auth middleware, which the `/` probe above never touches. A
        # 302 to Authentik is the healthy answer.
        - name: uptime-kuma-admin
          url: https://status.${cluster_internal_domain}/dashboard
          module: http_sso
        - name: plex
          url: https://plex.${cluster_internal_domain}
          module: http_sso
        - name: home-assistant
          url: https://home.${cluster_internal_domain}
          module: http_sso
        - name: gitlab
          url: https://git.${cluster_internal_domain}
          module: http_2xx
        - name: nextcloud
          url: https://cloud.${cluster_internal_domain}
          module: http_sso
        - name: immich
          url: https://photos.${cluster_internal_domain}
          module: http_sso
        - name: pulsarr
          url: https://pulsarr.${cluster_internal_domain}
          module: http_sso
        # ADMIN UI only: the WAN WireGuard endpoint is UDP and unprobeable
        # here — WgEasyEndpointVipMissing watches that datapath instead.
        - name: wg-easy
          url: https://vpn.${cluster_internal_domain}
          module: http_sso
        # Host-side Alloy's log-shipping path (loki-push-auth 401s unauthenticated).
        - name: loki-push
          url: https://loki.${cluster_internal_domain}
          module: http_sso
        # The ingress + TLS hop for 1Password Connect, which no other alert
        # covers. /health, not / (404); its access-controlled IngressRoute
        # returns 403 to this pod's source.
        - name: onepassword-connect
          url: https://connect.${cluster_internal_domain}/health
          module: http_sso
        # AdGuard UIs: adguard*/dns-0* are two router pairs onto the same two
        # resolvers. Management path only — resolver FUNCTION is covered by the
        # DNS probes below.
        - name: adguard-dns-01
          url: https://adguard.${cluster_internal_domain}
          module: http_sso
        - name: adguard-dns-02
          url: https://adguard-02.${cluster_internal_domain}
          module: http_sso
        - name: adguard-ui-dns-01
          url: https://dns-01.${cluster_internal_domain}
          module: http_sso
        - name: adguard-ui-dns-02
          url: https://dns-02.${cluster_internal_domain}
          module: http_sso
        # Router admin UI: its route's lan-tailscale-STRICT middleware drops the
        # pod CIDR, so this probe gets a 403 and covers the Traefik router +
        # cert, not the web UI behind it.
        - name: router
          url: https://router.${cluster_internal_domain}
          module: http_sso
        - name: dns-01
          url: 192.168.0.150:53
          module: dns_resolution
        - name: dns-02
          url: 192.168.0.160:53
          module: dns_resolution
        - name: smtp-relay
          url: smtp-relay.${cluster_internal_domain}:587
          module: tcp_connect
        - name: k3s-api-vip
          url: ${cluster_api_vip}:6443
          module: tcp_connect
        # Windows 11 VM RDP reachability (docs/39). WindowsRdpDown is gated on
        # pve_up{id="qemu/155"}: the desktop auto-starts after every NAS unlock
        # but an operator may shut it down at any time.
        - name: windows-rdp
          url: 192.168.0.155:3389
          module: tcp_connect
        # UniFi network gear (docs/46). ICMP, not tcp_connect: the switch and AP
        # expose no management port worth probing — they are adopted by the
        # gateway's controller — so liveness is the only signal available, and
        # the gateway is probed the same way for a uniform NetworkGearProbeFailed
        # expression. The two mgmt addresses sit on VLAN 1 (10.0.1.0/24), which
        # the cluster reaches through the gateway.
        #
        # EXPECTED RED until the UniFi cutover (docs/46): the switch and AP do
        # not answer at these addresses while the ASUS router is still in place.
        - name: unifi-gateway
          url: 192.168.0.1
          module: icmp_ping
        - name: unifi-switch
          url: 10.0.1.2
          module: icmp_ping
        - name: unifi-ap
          url: 10.0.1.3
          module: icmp_ping
        # GitLab Container Registry: its own router and certificate, which the
        # git.esweiss.com probe does not cover (a broken registry otherwise
        # surfaces only as a mid-pipeline ImagePullBackOff). http_sso tolerates
        # both the 200 it answers today and a future 401.
        - name: gitlab-registry
          url: https://registry.git.${cluster_internal_domain}
          module: http_sso
        # GitLab Pages: its own router, backend port and certificate, so the
        # git.* probes cover none of it. The apex has no project mapped and
        # answers 404 — hence http_pages; a broken router/backend still 502s.
        - name: gitlab-pages
          url: https://pages.git.${cluster_internal_domain}
          module: http_pages
        # External path (Cloudflare -> WAN -> MetalLB .100): catches DDNS drift
        # and public-ingress breakage the internal probes cannot see. AdGuard
        # rewrites only *.esweiss.com, so every *.ericsweiss.com probe below
        # genuinely leaves the LAN — except auth.ericsweiss.com, see its target.
        # Each externally-published app is probed on BOTH names, with modules
        # mirroring its internal probe.
        - name: home-assistant-external
          url: https://home.${cluster_external_domain}
          module: http_2xx
        - name: gitlab-external
          url: https://git.${cluster_external_domain}
          module: http_2xx
        - name: gitlab-registry-external
          url: https://registry.git.${cluster_external_domain}
          module: http_sso
        # Same router/cert reasoning as the internal pages probe above.
        - name: gitlab-pages-external
          url: https://pages.git.${cluster_external_domain}
          module: http_pages
        # NOT external despite the hostname: auth.ericsweiss.com is the AdGuard
        # split-horizon exception (group_vars/dns.yml), so this probes the
        # internal VIP — the same path server-side OIDC discovery takes, on a
        # different router and cert from the auth.esweiss.com probe. The public
        # front door cannot be probed from in-cluster while the rewrite stands.
        - name: authentik-oidc-issuer
          url: https://auth.${cluster_external_domain}
          module: http_2xx
        - name: nextcloud-external
          url: https://cloud.${cluster_external_domain}
          module: http_sso
        # DNS-only (proxy-bypassed) CNAME so large uploads skip Cloudflare —
        # which also leaves it the name most exposed to DDNS drift.
        - name: immich-external
          url: https://photos.${cluster_external_domain}
          module: http_sso
        - name: hermes-external
          url: https://agent.${cluster_external_domain}
          module: http_sso
        - name: homarr-external
          url: https://dashboard.${cluster_external_domain}
          module: http_sso
        # The public status page — the one target whose whole point is being
        # reachable WITHOUT a session, so the probe follows the entry-page
        # redirect to a real 200 (http_sso would bless the 302 alone, masking
        # a 404 target). RED until the entry status page is set (docs/45).
        - name: uptime-kuma-external
          url: https://status.${cluster_external_domain}
          module: http_2xx
        - name: mealie-external
          url: https://food.${cluster_external_domain}
          module: http_sso
        - name: bar-assistant-external
          url: https://bar.${cluster_external_domain}
          module: http_sso
        - name: plex-external
          url: https://plex.${cluster_external_domain}
          module: http_sso
        # Web IDE extension host: a separate router and origin from
        # git.ericsweiss.com, whose SOP isolation is load-bearing (docs/27).
        - name: gitlab-webide-external
          url: https://ide.git.${cluster_external_domain}
          module: http_sso
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 64Mi
