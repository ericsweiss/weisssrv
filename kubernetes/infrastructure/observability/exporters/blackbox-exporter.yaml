---
# Blackbox exporter and its probe target list. rules/monitoring.yaml owns which
# targets feed EndpointDown / EndpointDownCritical / BlackboxCertExpiringSoon /
# NetworkGearProbeFailed, including their exclusions.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: observability
spec:
  interval: 30m
  releaseName: blackbox-exporter
  # Correct out-of-band edits to chart-rendered objects — see the rationale on
  # controllers/traefik/release.yaml. Safe here: no webhook, no autoscaler.
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: "${helm_chart_versions_prometheus_blackbox_exporter}"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # icmp_ping needs the pod's gid inside net.ipv4.ping_group_range for an
    # unprivileged ICMP socket; Debian ships an empty range, so every icmp probe
    # fails without this. Narrower than NET_RAW, which covers every socket.
    podSecurityContext:
      sysctls:
        - name: net.ipv4.ping_group_range
          value: "0 2147483647"
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 10s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            follow_redirects: true
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: false
        # For targets behind an auth gate: 301/302/401/403 all prove the router and
        # backend are alive, while a real outage returns 502/503 or times out.
        http_sso:
          prober: http
          timeout: 10s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            valid_status_codes: [200, 301, 302, 401, 403]
            follow_redirects: false
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: false
        # http_sso plus 404, for the GitLab Pages apex hosts: no project is
        # mapped to the apex, so 404 is the healthy answer there.
        http_pages:
          prober: http
          timeout: 10s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            valid_status_codes: [200, 301, 302, 401, 403, 404]
            follow_redirects: false
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: false
        dns_resolution:
          prober: dns
          timeout: 5s
          dns:
            query_name: ${cluster_internal_domain}
            query_type: A
            valid_rcodes:
              - NOERROR
        icmp_ping:
          prober: icmp
          timeout: 5s
        tcp_connect:
          prober: tcp
          timeout: 5s
    serviceMonitor:
      enabled: true
      defaults:
        interval: 60s
      targets:
        - name: grafana
          url: https://grafana.${cluster_internal_domain}
          module: http_2xx
        - name: authentik
          url: https://auth.${cluster_internal_domain}
          module: http_2xx
        - name: traefik
          url: https://traefik.${cluster_internal_domain}
          # SSO-fronted: a 302 to Authentik is the healthy shape.
          module: http_sso
        - name: sonarr
          url: https://tv.${cluster_internal_domain}
          module: http_sso
        - name: radarr
          url: https://movies.${cluster_internal_domain}
          module: http_sso
        - name: lidarr
          url: https://music.${cluster_internal_domain}
          module: http_sso
        - name: prowlarr
          url: https://prowlarr.${cluster_internal_domain}
          module: http_sso
        - name: nzbget
          url: https://nzbget.${cluster_internal_domain}
          module: http_sso
        - name: qbittorrent
          url: https://qbittorrent.${cluster_internal_domain}
          module: http_sso
        - name: mealie
          url: https://food.${cluster_internal_domain}
          module: http_sso
        - name: bar-assistant
          url: https://bar.${cluster_internal_domain}
          module: http_sso
        - name: hermes
          url: https://agent.${cluster_internal_domain}
          module: http_sso
        # Separate Traefik router from the dashboard above; `/` is a 404, so
        # probe /health.
        - name: hermes-api
          url: https://agent-api.${cluster_internal_domain}/health
          module: http_2xx
        - name: homarr
          url: https://dashboard.${cluster_internal_domain}
          module: http_sso
        # Uptime Kuma, internal PUBLIC router: `/` 302s to the entry status page
        # and the probe must FOLLOW it — http_sso accepts the 302 itself and
        # would stay green with a broken redirect target.
        - name: uptime-kuma
          url: https://status.${cluster_internal_domain}
          module: http_2xx
        # Uptime Kuma, internal ADMIN router: a separate Traefik router with the
        # forward-auth middleware, which the `/` probe above never touches. A
        # 302 to Authentik is the healthy answer.
        - name: uptime-kuma-admin
          url: https://status.${cluster_internal_domain}/dashboard
          module: http_sso
        - name: plex
          url: https://plex.${cluster_internal_domain}
          module: http_sso
        - name: home-assistant
          url: https://home.${cluster_internal_domain}
          module: http_sso
        - name: gitlab
          url: https://git.${cluster_internal_domain}
          module: http_2xx
        - name: nextcloud
          url: https://cloud.${cluster_internal_domain}
          module: http_sso
        - name: immich
          url: https://photos.${cluster_internal_domain}
          module: http_sso
        - name: pulsarr
          url: https://pulsarr.${cluster_internal_domain}
          module: http_sso
        # ADMIN UI only: the WAN WireGuard endpoint is UDP and unprobeable
        # here — WgEasyEndpointVipMissing watches that datapath instead.
        - name: wg-easy
          url: https://vpn.${cluster_internal_domain}
          module: http_sso
        # Host-side Alloy's log-shipping path (loki-push-auth 401s unauthenticated).
        - name: loki-push
          url: https://loki.${cluster_internal_domain}/loki/api/v1/push
          module: http_sso
        # The ingress + TLS hop for 1Password Connect, which no other alert
        # covers. /health, not / (404); its access-controlled IngressRoute
        # returns 403 to this pod's source.
        - name: onepassword-connect
          url: https://connect.${cluster_internal_domain}/health
          module: http_sso
        # AdGuard UIs: adguard*/dns-0* are two router pairs onto the same two
        # resolvers. Management path only — resolver FUNCTION is covered by the
        # DNS probes below.
        - name: adguard-dns-01
          url: https://adguard.${cluster_internal_domain}
          module: http_sso
        - name: adguard-dns-02
          url: https://adguard-02.${cluster_internal_domain}
          module: http_sso
        - name: adguard-ui-dns-01
          url: https://dns-01.${cluster_internal_domain}
          module: http_sso
        - name: adguard-ui-dns-02
          url: https://dns-02.${cluster_internal_domain}
          module: http_sso
        # Router admin UI: its route's lan-tailscale-STRICT middleware drops the
        # pod CIDR, so this probe gets a 403 and covers the Traefik router +
        # cert, not the web UI behind it.
        - name: router
          url: https://router.${cluster_internal_domain}
          module: http_sso
        - name: dns-01
          url: 10.0.10.150:53
          module: dns_resolution
        - name: dns-02
          url: 10.0.10.160:53
          module: dns_resolution
        - name: smtp-relay
          url: ${cluster_smtp_host}:587
          module: tcp_connect
        - name: k3s-api-vip
          url: ${cluster_api_vip}:6443
          module: tcp_connect
        # Windows 11 VM RDP reachability (docs/39). WindowsRdpDown is gated on
        # pve_up{id="qemu/155"}: the desktop auto-starts after every NAS unlock
        # but an operator may shut it down at any time.
        - name: windows-rdp
          url: 10.0.10.155:3389
          module: tcp_connect
        # UniFi network gear (docs/46). ICMP because the switch and AP expose no
        # management port — liveness is the only signal. The VLAN-1 mgmt addresses
        # are reachable via terraform/unifi's homelab-to-internal-icmp policy pair.
        - name: unifi-gateway
          url: ${cluster_lan_gateway}
          module: icmp_ping
        - name: unifi-switch
          url: 10.0.1.2
          module: icmp_ping
        - name: unifi-ap
          url: 10.0.1.3
          module: icmp_ping
        # Outside-in WAN witness, not a monitored device: ExternalIngressDown
        # suppresses on it to tell an upstream outage from a public-ingress
        # fault, InternetProbeMissing pins it, and EndpointDown excludes it.
        - name: internet-witness
          url: 1.1.1.1
          module: icmp_ping
        # GitLab Container Registry: its own router and certificate, not covered by
        # the git probe. http_sso tolerates both the 200 it answers and a future 401.
        - name: gitlab-registry
          url: https://registry.git.${cluster_internal_domain}
          module: http_sso
        # GitLab Pages: its own router, backend port and certificate, so the
        # git.* probes cover none of it. The apex has no project mapped and
        # answers 404 — hence http_pages; a broken router/backend still 502s.
        - name: gitlab-pages
          url: https://pages.git.${cluster_internal_domain}
          module: http_pages
        # External path (Cloudflare -> WAN -> MetalLB .100): catches DDNS drift and
        # public-ingress breakage the internal probes cannot see. The five
        # cross-domain rewrites below are the exceptions and each says so.
        - name: home-assistant-external
          url: https://home.${cluster_external_domain}
          module: http_2xx
        # Split-horizon exception: the git/registry.git/pages.git family resolves
        # internally (docs/08), so these probe the internal VIP over the external
        # routers and certs; gitlab-webide-external covers the public path.
        - name: gitlab-external
          url: https://git.${cluster_external_domain}
          module: http_2xx
        - name: gitlab-registry-external
          url: https://registry.git.${cluster_external_domain}
          module: http_sso
        # Same router/cert reasoning as the internal pages probe above.
        - name: gitlab-pages-external
          url: https://pages.git.${cluster_external_domain}
          module: http_pages
        # Split-horizon exception (docs/08): this probes the internal VIP over the
        # external router and cert — the path server-side OIDC discovery takes.
        - name: authentik-oidc-issuer
          url: https://auth.${cluster_external_domain}
          module: http_2xx
        - name: nextcloud-external
          url: https://cloud.${cluster_external_domain}
          module: http_sso
        # Split-horizon exception (docs/08): photos.${cluster_external_domain} is
        # rewritten to the public VIP, so this probes the external router and
        # cert from the LAN and does not witness DDNS drift.
        - name: immich-external
          url: https://photos.${cluster_external_domain}
          module: http_sso
        - name: hermes-external
          url: https://agent.${cluster_external_domain}
          module: http_sso
        - name: homarr-external
          url: https://dashboard.${cluster_external_domain}
          module: http_sso
        # The public status page, reachable WITHOUT a session, so the probe
        # follows the entry-page redirect to a real 200 (http_sso would bless
        # the 302 alone and mask a 404 target).
        - name: uptime-kuma-external
          url: https://status.${cluster_external_domain}
          module: http_2xx
        - name: mealie-external
          url: https://food.${cluster_external_domain}
          module: http_sso
        - name: bar-assistant-external
          url: https://bar.${cluster_external_domain}
          module: http_sso
        - name: plex-external
          url: https://plex.${cluster_external_domain}
          module: http_sso
        # Web IDE extension host: a separate router and origin from
        # git.ericsweiss.com, whose SOP isolation is load-bearing (docs/27).
        - name: gitlab-webide-external
          url: https://ide.git.${cluster_external_domain}
          module: http_sso
    # The probe fleet's working set already peaks above 64Mi, so the limit is
    # the OOM ceiling a pod admitted without the VPA webhook has to fit under.
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 128Mi
