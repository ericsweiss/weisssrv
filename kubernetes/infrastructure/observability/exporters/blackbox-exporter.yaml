---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: observability
spec:
  interval: 30m
  releaseName: blackbox-exporter
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: "${helm_chart_versions_prometheus_blackbox_exporter}"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 10s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            follow_redirects: true
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: false
        http_sso:
          prober: http
          timeout: 10s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            valid_status_codes: [200, 301, 302, 401, 403]
            follow_redirects: false
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: false
        dns_resolution:
          prober: dns
          timeout: 5s
          dns:
            query_name: esweiss.com
            query_type: A
            valid_rcodes:
              - NOERROR
        icmp_ping:
          prober: icmp
          timeout: 5s
        tcp_connect:
          prober: tcp
          timeout: 5s
    serviceMonitor:
      enabled: true
      defaults:
        interval: 60s
      targets:
        - name: grafana
          url: https://grafana.esweiss.com
          module: http_2xx
        - name: authentik
          url: https://auth.esweiss.com
          module: http_2xx
        - name: traefik
          url: https://traefik.esweiss.com
          module: http_2xx
        - name: sonarr
          url: https://tv.esweiss.com
          module: http_sso
        - name: radarr
          url: https://movies.esweiss.com
          module: http_sso
        - name: lidarr
          url: https://music.esweiss.com
          module: http_sso
        - name: prowlarr
          url: https://prowlarr.esweiss.com
          module: http_sso
        - name: nzbget
          url: https://nzbget.esweiss.com
          module: http_sso
        - name: qbittorrent
          url: https://qbittorrent.esweiss.com
          module: http_sso
        - name: mealie
          url: https://food.esweiss.com
          module: http_sso
        - name: bar-assistant
          url: https://bar.esweiss.com
          module: http_sso
        - name: plex
          url: https://plex.esweiss.com
          module: http_sso
        - name: home-assistant
          url: https://home.esweiss.com
          module: http_sso
        - name: gitlab
          url: https://git.esweiss.com
          module: http_2xx
        - name: pulsarr
          url: https://pulsarr.esweiss.com
          module: http_sso
        # wg-easy admin UI reachability. It sits behind authentik-auth
        # ForwardAuth, so an unauthenticated probe gets a 302 to Authentik —
        # http_sso (accepts 200/301/302/401/403) verifies the ingress + TLS +
        # ForwardAuth hop are alive. EndpointDown fires on probe_success==0.
        - name: wg-easy
          url: https://vpn.esweiss.com
          module: http_sso
        # Host-side Alloy's log-shipping path: loki-push-auth returns 401
        # without credentials, which http_sso accepts — the probe verifies the
        # ingress + TLS + Loki hop, not auth.
        - name: loki-push
          url: https://loki.esweiss.com
          module: http_sso
        - name: dns-01
          url: 192.168.0.150:53
          module: dns_resolution
        - name: dns-02
          url: 192.168.0.160:53
          module: dns_resolution
        - name: smtp-relay
          url: smtp-relay.esweiss.com:587
          module: tcp_connect
        - name: k3s-api-vip
          url: 192.168.0.161:6443
          module: tcp_connect
        # External path (Cloudflare -> WAN -> MetalLB .100): catches DDNS
        # drift and public-ingress breakage that the internal probes can't see.
        - name: home-assistant-external
          url: https://home.ericsweiss.com
          module: http_2xx
        - name: gitlab-external
          url: https://git.ericsweiss.com
          module: http_2xx
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 64Mi
