---
# Blackbox exporter + its probe target list. Every https target feeds the generic
# EndpointDown alert; the three load-bearing hostnames also feed
# EndpointDownCritical, and every *.ericsweiss.com target feeds
# BlackboxCertExpiringSoon (rules/monitoring.yaml).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: observability
spec:
  interval: 30m
  releaseName: blackbox-exporter
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: "${helm_chart_versions_prometheus_blackbox_exporter}"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 10s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            follow_redirects: true
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: false
        http_sso:
          prober: http
          timeout: 10s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            valid_status_codes: [200, 301, 302, 401, 403]
            follow_redirects: false
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: false
        dns_resolution:
          prober: dns
          timeout: 5s
          dns:
            query_name: esweiss.com
            query_type: A
            valid_rcodes:
              - NOERROR
        icmp_ping:
          prober: icmp
          timeout: 5s
        tcp_connect:
          prober: tcp
          timeout: 5s
    serviceMonitor:
      enabled: true
      defaults:
        interval: 60s
      targets:
        - name: grafana
          url: https://grafana.esweiss.com
          module: http_2xx
        - name: authentik
          url: https://auth.esweiss.com
          module: http_2xx
        - name: traefik
          url: https://traefik.esweiss.com
          module: http_2xx
        - name: sonarr
          url: https://tv.esweiss.com
          module: http_sso
        - name: radarr
          url: https://movies.esweiss.com
          module: http_sso
        - name: lidarr
          url: https://music.esweiss.com
          module: http_sso
        - name: prowlarr
          url: https://prowlarr.esweiss.com
          module: http_sso
        - name: nzbget
          url: https://nzbget.esweiss.com
          module: http_sso
        - name: qbittorrent
          url: https://qbittorrent.esweiss.com
          module: http_sso
        - name: mealie
          url: https://food.esweiss.com
          module: http_sso
        - name: bar-assistant
          url: https://bar.esweiss.com
          module: http_sso
        # Hermes dashboard: an unauthenticated probe is answered by its OIDC
        # gate with a 302, which http_sso accepts (docs/37 §SSO).
        - name: hermes
          url: https://agent.esweiss.com
          module: http_sso
        # The gateway API is a separate Traefik router from the dashboard above
        # and is the path the agent itself serves on. `/` is a 404, so the probe
        # targets its health endpoint.
        - name: hermes-api
          url: https://agent-api.esweiss.com/health
          module: http_2xx
        # Homarr answers an unauthenticated probe with a 302 to its OIDC login.
        - name: homarr
          url: https://dashboard.esweiss.com
          module: http_sso
        - name: plex
          url: https://plex.esweiss.com
          module: http_sso
        - name: home-assistant
          url: https://home.esweiss.com
          module: http_sso
        - name: gitlab
          url: https://git.esweiss.com
          module: http_2xx
        # SSO-only: the root redirects to Authentik (302). Like every http_sso
        # target here, the probe verifies ingress + TLS + backend reachability,
        # not an authenticated session.
        - name: nextcloud
          url: https://cloud.esweiss.com
          module: http_sso
        # Immich answers 200 directly today (the SPA redirects client-side);
        # http_sso keeps the probe correct if a server-side SSO gate ever lands.
        - name: immich
          url: https://photos.esweiss.com
          module: http_sso
        - name: pulsarr
          url: https://pulsarr.esweiss.com
          module: http_sso
        # wg-easy ADMIN UI only — behind authentik-auth ForwardAuth, so the
        # probe verifies the ingress + TLS + ForwardAuth hop. The WAN WireGuard
        # endpoint itself is UDP and unprobeable here; WgEasyEndpointVipMissing
        # (rules/infrastructure.yaml) watches that datapath instead.
        - name: wg-easy
          url: https://vpn.esweiss.com
          module: http_sso
        # Host-side Alloy's log-shipping path: loki-push-auth returns 401
        # without credentials, which http_sso accepts.
        - name: loki-push
          url: https://loki.esweiss.com
          module: http_sso
        # 1Password Connect is the secrets backend for every ExternalSecret AND
        # the ZFS key-load path at boot. OnePasswordConnectDown watches the
        # Deployment and ExternalSecretSyncFailure the consumer; neither covers
        # the ingress + TLS hop. `/` is a 404, so probe the health endpoint.
        - name: onepassword-connect
          url: https://connect.esweiss.com/health
          module: http_2xx
        # AdGuard UIs. adguard*/dns-0* are two router pairs onto the same two
        # resolvers: the adguard* names sit behind Authentik ForwardAuth (302 to
        # auth), the dns-0* names go straight to AdGuard's own login (302).
        # Resolver FUNCTION is covered by the DNS probes below; these cover the
        # management path.
        - name: adguard-dns-01
          url: https://adguard.esweiss.com
          module: http_sso
        - name: adguard-dns-02
          url: https://adguard-02.esweiss.com
          module: http_sso
        - name: adguard-ui-dns-01
          url: https://dns-01.esweiss.com
          module: http_sso
        - name: adguard-ui-dns-02
          url: https://dns-02.esweiss.com
          module: http_sso
        - name: dns-01
          url: 192.168.0.150:53
          module: dns_resolution
        - name: dns-02
          url: 192.168.0.160:53
          module: dns_resolution
        - name: smtp-relay
          url: smtp-relay.esweiss.com:587
          module: tcp_connect
        - name: k3s-api-vip
          url: 192.168.0.161:6443
          module: tcp_connect
        # Windows 11 VM RDP reachability — target is live/armed (docs/39). Feeds
        # the WindowsRdpDown alert (kube-prometheus-stack release.yaml,
        # homelab.monitoring); instance is "192.168.0.155:3389". VM 155 is a
        # start-on-demand desktop (onboot=0) that is off much of the time, so
        # WindowsRdpDown is gated on the VM actually being powered on
        # (pve_up{id="qemu/155"}) — it stays silent while the VM is intentionally
        # stopped and only fires when RDP is dead on a running VM.
        - name: windows-rdp
          url: 192.168.0.155:3389
          module: tcp_connect
        # GitLab Container Registry — every CI image pull and push goes through
        # it, and it has its own Traefik router and certificate, so neither the
        # git.esweiss.com probe nor the runner jobs' failure mode covers it
        # (a broken registry surfaces as a mid-pipeline ImagePullBackOff).
        # Unauthenticated GET / answers 200 today; http_sso also tolerates the
        # 401 the registry API returns if that ever changes.
        - name: gitlab-registry
          url: https://registry.git.esweiss.com
          module: http_sso
        # External path (Cloudflare -> WAN -> MetalLB .100): catches DDNS drift
        # and public-ingress breakage the internal probes cannot see. AdGuard
        # rewrites only *.esweiss.com, so every *.ericsweiss.com probe below
        # genuinely leaves the LAN — except auth.ericsweiss.com, see its target.
        # Each externally-published app is probed on BOTH names, with modules
        # mirroring its internal probe.
        - name: home-assistant-external
          url: https://home.ericsweiss.com
          module: http_2xx
        - name: gitlab-external
          url: https://git.ericsweiss.com
          module: http_2xx
        - name: gitlab-registry-external
          url: https://registry.git.ericsweiss.com
          module: http_sso
        # NOT an external probe despite the hostname: auth.ericsweiss.com is the
        # AdGuard split-horizon exception (group_vars/dns.yml), so this pod
        # reaches the INTERNAL Traefik VIP with that SNI — exactly the path every
        # server-side OIDC discovery/JWKS fetch takes, and a different router and
        # certificate from the auth.esweiss.com probe. The genuinely public front
        # door cannot be probed from in-cluster while the rewrite stands.
        - name: authentik-oidc-issuer
          url: https://auth.ericsweiss.com
          module: http_2xx
        - name: nextcloud-external
          url: https://cloud.ericsweiss.com
          module: http_sso
        # photos.ericsweiss.com is a DNS-only (proxy-bypassed) CNAME so large
        # uploads skip Cloudflare — which also means it is the hostname most
        # exposed to DDNS drift and the one with no proxy in front to mask it.
        - name: immich-external
          url: https://photos.ericsweiss.com
          module: http_sso
        - name: hermes-external
          url: https://agent.ericsweiss.com
          module: http_sso
        - name: homarr-external
          url: https://dashboard.ericsweiss.com
          module: http_sso
        - name: mealie-external
          url: https://food.ericsweiss.com
          module: http_sso
        - name: bar-assistant-external
          url: https://bar.ericsweiss.com
          module: http_sso
        - name: plex-external
          url: https://plex.ericsweiss.com
          module: http_sso
        # Web IDE extension host — a separate router and origin from
        # git.ericsweiss.com, and the SOP isolation it provides is load-bearing
        # (docs/27). Answers 302 to GitLab's sign-in unauthenticated.
        - name: gitlab-webide-external
          url: https://ide.git.ericsweiss.com
          module: http_sso
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 64Mi
