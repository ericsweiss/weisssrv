---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: observability
spec:
  interval: 30m
  releaseName: blackbox-exporter
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: "${helm_chart_versions_prometheus_blackbox_exporter}"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 10s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            follow_redirects: true
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: false
        http_sso:
          prober: http
          timeout: 10s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            valid_status_codes: [200, 301, 302, 401, 403]
            follow_redirects: false
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: false
        dns_resolution:
          prober: dns
          timeout: 5s
          dns:
            query_name: esweiss.com
            query_type: A
            valid_rcodes:
              - NOERROR
        icmp_ping:
          prober: icmp
          timeout: 5s
        tcp_connect:
          prober: tcp
          timeout: 5s
    serviceMonitor:
      enabled: true
      defaults:
        interval: 60s
      targets:
        - name: grafana
          url: https://grafana.esweiss.com
          module: http_2xx
        - name: authentik
          url: https://auth.esweiss.com
          module: http_2xx
        - name: traefik
          url: https://traefik.esweiss.com
          module: http_2xx
        - name: sonarr
          url: https://tv.esweiss.com
          module: http_sso
        - name: radarr
          url: https://movies.esweiss.com
          module: http_sso
        - name: lidarr
          url: https://music.esweiss.com
          module: http_sso
        - name: prowlarr
          url: https://prowlarr.esweiss.com
          module: http_sso
        - name: nzbget
          url: https://nzbget.esweiss.com
          module: http_sso
        - name: qbittorrent
          url: https://qbittorrent.esweiss.com
          module: http_sso
        - name: mealie
          url: https://food.esweiss.com
          module: http_sso
        - name: bar-assistant
          url: https://bar.esweiss.com
          module: http_sso
        # Hermes dashboard: an unauthenticated probe is answered by the
        # dashboard's own OIDC auth gate with a 302 -> /login (docs/37 §SSO).
        # http_sso accepts the 302, so the probe verifies ingress + TLS +
        # reachability. The generic EndpointDown alert covers it (warning at
        # probe_success==0 for 5m).
        - name: hermes
          url: https://agent.esweiss.com
          module: http_sso
        # Homarr dashboard (dashboard.esweiss.com): an unauthenticated probe is
        # answered by Homarr's own OIDC login with a 302, which http_sso accepts
        # (200/301/302/401/403) — the probe verifies ingress + TLS + reachability.
        # The generic EndpointDown alert covers it (warning at probe_success==0).
        - name: homarr
          url: https://dashboard.esweiss.com
          module: http_sso
        - name: plex
          url: https://plex.esweiss.com
          module: http_sso
        - name: home-assistant
          url: https://home.esweiss.com
          module: http_sso
        - name: gitlab
          url: https://git.esweiss.com
          module: http_2xx
        # Nextcloud is SSO-only: the root redirects to Authentik (302), which
        # http_sso accepts (200/301/302/401/403) — the probe verifies the
        # ingress + TLS + backend reachability, not an authenticated session.
        - name: nextcloud
          url: https://cloud.esweiss.com
          module: http_sso
        # Immich is Authentik OIDC SSO-only (docs/36), same as Nextcloud above,
        # so it uses http_sso for parity: the probe verifies ingress + TLS +
        # backend reachability without depending on following an SSO redirect to
        # a 200. photos.esweiss.com currently answers 200 directly (the SPA loads
        # then redirects client-side), which http_sso also accepts; switching off
        # http_2xx keeps the probe correct if a future 302/401/403 SSO gate lands.
        - name: immich
          url: https://photos.esweiss.com
          module: http_sso
        - name: pulsarr
          url: https://pulsarr.esweiss.com
          module: http_sso
        # wg-easy admin UI reachability. It sits behind authentik-auth
        # ForwardAuth, so an unauthenticated probe gets a 302 to Authentik —
        # http_sso (accepts 200/301/302/401/403) verifies the ingress + TLS +
        # ForwardAuth hop are alive. EndpointDown fires on probe_success==0.
        - name: wg-easy
          url: https://vpn.esweiss.com
          module: http_sso
        # Host-side Alloy's log-shipping path: loki-push-auth returns 401
        # without credentials, which http_sso accepts — the probe verifies the
        # ingress + TLS + Loki hop, not auth.
        - name: loki-push
          url: https://loki.esweiss.com
          module: http_sso
        - name: dns-01
          url: 192.168.0.150:53
          module: dns_resolution
        - name: dns-02
          url: 192.168.0.160:53
          module: dns_resolution
        - name: smtp-relay
          url: smtp-relay.esweiss.com:587
          module: tcp_connect
        - name: k3s-api-vip
          url: 192.168.0.161:6443
          module: tcp_connect
        # Windows 11 VM RDP reachability — target is live/armed (docs/39). Feeds
        # the WindowsRdpDown alert (kube-prometheus-stack release.yaml,
        # homelab.monitoring); instance is "192.168.0.155:3389". VM 155 is a
        # start-on-demand desktop (onboot=0) that is off much of the time, so
        # WindowsRdpDown is gated on the VM actually being powered on
        # (pve_up{id="qemu/155"}) — it stays silent while the VM is intentionally
        # stopped and only fires when RDP is dead on a running VM.
        - name: windows-rdp
          url: 192.168.0.155:3389
          module: tcp_connect
        # GitLab Container Registry — every CI image pull and push goes through
        # it, and it has its own Traefik router and certificate, so neither the
        # git.esweiss.com probe nor the runner jobs' failure mode covers it
        # (a broken registry surfaces as a mid-pipeline ImagePullBackOff).
        # Unauthenticated GET / answers 200 today; http_sso also tolerates the
        # 401 the registry API returns if that ever changes.
        - name: gitlab-registry
          url: https://registry.git.esweiss.com
          module: http_sso
        # External path (Cloudflare -> WAN -> MetalLB .100): catches DDNS
        # drift and public-ingress breakage that the internal probes can't see.
        # That rationale is not specific to these two hostnames — every
        # *.ericsweiss.com record BUT ONE leaves the LAN from this pod (the
        # blackbox pod resolves via CoreDNS -> AdGuard, which rewrites only
        # *.esweiss.com; verified: home -> the Cloudflare edge IPs, git/photos ->
        # direct.ericsweiss.com/the WAN address), so each externally-published
        # app is probed on BOTH names. The exception is auth.ericsweiss.com —
        # see its target below. Modules mirror each app's internal probe
        # (http_sso where an SSO gate answers the unauthenticated probe with a
        # 302/401).
        - name: home-assistant-external
          url: https://home.ericsweiss.com
          module: http_2xx
        - name: gitlab-external
          url: https://git.ericsweiss.com
          module: http_2xx
        - name: gitlab-registry-external
          url: https://registry.git.ericsweiss.com
          module: http_sso
        # NOT an external probe, despite the hostname: auth.ericsweiss.com is
        # the documented AdGuard split-horizon exception (group_vars/dns.yml)
        # and answers 192.168.0.101 on the LAN, so this pod reaches the INTERNAL
        # Traefik VIP with SNI auth.ericsweiss.com — which is precisely the path
        # every server-side OIDC discovery/JWKS fetch takes (hermes, immich,
        # nextcloud, grafana fetch from the issuer host, deliberately kept off
        # the Cloudflare hairpin because its bot filter 403s non-browser UAs).
        # That router + the separate authentik-tls certificate are not covered
        # by the auth.esweiss.com probe, which presents the other SNI. The
        # genuinely public front door cannot be probed from in-cluster while the
        # rewrite stands (a hostAlias pinning a Cloudflare anycast IP would page
        # on their rotation, not on ours), and an external browser login failing
        # at the edge surfaces through the other *-external probes.
        - name: authentik-oidc-issuer
          url: https://auth.ericsweiss.com
          module: http_2xx
        - name: nextcloud-external
          url: https://cloud.ericsweiss.com
          module: http_sso
        # photos.ericsweiss.com is a DNS-only (proxy-bypassed) CNAME so large
        # uploads skip Cloudflare — which also means it is the hostname most
        # exposed to DDNS drift and the one with no proxy in front to mask it.
        - name: immich-external
          url: https://photos.ericsweiss.com
          module: http_sso
        - name: hermes-external
          url: https://agent.ericsweiss.com
          module: http_sso
        - name: homarr-external
          url: https://dashboard.ericsweiss.com
          module: http_sso
        - name: mealie-external
          url: https://food.ericsweiss.com
          module: http_sso
        - name: bar-assistant-external
          url: https://bar.ericsweiss.com
          module: http_sso
        - name: plex-external
          url: https://plex.ericsweiss.com
          module: http_sso
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 64Mi
