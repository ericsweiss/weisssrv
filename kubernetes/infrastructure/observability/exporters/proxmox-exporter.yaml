---
# Proxmox VE Exporter — scrapes the Proxmox cluster API.
# API credentials sourced from observability-exporter-secrets (ExternalSecret).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxmox-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: proxmox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: proxmox-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proxmox-exporter
    spec:
      # pve-exporter is a Python app on Alpine. Run as an explicit non-root UID
      # (nobody) and mount an emptyDir at /tmp so readOnlyRootFilesystem holds
      # (Python may scratch-write there). Creds come via PVE_TOKEN_* env, no mount.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pve-exporter
          image: prompve/prometheus-pve-exporter:${proxmox_exporter_version}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: metrics
              containerPort: 9221
          env:
            - name: PVE_USER
              valueFrom:
                secretKeyRef:
                  name: observability-exporter-secrets
                  key: proxmox-user
            - name: PVE_TOKEN_NAME
              valueFrom:
                secretKeyRef:
                  name: observability-exporter-secrets
                  key: proxmox-token-name
            - name: PVE_TOKEN_VALUE
              valueFrom:
                secretKeyRef:
                  name: observability-exporter-secrets
                  key: proxmox-token-secret
            # Proxmox nodes serve per-node self-signed certs with no IP SAN, so
            # verifying against the target IP can't succeed without distributing
            # a shared cert to pveproxy. Verification is left off as an accepted
            # LAN MITM risk: the token is still encrypted in transit (8006 is
            # HTTPS) and scoped to the read-only PVEAuditor role (see
            # proxmox_firewall), so a captured token cannot mutate cluster state.
            - name: PVE_VERIFY_SSL
              value: "false"
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # No CPU limit: pve-exporter bursts during scrape (Python parses
              # the cluster-wide /pve API response) and CFS throttling at 500m
              # caused sustained CPUThrottlingHigh false-positives. Memory
              # limit kept since OOM is a real failure mode.
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: proxmox-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: proxmox-exporter
spec:
  selector:
    app.kubernetes.io/name: proxmox-exporter
  ports:
    - name: metrics
      port: 9221
---
# The exporter returns cluster-wide data (/cluster/resources, /nodes)
# regardless of which node ?target= points at, so every target produces the
# same pve_* series. We scrape just two hosts rather than all six to avoid
# storing every series 2-6x (TSDB cardinality / on-disk size); two targets
# on different hosts give resilience if the queried node is down, and
# ProxmoxHostDown's min()/absent() logic already handles a target dropping
# out. Add a node IP to params.target to scrape a specific PVE node.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: proxmox-exporter
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: proxmox-exporter
  endpoints:
    # Both endpoints share one scrape config and differ only by params.target
    # (which PVE node the exporter queries). A YAML anchor carries the shared
    # block so the target IP is the only per-host edit; add a node by appending
    # another `- <<: *pve-endpoint` with its own params. (Kustomize expands the
    # anchor at build time, so the rendered scrape config is unchanged.)
    # pve-nas-01
    - &pve-endpoint
      port: metrics
      interval: 60s
      scrapeTimeout: 30s
      path: /pve
      params:
        target: ["192.168.0.102"]
        module: ["default"]
      relabelings:
        - sourceLabels: [__param_target]
          targetLabel: target
    # pve-prec-01 (second target for resilience if pve-nas-01 is down)
    - <<: *pve-endpoint
      params:
        target: ["192.168.0.107"]
        module: ["default"]
