---
# Proxmox VE Exporter — scrapes the Proxmox cluster API.
# API credentials sourced from observability-exporter-secrets (ExternalSecret).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxmox-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: proxmox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: proxmox-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proxmox-exporter
    spec:
      # pve-exporter is a Python app on Alpine. Run as an explicit non-root UID
      # (nobody) and mount an emptyDir at /tmp so readOnlyRootFilesystem holds
      # (Python may scratch-write there). Creds come via PVE_TOKEN_* env, no mount.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pve-exporter
          image: prompve/prometheus-pve-exporter:${proxmox_exporter_version}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: metrics
              containerPort: 9221
          env:
            - name: PVE_USER
              valueFrom:
                secretKeyRef:
                  name: observability-exporter-secrets
                  key: proxmox-user
            - name: PVE_TOKEN_NAME
              valueFrom:
                secretKeyRef:
                  name: observability-exporter-secrets
                  key: proxmox-token-name
            - name: PVE_TOKEN_VALUE
              valueFrom:
                secretKeyRef:
                  name: observability-exporter-secrets
                  key: proxmox-token-secret
            # Off until the wildcard cert reaches pveproxy and the ServiceMonitor
            # targets node names (deferred, docs/16): per-node self-signed certs have
            # no IP SAN. Accepted: a LAN MITM could capture the PVEAuditor token.
            - name: PVE_VERIFY_SSL
              value: "false"
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            # The tmp emptyDir's sizeLimit is the cap; this request is what
            # ranks the pod by its own usage under node pressure.
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              # No CPU limit (docs/33): the exporter bursts during scrape and CFS
              # throttling trips CPUThrottlingHigh. The memory limit stays.
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir:
            # Only scratch for the Python runtime. Over sizeLimit the kubelet
            # evicts the pod.
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: proxmox-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: proxmox-exporter
spec:
  selector:
    app.kubernetes.io/name: proxmox-exporter
  ports:
    - name: metrics
      port: 9221
---
# Every target returns the same cluster-wide pve_* series, so only two hosts are
# scraped: enough for resilience if one is down, without storing each series six
# times. ProxmoxHostDown's min()/absent() logic handles a target dropping out.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: proxmox-exporter
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: proxmox-exporter
  endpoints:
    # Both endpoints share one scrape config via a YAML anchor and differ only by
    # params.target; add a node with another `- <<: *pve-endpoint`.

    # pve-nas-01
    - &pve-endpoint
      port: metrics
      interval: 60s
      scrapeTimeout: 30s
      path: /pve
      params:
        target: ["10.0.10.102"]
        module: ["default"]
      relabelings:
        - sourceLabels: [__param_target]
          targetLabel: target
    # pve-prec-01 (second target for resilience if pve-nas-01 is down)
    - <<: *pve-endpoint
      params:
        target: ["10.0.10.107"]
        module: ["default"]
