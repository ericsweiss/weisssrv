---
# One exporter per DNS instance (distroless, no shell): dns-01 and dns-02 have
# independent metrics even though adguard_sync replicates their config.
#
# Each sends the AdGuard admin credential as HTTP Basic, so the hop is HTTPS to
# AdGuard's own TLS listener on :443 (AdGuardHome.yaml tls.enabled, the
# distributed *.esweiss.com wildcard). There is still no read-only role, so the
# credential is the full admin one — encrypting the hop is the mitigation.
#
# hostAliases, not DNS: the AdGuard rewrite points dns-0X.esweiss.com at the
# Traefik internal VIP, whose route chains lan-tailscale-strict and deliberately
# drops the pod CIDR (apps/vm-ingress/adguard-home.yaml). Pinning the name to the
# host IP in /etc/hosts reaches AdGuard directly while still presenting a name
# the wildcard cert covers — the bare IP cannot be used, the cert has no IP SAN.
# The image is FROM scratch with ca-certificates.crt baked in, so the public
# Let's Encrypt chain validates without a mounted CA bundle.

# ── dns-01 ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-exporter-dns01
  namespace: observability
  labels:
    app.kubernetes.io/name: adguard-exporter
    app.kubernetes.io/instance: dns-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adguard-exporter
      app.kubernetes.io/instance: dns-01
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adguard-exporter
        app.kubernetes.io/instance: dns-01
    spec:
      # Distroless static binary (USER 65532, FROM scratch); no runtime writes.
      automountServiceAccountToken: false
      hostAliases:
        - ip: "10.0.10.150"
          hostnames: ["dns-01.${cluster_internal_domain}"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adguard-exporter
          image: ghcr.io/henrywhitaker3/adguard-exporter:${adguard_exporter_version}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: ADGUARD_SERVERS
              value: "https://dns-01.${cluster_internal_domain}"
            - name: ADGUARD_USERNAMES
              valueFrom:
                secretKeyRef:
                  name: observability-exporter-secrets
                  key: adguard-username
            - name: ADGUARD_PASSWORDS
              valueFrom:
                secretKeyRef:
                  name: observability-exporter-secrets
                  key: adguard-password
          ports:
            - name: metrics
              containerPort: 9618
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              # No CPU limit (docs/33): CFS throttling on a bursty scrape
              # trips CPUThrottlingHigh.
              memory: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: adguard-exporter-dns01
  namespace: observability
  labels:
    app.kubernetes.io/name: adguard-exporter
    app.kubernetes.io/instance: dns-01
spec:
  selector:
    app.kubernetes.io/name: adguard-exporter
    app.kubernetes.io/instance: dns-01
  ports:
    - name: metrics
      port: 9618

---
# ── dns-02 ──────────────────────────────────────────────────────────────
