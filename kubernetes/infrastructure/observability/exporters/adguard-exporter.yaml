---
# One exporter per DNS instance (distroless, no shell): dns-01 and dns-02 have
# independent metrics even though adguard_sync replicates their config.
#
# Each sends the AdGuard admin credential as HTTP Basic over plaintext to :3000 —
# an accepted LAN risk: the admin API serves no TLS, has no read-only role, and
# the one encrypted path sits behind SSO middleware that rejects basic auth.

# ── dns-01 ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-exporter-dns01
  namespace: observability
  labels:
    app.kubernetes.io/name: adguard-exporter
    app.kubernetes.io/instance: dns-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adguard-exporter
      app.kubernetes.io/instance: dns-01
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adguard-exporter
        app.kubernetes.io/instance: dns-01
    spec:
      # Distroless static binary (USER 65532, FROM scratch); no runtime writes.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adguard-exporter
          image: ghcr.io/henrywhitaker3/adguard-exporter:${adguard_exporter_version}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: ADGUARD_SERVERS
              value: "http://192.168.0.150:3000"
            - name: ADGUARD_USERNAMES
              valueFrom:
                secretKeyRef:
                  name: observability-exporter-secrets
                  key: adguard-username
            - name: ADGUARD_PASSWORDS
              valueFrom:
                secretKeyRef:
                  name: observability-exporter-secrets
                  key: adguard-password
          ports:
            - name: metrics
              containerPort: 9618
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              # No CPU limit: bursty AdGuard API scrape; CFS throttling at 300m
              # was firing CPUThrottlingHigh on every scrape window.
              memory: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: adguard-exporter-dns01
  namespace: observability
  labels:
    app.kubernetes.io/name: adguard-exporter
    app.kubernetes.io/instance: dns-01
spec:
  selector:
    app.kubernetes.io/name: adguard-exporter
    app.kubernetes.io/instance: dns-01
  ports:
    - name: metrics
      port: 9618

---
