---
# One exporter per AdGuard instance (dns-01, dns-02). HTTPS to AdGuard's own :443
# because the credential is the full admin one (no read-only role upstream);
# hostAliases pin the name to the host IP — the wildcard cert has no IP SAN. docs/31.

# ── dns-01 ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-exporter-dns01
  namespace: observability
  labels:
    app.kubernetes.io/name: adguard-exporter
    app.kubernetes.io/instance: dns-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adguard-exporter
      app.kubernetes.io/instance: dns-01
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adguard-exporter
        app.kubernetes.io/instance: dns-01
    spec:
      # Distroless static binary (USER 65532, FROM scratch); no runtime writes.
      automountServiceAccountToken: false
      hostAliases:
        - ip: "10.0.10.150"
          hostnames: ["dns-01.${cluster_internal_domain}"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adguard-exporter
          image: ghcr.io/henrywhitaker3/adguard-exporter:${adguard_exporter_version}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: ADGUARD_SERVERS
              value: "https://dns-01.${cluster_internal_domain}"
            - name: ADGUARD_USERNAMES
              valueFrom:
                secretKeyRef:
                  name: observability-exporter-secrets
                  key: adguard-username
            - name: ADGUARD_PASSWORDS
              valueFrom:
                secretKeyRef:
                  name: observability-exporter-secrets
                  key: adguard-password
          ports:
            - name: metrics
              containerPort: 9618
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              # No CPU limit (docs/33): CFS throttling on a bursty scrape
              # trips CPUThrottlingHigh.
              memory: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: adguard-exporter-dns01
  namespace: observability
  labels:
    app.kubernetes.io/name: adguard-exporter
    app.kubernetes.io/instance: dns-01
spec:
  selector:
    app.kubernetes.io/name: adguard-exporter
    app.kubernetes.io/instance: dns-01
  ports:
    - name: metrics
      port: 9618

---
