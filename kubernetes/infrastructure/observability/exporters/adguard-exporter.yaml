---
# Single ServiceMonitor selects both instances via the shared app label
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: adguard-exporter
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: adguard-exporter
  endpoints:
    - port: metrics
      interval: 60s
