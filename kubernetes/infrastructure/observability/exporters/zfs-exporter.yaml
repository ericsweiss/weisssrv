---
# ZFS Exporter — remote scrape of zfs_exporter running on pve-nas-01.
# The exporter binary runs on the host (not in-cluster).
apiVersion: v1
kind: Service
metadata:
  name: zfs-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: zfs-exporter
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9134
      targetPort: 9134

---
# discovery.k8s.io/v1, not the deprecated core/v1 Endpoints. The Service is
# selectorless, so nothing controls this slice but this file; conditions.ready is
# set explicitly because a hand-written slice has no controller to fill it in.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: zfs-exporter
  namespace: observability
  labels:
    kubernetes.io/service-name: zfs-exporter
addressType: IPv4
ports:
  - name: metrics
    port: 9134
    protocol: TCP
endpoints:
  - addresses: ["192.168.0.102"]
    conditions: {ready: true}

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: zfs-exporter
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zfs-exporter
  endpoints:
    - port: metrics
      interval: 60s
