---
# ZFS Exporter — remote scrape of zfs_exporter running on pve-nas-01.
# The exporter binary runs on the host (not in-cluster).
apiVersion: v1
kind: Service
metadata:
  name: zfs-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: zfs-exporter
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9134
      targetPort: 9134

---
apiVersion: v1
kind: Endpoints
metadata:
  name: zfs-exporter
  namespace: observability
subsets:
  - addresses:
      - ip: 192.168.0.102
    ports:
      - name: metrics
        port: 9134

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: zfs-exporter
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zfs-exporter
  endpoints:
    - port: metrics
      interval: 60s
