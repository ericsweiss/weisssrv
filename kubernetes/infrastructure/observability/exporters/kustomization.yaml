---
# Exporters that this cluster runs itself, plus the static Services/EndpointSlices
# for the exporters that run on the Proxmox hosts, the DNS LXCs and the app VMs.
# ServiceMonitors for third-party targets live in ../service-monitors.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - exportarr/sonarr
  - exportarr/radarr
  - exportarr/lidarr
  - exportarr/prowlarr
  - blackbox-exporter.yaml
  - proxmox-exporter.yaml
  - zfs-exporter.yaml
  - adguard-exporter.yaml
  - unbound-exporter.yaml
  - node-exporter-host.yaml
  - plex-exporter.yaml
  - redis-exporter.yaml
  - dcgm-exporter.yaml
