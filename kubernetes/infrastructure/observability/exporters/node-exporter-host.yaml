---
# Host-level node_exporter (:9101 — 9100 is the k3s DaemonSet), scraped remotely
# from every host the node_exporter_host play covers. One selectorless headless
# Service and one EndpointSlice; the roster below must track that play's groups.
apiVersion: v1
kind: Service
metadata:
  name: node-exporter-host
  namespace: observability
  labels:
    app.kubernetes.io/name: node-exporter-host
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9101
      targetPort: 9101

---
# discovery.k8s.io/v1, not the deprecated core/v1 Endpoints. Nothing controls this
# slice but this file, so conditions.ready is set explicitly per address.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: node-exporter-host
  namespace: observability
  labels:
    kubernetes.io/service-name: node-exporter-host
addressType: IPv4
ports:
  - name: metrics
    port: 9101
    protocol: TCP
endpoints:
  - addresses: ["10.0.10.102"]   # pve-nas-01
    conditions: {ready: true}
  - addresses: ["10.0.10.103"]   # pve-laptop-01
    conditions: {ready: true}
  - addresses: ["10.0.10.104"]   # pve-opt-01
    conditions: {ready: true}
  - addresses: ["10.0.10.105"]   # pve-opt-02
    conditions: {ready: true}
  - addresses: ["10.0.10.106"]   # pve-opt-03
    conditions: {ready: true}
  - addresses: ["10.0.10.107"]   # pve-prec-01
    conditions: {ready: true}
  - addresses: ["10.0.10.150"]   # dns-01
    conditions: {ready: true}
  - addresses: ["10.0.10.160"]   # dns-02
    conditions: {ready: true}
  - addresses: ["10.0.10.151"]   # smtp-relay
    conditions: {ready: true}
  - addresses: ["10.0.10.153"]   # gitlab
    conditions: {ready: true}
  - addresses: ["10.0.10.156"]   # nextcloud
    conditions: {ready: true}
  - addresses: ["10.0.10.157"]   # immich
    conditions: {ready: true}
  - addresses: ["10.0.10.222"]   # k3s-srv-nas-01
    conditions: {ready: true}
  - addresses: ["10.0.10.223"]   # k3s-srv-laptop-01
    conditions: {ready: true}
  - addresses: ["10.0.10.227"]   # k3s-srv-prec-01
    conditions: {ready: true}

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: node-exporter-host
  namespace: observability
spec:
  # job comes from app.kubernetes.io/name; every thermal/PSI/SMART/ZFS alert and
  # the thermals dashboard select on job="node-exporter-host".
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter-host
  endpoints:
    - port: metrics
      interval: 60s
