---
# Node Exporter (host-level) — remote scrape of prometheus-node-exporter running
# directly on bare-metal Proxmox hosts.  Provides hardware metrics (hwmon thermals,
# SMART, NIC details, disk I/O) that VMs cannot see.
# Runs on port 9101 to avoid conflicting with the k3s DaemonSet on 9100.

# ---------------------------------------------------------------------------
# pve-nas-01 (192.168.0.102)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: node-exporter-host-pve-nas-01
  namespace: observability
  labels:
    app.kubernetes.io/name: node-exporter-host
    app.kubernetes.io/instance: pve-nas-01
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9101
      targetPort: 9101

---
apiVersion: v1
kind: Endpoints
metadata:
  name: node-exporter-host-pve-nas-01
  namespace: observability
subsets:
  - addresses:
      - ip: 192.168.0.102
    ports:
      - name: metrics
        port: 9101

