---
# Host-level node_exporter (:9101), scraped remotely from the six bare-metal
# Proxmox hosts, the dns-01/dns-02 and smtp-relay LXCs, the GitLab/Nextcloud/
# Immich VMs and the three k3s server VMs. Port 9101 avoids the k3s DaemonSet on
# 9100. The bare-metal hosts contribute hardware metrics (hwmon thermals, SMART,
# NIC detail, disk I/O) that VMs cannot see; the LXCs and VMs contribute
# filesystem and textfile-collector metrics (backup freshness, etcd snapshot
# copies).
#
# One selectorless headless Service + one hand-written EndpointSlice. The
# ServiceMonitor sets job=node-exporter-host (jobLabel from
# app.kubernetes.io/name) and Prometheus derives instance=<ip>:9101 per address,
# which is what every thermal/PSI/backup alert selector keys on.
apiVersion: v1
kind: Service
metadata:
  name: node-exporter-host
  namespace: observability
  labels:
    app.kubernetes.io/name: node-exporter-host
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9101
      targetPort: 9101

---
# discovery.k8s.io/v1, not the deprecated core/v1 Endpoints. The Service is
# selectorless, so nothing controls this slice but this file; the
# kubernetes.io/service-name label is what binds it to the Service above, and
# conditions.ready is set explicitly because a hand-written slice has no
# controller to fill it in.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: node-exporter-host
  namespace: observability
  labels:
    kubernetes.io/service-name: node-exporter-host
addressType: IPv4
ports:
  - name: metrics
    port: 9101
    protocol: TCP
endpoints:
  - addresses: ["192.168.0.102"]   # pve-nas-01
    conditions: {ready: true}
  - addresses: ["192.168.0.103"]   # pve-laptop-01
    conditions: {ready: true}
  - addresses: ["192.168.0.104"]   # pve-opt-01
    conditions: {ready: true}
  - addresses: ["192.168.0.105"]   # pve-opt-02
    conditions: {ready: true}
  - addresses: ["192.168.0.106"]   # pve-opt-03
    conditions: {ready: true}
  - addresses: ["192.168.0.107"]   # pve-prec-01
    conditions: {ready: true}
  - addresses: ["192.168.0.150"]   # dns-01
    conditions: {ready: true}
  - addresses: ["192.168.0.160"]   # dns-02
    conditions: {ready: true}
  - addresses: ["192.168.0.151"]   # smtp-relay
    conditions: {ready: true}
  - addresses: ["192.168.0.153"]   # gitlab
    conditions: {ready: true}
  - addresses: ["192.168.0.156"]   # nextcloud
    conditions: {ready: true}
  - addresses: ["192.168.0.157"]   # immich
    conditions: {ready: true}
  - addresses: ["192.168.0.222"]   # k3s-srv-nas-01
    conditions: {ready: true}
  - addresses: ["192.168.0.223"]   # k3s-srv-laptop-01
    conditions: {ready: true}
  - addresses: ["192.168.0.227"]   # k3s-srv-prec-01
    conditions: {ready: true}

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: node-exporter-host
  namespace: observability
spec:
  # Set the Prometheus `job` label from `app.kubernetes.io/name`. Without it the
  # operator defaults `job` to the Service name, and every thermal/PSI/SMART/ZFS
  # alert and the thermals dashboard select on job="node-exporter-host".
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter-host
  endpoints:
    - port: metrics
      interval: 60s
