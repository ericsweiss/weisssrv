---
# Exportarr for Sonarr (metrics :9707). Per-app overlay over the shared
# _exportarr component: only name/labels, subcommand, port, URL, and secret
# key differ from the skeleton.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../_exportarr
patches:
  - target:
      kind: Deployment
      name: exportarr-arr
    patch: |
      - op: replace
        path: /metadata/name
        value: exportarr-sonarr
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1name
        value: exportarr-sonarr
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1name
        value: exportarr-sonarr
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1name
        value: exportarr-sonarr
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: sonarr
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "9707"
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: http://sonarr.downloads.svc.cluster.local:8989
      - op: replace
        path: /spec/template/spec/containers/0/env/2/valueFrom/secretKeyRef/key
        value: sonarr-api-key
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 9707
  - target:
      kind: Service
      name: exportarr-arr
    patch: |
      - op: replace
        path: /metadata/name
        value: exportarr-sonarr
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1name
        value: exportarr-sonarr
      - op: replace
        path: /spec/selector/app.kubernetes.io~1name
        value: exportarr-sonarr
      - op: replace
        path: /spec/ports/0/port
        value: 9707
  - target:
      kind: ServiceMonitor
      name: exportarr-arr
    patch: |
      - op: replace
        path: /metadata/name
        value: exportarr-sonarr
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1name
        value: exportarr-sonarr
