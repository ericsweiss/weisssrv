---
# CRITICAL: the per-app overlays (../sonarr, ../radarr, ../lidarr, ../prowlarr)
# address containers/env/ports by INDEX. Their `test` ops assert this shape at
# build time, so a reorder here fails the build rather than silently repointing
# a target URL or API key.
# Shared Deployment + Service + ServiceMonitor for the *arr exporters, named
# "exportarr-arr" on port 9707. API keys come from the
# observability-exporter-secrets Secret (../../externalsecret.yaml).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
