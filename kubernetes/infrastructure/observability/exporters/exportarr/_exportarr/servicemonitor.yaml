---
# Shared component: the four overlays (sonarr/radarr/lidarr/prowlarr) patch only
# name and selector. One scrape fires eight *arr API calls in parallel and
# Sonarr's library scan stalls them, so the budget is 110s in a 120s interval.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: exportarr-arr
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: exportarr-arr
  endpoints:
    - port: metrics
      interval: 120s
      scrapeTimeout: 110s
