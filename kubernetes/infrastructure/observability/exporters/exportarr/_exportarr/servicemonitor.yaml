---
# Shared component: the four overlays (sonarr/radarr/lidarr/prowlarr) patch only
# name and selector. One scrape walks eight *arr API calls serially and the
# nightly vzdump slows them past 45s, so the budget is 110s in a 120s interval.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: exportarr-arr
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: exportarr-arr
  endpoints:
    - port: metrics
      interval: 120s
      scrapeTimeout: 110s
