---
# Shared component: the four overlays (sonarr/radarr/lidarr/prowlarr) patch only
# name and selector. scrapeTimeout is explicit because exportarr walks the *arr
# APIs and can exceed Prometheus' 10s global; 45s stays under the 60s interval.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: exportarr-arr
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: exportarr-arr
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 45s
