---
# Exportarr for Prowlarr (metrics :9710). Per-app overlay over the shared
# _exportarr component: only name/labels, subcommand, port, URL and secret key
# differ from the skeleton.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../_exportarr
patches:
  - target:
      kind: Deployment
      name: exportarr-arr
    patch: |
      # The Deployment patches below address containers/env/ports by INDEX, which
      # a reordered base would silently repoint (a wrong URL or API key fails the
      # scrape only, with no build error). These `test` ops make the base's shape
      # a build-time assertion instead.
      - op: test
        path: /spec/template/spec/containers/0/name
        value: exportarr
      - op: test
        path: /spec/template/spec/containers/0/env/0/name
        value: PORT
      - op: test
        path: /spec/template/spec/containers/0/env/1/name
        value: URL
      - op: test
        path: /spec/template/spec/containers/0/env/2/name
        value: API_KEY
      - op: test
        path: /spec/template/spec/containers/0/ports/0/name
        value: metrics
      - op: replace
        path: /metadata/name
        value: exportarr-prowlarr
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1name
        value: exportarr-prowlarr
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1name
        value: exportarr-prowlarr
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1name
        value: exportarr-prowlarr
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: prowlarr
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "9710"
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: http://prowlarr.downloads.svc.cluster.local:9696
      - op: replace
        path: /spec/template/spec/containers/0/env/2/valueFrom/secretKeyRef/key
        value: prowlarr-api-key
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 9710
  - target:
      kind: Service
      name: exportarr-arr
    patch: |
      - op: test
        path: /spec/ports/0/name
        value: metrics
      - op: replace
        path: /metadata/name
        value: exportarr-prowlarr
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1name
        value: exportarr-prowlarr
      - op: replace
        path: /spec/selector/app.kubernetes.io~1name
        value: exportarr-prowlarr
      - op: replace
        path: /spec/ports/0/port
        value: 9710
  - target:
      kind: ServiceMonitor
      name: exportarr-arr
    patch: |
      - op: replace
        path: /metadata/name
        value: exportarr-prowlarr
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1name
        value: exportarr-prowlarr
