---
# Exportarr for Lidarr (metrics :9709). Per-app overlay over the shared
# _exportarr component: only name/labels, subcommand, port, URL, and secret
# key differ from the skeleton.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../_exportarr
patches:
  - target:
      kind: Deployment
      name: exportarr-arr
    patch: |
      - op: replace
        path: /metadata/name
        value: exportarr-lidarr
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1name
        value: exportarr-lidarr
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1name
        value: exportarr-lidarr
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1name
        value: exportarr-lidarr
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: lidarr
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "9709"
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: http://lidarr.downloads.svc.cluster.local:8686
      - op: replace
        path: /spec/template/spec/containers/0/env/2/valueFrom/secretKeyRef/key
        value: lidarr-api-key
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 9709
  - target:
      kind: Service
      name: exportarr-arr
    patch: |
      - op: replace
        path: /metadata/name
        value: exportarr-lidarr
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1name
        value: exportarr-lidarr
      - op: replace
        path: /spec/selector/app.kubernetes.io~1name
        value: exportarr-lidarr
      - op: replace
        path: /spec/ports/0/port
        value: 9709
  - target:
      kind: ServiceMonitor
      name: exportarr-arr
    patch: |
      - op: replace
        path: /metadata/name
        value: exportarr-lidarr
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1name
        value: exportarr-lidarr
