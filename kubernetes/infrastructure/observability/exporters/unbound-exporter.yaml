---
# Unbound Exporter — remote scrape of unbound_exporter running on dns-01 and dns-02.
# The exporter binaries run on the hosts (not in-cluster).

# dns-01 (192.168.0.150)
apiVersion: v1
kind: Service
metadata:
  name: unbound-exporter-dns-01
  namespace: observability
  labels:
    app.kubernetes.io/name: unbound-exporter
    app.kubernetes.io/instance: dns-01
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9167
      targetPort: 9167

---
# discovery.k8s.io/v1, not the deprecated core/v1 Endpoints. The Service is
# selectorless, so nothing controls this slice but this file; conditions.ready is
# set explicitly because a hand-written slice has no controller to fill it in.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: unbound-exporter-dns-01
  namespace: observability
  labels:
    kubernetes.io/service-name: unbound-exporter-dns-01
addressType: IPv4
ports:
  - name: metrics
    port: 9167
    protocol: TCP
endpoints:
  - addresses: ["192.168.0.150"]
    conditions: {ready: true}

---
# dns-02 (192.168.0.160)
apiVersion: v1
kind: Service
metadata:
  name: unbound-exporter-dns-02
  namespace: observability
  labels:
    app.kubernetes.io/name: unbound-exporter
    app.kubernetes.io/instance: dns-02
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9167
      targetPort: 9167

---
# discovery.k8s.io/v1, not the deprecated core/v1 Endpoints. The Service is
# selectorless, so nothing controls this slice but this file; conditions.ready is
# set explicitly because a hand-written slice has no controller to fill it in.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: unbound-exporter-dns-02
  namespace: observability
  labels:
    kubernetes.io/service-name: unbound-exporter-dns-02
addressType: IPv4
ports:
  - name: metrics
    port: 9167
    protocol: TCP
endpoints:
  - addresses: ["192.168.0.160"]
    conditions: {ready: true}

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: unbound-exporter
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: unbound-exporter
  endpoints:
    - port: metrics
      interval: 60s
