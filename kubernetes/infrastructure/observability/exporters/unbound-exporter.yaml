---
# Recursive-resolver metrics — remote scrape of unbound_exporter (:9167) on the DNS
# LXCs: the same selectorless-Service + EndpointSlice shape as node-exporter-host.
# ONE Service for every resolver — Prometheus derives instance=<ip>:9167.
apiVersion: v1
kind: Service
metadata:
  name: unbound-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: unbound-exporter
    app.kubernetes.io/part-of: observability
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9167
      targetPort: 9167

---
# discovery.k8s.io/v1, not the deprecated core/v1 Endpoints. Nothing controls
# this slice but this file, so conditions.ready is set explicitly per address.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: unbound-exporter
  namespace: observability
  labels:
    kubernetes.io/service-name: unbound-exporter
addressType: IPv4
ports:
  - name: metrics
    port: 9167
    protocol: TCP
endpoints:
  # dns-01
  - addresses: ["10.0.10.150"]
    conditions: {ready: true}
  # dns-02
  - addresses: ["10.0.10.160"]
    conditions: {ready: true}

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: unbound-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: unbound-exporter
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: unbound-exporter
  endpoints:
    - port: metrics
      interval: 60s
