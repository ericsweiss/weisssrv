---
# Exportarr — Prometheus exporters for *arr applications and download clients.
# Each app gets a Deployment + Service + ServiceMonitor.
# Sonarr/Radarr/Lidarr/Prowlarr require API keys (from observability-exporter-secrets)
# for full metrics. Uncomment the API_KEY env blocks after creating the
# "Download Client API Keys" 1Password item and uncommenting the corresponding
# entries in externalsecret.yaml.
# NZBGet and qBittorrent do not require API keys for basic metrics.

# ---------------------------------------------------------------------------
# Sonarr
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exportarr-sonarr
  namespace: observability
  labels:
    app.kubernetes.io/name: exportarr-sonarr
spec:
  replicas: 0  # Set to 1 after enabling API_KEY (requires "Download Client API Keys" 1Password item)
  selector:
    matchLabels:
      app.kubernetes.io/name: exportarr-sonarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exportarr-sonarr
    spec:
      containers:
        - name: exportarr
          image: ghcr.io/onedr0p/exportarr:${exportarr_version}
          args: ["sonarr"]
          env:
            - name: PORT
              value: "9707"
            - name: URL
              value: "http://sonarr.downloads.svc.cluster.local:8989"
            # Uncomment after creating "Download Client API Keys" 1Password item:
            # - name: API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: observability-exporter-secrets
            #       key: sonarr-api-key
          ports:
            - name: metrics
              containerPort: 9707
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: exportarr-sonarr
  namespace: observability
  labels:
    app.kubernetes.io/name: exportarr-sonarr
spec:
  selector:
    app.kubernetes.io/name: exportarr-sonarr
  ports:
    - name: metrics
      port: 9707
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: exportarr-sonarr
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: exportarr-sonarr
  endpoints:
    - port: metrics
      interval: 60s

