---
# Exportarr — Prometheus exporters for *arr applications.
# Each app gets a Deployment + Service + ServiceMonitor.
# API keys omitted for now (exportarr works without them for basic metrics).

# ---------------------------------------------------------------------------
# Sonarr
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exportarr-sonarr
  namespace: observability
  labels:
    app.kubernetes.io/name: exportarr-sonarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: exportarr-sonarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exportarr-sonarr
    spec:
      containers:
        - name: exportarr
          image: ghcr.io/onedr0p/exportarr:${exportarr_version}
          args: ["sonarr"]
          env:
            - name: PORT
              value: "9707"
            - name: URL
              value: "http://sonarr.downloads.svc.cluster.local:8989"
          ports:
            - name: metrics
              containerPort: 9707
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: exportarr-sonarr
  namespace: observability
  labels:
    app.kubernetes.io/name: exportarr-sonarr
spec:
  selector:
    app.kubernetes.io/name: exportarr-sonarr
  ports:
    - name: metrics
      port: 9707
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: exportarr-sonarr
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: exportarr-sonarr
  endpoints:
    - port: metrics
      interval: 60s

