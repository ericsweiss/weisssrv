---
# NVIDIA DCGM exporter — GPU telemetry for the pve-prec-01 1660 Ti, as a DaemonSet
# pinned to the GPU node. It monitors via NVML with NVIDIA_VISIBLE_DEVICES=all and
# does NOT request nvidia.com/gpu, which Hindsight's llama container needs (docs/43).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: dcgm-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dcgm-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcgm-exporter
    spec:
      # Only the GPU node runs it (single-GPU cluster).
      nodeSelector:
        ${cluster_node_label_domain}/gpu: nvidia
      tolerations:
        - key: ${cluster_node_label_domain}/compute
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
      # Use the nvidia containerd runtime so the driver + all GPUs are injected
      # (RuntimeClass in infrastructure/controllers/nvidia-device-plugin).
      runtimeClassName: nvidia
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:${dcgm_exporter_version}
          imagePullPolicy: IfNotPresent
          env:
            - name: DCGM_EXPORTER_LISTEN
              value: ":9400"
            # Add the Kubernetes pod/namespace labels to each metric so a GPU
            # consumer (the llama container) can be correlated in Grafana.
            - name: DCGM_EXPORTER_KUBERNETES
              value: "true"
            # No DCGM_FI_DEV_* series means the container toolkit needs
            # accept-nvidia-visible-devices-envvar-when-unprivileged=true
            # (docs/43); GpuTelemetryMissing detects that state.
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
          ports:
            - name: metrics
              containerPort: 9400
              protocol: TCP
          securityContext:
            # DCGM needs SYS_ADMIN to read some GPU counters; the observability
            # namespace is privileged-PSS (see namespace.yaml). Not fully
            # privileged — just the one capability.
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              add: ["SYS_ADMIN"]
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 15
          # Memory limit only — no CPU limit (repo-wide policy, docs/33). 1Gi:
          # DCGM's hostengine + NVML driver-lib load spikes well past 256Mi
          # during init.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          # DCGM_EXPORTER_KUBERNETES needs the kubelet pod-resources socket to map
          # each GPU metric back to the consuming pod/namespace; without it the
          # metrics carry no pod labels.
          volumeMounts:
            - name: pod-resources
              mountPath: /var/lib/kubelet/pod-resources
              readOnly: true
      volumes:
        - name: pod-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
            type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: dcgm-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: dcgm-exporter
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: dcgm-exporter
  ports:
    - name: metrics
      port: 9400
      targetPort: metrics

---
# jobLabel sets job=dcgm-exporter for the GPU dashboard + alert selectors.
# In-namespace, so allow-intra-namespace-ingress already admits the scrape.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dcgm-exporter
  namespace: observability
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: dcgm-exporter
  endpoints:
    - port: metrics
      interval: 30s
