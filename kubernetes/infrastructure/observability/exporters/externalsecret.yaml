---
# Exporter secrets sourced from 1Password via ESO.
# Consumed by Proxmox exporter for API access.
# The "Proxmox API Token" item must be created in 1Password before deployment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-exporter-secrets
  namespace: observability
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: observability-exporter-secrets
    creationPolicy: Owner
  data:
    - secretKey: proxmox-token-id
      remoteRef:
        key: <PROXMOX_API_TOKEN_ITEM_ID>/token-id  # Proxmox API Token — replace with actual ID
    - secretKey: proxmox-token-secret
      remoteRef:
        key: <PROXMOX_API_TOKEN_ITEM_ID>/token-secret  # Proxmox API Token — replace with actual ID
