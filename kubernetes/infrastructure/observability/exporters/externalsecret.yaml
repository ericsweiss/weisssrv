---
# Exporter and ServiceMonitor secrets sourced from 1Password via ESO.
# Consumed by: Proxmox exporter, Plex exporter, AdGuard exporter,
# Exportarr (*arr apps), Meilisearch ServiceMonitor, HA ServiceMonitor.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-exporter-secrets
  namespace: observability
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: observability-exporter-secrets
    creationPolicy: Owner
  data:
    - secretKey: proxmox-user
      remoteRef:
        key: Proxmox API Token
        property: user
    - secretKey: proxmox-token-name
      remoteRef:
        key: Proxmox API Token
        property: token-name
    - secretKey: proxmox-token-secret
      remoteRef:
        key: Proxmox API Token
        property: token-secret
    # Plex token for plex-exporter
    - secretKey: plex-token
      remoteRef:
        key: Plex Token
        property: token
    # AdGuard Home credentials (shared across both instances)
    - secretKey: adguard-username
      remoteRef:
        key: AdGuard Home
        property: username
    - secretKey: adguard-password
      remoteRef:
        key: AdGuard Home
        property: password
    # Home Assistant long-lived access token for /api/prometheus
    - secretKey: ha-api-token
      remoteRef:
        key: Home Assistant API Token
        property: token
    # *arr application API keys for Exportarr
    - secretKey: sonarr-api-key
      remoteRef:
        key: Download Client API Keys
        property: sonarr-api-key
    - secretKey: radarr-api-key
      remoteRef:
        key: Download Client API Keys
        property: radarr-api-key
    - secretKey: lidarr-api-key
      remoteRef:
        key: Download Client API Keys
        property: lidarr-api-key
    - secretKey: prowlarr-api-key
      remoteRef:
        key: Download Client API Keys
        property: prowlarr-api-key
    # Meilisearch master key for /metrics endpoint auth
    - secretKey: meilisearch-master-key
      remoteRef:
        key: Bar Assistant Secrets
        property: meilisearch-master-key
    # wg-easy /metrics/prometheus Bearer token (must match the value entered in
    # the wg-easy Admin Panel > General). See docs/38-wireguard-vpn.md.
    - secretKey: wg-easy-metrics-token
      remoteRef:
        key: WireGuard VPN
        property: metrics-token
