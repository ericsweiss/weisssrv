---
# Exporter secrets sourced from 1Password via ESO.
# Consumed by Proxmox exporter, Plex exporter, AdGuard exporter, and Exportarr instances.
# Required 1Password items: "Proxmox API Token", "Plex Token", "AdGuard Home",
# "Download Client API Keys" (create this with API keys from each *arr app's
# Settings > General page).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-exporter-secrets
  namespace: observability
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: observability-exporter-secrets
    creationPolicy: Owner
  data:
    - secretKey: proxmox-user
      remoteRef:
        key: nqncfem364e6wprbgr24bolnhi/user  # Proxmox API Token
    - secretKey: proxmox-token-name
      remoteRef:
        key: nqncfem364e6wprbgr24bolnhi/token-name  # Proxmox API Token
    - secretKey: proxmox-token-secret
      remoteRef:
        key: nqncfem364e6wprbgr24bolnhi/token-secret  # Proxmox API Token
    # Plex token for plex-exporter
    - secretKey: plex-token
      remoteRef:
        key: bdst4b4rhtwaf7s626ke6nk55e/token  # Plex Token
    # AdGuard Home credentials (shared across both instances)
    - secretKey: adguard-username
      remoteRef:
        key: 47hxsjelrjdxnarhfvvw6jpeay/username  # AdGuard Home
    - secretKey: adguard-password
      remoteRef:
        key: 47hxsjelrjdxnarhfvvw6jpeay/password  # AdGuard Home
    # *arr application API keys for Exportarr.
    # Uncomment after creating "Download Client API Keys" in 1Password and
    # replacing <ITEM_ID> with the real 1Password item ID.
    # - secretKey: sonarr-api-key
    #   remoteRef:
    #     key: <ITEM_ID>/sonarr-api-key
    # - secretKey: radarr-api-key
    #   remoteRef:
    #     key: <ITEM_ID>/radarr-api-key
    # - secretKey: lidarr-api-key
    #   remoteRef:
    #     key: <ITEM_ID>/lidarr-api-key
    # - secretKey: prowlarr-api-key
    #   remoteRef:
    #     key: <ITEM_ID>/prowlarr-api-key
