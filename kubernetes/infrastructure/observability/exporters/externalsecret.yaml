---
# Exporter secrets sourced from 1Password via ESO.
# Consumed by Proxmox exporter (API access) and AdGuard exporter (auth).
# The "Proxmox API Token" item must be created in 1Password before deployment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-exporter-secrets
  namespace: observability
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: observability-exporter-secrets
    creationPolicy: Owner
  data:
    - secretKey: proxmox-token-id
      remoteRef:
        key: nqncfem364e6wprbgr24bolnhi/token-id  # Proxmox API Token    - secretKey: proxmox-token-secret
      remoteRef:
        key: nqncfem364e6wprbgr24bolnhi/token-secret  # Proxmox API Token    # Plex token for plex-exporter
    - secretKey: plex-token
      remoteRef:
        key: bdst4b4rhtwaf7s626ke6nk55e/token  # Plex Token
    # AdGuard Home credentials (shared across both instances)
    - secretKey: adguard-username
      remoteRef:
        key: 47hxsjelrjdxnarhfvvw6jpeay/username  # AdGuard Home
    - secretKey: adguard-password
      remoteRef:
        key: 47hxsjelrjdxnarhfvvw6jpeay/password  # AdGuard Home
