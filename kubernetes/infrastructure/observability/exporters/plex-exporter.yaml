---
# Plex Exporter — Prometheus metrics for Plex Media Server.
# Uses jsclayton/prometheus-plex-exporter because exportarr does not support Plex.
# NOTE: upstream publishes no versioned tags on GHCR, so we pin the immutable
# @sha256 digest of what was `latest` instead (reproducible; an upstream tag
# move can no longer silently change the running image). Re-resolve the digest
# from `latest` when intentionally updating. imagePullPolicy: IfNotPresent
# because the digest is immutable — no need to re-pull on every restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: plex-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plex-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plex-exporter
    spec:
      containers:
        - name: plex-exporter
          image: ghcr.io/jsclayton/prometheus-plex-exporter:latest@sha256:18ef1b2197efbcb75bd7276380955760995f10a9fbe55106809a6fcff91c2940
          imagePullPolicy: IfNotPresent
          env:
            - name: PLEX_SERVER
              value: "http://192.168.0.152:32400"
            - name: PLEX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: observability-exporter-secrets
                  key: plex-token
          ports:
            - name: metrics
              containerPort: 9000
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: plex-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: plex-exporter
spec:
  selector:
    app.kubernetes.io/name: plex-exporter
  ports:
    - name: metrics
      port: 9000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: plex-exporter
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: plex-exporter
  endpoints:
    - port: metrics
      interval: 60s
