---
# LoadBalancer for UniFi gateway syslog: MetalLB L2 announces ${cluster_syslog_vip},
# :514/udp -> pod :1514. eTP Local preserves the gateway source IP so the
# NetworkPolicy can scope by it. Name differs from the chart's own ClusterIP Service.
apiVersion: v1
kind: Service
metadata:
  name: alloy-syslog-udp
  namespace: observability
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy-syslog
  annotations:
    metallb.io/loadBalancerIPs: ${cluster_syslog_vip}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  # MetalLB L2 does not need per-node NodePorts; don't allocate one.
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy-syslog
  ports:
    - name: syslog-udp
      port: 514
      targetPort: 1514
      protocol: UDP
