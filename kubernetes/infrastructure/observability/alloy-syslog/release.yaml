---
# alloy-syslog — single-replica Alloy Deployment receiving UniFi gateway syslog on
# ${cluster_syslog_vip} (service.yaml, :514/udp -> :1514) and shipping it to Loki
# (docs/46). Separate from ../alloy; UnifiSyslogStale watches the stream.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-syslog
  namespace: observability
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  releaseName: alloy-syslog
  timeout: 10m
  chart:
    spec:
      chart: alloy
      version: "${helm_chart_versions_alloy}"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # loki.source.syslog makes no Kubernetes API call, so the chart's default
    # cluster-wide grant (configmaps and secrets included) and the mounted
    # ServiceAccount token are pure blast radius.
    rbac:
      create: false
    serviceAccount:
      automountServiceAccountToken: false
    alloy:
      enableReporting: false
      # Hand-set memory limit (incompressible; docs/33). A syslog receiver's
      # working set is small and flat; 256Mi is generous headroom over the
      # expected tens-of-MiB. Request is a bootstrap floor.
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi
      configMap:
        content: |
          // Receive remote syslog from the UniFi gateway (UCG), BSD/RFC3164 over UDP.
          // The Service maps :514/udp -> this listener on :1514, so the container needs
          // no root and no NET_BIND_SERVICE.
          loki.source.syslog "unifi" {
            listener {
              address       = "0.0.0.0:1514"
              protocol      = "udp"
              syslog_format = "rfc3164"
              // Receive-time timestamps, not use_incoming_timestamp: RFC3164
              // carries no year or timezone, so a drifted gateway clock would
              // skew lines or trip Loki's too-old rejection.
              labels = {
                job    = "unifi-syslog",
                source = "ucg",
              }
            }
            forward_to = [loki.write.default.receiver]
          }

          // Ship to the same Loki as the container-log DaemonSet.
          loki.write "default" {
            endpoint {
              url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
    controller:
      # `platform` PriorityClass (sources/priorityclasses.yaml); the chart nests
      # the key under controller. A single receiver behind one VIP — not a
      # DaemonSet — so type: deployment with one replica.
      type: deployment
      replicas: 1
      priorityClassName: platform
      # Any ingress agent: the VIP follows the pod (eTP Local) and sg-syslog-vip is
      # open on every ingress guest, so the receiver survives losing one node (docs/46).
      nodeSelector:
        ${cluster_node_label_domain}/ingress: "true"
    # The chart ships the config-reloader sidecar without a memory limit; memory
    # is incompressible so every container carries one (docs/33).
    configReloader:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
    serviceMonitor:
      enabled: true
