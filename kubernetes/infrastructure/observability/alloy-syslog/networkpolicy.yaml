---
# Let the UniFi gateway reach the alloy-syslog receiver on :1514/udp. The
# observability default-deny-ingress (components/netpol-baseline) blocks it
# otherwise. The Service is externalTrafficPolicy: Local, which is *supposed* to
# preserve the gateway's real source IP — but as observed 2026-09-13, this
# k3s + MetalLB-L2 + kube-router path does NOT: LB traffic is SNAT'd to the
# announcing node's IP before the NetworkPolicy is evaluated. With the UCG
# actively forwarding syslog, alloy's loki_source_syslog_entries_total stayed
# flat under a narrow 10.0.10.1/32 rule (the gateway sourced from 10.0.10.1 on
# the wire, yet every packet was dropped). So scope the source to the homelab
# LAN /24 — it covers the gateway VLAN-10 SVI, the k3s node SNAT addresses, and
# the Tailscale subnet-router — plus the UniFi management subnet (10.0.1.0/24,
# docs/46). This mirrors wg-easy, whose external-UDP LoadBalancer admits a broad
# ipBlock source for the same reason. Literal CIDRs are correct here:
# NetworkPolicy ipBlocks are parsed before Flux substitutes, and none has a
# cluster-config placeholder (docs/31).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-syslog-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
      app.kubernetes.io/instance: alloy-syslog
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.10.0/24
        - ipBlock:
            cidr: 10.0.1.0/24
      ports:
        - protocol: UDP
          port: 1514
