---
# UCG syslog -> alloy-syslog :1514/udp through the observability default-deny. eTP
# Local preserves the gateway's source IP, scoping this to its VLAN-10 SVI — the one
# source sg-syslog-vip accepts (docs/46). ipBlocks parse before Flux substitutes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-syslog-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
      app.kubernetes.io/instance: alloy-syslog
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.10.1/32
      ports:
        - protocol: UDP
          port: 1514
