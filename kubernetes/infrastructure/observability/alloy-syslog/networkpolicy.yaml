---
# Let the UniFi gateway reach the alloy-syslog receiver on :1514/udp. The
# observability default-deny-ingress (components/netpol-baseline) blocks it
# otherwise. externalTrafficPolicy: Local on the Service preserves the gateway's
# real source IP, so this scopes to the two addresses the UCG could source syslog
# from — its VLAN-10 SVI (10.0.10.1) and the UniFi management subnet
# (10.0.1.0/24, docs/46). Literal CIDRs are correct here: NetworkPolicy ipBlocks
# are parsed before Flux substitutes, and neither address has a cluster-config
# placeholder. Tighten to the single confirmed source once syslog is live and the
# origin IP is observed (docs/31).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-syslog-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
      app.kubernetes.io/instance: alloy-syslog
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.10.1/32
        - ipBlock:
            cidr: 10.0.1.0/24
      ports:
        - protocol: UDP
          port: 1514
