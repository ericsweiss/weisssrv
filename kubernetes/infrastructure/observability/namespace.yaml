---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/managed-by: flux
    # node-exporter (hostNetwork/hostPID/hostPath), alloy (hostPath) and
    # dcgm-exporter (hostPath) need `privileged`, so enforce cannot be tightened
    # namespace-wide. audit/warn stay at baseline. docs/31 Pod Security.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
