---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/managed-by: flux
    # The bundled node-exporter DaemonSet requires hostPID, hostNetwork, and
    # hostPath, which only the 'privileged' Pod Security Standard permits.
    # Accepted tradeoff: this relaxes PSS for the whole namespace, so other
    # workloads here are not admission-guarded against requesting hostPath/
    # privileged. Every other workload (Grafana, Prometheus, Loki, Alloy, the
    # exporters) sets its own hardened securityContext to compensate.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
