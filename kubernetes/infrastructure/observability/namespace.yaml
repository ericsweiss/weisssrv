---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/managed-by: flux
    # The node-exporter DaemonSet needs hostPID/hostNetwork/hostPath, which only
    # `privileged` permits, so enforce cannot be tightened namespace-wide.
    # audit/warn stay at baseline (they never gate admission) so a privileged
    # request from any OTHER workload here still surfaces; the two host-level
    # DaemonSets flag there by design.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
