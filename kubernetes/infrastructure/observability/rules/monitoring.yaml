---
# Proxmox host / guest health, k3s node state, ZFS pool integrity, blackbox
# endpoint reachability. Runbooks: docs/12-runbooks.md.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-monitoring
  namespace: observability
spec:
  groups:
    - name: homelab.monitoring
      rules:
        - alert: ProxmoxHostDown
          expr: >-
            min by (id) (max_over_time(pve_up{id=~"node/.*"}[5m])) == 0
            or absent(pve_up{id=~"node/.*"})
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#a-proxmox-host-or-guest-went-dark'
            summary: 'Proxmox host {{ $labels.id }} is down'
            description: >-
              Proxmox host {{ $labels.id }} has been unreachable for 5 minutes.
              If id is empty, the Proxmox exporter itself may be down.

        # ProxmoxHostDown covers only id=~"node/.*", so the HA-managed infra
        # guests (dns-01/dns-02, smtp-relay, Home Assistant) need their own rule.
        # 5m avoids paging on a normal HA failover/migration.
        - alert: HAInfraGuestDown
          expr: max by (id) (pve_up{id=~"lxc/(150|151|160)|qemu/154"}) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: 'HA infrastructure guest {{ $labels.id }} is stopped'
            description: >-
              Proxmox guest {{ $labels.id }} (a DNS resolver, the SMTP
              relay, or the Home Assistant VM) has reported stopped for 5
              minutes. HA should have restarted it on another node — if it
              has not, investigate the guest and its host.

        # nfsd on pve-nas-01 backs every k3s NFS PV, Grafana storage and the HAOS
        # media mount, and a hung/stopped nfsd otherwise surfaces only as pod I/O
        # errors. Zero threads = not serving; absent = the NAS exporter is dark.
        - alert: NFSServerDown
          expr: >-
            node_nfsd_server_threads{instance="10.0.10.102:9101"} == 0
            or absent(node_nfsd_server_threads{instance="10.0.10.102:9101"})
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#nfs-server-recovery-pve-nas-01'
            summary: 'NFS server on pve-nas-01 is not serving'
            description: >-
              node_nfsd_server_threads on 10.0.10.102 has been 0 (or
              absent) for 5 minutes — all NFS-backed storage (k3s PVs,
              Grafana, HAOS media) is stalled. Check
              `systemctl status nfs-server` on pve-nas-01; after a
              stop-hang, `systemctl reset-failed nfs-server` then start
              it. Pods with established mounts may need deleting after
              recovery (stale handles).

        # A node left Ready,SchedulingDisabled is invisible to KubeNodeNotReady.
        # 30m is well past a normal kured cycle (~5m) or op-3 cordon (~2m).
        - alert: NodeStuckCordoned
          expr: kube_node_spec_unschedulable == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#a-proxmox-host-or-guest-went-dark'
            summary: 'Node {{ $labels.node }} cordoned (unschedulable) for 30m'
            description: >-
              Node {{ $labels.node }} has been SchedulingDisabled for 30
              minutes. If maintenance is not in progress, suspect a stuck
              kured uncordon or a timed-out drain — investigate, then
              `kubectl uncordon {{ $labels.node }}`.

        # maintenance's _reboot-if-needed.yml writes this textfile metric when it
        # defers a host reboot to an operator. It self-clears once the host no
        # longer needs a reboot.
        - alert: MaintenanceRebootDeferred
          expr: maintenance_reboot_deferred == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#maintenance-windows'
            summary: 'Host {{ $labels.host }} has a maintenance-deferred reboot pending'
            description: >-
              Maintenance deferred a kernel reboot of {{ $labels.host }} to an
              operator. Reboot it manually when convenient (unlock ZFS keys +
              start its VMs after, for pve-nas-01); the alert clears on the
              next run once the host no longer needs a reboot.

        # A serial 9-node rollout clears every node well inside ~2h, so a node
        # still holding kured's sentinel at 3h means the cycle is stuck: a dead
        # kured pod on the lock, a blocking CI job, or a PDB blocking the drain.
        - alert: KuredRebootStuck
          expr: kured_reboot_required == 1
          for: 3h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#maintenance-windows'
            summary: 'kured reboot for {{ $labels.node }} pending over 3h (stuck cycle)'
            description: >-
              Node {{ $labels.node }} has held the kured reboot sentinel for
              more than 3 hours without being rebooted. The reboot cycle is
              stuck — check the cluster-wide lock (`kubectl -n kube-system
              get ds kured -o jsonpath='{.metadata.annotations}'`), any
              infrastructure CI job pinning the node, and PDBs blocking the
              drain. Clear a dead lock with `kubectl -n kube-system annotate
              ds/kured weave.works/kured-node-lock-`.

        # corosync pinned near 100% CPU with the process still alive: pmxcfs is
        # frozen while ProxmoxHostDown and the systemd unit both stay green.
        # Normal corosync CPU is 1-2%; membership-change spikes are far under 10m.
        - alert: CorosyncWedged
          expr: avg_over_time(proxmox_corosync_cpu_percent[10m]) > 90
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#a-proxmox-host-or-guest-went-dark'
            summary: 'corosync stuck at high CPU on {{ $labels.instance }}'
            description: >-
              corosync on {{ $labels.instance }}
              has averaged
              {{ $value | printf "%.1f" }}%
              CPU over the last 10 minutes. Likely wedged
              — pmxcfs replication has probably stopped on this node.
              Mitigation: `systemctl restart corosync` on that host;
              check `journalctl -u corosync` for the last log line
              before the silence to file an upstream bug.

        # pmxcfs split-brain, via the age of /etc/pve/ha/manager_status, which
        # the HA CRM master rewrites every few seconds. A deleted file reads
        # mtime=0 and fires, so there is no `> 0` guard.
        - alert: PmxcfsStale
          expr: >-
            time() - proxmox_pmxcfs_manager_status_mtime_seconds > 600
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#a-proxmox-host-or-guest-went-dark'
            summary: 'pmxcfs on {{ $labels.instance }} appears stale (split-brain)'
            description: >-
              /etc/pve/ha/manager_status on {{ $labels.instance }}
              has not been updated in
              {{ $value | humanizeDuration }}.
              pmxcfs replication has stopped on this node — its
              view of the cluster is frozen. Compare
              `sudo cat /etc/pve/ha/manager_status` across nodes
              to confirm, then `systemctl restart corosync pve-cluster`
              on the affected node.

        # PSI is the earliest saturation signal on the bare-metal hosts; the
        # stock NodeDiskIOSaturation / NodeMemory* rules select the k3s
        # node-exporter job and never see :9101.
        - alert: ProxmoxHostIOPressure
          expr: >-
            rate(node_pressure_io_waiting_seconds_total{job="node-exporter-host", instance=~"10\\.0\\.10\\.10[2-7]:9101"}[5m]) > 0.20
          # 15m, not 5m: the nightly media-mover/archive/restic chain crosses
          # the threshold for a ~6-minute band most days, which is the chain
          # working. A real freeze holds the stall far longer.
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#a-proxmox-host-or-guest-went-dark'
            summary: 'Proxmox host {{ $labels.instance }} is I/O-pressure stalled'
            description: >-
              {{ $labels.instance }} has spent
              {{ $value | humanizePercentage }}
              of the last 5 minutes with tasks stalled waiting on disk I/O.
              Sustained pool saturation — on pve-nas-01 this precedes a
              dirty-writeback -> memory-reclaim stall -> whole-host freeze.
              Find the heavy writer (`iotop`; usually vzdump/scrub) and
              throttle or reschedule it; bwlimit on the vzdump job is the
              codified guard.
        - alert: ProxmoxHostMemoryPressure
          expr: >-
            rate(node_pressure_memory_waiting_seconds_total{job="node-exporter-host", instance=~"10\\.0\\.10\\.10[2-7]:9101"}[5m]) > 0.10
          # 15m for the same reason as ProxmoxHostIOPressure above — this one
          # cascades from it and shows the same nightly single-sample blip.
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#a-proxmox-host-or-guest-went-dark'
            summary: 'Proxmox host {{ $labels.instance }} is under memory-reclaim pressure'
            description: >-
              {{ $labels.instance }} has spent
              {{ $value | humanizePercentage }}
              of the last 5 minutes with tasks stalled on memory reclaim.
              On the memory-over-committed NAS this cascades from I/O
              saturation (stalled dirty-page writeback) into a KVM
              page-fault wedge. Check swap use / ARC / a heavy writer and
              correlate with ProxmoxHostIOPressure.

        # Collector meta-failure (the textfile script ran but is stuck).
        # Deliberately silent when the metric is wholly absent on a host —
        # HostExporterDown covers a dark exporter.
        - alert: CorosyncHealthCollectorStale
          expr: >-
            time() - proxmox_corosync_health_collector_last_success_seconds > 300
          for: 5m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#a-proxmox-host-or-guest-went-dark'
            summary: 'corosync-health-collector textfile script is degraded on {{ $labels.instance }}'
            description: >-
              proxmox_corosync_health_collector_last_success_seconds
              on {{ $labels.instance }}
              has not advanced in over 5 minutes. The CorosyncWedged +
              PmxcfsStale alerts on this host are now serving stale
              inputs. Check
              `journalctl -u corosync-health-collector.service` and
              `systemctl status corosync-health-collector.timer`.

        # Pool HEALTH alone misses silent corruption: vdev checksum errors
        # accumulate while the pool stays ONLINE. One row per error type, each the
        # worst vdev's counter; a truncated count reads as zero vs non-zero.
        - alert: ZFSPoolDeviceErrors
          expr: max by (instance, pool) (zfs_pool_status_errors_total) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#handling-disk-failure-zfs'
            summary: 'ZFS pool {{ $labels.pool }} on {{ $labels.instance }} has device errors'
            description: >-
              zpool status reports read/write/cksum errors on pool
              {{ $labels.pool }} ({{ $labels.instance }}). The exported counter
              is truncated for suffixed counts, so trust the non-zero signal and
              not the value. The pool may still show
              ONLINE — this is the silent-corruption signature.
              Run `zpool status -v {{ $labels.pool }}` on the host,
              identify affected datasets, and `zpool clear` only
              after investigating.

        - alert: ZFSPoolDataErrors
          expr: zfs_pool_status_data_errors > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#handling-disk-failure-zfs'
            summary: 'ZFS pool {{ $labels.pool }} on {{ $labels.instance }} has permanent data errors'
            description: >-
              zpool status -v lists {{ $value | printf "%.0f" }}
              entries with unrecoverable data on pool
              {{ $labels.pool }} ({{ $labels.instance }}). Affected
              files/zvols need restore-or-rebuild; on a single-vdev
              pool ZFS cannot self-heal these.

        - alert: ZFSPoolNotOnline
          expr: zfs_pool_status_health_code > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#handling-disk-failure-zfs'
            summary: 'ZFS pool {{ $labels.pool }} on {{ $labels.instance }} is not ONLINE'
            description: >-
              Pool {{ $labels.pool }} on {{ $labels.instance }}
              reports DEGRADED or worse (health code
              {{ $value | printf "%.0f" }}).

        # The == 0 branch covers never-scrubbed pools and makes a scrub-timestamp
        # parser regression loud (the collector emits 0 when it cannot parse a
        # completion time).
        - alert: ZFSPoolScrubStale
          expr: >-
            (zfs_pool_status_last_scrub_seconds == 0)
            or (
              zfs_pool_status_last_scrub_seconds > 0
              and time() - zfs_pool_status_last_scrub_seconds > 35 * 86400
            )
          for: 6h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#handling-disk-failure-zfs'
            summary: 'ZFS pool {{ $labels.pool }} on {{ $labels.instance }} has no recent completed scrub'
            description: >-
              Pool {{ $labels.pool }} on {{ $labels.instance }}
              either has never completed a scrub (timestamp 0) or
              its last scrub finished more than 35 days ago.
              Without scrubs, latent corruption surfaces only when
              something reads the bad blocks (e.g. vzdump).

        # The `or ... unless` branch closes the missing-series blind spot: a
        # staleness expression yields nothing if the collector never wrote a
        # sample. The corosync sentinel is the existence witness.
        - alert: ZFSPoolCollectorStale
          # The success arm catches the collector refreshing its sentinel while
          # publishing zero pool series (zpool gone, every pool exported). The
          # max_over_time guard keeps a host that never had a pool quiet.
          expr: >-
            (time() - zfs_pool_status_collector_last_success_seconds > 900)
            or on(instance) (
              proxmox_corosync_health_collector_last_success_seconds
              unless on(instance) zfs_pool_status_collector_last_success_seconds
            )
            or (
              zfs_pool_status_collector_success == 0
              and on(instance) (
                max_over_time(zfs_pool_status_collector_success[7d]) > 0
              )
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#handling-disk-failure-zfs'
            summary: 'zpool-status-collector is degraded or missing on {{ $labels.instance }}'
            description: >-
              zfs_pool_status_collector_last_success_seconds on
              {{ $labels.instance }} is stale (>15m), entirely
              absent while the host reports other collector metrics,
              or the collector reports success 0 (zpool unrunnable or
              no pool left) — the ZFS pool alerts on this host are
              serving stale or no inputs. Check
              `journalctl -u zpool-status-collector.service` and
              `systemctl status zpool-status-collector.timer`.

        # node_filesystem math cannot stand in for a pool: a dataset shrinks as
        # zvols fill the pool, so DiskUsage* stays low on a nearly-full pool
        # while VM I/O is about to stall. All compute hosts share a pool name.
        - alert: ZFSPoolSpaceWarning
          expr: (zfs_pool_status_allocated_bytes / zfs_pool_status_size_bytes) * 100 > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#handling-disk-failure-zfs'
            summary: 'ZFS pool {{ $labels.pool }} on {{ $labels.instance }} above 80% capacity'
            description: 'ZFS pool {{ $labels.pool }} on {{ $labels.instance }} is at {{ $value | printf "%.1f" }}% capacity.'

        - alert: ZFSPoolSpaceCritical
          expr: (zfs_pool_status_allocated_bytes / zfs_pool_status_size_bytes) * 100 > 90
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#handling-disk-failure-zfs'
            summary: 'ZFS pool {{ $labels.pool }} on {{ $labels.instance }} above 90% capacity'
            description: 'ZFS pool {{ $labels.pool }} on {{ $labels.instance }} is at {{ $value | printf "%.1f" }}% capacity.'

        - alert: EndpointDown
          # Excludes the Windows RDP target (WindowsRdpDown), the three UniFi
          # ICMP targets (NetworkGearProbeFailed) and the 1.1.1.1 WAN witness
          # (ExternalIngressDown reads it); 10m absorbs brief probe dips.
          expr: >-
            max by (instance) (
              probe_success{instance!~"10\\.0\\.10\\.155:3389|10\\.0\\.10\\.1|10\\.0\\.1\\.(2|3)|1\\.1\\.1\\.1"}
            ) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#network-connectivity-issues'
            summary: 'Endpoint {{ $labels.instance }} is down'
            description: 'Blackbox probe for {{ $labels.instance }} has failed for 10 minutes.'

        # Both immich-server metrics ports live on one monolithic server, so
        # min by (job) fires if EITHER stops scraping while still yielding a
        # single alert; absent() catches the whole target vanishing.
        - alert: ImmichDown
          expr: min by (job) (up{job="immich-metrics"}) == 0 or absent(up{job="immich-metrics"})
          for: 5m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/36-immich.md'
            summary: 'Immich is down'
            description: >-
              Prometheus has been unable to scrape Immich's native metrics
              (immich-server 8081/8082) for 5 minutes — the compose stack on
              the Immich VM (10.0.10.157) is down or unreachable, or the
              scrape target is missing. Photo access is offline.
        # Gated on the VM being powered on: 155 is a desktop an operator shuts
        # down at will (docs/39). `max()` aggregates pve_up, which arrives from
        # two exporter targets. Excluded from EndpointDown above.
        - alert: WindowsRdpDown
          expr: >-
            probe_success{instance="10.0.10.155:3389"} == 0
            and on() (max(pve_up{id="qemu/155"}) == 1)
          for: 30m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/39-windows-vm.md'
            summary: 'Windows VM RDP (10.0.10.155:3389) unreachable while VM is running'
            description: >-
              The Windows 11 VM is powered on (pve_up qemu/155 == 1) but has
              not answered an RDP (3389) blackbox probe for 30 minutes. Check
              `task windows:status` and the Proxmox console. (The alert is
              gated on VM power state, so it stays silent when the VM is
              intentionally off.) See docs/39-windows-vm.md.

        # The load-bearing three (SSO front door, GitOps source, home
        # controller) page email, not just Discord. EndpointDown still fires
        # alongside; the Alertmanager alertname pair on `instance` dedups.
        - alert: EndpointDownCritical
          expr: >-
            max by (instance) (
              probe_success{instance=~"https://(auth|git|home)\\.esweiss\\.com"}
            ) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#network-connectivity-issues'
            summary: 'Key endpoint {{ $labels.instance }} is down'
            description: >-
              Blackbox probe for {{ $labels.instance }} has failed for 5
              minutes. This endpoint is load-bearing infrastructure
              (SSO front door, GitOps source, or home automation).

        # Config-drift guard for the regex above: a target renamed or given a
        # path stops matching it silently. Same selector, so the count cannot
        # drift from what pages; `or on() vector(0)` covers all three gone.
        - alert: KeyEndpointProbeMissing
          expr: >-
            (
              count(
                max by (instance) (
                  probe_success{instance=~"https://(auth|git|home)\\.esweiss\\.com"}
                )
              ) or on() vector(0)
            ) < 3
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#network-connectivity-issues'
            summary: 'EndpointDownCritical is watching only {{ $value }} of its 3 key endpoints'
            description: >-
              EndpointDownCritical selects the SSO front door, GitOps source and
              home controller by regex, and only {{ $value }} probe_success
              series still match — a target was removed, renamed or given a
              path. Restore it in exporters/blackbox-exporter.yaml.

        # Three external hostnames down at once is the upstream path to
        # Cloudflare, the edge, or public ingress. Excluded names are AdGuard
        # rewrites to the internal VIP. A dark gateway or 1.1.1.1 suppresses it.
        - alert: ExternalIngressDown
          expr: >-
            count(
              max by (instance) (
                probe_success{
                  instance=~"https://.*\\.ericsweiss\\.com",
                  instance!~"https://(git|registry\\.git|pages\\.git|auth|photos)\\.ericsweiss\\.com"
                }
              ) == 0
            ) >= 3
            unless
            max(probe_success{instance="10.0.10.1"}) == 0
            unless
            max(probe_success{instance="1.1.1.1"}) == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#network-connectivity-issues'
            summary: '{{ $value }} externally-published endpoints are unreachable on their public names'
            description: >-
              Three or more externally-published endpoints have failed their
              blackbox probe for 15 minutes while the gateway and the 1.1.1.1
              witness both still answer. The upstream path to Cloudflare, the
              Cloudflare edge, public ingress, or DDNS drift is at fault.

        # Config-drift guard for the witness above: drop the 1.1.1.1 target and
        # ExternalIngressDown pages critical on a plain upstream outage again.
        - alert: InternetProbeMissing
          expr: absent(probe_success{instance="1.1.1.1"})
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#network-connectivity-issues'
            summary: 'The WAN witness probe for {{ $labels.instance }} is missing'
            description: >-
              No probe_success series for {{ $labels.instance }} — the
              outside-in ICMP target was removed or renamed, so
              ExternalIngressDown can no longer tell an upstream outage from a
              public-ingress fault. Restore the target in
              exporters/blackbox-exporter.yaml.

        # nextcloud_up flips to 0 when the exporter cannot reach the serverinfo
        # API (app/DB down, or maintenance mode); absent() covers the exporter
        # or scrape being down. EndpointDown covers the ingress/TLS path.
        - alert: NextcloudDown
          expr: max(nextcloud_up) == 0 or absent(nextcloud_up)
          for: 10m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/35-nextcloud.md'
            summary: 'Nextcloud is unreachable'
            description: >-
              The nextcloud-exporter reports Nextcloud unreachable
              (nextcloud_up == 0) for 10 minutes, or the metric is absent
              (exporter/scrape down). Check the compose stack on the
              Nextcloud VM (10.0.10.156): `task nextcloud:status`.

        # Critical aggregate for total DNS loss. The failed count is compared
        # against the resolver probes PRESENT, not a hardcoded 2, so a dropped
        # target cannot silently disarm it (DNSResolverProbeMissing sees that).
        - alert: DNSResolutionDown
          expr: >-
            count(
              max by (instance) (probe_success{instance=~"10\\.0\\.10\\.(150|160):53"}) == 0
            )
            ==
            count(
              max by (instance) (probe_success{instance=~"10\\.0\\.10\\.(150|160):53"})
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#network-connectivity-issues'
            summary: 'All DNS resolvers are failing to answer'
            description: >-
              Every probed AdGuard resolver (10.0.10.150 /
              10.0.10.160) has failed its DNS blackbox probe for 5
              minutes — name resolution is down cluster-wide.

        # Config-drift guard for the self-scaling aggregate above: pin each
        # resolver's series so a removed/renamed target is loud.
        - alert: DNSResolverProbeMissing
          expr: >-
            absent(probe_success{instance="10.0.10.150:53"})
            or absent(probe_success{instance="10.0.10.160:53"})
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#network-connectivity-issues'
            summary: 'DNS resolver probe for {{ $labels.instance }} is missing'
            description: >-
              No probe_success series for {{ $labels.instance }} — its
              blackbox target was removed or renamed, and the
              DNSResolutionDown aggregate no longer covers this resolver.
              Restore the target in exporters/blackbox-exporter.yaml.

        # The UniFi tier (docs/46): gateway, switch and AP, ICMP only. Warning
        # keeps a firmware reboot off the pager; these instances are excluded
        # from EndpointDown so one cause fires once.
        - alert: NetworkGearProbeFailed
          expr: >-
            max by (instance) (
              probe_success{instance=~"10\\.0\\.10\\.1|10\\.0\\.1\\.(2|3)"}
            ) == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/46-unifi-network.md'
            summary: 'UniFi device {{ $labels.instance }} is not answering ICMP'
            description: >-
              The ICMP blackbox probe for {{ $labels.instance }} has failed for
              5 minutes — the UniFi gateway, switch or access point is down,
              rebooting, or has lost its uplink. Expect WAN and inter-VLAN
              breakage (and, for the AP, every wireless client) until it
              returns. See docs/46-unifi-network.md.

        # Config-drift guard for the regex above: a target dropped from
        # blackbox-exporter.yaml would silently stop being watched. Each
        # instance is pinned so the drop is loud.
        - alert: NetworkGearProbeMissing
          expr: >-
            absent(probe_success{instance="10.0.10.1"})
            or absent(probe_success{instance="10.0.1.2"})
            or absent(probe_success{instance="10.0.1.3"})
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/46-unifi-network.md'
            summary: 'UniFi device probe for {{ $labels.instance }} is missing'
            description: >-
              No probe_success series for {{ $labels.instance }} — its ICMP
              blackbox target was removed or renamed, and NetworkGearProbeFailed
              no longer covers this device. Restore the target in
              exporters/blackbox-exporter.yaml.

        # The gateway's syslog is the only homelab-side record of IPS
        # detections, admin logins and firewall changes. Baseline is hundreds of
        # lines an hour; the absent() arm guards the component name.
        - alert: UnifiSyslogStale
          expr: >-
            sum by (job, component_id) (increase(loki_source_syslog_entries_total{job="alloy-syslog", component_id="loki.source.syslog.unifi"}[1h])) == 0
            or absent(loki_source_syslog_entries_total{job="alloy-syslog", component_id="loki.source.syslog.unifi"})
          for: 30m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/46-unifi-network.md'
            summary: 'No UniFi gateway syslog has reached Loki in over an hour'
            description: >-
              The alloy-syslog receiver has accepted no line from the UniFi
              gateway for over an hour, or its syslog component is gone. Gateway
              security events are not being recorded. Check the alloy-syslog
              pod, its MetalLB VIP Service, and the gateway's remote-syslog
              setting (docs/46).

        - alert: BlackboxExporterDown
          expr: absent(up{job=~".*blackbox.*"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#network-connectivity-issues'
            summary: 'Blackbox exporter is down'
            description: 'All endpoint monitoring is blind — blackbox exporter has been down for 5 minutes.'

        # TLS-expiry backstop for the Cloudflare-edge certs neither cert-manager
        # nor the acme.sh wildcard covers. Hostnames whose TLS this cluster
        # terminates are excluded; an unlisted new hostname double-warns.
        - alert: BlackboxCertExpiringSoon
          expr: >-
            probe_ssl_earliest_cert_expiry{
              instance=~"https://.*\\.ericsweiss\\.com",
              instance!~"https://(git|registry\\.git|ide\\.git|pages\\.git|photos|auth)\\.ericsweiss\\.com"
            } - time() < 86400 * 14
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#certificate-renewal-issues'
            summary: 'Edge TLS cert for {{ $labels.instance }} expires in under 14 days'
            description: >-
              The TLS certificate presented by {{ $labels.instance }}
              (Cloudflare edge — not cert-manager/acme.sh managed) expires in
              {{ $value | humanizeDuration }}. Cloudflare normally auto-renews;
              investigate if this does not clear.

        # The in-cluster twin of HostLogShippingStale: the container-log Alloy
        # DaemonSet Running and scraped while its pipeline ships nothing. The
        # uptime arm makes `== 0` safe; alloy-syslog has its own two alerts.
        - alert: PodLogShippingStale
          expr: >-
            sum by (instance) (
              increase(loki_write_sent_entries_total{namespace="observability", pod=~"alloy-.*", pod!~"alloy-syslog-.*"}[45m])
            ) == 0
            and on (instance)
            (
              time() - max by (instance) (
                process_start_time_seconds{namespace="observability", pod=~"alloy-.*", pod!~"alloy-syslog-.*"}
              )
            ) > 3600
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/31-observability.md'
            summary: 'Alloy {{ $labels.instance }} has shipped no container logs in 45m'
            description: >-
              The in-cluster Alloy pod at {{ $labels.instance }} has been up for
              over an hour and has pushed no log entries to Loki in 45 minutes.
              Its node's container logs are missing. Check the pod's own logs
              and the loki.write endpoint, then the Loki pod.

        # alloy-syslog's write half: UnifiSyslogStale only watches the :1514
        # receiver, so a wedged loki.write loses gateway security events
        # silently. The receiver arm gates `== 0` on the feed being live.
        - alert: SyslogLogShippingStale
          expr: >-
            sum by (instance) (
              increase(loki_write_sent_entries_total{namespace="observability", pod=~"alloy-syslog-.*"}[45m])
            ) == 0
            and on (instance)
            sum by (instance) (
              increase(loki_source_syslog_entries_total{job="alloy-syslog"}[45m])
            ) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/46-unifi-network.md'
            summary: 'alloy-syslog has accepted syslog but pushed nothing to Loki in 45m'
            description: >-
              The alloy-syslog receiver at {{ $labels.instance }} is still
              accepting datagrams from the UniFi gateway but its loki.write has
              pushed no entry in 45 minutes. Gateway security events are being
              dropped. Check the pod's own logs, then the Loki pod.

        # Only Kuma sees a monitor still red a day later; a shared outage pages
        # through EndpointDown in 10m. The `offset` arm proves the window holds
        # 24h, the bare arm needs a live sample so a paused monitor resolves.
        - alert: UptimeKumaMonitorPersistentlyDown
          expr: >-
            max by (monitor_name, monitor_url) (max_over_time(monitor_status[24h])) == 0
            and on (monitor_name, monitor_url) monitor_status
            and on (monitor_name, monitor_url) (monitor_status offset 23h)
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/45-uptime-kuma.md'
            summary: 'Uptime Kuma monitor {{ $labels.monitor_name }} has been down for 24h'
            description: >-
              Uptime Kuma has reported {{ $labels.monitor_name }}
              ({{ $labels.monitor_url }}) down for 24 hours. Check the
              monitor's Accepted Status Codes
              against the http_sso set first — an SSO-fronted target answers
              302 — then treat it as a real outage (docs/45).

        - alert: NodeMemoryPressure
          expr: kube_node_status_condition{condition="MemoryPressure", status="true"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#a-proxmox-host-or-guest-went-dark'
            summary: 'Node {{ $labels.node }} is under memory pressure'
            description: 'Kubelet on {{ $labels.node }} has been reporting memory pressure for 5 minutes. Pods may be evicted.'

        # Null-routed source (severity:none) for the node-outage inhibit in
        # alertmanager-config.yaml. The max_over_time arm keeps a never-Ready
        # node from muting workload alerts; criticals are never inhibited.
        - alert: NodeOutageStormControl
          expr: >-
            kube_node_status_condition{condition="Ready", status="true"} == 0
            and max_over_time(kube_node_status_condition{condition="Ready", status="true"}[7d]) == 1
          for: 5m
          labels:
            severity: none
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: 'Node {{ $labels.node }} NotReady — workload alerts inhibited'
            description: >-
              {{ $labels.node }} has been NotReady for under 7 days; per-pod and
              per-workload warnings are inhibited while it recovers. The
              critical tier is never inhibited.

        # Past 6h a node outage is an incident, not maintenance churn, so it
        # pages email — and no critical is on any inhibit target list.
        - alert: NodeNotReadyProlonged
          expr: kube_node_status_condition{condition="Ready", status="true"} == 0
          for: 6h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#a-proxmox-host-or-guest-went-dark'
            summary: 'Node {{ $labels.node }} has been NotReady for over 6 hours'
            description: >-
              {{ $labels.node }} has been NotReady for more than 6 hours. Its
              workloads are rescheduled or degraded, and it pages regardless of
              the storm-control inhibit, which never suppresses criticals.
              Either return the node or cordon/drain it out of the fold.

        # 2/3 etcd members is quorum with zero fault tolerance, and upstream
        # has no critical for it: etcdInsufficientMembers only fires once quorum
        # is gone. absent() covers the whole job being down.
        - alert: EtcdQuorumAtRisk
          expr: >-
            count(up{job="kube-etcd"} == 1) <= 2
            or absent(up{job="kube-etcd"} == 1)
          for: 6h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/19-k3s-deployment.md'
            summary: 'k3s etcd has been running without fault tolerance for 6h'
            description: >-
              Fewer than 3 etcd members have been reachable for 6 hours. The
              cluster still has quorum but cannot survive another server loss —
              restore the missing k3s server node now (docs/19).

        # Taken from kube-prometheus-stack 92.1.0
        # Upstream's expr at for: 15m. The inner `> 0` is upstream's too: min()
        # ignores replicas with no failures, so one failing replica fires it.
        - alert: AlertmanagerClusterFailedToSendAlerts
          expr: >-
            min by (namespace, service, integration) (
              rate(alertmanager_notifications_failed_total{job="kube-prometheus-stack-alertmanager",
              container="alertmanager", namespace="observability"}[15m])
              / ignoring (reason) group_left
              rate(alertmanager_notifications_total{job="kube-prometheus-stack-alertmanager",
              container="alertmanager", namespace="observability"}[15m]) > 0
            ) > 0.01
          for: 15m
          labels:
            severity: critical
          annotations:
            runbook_url: 'https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerclusterfailedtosendalerts'
            summary: 'Alertmanager has failed to notify {{ $labels.integration }} for 15 minutes'
            description: >-
              Over 1% of notifications to {{ $labels.integration }} have failed
              for 15 minutes (currently {{ $value | humanizePercentage }}) on at
              least one Alertmanager replica. The gossiping peer re-sends what a
              failing replica dropped, so expect a delayed notification rather
              than a lost one — but a path failing this long stays broken.

        # Warnings are Discord-only, so a quiet drop rate under the critical
        # rule's 1%-for-15m threshold is invisible. Info tier, exempted by name
        # from the InfoInhibitor target matcher since it carries no namespace.
        - alert: AlertmanagerNotificationsDropping
          expr: >-
            sum by (integration) (
              increase(alertmanager_notifications_failed_total{job="kube-prometheus-stack-alertmanager",
              container="alertmanager", namespace="observability"}[6h])
            ) > 0
          for: 1h
          labels:
            severity: info
          annotations:
            runbook_url: '${cluster_runbook_base_url}/31-observability.md#alerting'
            summary: '{{ $value | printf "%.0f" }} notifications to {{ $labels.integration }} failed in the last 6h'
            description: >-
              Alertmanager dropped notifications on the {{ $labels.integration }}
              integration over the last 6 hours without crossing the 1% ratio
              that pages. Each drop is an alert you were never told about.
