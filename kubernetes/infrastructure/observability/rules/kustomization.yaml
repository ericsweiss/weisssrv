---
# Custom PrometheusRule CRs, one file per rule group. Discovered by Prometheus
# through ruleSelectorNilUsesHelmValues:false + an empty ruleNamespaceSelector
# (kube-prometheus-stack/release.yaml), so no release label is needed.
# scripts/extract-prometheus-config.py lints every expr here and runs the
# promtool unit tests in scripts/prometheus-rule-tests/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - storage.yaml
  - infrastructure.yaml
  - monitoring.yaml
  - host-exporter.yaml
  - scripts.yaml
  - gpu.yaml
  - temperature.yaml
  - mail.yaml
  - kubernetes-resources.yaml
