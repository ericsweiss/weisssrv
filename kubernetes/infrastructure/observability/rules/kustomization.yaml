---
# Custom PrometheusRule CRs, one file per rule group. Prometheus discovers them
# because kube-prometheus-stack sets ruleSelectorNilUsesHelmValues: false, so no
# release label is needed. Linted by task lint:prometheus-config.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - storage.yaml
  - infrastructure.yaml
  - monitoring.yaml
  - host-exporter.yaml
  - scripts.yaml
  - gpu.yaml
  - temperature.yaml
  - mail.yaml
  - kubernetes-resources.yaml
  - dns.yaml
