---
# Freshness and success alerts for the host-side scripts and backup producers
# that write node_exporter textfile metrics, plus the in-cluster pg-dump
# CronJobs. Runbooks: docs/12-runbooks.md § Backup and recovery.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-scripts
  namespace: observability
spec:
  groups:
    - name: homelab.scripts
      rules:
        # 0 only on a genuine zfs send/receive error; a vzdump-quiesce deferral
        # surfaces per-dataset via ArchiveBackupDatasetStale /
        # ArchiveBackupChronicallyDeferred instead.
        - alert: ArchiveBackupFailed
          expr: archive_backup_last_run_success == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Archive backup hit a replication error'
            description: >-
              The nightly archive backup exited with a zfs send/receive
              error (not a vzdump-quiesce deferral, which is tracked
              per-dataset). Durability may be at risk — check
              `journalctl -u archive-backup.service` on pve-nas-01.

        # Local DR tier down for a full day: critical, so it emails.
        - alert: ArchiveBackupFailedProlonged
          expr: archive_backup_last_run_success == 0
          for: 24h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Archive backup has been failing for a full day'
            description: >-
              The nightly archive replication has exited with a zfs
              send/receive error on every attempt for 24 hours. The local DR
              tier is down and the offsite chain runs off it — check
              `journalctl -u archive-backup.service` on pve-nas-01.

        - alert: ArchiveBackupStale
          expr: (time() - archive_backup_last_success_timestamp_seconds > 86400 * 2) or absent(archive_backup_last_success_timestamp_seconds)
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Archive backup has not run in over 2 days'
            description: 'No successful archive backup has been recorded for more than 48 hours, or the metric is missing.'

        # Critical escalation at 4 days: two more failed nightly cycles past the
        # warning, with no local DR copy in between. No absent() arm — metric
        # absence stays warning-tier via ArchiveBackupStale.
        - alert: ArchiveBackupStaleCritical
          expr: time() - archive_backup_last_success_timestamp_seconds > 86400 * 4
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Archive backup has not succeeded in over 4 days'
            description: >-
              No successful archive replication for more than 4 days. The local
              DR tier is stale and the offsite restic chain runs off it, so both
              copies are ageing together.

        # Per-dataset durability: a vzdump-quiesce deferral re-emits the
        # previous success timestamp rather than zeroing it, so a chronically
        # deferred dataset still goes stale here.
        - alert: ArchiveBackupDatasetStale
          expr: time() - archive_backup_dataset_last_success_timestamp_seconds > 86400 * 2
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Archive dataset {{ $labels.dataset }} has not replicated in over 2 days'
            description: >-
              Dataset {{ $labels.dataset }} has had no successful archive
              replication for more than 48 hours (last success
              {{ $value | humanizeDuration }} ago). If it is repeatedly
              deferred, the 03:30 vzdump is overrunning the 06:30 archive
              window — see the runbook.

        # First-run edge: a dataset deferred from its first run has no
        # last-success timestamp, so ArchiveBackupDatasetStale cannot fire.
        - alert: ArchiveBackupChronicallyDeferred
          expr: archive_backup_dataset_deferred_runs >= 3
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Archive dataset {{ $labels.dataset }} deferred {{ $value | printf "%.0f" }} runs in a row'
            description: >-
              Dataset {{ $labels.dataset }} has been deferred (vzdump not
              quiesced within the archive window) for
              {{ $value | printf "%.0f" }} consecutive runs — the 03:30
              vzdump is overrunning the 06:30 archive-backup timer. See the
              runbook.

        # Replication succeeding while retention does not: snapshots pile up on
        # the archive pool while last_run_success stays 1. The window is read
        # from the TSDB; the offset arm proves it really holds 48h of history.
        - alert: ArchiveBackupPruneBlocked
          expr: >-
            archive_backup_last_prune_success == 0
            and on (instance)
            (max_over_time(archive_backup_last_prune_success[48h]) == 0)
            and on (instance)
            (archive_backup_last_prune_success offset 47h == 0)
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Archive snapshot pruning has been failing for 2 days'
            description: >-
              Snapshot retention on the archive pool has failed on every run for
              2 days while replication kept succeeding, so archive snapshots only
              accumulate from here and the pool fills. Check
              `journalctl -u archive-backup.service` on pve-nas-01 for the failed
              `zfs destroy`, then re-run `archive-backupctl` (docs/42).

        - alert: MediaMoverFailed
          expr: media_mover_last_run_success == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: 'Media mover failed'
            description: 'The media mover script has not completed successfully.'

        - alert: MediaMoverStale
          expr: (time() - media_mover_last_success_timestamp_seconds > 86400 * 2) or absent(media_mover_last_success_timestamp_seconds)
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: 'Media mover has not run in over 2 days'
            description: 'No successful media mover run has been recorded for more than 48 hours, or the metric is missing.'

        # adguardhome-sync replicates dns-01's AdGuard config to dns-02 every
        # 5 minutes, so for:15m only fires on 3 consecutive failures.
        - alert: AdGuardSyncFailed
          expr: adguardhome_sync_last_run_success == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#network-connectivity-issues'
            summary: 'AdGuard Home sync (dns-01 -> dns-02) is failing'
            description: >-
              adguardhome-sync on dns-01 has recorded failed runs for 15
              minutes (3 consecutive 5-minute cycles). dns-02's AdGuard config
              will drift from dns-01 — check `journalctl -u adguardhome-sync`
              on dns-01.

        # 30m = 6 missed 5-minute cycles. The absent() arm makes an undeployed
        # or removed collector loud.
        - alert: AdGuardSyncStale
          expr: (time() - adguardhome_sync_last_success_timestamp_seconds > 1800) or absent(adguardhome_sync_last_success_timestamp_seconds)
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#network-connectivity-issues'
            summary: 'AdGuard Home sync has not succeeded in over 30 minutes'
            description: >-
              No successful adguardhome-sync run (dns-01 -> dns-02) in over 30
              minutes (6 missed 5-minute cycles), or the metric is absent
              (timer not run, or node_exporter on dns-01 unreachable). dns-02's
              AdGuard config is drifting from dns-01.

        # The run-success bit covers the local renewal and reload only, so the
        # failed-target count is the second arm: a dead distribution target
        # leaves the bit at 1.
        - alert: CertRenewalFailed
          expr: cert_renewal_last_run_success == 0 or cert_distribution_last_run_failed_targets > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#certificate-renewal-issues'
            summary: 'Certificate renewal or distribution failed'
            description: >-
              The local renewal and reload failed, or at least one distribution
              target did not take the new cert. CertDistributionTargetFailed
              names the target.

        # A renewal pipeline broken for three days is an incident, not a nudge:
        # CertExpiringSoon* is only the expiry backstop, and a renewal that has
        # been failing for weeks burns the whole ~60d acme.sh cycle of margin.
        - alert: CertRenewalFailedProlonged
          expr: cert_renewal_last_run_success == 0 or cert_distribution_last_run_failed_targets > 0
          for: 72h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#certificate-renewal-issues'
            summary: 'Certificate renewal has been failing for over 3 days'
            description: >-
              acme.sh local renewal and reload on {{ $labels.instance }}, or
              distribution to at least one target, has failed continuously for
              3 days. The wildcard cert still has margin, but nothing is
              renewing it — fix the pipeline before CertExpiringSoon is the only
              thing left.

        # The run-success bit only moves when the script runs, so a dead acme.sh
        # cron neither renews nor fails and only time-since-success sees it. 75d
        # is past the ~60d renewal cycle, leaving ~15d before expiry.
        - alert: CertRenewalStale
          expr: time() - cert_renewal_last_success_timestamp_seconds > 86400 * 75
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#certificate-renewal-issues'
            summary: 'No successful cert renewal on {{ $labels.instance }} in over 75 days'
            description: >-
              acme.sh on {{ $labels.instance }} last distributed a cert
              {{ $value | humanizeDuration }} ago, past the ~60-day renewal
              cycle, so renewal has stopped running rather than failing. Check
              `crontab -l` for the acme.sh --cron entry and
              `journalctl -t homelab-cert-reload` (docs/12 §Certificate Renewal
              Issues). No absent arm: the gauge appears only after a first
              success, and a failing run is CertRenewalFailed's.

        # Per-target distribution gauge: a dead target is otherwise collapsed
        # into the run-level bit and never named. The daily check writes the
        # gauge, which holds until the next run, so the hold spans one interval.
        - alert: CertDistributionTargetFailed
          expr: cert_distribution_target_last_run_success == 0
          for: 25h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#certificate-renewal-issues'
            summary: 'Certificate distribution to {{ $labels.host }} is failing'
            description: >-
              acme.sh on {{ $labels.instance }} could not install the wildcard
              cert on {{ $labels.host }}. Every other target is unaffected, so
              that host keeps serving the cert it already holds until it
              expires. Check `journalctl -t homelab-cert-reload` and the host's
              SSH reachability (docs/12 §Certificate Renewal Issues).

        - alert: CertExpiringSoon
          expr: (cert_local_expiry_timestamp_seconds - time() < 86400 * 14) or absent(cert_local_expiry_timestamp_seconds)
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#certificate-renewal-issues'
            summary: 'Host-distributed wildcard cert expires in under 14 days'
            description: >-
              The acme.sh-distributed *.${cluster_internal_domain} cert is within 14 days
              of its notAfter (so acme.sh renewal/distribution has stopped
              working), or the metric is missing (host off inventory).
              Tracks real expiry, not time-since-renewal — acme.sh renews
              ~60d apart, so a renewal-timestamp staleness proxy false-fires
              for most of each cycle. cert-manager's CertExpiring alerts
              cover in-cluster certs but not these host-distributed certs.

        # This cert terminates NFS-over-TLS on pve-nas-01, AdGuard TLS and the
        # Loki ingest ingress, so expiry breaks storage and logging, not just web
        # UIs. No absent() arm — metric absence stays warning-tier above.
        - alert: CertExpiringSoonCritical
          expr: cert_local_expiry_timestamp_seconds - time() < 86400 * 3
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#certificate-renewal-issues'
            summary: 'Host-distributed wildcard cert expires in under 3 days'
            description: >-
              The acme.sh-distributed *.${cluster_internal_domain} cert on
              {{ $labels.instance }} expires in
              {{ $value | humanizeDuration }}. NFS-over-TLS (k3s PV
              mounts), AdGuard TLS, and the Loki ingress all break at
              expiry — fix renewal and redistribute now.

        - alert: GitLabBackupFailed
          expr: gitlab_backup_last_run_success == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'GitLab backup failed'
            description: 'The nightly gitlab-backup run did not complete successfully.'

        # "The run succeeded" and "a restorable artefact exists" are different
        # claims: a wrapper whose landing path stopped matching sizes nothing.
        # label_replace copies __name__, which alert labels do not carry.
        - alert: BackupArtifactEmpty
          expr: >-
            label_replace(
              {__name__=~".+_backup_last_size_bytes"} == 0,
              "metric", "$1", "__name__", "(.*)")
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: '{{ $labels.metric }} is 0 on {{ $labels.instance }} — the backup run reported success but produced no artefact'
            description: >-
              A backup wrapper reported success while its most recent artefact
              measured 0 bytes, i.e. the wrapper found no file to size. The
              usual cause is a landing-path change that never reached the
              application (config written but the reconfigure/restart never
              ran), or a backup written somewhere other than where the wrapper
              looks. Check the wrapper's BACKUP_PATH against the application's
              EFFECTIVE configuration on the host — not just its config file.

        - alert: GitLabBackupStale
          expr: (time() - gitlab_backup_last_success_timestamp_seconds > 86400 * 2) or absent(gitlab_backup_last_success_timestamp_seconds)
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'GitLab backup has not succeeded in over 2 days'
            description: >-
              No successful GitLab backup has been recorded for more than
              48 hours, or the metric is missing (backup wrapper not run,
              node_exporter on the GitLab VM unreachable, or VM off
              inventory). GitLab data lives on a zvol; Proxmox VM
              snapshots are the only other DR path.

        # Four days is two more failed nightly cycles past the warning. No
        # absent() arm — metric absence stays warning-tier above.
        - alert: GitLabBackupStaleCritical
          expr: time() - gitlab_backup_last_success_timestamp_seconds > 86400 * 4
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'GitLab backup has not succeeded in over 4 days'
            description: >-
              No successful GitLab backup for more than 4 days. GitLab
              data lives on a zvol; Proxmox VM snapshots are the only
              other DR path. Investigate the backup wrapper on the
              GitLab VM now.

        # gitlab-backup excludes gitlab-secrets.json from the tarball and the
        # artefact glob, so a healthy tarball can still be unrestorable. Absent
        # emits present=0 and size=0; truncated emits present=1 and size=0.
        - alert: GitLabBackupSecretsMissing
          expr: >-
            gitlab_backup_secrets_present == 0
            or gitlab_backup_secrets_size_bytes == 0
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'gitlab-secrets.json is missing or empty in the GitLab backup landing zone'
            description: >-
              gitlab-secrets.json is absent from, or 0 bytes in, the GitLab
              backup landing zone on {{ $labels.instance }}. Without it a
              restored database cannot decrypt CI variables, 2FA secrets or
              runner tokens — the tarball alone is not a restore. Check the
              `cp` stage of gitlab-backup-run.sh and the landing-zone mount.

        # Nightly PostgreSQL logical dump (nextcloud-backup.timer on the VM).
        # The dump rides the app zvol -> archive + vzdump; file data lives on
        # tank/nextcloud-data.
        - alert: NextcloudBackupFailed
          expr: nextcloud_backup_last_run_success == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/35-nextcloud.md'
            summary: 'Nextcloud database backup failed'
            description: >-
              The nightly Nextcloud pg_dump did not complete successfully.
              Check `journalctl -u nextcloud-backup.service` on the
              Nextcloud VM (10.0.10.156).

        - alert: NextcloudBackupStale
          expr: (time() - nextcloud_backup_last_success_timestamp_seconds > 86400 * 2) or absent(nextcloud_backup_last_success_timestamp_seconds)
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/35-nextcloud.md'
            summary: 'Nextcloud database backup has not succeeded in over 2 days'
            description: >-
              No successful Nextcloud pg_dump has been recorded for more
              than 48 hours, or the metric is missing (timer not run,
              node_exporter on the VM unreachable, or VM off inventory).

        # Nightly pg_dumpall onto the app zvol (rides ssd/appdata -> archive,
        # raw-encrypted). 48h window like GitLab (nightly + grace).
        - alert: ImmichBackupFailed
          expr: immich_backup_last_run_success == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Immich database backup failed'
            description: 'The nightly Immich pg_dumpall did not complete successfully.'

        - alert: ImmichBackupStale
          expr: (time() - immich_backup_last_success_timestamp_seconds > 86400 * 2) or absent(immich_backup_last_success_timestamp_seconds)
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Immich database backup has not succeeded in over 2 days'
            description: >-
              No successful Immich database backup has been recorded for
              more than 48 hours, or the metric is missing (backup timer not
              run, node_exporter on the Immich VM unreachable, or VM off
              inventory). The photo library and DB live on encrypted zvols;
              the pg_dumpall is the point-in-time DB recovery path.

        # In-cluster CronJob, so freshness is kube_cronjob_status_last_successful_time.
        # 26h is one nightly cycle plus grace; absent() covers a missing CronJob.
        # `max by (namespace, cronjob)` drops KSM scrape labels from the group.
        - alert: AuthentikBackupStale
          expr: >-
            (time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{namespace="authentik", cronjob="authentik-pg-dump"}) > 93600)
            or absent(kube_cronjob_status_last_successful_time{namespace="authentik", cronjob="authentik-pg-dump"})
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Authentik database backup has not succeeded in over 26 hours'
            description: >-
              The nightly authentik-pg-dump CronJob has had no successful
              completion for more than 26 hours (one nightly cycle + grace),
              or the metric is absent (CronJob missing / never succeeded /
              kube-state-metrics down). Authentik's Postgres lives on a zvol;
              losing it loses every SSO app's identity provider.

        # Same shape as AuthentikBackupStale (26h window, absent() arm, KSM
        # scrape labels aggregated away).
        - alert: MealieBackupStale
          expr: >-
            (time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{namespace="recipes", cronjob="mealie-pg-dump"}) > 93600)
            or absent(kube_cronjob_status_last_successful_time{namespace="recipes", cronjob="mealie-pg-dump"})
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Mealie database backup has not succeeded in over 26 hours'
            description: >-
              The nightly mealie-pg-dump CronJob (recipes namespace) has had
              no successful completion for more than 26 hours, or the metric
              is absent (CronJob missing / never succeeded / kube-state-metrics
              down). Mealie's Postgres lives on a dedicated zvol.

        # Off-node etcd snapshot copy (k3s servers -> pve-nas-01, docs/17). k3s
        # snapshots every 12h, so 36h is three missed cycles. The existence
        # witness is per server; a vector-wide absent() hides a single one.
        - alert: EtcdSnapshotStale
          expr: >-
            (time() - etcd_snapshot_last_copy_timestamp_seconds > 129600)
            or (
              up{job="node-exporter-host", instance=~"10\\.0\\.10\\.22[237]:9101"} == 1
              unless on (instance) etcd_snapshot_last_copy_timestamp_seconds
            )
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'etcd snapshot off-node copy is stale on {{ $labels.instance }}'
            description: >-
              The newest etcd snapshot copied to pve-nas-01 from
              {{ $labels.instance }} is more than 36 hours old (three 12h
              snapshot cycles), or that server emits no copy metric at all
              while its node_exporter is up. Losing all three server nodes
              without an off-node snapshot loses etcd — check the copy timer
              on the k3s server nodes.

        # Nightly guest-image backup to tank-proxmox; the per-host vzdump
        # hookscript writes the metrics.
        - alert: VzdumpBackupFailed
          expr: vzdump_backup_last_run_success == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Proxmox vzdump backup failed'
            description: >-
              The nightly Proxmox vzdump job (guest images -> tank-proxmox)
              did not complete successfully. Guest VM/LXC images are the DR
              path for the compute-node guests.

        # A zero-guest job still reports success and refreshes the timestamp, so
        # the failure and staleness alerts stay green while nothing lands. The 30d
        # arm skips hosts whose only guests are excluded k3s cattle.
        - alert: VzdumpBackupNoGuests
          expr: >-
            vzdump_backup_guests == 0
            and on (instance) vzdump_backup_last_run_success == 1
            and on (instance) (max_over_time(vzdump_backup_guests[30d]) > 0)
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Proxmox vzdump on {{ $labels.instance }} backed up no guests'
            description: >-
              The last vzdump job on {{ $labels.instance }} finished
              successfully without starting a single guest backup, so its
              success metric and timestamp are green while nothing new reached
              tank-proxmox. Check the guest selection on the Proxmox backup
              schedule and that this host still owns guests. A host that has
              backed up no guest at all in 30 days is excluded, so the k3s-only
              hosts never enter this alert.

        # /etc/pve carries the cluster CA, node certs, authkey and user.cfg, the
        # first step of total-site recovery. No absent() arm: the series does
        # not exist before the first pve-nas-01 deploy.
        - alert: PveClusterBackupFailed
          expr: pve_cluster_backup_last_run_success == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Proxmox /etc/pve cluster-config backup failed'
            description: >-
              The nightly /etc/pve tar (cluster CA, corosync config and
              every guest definition) did not complete successfully. This
              is the DR path for rebuilding the cluster itself, not the
              guests — vzdump covers those.

        # The Failed rule above cannot fire if the 02:15 timer simply stops: the
        # last-written success=1 persists in the textfile forever. 36h matches
        # the vzdump window (nightly cadence, one deferred run tolerated).
        - alert: PveClusterBackupStale
          expr: time() - pve_cluster_backup_last_success_timestamp_seconds > 129600
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Proxmox /etc/pve cluster-config backup has not succeeded in over 36 hours'
            description: >-
              No successful /etc/pve tar in more than 36 hours — the
              pve-cluster-backup timer has probably stopped. /etc/pve holds the
              cluster CA, node certs, authkey and API tokens; docs/17 makes
              restoring it the first step of total-site recovery.

        # 36h tolerates one nightly run deferred by host maintenance; two missed
        # nights still detect. The absence arm is a per-host existence witness
        # (`up == 1` on the same instance), so one dead hookscript is visible.
        - alert: VzdumpBackupStale
          expr: >-
            (
              (time() - vzdump_backup_last_success_timestamp_seconds > 129600)
              unless on (instance) (
                vzdump_backup_guests == 0
                and on (instance) vzdump_backup_last_run_success == 1
              )
            )
            or (
              up{job="node-exporter-host", instance=~"10\\.0\\.10\\.10[2-7]:9101"} == 1
              unless on (instance) vzdump_backup_last_success_timestamp_seconds
            )
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Proxmox vzdump backup has not succeeded in over 36 hours'
            description: >-
              No successful Proxmox vzdump backup has been recorded for more
              than 36 hours on {{ $labels.instance }}, or that host emits no
              vzdump metric at all while its node_exporter is up (hookscript
              not deployed there). Guest VM/LXC images on tank-proxmox are the
              DR path for the compute-node guests.

        # Three missed nights: guest images are the only DR path for the compute
        # nodes. Absence stays warning-tier. A host whose last run succeeded with
        # no guests is dropped by the `unless`; VzdumpBackupNoGuests watches it.
        - alert: VzdumpBackupStaleCritical
          expr: >-
            (time() - vzdump_backup_last_success_timestamp_seconds > 86400 * 3)
            unless on (instance) (
              vzdump_backup_guests == 0
              and on (instance) vzdump_backup_last_run_success == 1
            )
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Proxmox vzdump backup has not succeeded in over 3 days'
            description: >-
              No successful vzdump on {{ $labels.instance }} for more than 3
              days. Guest VM/LXC images on tank-proxmox are the DR path for the
              compute-node guests. A host whose last run succeeded while owning
              no guests is excluded — it pages through VzdumpBackupNoGuests
              instead, at warning.

        # Nightly offsite B2 backup (restic + rclone/B2) on pve-nas-01, chained
        # OnSuccess of archive-backup.service. The `unless` arm falls back to the
        # combined run gauge only where the split upload gauge is absent.
        - alert: ResticOffsiteFailed
          expr: >-
            restic_offsite_last_backup_success == 0
            or (restic_offsite_last_run_success == 0
                unless on (instance) restic_offsite_last_backup_success)
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Offsite B2 backup (restic) failed'
            description: >-
              The nightly restic-offsite upload to B2 exited unsuccessfully
              (upload error, or the freshness guard aborted on a stale
              archsync snapshot). Offsite durability is at risk — check
              `restic-offsitectl status` / `journalctl -u restic-offsite`
              on pve-nas-01.

        # B2 is the only offsite copy, so a full day of failed uploads emails.
        # The day is measured against the metric's own timestamp, not a `for:`.
        # A repo that never backed up emits no timestamp; ResticOffsiteStale owns it.
        - alert: ResticOffsiteFailedProlonged
          expr: >-
            (
              restic_offsite_last_backup_success == 0
              and on (instance)
              (time() - restic_offsite_last_backup_timestamp_seconds > 86400)
            )
            or (
              (restic_offsite_last_run_success == 0
               unless on (instance) restic_offsite_last_backup_success)
              and on (instance)
              (time() - restic_offsite_last_success_timestamp_seconds > 86400)
            )
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Offsite B2 backup has been failing for a full day'
            description: >-
              Every restic-offsite upload has failed for 24 hours. B2 is the
              only offsite copy of the curated dumps — treat this as an
              incident, not a nightly retry (docs/42).

        # restic rc=3: the snapshot was saved but some paths were unreadable.
        # The gauge is sticky — only an rc=0 backup clears it — so the 36h arm
        # really does span two nightly runs. Silent until the pin carries it.
        - alert: ResticOffsiteIncomplete
          expr: restic_offsite_last_run_incomplete == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#incomplete-offsite-run'
            summary: 'The last offsite restic run skipped unreadable paths'
            description: >-
              restic exited 3: the snapshot exists but at least one path could
              not be read. Check which paths the wrapper logged - an ext4 clone
              mounted without journal replay reads back EBADMSG.

        - alert: ResticOffsiteIncompleteProlonged
          expr: restic_offsite_last_run_incomplete == 1
          for: 36h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#incomplete-offsite-run'
            summary: 'Two consecutive offsite runs were incomplete'
            description: >-
              The offsite snapshot has skipped unreadable paths across two
              consecutive nightly runs. Whatever cannot be read has not been in
              B2 for over a day (docs/42).

        # Retention that cannot run leaves the repo growing without bound, and the
        # ceiling guard is self-latching. History is the clock: min_over_time == 1
        # means every sample was blocked, and the offset arm proves the 48h window.
        - alert: ResticOffsitePruneBlocked
          expr: >-
            restic_offsite_retention_blocked == 1
            and on (instance)
            (min_over_time(restic_offsite_retention_blocked[48h]) == 1)
            and on (instance)
            (restic_offsite_retention_blocked offset 47h == 1)
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/42-offsite-backup.md'
            summary: 'Offsite B2 retention has been refusing to prune for 2 days'
            description: >-
              restic-offsitectl has hit its forget-ceiling guard on every run
              for 2 days, so no snapshot has been expired. The delete set only
              grows from here. Inspect it with `restic-offsitectl snapshots`,
              then either accept it once with
              `restic-offsitectl prune --max-remove N` or raise
              restic_offsite_forget_max_remove (docs/42).

        # last_prune_success is 0 for both "the prune errored" and "the ceiling
        # guard refused". The refusal has its own alert and 48h grace above, so
        # it is subtracted here. Same TSDB window idiom.
        - alert: ResticOffsitePruneFailed
          expr: >-
            (
              restic_offsite_last_prune_success == 0
              and on (instance)
              (max_over_time(restic_offsite_last_prune_success[24h]) == 0)
              and on (instance)
              (restic_offsite_last_prune_success offset 23h == 0)
            )
            unless on (instance) restic_offsite_retention_blocked == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/42-offsite-backup.md'
            summary: 'Offsite B2 prune/forget has been erroring for a day'
            description: >-
              The retention stage of restic-offsitectl has errored for 24 hours
              while uploads continue — a real failure, not the delete-set
              ceiling guard (that is ResticOffsitePruneBlocked). Usually a stale
              repository lock: check `restic-offsitectl status` on pve-nas-01
              and `restic-offsitectl unlock` if a crashed run left one
              (docs/42).

        # last_prune_success is absent, not 0, until a retention pass has run,
        # so "never pruned" is invisible to the `== 0` arm above. The 3d window
        # lives in the query: a NAS reboot discards a pending `for:` clock.
        - alert: ResticOffsitePruneNeverRan
          expr: >-
            (
              restic_offsite_last_success_timestamp_seconds
              unless on (instance)
              last_over_time(restic_offsite_last_prune_success[3d])
            )
            and on (instance)
            (restic_offsite_last_success_timestamp_seconds offset 71h)
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/42-offsite-backup.md'
            summary: 'Offsite B2 retention has never run on {{ $labels.instance }}'
            description: >-
              {{ $labels.instance }} is uploading to B2 but has published no
              prune result for 3 days, so the nightly forget/prune stage has
              never completed there. Retention is not running and the repo only
              grows. Run `restic-offsitectl prune` and check the journal
              (docs/42).

        # CRITICAL: an over-broad forget shows up as the repo shrinking, and B2's
        # 30-day hide window makes catching it inside 2 days the difference
        # between an undelete and permanent loss. The `> 0` guard is load-bearing:
        # the emitter writes 0 ("unknown") on every aborted run, which unguarded
        # makes the comparison trivially true and pages for a repo that never shrank.
        - alert: ResticOffsiteRepoShrank
          expr: >-
            delta(restic_offsite_repo_size_bytes[2d]) < -0.2 * restic_offsite_repo_size_bytes
            and restic_offsite_repo_size_bytes > 0
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/42-offsite-backup.md'
            summary: 'Offsite B2 repo shrank by more than 20% in 2 days'
            description: >-
              restic_offsite_repo_size_bytes dropped
              {{ $value | humanize1024 }}B over 2 days — more than an expected
              prune. Stop the next prune and recover from B2's hide lifecycle
              before its 30-day window closes (docs/42).

        # 50h tolerates one skipped night: B2 chains off archive-backup, which
        # can defer. absent() fires if the collector is gone.
        - alert: ResticOffsiteStale
          expr: (time() - restic_offsite_last_success_timestamp_seconds > 180000) or absent(restic_offsite_last_success_timestamp_seconds)
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Offsite B2 backup has not succeeded in over 50 hours'
            description: >-
              No successful restic-offsite run to B2 in more than 50 hours
              (one skipped night + grace), or the metric is absent (role not
              deployed, or node_exporter on pve-nas-01 unreachable). B2 is
              the only offsite copy of the curated logical dumps + legacy
              machine backups.

        # Four days with no offsite copy at all. No absent() arm — absence stays
        # warning-tier via ResticOffsiteStale above.
        - alert: ResticOffsiteStaleCritical
          expr: time() - restic_offsite_last_success_timestamp_seconds > 86400 * 4
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/42-offsite-backup.md'
            summary: 'Offsite B2 backup has not succeeded in over 4 days'
            description: >-
              No successful restic-offsite run to B2 for more than 4 days. The
              only offsite copy is ageing out while the local tiers carry the
              whole risk (docs/42).

        # Repo integrity, distinct from the freshness of the last upload:
        # restic-offsite-verify.timer runs a rotating read-data `restic check`
        # weekly. No absent() arm: verify metrics appear only after the first run.
        - alert: ResticOffsiteVerifyFailed
          expr: restic_offsite_last_verify_success == 0
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/42-offsite-backup.md'
            summary: 'Offsite B2 repo verify FAILED'
            description: >-
              The last `restic check` against the B2 repository failed — the
              only offsite copy may be corrupt or unrestorable. Run
              `restic-offsitectl verify` on pve-nas-01 and investigate the
              reported errors before relying on it for recovery (docs/42).

        - alert: ResticOffsiteVerifyStale
          expr: time() - restic_offsite_last_verify_timestamp_seconds > 691200
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/42-offsite-backup.md'
            summary: 'Offsite B2 repo verify is stale (>8d)'
            description: >-
              No successful `restic check` against the B2 repository in over 8
              days (weekly timer + grace). The offsite copy is unproven — run
              `restic-offsitectl verify` on pve-nas-01 (docs/42).

        # Two missed weekly verifies: the offsite tier is unproven for a fortnight
        # while restic-offsitectl keeps reporting green uploads.
        - alert: ResticOffsiteVerifyStaleCritical
          expr: time() - restic_offsite_last_verify_timestamp_seconds > 86400 * 14
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/42-offsite-backup.md'
            summary: 'Offsite B2 repo has not been verified in over 14 days'
            description: >-
              No successful `restic check` in more than 14 days. Restore-verify
              is the only proof the offsite copy is restorable — treat an
              unverified fortnight as an incident (docs/42).

        # `restic check` proves structure, not that a restored file matches its
        # source; the quarterly drill byte-compares the smallest restored files.
        # BackupRestoreDrillNeverRan owns the absence case, at warning.
        - alert: BackupRestoreDrillStale
          expr: >-
            (time() - backup_restore_drill_last_success_seconds > 86400 * 100)
            or (time() - backup_restore_drill_last_run_seconds > 86400 * 100)
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/42-offsite-backup.md'
            summary: 'Offsite restore drill has not passed in over 100 days'
            description: >-
              No restore drill has compared a restored file byte-for-byte
              against its source in more than 100 days (or no drill has been
              ATTEMPTED in that long). Integrity is not restorability — run
              `systemctl start backup-restore-drill.service` on pve-nas-01 and
              read `journalctl -t backup-restore-drill` (docs/42).

        # The absence case, split out of BackupRestoreDrillStale so it cannot page
        # critical before the first quarterly elapse. The role seeds a drill on
        # install, so 26h of `for:` absorbs a deploy at any hour.
        - alert: BackupRestoreDrillNeverRan
          expr: absent(backup_restore_drill_last_success_seconds)
          for: 26h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/42-offsite-backup.md'
            summary: 'No offsite restore drill has ever passed'
            description: >-
              backup_restore_drill_last_success_seconds does not exist anywhere,
              so no restore drill has ever compared a restored file
              byte-for-byte against its source. Causes: the role's seed drill
              never ran; it ran and FAILED (check
              `backup_restore_drill_last_run_seconds` — it advances on
              failure); restic_offsite is not deployed; or
              `restic_offsite_restore_drill_enabled` was set false, which makes
              the role remove the metric. The drill is mandatory on this
              cluster, so disabling it is not an answer. Run
              `systemctl start backup-restore-drill.service` on pve-nas-01 and
              read `journalctl -t backup-restore-drill` (docs/42).

        # A drill that ran and did not pass is otherwise invisible for a quarter.
        # _last_run_seconds advances on failure while _last_success_seconds is
        # preserved, so the gap between them is the failure signal.
        - alert: BackupRestoreDrillFailing
          expr: >-
            backup_restore_drill_last_run_seconds
            - backup_restore_drill_last_success_seconds > 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/42-offsite-backup.md'
            summary: 'The most recent offsite restore drill did not pass'
            description: >-
              A restore drill has been attempted since the last one that passed,
              and it failed — restic restore returned non-zero, a restored file
              did not match its source, or the drill covered fewer sources than
              its floor. Read `journalctl -t backup-restore-drill` on pve-nas-01
              (docs/42). The staleness clock stays green for 100 days, so this is
              the only timely signal.

        # Coverage floor: a drill passing on a handful of files from one dataset
        # looks like one that spanned the estate. files_compared is the proxy,
        # guarded on run == success so a failed drill does not fire twice.
        - alert: BackupRestoreDrillProvedTooLittle
          expr: >-
            backup_restore_drill_files_compared < 3
            and on (instance)
            (backup_restore_drill_last_run_seconds
             == backup_restore_drill_last_success_seconds)
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/42-offsite-backup.md'
            summary: 'Offsite restore drill passed on fewer than 3 files'
            description: >-
              The last restore drill passed but byte-compared only
              {{ $value }} file(s), below the per-source floor the drill is
              configured for. The pass proves that narrow slice and nothing
              else — check restic_offsite_restore_drill_min_sources and the
              per-source breakdown in `journalctl -t backup-restore-drill`.

        # NAS-side independent freshness: the VM wrappers write their metrics from
        # inside the VM and stay green when the file never reached tank/backups.
        # The absent arm is per app; pve-cluster also gates on its success metric.
        - alert: BackupArtifactStale
          # mtime 0 is the collector's "nothing matched the glob" sentinel, so the
          # guard keeps a dump that never landed out of the freshness arm:
          # BackupArtifactNeverLanded owns that case.
          expr: >-
            (backup_artifact_last_mtime_seconds != 0
             and time() - backup_artifact_last_mtime_seconds > 180000)
            or absent(backup_artifact_last_mtime_seconds{app="authentik"})
            or absent(backup_artifact_last_mtime_seconds{app="mealie"})
            or absent(backup_artifact_last_mtime_seconds{app="hindsight"})
            or absent(backup_artifact_last_mtime_seconds{app="gitlab"})
            or absent(backup_artifact_last_mtime_seconds{app="immich"})
            or absent(backup_artifact_last_mtime_seconds{app="nextcloud"})
            or absent(backup_artifact_last_mtime_seconds{app="home-assistant"})
            or (
              absent(backup_artifact_last_mtime_seconds{app="pve-cluster"})
              and on() (pve_cluster_backup_last_success_timestamp_seconds > 0)
            )
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Backup artifact for {{ $labels.app }} has not landed on tank/backups in over 50 hours'
            description: >-
              The newest dump under tank/backups/apps/{{ $labels.app }} is
              more than 50 hours old, or its per-app series is absent (the
              app's landing dir is missing / never created). The dump is not
              reaching the file-walkable dataset that rides archsync into B2 —
              check the VM's NFS mount + backup wrapper landing path, and that
              the tank/backups/apps/{{ $labels.app }} subdir exists.

        # Four days is two more failed nightly cycles past the warning, with the
        # dump never reaching the dataset that rides into B2. Absence and the
        # mtime-0 never-landed sentinel both stay warning-tier above.
        - alert: BackupArtifactStaleCritical
          expr: >-
            backup_artifact_last_mtime_seconds != 0
            and time() - backup_artifact_last_mtime_seconds > 86400 * 4
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Backup artifact for {{ $labels.app }} has not landed on tank/backups in over 4 days'
            description: >-
              The newest dump under tank/backups/apps/{{ $labels.app }} is more
              than 4 days old, so nothing for that app has entered the offsite
              chain in four nights.

        # mtime 0 is the collector saying nothing matched the app's glob, so no
        # dump has EVER landed. The window outlasts a full schedule interval and,
        # unlike a 26h `for:`, survives a Prometheus restart.
        - alert: BackupArtifactNeverLanded
          expr: >-
            max_over_time(backup_artifact_last_mtime_seconds[26h]) == 0
            and backup_artifact_last_mtime_seconds offset 25h == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'No backup artefact has ever landed for {{ $labels.app }}'
            description: >-
              Nothing under tank/backups/apps/{{ $labels.app }} matches that
              app's artefact glob, and nothing has for over a day. Either the
              dump job has never run, or it writes somewhere the collector does
              not glob — check the wrapper's landing path and the app's entry
              in nas_storage_backup_artifact_apps.

        # The NAS-side counterpart to BackupArtifactEmpty, for apps with no
        # `<app>_backup_last_size_bytes` series. The mtime guard splits the two
        # meanings of 0: mtime 0 is no file, mtime > 0 with size 0 is an empty one.
        - alert: BackupArtifactZeroBytes
          expr: >-
            backup_artifact_last_size_bytes == 0
            and backup_artifact_last_mtime_seconds > 0
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'Backup artifact for {{ $labels.app }} landed 0 bytes on tank/backups'
            description: >-
              The newest file matching {{ $labels.app }}'s artefact glob under
              tank/backups/apps/{{ $labels.app }} is 0 bytes, with a recent
              mtime — the dump ran and wrote nothing (a truncated pg_dump, a
              full landing zone, or a wrapper piping an error into the file).
              An empty dump restores nothing; treat it as no backup for that
              app tonight.

        # Companions are the files an artefact cannot be restored without, and
        # they sit outside the artefact glob. Absent emits present=0 and size=0;
        # truncated emits present=1 and size=0.
        - alert: BackupArtifactCompanionMissing
          expr: >-
            backup_artifact_companion_present == 0
            or backup_artifact_companion_size_bytes == 0
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/42-offsite-backup.md'
            summary: '{{ $labels.file }} is missing or empty in tank/backups/apps/{{ $labels.app }}'
            description: >-
              A file required to RESTORE {{ $labels.app }}'s backup
              ({{ $labels.file }}) is absent from, or 0 bytes in,
              tank/backups/apps/{{ $labels.app }}. The artefact itself may be
              fresh and full-size and still be unrestorable. Check the app's
              backup wrapper — the companion copy is a separate step from the
              dump and fails separately.

        # Collector meta-failure: the oneshot is stuck or the timer was never
        # deployed, either of which leaves BackupArtifactStale on stale inputs.
        # The timer runs every 10m, so 2h is ~12 cycles of slack.
        - alert: BackupArtifactCollectorStale
          expr: >-
            (time() - backup_artifact_collector_last_success_seconds > 7200)
            or absent(backup_artifact_collector_last_success_seconds)
          for: 5m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md#backup-and-recovery'
            summary: 'backup-artifact mtime collector is degraded or missing on {{ $labels.instance }}'
            description: >-
              backup_artifact_collector_last_success_seconds is stale (>2h) or
              entirely absent — the per-app backup-artifact freshness alerts
              are serving stale or no inputs. Check
              `journalctl -u backup-artifact-mtime-collector.service` and
              `systemctl status backup-artifact-mtime-collector.timer` on
              pve-nas-01.
