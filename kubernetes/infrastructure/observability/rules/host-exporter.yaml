---
# Coverage for job="node-exporter-host" (:9101 on the hosts, LXCs, VMs and k3s
# servers); the chart's mixin selects the in-cluster DaemonSet instead. The
# device=~ matcher selects the physical NICs and the bond only.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-host-exporter
  namespace: observability
spec:
  groups:
    - name: homelab.host-exporter
      rules:
        # One host's exporter dying is otherwise invisible: TargetDown needs
        # >10% of a job's targets down (1/15), and every *CollectorStale rule
        # yields no sample once its series goes stale, so it stops evaluating.
        - alert: HostExporterDown
          expr: >-
            up{job="node-exporter-host"} == 0
            or absent(up{job="node-exporter-host"})
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: 'Host node_exporter {{ $labels.instance }} is down'
            description: >-
              Prometheus has not scraped node_exporter on
              {{ $labels.instance }} (:9101) for 15 minutes. If the host
              itself is up, this host's SMART, ZFS-pool, thermal, PSI and
              backup-freshness alerts are now BLIND — they stop evaluating
              rather than firing. Check
              `systemctl status prometheus-node-exporter` on the host, and
              the sg-metrics firewall rule if it was recently rebuilt.

        # NIC error ratio, mirroring the mixin's NodeNetwork*Errs at 1%/1h.
        # Both arms stay on [5m]: at a 60s scrape a shorter window lets one
        # missed scrape empty rate() and restart the 1h `for:`.
        - alert: HostNetworkTransmitErrs
          expr: >-
            rate(node_network_transmit_errs_total{job="node-exporter-host", device=~"nic[0-9]+|bond[0-9]+|eth[0-9]+"}[5m])
            / rate(node_network_transmit_packets_total{job="node-exporter-host", device=~"nic[0-9]+|bond[0-9]+|eth[0-9]+"}[5m])
            > 0.01
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/34-bond-mac-flapping.md'
            summary: 'NIC {{ $labels.device }} on {{ $labels.instance }} is dropping transmits'
            description: >-
              {{ $labels.device }} on {{ $labels.instance }} has failed
              {{ $value | humanizePercentage }} of its transmits for an
              hour. Check `ethtool -S {{ $labels.device }}` and
              `dmesg | grep -i {{ $labels.device }}` — on the OptiPlex
              e1000e NICs this is the "Hardware Unit Hang" family
              (docs/34, nic_tuning offload guards).

        - alert: HostNetworkReceiveErrs
          expr: >-
            rate(node_network_receive_errs_total{job="node-exporter-host", device=~"nic[0-9]+|bond[0-9]+|eth[0-9]+"}[5m])
            / rate(node_network_receive_packets_total{job="node-exporter-host", device=~"nic[0-9]+|bond[0-9]+|eth[0-9]+"}[5m])
            > 0.01
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/34-bond-mac-flapping.md'
            summary: 'NIC {{ $labels.device }} on {{ $labels.instance }} is dropping receives'
            description: >-
              {{ $labels.device }} on {{ $labels.instance }} has failed
              {{ $value | humanizePercentage }} of its receives for an
              hour — cabling, switch port, or driver. Check
              `ethtool -S {{ $labels.device }}` and the switch counters.

        # Not the mixin's `changes(...[2m]) > 2`: at a 60s scrape a 2m window
        # holds three samples and can express at most two changes. >4 in 10m is
        # at least three bounces (a clean link event contributes two).
        - alert: HostNetworkInterfaceFlapping
          expr: >-
            changes(node_network_up{job="node-exporter-host", device=~"nic[0-9]+|bond[0-9]+|eth[0-9]+"}[10m]) > 4
          for: 2m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/34-bond-mac-flapping.md'
            summary: 'NIC {{ $labels.device }} on {{ $labels.instance }} is flapping'
            description: >-
              Link state on {{ $labels.device }} ({{ $labels.instance }})
              changed more than four times in the last 10 minutes — at
              least three bounces at this job's 60s scrape interval. Check
              the cable and switch port; on a bonded host also confirm the
              bond has not fallen back to a single slave.

        # Bond degradation on the three active-backup hosts (.104/.105/.106).
        # docs/34 traces the recurring guest network black-hole to bond
        # configuration, so a silently-failed slave matters here.
        - alert: HostBondingDegraded
          expr: >-
            (node_bonding_slaves{job="node-exporter-host"} - node_bonding_active{job="node-exporter-host"}) != 0
          for: 5m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/34-bond-mac-flapping.md'
            summary: 'Bond {{ $labels.master }} on {{ $labels.instance }} has a failed slave'
            description: >-
              {{ $labels.master }} on {{ $labels.instance }} has fewer
              active slaves than configured — the host is running without
              NIC redundancy. `cat /proc/net/bonding/{{ $labels.master }}`
              to find the down slave (docs/34).

        # A malformed .prom file makes node_exporter skip it. The
        # *CollectorStale rules only catch a collector that STOPPED, not one
        # whose output no longer parses while the timer reports success.
        - alert: HostTextfileCollectorScrapeError
          expr: node_textfile_scrape_error{job="node-exporter-host"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: 'node_exporter textfile collector is failing on {{ $labels.instance }}'
            description: >-
              node_exporter on {{ $labels.instance }} could not parse a
              file in its textfile directory, so the metrics that file
              carries (SMART, ZFS pool status, backup freshness, swap
              clean) are missing and their alerts are evaluating against
              nothing. Check
              `ls -l /var/lib/node_exporter/textfile_collector/` for a
              truncated `.prom` (usually a collector killed mid-write).

        # etcd and corosync both fail hard on skew and both run on these hosts.
        - alert: HostClockNotSynchronising
          expr: >-
            min_over_time(node_timex_sync_status{job="node-exporter-host"}[5m]) == 0
            and node_timex_maxerror_seconds{job="node-exporter-host"} >= 16
          for: 10m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: 'Clock on {{ $labels.instance }} is not synchronising'
            description: >-
              {{ $labels.instance }} has had no NTP sync for 10 minutes
              and its maximum error has grown past 16s. etcd quorum and
              corosync membership both degrade on skew — check
              `timedatectl status` and `systemctl status chrony`
              (or systemd-timesyncd) on the host.

        # The classic post-I/O-error state: everything looks up, nothing writes.
        - alert: HostFilesystemReadOnly
          expr: >-
            node_filesystem_readonly{job="node-exporter-host", fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: '{{ $labels.mountpoint }} on {{ $labels.instance }} is mounted read-only'
            description: >-
              {{ $labels.mountpoint }} ({{ $labels.device }}) on
              {{ $labels.instance }} has been read-only for 5 minutes —
              usually the kernel remounting after an I/O error. Check
              `dmesg -T | tail`, SMART for the backing device, and the ZFS
              pool state before remounting rw.

        # SUnreclaim minus ARC: nearly all legitimate unreclaimable slab on
        # these hosts is the ZFS ARC, so the delta is the leak signal. 16 GiB
        # over 24h is a reboot pager, early enough to schedule the NAS window.
        - alert: HostSlabLeakSuspected
          expr: >-
            (node_memory_SUnreclaim_bytes{job="node-exporter-host"} - node_zfs_arc_size{job="node-exporter-host"}) > 16 * 1024 * 1024 * 1024
          for: 24h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/06-zfs.md#kernel-192-byte-slab-leak'
            summary: 'Unreclaimable slab far above ARC on {{ $labels.instance }} — schedule the reboot window'
            description: >-
              SUnreclaim on {{ $labels.instance }} exceeds the ZFS ARC size by
              {{ $value | humanize1024 }}B and has for 24 hours — kernel
              memory only a reboot reclaims. Schedule the reboot window now,
              before the night backup window starts swapping. The known tenant
              is skbuff_ext_cache (skb extensions leaked by br_netfilter per
              bridged frame). On pve-nas-01, which boots with slub_nomerge,
              `sudo slabtop -o -s c` names it; elsewhere it reports under the
              merged :0000192 alias. Fingerprint and procedure: the runbook
              section this alert links.

        # Fleet-wide memory-pressure floor. The NAS swap alerts cover its own
        # failure modes; nothing else watches a host simply running out of memory.
        - alert: HostMemAvailableLow
          expr: >-
            (node_memory_MemAvailable_bytes{job="node-exporter-host"} / node_memory_MemTotal_bytes{job="node-exporter-host"}) < 0.08
          for: 30m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/06-zfs.md#nas-memory-management'
            summary: 'Available memory below 8% on {{ $labels.instance }} for 30m'
            description: >-
              {{ $labels.instance }} has under 8% of RAM available
              ({{ $value | humanizePercentage }}) for 30 minutes — sustained
              pressure, not a transient peak. Check the big consumers (guest
              ballooning, ARC vs its cap, SUnreclaim for slab growth) before
              the kernel starts swapping or OOM-killing (docs/06 § NAS memory
              management for the NAS levers).

        - alert: HostConntrackEntriesHigh
          expr: >-
            (node_nf_conntrack_entries{job="node-exporter-host"} / node_nf_conntrack_entries_limit{job="node-exporter-host"}) > 0.75
          for: 10m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/11-firewall.md'
            summary: 'conntrack table {{ $value | humanizePercentage }} full on {{ $labels.instance }}'
            description: >-
              The netfilter connection-tracking table on
              {{ $labels.instance }} is {{ $value | humanizePercentage }}
              full. At 100% new connections are dropped silently — raise
              net.netfilter.nf_conntrack_max or find the connection
              storm (`conntrack -L | awk '{print $4}' | sort | uniq -c`).

        # Replacements for the mixin's NodeSystemd* rules (disabled in the
        # chart): the host exporter is the sole emitter of node_systemd_*. The
        # excluded gettys restart forever on headless guests.
        - alert: NodeSystemdServiceFailed
          expr: >-
            node_systemd_unit_state{job="node-exporter-host", state="failed",
            name!~"getty@tty1\\.service|serial-getty@ttyS0\\.service"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: 'systemd unit {{ $labels.name }} failed on {{ $labels.instance }}'
            description: >-
              {{ $labels.name }} has been in the failed state on
              {{ $labels.instance }} for 15 minutes. Check
              `systemctl status {{ $labels.name }}` and its journal.

        - alert: NodeSystemdServiceCrashlooping
          expr: >-
            increase(node_systemd_service_restart_total{job="node-exporter-host",
            name!~"getty@tty1\\.service|serial-getty@ttyS0\\.service"}[5m]) > 2
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: 'systemd unit {{ $labels.name }} is restarting on {{ $labels.instance }}'
            description: >-
              {{ $labels.name }} on {{ $labels.instance }} has restarted more
              than twice in 5 minutes for the last 15 minutes. Check
              `journalctl -u {{ $labels.name }}`.

        # A failing collector still returns HTTP 200 while node_systemd_* is
        # absent, so the two rules above cannot fire.
        # node_scrape_collector_success is the only signal for that state.
        - alert: NodeExporterSystemdCollectorFailed
          expr: >-
            node_scrape_collector_success{job="node-exporter-host", collector="systemd"} == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: "node_exporter's systemd collector is failing on {{ $labels.instance }}"
            description: >-
              The scrape succeeds (HTTP 200) but the systemd collector errors on
              {{ $labels.instance }}, so node_systemd_unit_state and
              node_systemd_service_restart_total are absent for this host and
              NodeSystemdServiceFailed / NodeSystemdServiceCrashlooping cannot
              fire for it. Check `journalctl -u prometheus-node-exporter` and
              that the unit can still read systemd's private socket.

        # node-exporter-healthcheck.sh restarts the exporter when /metrics goes
        # unanswered twice. /metrics answers again between restarts, so a restart
        # loop fires no exporter-down alert and this gauge is the only signal.
        - alert: NodeExporterHealthcheckRestartLoop
          expr: >-
            changes(node_exporter_healthcheck_last_restart_timestamp_seconds{job="node-exporter-host"}[1h]) >= 3
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: 'node_exporter is being restarted repeatedly on {{ $labels.instance }}'
            description: >-
              The liveness gate has restarted node_exporter at least three times
              in the last hour on {{ $labels.instance }}. Check
              `journalctl -t node-exporter-healthcheck` and
              `systemctl status prometheus-node-exporter`.

        # zfs-mount-encrypted.service retries forever by design so its After=
        # dependents stay queued, which means it is always `activating` and
        # NodeSystemdServiceFailed can never match it. This pair is its coverage.
        - alert: ZfsEncryptedMountStuck
          expr: >-
            node_systemd_unit_state{job="node-exporter-host",
            name="zfs-mount-encrypted.service", state="activating"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: 'Encrypted ZFS datasets have not mounted on {{ $labels.instance }}'
            description: >-
              zfs-mount-encrypted has been retrying for 30 minutes on
              {{ $labels.instance }}, so the encrypted datasets, the NFS exports
              and every gated guest stay down. Check
              `systemctl status zfs-mount-encrypted` and
              `journalctl -u zfs-load-key@<pool>`.

        - alert: ZfsEncryptedMountStuckCritical
          expr: >-
            node_systemd_unit_state{job="node-exporter-host",
            name="zfs-mount-encrypted.service", state="activating"} == 1
          for: 2h
          labels:
            severity: critical
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: 'Encrypted ZFS datasets have not mounted for 2 hours on {{ $labels.instance }}'
            description: >-
              zfs-mount-encrypted has not completed in 2 hours on
              {{ $labels.instance }}. The key source is unreachable or a
              passphrase rotated: check `journalctl -u zfs-load-key@<pool>` and
              1Password Connect.

        # The leading arm for the slab leak above. 6 GiB/24h is about 1.5x the
        # 4 GiB/day high end of the NAS baseline (docs/06), so it fires only
        # when the leak runs well above baseline. Needs the collector on.
        - alert: HostSlabCacheGrowing
          expr: >-
            delta(node_slab_object_bytes{job="node-exporter-host", cache="skbuff_ext_cache"}[24h])
            > 6 * 1024 * 1024 * 1024
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/06-zfs.md#kernel-192-byte-slab-leak'
            summary: 'skbuff_ext_cache grew {{ $value | humanize1024 }}B in 24h on {{ $labels.instance }}'
            description: >-
              The skbuff_ext_cache slab on {{ $labels.instance }} has grown by
              more than 6 GiB in 24 hours, well over its usual rate. This is the
              leak HostSlabLeakSuspected
              pages on once it is large, caught while it is still small enough to
              schedule a reboot window around.

        # The witness for HostSlabCacheGrowing: a dead timer, unreadable
        # /proc/slabinfo, a renamed cache or a vanished textfile silences it.
        # The last arm needs the collector seen within 7d (never deployed = quiet).
        - alert: SlabinfoCollectorDegraded
          expr: >-
            node_slabinfo_collector_success{job="node-exporter-host"} == 0
            or (time() - node_slabinfo_collector_last_success_seconds{job="node-exporter-host"}) > 1800
            or count by (job, instance) (node_slab_cache_present{job="node-exporter-host"} == 0) > 0
            or (
              (
                up{job="node-exporter-host", instance="10.0.10.102:9101"} == 1
                unless on (instance) node_slabinfo_collector_success
              )
              and on (instance) (max_over_time(node_slabinfo_collector_success[7d]) > 0)
            )
          for: 30m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/06-zfs.md#kernel-192-byte-slab-leak'
            summary: 'slabinfo collector is not producing usable series on {{ $labels.instance }}'
            description: >-
              /proc/slabinfo is unreadable, the collector has not run for 30
              minutes, or a named cache is absent on {{ $labels.instance }}, so
              HostSlabCacheGrowing is blind. Check that pve-nas-01 still boots
              with `slub_nomerge` (without it skbuff_ext_cache reports under the
              merged :0000192 alias), then
              `systemctl status slabinfo-collector.timer` and the cache names in
              node_exporter_host_slab_caches against /proc/slabinfo.
