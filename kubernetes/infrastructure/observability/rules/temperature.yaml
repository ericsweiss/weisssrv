---
# CRITICAL: hwmon thermals from job="node-exporter-host", scoped by `instance` to the
# bare-metal Proxmox hosts (10.0.10.102-107:9101); the SATA rules narrow to .102, see
# their own notes. The unprivileged LXCs run the same exporter against their host's
# /sys/class/hwmon, so an unscoped rule pages twice for one physical sensor.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-temperature
  namespace: observability
spec:
  groups:
    - name: homelab.temperature
      rules:
        # Sized for the archive-pool ST6000NM0024 HDDs (55C ceiling) on pve-nas-01, so
        # the scope is .102 and the chip filter drops target5/6/8, the three 870 EVO
        # SATA SSDs, which spec 70C and carry SATASsdTempWarning instead.
        - alert: SATADriveTempWarning
          expr: >-
            max by (instance, chip) (
              node_hwmon_temp_celsius{job="node-exporter-host", instance=~"10\\.0\\.10\\.102:.*"}
              * on (instance, chip) group_left(chip_name)
              node_hwmon_chip_names{job="node-exporter-host", chip_name=~"drivetemp.*",
              chip!~"target[568]:0:0_.*"}
            ) >= 50
          for: 15m
          labels:
            severity: warning
            component: storage
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: >-
              SATA drive on {{ $labels.instance }}
              ({{ $labels.chip }}) at
              {{ $value | printf "%.0f" }}C
            description: >-
              SATA drive {{ $labels.chip }} on {{ $labels.instance }}
              has been at {{ $value | printf "%.0f" }}C for 15 minutes
              (warn threshold 50C). Check airflow for that drive bay.

        - alert: SATADriveTempCritical
          expr: >-
            max by (instance, chip) (
              node_hwmon_temp_celsius{job="node-exporter-host", instance=~"10\\.0\\.10\\.102:.*"}
              * on (instance, chip) group_left(chip_name)
              node_hwmon_chip_names{job="node-exporter-host", chip_name=~"drivetemp.*",
              chip!~"target[568]:0:0_.*"}
            ) >= 55
          for: 5m
          labels:
            severity: critical
            component: storage
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: >-
              SATA drive on {{ $labels.instance }}
              ({{ $labels.chip }}) at
              {{ $value | printf "%.0f" }}C
            description: >-
              SATA drive {{ $labels.chip }} on {{ $labels.instance }}
              is at {{ $value | printf "%.0f" }}C — at or above the
              archive-pool drives' spec ceiling. Sustained over-temp is the strongest
              accelerant for HDD failure.

        # The three 870 EVO SATA SSDs on pve-nas-01, which spec 70C and have a
        # corruption history, so they keep thermal coverage at their own band
        # instead of inheriting the archive HDDs' 50/55C pair.
        - alert: SATASsdTempWarning
          expr: >-
            max by (instance, chip) (
              node_hwmon_temp_celsius{job="node-exporter-host", instance=~"10\\.0\\.10\\.102:.*"}
              * on (instance, chip) group_left(chip_name)
              node_hwmon_chip_names{job="node-exporter-host", chip_name=~"drivetemp.*",
              chip=~"target[568]:0:0_.*"}
            ) >= 65
          for: 15m
          labels:
            severity: warning
            component: storage
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: >-
              SATA SSD on {{ $labels.instance }}
              ({{ $labels.chip }}) at
              {{ $value | printf "%.0f" }}C
            description: >-
              SATA SSD {{ $labels.chip }} on {{ $labels.instance }}
              has been at {{ $value | printf "%.0f" }}C for 15 minutes
              (warn threshold 65C, 70C spec). Check airflow for that drive bay.

        # NVMe via the in-tree nvme hwmon driver, as a two-step ladder: the
        # 75-80C band is null-routed and 80C is the throttle point the drives
        # actually act on. The trend line below it is on the Thermals dashboard.
        - alert: NVMeDriveTempHigh
          expr: >-
            max by (instance, chip) (
              node_hwmon_temp_celsius{job="node-exporter-host", instance=~"10\\.0\\.10\\.10[2-7]:9101"}
              * on (instance, chip) group_left(chip_name)
              node_hwmon_chip_names{job="node-exporter-host", chip_name="nvme"}
            ) >= 75
          for: 10m
          labels:
            severity: none
            component: storage
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: >-
              NVMe drive on {{ $labels.instance }}
              ({{ $labels.chip }}) at
              {{ $value | printf "%.0f" }}C
            description: >-
              NVMe drive {{ $labels.chip }} on {{ $labels.instance }}
              has been at {{ $value | printf "%.0f" }}C for 10 minutes —
              above the rest of the fleet's NVMe but below the 80C throttle
              point. Null-routed: visible in Grafana and the Alertmanager UI
              only. A chip joining the band on its own is the regression.

        - alert: NVMeDriveTempCritical
          expr: >-
            max by (instance, chip) (
              node_hwmon_temp_celsius{job="node-exporter-host", instance=~"10\\.0\\.10\\.10[2-7]:9101"}
              * on (instance, chip) group_left(chip_name)
              node_hwmon_chip_names{job="node-exporter-host", chip_name="nvme"}
            ) >= 80
          for: 2m
          labels:
            severity: critical
            component: storage
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: >-
              NVMe drive on {{ $labels.instance }}
              ({{ $labels.chip }}) at
              {{ $value | printf "%.0f" }}C
            description: >-
              NVMe drive {{ $labels.chip }} on {{ $labels.instance }}
              is at {{ $value | printf "%.0f" }}C — at the thermal-throttle
              point, where the drive starts slowing itself to shed heat.

        # CPU package and per-core temps via coretemp. These consumer CPUs spike toward
        # their ~100C TJunction under load, so the thresholds and the long `for:` target
        # sustained heat only.
        - alert: CPUTempWarning
          expr: >-
            max by (instance) (
              node_hwmon_temp_celsius{job="node-exporter-host", instance=~"10\\.0\\.10\\.10[2-7]:9101"}
              * on (instance, chip) group_left(chip_name)
              node_hwmon_chip_names{job="node-exporter-host", chip_name="coretemp"}
            ) >= 90
          for: 15m
          labels:
            severity: warning
            component: cpu
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: 'CPU on {{ $labels.instance }} sustained {{ $value | printf "%.0f" }}C'
            description: >-
              CPU on {{ $labels.instance }} has been at or above
              90C for 15 minutes — sustained, not a load spike. Check load,
              fan health and thermal paste.

        - alert: CPUTempCritical
          expr: >-
            max by (instance) (
              node_hwmon_temp_celsius{job="node-exporter-host", instance=~"10\\.0\\.10\\.10[2-7]:9101"}
              * on (instance, chip) group_left(chip_name)
              node_hwmon_chip_names{job="node-exporter-host", chip_name="coretemp"}
            ) >= 95
          for: 5m
          labels:
            severity: critical
            component: cpu
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: 'CPU on {{ $labels.instance }} at {{ $value | printf "%.0f" }}C'
            description: >-
              CPU on {{ $labels.instance }} hit
              {{ $value | printf "%.0f" }}C — close to TJunction.
              Thermal throttle is imminent if not already underway.

        # Host-side hwmon GPU temps: Intel xe (Plex transcoding on pve-nas-01),
        # nouveau (pve-prec-01/pve-laptop-01), amdgpu if added. The pve-prec-01
        # 1660 Ti's own telemetry is DCGM's GpuTemp* pair in homelab.gpu.
        - alert: HostGpuTempWarning
          expr: >-
            max by (instance, chip_name) (
              node_hwmon_temp_celsius{job="node-exporter-host", instance=~"10\\.0\\.10\\.10[2-7]:9101"}
              * on (instance, chip) group_left(chip_name)
              node_hwmon_chip_names{job="node-exporter-host", chip_name=~"xe|nouveau|nvidia|amdgpu|radeon"}
            ) >= 85
          for: 5m
          labels:
            severity: warning
            component: gpu
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: >-
              GPU ({{ $labels.chip_name }}) on
              {{ $labels.instance }} at
              {{ $value | printf "%.0f" }}C
            description: >-
              GPU ({{ $labels.chip_name }}) on {{ $labels.instance }}
              has been at or above 85C for 5 minutes.

        - alert: HostGpuTempCritical
          expr: >-
            max by (instance, chip_name) (
              node_hwmon_temp_celsius{job="node-exporter-host", instance=~"10\\.0\\.10\\.10[2-7]:9101"}
              * on (instance, chip) group_left(chip_name)
              node_hwmon_chip_names{job="node-exporter-host", chip_name=~"xe|nouveau|nvidia|amdgpu|radeon"}
            ) >= 95
          for: 1m
          labels:
            severity: critical
            component: gpu
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: >-
              GPU ({{ $labels.chip_name }}) on
              {{ $labels.instance }} at
              {{ $value | printf "%.0f" }}C
            description: >-
              GPU ({{ $labels.chip_name }}) on {{ $labels.instance }}
              is at {{ $value | printf "%.0f" }}C — at or beyond the
              typical thermal-shutdown threshold for consumer GPUs.

        # Only fires where node_exporter publishes a nic chip (pve-nas-01 AQC113).
        - alert: NICTempWarning
          expr: >-
            max by (instance, chip_name) (
              node_hwmon_temp_celsius{job="node-exporter-host", instance=~"10\\.0\\.10\\.10[2-7]:9101"}
              * on (instance, chip) group_left(chip_name)
              node_hwmon_chip_names{job="node-exporter-host", chip_name=~"nic.*"}
            ) >= 90
          for: 10m
          labels:
            severity: warning
            component: network
          annotations:
            runbook_url: '${cluster_runbook_base_url}/12-runbooks.md'
            summary: 'NIC on {{ $labels.instance }} at {{ $value | printf "%.0f" }}C'
            description: >-
              NIC {{ $labels.chip_name }} on {{ $labels.instance }}
              has been at or above 90C for 10 minutes — high NIC temps correlate with
              link instability on the AQC113.
