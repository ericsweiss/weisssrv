---
# Homelab replacements for upstream kube-state rules that do not fit this
# cluster. Companions to the `defaultRules.disabled` list in
# kube-prometheus-stack/release.yaml.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-kubernetes-resources
  namespace: observability
spec:
  groups:
    - name: homelab.kubernetes-resources
      rules:
        # Upstream KubeCPUOvercommit's shape (requests must fit after removing
        # the largest node) minus the gitlab-runner* namespaces, which
        # deliberately over-request CPU for burst CI against a correctly-sized
        # ResourceQuota and flapped the upstream rule for 15-30m per burst.
        - alert: KubeCPUOvercommit
          expr: >-
            sum(namespace_cpu:kube_pod_container_resource_requests:sum{namespace!~"gitlab-runner.*"})
            - (sum(kube_node_status_allocatable{resource="cpu"})
               - max(kube_node_status_allocatable{resource="cpu"})) > 0
            and
            (sum(kube_node_status_allocatable{resource="cpu"})
             - max(kube_node_status_allocatable{resource="cpu"})) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            runbook_url: 'https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubecpuovercommit/'
            summary: 'Cluster has overcommitted CPU resource requests (CI namespaces excluded).'
            description: >-
              Non-CI CPU requests exceed the allocatable capacity that
              would remain after the largest node fails, so the cluster
              cannot tolerate a single node loss. The gitlab-runner*
              namespaces are excluded because their ResourceQuota
              deliberately over-requests for burst CI.

        # The leading indicator the other two memory alerts lack: OOMKilled is
        # the post-mortem and VPARecommendationExceedsLimit keys off the
        # recommender, which lags a burst by hours. This is the live working set
        # against the container's own limit.
        #
        # Exclusions are the workloads whose steady state legitimately sits near
        # the ceiling: hindsight/llama is GPU/model-pinned with a deliberate Off
        # VPA (docs/43) and spends ~15% of a month above 0.9, and Prometheus and
        # Loki count reclaimable page cache in their working set. Everything else
        # crossing 0.9 for 15m is a real sizing gap.
        - alert: ContainerMemoryNearLimit
          expr: >-
            (
              max by (namespace, pod, container) (
                container_memory_working_set_bytes{container!="", container!="POD"}
              )
              / on (namespace, pod, container) group_left ()
              max by (namespace, pod, container) (
                kube_pod_container_resource_limits{resource="memory"}
              )
            ) > 0.9
            unless on (namespace, container) (
              kube_pod_container_resource_limits{resource="memory",
                                                 namespace="hindsight",
                                                 container="llama"}
              or
              kube_pod_container_resource_limits{resource="memory",
                                                 namespace="observability",
                                                 container=~"prometheus|loki"}
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/33-autoscaling.md'
            summary: >-
              Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}
              is within 10% of its memory limit
            description: >-
              Container {{ $labels.container }} in pod
              {{ $labels.namespace }}/{{ $labels.pod }} has held above 90% of
              its memory limit for 15 minutes
              ({{ $value | humanizePercentage }}). Raise the limit in git and,
              where the workload has a VPA, its maxAllowed alongside — docs/33
              "Applying an Off-tier recommendation".

        # A container that OOMKills and restarts cleanly is invisible upstream:
        # KubePodCrashLooping needs a restart RATE and KubeContainerWaiting needs
        # the container to stay down. Edge-triggered on the restart counter and
        # qualified by the last-terminated reason, so it reports the event rather
        # than the surviving state and self-resolves after the 1h window.
        - alert: ContainerOOMKilled
          expr: >-
            increase(kube_pod_container_status_restarts_total[1h]) > 0
            and on (namespace, pod, container)
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/33-autoscaling.md'
            summary: >-
              Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}
              was OOMKilled
            description: >-
              Container {{ $labels.container }} in pod
              {{ $labels.namespace }}/{{ $labels.pod }} hit its memory
              limit and was killed by the kernel. Compare the container's
              limit against its VPA recommendation
              (`kubectl describe vpa -n {{ $labels.namespace }}`) and
              raise the size in git — the limit is a hand-set number, not
              something the VPA maintains for an Off-tier workload.
