---
# Homelab replacements for upstream kube-state rules that do not fit this
# cluster. Companions to the `defaultRules.disabled` list in
# kube-prometheus-stack/release.yaml.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-kubernetes-resources
  namespace: observability
spec:
  groups:
    - name: homelab.kubernetes-resources
      rules:
        # Taken from kube-prometheus-stack 92.1.0
        # Upstream's shape minus the gitlab-runner* namespaces, which
        # over-request CPU for burst CI against a sized ResourceQuota.
        - alert: KubeCPUOvercommit
          expr: >-
            sum(namespace_cpu:kube_pod_container_resource_requests:sum{namespace!~"gitlab-runner.*"})
            - (sum(kube_node_status_allocatable{resource="cpu"})
               - max(kube_node_status_allocatable{resource="cpu"})) > 0
            and
            (sum(kube_node_status_allocatable{resource="cpu"})
             - max(kube_node_status_allocatable{resource="cpu"})) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            runbook_url: 'https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubecpuovercommit/'
            summary: 'Cluster has overcommitted CPU resource requests (CI namespaces excluded).'
            description: >-
              Non-CI CPU requests exceed the allocatable capacity that
              would remain after the largest node fails, so the cluster
              cannot tolerate a single node loss. The gitlab-runner*
              namespaces are excluded because their ResourceQuota
              deliberately over-requests for burst CI.

        # Live working set against the container's own limit, the leading
        # indicator ahead of an OOMKill. Excludes workloads that steadily sit
        # near the ceiling: hindsight/llama, Prometheus, Loki and Grafana.
        - alert: ContainerMemoryNearLimit
          expr: >-
            (
              max by (namespace, pod, container) (
                container_memory_working_set_bytes{container!="", container!="POD"}
              )
              / on (namespace, pod, container) group_left ()
              max by (namespace, pod, container) (
                kube_pod_container_resource_limits{resource="memory"}
              )
            ) > 0.9
            unless on (namespace, container) (
              kube_pod_container_resource_limits{resource="memory",
                                                 namespace="hindsight",
                                                 container="llama"}
              or
              kube_pod_container_resource_limits{resource="memory",
                                                 namespace="observability",
                                                 container=~"prometheus|loki|grafana"}
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/33-autoscaling.md'
            summary: >-
              Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}
              is within 10% of its memory limit
            description: >-
              Container {{ $labels.container }} in pod
              {{ $labels.namespace }}/{{ $labels.pod }} has held above 90% of
              its memory limit for 15 minutes
              ({{ $value | humanizePercentage }}). Raise the limit in git and,
              where the workload has a VPA, its maxAllowed alongside — docs/33
              "Applying an Off-tier recommendation".

        # Grafana, Loki and Prometheus, excluded from the 0.9 rule above. RSS is
        # the non-reclaimable half, which is what the OOM killer counts.
        - alert: PageCacheWorkloadRSSNearLimit
          expr: >-
            (
              max by (namespace, pod, container) (
                container_memory_rss{namespace="observability", container=~"grafana|loki|prometheus"}
              )
              / on (namespace, pod, container) group_left ()
              max by (namespace, pod, container) (
                kube_pod_container_resource_limits{resource="memory",
                                                   namespace="observability",
                                                   container=~"grafana|loki|prometheus"}
              )
            ) > 0.9
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/33-autoscaling.md'
            summary: >-
              {{ $labels.namespace }}/{{ $labels.container }} RSS is within 10%
              of its memory limit
            description: >-
              Non-reclaimable memory in {{ $labels.namespace }}/{{ $labels.pod }}
              has held above 90% of the container's memory limit for 15 minutes
              ({{ $value | humanizePercentage }}). Unlike the working set this
              is not page cache: raise the limit and the VPA maxAllowed in git
              — docs/33 "Applying an Off-tier recommendation".

        # hindsight/llama's own band, since the 0.9 rule above excludes it. Its
        # VPA is Off (docs/43), so without this an OOMKill is its only signal.
        # 0.95 sits clear of its normal ceiling.
        - alert: HindsightLlamaMemoryNearLimit
          expr: >-
            (
              max by (namespace, pod, container) (
                container_memory_working_set_bytes{namespace="hindsight", container="llama"}
              )
              / on (namespace, pod, container) group_left ()
              max by (namespace, pod, container) (
                kube_pod_container_resource_limits{resource="memory",
                                                   namespace="hindsight",
                                                   container="llama"}
              )
            ) > 0.95
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/43-gpu-passthrough.md'
            summary: >-
              hindsight/llama is within 5% of its memory limit
            description: >-
              llama-server in {{ $labels.namespace }}/{{ $labels.pod }} has
              held above 95% of its memory limit for 15 minutes
              ({{ $value | humanizePercentage }}) and will OOMKill shortly.
              Its steady state is far below this, so treat it as host-side
              growth (KV/context spilling out of VRAM, or a llama-server
              leak) before raising the limit — its GPU node has little
              allocatable memory left to give.

        # A container that OOMKills and restarts cleanly is invisible to
        # KubePodCrashLooping and KubeContainerWaiting. Edge-triggered on the
        # restart counter, qualified by the last-terminated reason.
        - alert: ContainerOOMKilled
          expr: >-
            increase(kube_pod_container_status_restarts_total[1h]) > 0
            and on (namespace, pod, container)
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            runbook_url: '${cluster_runbook_base_url}/33-autoscaling.md'
            summary: >-
              Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}
              was OOMKilled
            description: >-
              Container {{ $labels.container }} in pod
              {{ $labels.namespace }}/{{ $labels.pod }} hit its memory
              limit and was killed by the kernel. Live limit
              {{ with query (printf "kube_pod_container_resource_limits{namespace='%s', pod='%s', container='%s', resource='memory'}" $labels.namespace $labels.pod $labels.container) }}{{ . | first | value | humanize1024 }}B{{ else }}unknown{{ end }},
              working set now
              {{ with query (printf "container_memory_working_set_bytes{namespace='%s', pod='%s', container='%s'}" $labels.namespace $labels.pod $labels.container) }}{{ . | first | value | humanize1024 }}B{{ else }}unknown{{ end }}.
              A live limit above the one in git means the VPA rescaled it, so
              the kill was against a moved ceiling. Raise the size in git — the
              limit is a hand-set number, not something the VPA maintains for an
              Off-tier workload.
