---
# VPA policies for the observability stack (tiers: docs/33-autoscaling.md).
#   Auto    — exporters and stack components that tolerate eviction.
#   Initial — Grafana (single replica; resize on natural restarts).
#   Off     — Prometheus / Alertmanager / Loki (operator- or chart-managed
#             stateful sets with hand-tuned requests in their HelmReleases;
#             VPA records recommendations without acting).
#
# containerPolicies are matched first-exact-name, then "*", so a pod whose main
# container needs a large minAllowed lists that container by name and gives the
# sidecars a small catch-all — a single wildcard sized for the main container
# publishes ~10x-inflated sidecar recommendations that the Off-tier
# apply-by-hand workflow would then act on.
#
# The small exporters below (adguard, exportarr, plex, redis, proxmox) are
# limit-controlling — controlledValues unset — so each maxAllowed.memory sits
# at 0.8x the container's declared limit in exporters/ (64Mi, 256Mi for
# pve-exporter). At or above the limit the updater just rescales the limit with
# the request and the declared ceiling never binds (docs/33).
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: adguard-exporter-dns01
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: adguard-exporter-dns01}
  updatePolicy: {updateMode: Auto}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 51Mi}
        controlledResources: [cpu, memory]
---
