apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: node-exporter
spec:
  targetRef: {apiVersion: apps/v1, kind: DaemonSet, name: kube-prometheus-stack-prometheus-node-exporter}
  updatePolicy: {updateMode: Auto}
  resourcePolicy:
    containerPolicies:
      # RequestsOnly: right-size requests but NEVER set limits. With the
      # default RequestsAndLimits the VPA scales the limit proportionally and
      # re-imposes a CPU limit (~110m) even after it's removed from the chart
      # values, which is what kept CPUThrottlingHigh firing on node-exporter.
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 128Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  # GPU-telemetry DaemonSet (one pod, GPU node only). Auto to match the other
  # exporter/DaemonSet VPAs; maxAllowed.memory stays above the pod's 256Mi limit
  # so a recommendation never clamps below it.
  name: dcgm-exporter
spec:
  targetRef: {apiVersion: apps/v1, kind: DaemonSet, name: dcgm-exporter}
  updatePolicy: {updateMode: Auto}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 300m, memory: 384Mi}
        controlledResources: [cpu, memory]
---
