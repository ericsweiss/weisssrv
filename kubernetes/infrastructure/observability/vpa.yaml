---
# VPA policies for the observability stack. Tiers (Auto / Initial / Off), the
# first-exact-name-then-"*" containerPolicy matching rule, and the 0.8x-of-limit
# maxAllowed rule for limit-controlling policies: docs/33-autoscaling.md.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: adguard-exporter-dns01
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: adguard-exporter-dns01}
  updatePolicy: {updateMode: Auto}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 51Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
