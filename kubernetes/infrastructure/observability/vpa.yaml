  updatePolicy: {updateMode: Auto}
  resourcePolicy:
    containerPolicies:
      # RequestsOnly with maxAllowed == the 384Mi limit in
      # kube-prometheus-stack/release.yaml: its working set scales with object
      # count, so only the request moves and that limit stays the ceiling.
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 64Mi}
        maxAllowed: {cpu: 300m, memory: 384Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: alloy
spec:
  targetRef: {apiVersion: apps/v1, kind: DaemonSet, name: alloy}
  updatePolicy: {updateMode: Auto}
  resourcePolicy:
    containerPolicies:
      # PER-CONTAINER bounds, not a "*" catch-all: RequestsOnly moves the
      # REQUEST, and a request above a container's fixed limit is an invalid pod.
      # maxAllowed.memory is each alloy/release.yaml limit; its CPU caps are headroom.
      - containerName: alloy
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 500m, memory: 640Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
      - containerName: config-reloader
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 50m, memory: 128Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: alloy-syslog
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: alloy-syslog}
  updatePolicy: {updateMode: Auto}
  resourcePolicy:
    containerPolicies:
      # PER-CONTAINER bounds, not a "*" catch-all: RequestsOnly moves the
      # REQUEST, and a request above the container's own fixed limit is an
      # invalid pod. alloy is 256Mi and config-reloader 64Mi in release.yaml.
      - containerName: alloy
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 300m, memory: 256Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
      - containerName: config-reloader
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 50m, memory: 64Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: node-exporter
spec:
  targetRef: {apiVersion: apps/v1, kind: DaemonSet, name: kube-prometheus-stack-prometheus-node-exporter}
  updatePolicy: {updateMode: Auto}
  resourcePolicy:
    containerPolicies:
      # RequestsOnly: only the request moves. The chart's 128Mi memory limit
      # stays the OOM ceiling and node-exporter keeps no CPU limit.
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 128Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  # GPU-telemetry DaemonSet (one pod, GPU node only). RequestsOnly, with
  # maxAllowed.memory above DCGM's working set and below the OOM ceiling limit
  # in exporters/dcgm-exporter.yaml.
  name: dcgm-exporter
spec:
  targetRef: {apiVersion: apps/v1, kind: DaemonSet, name: dcgm-exporter}
  updatePolicy: {updateMode: Auto}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 300m, memory: 768Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: grafana
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: kube-prometheus-stack-grafana}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # RequestsOnly with maxAllowed.memory == the declared 1Gi limit (docs/33): only
      # the request moves, so the limit stays the ceiling. Grafana sits capped
      # here by design and is excluded from the VPA clamp alerts.
      - containerName: grafana
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 1, memory: 1Gi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
      # The dashboard/datasource sidecars carry their own 256Mi limit, and a
      # request above a container's limit is an invalid pod.
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 100m, memory: 256Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: prometheus
spec:
  # Target the Prometheus CR, not the operator-owned StatefulSet: the VPA needs
  # a topmost controller exposing /scale, or it sits ConfigUnsupported.
  targetRef: {apiVersion: monitoring.coreos.com/v1, kind: Prometheus, name: kube-prometheus-stack-prometheus}
  updatePolicy: {updateMode: "Off"}
  # maxAllowed.memory tracks the pod's 6Gi limit in release.yaml.
  # VPARecommendationExceedsLimit reads the larger of the capped and uncapped
  # target, so the clamp cannot hide an outgrown size (docs/33).
  resourcePolicy:
    containerPolicies:
      - containerName: prometheus
        minAllowed: {cpu: 100m, memory: 512Mi}
        maxAllowed: {cpu: 2, memory: 6Gi}
        controlledResources: [cpu, memory]
      # config-reloader and any future sidecar must not inherit the main
      # container's floor; the cap is the reloader's 96Mi limit (release.yaml).
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 100m, memory: 96Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: alertmanager
spec:
  # Topmost scalable controller, same as the Prometheus VPA above.
  targetRef: {apiVersion: monitoring.coreos.com/v1, kind: Alertmanager, name: kube-prometheus-stack-alertmanager}
  updatePolicy: {updateMode: "Off"}
  resourcePolicy:
    containerPolicies:
      # maxAllowed.memory == each container's declared limit in release.yaml, so
      # the recommendation cannot exceed its ceiling; the CPU caps are headroom.
      - containerName: alertmanager
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 200m, memory: 192Mi}
        controlledResources: [cpu, memory]
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 100m, memory: 96Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: loki
spec:
  targetRef: {apiVersion: apps/v1, kind: StatefulSet, name: loki}
  updatePolicy: {updateMode: "Off"}
  resourcePolicy:
    containerPolicies:
      # maxAllowed.memory == each container's declared limit in loki/release.yaml;
      # the CPU caps are headroom. Loki sits capped by design (page cache) and is
      # excluded from the VPA clamp alerts.
      - containerName: loki
        minAllowed: {cpu: 50m, memory: 128Mi}
        maxAllowed: {cpu: 1, memory: 1Gi}
        controlledResources: [cpu, memory]
      # loki-sc-rules (the rules sidecar) and anything else in the pod.
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
