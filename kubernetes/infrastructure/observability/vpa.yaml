apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kube-state-metrics
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: kube-prometheus-stack-kube-state-metrics}
  updatePolicy: {updateMode: Auto}
  resourcePolicy:
    containerPolicies:
      # RequestsOnly with maxAllowed == the 384Mi limit in
      # kube-prometheus-stack/release.yaml — the shape its sibling exporter
      # policies here use (alloy, node-exporter, dcgm-exporter). Its working set
      # scales with object count, so leaving the updater to rescale the limit
      # would move the ceiling this file reviews; only the request moves.
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 64Mi}
        maxAllowed: {cpu: 300m, memory: 384Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: alloy
spec:
  targetRef: {apiVersion: apps/v1, kind: DaemonSet, name: alloy}
  updatePolicy: {updateMode: Auto}
  resourcePolicy:
    containerPolicies:
      # RequestsOnly: on the default RequestsAndLimits the updater rescales the
      # LIVE limit away from the declared one, so a pod admitted while the
      # mutating webhook is down runs under its own peak. The 640Mi limit is
      # hand-set in alloy/release.yaml and stays the OOM ceiling; maxAllowed
      # sits under it at the measured working set (docs/33).
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 500m, memory: 512Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: node-exporter
spec:
  targetRef: {apiVersion: apps/v1, kind: DaemonSet, name: kube-prometheus-stack-prometheus-node-exporter}
  updatePolicy: {updateMode: Auto}
  resourcePolicy:
    containerPolicies:
      # RequestsOnly: right-size requests but NEVER set limits — the default
      # RequestsAndLimits re-imposes a proportional CPU limit even when the
      # chart values carry none.
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 128Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  # GPU-telemetry DaemonSet (one pod, on the GPU node only). maxAllowed.memory
  # sits above DCGM's working set and below the limit in
  # exporters/dcgm-exporter.yaml, which is the hand-set OOM ceiling —
  # RequestsOnly so only the request moves.
  name: dcgm-exporter
spec:
  targetRef: {apiVersion: apps/v1, kind: DaemonSet, name: dcgm-exporter}
  updatePolicy: {updateMode: Auto}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 300m, memory: 768Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: grafana
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: kube-prometheus-stack-grafana}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 1, memory: 1Gi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: prometheus
spec:
  # Target the Prometheus CR, not the operator-owned StatefulSet: the VPA
  # requires a topmost scalable controller (the CRD exposes /scale), and
  # targeting the StatefulSet leaves the VPA ConfigUnsupported with no
  # recommendations recorded.
  targetRef: {apiVersion: monitoring.coreos.com/v1, kind: Prometheus, name: kube-prometheus-stack-prometheus}
  updatePolicy: {updateMode: "Off"}
  # maxAllowed.memory matches the pod's 6Gi limit in release.yaml, so the
  # recording-only recommendation is never clamped and
  # VPARecommendationExceedsLimit stays the honest signal that Prometheus has
  # outgrown its hand-set size. Re-read the recorded target before acting on it;
  # it decays (docs/33 §Applying an Off-tier recommendation).
  resourcePolicy:
    containerPolicies:
      - containerName: prometheus
        minAllowed: {cpu: 100m, memory: 512Mi}
        maxAllowed: {cpu: 2, memory: 6Gi}
        controlledResources: [cpu, memory]
      # config-reloader and any future sidecar must not inherit the main
      # container's floor.
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: alertmanager
spec:
  # Topmost scalable controller, same as the Prometheus VPA above.
  targetRef: {apiVersion: monitoring.coreos.com/v1, kind: Alertmanager, name: kube-prometheus-stack-alertmanager}
  updatePolicy: {updateMode: "Off"}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: loki
spec:
  targetRef: {apiVersion: apps/v1, kind: StatefulSet, name: loki}
  updatePolicy: {updateMode: "Off"}
  resourcePolicy:
    containerPolicies:
      - containerName: loki
        minAllowed: {cpu: 50m, memory: 128Mi}
        maxAllowed: {cpu: 1, memory: 2Gi}
        controlledResources: [cpu, memory]
      # loki-sc-rules (the rules sidecar) and anything else in the pod.
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
