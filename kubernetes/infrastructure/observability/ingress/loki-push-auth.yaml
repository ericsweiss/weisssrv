---
# Basic auth for the Loki push IngressRoute. Loki itself runs with
# auth_enabled=false, so without this gate anything on the LAN could write
# logs. Host-side Alloy sends the matching credentials (alloy_host role).
# The in-cluster Alloy DaemonSet pushes via the ClusterIP service and is
# unaffected; the emergency NodePort fallback (31100) also bypasses this —
# both are reachable only from cluster/core hosts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-push-auth
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: loki-push-auth
    creationPolicy: Owner
  data:
    - secretKey: users
      remoteRef:
        key: Loki Push Auth
        property: htpasswd
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: loki-push-auth
  namespace: observability
spec:
  basicAuth:
    secret: loki-push-auth
