---
# Basic auth for the Loki push IngressRoute. Loki runs auth_enabled=false, so
# this gate is what stops anything on the LAN writing logs. Host-side Alloy sends
# the credentials; the in-cluster DaemonSet pushes via the ClusterIP instead.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-push-auth
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: loki-push-auth
    creationPolicy: Owner
  data:
    - secretKey: users
      remoteRef:
        key: Loki Push Auth
        property: htpasswd
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: loki-push-auth
  namespace: observability
spec:
  basicAuth:
    secret: loki-push-auth
