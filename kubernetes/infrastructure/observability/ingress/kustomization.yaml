---
# Internal-only ingress for the stack: the Grafana UI and the Loki push API, each
# with its own cert-manager Certificate. Prometheus and Alertmanager have no
# route by design (kubectl port-forward, docs/31).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - certificate.yaml
  - ingress-route.yaml
  - loki-push-auth.yaml
