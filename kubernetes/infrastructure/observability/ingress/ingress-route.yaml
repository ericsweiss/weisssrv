---
# Internal only. Grafana handles OIDC natively, so no forward-auth middleware;
# lan-tailscale-only keeps it off the public internet, like every sibling
# internal route.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: observability
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
  tls:
    secretName: grafana-esweiss-tls
---
# Internal only: the Loki PUSH API over TLS, so host-side Alloy ships journald
# without a plaintext NodePort hop. lan-tailscale-only plus loki-push-auth basic
# auth; the PathPrefix keeps that credential off the query and delete APIs.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: loki
  namespace: observability
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`loki.${cluster_internal_domain}`) && PathPrefix(`/loki/api/v1/push`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
        - name: loki-push-auth
          namespace: observability
      services:
        - name: loki
          port: 3100
  tls:
    secretName: loki-esweiss-tls
