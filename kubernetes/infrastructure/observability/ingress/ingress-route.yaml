---
# Internal only: grafana.esweiss.com
# Grafana handles OIDC authentication natively — no forward-auth middleware needed.
# lan-tailscale-only keeps it off the public internet, matching every sibling
# internal *.esweiss.com route (Loki below, onepassword-connect, the arr stack).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: observability
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.esweiss.com`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
  tls:
    secretName: grafana-esweiss-tls
---
# Internal only: loki.esweiss.com — Loki push API exposed over TLS so
# host-side Alloy on Proxmox + k3s VMs can ship journald logs without
# the plaintext NodePort hop. lan-tailscale-only keeps it off the
# public internet; loki-push-auth adds basic auth because Loki itself
# runs auth_enabled=false.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: loki
  namespace: observability
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`loki.esweiss.com`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
        - name: loki-push-auth
          namespace: observability
      services:
        - name: loki
          port: 3100
  tls:
    secretName: loki-esweiss-tls
