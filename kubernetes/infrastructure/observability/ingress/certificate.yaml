---
# TLS certificate for grafana.esweiss.com (internal only)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: observability
spec:
  secretName: grafana-esweiss-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "grafana.esweiss.com"
  dnsNames:
    - "grafana.esweiss.com"
  renewBefore: 720h
---
# TLS certificate for loki.esweiss.com (internal only).
# Backs the Loki push-API IngressRoute used by host-side Alloy.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: loki-tls
  namespace: observability
spec:
  secretName: loki-esweiss-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "loki.esweiss.com"
  dnsNames:
    - "loki.esweiss.com"
  renewBefore: 720h
