---
# authentik-worker metrics. A PodMonitor because the chart ships a Service for
# the server only; the worker pod declares its own `metrics` port (9300).
# Scrape allow: apps/authentik/networkpolicy.yaml `allow-worker-metrics`.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: authentik-worker
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - authentik
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: worker
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
      path: /metrics
