---
# Scrape Home Assistant Prometheus integration from external HAOS VM
# Requires the 'prometheus' integration enabled in HA configuration.yaml
apiVersion: v1
kind: Service
metadata:
  name: home-assistant-metrics
  namespace: observability
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 8123
      targetPort: 8123

---
apiVersion: v1
kind: Endpoints
metadata:
  name: home-assistant-metrics
  namespace: observability
subsets:
  - addresses:
      - ip: 192.168.0.154
    ports:
      - name: metrics
        port: 8123

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: home-assistant
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  endpoints:
    - port: metrics
      interval: 60s
      path: /api/prometheus
      bearerTokenSecret:
        name: observability-exporter-secrets
        key: ha-api-token
      # HAOS is HTTPS-only after the SSL config landed (acme_certs distributes
      # the wildcard cert to /ssl/{fullchain,privkey}.pem and configuration.yaml
      # sets ssl_certificate/ssl_key under http:). Plain-HTTP scrape now
      # returns EOF / RST. We scrape the bare-IP Endpoint (192.168.0.154)
      # because HAOS isn't a CoreDNS/k8s-service target, but `serverName`
      # rewrites the SNI/host-validation name to `home.esweiss.com` — that's
      # covered by the wildcard `*.esweiss.com` cert, so cert verification
      # passes against the system CA bundle (Let's Encrypt R3 chain) without
      # needing a separate caFile or insecureSkipVerify.
      scheme: https
      tlsConfig:
        serverName: home.esweiss.com
