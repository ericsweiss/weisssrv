---
# Scrape Home Assistant Prometheus integration from external HAOS VM
# Requires the 'prometheus' integration enabled in HA configuration.yaml
apiVersion: v1
kind: Service
metadata:
  name: home-assistant-metrics
  namespace: observability
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 8123
      targetPort: 8123

---
# Hand-written EndpointSlice for a selectorless Service — see
# exporters/node-exporter-host.yaml.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: home-assistant-metrics
  namespace: observability
  labels:
    kubernetes.io/service-name: home-assistant-metrics
addressType: IPv4
ports:
  - name: metrics
    port: 8123
    protocol: TCP
endpoints:
  - addresses: ["10.0.10.154"]
    conditions: {ready: true}

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: home-assistant
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  endpoints:
    - port: metrics
      interval: 60s
      path: /api/prometheus
      authorization:
        type: Bearer
        credentials:
          name: observability-exporter-secrets
          key: ha-api-token
      # HAOS is HTTPS-only (acme_certs distributes the wildcard to /ssl/) and the
      # target is a bare IP, so serverName rewrites SNI/host validation for the
      # wildcard to verify against the system CA bundle.
      scheme: https
      tlsConfig:
        serverName: home.${cluster_internal_domain}
