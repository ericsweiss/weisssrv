---
# Garage metrics on its admin port, gated by the metrics token from
# observability-exporter-secrets. The scrape allow lives in the app's
# NetworkPolicy (observability -> 3903).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ci-cache
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - ci-cache
  selector:
    matchLabels:
      app.kubernetes.io/name: ci-cache
  endpoints:
    - port: admin
      path: /metrics
      interval: 60s
      authorization:
        type: Bearer
        credentials:
          name: observability-exporter-secrets
          key: garage-metrics-token
