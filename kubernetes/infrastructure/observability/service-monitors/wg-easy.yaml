---
# wg-easy's native metrics on the UI port (51821) at /metrics/prometheus;
# observability->51821 via apps/wg-easy/networkpolicy.yaml. The Bearer password
# in Admin Panel > General MUST equal 1Password "WireGuard VPN" > metrics-token.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wg-easy
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - wg-easy
  selector:
    matchLabels:
      app.kubernetes.io/name: wg-easy
  endpoints:
    # Only the wg-easy-ui Service exposes a port named "ui"; the WireGuard
    # LoadBalancer Service (same app label, UDP-only) contributes no targets.
    - port: ui
      interval: 30s
      path: /metrics/prometheus
      authorization:
        type: Bearer
        credentials:
          name: observability-exporter-secrets
          key: wg-easy-metrics-token
