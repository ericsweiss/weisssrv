---
# wg-easy's native metrics, served on the UI port (51821) at /metrics/prometheus.
# Lives in observability with its Bearer secret, same shape as the meilisearch /
# home-assistant ServiceMonitors; observability->51821 is opened by
# allow-wg-easy-ingress (kubernetes/apps/wg-easy/networkpolicy.yaml).
#
# The Bearer password is set in the app's Admin Panel > General and MUST equal
# `wg-easy-metrics-token` (1Password "WireGuard VPN" > metrics-token). With
# Prometheus disabled there the endpoint serves the Nuxt SPA HTML with a 200
# rather than a 401, so the scrape fails on content type and the target sits
# permanently down — a rebuild has to redo that step.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wg-easy
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - wg-easy
  selector:
    matchLabels:
      app.kubernetes.io/name: wg-easy
  endpoints:
    # Only the wg-easy-ui Service exposes a port named "ui"; the WireGuard
    # LoadBalancer Service (same app label, UDP-only) contributes no targets.
    - port: ui
      interval: 30s
      path: /metrics/prometheus
      authorization:
        type: Bearer
        credentials:
          name: observability-exporter-secrets
          key: wg-easy-metrics-token
