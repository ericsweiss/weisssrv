---
# Scrape the nextcloud-exporter on the Nextcloud VM (10.0.10.156): plain HTTP
# on :9205, opened to k3s_nodes by sg-nextcloud. Scrapes leave the cluster
# masqueraded to node IPs, so no token or TLS is needed.
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-metrics
  namespace: observability
  labels:
    app.kubernetes.io/name: nextcloud
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9205
      targetPort: 9205

---
# Hand-written EndpointSlice for a selectorless Service — see
# exporters/node-exporter-host.yaml.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: nextcloud-metrics
  namespace: observability
  labels:
    kubernetes.io/service-name: nextcloud-metrics
addressType: IPv4
ports:
  - name: metrics
    port: 9205
    protocol: TCP
endpoints:
  - addresses: ["10.0.10.156"]
    conditions: {ready: true}

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nextcloud
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
  endpoints:
    - port: metrics
      interval: 60s
      path: /metrics
      scheme: http
