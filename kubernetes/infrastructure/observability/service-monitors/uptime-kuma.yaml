---
# Uptime Kuma's native metrics on the app port (3001) at /metrics. HTTP Basic
# against the single admin account — credentials, rotation and the API-Keys
# caveat: docs/45. observability->3001: apps/uptime-kuma/networkpolicy.yaml.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: uptime-kuma
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - uptime-kuma
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  endpoints:
    - port: http
      interval: 60s
      path: /metrics
      basicAuth:
        username:
          name: observability-exporter-secrets
          key: uptime-kuma-username
        password:
          name: observability-exporter-secrets
          key: uptime-kuma-password
