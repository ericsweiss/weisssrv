# GitLab metrics scraping is intentionally left out of the cluster until
# `prometheus_monitoring['enable'] = true` is set in /etc/gitlab/gitlab.rb
# on the GitLab VM. The Service/Endpoints/ServiceMonitor stanzas that used
# to live here pointed at port 80 of the VM, but:
#   * After the Plex/HAOS HTTPS rollout we also flipped the GitLab nginx
#     to bind only on :443 (gitlab role: `gitlab_nginx_listen_https=true`),
#     so the port-80 target was unconditionally TargetDown.
#   * Even if we re-pointed at :443, gitlab.rb's prometheus_monitoring
#     stanza is still disabled — `/-/metrics` returns the GitLab login
#     page, not metric exposition.
# Re-add the manifests below once prometheus_monitoring['enable'] flips
# to true and reconfigure runs. The previous shape (Service + Endpoints
# + ServiceMonitor with scheme: https + tlsConfig.serverName=git.esweiss.com
# + bearerTokenFile from observability-exporter-secrets[gitlab-monitoring-token])
# is in git history if needed.
