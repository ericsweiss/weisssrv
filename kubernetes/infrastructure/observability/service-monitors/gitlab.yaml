---
# Scrape GitLab metrics from the external VM
apiVersion: v1
kind: Service
metadata:
  name: gitlab-metrics
  namespace: observability
  labels:
    app.kubernetes.io/name: gitlab
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 80
      targetPort: 80

---
apiVersion: v1
kind: Endpoints
metadata:
  name: gitlab-metrics
  namespace: observability
subsets:
  - addresses:
      - ip: 192.168.0.153
    ports:
      - name: metrics
        port: 80

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitlab
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab
  endpoints:
    - port: metrics
      interval: 60s
      path: /-/metrics
