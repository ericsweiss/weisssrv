---
# GitLab omnibus metrics from the external VM. gitlab.rb enables prometheus and
# whitelists the LAN /24, so /-/metrics needs no token; nginx binds :443 only,
# hence HTTPS, and serverName rewrites SNI so the wildcard verifies on a bare IP.
apiVersion: v1
kind: Service
metadata:
  name: gitlab-metrics
  namespace: observability
  labels:
    app.kubernetes.io/name: gitlab
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 443
      targetPort: 443

---
# Hand-written EndpointSlice for a selectorless Service — see
# exporters/node-exporter-host.yaml.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: gitlab-metrics
  namespace: observability
  labels:
    kubernetes.io/service-name: gitlab-metrics
addressType: IPv4
ports:
  - name: metrics
    port: 443
    protocol: TCP
endpoints:
  - addresses: ["10.0.10.153"]
    conditions: {ready: true}

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitlab
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab
  endpoints:
    - port: metrics
      interval: 60s
      path: /-/metrics
      scheme: https
      tlsConfig:
        serverName: git.${cluster_internal_domain}
