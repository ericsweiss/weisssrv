---
# Scrape GitLab omnibus metrics from the external VM.
# gitlab.rb sets prometheus_monitoring['enable'] = true and whitelists the
# LAN /24 (gitlab_monitoring_whitelist), so /-/metrics serves exposition to
# in-cluster scrapes (pod traffic leaves the cluster masqueraded to node IPs
# in the /24) without a token. nginx binds :443 only
# (gitlab_nginx_listen_https), hence the HTTPS scrape; serverName rewrites
# SNI/host validation to git.esweiss.com so the wildcard *.esweiss.com cert
# verifies against the bare-IP Endpoint (same pattern as home-assistant.yaml).
apiVersion: v1
kind: Service
metadata:
  name: gitlab-metrics
  namespace: observability
  labels:
    app.kubernetes.io/name: gitlab
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 443
      targetPort: 443

---
# discovery.k8s.io/v1, not the deprecated core/v1 Endpoints. The Service is
# selectorless, so nothing controls this slice but this file; conditions.ready is
# set explicitly because a hand-written slice has no controller to fill it in.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: gitlab-metrics
  namespace: observability
  labels:
    kubernetes.io/service-name: gitlab-metrics
addressType: IPv4
ports:
  - name: metrics
    port: 443
    protocol: TCP
endpoints:
  - addresses: ["192.168.0.153"]
    conditions: {ready: true}

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitlab
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab
  endpoints:
    - port: metrics
      interval: 60s
      path: /-/metrics
      scheme: https
      tlsConfig:
        serverName: git.${cluster_internal_domain}
