---
# Scrape Immich's native Prometheus metrics from the external VM (10.0.10.157),
# on the plain-HTTP API (8081) and microservices (8082) ports, firewall-gated to
# the k3s nodes by sg-immich. ImmichDown reads the `job` label immich-metrics.
apiVersion: v1
kind: Service
metadata:
  name: immich-metrics
  namespace: observability
  labels:
    app.kubernetes.io/name: immich
spec:
  clusterIP: None
  ports:
    - name: api-metrics
      port: 8081
      targetPort: 8081
    - name: microservices-metrics
      port: 8082
      targetPort: 8082

---
# Hand-written EndpointSlice for a selectorless Service — see
# exporters/node-exporter-host.yaml.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: immich-metrics
  namespace: observability
  labels:
    kubernetes.io/service-name: immich-metrics
addressType: IPv4
ports:
  - name: api-metrics
    port: 8081
    protocol: TCP
  - name: microservices-metrics
    port: 8082
    protocol: TCP
endpoints:
  - addresses: ["10.0.10.157"]
    conditions: {ready: true}

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: immich
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: immich
  endpoints:
    - port: api-metrics
      interval: 60s
      path: /metrics
      scheme: http
    - port: microservices-metrics
      interval: 60s
      path: /metrics
      scheme: http
