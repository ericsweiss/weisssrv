---
# postgres_exporter targets: mealie below, the three VM databases static.
# authentik's is chart-rendered; a PodMonitor here doubles its pg_* series.
# A new target needs a job in PostgresDown's absent() arm (rules/infrastructure.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mealie-postgres
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - recipes
  selector:
    matchLabels:
      app.kubernetes.io/name: mealie-postgres
  podMetricsEndpoints:
    - portNumber: 9187
      interval: 60s
      path: /metrics

---
# Nextcloud VM (10.0.10.156), Immich VM (10.0.10.157) and the GitLab omnibus
# VM (10.0.10.153). One selectorless headless Service per host so each keeps a
# distinct `job` label, which is what the alert descriptions name.
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-postgres
  namespace: observability
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/instance: nextcloud
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: nextcloud-postgres
  namespace: observability
  labels:
    kubernetes.io/service-name: nextcloud-postgres
addressType: IPv4
ports:
  - name: metrics
    port: 9187
    protocol: TCP
endpoints:
  - addresses: ["10.0.10.156"]
    conditions: {ready: true}

---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: observability
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/instance: immich
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: immich-postgres
  namespace: observability
  labels:
    kubernetes.io/service-name: immich-postgres
addressType: IPv4
ports:
  - name: metrics
    port: 9187
    protocol: TCP
endpoints:
  - addresses: ["10.0.10.157"]
    conditions: {ready: true}

---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-postgres
  namespace: observability
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/instance: gitlab
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: gitlab-postgres
  namespace: observability
  labels:
    kubernetes.io/service-name: gitlab-postgres
addressType: IPv4
ports:
  - name: metrics
    port: 9187
    protocol: TCP
endpoints:
  - addresses: ["10.0.10.153"]
    conditions: {ready: true}

---
# jobLabel from app.kubernetes.io/instance, so the three VM targets land as
# job=nextcloud / immich / gitlab rather than all sharing one Service name.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter-vms
  namespace: observability
spec:
  jobLabel: app.kubernetes.io/instance
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  endpoints:
    - port: metrics
      interval: 60s
      path: /metrics
      scheme: http
