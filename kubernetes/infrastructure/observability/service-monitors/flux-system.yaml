---
# Scrape Flux controller metrics via PodMonitor: no Service exposes the metrics
# port, while every controller pod carries the http-prom port and the
# app.kubernetes.io/part-of=flux label.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-system
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchLabels:
      app.kubernetes.io/part-of: flux
  podMetricsEndpoints:
    - port: http-prom
      interval: 30s
      path: /metrics
