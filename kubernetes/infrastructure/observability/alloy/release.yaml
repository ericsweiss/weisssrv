---
# Grafana Alloy — container-log collector DaemonSet. Tails each node's on-disk
# pod logs (/var/log/pods) and ships them to Loki; tolerates all taints so it
# covers NAS, ingress, compute and control-plane nodes. Host journald is a
# separate path (the alloy_host Ansible role), not this DaemonSet.
#
# The chart pins its own config-reloader sidecar digest, independently of the
# kube-prometheus-stack chart's — a minor-version skew between them is expected.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: observability
spec:
  interval: 30m
  releaseName: alloy
  timeout: 10m
  chart:
    spec:
      chart: alloy
      version: "${helm_chart_versions_alloy}"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    alloy:
      enableReporting: false
      # Root + the host /var/log mount are what the file-based path needs:
      # /var/log/pods/<ns>_<pod>_<uid>/<container>/*.log is root-owned.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      # Read offsets live under the storage path. Pointing it at a hostPath is
      # the whole point of the file source — an eviction or chart upgrade
      # resumes where it stopped instead of re-reading or skipping.
      storagePath: /var/lib/alloy/data
      mounts:
        varlog: true
        extra:
          - name: alloy-storage
            mountPath: /var/lib/alloy
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
      configMap:
        content: |
          // Discover all pods on this node
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role = "pod"
              field = "spec.nodeName=" + sys.env("HOSTNAME")
            }
          }

          // Relabel discovered pods to extract useful labels
          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name"]
              separator     = "/"
              target_label  = "job"
            }
            // On-disk log path for the file tailer. The kubelet writes
            // /var/log/pods/<namespace>_<pod>_<uid>/<container>/<n>.log, so the
            // uid+container pair is enough to glob it.
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              action        = "replace"
              replacement   = "/var/log/pods/*$1/*.log"
              target_label  = "__path__"
            }
          }

          // Watch the matched paths, re-evaluated as pods come and go.
          local.file_match "pods" {
            path_targets = discovery.relabel.pods.output
          }

          // Tail from disk rather than streaming through the kube-apiserver:
          // read offsets are persisted under the hostPath storage path, so an
          // Alloy restart (eviction, chart upgrade — the DaemonSet is on an Auto
          // VPA, so both are routine) resumes instead of gapping or duplicating,
          // and the apiserver carries no log traffic.
          loki.source.file "pods" {
            targets    = local.file_match.pods.targets
            forward_to = [loki.process.cri.receiver]
          }

          // Files are raw CRI wire format ("<ts> stdout F <message>"). stage.cri
          // parses it back into timestamp/stream/message, so Loki keeps the
          // container's own timestamps and the stored line is the message alone
          // — without this, every line gains a prefix and every existing
          // dashboard and LogQL filter breaks.
          loki.process "cri" {
            stage.cri {}
            forward_to = [loki.write.default.receiver]
          }

          // Ship logs to Loki
          loki.write "default" {
            endpoint {
              url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
            }
          }

    controller:
      # `platform` (sources/priorityclasses.yaml) — the chart nests the key
      # under controller, not at the top level.
      priorityClassName: platform
      type: daemonset
      tolerations:
        - operator: Exists
      volumes:
        extra:
          - name: alloy-storage
            hostPath:
              path: /var/lib/alloy
              type: DirectoryOrCreate

    serviceMonitor:
      enabled: true

    # The chart sets HOSTNAME from spec.nodeName via downward API by default.
    # sys.env("HOSTNAME") in the River config resolves to the node name.
