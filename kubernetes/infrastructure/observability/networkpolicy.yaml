# Pod-network controls for the observability namespace. default-deny-ingress
# comes from components/netpol-baseline (wired in kustomization.yaml); the scoped
# allows below open it back up. Loki matters most here: it runs
# auth_enabled=false, and the loki-push-auth basicAuth middleware guards only the
# Traefik IngressRoute, not the ClusterIP.
#
# Egress is deliberately unrestricted: the exporters reach many LAN hosts
# (Proxmox API, AdGuard, Unbound, Plex, ZFS), Alertmanager reaches smtp-relay and
# Discord, and Prometheus remote-scrapes the host node-exporters, so a
# default-deny-egress would mean enumerating the whole LAN surface.

---
# Allow all intra-namespace ingress so the stack keeps working: Prometheus
# scrapes every component in-namespace, Grafana queries Prometheus + Loki,
# Prometheus scrapes Alertmanager, the operator talks to its workloads.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace-ingress
  namespace: observability
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability

---
# Loki :3100 — push ingestion from the in-cluster Alloy DaemonSet and the
# host-side Alloy (which arrives via the Traefik internal IngressRoute), plus
# the LogQL UI hop from Traefik. No other namespace may reach Loki directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-loki-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3100

---
# Grafana UI — reachable from Traefik only (everything else is covered by the
# intra-namespace allow above). Prometheus :9090 / Alertmanager :9093 have no
# IngressRoute (access is kubectl port-forward per docs/31), so no Traefik
# allowance exists for them; add one per-port if a route is ever created.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui-ingress-from-traefik
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3000  # Grafana

---
# prometheus-operator admission webhooks (:10250, TLS): the apiserver calls the
# operator pod directly to validate PrometheusRule/AlertmanagerConfig objects.
# It runs on the host network, so its source IP is not selectable by
# namespace/pod selectors — hence the unsourced allow on a port that serves only
# the webhook. Without it, failurePolicy=Ignore admits invalid rules unvalidated.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator-admission-webhook
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 10250
