# Pod-network controls for the observability namespace. default-deny-ingress
# comes from components/netpol-baseline and the scoped allows below reopen it.
# Egress is unrestricted, so a new probe target joins no allowlist (docs/31).

---
# Allow all intra-namespace ingress so the stack keeps working: Prometheus
# scrapes every component in-namespace, Grafana queries Prometheus + Loki,
# Prometheus scrapes Alertmanager, the operator talks to its workloads.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace-ingress
  namespace: observability
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability

---
# Loki :3100 — push ingestion from the in-cluster Alloy DaemonSet and the
# host-side Alloy (which arrives via the Traefik internal IngressRoute), plus
# the LogQL UI hop from Traefik. No other namespace may reach Loki directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-loki-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3100

---
# Grafana UI, reachable from Traefik only. Prometheus :9090 and Alertmanager
# :9093 have no IngressRoute and so no Traefik allowance; add one per port if a
# route is ever created (docs/31).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui-ingress-from-traefik
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3000  # Grafana

---
# prometheus-operator admission webhook (:10250, TLS), called by the apiserver.
# It arrives as the node's flannel gateway address, so the peer is the pod CIDR;
# the LAN /24 covers a call that leaves the node unmasqueraded.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator-admission-webhook
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.42.0.0/16
        - ipBlock:
            cidr: 10.0.10.0/24
      ports:
        - protocol: TCP
          port: 10250
