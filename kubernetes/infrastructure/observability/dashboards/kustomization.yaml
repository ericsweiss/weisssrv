---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Pin the namespace explicitly (the parent observability kustomization also sets
# it — belt-and-suspenders): the generated dashboard ConfigMaps must land in
# observability for the Grafana sidecar to discover them, and this keeps the
# directory rendering correctly even when built standalone.
namespace: observability
# ConfigMap names must stay STABLE (no content-hash suffix) so the Grafana
# sidecar keeps discovering them and no orphans accumulate.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: grafana-dashboard-adguard
    files:
      - adguard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Networking"
  - name: grafana-dashboard-alertmanager-self
    files:
      - alertmanager-self.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Infrastructure"
  - name: grafana-dashboard-alerts-overview
    files:
      - alerts-overview.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Infrastructure"
  - name: grafana-dashboard-backup-nightly
