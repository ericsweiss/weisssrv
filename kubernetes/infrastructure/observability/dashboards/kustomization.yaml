---
# Custom Grafana dashboards, one ConfigMap per JSON file, discovered by the
# Grafana sidecar via the grafana_dashboard label and filed by the grafana_folder
# annotation.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Pinned so the directory still renders into observability when built standalone;
# the parent kustomization sets the same namespace.
namespace: observability
# ConfigMap names must stay STABLE (no content-hash suffix) so the Grafana
# sidecar keeps discovering them and no orphans accumulate.
generatorOptions:
  disableNameSuffixHash: true
  # Applied to every generated ConfigMap; the sidecar selects on it.
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: grafana-dashboard-adguard
    files:
      - adguard.json
    options:
      annotations:
        grafana_folder: "Networking"
  - name: grafana-dashboard-alertmanager-self
    files:
      - alertmanager-self.json
    options:
      annotations:
        grafana_folder: "Infrastructure"
  - name: grafana-dashboard-alerts-overview
    files:
      - alerts-overview.json
    options:
      annotations:
        grafana_folder: "Infrastructure"
  - name: grafana-dashboard-authentik
    files:
      - authentik.json
    options:
      annotations:
        grafana_folder: "Applications"
  - name: grafana-dashboard-backup-nightly
    files:
      - backup-nightly-jobs.json
    options:
      annotations:
        grafana_folder: "Infrastructure"
  - name: grafana-dashboard-blackbox
    files:
      - blackbox.json
    options:
      annotations:
        grafana_folder: "Infrastructure"
  - name: grafana-dashboard-cert-manager
    files:
      - cert-manager.json
    options:
      annotations:
        grafana_folder: "Infrastructure"
  - name: grafana-dashboard-cluster-overview
    files:
      - cluster-overview.json
    options:
      annotations:
        grafana_folder: "Infrastructure"
  - name: grafana-dashboard-dns-combined
    files:
      - dns-combined.json
    options:
      annotations:
        grafana_folder: "Networking"
  - name: grafana-dashboard-flux
    files:
      - flux-cluster.json
    options:
      annotations:
        grafana_folder: "Infrastructure"
  - name: grafana-dashboard-gitlab
    files:
      - gitlab.json
    options:
      annotations:
        grafana_folder: "Applications"
  - name: grafana-dashboard-gpu
    files:
      - gpu.json
    options:
      annotations:
        grafana_folder: "Infrastructure"
  - name: grafana-dashboard-hindsight
    files:
      - hindsight.json
    options:
      annotations:
        grafana_folder: "Applications"
  - name: grafana-dashboard-home-assistant
    files:
      - home-assistant.json
    options:
      annotations:
        grafana_folder: "Applications"
  - name: grafana-dashboard-immich
    files:
      - immich.json
    options:
      annotations:
        grafana_folder: "Applications"
  - name: grafana-dashboard-infrastructure
    files:
      - infrastructure.json
    options:
      annotations:
        grafana_folder: "Infrastructure"
  - name: grafana-dashboard-loki-self
    files:
      - loki-self.json
    options:
      annotations:
        grafana_folder: "Infrastructure"
  - name: grafana-dashboard-mail
    files:
      - mail.json
    options:
      annotations:
        grafana_folder: "Infrastructure"
  - name: grafana-dashboard-media-stack
    files:
      - media-stack.json
    options:
      annotations:
        grafana_folder: "Applications"
  - name: grafana-dashboard-nextcloud
    files:
      - nextcloud.json
    options:
      annotations:
        grafana_folder: "Applications"
  - name: grafana-dashboard-node-exporter-full
