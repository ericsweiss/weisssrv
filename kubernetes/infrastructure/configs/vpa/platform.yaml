---
# VPA policies for platform controllers. Default updateMode is Auto (the updater
# may evict to apply new requests); anything on the synchronous request or
# admission path uses Initial instead, annotated per entry below.
#
# controlledValues: RequestsOnly is TARGETED, added only when a limit is
# OBSERVED to oscillate — never on principle. On the default RequestsAndLimits
# the updater rescales the limit with the recommendation, so a quiet period
# shrinks the ceiling and the next burst runs against it. Flipping an entry
# lowers its effective ceiling to the manifest limit, so it is only safe once
# that limit is re-measured and this maxAllowed reconciled with it.
#
# Every maxAllowed.memory below is derived from the HelmRelease's memory limit,
# per the scoped rule in docs/33 § Limit oscillation: a RequestsOnly entry caps
# AT the limit (the request may reach the admitted ceiling, never pass it); a
# limit-controlling entry caps at 0.8x it, because a cap at or above the limit
# lets the updater rescale the declared ceiling out from under it. `Off`
# entries are recommend-only and exempt. Re-derive a cap in the same commit
# that moves its limit.
#
# Lives in configs/ because controllers/vpa installs the CRD.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: metallb-controller
  namespace: metallb-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: metallb-controller
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 204Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: metallb-speaker
  namespace: metallb-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: metallb-speaker
  # Initial (not Auto): the speaker announces every MetalLB VIP, so evicting the
  # announcing pod forces a leader re-election + gratuitous-ARP failover that
  # reads as an ingress outage. metallb-controller stays Auto — it announces
  # nothing.
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 300m, memory: 204Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: traefik
  namespace: traefik
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: traefik
  # Initial (not Auto): Traefik is the ingress data path for every service. An
  # Auto eviction's readiness gap shows up as 502s on the registry and hung
  # git.esweiss.com under CI-burst load, and a PDB cannot help — each replacement
  # pod is briefly not-ready regardless.
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    # Memory only: Traefik's chart-native HPA owns CPU, and an HPA and a VPA must
    # never drive the same resource.
    containerPolicies:
      - containerName: "*"
        minAllowed: {memory: 64Mi}
        maxAllowed: {memory: 409Mi}
        controlledResources: [memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cert-manager
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 102Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cert-manager-cainjector
  namespace: cert-manager
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cert-manager-cainjector
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 102Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cert-manager-webhook
  namespace: cert-manager
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cert-manager-webhook
  # Initial (not Auto): single-replica on the synchronous admission path, so an
  # eviction would briefly fail-closed validating cert-manager CRs. A PDB cannot
  # help one replica without blocking drains outright.
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 102Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-dns
  namespace: external-dns
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-dns
  # Initial (not Auto): a single replica with no PDB — evicting it would halt
  # Cloudflare record reconciliation.
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-secrets
  updatePolicy:
    updateMode: Auto
  # cpu+memory: ESO has no HPA (it does not shard ExternalSecrets), so this VPA
  # owns both axes.
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-secrets-webhook
  namespace: external-secrets
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-secrets-webhook
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-secrets-cert-controller
  namespace: external-secrets
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-secrets-cert-controller
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 320Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: onepassword-connect
  updatePolicy:
    updateMode: Auto
  # Memory-only: CPU is owned by the Connect chart-native HPA
  # (connect.hpa in controllers/onepassword-connect/release.yaml). A VPA and an
  # HPA driving the same resource conflict.
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {memory: 32Mi}
        maxAllowed: {memory: 256Mi}
        controlledResources: [memory]
        controlledValues: RequestsOnly
---
# CoreDNS is HPA-pinned (configs/coredns/hpa.yaml), so this VPA is
# recommend-only — it records a right-sizing signal without mutating pods the
# HPA also drives.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: coredns
  namespace: kube-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coredns
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 32Mi}
        maxAllowed: {cpu: 500m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
# kube-vip owns the API VIP on all three control-plane nodes and is rendered by
# the weisssrv.infra k3s role's kube-vip-manifest.yaml.j2 template (weisssrv-lib),
# not by Flux. Recommend-only: the updater must never evict the pod serving the
# API endpoint, and its requests are hand-set in that template.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: kube-vip
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 192Mi}
        controlledResources: [cpu, memory]
---
# metrics-server feeds every HPA target and the VPA recommender, so this stays
# recommend-only: an eviction gap would blind the whole autoscaling stack at
# once, even with the 2 replicas + PDB the HelmRelease now runs
# (controllers/metrics-server). The recommendation just makes a future request
# bump data-driven. maxAllowed tracks the release's memory limit.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: metrics-server
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 32Mi}
        maxAllowed: {cpu: 500m, memory: 192Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: reloader
  namespace: reloader
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reloader-reloader
  # Auto: an off-data-path ConfigMap watcher — an eviction delays a reload,
  # never drops one.
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 102Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: operator
  # Initial (not Auto): a single-replica reconciler for the proxy StatefulSets —
  # an updater eviction would stall tailnet device reconciliation. Right-size on
  # the next natural restart instead, never by eviction.
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 204Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: nvidia-device-plugin
  namespace: nvidia-device-plugin
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: nvidia-device-plugin
  # Off (recommendations only): the plugin advertises the GPU to the kubelet, so
  # an eviction briefly withdraws nvidia.com/gpu from the node. Its footprint is
  # fixed anyway (~50Mi against a 64Mi request) — this exists so the workload is
  # covered by a right-sizing signal rather than being invisible (docs/33).
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
