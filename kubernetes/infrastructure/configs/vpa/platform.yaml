---
# VPA policies for platform controllers. Default is updateMode Auto (the updater
# may evict to apply new requests). Anything on the synchronous request or
# admission path uses Initial instead — recommendations land on the next natural
# restart, never by eviction: Traefik, cert-manager-webhook, external-dns,
# metallb-speaker and tailscale-operator, each annotated below.
# Lives in configs/ because controllers/vpa installs the CRD.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: metallb-controller
  namespace: metallb-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: metallb-controller
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: metallb-speaker
  namespace: metallb-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: metallb-speaker
  # Initial (not Auto): the speaker announces every MetalLB VIP, so evicting the
  # announcing pod forces a leader re-election + gratuitous-ARP failover that
  # reads as an ingress outage. metallb-controller stays Auto — it announces
  # nothing.
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 300m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: traefik
  namespace: traefik
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: traefik
  # Initial (not Auto): Traefik is the ingress data path for every service. An
  # Auto eviction's readiness gap shows up as 502s on the registry and hung
  # git.esweiss.com under CI-burst load, and a PDB cannot help — each replacement
  # pod is briefly not-ready regardless.
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    # Memory only: Traefik's chart-native HPA owns CPU, and an HPA and a VPA must
    # never drive the same resource.
    containerPolicies:
      - containerName: "*"
        minAllowed: {memory: 64Mi}
        maxAllowed: {memory: 512Mi}
        controlledResources: [memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cert-manager
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cert-manager-cainjector
  namespace: cert-manager
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cert-manager-cainjector
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 384Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cert-manager-webhook
  namespace: cert-manager
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cert-manager-webhook
  # Initial (not Auto): single-replica on the synchronous admission path, so an
  # eviction would briefly fail-closed validating cert-manager CRs. A PDB cannot
  # help one replica without blocking drains outright.
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-dns
  namespace: external-dns
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-dns
  # Initial (not Auto): a single replica with no PDB — evicting it would halt
  # Cloudflare record reconciliation.
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-secrets
  updatePolicy:
    updateMode: Auto
  # cpu+memory: ESO has no HPA (it does not shard ExternalSecrets), so this VPA
  # owns both axes.
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 512Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-secrets-webhook
  namespace: external-secrets
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-secrets-webhook
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-secrets-cert-controller
  namespace: external-secrets
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-secrets-cert-controller
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: onepassword-connect
  updatePolicy:
    updateMode: Auto
  # Memory-only: CPU is owned by the Connect chart-native HPA
  # (connect.hpa in controllers/onepassword-connect/release.yaml). A VPA and an
  # HPA driving the same resource conflict.
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {memory: 32Mi}
        maxAllowed: {memory: 512Mi}
        controlledResources: [memory]
---
# CoreDNS is HPA-pinned (configs/coredns/hpa.yaml), so this VPA is
# recommend-only — it records a right-sizing signal without mutating pods the
# HPA also drives.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: coredns
  namespace: kube-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coredns
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 32Mi}
        maxAllowed: {cpu: 500m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
# kube-vip owns the API VIP on all three control-plane nodes and is rendered by
# Ansible (roles/k3s), not Flux. Recommend-only: the updater must never evict the
# pod serving the API endpoint, and its requests are hand-set in that template.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: kube-vip
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 192Mi}
        controlledResources: [cpu, memory]
---
# metrics-server (k3s AddOn) feeds every HPA target and the VPA recommender, so
# this stays recommend-only: an eviction gap would blind the whole autoscaling
# stack at once. The recommendation just makes a future request bump data-driven.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: metrics-server
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 32Mi}
        maxAllowed: {cpu: 500m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: reloader
  namespace: reloader
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reloader-reloader
  # Auto: an off-data-path ConfigMap watcher — an eviction delays a reload,
  # never drops one.
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: operator
  # Initial (not Auto): a single-replica reconciler for the proxy StatefulSets —
  # an updater eviction would stall tailnet device reconciliation. Right-size on
  # the next natural restart instead, never by eviction.
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 384Mi}
        controlledResources: [cpu, memory]
