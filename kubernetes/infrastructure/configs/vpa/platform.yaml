---
# VPA policies for platform controllers. Most use updateMode Auto (the updater
# may evict to apply new requests — these tolerate restarts). Components on the
# synchronous request/admission path use Initial instead (apply recommendations
# on the next natural restart, never proactive eviction): Traefik (ingress for
# every service — an Auto eviction blip 502'd the registry and hung
# git.esweiss.com under CI-burst load, even with a PDB), cert-manager-webhook
# (single-replica admission), and external-dns (single-replica, no PDB). Lives in
# configs/ because the VPA CRD is installed by controllers/vpa.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: metallb-controller
  namespace: metallb-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: metallb-controller
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: metallb-speaker
  namespace: metallb-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: metallb-speaker
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 300m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: traefik
  namespace: traefik
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: traefik
  # Initial (not Auto): Traefik is the ingress data path for EVERY service,
  # including the container registry. Under CI-burst load the Auto updater evicted
  # Traefik to apply a new memory request, and the recreated pod's startup
  # readiness gap surfaced as transient 502s on registry.git.ericsweiss.com (CI
  # image pulls -> ImagePullBackOff), git.esweiss.com hangs (collect-state false
  # 000), and Unhealthy events — a PDB doesn't help, since each replacement pod is
  # briefly not-ready regardless. Initial applies memory recommendations on the
  # next natural restart instead of evicting a serving ingress pod.
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    # Memory only: Traefik's chart-native autoscaling (autoscaling.enabled in
    # controllers/traefik/release.yaml) scales on CPU, so this VPA must not also
    # control CPU (an HPA and a VPA driving the same resource conflict).
    # controlledResources excludes cpu accordingly.
    containerPolicies:
      - containerName: "*"
        minAllowed: {memory: 64Mi}
        maxAllowed: {memory: 512Mi}
        controlledResources: [memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cert-manager
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cert-manager-cainjector
  namespace: cert-manager
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cert-manager-cainjector
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 384Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cert-manager-webhook
  namespace: cert-manager
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cert-manager-webhook
  # Initial (not Auto): the webhook is single-replica and sits on the synchronous
  # admission path — a VPA updater eviction would briefly fail-closed validating
  # cert-manager CRs. A PDB can't help a single replica (minAvailable:1 would
  # block node drains entirely), so apply recommendations on natural restart.
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-dns
  namespace: external-dns
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-dns
  # Initial (not Auto): external-dns runs a single replica with no PDB, so the
  # updater evicting the only pod to apply new requests would briefly halt
  # Cloudflare record reconciliation. Initial applies recommendations on the
  # next natural restart instead.
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-secrets
  updatePolicy:
    updateMode: Auto
  # cpu+memory: ESO has no HPA (it doesn't shard ExternalSecrets, so horizontal
  # scaling buys nothing — it runs 2 static replicas with leader election for
  # HA). With no HPA on the CPU axis, this VPA owns both resources.
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 512Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-secrets-webhook
  namespace: external-secrets
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-secrets-webhook
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-secrets-cert-controller
  namespace: external-secrets
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-secrets-cert-controller
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: onepassword-connect
  updatePolicy:
    updateMode: Auto
  # Memory-only: CPU is owned by the Connect chart-native HPA
  # (connect.hpa in controllers/onepassword-connect/release.yaml). A VPA and an
  # HPA driving the same resource conflict.
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {memory: 32Mi}
        maxAllowed: {memory: 512Mi}
        controlledResources: [memory]
---
# CoreDNS is HPA-pinned (configs/coredns/hpa.yaml, min==max==2), so this VPA is
# recommend-only (updateMode: Off) — it never mutates pods (which would conflict
# with the HPA), it just records a right-sizing signal for the operator so a
# request bump is data-driven if DNS QPS grows. Inspect with
# `kubectl describe vpa coredns -n kube-system`.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: coredns
  namespace: kube-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coredns
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 32Mi}
        maxAllowed: {cpu: 500m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
# local-path-provisioner (k3s AddOn) ships with empty resources: {} → BestEffort
# QoS and has no VPA. Recommend-only (updateMode: Off) so the updater never
# evicts the provisioner off the PVC-bind path; it just records a right-sizing
# signal so a request bump (or a HelmChartConfig override) can be data-driven.
# Inspect with `kubectl describe vpa local-path-provisioner -n kube-system`.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: local-path-provisioner
  namespace: kube-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: local-path-provisioner
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 16Mi}
        maxAllowed: {cpu: 100m, memory: 128Mi}
        controlledResources: [cpu, memory]
---
# metrics-server (k3s AddOn) is the single source of pod/node resource metrics
# that the whole autoscaling stack depends on — every HPA's CPU/memory target
# and the VPA recommender both read from it. Recommend-only (updateMode: Off) so
# the updater never evicts the cluster's only metrics provider (an eviction gap
# would blind every HPA and the VPA recommender at once); it just records a
# right-sizing signal so a request bump is data-driven. Adding limits/replicas
# is a deferred follow-up. Inspect with
# `kubectl describe vpa metrics-server -n kube-system`.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: metrics-server
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 32Mi}
        maxAllowed: {cpu: 500m, memory: 256Mi}
        controlledResources: [cpu, memory]
