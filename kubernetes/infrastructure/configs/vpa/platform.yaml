---
# VPA policies for platform controllers: updateMode Auto by default, Initial on
# the synchronous request or admission path. controlledValues and maxAllowed
# follow docs/33 § Limit oscillation. Lives here because controllers/vpa owns the CRD.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: metallb-controller
  namespace: metallb-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: metallb-controller
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 204Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: metallb-speaker
  namespace: metallb-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: metallb-speaker
  # Initial (not Auto): the speaker announces every MetalLB VIP, so evicting it
  # forces a re-election + gratuitous-ARP failover that reads as an ingress
  # outage. metallb-controller stays Auto — it announces nothing.
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      # The reloader and frr-metrics sidecars are bounded by the release's
      # postRenderer; cap == each one's limit under RequestsOnly, so the "*"
      # 204Mi never raises them past that bound.
      - containerName: reloader
        minAllowed: {cpu: 10m, memory: 16Mi}
        maxAllowed: {cpu: 100m, memory: 64Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
      - containerName: frr-metrics
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 100m, memory: 128Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
      # speaker and frr, each under a 256Mi limit.
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 300m, memory: 204Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: traefik
  namespace: traefik
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: traefik
  # Initial (not Auto): Traefik is the ingress data path for every service, and
  # an eviction's readiness gap shows up as 502s under CI-burst load. A PDB
  # cannot help — each replacement pod is briefly not-ready regardless.
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    # Memory only: Traefik's chart-native HPA owns CPU, and an HPA and a VPA must
    # never drive the same resource.
    containerPolicies:
      - containerName: "*"
        minAllowed: {memory: 64Mi}
        maxAllowed: {memory: 409Mi}
        controlledResources: [memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cert-manager
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      # RequestsOnly; cap == the 192Mi limit in controllers/cert-manager/
      # release.yaml, the ~114Mi 30d peak +60% (docs/33 § Limit oscillation).
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 192Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cert-manager-cainjector
  namespace: cert-manager
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cert-manager-cainjector
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      # RequestsOnly; cap == the 160Mi cainjector limit in
      # controllers/cert-manager/release.yaml (docs/33 § Limit oscillation).
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 160Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cert-manager-webhook
  namespace: cert-manager
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cert-manager-webhook
  # Auto: 2 replicas behind controllers/cert-manager/pdb.yaml absorb an
  # eviction without failing a CR write (the external-secrets webhook shape).
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      # RequestsOnly; cap == the 128Mi webhook limit in release.yaml, itself
      # the ~79Mi 30d peak +60% (docs/33 § Limit oscillation).
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 128Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-dns
  namespace: external-dns
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-dns
  # Initial (not Auto): a single replica with no PDB — evicting it would halt
  # Cloudflare record reconciliation.
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-secrets
  updatePolicy:
    updateMode: Auto
  # cpu+memory: ESO has no HPA (it does not shard ExternalSecrets), so this VPA
  # owns both axes.
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-secrets-webhook
  namespace: external-secrets
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-secrets-webhook
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: external-secrets-cert-controller
  namespace: external-secrets
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-secrets-cert-controller
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 320Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: onepassword-connect
  updatePolicy:
    updateMode: Auto
  # Memory-only: CPU is owned by the Connect chart-native HPA
  # (connect.hpa in controllers/onepassword-connect/release.yaml). A VPA and an
  # HPA driving the same resource conflict.
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {memory: 32Mi}
        maxAllowed: {memory: 256Mi}
        controlledResources: [memory]
        controlledValues: RequestsOnly
---
# CoreDNS is HPA-pinned (configs/coredns/hpa.yaml), so this VPA is
# recommend-only — it records a right-sizing signal without mutating pods the
# HPA also drives.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: coredns
  namespace: kube-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coredns
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 32Mi}
        maxAllowed: {cpu: 500m, memory: 256Mi}
        controlledResources: [cpu, memory]
---
# kube-vip owns the API VIP and is rendered by the weisssrv.infra k3s role, not
# by Flux. Off: the updater must never evict the pod serving the API endpoint,
# and its requests are hand-set in that template.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: kube-vip
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 192Mi}
        controlledResources: [cpu, memory]
---
# Off (recommendations only): kured holds the cluster-wide reboot lock, so an
# updater eviction mid-cycle is never wanted. This records a right-sizing signal
# for the one platform DaemonSet that would otherwise have none (docs/33).
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kured
  namespace: kube-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: kured
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 128Mi}
        controlledResources: [cpu, memory]
---
# metrics-server feeds every HPA target and the VPA recommender, so it stays
# recommend-only: an eviction gap blinds the whole autoscaling stack at once.
# maxAllowed tracks the release's memory limit (controllers/metrics-server).
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: metrics-server
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 32Mi}
        maxAllowed: {cpu: 500m, memory: 192Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: reloader
  namespace: reloader
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reloader-reloader
  # Auto: an off-data-path ConfigMap watcher — an eviction delays a reload,
  # never drops one.
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 102Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: operator
  # Initial (not Auto): a single-replica reconciler for the proxy StatefulSets,
  # so an eviction stalls tailnet device reconciliation. Right-sized on the next
  # natural restart.
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 204Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: nvidia-device-plugin
  namespace: nvidia-device-plugin
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: nvidia-device-plugin
  # Off (recommendations only): the plugin advertises the GPU to the kubelet, so
  # an eviction briefly withdraws nvidia.com/gpu from the node. It exists so the
  # workload carries a right-sizing signal rather than none (docs/33).
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      # Cap == the config-manager sidecar's own 32Mi limit (release.yaml).
      - containerName: nvidia-device-plugin-sidecar
        minAllowed: {cpu: 10m, memory: 16Mi}
        maxAllowed: {cpu: 50m, memory: 32Mi}
        controlledResources: [cpu, memory]
      # nvidia-device-plugin-ctr, cap == its 128Mi limit.
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 128Mi}
        controlledResources: [cpu, memory]
