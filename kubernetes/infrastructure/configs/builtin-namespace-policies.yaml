---
# Fail-closed PSA labels plus ingress/egress deny for the two pod-free built-in
# namespaces (kube-public, kube-node-lease), which otherwise admit at privileged
# and unfenced. prune is disabled so Flux never deletes a built-in namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: kube-public
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted

---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-node-lease
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: kube-public
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: kube-node-lease
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
