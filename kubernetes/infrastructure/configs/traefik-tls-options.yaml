---
# Cluster-wide TLS minimum version pin.
# A TLSOption named `default` in Traefik's namespace is applied to every
# route that doesn't reference its own TLSOption — so this single resource
# covers all current and future IngressRoutes.
#
# TLS 1.3 only. Its cipher set is fixed and forward-secret, so no cipherSuites
# list is needed; curvePreferences keeps the curves forward-secret too. A client
# that cannot do 1.3 needs a second TLSOption referenced from its own route.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: traefik
spec:
  minVersion: VersionTLS13
  curvePreferences:
    - CurveP521
    - CurveP384
    - CurveP256
