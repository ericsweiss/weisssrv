---
# Cluster-wide TLS floor: a TLSOption named `default` in Traefik's namespace
# applies to every route without its own. TLS 1.3 only, whose cipher set is fixed
# and forward-secret; curvePreferences stays unset so X25519 survives.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: traefik
spec:
  minVersion: VersionTLS13
