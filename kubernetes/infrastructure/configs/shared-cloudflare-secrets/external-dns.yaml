---
# Cloudflare API token for external-dns.
# Sourced from 1Password item "Cloudflare DNS Token" (id 6lbrnhcoip3woze3icy4hy65yq).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: external-dns
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: 6lbrnhcoip3woze3icy4hy65yq/credential
