---
# Internal-only IngressRoute for 1Password Connect.
#
# The Proxmox hosts' boot-time zfs-load-key units fetch their pool passphrase
# from 1Password and cannot reach a ClusterIP, so Connect is published on the
# internal VIP; lan-tailscale-strict blocks every non-LAN/Tailscale source,
# in-cluster pods included.
#
# Lives in configs/ so it is same-stage as the middlewares and the Certificate
# it consumes.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`connect.esweiss.com`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-strict
          namespace: traefik
        - name: hsts-header
          namespace: traefik
        - name: security-headers
          namespace: traefik
      services:
        - name: onepassword-connect
          port: 8080
  tls:
    secretName: esweiss-com-tls
