---
# Internal-only IngressRoute for 1Password Connect.
#
# Why: the boot-time ZFS-encryption units on Proxmox hosts
# (zfs-load-key@<pool>.service) need to fetch their pool passphrase
# from 1Password. They can't speak to a ClusterIP Service directly, so
# Connect is published as connect.esweiss.com via Traefik on the
# internal MetalLB VIP (192.168.0.101). The lan-tailscale-strict
# middleware blocks any non-LAN/Tailscale source (no in-cluster pods).
#
# The companion AdGuard rewrite (dns.yml: connect.esweiss.com -> .101)
# points clients at the internal VIP. Traefik terminates TLS using the
# wildcard Secret produced by onepassword-connect-certificate.yaml in
# this same namespace.
#
# Lives in configs/ (not controllers/) so it's same-stage as the
# middlewares it references (traefik-middlewares.yaml) and the
# Certificate it consumes (onepassword-connect-certificate.yaml).
# kustomize-controller applies all of configs/ in one batch; if the
# IngressRoute reconciles before the Middleware exists, Traefik retries
# on the next watch event (sub-30s) instead of waiting for the next
# Flux Kustomization stage.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`connect.esweiss.com`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-strict
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: onepassword-connect
          port: 8080
  tls:
    secretName: esweiss-com-tls
