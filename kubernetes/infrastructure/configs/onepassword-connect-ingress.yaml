---
# Internal-only IngressRoute for 1Password Connect. The hosts' boot-time
# zfs-load-key units cannot reach a ClusterIP, so Connect is published on the
# internal VIP behind lan-tailscale-strict.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`connect.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-strict
          namespace: traefik
        - name: hsts-header
          namespace: traefik
        - name: security-headers
          namespace: traefik
      services:
        - name: onepassword-connect
          port: 8080
  tls:
    secretName: esweiss-com-tls
