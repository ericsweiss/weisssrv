---
# configs/ reconciles AFTER controllers/ because nearly every resource here is a
# CR whose CRD controllers/ installs. The PriorityClasses and the versions
# ConfigMap live under sources/ instead; controllers/ needs both (see headers).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - default-namespace.yaml
  - builtin-namespace-policies.yaml
  - kube-system-policies
  - cluster-secret-store.yaml
  - cluster-issuer.yaml
  - metallb-ip-pools.yaml
  - traefik-tls-options.yaml
  - traefik-middlewares.yaml
  - wildcard-certificates.yaml
  - onepassword-connect-certificate.yaml
  - onepassword-connect-ingress.yaml
  - coredns
  - cloudflare-ddns
  - shared-cloudflare-secrets
  - vpa
