---
# Cluster-wide wildcard Certificates used by IngressRoutes in the
# `default` namespace (Plex, Home Assistant, AdGuard, router, and
# vm-ingress HA bypass routes). These produce the `ericsweiss-com-tls`
# and `esweiss-com-tls` Secrets in the `default` namespace.
#
# cert-manager ClusterIssuer (letsencrypt-prod) issues these via DNS-01
# over Cloudflare. Renewal happens 30 days before expiration.
#
# Apps outside the `default` namespace carry their own wildcard Certificate,
# because Traefik reads TLS Secrets only from the IngressRoute's own namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ericsweiss-com-wildcard
  namespace: default
spec:
  secretName: ericsweiss-com-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.ericsweiss.com"
  dnsNames:
    - "*.ericsweiss.com"
    - ericsweiss.com
  renewBefore: 720h   # 30 days
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: esweiss-com-wildcard
  namespace: default
spec:
  secretName: esweiss-com-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.esweiss.com"
  dnsNames:
    - "*.esweiss.com"
    - esweiss.com
  # CANONICAL stagger note (the other two legs point here). The three identical
  # *.esweiss.com wildcards live in separate namespaces because Traefik only
  # reads TLS Secrets from the IngressRoute's own namespace, so each fires its
  # own ACME order. renewBefore is staggered across the legs — default 720h /
  # external-secrets 600h / downloads 480h — so they don't all renew in the same
  # window and burn the Let's Encrypt 5/week duplicate-cert limit at once.
  renewBefore: 720h   # 30 days (stagger anchor)
