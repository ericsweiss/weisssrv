---
# Cluster-wide wildcard Certificates used by IngressRoutes across the
# `default` namespace (Plex, Home Assistant, AdGuard, router, downloads,
# vm-ingress HA bypass routes). These produce the `ericsweiss-com-tls`
# and `esweiss-com-tls` Secrets in the `default` namespace.
#
# cert-manager ClusterIssuer (letsencrypt-prod) issues these via DNS-01
# over Cloudflare. Renewal happens 30 days before expiration.
#
# Namespace-specific wildcard certs (e.g., the one in the downloads
# namespace at kubernetes/apps/download-clients/certificate.yaml or
# authentik's per-namespace cert at kubernetes/apps/authentik/
# certificate.yaml) are in addition to these — those serve apps that
# don't share the `default` namespace TLS secret.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ericsweiss-com-wildcard
  namespace: default
spec:
  secretName: ericsweiss-com-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.ericsweiss.com"
  dnsNames:
    - "*.ericsweiss.com"
    - ericsweiss.com
  renewBefore: 720h   # 30 days
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: esweiss-com-wildcard
  namespace: default
spec:
  secretName: esweiss-com-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.esweiss.com"
  dnsNames:
    - "*.esweiss.com"
    - esweiss.com
  renewBefore: 720h   # 30 days
