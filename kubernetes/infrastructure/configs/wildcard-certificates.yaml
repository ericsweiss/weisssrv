---
# Wildcard Certificates for the `default` namespace IngressRoutes, issued by
# letsencrypt-prod over DNS-01. Apps elsewhere carry their own: Traefik reads a
# TLS Secret only from the route's own namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ericsweiss-com-wildcard
  namespace: default
spec:
  secretName: ericsweiss-com-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.${cluster_external_domain}"
  dnsNames:
    - "*.${cluster_external_domain}"
    - ${cluster_external_domain}
  renewBefore: 720h   # 30 days
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: esweiss-com-wildcard
  namespace: default
spec:
  secretName: esweiss-com-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.${cluster_internal_domain}"
  dnsNames:
    - "*.${cluster_internal_domain}"
    - ${cluster_internal_domain}
  # CRITICAL: stagger anchor, the other two wildcard legs point here. Each
  # namespace's *.esweiss.com wildcard orders separately, so renewBefore is
  # staggered (720h / 600h / 480h) to stay under the 5/week duplicate limit.
  renewBefore: 720h   # 30 days (stagger anchor)
