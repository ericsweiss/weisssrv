# CoreDNS HelmChartConfig - scales k3s built-in CoreDNS to 2 replicas for HA
# Topology spread prefers replicas on different nodes but allows colocation
# when nodes are unavailable (drain, failure, bootstrap) — total DNS outage
# is worse than suboptimal spread. PDB guards voluntary eviction separately.
# Applied via k3s HelmChart controller (k3s-specific CRD)
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: coredns
  namespace: kube-system
spec:
  valuesContent: |-
    replicaCount: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            k8s-app: kube-dns
