---
# Pins k3s's built-in CoreDNS at 2 replicas for HA. k3s manages the CoreDNS
# Deployment as a wrangler AddOn (NOT a HelmChart), so it resets replicas on
# every server restart/upgrade; this HPA scales it back within seconds. The
# previous HelmChartConfig was a silent no-op for the same reason.
# Topology spread is left to the default scheduler (PDB still guards drains).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coredns
  namespace: kube-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coredns
  minReplicas: 2
  maxReplicas: 2
  # NOTE: with minReplicas == maxReplicas this HPA is a pure replica pin, not an
  # autoscaler — the metrics block below can never trigger a scale event. It is
  # kept only to satisfy the HPA schema (a v2 HPA requires a metric). The VPA in
  # configs/vpa/platform.yaml (updateMode: Off) records the right-sizing signal.
  # If CoreDNS load grows, raise maxReplicas to make this actually horizontal
  # and tune the threshold then; until then the averageUtilization value is
  # inert and should not be read as an active target.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 90
