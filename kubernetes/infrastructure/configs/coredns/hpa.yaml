---
# Pins k3s's built-in CoreDNS at 2 replicas for HA. k3s owns the CoreDNS
# Deployment as a wrangler AddOn and resets replicas on every server
# restart/upgrade, so this must be an HPA, not a replicas patch — the same
# ownership makes hard pod-spread unachievable from here (docs/33-autoscaling.md).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coredns
  namespace: kube-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coredns
  minReplicas: 2
  maxReplicas: 2
  # min == max makes this a pure replica pin: the metric below can never fire and
  # exists only because a v2 HPA requires one. Raise maxReplicas first if CoreDNS
  # ever needs to scale.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 90
