---
# Keeps one CoreDNS replica available during node drains (voluntary
# disruption only). Hard pod-spread is unachievable — k3s owns the Deployment
# pod template as a wrangler AddOn (docs/33-autoscaling.md).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coredns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
spec:
  minAvailable: 1
  selector:
    matchLabels:
      k8s-app: kube-dns
