---
# Platform Traefik middlewares, referenced by IngressRoutes in the later stages. They
# live here so they exist first: a missing middleware fails closed and the route 404s.
# Middlewares used only by apps stay in apps/vm-ingress/middleware.yaml.

# IP allowlist for internal-only services: homelab LAN, Home VLAN, Tailscale and
# the pod CIDR (traefik-internal runs externalTrafficPolicy: Local, so in-cluster
# callers arrive with a pod source IP). Other VLANs stay out by design (docs/46).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-tailscale-only
  namespace: traefik
spec:
  ipAllowList:
    sourceRange:
      - ${cluster_lan_cidr}     # Local LAN
      - ${cluster_home_cidr}    # Home VLAN (UniFi VLAN 20 — docs/46)
      - ${cluster_tailnet_cidr}      # Tailscale CGNAT range
      - ${cluster_pod_cidr}       # K3s pod CIDR (see k3s_cluster_cidr in group_vars)

---
# CRITICAL: stricter allowlist for routes gated only by this list plus the backend's
# own login. No pod CIDR, and the Home VLAN enters as the admin /29 mirroring the
# Proxmox admin_lan set (docs/11, docs/46). Over Tailscale these names must resolve to
# the internal VIP via the apps/tailnet-dns override zone, so the request arrives
# subnet-routed into the LAN range; the mesh CNAME path arrives with a pod source IP
# and this list rejects it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-tailscale-strict
  namespace: traefik
spec:
  ipAllowList:
    sourceRange:
      - ${cluster_lan_cidr}     # Local LAN
      - ${cluster_home_admin_cidr}   # Home VLAN admin block (docs/46)
      - ${cluster_tailnet_cidr}      # Tailscale CGNAT — matches only unSNAT'd mesh traffic

---
# HSTS for public services. Chain security-headers alongside it on WAN routes.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hsts-header
  namespace: traefik
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true

---
# Baseline response headers for WAN-facing routes, chained after hsts-header. Separate
# so a route that must be framed can still take HSTS. An app that embeds itself needs
# its own middleware with customFrameOptionsValue: SAMEORIGIN.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: traefik
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
