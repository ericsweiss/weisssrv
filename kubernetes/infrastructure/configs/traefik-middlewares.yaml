---
# Platform Traefik middlewares, referenced by IngressRoutes in the configs,
# controllers, observability and apps stages. They live here (not in
# apps/vm-ingress) so they exist before the later stages: a missing middleware
# fails closed — Traefik disables the router and the route 404s until it
# reconciles. Middlewares used only by apps stay in apps/vm-ingress/middleware.yaml.

# IP allowlist for internal-only services (LAN + Tailscale + in-cluster pods).
# The pod CIDR is included because traefik-internal runs
# externalTrafficPolicy: Local, so in-cluster callers (e.g. blackbox-exporter
# probing https://git.esweiss.com) arrive with a pod source IP. That CIDR is
# routable only inside the CNI overlay, so it cannot be spoofed from outside.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-tailscale-only
  namespace: traefik
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.0/24     # Local LAN
      - 100.64.0.0/10      # Tailscale CGNAT range
      - 10.42.0.0/16       # K3s pod CIDR (see k3s_cluster_cidr in group_vars)

---
# Stricter allowlist: lan-tailscale-only without the pod CIDR. For routes whose
# only gates are the IP allowlist plus the backend's own login, where an
# in-cluster pod reaching the route would be a real escalation — 1Password
# Connect, and the router/AdGuard appliance UIs that have no forward-auth.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-tailscale-strict
  namespace: traefik
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.0/24     # Local LAN
      - 100.64.0.0/10      # Tailscale CGNAT range

---
# HSTS for public services. Chain security-headers alongside it on WAN routes.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hsts-header
  namespace: traefik
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true

---
# Baseline response headers for WAN-facing routes, chained after hsts-header.
# Kept separate from hsts-header so a route that must be framed (or needs a
# looser referrer policy) can take HSTS without this. frameDeny is safe for the
# current consumers — none embeds itself in an iframe; an app that does needs
# its own middleware with customFrameOptionsValue: SAMEORIGIN.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: traefik
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
