---
# Per-namespace wildcard cert for the connect.esweiss.com IngressRoute: Traefik
# reads TLS Secrets only from the IngressRoute's own namespace, so every
# namespace serving an esweiss.com host needs its own Certificate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: esweiss-com-wildcard
  namespace: external-secrets
spec:
  secretName: esweiss-com-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.esweiss.com"
  dnsNames:
    - "*.esweiss.com"
    - esweiss.com
  # Staggered renewBefore leg; the canonical stagger note (all three legs +
  # rationale) lives in configs/wildcard-certificates.yaml.
  renewBefore: 600h   # 25 days (staggered)
