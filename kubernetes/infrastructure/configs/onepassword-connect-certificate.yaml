---
# Per-namespace wildcard cert for the connect.esweiss.com IngressRoute.
# Each namespace that uses an esweiss.com hostname needs its own
# Certificate (cert-manager produces a Secret in the namespace where the
# Certificate lives; Traefik only reads Secrets from the IngressRoute's
# own namespace). Same pattern as kubernetes/apps/download-clients/
# certificate.yaml and kubernetes/infrastructure/observability/ingress/
# certificate.yaml.
#
# Lives in configs/ alongside the cluster-issuer.yaml ClusterIssuer it
# references and the onepassword-connect-ingress.yaml IngressRoute that
# consumes the resulting Secret.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: esweiss-com-wildcard
  namespace: external-secrets
spec:
  secretName: esweiss-com-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.esweiss.com"
  dnsNames:
    - "*.esweiss.com"
    - esweiss.com
  # Staggered renewBefore leg; the canonical stagger note (all three legs +
  # rationale) lives in configs/wildcard-certificates.yaml.
  renewBefore: 600h   # 25 days (staggered)
