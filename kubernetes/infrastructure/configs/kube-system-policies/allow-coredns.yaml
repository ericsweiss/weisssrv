---
# CoreDNS ingress, the one allow a kube-system default-deny can break
# cluster-wide. Three peer shapes on one rule: all namespaces, the pod CIDR,
# and the LAN (docs/29). ipBlock literals are a documented placeholder exemption.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-coredns-ingress
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  policyTypes:
    - Ingress
  ingress:
    # Cluster DNS (container ports `dns` 53/UDP and `dns-tcp` 53/TCP).
    - from:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 10.42.0.0/16
        - ipBlock:
            cidr: 10.0.10.0/24
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Prometheus scrape of the `metrics` port via the chart-rendered coredns
    # ServiceMonitor. Chart-rendered monitors are outside the flux:lint corpus,
    # so this allow is pinned by scripts/test_check_default_deny_coverage.py.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9153
