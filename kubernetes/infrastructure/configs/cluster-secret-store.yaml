---
# ClusterSecretStore backed by 1Password Connect Server.
# Connect runs in-cluster (external-secrets namespace) and serves secrets
# from a local encrypted cache — no cloud API calls for reads.
#
# Bootstrap secrets (one-time, manually created):
#   op-credentials            — 1password-credentials.json (external-secrets ns)
#   onepassword-connect-token — Connect access token (external-secrets ns)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-homelab
spec:
  # A ClusterSecretStore with no conditions is referenceable from EVERY
  # namespace, so any principal that can create an ExternalSecret anywhere can
  # mint any item in the Homelab vault. That is the whole vault, not a scoped
  # subset — and the tenant model binds each tenant's Flux SA to `admin` plus
  # tenant-crd-editor, both of which grant externalsecrets:create. Conditions are
  # ESO's native fix and must be in place BEFORE the first tenant onboards.
  #
  # An explicit name list, not a namespaceSelector label: it lands atomically in
  # one file, granting vault access stays a platform-side edit no tenant repo can
  # self-serve, and scripts/check-secretstore-scope.py fails flux:lint if an
  # ExternalSecret appears in a namespace that is not listed.
  conditions:
    - namespaces:
        # Platform (cert-manager/cloudflare-ddns/external-dns receive the
        # cloudflare-api-token ClusterExternalSecret fan-out).
        - cert-manager
        - cloudflare-ddns
        - external-dns
        - observability
        - tailscale
        # Apps.
        - authentik
        - downloads
        - gitlab-agent
        - gitlab-runner
        - gitlab-runner-privileged
        - hermes
        - homarr
        - recipes
        - registry-cache
        - wg-easy
  provider:
    onepassword:
      # Plaintext HTTP on the ClusterIP, deliberately: cross-node pod traffic is
      # wireguard-encrypted by flannel, and HTTPS here would make the
      # secret-fetch path depend on cert-manager/Traefik being up first.
      connectHost: http://onepassword-connect.external-secrets.svc.cluster.local:8080
      vaults:
        Homelab: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-connect-token
            namespace: external-secrets
            key: token
