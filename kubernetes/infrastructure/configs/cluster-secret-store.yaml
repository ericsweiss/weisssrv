---
# ClusterSecretStore backed by the in-cluster 1Password Connect Server, which
# serves reads from a local encrypted cache. Its bootstrap Secrets
# (op-credentials, onepassword-connect-token) are hand-created in docs/15.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-homelab
spec:
  # CRITICAL: conditions scope which namespaces may reference this store, not
  # which items they may read — every listed namespace can mint any Homelab
  # item (docs/16). The explicit name list lets
  # scripts/check-secretstore-scope.py fail flux:lint on an unlisted namespace.
  conditions:
    - namespaces:
        # Platform (cert-manager/cloudflare-ddns/external-dns receive the
        # cloudflare-api-token ClusterExternalSecret fan-out).
        - cert-manager
        # Runner S3 cache: garage's own runtime secrets (kubernetes/apps/ci-cache).
        - ci-cache
        - cloudflare-ddns
        - external-dns
        - observability
        - tailscale
        # Apps.
        - authentik
        - downloads
        - gitlab-agent
        - gitlab-runner
        - gitlab-runner-privileged
        - hermes
        - homarr
        - recipes
        - registry-cache
        - wg-easy
  provider:
    onepassword:
      # Plaintext HTTP on the ClusterIP: flannel wireguard-encrypts cross-node
      # pod traffic, and HTTPS would make the secret-fetch path depend on
      # cert-manager and Traefik being up first.
      connectHost: http://onepassword-connect.external-secrets.svc.cluster.local:8080
      vaults:
        "Homelab": 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-connect-token
            namespace: external-secrets
            key: token
