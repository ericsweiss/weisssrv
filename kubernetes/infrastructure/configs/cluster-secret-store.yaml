---
# ClusterSecretStore backed by 1Password Connect Server.
# Connect runs in-cluster (external-secrets namespace) and serves secrets
# from a local encrypted cache — no cloud API calls for reads.
#
# Bootstrap secrets (one-time, manually created):
#   op-credentials            — 1password-credentials.json (external-secrets ns)
#   onepassword-connect-token — Connect access token (external-secrets ns)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-homelab
spec:
  # A ClusterSecretStore with no conditions is referenceable from EVERY
  # namespace, so any principal that can create an ExternalSecret anywhere can
  # mint any item in the Homelab vault. That is the whole vault, not a scoped
  # subset — and the tenant model binds each tenant's Flux SA to `admin` plus
  # tenant-crd-editor, both of which grant externalsecrets:create. Conditions are
  # ESO's native fix and must be in place BEFORE the first tenant onboards.
  #
  # An explicit name list rather than a namespaceSelector label: it lands
  # atomically in one file (a label would be applied by a later Flux stage than
  # this one, leaving a window where the store rejects its own consumers), it
  # makes granting vault access a deliberate platform-side edit that a tenant
  # repo cannot self-serve, and scripts/check-secretstore-scope.py keeps it in
  # lockstep with the ExternalSecrets in the tree (task flux:lint fails if an app
  # adds an ExternalSecret whose namespace is not listed here).
  conditions:
    - namespaces:
        # Platform (cert-manager/cloudflare-ddns/external-dns receive the
        # cloudflare-api-token ClusterExternalSecret fan-out).
        - cert-manager
        - cloudflare-ddns
        - external-dns
        - observability
        - tailscale
        # Apps.
        - authentik
        - downloads
        - gitlab-agent
        - gitlab-runner
        - gitlab-runner-privileged
        - hermes
        - homarr
        - recipes
        - registry-cache
        - wg-easy
  provider:
    onepassword:
      # Plaintext HTTP on the in-cluster ClusterIP is a conscious tradeoff:
      # cross-node pod traffic is wireguard-encrypted by flannel, and a
      # same-node ESO->Connect hop never leaves the host kernel. Switching to
      # https would add a bootstrap dependency — the secret-fetch path must stay
      # reachable before cert-manager/Traefik are up — so this path stays HTTP.
      # (The cert-manager Certificate fronts only the external
      # connect.esweiss.com ingress, not this ClusterIP path.)
      connectHost: http://onepassword-connect.external-secrets.svc.cluster.local:8080
      vaults:
        Homelab: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-connect-token
            namespace: external-secrets
            key: token
