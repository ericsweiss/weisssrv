---
# ClusterSecretStore backed by the `weisssrv` 1Password service account.
# Scope: Homelab vault only. All ExternalSecrets in this cluster reference this store.
#
# The auth secret `onepassword-sdk-token` in the external-secrets namespace is a
# one-time bootstrap artifact created by `task flux:bootstrap-onepassword`. It is
# not managed by Flux (would be a chicken-and-egg), but is the single manually-
# created Secret in the whole cluster.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-homelab
spec:
  provider:
    onepasswordSDK:
      vault: Homelab
      auth:
        serviceAccountSecretRef:
          name: onepassword-sdk-token
          namespace: external-secrets
          key: token
