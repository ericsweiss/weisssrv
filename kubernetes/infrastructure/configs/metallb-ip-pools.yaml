---
# MetalLB pools, one pinned /32 each; addresses come from sources/cluster-config.yaml.
# autoAssign:false — only a Service naming the address via metallb.io/loadBalancerIPs
# gets it, so an unaddressed LoadBalancer can never take a pinned VIP.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: public-pool
  namespace: metallb-system
spec:
  autoAssign: false
  addresses:
    - ${cluster_metallb_public_vip}/32
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: internal-pool
  namespace: metallb-system
spec:
  autoAssign: false
  addresses:
    - ${cluster_metallb_internal_vip}/32
---
# wg-easy WireGuard UDP endpoint in its own pool, kept out of the gateway's DHCP
# scope by terraform/unifi/networks.tf (unifi-drift-plan catches a UI widening).
# A colliding lease is invisible except as EndpointDown. docs/38, docs/46.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: vpn-pool
  namespace: metallb-system
spec:
  autoAssign: false
  addresses:
    - ${cluster_wg_easy_vip}/32
---
# Syslog pool: the alloy-syslog receiver's LoadBalancer VIP on its own /32, so
# the gateway's remote-syslog target is independent of the ingress VIPs. LAN-only,
# claimed via metallb.io/loadBalancerIPs on the alloy-syslog Service.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: syslog-pool
  namespace: metallb-system
spec:
  autoAssign: false
  addresses:
    - ${cluster_syslog_vip}/32
---
# ARP announcement. No interface restrictions: MetalLB auto-filters CNI/virtual
# interfaces, and an explicit list would break nodes whose NIC is not ens18.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - public-pool
    - internal-pool
    - vpn-pool
    - syslog-pool
