---
# MetalLB IP Address Pools for esweiss.com homelab.
# Public pool: 192.168.0.100 — publicly accessible services (Traefik ingress).
# Internal pool: 192.168.0.101 — internal-only services.
# autoAssign:false — each pool is a single /32 claimed explicitly via
# metallb.io/loadBalancerIPs on the Traefik Services. Keep MetalLB from ever
# auto-handing these pinned VIPs to another LoadBalancer that omits an address;
# explicit requesters still get them.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: public-pool
  namespace: metallb-system
spec:
  autoAssign: false
  addresses:
    - 192.168.0.100/32
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: internal-pool
  namespace: metallb-system
spec:
  autoAssign: false
  addresses:
    - 192.168.0.101/32
---
# VPN pool: 192.168.0.99 — the wg-easy WireGuard UDP endpoint, kept in its own
# /32 pool so the public/internal ingress semantics stay clean.
# .99 sits inside the router's DHCP range and must stay excluded from it
# (uncoded operator step, docs/38): a dropped exclusion lets a workstation lease
# collide with this internet-facing endpoint, visible only as EndpointDown.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: vpn-pool
  namespace: metallb-system
spec:
  autoAssign: false
  addresses:
    - 192.168.0.99/32
---
# ARP announcement. No interface restrictions: MetalLB auto-filters CNI/virtual
# interfaces, and an explicit list would break nodes whose NIC is not ens18.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - public-pool
    - internal-pool
    - vpn-pool
