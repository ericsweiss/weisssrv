---
# Cloudflare DDNS: every 5 minutes, point the four WAN A records
# (ericsweiss.com, direct., git., vpn.) at the current public IPv4.
# The program is cloudflare-ddns.py in this directory, mounted from the
# configMapGenerator in kustomization.yaml; unit tests in scripts/.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudflare-ddns
  namespace: cloudflare-ddns
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # Don't start new job if previous is still running
  jobTemplate:
    spec:
      # Jobs timeout after 5 minutes (should complete in seconds)
      activeDeadlineSeconds: 300
      # Automatically delete completed/failed jobs after 1 hour
      ttlSecondsAfterFinished: 3600
      # Default backoffLimit is 6, which is far too many retries for a 5-min
      # CronJob — a transient Cloudflare API outage would quickly queue 6
      # failing pods. Two retries gives API blips a chance to recover while
      # keeping the failure visible in the next scheduled run.
      backoffLimit: 2
      template:
        spec:
          # No hostNetwork — outbound egress only to public 443 (IP-detection
          # providers ipify/icanhazip/checkip + api.cloudflare.com); the egress
          # NetworkPolicy denies RFC1918.
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: ddns-update
            # Use python:3-slim (Debian) for reliable DNS resolution. Alpine/musl has issues
            # with getaddrinfo() in Kubernetes environments (EAI_NONAME errors).
            # Pinned to specific SHA digest for reproducibility and security
            image: python:3.14-slim@sha256:b877e50bd90de10af8d82c57a022fc2e0dc731c5320d762a27986facfc3355c1
            command:
            - python3
            - /opt/ddns/cloudflare-ddns.py
            env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: api-token
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            volumeMounts:
            - name: script
              mountPath: /opt/ddns
              readOnly: true
          volumes:
          - name: script
            configMap:
              # kustomize rewrites this to the hashed generator name, so a
              # script edit rolls a new ConfigMap instead of mutating in place.
              name: cloudflare-ddns-script
              defaultMode: 0555
