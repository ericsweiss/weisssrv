---
# Cloudflare DDNS: every 5 minutes, point the four WAN A records (ericsweiss.com,
# direct., git., vpn.) at the current public IPv4. The program is cloudflare-ddns.py
# here, mounted by kustomization.yaml's configMapGenerator; tests in scripts/.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudflare-ddns
  namespace: cloudflare-ddns
spec:
  schedule: "*/5 * * * *"
  # Bounds the missed-schedule lookback, so a long control-plane outage cannot
  # wedge scheduling on the 100-missed-starts limit.
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # Bounded well above the few seconds a run takes.
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      # Two retries, not the default 6: a Cloudflare API outage would otherwise
      # queue six failing pods every 5 minutes.
      backoffLimit: 2
      template:
        spec:
          # No hostNetwork — outbound egress only to public 443 (IP-detection
          # providers ipify/icanhazip/checkip + api.cloudflare.com); the egress
          # NetworkPolicy denies RFC1918.
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: ddns-update
            # Debian, not Alpine: musl's getaddrinfo() returns EAI_NONAME in
            # this cluster. Digest-pinned.
            image: python:3.14-slim@sha256:b877e50bd90de10af8d82c57a022fc2e0dc731c5320d762a27986facfc3355c1
            command:
            - python3
            - /opt/ddns/cloudflare-ddns.py
            env:
            # The program's whole configuration: it reads no site data of its own.
            - name: DDNS_ZONE
              value: "${cluster_external_domain}"
            - name: DDNS_RECORDS
              value: "${cluster_ddns_records}"
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: api-token
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            volumeMounts:
            - name: script
              mountPath: /opt/ddns
              readOnly: true
          volumes:
          - name: script
            configMap:
              # kustomize rewrites this to the hashed generator name, so a
              # script edit rolls a new ConfigMap instead of mutating in place.
              name: cloudflare-ddns-script
              defaultMode: 0555
