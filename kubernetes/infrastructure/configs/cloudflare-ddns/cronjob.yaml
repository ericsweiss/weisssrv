---
# Cloudflare DDNS using direct API calls
# Updates A records with current public IP:
# - ericsweiss.com (proxied) - main domain through Cloudflare
# - direct.ericsweiss.com (not proxied) - for services needing direct TLS (GitLab Pages wildcard)
# - git.ericsweiss.com (not proxied) - GitLab web + SSH (unified URL for both)
#
# Runs every 5 minutes to keep records pointing to the current public IP
#
# Uses python:3-slim (Debian) for reliable JSON parsing and DNS resolution.
# Alpine/musl has getaddrinfo() issues in Kubernetes. Previous versions used
# curlimages/curl with grep/sed which was brittle when response shapes changed.
#
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudflare-ddns
  namespace: cloudflare-ddns
spec:
  # Run every 5 minutes
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # Don't start new job if previous is still running
  jobTemplate:
    spec:
      # Jobs timeout after 5 minutes (should complete in seconds)
      activeDeadlineSeconds: 300
      # Automatically delete completed/failed jobs after 1 hour
      ttlSecondsAfterFinished: 3600
      # Default backoffLimit is 6, which is far too many retries for a 5-min
      # CronJob — a transient Cloudflare API outage would quickly queue 6
      # failing pods. Two retries gives API blips a chance to recover while
      # keeping the failure visible in the next scheduled run.
      backoffLimit: 2
      template:
        spec:
          # NOTE: hostNetwork removed - not required for making outbound API calls
          # The job only needs egress to api.ipify.org and api.cloudflare.com
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: ddns-update
            # Use python:3-slim (Debian) for reliable DNS resolution. Alpine/musl has issues
            # with getaddrinfo() in Kubernetes environments (EAI_NONAME errors).
            # Pinned to specific SHA digest for reproducibility and security
            image: python:3.13-slim@sha256:8bc60ca09afaa8ea0d6d1220bde073bacfedd66a4bf8129cbdc8ef0e16c8a952
            command:
            - python3
            - -c
            - |
              import json
              import os
              import sys
              import urllib.request
              import urllib.error

              CF_API_TOKEN = os.environ.get('CF_API_TOKEN')
              if not CF_API_TOKEN:
                  print("ERROR: CF_API_TOKEN not set")
                  sys.exit(1)

              def api_request(url, method='GET', data=None):
                  """Make a Cloudflare API request and return parsed JSON."""
                  headers = {
                      'Authorization': f'Bearer {CF_API_TOKEN}',
                      'Content-Type': 'application/json'
                  }
                  body = json.dumps(data).encode() if data else None
                  req = urllib.request.Request(url, data=body, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          return json.loads(resp.read().decode())
                  except urllib.error.HTTPError as e:
                      # Include method + URL so the failure is greppable in logs.
                      # Cloudflare returns structured JSON errors; capture the body.
                      try:
                          body_txt = e.read().decode(errors='replace')
                      except Exception:
                          body_txt = '<unreadable>'
                      print(f"ERROR: HTTP {e.code} {e.reason} on {method} {url}: {body_txt}", file=sys.stderr)
                      return None
                  except urllib.error.URLError as e:
                      print(f"ERROR: network error on {method} {url}: {e.reason}", file=sys.stderr)
                      return None
                  except Exception as e:
                      print(f"ERROR: unexpected {type(e).__name__} on {method} {url}: {e}", file=sys.stderr)
                      return None

              def get_public_ip():
                  """Get current public IP address."""
                  try:
                      with urllib.request.urlopen('https://api.ipify.org', timeout=10) as resp:
                          return resp.read().decode().strip()
                  except Exception as e:
                      print(f"ERROR: Failed to get public IP: {e}")
                      return None

              def update_record(zone_id, record_name, current_ip, proxied):
                  """Update or create a DNS A record."""
                  print(f"\n=== Processing {record_name} (proxied={proxied}) ===")

                  # Get existing record
                  url = f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records?type=A&name={record_name}"
                  data = api_request(url)
                  if not data or not data.get('success'):
                      print(f"ERROR: Failed to query existing record")
                      return False

                  records = data.get('result', [])
                  existing_record = records[0] if records else None
                  existing_ip = existing_record.get('content') if existing_record else None
                  record_id = existing_record.get('id') if existing_record else None

                  print(f"Existing IP: {existing_ip or 'none'}")

                  if current_ip == existing_ip:
                      print("IP unchanged, skipping")
                      return True

                  print("Updating record...")
                  record_data = {
                      'type': 'A',
                      'name': record_name,
                      'content': current_ip,
                      'ttl': 1,
                      'proxied': proxied
                  }

                  if record_id:
                      # Update existing record
                      url = f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records/{record_id}"
                      result = api_request(url, method='PUT', data=record_data)
                  else:
                      # Create new record
                      url = f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records"
                      result = api_request(url, method='POST', data=record_data)

                  if result and result.get('success'):
                      print("Updated successfully" if record_id else "Created successfully")
                      return True
                  else:
                      print(f"ERROR: {'Update' if record_id else 'Create'} failed")
                      return False

              # Main execution
              current_ip = get_public_ip()
              if not current_ip:
                  sys.exit(1)
              print(f"Current public IP: {current_ip}")

              # Get zone ID for ericsweiss.com
              zone_data = api_request("https://api.cloudflare.com/client/v4/zones?name=ericsweiss.com")
              if not zone_data or not zone_data.get('success'):
                  print("ERROR: Failed to get zone ID")
                  sys.exit(1)

              zones = zone_data.get('result', [])
              if not zones:
                  print("ERROR: Zone not found")
                  sys.exit(1)

              zone_id = zones[0].get('id')
              print(f"Zone ID: {zone_id}")

              # Update records
              success = True
              success = update_record(zone_id, "ericsweiss.com", current_ip, True) and success
              success = update_record(zone_id, "direct.ericsweiss.com", current_ip, False) and success
              success = update_record(zone_id, "git.ericsweiss.com", current_ip, False) and success

              print("\nDDNS update complete")
              sys.exit(0 if success else 1)
            env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: api-token
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 50m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
