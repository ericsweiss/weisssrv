---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Single-namespace dir: set the namespace so the shared NetworkPolicy components
# (added below) land in cloudflare-ddns.
namespace: cloudflare-ddns
resources:
  - namespace.yaml
  - cronjob.yaml

# The CronJob calls api.cloudflare.com plus a public IPv4-detection provider
# (api.ipify.org, with ipv4.icanhazip.com / checkip.amazonaws.com as fallbacks),
# all public TCP/443 — so kube-dns + public HTTPS and nothing else. No LAN
# egress: the public component's except-list is what denies it.
components:
  - ../../../components/netpol-baseline
  - ../../../components/netpol-egress-dns
  - ../../../components/netpol-egress-public

# The CronJob's program. It lives beside this kustomization because kustomize
# refuses generator sources outside the kustomization root; its unit tests are
# scripts/test_cloudflare_ddns.py.
configMapGenerator:
  - name: cloudflare-ddns-script
    files:
      - cloudflare-ddns.py
