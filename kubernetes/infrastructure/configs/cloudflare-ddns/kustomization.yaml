---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Single-namespace dir: set the namespace so the shared default-deny-ingress
# component (added below) lands in cloudflare-ddns.
namespace: cloudflare-ddns
resources:
  - namespace.yaml
  - cronjob.yaml
  - networkpolicy.yaml

components:
  - ../../../components/netpol-baseline

# The CronJob's program. It lives beside this kustomization because kustomize
# refuses generator sources outside the kustomization root; its unit tests are
# scripts/test_cloudflare_ddns.py.
configMapGenerator:
  - name: cloudflare-ddns-script
    files:
      - cloudflare-ddns.py
