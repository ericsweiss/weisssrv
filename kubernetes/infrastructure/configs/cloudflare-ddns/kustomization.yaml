---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudflare-ddns
resources:
  - namespace.yaml
  - cronjob.yaml

# The CronJob calls api.cloudflare.com and a public IPv4-detection provider over
# TCP/443, so egress is kube-dns plus public HTTPS and nothing else. LAN egress
# is denied by the public component's except-list.
components:
  - ../../../components/netpol-baseline
  - ../../../components/netpol-egress-dns
  - ../../../components/netpol-egress-public

# The CronJob's program. It lives beside this kustomization because kustomize
# refuses generator sources outside the kustomization root; its unit tests are
# scripts/test_cloudflare_ddns.py.
configMapGenerator:
  - name: cloudflare-ddns-script
    files:
      - cloudflare-ddns.py
