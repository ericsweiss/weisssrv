---
# The `nvidia` RuntimeClass maps to the containerd runtime handler k3s
# auto-generates when it detects nvidia-container-runtime on the GPU node's PATH
# (installed by the k3s role's tasks/gpu.yml). Cluster-scoped, no CRD dependency
# — colocated with the device plugin. Pods that need the GPU (the device-plugin
# DaemonSet, the Hindsight llama container) set runtimeClassName: nvidia so the
# NVIDIA runtime injects the driver + devices.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
