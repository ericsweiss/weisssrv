---
# NVIDIA k8s device plugin — a DaemonSet that discovers the GPU on the node and
# advertises it to the kubelet as the nvidia.com/gpu extended resource. With
# time-slicing (values.config below) the single physical GPU is advertised as 4
# shareable units, so the GPU is a general cluster resource: any pod can request
# `nvidia.com/gpu: 1` (a slice) — Hindsight's llama container is just one of them.
# Pinned to the GPU node by nodeSelector on the esweiss.com/gpu=nvidia label
# (hosts.yml VM 207). It exports no metrics — DCGM does that
# (observability/exporters/dcgm-exporter).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: nvidia-device-plugin
spec:
  interval: 30m
  releaseName: nvidia-device-plugin
  chart:
    spec:
      chart: nvidia-device-plugin
      version: "${helm_chart_versions_nvidia_device_plugin}"
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # Run the plugin pod under the nvidia runtime so it can talk to the driver.
    # The RuntimeClass is applied alongside this release (runtimeclass.yaml).
    runtimeClassName: nvidia
    # Only the labelled GPU node runs the plugin (single-GPU cluster). Without a
    # selector the DaemonSet lands on every node and the plugin just exits where
    # there is no GPU — pinning keeps it tidy.
    nodeSelector:
      esweiss.com/gpu: nvidia
    # Tolerate the node's soft compute taint (PreferNoSchedule) so the plugin is
    # not penalised there, plus the conventional GPU taint the chart expects.
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: esweiss.com/compute
        operator: Equal
        value: "true"
        effect: PreferNoSchedule
    # Clear the chart's default GPU-autodetect nodeAffinity. Out of the box the
    # chart REQUIRES one of feature.node.kubernetes.io/pci-10de.present /
    # cpu-model.vendor_id=NVIDIA / nvidia.com/gpu.present — labels produced by
    # Node Feature Discovery + GPU Feature Discovery. This cluster labels the GPU
    # node MANUALLY (esweiss.com/gpu=nvidia, above) and runs neither NFD nor GFD,
    # so that required affinity matches nothing and the DaemonSet sits at
    # DESIRED=0 (the plugin never schedules, the node never advertises
    # nvidia.com/gpu). NULL the key — not `{}`: Helm deep-merges maps, so an empty
    # map leaves the chart default in place (verified via `helm template`); a null
    # removes the key during values coalescing. The nodeSelector then governs.
    affinity:
      nodeAffinity: null
    # Memory limit only — no CPU limit (repo-wide policy, docs/33). Small, but
    # not as small as first sized: the 7d working set is ~49Mi, which was 78% of
    # the old 64Mi limit and above the old 32Mi request. No VPA can right-size
    # this (it is the DaemonSet that advertises the GPU resource, so an eviction
    # would deschedule every GPU pod), so the numbers are hand-set against
    # measurement: request at the observed working set, limit at 2x.
    #
    # This key reaches the *-ctr containers ONLY (daemonset-device-plugin.yml
    # renders `resources` under nvidia-device-plugin-ctr; the config-manager
    # sidecar it adds whenever config.map is set is hard-coded with no resources
    # block and no values key). The sidecar is reserved by the postRenderer at
    # the bottom of this file — without it the pod requests 64Mi while its 7d
    # pod-cgroup peak is 94Mi.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
    # Time-slicing: advertise the one physical GPU as 4 shareable replicas so
    # multiple pods can co-schedule on it (the node reports nvidia.com/gpu: 4).
    # The chart materialises config.map.<name> into a ConfigMap and a
    # config-manager selects it; config.default names the entry to use on a node
    # with no `nvidia.com/device-plugin.config` label (ours has none), so
    # `default: any` -> `map.any` is required, not optional.
    #
    # NOTE: time-slicing shares COMPUTE, not VRAM — the card's 6 GB is shared
    # across co-scheduled pods, which must fit together. Hindsight's Gemma-4B-Q4
    # uses ~2.5 GB, leaving headroom for another small workload. `replicas` is the
    # concurrency ceiling, not a memory guarantee.
    config:
      default: any
      map:
        any: |-
          version: v1
          flags:
            migStrategy: none
          sharing:
            timeSlicing:
              resources:
                - name: nvidia.com/gpu
                  replicas: 4
  # Reserve the config-manager sidecar the chart injects alongside the plugin
  # (it exists because config.map is set, and watches the node's
  # nvidia.com/device-plugin.config label to hot-swap the sharing config). The
  # chart offers no values key for its resources, so the live container ran with
  # none at all: the scheduler saw a 64Mi pod against a 94Mi 7d pod-cgroup peak.
  # Sized by the same measured method as the plugin container — request at the
  # container's own 7d working-set peak (15.5Mi), limit at 2x. Strategic-merge
  # (containers are name-keyed), so it survives any change in container ORDER,
  # unlike a JSON-pointer index patch.
  postRenderers:
    - kustomize:
        patches:
          # target.name is a FULL-match regex in kustomize, so this hits only the
          # plugin DaemonSet and not the nvidia-device-plugin-mps-control-daemon
          # one the chart renders beside it (verified by building the patch
          # against `helm template` output: the mps DaemonSet comes out
          # unchanged, no appended container).
          - target:
              group: apps
              version: v1
              kind: DaemonSet
              name: nvidia-device-plugin
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: nvidia-device-plugin
              spec:
                template:
                  spec:
                    containers:
                      - name: nvidia-device-plugin-sidecar
                        resources:
                          requests:
                            cpu: 10m
                            memory: 16Mi
                          limits:
                            memory: 32Mi
