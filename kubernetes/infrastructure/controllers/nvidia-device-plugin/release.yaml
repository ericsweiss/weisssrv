---
# NVIDIA k8s device plugin: a DaemonSet advertising the node's GPU to the
# kubelet as nvidia.com/gpu, time-sliced into 4 shareable units any pod may
# request. Metrics come from dcgm-exporter, not from here (docs/43).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: nvidia-device-plugin
spec:
  interval: 30m
  releaseName: nvidia-device-plugin
  # Revert out-of-band edits (see traefik/release.yaml for the repo rule). Safe:
  # the chart renders no webhook and no HPA-managed replica count.
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: nvidia-device-plugin
      version: "${helm_chart_versions_nvidia_device_plugin}"
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # Run the plugin pod under the nvidia runtime so it can talk to the driver.
    # The RuntimeClass is applied alongside this release (runtimeclass.yaml).
    runtimeClassName: nvidia
    # Only the labelled GPU node runs the plugin (single-GPU cluster).
    nodeSelector:
      ${cluster_node_label_domain}/gpu: nvidia
    # Tolerate the node's soft compute taint (PreferNoSchedule) so the plugin is
    # not penalised there, plus the conventional GPU taint the chart expects.
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: ${cluster_node_label_domain}/compute
        operator: Equal
        value: "true"
        effect: PreferNoSchedule
    # Clear the chart's GPU-autodetect nodeAffinity: it wants Feature Discovery
    # labels this cluster lacks, so the DaemonSet would sit at DESIRED=0. It
    # must be `null`; Helm deep-merges maps, so `{}` keeps the chart default.
    affinity:
      nodeAffinity: null
    # Memory limit only, no CPU limit (docs/33). Hand-sized rather than
    # VPA-managed, because evicting this DaemonSet deschedules every GPU pod.
    # The key reaches the plugin container only; the sidecar is sized below.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
    # Advertise the one physical GPU as 4 shareable replicas. config.default
    # names the map entry for a node with no device-plugin.config label. Time
    # slicing shares compute, not VRAM: co-scheduled pods share the card's 6 GB.
    config:
      default: any
      map:
        any: |-
          version: v1
          flags:
            migStrategy: none
          sharing:
            timeSlicing:
              resources:
                - name: nvidia.com/gpu
                  replicas: 4
  # Size the config-manager sidecar the chart injects whenever config.map is
  # set; the chart exposes no values key for its resources. Strategic-merge, so
  # it survives a change in container order.
  postRenderers:
    - kustomize:
        patches:
          # target.name is a FULL-match regex, so this hits only the plugin
          # DaemonSet, not the mps-control-daemon one rendered beside it.
          - target:
              group: apps
              version: v1
              kind: DaemonSet
              name: nvidia-device-plugin
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: nvidia-device-plugin
              spec:
                template:
                  spec:
                    containers:
                      - name: nvidia-device-plugin-sidecar
                        resources:
                          requests:
                            cpu: 10m
                            memory: 16Mi
                          limits:
                            memory: 32Mi
