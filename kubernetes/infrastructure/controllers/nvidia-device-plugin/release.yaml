---
# NVIDIA k8s device plugin — a DaemonSet that discovers the GPU on the node and
# advertises it to the kubelet as the nvidia.com/gpu extended resource. With
# time-slicing (values.config below) the single physical GPU is advertised as 4
# shareable units, so the GPU is a general cluster resource: any pod can request
# `nvidia.com/gpu: 1` (a slice) — Hindsight's llama container is just one of them.
# Pinned to the GPU node by nodeSelector on the esweiss.com/gpu=nvidia label
# (hosts.yml VM 207). It exports no metrics — DCGM does that
# (observability/exporters/dcgm-exporter).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: nvidia-device-plugin
spec:
  interval: 30m
  releaseName: nvidia-device-plugin
  # Revert out-of-band edits (see traefik/release.yaml for the repo rule). Safe:
  # the chart renders no webhook and no HPA-managed replica count.
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: nvidia-device-plugin
      version: "${helm_chart_versions_nvidia_device_plugin}"
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # Run the plugin pod under the nvidia runtime so it can talk to the driver.
    # The RuntimeClass is applied alongside this release (runtimeclass.yaml).
    runtimeClassName: nvidia
    # Only the labelled GPU node runs the plugin (single-GPU cluster).
    nodeSelector:
      esweiss.com/gpu: nvidia
    # Tolerate the node's soft compute taint (PreferNoSchedule) so the plugin is
    # not penalised there, plus the conventional GPU taint the chart expects.
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: esweiss.com/compute
        operator: Equal
        value: "true"
        effect: PreferNoSchedule
    # Clear the chart's GPU-autodetect nodeAffinity: it requires Node/GPU Feature
    # Discovery labels this cluster does not run, so it matches nothing and the
    # DaemonSet sits at DESIRED=0. Must be `null`, NOT `{}` — Helm deep-merges
    # maps, so an empty map leaves the chart default in place. nodeSelector above
    # is then what governs placement.
    affinity:
      nodeAffinity: null
    # Memory limit only, no CPU limit (docs/33). Hand-sized against measurement
    # (request at the working set, limit at 2x) because no VPA may touch this:
    # evicting the DaemonSet that advertises nvidia.com/gpu would deschedule
    # every GPU pod. This key reaches the plugin container only — the sidecar is
    # sized by the postRenderer below.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
    # Advertise the one physical GPU as 4 shareable replicas. config.default
    # names the map entry used on a node with no
    # nvidia.com/device-plugin.config label, so `default: any` is required.
    #
    # Time-slicing shares COMPUTE, not VRAM: co-scheduled pods must fit together
    # in the card's 6 GB. `replicas` is a concurrency ceiling, not a guarantee.
    config:
      default: any
      map:
        any: |-
          version: v1
          flags:
            migStrategy: none
          sharing:
            timeSlicing:
              resources:
                - name: nvidia.com/gpu
                  replicas: 4
  # Size the config-manager sidecar the chart injects whenever config.map is set:
  # it exposes no values key for resources, so without this the pod under-requests
  # by the sidecar's whole footprint. Strategic-merge (containers are name-keyed),
  # so it survives any change in container ORDER, unlike a JSON-pointer index patch.
  postRenderers:
    - kustomize:
        patches:
          # target.name is a FULL-match regex, so this hits only the plugin
          # DaemonSet, not the mps-control-daemon one rendered beside it.
          - target:
              group: apps
              version: v1
              kind: DaemonSet
              name: nvidia-device-plugin
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: nvidia-device-plugin
              spec:
                template:
                  spec:
                    containers:
                      - name: nvidia-device-plugin-sidecar
                        resources:
                          requests:
                            cpu: 10m
                            memory: 16Mi
                          limits:
                            memory: 32Mi
