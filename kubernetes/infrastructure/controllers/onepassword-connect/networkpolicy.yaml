---
# Restrict ingress to Connect API (port 8080) to pods in this namespace only.
# ESO controller pods run in external-secrets and are the sole consumer.
# Kubelet health probes (liveness/readiness) originate from the host network
# and are not subject to NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app: onepassword-connect
  policyTypes:
    - Ingress
  ingress:
    # Same-namespace pods (ESO controller) speak to Connect directly.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    # Traefik fronts Connect at connect.esweiss.com (internal-only via
    # the lan-tailscale-strict middleware) so bare-metal Proxmox hosts can
    # fetch ZFS-encryption passphrases at boot. Only the API port (8080)
    # is exposed; the sync sidecar (8081) stays in-namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
