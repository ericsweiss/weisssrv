---
# Ingress to the Connect API is limited to pods in this namespace; the ESO
# controller is the sole in-cluster consumer. Kubelet probes come from the host
# network and are not subject to NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app: onepassword-connect
  policyTypes:
    - Ingress
  ingress:
    # Same-namespace pods (ESO controller) speak to Connect directly.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    # Traefik fronts Connect at connect.esweiss.com, internal-only, so Proxmox
    # hosts can fetch ZFS-encryption passphrases at boot. Only the API port is
    # exposed; the sync sidecar stays in-namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
