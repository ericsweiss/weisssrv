---
# 1Password Connect Server — self-hosted secret cache for ESO.
# connect-sync pulls vault data from 1Password cloud into an encrypted
# local cache. connect-api serves reads from cache on port 8080.
# Eliminates cloud API rate limiting for ExternalSecrets.
#
# Bootstrap secrets (one-time, manually created in external-secrets ns):
#   op-credentials            — 1password-credentials.json from `op connect server create`
#   onepassword-connect-token — access token from `op connect token create`
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  interval: 30m
  # Correct out-of-band edits to chart-rendered objects — see the rationale on
  # controllers/traefik/release.yaml. No webhooks here, but unlike Traefik this
  # chart DOES render .spec.replicas (connect.replicas: 2) while its own HPA
  # scales to 3, so that one path must be ignored or every reconcile would scale
  # the Deployment back down to the floor.
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
          name: onepassword-connect
  chart:
    spec:
      chart: connect
      version: "${helm_chart_versions_onepassword_connect}"
      sourceRef:
        kind: HelmRepository
        name: onepassword-connect
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    connect:
      # credentials_base64 intentionally empty — chart falls back to mounting
      # from the pre-existing op-credentials Secret (default credentialsName).
      credentials_base64: ""
      serviceType: ClusterIP
      # HA: 2 replicas spread across hosts so a single node drain (or upcoming
      # ZFS-encryption boot dependency on Connect) never takes the secret
      # backend offline. Companion PodDisruptionBudget (pdb.yaml, minAvailable:1)
      # protects against simultaneous voluntary disruption. replicas stays the
      # HPA floor so the chart's static count never flaps against the HPA.
      replicas: 2
      # Chart-native HPA: Connect is a stateless API proxy (connect-api +
      # connect-sync) that fronts every ESO secret fetch and bursts under
      # fan-out. avgMemoryUtilization: 0 disables the chart's memory metric so
      # this scales on CPU only — the onepassword-connect VPA
      # (configs/vpa/platform.yaml) is memory-only and a VPA/HPA pair must not
      # drive the same resource. max kept at 3 (tight-RAM hosts).
      hpa:
        enabled: true
        minReplicas: 2
        maxReplicas: 3
        avgCpuUtilization: 80
        avgMemoryUtilization: 0
      nodeSelector:
        esweiss.com/cpu: "modern"
      tolerations:
        - key: esweiss.com/nas
          operator: Exists
          effect: PreferNoSchedule
        - key: esweiss.com/compute
          operator: Exists
          effect: PreferNoSchedule
      # Anti-affinity is PREFERRED, not required: there are exactly 3
      # esweiss.com/cpu=modern nodes, so under a hard one-per-host rule the HPA
      # could never place its 3rd replica (maxReplicas:3), and during a node
      # drain even a 2nd replica could stay Pending. Preferred keeps replicas on
      # distinct hosts in steady state but lets them co-locate when a host is
      # down — trading a momentary loss of spread for schedulability during
      # maintenance (PDB minAvailable:1 still guards voluntary disruption).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: onepassword-connect
                topologyKey: kubernetes.io/hostname
      api:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
      sync:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
    operator:
      create: false
  # Connect (connect-api + connect-sync) never calls the Kubernetes API — it
  # serves ESO from its local encrypted cache — so it needs no ServiceAccount
  # token mounted. The connect chart (2.x) exposes no automount value, so patch
  # the rendered Deployment to drop the projected token.
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: onepassword-connect
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
