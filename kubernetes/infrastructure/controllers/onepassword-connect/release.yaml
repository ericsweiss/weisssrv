---
# 1Password Connect Server, the self-hosted secret cache ESO reads. connect-sync
# pulls vault data into an encrypted local cache and connect-api serves reads on
# port 8080. Its bootstrap Secrets are in docs/15-credential-rotation.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  interval: 30m
  # Revert out-of-band edits (repo rule in traefik/release.yaml). This chart
  # renders .spec.replicas while its own HPA scales past it, so that one path
  # must be ignored or every reconcile would scale back to the floor.
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
          name: onepassword-connect
  chart:
    spec:
      chart: connect
      version: "${helm_chart_versions_onepassword_connect}"
      sourceRef:
        kind: HelmRepository
        name: onepassword-connect
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    connect:
      # credentials_base64 intentionally empty — chart falls back to mounting
      # from the pre-existing op-credentials Secret (default credentialsName).
      credentials_base64: ""
      serviceType: ClusterIP
      # `platform` (sources/priorityclasses.yaml). Only the connect key is set:
      # operator.create is false below, so the operator pod never renders.
      priorityClassName: platform
      # HA: the ZFS-encryption boot path depends on Connect, so a single node
      # drain must not take it offline. Keep this equal to the HPA floor below,
      # or the chart's static count flaps against the HPA.
      replicas: 2
      # CPU-only autoscaling: avgMemoryUtilization 0 disables the chart's memory
      # metric, because the paired VPA (configs/vpa/platform.yaml) owns memory
      # and an HPA/VPA pair must never drive the same resource.
      hpa:
        enabled: true
        minReplicas: 2
        maxReplicas: 3
        avgCpuUtilization: 80
        avgMemoryUtilization: 0
      nodeSelector:
        ${cluster_node_label_domain}/cpu: "modern"
      tolerations:
        - key: ${cluster_node_label_domain}/nas
          operator: Exists
          effect: PreferNoSchedule
        - key: ${cluster_node_label_domain}/compute
          operator: Exists
          effect: PreferNoSchedule
      # PREFERRED, not required: with only 3 modern-CPU nodes a hard one-per-host
      # rule would leave the HPA's 3rd replica — and a 2nd during any drain —
      # Pending. PDB minAvailable:1 still guards voluntary disruption.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: onepassword-connect
                topologyKey: kubernetes.io/hostname
      # Hand-set limits, matched by the paired VPA's maxAllowed; that VPA is
      # RequestsOnly so nothing rewrites them. The ceiling is above the usual
      # peak+60% because Connect is on the ZFS-encryption boot path.
      api:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
      sync:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
    operator:
      create: false
  # Connect never calls the Kubernetes API, so it needs no ServiceAccount token.
  # The chart exposes no automount value, so drop the projected token here.
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: onepassword-connect
                # This chart renders an explicit metadata.namespace into its
                # manifests, so the patch must carry it too — a namespace-less
                # patch has the [noNs] identity and matches nothing.
                namespace: external-secrets
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
