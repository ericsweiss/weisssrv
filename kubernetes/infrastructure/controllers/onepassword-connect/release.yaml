---
# 1Password Connect Server — self-hosted secret cache for ESO.
# connect-sync pulls vault data from 1Password cloud into an encrypted
# local cache. connect-api serves reads from cache on port 8080.
# Eliminates cloud API rate limiting for ExternalSecrets.
#
# Bootstrap secrets (one-time, manually created in external-secrets ns):
#   op-credentials            — 1password-credentials.json from `op connect server create`
#   onepassword-connect-token — access token from `op connect token create`
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  interval: 30m
  chart:
    spec:
      chart: connect
      version: "${helm_chart_versions_onepassword_connect}"
      sourceRef:
        kind: HelmRepository
        name: onepassword-connect
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    connect:
      # credentials_base64 intentionally empty — chart falls back to mounting
      # from the pre-existing op-credentials Secret (default credentialsName).
      credentials_base64: ""
      serviceType: ClusterIP
      # HA: 2 replicas spread across hosts so a single node drain (or upcoming
      # ZFS-encryption boot dependency on Connect) never takes the secret
      # backend offline. Companion PodDisruptionBudget (pdb.yaml, minAvailable:1)
      # protects against simultaneous voluntary disruption. replicas stays the
      # HPA floor so the chart's static count never flaps against the HPA.
      replicas: 3
      # Chart-native HPA: Connect is a stateless API proxy (connect-api +
      # connect-sync) that fronts every ESO secret fetch and bursts under
      # fan-out. avgMemoryUtilization: 0 disables the chart's memory metric so
      # this scales on CPU only — the onepassword-connect VPA
      # (configs/vpa/platform.yaml) is memory-only and a VPA/HPA pair must not
      # drive the same resource. max kept at 3 (tight-RAM hosts).
      hpa:
        enabled: true
        # Floor pinned at 3 (= the 3 modern nodes) so the hard one-per-host
        # anti-affinity below always keeps 2 endpoints off pve-nas-01 — a
        # scale-down to 2 could strand both on a NAS+one-other pair (boot-order
        # review 2026-07). max stays 3; VPA (memory) handles vertical scaling.
        minReplicas: 3
        maxReplicas: 3
        avgCpuUtilization: 80
        avgMemoryUtilization: 0
      nodeSelector:
        esweiss.com/cpu: "modern"
      tolerations:
        - key: esweiss.com/nas
          operator: Exists
          effect: PreferNoSchedule
        - key: esweiss.com/compute
          operator: Exists
          effect: PreferNoSchedule
      # Anti-affinity is REQUIRED (one replica per modern node). pve-nas-01's
      # boot-time zfs-load-key fetches the pool passphrase from Connect, so if a
      # NAS reboot could take Connect down to zero off-NAS endpoints the encrypted
      # pools would fail to unlock (boot-order review 2026-07). 3 replicas across
      # exactly 3 esweiss.com/cpu=modern nodes fit one-per-host, so a NAS reboot
      # always leaves 2 endpoints on the other two nodes (laptop + prec). The
      # trade vs the old PREFERRED rule: while any single modern node is down
      # (drain/reboot) the 3rd replica stays Pending until it returns — intended,
      # since 2 surviving endpoints on distinct hosts beats a co-located pair a
      # single host loss could reduce to one. PDB minAvailable:1 still guards
      # voluntary disruption.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: onepassword-connect
              topologyKey: kubernetes.io/hostname
      api:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
      sync:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
    operator:
      create: false
  # Connect (connect-api + connect-sync) never calls the Kubernetes API — it
  # serves ESO from its local encrypted cache — so it needs no ServiceAccount
  # token mounted. The connect chart (2.x) exposes no automount value, so patch
  # the rendered Deployment to drop the projected token.
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: onepassword-connect
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
