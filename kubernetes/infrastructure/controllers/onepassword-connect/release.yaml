---
# 1Password Connect Server — self-hosted secret cache for ESO.
# connect-sync pulls vault data from 1Password cloud into an encrypted
# local cache. connect-api serves reads from cache on port 8080.
# Eliminates cloud API rate limiting for ExternalSecrets.
#
# Bootstrap secrets (one-time, manually created in external-secrets ns):
#   op-credentials            — 1password-credentials.json from `op connect server create`
#   onepassword-connect-token — access token from `op connect token create`
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  interval: 30m
  # Revert out-of-band edits (repo rule in traefik/release.yaml). This chart
  # renders .spec.replicas while its own HPA scales past it, so that one path
  # must be ignored or every reconcile would scale back to the floor.
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
          name: onepassword-connect
  chart:
    spec:
      chart: connect
      version: "${helm_chart_versions_onepassword_connect}"
      sourceRef:
        kind: HelmRepository
        name: onepassword-connect
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    connect:
      # credentials_base64 intentionally empty — chart falls back to mounting
      # from the pre-existing op-credentials Secret (default credentialsName).
      credentials_base64: ""
      serviceType: ClusterIP
      # HA: the ZFS-encryption boot path depends on Connect, so a single node
      # drain must not take it offline. Keep this equal to the HPA floor below,
      # or the chart's static count flaps against the HPA.
      replicas: 2
      # CPU-only autoscaling: avgMemoryUtilization 0 disables the chart's memory
      # metric, because the paired VPA (configs/vpa/platform.yaml) owns memory
      # and an HPA/VPA pair must never drive the same resource.
      hpa:
        enabled: true
        minReplicas: 2
        maxReplicas: 3
        avgCpuUtilization: 80
        avgMemoryUtilization: 0
      nodeSelector:
        esweiss.com/cpu: "modern"
      tolerations:
        - key: esweiss.com/nas
          operator: Exists
          effect: PreferNoSchedule
        - key: esweiss.com/compute
          operator: Exists
          effect: PreferNoSchedule
      # PREFERRED, not required: with only 3 modern-CPU nodes a hard one-per-host
      # rule would leave the HPA's 3rd replica — and a 2nd during any drain —
      # Pending. PDB minAvailable:1 still guards voluntary disruption.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: onepassword-connect
                topologyKey: kubernetes.io/hostname
      api:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
      sync:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
    operator:
      create: false
  # Connect never calls the Kubernetes API, so it needs no ServiceAccount token.
  # The chart exposes no automount value, so drop the projected token here.
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: onepassword-connect
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
