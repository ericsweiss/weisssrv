---
# Keep one Connect replica available during drains and rolling upgrades.
# Losing both stalls ESO refreshes and the ZFS-encryption key fetch through
# connect.esweiss.com.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: onepassword-connect
