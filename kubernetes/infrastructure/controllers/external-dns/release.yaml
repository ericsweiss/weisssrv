---
# external-dns HelmRelease, adopting the `external-dns` release in the
# external-dns namespace. The `cloudflare-api-token` Secret behind
# env.CF_API_TOKEN comes from infrastructure/configs/shared-cloudflare-secrets/.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 30m
  releaseName: external-dns
  # Correct out-of-band edits to chart-rendered objects — see the rationale on
  # controllers/traefik/release.yaml. Safe here: no webhooks, no HPA.
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: external-dns
      version: "${helm_chart_versions_external_dns}"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 12h
  install:
    # CRITICAL: disableWait prevents a bootstrap deadlock. The
    # cloudflare-api-token Secret is created by the configs stage, which depends
    # on controllers, so Helm --wait would block on pods that need that Secret.
    # Install only; upgrades run where the Secret already exists.
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # `platform` (sources/priorityclasses.yaml) — outrank apps and CI job pods.
    priorityClassName: platform

    provider:
      name: cloudflare

    # Orange-cloud the records: DDoS protection + origin-IP hiding.
    extraArgs:
      - --cloudflare-proxied
      # IngressRoutes here and in the app template annotate with the alpha
      # prefix; external-dns >= 0.22 defaults to external-dns.kubernetes.io/.
      - --annotation-prefix=external-dns.alpha.kubernetes.io/

    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token

    sources:
      - ingress
      - service
      - traefik-proxy  # Watch Traefik IngressRoute CRDs

    domainFilters:
      - ${cluster_external_domain}  # External domain managed by Cloudflare

    txtOwnerId: "k3s-external-dns"
    txtPrefix: "_external-dns."

    # CRITICAL: ericsweiss.com is shared with terraform/cloudflare and the
    # cloudflare-ddns CronJob. `policy: sync` is safe only because the txt
    # registry stamps every external-dns record with txtOwnerId, so records
    # without a matching owner TXT are never deleted. Keep record names
    # disjoint across the three owners (docs/08-dns.md).
    policy: sync

    registry: txt

    logLevel: info
    logFormat: json

    interval: 5m

    triggerLoopOnEvent: true

    rbac:
      create: true
      additionalPermissions:
        - apiGroups:
            - traefik.io
          resources:
            - ingressroutes
          verbs:
            - get
            - list
            - watch

    serviceMonitor:
      enabled: true

    # The VPA is RequestsOnly, so this hand-set limit is the real ceiling. Keep
    # it in lockstep with the external-dns VPA maxAllowed in
    # configs/vpa/platform.yaml.
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        memory: 256Mi
