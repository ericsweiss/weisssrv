---
# external-dns HelmRelease — adopts the existing release `external-dns` in
# external-dns namespace (matching releaseName + targetNamespace). Chart version
# substituted from cluster-versions ConfigMap. The `cloudflare-api-token` Secret
# referenced by env.CF_API_TOKEN is managed by an ExternalSecret in
# infrastructure/configs/shared-cloudflare-secrets/.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 30m
  releaseName: external-dns
  # Correct out-of-band edits to chart-rendered objects — see the rationale on
  # controllers/traefik/release.yaml. Safe here: no webhooks, no HPA.
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: external-dns
      version: "${helm_chart_versions_external_dns}"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 12h
  install:
    # disableWait prevents bootstrap deadlock: the cloudflare-api-token Secret
    # is created by configs stage (which depends on controllers). Without this,
    # Helm --wait blocks on pod readiness → pods need Secret → deadlock.
    # Only needed for install (fresh bootstrap); upgrades run in steady-state
    # where the Secret already exists.
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    provider:
      name: cloudflare

    # Enable Cloudflare proxy (orange cloud) for DDoS protection and hiding public IP
    extraArgs:
      - --cloudflare-proxied

    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token

    sources:
      - ingress
      - service
      - traefik-proxy  # Watch Traefik IngressRoute CRDs

    domainFilters:
      - ericsweiss.com  # External domain managed by Cloudflare

    # TXT registry for ownership tracking
    txtOwnerId: "k3s-external-dns"
    txtPrefix: "_external-dns."

    # Shared zone: ericsweiss.com is also managed by terraform/cloudflare (static
    # records) and the cloudflare-ddns CronJob (apex public IP). This is safe
    # because the txt registry below stamps every external-dns-owned record with
    # txtOwnerId, so `policy: sync` only deletes records external-dns created —
    # terraform/DDNS records (no matching owner TXT) are never touched. Keep
    # record names disjoint across the three owners. See docs/08-dns.md.
    policy: sync  # create + delete records this owner created (txt-registry scoped)

    registry: txt

    logLevel: info
    logFormat: json

    interval: 5m

    triggerLoopOnEvent: true

    # RBAC permissions for Traefik IngressRoutes
    rbac:
      create: true
      additionalPermissions:
        - apiGroups:
            - traefik.io
          resources:
            - ingressroutes
          verbs:
            - get
            - list
            - watch

    serviceMonitor:
      enabled: true

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
