---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-dns
resources:
  - namespace.yaml
  - release.yaml
  - networkpolicy.yaml

# Egress is kube-dns, the kube-apiserver it watches, and public HTTPS for the
# Cloudflare API: the three shared components unmodified. external-dns needs no
# public resolver, so it does not take cert-manager's :53 patch.
components:
  - ../../../components/netpol-baseline
  - ../../../components/netpol-egress-dns
  - ../../../components/netpol-egress-apiserver
  - ../../../components/netpol-egress-public
