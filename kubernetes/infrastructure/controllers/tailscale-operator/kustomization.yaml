---
# Tailscale operator: namespace, OAuth ExternalSecret, HelmRelease and
# default-deny-ingress from netpol-baseline. Proxy pods take tailnet traffic on
# tailscale0, off the CNI path, so the ingress deny cannot break the data path.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tailscale
components:
  - ../../../components/netpol-baseline
resources:
  - namespace.yaml
  - externalsecret.yaml
  - release.yaml
  - proxyclass.yaml
