---
# Default ProxyClass applied to every operator-created proxy StatefulSet
# (ts-traefik-tailnet-*, ts-ts-dns-*). Referenced by the exposure Services'
# `tailscale.com/proxy-class: default-proxyclass` annotation
# (controllers/traefik/traefik-tailnet-service.yaml, apps/tailnet-dns/service.yaml).
#
# Without a ProxyClass the operator requests ~1Mi of memory, so the pods get
# BestEffort-ish QoS. Sizing is set against the observed PEAK (the tsnet process
# resides far below it), request at p95 and limit at 2x peak. No CPU limit
# (docs/33).
#
# These StatefulSets are a VPA blind spot (docs/33): the operator names them
# ts-<svc>-<hash> and the hash changes with the exposure Service, so no static
# targetRef follows them. Re-measure this whenever the tailnet path is touched.
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: default-proxyclass
spec:
  statefulSet:
    pod:
      tailscaleContainer:
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 256Mi
