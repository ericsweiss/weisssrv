---
# Default ProxyClass for every operator-created proxy StatefulSet, referenced by
# the exposure Services' `tailscale.com/proxy-class` annotation. Sizing is
# manual (these are a VPA blind spot): request p95, limit 2x peak. docs/33.
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: default-proxyclass
spec:
  statefulSet:
    pod:
      tailscaleContainer:
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 256Mi
