---
# OAuth client for the Tailscale operator. Renders Secret `operator-oauth`
# (keys client_id/client_secret) which the operator Deployment consumes to
# authenticate to the tailnet and manage its proxy devices.
#
# 1Password item "Tailscale Operator OAuth" (Homelab vault) holds the client
# created in the admin console (Settings -> OAuth clients) with WRITE scopes on
# Devices/Core, Keys/Auth Keys, and Services, associated with tag
# tag:k8s-operator. Distinct from "Tailscale OAuth" (terraform ACL/DNS) and the
# host-join auth key. remoteRef.key = 1Password item TITLE, remoteRef.property =
# FIELD name (Connect provider convention). See docs/15-credential-rotation.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: Tailscale Operator OAuth
        property: client-id
    - secretKey: client_secret
      remoteRef:
        key: Tailscale Operator OAuth
        property: client-secret
