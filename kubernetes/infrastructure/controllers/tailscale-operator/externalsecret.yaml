---
# OAuth client for the Tailscale operator, rendered as Secret `operator-oauth`.
# Sourced from the 1Password item "Tailscale Operator OAuth", distinct from
# "Tailscale OAuth" and the host-join auth key. Scopes and rotation: docs/15.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: Tailscale Operator OAuth
        property: client-id
    - secretKey: client_secret
      remoteRef:
        key: Tailscale Operator OAuth
        property: client-secret
