---
# Tailscale Kubernetes operator: puts the internal Traefik ingress and the tailnet-dns
# resolver on the tailnet as mesh devices tagged tag:k8s. The `oauth` values stay unset
# so the chart consumes the ESO-rendered `operator-oauth` Secret. See docs/05-tailscale.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m
  # Revert out-of-band edits (traefik/release.yaml carries the repo rule). The pinned
  # chart renders no webhook, so re-verify that on a bump.
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: tailscale-operator
      version: "${helm_chart_versions_tailscale_operator}"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
      interval: 12h
  install:
    # CRITICAL: disableWait prevents a bootstrap deadlock. The operator-oauth
    # Secret comes from the configs stage, which depends on controllers, so Helm
    # --wait would block on pods that need that Secret.
    # Install only; upgrades run where the Secret already exists.
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # oauth.* deliberately unset -> chart uses the pre-created `operator-oauth`
    # Secret (ESO). operatorConfig.hostname names the operator's own device.
    operatorConfig:
      hostname: tailscale-operator
      # `platform` (sources/priorityclasses.yaml): the operator maintains the
      # tailnet proxy StatefulSets, so it must not lose a scheduling race to a
      # CI burst. The chart default is "" (priority 0).
      priorityClassName: platform
      # The chart ships resources: {} (BestEffort). Give it a floor and a memory
      # ceiling; the paired VPA (configs/vpa/platform.yaml, Initial) right-sizes
      # the request on natural restarts. CPU is compressible (docs/33).
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
    # Default tag applied to every proxy device the operator registers.
    # (This is also the chart default; pinned explicitly for clarity + review.)
    proxyConfig:
      defaultTags: "tag:k8s"
    # We only need ingress/egress proxies, not the in-process kube-API proxy.
    apiServerProxyConfig:
      mode: "false"
