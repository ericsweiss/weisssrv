---
# Namespace for the Tailscale operator and the proxy StatefulSets it creates,
# one per exposed Service. pod-security is privileged because the proxy pods
# need NET_ADMIN. NetworkPolicy posture is in kustomization.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    app.kubernetes.io/name: tailscale
    app.kubernetes.io/part-of: tailscale-operator
    app.kubernetes.io/managed-by: flux
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
