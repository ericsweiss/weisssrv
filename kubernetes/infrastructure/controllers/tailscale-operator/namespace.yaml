---
# Namespace for the Tailscale operator and the proxy StatefulSets it creates
# (one per exposed Service, e.g. traefik-tailnet and ts-dns).
#
# pod-security enforce=privileged: the operator's proxy pods run with elevated
# networking capabilities (NET_ADMIN for kernel-mode tailnet networking), which
# the baseline/restricted PSA profiles forbid. This is a trusted platform
# component (its images/proxy config come from the pinned chart); scope the
# elevation to this namespace only. Ingress/egress are intentionally NOT
# NetworkPolicy-restricted here — the proxy pods bridge the tailnet to arbitrary
# in-cluster backends and the operator serves an admission webhook to kube-API,
# so a default-deny would break them; the operator manages its own pod security.
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    app.kubernetes.io/name: tailscale
    app.kubernetes.io/part-of: tailscale-operator
    app.kubernetes.io/managed-by: flux
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
