---
# Namespace for the Tailscale operator and the proxy StatefulSets it creates
# (one per exposed Service, e.g. traefik-tailnet and ts-dns).
#
# pod-security enforce=privileged: the proxy pods need NET_ADMIN for kernel-mode
# tailnet networking, which baseline/restricted forbid. The elevation is scoped
# to this namespace and the images come from the pinned chart. NetworkPolicy
# posture is in kustomization.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    app.kubernetes.io/name: tailscale
    app.kubernetes.io/part-of: tailscale-operator
    app.kubernetes.io/managed-by: flux
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
