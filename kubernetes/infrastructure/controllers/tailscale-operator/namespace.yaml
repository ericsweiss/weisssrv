---
# Namespace for the Tailscale operator and the proxy StatefulSets it creates
# (one per exposed Service, e.g. traefik-tailnet and ts-dns).
#
# pod-security enforce=privileged: the operator's proxy pods run with elevated
# networking capabilities (NET_ADMIN for kernel-mode tailnet networking), which
# the baseline/restricted PSA profiles forbid. This is a trusted platform
# component (its images/proxy config come from the pinned chart); scope the
# elevation to this namespace only. Ingress IS now default-deny (kustomization.yaml
# wires the netpol-baseline component): the surface is pinned (no ports/Service/
# webhook/metrics; apiServerProxy off; proxies receive tailnet traffic off-CNI on
# tailscale0), so the deny cannot break the tailnet data path. Egress is left open
# (proxies forward to dynamically-created backends + reach the tailnet control
# plane/DERP) — see kustomization.yaml for the full rationale.
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    app.kubernetes.io/name: tailscale
    app.kubernetes.io/part-of: tailscale-operator
    app.kubernetes.io/managed-by: flux
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
