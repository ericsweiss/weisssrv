---
# Traefik NetworkPolicies, ingress only: Traefik proxies to Services in every
# namespace, so egress stays unrestricted. release.yaml puts the web and
# websecure entrypoints on container ports 80/443, which is where these match.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-ingress
  namespace: traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        # git-ssh passthrough (gitssh entrypoint, internal VIP only — the
        # public chart service does not expose it; docs/27 § SSH access).
        - protocol: TCP
          port: 2222

---
# Metrics scrape from observability (metrics entrypoint container port 9100).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-ingress
  namespace: traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9100
