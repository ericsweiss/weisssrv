---
# Traefik NetworkPolicies. Ingress only: egress is deliberately unrestricted
# because Traefik proxies to backend Services in every namespace, so a
# default-deny-egress would mean enumerating the whole cluster service surface.
#
# Edge data plane: web (80) + websecure (443) reachable from anywhere
# (LoadBalancer client traffic). release.yaml overrides the web/websecure
# entrypoint container ports to 80/443 (ports.web.port / ports.websecure.port),
# and the LoadBalancer Services target those container ports directly with
# externalTrafficPolicy: Local, so the NetworkPolicy is evaluated at 80/443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-ingress
  namespace: traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        # git-ssh passthrough (gitssh entrypoint, internal VIP only — the
        # public chart service does not expose it; docs/27 § SSH access).
        - protocol: TCP
          port: 2222

---
# Metrics scrape from observability (metrics entrypoint container port 9100).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-ingress
  namespace: traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9100
