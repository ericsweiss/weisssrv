---
# Traefik Internal LoadBalancer Service
# Separate service for internal-only traffic (*.esweiss.com)
# Uses vip-internal (192.168.0.101) while external traffic uses vip-public (192.168.0.100)
#
# Both services route to the same Traefik pods - separation is purely at DNS/network layer
# Security enforced by middlewares (lan-tailscale-only) on IngressRoutes

apiVersion: v1
kind: Service
metadata:
  name: traefik-internal
  namespace: traefik
  annotations:
    metallb.io/loadBalancerIPs: "${cluster_metallb_internal_vip}"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local  # Preserve source IP for IP allowlist middleware
  # MetalLB L2 announces the VIP directly — NodePorts would be unused listeners
  # on every node (the healthCheckNodePort required by eTP: Local remains).
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/name: traefik
    # Traefik chart instance label = <releaseName>-<namespace> ("traefik"-"traefik"); update if either changes
    app.kubernetes.io/instance: traefik-traefik
  ports:
    - name: web
      port: 80
      targetPort: web
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: websecure
      protocol: TCP
