---
# Second LoadBalancer over the same Traefik pods, on the internal VIP
# (*.esweiss.com). Route-level gating is the lan-tailscale-* middlewares.
apiVersion: v1
kind: Service
metadata:
  name: traefik-internal
  namespace: traefik
  annotations:
    metallb.io/loadBalancerIPs: "${cluster_metallb_internal_vip}"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local  # Preserve source IP for IP allowlist middleware
  # MetalLB L2 announces the VIP directly — NodePorts would be unused listeners
  # on every node (the healthCheckNodePort required by eTP: Local remains).
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/name: traefik
    # Traefik chart instance label = <releaseName>-<namespace> ("traefik"-"traefik"); update if either changes
    app.kubernetes.io/instance: traefik-traefik
  ports:
    - name: web
      port: 80
      targetPort: web
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: websecure
      protocol: TCP
    # git-ssh passthrough to the GitLab VM (gitssh entrypoint; internal VIP
    # only — external clients use the WAN forward). See release.yaml.
    - name: gitssh
      port: 2222
      targetPort: gitssh
      protocol: TCP
