---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Single-namespace dir: set the namespace so the shared default-deny-ingress
# component (added below) lands in traefik.
namespace: traefik
resources:
  - namespace.yaml
  - release.yaml
  - traefik-internal-service.yaml
  - networkpolicy.yaml

# default-deny-ingress from the shared baseline component (see
# kubernetes/components/netpol-baseline).
components:
  - ../../../components/netpol-baseline
