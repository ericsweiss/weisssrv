---
# Traefik exposed as a tailnet L3 device via the Tailscale operator.
#
# A second Service over the SAME Traefik pods (a Service cannot be both MetalLB
# and tailscale). loadBalancerClass: tailscale makes the operator register a
# tailnet device that TCP-passthrough-forwards 80/443, so SNI/Host survive and
# Traefik routes as it does for a LAN client. tailnet-dns CNAMEs the internal
# *.esweiss.com names at that device. See docs/05-tailscale.md.
apiVersion: v1
kind: Service
metadata:
  name: traefik-tailnet
  namespace: traefik
  annotations:
    tailscale.com/hostname: "traefik-tailnet"
    # Sizes the operator-created proxy pod (controllers/tailscale-operator/
    # proxyclass.yaml); without it the request is ~1Mi.
    tailscale.com/proxy-class: default-proxyclass
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: traefik
    # Traefik chart instance label = <releaseName>-<namespace> ("traefik"-"traefik").
    app.kubernetes.io/instance: traefik-traefik
  ports:
    - name: web
      port: 80
      targetPort: web
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: websecure
      protocol: TCP
