---
# Traefik exposed as a tailnet L3 device: a second Service over the same pods,
# since one Service cannot be both MetalLB and tailscale. The operator
# TCP-passthrough-forwards 80/443, so SNI and Host survive. See docs/05.
apiVersion: v1
kind: Service
metadata:
  name: traefik-tailnet
  namespace: traefik
  annotations:
    tailscale.com/hostname: "traefik-tailnet"
    # Sizes the operator-created proxy pod (controllers/tailscale-operator/
    # proxyclass.yaml); without it the request is ~1Mi.
    tailscale.com/proxy-class: default-proxyclass
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: traefik
    # Traefik chart instance label = <releaseName>-<namespace> ("traefik"-"traefik").
    app.kubernetes.io/instance: traefik-traefik
  ports:
    - name: web
      port: 80
      targetPort: web
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: websecure
      protocol: TCP
