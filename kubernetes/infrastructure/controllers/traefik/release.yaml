---
# Traefik HelmRelease — adopts the existing release `traefik` in traefik
# namespace (matching releaseName + targetNamespace). Chart version substituted
# from cluster-versions ConfigMap.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  releaseName: traefik
  # The repo-wide rule and its one exception: kubernetes/README.md § How it
  # reconciles.
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: traefik
      version: "${helm_chart_versions_traefik}"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    # Without this the traefik.io CRDs stay frozen at their first-install
    # schema while the chart/controller move on (Flux default is Skip).
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # `platform` (sources/priorityclasses.yaml) — the ingress path must outrank
    # apps and CI job pods when the cluster is full.
    priorityClassName: platform

    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    # Chart-native autoscaling rather than a standalone HPA: it makes the chart
    # omit `.spec.replicas`, so a helm upgrade cannot re-assert replicas:1 under
    # the HA floor. The Traefik VPA is memory-only and never contends on CPU.
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 70
      # Damp HPA flap on CI image-pull bursts: require ~2 min of sustained
      # pressure before adding a pod, one at a time. Sustained load still
      # reaches max=6.
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 120
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 120

    # Service configuration (external/public traffic - *.ericsweiss.com)
    # Note: traefik-internal-service.yaml provides separate LoadBalancer for internal traffic (*.esweiss.com) on .101
    service:
      type: LoadBalancer
      annotations:
        # Use MetalLB public pool for external Traefik traffic
        metallb.io/loadBalancerIPs: "${cluster_metallb_public_vip}"
      # externalTrafficPolicy Local preserves the client source IP the ipAllowList
      # middlewares read. allocateLoadBalancerNodePorts: false drops the data-plane
      # NodePorts; MetalLB L2 announces the VIP (docs/12-runbooks.md).
      spec:
        externalTrafficPolicy: Local
        allocateLoadBalancerNodePorts: false

    # Dashboard / api@internal: lan-tailscale-strict, authentik-auth,
    # hsts-header. The dashboard has no backend login, so forward-auth is the
    # identity gate; its provider lives in terraform/authentik.
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.${cluster_internal_domain}`)
        entryPoints:
          - websecure
        middlewares:
          - name: lan-tailscale-strict
            namespace: traefik
          - name: authentik-auth
            namespace: authentik
          - name: hsts-header
            namespace: traefik

    # Logging (chart 41.x renamed logs.general -> log, logs.access -> accessLog)
    log:
      level: INFO
    accessLog:
      enabled: true
      format: json

    metrics:
      prometheus:
        enabled: true
        entryPoint: metrics
        serviceMonitor:
          enabled: true
          # Keep Traefik's native per-backend `service` label; without this it is
          # renamed to `exported_service` (the k8s Service is also "traefik") and
          # every per-service dashboard panel collapses to one series.
          honorLabels: true

    providers:
      kubernetesCRD:
        enabled: true
        # Accepted risk, single-operator only: any IngressRoute may reference
        # another namespace. check-tenant-traefik-isolation.py gates this at
        # the first tenant onboarding (docs/30).
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true

    ports:
      web:
        port: 80
      websecure:
        port: 443
        # TLS is on by default on websecure in Traefik v3. readTimeout bounds
        # how long a request body may stream; 30m fits multi-GB registry and
        # Nextcloud uploads and stays slowloris-resistant.
        transport:
          respondingTimeouts:
            readTimeout: 30m
        # No forwardedHeaders.trustedIPs: Traefik treats every client, the
        # Cloudflare edge included, as untrusted and overwrites X-Forwarded-*.

      # git-ssh TCP passthrough for LAN clients on the internal VIP only.
      # Exposed by traefik-internal-service.yaml; the route lives in
      # apps/vm-ingress/gitlab.yaml.
      gitssh:
        port: 2222
        expose:
          default: false
        protocol: TCP

    additionalArguments:
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

    # ingress-labeled nodes only
    nodeSelector:
      ${cluster_node_label_domain}/ingress: "true"

    # Preferred, not required: a hard rule leaves pods Pending whenever fewer
    # than 3 ingress nodes are available.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
              topologyKey: kubernetes.io/hostname

    tolerations: []

    # CPU request sized so the HPA's 70% target tracks real load, not jitter
    # (docs/33: raise the request, not the threshold). The VPA owns memory.
    resources:
      requests:
        cpu: 250m
        memory: 128Mi
      limits:
        memory: 512Mi
