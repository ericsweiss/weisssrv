---
# Traefik HelmRelease — adopts the existing release `traefik` in traefik
# namespace (matching releaseName + targetNamespace). Chart version substituted
# from cluster-versions ConfigMap.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  releaseName: traefik
  # Revert out-of-band edits to chart-rendered objects. Repo rule: enabled
  # unless the chart ships a webhook whose caBundle is injected at runtime
  # (cert-manager, external-secrets, metallb, vpa, kube-prometheus-stack —
  # drift correction would wipe it every reconcile). Safe here, and
  # autoscaling.enabled omits .spec.replicas so the HPA has nothing to fight.
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: traefik
      version: "${helm_chart_versions_traefik}"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    # Without this the traefik.io CRDs stay frozen at their first-install
    # schema while the chart/controller move on (Flux default is Skip).
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # `platform` (sources/priorityclasses.yaml) — the ingress path must outrank
    # apps and CI job pods when the cluster is full.
    priorityClassName: platform

    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    # Chart-native autoscaling (min 2 / max 6 on ~70% CPU) rather than a
    # standalone HPA: it makes the chart omit `.spec.replicas`, so a helm
    # upgrade cannot re-assert replicas:1 under the HA floor. The Traefik VPA
    # (configs/vpa/platform.yaml) is memory-only, so it never contends on CPU.
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 70
      # Damp HPA flap on CI image-pull bursts: require ~2 min of sustained
      # pressure before adding a pod, one at a time. Sustained load still
      # reaches max=6.
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 120
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 120

    # No static `replicas` (autoscaling owns it); metrics come from the
    # ServiceMonitor below, not scrape annotations.
    deployment: {}

    # Service configuration (external/public traffic - *.ericsweiss.com)
    # Note: traefik-internal-service.yaml provides separate LoadBalancer for internal traffic (*.esweiss.com) on .101
    service:
      type: LoadBalancer
      annotations:
        # Use MetalLB public pool for external Traefik traffic
        metallb.io/loadBalancerIPs: "${cluster_metallb_public_vip}"
      # Preserve source IP for IP allowlist middleware to work correctly.
      # MetalLB L2 + externalTrafficPolicy:Local is endpoint-aware: the speaker
      # only announces the VIP from a node with a Ready Traefik endpoint, so the
      # single-IP public pool cannot blackhole while at least one Traefik pod is
      # Ready (it runs on every esweiss.com/ingress node, spread by anti-affinity).
      #
      # No NodePorts: MetalLB L2 announces the VIP directly and never uses them.
      # healthCheckNodePort stays — required by externalTrafficPolicy: Local.
      # Nothing owns spec.ports[*].nodePort, so already-allocated ports must be
      # stripped by hand (docs/12-runbooks.md).
      spec:
        externalTrafficPolicy: Local
        allocateLoadBalancerNodePorts: false

    # Dashboard / api@internal, chained like every other admin UI here:
    # lan-tailscale-strict (LAN + Tailscale, no pod CIDR) -> authentik-auth ->
    # hsts-header. It has no backend login of its own and /api/rawdata dumps the
    # whole router/service/middleware topology (every internal hostname, every
    # ClientIP bypass), so an in-cluster pod — a GitLab CI job pod included —
    # reaching it is a real escalation; the strict allowlist is what keeps the
    # pod CIDR out (configs/traefik-middlewares.yaml) and forward-auth is the
    # identity gate on top.
    #
    # authentik-auth only answers for a host the embedded outpost knows: the
    # traefik_dashboard proxy provider + `traefik` application + traefik-admins
    # binding + the outpost key in terraform/authentik. Removing any of those
    # 404s the forward-auth call and breaks this route.
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.${cluster_internal_domain}`)
        entryPoints:
          - websecure
        middlewares:
          - name: lan-tailscale-strict
            namespace: traefik
          - name: authentik-auth
            namespace: authentik
          - name: hsts-header
            namespace: traefik

    # Logging (chart 41.x renamed logs.general -> log, logs.access -> accessLog)
    log:
      level: INFO
    accessLog:
      enabled: true
      format: json

    metrics:
      prometheus:
        enabled: true
        entryPoint: metrics
        serviceMonitor:
          enabled: true
          # Keep Traefik's native per-backend `service` label; without this it is
          # renamed to `exported_service` (the k8s Service is also "traefik") and
          # every per-service dashboard panel collapses to one series.
          honorLabels: true

    providers:
      kubernetesCRD:
        enabled: true
        # ACCEPTED RISK, single-operator only. Any IngressRoute may reference
        # middlewares/Services in other namespaces, and watching every namespace
        # is why the chart's ClusterRole holds cluster-wide secrets get/list/watch
        # (one decision, not two). REVIEW BEFORE THE FIRST TENANT ONBOARDS
        # (docs/30): scope the provider per-tenant or set allowCrossNamespace:
        # false. Nothing enforces this precondition today.
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true

    ports:
      web:
        port: 80
      websecure:
        port: 443
        # TLS is on by default on websecure in Traefik v3+.
        # readTimeout bounds how long a request BODY may stream; the v3 default
        # of 60s cuts large registry pushes and Nextcloud/Immich uploads. 30m
        # fits multi-GB uploads and is still slowloris-resistant here.
        transport:
          respondingTimeouts:
            readTimeout: 30m
        # No forwardedHeaders.trustedIPs: Traefik treats every client — the
        # Cloudflare edge included — as untrusted and OVERWRITES X-Forwarded-*.
        # Downstream therefore sees the CF edge address rather than the visitor,
        # but no internet client can inject X-Forwarded-Host/Proto either.
        # Trusting the CF ranges here only pays off as part of the coordinated
        # real-client-IP change in docs/16-next-steps.md (CF Transform Rule +
        # header pinning + the guest nginx/Authentik trust lists).
      # git-ssh TCP passthrough for LAN clients. The pre-renumber path was the
      # gateway's hairpin NAT (LAN -> WAN IP :2222 -> the port forward), which
      # the homelab VLAN's sources no longer traverse — and the internal
      # rewrite of git.ericsweiss.com points at the internal VIP anyway, where
      # nothing listened on 2222 until this entrypoint. Kept OFF the
      # chart-managed public service: external clients keep using the WAN
      # forward straight to the VM, and 2222 on the public VIP would only
      # duplicate it. traefik-internal-service.yaml exposes it on .101;
      # the IngressRouteTCP lives in kubernetes/apps/vm-ingress/gitlab.yaml.
      gitssh:
        port: 2222
        expose:
          default: false
        protocol: TCP

    additionalArguments:
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

    # ingress-labeled nodes only
    nodeSelector:
      ${cluster_node_label_domain}/ingress: "true"

    # Preferred, not required: a hard rule leaves pods Pending whenever fewer
    # than 3 ingress nodes are available.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
              topologyKey: kubernetes.io/hostname

    tolerations: []

    # CPU request sized so the HPA's 70% target tracks real load, not jitter
    # (docs/33: raise the request, not the threshold). The VPA owns memory.
    resources:
      requests:
        cpu: 250m
        memory: 128Mi
      limits:
        memory: 512Mi
