---
# Traefik HelmRelease — adopts the existing release `traefik` in traefik
# namespace (matching releaseName + targetNamespace). Chart version substituted
# from cluster-versions ConfigMap. Values inlined from the previous
# kubernetes/apps/traefik/values.yaml (preserved verbatim).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  releaseName: traefik
  chart:
    spec:
      chart: traefik
      version: "${helm_chart_versions_traefik}"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # Pod Disruption Budget - prevent all replicas from being evicted during drains
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    # Deployment configuration
    deployment:
      replicas: 3  # HA with 3 replicas across different ingress nodes
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"

    # Service configuration (external/public traffic - *.ericsweiss.com)
    # Note: traefik-internal-service.yaml provides separate LoadBalancer for internal traffic (*.esweiss.com) on .101
    service:
      type: LoadBalancer
      annotations:
        # Use MetalLB public pool for external Traefik traffic
        metallb.universe.tf/loadBalancerIPs: "192.168.0.100"
      # Preserve source IP for IP allowlist middleware to work correctly
      spec:
        externalTrafficPolicy: Local

    # Enable dashboard (LAN/Tailscale-only)
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.esweiss.com`)
        entryPoints:
          - websecure
        middlewares:
          - name: lan-tailscale-only
            namespace: traefik

    # Logging
    logs:
      general:
        level: INFO
      access:
        enabled: true
        format: json

    # Metrics
    metrics:
      prometheus:
        enabled: true
        entryPoint: metrics
        serviceMonitor:
          enabled: true

    # Providers
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true

    # Ports configuration
    ports:
      web:
        port: 80
      websecure:
        port: 443
        # TLS is enabled by default on websecure port in Traefik v3+

    # Global HTTP to HTTPS redirect
    additionalArguments:
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

    # Node selector - prefer ingress nodes
    nodeSelector:
      esweiss.com/ingress: "true"

    # Pod anti-affinity to spread replicas across different nodes
    # Using preferredDuringScheduling for better availability during partial outages
    # (requiredDuringScheduling can leave pods Pending if < 3 ingress nodes available)
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
              topologyKey: kubernetes.io/hostname

    # Tolerations for scheduling
    tolerations: []

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
