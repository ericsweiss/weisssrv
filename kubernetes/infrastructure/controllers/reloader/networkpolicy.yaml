---
# Prometheus scrapes Reloader's PodMonitor (release.yaml reloader.podMonitor)
# directly on the pod's `http` container port 9090. The namespace runs
# default-deny-ingress (netpol-baseline component in kustomization.yaml), so
# without this allow the scrape is REJECTed at the CNI and TargetDown fires for
# job reloader/reloader-reloader. Kubelet probes originate in the host netns and
# bypass the policy, so the pod stays 1/1 while the scrape fails.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-ingress
  namespace: reloader
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9090

---
# Confine egress to exactly what Reloader needs: DNS + the kube-apiserver.
# Reloader watches ConfigMaps cluster-wide and patches Deployments, so bounding
# its network reach (no LAN/internet egress) limits what a compromised controller
# could do. Mirrors cert-manager's apiserver allowlist: kube-proxy DNATs the
# in-cluster API VIP to the real server node IPs before NetworkPolicy evaluation,
# so the server IPs are allowlisted on 6443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-reloader
  namespace: reloader
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 192.168.0.222/32
        - ipBlock:
            cidr: 192.168.0.223/32
        - ipBlock:
            cidr: 192.168.0.227/32
      ports:
        - protocol: TCP
          port: 6443
