---
# Prometheus scrapes Reloader's PodMonitor on container port 9090 and the
# namespace is default-deny-ingress, so this allow is what keeps TargetDown
# quiet. Kubelet probes bypass policy, so the pod stays 1/1 when it is missing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-ingress
  namespace: reloader
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9090
