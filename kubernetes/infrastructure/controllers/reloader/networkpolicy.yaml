---
# Default-deny ingress: Reloader serves no cluster traffic (it watches the
# apiserver and patches workloads; no webhook, no scraped metrics endpoint
# enabled), so nothing should reach its pod. Parity with the other controllers'
# ingress baseline (external-secrets, onepassword-connect).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: reloader
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Confine egress to exactly what Reloader needs: DNS + the kube-apiserver.
# Reloader watches ConfigMaps cluster-wide and patches Deployments, so bounding
# its network reach (no LAN/internet egress) limits what a compromised controller
# could do. Mirrors cert-manager's apiserver allowlist: kube-proxy DNATs the
# in-cluster API VIP to the real server node IPs before NetworkPolicy evaluation,
# so the server IPs are allowlisted on 6443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-reloader
  namespace: reloader
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 192.168.0.222/32
        - ipBlock:
            cidr: 192.168.0.223/32
        - ipBlock:
            cidr: 192.168.0.227/32
      ports:
        - protocol: TCP
          port: 6443
