---
# stakater/Reloader — rolls workloads annotated `reloader.stakater.com/auto`
# when a ConfigMap they mount changes, so an edit reaches running pods without a
# manual rollout. Opt-in only: an unannotated workload is never touched.
# Secrets are deliberately out of scope (ignoreSecrets below).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 30m
  releaseName: reloader
  # Correct out-of-band edits to chart-rendered objects — see the rationale on
  # controllers/traefik/release.yaml. Safe here: no webhooks, no HPA.
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: reloader
      version: "${helm_chart_versions_reloader}"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    reloader:
      # Watch every namespace so opt-in annotations work anywhere.
      watchGlobally: true
      # Reloads here are ConfigMap-driven (the download-clients VPN config), so
      # ignore Secrets: this drops cluster-wide Secret get/list/watch from
      # Reloader's RBAC, keeping the secret-read surface off this controller.
      # (Annotated workloads still auto-reload on their ConfigMap changes; a rare
      # credential-Secret rotation is handled by a manual restart.)
      ignoreSecrets: true
      logFormat: json
      # PodMonitor, not the chart's deprecated serviceMonitor: it scrapes the pod
      # directly, so no extra Service is needed.
      podMonitor:
        enabled: true
      # Chart toggle, NOT containerSecurityContext.readOnlyRootFilesystem: only
      # this one also mounts the paired writable /tmp emptyDir.
      readOnlyRootFileSystem: true
      deployment:
        # `platform` (sources/priorityclasses.yaml) — the chart nests the key
        # under reloader.deployment.
        priorityClassName: platform
        # Single replica: a restart delays a reload, never drops it.
        replicas: 1
        # The two restricted-PSS fields the chart leaves empty; the rest of the
        # profile comes from its default pod securityContext.
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          # Memory limit only, no CPU limit (docs/33).
          limits:
            memory: 128Mi
