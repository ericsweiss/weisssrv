---
# Allow ingress to the MetalLB controller webhook (called by the
# kube-apiserver, which arrives post-DNAT from a server node IP — the
# metallb-webhook-service maps 443 -> container port 9443) and metrics scrapes
# from observability. The apiserver source is not pinned by IP because the
# webhook call originates from whichever server is active; allow the webhook
# port from anywhere and rely on the webhook's own TLS for authenticity.
# Deliberately looser than kube-system-policies/allow-coredns.yaml, which pins
# the same post-DNAT class to the pod CIDR + LAN: :53 has no per-caller auth
# so the CIDRs are its only gate, a webhook's own TLS/authz is a real one
# (docs/29 § Network policy exceptions).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-and-metrics-ingress
  namespace: metallb-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Webhook (controller webhook-server listens on 9443)
    - ports:
        - protocol: TCP
          port: 9443
    # Prometheus metrics scrape (controller monitoring :7472)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 7472
