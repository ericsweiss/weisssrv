---
# MetalLB controller webhook (metallb-webhook-service maps 443 -> container 9443)
# plus metrics scrapes from observability. The webhook port is open from anywhere:
# the apiserver call arrives post-DNAT and the webhook's own TLS is the gate (docs/29).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-and-metrics-ingress
  namespace: metallb-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Webhook (controller webhook-server listens on 9443)
    - ports:
        - protocol: TCP
          port: 9443
    # Prometheus metrics scrape (controller monitoring :7472)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 7472
