---
# MetalLB HelmRelease — adopts the existing release `metallb` in metallb-system
# (matching releaseName + targetNamespace). Chart version substituted from
# cluster-versions ConfigMap.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  releaseName: metallb
  chart:
    spec:
      chart: metallb
      version: "${helm_chart_versions_metallb}"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      interval: 12h
  install:
    # RetryOnFailure, not the default RemediateOnFailure: install remediation
    # uninstalls the release, tearing down the speaker and controller. Retrying
    # in place does not; the CRDs are pinned by the keep policy below.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # CRITICAL: held at 0.15.x for the 0.16 apiserver-flood regression. The
    # chart must own the CRDs: with crds.enabled false a version switch renders
    # them as deletions and takes every IPAddressPool and VIP with them.
    crds:
      enabled: true
    prometheus:
      serviceMonitor:
        enabled: true
      # Metrics go through kube-rbac-proxy (chart default rbacPrometheus), and
      # the chart authorises exactly one (ServiceAccount, namespace) to scrape.
      # These must name the Prometheus SA, not metallb's own.
      serviceAccount: kube-prometheus-stack-prometheus
      namespace: observability
    speaker:
      # `platform` (sources/priorityclasses.yaml). The chart has no global key,
      # so controller and speaker are set separately.
      priorityClassName: platform
      # Only run speakers on nodes labeled for ingress traffic.
      nodeSelector:
        ${cluster_node_label_domain}/ingress: "true"
      tolerations: []
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
      frr:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
    controller:
      priorityClassName: platform
      # Controller can run anywhere (doesn't handle traffic directly).
      nodeSelector: {}
      tolerations: []
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
  # CRITICAL: the chart owns the metallb.io CRDs, so a helm uninstall
  # cascade-deletes every IPAddressPool and L2Advertisement. The keep policy
  # stops that; a strategic merge creates metadata.annotations.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apiextensions.k8s.io
              kind: CustomResourceDefinition
              name: ".*\\.metallb\\.io"
            patch: |
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: placeholder
                annotations:
                  helm.sh/resource-policy: keep
          # The chart exposes no values key for the speaker's reloader and
          # frr-metrics sidecars, so bound them here (7d peaks 8Mi and 47Mi).
          - target:
              group: apps
              version: v1
              kind: DaemonSet
              name: metallb-speaker
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: metallb-speaker
              spec:
                template:
                  spec:
                    containers:
                      - name: reloader
                        resources:
                          limits:
                            memory: 64Mi
                      - name: frr-metrics
                        resources:
                          requests:
                            memory: 64Mi
                          limits:
                            memory: 128Mi
