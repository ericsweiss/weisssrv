---
# MetalLB HelmRelease — adopts the existing release `metallb` in metallb-system
# (matching releaseName + targetNamespace). Chart version substituted from
# cluster-versions ConfigMap.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  releaseName: metallb
  chart:
    spec:
      chart: metallb
      version: "${helm_chart_versions_metallb}"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      interval: 12h
  install:
    # RetryOnFailure, NOT the default RemediateOnFailure: install remediation has
    # no strategy field, so it ALWAYS remediates by uninstalling — between each
    # retry. An uninstall here deletes the Helm-owned metallb.io CRDs, which
    # cascade-deletes the IPAddressPools + L2Advertisement and flips .99/.100/.101
    # to <pending> — the exact outage recorded in the crds comment below, this
    # time reached from the install path. Retrying in place cannot do that.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # Chart pinned to 0.15.3 in versions ConfigMap to dodge a 0.16.x
    # apiserver-flooding regression (metallb#3063). `crds.enabled: true`
    # so the chart manages CRDs — when we previously had it false the
    # 0.16 -> 0.15 chart switch *deleted* the existing CRDs entirely
    # (the 0.15 chart's CRD templates render as deletions when their
    # source-of-truth diverges), and that took every IPAddressPool +
    # L2Advertisement + ServiceL2Status down with them. Net effect was
    # all LoadBalancer EXTERNAL-IPs flipped to <pending>. Letting the
    # 0.15 chart own the CRDs means the v1beta1/v1beta2 group is the
    # 0.15 shape (matches the 0.15.3 controller+speaker), and a future
    # roll-forward to 0.16 will be handled by the chart's CRD upgrade
    # template rather than ad-hoc apply.
    crds:
      enabled: true
    prometheus:
      serviceMonitor:
        enabled: true
      # 0.15.3 + 0.16.x both serve the metrics endpoint via kube-rbac-proxy
      # when `rbacPrometheus: true` (chart default). The chart generates a
      # (Cluster)Role+Binding that authorises ONE specific (ServiceAccount,
      # namespace) to scrape — those two values must point at the
      # *Prometheus* SA, not metallb's own SA. Point them at our
      # kube-prometheus-stack Prometheus instance.
      serviceAccount: kube-prometheus-stack-prometheus
      namespace: observability
    speaker:
      # Only run speakers on nodes labeled for ingress traffic.
      nodeSelector:
        esweiss.com/ingress: "true"
      tolerations: []
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
      frr:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
    controller:
      # Controller can run anywhere (doesn't handle traffic directly).
      nodeSelector: {}
      tolerations: []
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
  # `crds.enabled: true` above makes the chart OWN the metallb.io CRDs, which
  # means a helm uninstall deletes them (and cascade-deletes every IPAddressPool
  # + L2Advertisement with them). Chart 0.15.3 exposes no crds.annotations hook,
  # so stamp helm.sh/resource-policy: keep onto the rendered CRDs instead — the
  # same post-render mechanism onepassword-connect uses. The name regex covers
  # all 9 CRDs the chart ships; they all render with an annotations map already,
  # so `op: add` on the sub-path is safe.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apiextensions.k8s.io
              kind: CustomResourceDefinition
              name: ".*\\.metallb\\.io"
            patch: |
              - op: add
                path: /metadata/annotations/helm.sh~1resource-policy
                value: keep
