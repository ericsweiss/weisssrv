---
# MetalLB HelmRelease — adopts the existing release `metallb` in metallb-system
# (matching releaseName + targetNamespace). Chart version substituted from
# cluster-versions ConfigMap.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  releaseName: metallb
  chart:
    spec:
      chart: metallb
      version: "${helm_chart_versions_metallb}"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      interval: 12h
  install:
    # RetryOnFailure, not the default RemediateOnFailure: install remediation
    # always remediates by uninstalling, which would delete the Helm-owned CRDs
    # and flip .99/.100/.101 to <pending>. Retrying in place cannot.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # Held at 0.15.x (metallb#3063 apiserver-flood regression in 0.16).
    # The chart must own the CRDs: with crds.enabled false, a chart-version
    # switch renders the CRD templates as deletions and takes every
    # IPAddressPool/L2Advertisement — and so every VIP — with them.
    crds:
      enabled: true
    prometheus:
      serviceMonitor:
        enabled: true
      # Metrics go through kube-rbac-proxy (chart default rbacPrometheus), and
      # the chart authorises exactly one (ServiceAccount, namespace) to scrape.
      # These must name the Prometheus SA, not metallb's own.
      serviceAccount: kube-prometheus-stack-prometheus
      namespace: observability
    speaker:
      # Only run speakers on nodes labeled for ingress traffic.
      nodeSelector:
        esweiss.com/ingress: "true"
      tolerations: []
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
      frr:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
    controller:
      # Controller can run anywhere (doesn't handle traffic directly).
      nodeSelector: {}
      tolerations: []
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
  # The chart owns the metallb.io CRDs (crds.enabled above), so a helm uninstall
  # would delete them and cascade-delete every IPAddressPool + L2Advertisement.
  # The chart exposes no crds.annotations hook, so stamp the keep policy on the
  # rendered CRDs here. Strategic merge, not a JSON patch: it creates
  # metadata.annotations when a chart bump renders a CRD without one.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apiextensions.k8s.io
              kind: CustomResourceDefinition
              name: ".*\\.metallb\\.io"
            patch: |
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: placeholder
                annotations:
                  helm.sh/resource-policy: keep
