---
# metrics-server is a platform controller but is NOT listed here: it has its own
# Flux Kustomization (clusters/weisssrv/infrastructure-metrics-server.yaml) so
# its wait cannot freeze this stage. Rationale: docs/33-autoscaling.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-secrets
  - metallb
  - cert-manager
  - traefik
  - external-dns
  - onepassword-connect
  - vpa
  - kured
  - reloader
  - tailscale-operator
  - nvidia-device-plugin
