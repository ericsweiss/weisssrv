---
# kured reboots k3s nodes carrying the /var/run/reboot-required sentinel, one
# at a time, handling cordon, drain, reboot and uncordon itself. The
# maintenance playbooks only set the sentinel (docs/12).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
  namespace: kube-system
spec:
  interval: 30m
  releaseName: kured
  # Correct out-of-band edits to chart-rendered objects — see the rationale on
  # controllers/traefik/release.yaml. Safe here: no webhooks, no HPA.
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: kured
      version: "${helm_chart_versions_kured}"
      sourceRef:
        kind: HelmRepository
        name: kured
        namespace: flux-system
      interval: 12h
  # disableWait: a single NotReady node (one mid-reboot) must not hold this
  # DaemonSet NotReady and stall the wait:true controllers stage. Per-node kured
  # health is covered by normal pod/DaemonSet monitoring.
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    configuration:
      # Pick up a maintenance-flagged reboot promptly (chart default is 1h).
      period: "5m"
      # No Prometheus alert-pause: kured fails closed on a query error and
      # Prometheus is single-replica behind the observability default-deny, so
      # wiring it would block every reboot.

      # CRITICAL: one node at a time under kured's cluster-wide lock is what
      # keeps the 3-node etcd quorum safe.
      concurrency: 1

      # Non-expiring lock: a time-based steal has no health check on the holder,
      # so it could reboot a second etcd server while the first is still down.
      # Clearing a stuck lock: docs/12-runbooks.md, coordinated reboots.
      lockTtl: "0"
      # Bound the pre-reboot drain and never force-reboot on drain failure: an
      # undrainable node keeps its sentinel and retries next period.
      # NodeStuckCordoned surfaces an abort that leaves the node cordoned.
      drainTimeout: "5m"
      forceReboot: false
      # Touched by the maintenance playbooks when a kernel update needs a reboot.
      # It auto-clears because /var/run is a tmpfs symlink to /run on these VMs;
      # a non-tmpfs /var/run would loop-reboot unless the sentinel is cleared.
      rebootSentinel: "/var/run/reboot-required"
      rebootCommand: "/bin/systemctl reboot"
      # Record reboot progress as node annotations for visibility.
      annotateNodes: true
      # Defer a node while it runs an infrastructure-class CI job pod, so kured
      # cannot drain a running pipeline out from under itself. Only job pods
      # carry the label, so the runner manager's node is never blocked.
      blockingPodSelector:
        - ${cluster_node_label_domain}/runner-class=infrastructure
    # Metrics Service + ServiceMonitor, so a stuck or aborted reboot cycle is
    # alertable directly (KuredRebootStuck) rather than only via node conditions.
    service:
      create: true
    metrics:
      create: true
    # Per-node agent: must run on every node, so tolerate all taints.
    tolerations:
      - operator: Exists
    # Node-critical so it isn't evicted under pressure and schedules everywhere.
    priorityClassName: system-node-critical
    rbac:
      create: true
    serviceAccount:
      create: true
    # 64Mi request / 128Mi limit: the 30d working-set peak across the nine nodes
    # is ~64Mi. The paired Off-mode VPA in configs/vpa/platform.yaml records
    # drift without ever evicting a reboot coordinator.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
