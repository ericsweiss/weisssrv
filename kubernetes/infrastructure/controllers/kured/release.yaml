---
# kured (Kubernetes Reboot Daemon) — safely reboots k3s nodes that have been
# flagged for reboot (sentinel /var/run/reboot-required, set by the maintenance
# playbooks after a kernel update), one node at a time, with cordon -> drain ->
# reboot -> uncordon handled by kured itself.
#
# The maintenance playbooks only set the sentinel: each node reboots ITSELF
# under kured's cluster-wide lock, so no orchestrator ever has to drain the node
# it is running on, and reboots outlive the CI job that flagged them.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
  namespace: kube-system
spec:
  interval: 30m
  releaseName: kured
  # Correct out-of-band edits to chart-rendered objects — see the rationale on
  # controllers/traefik/release.yaml. Safe here: no webhooks, no HPA.
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: kured
      version: "${helm_chart_versions_kured}"
      sourceRef:
        kind: HelmRepository
        name: kured
        namespace: flux-system
      interval: 12h
  # disableWait: a single NotReady node (one mid-reboot) must not hold this
  # DaemonSet NotReady and stall the wait:true controllers stage. Per-node kured
  # health is covered by normal pod/DaemonSet monitoring.
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    configuration:
      # Pick up a maintenance-flagged reboot promptly (chart default is 1h).
      period: "5m"
      # Deliberately NO Prometheus alert-pause: kured fails CLOSED on a query
      # error and Prometheus is single-replica behind the observability
      # default-deny-ingress, so wiring it would block every reboot.
      # One node at a time, enforced by kured's cluster-wide lock — this is what
      # keeps the 3-node etcd quorum safe. The maintenance playbooks serialize
      # their own host reboots against it by construction (docs/12).
      concurrency: 1
      # NON-EXPIRING lock. kured's TTL is a pure time-based steal with no health
      # check on the holder, so a finite TTL would let it reboot a second etcd
      # server while the first is still down. At 0 the lock is released only by
      # its holder; a kured pod that dies holding it blocks reboots until an
      # operator clears the annotation (docs/12-runbooks.md).
      lockTtl: "0"
      # Bound the pre-reboot drain; never force-reboot on drain failure — leave
      # the sentinel set and retry next period instead of hard-killing pods. An
      # undrainable node (slow eviction of the NAS-pinned single-replica pods, or
      # a PDB blocking the last replica) simply does not reboot; NodeStuckCordoned
      # surfaces it if the abort leaves the node cordoned.
      drainTimeout: "5m"
      forceReboot: false
      # Touched by the maintenance playbooks when a kernel update needs a reboot.
      # It auto-clears because /var/run is a tmpfs symlink to /run on these VMs;
      # a non-tmpfs /var/run would loop-reboot unless the sentinel is cleared.
      rebootSentinel: "/var/run/reboot-required"
      rebootCommand: "/bin/systemctl reboot"
      # Record reboot progress as node annotations for visibility.
      annotateNodes: true
      # Defer a node while it runs any infrastructure-class CI JOB pod, so kured
      # cannot drain a running pipeline (including maintenance-run-all) out from
      # under itself; it retries next cycle. Only job pods carry the label
      # (pod_labels in apps/gitlab-runner-privileged), so the runner manager's
      # node is never permanently blocked.
      blockingPodSelector:
        - esweiss.com/runner-class=infrastructure
    # Metrics Service + ServiceMonitor, so a stuck or aborted reboot cycle is
    # alertable directly (KuredRebootStuck) rather than only via node conditions.
    service:
      create: true
    metrics:
      create: true
    # Per-node agent: must run on every node, so tolerate all taints.
    tolerations:
      - operator: Exists
    # Node-critical so it isn't evicted under pressure and schedules everywhere.
    priorityClassName: system-node-critical
    rbac:
      create: true
    serviceAccount:
      create: true
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 96Mi
