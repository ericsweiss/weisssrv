---
# Keep one ESO controller replica up through drains so the reconcile path never
# goes fully offline. The controller runs a static 2 replicas with leader
# election: HA, not throughput. See docs/33-autoscaling.md.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
---
# The webhook's 2 replicas sit on the synchronous admission path for
# ExternalSecret/SecretStore writes. Keeping one up through drains stops those
# writes fail-closing when both replicas would evict together.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: external-secrets-webhook
  namespace: external-secrets
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
---
# cert-controller runs 2 replicas (release.yaml certController.replicaCount: 2)
# and rotates the webhook's serving cert; keep one up across drains.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: external-secrets-cert-controller
  namespace: external-secrets
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-cert-controller
