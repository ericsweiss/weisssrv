# NetworkPolicies for external-secrets, the namespace holding the 1Password
# Connect credentials and every ESO-synced Secret. default-deny-ingress comes
# from the netpol-baseline component; these policies are additive.

---
# Webhook ingress + metrics scrapes from observability. The webhook port is open
# from anywhere: the apiserver call arrives post-DNAT and ESO's own TLS/authz is
# the gate (docs/29 § Network policy exceptions).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-and-metrics-ingress
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Webhook (external-secrets-webhook listens on 10250)
    - ports:
        - protocol: TCP
          port: 10250
    # Prometheus metrics scrape (controller/webhook/certController :8080)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8080

---
# Default-deny egress: the allow below plus the netpol-egress-* components
# (kustomization.yaml) cover the pod classes here; anything new gets none.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes:
    - Egress

---
# ESO controllers reach the Connect API in this namespace. Matched by pod, not
# ClusterIP: kube-proxy DNATs before policy evaluation. 8081 is the sync sidecar.
# kube-dns and the apiserver come from the shared components (kustomization.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-connect-api
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: external-secrets
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: onepassword-connect
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
