---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Single-namespace dir: set the namespace so the shared default-deny-ingress
# component (added below) lands in external-secrets.
namespace: external-secrets
resources:
  - namespace.yaml
  - release.yaml
  - networkpolicy.yaml
  - pdb.yaml

# default-deny-ingress from the shared baseline component (see
# kubernetes/components/netpol-baseline).
components:
  - ../../../components/netpol-baseline
