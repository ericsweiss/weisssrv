---
# External Secrets Operator.
# Chart version substituted from cluster-versions ConfigMap (from all.yml).
# The onepasswordSDK provider (used by our ClusterSecretStore) is part of the
# core ESO image in 2.x; no extra feature flag needed.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 30m
  chart:
    spec:
      chart: external-secrets
      version: "${helm_chart_versions_external_secrets}"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    installCRDs: true
    replicaCount: 1
    # Constrain ESO to modern-CPU nodes. The Go binary uses CPU extensions
    # (POPCNT/SSE4.2) not available on the Core 2 Quad opt nodes; it SIGILLs
    # on those hosts (observed 2026-04-16).
    nodeSelector:
      esweiss.com/cpu: modern
    webhook:
      replicaCount: 1
      nodeSelector:
        esweiss.com/cpu: modern
    certController:
      replicaCount: 1
      nodeSelector:
        esweiss.com/cpu: modern
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
