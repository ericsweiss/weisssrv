---
# External Secrets Operator; chart version from cluster-versions (all.yml).
# nodeSelector ${cluster_node_label_domain}/cpu: modern — the Go binary SIGILLs on
# the Core 2 Quad opt nodes. CRDs are chart templates, stamped resource-policy: keep.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 30m
  chart:
    spec:
      chart: external-secrets
      version: "${helm_chart_versions_external_secrets}"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      interval: 12h
  install:
    # RetryOnFailure, not the default RemediateOnFailure: install remediation
    # remediates by uninstalling, which cascade-deletes the ESO CRDs and CRs.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # `platform` (sources/priorityclasses.yaml). The chart has no global key —
    # the controller reads the top-level one and webhook/certController each
    # read their own, so all three are set below.
    priorityClassName: platform
    serviceMonitor:
      enabled: true
    installCRDs: true
    crds:
      annotations:
        helm.sh/resource-policy: keep
    # 2 replicas for HA, not throughput: ESO does not shard ExternalSecrets, so
    # leaderElect keeps one replica reconciling and one a warm standby. Same
    # reason there is no HPA (docs/33-autoscaling.md).
    replicaCount: 2
    leaderElect: true
    nodeSelector:
      ${cluster_node_label_domain}/cpu: modern
    tolerations:
      - key: ${cluster_node_label_domain}/nas
        operator: Exists
        effect: PreferNoSchedule
      - key: ${cluster_node_label_domain}/compute
        operator: Exists
        effect: PreferNoSchedule
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: external-secrets
    webhook:
      replicaCount: 2
      priorityClassName: platform
      # Memory limits for all three components are hand-set at the 30d working-set
      # peak +60% and matched by the paired RequestsOnly VPAs' maxAllowed.
      # Peaks: webhook ~152Mi, certController ~193Mi, controller ~148Mi.
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
      nodeSelector:
        ${cluster_node_label_domain}/cpu: modern
      tolerations:
        - key: ${cluster_node_label_domain}/nas
          operator: Exists
          effect: PreferNoSchedule
        - key: ${cluster_node_label_domain}/compute
          operator: Exists
          effect: PreferNoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets-webhook
    certController:
      replicaCount: 2
      priorityClassName: platform
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 320Mi
      nodeSelector:
        ${cluster_node_label_domain}/cpu: modern
      tolerations:
        - key: ${cluster_node_label_domain}/nas
          operator: Exists
          effect: PreferNoSchedule
        - key: ${cluster_node_label_domain}/compute
          operator: Exists
          effect: PreferNoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets-cert-controller
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
