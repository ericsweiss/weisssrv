---
# External Secrets Operator.
# Chart version substituted from cluster-versions ConfigMap (from all.yml).
# The onepassword (Connect) provider (used by our ClusterSecretStore) is part of the
# core ESO image in 2.x; no extra feature flag needed.
#
# Scheduling (controller, webhook and certController alike; crds-operator would
# need the same if ever enabled):
# - nodeSelector esweiss.com/cpu: modern — the Go binary SIGILLs on the Core 2
#   Quad opt nodes (needs POPCNT/SSE4.2).
# - tolerations for the soft nas/compute taints, so replicas are not all pushed
#   onto one node.
# - topologySpreadConstraints hard-spread each pair across the three modern-CPU
#   hosts, so no single node drain can take a component fully offline.
#
# CRDs: ESO ships CRDs as chart templates gated by values.installCRDs (NOT a
# crds/ directory), so Flux's install/upgrade crds policy has no effect here —
# installCRDs below is what manages them. crds.annotations stamps a
# helm.sh/resource-policy=keep so an uninstall/rollback cannot cascade-delete
# the CRDs (and every ExternalSecret/ClusterSecretStore with them).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 30m
  chart:
    spec:
      chart: external-secrets
      version: "${helm_chart_versions_external_secrets}"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # `platform` (sources/priorityclasses.yaml). The chart has no global key —
    # the controller reads the top-level one and webhook/certController each
    # read their own, so all three are set below.
    priorityClassName: platform
    serviceMonitor:
      enabled: true
    installCRDs: true
    crds:
      annotations:
        helm.sh/resource-policy: keep
    # 2 replicas for HA, NOT throughput: ESO does not shard ExternalSecrets
    # across replicas, so a second active reconciler would only duplicate full
    # reconciles (and race on status writes). leaderElect makes exactly one
    # replica reconcile while the other is a warm standby for instant failover.
    # This is why there is no HPA — horizontal scaling buys nothing for a
    # non-sharding controller (see docs/33-autoscaling.md).
    replicaCount: 2
    leaderElect: true
    nodeSelector:
      ${cluster_node_label_domain}/cpu: modern
    tolerations:
      - key: ${cluster_node_label_domain}/nas
        operator: Exists
        effect: PreferNoSchedule
      - key: ${cluster_node_label_domain}/compute
        operator: Exists
        effect: PreferNoSchedule
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: external-secrets
    webhook:
      replicaCount: 2
      priorityClassName: platform
      # Memory limits across the three ESO components are hand-set at the 30d
      # working-set peak +60% and matched by the paired VPAs' maxAllowed; the
      # VPAs are RequestsOnly, so nothing rewrites them at runtime. Peaks:
      # webhook ~152Mi, certController ~193Mi, controller ~148Mi.
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
      nodeSelector:
        ${cluster_node_label_domain}/cpu: modern
      tolerations:
        - key: ${cluster_node_label_domain}/nas
          operator: Exists
          effect: PreferNoSchedule
        - key: ${cluster_node_label_domain}/compute
          operator: Exists
          effect: PreferNoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets-webhook
    certController:
      replicaCount: 2
      priorityClassName: platform
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 320Mi
      nodeSelector:
        ${cluster_node_label_domain}/cpu: modern
      tolerations:
        - key: ${cluster_node_label_domain}/nas
          operator: Exists
          effect: PreferNoSchedule
        - key: ${cluster_node_label_domain}/compute
          operator: Exists
          effect: PreferNoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets-cert-controller
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
