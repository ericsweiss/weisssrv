---
# External Secrets Operator.
# Chart version substituted from cluster-versions ConfigMap (from all.yml).
# The onepassword (Connect) provider (used by our ClusterSecretStore) is part of the
# core ESO image in 2.x; no extra feature flag needed.
#
# Scheduling:
# - nodeSelector esweiss.com/cpu: modern — the Go binary uses CPU extensions
#   (POPCNT/SSE4.2) not available on the Core 2 Quad opt nodes (pve-opt-01, pve-opt-02, pve-opt-03); it SIGILLs on
#   those hosts (observed 2026-04-16).
# - tolerations for PreferNoSchedule taints on nas/compute — otherwise all ESO
#   replicas crowd onto one node; soft taints are fine to ignore.
# - podAntiAffinity (preferred) spreads the 2 replicas across modern-CPU nodes
#   so a single-node drain doesn't take secret-sync offline.
#
# Only the main controller, webhook, and certController are pinned this way.
# crds-operator (if ever enabled) has the same constraint.
#
# CRDs: ESO ships CRDs as chart templates gated by values.installCRDs (NOT a
# crds/ directory), so Flux's install/upgrade crds policy has no effect here —
# installCRDs below is what manages them. crds.annotations stamps a
# helm.sh/resource-policy=keep so an uninstall/rollback cannot cascade-delete
# the CRDs (and every ExternalSecret/ClusterSecretStore with them).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 30m
  chart:
    spec:
      chart: external-secrets
      version: "${helm_chart_versions_external_secrets}"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    serviceMonitor:
      enabled: true
    installCRDs: true
    crds:
      annotations:
        helm.sh/resource-policy: keep
    # 2 replicas for HA, NOT throughput: ESO does not shard ExternalSecrets
    # across replicas, so a second active reconciler would only duplicate full
    # reconciles (and race on status writes). leaderElect makes exactly one
    # replica reconcile while the other is a warm standby for instant failover.
    # This is why there is no HPA — horizontal scaling buys nothing for a
    # non-sharding controller (see docs/33-autoscaling.md).
    replicaCount: 2
    leaderElect: true
    nodeSelector:
      esweiss.com/cpu: modern
    tolerations:
      - key: esweiss.com/nas
        operator: Exists
        effect: PreferNoSchedule
      - key: esweiss.com/compute
        operator: Exists
        effect: PreferNoSchedule
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [external-secrets]
              topologyKey: kubernetes.io/hostname
    webhook:
      replicaCount: 2
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      nodeSelector:
        esweiss.com/cpu: modern
      tolerations:
        - key: esweiss.com/nas
          operator: Exists
          effect: PreferNoSchedule
        - key: esweiss.com/compute
          operator: Exists
          effect: PreferNoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: [external-secrets-webhook]
                topologyKey: kubernetes.io/hostname
    certController:
      replicaCount: 2
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      nodeSelector:
        esweiss.com/cpu: modern
      tolerations:
        - key: esweiss.com/nas
          operator: Exists
          effect: PreferNoSchedule
        - key: esweiss.com/compute
          operator: Exists
          effect: PreferNoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: [external-secrets-cert-controller]
                topologyKey: kubernetes.io/hostname
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
