---
# Vertical Pod Autoscaler (Fairwinds chart). Recommender + updater +
# admission controller; per-workload VerticalPodAutoscaler policies live
# next to the workloads (configs/vpa/, observability/vpa.yaml,
# apps/*/vpa.yaml). Metrics come from the Flux-owned metrics-server
# (controllers/metrics-server/, its own Flux stage) — the k3s-bundled AddOn is
# disabled (k3s_disable in group_vars/k3s.yml), so a blind recommender is
# diagnosed there, not against k3s.
#
# nodeSelector esweiss.com/cpu: modern — same constraint as ESO: generic
# Go controller images SIGILL on the Core 2 Quad opt nodes.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: vpa-system
spec:
  interval: 30m
  releaseName: vpa
  chart:
    spec:
      chart: vpa
      version: "${helm_chart_versions_vpa}"
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # `platform` (sources/priorityclasses.yaml). The chart's top-level key
    # covers all three controllers (recommender, updater, admissionController);
    # the certgen Jobs are one-off and stay unclassed.
    priorityClassName: platform
    recommender:
      enabled: true
      # Defaults (25m / 250Mi) would floor every recommendation above what
      # the small exporters actually need.
      extraArgs:
        pod-recommendation-min-cpu-millicores: 10
        pod-recommendation-min-memory-mb: 32
      nodeSelector:
        ${cluster_node_label_domain}/cpu: modern
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    updater:
      enabled: true
      # Upstream default --min-replicas=2 refuses to evict single-replica
      # workloads, which describes most of this cluster — without this every
      # updateMode: Auto policy is inert.
      extraArgs:
        min-replicas: "1"
      nodeSelector:
        ${cluster_node_label_domain}/cpu: modern
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    admissionController:
      enabled: true
      # certgen Jobs need the same CPU constraint as the controllers.
      certGen:
        nodeSelector:
          ${cluster_node_label_domain}/cpu: modern
      nodeSelector:
        ${cluster_node_label_domain}/cpu: modern
      # Two replicas + a PDB: this webhook is on the admission path for EVERY
      # pod in the cluster, and it is failurePolicy: Ignore — while it is down
      # nothing rewrites requests, so every pod admitted in that window runs at
      # the raw manifest numbers. Single-replica made a node drain enough to
      # open that window. The chart only renders the PDB when replicaCount > 1.
      replicaCount: 2
      podDisruptionBudget:
        minAvailable: 1
      # Soft, not required: nodeSelector already narrows the candidates to the
      # modern-CPU nodes, and a hard rule would leave a replica Pending there.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: vpa
                    app.kubernetes.io/instance: vpa
                    app.kubernetes.io/component: admission-controller
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
