---
# Vertical Pod Autoscaler (Fairwinds chart). Per-workload VPA policies live next
# to the workloads; metrics come from the Flux-owned metrics-server. The
# cpu: modern nodeSelector: generic Go controller images SIGILL on the opt nodes.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: vpa-system
spec:
  interval: 30m
  releaseName: vpa
  chart:
    spec:
      chart: vpa
      version: "${helm_chart_versions_vpa}"
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # `platform` (sources/priorityclasses.yaml). The chart's top-level key
    # covers all three controllers (recommender, updater, admissionController);
    # the certgen Jobs are one-off and stay unclassed.
    priorityClassName: platform
    recommender:
      enabled: true
      # Defaults (25m / 250Mi) would floor every recommendation above what
      # the small exporters actually need.
      extraArgs:
        pod-recommendation-min-cpu-millicores: 10
        pod-recommendation-min-memory-mb: 32
      nodeSelector:
        ${cluster_node_label_domain}/cpu: modern
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    updater:
      enabled: true
      # Upstream default --min-replicas=2 refuses to evict single-replica
      # workloads, which describes most of this cluster — without this every
      # updateMode: Auto policy is inert.
      extraArgs:
        min-replicas: "1"
      nodeSelector:
        ${cluster_node_label_domain}/cpu: modern
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    admissionController:
      enabled: true
      # certgen Jobs need the same CPU constraint as the controllers.
      certGen:
        nodeSelector:
          ${cluster_node_label_domain}/cpu: modern
      nodeSelector:
        ${cluster_node_label_domain}/cpu: modern
      # This webhook is on the admission path for every pod and is
      # failurePolicy: Ignore, so pods admitted while it is down run at the raw
      # manifest numbers. The chart renders the PDB only when replicas > 1.
      replicaCount: 2
      podDisruptionBudget:
        minAvailable: 1
      # Soft, not required: nodeSelector already narrows the candidates to the
      # modern-CPU nodes, and a hard rule would leave a replica Pending there.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: vpa
                    app.kubernetes.io/instance: vpa
                    app.kubernetes.io/component: admission-controller
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
