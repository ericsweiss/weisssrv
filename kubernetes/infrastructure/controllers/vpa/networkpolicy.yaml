---
# VPA admission-controller webhook (vpa-webhook Service maps 443 -> container
# 8000), open from anywhere: the apiserver call arrives post-DNAT and the
# webhook's own TLS is the gate (docs/29).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-ingress
  namespace: vpa-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
