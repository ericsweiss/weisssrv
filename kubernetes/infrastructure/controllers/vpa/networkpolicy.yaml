---
# Default-deny ingress for vpa-system — parity with the rest of the controller
# namespaces (cert-manager pattern).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: vpa-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Allow ingress to the VPA admission-controller webhook (called by the
# kube-apiserver, which arrives post-DNAT from a server node IP — the
# vpa-webhook Service maps 443 -> container port 8000) and metrics scrapes
# from observability. The apiserver source is not pinned by IP because the
# webhook call originates from whichever server is active; allow the webhook
# port from anywhere and rely on the webhook's own TLS for authenticity.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-and-metrics-ingress
  namespace: vpa-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Webhook (admission-controller listens on 8000)
    - ports:
        - protocol: TCP
          port: 8000
    # Prometheus metrics scrape (admission-controller :8944)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8944
