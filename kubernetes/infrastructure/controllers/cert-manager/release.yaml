---
# cert-manager HelmRelease — adopts the existing release `cert-manager` in
# cert-manager namespace (matching releaseName + targetNamespace). Chart version
# substituted from cluster-versions ConfigMap.
#
# CRDs: the jetstack chart ships CRDs as templates gated by values.crds.enabled
# (NOT a crds/ directory), so Flux's install/upgrade crds policy has no effect
# here — crds.enabled below is what makes upgrades manage them. crds.keep
# protects them (and every Certificate) on uninstall.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  releaseName: cert-manager
  # CRD upgrades take minutes while the controller revalidates every existing
  # resource; a short timeout would remediation-uninstall mid-upgrade.
  timeout: 10m
  chart:
    spec:
      chart: cert-manager
      version: "${helm_chart_versions_cert_manager}"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    crds:
      enabled: true
      keep: true
    replicaCount: 1
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    webhook:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
    cainjector:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
    global:
      leaderElection:
        namespace: cert-manager
