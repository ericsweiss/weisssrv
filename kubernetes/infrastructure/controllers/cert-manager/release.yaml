---
# CRITICAL: the jetstack chart ships CRDs as templates gated by
# values.crds.enabled, not a crds/ directory, so Flux's crds policy does nothing
# here. crds.enabled below is what manages them on upgrade, and crds.keep is what
# protects them, and every Certificate, on uninstall.
# The release adopts the existing `cert-manager` release; the chart version comes
# from the cluster-versions ConfigMap.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  releaseName: cert-manager
  # CRD upgrades take minutes while the controller revalidates every existing
  # resource; a short timeout would remediation-uninstall mid-upgrade.
  timeout: 10m
  chart:
    spec:
      chart: cert-manager
      version: "${helm_chart_versions_cert_manager}"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    crds:
      enabled: true
      keep: true
    replicaCount: 1
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
    # 192Mi: the 30d working-set peak is ~114Mi, and the paired VPA cap
    # (configs/vpa/platform.yaml) must clear that peak or it clamps permanently.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 192Mi
    webhook:
      # 2 replicas + controllers/cert-manager/pdb.yaml: the webhook validates
      # every cert-manager CR write, so a single pod fails those writes closed
      # while it drains for a kured reboot.
      replicaCount: 2
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: webhook
              app.kubernetes.io/instance: cert-manager
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
    cainjector:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          # Hand-set ceiling (docs/33 § Limit oscillation); the VPA in
          # configs/vpa/platform.yaml caps the request at the same number.
          memory: 160Mi
    global:
      # `platform` (sources/priorityclasses.yaml). global.priorityClassName is
      # the chart's single key for all three controllers — controller, webhook
      # and cainjector all render it.
      priorityClassName: platform
      leaderElection:
        namespace: cert-manager
