---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/managed-by: flux
    # Receives the shared Cloudflare token via the cloudflare-api-token
    # ClusterExternalSecret (configs/shared-cloudflare-secrets/).
    esweiss.com/cloudflare-api-token: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
