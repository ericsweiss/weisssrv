---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Single-namespace dir: set the namespace so the shared NetworkPolicy components
# (added below) land in cert-manager.
namespace: cert-manager
resources:
  - namespace.yaml
  - release.yaml
  - networkpolicy.yaml

# Every cert-manager pod needs the same three egress paths, so all three are the
# shared namespace-wide components rather than a local policy: kube-dns, the
# kube-apiserver (order/challenge reconciliation) and public HTTPS (the ACME
# directory + the Cloudflare API for DNS-01).
components:
  - ../../../components/netpol-baseline
  - ../../../components/netpol-egress-dns
  - ../../../components/netpol-egress-apiserver
  - ../../../components/netpol-egress-public

patches:
  # cert-manager is the one namespace that also needs PUBLIC DNS: the DNS-01
  # solver's self-check queries the zone's authoritative nameservers directly,
  # and without :53 outbound every challenge stalls and renewal fails silently.
  # Appended here instead of in the component so no other namespace gets it.
  - target:
      kind: NetworkPolicy
      name: allow-egress-public
    patch: |
      - op: add
        path: /spec/egress/0/ports/-
        value:
          protocol: UDP
          port: 53
      - op: add
        path: /spec/egress/0/ports/-
        value:
          protocol: TCP
          port: 53
