---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager
resources:
  - namespace.yaml
  - release.yaml
  - networkpolicy.yaml
  - pdb.yaml

# Every cert-manager pod needs the same three egress paths, so they come from
# the shared components: kube-dns, the kube-apiserver, and public HTTPS for the
# ACME directory and the Cloudflare DNS-01 API.
components:
  - ../../../components/netpol-baseline
  - ../../../components/netpol-egress-dns
  - ../../../components/netpol-egress-apiserver
  - ../../../components/netpol-egress-public

patches:
  # CRITICAL: cert-manager also needs public DNS. The DNS-01 self-check queries
  # the zone's authoritative nameservers directly, so without :53 outbound every
  # challenge stalls and renewal fails silently. Kept here, not in the component.
  - target:
      kind: NetworkPolicy
      name: allow-egress-public
    patch: |
      - op: add
        path: /spec/egress/0/ports/-
        value:
          protocol: UDP
          port: 53
      - op: add
        path: /spec/egress/0/ports/-
        value:
          protocol: TCP
          port: 53
