---
# Webhook ingress + metrics scrapes from observability. The webhook port is
# open from anywhere because the apiserver call arrives post-DNAT from whichever
# server is active; cert-manager's own TLS/authz is the gate there.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-and-metrics-ingress
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Webhook (cert-manager-webhook listens on 10250)
    - ports:
        - protocol: TCP
          port: 10250
    # Prometheus metrics scrape (controller :9402)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9402
