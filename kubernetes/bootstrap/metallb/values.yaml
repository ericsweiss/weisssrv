# MetalLB Helm values
# Configures speaker to only run on ingress-labeled nodes

speaker:
  # Only run speakers on nodes labeled for ingress traffic
  nodeSelector:
    esweiss.com/ingress: "true"
  # Don't run on tainted nodes (unless specifically tolerated)
  tolerations: []

controller:
  # Controller can run anywhere (doesn't handle traffic directly)
  nodeSelector: {}
  tolerations: []
