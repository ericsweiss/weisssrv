---
# CRITICAL: kube-proxy DNATs the in-cluster API VIP to a real server node IP
# before NetworkPolicy evaluation, so this allowlists the three k3s server node
# IPs on 6443; a rule naming the VIP never matches the post-DNAT packet.
# The IPs stay literal and come from hosts.yml: test_site_configs.py
# (TestApiserverEgressPeers) reds if they drift from the k3s_servers group.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-apiserver
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.10.222/32
        - ipBlock:
            cidr: 10.0.10.223/32
        - ipBlock:
            cidr: 10.0.10.227/32
      ports:
        - protocol: TCP
          port: 6443
