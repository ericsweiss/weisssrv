---
# CRITICAL: adding ANY egress policy makes egress default-deny for the pods it
# selects, so a namespace including this component must also carry every other
# egress path its pods need.
# The shipped policy selects the whole namespace (podSelector {}), so it replaces
# a hand-written rule only where that rule already selected every pod. An
# app-scoped policy keeps its own kube-dns rule; see the README.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - allow-egress-dns.yaml
