---
# Shared GitLab Runner HelmRelease config, merged into both runner releases
# (gitlab-runner, gitlab-runner-privileged) at build time. Anything identical in
# both belongs here; each release.yaml keeps only its own deltas.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  # The `target` selector governs which resource is patched (name is a regex);
  # the patch's own metadata.name is required for the strategic-merge parse but
  # is ignored for matching, so it does not rename the selected HelmRelease.
  - target:
      kind: HelmRelease
      name: gitlab-runner.*
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: gitlab-runner-common
      spec:
        interval: 30m
        # Revert out-of-band edits to chart-rendered objects. Repo rule in
        # controllers/traefik/release.yaml; safe here, the runner chart ships no
        # caBundle-injecting webhook.
        driftDetection:
          mode: enabled
        # Runner liveness probe + GitLab connection handshake can take 6-8 minutes
        # on a cold start; default 5m timeout times out prematurely.
        timeout: 15m
        chart:
          spec:
            chart: gitlab-runner
            version: "${gitlab_runner_helm_version}"
            sourceRef:
              kind: HelmRepository
              name: gitlab
              namespace: flux-system
            interval: 12h
        install:
          timeout: 15m
          remediation:
            retries: 3
        upgrade:
          timeout: 15m
          remediation:
            retries: 3
            remediateLastFailure: true
        values:
          # Internal name, so runner<->GitLab traffic stays on the LAN. clone_url
          # in each runners.config must be set to match: GitLab's external_url is
          # the WAN name, so clone URLs do not follow gitlabUrl on their own.
          gitlabUrl: https://git.${cluster_internal_domain}

          # One manager pod; job parallelism is `concurrent` per runner.
          # driftDetection above reverts an out-of-band scale.
          replicas: 1

          checkInterval: 30

          # Bound only to the manager SA; job pods run as an unprivileged jobs SA
          # (serviceaccount.yaml) and clusterWideAccess: false keeps the runner in
          # its own namespace. Cross-namespace deploys use a kubeconfig variable.
          rbac:
            create: true
            clusterWideAccess: false
            rules:
              - apiGroups: [""]
                resources: ["pods", "pods/exec", "pods/attach", "pods/log", "secrets", "configmaps"]
                verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
              - apiGroups: [""]
                resources: ["services"]
                verbs: ["get", "list", "watch"]

          # Pod resources for the runner manager (not the job pods).
          resources:
            requests:
              cpu: 150m
              memory: 128Mi
            limits:
              # No CPU limit: the manager bursts when spawning/reaping job pods
              # and CFS throttling made that a chronic CPUThrottlingHigh source.
              # The request still grants a scheduling share.
              memory: 512Mi

          # Prefer non-NAS nodes for runner pods.
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: ${cluster_node_label_domain}/nas
                        operator: DoesNotExist

          tolerations:
            - key: ${cluster_node_label_domain}/ingress
              operator: Equal
              value: "true"
              effect: PreferNoSchedule
            - key: ${cluster_node_label_domain}/compute
              operator: Equal
              value: "true"
              effect: PreferNoSchedule
