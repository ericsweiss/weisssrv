---
# Egress to the public internet only, never the LAN, on TCP/443. A namespace
# that also needs public DNS adds the two :53 ports with a JSON6902 patch in its
# own kustomization. See netpol-egress-dns for the default-deny caveats.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - allow-egress-public.yaml
