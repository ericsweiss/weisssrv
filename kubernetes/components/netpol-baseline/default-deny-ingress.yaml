---
# Shared default-deny-ingress NetworkPolicy: empty podSelector, Ingress deny.
# The body is identical in every namespace, so the including kustomization
# supplies the namespace via its transformer or a per-inclusion patch.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
