---
# The default-deny-ingress policy every namespace must carry, included from the
# namespace's kustomization, which supplies the namespace. README.md has the
# split between this and the netpol-egress-{dns,apiserver,public} components.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - default-deny-ingress.yaml
