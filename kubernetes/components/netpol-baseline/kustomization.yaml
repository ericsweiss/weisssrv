---
# Baseline NetworkPolicy Kustomize Component: the default-deny-ingress policy
# every namespace must carry. Include it from the namespace's kustomization; the
# namespace comes from that kustomization's `namespace:` transformer, or from a
# per-inclusion patch where it deliberately has none.
#
# Scope: whole resources only. The recurring egress SUB-rules (kube-apiserver
# server IPs, the RFC-reserved except-list, kube-dns) live inside each app's own
# policy and cannot be a component; scripts/check-netpol-except-parity.py is
# what keeps the except-lists from drifting apart.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - default-deny-ingress.yaml
