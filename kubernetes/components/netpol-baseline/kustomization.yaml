---
# Baseline NetworkPolicy Kustomize Component: the default-deny-ingress policy
# every namespace must carry. Include it from the namespace's kustomization; the
# namespace comes from that kustomization's `namespace:` transformer, or from a
# per-inclusion patch where it deliberately has none.
#
# Scope: whole resources only. The three recurring egress rules (kube-dns, the
# kube-apiserver server IPs, the RFC-reserved except-list) ship as their own
# namespace-wide components alongside this one — netpol-egress-{dns,apiserver,public}.
# An egress SUB-rule inside an app-scoped policy still cannot be a component, so
# those copies remain and scripts/check-netpol-except-parity.py is what keeps
# them from drifting apart. README.md has the split.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - default-deny-ingress.yaml
