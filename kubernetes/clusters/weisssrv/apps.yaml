---
# Flux Kustomization: application workloads (./kubernetes/apps, one folder per app).
# dependsOn infrastructure-configs, deliberately NOT observability: a failed
# observability chart upgrade must not freeze every business app.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  # Headroom over the slowest release this stage waits on (authentik, 15m) so a
  # slow-but-successful install is still seen Ready in one pass.
  timeout: 25m
  dependsOn:
    - name: infrastructure-configs
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
        optional: false
      - kind: ConfigMap
        name: cluster-config
        optional: false
