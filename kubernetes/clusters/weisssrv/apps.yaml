---
# Flux Kustomization for application workloads.
# Reconciles kubernetes/apps/ which contains one folder per app (authentik,
# download-clients, recipes, gitlab-runner, gitlab-runner-privileged,
# gitlab-agent, vm-ingress).
#
# dependsOn infrastructure: apps will not reconcile until platform (ESO,
# MetalLB, cert-manager, Traefik, external-dns) is Ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
        optional: true
