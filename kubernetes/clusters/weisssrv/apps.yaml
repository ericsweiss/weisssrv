---
# Flux Kustomization for application workloads.
# Reconciles kubernetes/apps/ (one folder per app; see apps/kustomization.yaml).
#
# dependsOn infrastructure-configs (sources → crds → controllers → configs), so
# the monitoring.coreos.com CRDs are two stages old by the time an app renders a
# ServiceMonitor/PodMonitor. Deliberately NOT dependent on observability health:
# a failed observability chart upgrade must not freeze every business app.
#
# optional: false — cluster-versions comes from infrastructure-sources, so a
# missing ConfigMap here is a real fault and must fail loudly rather than render
# empty chart/image versions.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  # Headroom over the slowest release this stage waits on (authentik, 15m) so a
  # slow-but-successful install is still seen Ready in one pass.
  timeout: 25m
  dependsOn:
    - name: infrastructure-configs
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
        optional: false
