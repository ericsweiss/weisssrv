---
# Flux Kustomization: platform configs (CRs that depend on the controllers'
# CRDs being installed). Includes ClusterSecretStore (ESO), ClusterIssuer +
# wildcard Certificates (cert-manager), IPAddressPool + L2Advertisement
# (MetalLB), the CoreDNS HPA replica pin, VPA policies, cloudflare-ddns
# CronJob, and shared-cloudflare-secrets ExternalSecrets.
#
# Depends on infrastructure-controllers so every CRD exists and the webhooks
# (cert-manager in particular) are serving.
#
# optional: false — same rationale as the other stages.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  dependsOn:
    - name: infrastructure-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/configs
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
        optional: false
      - kind: ConfigMap
        name: cluster-config
        optional: false
