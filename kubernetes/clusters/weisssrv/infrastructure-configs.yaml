---
# Flux Kustomization: platform configs, the CRs needing the controllers' CRDs
# plus the built-in-kind NetworkPolicy sets. Depends on
# infrastructure-controllers so every CRD exists and the webhooks are serving.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  dependsOn:
    - name: infrastructure-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/configs
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
        optional: false
      - kind: ConfigMap
        name: cluster-config
        optional: false
