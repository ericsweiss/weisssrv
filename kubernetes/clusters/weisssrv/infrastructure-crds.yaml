---
# Flux Kustomization: CRD bootstrap stage — installs the monitoring.coreos.com
# CRDs (prometheus-operator-crds HelmRelease) before the controllers stage.
#
# Breaks the fresh-bootstrap ordering problem: controllers (Traefik) render
# ServiceMonitors and hard-fail without the monitoring CRDs, so they are
# installed here and wait:true holds controllers until they are Established.
# Depends only on sources (chart repo + the version ConfigMap).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-crds
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  # Headroom over the prometheus-operator-crds release timeout (10m).
  timeout: 15m
  dependsOn:
    - name: infrastructure-sources
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/crds
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
        optional: false
