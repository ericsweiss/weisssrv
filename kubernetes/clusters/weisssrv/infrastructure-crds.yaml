---
# CRD bootstrap stage: installs the monitoring.coreos.com CRDs before the
# controllers stage, which renders ServiceMonitors and hard-fails without them.
# wait:true holds controllers until they are Established. Depends on sources.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-crds
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  # Headroom over the prometheus-operator-crds release timeout (10m).
  timeout: 15m
  dependsOn:
    - name: infrastructure-sources
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/crds
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
        optional: false
      - kind: ConfigMap
        name: cluster-config
        optional: false
