---
# Cluster entrypoint — the flux-system Kustomization (from `flux bootstrap`)
# reconciles this path. It applies the flux-system controllers plus the three
# infrastructure Flux Kustomizations (sources → controllers → configs), the
# apps top-level Kustomization (dependsOn infrastructure-configs), and pulls
# in the tenants folder (empty at bootstrap; populated as external repos
# onboard).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system
  - infrastructure-sources.yaml
  - infrastructure-controllers.yaml
  - infrastructure-configs.yaml
  - apps.yaml
  - tenants
