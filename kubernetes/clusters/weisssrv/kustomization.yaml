---
# Cluster entrypoint — the flux-system Kustomization (from `flux bootstrap`)
# reconciles this path. It applies the flux-system controllers plus the five
# infrastructure Flux Kustomizations (sources → crds → controllers → configs →
# observability), the apps top-level Kustomization (dependsOn
# infrastructure-configs, parallel to observability), and pulls in the
# tenants folder (empty at bootstrap; populated as external repos onboard).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system
  - infrastructure-sources.yaml
  - infrastructure-crds.yaml
  - infrastructure-controllers.yaml
  - infrastructure-configs.yaml
  - infrastructure-observability.yaml
  - apps.yaml
  - tenants
