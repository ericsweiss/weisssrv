---
# Flux Kustomization: platform controllers (HelmReleases) — see
# kubernetes/infrastructure/controllers/kustomization.yaml for the current set.
#
# Depends on sources (charts pullable + version ConfigMap present) and on crds
# (the monitoring CRDs a controller's ServiceMonitor needs at render time).
#
# optional: false on both — a missing cluster-versions or cluster-config here
# is a real fault and must fail loudly rather than render empty chart versions
# or empty hostnames.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m  # Headroom over the slowest release here (cert-manager, 10m)
  dependsOn:
    - name: infrastructure-sources
    - name: infrastructure-crds
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/controllers
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
        optional: false
      - kind: ConfigMap
        name: cluster-config
        optional: false
