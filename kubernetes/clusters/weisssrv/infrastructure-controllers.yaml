---
# Flux Kustomization: platform controllers (HelmReleases) — see
# kubernetes/infrastructure/controllers/kustomization.yaml for the current set.
#
# Depends on infrastructure-sources being Ready so HelmRepositories exist
# (charts are pullable) and cluster-versions ConfigMap exists (postBuild
# substitution below resolves).
#
# optional: false — cluster-versions lives in sources/ which must reconcile
# first, so a missing ConfigMap here indicates a real problem and should
# fail loudly rather than render empty chart versions.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m  # Helm install of cert-manager + ESO + CRDs can take >5m
  dependsOn:
    - name: infrastructure-sources
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/controllers
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
        optional: false
