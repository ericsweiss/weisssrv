---
# Flux Kustomization: platform controllers (HelmReleases); the current set is
# in kubernetes/infrastructure/controllers/kustomization.yaml. Depends on
# sources (charts + version ConfigMap) and crds (monitoring CRDs).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m  # Headroom over the slowest release here (cert-manager, 10m)
  dependsOn:
    - name: infrastructure-sources
    - name: infrastructure-crds
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/controllers
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
        optional: false
      - kind: ConfigMap
        name: cluster-config
        optional: false
