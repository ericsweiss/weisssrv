---
# Flux Kustomization for platform infrastructure.
# Reconciles kubernetes/infrastructure/ which contains:
#   - sources/     HelmRepository CRs
#   - controllers/ HelmReleases for platform components (ESO, MetalLB, cert-manager, Traefik, external-dns)
#   - configs/     Cluster-wide configs (ClusterSecretStore, ClusterIssuer, CoreDNS override, DDNS CronJob)
#
# Version placeholders (${var_name}) in downstream manifests are substituted from
# the cluster-versions ConfigMap generated from ansible/inventories/prod/group_vars/all.yml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
        optional: true  # bootstrap grace: allowed empty until versions-configmap.yaml lands
