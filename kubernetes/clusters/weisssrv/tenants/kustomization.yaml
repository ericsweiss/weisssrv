---
# Tenant wiring: one file per tenant gets listed here. Each tenant file
# defines its own `ClusterSecretStore` (or namespace-scoped `SecretStore`),
# `GitRepository`, and top-level `Kustomization`. See README.md in this
# folder for examples.
#
# A Kustomize aggregator, not a Flux Kustomization: the root cluster
# Kustomization pulls this tree in via resources: [tenants].
# tenant-crd-editor.yaml is the one always-present resource.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - tenant-crd-editor.yaml
  # - <repo-slug>.yaml   # <-- add each tenant wiring file here as it onboards
