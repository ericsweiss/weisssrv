---
# Tenant wiring: one file per tenant, each defining its own SecretStore,
# GitRepository and Kustomization (see README.md here). This is a Kustomize
# aggregator that the root cluster Kustomization pulls in via resources.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - tenant-crd-editor.yaml
  # - <repo-slug>.yaml   # <-- add each tenant wiring file here as it onboards
