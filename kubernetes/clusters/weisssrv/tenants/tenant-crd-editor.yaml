---
# Shared RBAC for tenant Flux reconciliation.
#
# A tenant's Flux ServiceAccount is bound to the built-in `admin` ClusterRole,
# which does NOT cover three CRD groups a normal tenant app uses — traefik.io,
# monitoring.coreos.com and autoscaling.k8s.io (VPA; not the `autoscaling` HPA
# group admin does have). Without them the tenant's IngressRoute/ServiceMonitor/
# VPA go Forbidden and its Kustomization NotReady. Each tenant wiring file binds
# this alongside `admin` (README.md); unbound it does nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-crd-editor
  labels:
    app.kubernetes.io/managed-by: flux
rules:
  - apiGroups: ["traefik.io"]
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
      - traefikservices
      - serverstransports
      - tlsoptions
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - servicemonitors
      - podmonitors
      - prometheusrules
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: ["autoscaling.k8s.io"]
    resources:
      - verticalpodautoscalers
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  # Normally covered by admin's aggregation (see header) — explicit so the
  # tenant story survives an install without the aggregated edit roles.
  - apiGroups: ["external-secrets.io"]
    resources:
      - externalsecrets
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
