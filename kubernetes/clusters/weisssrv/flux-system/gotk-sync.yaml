# This manifest was generated by flux. DO NOT EDIT by hand except for the
# one-time post-merge branch switch described below.
#
# POST-MERGE ACTION REQUIRED: after the Flux migration MR merges to main,
# push the `branch: main` change to `flux/migration` FIRST (the branch Flux
# is currently tracking) so Flux self-migrates, then propagate to main, then
# delete the flux/migration branch on the remote.
#
# Do NOT push `branch: main` directly to main first — Flux never sees it
# (still watching flux/migration), and deleting flux/migration afterward
# breaks Flux with "couldn't find remote ref refs/heads/flux/migration".
#
# See docs/29-flux-operations.md § "Post-merge branch switch" for the exact
# step-by-step runbook and the kubectl-patch fallback.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: https://git.ericsweiss.com/eric/weisssrv.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/clusters/weisssrv
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
