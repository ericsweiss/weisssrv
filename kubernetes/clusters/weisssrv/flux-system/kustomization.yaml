apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
patches:
# Enforce the restricted PSA profile (bootstrap default is warn-only).
# kustomize-controller/helm-controller hold cluster-admin, so flux-system is
# the namespace that most needs an admission guard; all four controllers are
# restricted-compliant upstream. Patched here because gotk-components.yaml is
# regenerated by flux bootstrap/install and must not be hand-edited.
- target:
    kind: Namespace
    name: flux-system
  patch: |
    - op: add
      path: /metadata/labels/pod-security.kubernetes.io~1enforce
      value: restricted
    - op: add
      path: /metadata/labels/pod-security.kubernetes.io~1enforce-version
      value: latest
# Right-size controller memory requests (bootstrap default 64Mi; observed
# working sets run 100-170Mi above that). VPA Initial policies in
# infrastructure/configs/vpa/flux-system.yaml take over from here.
- target:
    kind: Deployment
    name: (source-controller|kustomize-controller|helm-controller)
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 256Mi
- target:
    kind: Deployment
    name: notification-controller
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 128Mi
# Drop the controllers' CPU limit (bootstrap default 1000m). CPU is compressible
# — a limit only adds CFS throttling that hurts reconcile latency; the memory
# limit stays. Repo-wide policy enforced by check-hpa-vpa-invariant.py; see
# docs/33-autoscaling.md.
- target:
    kind: Deployment
    name: (source-controller|kustomize-controller|helm-controller|notification-controller)
  patch: |
    - op: remove
      path: /spec/template/spec/containers/0/resources/limits/cpu
