---
# Flux Kustomization: infrastructure sources (HelmRepositories + the
# cluster-versions and cluster-config ConfigMaps).
#
# Runs first, with no dependencies: the HelmRepository CRs helm-controller pulls
# charts from, plus the two ConfigMaps every later stage substitutes
# from. No postBuild here — sources/ contains no placeholders of its own.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-sources
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/sources
  prune: true
  # wait:false — everything here is usable the moment it is applied. Waiting for
  # every repo index would let one transient registry outage stall the entire
  # downstream chain; helm-controller already waits per-chart.
  wait: false
