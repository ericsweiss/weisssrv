---
# Flux Kustomization: infrastructure sources (HelmRepositories + cluster-versions ConfigMap).
#
# Runs first in the infrastructure chain. No dependencies. Provides:
#   - HelmRepository CRs that helm-controller pulls charts from
#   - cluster-versions ConfigMap that every later Kustomization reads via
#     postBuild.substituteFrom for version placeholders
#
# NOTE: no postBuild.substituteFrom here — sources/ itself does not contain
# any ${var} placeholders.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-sources
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/sources
  prune: true
  # wait:false — this stage only declares HelmRepository CRs + the
  # cluster-versions ConfigMap, all applied (and substitutable) the moment it
  # reconciles. Waiting for every repo's index fetch to go Ready would let one
  # transient registry outage (even an app-only repo) keep sources NotReady and
  # stall the whole controllers->configs->observability->apps chain;
  # helm-controller already waits for each chart's own repo before pulling.
  wait: false
