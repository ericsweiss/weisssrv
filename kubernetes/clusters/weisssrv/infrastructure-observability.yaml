---
# Flux Kustomization: observability stack (Prometheus, Grafana, Loki, Alloy,
# exporters, dashboards). Sits between infrastructure-configs and apps in
# the reconciliation chain so that:
#   1. CRDs (ServiceMonitor, PodMonitor, PrometheusRule) are installed before
#      apps create ServiceMonitor resources via serviceMonitor.enabled: true.
#   2. ExternalSecrets work (ClusterSecretStore from configs is already up).
#   3. A failed observability deploy does NOT block the core infrastructure
#      chain (cert-manager, traefik, MetalLB) but DOES block all apps
#      (apps.yaml dependsOn infrastructure-observability).
#   4. Controller HelmReleases enable serviceMonitor.enabled. cert-manager guards
#      this with a .Capabilities check (silently skips if the CRD is absent), but
#      Traefik does NOT — it always emits the ServiceMonitor. So on a FRESH
#      bootstrap the monitoring.coreos.com CRDs (ServiceMonitor/PodMonitor/
#      PrometheusRule) must exist before the controllers stage; see docs/29
#      "Fresh bootstrap / disaster recovery" for the one-time CRD pre-apply.
#
# optional: false — same rationale as other stages: the ConfigMap is guaranteed
# to exist at this point. A missing ConfigMap here means a real bug.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-observability
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  dependsOn:
    - name: infrastructure-configs
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/observability
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
        optional: false
