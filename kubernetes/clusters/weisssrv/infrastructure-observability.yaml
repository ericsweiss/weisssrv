---
# Flux Kustomization: observability stack (Prometheus, Grafana, Loki, Alloy,
# exporters, dashboards).
#
# dependsOn infrastructure-configs, in parallel with apps: the monitoring CRDs
# come from the crds stage and the ClusterSecretStore from configs, so both are
# in place here. Keeping it off the apps chain means a failed observability
# upgrade blocks only this stage.
#
# optional: false — same rationale as the other stages: a missing
# cluster-versions ConfigMap here is a real fault, not a reason to render empty.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-observability
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  # Headroom over the slowest release this stage waits on
  # (kube-prometheus-stack, 15m).
  timeout: 25m
  dependsOn:
    - name: infrastructure-configs
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/observability
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
        optional: false
