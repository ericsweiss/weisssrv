---
# TLS certificates for the Hermes namespace. Per-host (not wildcard) and in the
# same namespace as the IngressRoutes that reference them (Traefik reads TLS
# Secrets only from the route's own namespace).

# External - agent.ericsweiss.com
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hermes-tls
  namespace: hermes
spec:
  secretName: hermes-ericsweiss-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "agent.${cluster_external_domain}"
  dnsNames:
    - "agent.${cluster_external_domain}"
  renewBefore: 720h

---
# Internal - agent.esweiss.com
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hermes-tls-internal
  namespace: hermes
spec:
  secretName: hermes-esweiss-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "agent.${cluster_internal_domain}"
  dnsNames:
    - "agent.${cluster_internal_domain}"
  renewBefore: 720h

---
# Internal - agent-api.esweiss.com (the gateway's OpenAI-compatible API
# server; consumed by the hermes-api IngressRoute).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hermes-api-tls
  namespace: hermes
spec:
  secretName: hermes-api-esweiss-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "agent-api.${cluster_internal_domain}"
  dnsNames:
    - "agent-api.${cluster_internal_domain}"
  renewBefore: 720h
