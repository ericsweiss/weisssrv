---
# Hermes Agent dashboard — external + internal IngressRoutes.
#
# SSO model: layered. The Authentik forward-auth (authentik-auth) middleware is
# the perimeter gate — only members of the Authentik `hermes-users` group ever
# reach the dashboard, and the default-deny NetworkPolicy admits only the
# Traefik namespace on :9119, so no path bypasses this middleware. Behind it
# the dashboard registers TWO of its own auth providers (its 0.0.0.0 bind is
# fail-closed — it will not start without at least one): Authentik OIDC
# (primary, silent for an existing Authentik session) and `basic` (break-glass)
# — see deployment.yaml + docs/37 §SSO. The Authentik objects are managed in
# terraform/authentik (docs/40). The internal route additionally scopes to
# LAN/Tailscale sources.

# External - agent.ericsweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes
  namespace: hermes
  annotations:
    external-dns.alpha.kubernetes.io/target: ericsweiss.com
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`agent.ericsweiss.com`)
      kind: Rule
      middlewares:
        - name: authentik-auth
          namespace: authentik
        - name: hsts-header
          namespace: traefik
      services:
        - name: hermes-dashboard
          port: 9119
  tls:
    secretName: hermes-ericsweiss-tls

---
# Internal - agent.esweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes-internal
  namespace: hermes
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`agent.esweiss.com`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: authentik-auth
          namespace: authentik
        - name: hsts-header
          namespace: traefik
      services:
        - name: hermes-dashboard
          port: 9119
  tls:
    secretName: hermes-esweiss-tls

---
# Internal - agent-api.esweiss.com -> the gateway's OpenAI-compatible API
# server (:8642). For machine clients on the LAN — first consumer is the Home
# Assistant Voice pipeline (Extended OpenAI Conversation, docs/37 §Voice
# assistant).
#
# Deliberately NO authentik-auth middleware: forward-auth answers an
# unauthenticated request with a 302 to a login page, which an OpenAI-protocol
# client can neither follow nor complete — it would break every caller. Auth
# is instead the API server's own MANDATORY bearer key (API_SERVER_KEY — the
# server refuses to start without one; /health is the sole keyless route),
# with lan-tailscale-only scoping the audience to LAN/Tailscale/pod sources.
# Internal-only: no external-dns annotation, no ericsweiss.com host.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes-api
  namespace: hermes
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`agent-api.esweiss.com`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: hermes-api
          port: 8642
  tls:
    secretName: hermes-api-esweiss-tls
