---
# Hermes Agent dashboard, external and internal IngressRoutes. Auth is the
# dashboard's own Authentik OIDC login rather than a forward-auth middleware,
# so Traefik passes straight through (docs/37 §SSO, docs/40).

# External - agent.ericsweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes
  namespace: hermes
  annotations:
    external-dns.alpha.kubernetes.io/target: ${cluster_external_domain}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`agent.${cluster_external_domain}`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
        - name: security-headers
          namespace: traefik
      services:
        - name: hermes-dashboard
          port: 9119
  tls:
    secretName: hermes-ericsweiss-tls

---
# Internal - agent.esweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes-internal
  namespace: hermes
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`agent.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: hermes-dashboard
          port: 9119
  tls:
    secretName: hermes-esweiss-tls

---
# CRITICAL: agent-api.esweiss.com serves the OpenAI-compatible API (:8642) to
# machine clients (docs/37 §Voice assistant). It carries no authentik-auth
# middleware, because forward-auth answers with a 302 an OpenAI-protocol client
# cannot follow. Auth is the API server's mandatory bearer key (API_SERVER_KEY,
# /health the sole keyless route), with lan-tailscale-only scoping the audience.
# Internal-only: no external-dns annotation, no ericsweiss.com host.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes-api
  namespace: hermes
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`agent-api.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: hermes-api
          port: 8642
  tls:
    secretName: hermes-api-esweiss-tls
