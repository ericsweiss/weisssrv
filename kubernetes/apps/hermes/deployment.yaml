---
# Hermes Agent (NousResearch) — one pod, three containers off two self-built
# images (docs/37):
#   * gateway   — `gateway run`, the always-on agent supervisor plus its
#                 OpenAI-compatible API server on :8642.
#   * dashboard — the FastAPI web UI on :9119, the surface at agent.*.
#   * camofox   — the anti-detection browser server on :9377.
# All three share /opt/data (the NFS PVC) and pod-localhost, mirroring
# upstream's compose bind-mount + host-network shape. Recreate strategy: the
# single RWO NFS volume must not be dual-mounted across a rolling update.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/part-of: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
        app.kubernetes.io/part-of: hermes
    spec:
      # No node affinity and no NAS toleration by design: the NAS agent's
      # esweiss.com/nas=true:PreferNoSchedule taint plus least-allocated scoring
      # already place this pod (the largest single memory reservation in the
      # general set) on the roomiest eligible node. modern CPU: the image
      # bundles a Node/Chromium/uv toolchain, so keep it off the Core2-era nodes.
      nodeSelector:
        esweiss.com/general: "true"
        esweiss.com/cpu: "modern"
      imagePullSecrets:
        - name: hermes-registry-pull
      # This is an s6-overlay image (like the LinuxServer.io *arr images in the
      # downloads namespace): /init starts as root, remaps the hermes user to
      # HERMES_UID/GID, chowns /opt/data, then drops every service to the hermes
      # user via s6-setuidgid. runAsNonRoot / drop-ALL / allowPrivilegeEscalation
      # false would break that privilege drop, so — matching the *arr precedent —
      # only the universally-safe subset is applied.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          # ClusterFirst pods resolve via the DNAT'd kube-dns ClusterIP; force a
          # fresh socket for glibc's parallel A/AAAA queries so the conntrack
          # DNAT-insert race can't cost a ~5s resolver stall. Kept in sync with
          # recipes/mealie.yaml and the *arr deployments.
          - name: single-request-reopen
      # Init container: prepares the shared NFS volume. Creates CODEX_HOME and
      # the camofox subdir, then upserts the GATEWAY-scope vars into
      # /opt/data/.env — the gateway's config loader reads that store and never
      # falls back to os.environ, so container env alone is invisible to it. The
      # upsert runs every start (an ESO rotation lands on the next one) and
      # leaves unlisted keys, e.g. dashboard-written ones, untouched. Runs
      # 1000:2000 to match the export's all_squash anon mapping.
      initContainers:
        - name: init-data
          image: busybox:${busybox_version}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /opt/data/.codex
              # camofox mounts this subdir (and only this subdir) — create it
              # here so the mount never depends on kubelet's subPath autocreate.
              mkdir -p /opt/data/.camofox
              touch /opt/data/.env
              # .env is a plaintext credential store; keep it off group/other.
              # all_squash means this does not isolate the containers from each
              # other — camofox's subPath mount is what does that.
              chmod 600 /opt/data/.env
              upsert() {
                sed -i "/^$1=/d" /opt/data/.env
                printf '%s=%s\n' "$1" "$2" >> /opt/data/.env
              }
              upsert DISCORD_BOT_TOKEN "$DISCORD_BOT_TOKEN"
              upsert DISCORD_ALLOWED_USERS "$DISCORD_ALLOWED_USERS"
              upsert CODEX_HOME "$CODEX_HOME"
              upsert CAMOFOX_URL "$CAMOFOX_URL"
              upsert HASS_URL "$HASS_URL"
              upsert HASS_TOKEN "$HASS_TOKEN"
              upsert OP_SERVICE_ACCOUNT_TOKEN "$OP_SERVICE_ACCOUNT_TOKEN"
          env:
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: discord-bot-token
            # Discord USER id(s) allowed to talk to the bot — identifiers,
            # not credentials (fine in git).
            - name: DISCORD_ALLOWED_USERS
              value: "237388029105405952"
            # Mirrors the containers' CODEX_HOME so the gateway config sees
            # the same path the CLI subprocesses use.
            - name: CODEX_HOME
              value: /opt/data/.codex
            # Camofox browser sidecar on pod-localhost. Upserted into .env, not
            # set as gateway container env — .env is the store the gateway
            # config and the tool-availability check both read.
            - name: CAMOFOX_URL
              value: http://127.0.0.1:9377
            # Home Assistant tool (docs/37 §Home Assistant): HASS_TOKEN's
            # presence auto-enables it. HASS_URL rides the AdGuard rewrite
            # home.esweiss.com -> Traefik .101 (post-DNAT traefik-namespace
            # egress rule in networkpolicy.yaml); that route carries no
            # forward-auth middleware, so bearer-token API calls reach HA.
            - name: HASS_URL
              value: https://home.esweiss.com
            - name: HASS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: hass-token
            # 1Password service-account token, mirrored into .env alongside the
            # gateway container env so `op run --env-file` paths also work.
            - name: OP_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: op-service-account-token
          securityContext:
            runAsUser: 1000
            runAsGroup: 2000
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
      containers:
        # ── Gateway: always-on agent supervisor ──────────────────────────
        - name: gateway
          # (hermes_version); built by the build-hermes-agent CI job. Pulled
          # from the internal registry host (AdGuard rewrite -> Traefik .101).
          image: registry.git.esweiss.com/eric/weisssrv/hermes-agent:${hermes_image_version}
          imagePullPolicy: IfNotPresent
          args: ["gateway", "run"]
          env:
            # Match the NFS export's anon mapping (all_squash anonuid=1000/
            # anongid=2000) so on-disk files land 1000:2000, same as the *arr
            # PUID/PGID convention. stage2-hook remaps the hermes user to these.
            - name: HERMES_UID
              value: "1000"
            - name: HERMES_GID
              value: "2000"
            - name: TZ
              value: America/Los_Angeles
            # Codex app-server runtime state (auth.json, config.toml, sessions)
            # on the NFS volume, so the subscription OAuth token from
            # `codex login` survives pod restarts and both containers see it.
            - name: CODEX_HOME
              value: /opt/data/.codex
            # Claude Code CLI (baked into the image) — the coding-task delegate
            # billed to the Claude Max subscription. The CLI presents this
            # long-lived OAuth token itself, so the credential never enters the
            # model context and no ANTHROPIC_API_KEY meters API billing. Config
            # dir on NFS so CLI state survives pod recreation.
            - name: CLAUDE_CONFIG_DIR
              value: /opt/data/.claude
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: claude-code-oauth-token
            # Discord adapter: the gateway activates it when the bot token is
            # present. Upstream is deny-all without an allowlist, so
            # DISCORD_ALLOWED_USERS pins the bot to the operator's Discord user
            # id (a public identifier, not a secret).
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: discord-bot-token
            - name: DISCORD_ALLOWED_USERS
              value: "237388029105405952"
            # Built-in OpenAI-compatible API server, in-process with
            # `gateway run`. GET /health is unauthenticated and served by the
            # gateway's own asyncio loop, so the probes below catch a hung
            # supervisor a crash-loop check cannot see; every functional route
            # requires API_SERVER_KEY (mandatory, even on loopback). :8642 is
            # exposed via the hermes-api Service + the agent-api IngressRoute
            # (docs/37 §Voice assistant); the NetworkPolicy admits only Traefik.
            - name: API_SERVER_ENABLED
              value: "true"
            # Kubelet probes connect to the pod IP, not loopback — bind all
            # interfaces (upstream's compose ships this exact binding).
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: api-server-key
            # 1Password service-account token for the 1Password skill (docs/37
            # §1Password). A real CONTAINER env var, unlike the other tokens: the
            # baked-in `op` CLI runs under the terminal tool, whose backend seeds
            # the child env from os.environ (code_execution strips *TOKEN* vars,
            # so the skill drives `op` via the terminal tool by design). Scoped
            # to the isolated Agent vault — never Homelab.
            - name: OP_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: op-service-account-token
          ports:
            - name: api
              containerPort: 8642
              protocol: TCP
          # startupProbe covers the slow s6 first boot on NFS (volume chown,
          # config migrate, skills sync) + API-server bind before liveness
          # arms — mirrors the dashboard's 10s x 30 budget.
          startupProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          # httpGet, NOT tcpSocket: a bare TCP connect completes in the kernel
          # accept path and can succeed while the event loop is wedged — exactly
          # the hang these probes catch. /health does no LLM work. Liveness
          # rides out transient stalls and restarts a truly hung gateway within
          # ~2.5 min; readiness de-rotates it from the hermes-api Service
          # (agent-api.esweiss.com) in the meantime.
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
        # ── Dashboard: user-facing FastAPI web UI on :9119 ───────────────
        - name: dashboard
          image: registry.git.esweiss.com/eric/weisssrv/hermes-agent:${hermes_image_version}
          imagePullPolicy: IfNotPresent
          # Bind 0.0.0.0 (upstream's compose defaults to 127.0.0.1) so Traefik
          # can reach the dashboard through the Service. Binding to a
          # non-loopback address engages the dashboard's fail-closed auth gate:
          # upstream refuses to start the dashboard on 0.0.0.0 unless a
          # dashboard auth provider is registered. The `self_hosted` Authentik
          # OIDC provider (env below) is the sole registered provider and the
          # only auth layer — no forward-auth middleware on the IngressRoutes;
          # the NetworkPolicy admits only the Traefik namespace on :9119
          # (docs/37 §SSO). 9119 is the image's default port, so no --port.
          args: ["dashboard", "--host", "0.0.0.0", "--no-open"]
          env:
            - name: HERMES_UID
              value: "1000"
            - name: HERMES_GID
              value: "2000"
            - name: TZ
              value: America/Los_Angeles
            # Codex app-server runtime state on the NFS volume (see gateway).
            - name: CODEX_HOME
              value: /opt/data/.codex
            # Claude Code delegate credential + config dir — same values as the
            # gateway (see the comment there) so an operator `kubectl exec` in
            # either container can run/verify `claude` with identical state.
            - name: CLAUDE_CONFIG_DIR
              value: /opt/data/.claude
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: claude-code-oauth-token
            # Dashboard auth is OIDC-only — the `self_hosted` generic-OIDC
            # provider is the sole registered one, so the middleware
            # auto-launches a silent Authentik redirect (docs/37 §SSO). The
            # dashboard reads these from real container env, unlike the gateway.
            # No PUBLIC_URL pin: redirect_uri is rebuilt per request from
            # X-Forwarded-Host/-Proto, so both hostnames round-trip to their own
            # /auth/callback (both are allowed URIs in
            # terraform/authentik/providers_oauth2.tf). uvicorn trusts forwarded
            # headers only from FORWARDED_ALLOW_IPS; "*" is safe because the
            # NetworkPolicy admits only Traefik to :9119 and Traefik rewrites
            # those headers.
            - name: FORWARDED_ALLOW_IPS
              value: "*"
            # Issuer = the `agent` application slug on the external authentik
            # host. From a pod that name resolves to the internal Traefik VIP
            # (AdGuard split-horizon), and kube-proxy DNATs it before policy
            # evaluation, so discovery/token/JWKS calls ride the
            # traefik-namespace egress rule, not a public-internet one.
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: https://auth.ericsweiss.com/application/o/agent/
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              value: hermes-dashboard
            # Non-empty secret => confidential client (PKCE stays on either
            # way). Same 1P field Terraform injects into authentik, so the two
            # sides can never disagree.
            - name: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: hermes-dashboard-oidc-client-secret
          ports:
            - name: http
              containerPort: 9119
              protocol: TCP
          # Bare TCP connect to the dashboard port, NOT an HTTP GET: a
          # listener-up check is sufficient health for this single-process
          # FastAPI dashboard and avoids coupling pod health to any specific
          # HTTP route or status code (the UI is a redirect-heavy SPA).
          # startupProbe covers the slow first boot (s6 cont-init: volume chown,
          # config migrate, skills sync).
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
        # ── Camofox: anti-detection browser server on :9377 ──────────────
        # jo-inc/camofox-browser — a Camoufox (hardened-Firefox) automation
        # server the gateway drives over 127.0.0.1. :9377 has no Service and no
        # ingress allow, so nothing else can reach it. Self-built image
        # (build-camofox-browser CI job, docker/camofox-browser/README.md); runs
        # as root because Xvfb and the Camoufox binary live under /root, and NFS
        # writes are all_squash'd to 1000:2000 anyway.
        - name: camofox
          image: registry.git.esweiss.com/eric/weisssrv/camofox-browser:${hermes_camofox_version}
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Los_Angeles
            # Profiles / cookies / traces on the shared NFS volume so browser
            # sessions survive pod recreation (defaults live under ~/.camofox
            # = /root/.camofox, which is ephemeral).
            - name: CAMOFOX_PROFILE_DIR
              value: /opt/data/.camofox/profiles
            - name: CAMOFOX_COOKIES_DIR
              value: /opt/data/.camofox/cookies
            - name: CAMOFOX_TRACES_DIR
              value: /opt/data/.camofox/traces
            # Crash reporting phones home (upstream defaults it ON —
            # `!== 'false'`); this is a private deployment, keep it off.
            - name: CAMOFOX_CRASH_REPORT_ENABLED
              value: "false"
            # Upstream defaults to 50 concurrent sessions — far more Firefox
            # than this pod's memory budget. 5 is plenty for one agent.
            - name: MAX_SESSIONS
              value: "5"
          ports:
            - name: camofox
              containerPort: 9377
              protocol: TCP
          # /health reports 503 while the browser is dead/recovering and
          # triggers its own warm-restart logic, so an httpGet (not tcpSocket)
          # is the honest liveness signal. startupProbe covers the first
          # Xvfb + Camoufox launch.
          startupProbe:
            httpGet:
              path: /health
              port: camofox
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: camofox
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # No readinessProbe: nothing routes through a Service to :9377 (the
          # gateway calls localhost), so readiness has nothing to gate.
          # Firefox memory scales with open tabs/sessions, not steady-state
          # history: the request covers the idle server plus one session (~1.25x
          # the observed peak) and the 2Gi limit caps a MAX_SESSIONS burst. VPA
          # is Off for this container (vpa.yaml), so the request is hand-measured
          # and must be revisited when usage changes. No CPU limit (docs/33).
          resources:
            requests:
              cpu: 100m
              memory: 448Mi
            limits:
              memory: 2Gi
          # Highest-risk container in the pod (it loads arbitrary web content).
          # Xvfb and the Camoufox sandbox need no capabilities, and this is not
          # an s6 image, so drop: ALL does not fight a privilege-drop init.
          # allowPrivilegeEscalation / readOnlyRootFilesystem stay unset: the
          # browser writes its runtime tree and may use the Firefox sandbox
          # helper. Add back a single capability if one proves required.
          securityContext:
            capabilities:
              drop: ["ALL"]
          # subPath, NOT the volume root: the shared volume also holds the
          # plaintext .env, .codex/auth.json and .claude/ — every delegated
          # credential the agent owns. Every legitimate camofox path (profiles,
          # cookies, traces) lives under .camofox, so this mount is sufficient.
          volumeMounts:
            - name: data
              subPath: .camofox
              mountPath: /opt/data/.camofox
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
