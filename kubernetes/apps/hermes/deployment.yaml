---
# Hermes Agent (docs/37): one pod, three containers — gateway (agent supervisor
# + OpenAI-compatible API :8642), dashboard (web UI :9119, agent.*), camofox
# (browser server :9377). Recreate: the RWO NFS PVC must not be dual-mounted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/part-of: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
        app.kubernetes.io/part-of: hermes
    spec:
      # No node affinity or NAS toleration: the NAS taint plus least-allocated
      # scoring already place this pod on the roomiest eligible node. modern CPU
      # because the image bundles a Node/Chromium/uv toolchain.
      nodeSelector:
        ${cluster_node_label_domain}/general: "true"
        ${cluster_node_label_domain}/cpu: "modern"
      imagePullSecrets:
        - name: hermes-registry-pull
      # s6-overlay image: /init starts as root to remap the hermes user and then
      # drops every service to it, so runAsNonRoot and drop-ALL are not set here
      # (same as the *arr images in the downloads namespace).
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          # ClusterFirst pod on the DNAT'd kube-dns path — fresh socket for the
          # second parallel A/AAAA query avoids the ~5s conntrack DNAT race.
          - name: single-request-reopen
      # Prepares the shared NFS volume and upserts the GATEWAY-scope vars into
      # /opt/data/.env — the gateway config loader reads that store only, never
      # os.environ. Runs 1000:2000 to match the export's all_squash mapping.
      initContainers:
        - name: init-data
          image: busybox:${busybox_version}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /opt/data/.codex
              # camofox mounts this subdir (and only this subdir) — create it
              # here so the mount never depends on kubelet's subPath autocreate.
              mkdir -p /opt/data/.camofox
              touch /opt/data/.env
              # .env is a plaintext credential store; keep it off group/other.
              # all_squash means this does not isolate the containers from each
              # other — camofox's subPath mount is what does that.
              chmod 600 /opt/data/.env
              upsert() {
                sed -i "/^$1=/d" /opt/data/.env
                printf '%s=%s\n' "$1" "$2" >> /opt/data/.env
              }
              # Dropped from the upsert list: remove what earlier starts wrote,
              # or a rotated service-account token lives on in .env forever.
              sed -i '/^OP_SERVICE_ACCOUNT_TOKEN=/d' /opt/data/.env
              upsert DISCORD_BOT_TOKEN "$DISCORD_BOT_TOKEN"
              upsert DISCORD_ALLOWED_USERS "$DISCORD_ALLOWED_USERS"
              upsert CODEX_HOME "$CODEX_HOME"
              upsert CAMOFOX_URL "$CAMOFOX_URL"
              upsert HASS_URL "$HASS_URL"
              upsert HASS_TOKEN "$HASS_TOKEN"
          env:
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: discord-bot-token
            # Discord USER id(s) allowed to talk to the bot — identifiers,
            # not credentials (fine in git).
            - name: DISCORD_ALLOWED_USERS
              value: "237388029105405952"
            # Mirrors the containers' CODEX_HOME so the gateway config sees
            # the same path the CLI subprocesses use.
            - name: CODEX_HOME
              value: /opt/data/.codex
            # Camofox browser sidecar on pod-localhost. Upserted into .env, not
            # set as gateway container env — .env is the store the gateway
            # config and the tool-availability check both read.
            - name: CAMOFOX_URL
              value: http://127.0.0.1:9377
            # Home Assistant tool (docs/37 §Home Assistant): HASS_TOKEN's
            # presence auto-enables it. HASS_URL rides the AdGuard rewrite to
            # Traefik .101, a route that carries no forward-auth middleware.
            - name: HASS_URL
              value: https://home.${cluster_internal_domain}
            - name: HASS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: hass-token
          securityContext:
            runAsUser: 1000
            runAsGroup: 2000
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
      containers:
        # ── Gateway: always-on agent supervisor ──────────────────────────
        - name: gateway
          # (hermes_version); built by the build-hermes-agent CI job. Pulled
          # from the internal registry host (AdGuard rewrite -> Traefik .101).
          image: registry.git.${cluster_internal_domain}/eric/weisssrv/hermes-agent:${hermes_image_version}
          imagePullPolicy: IfNotPresent
          args: ["gateway", "run"]
          env:
            # Match the NFS export's anon mapping (all_squash anonuid=1000/
            # anongid=2000) so on-disk files land 1000:2000, same as the *arr
            # PUID/PGID convention. stage2-hook remaps the hermes user to these.
            - name: HERMES_UID
              value: "1000"
            - name: HERMES_GID
              value: "2000"
            - name: TZ
              value: ${cluster_timezone}
            # Codex app-server runtime state (auth.json, config.toml, sessions)
            # on the NFS volume, so the subscription OAuth token from
            # `codex login` survives pod restarts and both containers see it.
            - name: CODEX_HOME
              value: /opt/data/.codex
            # Config dir on NFS so Claude Code CLI state survives recreation.
            - name: CLAUDE_CONFIG_DIR
              value: /opt/data/.claude
            # Coding delegate billed to the Claude Max subscription: the CLI
            # presents this OAuth token itself, so the credential never enters
            # the model context and no ANTHROPIC_API_KEY meters API billing.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: claude-code-oauth-token
            # Built-in OpenAI-compatible API server, in-process with
            # `gateway run`. GET /health is the only keyless route and the one
            # the probes below use; everything else requires API_SERVER_KEY.
            - name: API_SERVER_ENABLED
              value: "true"
            # Kubelet probes connect to the pod IP, not loopback — bind all
            # interfaces (upstream's compose ships this exact binding).
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: api-server-key
            # 1Password service-account token, scoped to the isolated Agent
            # vault and never Homelab (docs/37 §1Password). A real container env
            # var: `op` runs under the terminal tool, seeded from os.environ.
            - name: OP_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: op-service-account-token
          ports:
            - name: api
              containerPort: 8642
              protocol: TCP
          # startupProbe covers the slow s6 first boot on NFS (volume chown,
          # config migrate, skills sync) + API-server bind before liveness
          # arms — mirrors the dashboard's 10s x 30 budget.
          startupProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          # httpGet, NOT tcpSocket: a bare TCP connect succeeds while the event
          # loop is wedged, which is the hang these probes catch. Readiness
          # de-rotates the pod from the hermes-api Service meanwhile.
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          # Hand-set and binding: vpa.yaml is RequestsOnly and its `maxAllowed`
          # tracks this limit — raise both together (docs/33). Far above the
          # 475Mi 30d peak because it forks the CLIs. No CPU limit (docs/33).
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
        # ── Dashboard: user-facing FastAPI web UI on :9119 ───────────────
        - name: dashboard
          image: registry.git.${cluster_internal_domain}/eric/weisssrv/hermes-agent:${hermes_image_version}
          imagePullPolicy: IfNotPresent
          # Bind 0.0.0.0 so Traefik reaches the dashboard through the Service.
          # A non-loopback bind engages the fail-closed auth gate: upstream
          # refuses to start without a registered auth provider (docs/37 §SSO).
          args: ["dashboard", "--host", "0.0.0.0", "--no-open"]
          env:
            - name: HERMES_UID
              value: "1000"
            - name: HERMES_GID
              value: "2000"
            - name: TZ
              value: ${cluster_timezone}
            # Codex app-server runtime state on the NFS volume (see gateway).
            - name: CODEX_HOME
              value: /opt/data/.codex
            # Config dir only, so an operator `kubectl exec` here sees the same
            # CLI state. The OAuth token stays out of the internet-facing
            # container: the gateway is what forks the CLI.
            - name: CLAUDE_CONFIG_DIR
              value: /opt/data/.claude
            # Dashboard auth is OIDC-only, from real container env (unlike the
            # gateway). redirect_uri rebuilds from Traefik's forwarded headers,
            # trusted via dashboard.trusted_proxies (docs/37 §One-time operator setup).
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: https://auth.${cluster_external_domain}/application/o/agent/
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              value: hermes-dashboard
            # Non-empty secret => confidential client (PKCE stays on either
            # way). Same 1P field Terraform injects into authentik, so the two
            # sides can never disagree.
            - name: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: hermes-dashboard-oidc-client-secret
          ports:
            - name: http
              containerPort: 9119
              protocol: TCP
          # tcpSocket, NOT httpGet: a listener-up check is sufficient health for
          # this single-process FastAPI dashboard and avoids coupling pod health
          # to a redirect-heavy SPA's routes. startupProbe covers the s6 boot.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # Hand-set and binding: vpa.yaml is RequestsOnly and its `maxAllowed`
          # tracks this limit — raise both together (docs/33). ~2.4x the 1059Mi
          # 30d working-set peak. No CPU limit (docs/33).
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 2560Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
        # Camofox: a Camoufox automation server the gateway drives over
        # 127.0.0.1:9377; no Service, no ingress allow, runs as root.
        # Self-built: docker/camofox-browser/README.md.
        - name: camofox
          image: registry.git.${cluster_internal_domain}/eric/weisssrv/camofox-browser:${hermes_camofox_version}
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: ${cluster_timezone}
            # Profiles / cookies / traces on the shared NFS volume so browser
            # sessions survive pod recreation (defaults live under ~/.camofox
            # = /root/.camofox, which is ephemeral).
            - name: CAMOFOX_PROFILE_DIR
              value: /opt/data/.camofox/profiles
            - name: CAMOFOX_COOKIES_DIR
              value: /opt/data/.camofox/cookies
            - name: CAMOFOX_TRACES_DIR
              value: /opt/data/.camofox/traces
            # Crash reporting phones home (upstream defaults it ON —
            # `!== 'false'`); this is a private deployment, keep it off.
            - name: CAMOFOX_CRASH_REPORT_ENABLED
              value: "false"
            # Upstream defaults to 50 concurrent sessions — far more Firefox
            # than this pod's memory budget. 5 is plenty for one agent.
            - name: MAX_SESSIONS
              value: "5"
          ports:
            - name: camofox
              containerPort: 9377
              protocol: TCP
          # /health reports 503 while the browser is dead or recovering and
          # drives its own warm restart, so httpGet is the honest liveness
          # signal. startupProbe covers the first Xvfb + Camoufox launch.
          startupProbe:
            httpGet:
              path: /health
              port: camofox
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: camofox
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # No readinessProbe: nothing routes to :9377 through a Service. VPA
          # Off and hand-sized: 1Gi covers idle Firefox and the 3Gi limit caps
          # a MAX_SESSIONS burst (~2.9x the 1054Mi 30d peak). No CPU limit.
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 3Gi
          # Highest-risk container in the pod (it loads arbitrary web content).
          # Not an s6 image: no privilege-drop init to break, so drop: ALL is safe.
          # readOnlyRootFilesystem stays unset: the browser writes its tree.
          securityContext:
            capabilities:
              drop: ["ALL"]
          # subPath, NOT the volume root: the shared volume also holds the
          # plaintext .env, .codex/auth.json and .claude/ — every delegated
          # credential the agent owns. Camofox needs only .camofox.
          volumeMounts:
            - name: data
              subPath: .camofox
              mountPath: /opt/data/.camofox
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
