---
# Hermes Agent (NousResearch) — one pod, two containers off the same
# self-built image, mirroring upstream's docker-compose semantics:
#   * gateway   — `gateway run`: the always-on agent supervisor (messaging
#                 platform adapters register here; runs even with zero
#                 platforms configured — see docs/37). Its LLM engine is the
#                 bundled Codex app-server runtime: Hermes delegates OpenAI/Codex
#                 turns to the `codex` CLI (baked into the image) over JSON-RPC
#                 stdio, authenticated by a one-time `codex login` whose OAuth
#                 token persists in CODEX_HOME on the NFS volume (docs/37).
#   * dashboard — the FastAPI web UI (config, API keys, session monitoring)
#                 on :9119, the user-facing surface at agent.*.
# Both containers share /opt/data (the NFS PVC) exactly as the compose file
# bind-mounts ~/.hermes into both services, and — being in one pod — share
# localhost, so the dashboard reaches the gateway over 127.0.0.1 just like the
# compose `network_mode: host` setup. A third container — the camofox
# anti-detection browser server (:9377, see its section below) — rides in the
# same pod for the same reason: the gateway drives it over 127.0.0.1
# (CAMOFOX_URL) and it shares /opt/data for persistent profiles/cookies.
# strategy: Recreate because the single RWO NFS volume must not be
# dual-mounted across a rolling update.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/part-of: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
        app.kubernetes.io/part-of: hermes
    spec:
      # NO node affinity and no NAS toleration, deliberately.
      #
      # This pod is the largest single memory reservation in the general
      # workload set (~1.6 GiB across its containers), so the thing that matters
      # is that it does NOT land on a 14-15 GiB compute host, where it is the
      # difference between serving guests and paging them to swap. That is
      # already handled without a preference here: the NAS agent carries
      # esweiss.com/nas=true:PreferNoSchedule, and the scheduler's own
      # least-allocated scoring sends this pod to whichever eligible node has the
      # most room — pve-prec-01 today, which sits at ~31% of memory requested
      # with ~18 GiB free.
      #
      # An earlier revision preferred the NAS explicitly. That was dropped once
      # it was running comfortably on prec-01: a preference that has to be
      # re-satisfied on every reschedule buys a pod restart to move a workload
      # that is already well placed.
      #
      # modern CPU: the image bundles a Node/Chromium/uv toolchain — keep it off
      # the Core2-era legacy nodes.
      nodeSelector:
        esweiss.com/general: "true"
        esweiss.com/cpu: "modern"
      imagePullSecrets:
        - name: hermes-registry-pull
      # This is an s6-overlay image (like the LinuxServer.io *arr images in the
      # downloads namespace): /init starts as root, remaps the hermes user to
      # HERMES_UID/GID, chowns /opt/data, then drops every service to the hermes
      # user via s6-setuidgid. runAsNonRoot / drop-ALL / allowPrivilegeEscalation
      # false would break that privilege drop, so — matching the *arr precedent —
      # only the universally-safe subset is applied.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          # ClusterFirst pods resolve via the DNAT'd kube-dns ClusterIP; force a
          # fresh socket for glibc's parallel A/AAAA queries so the conntrack
          # DNAT-insert race can't cost a ~5s resolver stall. Kept in sync with
          # recipes/mealie.yaml and the *arr deployments.
          - name: single-request-reopen
      # Init container: prepares the shared NFS volume before the gateway and
      # dashboard start.
      #  1. mkdir -p CODEX_HOME (/opt/data/.codex): the dir does not exist on a
      #     freshly-provisioned NFS export, so `codex login` fails in either
      #     container until it is created (previously a manual mkdir);
      #     idempotent no-op on later boots.
      #  2. Upserts the GATEWAY-scope vars into /opt/data/.env. Root cause: the
      #     gateway's config loader (_getenv) prefers the active profile's
      #     secret scope and never falls back to os.environ — container env
      #     vars are invisible to gateway config, and /opt/data/.env is the
      #     operative store. The remove-then-append upsert runs on every pod
      #     start, so an ESO rotation of discord-bot-token propagates on the
      #     next start while the NFS-backed file keeps values between them.
      #     Keys not listed here (e.g. ones written via the dashboard UI, like
      #     DISCORD_HOME_CHANNEL*) are left untouched. The dashboard's OIDC
      #     vars are deliberately NOT synced — the dashboard reads real
      #     container env (see the dashboard container below).
      # Runs as 1000:2000 (HERMES_UID/GID) — the export's all_squash maps every
      # write to anonuid=1000/anongid=2000 (the same ownership the app's s6
      # init expects).
      initContainers:
        - name: init-data
          image: busybox:${busybox_version}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /opt/data/.codex
              # camofox mounts this subdir (and only this subdir) — create it
              # here so the mount never depends on kubelet's subPath autocreate.
              mkdir -p /opt/data/.camofox
              touch /opt/data/.env
              # .env is a plaintext credential store; keep it off group/other.
              # This does not isolate the containers from each other (the NFS
              # export is all_squash, so every container's writes and reads map
              # to the same 1000:2000) — the camofox subPath mount is what
              # actually keeps the browser away from it.
              chmod 600 /opt/data/.env
              upsert() {
                sed -i "/^$1=/d" /opt/data/.env
                printf '%s=%s\n' "$1" "$2" >> /opt/data/.env
              }
              upsert DISCORD_BOT_TOKEN "$DISCORD_BOT_TOKEN"
              upsert DISCORD_ALLOWED_USERS "$DISCORD_ALLOWED_USERS"
              upsert CODEX_HOME "$CODEX_HOME"
              upsert CAMOFOX_URL "$CAMOFOX_URL"
              upsert HASS_URL "$HASS_URL"
              upsert HASS_TOKEN "$HASS_TOKEN"
              upsert OP_SERVICE_ACCOUNT_TOKEN "$OP_SERVICE_ACCOUNT_TOKEN"
          env:
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: discord-bot-token
            # Discord USER id(s) allowed to talk to the bot — identifiers,
            # not credentials (fine in git).
            - name: DISCORD_ALLOWED_USERS
              value: "237388029105405952"
            # Mirrors the containers' CODEX_HOME so the gateway config sees
            # the same path the CLI subprocesses use.
            - name: CODEX_HOME
              value: /opt/data/.codex
            # Camofox browser sidecar (same pod, shared localhost — see the
            # camofox container below). Upserted into .env, NOT set as gateway
            # container env: gateway config only sees the profile scope /
            # os.environ AFTER load_hermes_dotenv() re-loads .env with
            # override, so .env is the reliable path (and the tool-availability
            # check reads the same store).
            - name: CAMOFOX_URL
              value: http://127.0.0.1:9377
            # Home Assistant tool (docs/37 §Home Assistant). HASS_TOKEN's
            # presence auto-enables the homeassistant tool; HASS_URL rides the
            # AdGuard rewrite home.esweiss.com -> Traefik .101 (post-DNAT
            # traefik-namespace egress rule in networkpolicy.yaml). The
            # home.esweiss.com IngressRoute carries no forward-auth middleware
            # (verified: home-assistant-headers + lan-tailscale-only +
            # hsts-header only, and the pod CIDR is in lan-tailscale-only's
            # allowlist), so bearer-token API calls pass straight to HA.
            - name: HASS_URL
              value: https://home.esweiss.com
            - name: HASS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: hass-token
            # 1Password service-account token, upserted into /opt/data/.env as a
            # belt-and-braces companion to the gateway container env (see the
            # gateway env comment). Enables `op run --env-file`/any .env-sourcing
            # path in the 1Password skill.
            - name: OP_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: op-service-account-token
          securityContext:
            runAsUser: 1000
            runAsGroup: 2000
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
      containers:
        # ── Gateway: always-on agent supervisor ──────────────────────────
        - name: gateway
          # (hermes_version); built by the build-hermes-agent CI job. Pulled
          # from the internal registry host (AdGuard rewrite -> Traefik .101).
          image: registry.git.esweiss.com/eric/weisssrv/hermes-agent:${hermes_image_version}
          imagePullPolicy: IfNotPresent
          args: ["gateway", "run"]
          env:
            # Match the NFS export's anon mapping (all_squash anonuid=1000/
            # anongid=2000) so on-disk files land 1000:2000, same as the *arr
            # PUID/PGID convention. stage2-hook remaps the hermes user to these.
            - name: HERMES_UID
              value: "1000"
            - name: HERMES_GID
              value: "2000"
            - name: TZ
              value: America/Los_Angeles
            # Codex app-server runtime state (auth.json from `codex login`,
            # config.toml, sessions) lives here. Pointing CODEX_HOME at the NFS
            # volume makes the ChatGPT-subscription OAuth token survive pod
            # restarts — the container HOME is /opt/data too, but we set this
            # explicitly so the persisted path is unambiguous. Both containers
            # share it (one pod, one PVC) so the operator can `codex login` in
            # either and Hermes finds the token.
            - name: CODEX_HOME
              value: /opt/data/.codex
            # Claude Code CLI (baked into the image alongside Codex) — the
            # coding-task delegate billed to the Claude Max SUBSCRIPTION.
            # Hermes invokes headless `claude -p` runs via its terminal tool /
            # bundled claude-code skill; the CLI itself presents this
            # long-lived OAuth token (`claude setup-token`, ESO-sourced from
            # the Hermes Secrets 1P item), so the credential never enters
            # Hermes' model context and no ANTHROPIC_API_KEY exists to
            # accidentally meter API billing. Config dir pinned to the NFS
            # volume so CLI state (settings, session history) survives pod
            # recreation, mirroring CODEX_HOME above.
            - name: CLAUDE_CONFIG_DIR
              value: /opt/data/.claude
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: claude-code-oauth-token
            # Discord messaging platform: the gateway activates an adapter when
            # its bot token is present in the environment. Token via ESO
            # (1P Hermes Secrets / discord-bot-token — the bot from the user's
            # Discord Developer Portal app, Message Content + Server Members
            # intents ON). Upstream is DENY-ALL without an allowlist:
            # DISCORD_ALLOWED_USERS pins the bot to exactly the operator's
            # Discord user id (a public identifier, not a secret). Discord
            # REST + gateway WSS both ride :443, already permitted by the
            # egress NetworkPolicy.
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: discord-bot-token
            - name: DISCORD_ALLOWED_USERS
              value: "237388029105405952"
            # Built-in OpenAI-compatible API server (runs in-process with
            # `gateway run`) — the gateway's health surface AND a serving
            # endpoint: GET /health is unauthenticated and is served by the
            # gateway's own asyncio loop, so the probes below catch a hung
            # supervisor (s6 PID1 up, agent stalled) that a process-exit
            # crash-loop check cannot see. Every functional route requires the
            # bearer key (API_SERVER_KEY is mandatory — the server refuses to
            # start without it, even on loopback). :8642 is exposed via the
            # hermes-api Service + the agent-api.esweiss.com IngressRoute
            # (LAN/Tailscale-only; for the Home Assistant Voice pipeline —
            # docs/37 §Voice assistant) and the NetworkPolicy admits only
            # Traefik to it. Kubelet probes are node-local and bypass
            # NetworkPolicy — the same path the dashboard's existing probes
            # already rely on. Env-only enablement (upstream has no CLI
            # flag/config key), so args stay unchanged.
            - name: API_SERVER_ENABLED
              value: "true"
            # Kubelet probes connect to the pod IP, not loopback — bind all
            # interfaces (upstream's compose ships this exact binding).
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: api-server-key
            # 1Password service-account token for the first-party 1Password skill
            # (docs/37 §1Password). This one IS a gateway CONTAINER env var — not
            # only a .env value like the other tokens — because the baked-in `op`
            # CLI runs as a subprocess of the gateway's TERMINAL tool, whose
            # backend seeds the child env from os.environ (tools/environments/
            # local.py `_make_run_env`). OP_SERVICE_ACCOUNT_TOKEN is not in that
            # backend's name-based blocklist and matches no internal-secret
            # pattern, so it passes through and `op` authenticates. (The
            # code_execution tool strips any *TOKEN* var by substring, so the
            # skill drives `op` via the terminal tool by design.) The token is
            # scoped to the isolated Agent vault, so a delegate/subprocess that
            # inherits it can reach only that vault — never Homelab. Also upserted
            # into /opt/data/.env by the init container (belt-and-braces for
            # `op run --env-file` / any .env-sourcing path).
            - name: OP_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: op-service-account-token
          ports:
            - name: api
              containerPort: 8642
              protocol: TCP
          # startupProbe covers the slow s6 first boot on NFS (volume chown,
          # config migrate, skills sync) + API-server bind before liveness
          # arms — mirrors the dashboard's 10s x 30 budget.
          startupProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          # httpGet, NOT tcpSocket: a bare TCP connect completes in the kernel
          # accept path and can succeed while the app's event loop is wedged —
          # exactly the hang this probe exists to catch. /health does no LLM
          # work and answers in ms whenever the loop is servicing requests;
          # 5 x 30s rides out transient loop stalls (a briefly CPU-bound tool
          # step) while restarting a truly hung gateway within ~2.5 min.
          # Deliberately no readinessProbe: the gateway serves no
          # Service-routed traffic, so readiness gating has nothing to gate.
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
        # ── Dashboard: user-facing FastAPI web UI on :9119 ───────────────
        - name: dashboard
          image: registry.git.esweiss.com/eric/weisssrv/hermes-agent:${hermes_image_version}
          imagePullPolicy: IfNotPresent
          # Bind 0.0.0.0 (upstream's compose defaults to 127.0.0.1) so Traefik
          # can reach the dashboard through the Service. Binding to a
          # non-loopback address engages the dashboard's fail-closed auth gate:
          # upstream refuses to start the dashboard on 0.0.0.0 unless a
          # dashboard auth provider is registered. The `self_hosted` Authentik
          # OIDC provider (env below) is the sole registered provider and the
          # only auth layer — no forward-auth middleware on the IngressRoutes;
          # the NetworkPolicy admits only the Traefik namespace on :9119
          # (docs/37 §SSO). 9119 is the image's default port, so no --port.
          args: ["dashboard", "--host", "0.0.0.0", "--no-open"]
          env:
            - name: HERMES_UID
              value: "1000"
            - name: HERMES_GID
              value: "2000"
            - name: TZ
              value: America/Los_Angeles
            # Codex app-server runtime state on the NFS volume (see gateway).
            - name: CODEX_HOME
              value: /opt/data/.codex
            # Claude Code delegate credential + config dir — same values as the
            # gateway (see the comment there) so an operator `kubectl exec` in
            # either container can run/verify `claude` with identical state.
            - name: CLAUDE_CONFIG_DIR
              value: /opt/data/.claude
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: claude-code-oauth-token
            # Dashboard auth is OIDC-ONLY (user decision 2026-07-19): the
            # `basic` password provider is deliberately NOT registered. With
            # exactly one session provider the auth middleware AUTO-LAUNCHES
            # the login flow — for OIDC that is the intended silent-SSO
            # redirect through Authentik (no chooser click, no password
            # prompt; a live Authentik session makes it invisible). The old
            # dual-provider chooser existed only because auto-launch on a
            # password-only provider 500s; with OIDC that hazard is gone.
            # Break-glass if Authentik is down: the dashboard UI is
            # unreachable (by design — Authentik-down takes out most SSO
            # apps anyway); operate via `kubectl exec ... hermes` (CLI) or
            # re-add the HERMES_DASHBOARD_BASIC_AUTH_* env trio (values
            # still on the 1P item) in an emergency revert.
            # Authentik OIDC SSO — the `self_hosted` generic-OIDC dashboard
            # auth provider (docs/37 §SSO). The dashboard reads these from real
            # container env (env wins over config.yaml) — unlike the gateway,
            # whose config only sees /opt/data/.env (see the initContainer).
            # No PUBLIC_URL pin: the dashboard reconstructs its redirect_uri
            # per-request from X-Forwarded-Host/-Proto (uvicorn proxy_headers),
            # so each hostname round-trips to its own /auth/callback — both are
            # strict allowed URIs on the Terraform-managed authentik provider
            # (terraform/authentik/providers_oauth2.tf, docs/40). uvicorn only
            # trusts forwarded headers from FORWARDED_ALLOW_IPS; "*" is safe
            # here because the NetworkPolicy admits only Traefik to :9119 and
            # Traefik overwrites those headers itself.
            - name: FORWARDED_ALLOW_IPS
              value: "*"
            # Issuer = the `agent` application slug on the authentik host. From a
            # pod, auth.ericsweiss.com resolves INTERNALLY to the Traefik VIP .101
            # (AdGuard split-horizon rewrite; the WAN/Cloudflare path 403s
            # non-browser user agents), and kube-proxy DNATs that VIP to a Traefik
            # pod before NetworkPolicy evaluation — so OIDC discovery
            # ({issuer}/.well-known/openid-configuration) + token/JWKS calls ride
            # the traefik-namespace :443 egress rule (allow-egress-hermes,
            # networkpolicy.yaml), NOT a public-internet egress rule.
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: https://auth.ericsweiss.com/application/o/agent/
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              value: hermes-dashboard
            # Non-empty secret => confidential client (PKCE stays on either
            # way). Same 1P field Terraform injects into authentik, so the two
            # sides can never disagree.
            - name: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: hermes-dashboard-oidc-client-secret
          ports:
            - name: http
              containerPort: 9119
              protocol: TCP
          # Bare TCP connect to the dashboard port, NOT an HTTP GET: a
          # listener-up check is sufficient health for this single-process
          # FastAPI dashboard and avoids coupling pod health to any specific
          # HTTP route or status code (the UI is a redirect-heavy SPA).
          # startupProbe covers the slow first boot (s6 cont-init: volume chown,
          # config migrate, skills sync).
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
        # ── Camofox: anti-detection browser server on :9377 ──────────────
        # jo-inc/camofox-browser — a Camoufox (hardened-Firefox) automation
        # server that Hermes' camofox browser tool drives over HTTP. Same-pod
        # sidecar so the gateway reaches it on 127.0.0.1 (CAMOFOX_URL, upserted
        # into /opt/data/.env by the init container); :9377 has no Service and
        # no ingress allow, so nothing else can drive the browser. Self-built
        # image (upstream publishes none) — build-camofox-browser CI job,
        # docker/camofox-browser/README.md. Runs as root (upstream image has no
        # USER directive; Xvfb + the baked Camoufox binary live under /root) —
        # NFS writes are all_squash'd to 1000:2000 like every other container
        # here.
        - name: camofox
          image: registry.git.esweiss.com/eric/weisssrv/camofox-browser:${hermes_camofox_version}
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Los_Angeles
            # Profiles / cookies / traces on the shared NFS volume so browser
            # sessions survive pod recreation (defaults live under ~/.camofox
            # = /root/.camofox, which is ephemeral).
            - name: CAMOFOX_PROFILE_DIR
              value: /opt/data/.camofox/profiles
            - name: CAMOFOX_COOKIES_DIR
              value: /opt/data/.camofox/cookies
            - name: CAMOFOX_TRACES_DIR
              value: /opt/data/.camofox/traces
            # Crash reporting phones home (upstream defaults it ON —
            # `!== 'false'`); this is a private deployment, keep it off.
            - name: CAMOFOX_CRASH_REPORT_ENABLED
              value: "false"
            # Upstream defaults to 50 concurrent sessions — far more Firefox
            # than this pod's memory budget. 5 is plenty for one agent.
            - name: MAX_SESSIONS
              value: "5"
          ports:
            - name: camofox
              containerPort: 9377
              protocol: TCP
          # /health reports 503 while the browser is dead/recovering and
          # triggers its own warm-restart logic, so an httpGet (not tcpSocket)
          # is the honest liveness signal. startupProbe covers the first
          # Xvfb + Camoufox launch.
          startupProbe:
            httpGet:
              path: /health
              port: camofox
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: camofox
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # No readinessProbe: nothing routes through a Service to :9377 (the
          # gateway calls localhost), so readiness has nothing to gate.
          # Firefox memory scales with open tabs/sessions, not steady-state
          # history — request covers the idle server + one session, the 2Gi
          # limit caps a MAX_SESSIONS burst (VPA is Off for this container,
          # see vpa.yaml). No CPU limit (repo policy — docs/33).
          # 896Mi, not the original 512Mi: the container has never been observed
          # BELOW its old request (7d max 839Mi), so the scheduler was
          # under-reserving ~300Mi on whichever node hermes lands on and the pod
          # sat permanently in the worst eviction rank. Excluding a container
          # from the VPA means its number has to be re-measured by hand.
          resources:
            requests:
              cpu: 100m
              memory: 896Mi
            limits:
              memory: 2Gi
          # Hardening for the highest-risk container in the pod (it loads
          # arbitrary attacker-influenced web content). Drop the runtime's
          # default capability set — Xvfb + the Camoufox/Firefox namespace
          # sandbox need no Linux capabilities beyond ordinary root file ops.
          # Unlike gateway/dashboard this is NOT an s6 image, so a cap drop does
          # not fight a privilege-drop init. allowPrivilegeEscalation /
          # readOnlyRootFilesystem are deliberately left unset: the browser
          # writes its runtime tree (/root, Xvfb sockets, /tmp) and may use the
          # Firefox sandbox helper, so a read-only rootfs / no-setuid would risk
          # breaking launch. If a specific cap turns out to be required, add back
          # only that one (mirroring wg-easy's NET_ADMIN pattern).
          securityContext:
            capabilities:
              drop: ["ALL"]
          # subPath, NOT the volume root: the shared volume also holds the
          # plaintext /opt/data/.env (Discord/HA/1Password tokens), .codex/
          # auth.json and .claude/ — every delegated credential the agent owns.
          # A renderer/IPC escape in the one container that loads arbitrary
          # attacker-influenced web content would otherwise read them all in one
          # go. Its own env keeps every legitimate path (profiles, cookies,
          # traces) under .camofox, so this mount is exactly what it needs.
          volumeMounts:
            - name: data
              subPath: .camofox
              mountPath: /opt/data/.camofox
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
