---
# VPA Initial for the hermes Deployment. RequestsOnly throughout: interactive
# and idle-heavy, so a rescaled limit would be sized off the quiet baseline and
# OOM the next session. Caps track deployment.yaml's limits (docs/33).
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: hermes
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: hermes}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # Off: Firefox memory scales with the tabs/sessions the agent opens, not
      # with usage history, so a percentile estimate under-provisions cold start
      # and burst. Hand-sized request/limit live in deployment.yaml.
      - containerName: camofox
        mode: "Off"
      # Off: the "*" floor below would raise this one-shot initContainer's
      # hand-sized 8Mi request to 128Mi on every restart.
      - containerName: init-data
        mode: "Off"
      # maxAllowed.memory == the dashboard's 2560Mi limit in deployment.yaml.
      # minAllowed floors the request at the interactive working set (~1Gi once
      # a chat opens), not the ~138Mi idle baseline the recommender measures.
      - containerName: dashboard
        controlledValues: RequestsOnly
        minAllowed: {cpu: 100m, memory: 768Mi}
        maxAllowed: {cpu: 2, memory: 2560Mi}
        controlledResources: [cpu, memory]
      # maxAllowed.memory == the gateway's 2Gi limit in deployment.yaml. Same
      # interactive-floor reasoning: it forks the Codex and Claude Code CLIs, so
      # its footprint tracks the task in flight, not the measured history.
      - containerName: gateway
        controlledValues: RequestsOnly
        minAllowed: {cpu: 100m, memory: 512Mi}
        maxAllowed: {cpu: 2, memory: 2Gi}
        controlledResources: [cpu, memory]
      # Catch-all so a container added later cannot inherit the
      # RequestsAndLimits default.
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 25m, memory: 128Mi}
        maxAllowed: {cpu: 2, memory: 2Gi}
        controlledResources: [cpu, memory]
