---
# VPA: Initial for the hermes Deployment — resize CPU+memory on natural pod
# restarts (single stateless-scheduling workload; no HPA owns CPU). Applies to
# the gateway + dashboard containers (containerName "*"). Bounded so a runaway
# agent session can't request the whole node.
#
# The camofox browser container is EXCLUDED (mode Off): Firefox memory scales
# with however many tabs/sessions the agent happens to open, not with usage
# history, so a percentile estimate would shrink its request below cold-start
# needs and under-provision burst headroom. Its hand-sized request/limit live
# in deployment.yaml.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: hermes
  namespace: hermes
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: hermes}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      - containerName: camofox
        mode: "Off"
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 128Mi}
        maxAllowed: {cpu: 2, memory: 2Gi}
        controlledResources: [cpu, memory]
