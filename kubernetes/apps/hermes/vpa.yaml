---
# VPA: Initial for the hermes Deployment — resize CPU+memory on natural pod
# restarts (no HPA owns CPU here).
#
# `controlledValues: RequestsOnly` on every managed container: limits are
# hand-set in deployment.yaml and the VPA may not touch them. This workload is
# interactive and idle-heavy, so on RequestsAndLimits the recommender sizes the
# request off the quiet baseline and scales the *limit* down with it, and the
# next active session OOMKills — which `Initial` cannot undo, since it applies
# only at pod admission while an OOM restarts the container in place.
# Each `maxAllowed` memory tracks its container's manifest limit exactly, so a
# capped recommendation can never exceed the ceiling the pod is admitted
# against — raising one means raising both, in the same commit. `minAllowed`
# floors the request at the interactive working set rather than the idle
# baseline. Rationale: docs/33 § Limit oscillation.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: hermes
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: hermes}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # Off: Firefox memory scales with the tabs/sessions the agent opens, not
      # with usage history, so a percentile estimate under-provisions cold start
      # and burst. Hand-sized request/limit live in deployment.yaml.
      - containerName: camofox
        mode: "Off"
      # Off: the "*" floor below would ~5x this one-shot initContainer's
      # hand-sized 8Mi request on every restart.
      - containerName: init-data
        mode: "Off"
      # maxAllowed.memory == the dashboard's 2560Mi limit in deployment.yaml.
      # minAllowed is the interactive floor: the recommender only ever measures
      # the idle baseline (~138Mi), and reserving that for a container that
      # needs ~1Gi the moment a chat opens is what OOMKilled it (!227).
      - containerName: dashboard
        controlledValues: RequestsOnly
        minAllowed: {cpu: 100m, memory: 768Mi}
        maxAllowed: {cpu: 2, memory: 2560Mi}
        controlledResources: [cpu, memory]
      # maxAllowed.memory == the gateway's 2Gi limit in deployment.yaml. Same
      # interactive-floor reasoning: it forks the Codex and Claude Code CLIs, so
      # its footprint tracks the task in flight, not the measured history.
      - containerName: gateway
        controlledValues: RequestsOnly
        minAllowed: {cpu: 100m, memory: 512Mi}
        maxAllowed: {cpu: 2, memory: 2Gi}
        controlledResources: [cpu, memory]
      # Catch-all so a container added later cannot inherit the
      # RequestsAndLimits default.
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 25m, memory: 128Mi}
        maxAllowed: {cpu: 2, memory: 2Gi}
        controlledResources: [cpu, memory]
