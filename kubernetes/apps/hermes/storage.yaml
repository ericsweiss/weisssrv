---
# NFS-backed persistent state for Hermes Agent (config, API keys, sessions,
# skills, memories -> /opt/data in the container). Lives on the encrypted
# ssd/appdata dataset via the appdata NFS export; captured by the nightly
# ssd/appdata -> archive raw-ZFS replication (no SRC_LIST edit needed — it is a
# child of an existing backup root). The export uses all_squash,anonuid=1000,
# anongid=2000, so every container write maps to 1000:2000 on the NAS
# regardless of the in-container UID; the /appdata/hermes subdir is created +
# owned 1000:2000 by the nas_storage role (nas_appdata_dirs).
#
# server: is an immutable PV field; the kustomize force annotation lets Flux
# delete+recreate it if server/mountOptions ever change (Retain -> data safe).
# Hostname (not IP) is required so xprtsec=tls verifies against the
# *.esweiss.com cert SAN — an IP mount fails the TLS handshake. See docs/07.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hermes-data
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: hermes
spec:
  # Pre-bind to the intended claim so no other empty-storageClass PVC can grab
  # this PV first (which would block Hermes or expose the wrong NFS path).
  claimRef:
    namespace: hermes
    name: hermes-data
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: pve-nas-01.esweiss.com
    path: /appdata/hermes
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    # The /appdata k3s client export lines require TLS (xprtsec=tls); plaintext
    # is rejected. tlshd runs on every agent (nfs_tls role).
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: hermes
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
  volumeName: hermes-data
