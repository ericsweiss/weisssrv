---
# NFS-over-TLS state for Hermes Agent (/opt/data) on the encrypted ssd/appdata
# dataset. The export squashes every write to 1000:2000; nas_storage owns the
# subdir. Hostname and force-annotation notes: _nfs-pv/resources.yaml, docs/07.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hermes-data
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: hermes
spec:
  # Pre-bind to the intended claim so no other empty-storageClass PVC can grab
  # this PV first (which would block Hermes or expose the wrong NFS path).
  claimRef:
    namespace: hermes
    name: hermes-data
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: pve-nas-01.${cluster_internal_domain}
    path: /appdata/hermes
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: hermes
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
  volumeName: hermes-data
