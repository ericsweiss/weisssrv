---
# NFS-backed persistent state for Hermes Agent (config, API keys, sessions,
# skills, memories -> /opt/data in the container) on the encrypted ssd/appdata
# dataset, so the nightly archive replication captures it as a child of an
# existing backup root. The export is all_squash,anonuid=1000,anongid=2000, so
# every container write lands as 1000:2000 whatever the in-container UID; the
# subdir is created + owned by the nas_storage role (nas_storage_appdata_dirs).
#
# NFS-over-TLS PV; hostname (not IP) + force annotation rationale:
# apps/download-clients/_nfs-pv/resources.yaml and docs/07.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hermes-data
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: hermes
spec:
  # Pre-bind to the intended claim so no other empty-storageClass PVC can grab
  # this PV first (which would block Hermes or expose the wrong NFS path).
  claimRef:
    namespace: hermes
    name: hermes-data
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: pve-nas-01.${cluster_internal_domain}
    path: /appdata/hermes
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: hermes
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
  volumeName: hermes-data
