---
# CRITICAL: every field below must exist on its 1P item BEFORE this manifest
# merges — one missing field fails the whole Secret sync and the pod waits on
# the absent key. Secret keys are the kebab-cased 1Password field names;
# deployment.yaml maps each to the env var Hermes reads, or the init container
# upserts it into /opt/data/.env. Per-key purpose and rotation: docs/37.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-secrets
  namespace: hermes
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: hermes-secrets
    creationPolicy: Owner
  data:
    # Bearer key for the gateway's in-process API server. Mandatory — the server
    # refuses to start without it; GET /health is the sole keyless route.
    - secretKey: api-server-key
      remoteRef:
        key: Hermes Secrets
        property: api-server-key
    # Claude Code long-lived OAuth token -> CLAUDE_CODE_OAUTH_TOKEN. Keeps
    # delegated coding runs on subscription billing; an API key meters them.
    - secretKey: claude-code-oauth-token
      remoteRef:
        key: Hermes Secrets
        property: claude-code-oauth-token
    # Authentik OIDC client secret for the dashboard provider.
    # terraform/authentik injects the same 1P field into the authentik side.
    - secretKey: hermes-dashboard-oidc-client-secret
      remoteRef:
        key: Hermes Secrets
        property: hermes-dashboard-oidc-client-secret
    # Discord bot token, consumed by the init container's .env upsert: gateway
    # config never reads os.environ (docs/37 § Gateway platform config).
    - secretKey: discord-bot-token
      remoteRef:
        key: Hermes Secrets
        property: discord-bot-token
    # Home Assistant long-lived access token, upserted into .env like the
    # Discord token; its presence auto-enables the homeassistant tool (docs/37).
    - secretKey: hass-token
      remoteRef:
        key: Hermes Secrets
        property: hass-token
    # 1Password service-account token from a dedicated item: the SA reaches
    # only the isolated Agent vault. Gateway container env — `op` runs as a
    # subprocess and reads it from os.environ (docs/37 § 1Password).
    - secretKey: op-service-account-token
      remoteRef:
        key: Hermes Agent 1P Service Account
        property: credential

---
# Registry pull credentials for the self-built hermes-agent image: a
# dockerconfigjson Secret from a read_registry GitLab deploy token, used by
# imagePullSecrets in deployment.yaml (docs/37 § Image).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-registry-pull
  namespace: hermes
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: hermes-registry-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        # The username is the deploy-token name, a stable literal: ESO's
        # 1Password Connect provider cannot resolve a LOGIN item's primary
        # username field, so only the custom `token` field syncs (docs/37).

        # toJson emits its own quotes: a token holding a quote, backslash or
        # newline would otherwise render invalid JSON, which the kubelet
        # reports only as ImagePullBackOff.
        .dockerconfigjson: |
          {"auths":{"registry.git.${cluster_internal_domain}":{"username":"hermes","password":{{ .token | toJson }},"auth":"{{ printf "hermes:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: Hermes Registry Pull
        property: token
