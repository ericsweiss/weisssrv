---
# Hermes Agent runtime secrets sourced from 1Password via ESO
# (onepassword-connect provider). Consumed by the dashboard container (basic
# auth) and the gateway container (API-server key) — see deployment.yaml.
# Secret keys are the kebab-cased 1Password field names; the Deployment maps
# each to the uppercase env var Hermes reads (dashboard-username ->
# HERMES_DASHBOARD_BASIC_AUTH_USERNAME) via an explicit secretKeyRef.
#
# NOTE: there is no LLM-provider API key here. Hermes' LLM engine is the Codex
# app-server runtime, authenticated with a ChatGPT subscription via `codex login`
# (OAuth token in CODEX_HOME=/opt/data/.codex/auth.json on the NFS volume — a
# one-time operator exec, see docs/37), not an ESO-managed secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-secrets
  namespace: hermes
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: hermes-secrets
    creationPolicy: Owner
  data:
    # Dashboard `basic` auth provider (HERMES_DASHBOARD_BASIC_AUTH_*). The
    # dashboard's 0.0.0.0 bind is fail-closed: it will not start without a
    # registered provider, so all three fields must exist on the 1P item (see
    # docs/15) — a missing field fails the whole Secret sync.
    - secretKey: dashboard-username
      remoteRef:
        key: Hermes Secrets
        property: dashboard-username
    - secretKey: dashboard-password
      remoteRef:
        key: Hermes Secrets
        property: dashboard-password
    # >=32-byte random session-signing key (openssl rand -hex 32) so logins
    # survive pod restarts.
    - secretKey: dashboard-session-secret
      remoteRef:
        key: Hermes Secrets
        property: dashboard-session-secret
    # Bearer key for the gateway's in-process OpenAI-compatible API server
    # (API_SERVER_KEY — mandatory: the server refuses to start without it;
    # the unauthenticated GET /health used by the gateway probes is the sole
    # keyless route). >=32-byte random (openssl rand -hex 32). Like the three
    # fields above, it must exist on the 1P item BEFORE this manifest merges —
    # a missing field fails the whole Secret sync and the new pod would wait
    # on the absent key.
    - secretKey: api-server-key
      remoteRef:
        key: Hermes Secrets
        property: api-server-key

---
# GitLab Container Registry pull credentials for the self-built hermes-agent
# image. Upstream publishes no image, so the build-hermes-agent CI job pushes
# to the private registry (registry.git.ericsweiss.com) and the nodes pull it
# via the internal host registry.git.esweiss.com (AdGuard rewrite -> Traefik
# .101 -> GitLab VM registry; same backend, no hairpin NAT). This ExternalSecret
# renders a kubernetes.io/dockerconfigjson Secret from a read_registry GitLab
# deploy token, referenced by imagePullSecrets in deployment.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-registry-pull
  namespace: hermes
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: hermes-registry-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        # The registry username is the GitLab deploy-token name "hermes" — not a
        # secret (the token is). It's hardcoded here because ESO's 1Password
        # Connect provider does not resolve the PRIMARY username field of a LOGIN
        # item (it returns 0 matches); only the custom `token` field syncs. Pull
        # just the token; the username is a stable literal. See docs/37.
        .dockerconfigjson: |
          {"auths":{"registry.git.esweiss.com":{"username":"hermes","password":"{{ .token }}","auth":"{{ printf "hermes:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: Hermes Registry Pull
        property: token
