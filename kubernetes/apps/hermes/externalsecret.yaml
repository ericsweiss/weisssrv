---
# Hermes Agent runtime secrets sourced from 1Password via ESO
# (onepassword-connect provider). Consumed by the dashboard container
# (Authentik OIDC), the gateway container (API-server key), and the
# init container (gateway .env sync) — see deployment.yaml.
# Secret keys are the kebab-cased 1Password field names; the Deployment maps
# each to the uppercase env var Hermes reads (hass-token -> HASS_TOKEN)
# via an explicit secretKeyRef (or the init container's .env upsert).
#
# NOTE: there is no LLM-provider API key here. Hermes' LLM engine is the Codex
# app-server runtime, authenticated with a ChatGPT subscription via `codex login`
# (OAuth token in CODEX_HOME=/opt/data/.codex/auth.json on the NFS volume — a
# one-time operator exec, see docs/37), not an ESO-managed secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-secrets
  namespace: hermes
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: hermes-secrets
    creationPolicy: Owner
  data:
    # NOTE: the dashboard-username/password/session-secret fields remain on
    # the 1P item as the emergency-revert values for the basic provider, but
    # are deliberately NOT synced — dashboard auth is OIDC-only (see
    # deployment.yaml). Re-add the three entries here + the env trio there to
    # restore password break-glass.
    # Bearer key for the gateway's in-process OpenAI-compatible API server
    # (API_SERVER_KEY — mandatory: the server refuses to start without it;
    # the unauthenticated GET /health used by the gateway probes is the sole
    # keyless route). >=32-byte random (openssl rand -hex 32). Like the three
    # fields above, it must exist on the 1P item BEFORE this manifest merges —
    # a missing field fails the whole Secret sync and the new pod would wait
    # on the absent key.
    - secretKey: api-server-key
      remoteRef:
        key: Hermes Secrets
        property: api-server-key
    # Claude Code long-lived OAuth token (`claude setup-token`, sk-ant-oat01-*)
    # -> CLAUDE_CODE_OAUTH_TOKEN in both containers: the Claude Code CLI baked
    # into the image presents it for delegated coding runs, billed to the
    # Claude Max SUBSCRIPTION (no ANTHROPIC_API_KEY anywhere — that env would
    # silently flip the CLI to metered API billing). Like the fields above, it
    # must exist on the 1P item BEFORE this manifest merges (missing field =
    # whole-Secret sync failure).
    - secretKey: claude-code-oauth-token
      remoteRef:
        key: Hermes Secrets
        property: claude-code-oauth-token
    # Authentik OIDC client secret for the dashboard's `self_hosted` OIDC
    # provider (HERMES_DASHBOARD_OIDC_CLIENT_SECRET — non-empty makes the
    # dashboard a confidential client; PKCE stays on regardless). Terraform
    # injects the SAME 1P field into the authentik provider
    # (TF_VAR_oauth2_client_secret_hermes_dashboard, terraform/authentik), so
    # authentik and the dashboard can never disagree. >=32-byte random
    # (openssl rand -hex 32). Like every field here, it must exist on the 1P
    # item BEFORE this manifest merges (all eight fields — a missing one fails
    # the whole Secret sync).
    - secretKey: hermes-dashboard-oidc-client-secret
      remoteRef:
        key: Hermes Secrets
        property: hermes-dashboard-oidc-client-secret
    # Discord bot token for the gateway — consumed by the INIT container's
    # /opt/data/.env upsert, NOT as gateway container env: the gateway's
    # config loader (_getenv) prefers the active profile's secret scope and
    # never falls back to os.environ, so container env vars are invisible to
    # gateway config and /opt/data/.env is the operative store (docs/37
    # §Gateway platform config).
    - secretKey: discord-bot-token
      remoteRef:
        key: Hermes Secrets
        property: discord-bot-token
    # Home Assistant long-lived access token (docs/37 §Home Assistant) —
    # consumed by the INIT container's .env upsert, like discord-bot-token
    # above (HASS_TOKEN's presence in the gateway's env store auto-enables the
    # homeassistant tool). Created in the HA UI: profile -> Security ->
    # Long-lived access tokens. Like every field here, it must exist on the 1P
    # item BEFORE this manifest merges.
    - secretKey: hass-token
      remoteRef:
        key: Hermes Secrets
        property: hass-token

---
# GitLab Container Registry pull credentials for the self-built hermes-agent
# image. Upstream publishes no image, so the build-hermes-agent CI job pushes
# to the private registry (registry.git.ericsweiss.com) and the nodes pull it
# via the internal host registry.git.esweiss.com (AdGuard rewrite -> Traefik
# .101 -> GitLab VM registry; same backend, no hairpin NAT). This ExternalSecret
# renders a kubernetes.io/dockerconfigjson Secret from a read_registry GitLab
# deploy token, referenced by imagePullSecrets in deployment.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-registry-pull
  namespace: hermes
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: hermes-registry-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        # The registry username is the GitLab deploy-token name "hermes" — not a
        # secret (the token is). It's hardcoded here because ESO's 1Password
        # Connect provider does not resolve the PRIMARY username field of a LOGIN
        # item (it returns 0 matches); only the custom `token` field syncs. Pull
        # just the token; the username is a stable literal. See docs/37.
        .dockerconfigjson: |
          {"auths":{"registry.git.esweiss.com":{"username":"hermes","password":"{{ .token }}","auth":"{{ printf "hermes:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: Hermes Registry Pull
        property: token
