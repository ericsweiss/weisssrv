---
apiVersion: v1
kind: Namespace
metadata:
  name: hermes
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/part-of: hermes
    app.kubernetes.io/managed-by: flux
    # Baseline: the upstream s6-overlay image starts as root to drop to the
    # hermes user, so runAsNonRoot / drop-ALL would break it. warn/audit
    # restricted flags the root start without blocking it.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
