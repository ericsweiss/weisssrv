---
# CRITICAL: `pods` (25 = 12 concurrent job pods, the manager, and 12 churn slots
# for Terminating pods) is the only dimension meant to bind; the rest are 25 x
# the per-job-pod figures in release.yaml and sum above cluster allocatable
# (docs/16 § CI/CD). Re-derive all of them when `concurrent` or the agent VM
# size (proxmox_vm_cores/proxmox_vm_memory in hosts.yml) moves: a quota
# admitting fewer pods than the runner submits 403s the job into
# runner_system_failure. No cpu or limits.cpu dimension — it would force a CPU
# limit on every pod here and reject the runner manager, which runs without one.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gitlab-runner-privileged-quota
  namespace: gitlab-runner-privileged
spec:
  hard:
    requests.cpu: "38"
    requests.memory: 25Gi
    limits.memory: 82Gi
    pods: "25"
---
# Default requests/limits so any pod created in this namespace without explicit
# resources still counts against the quota above. Only memory carries a default
# limit — never a CPU limit (see quota note).
apiVersion: v1
kind: LimitRange
metadata:
  name: gitlab-runner-privileged-limits
  namespace: gitlab-runner-privileged
spec:
  limits:
    - type: Container
      default:
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
