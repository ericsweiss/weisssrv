---
# Aggregate bounds for the privileged-runner namespace. Every dimension derives
# from release.yaml's `concurrent` and must move with it: a quota that admits
# fewer pods than the runner submits does not throttle, it 403s the job into
# runner_system_failure.
#
# `pods` is the only dimension that should ever bind (an over-tight pods count
# just queues work in GitLab). The rest are sized to the full pods allowance:
#   pods 25              = concurrent:12 + churn (Terminating pods still count)
#   requests.cpu 38      = 25 x 1.5 cpu
#   requests.memory 25Gi = 25 x ~1Gi
#   limits.memory 82Gi   = 25 x ~3.25Gi
#
# Deliberately NO cpu / limits.cpu dimension: it would force every pod here to
# declare a CPU limit, rejecting the runner manager (which runs without one to
# avoid CFS throttling). CPU is bounded by requests.cpu.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gitlab-runner-privileged-quota
  namespace: gitlab-runner-privileged
spec:
  hard:
    requests.cpu: "38"
    requests.memory: 25Gi
    limits.memory: 82Gi
    pods: "25"
---
# Default requests/limits so any pod created in this namespace without explicit
# resources still counts against the quota above. Only memory carries a default
# limit — never a CPU limit (see quota note).
apiVersion: v1
kind: LimitRange
metadata:
  name: gitlab-runner-privileged-limits
  namespace: gitlab-runner-privileged
spec:
  limits:
    - type: Container
      default:
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
