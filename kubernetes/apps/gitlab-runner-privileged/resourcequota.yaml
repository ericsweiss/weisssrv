---
# Aggregate resource bounds for the privileged-runner namespace. concurrent:10
# DinD job pods, each ~8Gi memory limits (build 3Gi + dind 4Gi + helper 1Gi) and
# ~2.3Gi requests (build 1Gi + dind 1Gi + helper 256Mi). The build container was
# 8Gi but molecule jobs peak ~250Mi live (it runs the pre-built molecule-ci image
# — ansible control, not the test workload), so it was ~30x over and capped
# concurrency at 3 under the old 48Gi limits cap. These values admit 10 jobs plus
# a one-pod transition buffer + the manager: limits.memory 90Gi, requests.memory
# 28Gi, requests.cpu 14. The REAL capacity gate is requests (the scheduler places
# pods on requests, ~23Gi for 10 jobs — well under the cluster's free headroom);
# limits.memory is an admission ceiling for DECLARED limits, not a reservation:
# actual use is ~20Gi and the cluster ran concurrent:15 fine before this quota
# existed. Per-pod limits + the scheduler + kubelet OOM-kill protect individual
# nodes; this still bounds a runaway namespace burst.
#
# Deliberately NO cpu / limits.cpu quota dimension: a CPU-limit quota would force
# EVERY pod in the namespace to declare a CPU limit, which would reject the
# runner manager (it intentionally runs with no CPU limit to avoid CFS
# throttling). CPU is bounded via requests.cpu, memory via both.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gitlab-runner-privileged-quota
  namespace: gitlab-runner-privileged
spec:
  hard:
    requests.cpu: "14"
    requests.memory: 28Gi
    limits.memory: 90Gi
    pods: "20"
---
# Default requests/limits so any pod created in this namespace without explicit
# resources still counts against the quota above. Only memory carries a default
# limit — never a CPU limit (see quota note).
apiVersion: v1
kind: LimitRange
metadata:
  name: gitlab-runner-privileged-limits
  namespace: gitlab-runner-privileged
spec:
  limits:
    - type: Container
      default:
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
