---
# Infrastructure (privileged) GitLab Runner. Its own namespace is the isolation
# boundary from the untrusted shared runner — that runner's namespace-scoped
# RBAC cannot reach this one's token Secret (ESO-rendered,
# gitlab-runner-privileged-token). Job pods additionally run as a token-less SA
# (serviceaccount.yaml) and are routed here only by the `infrastructure` tag.
#
# Fields shared with ../gitlab-runner/release.yaml come from the
# kubernetes/components/gitlab-runner-common component; only deltas live below.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-runner-privileged
  namespace: gitlab-runner-privileged
spec:
  releaseName: gitlab-runner-privileged
  values:
    # Concurrent jobs, governed by CPU. Sized to the schedulable pool and never
    # above it: overflow above pool capacity parks as Pending pods, and Pending
    # time burns the JOB timeout, whereas overflow below it waits in GitLab's
    # queue where the clock does not run. Pool ~25 cores, ~19 free after
    # co-tenants, 1.5 cpu reserved per job (cpu_request 900m + dind 500m +
    # helper 100m) => 12. Raising it means adding cores, not lowering the
    # request. Keep in lockstep with the ResourceQuota's requests.cpu.
    concurrent: 12

    checkInterval: 3
    runners:
      name: k3s-runner-infrastructure

      # Existing Secret (created by ESO externalsecret.yaml) containing the
      # runner-token.
      secret: gitlab-runner-privileged-token

      # Tags - ONLY run jobs tagged "infrastructure" (weisssrv project jobs)
      tags: "infrastructure"

      # Do NOT run untagged jobs - only explicitly tagged jobs land here
      # Other projects' untagged jobs go to the shared non-privileged runner
      runUntagged: false

      # ACCEPTED RISK (homelab): this privileged root+DinD runner accepts
      # UNPROTECTED branches, because the whole MR pipeline is tagged
      # [infrastructure] and feature branches are not protected.
      # The isolation boundary is the REGISTRATION SCOPE, not the tag — tags are
      # cooperative and any project can claim one. The token behind this runner
      # must stay a PROJECT runner locked to weisssrv (docs/27 Step 8).
      protected: false

      executor: kubernetes

      config: |
        # TOML sections are POSITIONAL: every key after a [section] header
        # belongs to that section until the next header, so all scalar
        # [runners.kubernetes] keys must precede any sub-table or they are
        # silently swallowed by it.
        [[runners]]
          # request_concurrency 1 serializes job acquisition behind GitLab's
          # long-poll window and surfaces as runner_system_failure bursts; the
          # runner's own startup warning recommends 2-4.
          request_concurrency = 3
          # Keep clones on the LAN path too (see gitlabUrl above). A [[runners]]
          # scalar — must precede the [runners.kubernetes] sub-table.
          clone_url = "https://git.${cluster_internal_domain}"

          [runners.kubernetes]
            namespace = "gitlab-runner-privileged"
            # The default 180s fails a transiently-Pending pod as
            # runner_system_failure when a co-tenant burst delays placement.
            # A scalar key — must stay above the first sub-table.
            poll_timeout = 1200
            # Default CI job image, digest-pinned for reproducibility (the
            # tag is retained for readability; the digest is authoritative).
            # Refresh with: docker buildx imagetools inspect python:3.11
            image = "python:3.11@sha256:9800957d2a88867f853ce6072ae1669e37fa269cc6f76009fa1aef4757f62212"
            privileged = true

            # Rank job pods below every unclassed workload and never preempt
            # (sources/priorityclasses.yaml). The namespace quotas admit more
            # CPU requests than the cluster has allocatable, so a CI burst used
            # to compete with platform pods on arrival order alone. A scalar key
            # — must stay above the first sub-table.
            priority_class_name = "ci-jobs"

            # Build container: ansible control + molecule, not the test workload.
            # cpu_request is the scheduler's per-node reservation and must match
            # what a converge actually drives (~0.9 cpu), or small agents get
            # over-packed. No cpu_limit (docs/33 repo-wide policy).
            cpu_request = "900m"
            memory_limit = "1Gi"
            memory_request = "384Mi"
            # Ceilings for the lib templates' per-job KUBERNETES_MEMORY_*
            # declarations (v0.11.0): without max_allowed the runner ignores
            # them and every job stays at the 1Gi default above.
            memory_limit_overwrite_max_allowed = "6Gi"
            memory_request_overwrite_max_allowed = "2Gi"
            service_memory_limit_overwrite_max_allowed = "4Gi"
            service_memory_request_overwrite_max_allowed = "1Gi"

            # docker:dind sidecar holding the molecule test containers. Its load
            # is burst-shaped (image unpack, parallel containers), so no
            # service_cpu_limit — a limit only bought CFS throttling.
            service_cpu_request = "500m"
            service_memory_limit = "2Gi"
            service_memory_request = "512Mi"

            # Helper container (git clone + artifacts) — tiny (~18Mi live).
            helper_cpu_request = "100m"
            helper_memory_limit = "256Mi"
            helper_memory_request = "128Mi"

            # Job pods run as the token-less jobs SA (serviceaccount.yaml), not
            # the manager SA — they must not inherit its secrets/pods-exec Role.
            service_account = "gitlab-runner-privileged-jobs"

            # No pod security context: the DinD daemon needs root, and every job
            # on this runner comes from the trusted weisssrv project.
            pull_policy = ["if-not-present"]

            # Jobs may override the node selector for CPU compatibility only;
            # the pattern prevents arbitrary node targeting.
            node_selector_overwrite_allowed = "^esweiss\\.com/cpu=(modern|legacy)$"

            # No node affinity, deliberately: every agent is eligible, and the
            # NAS agent's PreferNoSchedule taint already makes it the last
            # choice. Tighten by raising THAT taint, not by adding a rule here.

            # Soft spread of job pods across agents: simultaneous same-node
            # DinD starts race cgroup-v2 setup and fail at prepare. Preferred,
            # not required, so a burst still packs rather than going Pending.
            # A sub-table — after every scalar key, before pod_labels.
            [runners.kubernetes.affinity.pod_anti_affinity]
              [[runners.kubernetes.affinity.pod_anti_affinity.preferred_during_scheduling_ignored_during_execution]]
                weight = 100
                [runners.kubernetes.affinity.pod_anti_affinity.preferred_during_scheduling_ignored_during_execution.pod_affinity_term]
                  topology_key = "kubernetes.io/hostname"
                  [runners.kubernetes.affinity.pod_anti_affinity.preferred_during_scheduling_ignored_during_execution.pod_affinity_term.label_selector]
                    [[runners.kubernetes.affinity.pod_anti_affinity.preferred_during_scheduling_ignored_during_execution.pod_affinity_term.label_selector.match_expressions]]
                      key = "${cluster_node_label_domain}/runner-class"
                      operator = "In"
                      values = ["infrastructure"]

            # NetworkPolicy selector: these job pods keep unrestricted egress
            # (ansible/SSH to the whole LAN) — see ./networkpolicy.yaml.
            # Must stay LAST (TOML positionality).
            [runners.kubernetes.pod_labels]
              "${cluster_node_label_domain}/runner-class" = "infrastructure"

    # Manager ServiceAccount (chart-created). Job pods use the token-less
    # gitlab-runner-privileged-jobs SA instead — see serviceaccount.yaml.
    serviceAccount:
      create: true
      name: gitlab-runner-privileged
