---
# Infrastructure (privileged) GitLab Runner HelmRelease, deployed in its own
# dedicated `gitlab-runner-privileged` namespace. The namespace separation is
# the isolation boundary from the untrusted shared runner: the shared runner's
# namespace-scoped RBAC can no longer read this runner's token Secret. Isolation
# is also reinforced by a separate ServiceAccount (gitlab-runner-privileged) and
# the `infrastructure` job tag. Chart version substituted from cluster-versions
# ConfigMap. Runner token sourced via ExternalSecret (externalsecret.yaml); the
# chart reads it from the Secret `gitlab-runner-privileged-token` via
# runners.secret.
#
# The fields shared with ../gitlab-runner/release.yaml (interval, timeout, chart,
# install/upgrade, gitlabUrl, replicas, checkInterval, rbac, manager resources,
# affinity, tolerations) are merged in from the
# kubernetes/components/gitlab-runner-common component (wired in
# kustomization.yaml); only this runner's deltas live below.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-runner-privileged
  namespace: gitlab-runner-privileged
spec:
  releaseName: gitlab-runner-privileged
  values:
    # Concurrent jobs. The governor here is CPU, not memory. Memory per job is
    # tiny (~0.55Gi live: build ~250-400Mi ansible control, dind ~120Mi, helper
    # ~18Mi) and was correctly right-sized. But an earlier pass set the CPU
    # *requests* too low (~0.65 cpu/job) while a converge actually uses ~1.5 cpu
    # (ansible control + dind + the systemd test container). At concurrent:18 the
    # scheduler packed job pods onto the small 3-core agents (opt-01/02/03) by
    # those understated requests -> 4+ jobs on a 3-core node -> ~2x LOCAL CPU
    # oversubscription. Under that starvation the docker-exec-per-task molecule
    # connection crawls, and task-count-heavy jobs inflated ~4-7x (proxmox_vm
    # 2.5min -> 18min, storage-stack 3min -> 17min; measured across pipelines
    # 550/551 @c=10 vs 553 @c=18). Fix: request the real ~1.5 cpu/job (below), so
    # per-node packing is correct and the scheduler self-limits effective
    # parallelism to what the agent cores can actually run.
    #
    # concurrent is sized to the schedulable pool, NOT above it. The CI-eligible
    # pool is 19 cores (opt-01/02/03 3 + laptop-01 4 + prec-01 6) since the NAS
    # agent's hard CI exclusion; after co-tenant requests (~5 cpu) that is ~14
    # cpu of headroom = ~9 jobs at 1.5 cpu/job. Oversubscribing here (the old
    # c=15, sized against the pre-exclusion 25-core pool) parks the overflow as
    # Unschedulable PODS — and pod-Pending time burns the JOB's timeout clock
    # (pipeline 773: two molecule jobs sat Pending ~18.5 min and were killed by
    # the 20m job timeout without ever converging). At/below pool capacity the
    # overflow waits in GitLab's job queue instead, where the timeout clock does
    # not run. concurrent stays at/below what the ResourceQuota's requests.cpu
    # admits so the runner never submits a pod the quota rejects (403). Move in
    # lockstep with the quota.
    concurrent: 9

    # Kubernetes executor configuration
    runners:
      # Runner name prefix
      name: k3s-runner-infrastructure

      # Existing Secret (created by ESO externalsecret.yaml) containing the
      # runner-token.
      secret: gitlab-runner-privileged-token

      # Tags - ONLY run jobs tagged "infrastructure" (weisssrv project jobs)
      tags: "infrastructure"

      # Do NOT run untagged jobs - only explicitly tagged jobs land here
      # Other projects' untagged jobs go to the shared non-privileged runner
      runUntagged: false

      # Protected branches only.
      # ACCEPTED RISK (homelab): protected:false lets this privileged (root +
      # DinD) runner execute the weisssrv MR pipeline on UNPROTECTED feature
      # branches. This is deliberate: .gitlab-ci.yml runs every job with
      # tags:[infrastructure] and triggers on merge_request_event, so the whole
      # branch+MR CI workflow (lint/validate/test) depends on this runner
      # accepting unprotected branches. Setting protected:true would silently
      # break MR CI (no runner would pick up MR jobs) because feature branches
      # are not protected.
      # The isolation boundary is the runner REGISTRATION SCOPE, not the tag:
      # tags are cooperative routing, and any project on the instance can
      # declare tags:[infrastructure] in its CI. The registration behind the
      # 1Password "GitLab Runner Privileged" token must therefore be a PROJECT
      # runner locked to the weisssrv project — never an instance runner — so
      # no other project's jobs can reach root+DinD execution (docs/27 Step 8).
      protected: false

      executor: kubernetes

      # Kubernetes executor config
      config: |
        # TOML sections are POSITIONAL: every key after a [section] header
        # belongs to that section until the next header. All scalar
        # [runners.kubernetes] keys must therefore come BEFORE any
        # sub-table. A past mid-section [runners.kubernetes.pod_labels]
        # sub-table swallowed every key after it — pull_policy (a list)
        # then failed pod_labels' string-map decode and the runner
        # crash-looped on first render.
        [[runners]]
          # Keep clones on the LAN path too (see gitlabUrl above). A [[runners]]
          # scalar — must precede the [runners.kubernetes] sub-table.
          clone_url = "https://git.esweiss.com"

          [runners.kubernetes]
            namespace = "gitlab-runner-privileged"
            # A ~9-job start burst requests ~13.5 cpu, which the 19-core CI pool
            # fits — pods should schedule promptly, and overflow now queues in
            # GitLab (see the concurrent: note) rather than as Pending pods. The
            # default poll_timeout (180s) would still fail a transiently-Pending
            # pod spuriously as runner_system_failure (co-tenant bursts can delay
            # placement); 1200s keeps that backstop tolerant. A scalar key — must
            # stay above the first [runners.kubernetes.*] sub-table (see the
            # positional note above).
            poll_timeout = 1200
            # Default CI job image, digest-pinned for reproducibility (the
            # tag is retained for readability; the digest is authoritative).
            # Refresh with: docker buildx imagetools inspect python:3.11
            image = "python:3.11@sha256:9800957d2a88867f853ce6072ae1669e37fa269cc6f76009fa1aef4757f62212"
            privileged = true

            # CPU/Memory for the build container (runs the pre-built molecule-ci
            # image — ansible control + molecule, NOT the test workload). Memory
            # peaks ~250-400Mi, so 1Gi limit / 384Mi request stays. The CPU
            # REQUEST is the scheduler's per-node reservation: ansible control is
            # the dominant CPU consumer during converge (~0.9 cpu actively driving
            # tasks), so request 900m — the earlier 250m under-reserved and let
            # the scheduler over-pack small nodes (see the concurrent: note).
            # No cpu_limit: the repo-wide no-CPU-limit policy (docs/33) applies
            # to job pods too. CPU is compressible, cpu_request already sets the
            # contention share, and the namespace ResourceQuota deliberately
            # carries no cpu/limits.cpu dimension (resourcequota.yaml).
            cpu_request = "900m"
            memory_limit = "1Gi"
            memory_request = "384Mi"

            # Service container (docker:dind sidecar) — holds the molecule test
            # container(s). Memory ~120Mi live; 2Gi limit gives headroom for
            # multi-container integration scenarios + image layers, 512Mi request.
            # CPU request 500m reserves the dind daemon + the systemd test
            # container's steady CPU (build 900m + dind 500m + helper 100m ≈ the
            # ~1.5 cpu a real converge uses, so per-node packing matches reality).
            # No service_cpu_limit: dind's load is burst-shaped (image unpack,
            # parallel molecule containers), and the 2-core limit throttled it
            # for 28-46% of CFS periods across every measured job pod — pure
            # CI wall-clock loss, which is exactly what docs/33 says a CPU limit
            # buys you.
            service_cpu_request = "500m"
            service_memory_limit = "2Gi"
            service_memory_request = "512Mi"

            # Helper container (git clone + artifacts) — tiny (~18Mi live).
            helper_cpu_request = "100m"
            helper_memory_limit = "256Mi"
            helper_memory_request = "128Mi"

            # Service account
            service_account = "gitlab-runner-privileged"

            # No pod security context restrictions - DinD test jobs require root
            # Docker daemon needs root privileges to function. Lint and deploy jobs
            # also run as root here for simplicity since this runner is restricted
            # to the trusted weisssrv project via the "infrastructure" tag.

            # Pull policy
            pull_policy = ["if-not-present"]

            # Allow individual CI jobs to override node selector for CPU-compatibility only.
            # Restricted to esweiss.com/cpu=modern|legacy to prevent arbitrary node targeting.
            # Example: KUBERNETES_NODE_SELECTOR_CPU: esweiss.com/cpu=modern
            node_selector_overwrite_allowed = "^esweiss\\.com/cpu=(modern|legacy)$"

            # Node affinity: HARD-exclude CI job pods from the NAS agent (label
            # esweiss.com/nas=true). That node's Proxmox host (pve-nas-01) runs at
            # ~99.8% memory commit, so a CI pod landing there forces the
            # overcommitted host to swap OTHER guests' cold pages. The old *soft*
            # nas=PreferNoSchedule taint let a ~15-job burst spill onto it once the
            # rest of the fleet filled, which the 2026-07-20 forensics found the #1
            # driver of the NAS swap ratchet (15 job pods on the NAS agent that day,
            # peak 7 concurrent). DoesNotExist (NOT NotIn, which would require the
            # key) keeps every node WITHOUT the label eligible and excludes only the
            # labelled NAS agent; combined with node_selector_overwrite_allowed
            # above, a cpu=modern job still lands on prec-01/laptop-01, never the
            # NAS. CPU is never the fleet bottleneck (all agents <25% cpu-requested)
            # and prec-01 (17.6Gi, the biggest agent) backfills the modern slot —
            # see docs/06 (NAS memory management) + docs/27. A sub-table: keep it
            # after all scalar keys and before pod_labels (TOML positionality note).
            [runners.kubernetes.affinity.node_affinity]
              [runners.kubernetes.affinity.node_affinity.required_during_scheduling_ignored_during_execution]
                [[runners.kubernetes.affinity.node_affinity.required_during_scheduling_ignored_during_execution.node_selector_terms]]
                  [[runners.kubernetes.affinity.node_affinity.required_during_scheduling_ignored_during_execution.node_selector_terms.match_expressions]]
                    key = "esweiss.com/nas"
                    operator = "DoesNotExist"

            # Pod anti-affinity: spread infrastructure job pods across agents so
            # a ~15-job burst does not bin-pack many systemd-DinD test pods onto
            # one node. Simultaneous same-node container starts race the cgroup-v2
            # setup and die at prepare ("Container is not running") — the dominant
            # script_failure flake class the in-job retry loop then has to absorb.
            # Soft (preferred, weight 100): the scheduler spreads when it can but
            # still packs under CPU pressure rather than leaving jobs Pending. The
            # selector matches the pod_labels label below, which every infrastructure
            # job pod carries. A sub-table — keep it after all scalar keys above and
            # before pod_labels (which must stay LAST; see TOML positionality note).
            [runners.kubernetes.affinity.pod_anti_affinity]
              [[runners.kubernetes.affinity.pod_anti_affinity.preferred_during_scheduling_ignored_during_execution]]
                weight = 100
                [runners.kubernetes.affinity.pod_anti_affinity.preferred_during_scheduling_ignored_during_execution.pod_affinity_term]
                  topology_key = "kubernetes.io/hostname"
                  [runners.kubernetes.affinity.pod_anti_affinity.preferred_during_scheduling_ignored_during_execution.pod_affinity_term.label_selector]
                    [[runners.kubernetes.affinity.pod_anti_affinity.preferred_during_scheduling_ignored_during_execution.pod_affinity_term.label_selector.match_expressions]]
                      key = "esweiss.com/runner-class"
                      operator = "In"
                      values = ["infrastructure"]

            # NetworkPolicy selector: infrastructure job pods keep
            # unrestricted egress (ansible/SSH to the whole LAN) — see
            # ./networkpolicy.yaml. Keep this sub-table
            # LAST (see TOML positionality note above).
            [runners.kubernetes.pod_labels]
              "esweiss.com/runner-class" = "infrastructure"

    # Service account - separate from non-privileged runner
    serviceAccount:
      create: true
      name: gitlab-runner-privileged
