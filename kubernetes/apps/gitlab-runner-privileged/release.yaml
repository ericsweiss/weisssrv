---
# Infrastructure (privileged) GitLab Runner HelmRelease, deployed in its own
# dedicated `gitlab-runner-privileged` namespace. The namespace separation is
# the isolation boundary from the untrusted shared runner: the shared runner's
# namespace-scoped RBAC can no longer read this runner's token Secret. Isolation
# is also reinforced by a separate ServiceAccount (gitlab-runner-privileged) and
# the `infrastructure` job tag. Chart version substituted from cluster-versions
# ConfigMap. Runner token sourced via ExternalSecret (externalsecret.yaml); the
# chart reads it from the Secret `gitlab-runner-privileged-token` via
# runners.secret.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-runner-privileged
  namespace: gitlab-runner-privileged
spec:
  interval: 30m
  releaseName: gitlab-runner-privileged
  # Runner liveness probe + GitLab connection handshake can take 6-8 minutes
  # on a cold start; default 5m timeout times out prematurely.
  timeout: 15m
  chart:
    spec:
      chart: gitlab-runner
      version: "${gitlab_runner_helm_version}"
      sourceRef:
        kind: HelmRepository
        name: gitlab
        namespace: flux-system
      interval: 12h
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # GitLab instance URL (use external domain - internal esweiss.com not resolvable in k3s cluster DNS)
    gitlabUrl: https://git.ericsweiss.com

    # Single runner controller pod — concurrent (below) controls actual job
    # parallelism. Pinning to 1 here so that an out-of-band `kubectl scale
    # --replicas=0` (used during maintenance to drain CI for k3s upgrades)
    # is reconciled back to 1 on the next Flux pass instead of leaving the
    # deployment silently at 0 like it did on 2026-06-08.
    replicas: 1

    # Concurrent jobs, capped to what the namespace ResourceQuota admits. A full
    # DinD job pod sums to ~8Gi memory limits (build 3Gi + dind 4Gi + helper 1Gi).
    # The build container runs the pre-built molecule-ci image (molecule + ansible
    # control) and peaks well under 1Gi in practice (live kubectl top: ~250Mi), so
    # the former 8Gi build limit was ~30x over and capped concurrency at 3 under
    # the old 48Gi quota. With build right-sized to 3Gi and the quota raised to
    # 90Gi limits / 28Gi requests, the quota admits 10 (restores pre-!103
    # throughput — 15 ran fine before this quota existed). A higher value would
    # let the runner submit job pods the quota rejects (403, no retry => spurious
    # CI failures); excess jobs queue at the runner slot instead. Move with quota.
    concurrent: 10

    # Check interval (seconds)
    checkInterval: 30

    # Kubernetes executor configuration
    runners:
      # Runner name prefix
      name: k3s-runner-infrastructure

      # Existing Secret (created by ESO externalsecret.yaml) containing the
      # runner-token.
      secret: gitlab-runner-privileged-token

      # Tags - ONLY run jobs tagged "infrastructure" (weisssrv project jobs)
      tags: "infrastructure"

      # Do NOT run untagged jobs - only explicitly tagged jobs land here
      # Other projects' untagged jobs go to the shared non-privileged runner
      runUntagged: false

      # Protected branches only.
      # ACCEPTED RISK (homelab): protected:false lets this privileged (root +
      # DinD) runner execute the weisssrv MR pipeline on UNPROTECTED feature
      # branches. This is deliberate: .gitlab-ci.yml runs every job with
      # tags:[infrastructure] and triggers on merge_request_event, so the whole
      # branch+MR CI workflow (lint/validate/test) depends on this runner
      # accepting unprotected branches. Setting protected:true would silently
      # break MR CI (no runner would pick up MR jobs) because feature branches
      # are not protected. Mitigations in place: the runner only accepts the
      # 'infrastructure' tag (runUntagged:false), which only the trusted
      # weisssrv project uses; other projects' jobs land on the non-privileged
      # shared runner. Revisit if a second project ever gets this tag.
      protected: false

      # Executor type
      executor: kubernetes

      # Kubernetes executor config
      config: |
        # TOML sections are POSITIONAL: every key after a [section] header
        # belongs to that section until the next header. All scalar
        # [runners.kubernetes] keys must therefore come BEFORE any
        # sub-table. The !81 revision inserted [runners.kubernetes.
        # pod_labels] mid-section, which swallowed every key after it —
        # pull_policy (a list) then failed pod_labels' string-map decode
        # and the runner crash-looped on first render (the HelmRelease
        # had been stalled behind the observability block until !83).
        [[runners]]
          [runners.kubernetes]
            namespace = "gitlab-runner-privileged"
            image = "python:3.11"
            privileged = true

            # CPU/Memory limits for job pods
            # Higher limits for DinD test jobs; lint/deploy jobs use less.
            # build memory_limit was 8Gi, but molecule jobs run the pre-built
            # molecule-ci image (ansible control + molecule) and peak ~250Mi live
            # — 3Gi is ~12x headroom and lets the quota admit concurrent:10. The
            # heavy work runs in the dind service container (kept at 4Gi below).
            cpu_limit = "4"
            cpu_request = "500m"
            memory_limit = "3Gi"
            memory_request = "1Gi"

            # Service container resource limits (docker:dind sidecar for test jobs)
            service_cpu_limit = "2"
            service_cpu_request = "500m"
            service_memory_limit = "4Gi"
            service_memory_request = "1Gi"

            # Service account
            service_account = "gitlab-runner-privileged"

            # No pod security context restrictions - DinD test jobs require root
            # Docker daemon needs root privileges to function. Lint and deploy jobs
            # also run as root here for simplicity since this runner is restricted
            # to the trusted weisssrv project via the "infrastructure" tag.

            # Pull policy
            pull_policy = ["if-not-present"]

            # Allow individual CI jobs to override node selector for CPU-compatibility only.
            # Restricted to esweiss.com/cpu=modern|legacy to prevent arbitrary node targeting.
            # Example: KUBERNETES_NODE_SELECTOR_CPU: esweiss.com/cpu=modern
            node_selector_overwrite_allowed = "^esweiss\\.com/cpu=(modern|legacy)$"

            # NetworkPolicy selector: infrastructure job pods keep
            # unrestricted egress (ansible/SSH to the whole LAN) — see
            # ./networkpolicy.yaml. Keep this sub-table
            # LAST (see TOML positionality note above).
            [runners.kubernetes.pod_labels]
              "esweiss.com/runner-class" = "infrastructure"

    # RBAC configuration
    # Restricted to the gitlab-runner-privileged namespace (least privilege)
    rbac:
      create: true
      clusterWideAccess: false
      rules:
        - apiGroups: [""]
          resources: ["pods", "pods/exec", "pods/attach", "pods/log", "secrets", "configmaps"]
          verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
        - apiGroups: [""]
          resources: ["services"]
          verbs: ["get", "list", "watch"]

    # Service account - separate from non-privileged runner
    serviceAccount:
      create: true
      name: gitlab-runner-privileged

    # Pod resources for the runner manager (not the job pods)
    resources:
      requests:
        cpu: 150m
        memory: 128Mi
      limits:
        # No CPU limit: the runner manager is a trusted control-loop poller that
        # bursts when spawning/reaping CI job pods; CFS throttling at 1 core was a
        # chronic CPUThrottlingHigh source. The CPU request still grants a
        # scheduling share; memory limit kept (OOM is a real failure mode).
        memory: 512Mi

    # Node affinity - prefer non-NAS nodes for runner pods
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: esweiss.com/nas
                  operator: DoesNotExist

    # Tolerations for workload nodes
    tolerations:
      - key: esweiss.com/ingress
        operator: Equal
        value: "true"
        effect: PreferNoSchedule
      - key: esweiss.com/compute
        operator: Equal
        value: "true"
        effect: PreferNoSchedule
