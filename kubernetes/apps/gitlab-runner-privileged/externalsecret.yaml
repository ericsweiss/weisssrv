---
# Privileged runner token for the gitlab-runner-privileged HelmRelease; its own
# namespace keeps the shared runner's RBAC off it. The chart's projected-secrets
# volume needs both keys, so the template emits an empty registration key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-privileged-token
  namespace: gitlab-runner-privileged
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: gitlab-runner-privileged-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        runner-token: "{{ .token }}"
        runner-registration-token: ""
  data:
    - secretKey: token
      remoteRef:
        key: GitLab Runner Privileged
        property: runner-token
