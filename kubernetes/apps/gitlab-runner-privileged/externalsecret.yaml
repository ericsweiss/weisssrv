---
# Privileged (infrastructure) GitLab Runner authentication token sourced from
# 1Password via ESO (onepassword-connect provider). Consumed by the
# gitlab-runner-privileged HelmRelease (runners.secret:
# gitlab-runner-privileged-token) — see release.yaml. Deployed in the dedicated
# `gitlab-runner-privileged` namespace so the shared runner's namespace-scoped
# RBAC cannot read this token (the isolation boundary between the trusted and
# untrusted runner tiers).
#
# The chart's projected-secrets volume requires BOTH `runner-token` (the glrt-*
# authentication token) AND `runner-registration-token` keys, even when the
# legacy registration flow is unused. We populate the registration key with an
# empty string via template so the volume mount succeeds.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-privileged-token
  namespace: gitlab-runner-privileged
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: gitlab-runner-privileged-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        runner-token: "{{ .token }}"
        runner-registration-token: ""
  data:
    - secretKey: token
      remoteRef:
        key: GitLab Runner Privileged
        property: runner-token
