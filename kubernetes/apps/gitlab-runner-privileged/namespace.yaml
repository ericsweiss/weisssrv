---
# Dedicated namespace for the privileged (infrastructure) GitLab Runner. The
# split is the isolation boundary: the shared runner's namespaced RBAC cannot
# read this runner's token Secret. PSS enforce is privileged for its DinD pods.
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-runner-privileged
  labels:
    app.kubernetes.io/name: gitlab-runner-privileged
    app.kubernetes.io/part-of: gitlab
    app.kubernetes.io/managed-by: flux
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
