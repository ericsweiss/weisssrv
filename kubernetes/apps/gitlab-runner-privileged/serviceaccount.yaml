---
# CRITICAL: ServiceAccount for infrastructure-runner job pods, separate from the
# chart-managed manager SA. Job pods run root plus DinD on unprotected branches,
# so they get no RoleBinding and no mounted token; granting either hands
# arbitrary CI code the manager's secrets get/list and pods/exec/patch. CI jobs
# needing the kube-API load an explicit kubeconfig from 1Password instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner-privileged-jobs
  namespace: gitlab-runner-privileged
automountServiceAccountToken: false
