---
# ServiceAccount for infrastructure-runner JOB pods
# (runners.kubernetes.service_account in release.yaml), separate from the
# chart-managed manager SA. The manager's Role grants secrets get/list and
# pods/exec/patch in this namespace; job pods run root+DinD on unprotected
# branches, so they get no RoleBinding and no mounted token. CI jobs that need
# the kube-API load an explicit kubeconfig from 1Password instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner-privileged-jobs
  namespace: gitlab-runner-privileged
automountServiceAccountToken: false
