---
# Runner-side copy of the garage cache credential (kubernetes/apps/ci-cache):
# the chart mounts this Secret via runners.cache.secretName, and the
# accesskey/secretkey names are the chart's contract.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3access
  namespace: gitlab-runner-privileged
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: s3access
  data:
    - secretKey: accesskey
      remoteRef: {key: CI Cache Garage, property: access-key}
    - secretKey: secretkey
      remoteRef: {key: CI Cache Garage, property: secret-key}
