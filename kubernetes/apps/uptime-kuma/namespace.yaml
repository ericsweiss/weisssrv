---
apiVersion: v1
kind: Namespace
metadata:
  name: uptime-kuma
  labels:
    app.kubernetes.io/name: uptime-kuma
    app.kubernetes.io/part-of: uptime-kuma
    app.kubernetes.io/managed-by: flux
    # enforce restricted — the deployment runs the upstream `-rootless` image
    # variant (identical layers to the default tag plus `USER node`, UID 1000),
    # so the pod satisfies restricted outright: runAsNonRoot, drop ALL caps,
    # allowPrivilegeEscalation false, seccomp RuntimeDefault. The one
    # capability the default image could want is NET_RAW for ICMP monitors;
    # dropping it is deliberate (docs/45 § Monitor types), not a compromise.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
