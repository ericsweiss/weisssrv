---
# VPA Initial for the uptime-kuma Deployment: CPU+memory resize on natural pod
# restarts, mirroring homarr. Auto would evict, interrupting every in-flight
# probe and resetting the monitor state the status page renders.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: uptime-kuma
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: uptime-kuma}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # RequestsOnly; cap == the 512Mi limit in deployment.yaml (docs/33).
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 128Mi}
        maxAllowed: {cpu: 1, memory: 512Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
