---
# Split by AUTHENTICATION, not by host: the public status-page surface is
# unauthenticated on both names; dashboard, socket.io and /metrics exist only on the
# internal name behind lan-tailscale-only + forward-auth. No external catch-all (docs/45).

# External - status.ericsweiss.com (public status page only, slug-fenced)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: uptime-kuma-status
  namespace: uptime-kuma
  annotations:
    # external-dns auto-creates the Cloudflare record from this route — no
    # terraform/cloudflare edit (same as homarr/hermes; a Terraform entry is
    # only needed for a nested subdomain or a DNS-only record — docs/08).
    external-dns.alpha.kubernetes.io/target: ${cluster_external_domain}
spec:
  entryPoints:
    - websecure
  routes:
    # Slug-fenced allowlist: a new status page is external-invisible until its
    # slug is added. /api/badge/* stays out - it answers for ANY monitor id.
    - match: >-
        Host(`status.${cluster_external_domain}`) && (Path(`/`)
        || Path(`/status/services`) || PathPrefix(`/status/services/`)
        || Path(`/api/status-page/services`) || PathPrefix(`/api/status-page/services/`)
        || Path(`/api/status-page/heartbeat/services`)
        || Path(`/api/entry-page`)
        || PathPrefix(`/assets/`)
        || PathPrefix(`/upload/`)
        || Path(`/favicon.ico`)
        || Path(`/icon.svg`)
        || Path(`/manifest.json`)
        || Path(`/apple-touch-icon.png`)
        || Path(`/robots.txt`))
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
      services:
        - name: uptime-kuma
          port: 3001
  tls:
    secretName: uptime-kuma-ericsweiss-tls

---
# Internal - status.esweiss.com, status-page surface. Broader than the external
# route: every slug is readable unauthenticated here, fenced by lan-tailscale-only.
# Explicit priority so it beats the admin catch-all below.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: uptime-kuma-internal-status
  namespace: uptime-kuma
spec:
  entryPoints:
    - websecure
  routes:
    - match: >-
        Host(`status.${cluster_internal_domain}`) && (Path(`/`)
        || Path(`/status`) || PathPrefix(`/status/`)
        || Path(`/status-page`) || PathPrefix(`/status-page/`)
        || Path(`/api/status-page`) || PathPrefix(`/api/status-page/`)
        || Path(`/api/entry-page`) || PathPrefix(`/api/entry-page/`)
        || PathPrefix(`/assets/`)
        || PathPrefix(`/upload/`)
        || Path(`/favicon.ico`)
        || Path(`/icon.svg`)
        || Path(`/manifest.json`)
        || Path(`/apple-touch-icon.png`)
        || Path(`/robots.txt`))
      kind: Rule
      priority: 100
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: uptime-kuma
          port: 3001
  tls:
    secretName: uptime-kuma-esweiss-tls

---
# Internal - status.esweiss.com, ADMIN catch-all (/dashboard, /socket.io,
# /metrics, ...). lan-tailscale-only bounds it to the LAN/tailnet; authentik-auth
# is the login, with Kuma's own account underneath.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: uptime-kuma-internal
  namespace: uptime-kuma
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`status.${cluster_internal_domain}`)
      kind: Rule
      priority: 10
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: authentik-auth
          namespace: authentik
        - name: hsts-header
          namespace: traefik
      services:
        - name: uptime-kuma
          port: 3001
  tls:
    secretName: uptime-kuma-esweiss-tls
