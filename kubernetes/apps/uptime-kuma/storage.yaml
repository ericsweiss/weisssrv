---
# CRITICAL: SQLite on NFS tolerates exactly one writer, so replicas: 1 plus the
# Recreate strategy (deployment.yaml) must keep two pods from dual-mounting this
# PV. State lives on the encrypted ssd/appdata dataset, which the nightly
# replication to archive captures. Hostname-not-IP and the force annotation:
# apps/download-clients/_nfs-pv/resources.yaml and docs/07; docs/45 records the
# ext4-on-zvol fallback.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: uptime-kuma-data
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: uptime-kuma
spec:
  # Pre-bind to the intended claim so no other empty-storageClass PVC can grab
  # this PV first (which would block Kuma or expose the wrong NFS path).
  claimRef:
    namespace: uptime-kuma
    name: uptime-kuma-data
  capacity:
    storage: 4Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: pve-nas-01.${cluster_internal_domain}
    path: /appdata/uptime-kuma
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: uptime-kuma
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 4Gi
  volumeName: uptime-kuma-data
