---
# Uptime Kuma: one Node.js container serving the dashboard, the public status
# pages and /metrics on :3001. State is the SQLite DB on the NFS volume, and
# raw manifests carry the whole app because no chart is maintained (docs/45).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
  labels:
    app.kubernetes.io/name: uptime-kuma
    app.kubernetes.io/part-of: uptime-kuma
spec:
  # CRITICAL: replicas 1 and Recreate keep the RWO NFS volume from being
  # dual-mounted. SQLite is a single-writer store, so a rolling update would
  # corrupt the DB.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-kuma
        app.kubernetes.io/part-of: uptime-kuma
    spec:
      # NAS-avoid: state lives on NFS, not a node-local zvol, so nothing ties
      # this pod to the NAS agent. modern CPU keeps the Node.js image off the
      # Core2-era legacy nodes.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: ${cluster_node_label_domain}/nas
                    operator: DoesNotExist
      nodeSelector:
        ${cluster_node_label_domain}/general: "true"
        ${cluster_node_label_domain}/cpu: "modern"
      # No in-cluster API access — Kuma probes endpoints, it never reads k8s.
      automountServiceAccountToken: false
      # PSA `restricted` needs runAsNonRoot declared here; admission cannot
      # read the image's USER. 1000:2000 matches both the `-rootless` image and
      # the NFS export's all_squash target (storage.yaml).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          # A fresh socket per glibc A/AAAA pair: the conntrack DNAT-insert
          # race otherwise costs a ~5s resolver stall on every monitor target.
          - name: single-request-reopen
      containers:
        - name: uptime-kuma
          # Public image, no imagePullSecret. The `-rootless` variant runs as
          # USER node, which PSA restricted requires. `uptime_kuma_version` is
          # the bare tag and the suffix is appended here.
          image: louislam/uptime-kuma:${uptime_kuma_version}-rootless
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: ${cluster_timezone}
            # Explicit, so a future upstream default change cannot move the
            # port out from under the Service/probes/NetworkPolicy.
            - name: UPTIME_KUMA_PORT
              value: "3001"
            # The SQLite DB + uploads live on the NFS PV mounted here (upstream
            # default; pinned for the same reason as the port).
            - name: DATA_DIR
              value: /app/data
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          # tcpSocket, not httpGet: `/` is a 302 whose target depends on a
          # UI-set option (docs/45), so a listener-up check is the honest
          # signal. startupProbe covers the first-boot schema migration.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # Hand-set memory ceiling because the VPA is RequestsOnly (docs/33).
          # No CPU limit, per repo policy.
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              # Nothing added back: the rootless image needs no capability.
              # Without NET_RAW, ICMP monitors are unavailable; use TCP or HTTP
              # monitors instead (docs/45).
              drop: ["ALL"]
            # Node writes cache and tmp under the app tree as well as the
            # mounted /app/data, so the rootfs stays writable.
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
