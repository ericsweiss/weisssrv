---
# Authentik secrets sourced from 1Password via ESO (onepassword-connect provider).
# Consumed by authentik-server, authentik-worker, and bundled PostgreSQL
# (via chart's existingSecret wiring) — see release.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: authentik-secrets
    creationPolicy: Owner
  data:
    - secretKey: secret-key
      remoteRef:
        key: Authentik Secrets
        property: secret-key
    - secretKey: postgresql-password
      remoteRef:
        key: Authentik Secrets
        property: postgresql-password
    - secretKey: postgresql-admin-password
      remoteRef:
        key: Authentik Secrets
        property: postgresql-admin-password
    - secretKey: smtp-username
      remoteRef:
        key: SMTP Relay Auth
        property: username
    - secretKey: smtp-password
      remoteRef:
        key: SMTP Relay Auth
        property: password
