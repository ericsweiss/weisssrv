---
# Authentik secrets sourced from 1Password via ESO (onepasswordSDK provider).
# Consumed by authentik-server, authentik-worker, and bundled PostgreSQL
# (via chart's existingSecret wiring) — see release.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: authentik-secrets
    creationPolicy: Owner
  data:
    - secretKey: secret-key
      remoteRef:
        key: yssxkcr2ggovqbh2j5m3p3ji2i/secret-key  # Authentik Secrets
    - secretKey: postgresql-password
      remoteRef:
        key: yssxkcr2ggovqbh2j5m3p3ji2i/postgresql-password  # Authentik Secrets
    - secretKey: postgresql-admin-password
      remoteRef:
        key: yssxkcr2ggovqbh2j5m3p3ji2i/postgresql-admin-password  # Authentik Secrets
    - secretKey: smtp-username
      remoteRef:
        key: t7467o7ebr72s2ao223mtbv6ba/username  # SMTP Relay Auth
    - secretKey: smtp-password
      remoteRef:
        key: t7467o7ebr72s2ao223mtbv6ba/password  # SMTP Relay Auth
