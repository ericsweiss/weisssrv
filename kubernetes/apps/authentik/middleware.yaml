---
# ForwardAuth middleware for SSO-protected services
# Usage: middlewares: [{name: authentik-auth, namespace: authentik}]
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-auth
  namespace: authentik
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app

---
# CRITICAL: Traefik deletes every authResponseHeaders entry from the client
# request and re-adds it only from the outpost response. Adding Authorization to
# the shared authentik-auth middleware strips client credentials on every route
# using it. Attach this variant only to providers with basic_auth_enabled.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-auth-basic
  namespace: authentik
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - Authorization
