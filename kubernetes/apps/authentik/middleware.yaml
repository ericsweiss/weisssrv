---
# ForwardAuth middleware for SSO-protected services
# Usage: middlewares: [{name: authentik-auth, namespace: authentik}]
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-auth
  namespace: authentik
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app

---
# ForwardAuth middleware WITH basic-auth credential injection: identical to
# authentik-auth above, plus `Authorization` in authResponseHeaders. Traefik
# DELETES every listed header from the client request and re-adds it only if
# the outpost's auth response carries it (source-verified: traefik v3.7
# forward.go + authentik 2026.5.5 mode_forward.go) — so adding Authorization
# to the SHARED middleware above would strip client-sent credentials (API
# keys, basic auth) on every route that uses it. This dedicated variant is
# attached ONLY to routes whose upstream expects the authentik-injected
# credentials (proxy providers with basic_auth_enabled — terraform/authentik):
# nzbget + the AdGuard dashboards. Their upstreams validate the injected
# Authorization against their own local users, so the double-login disappears
# while direct/raw access still requires the app's real credentials.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-auth-basic
  namespace: authentik
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - Authorization
