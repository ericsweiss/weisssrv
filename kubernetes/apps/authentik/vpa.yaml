---
# VPA tiers: Initial for the stateless server/worker (resize on natural restarts,
# no eviction of an SSO provider), Off for PostgreSQL (recommendations only,
# applied by hand in release.yaml). The server is memory-only - the HPA owns CPU.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: authentik-server
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: authentik-server}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # RequestsOnly: maxAllowed.memory tracks the fixed 1536Mi limit in
      # release.yaml - move both in the same commit (docs/33 § Limit oscillation).
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {memory: 256Mi}
        maxAllowed: {memory: 1536Mi}
        controlledResources: [memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: authentik-worker
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: authentik-worker}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # Same shape as the server: maxAllowed tracks release.yaml's hand-set limit.
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 25m, memory: 256Mi}
        maxAllowed: {cpu: 1, memory: 1536Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: authentik-postgresql
spec:
  targetRef: {apiVersion: apps/v1, kind: StatefulSet, name: authentik-postgresql}
  updatePolicy: {updateMode: "Off"}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 50m, memory: 128Mi}
        maxAllowed: {cpu: 2, memory: 2Gi}
        controlledResources: [cpu, memory]
