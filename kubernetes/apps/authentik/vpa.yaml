---
# VPA: Initial for the stateless server/worker (resize on natural restarts,
# no proactive eviction of an SSO provider), Off for PostgreSQL (zvol-backed;
# recommendations only — apply by hand in release.yaml).
#
# authentik-server is memory-only here: its CPU is owned by the chart-native
# HPA (server.autoscaling in release.yaml, scales 2→4 on login bursts), so the
# VPA must leave CPU alone to avoid HPA/VPA-on-CPU thrashing. The worker stays
# single-replica + full VPA.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: authentik-server
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: authentik-server}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # RequestsOnly: the server's memory limit is a fixed burst ceiling set in
      # release.yaml. The default RequestsAndLimits preserves the manifest's
      # request:limit ratio, which had rewritten the live limit down to the
      # request (878Mi == 878Mi) against an 810Mi working set — the same
      # zero-headroom trap documented for prowlarr in
      # apps/download-clients/vpa.yaml.
      #
      # maxAllowed == the 1536Mi limit in release.yaml, the RequestsOnly shape
      # docs/33 § Limit oscillation prescribes: the request may rise to the
      # ceiling the pod is admitted against (Guaranteed QoS) but never past it.
      # It was 2Gi — ABOVE the limit, so the cap bounded nothing. Move both
      # numbers in the same commit.
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {memory: 256Mi}
        maxAllowed: {memory: 1536Mi}
        controlledResources: [memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: authentik-worker
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: authentik-worker}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # Same shape as the server: the 1536Mi limit in release.yaml is hand-set
      # and stays the real ceiling (it is also what a pod admitted WITHOUT the
      # mutating webhook gets — failurePolicy: Ignore), and maxAllowed.memory
      # tracks it. The default RequestsAndLimits would rescale the limit with
      # the request instead, so the effective ceiling would be whatever the last
      # recommendation happened to be rather than the number reviewed here.
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 25m, memory: 256Mi}
        maxAllowed: {cpu: 1, memory: 1536Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: authentik-postgresql
spec:
  targetRef: {apiVersion: apps/v1, kind: StatefulSet, name: authentik-postgresql}
  updatePolicy: {updateMode: "Off"}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 50m, memory: 128Mi}
        maxAllowed: {cpu: 2, memory: 2Gi}
        controlledResources: [cpu, memory]
