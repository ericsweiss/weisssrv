---
# VPA: Initial for the stateless server/worker (resize on natural restarts,
# no proactive eviction of an SSO provider), Off for PostgreSQL (zvol-backed;
# recommendations only — apply by hand in release.yaml).
#
# authentik-server is memory-only here: its CPU is owned by the chart-native
# HPA (server.autoscaling in release.yaml, scales 2→4 on login bursts), so the
# VPA must leave CPU alone to avoid HPA/VPA-on-CPU thrashing. The worker stays
# single-replica + full VPA.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: authentik-server
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: authentik-server}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {memory: 256Mi}
        maxAllowed: {memory: 2Gi}
        controlledResources: [memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: authentik-worker
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: authentik-worker}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 256Mi}
        maxAllowed: {cpu: 1, memory: 1536Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: authentik-postgresql
spec:
  targetRef: {apiVersion: apps/v1, kind: StatefulSet, name: authentik-postgresql}
  updatePolicy: {updateMode: "Off"}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 50m, memory: 128Mi}
        maxAllowed: {cpu: 2, memory: 2Gi}
        controlledResources: [cpu, memory]
