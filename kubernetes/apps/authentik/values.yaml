# Authentik Helm Values
# https://github.com/goauthentik/helm

global:
  # Canonical external domain for AUTHENTIK_HOST and redirect URLs
  # External clients (internet) access this; internal clients use auth.esweiss.com
  # but SSO flows redirect to this domain for OAuth callbacks
  domain: auth.ericsweiss.com

authentik:
  secret_key: ""  # From existingSecret

  # SMTP relay for notifications
  # smtp-relay.esweiss.com requires SASL authentication on port 587
  email:
    host: smtp-relay.esweiss.com
    port: 587
    use_tls: true
    use_ssl: false
    from: "Authentik SSO <authentik@esweiss.com>"
    # Username/password injected from authentik-secrets via env vars
    username: ""  # Set via AUTHENTIK_EMAIL__USERNAME env var
    password: ""  # Set via AUTHENTIK_EMAIL__PASSWORD env var

  error_reporting:
    enabled: false

  postgresql:
    host: '{{ .Release.Name }}-postgresql'
    name: authentik
    user: authentik
    password: ""  # From existingSecret

server:
  replicas: 2

  # Version set via Taskfile from ansible/inventories/prod/group_vars/all.yml

  env:
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: postgresql-password
    - name: AUTHENTIK_EMAIL__USERNAME
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: smtp-username
    - name: AUTHENTIK_EMAIL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: smtp-password

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Spread replicas across nodes
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: server
                app.kubernetes.io/name: authentik
            topologyKey: kubernetes.io/hostname

  metrics:
    enabled: true
    serviceMonitor:
      enabled: false  # Enable with Prometheus Operator

  ingress:
    enabled: false  # Using Traefik IngressRoute

worker:
  replicas: 1

  # Version set via Taskfile from ansible/inventories/prod/group_vars/all.yml

  env:
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: postgresql-password
    - name: AUTHENTIK_EMAIL__USERNAME
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: smtp-username
    - name: AUTHENTIK_EMAIL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: smtp-password

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Bundled PostgreSQL - consider external for HA
postgresql:
  enabled: true
  auth:
    username: authentik
    database: authentik
    existingSecret: authentik-secrets
    secretKeys:
      adminPasswordKey: postgresql-admin-password
      userPasswordKey: postgresql-password
  primary:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""  # local-path
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # Pin to NAS agent for local storage
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - k3s-agt-nas-01
    # Tolerate NAS taint to run on k3s-agt-nas-01
    tolerations:
      - key: esweiss.com/nas
        operator: Equal
        value: "true"
        effect: PreferNoSchedule

# Redis not required as of Authentik 2025.10
redis:
  enabled: false

serviceAccount:
  create: true
