---
# Authentik HelmRelease — adopts the existing release `authentik` in the
# authentik namespace (matching releaseName + targetNamespace). Chart version
# and image tags substituted from cluster-versions ConfigMap.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  releaseName: authentik
  # Authentik upgrades run PostgreSQL schema migrations that routinely take
  # 5-10 minutes; Flux's 5m default would remediate mid-migration and risk
  # schema corruption.
  timeout: 15m
  chart:
    spec:
      chart: authentik
      version: "${authentik_version}"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
      interval: 12h
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
      remediateLastFailure: true
  # Image tags substituted from cluster-versions ConfigMap via Kustomization
  # postBuild.substituteFrom (apps top-level Kustomization). Inline refs keep
  # everything in one file and avoid Flux's cross-namespace valuesFrom limits:
  # HelmRelease.spec.valuesFrom[].namespace is not supported, so the referenced
  # ConfigMap/Secret must live in the same namespace as the HelmRelease.
  # (Note: chart sourceRef DOES support cross-namespace — this HelmRelease's
  # sourceRef points at flux-system/HelmRepository/authentik, which works.)
  values:
    # No canonical-domain value: the chart has no such key, and the OIDC
    # issuer/redirect URLs derive from the request Host (auth.ericsweiss.com
    # via the external IngressRoute, auth.esweiss.com internally).
    authentik:
      # secret_key sourced from authentik-secrets via env (see server.env, worker.env below)

      # SMTP relay for notifications
      # smtp-relay.esweiss.com requires SASL authentication on port 587
      email:
        host: smtp-relay.${cluster_internal_domain}
        port: 587
        use_tls: true
        use_ssl: false
        from: "Authentik SSO <authentik@${cluster_internal_domain}>"
        # Username/password injected from authentik-secrets via env vars
        username: ""  # Set via AUTHENTIK_EMAIL__USERNAME env var
        password: ""  # Set via AUTHENTIK_EMAIL__PASSWORD env var

      error_reporting:
        enabled: false

      postgresql:
        host: '{{ .Release.Name }}-postgresql'
        name: authentik
        user: authentik
        password: ""  # From existingSecret

    server:
      # Horizontal autoscaling via the chart's own server.autoscaling (min 2 /
      # max 4 on ~75% CPU). Using the chart toggle (not a standalone HPA) makes
      # the chart omit `.spec.replicas` from the server Deployment, so a helm
      # upgrade can't reset it to a static value and churn against the HPA.
      # CPU is owned here; vpa.yaml scopes authentik-server to memory only so
      # the VPA does not contend with the HPA on CPU. The worker stays single-
      # replica with full VPA and no HPA.
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 4
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 75
        # Damp HPA flap: the server idles well under the 75% trip point, but
        # sub-minute SSO and task-reconcile spikes cross it and used to bounce
        # 2→4. Require ~2 min of sustained pressure, one pod at a time; keep the
        # default 5-min downscale damping.
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 120
            policies:
              - type: Pods
                value: 1
                periodSeconds: 60
          scaleDown:
            stabilizationWindowSeconds: 300
            policies:
              - type: Pods
                value: 1
                periodSeconds: 120

      pdb:
        enabled: true
        minAvailable: 1

      # Pod hardening: run the server under the runtime's default seccomp
      # profile (chart-exposed pod-level securityContext). NOTE: automount of
      # the SA token is intentionally left enabled — authentik uses the
      # Kubernetes API for its integration/outpost controller (serviceAccount.create
      # is true), so disabling the token mount would break that. seccompProfile
      # is the only universally-safe value the chart cleanly exposes here.
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      image:
        tag: "${authentik_version}"

      env:
        # Base URL (scheme+host only): advisory in 2026.8, REQUIRED from
        # 2026.11. The canonical origin is the EXTERNAL issuer host — the
        # OIDC issuer is always auth.<external> even for internal-only apps.
        - name: AUTHENTIK_WEB__BASE_URL
          value: "https://auth.${cluster_external_domain}"
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: secret-key
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: postgresql-password
        - name: AUTHENTIK_EMAIL__USERNAME
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: smtp-username
        - name: AUTHENTIK_EMAIL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: smtp-password

      # CPU request is static — the HPA owns CPU, and sizing it so the 75%
      # target sits well above the idle draw is what stops the threshold
      # tripping at near-idle.
      #
      # The memory limit is hand-set and permanent: vpa.yaml is
      # controlledValues: RequestsOnly, so the VPA never rewrites it and 1536Mi
      # is the ceiling every pod is admitted against. That is the whole
      # guarantee — the REQUEST is still VPA-managed, bounded by that policy's
      # maxAllowed, which equals this limit (1536Mi): under RequestsOnly the
      # request may rise to the ceiling the pod is admitted against, never past
      # it. Moving this limit means moving that cap in the same commit.
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          memory: 1536Mi

      # Spread replicas across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: server
                    app.kubernetes.io/name: authentik
                topologyKey: kubernetes.io/hostname

      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

      ingress:
        enabled: false  # Using Traefik IngressRoute

    worker:
      replicas: 1

      # Pod hardening: run the worker under the runtime's default seccomp
      # profile (chart-exposed pod-level securityContext). SA token automount is
      # left enabled here too — the worker drives the Kubernetes integration /
      # embedded outpost reconciliation and needs API access.
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      image:
        tag: "${authentik_version}"

      # The worker healthcheck needs /dev/shm for its PID file. The chart's keys
      # are 'additionalVolumes'/'additionalVolumeMounts', not 'volumes'.
      additionalVolumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi

      additionalVolumeMounts:
        - name: shm
          mountPath: /dev/shm

      # More generous probe timeouts - worker can be slow when processing tasks
      livenessProbe:
        exec:
          command:
            - ak
            - healthcheck
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 5

      startupProbe:
        exec:
          command:
            - ak
            - healthcheck
        initialDelaySeconds: 60
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 30

      env:
        # Base URL (scheme+host only): advisory in 2026.8, REQUIRED from
        # 2026.11. The canonical origin is the EXTERNAL issuer host — the
        # OIDC issuer is always auth.<external> even for internal-only apps.
        - name: AUTHENTIK_WEB__BASE_URL
          value: "https://auth.${cluster_external_domain}"
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: secret-key
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: postgresql-password
        - name: AUTHENTIK_EMAIL__USERNAME
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: smtp-username
        - name: AUTHENTIK_EMAIL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: smtp-password

      resources:
        requests:
          cpu: 100m
          memory: 768Mi
        limits:
          memory: 1536Mi

    postgresql:
      enabled: true
      image:
        tag: "${postgresql_version}"
      # postgres_exporter sidecar. The chart-rendered ServiceMonitor is the ONLY
      # scrape of it — see observability/service-monitors/postgres.yaml for why
      # no authentik PodMonitor exists. Its ingress allow lives in
      # networkpolicy.yaml, and the flux:lint scrape gate is namespace-level
      # only, so a mis-scoped :9187 rule passes CI and surfaces as TargetDown.
      #
      # extraEnvVars re-point the exporter at the `authentik` role: the subchart
      # hardcodes DATA_SOURCE_USER to `postgres`, which this deployment's
      # official-postgres image never creates. Later duplicates win, so these
      # must stay last.
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s
        extraEnvVars:
          - name: DATA_SOURCE_USER
            value: authentik
          - name: DATA_SOURCE_PASS_FILE
            value: /opt/bitnami/postgresql/secrets/postgresql-password
          - name: DATA_SOURCE_URI
            value: 127.0.0.1:5432/authentik?sslmode=disable
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      auth:
        username: authentik
        database: authentik
        existingSecret: authentik-secrets
        secretKeys:
          adminPasswordKey: postgresql-admin-password
          userPasswordKey: postgresql-password
      primary:
        persistence:
          enabled: true
          size: 10Gi
          storageClass: ""
          existingClaim: authentik-postgres-data  # Use dedicated ZFS zvol PVC
        # Hand-applied from the Off-tier VPA recommendation (vpa.yaml keeps
        # this StatefulSet recommendation-only): request tracks the recorded
        # target, limit is ~1.5x it for burst headroom. Re-apply from the
        # recommendation when it moves (docs/33).
        resources:
          requests:
            cpu: 100m
            memory: 640Mi
          limits:
            memory: 1Gi
        # Pin to NAS agent for local storage
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - k3s-agt-nas-01
        # Tolerate NAS taint to run on k3s-agt-nas-01
        tolerations:
          - key: ${cluster_node_label_domain}/nas
            operator: Equal
            value: "true"
            effect: PreferNoSchedule

    # Authentik dropped the bundled Redis dependency in 2025.10 — all state
    # now lives in PostgreSQL.
    redis:
      enabled: false

    serviceAccount:
      create: true
