---
# Authentik HelmRelease — adopts the existing release `authentik` in the
# authentik namespace (matching releaseName + targetNamespace). Chart version
# and image tags substituted from cluster-versions ConfigMap.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  releaseName: authentik
  # Correct out-of-band edits to chart-rendered objects — see the rationale on
  # controllers/traefik/release.yaml. Safe here: no webhook caBundle, and
  # server.autoscaling omits .spec.replicas so the HPA has nothing to fight.
  driftDetection:
    mode: enabled
  # Authentik upgrades run PostgreSQL schema migrations that routinely take
  # 5-10 minutes; Flux's 5m default would remediate mid-migration and risk
  # schema corruption.
  timeout: 15m
  chart:
    spec:
      chart: authentik
      version: "${authentik_version}"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
      interval: 12h
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
      remediateLastFailure: true
  # Image tags substituted from the cluster-versions ConfigMap. Values stay inline:
  # HelmRelease.spec.valuesFrom has no namespace field, so a referenced ConfigMap
  # would have to live in this namespace.
  values:
    # No canonical-domain value: the chart has no such key, and the OIDC
    # issuer/redirect URLs derive from the request Host (auth.ericsweiss.com
    # via the external IngressRoute, auth.esweiss.com internally).
    authentik:
      # secret_key sourced from authentik-secrets via env (see server.env, worker.env below)

      # SMTP relay for notifications
      # The relay requires SASL authentication on port 587
      email:
        host: ${cluster_smtp_host}
        port: 587
        use_tls: true
        use_ssl: false
        from: "Authentik SSO <authentik@${cluster_internal_domain}>"
        # Username/password injected from authentik-secrets via env vars
        username: ""  # Set via AUTHENTIK_EMAIL__USERNAME env var
        password: ""  # Set via AUTHENTIK_EMAIL__PASSWORD env var

      error_reporting:
        enabled: false

      postgresql:
        host: '{{ .Release.Name }}-postgresql'
        name: authentik
        user: authentik
        password: ""  # From existingSecret

    server:
      # Chart-native autoscaling (min 2 / max 4 on ~75% CPU): the chart toggle
      # makes it omit `.spec.replicas`, so a helm upgrade cannot churn against
      # the HPA. vpa.yaml keeps the server memory-only so the VPA stays off CPU.
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 4
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 75
        # Damp HPA flap: require ~2 min of sustained CPU pressure, one pod at a
        # time; default 5-min downscale damping.
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 120
            policies:
              - type: Pods
                value: 1
                periodSeconds: 60
          scaleDown:
            stabilizationWindowSeconds: 300
            policies:
              - type: Pods
                value: 1
                periodSeconds: 120

      pdb:
        enabled: true
        minAvailable: 1

      # Pod hardening is limited to the chart-exposed seccompProfile. SA token
      # automount stays ON: authentik reaches the Kubernetes API for its
      # integration/outpost controller.
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      image:
        tag: "${authentik_version}"

      env:
        # Base URL (scheme+host only): advisory in 2026.8, REQUIRED from
        # 2026.11. The canonical origin is the EXTERNAL issuer host — the
        # OIDC issuer is always auth.<external> even for internal-only apps.
        - name: AUTHENTIK_WEB__BASE_URL
          value: "https://auth.${cluster_external_domain}"
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: secret-key
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: postgresql-password
        - name: AUTHENTIK_EMAIL__USERNAME
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: smtp-username
        - name: AUTHENTIK_EMAIL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: smtp-password

      # CPU request is static - the HPA owns CPU. The memory limit is hand-set and is
      # the real ceiling; vpa.yaml is RequestsOnly with maxAllowed equal to it, so move
      # both numbers in the same commit (docs/33).
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          memory: 1536Mi

      # Spread replicas across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: server
                    app.kubernetes.io/name: authentik
                topologyKey: kubernetes.io/hostname

      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

      ingress:
        enabled: false  # Using Traefik IngressRoute

    worker:
      replicas: 1

      # Same as the server: chart-exposed seccompProfile only, SA token automount
      # left on for the worker's Kubernetes integration and embedded outpost
      # reconciliation.
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      image:
        tag: "${authentik_version}"

      # The worker healthcheck needs /dev/shm for its PID file. The chart's keys
      # are 'additionalVolumes'/'additionalVolumeMounts', not 'volumes'.
      additionalVolumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi

      additionalVolumeMounts:
        - name: shm
          mountPath: /dev/shm

      # More generous probe timeouts - worker can be slow when processing tasks
      livenessProbe:
        exec:
          command:
            - ak
            - healthcheck
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 5

      startupProbe:
        exec:
          command:
            - ak
            - healthcheck
        initialDelaySeconds: 60
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 30

      env:
        # Base URL (scheme+host only): advisory in 2026.8, REQUIRED from
        # 2026.11. The canonical origin is the EXTERNAL issuer host — the
        # OIDC issuer is always auth.<external> even for internal-only apps.
        - name: AUTHENTIK_WEB__BASE_URL
          value: "https://auth.${cluster_external_domain}"
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: secret-key
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: postgresql-password
        - name: AUTHENTIK_EMAIL__USERNAME
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: smtp-username
        - name: AUTHENTIK_EMAIL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: smtp-password

      resources:
        requests:
          cpu: 100m
          memory: 768Mi
        limits:
          memory: 1536Mi

    postgresql:
      enabled: true
      image:
        tag: "${postgresql_version}"
      # postgres_exporter sidecar; its only scrape is the chart-rendered
      # ServiceMonitor, its ingress allow is in networkpolicy.yaml. extraEnvVars
      # re-point it at the `authentik` role (the subchart hardcodes `postgres`).
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s
        extraEnvVars:
          - name: DATA_SOURCE_USER
            value: authentik
          - name: DATA_SOURCE_PASS_FILE
            value: /opt/bitnami/postgresql/secrets/postgresql-password
          - name: DATA_SOURCE_URI
            value: 127.0.0.1:5432/authentik?sslmode=disable
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      auth:
        username: authentik
        database: authentik
        existingSecret: authentik-secrets
        secretKeys:
          adminPasswordKey: postgresql-admin-password
          userPasswordKey: postgresql-password
      primary:
        persistence:
          enabled: true
          size: 10Gi
          storageClass: ""
          existingClaim: authentik-postgres-data  # Use dedicated ZFS zvol PVC
        # Hand-applied from the Off-tier VPA recommendation (vpa.yaml is
        # recommendation-only here): request tracks the recorded target, limit
        # ~1.5x for burst. Re-apply when the recommendation moves (docs/33).
        resources:
          requests:
            cpu: 100m
            memory: 640Mi
          limits:
            memory: 1Gi
        # Pinned to the storage node, where the data volume lives. Keyed on the
        # label, like the toleration below.
        nodeSelector:
          ${cluster_node_label_domain}/nas: "true"
        tolerations:
          - key: ${cluster_node_label_domain}/nas
            operator: Equal
            value: "true"
            effect: PreferNoSchedule

    # The chart's Redis is unused: all authentik state lives in PostgreSQL.
    redis:
      enabled: false

    serviceAccount:
      create: true
