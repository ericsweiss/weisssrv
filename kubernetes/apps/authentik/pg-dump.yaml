---
# Nightly logical backup of the bundled Authentik PostgreSQL to the offsite-eligible
# NFS export /backups-apps/authentik (the postgres PV alone is only a crash-consistent
# zvol snapshot). Schedule rationale, retention and restore: README, docs/42.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-pg-dump
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-pg-dump
    app.kubernetes.io/component: backup
spec:
  schedule: "30 2 * * *"
  # Local time so 02:30 lines up with the NAS's local-time overnight jobs
  # (vzdump/media-mover/archive) rather than the controller's default UTC.
  timeZone: ${cluster_timezone}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      # Bounds how long a failed Job object keeps KubeJobFailed firing after the
      # next run has already succeeded, while leaving a half-day to inspect it.
      ttlSecondsAfterFinished: 43200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: authentik-pg-dump
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 2000
            fsGroup: 2000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: postgres:${postgresql_version}
              imagePullPolicy: IfNotPresent
              # bash, not sh: dash has no pipefail, so a failed pg_dump would
              # still gzip to exit 0 and rotate in a truncated dump.
              command: ["/bin/bash", "-ec"]
              # Brace-free shell vars ($var): ${var} is Flux postBuild syntax.
              args:
                - |
                  set -o pipefail
                  # Wait for NetworkPolicy ipset propagation (~5-15s) before dialing.
                  for i in $(seq 1 30); do
                    if pg_isready -q; then break; fi
                    if [ "$i" = 30 ]; then echo "postgres unreachable after 150s" >&2; exit 1; fi
                    sleep 5
                  done
                  # Sweep .tmp files from crashed runs; the retention glob only sees *.sql.gz.
                  rm -f /backups/authentik-*.sql.gz.tmp
                  ts="$(date +%Y%m%d-%H%M%S)"
                  out="/backups/authentik-$ts.sql.gz"
                  echo "pg_dump $PGDATABASE -> $out"
                  pg_dump --clean --if-exists | gzip -c > "$out.tmp"
                  mv "$out.tmp" "$out"
                  # Retain the newest $RETENTION dumps; delete older ones.
                  ls -1t /backups/authentik-*.sql.gz 2>/dev/null \
                    | tail -n +$((RETENTION + 1)) \
                    | while IFS= read -r f; do rm -f "$f"; done
                  echo "done; kept:"; ls -1t /backups/authentik-*.sql.gz
              env:
                - name: PGHOST
                  value: authentik-postgresql.authentik.svc.cluster.local
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: authentik
                - name: PGDATABASE
                  value: authentik
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: authentik-secrets
                      key: postgresql-password
                - name: RETENTION
                  value: "7"
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                # The tmp emptyDir's sizeLimit is the cap; this request is what
                # ranks the pod by its own usage under node pressure.
                requests:
                  cpu: 50m
                  memory: 64Mi
                  ephemeral-storage: 64Mi
                limits:
                  memory: 256Mi
                  # Above the emptyDir cap, which shares this budget with the rotated
                  # container logs; at the cap the kubelet evicts first.
                  ephemeral-storage: 128Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: authentik-pg-dump
            - name: tmp
              emptyDir:
                # HOME for pg_dump; the dump itself streams to the backups PVC.
                # Over sizeLimit the kubelet evicts the pod.
                sizeLimit: 64Mi
