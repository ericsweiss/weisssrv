# Authentik PostgreSQL storage: hostPath /mnt/postgres-data on k3s-agt-nas-01 —
# ext4 on a ZFS zvol declared in vm_additional_disks (hosts.yml), so the data
# outlives the VM.

apiVersion: v1
kind: PersistentVolume
metadata:
  name: authentik-postgres-data
  labels:
    type: local
    app: authentik
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/postgres-data
    type: Directory
  # Pin to k3s-agt-nas-01 where the zvol is attached
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-agt-nas-01

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-postgres-data
  namespace: authentik
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 10Gi
  volumeName: authentik-postgres-data

---
# authentik-pg-dump landing zone: tank/backups/apps/authentik, the encrypted
# file-walkable dump dataset that rides both the nightly archive replication and
# the restic offsite B2 walk — where a zvol snapshot never could (docs/42).
#
# DEPLOY-ORDER DEPENDENCY: the nas_storage role creates the subdir and its
# per-app export, so run the ansible storage deploy before this PV reconciles.
#
# NFS-over-TLS PV; hostname (not IP) + force annotation rationale:
# apps/download-clients/_nfs-pv/resources.yaml and docs/07.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: authentik-pg-dump
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: authentik
spec:
  claimRef:
    namespace: authentik
    name: authentik-pg-dump
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: pve-nas-01.${cluster_internal_domain}
    path: /backups-apps/authentik
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-pg-dump
  namespace: authentik
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
  volumeName: authentik-pg-dump
