---
apiVersion: v1
kind: Namespace
metadata:
  name: wg-easy
  labels:
    app.kubernetes.io/name: wg-easy
    app.kubernetes.io/component: vpn
    app.kubernetes.io/managed-by: flux
    # PSA: enforce privileged - wg-easy needs root, NET_ADMIN and a privileged
    # sysctl initContainer. warn/audit stay restricted so any OTHER pod landing
    # here is flagged; wg-easy is the only workload in this namespace (docs/38).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
