---
# Internal-only admin UI: lan-tailscale-only, then authentik-auth (vpn-admins
# group; wg-easy has no native OIDC, so SSO is enforced at the proxy, docs/38),
# then hsts-header.

# CRITICAL: no public IngressRoute and no external-dns annotation here. The
# admin UI must never be internet-reachable.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wg-easy-internal
  namespace: wg-easy
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`vpn.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: authentik-auth
          namespace: authentik
        - name: hsts-header
          namespace: traefik
      services:
        - name: wg-easy-ui
          port: 51821
  tls:
    secretName: wg-easy-esweiss-tls
