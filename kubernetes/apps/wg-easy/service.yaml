---
# WireGuard UDP endpoint. MetalLB L2 announces the pinned VIP .99 (vpn-pool in
# infrastructure/configs/metallb-ip-pools.yaml). externalTrafficPolicy Local
# keeps the client source IP and pins the announcement to the pod's node.

# The physical router forwards WAN :51820/udp to .99.
apiVersion: v1
kind: Service
metadata:
  name: wg-easy
  namespace: wg-easy
  labels:
    app.kubernetes.io/name: wg-easy
  annotations:
    metallb.io/loadBalancerIPs: ${cluster_wg_easy_vip}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  # MetalLB L2 does not need per-node NodePorts; don't allocate one.
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/name: wg-easy
  ports:
    - name: wireguard
      port: 51820
      targetPort: wireguard
      protocol: UDP

---
# Admin UI (+ /metrics/prometheus) — ClusterIP only. Reached exclusively through
# Traefik (internal IngressRoute, vpn.esweiss.com) and scraped by the ServiceMonitor.
# There is deliberately NO LoadBalancer / external route for the UI.
apiVersion: v1
kind: Service
metadata:
  name: wg-easy-ui
  namespace: wg-easy
  labels:
    app.kubernetes.io/name: wg-easy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wg-easy
  ports:
    - name: ui
      port: 51821
      targetPort: ui
      protocol: TCP
