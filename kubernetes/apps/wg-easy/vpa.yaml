---
# VPA: Initial for the single stateless Deployment — right-size cpu+memory on
# natural restarts, no proactive eviction of the live VPN. Small ceiling; wg-easy
# is a lightweight Node process.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: wg-easy
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wg-easy
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      # RequestsOnly; cap == the 384Mi limit in deployment.yaml, which clears
      # the 220Mi 30d working-set peak +60% (docs/33 § Limit oscillation).
      - containerName: wg-easy
        minAllowed: {cpu: 25m, memory: 128Mi}
        maxAllowed: {cpu: 500m, memory: 384Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
      # Leave the one-shot privileged sysctl initContainer alone.
      - containerName: sysctl
        mode: "Off"
