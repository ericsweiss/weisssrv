---
# wg-easy state on NFS (/appdata/wg-easy): SQLite DB + wg0 config, i.e. the server
# keypair, every peer key/PSK and the admin hash. On ssd/appdata - ZFS-encrypted and
# in the nightly archive replication. PV shape: apps/download-clients/_nfs-pv, docs/07.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: wg-easy-appdata
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: wg-easy
spec:
  # Pre-bind to the intended claim so no other empty-storageClass PVC can grab
  # this PV first.
  claimRef:
    namespace: wg-easy
    name: wg-easy-config
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: pve-nas-01.${cluster_internal_domain}
    path: /appdata/wg-easy
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wg-easy-config
  namespace: wg-easy
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 1Gi
  volumeName: wg-easy-appdata
