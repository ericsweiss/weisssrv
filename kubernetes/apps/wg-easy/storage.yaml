---
# wg-easy state on NFS (/appdata/wg-easy from pve-nas-01). This holds the
# SQLite database + wg0 config = the server keypair, every peer's public key and
# preshared key, and the admin credential hash. Sensitive at rest — it lives on
# ssd/appdata (ZFS native encryption) and is captured by the archive replicator
# for free (child of the ssd/appdata SRC_LIST root; no SRC_LIST edit needed).
#
# NFS (not a zvol) because wg-easy state is tiny and the pod is not pinned to
# the NAS node — a single-writer SQLite DB over nfsvers=4.2/hard is safe with
# replicas:1 + Recreate (no concurrent openers).
#
# NFS-over-TLS PV; hostname (not IP) + force annotation rationale:
# apps/download-clients/_nfs-pv/resources.yaml and docs/07.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: wg-easy-appdata
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: wg-easy
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: pve-nas-01.${cluster_internal_domain}
    path: /appdata/wg-easy
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wg-easy-config
  namespace: wg-easy
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 1Gi
  volumeName: wg-easy-appdata
