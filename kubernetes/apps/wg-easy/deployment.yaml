---
# wg-easy: WireGuard VPN and admin UI, internet-exit only (docs/38). The image
# tag has no leading "v"; the pin is the wg_easy_version key.

# CRITICAL: replicas 1 with Recreate. The SQLite state on NFS tolerates exactly
# one writer, and only one node may own the WireGuard listener behind the VIP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-easy
  namespace: wg-easy
  labels:
    app.kubernetes.io/name: wg-easy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wg-easy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wg-easy
    spec:
      # HARD pin to the ingress agents: with ETP Local, MetalLB announces the VIP
      # from the pod's node, and only those agents carry sg-k3s-ingress-pub, which
      # admits the WAN :51820/udp forward. A soft avoid would black-hole it.
      nodeSelector:
        ${cluster_node_label_domain}/ingress: "true"
      # wg-easy is not a Kubernetes-integrated app; it needs no API access.
      automountServiceAccountToken: false
      # k3s does not enable SeccompDefault, so this is what keeps the container
      # off Unconfined. The privileged sysctl initContainer runs Unconfined
      # regardless, and NET_RAW is a capability, not a seccomp, check.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Public resolvers for the POD itself, deliberately NOT kube-dns: the
      # missing kube-dns egress allow is what keeps forwarded client traffic off
      # internal DNS (networkpolicy.yaml).
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 1.0.0.1
        options:
          - name: ndots
            value: "1"
      initContainers:
        # Sets the pod-netns sysctls WireGuard forwarding needs. Not pod-level
        # securityContext.sysctls: the k3s kubelet does not allowlist them (docs/38).
        - name: sysctl
          image: busybox:${busybox_version}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              sysctl -w net.ipv4.ip_forward=1
              sysctl -w net.ipv4.conf.all.src_valid_mark=1
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
      containers:
        - name: wg-easy
          image: ghcr.io/wg-easy/wg-easy:${wg_easy_version}
          imagePullPolicy: IfNotPresent
          env:
            # First-boot bootstrap (INIT_*)
            # Applied ONLY when /etc/wireguard has no database yet. Editing these
            # later is a no-op; change config in the UI. See docs/38.
            - name: INIT_ENABLED
              value: "true"
            - name: INIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wg-easy-secrets
                  key: init-username
            - name: INIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wg-easy-secrets
                  key: init-password
            # Endpoint clients dial. External host (Cloudflare DNS-only A record
            # + DDNS follows the home IP); router forwards WAN :51820/udp here.
            - name: INIT_HOST
              value: "vpn.${cluster_external_domain}"
            - name: INIT_PORT
              value: "51820"
            # Public resolvers pushed to clients — NEVER the internal AdGuard.
            # Friends' devices are untrusted and must not learn internal names
            # or reach 10.0.10.150/.160. Part of the no-LAN model (docs/38).
            - name: INIT_DNS
              value: "1.1.1.1,1.0.0.1"
            - name: INIT_IPV4_CIDR
              value: "10.8.0.0/24"
            # Required paired with INIT_IPV4_CIDR (same INIT group). IPv6 is
            # disabled below, so this ULA range is stored but never assigned.
            - name: INIT_IPV6_CIDR
              value: "fdcc:ad94:bacf:61a3::/64"
            # Full-tunnel: every client routes ALL v4 traffic through the VPN.
            # The no-LAN guarantee is enforced server-side by the egress
            # NetworkPolicy, not by trusting this client route.
            - name: INIT_ALLOWED_IPS
              value: "0.0.0.0/0"
            # Runtime config
            # v4-only: the LAN has no working IPv6 egress, so an IPv6 tunnel
            # would black-hole. Disables v6 interface addrs + firewall rules.
            - name: DISABLE_IPV6
              value: "true"
            # TLS terminates at Traefik; the pod serves the UI over plain HTTP on
            # 51821. The UI is never exposed outside Traefik (ClusterIP + the
            # ingress NetworkPolicy only admits the traefik + observability ns).
            - name: INSECURE
              value: "true"
            - name: PORT
              value: "51821"
            - name: HOST
              value: "0.0.0.0"
          ports:
            - name: wireguard
              containerPort: 51820
              protocol: UDP
            - name: ui
              containerPort: 51821
              protocol: TCP
          securityContext:
            # drop ALL, then add back only what wg-quick needs: NET_ADMIN for wg0,
            # NET_RAW for the image's iptables-legacy PostUp hooks. Runs as uid 0.
            # Why SYS_MODULE and DAC_OVERRIDE are not granted: docs/38.
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
          readinessProbe:
            tcpSocket:
              port: ui
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # NFS-ESTALE self-heal: the UI keeps answering on :51821 while the
          # NFS-backed state is unreadable, so readiness cannot catch a stale
          # handle. Timing is conservative so a brief NFS blip cannot flap-restart.
          livenessProbe:
            exec:
              command: ["stat", "/etc/wireguard"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 192Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: config
              mountPath: /etc/wireguard
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: wg-easy-config
