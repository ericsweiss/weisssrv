---
# wg-easy — WireGuard VPN + admin UI (internet-exit only; see docs/38 for the
# two-layer no-LAN egress security model). Image tag has no leading "v"
# (upstream container convention); the pin is the wg_easy_version key.
#
# replicas:1 + Recreate: the SQLite state on NFS tolerates exactly one writer,
# and only one node may own the WireGuard listener behind the MetalLB VIP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-easy
  namespace: wg-easy
  labels:
    app.kubernetes.io/name: wg-easy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wg-easy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wg-easy
    spec:
      # HARD pin to the ingress agents: with ETP Local, MetalLB announces the
      # VIP from the pod's node, and only those agents carry the
      # sg-k3s-ingress-pub group that admits the WAN :51820/udp forward.
      # Selecting on the label excludes the NAS agent by construction — a soft
      # avoid could land there and silently black-hole the endpoint.
      nodeSelector:
        ${cluster_node_label_domain}/ingress: "true"
      # wg-easy is not a Kubernetes-integrated app; it needs no API access.
      automountServiceAccountToken: false
      # Public resolvers for the POD itself, deliberately NOT kube-dns: it only
      # resolves public names, and dropping the kube-dns allow from the egress
      # policy is what stops forwarded client traffic reaching internal DNS —
      # see networkpolicy.yaml for the no-LAN model.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 1.0.0.1
        options:
          - name: ndots
            value: "1"
      initContainers:
        # The pod network namespace starts with ip_forward=0. WireGuard needs
        # forwarding + src_valid_mark (fwmark-routed return path) to relay client
        # traffic out eth0. These are namespaced sysctls, so setting them in an
        # initContainer that shares this pod's netns persists them for the main
        # container. Done here — NOT via pod securityContext.sysctls — because
        # the k3s kubelet does not allowlist these as unsafe sysctls
        # (group_vars/k3s.yml k3s_kubelet_args), so a pod-level sysctl would be
        # rejected SysctlForbidden. This keeps the change pod-local instead of a
        # fleet-wide kubelet allowed-unsafe-sysctls change. privileged (the ns is
        # PSA privileged) guarantees /proc/sys/net is writable; the container
        # exits immediately.
        - name: sysctl
          image: busybox:${busybox_version}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              sysctl -w net.ipv4.ip_forward=1
              sysctl -w net.ipv4.conf.all.src_valid_mark=1
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
      containers:
        - name: wg-easy
          image: ghcr.io/wg-easy/wg-easy:${wg_easy_version}
          imagePullPolicy: IfNotPresent
          env:
            # First-boot bootstrap (INIT_*)
            # Applied ONLY when /etc/wireguard has no database yet. Editing these
            # later is a no-op; change config in the UI. See docs/38.
            - name: INIT_ENABLED
              value: "true"
            - name: INIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wg-easy-secrets
                  key: init-username
            - name: INIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wg-easy-secrets
                  key: init-password
            # Endpoint clients dial. External host (Cloudflare DNS-only A record
            # + DDNS follows the home IP); router forwards WAN :51820/udp here.
            - name: INIT_HOST
              value: "vpn.${cluster_external_domain}"
            - name: INIT_PORT
              value: "51820"
            # Public resolvers pushed to clients — NEVER the internal AdGuard.
            # Friends' devices are untrusted and must not learn internal names
            # or reach 10.0.10.150/.160. Part of the no-LAN model (docs/38).
            - name: INIT_DNS
              value: "1.1.1.1,1.0.0.1"
            - name: INIT_IPV4_CIDR
              value: "10.8.0.0/24"
            # Required paired with INIT_IPV4_CIDR (same INIT group). IPv6 is
            # disabled below, so this ULA range is stored but never assigned.
            - name: INIT_IPV6_CIDR
              value: "fdcc:ad94:bacf:61a3::/64"
            # Full-tunnel: every client routes ALL v4 traffic through the VPN.
            # The no-LAN guarantee is enforced server-side by the egress
            # NetworkPolicy (networkpolicy.yaml), not by trusting this client
            # route.
            - name: INIT_ALLOWED_IPS
              value: "0.0.0.0/0"
            # Runtime config
            # v4-only: the LAN has no working IPv6 egress, so an IPv6 tunnel
            # would black-hole. Disables v6 interface addrs + firewall rules.
            - name: DISABLE_IPV6
              value: "true"
            # TLS terminates at Traefik; the pod serves the UI over plain HTTP on
            # 51821. The UI is never exposed outside Traefik (ClusterIP + the
            # ingress NetworkPolicy only admits the traefik + observability ns).
            - name: INSECURE
              value: "true"
            - name: PORT
              value: "51821"
            - name: HOST
              value: "0.0.0.0"
          ports:
            - name: wireguard
              containerPort: 51820
              protocol: UDP
            - name: ui
              containerPort: 51821
              protocol: TCP
          securityContext:
            # drop: [ALL] first, then add back only what wg-quick needs, or the
            # container silently keeps the runtime's whole default set.
            #   - NET_ADMIN drives wg0; NET_RAW is required because the image's
            #     PostUp hooks run iptables in LEGACY mode, which opens a raw
            #     socket to initialize the nat table (without it wg-quick tears
            #     wg0 back down).
            #   - NOT SYS_MODULE: the wireguard module is already loaded on every
            #     node (flannel wireguard-native), so wg-easy just attaches.
            #   - NOT DAC_OVERRIDE: the appdata export squashes every client to
            #     uid 1000, so the server's ACCESS RPC grants root's writes and
            #     the client-side DAC_OVERRIDE path is never reached.
            # root is required because wg-easy's entrypoint runs as uid 0.
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
          readinessProbe:
            tcpSocket:
              port: ui
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # NFS-ESTALE self-heal: liveness stats the NFS-backed /etc/wireguard
          # so a stale or hung handle restarts the pod and it remounts. The UI
          # keeps answering on :51821 while that state is unreadable, so the
          # tcpSocket readiness above cannot catch it. Conservative timing so a
          # brief NFS blip cannot flap-restart.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - stat /etc/wireguard >/dev/null 2>&1 || exit 1
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/wireguard
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: wg-easy-config
