---
# wg-easy secrets from 1Password via ESO. init-username / init-password
# bootstrap the admin account on first container start only; rotation is a UI
# action (docs/38). The metrics token lives in observability-exporter-secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wg-easy-secrets
  namespace: wg-easy
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: wg-easy-secrets
    creationPolicy: Owner
  data:
    - secretKey: init-username
      remoteRef:
        key: WireGuard VPN
        property: init-username
    - secretKey: init-password
      remoteRef:
        key: WireGuard VPN
        property: init-password
