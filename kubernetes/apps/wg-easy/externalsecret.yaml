---
# wg-easy secrets sourced from 1Password via ESO (onepassword-connect provider).
#
#  - init-username / init-password bootstrap the admin account on the FIRST
#    container start only (wg-easy INIT_* env; ignored once /etc/wireguard has a
#    database). Rotating the admin password afterwards is a UI action, not a
#    change here — see docs/38.
#
# The Prometheus metrics Bearer token is NOT here: the pod does not consume it
# (metrics are enabled + the token set in the UI). The ServiceMonitor reads it
# from observability-exporter-secrets (key wg-easy-metrics-token), sourced from
# the same 1Password "WireGuard VPN" item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wg-easy-secrets
  namespace: wg-easy
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: wg-easy-secrets
    creationPolicy: Owner
  data:
    - secretKey: init-username
      remoteRef:
        key: WireGuard VPN
        property: init-username
    - secretKey: init-password
      remoteRef:
        key: WireGuard VPN
        property: init-password
