---
# Internal-only TLS cert for the admin UI (vpn.esweiss.com), in the same
# namespace as the IngressRoute referencing it. There is no public cert or
# route; the WireGuard endpoint is UDP and needs none.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wg-easy-tls-internal
  namespace: wg-easy
spec:
  secretName: wg-easy-esweiss-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "vpn.${cluster_internal_domain}"
  dnsNames:
    - "vpn.${cluster_internal_domain}"
  renewBefore: 720h
