---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gitlab-runner
resources:
  - namespace.yaml
  - externalsecret.yaml
  - cache-externalsecret.yaml
  - serviceaccount.yaml
  - release.yaml
  - networkpolicy.yaml
  - resourcequota.yaml
  - vpa.yaml

# Shared config components:
# - netpol-baseline: the default-deny-ingress policy (see kubernetes/components/netpol-baseline)
# - gitlab-runner-common: HelmRelease fields shared with the other runner
components:
  - ../../components/netpol-baseline
  - ../../components/gitlab-runner-common
