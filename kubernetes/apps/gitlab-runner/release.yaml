---
# Shared GitLab Runner HelmRelease — adopts the existing Helm release
# `gitlab-runner` in the gitlab-runner namespace (matching releaseName +
# targetNamespace). Chart version substituted from cluster-versions ConfigMap.
# Runner token sourced via ExternalSecret (externalsecret.yaml); the chart
# reads it from the Secret named `gitlab-runner-token` via runners.secret.
#
# The fields shared with ../gitlab-runner-privileged/release.yaml (interval,
# timeout, chart, install/upgrade, gitlabUrl, replicas, checkInterval, rbac,
# manager resources, affinity, tolerations) are merged in from the
# kubernetes/components/gitlab-runner-common component (wired in
# kustomization.yaml); only this runner's deltas live below.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-runner
  namespace: gitlab-runner
spec:
  releaseName: gitlab-runner
  values:
    # Concurrent jobs, capped to what the namespace ResourceQuota admits. A job
    # pod sums to ~5Gi memory limits (build 4Gi + helper 1Gi) and the manager
    # (~256Mi) also counts, so 40Gi admits floor((40-0.25)/5)=7. A higher value
    # would let the runner submit job pods the quota rejects (403, no retry =>
    # spurious CI failures); at 7, excess jobs queue at the runner slot instead.
    # Raise with the quota.
    concurrent: 7

    runners:
      name: k3s-runner-shared

      # Existing Secret (created by ESO externalsecret.yaml) containing the
      # runner-token.
      secret: gitlab-runner-token

      # Tags for explicit targeting from other projects
      tags: "k8s-deploy"

      # Default runner for projects that specify no tags; weisssrv jobs are
      # tagged [infrastructure] and go to the privileged runner instead.
      runUntagged: true

      # ACCEPTED RISK (homelab): protected:false lets this runner accept
      # untagged jobs from any project on any branch. It is non-privileged
      # (run_as_non_root, no DinD) and its job pods are egress-contained with
      # RFC1918 blocked (networkpolicy.yaml), so untrusted branch code is boxed
      # in. A team environment would set protected:true.
      protected: false

      executor: kubernetes

      # Mounts the ESO-synced s3access Secret (chart-mandated
      # accesskey/secretkey names) into the manager as the cache credential —
      # pairs with the [runners.cache] block in the config template below.
      cache:
        secretName: s3access

      config: |
        [[runners]]
          # request_concurrency 1 serializes job acquisition behind GitLab's
          # long-poll window and surfaces as runner_system_failure bursts; the
          # runner's own startup warning recommends 2-4.
          request_concurrency = 3
          # Keep clones on the LAN path too (see gitlabUrl above).
          clone_url = "https://git.${cluster_internal_domain}"

          # Non-root job containers may lack an /etc/passwd entry, leaving HOME
          # unset so git writes to //.gitconfig and fails. Pin both explicitly.
          # gitlab-org/gitlab-runner#37408
          environment = ["HOME=/home/gitlab-runner", "GIT_CONFIG_GLOBAL=/home/gitlab-runner/.gitconfig"]

          # TOML sections are POSITIONAL — scalar keys must precede any
          # sub-table or they silently land inside it (limits misparsed as
          # pod_labels, pull_policy swallowed by a volume table). Scalars
          # first, sub-tables last.
          # S3 runner cache on the in-cluster garage (kubernetes/apps/ci-cache):
          # this is what makes the pipelines' `cache:` blocks real. Shared so
          # both runners hit one cache namespace per key; Insecure because the
          # endpoint is plaintext HTTP fenced to the runner namespaces by
          # NetworkPolicy (the app README carries the trade).
          [runners.cache]
            Type = "s3"
            Shared = true
            [runners.cache.s3]
              ServerAddress = "ci-cache.ci-cache.svc.cluster.local:3900"
              BucketName = "runner-cache"
              Insecure = true

          [runners.kubernetes]
            namespace = "gitlab-runner"
            # Default CI job image, digest-pinned for reproducibility (the
            # tag is retained for readability; the digest is authoritative).
            # Refresh with: docker buildx imagetools inspect debian:trixie
            image = "debian:trixie@sha256:d07d1b51c39f51188e60be9b64e6bf769fa94e187f092bc32b91305cfa34ba5a"
            privileged = false

            # Rank job pods below every unclassed workload and never preempt
            # (sources/priorityclasses.yaml). The namespace quotas admit more
            # CPU requests than the cluster has allocatable, so a CI burst used
            # to compete with platform pods on arrival order alone. A scalar key
            # — must stay above the first sub-table.
            priority_class_name = "ci-jobs"

            # CPU/Memory for job pods. No cpu_limit (docs/33, repo-wide): CPU
            # is compressible, so a limit only adds CFS throttling — cpu_request
            # sets the contention share and the namespace ResourceQuota's
            # requests.cpu bounds the aggregate.
            cpu_request = "500m"
            memory_limit = "4Gi"
            memory_request = "1Gi"

            # Let jobs right-size DOWN from the defaults — the ceilings equal
            # the defaults, so an override can only shrink a pod, never grow
            # it (this runner also serves tenant projects). A lint pod
            # declaring KUBERNETES_MEMORY_LIMIT=1Gi stops a 12-job fan-out
            # from bursting the namespace quota at pod creation.
            memory_limit_overwrite_max_allowed = "4Gi"
            service_memory_limit_overwrite_max_allowed = "4Gi"
            service_memory_request_overwrite_max_allowed = "1Gi"
            memory_request_overwrite_max_allowed = "1Gi"
            # CPU request ceiling for the lib templates' per-job
            # KUBERNETES_CPU_REQUEST declarations (lib v0.12.0) — equal to the
            # default, so overrides only shrink the reservation.
            cpu_request_overwrite_max_allowed = "500m"

            # Job-pod service account: token-less, no RBAC (serviceaccount.yaml)
            # — NOT the manager SA, whose Role could read the runner token and
            # exec into concurrent jobs.
            service_account = "gitlab-runner-jobs"

            # Pull policy
            pull_policy = ["if-not-present"]

            # Allow individual CI jobs to override node selector for CPU-compatibility only.
            # Restricted to the esweiss.com/cpu label to prevent jobs from targeting arbitrary nodes.
            node_selector_overwrite_allowed = "^esweiss\\.com/cpu=(modern|legacy)$"

            # NetworkPolicy selector: shared job pods get internet-only
            # egress (no RFC1918) — see networkpolicy.yaml.
            [runners.kubernetes.pod_labels]
              "${cluster_node_label_domain}/runner-class" = "shared"

            # Non-root, no DinD — the untrusted shared tier. Privileged work
            # goes to the infrastructure runner (tags: infrastructure); the
            # two-tier model is docs/13-ci-cd.md.
            [runners.kubernetes.pod_security_context]
              run_as_non_root = true
              run_as_user = 1000
              run_as_group = 1000
              fs_group = 1000

            # Mount emptyDir volume at HOME to ensure writable directory for git config
            # This is required for non-root execution since the default HOME (/) is read-only
            [[runners.kubernetes.volumes.empty_dir]]
              name = "home"
              mount_path = "/home/gitlab-runner"

    # Service account
    serviceAccount:
      create: true
      name: gitlab-runner
