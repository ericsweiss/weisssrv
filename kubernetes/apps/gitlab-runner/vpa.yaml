---
# VPA for the runner *manager* pod only (Initial — resize on restart). CI job
# pods are ephemeral and sized by the runner's own Kubernetes executor config.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: gitlab-runner
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: gitlab-runner}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 500m, memory: 512Mi}
        controlledResources: [cpu, memory]
