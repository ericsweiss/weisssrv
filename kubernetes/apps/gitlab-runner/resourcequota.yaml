---
# Aggregate bounds for the shared-runner namespace, sized against concurrent:7
# and the agent VM size (proxmox_vm_cores/proxmox_vm_memory in hosts.yml);
# re-derive on a resize. Non-pods dimensions exceed allocatable (docs/16).

# CRITICAL: no cpu or limits.cpu dimension. A CPU-limit quota forces every pod
# in the namespace to declare a CPU limit, which rejects the runner manager;
# it runs with no CPU limit to avoid CFS throttling. CPU is bounded by
# requests.cpu alone, memory by both.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gitlab-runner-quota
  namespace: gitlab-runner
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    # concurrent:7 x 5Gi job-pod limits plus the manager, plus two churn slots:
    # Terminating pods still count against the quota, and at exactly
    # 7x5+manager the next burst 403s with no retry.
    limits.memory: 46Gi
    pods: "20"
---
# Default requests and limits so a pod created here without explicit resources
# still counts against the quota above. Only memory carries a default limit,
# never CPU (see the quota note).
apiVersion: v1
kind: LimitRange
metadata:
  name: gitlab-runner-limits
  namespace: gitlab-runner
spec:
  limits:
    - type: Container
      default:
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
