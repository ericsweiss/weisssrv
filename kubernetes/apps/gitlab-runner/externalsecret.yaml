---
# GitLab Runner authentication token from 1Password via ESO, consumed by the
# gitlab-runner HelmRelease. The chart's projected-secrets volume requires both
# `runner-token` and `runner-registration-token`, so the latter is templated empty.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-token
  namespace: gitlab-runner
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: gitlab-runner-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        runner-token: "{{ .token }}"
        runner-registration-token: ""
  data:
    - secretKey: token
      remoteRef:
        key: GitLab Runner
        property: runner-token
