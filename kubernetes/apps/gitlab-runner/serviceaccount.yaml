---
# ServiceAccount for shared-runner JOB pods (runners.kubernetes.service_account
# in release.yaml). Deliberately separate from the chart-managed manager SA
# (gitlab-runner): the manager's Role grants secrets get/list and
# pods/exec/patch in this namespace, and job pods run untrusted branch code
# from any project (runUntagged + protected:false). This SA has NO RoleBinding
# and no mounted token, so a malicious job cannot read the runner token Secret,
# other jobs' pod specs (CI variables), or exec into the manager pod. Jobs that
# genuinely need the kube-API use an explicit kubeconfig CI variable instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner-jobs
  namespace: gitlab-runner
automountServiceAccountToken: false
