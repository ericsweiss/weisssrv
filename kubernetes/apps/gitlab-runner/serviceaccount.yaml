---
# CRITICAL: ServiceAccount for shared-runner JOB pods, separate from the
# chart-managed manager SA whose Role grants secrets get/list and pods/exec.
# Job pods run untrusted branch code, so this SA keeps no RoleBinding and no
# mounted token. Jobs needing the kube-API use a kubeconfig CI variable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner-jobs
  namespace: gitlab-runner
automountServiceAccountToken: false
