---
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-runner
  labels:
    app.kubernetes.io/name: gitlab-runner
    app.kubernetes.io/part-of: gitlab
    app.kubernetes.io/managed-by: flux
    # enforce: baseline blocks the untrusted shared runner's job pods from
    # escalating to privileged/host* — admission now enforces the trust boundary
    # at the namespace level (the privileged DinD runner lives in its own
    # gitlab-runner-privileged namespace). warn/audit at restricted surface
    # further tightening opportunities without breaking other projects' jobs.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
