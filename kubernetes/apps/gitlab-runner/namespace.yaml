---
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-runner
  labels:
    app.kubernetes.io/name: gitlab-runner
    app.kubernetes.io/part-of: gitlab
    app.kubernetes.io/managed-by: flux
    # enforce baseline blocks the untrusted shared runner's job pods from
    # escalating to privileged/host*; the privileged DinD runner has its own
    # namespace. warn/audit restricted surface further tightening.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
