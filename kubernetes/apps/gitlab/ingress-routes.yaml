---
# IngressRoutes for GitLab services
# Routes traffic from Traefik to GitLab VM (192.168.0.153)

# =============================================================================
# GitLab Web UI
# =============================================================================

# External - git.ericsweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab-web
  namespace: gitlab
  # No external-dns annotation - DNS managed by Terraform
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`git.ericsweiss.com`)
      kind: Rule
      middlewares:
        - name: strip-www
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: gitlab-web
          port: 80
  tls:
    secretName: gitlab-services-ericsweiss-tls

---
# Internal - git.esweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab-web-internal
  namespace: gitlab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`git.esweiss.com`)
      kind: Rule
      middlewares:
        - name: strip-www
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: gitlab-web
          port: 80
  tls:
    secretName: gitlab-services-esweiss-tls

---
# =============================================================================
# GitLab Container Registry
# =============================================================================

# External - registry.git.ericsweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
