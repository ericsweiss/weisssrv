---
# targetRef.name is the chart-generated Deployment name; a chart upgrade that
# renames the workload silently orphans this VPA with no error surfaced, so
# re-check it after gitlab-agent chart bumps.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: gitlab-agent
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: weisssrv-k3s-gitlab-agent-v2}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # RequestsOnly with maxAllowed.memory == the 160Mi limit declared in
      # release.yaml (docs/33 rule): recommendations move requests, not limits.
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 64Mi}
        maxAllowed: {cpu: 500m, memory: 160Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
