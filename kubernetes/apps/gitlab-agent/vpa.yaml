---
# targetRef.name is the chart-generated Deployment name and is chart-version
# coupled (the v1->v2 chart bump renamed it). If a chart upgrade renames the
# workload again, this VPA silently orphans (no error surfaced) — re-check the
# name after gitlab-agent chart bumps.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: gitlab-agent
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: weisssrv-k3s-gitlab-agent-v2}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 64Mi}
        maxAllowed: {cpu: 500m, memory: 512Mi}
        controlledResources: [cpu, memory]
