---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: gitlab-agent
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: weisssrv-k3s-gitlab-agent-v2}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 10m, memory: 64Mi}
        maxAllowed: {cpu: 500m, memory: 512Mi}
        controlledResources: [cpu, memory]
