---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gitlab-agent
resources:
  - namespace.yaml
  - externalsecret.yaml
  - release.yaml
  - vpa.yaml

# No egress NetworkPolicy, deliberately: kube-router installs the per-pod egress
# chain after the pod is scheduled and agentk bails fatally on its startup /api
# GET in that gap, crashlooping every fresh pod. Scoping it: docs/30.

components:
  - ../../components/netpol-baseline
