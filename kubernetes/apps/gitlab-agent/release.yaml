---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: weisssrv-k3s   # Match existing release name (deployment: weisssrv-k3s-gitlab-agent-v2)
  namespace: gitlab-agent
spec:
  interval: 30m
  releaseName: weisssrv-k3s
  chart:
    spec:
      chart: gitlab-agent
      version: "${gitlab_agent_helm_version}"
      sourceRef:
        kind: HelmRepository
        name: gitlab
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    image:
      tag: ""  # Use chart appVersion default
    config:
      # Internal hostname (git.esweiss.com → Traefik VIP 192.168.0.101) so the
      # agent's KAS long-poll stays inside the LAN: no WAN roundtrip, no
      # router-hairpin dependency, and the egress allowlist is a single /32.
      # Previously `git.ericsweiss.com` which goes through Cloudflare's proxy
      # (104.x); the orange-cloud IPs aren't in the NetworkPolicy allowlist,
      # so once the policy hits the cluster the agent would silently fail to
      # connect.
      kasAddress: wss://git.esweiss.com/-/kubernetes-agent/
      # Chart reads key "token" from the referenced Secret (non-configurable
      # in chart; tokenKey is set explicitly for clarity and forward
      # compatibility). The sibling ExternalSecret (externalsecret.yaml)
      # creates Secret "gitlab-agent-token" with data key "token".
      secretName: gitlab-agent-token
      tokenKey: token
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

    # Wait for the in-cluster K8s API to be reachable before agentk starts.
    # agentk v19 (chart 2.27+) added a synchronous remote_development module
    # that GETs /api on the apiserver at startup and bails fatally on any
    # error. Combined with kube-router's per-pod NetworkPolicy egress chain
    # not always being fully wired by the time the container exec's, the
    # first attempt RST's with "connection refused" and the pod crashloops.
    # This probe loop waits up to 60s for the apiserver to accept a TCP
    # handshake — by then kube-router has caught up and agentk's first
    # /api call succeeds. agentk v18 retried indefinitely so the race was
    # invisible; v19 doesn't, hence the explicit init container.
    initContainers:
      - name: wait-for-apiserver
        image: busybox:1.38
        command:
          - sh
          - -c
          - |
            # Use the env-vars kubelet injects (KUBERNETES_SERVICE_HOST/PORT)
            # so the probe doesn't depend on cluster DNS being warm — cluster
            # DNS resolves via the same kube-router-protected egress and would
            # be subject to the same race we're trying to ride out.
            for i in $(seq 1 30); do
              if nc -z -w 2 "$KUBERNETES_SERVICE_HOST" "$KUBERNETES_SERVICE_PORT_HTTPS" 2>/dev/null; then
                echo "apiserver reachable at $KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT_HTTPS"
                exit 0
              fi
              echo "attempt $i: apiserver not yet reachable, sleeping 2s"
              sleep 2
            done
            echo "apiserver never became reachable" >&2
            exit 1
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 50m
            memory: 32Mi
