---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: weisssrv-k3s   # Match existing release name (deployment: weisssrv-k3s-gitlab-agent-v2)
  namespace: gitlab-agent
spec:
  interval: 30m
  releaseName: weisssrv-k3s
  chart:
    spec:
      chart: gitlab-agent
      version: "${gitlab_agent_helm_version}"
      sourceRef:
        kind: HelmRepository
        name: gitlab
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    image:
      tag: ""  # Use chart appVersion default
    config:
      # Internal hostname (git.esweiss.com → Traefik VIP 192.168.0.101) so the
      # agent's KAS long-poll stays inside the LAN: no WAN roundtrip, no
      # router-hairpin dependency, and the egress allowlist is a single /32.
      # Previously `git.ericsweiss.com` which goes through Cloudflare's proxy
      # (104.x); the orange-cloud IPs aren't in the NetworkPolicy allowlist,
      # so once the policy hits the cluster the agent would silently fail to
      # connect.
      kasAddress: wss://git.esweiss.com/-/kubernetes-agent/
      # Chart reads key "token" from the referenced Secret (non-configurable
      # in chart; tokenKey is set explicitly for clarity and forward
      # compatibility). The sibling ExternalSecret (externalsecret.yaml)
      # creates Secret "gitlab-agent-token" with data key "token".
      secretName: gitlab-agent-token
      tokenKey: token
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
