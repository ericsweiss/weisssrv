---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: weisssrv-k3s   # Match existing release name (deployment: weisssrv-k3s-gitlab-agent-v2)
  namespace: gitlab-agent
spec:
  interval: 30m
  releaseName: weisssrv-k3s
  chart:
    spec:
      chart: gitlab-agent
      version: "${gitlab_agent_helm_version}"
      sourceRef:
        kind: HelmRepository
        name: gitlab
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    image:
      tag: ""  # Use chart appVersion default
    # cluster-admin RBAC (chart default rbac.create), single-operator. Scoping it
    # below cluster-admin is docs/30 § Pre-Onboarding Checklist.
    config:
      # Internal hostname (git.esweiss.com → Traefik VIP 10.0.10.101) keeps
      # the agent's KAS long-poll inside the LAN: no WAN roundtrip, no
      # router-hairpin dependency.
      kasAddress: wss://git.${cluster_internal_domain}/-/kubernetes-agent/
      # Chart reads key "token" from the referenced Secret; tokenKey is set
      # explicitly for clarity. The sibling ExternalSecret creates Secret
      # "gitlab-agent-token" with data key "token".
      secretName: gitlab-agent-token
      tokenKey: token
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      # Memory only — no CPU limit (docs/33); 160Mi == vpa.yaml's maxAllowed.
      # Do NOT write `cpu: null`: the chart defaults to `resources: {}`, so Helm
      # has nothing to coalesce over and the null renders literally.
      limits:
        memory: 160Mi
