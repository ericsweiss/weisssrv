---
# Default-deny ingress (the agent only initiates outbound long-poll wss to GitLab).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: gitlab-agent
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Egress NetworkPolicy intentionally removed.
#
# The allow-egress-gitlab-and-kube policy used to restrict the agent's
# outbound traffic to kube-dns + 10.43.0.1 + Traefik VIP. Because
# kube-router builds the per-pod egress chain asynchronously after the
# pod is scheduled, agentk's startup-time GET on /api was getting RST'd
# in the gap between pod-create and chain-install. agentk v18 retried
# indefinitely so the race was invisible; v19's new remote_development
# module bails fatally on the first error, which crashlooped every fresh
# pod and trapped us on the previous chart version.
#
# We don't need this NP for security in practice: the agent only egresses
# to internal-only services (kube-dns, kube-apiserver, Traefik internal
# VIP) — all already reachable only from inside the cluster — and a
# compromised agentk has cluster-admin-equivalent kube creds anyway, so a
# /16 egress allowlist is not a meaningful additional control. Dropping
# the policy is the simplest path to keeping the chart on latest.
