---
# Service + EndpointSlice for the out-of-cluster Immich VM (10.0.10.157). The
# VM's nginx terminates 443 with the distributed *.esweiss.com wildcard, so
# Traefik connects with scheme https and the vm-tls-wildcard ServersTransport.
apiVersion: v1
kind: Service
metadata:
  name: immich-backend
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 443
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: immich-backend
  namespace: default
  labels:
    kubernetes.io/service-name: immich-backend
    endpointslice.kubernetes.io/managed-by: manual
addressType: IPv4
ports:
  - port: 443
    protocol: TCP
endpoints:
  - addresses:
      - 10.0.10.157
    conditions:
      ready: true
