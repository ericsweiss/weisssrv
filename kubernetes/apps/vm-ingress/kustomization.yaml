---
# vm-ingress: IngressRoutes for non-Kubernetes workloads (Plex LXC, HA VM,
# AdGuard LXCs, Router, GitLab VM). Resources span the `default`, `gitlab`,
# and `traefik` (middleware.yaml) namespaces — the per-resource
# metadata.namespace is preserved verbatim.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gitlab-namespace.yaml
  - middleware.yaml
  - serverstransport.yaml
  - services-default.yaml
  - services-gitlab.yaml
  - services-nextcloud.yaml
  - services-immich.yaml
  - gitlab-certificate.yaml
  - adguard-home.yaml
  - plex.yaml
  - router.yaml
  - home-assistant.yaml
  - gitlab.yaml
  - nextcloud.yaml
  - immich.yaml

components:
  - ../../components/netpol-baseline
patches:
  # No top-level namespace transformer here (resources span three namespaces),
  # so namespace the shared default-deny-ingress explicitly. `gitlab` is the one
  # namespace this kustomization creates; `default` and `traefik` carry their
  # own policies.
  - target:
      kind: NetworkPolicy
      name: default-deny-ingress
    patch: |
      - op: add
        path: /metadata/namespace
        value: gitlab
