---
# vm-ingress: routing objects for non-Kubernetes workloads; README.md lists the
# targets. Resources span the default, gitlab and traefik namespaces, so there
# is no namespace transformer and each resource keeps its own metadata.namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gitlab-namespace.yaml
  - middleware.yaml
  - serverstransport.yaml
  - services-default.yaml
  - services-gitlab.yaml
  - services-nextcloud.yaml
  - services-immich.yaml
  - gitlab-certificate.yaml
  - adguard-home.yaml
  - plex.yaml
  - router.yaml
  - home-assistant.yaml
  - gitlab.yaml
  - nextcloud.yaml
  - immich.yaml

components:
  - ../../components/netpol-baseline
patches:
  # No namespace transformer here, so namespace the shared default-deny-ingress
  # explicitly. `gitlab` is the one namespace this kustomization creates;
  # `default` and `traefik` carry their own policies.
  - target:
      kind: NetworkPolicy
      name: default-deny-ingress
    patch: |
      - op: add
        path: /metadata/namespace
        value: gitlab
