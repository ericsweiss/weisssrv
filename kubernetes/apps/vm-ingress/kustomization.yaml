---
# vm-ingress: IngressRoutes for non-Kubernetes workloads (Plex LXC, HA VM,
# AdGuard VMs, Router, GitLab VM). Resources span `default` and `gitlab`
# namespaces — the per-resource metadata.namespace is preserved verbatim.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gitlab-namespace.yaml
  - middleware.yaml
  - services-default.yaml
  - services-gitlab.yaml
  - gitlab-certificate.yaml
  - adguard-home.yaml
  - plex.yaml
  - router.yaml
  - home-assistant.yaml
  - gitlab.yaml
