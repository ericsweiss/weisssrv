---
# Shared ServersTransport for Traefik -> external VM backends. Traefik connects by IP,
# so serverName is set explicitly and the VMs' wildcard cert validates. References
# resolve per namespace, so add a copy when a new namespace consumes it.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: vm-tls-wildcard
  namespace: default
spec:
  # Wildcard SAN: server presents *.esweiss.com, valid for any
  # single-label subdomain. Sentinel name; never resolved.
  serverName: vm.${cluster_internal_domain}
  maxIdleConnsPerHost: 32
  forwardingTimeouts:
    dialTimeout: 10s
    responseHeaderTimeout: 30s
    idleConnTimeout: 90s
---
# Same resource, gitlab namespace. GitLab IngressRoutes live in the
# gitlab namespace; Traefik resolves serversTransport in the same ns.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: vm-tls-wildcard
  namespace: gitlab
spec:
  serverName: vm.${cluster_internal_domain}
  maxIdleConnsPerHost: 32
  forwardingTimeouts:
    dialTimeout: 10s
    responseHeaderTimeout: 30s
    idleConnTimeout: 90s
---
# Traefik -> UniFi gateway. The UCG serves a self-signed certificate no wildcard
# covers, so validation can only be skipped. Kept separate from vm-tls-wildcard so
# exactly one backend is unvalidated; the route in front is lan-tailscale-strict.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: unifi-self-signed
  namespace: default
spec:
  insecureSkipVerify: true
  maxIdleConnsPerHost: 32
  forwardingTimeouts:
    dialTimeout: 10s
    responseHeaderTimeout: 30s
    idleConnTimeout: 90s
