---
# GitLab Pages. HostRegexp `[^.]+` matches SINGLE-LABEL subdomains only, which
# is what the wildcard cert covers: a nested name (group.subgroup.pages.…)
# matches no route and has no TLS. Pages for nested groups must use hyphenated
# names (group-subgroup).

# External - *.pages.git.ericsweiss.com and pages.git.ericsweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab-pages
  namespace: gitlab
spec:
  entryPoints:
    - websecure
  routes:
    # Wildcard subdomain pages (user.pages.git.ericsweiss.com)
    # Use [^.]+ to match single-label subdomains only (matches wildcard cert *.pages.git.ericsweiss.com)
    # Traefik v3 syntax: HostRegexp uses Go regex directly without capture groups
    - match: HostRegexp(`^[^.]+\.pages\.git\.ericsweiss\.com$`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
      services:
        - name: gitlab-pages
          port: 8443
          scheme: https
          serversTransport: vm-tls-wildcard
    # Apex pages domain
    - match: Host(`pages.git.${cluster_external_domain}`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
      services:
        - name: gitlab-pages
          port: 8443
          scheme: https
          serversTransport: vm-tls-wildcard
  tls:
    secretName: gitlab-pages-ericsweiss-tls

---
# Internal - *.pages.git.esweiss.com and pages.git.esweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab-pages-internal
  namespace: gitlab
spec:
  entryPoints:
    - websecure
  routes:
    # Traefik v3 HostRegexp is Go regex, no capture groups.
    - match: HostRegexp(`^[^.]+\.pages\.git\.esweiss\.com$`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: gitlab-pages
          port: 8443
          scheme: https
          serversTransport: vm-tls-wildcard
    # Apex pages domain
    - match: Host(`pages.git.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: gitlab-pages
          port: 8443
          scheme: https
          serversTransport: vm-tls-wildcard
  tls:
    secretName: gitlab-pages-esweiss-tls

---
# GitLab Web IDE Extension Host — same single-label constraint as gitlab-pages
# above.
#
# Backend: same gitlab-web Service that fronts git.ericsweiss.com. GitLab
# nginx is a catch-all server_name; Workhorse serves the Web IDE static
# assets on whatever Host header arrives. The Rails app gates content on
# the configured extension_host_domain Application Setting.

# External - *.ide.git.ericsweiss.com and ide.git.ericsweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab-web-ide
  namespace: gitlab
spec:
  entryPoints:
    - websecure
  routes:
    # Wildcard subdomain (foo.ide.git.ericsweiss.com)
    # Use [^.]+ to match single-label subdomains only (matches wildcard cert *.ide.git.ericsweiss.com)
    # Traefik v3 syntax: HostRegexp uses Go regex directly without capture groups
    - match: HostRegexp(`^[^.]+\.ide\.git\.ericsweiss\.com$`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
      services:
        - name: gitlab-web
          port: 443
          scheme: https
          serversTransport: vm-tls-wildcard
    # Apex ide.git.ericsweiss.com
    - match: Host(`ide.git.${cluster_external_domain}`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
      services:
        - name: gitlab-web
          port: 443
          scheme: https
          serversTransport: vm-tls-wildcard
  tls:
    secretName: gitlab-web-ide-ericsweiss-tls
