    # Use [^.]+ to match single-label subdomains only (matches wildcard cert *.pages.git.esweiss.com)
    # Traefik v3 syntax: HostRegexp uses Go regex directly without capture groups
    - match: HostRegexp(`^[^.]+\.pages\.git\.esweiss\.com$`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: gitlab-pages
          port: 8443
          scheme: https
          serversTransport: vm-tls-wildcard
    # Apex pages domain
    - match: Host(`pages.git.esweiss.com`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
