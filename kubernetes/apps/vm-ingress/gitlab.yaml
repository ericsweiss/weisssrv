---
# IngressRoutes for GitLab services
# Routes traffic from Traefik to GitLab VM (10.0.10.153)

# GitLab Web UI

# External - git.ericsweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab-web
  namespace: gitlab
  # No external-dns annotation - DNS managed by Terraform
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`git.${cluster_external_domain}`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
      services:
        - name: gitlab-web
          port: 443
          scheme: https
          serversTransport: vm-tls-wildcard
  tls:
    secretName: gitlab-services-ericsweiss-tls

---
# Internal - git.esweiss.com
# Two routes on the same host; Traefik picks the more specific
# Host+PathPrefix rule first by priority. gitlab-agent pods source-IP as
# the cluster CIDR (10.42.0.0/16) when dialing the traefik-internal VIP
# under externalTrafficPolicy: Local; lan-tailscale-only allowlists that
# CIDR (see infrastructure/configs/traefik-middlewares.yaml), so agent
# long-polls pass. If the pod CIDR is ever dropped from that allowlist,
# this route must lose lan-tailscale-only or every KAS long-poll 403s.
# Real authentication on this path is per-agent bearer tokens
# (gitlab-agent-token ExternalSecret), not IP filtering.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab-web-internal-kas
  namespace: gitlab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`git.${cluster_internal_domain}`) && PathPrefix(`/-/kubernetes-agent/`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: gitlab-web
          port: 443
          scheme: https
          serversTransport: vm-tls-wildcard
  tls:
    secretName: gitlab-services-esweiss-tls

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab-web-internal
  namespace: gitlab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`git.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
