---
# IngressRoutes for Immich (photos.*). Routes Traefik to the Immich VM
# (10.0.10.157) via the immich-backend Service. Authentication is Immich's own
# Authentik OIDC (SSO-only) at the application layer — no forward-auth middleware.

# External - photos.ericsweiss.com
# No external-dns annotation: the record is a DNS-only CNAME in
# terraform/cloudflare/dns.tf, bypassing the Cloudflare proxy's 100 MB body cap.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`photos.${cluster_external_domain}`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
        - name: security-headers
          namespace: traefik
      services:
        - name: immich-backend
          port: 443
          scheme: https
          serversTransport: vm-tls-wildcard
  tls:
    # The default-ns *.ericsweiss.com wildcard covers the single-label host.
    secretName: ericsweiss-com-tls
---
# Internal - photos.esweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich-internal
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`photos.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: immich-backend
          port: 443
          scheme: https
          serversTransport: vm-tls-wildcard
  tls:
    secretName: esweiss-com-tls
