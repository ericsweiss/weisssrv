---
# App-side middlewares (consumers all live in apps stage).
#
# The platform-level middlewares lan-tailscale-only and hsts-header
# moved to kubernetes/infrastructure/configs/traefik-middlewares.yaml
# because they are referenced from outside the apps stage (Connect
# IngressRoute in configs, Loki IngressRoute in observability,
# Traefik dashboard in controllers). See that file for the full
# rationale.

# Strip www from ericsweiss.com domains (public only)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-www
  namespace: traefik
spec:
  redirectRegex:
    regex: "^https?://www\\.(.+)"
    # $${1} escapes the dollar so Flux postBuild envsubst leaves "${1}" literal
    # for Traefik's regex backreference. Without the escape, Flux would replace
    # it with the empty string and every www-redirect would resolve to "https://".
    replacement: "https://$${1}"
    permanent: true

---
# Home Assistant specific headers for reverse proxy
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: home-assistant-headers
  namespace: traefik
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
