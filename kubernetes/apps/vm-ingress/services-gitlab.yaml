---
# Services and EndpointSlices for GitLab VM (192.168.0.153)
# GitLab runs outside the cluster; Traefik routes to it via these services

# =============================================================================
# GitLab Web UI (HTTPS on 443)
# =============================================================================
# GitLab Omnibus nginx now listens on 443 with the cert distributed by
# acme_certs (see host_vars/dns-01.yml). Traefik connects with
# scheme: https + the vm-tls-wildcard ServersTransport so the
# Traefik->GitLab hop is encrypted. Plain port 80 listener is disabled.
apiVersion: v1
kind: Service
metadata:
  name: gitlab-web
  namespace: gitlab
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 443
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: gitlab-web
  namespace: gitlab
  labels:
    kubernetes.io/service-name: gitlab-web
    endpointslice.kubernetes.io/managed-by: manual
addressType: IPv4
ports:
  - port: 443
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.0.153
    conditions:
      ready: true

---
# =============================================================================
# GitLab Container Registry (port 5050)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: gitlab-registry
  namespace: gitlab
spec:
  type: ClusterIP
  ports:
    - port: 5050
      targetPort: 5050
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: gitlab-registry
  namespace: gitlab
  labels:
    kubernetes.io/service-name: gitlab-registry
    endpointslice.kubernetes.io/managed-by: manual
addressType: IPv4
ports:
  - port: 5050
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.0.153
    conditions:
      ready: true

---
# =============================================================================
# GitLab Pages (pages_nginx TLS on 8443)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: gitlab-pages
  namespace: gitlab
spec:
  type: ClusterIP
  ports:
    - port: 8443
      targetPort: 8443
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: gitlab-pages
  namespace: gitlab
  labels:
    kubernetes.io/service-name: gitlab-pages
    endpointslice.kubernetes.io/managed-by: manual
addressType: IPv4
ports:
  - port: 8443
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.0.153
    conditions:
      ready: true
