---
# Services and EndpointSlices for GitLab VM (10.0.10.153)
# GitLab runs outside the cluster; Traefik routes to it via these services

# GitLab Web UI. Omnibus nginx listens on 443 only, with the acme_certs cert;
# Traefik connects scheme: https through the vm-tls-wildcard ServersTransport.
apiVersion: v1
kind: Service
metadata:
  name: gitlab-web
  namespace: gitlab
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 443
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: gitlab-web
  namespace: gitlab
  labels:
    kubernetes.io/service-name: gitlab-web
    endpointslice.kubernetes.io/managed-by: manual
addressType: IPv4
ports:
  - port: 443
    protocol: TCP
endpoints:
  - addresses:
      - 10.0.10.153
    conditions:
      ready: true

---
# GitLab SSH (sshd on the VM, port 22), backend for the gitssh TCP entrypoint.
# LAN clients reach ssh://git@git.ericsweiss.com:2222 on the internal VIP; the
# VLAN cannot hairpin the WAN forward, which is what external clients use.
apiVersion: v1
kind: Service
metadata:
  name: gitlab-ssh
  namespace: gitlab
spec:
  type: ClusterIP
  ports:
    - port: 22
      targetPort: 22
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: gitlab-ssh
  namespace: gitlab
  labels:
    kubernetes.io/service-name: gitlab-ssh
    endpointslice.kubernetes.io/managed-by: manual
addressType: IPv4
ports:
  - port: 22
    protocol: TCP
endpoints:
  - addresses:
      - 10.0.10.153
    conditions:
      ready: true

---
