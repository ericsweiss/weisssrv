---
# AdGuard Home dashboards, two route flavours per instance (docs/08):
#   * dns-01/dns-02.esweiss.com — RAW routes, no SSO: AdGuard's own login is the
#     break-glass path when Authentik or the cluster is degraded. Because that
#     login is the only gate, they use lan-tailscale-STRICT, which drops the k3s
#     pod CIDR so in-cluster pods cannot reach the DNS admin UI.
#   * adguard/adguard-02.esweiss.com — SSO routes: Authentik forward-auth
#     (dns-admins) via the authentik-auth-basic middleware, which is the only
#     variant that forwards the injected credential header. Objects live in
#     terraform/authentik (docs/40).
# All four share the adguard-home-0X-backend Services over 443/https.
# IngressRoute for dns-01.esweiss.com (AdGuard Home primary, internal-only)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard-home-01
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dns-01.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-strict
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: adguard-home-01-backend
          port: 443
          scheme: https
          serversTransport: vm-tls-wildcard
  tls:
    secretName: esweiss-com-tls
---
# IngressRoute for dns-02.esweiss.com (AdGuard Home secondary, internal-only)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard-home-02
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dns-02.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-strict
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: adguard-home-02-backend
          port: 443
          scheme: https
          serversTransport: vm-tls-wildcard
  tls:
    secretName: esweiss-com-tls
---
# IngressRoute for adguard.esweiss.com (AdGuard Home primary, SSO + injection)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard-sso-01
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`adguard.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: authentik-auth-basic
          namespace: authentik
        - name: hsts-header
          namespace: traefik
      services:
        - name: adguard-home-01-backend
          port: 443
          scheme: https
          serversTransport: vm-tls-wildcard
  tls:
    secretName: esweiss-com-tls
---
# IngressRoute for adguard-02.esweiss.com (AdGuard Home secondary, SSO + injection)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard-sso-02
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`adguard-02.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: authentik-auth-basic
          namespace: authentik
        - name: hsts-header
          namespace: traefik
      services:
        - name: adguard-home-02-backend
          port: 443
          scheme: https
          serversTransport: vm-tls-wildcard
  tls:
    secretName: esweiss-com-tls
