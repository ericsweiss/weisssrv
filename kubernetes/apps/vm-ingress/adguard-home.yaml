---
# AdGuard Home dashboards over the adguard-home-0X-backend Services: raw dns-0X
# hosts on lan-tailscale-strict (break-glass, AdGuard's own login), SSO
# adguard-0X hosts behind authentik-auth-basic forward-auth. docs/08, docs/40.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard-home-01
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dns-01.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-strict
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: adguard-home-01-backend
          port: 443
          scheme: https
          serversTransport: vm-tls-wildcard
  tls:
    secretName: esweiss-com-tls
---
# IngressRoute for dns-02.esweiss.com (AdGuard Home secondary, internal-only)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard-home-02
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dns-02.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-strict
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: adguard-home-02-backend
          port: 443
          scheme: https
          serversTransport: vm-tls-wildcard
  tls:
    secretName: esweiss-com-tls
---
# IngressRoute for adguard.esweiss.com (AdGuard Home primary, SSO + injection)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard-sso-01
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`adguard.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: authentik-auth-basic
          namespace: authentik
        - name: hsts-header
          namespace: traefik
      services:
        - name: adguard-home-01-backend
          port: 443
          scheme: https
          serversTransport: vm-tls-wildcard
  tls:
    secretName: esweiss-com-tls
---
# IngressRoute for adguard-02.esweiss.com (AdGuard Home secondary, SSO + injection)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard-sso-02
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`adguard-02.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: authentik-auth-basic
          namespace: authentik
        - name: hsts-header
          namespace: traefik
      services:
        - name: adguard-home-02-backend
          port: 443
          scheme: https
          serversTransport: vm-tls-wildcard
  tls:
    secretName: esweiss-com-tls
