---
# Service + EndpointSlice for the Nextcloud VM (10.0.10.156), where host nginx
# terminates TLS with the *.esweiss.com wildcard cert. Traefik connects over
# https with the vm-tls-wildcard ServersTransport so that hop validates.
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-web
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 443
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: nextcloud-web
  namespace: default
  labels:
    kubernetes.io/service-name: nextcloud-web
    endpointslice.kubernetes.io/managed-by: manual
addressType: IPv4
ports:
  - port: 443
    protocol: TCP
endpoints:
  - addresses:
      - 10.0.10.156
    conditions:
      ready: true
