---
# IngressRoute for router (internal-only: LAN + Tailscale)
#
# Deliberately NO Authentik forward-auth: the router's own login is the gate and
# it must stay administrable when SSO is degraded (as with the AdGuard routes).
# The IP allowlist is therefore the only network gate, so this route uses
# lan-tailscale-STRICT: strict drops the k3s pod CIDR, keeping in-cluster pods
# (notably the hermes agent) off the router admin UI. Nothing in-cluster
# consumes this host.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: router
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`router.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-strict
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        # The UniFi UCG-Fiber serves its UI over HTTPS only (:443, redirecting
        # :80), with a self-signed certificate — hence the dedicated
        # unifi-self-signed ServersTransport rather than vm-tls-wildcard, which
        # validates against the acme.sh wildcard the gateway does not carry.
        - name: router-backend
          port: 443
          scheme: https
          serversTransport: unifi-self-signed
  tls:
    secretName: esweiss-com-tls
