---
# IngressRoute for router (internal-only: LAN + Tailscale)
#
# Deliberately NO Authentik forward-auth: the router's own web login is the
# gate, and the router must stay administrable when the SSO stack is degraded
# (same reasoning as the AdGuard raw routes in adguard-home.yaml). Because the
# only network gate is the IP allowlist, this route uses lan-tailscale-STRICT
# rather than lan-tailscale-only: strict drops the k3s pod CIDR, so an
# in-cluster pod — notably the hermes agent, which runs LLM-authored code and
# holds blanket :443 egress to the traefik namespace — cannot reach the router
# admin UI (over a cleartext backend hop, at that). No in-cluster client
# consumes this host.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: router
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`router.esweiss.com`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-strict
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        # Plaintext HTTP exception: the router's web UI is HTTP-only (no TLS),
        # so the Traefik->backend hop stays cleartext. Internal-only route
        # (lan-tailscale-only), so exposure is limited to the LAN/Tailscale.
        - name: router-backend
          port: 80
  tls:
    secretName: esweiss-com-tls
