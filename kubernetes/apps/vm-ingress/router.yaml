---
# IngressRoute for router (internal-only: LAN + Tailscale)
#
# Deliberately NO Authentik forward-auth: the router's own login is the gate and
# it must stay administrable when SSO is degraded (as with the AdGuard routes).
# The IP allowlist is therefore the only network gate, so this route uses
# lan-tailscale-STRICT: strict drops the k3s pod CIDR, keeping in-cluster pods
# (notably the hermes agent) off the router admin UI. Nothing in-cluster
# consumes this host.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: router
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`router.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-strict
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        # Plaintext HTTP exception: the router's web UI is HTTP-only, so the
        # Traefik->backend hop stays cleartext. lan-tailscale-strict limits
        # exposure to the LAN/Tailscale.
        - name: router-backend
          port: 80
  tls:
    secretName: esweiss-com-tls
