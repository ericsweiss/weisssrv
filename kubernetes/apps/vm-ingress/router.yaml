---
# IngressRoute for router, internal-only (LAN + Tailscale). No Authentik
# forward-auth: the router's own login is the gate, so lan-tailscale-strict is
# the network gate and drops the k3s pod CIDR. Nothing in-cluster needs it.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: router
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`router.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-strict
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        # The UCG-Fiber serves its UI over HTTPS with a self-signed cert, so
        # it needs unifi-self-signed rather than vm-tls-wildcard.
        - name: router-backend
          port: 443
          scheme: https
          serversTransport: unifi-self-signed
  tls:
    secretName: esweiss-com-tls
