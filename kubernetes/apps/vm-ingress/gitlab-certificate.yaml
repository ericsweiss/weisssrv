---
# Certificates for GitLab services
# The main *.ericsweiss.com cert doesn't cover nested subdomains like:
# - registry.git.ericsweiss.com
# - pages.git.ericsweiss.com
# - *.pages.git.ericsweiss.com
#
# These certs are used by Traefik for TLS termination since nested subdomains
# use DNS-only mode (not proxied through Cloudflare).

# GitLab Web UI and Registry - git.ericsweiss.com, registry.git.ericsweiss.com

# External domain - git.ericsweiss.com (covered by wildcard) + registry.git (nested)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitlab-services
  namespace: gitlab
spec:
  secretName: gitlab-services-ericsweiss-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "git.${cluster_external_domain}"
  dnsNames:
    - "git.${cluster_external_domain}"
    - "registry.git.${cluster_external_domain}"
  renewBefore: 720h

---
# Internal domain - git.esweiss.com + registry.git.esweiss.com
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitlab-services-internal
  namespace: gitlab
spec:
  secretName: gitlab-services-esweiss-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "git.${cluster_internal_domain}"
  dnsNames:
    - "git.${cluster_internal_domain}"
    - "registry.git.${cluster_internal_domain}"
  renewBefore: 720h

---
# GitLab Pages: pages.git.ericsweiss.com + the single-label wildcard.
#
# A wildcard covers one label only, so nested groups
# (group.subgroup.pages.git...) are NOT covered. Use hyphenated group names, or
# configure GitLab to build Pages URLs with hyphens, if that is ever needed.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitlab-pages-wildcard
  namespace: gitlab
spec:
  secretName: gitlab-pages-ericsweiss-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.pages.git.${cluster_external_domain}"
  dnsNames:
    - "*.pages.git.${cluster_external_domain}"
    - "pages.git.${cluster_external_domain}"
  renewBefore: 720h

---
# GitLab Pages wildcard - internal domain
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitlab-pages-wildcard-internal
  namespace: gitlab
spec:
  secretName: gitlab-pages-esweiss-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.pages.git.${cluster_internal_domain}"
  dnsNames:
    - "*.pages.git.${cluster_internal_domain}"
    - "pages.git.${cluster_internal_domain}"
  renewBefore: 720h

---
# GitLab Web IDE - *.ide.git.ericsweiss.com (extension host)
#
# Per-extension SOP isolation: each VS Code extension iframe is loaded from
# <ext-id>.ide.git.ericsweiss.com so the browser SOP keeps extension JS away
# from the GitLab session cookie. CVE-2026-5816 mitigation; see
# docs/27-gitlab-deployment.md.
#
# Same single-label wildcard limitation as gitlab-pages-wildcard above; GitLab
# sanitizes dotted extension IDs to single-label form before using them as a
# Host header.
#
# No internal *.ide.git.esweiss.com mirror because Web IDE is loaded as an
# iframe from git.ericsweiss.com (canonical external host), so there's no
# LAN-only entry point that would benefit from a split-horizon mirror.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitlab-web-ide-wildcard
  namespace: gitlab
spec:
  secretName: gitlab-web-ide-ericsweiss-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.ide.git.${cluster_external_domain}"
  dnsNames:
    - "*.ide.git.${cluster_external_domain}"
    - "ide.git.${cluster_external_domain}"
  renewBefore: 720h
