---
# GitLab certificates. The apex wildcard covers one label only, so the nested
# git.* names need their own certs and nested Pages/IDE groups must use
# hyphenated single-label names (docs/27).

# External domain - git.ericsweiss.com + registry.git.ericsweiss.com
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitlab-services
  namespace: gitlab
spec:
  secretName: gitlab-services-ericsweiss-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "git.${cluster_external_domain}"
  dnsNames:
    - "git.${cluster_external_domain}"
    - "registry.git.${cluster_external_domain}"
  renewBefore: 720h

---
# Internal domain - git.esweiss.com + registry.git.esweiss.com
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitlab-services-internal
  namespace: gitlab
spec:
  secretName: gitlab-services-esweiss-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "git.${cluster_internal_domain}"
  dnsNames:
    - "git.${cluster_internal_domain}"
    - "registry.git.${cluster_internal_domain}"
  renewBefore: 720h

---
# GitLab Pages: pages.git + the single-label wildcard (see header).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitlab-pages-wildcard
  namespace: gitlab
spec:
  secretName: gitlab-pages-ericsweiss-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.pages.git.${cluster_external_domain}"
  dnsNames:
    - "*.pages.git.${cluster_external_domain}"
    - "pages.git.${cluster_external_domain}"
  renewBefore: 720h

---
# GitLab Pages wildcard - internal domain
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitlab-pages-wildcard-internal
  namespace: gitlab
spec:
  secretName: gitlab-pages-esweiss-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.pages.git.${cluster_internal_domain}"
  dnsNames:
    - "*.pages.git.${cluster_internal_domain}"
    - "pages.git.${cluster_internal_domain}"
  renewBefore: 720h

---
# GitLab Web IDE extension host. Each extension iframe loads from its own
# subdomain so the browser SOP keeps extension JS away from the GitLab session
# cookie (docs/27). Single-label wildcard, external host only.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitlab-web-ide-wildcard
  namespace: gitlab
spec:
  secretName: gitlab-web-ide-ericsweiss-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.ide.git.${cluster_external_domain}"
  dnsNames:
    - "*.ide.git.${cluster_external_domain}"
    - "ide.git.${cluster_external_domain}"
  renewBefore: 720h
