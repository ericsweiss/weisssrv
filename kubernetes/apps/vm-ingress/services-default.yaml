---
# Services and EndpointSlices for backend services running outside the cluster
# Using ClusterIP services with manual EndpointSlices since these are IP addresses, not DNS names
# Mealie and Bar Assistant are in the recipes namespace (kubernetes/apps/recipes/)

# Home Assistant on 10.0.10.154:8123
apiVersion: v1
kind: Service
metadata:
  name: home-assistant-backend
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 8123
      targetPort: 8123
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: home-assistant-backend
  namespace: default
  labels:
    kubernetes.io/service-name: home-assistant-backend
    endpointslice.kubernetes.io/managed-by: manual
addressType: IPv4
ports:
  - port: 8123
    protocol: TCP
endpoints:
  - addresses:
      - 10.0.10.154
    conditions:
      ready: true

---
# Router (UniFi UCG-Fiber gateway) at 10.0.10.1:443 — HTTPS-only web UI, so
# this backend mirrors the adguard-home-0X pattern below rather than the
# plaintext :80 the retired ASUS served (docs/46).
apiVersion: v1
kind: Service
metadata:
  name: router-backend
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 443
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: router-backend
  namespace: default
  labels:
    kubernetes.io/service-name: router-backend
    endpointslice.kubernetes.io/managed-by: manual
addressType: IPv4
ports:
  - port: 443
    protocol: TCP
endpoints:
  - addresses:
      - 10.0.10.1
    conditions:
      ready: true

---
# Plex on 10.0.10.152:32400
apiVersion: v1
