---
# IngressRoute for plex.ericsweiss.com (public - external domain)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plex
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/target: ericsweiss.com
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`plex.ericsweiss.com`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
      services:
        - name: plex-backend
          port: 32400
          scheme: https
          serversTransport: vm-tls-wildcard
  tls:
    secretName: ericsweiss-com-tls
---
# IngressRoute for plex.esweiss.com (internal domain)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plex-internal
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`plex.esweiss.com`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: plex-backend
          port: 32400
          scheme: https
          serversTransport: vm-tls-wildcard
  tls:
    secretName: esweiss-com-tls
