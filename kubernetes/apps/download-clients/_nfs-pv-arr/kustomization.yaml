---
# *arr NFS PV/PVC skeleton — extends ../_nfs-pv with what the sonarr/radarr/
# lidarr config volumes add over the other clients: 10Gi capacity and the NFS
# attribute-caching mountOptions. Each *arr storage overlay (../storage/<app>)
# lists this component and patches only the per-app identifiers.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
components:
  - ../_nfs-pv
patches:
  - target:
      kind: PersistentVolume
      name: nfs-pv
    patch: |
      - op: replace
        path: /spec/capacity/storage
        value: 10Gi
      # *arr apps add NFS attribute caching ahead of xprtsec=tls. The test
      # turns a reordered base list into a loud build failure instead of a
      # silent insert at the wrong index.
      - op: test
        path: /spec/mountOptions/3
        value: xprtsec=tls
      - op: add
        path: /spec/mountOptions/3
        value: actimeo=3
      - op: add
        path: /spec/mountOptions/4
        value: lookupcache=positive
  - target:
      kind: PersistentVolumeClaim
      name: nfs-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
