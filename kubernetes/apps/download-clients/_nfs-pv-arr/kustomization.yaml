---
# *arr NFS PV/PVC skeleton: extends ../_nfs-pv with 10Gi and the mountOptions
# the config volume needs. That volume holds a WAL-mode SQLite database, so
# locks stay client-local: one Recreate replica per app is the single writer.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
components:
  - ../_nfs-pv
patches:
  - target:
      kind: PersistentVolume
      name: nfs-pv
    patch: |
      - op: replace
        path: /spec/capacity/storage
        value: 10Gi
      # *arr apps add NFS attribute caching and client-local locking ahead of
      # xprtsec=tls. The `test` ops turn a reordered base list into a loud build
      # failure instead of a silent insert at the wrong index.
      - op: test
        path: /spec/mountOptions/3
        value: xprtsec=tls
      - op: add
        path: /spec/mountOptions/3
        value: actimeo=3
      - op: add
        path: /spec/mountOptions/4
        value: lookupcache=positive
      - op: test
        path: /spec/mountOptions/5
        value: xprtsec=tls
      - op: add
        path: /spec/mountOptions/5
        value: local_lock=all
  - target:
      kind: PersistentVolumeClaim
      name: nfs-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
