---
# *arr NFS PV/PVC skeleton — a Kustomize Component that extends the base
# ../_nfs-pv component with the two things the sonarr/radarr/lidarr config
# volumes share but nzbget/qbittorrent/prowlarr/pulsarr do not: a 10Gi capacity
# and the NFS attribute-caching mountOptions (actimeo=3 + lookupcache=positive,
# inserted ahead of the xprtsec=tls option that _nfs-pv defines exactly once).
# Each *arr storage overlay (../storage/<app>) lists this component and patches
# only the per-app identifiers (PV name/label/path, PVC name/volumeName).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
components:
  - ../_nfs-pv
patches:
  - target:
      kind: PersistentVolume
      name: nfs-pv
    patch: |
      - op: replace
        path: /spec/capacity/storage
        value: 10Gi
      # *arr apps add NFS attribute caching ahead of xprtsec=tls (inserted at
      # indices 3/4 so the shared xprtsec option stays defined once in _nfs-pv).
      - op: add
        path: /spec/mountOptions/3
        value: actimeo=3
      - op: add
        path: /spec/mountOptions/4
        value: lookupcache=positive
  - target:
      kind: PersistentVolumeClaim
      name: nfs-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
