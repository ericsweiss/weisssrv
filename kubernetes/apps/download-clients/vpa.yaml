---
# VPA: Initial across the media stack — requests resize when pods restart
# (image bumps, node drains) instead of via proactive eviction, so an active
# download or import is never killed for a resize. Covers VPN sidecars too
# (containerName "*").
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: nzbget
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: nzbget}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # Size the gluetun sidecar independently — its real footprint is far
      # below the download client's, so the "*" caps would over-floor it.
      # Must precede "*" (VPA uses the first matching containerName).
      - containerName: gluetun
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
      # memory maxAllowed 1Gi, well under the container's 4Gi limit: nzbget's
      # working set is dominated by reclaimable page cache from download writes,
      # so an uncapped recommendation reserves GiBs the process never needs.
      # Expect VPARecommendationCapped here — that is the accepted case
      # (docs/33). RequestsOnly leaves the 4Gi OOM ceiling untouched.
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 2, memory: 1Gi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: qbittorrent
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: qbittorrent}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # Size the gluetun sidecar independently from the download client.
      # Must precede "*" (VPA uses the first matching containerName).
      - containerName: gluetun
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
      # The VPN-health exporter is tiny (polls the control API on loopback);
      # cap it so the "*" floor doesn't over-provision it. Must precede "*".
      # Keep maxAllowed.memory == the container's memory limit (both 48Mi):
      # under RequestsOnly the request can't exceed the limit, so the two must
      # move together or the ~36Mi recommendation stays clamped and OOM-tight.
      - containerName: gluetun-exporter
        minAllowed: {cpu: 10m, memory: 16Mi}
        maxAllowed: {cpu: 50m, memory: 48Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 2, memory: 2Gi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: prowlarr
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: prowlarr}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # RequestsOnly is required here: the prowlarr manifest sets memory
      # request == limit (512Mi), so the default RequestsAndLimits would
      # rewrite the limit down 1:1 with the request, leaving zero burst
      # headroom (observed as OOMKills on search/backup spikes).
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 1, memory: 512Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
