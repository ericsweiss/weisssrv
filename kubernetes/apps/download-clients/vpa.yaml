---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: pulsarr
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: pulsarr}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # 1.5Gi clears pulsarr's padded historical-peak recommendation, which a
      # 1Gi ceiling clamped below the working set, and equals the container's
      # hand-set memory limit (pulsarr.yaml). RequestsOnly: on the default
      # RequestsAndLimits the updater rescaled the LIMIT with each
      # recommendation — five revisions in 7d, down to 783Mi against a 903Mi
      # 30d working-set peak, so the next burst ran at >0.95 of its own
      # ceiling. docs/33 § Limit oscillation.
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 1, memory: 1536Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
