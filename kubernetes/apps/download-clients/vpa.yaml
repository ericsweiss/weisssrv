---
# VPA: Initial across the media stack — requests resize when pods restart
# (image bumps, node drains) instead of via proactive eviction, so an active
# download or import is never killed for a resize. Covers VPN sidecars too
# (containerName "*").
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: nzbget
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: nzbget}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # Size the gluetun sidecar independently — its real footprint is far
      # below the download client's, so the "*" caps would over-floor it.
      # Must precede "*" (VPA uses the first matching containerName).
      - containerName: gluetun
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
      # maxAllowed matches the nzbget container's 4Gi/2cpu limit so the
      # request can grow into the unrar/par2 headroom the limit signals.
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 2, memory: 4Gi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: qbittorrent
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: qbittorrent}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # Size the gluetun sidecar independently from the download client.
      # Must precede "*" (VPA uses the first matching containerName).
      - containerName: gluetun
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
      # The VPN-health exporter is tiny (polls the control API on loopback);
      # cap it so the "*" floor doesn't over-provision it. Must precede "*".
      - containerName: gluetun-exporter
        minAllowed: {cpu: 10m, memory: 16Mi}
        maxAllowed: {cpu: 50m, memory: 32Mi}
        controlledResources: [cpu, memory]
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 2, memory: 2Gi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: prowlarr
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: prowlarr}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 1, memory: 1Gi}
        controlledResources: [cpu, memory]
