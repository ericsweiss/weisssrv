---
# VPA Initial across the media stack: requests resize on pod restart, never by
# eviction, so an active download survives. Per-container policies precede "*"
# (first match wins); each maxAllowed stays at or under the hand-set limit.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: nzbget
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: nzbget}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # Size the gluetun sidecar independently — its real footprint is far
      # below the download client's, so the "*" caps would over-floor it.
      - containerName: gluetun
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
      # One-shot init container with a 16Mi limit (_vpn-sidecar): mode Off so
      # the download client's "*" caps are never applied to it.
      - containerName: check-vpn-config
        mode: "Off"
      # Cap sits far under the 4Gi limit: the working set is dominated by
      # reclaimable page cache from download writes, so VPARecommendationCapped
      # is expected here (docs/33).
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 2, memory: 1Gi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: qbittorrent
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: qbittorrent}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # Size the gluetun sidecar independently from the download client.
      - containerName: gluetun
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
      # The VPN-health exporter is tiny (polls the control API on loopback);
      # cap == its 48Mi limit (qbittorrent/resources.yaml) so the "*" floor
      # does not over-provision it.
      - containerName: gluetun-exporter
        minAllowed: {cpu: 10m, memory: 16Mi}
        maxAllowed: {cpu: 50m, memory: 48Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
      # One-shot init containers, each with a 16Mi limit: mode Off so the
      # qbittorrent-sized "*" caps are never applied to them.
      - containerName: check-vpn-config
        mode: "Off"
      - containerName: clean-stale-locks
        mode: "Off"
      - containerName: seed-webui-bypass
        mode: "Off"
      # Cap == the qbittorrent container's 2Gi limit (qbittorrent/resources.yaml)
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 2, memory: 2Gi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: prowlarr
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: prowlarr}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # The one measured exception to "cap == limit": 384Mi sits under
      # prowlarr's 512Mi limit, above the 30d working-set peak (257Mi), so a
      # capped request still leaves burst headroom.
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 1, memory: 384Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: sonarr
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: sonarr}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # Cap == the container's 1Gi limit (_arr/deployment.yaml); RequestsOnly,
      # so the hand-set limit stays the ceiling.
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 128Mi}
        maxAllowed: {cpu: 2, memory: 1Gi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: radarr
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: radarr}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # Cap == the container's 1Gi limit (_arr/deployment.yaml). The working set
      # is dominated by reclaimable NFS page cache (30d RSS peak ~290Mi), so the
      # memory series is excluded from both VPA sizing alerts (docs/33).
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 128Mi}
        maxAllowed: {cpu: 2, memory: 1Gi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: lidarr
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: lidarr}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # Cap == the container's 1Gi limit (_arr/deployment.yaml). The working set
      # is dominated by reclaimable NFS page cache (30d RSS peak ~290Mi), so the
      # memory series is excluded from both VPA sizing alerts (docs/33).
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 128Mi}
        maxAllowed: {cpu: 2, memory: 1Gi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: pulsarr
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: pulsarr}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # RequestsOnly; cap == the 1536Mi limit in pulsarr.yaml (docs/33 § Limit
      # oscillation).
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 1, memory: 1536Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
