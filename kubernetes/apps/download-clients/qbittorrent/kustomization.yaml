---
# CRITICAL: the JSON6902 patches below edit fields _vpn-sidecar injects at fixed
# indices (gluetun=containers[0], env[0], env[1], volumes[1]); the `op: test`
# guards fail the build if that ordering changes. They set the per-app ConfigMap
# name and add the WebUI and BT peer ports to gluetun, which owns the pod netns.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
resources:
  - resources.yaml
components:
  - ../_vpn-sidecar
patches:
  - target:
      kind: Deployment
      name: qbittorrent
    patch: |
      - op: test
        path: /spec/template/spec/containers/0/name
        value: gluetun
      - op: test
        path: /spec/template/spec/containers/0/env/0/name
        value: VPN_SERVICE_PROVIDER
      - op: test
        path: /spec/template/spec/containers/0/env/1/name
        value: SERVER_COUNTRIES
      - op: test
        path: /spec/template/spec/volumes/1/name
        value: vpn-config
      - op: replace
        path: /spec/template/spec/containers/0/env/0/valueFrom/configMapKeyRef/name
        value: qbittorrent-vpn-config
      - op: replace
        path: /spec/template/spec/containers/0/env/1/valueFrom/configMapKeyRef/name
        value: qbittorrent-vpn-config
      - op: replace
        path: /spec/template/spec/volumes/1/configMap/name
        value: qbittorrent-vpn-config
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value:
          name: qbittorrent
          containerPort: 8080
          protocol: TCP
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value:
          name: bt-tcp
          containerPort: 6881
          protocol: TCP
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value:
          name: bt-udp
          containerPort: 6881
          protocol: UDP
