---
# qBittorrent (qbittorrent.esweiss.com). The shared Gluetun sidecar, its
# initContainer, volumes and pod dnsConfig come from the ../_vpn-sidecar
# component; this file carries only the qBittorrent-specific pieces. VPN and
# Direct mode, and how to switch them, are in README.md § Per-App VPN Control.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-vpn-config
  namespace: downloads
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/component: config
  annotations:
    # CREATE-ONLY apply: Flux creates this ConfigMap on a fresh cluster and then
    # never reverts it, so `task downloads:vpn` patches stick. The values below
    # are therefore only the bootstrap default — git edits do not propagate
    # until the object is deleted and reconciled. README § Live VPN Toggles.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
data:
  # COUPLED: vpn_enabled + the gluetun-exporter container + the
  # gluetun-qbittorrent PodMonitor below must change together — see the
  # download-clients README § Per-App VPN Control.
  vpn_enabled: "true"
  # VPN provider: "privado", "vpn unlimited"
  vpn_provider: "privado"
  # Server location (optional, provider-dependent)
  server_countries: "Netherlands"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: downloads
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/component: download-client
    app.kubernetes.io/part-of: media-stack
  annotations:
    # Human-readable marker only (not scraped): this pod runs the Gluetun VPN
    # sidecar. Actual VPN metrics come from the gluetun-exporter sidecar below.
    ${cluster_node_label_domain}/vpn-mode: "sidecar"
    # Reloader rolls this Deployment when the qbittorrent-vpn-config ConfigMap
    # changes, so a vpn_enabled/vpn_provider edit needs no manual restart.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
        app.kubernetes.io/component: download-client
    spec:
      nodeSelector:
        ${cluster_node_label_domain}/nas: "true"
      tolerations:
        - key: ${cluster_node_label_domain}/nas
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
      # qBittorrent flushes torrent state on shutdown; default 30s can leave
      # corrupted resume data on slow NFS. 60s gives a clean exit margin.
      terminationGracePeriodSeconds: 60

      # No container here talks to the kube-API. Only the pod-level safe subset
      # is applied: the gluetun sidecar and gluetun-exporter carry their own
      # securityContexts, and the LinuxServer.io image starts as root to drop
      # privileges via s6, so drop-ALL is not set on it.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        # An ungraceful shutdown leaves a lockfile + IPC socket that qBittorrent
        # reads as a live instance on the next start, crash-looping the pod.
        # Clearing them is safe only because this Deployment is single-replica
        # with Recreate — revisit if replicas>1, RollingUpdate or an RWX PVC is
        # ever introduced, since a live peer's lock could be deleted.
        - name: clean-stale-locks
          image: busybox:${busybox_version}
          command:
            - sh
            - -ec
            - rm -fv /config/qBittorrent/lockfile /config/qBittorrent/ipc-socket
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
          volumeMounts:
            - name: config
              mountPath: /config

        # Single sign-on: qBittorrent's form/cookie WebUI cannot take Authentik's
        # injected headers, so its own login is bypassed via
        # WebUI\AuthSubnetWhitelist — runtime state on the config PVC, not git.
        # This container keeps the k3s pod CIDR (the source IP of a
        # Traefik-forwarded request) in that whitelist on every start. Safe
        # because only Traefik reaches :8080 and it enforces Authentik SSO.
        # Idempotent: existing keys are rewritten, missing ones inserted under
        # [Preferences], and a not-yet-created conf is a no-op.
        - name: seed-webui-bypass
          image: busybox:${busybox_version}
          command:
            - sh
            - -ec
            - |
              conf=/config/qBittorrent/qBittorrent.conf
              if [ ! -f "$conf" ]; then
                echo "[seed-webui-bypass] no config yet (fresh install); applies on next start"
                exit 0
              fi
              wl="${cluster_pod_cidr}, ${cluster_lan_cidr}, ${cluster_tailnet_cidr}"
              tmp="$conf.seed-tmp"
              awk -v wl="$wl" '
                BEGIN { en=0; wl_set=0; in_pref=0 }
                /^\[Preferences\]$/ { in_pref=1; print; next }
                /^\[.*\]$/ {
                  if (in_pref) {
                    if (!en)     print "WebUI\\AuthSubnetWhitelistEnabled=true"
                    if (!wl_set) print "WebUI\\AuthSubnetWhitelist=" wl
                    in_pref=0
                  }
                  print; next
                }
                index($0, "WebUI\\AuthSubnetWhitelistEnabled=") == 1 { print "WebUI\\AuthSubnetWhitelistEnabled=true"; en=1; next }
                index($0, "WebUI\\AuthSubnetWhitelist=") == 1        { print "WebUI\\AuthSubnetWhitelist=" wl; wl_set=1; next }
                { print }
                END {
                  if (in_pref) {
                    if (!en)     print "WebUI\\AuthSubnetWhitelistEnabled=true"
                    if (!wl_set) print "WebUI\\AuthSubnetWhitelist=" wl
                  }
                }
              ' "$conf" > "$tmp"
              if [ -s "$tmp" ] && ! cmp -s "$tmp" "$conf"; then
                cat "$tmp" > "$conf"
                echo "[seed-webui-bypass] AuthSubnetWhitelist now includes the pod CIDR"
              else
                echo "[seed-webui-bypass] whitelist already current; no change"
              fi
              rm -f "$tmp"
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
          volumeMounts:
            - name: config
              mountPath: /config

      containers:
        # Gluetun VPN-health exporter: polls the control server on loopback and
        # serves gluetun_vpn_status on :8002, scraped by the PodMonitor below
        # and alerted on by VPNDown. Third-party image, so it is pinned by
        # immutable digest (re-resolve when bumping the tag) and runs read-only
        # with no mounts. COUPLED: vpn_enabled + this sidecar + that PodMonitor
        # change together — README § Per-App VPN Control.
        - name: gluetun-exporter
          image: ghcr.io/thecfu/gluetun-exporter:0.1.1-standalone@sha256:bafeabb2a9638bf6b0800c2d3d47d49c6236d879bd01eec8caea45dfca2b50c5
          imagePullPolicy: IfNotPresent
          env:
            # Control server lives on :8001 here (not the exporter's :8000
            # default); the exporter serves its own /metrics on EXPORTER_PORT.
            - name: GLUETUN_URL
              value: "http://127.0.0.1:8001"
            - name: EXPORTER_PORT
              value: "8002"
            - name: EXPORTER_INTERVAL
              value: "30"
            # standalone build has no netlink throughput collection
            - name: EXPORTER_BUNDLED
              value: "false"
            # X-API-Key for the role-protected control server — the same key
            # config.toml grants the "exporter" role, from one Secret so the two
            # cannot drift. Reloader ignores Secrets, so rotation is a manual pod
            # restart (README § Control-Server Auth). optional mirrors the
            # gluetun-auth volume: a missing key leaves both sides
            # unauthenticated and scraping rather than wedging the pod.
            - name: GLUETUN_APIKEY
              valueFrom:
                secretKeyRef:
                  name: gluetun-control-auth
                  key: apikey
                  optional: true
          ports:
            - name: vpn-metrics
              containerPort: 8002
              protocol: TCP
          # Liveness only — never gate pod readiness on the exporter, so a
          # scrape blip can't take qbittorrent out of rotation.
          livenessProbe:
            httpGet:
              path: /metrics
              port: vpn-metrics
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              # 48Mi clears the ~36Mi VPA recommendation with OOM headroom;
              # keep in lockstep with the gluetun-exporter VPA maxAllowed.memory
              # (download-clients/vpa.yaml) — RequestsOnly can't exceed this.
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

        # Note: qBittorrent uses bare version tags (not version- prefixed like other LinuxServer images)
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:${qbittorrent_version}
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "2000"
            - name: TZ
              value: America/Los_Angeles
            - name: UMASK
              value: "002"
            - name: WEBUI_PORT
              value: "8080"
            - name: TORRENTING_PORT
              value: "6881"
            # qBittorrent 5.2+ adds a non-interactive EULA-style legal
            # notice — without `QBT_LEGAL_NOTICE=confirm` the daemon
            # writes its prompt to stderr and exits immediately (looks
            # like the "qBittorrent termination initiated" loop). LSIO
            # forwards this env var to qbittorrent-nox.
            - name: QBT_LEGAL_NOTICE
              value: "confirm"
          # Ports live on the gluetun sidecar, which owns the network namespace.
          # NFS-ESTALE self-heal: after a NAS reboot the established mounts
          # return stale handles that qBittorrent never recovers from while the
          # WebUI keeps answering, so liveness stats both NFS mounts — ESTALE or
          # a hung hard-mount fails the probe and kubelet remounts on restart.
          # readiness keeps the UI check. Timing is conservative so a brief NFS
          # blip cannot flap-restart the pod.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - stat /config /media/downloads >/dev/null 2>&1 || exit 1
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /media/downloads
              subPath: downloads

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: data
          persistentVolumeClaim:
            claimName: data

---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: downloads
  labels:
    app.kubernetes.io/name: qbittorrent
spec:
  selector:
    app.kubernetes.io/name: qbittorrent
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP

---
# PodMonitor, not ServiceMonitor: the exporter port is pod-local and the app
# Service only fronts the UI. The scrape also needs the
# allow-observability-vpn-scrape rule in networkpolicy.yaml.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gluetun-qbittorrent
  namespace: downloads
  labels:
    app.kubernetes.io/name: qbittorrent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  podMetricsEndpoints:
    - port: vpn-metrics
      path: /metrics
      interval: 30s
