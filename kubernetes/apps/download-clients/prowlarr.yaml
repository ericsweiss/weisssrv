---
# Prowlarr - Indexer manager for *arr apps
# URL: prowlarr.esweiss.com
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: downloads
  labels:
    app.kubernetes.io/name: prowlarr
    app.kubernetes.io/component: indexer-manager
    app.kubernetes.io/part-of: media-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr
        app.kubernetes.io/component: indexer-manager
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: ${cluster_node_label_domain}/nas
                    operator: DoesNotExist
      nodeSelector:
        ${cluster_node_label_domain}/general: "true"
      # Pod hardening: only the universally-safe subset. This LinuxServer.io
      # image (s6 + PUID/PGID) must start as root to drop privileges, so
      # runAsNonRoot / drop-ALL / aPE:false would break it and are not set.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          # ClusterFirst pod on the DNAT'd kube-dns path — fresh socket for the
          # second parallel A/AAAA query avoids the ~5s conntrack DNAT race.
          - name: single-request-reopen
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:version-${prowlarr_version}
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "2000"
            - name: TZ
              value: ${cluster_timezone}
            - name: UMASK
              value: "002"
          ports:
            - name: http
              containerPort: 9696
              protocol: TCP
          # 5-minute liveness budget, as in _arr/deployment.yaml: an indexer
          # rescan stalls /ping and a shorter budget SIGKILLs a healthy app.
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              # Above the 30d working-set peak (257Mi) and below the limit —
              # request == limit leaves no burst headroom. vpa.yaml caps the
              # recommendation at 384Mi, under the 512Mi limit.
              memory: 320Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config

---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: downloads
  labels:
    app.kubernetes.io/name: prowlarr
spec:
  selector:
    app.kubernetes.io/name: prowlarr
  ports:
    - name: http
      port: 9696
      targetPort: http
  type: ClusterIP
