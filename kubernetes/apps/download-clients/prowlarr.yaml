---
# Prowlarr - Indexer manager for *arr apps
# URL: prowlarr.esweiss.com
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: downloads
  labels:
    app.kubernetes.io/name: prowlarr
    app.kubernetes.io/component: indexer-manager
    app.kubernetes.io/part-of: media-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr
        app.kubernetes.io/component: indexer-manager
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: ${cluster_node_label_domain}/nas
                    operator: DoesNotExist
      nodeSelector:
        ${cluster_node_label_domain}/general: "true"
      # Pod hardening: only the universally-safe subset. This LinuxServer.io
      # image (s6 + PUID/PGID) must start as root to drop privileges, so
      # runAsNonRoot / drop-ALL / aPE:false would break it and are not set.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          # ClusterFirst pod on the DNAT'd kube-dns path — fresh socket for the
          # second parallel A/AAAA query avoids the ~5s conntrack DNAT race.
          - name: single-request-reopen
      initContainers:
        # SSO-only: External turns the app's own login off (the forward-auth
        # middleware is the only path in) and TrustedNetworks names Traefik as
        # the proxy, so the real client address is honoured. Both hidden in UI.
        - name: seed-external-auth
          image: busybox:${busybox_version}
          env:
            # The proxy's own network, NOT a client allowlist: a forwarded
            # request from outside it is non-local whatever address it carries.
            - name: TRUSTED_NETWORKS
              value: ${cluster_pod_cidr}
          command:
            - sh
            - -ec
            - |
              conf=/config/config.xml
              if [ ! -f "$conf" ]; then
                echo "[seed-external-auth] no config yet (fresh install); applies on next start"
                exit 0
              fi
              auth='<AuthenticationMethod>External</AuthenticationMethod>'
              net="<TrustedNetworks>$TRUSTED_NETWORKS</TrustedNetworks>"
              if grep -qF "$auth" "$conf" && grep -qF "$net" "$conf"; then
                echo "[seed-external-auth] already current; no change"
                exit 0
              fi
              tmp="$conf.seed-tmp"
              awk -v auth="$auth" -v net="$net" '
                {
                  line = $0
                  if (sub(/<AuthenticationMethod>[^<]*<\/AuthenticationMethod>/, auth, line)) have_auth = 1
                  if (sub(/<AuthenticationMethod[ \t]*\/>/, auth, line))                      have_auth = 1
                  if (sub(/<TrustedNetworks>[^<]*<\/TrustedNetworks>/, net, line))            have_net = 1
                  if (sub(/<TrustedNetworks[ \t]*\/>/, net, line))                            have_net = 1
                  buf[++n] = line
                }
                END {
                  ins = ""
                  if (!have_auth) ins = ins "\n  " auth
                  if (!have_net)  ins = ins "\n  " net
                  for (i = 1; i <= n; i++) {
                    line = buf[i]
                    if (ins != "" && !done && sub(/<Config>/, "<Config>" ins, line)) done = 1
                    print line
                  }
                }
              ' "$conf" > "$tmp"
              # Write in place so the app's own uid keeps owning config.xml.
              if grep -qF "$auth" "$tmp" && grep -qF "$net" "$tmp"; then
                cat "$tmp" > "$conf"
                rm -f "$tmp"
                echo "[seed-external-auth] External auth, trusted proxy $TRUSTED_NETWORKS"
              else
                rm -f "$tmp"
                echo "[seed-external-auth] ERROR: no <Config> root to patch" >&2
                exit 1
              fi
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:version-${prowlarr_version}
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "2000"
            - name: TZ
              value: ${cluster_timezone}
            - name: UMASK
              value: "002"
          ports:
            - name: http
              containerPort: 9696
              protocol: TCP
          # 5-minute liveness budget, as in _arr/deployment.yaml: an indexer
          # rescan stalls /ping and a shorter budget SIGKILLs a healthy app.
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              # Above the 30d working-set peak (257Mi) and below the limit —
              # request == limit leaves no burst headroom. vpa.yaml caps the
              # recommendation at 384Mi, under the 512Mi limit.
              memory: 320Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config

---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: downloads
  labels:
    app.kubernetes.io/name: prowlarr
spec:
  selector:
    app.kubernetes.io/name: prowlarr
  ports:
    - name: http
      port: 9696
      targetPort: http
  type: ClusterIP
