---
# Wildcard certificate for *.esweiss.com in downloads namespace
# cert-manager will manage this secret and handle renewals automatically
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: esweiss-com-wildcard
  namespace: downloads
spec:
  secretName: esweiss-com-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.esweiss.com"
  dnsNames:
    - "*.esweiss.com"
    - esweiss.com
  # Staggered renewBefore across the three identical *.esweiss.com certs
  # (default 720h / external-secrets 600h / downloads 480h) so they don't all
  # renew in the same window and trip the Let's Encrypt 5-per-week duplicate limit.
  renewBefore: 480h
