---
# Wildcard certificate for *.esweiss.com in downloads namespace
# cert-manager will manage this secret and handle renewals automatically
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: esweiss-com-wildcard
  namespace: downloads
spec:
  secretName: esweiss-com-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.esweiss.com"
  dnsNames:
    - "*.esweiss.com"
    - esweiss.com
  # Staggered renewBefore leg; the canonical stagger note (all three legs +
  # rationale) lives in configs/wildcard-certificates.yaml.
  renewBefore: 480h   # 20 days (staggered)
