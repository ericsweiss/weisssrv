---
# Shared downloads IngressRoute skeleton; each per-app overlay replaces the
# placeholder name, host, service and port. The entryPoint, middleware chain
# and tls.secretName every downloads route shares live here once.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app
  namespace: downloads
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`app.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: authentik-auth
          namespace: authentik
        - name: hsts-header
          namespace: traefik
      services:
        - name: app
          port: 8080
  tls:
    secretName: esweiss-com-tls
