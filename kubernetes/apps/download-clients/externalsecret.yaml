---
# VPN credentials for the Gluetun sidecars (nzbget, qbittorrent), mounted as
# files at /vpn-secrets. The gluetun command wrapper (see _vpn-sidecar) reads
# vpn_provider from the app's VPN ConfigMap and exports the matching
# OPENVPN_*_SECRETFILE paths — so BOTH providers' credentials live in this one
# Secret under provider-prefixed keys and the active provider is chosen live.
#
# PrivadoVPN authenticates with an OpenVPN username/password.
# VPN Unlimited (KeepSolid) needs ALL FOUR of user, password, client certificate
#   AND client key: gluetun's generated OpenVPN config is cert/key-based
#   (auth-user-pass off), but its settings validation still requires a non-empty
#   user + password for the provider. Those four fields are not yet in 1Password,
#   so they are wired but commented out; see the operator follow-up in docs/15
#   and docs/21.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vpn-credentials
  namespace: downloads
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: vpn-credentials
    creationPolicy: Owner
  data:
    # PrivadoVPN (default / currently wired provider).
    - secretKey: privadovpn-user
      remoteRef:
        key: PrivadoVPN Credentials
        property: openvpn-user
    - secretKey: privadovpn-password
      remoteRef:
        key: PrivadoVPN Credentials
        property: openvpn-password
    # VPN Unlimited (alternate provider) — OpenVPN user/password + client cert/key.
    # OPERATOR FOLLOW-UP to enable `PROVIDER=vpnunlimited`:
    #   1. From the VPN Unlimited (KeepSolid) portal, generate a Manual/OpenVPN
    #      configuration for one device and download it. Note the login
    #      user/password it issues for that config.
    #   2. On the "VPN Unlimited Credentials" item (docs/15) add fields
    #      `openvpn-user`, `openvpn-password`, `openvpn-clientcrt` (the full PEM
    #      `<cert>...</cert>` block) and `openvpn-clientkey` (the full PEM
    #      `<key>...</key>` block).
    #   3. Uncomment the four entries below, commit, push (Flux syncs the Secret).
    # Gluetun requires ALL FOUR (user/password are validated even though its
    # generated config is cert/key-based); it parses the cert/key files as PEM.
    # - secretKey: vpnunlimited-user
    #   remoteRef:
    #     key: VPN Unlimited Credentials
    #     property: openvpn-user
    # - secretKey: vpnunlimited-password
    #   remoteRef:
    #     key: VPN Unlimited Credentials
    #     property: openvpn-password
    # - secretKey: vpnunlimited-clientcrt
    #   remoteRef:
    #     key: VPN Unlimited Credentials
    #     property: openvpn-clientcrt
    # - secretKey: vpnunlimited-clientkey
    #   remoteRef:
    #     key: VPN Unlimited Credentials
    #     property: openvpn-clientkey

---
# Gluetun HTTP control-server auth. Renders /gluetun/auth roles TOML with an
# apikey so the gluetun-exporter's three read-only status routes require an
# X-API-Key and every other control route returns 401 — this both locks the
# loopback control API down and silences gluetun's "route ... is unprotected"
# WARN spam. The `apikey` key of the SAME Secret is consumed as GLUETUN_APIKEY
# by the exporter container, so the config and the client can never drift.
#
# The role name MUST NOT be "public": gluetun only warns for its auto-generated
# `public`/none role, so any named role (even auth != apikey) suppresses the
# warning. The three routes are exactly what thecfu/gluetun-exporter v0.1.1
# polls; leaving all other routes uncovered makes them 401 by default.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun-control-auth
  namespace: downloads
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: gluetun-control-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Mounted read-only at /gluetun-auth/config.toml in the gluetun sidecar.
        config.toml: |
          [[roles]]
          name = "exporter"
          routes = [
            "GET /v1/vpn/status",
            "GET /v1/publicip/ip",
            "GET /v1/openvpn/portforwarded",
          ]
          auth = "apikey"
          apikey = {{ .apikey | quote }}
        # Consumed as GLUETUN_APIKEY env by the gluetun-exporter container.
        apikey: "{{ .apikey }}"
  data:
    - secretKey: apikey
      remoteRef:
        key: Download Client API Keys
        property: gluetun-control-apikey
