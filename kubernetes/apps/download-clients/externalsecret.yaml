---
# VPN credentials for Gluetun sidecars (nzbget, qbittorrent).
# Sourced from 1Password item "PrivadoVPN Credentials"
# via ESO onepassword-connect provider. Replaces the previous task-command
# imperative secret creation (vpn-common.reference.yaml, now deleted).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vpn-credentials
  namespace: downloads
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: vpn-credentials
    creationPolicy: Owner
  data:
    - secretKey: openvpn-user
      remoteRef:
        key: PrivadoVPN Credentials
        property: openvpn-user
    - secretKey: openvpn-password
      remoteRef:
        key: PrivadoVPN Credentials
        property: openvpn-password
