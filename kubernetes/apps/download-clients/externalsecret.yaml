---
# VPN credentials for the Gluetun sidecars (nzbget, qbittorrent), mounted as
# files at /vpn-secrets. The gluetun command wrapper (see _vpn-sidecar) reads
# vpn_provider from the app's VPN ConfigMap and exports the matching
# OPENVPN_*_SECRETFILE paths — so BOTH providers' credentials live in this one
# Secret under provider-prefixed keys and the active provider is chosen live.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vpn-credentials
  namespace: downloads
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: vpn-credentials
    creationPolicy: Owner
  data:
    # PrivadoVPN (default / currently wired provider).
    - secretKey: privadovpn-user
      remoteRef:
        key: PrivadoVPN Credentials
        property: openvpn-user
    - secretKey: privadovpn-password
      remoteRef:
        key: PrivadoVPN Credentials
        property: openvpn-password
    # VPN Unlimited (alternate provider) is not wired — gluetun requires all
    # four of user/password/clientcrt/clientkey. Procedure: docs/21 § Provider
    # Switching.

---
# Gluetun HTTP control-server auth: a roles TOML granting the exporter's three
# read-only status routes an X-API-Key, so every other control route 401s. The
# same Secret's `apikey` key is the exporter's GLUETUN_APIKEY, so config and
# client cannot drift. The role name must NOT be "public" — gluetun only
# suppresses its "route unprotected" warning for a named role.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun-control-auth
  namespace: downloads
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: gluetun-control-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Mounted read-only at /gluetun-auth/config.toml in the gluetun sidecar.
        config.toml: |
          [[roles]]
          name = "exporter"
          routes = [
            "GET /v1/vpn/status",
            "GET /v1/publicip/ip",
            "GET /v1/openvpn/portforwarded",
            # gluetun-exporter also polls /v1/portforward for
            # gluetun_forwarded_ports_total; without it the exporter's scrape
            # errors (401) and gluetun_vpn_status falsely reports 0, tripping
            # VPNDown even with a healthy tunnel.
            "GET /v1/portforward",
          ]
          auth = "apikey"
          apikey = {{ .apikey | quote }}
        # Consumed as GLUETUN_APIKEY env by the gluetun-exporter container.
        apikey: "{{ .apikey }}"
  data:
    - secretKey: apikey
      remoteRef:
        key: Download Client API Keys
        property: gluetun-control-apikey
