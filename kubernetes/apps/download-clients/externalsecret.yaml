---
# VPN credentials for the Gluetun sidecars, mounted as files at /vpn-secrets.
# Provider credentials live in this one Secret under provider-prefixed keys;
# the gluetun wrapper picks the active set from the app's VPN ConfigMap.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vpn-credentials
  namespace: downloads
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: vpn-credentials
    creationPolicy: Owner
  data:
    # PrivadoVPN (default / currently wired provider).
    - secretKey: privadovpn-user
      remoteRef:
        key: PrivadoVPN Credentials
        property: openvpn-user
    - secretKey: privadovpn-password
      remoteRef:
        key: PrivadoVPN Credentials
        property: openvpn-password
    # Privado is the only wired provider; a second one needs its credential
    # entries here and a case in _vpn-sidecar/vpn-sidecar.yaml (docs/16).

---
# Gluetun control-server auth: a roles TOML giving the exporter's read-only
# routes an X-API-Key (every other route 401s), plus the same key as `apikey`
# for GLUETUN_APIKEY. The role must NOT be named "public" or gluetun warns.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun-control-auth
  namespace: downloads
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: gluetun-control-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Mounted read-only at /gluetun-auth/config.toml in the gluetun sidecar.
        config.toml: |
          [[roles]]
          name = "exporter"
          routes = [
            "GET /v1/vpn/status",
            "GET /v1/publicip/ip",
            "GET /v1/openvpn/portforwarded",
            # gluetun-exporter also polls /v1/portforward; without it its scrape
            # 401s and gluetun_vpn_status falsely reports 0, tripping VPNDown on
            # a healthy tunnel.
            "GET /v1/portforward",
          ]
          auth = "apikey"
          apikey = {{ .apikey | quote }}
        # Consumed as GLUETUN_APIKEY env by the gluetun-exporter container.
        apikey: "{{ .apikey }}"
  data:
    - secretKey: apikey
      remoteRef:
        key: Download Client API Keys
        property: gluetun-control-apikey
