---
# NZBGet overlay: NZBGet's own resources + the shared _vpn-sidecar component.
# The JSON6902 patches below edit the injected fields IN PLACE at the indices
# the component fixes — gluetun=containers[0], VPN_SERVICE_PROVIDER=env[0],
# SERVER_COUNTRIES=env[1], vpn-config=volumes[1] — to set the per-app ConfigMap
# name and append NZBGet's port to gluetun, which owns the pod netns.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
resources:
  - resources.yaml
components:
  - ../_vpn-sidecar
patches:
  - target:
      kind: Deployment
      name: nzbget
    patch: |
      # Guard the component's injected layout: if _vpn-sidecar ever changes the
      # container/env/volume ordering, these `test` ops fail the kustomize build
      # loudly instead of silently patching the wrong container/volume.
      - op: test
        path: /spec/template/spec/containers/0/name
        value: gluetun
      - op: test
        path: /spec/template/spec/containers/0/env/0/name
        value: VPN_SERVICE_PROVIDER
      - op: test
        path: /spec/template/spec/containers/0/env/1/name
        value: SERVER_COUNTRIES
      - op: test
        path: /spec/template/spec/volumes/1/name
        value: vpn-config
      - op: replace
        path: /spec/template/spec/containers/0/env/0/valueFrom/configMapKeyRef/name
        value: nzbget-vpn-config
      - op: replace
        path: /spec/template/spec/containers/0/env/1/valueFrom/configMapKeyRef/name
        value: nzbget-vpn-config
      - op: replace
        path: /spec/template/spec/volumes/1/configMap/name
        value: nzbget-vpn-config
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value:
          name: nzbget
          containerPort: 6789
          protocol: TCP
