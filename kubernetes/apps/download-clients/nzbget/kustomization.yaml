---
# NZBGet overlay: NZBGet's own resources plus the shared _vpn-sidecar component.
# The JSON6902 patches edit the injected fields in place at the indices the
# component fixes, setting the per-app ConfigMap and NZBGet's port on gluetun.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
resources:
  - resources.yaml
components:
  - ../_vpn-sidecar
patches:
  - target:
      kind: Deployment
      name: nzbget
    patch: |
      # Guard the component's injected layout: if _vpn-sidecar ever changes the
      # container/env/volume ordering, these `test` ops fail the kustomize build
      # loudly instead of silently patching the wrong container/volume.
      - op: test
        path: /spec/template/spec/containers/0/name
        value: gluetun
      - op: test
        path: /spec/template/spec/containers/0/env/0/name
        value: VPN_SERVICE_PROVIDER
      - op: test
        path: /spec/template/spec/containers/0/env/1/name
        value: SERVER_COUNTRIES
      - op: test
        path: /spec/template/spec/volumes/1/name
        value: vpn-config
      - op: replace
        path: /spec/template/spec/containers/0/env/0/valueFrom/configMapKeyRef/name
        value: nzbget-vpn-config
      - op: replace
        path: /spec/template/spec/containers/0/env/1/valueFrom/configMapKeyRef/name
        value: nzbget-vpn-config
      - op: replace
        path: /spec/template/spec/volumes/1/configMap/name
        value: nzbget-vpn-config
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value:
          name: nzbget
          containerPort: 6789
          protocol: TCP
