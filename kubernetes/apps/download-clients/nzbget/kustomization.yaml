---
# NZBGet overlay: NZBGet-specific resources + the shared Gluetun VPN sidecar.
# The component injects the gluetun container (containers[0]), the
# check-vpn-config initContainer, and the tun/vpn-config volumes (volumes[0]/[1])
# + pod dnsConfig. The JSON6902 patches below edit those injected fields IN
# PLACE (no list reordering) to set the per-app ConfigMap name
# (nzbget-vpn-config) on the two gluetun env refs + the vpn-config volume, and
# append NZBGet's app port (6789) to the gluetun container (which owns the
# shared pod network namespace). Indices are fixed by the component:
# gluetun=containers[0], VPN_SERVICE_PROVIDER=env[0], SERVER_COUNTRIES=env[3],
# vpn-config=volumes[1].
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
resources:
  - resources.yaml
components:
  - ../_vpn-sidecar
patches:
  - target:
      kind: Deployment
      name: nzbget
    patch: |
      # Guard the component's injected layout: if _vpn-sidecar ever changes the
      # container/env/volume ordering, these `test` ops fail the kustomize build
      # loudly instead of silently patching the wrong container/volume.
      - op: test
        path: /spec/template/spec/containers/0/name
        value: gluetun
      - op: test
        path: /spec/template/spec/containers/0/env/0/name
        value: VPN_SERVICE_PROVIDER
      - op: test
        path: /spec/template/spec/containers/0/env/3/name
        value: SERVER_COUNTRIES
      - op: test
        path: /spec/template/spec/volumes/1/name
        value: vpn-config
      - op: replace
        path: /spec/template/spec/containers/0/env/0/valueFrom/configMapKeyRef/name
        value: nzbget-vpn-config
      - op: replace
        path: /spec/template/spec/containers/0/env/3/valueFrom/configMapKeyRef/name
        value: nzbget-vpn-config
      - op: replace
        path: /spec/template/spec/volumes/1/configMap/name
        value: nzbget-vpn-config
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value:
          name: nzbget
          containerPort: 6789
          protocol: TCP
