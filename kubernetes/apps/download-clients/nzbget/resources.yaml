---
# NZBGet (nzbget.esweiss.com). The shared Gluetun sidecar, its initContainer,
# volumes and pod dnsConfig come from the ../_vpn-sidecar component; this file
# carries only the NZBGet-specific pieces. VPN and Direct mode, and how to
# switch them, are in README.md § Per-App VPN Control.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nzbget-vpn-config
  namespace: downloads
  labels:
    app.kubernetes.io/name: nzbget
    app.kubernetes.io/component: config
  annotations:
    # CREATE-ONLY apply: Flux creates this ConfigMap on a fresh cluster and then
    # never reverts it, so `task downloads:vpn` patches stick. The values below
    # are therefore only the bootstrap default — git edits do not propagate
    # until the object is deleted and reconciled. README § Live VPN Toggles.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
data:
  vpn_enabled: "false"
  # VPN provider: "privado", "vpn unlimited"
  vpn_provider: "privado"
  # Server location (optional, provider-dependent)
  server_countries: "Netherlands"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nzbget
  namespace: downloads
  labels:
    app.kubernetes.io/name: nzbget
    app.kubernetes.io/component: download-client
    app.kubernetes.io/part-of: media-stack
  annotations:
    # Human-readable marker only (not scraped). nzbget carries no
    # gluetun-exporter, so it has no VPN metrics.
    esweiss.com/vpn-mode: "sidecar"
    # Reloader rolls this Deployment when the nzbget-vpn-config ConfigMap
    # changes, so a vpn_enabled/vpn_provider edit needs no manual restart.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nzbget
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nzbget
        app.kubernetes.io/component: download-client
    spec:
      nodeSelector:
        esweiss.com/nas: "true"
      tolerations:
        - key: esweiss.com/nas
          operator: Equal
          value: "true"
          effect: PreferNoSchedule

      # No container here talks to the kube-API. Only the pod-level safe subset
      # is applied: the gluetun sidecar carries its own securityContext, and the
      # LinuxServer.io image starts as root to drop privileges via s6.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        # LinuxServer.io uses the version-vX.Y tag format.
        - name: nzbget
          image: lscr.io/linuxserver/nzbget:version-v${nzbget_version}
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "2000"
            - name: TZ
              value: America/Los_Angeles
            - name: UMASK
              value: "002"
          # Ports live on the gluetun sidecar, which owns the network namespace.
          # NFS-ESTALE self-heal: after a NAS reboot the established mounts
          # return stale handles NZBGet never recovers from, so liveness stats
          # both NFS mounts — ESTALE or a hung hard-mount fails the probe and
          # kubelet remounts on restart. Timing is conservative so a brief NFS
          # blip cannot flap-restart the pod.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - stat /config /media/downloads >/dev/null 2>&1 || exit 1
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 6789
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /media/downloads
              subPath: downloads

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: nzbget-config
        - name: data
          persistentVolumeClaim:
            claimName: data

---
apiVersion: v1
kind: Service
metadata:
  name: nzbget
  namespace: downloads
  labels:
    app.kubernetes.io/name: nzbget
spec:
  selector:
    app.kubernetes.io/name: nzbget
  ports:
    - name: http
      port: 6789
      targetPort: 6789
  type: ClusterIP
