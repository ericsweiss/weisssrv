---
# The shared /media volume, mounted at the same path in every pod so downloads
# and library can hard-link. Per-app config PV/PVC pairs come from ../_nfs-pv.
# NFS-over-TLS; hostname and force annotation: ../_nfs-pv/resources.yaml, docs/07.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: downloads-data
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: downloads
spec:
  # Pre-bound to its PVC: without it a deleted-and-recreated PVC can be bound
  # by any Available PV of matching size.
  claimRef:
    namespace: downloads
    name: data
  capacity:
    storage: 100Ti  # Large value since NFS doesn't enforce quotas
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: pve-nas-01.${cluster_internal_domain}
    path: /media           # NFS export path (exposes /mnt/media mergerfs via bind mount)
  mountOptions:
    - nfsvers=4.2
    - hard
    - rsize=1048576
    - wsize=1048576
    - noatime
    # HAOS (.154) shares this export in plaintext via its own client line —
    # host_vars/pve-nas-01.yml + docs/24.
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: downloads
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 100Ti
  volumeName: downloads-data
