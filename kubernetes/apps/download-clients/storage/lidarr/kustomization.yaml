---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
components:
  - ../../_nfs-pv-arr
patches:
  - target:
      kind: PersistentVolume
      name: nfs-pv
    patch: |
      - op: replace
        path: /metadata/name
        value: downloads-appdata-lidarr
      - op: replace
        path: /metadata/labels/app
        value: lidarr
      - op: replace
        path: /spec/nfs/path
        value: /appdata/lidarr
  - target:
      kind: PersistentVolumeClaim
      name: nfs-pvc
    patch: |
      - op: replace
        path: /metadata/name
        value: lidarr-config
      - op: replace
        path: /spec/volumeName
        value: downloads-appdata-lidarr
