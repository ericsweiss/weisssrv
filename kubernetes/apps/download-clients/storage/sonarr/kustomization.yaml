---
# sonarr config storage: thin overlay over the ../../_nfs-pv-arr component
# (10Gi + actimeo/lookupcache defined once there).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
components:
  - ../../_nfs-pv-arr
patches:
  - target:
      kind: PersistentVolume
      name: nfs-pv
    patch: |
      - op: replace
        path: /metadata/name
        value: downloads-appdata-sonarr
      - op: replace
        path: /metadata/labels/app
        value: sonarr
      - op: replace
        path: /spec/nfs/path
        value: /appdata/sonarr
  - target:
      kind: PersistentVolumeClaim
      name: nfs-pvc
    patch: |
      - op: replace
        path: /metadata/name
        value: sonarr-config
      - op: replace
        path: /spec/volumeName
        value: downloads-appdata-sonarr
