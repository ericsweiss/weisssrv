---
# sonarr config storage (+ actimeo/lookupcache): thin overlay over the ../../_nfs-pv component.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
components:
  - ../../_nfs-pv
patches:
  - target:
      kind: PersistentVolume
      name: nfs-pv
    patch: |
      - op: replace
        path: /metadata/name
        value: downloads-appdata-sonarr
      - op: replace
        path: /metadata/labels/app
        value: sonarr
      - op: replace
        path: /spec/capacity/storage
        value: 10Gi
      - op: replace
        path: /spec/nfs/path
        value: /appdata/sonarr
      # *arr apps add NFS attribute caching ahead of xprtsec=tls (inserted at
      # indices 3/4 so the shared xprtsec option stays defined once in _nfs-pv).
      - op: add
        path: /spec/mountOptions/3
        value: actimeo=3
      - op: add
        path: /spec/mountOptions/4
        value: lookupcache=positive
  - target:
      kind: PersistentVolumeClaim
      name: nfs-pvc
    patch: |
      - op: replace
        path: /metadata/name
        value: sonarr-config
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
      - op: replace
        path: /spec/volumeName
        value: downloads-appdata-sonarr
