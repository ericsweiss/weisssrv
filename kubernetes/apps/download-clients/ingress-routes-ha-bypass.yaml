---
# Home Assistant bypass routes for download/media apps
# These routes have higher priority and bypass Authentik SSO for Home Assistant's IP
# Regular routes with SSO remain for browser access
#
# Apps that need bypasses (Home Assistant integrations):
#   - sonarr, radarr, lidarr, nzbget, qbittorrent
# Apps that do NOT need bypasses (no HA integration):
#   - prowlarr, pulsarr
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr-ha-bypass
  namespace: downloads
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`tv.${cluster_internal_domain}`) && ClientIP(`10.0.10.154/32`)
      kind: Rule
      priority: 100  # Higher priority than default SSO route
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: sonarr
          port: 8989
  tls:
    secretName: esweiss-com-tls
