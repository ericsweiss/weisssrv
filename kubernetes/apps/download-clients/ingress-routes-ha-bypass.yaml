---
# Higher-priority routes that bypass Authentik for Home Assistant's source IP
# (10.0.10.154), scoped to each app's API path so the web UIs stay behind SSO.
# docs/21 § Authentik SSO.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: downloads-ha-bypass
  namespace: downloads
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`tv.${cluster_internal_domain}`) && ClientIP(`10.0.10.154/32`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: sonarr
          port: 8989
    - match: Host(`movies.${cluster_internal_domain}`) && ClientIP(`10.0.10.154/32`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: radarr
          port: 7878
    - match: Host(`music.${cluster_internal_domain}`) && ClientIP(`10.0.10.154/32`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: lidarr
          port: 8686
    - match: Host(`qbittorrent.${cluster_internal_domain}`) && ClientIP(`10.0.10.154/32`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: qbittorrent
          port: 8080
    - match: Host(`nzbget.${cluster_internal_domain}`) && ClientIP(`10.0.10.154/32`) && PathPrefix(`/jsonrpc`)
      kind: Rule
      priority: 100
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: nzbget
          port: 6789
  tls:
    secretName: esweiss-com-tls
