---
# Shared *arr skeleton: the common Deployment + Service for sonarr, radarr and
# lidarr, under the placeholder name "arr" on port 8989. Each overlay lists this
# component and patches its own name, image, port and config claim. Not prowlarr.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - deployment.yaml
  - service.yaml
# Layout guard: a container or volume added ahead of these fails the kustomize
# build instead of letting an overlay patch the wrong object by index.
patches:
  - target:
      kind: Deployment
      name: arr
    patch: |
      - op: test
        path: /spec/template/spec/containers/0/name
        value: arr
      - op: test
        path: /spec/template/spec/volumes/0/name
        value: config
