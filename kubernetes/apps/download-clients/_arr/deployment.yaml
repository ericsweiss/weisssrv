---
# Shared skeleton Deployment for the *arr media-manager apps. The placeholder
# name/labels ("arr"), image, and port (8989) are overridden by each per-app
# overlay's patch (../sonarr, ../radarr, ../lidarr).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arr
  namespace: downloads
  labels:
    app.kubernetes.io/name: arr
    app.kubernetes.io/component: media-manager
    app.kubernetes.io/part-of: media-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arr
        app.kubernetes.io/component: media-manager
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: esweiss.com/nas
                    operator: DoesNotExist
      nodeSelector:
        esweiss.com/general: "true"
      # Pod hardening: these *arr apps do not talk to the kube-API. Only the
      # universally-safe subset is applied — this is a LinuxServer.io image
      # (s6 + PUID/PGID) that MUST start as root to drop privileges, so
      # runAsNonRoot / drop-ALL / aPE:false are deliberately NOT set (they
      # would break the s6 privilege drop).
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          - name: single-request-reopen
      containers:
        # Version managed in ansible/inventories/prod/group_vars/all.yml
        - name: arr
          image: lscr.io/linuxserver/arr:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "2000"
            - name: TZ
              value: America/Los_Angeles
            - name: UMASK
              value: "002"
          ports:
            - name: http
              containerPort: 8989
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: arr-config
        - name: data
          persistentVolumeClaim:
            claimName: data
