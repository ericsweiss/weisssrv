---
# Shared skeleton Deployment for the *arr media-manager apps. The placeholder
# name/labels ("arr"), image, and port (8989) are overridden by each per-app
# overlay's patch (../sonarr, ../radarr, ../lidarr).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arr
  namespace: downloads
  labels:
    app.kubernetes.io/name: arr
    app.kubernetes.io/component: media-manager
    app.kubernetes.io/part-of: media-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arr
        app.kubernetes.io/component: media-manager
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: ${cluster_node_label_domain}/nas
                    operator: DoesNotExist
      nodeSelector:
        ${cluster_node_label_domain}/general: "true"
      # Pod hardening is seccomp only: this is a LinuxServer.io image (s6 +
      # PUID/PGID) that MUST start as root to drop privileges, so runAsNonRoot /
      # drop-ALL / aPE:false would break the s6 privilege drop.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          # ClusterFirst pod on the DNAT'd kube-dns path - fresh socket for the
          # second parallel A/AAAA query avoids the ~5s conntrack DNAT race.
          - name: single-request-reopen
      containers:
        # Sentinel tag, NOT deployable: every overlay MUST `- op: replace` this
        # with its pinned lscr.io/linuxserver/<app>:version-${..._version} image.
        # Not `:latest`, so a missed patch ImagePullBackOffs loudly.
        - name: arr
          image: lscr.io/linuxserver/arr:OVERLAY-MUST-PIN
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "2000"
            - name: TZ
              value: ${cluster_timezone}
            - name: UMASK
              value: "002"
          ports:
            - name: http
              containerPort: 8989
              protocol: TCP
          # 5-minute liveness budget (30s x 10): a Refresh Series rescan over
          # NFS stalls /ping long enough that a shorter budget SIGKILLs a
          # healthy app mid-scan. Readiness drains it first, after ~100s.
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: arr-config
        - name: data
          persistentVolumeClaim:
            claimName: data
