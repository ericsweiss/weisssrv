---
# Downloads stack IngressRoutes
# All services use internal domain (esweiss.com) with Authentik SSO
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nzbget
  namespace: downloads
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nzbget.esweiss.com`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: authentik-auth
          namespace: authentik
        - name: hsts-header
          namespace: traefik
      services:
        - name: nzbget
          port: 6789
  tls:
    secretName: esweiss-com-tls
