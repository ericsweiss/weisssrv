---
# Shared static NFS PV+PVC pair — a Kustomize Component carrying the boilerplate
# every downloads config volume would otherwise copy-paste, xprtsec=tls
# included, so a new app cannot silently mount plaintext. Rationale for each
# field: resources.yaml.
#
# Each per-app overlay (../storage/<app>) lists this component and patches only
# the per-app differences (PV name/label/capacity/path, PVC name/size/volumeName)
# via in-place JSON6902 ops. The sonarr/radarr/lidarr overlays additionally
# INSERT actimeo/lookupcache ahead of xprtsec=tls, so xprtsec stays defined once
# here.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - resources.yaml
