---
# CRITICAL: shared static NFS PV+PVC pair for the downloads config volumes,
# defining xprtsec=tls once so no app mounts plaintext. Each ../storage/<app>
# overlay patches only its names, capacity and path via JSON6902 ops, and the
# arr overlays insert mount options AHEAD of xprtsec. Field notes: resources.yaml.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - resources.yaml
