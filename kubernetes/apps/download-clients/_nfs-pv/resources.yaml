---
# Static NFS PersistentVolume template; each per-app overlay replaces the
# name/label/capacity/path/claimRef. The shared boilerplate (force annotation,
# Retain, storageClassName "", server, TLS mountOptions) lives here once.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-pv
  annotations:
    # Lets Flux delete+recreate this PV if spec.nfs (server or path) changes —
    # the only immutable field here; Retain keeps the data. The PVC must be gone
    # first: a Bound PV blocks on the pv-protection finalizer.
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: nfs-pv
spec:
  # Pre-reserve the PV for its overlay's PVC (patched per app), so nothing else
  # can claim a storageClassName "" volume that happens to match.
  claimRef:
    namespace: downloads
    name: nfs-pvc
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    # Hostname, not IP: xprtsec=tls verifies the server cert (SAN *.esweiss.com).
    # The IP fails cert verification; pve-nas-01.esweiss.com resolves to .102 via
    # AdGuard and matches the wildcard. See docs/07 Transport Security.
    server: pve-nas-01.${cluster_internal_domain}
    path: /appdata/nfs-pv
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    # The /appdata k3s client lines require TLS (xprtsec=tls); plaintext is
    # rejected. tlshd runs on every agent (nfs_tls role). Defined ONCE here so a
    # new app can never accidentally omit it.
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-pvc
  namespace: downloads
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 1Gi
  volumeName: nfs-pv
