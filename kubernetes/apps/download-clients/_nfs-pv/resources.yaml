---
# Static NFS PersistentVolume template (placeholder name/label/capacity/path are
# replaced by each per-app overlay). The shared boilerplate — force annotation,
# Retain, storageClassName "", server: pve-nas-01.esweiss.com, and the
# nfsvers=4.2/hard/noatime/xprtsec=tls mountOptions — lives here exactly once.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-pv
  annotations:
    # Lets Flux delete+recreate this PV when an immutable field (server,
    # mountOptions) changes, instead of stalling the Kustomization. Retain
    # reclaim policy keeps the NFS data — data safe.
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: nfs-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    # Hostname, not IP: xprtsec=tls verifies the server cert (SAN *.esweiss.com).
    # The IP fails cert verification; pve-nas-01.esweiss.com resolves to .102 via
    # AdGuard and matches the wildcard. See docs/07 Transport Security.
    server: pve-nas-01.esweiss.com
    path: /appdata/nfs-pv
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    # The /appdata k3s client lines require TLS (xprtsec=tls); plaintext is
    # rejected. tlshd runs on every agent (nfs_tls role). Defined ONCE here so a
    # new app can never accidentally omit it.
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-pvc
  namespace: downloads
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 1Gi
  volumeName: nfs-pv
