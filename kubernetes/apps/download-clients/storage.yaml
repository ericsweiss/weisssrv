---
# NFS storage for downloads stack
# Unified /media mount enables hard linking between downloads and library
# NFS export: /media (bind from /mnt/media mergerfs)
# Pod mount: /media (via volumeMounts)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-downloads
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: downloads-data
  labels:
    type: nfs
    app: downloads
spec:
  capacity:
    storage: 100Ti  # Large value since NFS doesn't enforce quotas
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.0.102  # pve-nas-01
    path: /media           # NFS export path (exposes /mnt/media mergerfs via bind mount)
  mountOptions:
    - nfsvers=4.2
    - hard
    - intr
    - rsize=1048576
    - wsize=1048576
    - noatime

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: downloads
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 100Ti
  volumeName: downloads-data

---
# App config storage (SSD-backed)
# Each PV points directly to the app-specific subdirectory to avoid subPath issues with NFS.
# Subdirectories must be pre-created on the NAS with proper ownership (1000:2000).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: downloads-appdata-nzbget
  labels:
    type: nfs
    app: nzbget
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.0.102
    path: /appdata/nzbget
  mountOptions:
    - nfsvers=4.2
    - hard
    - intr
    - noatime

---
apiVersion: v1
