---
# NFS storage for downloads stack
# Unified /media mount enables hard linking between downloads and library
# NFS export: /media (bind from /mnt/media mergerfs)
# Pod mount: /media (via volumeMounts)
#
# All xprtsec=tls PVs below use server: pve-nas-01.esweiss.com (NOT the IP) so
# the TLS handshake matches the *.esweiss.com cert. server: is an immutable PV
# field — the live IP->hostname cutover deletes+recreates each PV (Retain →
# data safe) and rolls the consuming pod. See docs/16 cutover procedure.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: downloads-data
  labels:
    type: nfs
    app: downloads
spec:
  capacity:
    storage: 100Ti  # Large value since NFS doesn't enforce quotas
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    # Hostname, not IP: xprtsec=tls verifies the server cert, whose SAN is
    # *.esweiss.com. Mounting by 192.168.0.102 fails the handshake
    # ("Certificate owner unexpected"); pve-nas-01.esweiss.com resolves to
    # .102 via AdGuard and matches the wildcard. See docs/07 Transport Security.
    server: pve-nas-01.esweiss.com
    path: /media           # NFS export path (exposes /mnt/media mergerfs via bind mount)
  mountOptions:
    - nfsvers=4.2
    - hard
    - rsize=1048576
    - wsize=1048576
    - noatime
    # k3s mounts /export/media over TLS; the export is permissive (none:tls),
    # so HAOS (.154) shares it in plaintext via its own client line — see
    # host_vars/pve-nas-01.yml + docs/24.
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: downloads
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 100Ti
  volumeName: downloads-data

---
# App config storage (SSD-backed)
# Each PV points directly to the app-specific subdirectory to avoid subPath issues with NFS.
# Subdirectories must be pre-created on the NAS with proper ownership (1000:2000).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: downloads-appdata-nzbget
  labels:
    type: nfs
    app: nzbget
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    # Hostname required for xprtsec=tls (cert SAN is *.esweiss.com; IP fails
    # cert verification). See the downloads-data PV above + docs/07.
    server: pve-nas-01.esweiss.com
    path: /appdata/nzbget
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    # Encrypt the /appdata wire with tlshd (on every agent). The export is
    # permissive (none:tls), so TLS is client-driven via this option.
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nzbget-config
  namespace: downloads
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 10Gi
  volumeName: downloads-appdata-nzbget

