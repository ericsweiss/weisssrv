---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
components:
  - ../../_ingressroute
patches:
  - target:
      kind: IngressRoute
      name: app
    patch: |
      - op: replace
        path: /metadata/name
        value: prowlarr
      - op: replace
        path: /spec/routes/0/match
        value: Host(`prowlarr.${cluster_internal_domain}`)
      - op: replace
        path: /spec/routes/0/services/0/name
        value: prowlarr
      - op: replace
        path: /spec/routes/0/services/0/port
        value: 9696
