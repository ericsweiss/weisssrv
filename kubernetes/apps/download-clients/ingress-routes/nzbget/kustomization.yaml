---
# Unlike the other six overlays, nzbget swaps the shared authentik-auth
# middleware (skeleton index 1) for authentik-auth-basic: its proxy provider
# injects the NZBGet ControlUsername/ControlPassword as an Authorization header
# and only the -basic variant forwards it — the shared one strips every
# authResponseHeaders entry from the client request (apps/authentik/middleware.yaml),
# which would cost SSO users a second login.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
components:
  - ../../_ingressroute
patches:
  - target:
      kind: IngressRoute
      name: app
    patch: |
      - op: replace
        path: /metadata/name
        value: nzbget
      - op: replace
        path: /spec/routes/0/match
        value: Host(`nzbget.${cluster_internal_domain}`)
      # Guard the positional replace below (same rail the _vpn-sidecar overlays
      # use): index 1 is authentik-auth only as long as nobody prepends to the
      # shared chain. If someone adds e.g. a rate-limiter at the front, index 1
      # becomes lan-tailscale-only and this patch would silently swap the IP
      # allowlist for an auth middleware — leaving nzbget.esweiss.com reachable
      # from anywhere Traefik is, with `kustomize build` still exiting 0. The
      # test turns that into a loud build failure.
      - op: test
        path: /spec/routes/0/middlewares/1/name
        value: authentik-auth
      - op: replace
        path: /spec/routes/0/middlewares/1
        value:
          name: authentik-auth-basic
          namespace: authentik
      - op: replace
        path: /spec/routes/0/services/0/name
        value: nzbget
      - op: replace
        path: /spec/routes/0/services/0/port
        value: 6789
