---
# nzbget swaps the shared authentik-auth middleware for authentik-auth-basic.
# Its proxy provider injects NZBGet credentials as an Authorization header and
# only the -basic variant forwards it (apps/authentik/middleware.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
components:
  - ../../_ingressroute
patches:
  - target:
      kind: IngressRoute
      name: app
    patch: |
      - op: replace
        path: /metadata/name
        value: nzbget
      - op: replace
        path: /spec/routes/0/match
        value: Host(`nzbget.${cluster_internal_domain}`)
      # CRITICAL: guards the positional replace below. Index 1 is authentik-auth
      # only while nobody prepends to the shared chain; a prepend would make this
      # patch swap the IP allowlist for an auth middleware, exposing nzbget
      # wherever Traefik is, with `kustomize build` still exiting 0.
      - op: test
        path: /spec/routes/0/middlewares/1/name
        value: authentik-auth
      - op: replace
        path: /spec/routes/0/middlewares/1
        value:
          name: authentik-auth-basic
          namespace: authentik
      - op: replace
        path: /spec/routes/0/services/0/name
        value: nzbget
      - op: replace
        path: /spec/routes/0/services/0/port
        value: 6789
