---
# nzbget IngressRoute: thin overlay over the ../../_ingressroute component.
# Unlike the other six, nzbget swaps the shared authentik-auth middleware
# (skeleton index 1) for authentik-auth-basic: its proxy provider injects the
# NZBGet ControlUsername/ControlPassword as an Authorization header
# (terraform/authentik providers_proxy.tf), and only the -basic middleware
# variant forwards that header — the shared one would strip it (Traefik
# deletes every authResponseHeaders entry from the client request first; see
# kubernetes/apps/authentik/middleware.yaml). Result: SSO users pass straight
# through NZBGet's own basic-auth check — no double login. In-cluster API
# clients (Sonarr/Radarr/... -> nzbget:6789 via the Service) bypass Traefik
# entirely and keep sending their own credentials, unaffected.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
components:
  - ../../_ingressroute
patches:
  - target:
      kind: IngressRoute
      name: app
    patch: |
      - op: replace
        path: /metadata/name
        value: nzbget
      - op: replace
        path: /spec/routes/0/match
        value: Host(`nzbget.esweiss.com`)
      # Guard the positional replace below (same rail the _vpn-sidecar overlays
      # use): index 1 is authentik-auth only as long as nobody prepends to the
      # shared chain. If someone adds e.g. a rate-limiter at the front, index 1
      # becomes lan-tailscale-only and this patch would silently swap the IP
      # allowlist for an auth middleware — leaving nzbget.esweiss.com reachable
      # from anywhere Traefik is, with `kustomize build` still exiting 0. The
      # test turns that into a loud build failure.
      - op: test
        path: /spec/routes/0/middlewares/1/name
        value: authentik-auth
      - op: replace
        path: /spec/routes/0/middlewares/1
        value:
          name: authentik-auth-basic
          namespace: authentik
      - op: replace
        path: /spec/routes/0/services/0/name
        value: nzbget
      - op: replace
        path: /spec/routes/0/services/0/port
        value: 6789
