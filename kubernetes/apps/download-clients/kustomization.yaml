---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
resources:
  - namespace.yaml
  - storage.yaml
  - certificate.yaml
  # NOTE: VPN credentials secret is created by 'task downloads:deploy' before
  # kustomize apply. Do NOT add vpn-common.yaml here - it contains placeholders
  # that would overwrite the real credentials from 1Password.
  # Download clients with optional VPN sidecars
  - nzbget.yaml
  - qbittorrent.yaml
  # Media management apps (*arr stack)
  - prowlarr.yaml
  - sonarr.yaml
  - radarr.yaml
  - lidarr.yaml
  - pulsarr.yaml
  # Ingress routes
  - ingress-routes.yaml
# Use 'labels' instead of 'commonLabels' to avoid modifying deployment selectors.
# commonLabels injects labels into spec.selector.matchLabels, which is immutable
# after deployment creation, causing idempotency issues on re-deploy.
labels:
  - pairs:
      app.kubernetes.io/part-of: media-stack
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
