---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
resources:
  - namespace.yaml
  # ESO ExternalSecrets (onepassword-homelab ClusterSecretStore): vpn-credentials
  # (provider OpenVPN creds, mounted at /vpn-secrets) + gluetun-control-auth
  # (control-server roles config.toml + exporter apikey). See externalsecret.yaml.
  - externalsecret.yaml
  # Storage: shared media volume + per-app config PV/PVC pairs generated from the
  # _nfs-pv Kustomize component (TLS mountOptions defined once there).
  - storage
  - certificate.yaml
  # Download clients with optional VPN sidecars. nzbget/qbittorrent share the
  # Gluetun killswitch sidecar via the _vpn-sidecar Kustomize component; each is
  # a thin per-app overlay (resources + component + a small per-app patch).
  - nzbget
  - qbittorrent
  # The *arr stack. sonarr/radarr/lidarr share the _arr component skeleton and
  # are thin per-app overlays. Prowlarr differs enough to stay standalone.
  - prowlarr.yaml
  - sonarr
  - radarr
  - lidarr
  - pulsarr.yaml
  # Ingress routes. The seven client routes share one middleware chain + TLS
  # secret via the _ingressroute Kustomize component; each is a thin per-app
  # overlay under ingress-routes/ (name/host/service/port only).
  - ingress-routes
  - ingress-routes-ha-bypass.yaml
  # Default-deny plus a per-app egress allowlist. The local default-deny covers
  # Ingress and Egress, so it supersedes the netpol-baseline component.
  - networkpolicy.yaml
  - vpa.yaml

# kube-dns egress for the whole namespace. netpol-baseline is absent because
# networkpolicy.yaml's local default-deny already covers ingress and egress.
components:
  - ../../components/netpol-egress-dns
# Use 'labels' instead of 'commonLabels' to avoid modifying deployment selectors.
# commonLabels injects labels into spec.selector.matchLabels, which is immutable
# after deployment creation, causing idempotency issues on re-deploy.
labels:
  - pairs:
      app.kubernetes.io/part-of: media-stack
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
