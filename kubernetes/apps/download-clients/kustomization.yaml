---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
resources:
  - namespace.yaml
  # VPN credentials secret is managed by External Secrets Operator (ESO) from
  # 1Password "PrivadoVPN Credentials" via the onepassword-homelab
  # ClusterSecretStore. See externalsecret.yaml.
  - externalsecret.yaml
  - storage.yaml
  - certificate.yaml
  # Download clients with optional VPN sidecars
  - nzbget.yaml
  - qbittorrent.yaml
  # Media management apps (*arr stack)
  - prowlarr.yaml
  - sonarr.yaml
  - radarr.yaml
  - lidarr.yaml
  - pulsarr.yaml
  # Ingress routes
  - ingress-routes.yaml
  - ingress-routes-ha-bypass.yaml
  # NetworkPolicies: default-deny + per-app egress allowlist (Gluetun-fronted
  # qb/nzbget excluded from RFC1918, *arr direct internet for media APIs).
  - networkpolicy.yaml
  - vpa.yaml
# Use 'labels' instead of 'commonLabels' to avoid modifying deployment selectors.
# commonLabels injects labels into spec.selector.matchLabels, which is immutable
# after deployment creation, causing idempotency issues on re-deploy.
labels:
  - pairs:
      app.kubernetes.io/part-of: media-stack
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
