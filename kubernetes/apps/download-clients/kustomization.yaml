---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
resources:
  - namespace.yaml
  # VPN credentials secret is managed by External Secrets Operator (ESO) from
  # 1Password "PrivadoVPN Credentials" via the onepassword-homelab
  # ClusterSecretStore. See externalsecret.yaml.
  - externalsecret.yaml
  # Storage: shared media volume + per-app config PV/PVC pairs generated from the
  # _nfs-pv Kustomize component (TLS mountOptions defined once there).
  - storage
  - certificate.yaml
  # Download clients with optional VPN sidecars. nzbget/qbittorrent share the
  # Gluetun killswitch sidecar via the _vpn-sidecar Kustomize component; each is
  # a thin per-app overlay (resources + component + a small per-app patch).
  - nzbget
  - qbittorrent
  # Media management apps (*arr stack)
  # sonarr/radarr/lidarr are near-identical; their shared Deployment+Service
  # skeleton lives in the _arr Kustomize component and each app is a thin
  # per-app overlay (name/labels, image, port, claimName). Prowlarr differs
  # (probe timings, resources, no /media mount) and stays a standalone manifest.
  - prowlarr.yaml
  - sonarr
  - radarr
  - lidarr
  - pulsarr.yaml
  # Ingress routes. The seven client routes share one middleware chain + TLS
  # secret via the _ingressroute Kustomize component; each is a thin per-app
  # overlay under ingress-routes/ (name/host/service/port only).
  - ingress-routes
  - ingress-routes-ha-bypass.yaml
  # NetworkPolicies: default-deny + per-app egress allowlist (Gluetun-fronted
  # qb/nzbget excluded from RFC1918, *arr direct internet for media APIs).
  - networkpolicy.yaml
  - vpa.yaml
# Use 'labels' instead of 'commonLabels' to avoid modifying deployment selectors.
# commonLabels injects labels into spec.selector.matchLabels, which is immutable
# after deployment creation, causing idempotency issues on re-deploy.
labels:
  - pairs:
      app.kubernetes.io/part-of: media-stack
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
