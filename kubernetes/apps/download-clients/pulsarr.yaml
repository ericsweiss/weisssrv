---
# Pulsarr - Plex Watchlist automation
# URL: pulsarr.esweiss.com
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsarr
  namespace: downloads
  labels:
    app.kubernetes.io/name: pulsarr
    app.kubernetes.io/component: automation
    app.kubernetes.io/part-of: media-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pulsarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulsarr
        app.kubernetes.io/component: automation
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: esweiss.com/nas
                    operator: DoesNotExist
      nodeSelector:
        esweiss.com/general: "true"
      securityContext:
        runAsUser: 1000
        runAsGroup: 2000
        fsGroup: 2000
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          - name: single-request-reopen
      containers:
        # Version managed in ansible/inventories/prod/group_vars/all.yml
        - name: pulsarr
          image: lakker/pulsarr:${PULSARR_VERSION}
          imagePullPolicy: Always
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "2000"
            - name: TZ
              value: America/Los_Angeles
            - name: baseUrl
              value: "http://pulsarr.downloads.svc.cluster.local:3003"
            - name: port
              value: "3003"
          ports:
            - name: http
              containerPort: 3003
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: pulsarr-config

---
apiVersion: v1
kind: Service
metadata:
  name: pulsarr
  namespace: downloads
  labels:
    app.kubernetes.io/name: pulsarr
spec:
  selector:
    app.kubernetes.io/name: pulsarr
  ports:
    - name: http
      port: 3003
      targetPort: http
  type: ClusterIP
