---
# Pulsarr - Plex Watchlist automation
# URL: pulsarr.esweiss.com
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsarr
  namespace: downloads
  labels:
    app.kubernetes.io/name: pulsarr
    app.kubernetes.io/component: automation
    app.kubernetes.io/part-of: media-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pulsarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulsarr
        app.kubernetes.io/component: automation
    spec:
      # Pin to NAS nodes - REQUIRED: Pulsarr uses the Bun runtime (v0.10.0+)
      # which requires AVX CPU instructions. Only pve-nas-01 (12th Gen Intel)
      # has AVX support. pve-opt-03 (Core 2 Quad Q9650) does NOT have AVX.
      # Do NOT move this workload to non-NAS nodes without verifying AVX support.
      nodeSelector:
        esweiss.com/nas: "true"
      tolerations:
        - key: esweiss.com/nas
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
      # Pod hardening: Pulsarr does not talk to the kube-API. Existing runAs*/
      # fsGroup (the app already runs non-root) are preserved; add the runtime
      # default seccomp profile and drop the SA token mount. Container-level
      # drop-ALL / aPE:false are NOT added because the image still relies on
      # PUID/PGID env handling at startup.
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          # ClusterFirst pod on the DNAT'd kube-dns path — fresh socket for the
          # second parallel A/AAAA query avoids the ~5s conntrack DNAT race.
          - name: single-request-reopen
      containers:
        # Version managed in ansible/inventories/prod/group_vars/all.yml
        - name: pulsarr
          image: lakker/pulsarr:${pulsarr_version}
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "2000"
            - name: TZ
              value: America/Los_Angeles
            - name: baseUrl
              value: "http://pulsarr.downloads.svc.cluster.local:3003"
            - name: port
              value: "3003"
          ports:
            - name: http
              containerPort: 3003
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              # Floor raised (384Mi->512Mi req, 768Mi->1Gi limit): pulsarr's
              # working set outgrew the old limit, so on a VPA-admission-down
              # cold start the manifest limit must not sit below the real need.
              memory: 512Mi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              # Pulsarr's `/` is a 302 redirect to /login; Fastify's /health
              # endpoint returns 200 and is the correct probe target.
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /app/data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: pulsarr-config

---
apiVersion: v1
kind: Service
metadata:
  name: pulsarr
  namespace: downloads
  labels:
    app.kubernetes.io/name: pulsarr
spec:
  selector:
    app.kubernetes.io/name: pulsarr
  ports:
    - name: http
      port: 3003
      targetPort: http
  type: ClusterIP
