---
# Pulsarr - Plex Watchlist automation
# URL: pulsarr.esweiss.com
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsarr
  namespace: downloads
  labels:
    app.kubernetes.io/name: pulsarr
    app.kubernetes.io/component: automation
    app.kubernetes.io/part-of: media-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pulsarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulsarr
        app.kubernetes.io/component: automation
    spec:
      # AVX is REQUIRED: Pulsarr's Bun runtime SIGILLs on the Core 2 Quad opt
      # agents, so esweiss.com/cpu=modern is load-bearing (docs/33) and must
      # survive any selector change.
      nodeSelector:
        esweiss.com/general: "true"
        esweiss.com/cpu: "modern"
      # Pulsarr does not talk to the kube-API, so the SA token is dropped.
      # Container-level drop-ALL / allowPrivilegeEscalation:false are omitted:
      # the image still needs PUID/PGID handling at startup.
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          # ClusterFirst pod on the DNAT'd kube-dns path — fresh socket for the
          # second parallel A/AAAA query avoids the ~5s conntrack DNAT race.
          - name: single-request-reopen
      containers:
        - name: pulsarr
          image: lakker/pulsarr:${pulsarr_version}
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "2000"
            - name: TZ
              value: America/Los_Angeles
            - name: baseUrl
              value: "http://pulsarr.downloads.svc.cluster.local:3003"
            - name: port
              value: "3003"
            # SSO-only, matching the *arr apps' "Authentication: External": the
            # sole path to :3003 is Traefik (NetworkPolicy) through the
            # authentik-auth middleware + media-admins binding. This env value
            # overrides the stored DB config on every boot, so the UI cannot
            # re-enable native login; set it back to `required` to restore it.
            # docs/21 §Authentik SSO Integration.
            - name: authenticationMethod
              value: disabled
          ports:
            - name: http
              containerPort: 3003
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              # Manifest floor must stay above the real working set: it is what
              # a cold start gets when VPA admission is unavailable.
              memory: 512Mi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              # Pulsarr's `/` is a 302 redirect to /login; Fastify's /health
              # endpoint returns 200 and is the correct probe target.
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /app/data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: pulsarr-config

---
apiVersion: v1
kind: Service
metadata:
  name: pulsarr
  namespace: downloads
  labels:
    app.kubernetes.io/name: pulsarr
spec:
  selector:
    app.kubernetes.io/name: pulsarr
  ports:
    - name: http
      port: 3003
      targetPort: http
  type: ClusterIP
