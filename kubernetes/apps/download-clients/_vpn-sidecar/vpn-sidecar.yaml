---
# Strategic-merge patch body for the _vpn-sidecar component. metadata.name and
# `placeholder-vpn-config` are placeholders: `patches[].target` selects the
# Deployment, and each overlay repoints the ConfigMap name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpn-sidecar
spec:
  template:
    spec:
      # Pod-level DNS, used when gluetun is disabled or crashed; with the VPN up
      # gluetun's own DNS_ADDRESS wins. Either way DNS leaves via eth0 and
      # upstream privacy comes from Unbound's DoT.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.0.10.150
          - 10.0.10.160
        options:
          - name: ndots
            value: "1"
      # Fails the pod early if VPN is enabled without a usable TUN device.
      initContainers:
        - name: check-vpn-config
          image: busybox:${busybox_version}
          command:
            - sh
            - -c
            - |
              VPN_ENABLED=$(cat /config/vpn_enabled)
              echo "VPN enabled: $VPN_ENABLED"
              if [ "$VPN_ENABLED" = "true" ]; then
                echo "VPN mode - checking TUN device..."
                if [ ! -c /dev/net/tun ]; then
                  echo "ERROR: TUN device not available but VPN is enabled!"
                  exit 1
                fi
                echo "TUN device available"
              else
                echo "Direct mode - skipping TUN check"
              fi
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
          volumeMounts:
            - name: vpn-config
              mountPath: /config
            - name: tun
              mountPath: /dev/net/tun
      containers:
        # Gluetun VPN sidecar. With the VPN disabled it execs `sleep infinity`
        # so the pod stays healthy and traffic bypasses the tunnel.
        - name: gluetun
          image: qmcgaw/gluetun:${gluetun_version}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            # NOTE: no `set -x` and never echo a credential — this wrapper runs
            # in the gluetun sidecar for BOTH nzbget and qbittorrent and its
            # stdout goes to the pod log. It only prints the provider NAME.
            - |
              VPN_ENABLED=$(cat /gluetun/vpn_enabled)
              if [ "$VPN_ENABLED" != "true" ]; then
                echo "VPN disabled - sleeping indefinitely"
                # Sleep but stay alive so the pod does not restart. This exec
                # runs BEFORE any provider/credential logic below, so the
                # VPN-disabled path never reaches it.
                exec sleep infinity
              fi
              # Credential FILES for the provider selected in the vpn-config
              # ConfigMap; *_SECRETFILE keeps secrets out of the container env.
              # Per-provider file sets: README § Provider Switching.
              VPN_PROVIDER=$(cat /gluetun/vpn_provider 2>/dev/null || echo "")
              case "$VPN_PROVIDER" in
                privado)
                  export OPENVPN_USER_SECRETFILE=/vpn-secrets/privadovpn-user
                  export OPENVPN_PASSWORD_SECRETFILE=/vpn-secrets/privadovpn-password
                  ;;
                *)
                  echo "ERROR: unsupported vpn_provider '$VPN_PROVIDER'" >&2
                  echo "       expected 'privado'" >&2
                  exit 1
                  ;;
              esac
              echo "VPN enabled - starting Gluetun (provider: $VPN_PROVIDER)"
              exec /gluetun-entrypoint
          # NET_ADMIN for the tun device and routing. The default capability set
          # is kept rather than drop:[ALL]: dropping CHOWN/DAC_OVERRIDE
          # crashloops gluetun, and the killswitch then blocks all client egress.
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          # env[0]=VPN_SERVICE_PROVIDER and env[1]=SERVER_COUNTRIES are the two
          # per-app configMapKeyRef entries the overlays repoint at their own
          # ConfigMap - keep them first so the overlay index guards stay simple.
          env:
            - name: VPN_SERVICE_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: placeholder-vpn-config
                  key: vpn_provider
            - name: SERVER_COUNTRIES
              valueFrom:
                configMapKeyRef:
                  name: placeholder-vpn-config
                  key: server_countries
                  optional: true
            # Killswitch escape hatch: pod/service CIDRs (Traefik ingress,
            # kubelet probes, exporter scrapes) plus the two DNS resolvers.
            # Everything else non-tunnel is dropped by gluetun's own firewall.
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "${cluster_pod_cidr},${cluster_service_cidr},10.0.10.150/32,10.0.10.160/32"
            # Health and control servers bind loopback only; every consumer
            # shares this pod's network namespace. The control API is
            # role-authenticated via the config.toml below.
            - name: HEALTH_SERVER_ADDRESS
              value: "127.0.0.1:8000"
            - name: HEALTH_VPN_DURATION_INITIAL
              value: "30s"
            - name: HTTP_CONTROL_SERVER_ADDRESS
              value: "127.0.0.1:8001"
            # NOT the default /gluetun/auth/config.toml: /gluetun is the
            # read-only vpn-config mount, so no nested mount can be created under
            # it. See the gluetun-auth volume below.
            - name: HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH
              value: "/gluetun-auth/config.toml"
            - name: DNS_ADDRESS
              # Single address only — gluetun rejects a comma-separated list, so
              # with the VPN up this is a single-resolver dependency on dns-01
              # (docs/21). Queries leave via eth0, outside the tunnel.
              value: "10.0.10.150"
            - name: TZ
              value: ${cluster_timezone}
            - name: LOG_LEVEL
              value: info
          ports:
            # Informational only — the health server binds 127.0.0.1, so this
            # port is never reachable on the pod IP. Overlays append the
            # app-facing ports to this list.
            - name: health
              containerPort: 8000
              protocol: TCP
          # Probes short-circuit to success when the VPN is disabled — gluetun
          # sleeps in that mode and has no health server.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  VPN_ENABLED=$(cat /gluetun/vpn_enabled)
                  if [ "$VPN_ENABLED" != "true" ]; then
                    exit 0
                  fi
                  wget -q -O /dev/null http://127.0.0.1:8000/ || exit 1
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  VPN_ENABLED=$(cat /gluetun/vpn_enabled)
                  if [ "$VPN_ENABLED" != "true" ]; then
                    exit 0
                  fi
                  wget -q -O /dev/null http://127.0.0.1:8000/ || exit 1
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: vpn-config
              mountPath: /gluetun
            # Control-server auth roles (config.toml with the exporter's apikey).
            # Rendered by ESO; read-only. Only the config.toml key is projected.
            - name: gluetun-auth
              mountPath: /gluetun-auth
              readOnly: true
            # VPN provider credentials as files: the command wrapper exports the
            # matching OPENVPN_*_SECRETFILE paths here. Never env, so credentials
            # stay out of `kubectl describe pod`.
            - name: vpn-secrets
              mountPath: /vpn-secrets
              readOnly: true
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: vpn-config
          configMap:
            name: placeholder-vpn-config
        # config.toml rendered by ESO (ExternalSecret gluetun-control-auth).
        # optional: a missing Secret leaves the loopback-only control server
        # unauthenticated, which beats wedging a fresh cluster on first boot.
        - name: gluetun-auth
          secret:
            secretName: gluetun-control-auth
            optional: true
            items:
              - key: config.toml
                path: config.toml
        # Provider credential files (vpn-credentials Secret). The wired
        # provider set is defined in ../externalsecret.yaml.
        - name: vpn-secrets
          secret:
            secretName: vpn-credentials
