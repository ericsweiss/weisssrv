---
# Shared Gluetun VPN sidecar Component: the `gluetun` container (command
# wrapper, NET_ADMIN, FIREWALL_OUTBOUND_SUBNETS, probes, resources, mounts), the
# `check-vpn-config` initContainer, the tun/vpn-config volumes and the pod
# dnsPolicy/dnsConfig — the killswitch semantics defined exactly once.
#
# Applied as a strategic-merge patch, so the sidecar/initContainer/volumes are
# PREPENDED ahead of the app's own containers. Each consumer (../nzbget,
# ../qbittorrent) patches only the per-app ConfigMap name and the extra ports it
# exposes through the shared netns.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
    path: vpn-sidecar.yaml
