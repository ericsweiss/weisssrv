---
# CRITICAL: shared Gluetun sidecar, initContainer, volumes and pod DNS — the
# VPN killswitch defined once. Merged as a strategic patch ahead of the app's
# own containers; consumers patch only their ConfigMap name and extra ports.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
    path: vpn-sidecar.yaml
