---
# GitLab Runner leaked-pod + leaked-credentials-secret reaper. The program is
# gitlab-runner-reaper.py in this directory, mounted from the configMapGenerator
# in kustomization.yaml; unit tests in scripts/. What leaks, the guard-by-guard
# reasoning and the RBAC trade-off: docs/13-ci-cd.md § Runner garbage collection.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitlab-runner-reaper
  namespace: gitlab-runner-reaper
spec:
  schedule: "*/15 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # Never overlap reaper runs.
  jobTemplate:
    spec:
      # Hard ceiling for the WHOLE Job, retries included — not per attempt. It
      # therefore has to hold backoffLimit+1 = 3 attempts of the script's soft
      # BUDGET_SECONDS (90s) plus one API_TIMEOUT_SECONDS (10s) overrun and pod
      # startup each: 3 * ~110s. At the old 120s the first attempt consumed the
      # entire budget and backoffLimit 2 was dead letter. Still well under the
      # */15 schedule, and concurrencyPolicy: Forbid covers the rest.
      activeDeadlineSeconds: 360
      # Delete the reaper's OWN finished Job pods after 1h so the reaper does not
      # itself leak pods.
      ttlSecondsAfterFinished: 3600
      # Retry on a transient API blip; a persistent failure (e.g. broken RBAC)
      # exhausts this and surfaces as a failed Job (script exits non-zero on any
      # non-race list/delete error).
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          # Unlike cloudflare-ddns, this app DOES call the API — mount the token.
          automountServiceAccountToken: true
          serviceAccountName: gitlab-runner-reaper
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reaper
              # Reuse the SAME trusted, digest-pinned image cloudflare-ddns runs.
              # NOT rancher/kubectl: that image is busybox/Alpine and its
              # `date -d <RFC3339>` cannot parse the timestamps, which would make
              # the reaper a silent no-op. python:3.14-slim has reliable date math
              # (datetime.fromisoformat), is already vetted in this repo, and needs
              # no new image or version-pin to maintain. Digest-pinned because this
              # is a pod-DELETING workload.
              image: python:3.14-slim@sha256:b877e50bd90de10af8d82c57a022fc2e0dc731c5320d762a27986facfc3355c1
              command:
                - python3
                - /opt/reaper/gitlab-runner-reaper.py
              env:
                - name: NAMESPACES
                  value: "gitlab-runner-privileged gitlab-runner"
                - name: MAX_AGE_MINUTES
                  value: "30"
                - name: MAX_SECRET_AGE_MINUTES
                  value: "180"
                # One namespace-rotation slot per run, so it must equal the
                # schedule period above (*/15 = 900s); the unit test parses both
                # out of this file and asserts they match.
                - name: ROTATE_PERIOD_SECONDS
                  value: "900"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: script
                  mountPath: /opt/reaper
                  readOnly: true
          volumes:
            - name: script
              configMap:
                # kustomize rewrites this to the hashed generator name, so a
                # script edit rolls a new ConfigMap instead of mutating in place.
                name: gitlab-runner-reaper-script
                defaultMode: 0555
