---
# NetworkPolicies for the gitlab-runner-reaper namespace. The reaper is a
# single-purpose CronJob that only talks to the kube-API (lists/deletes leaked
# job pods in the two runner namespaces); nothing serves traffic, so ingress is
# denied outright.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: gitlab-runner-reaper
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Reaper egress: kube-dns (to resolve kubernetes.default.svc) and the
# kube-apiserver. kube-proxy DNATs the in-cluster VIP (10.43.0.1:443) to the
# real endpoints BEFORE NetworkPolicy evaluation, so allowlist the server node
# IPs on 6443 — a 10.43.0.1/32 rule never matches the post-DNAT packet (same
# pattern as gitlab-runner managers-egress). podSelector {} is safe: this
# namespace holds only the reaper. This egress policy is itself the default-deny
# (only the rules below are permitted).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reaper-egress
  namespace: gitlab-runner-reaper
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 192.168.0.222/32
        - ipBlock:
            cidr: 192.168.0.223/32
        - ipBlock:
            cidr: 192.168.0.227/32
      ports:
        - protocol: TCP
          port: 6443
