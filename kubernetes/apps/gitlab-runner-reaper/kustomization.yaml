---
# NOTE: deliberately NO top-level `namespace:` directive. kustomize's namespace
# transformer OVERRIDES each resource's explicit metadata.namespace, which would
# force the two RoleBindings out of the runner namespaces into
# gitlab-runner-reaper and silently break the cross-namespace grant. Each
# resource here carries its own explicit namespace (ServiceAccount + CronJob ->
# gitlab-runner-reaper; the two RoleBindings -> gitlab-runner-privileged /
# gitlab-runner; the ClusterRole + Namespace are cluster-scoped).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - cronjob.yaml

# The reaper is a single-purpose CronJob that only talks to the kube-API (it
# lists/deletes leaked job pods in the two runner namespaces), so kube-dns +
# apiserver is its whole egress and the two components ARE its default-deny-egress.
# Nothing serves traffic, hence the baseline ingress deny.
components:
  - ../../components/netpol-baseline
  - ../../components/netpol-egress-dns
  - ../../components/netpol-egress-apiserver
patches:
  # This kustomization deliberately sets no top-level namespace (its
  # RoleBindings target other namespaces), so namespace the component-shipped
  # policies here instead of via a namespace transformer. `name` is a regex.
  - target:
      kind: NetworkPolicy
      name: (default-deny-ingress|allow-egress-dns|allow-egress-apiserver)
    patch: |
      - op: add
        path: /metadata/namespace
        value: gitlab-runner-reaper
