---
# CRITICAL: no top-level `namespace:` directive. Its transformer overrides each
# resource's explicit metadata.namespace, pulling the two RoleBindings out of
# the runner namespaces and silently breaking the cross-namespace grant.
# Every resource here carries its own namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - cronjob.yaml

# The CronJob only talks to the kube-API, so kube-dns + apiserver is its whole
# egress. Nothing serves traffic, hence the baseline ingress deny.
components:
  - ../../components/netpol-baseline
  - ../../components/netpol-egress-dns
  - ../../components/netpol-egress-apiserver
# The CronJob's program. It lives beside this kustomization because kustomize
# refuses generator sources outside the kustomization root; its unit tests are
# scripts/test_gitlab_runner_reaper.py.
configMapGenerator:
  - name: gitlab-runner-reaper-script
    namespace: gitlab-runner-reaper
    files:
      - gitlab-runner-reaper.py

patches:
  # With no top-level namespace transformer, the component-shipped policies are
  # namespaced here instead. `name` is a regex.
  - target:
      kind: NetworkPolicy
      name: (default-deny-ingress|allow-egress-dns|allow-egress-apiserver)
    patch: |
      - op: add
        path: /metadata/namespace
        value: gitlab-runner-reaper
