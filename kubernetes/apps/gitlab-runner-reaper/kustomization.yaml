---
# NOTE: deliberately NO top-level `namespace:` directive. kustomize's namespace
# transformer OVERRIDES each resource's explicit metadata.namespace, which would
# force the two RoleBindings out of the runner namespaces into
# gitlab-runner-reaper and silently break the cross-namespace grant. Each
# resource here carries its own explicit namespace (ServiceAccount + CronJob ->
# gitlab-runner-reaper; the two RoleBindings -> gitlab-runner-privileged /
# gitlab-runner; the ClusterRole + Namespace are cluster-scoped).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - rbac.yaml
  - cronjob.yaml

# default-deny-ingress from the shared baseline component (see
# kubernetes/components/netpol-baseline).
components:
  - ../../components/netpol-baseline
patches:
  # This kustomization deliberately sets no top-level namespace (its
  # RoleBindings target other namespaces), so namespace the shared
  # default-deny-ingress here instead of via a namespace transformer.
  - target:
      kind: NetworkPolicy
      name: default-deny-ingress
    patch: |
      - op: add
        path: /metadata/namespace
        value: gitlab-runner-reaper
