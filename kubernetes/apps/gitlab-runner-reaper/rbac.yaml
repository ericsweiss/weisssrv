---
# Least-privilege reaper RBAC: one SA, one ClusterRole (pods + dockercfg
# secrets, list/delete only), two namespaced RoleBindings so delete is confined
# to the two runner namespaces. docs/13-ci-cd.md § Runner garbage collection.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner-reaper
  namespace: gitlab-runner-reaper
  labels:
    app.kubernetes.io/managed-by: flux
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitlab-runner-reaper
  labels:
    app.kubernetes.io/managed-by: flux
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "delete"]
---
# Scopes the ClusterRole's pods/secrets:list/delete to ONLY gitlab-runner-privileged.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-reaper
  namespace: gitlab-runner-privileged
  labels:
    app.kubernetes.io/managed-by: flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitlab-runner-reaper
subjects:
  - kind: ServiceAccount
    name: gitlab-runner-reaper
    namespace: gitlab-runner-reaper
---
# Scopes the same ClusterRole to ONLY the shared gitlab-runner namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-reaper
  namespace: gitlab-runner
  labels:
    app.kubernetes.io/managed-by: flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitlab-runner-reaper
subjects:
  - kind: ServiceAccount
    name: gitlab-runner-reaper
    namespace: gitlab-runner-reaper
