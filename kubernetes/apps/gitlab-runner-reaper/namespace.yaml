---
# Dedicated namespace for the GitLab Runner leaked-pod reaper CronJob, which
# spans both the gitlab-runner-privileged and gitlab-runner namespaces.
# The reaper pod satisfies PSA restricted.
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-runner-reaper
  labels:
    app.kubernetes.io/name: gitlab-runner-reaper
    app.kubernetes.io/managed-by: flux
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
