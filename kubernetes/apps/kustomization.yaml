---
# Apps top-level Kustomization. Each app lives in its own folder holding its
# complete resource set. Every folder carries a README except the four
# gitlab-* ones, which are documented by docs/13-ci-cd.md (runners, agent) and
# docs/27-gitlab-deployment.md (the GitLab instance itself).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - authentik
  - download-clients
  - hermes
  - homarr
  - hindsight
  - recipes
  - gitlab-runner
  - gitlab-runner-privileged
  - gitlab-runner-reaper
  - gitlab-agent
  - registry-cache
  - tailnet-dns
  - vm-ingress
  - wg-easy
