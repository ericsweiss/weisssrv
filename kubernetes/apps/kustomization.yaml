---
# Apps top-level Kustomization. Each app lives in its own folder holding its
# complete resource set and a README. Removing a line makes Flux prune that
# module and its namespace — the documented way to disable one (README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - authentik
  - ci-cache
  - download-clients
  - gitlab-agent
  - gitlab-runner
  - gitlab-runner-privileged
  - gitlab-runner-reaper
  - hermes
  - hindsight
  - hindsight-reaper
  - homarr
  - recipes
  - registry-cache
  - tailnet-dns
  - uptime-kuma
  - vm-ingress
  - wg-easy
