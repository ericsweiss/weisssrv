---
# Hindsight (vectorize-io) — long-term agent memory for Hermes (docs/37
# §Memory backend). One pod, two containers, mirroring upstream's
# docker/docker-compose/local-llm/ example:
#   * hindsight — the published standalone image (API :8888 + control-plane UI
#     :9999) with its embedded pg0 PostgreSQL on the NFS volume. Memory
#     extraction/synthesis needs an LLM; the published image DELIBERATELY
#     omits llama-cpp-python (upstream docs: HINDSIGHT_API_LLM_PROVIDER=llamacpp
#     fails with ModuleNotFoundError on this image), so upstream's recommended
#     fully-local shape is…
#   * llama — the official llama.cpp server image as an OpenAI-compatible
#     sidecar; hindsight points its `openai` provider at it over pod-localhost.
#     Fully local: no LLM API key, no per-turn spend (auto-retain runs every
#     conversation turn), and both images are used unmodified.
# strategy: Recreate — the single RWO NFS volume holds a live PostgreSQL data
# dir and must never be dual-mounted across a rolling update.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight
  namespace: hindsight
  labels:
    app.kubernetes.io/name: hindsight
    app.kubernetes.io/part-of: hindsight
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hindsight
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hindsight
        app.kubernetes.io/part-of: hindsight
    spec:
      # HOME: k3s-agt-prec-01 — hostname-pinned. This is a heavy, RAM-hungry
      # local-inference workload (llama.cpp AVX2 sidecar + in-process torch
      # embeddings); its ~5Gi request only fits where the RAM was provisioned
      # for it (the prec agent VM was raised 12->18G in hosts.yml specifically
      # for this). The other modern agents run at ~85% and the NAS agent is
      # kept clear of extra compute, so a hard pin is honest — a single-replica
      # RWO/Recreate app lives on exactly one node anyway. If prec-01 is down,
      # Hindsight is down and Hermes degrades to its built-in memory (which
      # always runs alongside), an acceptable failure mode for a memory
      # backend. Rehome = edit this hostname + move/grow the RAM.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s-agt-prec-01
      nodeSelector:
        esweiss.com/general: "true"
        esweiss.com/cpu: "modern"
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          # Kept in sync with the hermes/mealie/*arr deployments: force a fresh
          # socket for glibc's parallel A/AAAA queries so the conntrack
          # DNAT-insert race can't cost a ~5s resolver stall (matters for the
          # llama container's one-time HuggingFace model download).
          - name: single-request-reopen
      containers:
        # ── Hindsight API (:8888) + control-plane UI (:9999) ─────────────
        - name: hindsight
          # Version managed in ansible/inventories/prod/group_vars/all.yml
          # (hindsight_version — the bare-semver image tag of release
          # v<hindsight_version>).
          image: ghcr.io/vectorize-io/hindsight:${hindsight_version}
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Los_Angeles
            # llama-server is OpenAI-compatible, so use the `openai` provider
            # pointed at the sidecar over pod-localhost — upstream's documented
            # local-llm shape (docker/docker-compose/local-llm/). The API key
            # is unused by llama-server but the env var must be non-empty.
            - name: HINDSIGHT_API_LLM_PROVIDER
              value: openai
            - name: HINDSIGHT_API_LLM_BASE_URL
              value: http://127.0.0.1:8080/v1
            - name: HINDSIGHT_API_LLM_API_KEY
              value: not-needed
            - name: HINDSIGHT_API_LLM_MODEL
              value: gemma-4-e2b-it
            # LLM request timeouts. Default is 120s, but a single fact-extraction
            # on the CPU-only llama sidecar takes ~80s (measured: 1081 tokens at
            # 13 tok/s), and with N_PARALLEL=1 the server serializes inference —
            # so a retain op that QUEUES behind another waits queue-time + ~80s,
            # routinely exceeding 120s. That timed the client out, and every
            # burst of turns then burned all 4 retry attempts producing nothing
            # but heat (observed live 2026-07-20: attempt=4/4, node fan flat
            # out). 300s comfortably covers queue-wait + a slow extraction so
            # each op lands on the first attempt. CONSOLIDATION uses the same
            # local model on the same serialized server, so it gets the same
            # headroom or it would hit the identical wall during memory merges.
            - name: HINDSIGHT_API_LLM_TIMEOUT
              value: "300"
            - name: HINDSIGHT_API_CONSOLIDATION_LLM_TIMEOUT
              value: "300"
          ports:
            - name: api
              containerPort: 8888
              protocol: TCP
          # /health on the API port (verified upstream route). startupProbe
          # covers the slow first boot: pg0 initdb + schema migrations on NFS
          # plus loading the baked-in embedding/reranker models into RAM.
          startupProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          # Memory: in-process torch + sentence-transformers embeddings +
          # flashrank reranker + embedded PostgreSQL + the Next.js control
          # plane. No CPU limit (repo policy — docs/33).
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 3Gi
          # Runs as the image's unprivileged `hindsight` user (UID 1000) —
          # matching the NFS export's all_squash anonuid=1000 mapping, so pg0's
          # 0700 data-dir ownership check sees itself as the owner.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              subPath: pg0
              mountPath: /home/hindsight/.pg0
        # ── llama.cpp server: local LLM for memory extraction ────────────
        - name: llama
          # Official llama.cpp server image; tag pinned as server-<bNNNN build>
          # (hindsight_llamacpp_version in all.yml, category "manual" in
          # check-versions — see the pin's comment there).
          image: ghcr.io/ggml-org/llama.cpp:server-${hindsight_llamacpp_version}
          imagePullPolicy: IfNotPresent
          env:
            # Bind all interfaces so the kubelet's httpGet probes (which
            # connect to the pod IP, not loopback) can reach /health. Nothing
            # else can: :8080 is on no Service and the namespace default-deny
            # admits only hermes-ns -> :8888 and the Prometheus scraper.
            - name: LLAMA_ARG_HOST
              value: "0.0.0.0"
            - name: LLAMA_ARG_PORT
              value: "8080"
            # Auto-download the default Gemma GGUF (~3.5 GB) from HuggingFace
            # on first start — the same model Hindsight's own in-process
            # llamacpp provider defaults to. Cached on the NFS volume (see the
            # mount below), so later pod starts skip the download.
            - name: LLAMA_ARG_HF_REPO
              value: bartowski/google_gemma-4-E2B-it-GGUF
            - name: LLAMA_ARG_HF_FILE
              value: google_gemma-4-E2B-it-Q4_K_M.gguf
            - name: LLAMA_ARG_CTX_SIZE
              value: "8192"
            # SINGLE slot. The server otherwise ran 4 parallel slots that SPLIT
            # the 8192 context four ways (2048 each), but Hindsight queries the
            # model's advertised context (8192) and sizes its fact-extraction
            # prompts to it — so every retain 500'd with "Context size has been
            # exceeded", retried 4x, and pinned all cores producing nothing
            # (observed live 2026-07-20). One slot gives each request the full
            # 8192 and serializes inference so it can't peg the node. Memory
            # retention is background + latency-tolerant, so no concurrency is
            # needed.
            - name: LLAMA_ARG_N_PARALLEL
              value: "1"
            # Threads for inference on the agent VM's 6 cores. History: 4
            # parallel slots pegged the node (2026-07-20), then a 2-thread cap
            # quieted it but overshot — measured extractions hit 234-295s
            # (2026-07-21), starving the serialized queue (stuck retains,
            # consolidation pinned at 0/3) and blowing even the 300s server
            # timeout under queue-wait. 4 threads roughly halves that
            # (~120-150s/op) while N_PARALLEL=1 still guarantees only ONE
            # inference runs at a time, so the worst-case burst is bounded and
            # the queue can actually drain. prec-01 co-hosts Hermes; if fan
            # noise returns, the next lever is a faster/smaller extraction
            # model, NOT re-lowering threads below queue-sustainable rate.
            - name: LLAMA_ARG_THREADS
              value: "4"
          # /health is llama-server's built-in readiness route (503 while the
          # model loads). The generous startupProbe budget (30s x 60 = 30 min)
          # covers the FIRST boot's 3.5 GB HuggingFace download; warm starts
          # (model cached on NFS) pass in under a minute.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # Memory request sized to the resident model (~3.5 GB mmap'd GGUF +
          # KV cache + runtime): requesting what it actually uses keeps the
          # scheduler honest about node headroom. No CPU limit (docs/33);
          # inference bursts onto the node's spare cores.
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              memory: 6Gi
          volumeMounts:
            # llama-server stores HuggingFace downloads under
            # ~/.cache/huggingface (the image runs as root, so /root) — mount
            # the models subdir there to persist the GGUF across pod recreates
            # (upstream's compose does the same with a named volume).
            - name: data
              subPath: models
              mountPath: /root/.cache/huggingface
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hindsight-data
