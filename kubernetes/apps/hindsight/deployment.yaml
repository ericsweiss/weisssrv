---
# Hindsight, long-term agent memory for Hermes (docs/37 §Memory backend). One
# pod: the hindsight image (API :8888, UI :9999, embedded PostgreSQL on NFS)
# plus llama.cpp and pg-dump sidecars. Recreate: the RWO volume holds live PGDATA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight
  namespace: hindsight
  labels:
    app.kubernetes.io/name: hindsight
    app.kubernetes.io/part-of: hindsight
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hindsight
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hindsight
        app.kubernetes.io/part-of: hindsight
    spec:
      # Hard pin to k3s-agt-prec-01: the GTX 1660 Ti is passed through there,
      # so the llama sidecar's nvidia.com/gpu request is satisfiable nowhere
      # else (docs/43). Rehome = move the GPU and edit this hostname.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s-agt-prec-01
      nodeSelector:
        ${cluster_node_label_domain}/general: "true"
        ${cluster_node_label_domain}/cpu: "modern"
        ${cluster_node_label_domain}/gpu: "nvidia"
      # nvidia containerd runtime (RuntimeClass in controllers/nvidia-device-plugin):
      # injects the driver + card into the container that requests nvidia.com/gpu.
      runtimeClassName: nvidia
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          # Fresh socket per glibc parallel A/AAAA query so the conntrack
          # DNAT-insert race cannot cost a ~5s resolver stall.
          - name: single-request-reopen
      containers:
        # ── Hindsight API (:8888) + control-plane UI (:9999) ─────────────
        - name: hindsight
          image: ghcr.io/vectorize-io/hindsight:${hindsight_version}
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: ${cluster_timezone}
            # llama-server is OpenAI-compatible, so the `openai` provider points
            # at the sidecar over pod-localhost. The key is unused by
            # llama-server but must be non-empty.
            - name: HINDSIGHT_API_LLM_PROVIDER
              value: openai
            - name: HINDSIGHT_API_LLM_BASE_URL
              value: http://127.0.0.1:8080/v1
            - name: HINDSIGHT_API_LLM_API_KEY
              value: not-needed
            - name: HINDSIGHT_API_LLM_MODEL
              value: gemma-4-e2b-it
            # 300s (default 120s): headroom for a cold model load or queue-wait
            # on the serialized llama server. Retune from measured per-op
            # latency, do not blind-lower (docs/43).
            - name: HINDSIGHT_API_LLM_TIMEOUT
              value: "300"
            - name: HINDSIGHT_API_CONSOLIDATION_LLM_TIMEOUT
              value: "300"
          ports:
            - name: api
              containerPort: 8888
              protocol: TCP
          # startupProbe covers the slow first boot: pg0 initdb + schema
          # migrations on NFS plus loading the embedding/reranker models.
          startupProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          # In-process embeddings + reranker + embedded PostgreSQL + the Next.js
          # control plane. `Off` tier, applied by hand: 1536Mi clears both the
          # VPA target (1402Mi) and the 1226Mi 30d peak. No CPU limit (docs/33).
          resources:
            requests:
              cpu: 200m
              memory: 1536Mi
            limits:
              memory: 3Gi
          # Runs as the image's unprivileged `hindsight` user (UID 1000),
          # matching the NFS export's all_squash anonuid so pg0's 0700 data-dir
          # ownership check sees itself as the owner.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              subPath: pg0
              mountPath: /home/hindsight/.pg0
        # ── Nightly logical dump of the embedded pg0 ─────────────────────
        - name: pg-dump
          # Same image as the API container: pg0 listens on pod-localhost only,
          # so the dump must share this pod's network namespace, and the
          # matching pg_dump already ships on the data volume.
          image: ghcr.io/vectorize-io/hindsight:${hindsight_version}
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-ec"]
          # Brace-free shell vars ($var): ${var} is Flux postBuild syntax.
          args:
            - |
              set -o pipefail
              pg=/pg0/instances/hindsight/instance.json
              # Every step is checked explicitly: calling dump() from a `||`
              # list suppresses errexit for the whole body, so an unguarded
              # failure would publish a truncated dump and prune a good one.
              dump() {
                PGPASSWORD=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["password"])' "$pg") \
                  || { echo "pg0 instance.json unreadable" >&2; return 1; }
                export PGPASSWORD PGHOST=127.0.0.1 PGPORT=5432 PGUSER=hindsight PGDATABASE=hindsight
                bin=$(ls -d /pg0/installation/*/bin | tail -1)
                [ -x "$bin/pg_dump" ] || { echo "pg_dump not found" >&2; return 1; }
                rm -f /backups/hindsight-*.sql.gz.tmp
                ts=$(date +%Y%m%d-%H%M%S)
                out=/backups/hindsight-$ts.sql.gz
                if "$bin/pg_dump" --clean --if-exists | gzip -c > "$out.tmp"; then
                  mv "$out.tmp" "$out" \
                    || { rm -f "$out.tmp"; echo "pg-dump publish failed" >&2; return 1; }
                  echo "wrote $out"
                  ls -1t /backups/hindsight-*.sql.gz | tail -n +$((RETENTION + 1)) \
                    | while IFS= read -r f; do rm -f "$f"; done \
                    || { echo "pg-dump prune failed" >&2; return 1; }
                else
                  rm -f "$out.tmp"; echo "pg-dump failed" >&2; return 1
                fi
              }
              # First run on an empty landing zone: the backup-artifact alerts
              # read an empty directory as mtime 0 and page critical long
              # before the first 03:15 dump would land.
              if ! ls /backups/hindsight-*.sql.gz >/dev/null 2>&1; then
                i=0
                while [ "$i" -lt 20 ]; do
                  dump && break
                  i=$((i + 1)); sleep 30
                done
              fi
              # Never exit: a crash-looping sidecar drops the pod out of the
              # Service. A failed dump is surfaced by BackupArtifactStale.
              while true; do
                now=$(date +%s)
                next=$(date -d "$DUMP_AT today" +%s)
                [ "$next" -gt "$now" ] || next=$(date -d "$DUMP_AT tomorrow" +%s)
                sleep $((next - now))
                dump || true
              done
          env:
            - name: TZ
              value: ${cluster_timezone}
            - name: DUMP_AT
              value: "03:15"
            - name: RETENTION
              value: "7"
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            # The tmp emptyDir's sizeLimit is the cap; this request is what
            # ranks the pod by its own usage under node pressure.
            requests:
              cpu: 25m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 256Mi
              # Above the emptyDir cap, which shares this budget with the rotated
              # container logs; at the cap the kubelet evicts first.
              ephemeral-storage: 128Mi
          volumeMounts:
            - name: data
              subPath: pg0
              mountPath: /pg0
              readOnly: true
            - name: backups
              mountPath: /backups
            - name: tmp
              mountPath: /tmp
        # ── llama.cpp server: local LLM for memory extraction ────────────
        - name: llama
          # Official llama.cpp CUDA server image, pinned as server-cuda-<build>
          # (hindsight_llamacpp_version); GHCR builds server-<build> from the
          # same number. CUDA 12.8 — driver note in the k3s role's gpu.yml.
          image: ghcr.io/ggml-org/llama.cpp:server-cuda-${hindsight_llamacpp_version}
          imagePullPolicy: IfNotPresent
          env:
            # Bind all interfaces so the kubelet's httpGet probes (pod IP, not
            # loopback) reach /health. :8080 is on no Service and the namespace
            # default-deny admits only hermes-ns -> :8888 and the scraper.
            - name: LLAMA_ARG_HOST
              value: "0.0.0.0"
            - name: LLAMA_ARG_PORT
              value: "8080"
            # Offload every layer to the GPU: Q4_K_M weights (~2 GB) + the
            # 8192-ctx KV cache fit the 1660 Ti's 6 GB VRAM. With no advertised
            # GPU the pod stays Pending instead of falling back to CPU.
            - name: LLAMA_ARG_N_GPU_LAYERS
              value: "99"
            # Auto-download the default Gemma GGUF on first start; cached on the
            # NFS volume (mount below) so later starts skip it.
            - name: LLAMA_ARG_HF_REPO
              value: bartowski/google_gemma-4-E2B-it-GGUF
            - name: LLAMA_ARG_HF_FILE
              value: google_gemma-4-E2B-it-Q4_K_M.gguf
            - name: LLAMA_ARG_CTX_SIZE
              value: "8192"
            # ONE slot: Hindsight sizes its extraction prompts to the advertised
            # 8192 context, so parallel slots split it and every retain fails
            # "Context size has been exceeded". Retention is background work.
            - name: LLAMA_ARG_N_PARALLEL
              value: "1"
            # 4 threads. Nominally these only feed the GPU under -ngl 99, but
            # measured CPU is ~0.9 cores at p95, so retune from measured tok/s
            # rather than deleting (docs/43).
            - name: LLAMA_ARG_THREADS
              value: "4"
          # /health returns 503 while the model loads. The 30-minute startup
          # budget covers the first boot's HuggingFace download; warm starts
          # (model cached on NFS) pass in under a minute.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # VRAM holds the model + KV cache (-ngl 99); the host side is the
          # reclaimable mmap'd GGUF page cache, so the request sits under the
          # working set and the limit is a reclaim ceiling. No CPU limit.
          resources:
            requests:
              cpu: 900m
              memory: 2Gi
            limits:
              memory: 4Gi
              # Integer extended resource: the request mirrors this.
              nvidia.com/gpu: "1"
          # Runs as root — the image caches the GGUF under /root — but with no
          # added capabilities: the nvidia RuntimeClass injects the device via
          # cgroups, not via Linux capabilities.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            # llama-server caches HuggingFace downloads under ~/.cache/huggingface
            # (the image runs as root); persist the GGUF across pod recreates.
            - name: data
              subPath: models
              mountPath: /root/.cache/huggingface
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hindsight-data
        - name: backups
          persistentVolumeClaim:
            claimName: hindsight-pg-dump
        - name: tmp
          emptyDir:
            # HOME for the pg-dump sidecar; the dumps themselves land on the
            # backups PVC. Over sizeLimit the kubelet evicts the pod.
            sizeLimit: 64Mi
