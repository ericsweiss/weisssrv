---
# Hindsight (vectorize-io) — long-term agent memory for Hermes (docs/37
# §Memory backend). One pod: the hindsight image (API :8888, UI :9999, embedded
# pg0 PostgreSQL on NFS) + a llama.cpp server sidecar as its OpenAI-compatible
# LLM, mirroring upstream's docker/docker-compose/local-llm/ example.
# Recreate strategy: the single RWO NFS volume holds a live PostgreSQL data dir
# and must never be dual-mounted across a rolling update.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight
  namespace: hindsight
  labels:
    app.kubernetes.io/name: hindsight
    app.kubernetes.io/part-of: hindsight
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hindsight
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hindsight
        app.kubernetes.io/part-of: hindsight
    spec:
      # Hard pin to k3s-agt-prec-01: the GTX 1660 Ti is passed through there, so
      # the llama sidecar's nvidia.com/gpu request is satisfiable only on that
      # node (docs/43). prec-01 down = Hindsight down and Hermes falls back to
      # its built-in memory. Rehome = move the GPU + edit this hostname.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s-agt-prec-01
      nodeSelector:
        ${cluster_node_label_domain}/general: "true"
        ${cluster_node_label_domain}/cpu: "modern"
        ${cluster_node_label_domain}/gpu: "nvidia"
      # nvidia containerd runtime (RuntimeClass in controllers/nvidia-device-plugin):
      # injects the driver + card into the container that requests nvidia.com/gpu.
      runtimeClassName: nvidia
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          # Fresh socket per glibc parallel A/AAAA query so the conntrack
          # DNAT-insert race cannot cost a ~5s resolver stall.
          - name: single-request-reopen
      containers:
        # ── Hindsight API (:8888) + control-plane UI (:9999) ─────────────
        - name: hindsight
          image: ghcr.io/vectorize-io/hindsight:${hindsight_version}
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Los_Angeles
            # llama-server is OpenAI-compatible, so the `openai` provider points
            # at the sidecar over pod-localhost. The key is unused by
            # llama-server but must be non-empty.
            - name: HINDSIGHT_API_LLM_PROVIDER
              value: openai
            - name: HINDSIGHT_API_LLM_BASE_URL
              value: http://127.0.0.1:8080/v1
            - name: HINDSIGHT_API_LLM_API_KEY
              value: not-needed
            - name: HINDSIGHT_API_LLM_MODEL
              value: gemma-4-e2b-it
            # 300s (default 120s): headroom for a cold model load or queue-wait
            # on the serialized llama server. Retune from measured per-op
            # latency, do not blind-lower (docs/43).
            - name: HINDSIGHT_API_LLM_TIMEOUT
              value: "300"
            - name: HINDSIGHT_API_CONSOLIDATION_LLM_TIMEOUT
              value: "300"
          ports:
            - name: api
              containerPort: 8888
              protocol: TCP
          # startupProbe covers the slow first boot: pg0 initdb + schema
          # migrations on NFS plus loading the embedding/reranker models.
          startupProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          # In-process torch/sentence-transformers embeddings + flashrank
          # reranker + embedded PostgreSQL + the Next.js control plane. Request
          # tracks the recorded VPA target. No CPU limit (docs/33).
          resources:
            requests:
              cpu: 200m
              memory: 1536Mi
            limits:
              memory: 3Gi
          # Runs as the image's unprivileged `hindsight` user (UID 1000),
          # matching the NFS export's all_squash anonuid so pg0's 0700 data-dir
          # ownership check sees itself as the owner.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              subPath: pg0
              mountPath: /home/hindsight/.pg0
        # ── llama.cpp server: local LLM for memory extraction ────────────
        - name: llama
          # Official llama.cpp CUDA server image, pinned as server-cuda-<build>
          # (hindsight_llamacpp_version). GHCR publishes server-<build> and
          # server-cuda-<build> from the same build number, so one pin covers
          # both. CUDA 12.8 — see the driver note in the k3s role's gpu.yml.
          image: ghcr.io/ggml-org/llama.cpp:server-cuda-${hindsight_llamacpp_version}
          imagePullPolicy: IfNotPresent
          env:
            # Bind all interfaces so the kubelet's httpGet probes (pod IP, not
            # loopback) reach /health. :8080 is on no Service and the namespace
            # default-deny admits only hermes-ns -> :8888 and the scraper.
            - name: LLAMA_ARG_HOST
              value: "0.0.0.0"
            - name: LLAMA_ARG_PORT
              value: "8080"
            # Offload every layer to the GPU: Q4_K_M weights (~2 GB) + the
            # 8192-ctx KV cache fit the 1660 Ti's 6 GB VRAM. With no advertised
            # GPU the pod stays Pending instead of falling back to CPU.
            - name: LLAMA_ARG_N_GPU_LAYERS
              value: "99"
            # Auto-download the default Gemma GGUF on first start; cached on the
            # NFS volume (mount below) so later starts skip it.
            - name: LLAMA_ARG_HF_REPO
              value: bartowski/google_gemma-4-E2B-it-GGUF
            - name: LLAMA_ARG_HF_FILE
              value: google_gemma-4-E2B-it-Q4_K_M.gguf
            - name: LLAMA_ARG_CTX_SIZE
              value: "8192"
            # ONE slot: Hindsight sizes its extraction prompts to the advertised
            # 8192 context, so parallel slots split it and every retain fails
            # "Context size has been exceeded". Retention is background work, so
            # serialized inference is fine.
            - name: LLAMA_ARG_N_PARALLEL
              value: "1"
            # Threads only feed the GPU under -ngl 99, so 4 is generous. Retune
            # from measured tok/s rather than deleting (docs/43).
            - name: LLAMA_ARG_THREADS
              value: "4"
          # /health returns 503 while the model loads. The 30-minute startup
          # budget covers the first boot's HuggingFace download; warm starts
          # (model cached on NFS) pass in under a minute.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # Model + KV cache live in VRAM (-ngl 99); the host side is ~560Mi RSS
          # plus the active slice of the mmap'd GGUF page cache (reclaimable), so
          # the request sits under the ~2.7Gi working set on purpose. The limit
          # is a reclaim ceiling with headroom over the observed peak. No CPU
          # limit (docs/33); nvidia.com/gpu is an integer extended resource, so
          # its request auto-mirrors the limit.
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              memory: 4Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            # llama-server caches HuggingFace downloads under ~/.cache/huggingface
            # (the image runs as root); persist the GGUF across pod recreates.
            - name: data
              subPath: models
              mountPath: /root/.cache/huggingface
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hindsight-data
