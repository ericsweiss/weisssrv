---
# ClusterIP fronting the Hindsight API on :8888, consumed by the Hermes gateway's
# memory plugin (docs/37) and scraped by Prometheus on the same port. The
# control-plane UI (:9999) and the llama sidecar (:8080) stay unexposed.
apiVersion: v1
kind: Service
metadata:
  name: hindsight
  namespace: hindsight
  labels:
    app.kubernetes.io/name: hindsight
spec:
  selector:
    app.kubernetes.io/name: hindsight
  ports:
    - name: api
      port: 8888
      targetPort: api
  type: ClusterIP
