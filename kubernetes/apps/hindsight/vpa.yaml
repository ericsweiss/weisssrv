---
# VPA: Off (recommendations only) — stateful/fixed-footprint tier (docs/33).
# hindsight fronts an embedded PostgreSQL and llama's memory is set by the
# pinned GGUF + context size, so neither suits a percentile estimate.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: hindsight
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: hindsight}
  updatePolicy: {updateMode: "Off"}
  resourcePolicy:
    containerPolicies:
      # llama is EXCLUDED, not merely capped: its working set is the mmap'd
      # GGUF's file-backed pages, which grow to the cgroup limit, so a
      # percentile estimate just tracks it. Hand-sized in deployment.yaml.
      - containerName: llama
        mode: "Off"
      # Its own cap: the "*" 3Gi would exceed this sidecar's 256Mi limit.
      - containerName: pg-dump
        minAllowed: {cpu: 25m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 256Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
      # Caps for the recorded recommendation only — nothing here applies it to
      # a pod. maxAllowed.memory matches the hindsight container's 3Gi limit so
      # growth is recorded up to the binding ceiling (docs/33).
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 256Mi}
        maxAllowed: {cpu: 2, memory: 3Gi}
        controlledResources: [cpu, memory]
