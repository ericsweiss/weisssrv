---
# NFS-backed persistent state for Hindsight: `pg0/` (the embedded PostgreSQL
# data dir, i.e. the memory store) and `models/` (the GGUF the llama sidecar
# downloads once). Lives on the encrypted ssd/appdata dataset, so the nightly
# ssd/appdata -> archive replication captures it; the subdir is created by the
# nas_storage role.
#
# PostgreSQL-on-NFS is a deliberate deviation from the zvol convention: a
# single-client hard NFSv4.2 mount (RWO + claimRef + Recreate) is a supported
# configuration, the dataset is tiny, and NFS buys automatic backup. README.md
# records the zvol fallback if latency or locking ever bites.
#
# server: is immutable, so the force annotation lets Flux delete+recreate the PV
# (Retain -> data safe). It must be the hostname: xprtsec=tls verifies against
# the *.esweiss.com cert SAN and an IP mount fails the handshake (docs/07).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hindsight-data
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: hindsight
spec:
  # Pre-bind to the intended claim so no other empty-storageClass PVC can grab
  # this PV first.
  claimRef:
    namespace: hindsight
    name: hindsight-data
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: pve-nas-01.esweiss.com
    path: /appdata/hindsight
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    # The /appdata k3s client export lines require TLS (xprtsec=tls); plaintext
    # is rejected. tlshd runs on every agent (nfs_tls role).
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hindsight-data
  namespace: hindsight
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 20Gi
  volumeName: hindsight-data
