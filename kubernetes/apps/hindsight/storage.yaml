---
# NFS-backed persistent state for Hindsight (Hermes' memory backend):
#   * pg0/    -> /home/hindsight/.pg0 — the embedded PostgreSQL data dir
#     (pg0-embedded: a real PostgreSQL server managed in-process by the
#     hindsight image; this is the actual memory store).
#   * models/ -> /root/.cache/huggingface (llama container) — the ~3.5 GB
#     Gemma GGUF the llama.cpp sidecar auto-downloads on first start; cached
#     here so a pod recreate does not re-download it.
# Lives on the encrypted ssd/appdata dataset via the appdata NFS export;
# captured by the nightly ssd/appdata -> archive raw-ZFS replication (child of
# an existing backup root — no SRC_LIST edit needed). The /appdata/hindsight
# subdir is created + owned 1000:2000 by the nas_storage role
# (nas_appdata_dirs).
#
# PostgreSQL-on-NFS note (deliberate deviation from the zvol convention every
# other Postgres here follows): this is a single-client (RWO + claimRef +
# strategy Recreate), hard-mounted NFSv4.2 volume — the configuration upstream
# PostgreSQL documents as supported. The dataset is tiny (one user's agent
# memories), so the zvol's performance rationale doesn't apply, and NFS buys
# automatic archive backup + independence from any one k3s VM. If write
# latency or locking ever bites, the follow-up is a zvol on the VM of a
# modern-CPU agent + nodeAffinity pin (see kubernetes/apps/hindsight/README.md).
#
# server: is an immutable PV field; the kustomize force annotation lets Flux
# delete+recreate it if server/mountOptions ever change (Retain -> data safe).
# Hostname (not IP) is required so xprtsec=tls verifies against the
# *.esweiss.com cert SAN — an IP mount fails the TLS handshake. See docs/07.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hindsight-data
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: hindsight
spec:
  # Pre-bind to the intended claim so no other empty-storageClass PVC can grab
  # this PV first.
  claimRef:
    namespace: hindsight
    name: hindsight-data
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: pve-nas-01.esweiss.com
    path: /appdata/hindsight
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    # The /appdata k3s client export lines require TLS (xprtsec=tls); plaintext
    # is rejected. tlshd runs on every agent (nfs_tls role).
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hindsight-data
  namespace: hindsight
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 20Gi
  volumeName: hindsight-data
