---
# NFS-backed state for Hindsight: `pg0/` (embedded PostgreSQL) and `models/`, on
# encrypted ssd/appdata so nightly replication captures it. README.md covers the
# PostgreSQL-on-NFS mount and the zvol fallback; TLS PV details in docs/07.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hindsight-data
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: hindsight
spec:
  # Pre-bind to the intended claim so no other empty-storageClass PVC can grab
  # this PV first.
  claimRef:
    namespace: hindsight
    name: hindsight-data
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: pve-nas-01.${cluster_internal_domain}
    path: /appdata/hindsight
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hindsight-data
  namespace: hindsight
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 20Gi
  volumeName: hindsight-data

---
# Offsite-eligible landing zone for the pg-dump sidecar: /backups-apps/hindsight
# = tank/backups/apps/hindsight, so the dumps ride archive replication and
# restic B2 (docs/42). Restore: docs/12.

# Trap: `task storage:deploy` creates this export on pve-nas-01. It must run
# before this manifest reconciles, or the Recreate Deployment that mounts the
# claim stalls in ContainerCreating with the serving pod already gone (README).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hindsight-pg-dump
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: hindsight
spec:
  claimRef:
    namespace: hindsight
    name: hindsight-pg-dump
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: pve-nas-01.${cluster_internal_domain}
    path: /backups-apps/hindsight
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hindsight-pg-dump
  namespace: hindsight
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
  volumeName: hindsight-pg-dump
