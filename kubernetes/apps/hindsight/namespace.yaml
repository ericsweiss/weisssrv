---
apiVersion: v1
kind: Namespace
metadata:
  name: hindsight
  labels:
    app.kubernetes.io/name: hindsight
    app.kubernetes.io/part-of: hindsight
    app.kubernetes.io/managed-by: flux
    # Baseline enforce: the llama.cpp server sidecar image ships no USER and
    # runs as root with its model cache under /root. The hindsight container
    # itself runs as UID 1000; warn/audit restricted flag the root start.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
