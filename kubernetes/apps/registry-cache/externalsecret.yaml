---
# Upstream-registry credentials for the pull-through cache, sourced from
# 1Password via ESO (onepassword-connect provider). Two fields off the single
# "GitLab Registry Cache Deploy Token" item:
#   * username -> REGISTRY_PROXY_USERNAME
#   * token    -> REGISTRY_PROXY_PASSWORD
#
# The item is a GitLab DEPLOY TOKEN scoped `read_registry` (project eric/weisssrv),
# minted in GitLab at deploy time — see docs/27 § Registry pull-through cache and
# the item entry in docs/15-credential-rotation.md. read_registry is the least
# privilege the cache needs: it only ever PULLS blobs from the upstream. Both
# fields MUST exist on the item BEFORE this manifest merges — a missing field
# fails the whole Secret sync and the pod waits on the absent key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-cache-secrets
  namespace: registry-cache
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: registry-cache-secrets
    creationPolicy: Owner
  data:
    - secretKey: proxy-username
      remoteRef:
        key: GitLab Registry Cache Deploy Token
        property: username
    - secretKey: proxy-password
      remoteRef:
        key: GitLab Registry Cache Deploy Token
        property: token
