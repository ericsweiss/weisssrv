---
# Upstream-registry credentials: GitLab read_registry deploy token, two
# fields off one 1Password item (docs/15, docs/27).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-cache-secrets
  namespace: registry-cache
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: registry-cache-secrets
    creationPolicy: Owner
  data:
    - secretKey: proxy-username
      remoteRef:
        key: GitLab Registry Cache Deploy Token
        property: username
    - secretKey: proxy-password
      remoteRef:
        key: GitLab Registry Cache Deploy Token
        property: token
