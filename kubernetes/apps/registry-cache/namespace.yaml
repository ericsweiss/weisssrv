---
apiVersion: v1
kind: Namespace
metadata:
  name: registry-cache
  labels:
    app.kubernetes.io/name: registry-cache
    app.kubernetes.io/part-of: registry-cache
    app.kubernetes.io/managed-by: flux
    # enforce baseline / warn+audit restricted (matches homarr/hindsight). The
    # pod + container securityContext below already applies restricted-style
    # hardening (runAsNonRoot, drop-ALL, seccomp RuntimeDefault,
    # readOnlyRootFilesystem), but the upstream CNCF distribution image is used
    # verbatim and not guaranteed to start under a strict restricted ENFORCE, so
    # baseline is the safe enforce level while warn/audit surface any drift.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
