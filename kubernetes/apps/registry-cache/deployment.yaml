---
# Pull-through Docker registry cache (CNCF distribution) for CI image pulls.
# Single replica + Recreate: node-local emptyDir store, re-warms after restart.
# Design and deploy-token runbook: README.md, docs/27 § Registry pull-through cache.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-cache
  namespace: registry-cache
  labels:
    app.kubernetes.io/name: registry-cache
    app.kubernetes.io/part-of: registry-cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-cache
        app.kubernetes.io/part-of: registry-cache
    spec:
      # NAS-avoid: the store is a throwaway node-local emptyDir, so steer off the
      # NAS node. No cpu class pin - the registry runs fine on the legacy nodes.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: ${cluster_node_label_domain}/nas
                    operator: DoesNotExist
      nodeSelector:
        ${cluster_node_label_domain}/general: "true"
      # No in-cluster API access.
      automountServiceAccountToken: false
      # Pin the upstream registry hostname to the internal Traefik VIP at POD
      # scope: it has no AdGuard rewrite and the node /etc/hosts pin does not
      # reach pods, so without this the fetch hairpins over the WAN (docs/08).
      hostAliases:
        - ip: "${cluster_metallb_internal_vip}"
          hostnames:
            - registry.git.${cluster_external_domain}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # emptyDir is group-owned by fsGroup so the non-root registry process can
        # write the blob store at /var/lib/registry.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          # Public image (no imagePullSecret); registry_cache_version in all.yml.
          image: registry:${registry_cache_version}
          imagePullPolicy: IfNotPresent
          env:
            # Pull-through mode against the real GitLab registry. Auth is a
            # read_registry deploy token (externalsecret.yaml); private repo
            # blobs cannot be fetched without it.
            - name: REGISTRY_PROXY_REMOTEURL
              value: https://registry.git.${cluster_external_domain}
            - name: REGISTRY_PROXY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: registry-cache-secrets
                  key: proxy-username
            - name: REGISTRY_PROXY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: registry-cache-secrets
                  key: proxy-password
            # Serving + storage
            - name: REGISTRY_HTTP_ADDR
              value: ":5000"
            # Blob store lives on the node-local emptyDir mounted below. Explicit
            # so the readOnlyRootFilesystem below leaves exactly one writable path.
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            # The registry serves Prometheus metrics on a SEPARATE debug
            # listener (:5001), scraped via servicemonitor.yaml.
            - name: REGISTRY_HTTP_DEBUG_ADDR
              value: ":5001"
            - name: REGISTRY_HTTP_DEBUG_PROMETHEUS_ENABLED
              value: "true"
            - name: REGISTRY_HTTP_DEBUG_PROMETHEUS_PATH
              value: /metrics
            - name: REGISTRY_LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
            - name: metrics
              containerPort: 5001
              protocol: TCP
          # /v2/ answers 200 once the server is up; the cache runs no auth of its
          # own, only toward the upstream.
          startupProbe:
            httpGet:
              path: /v2/
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v2/
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            # emptyDir.sizeLimit below is the cache cap; this request is what
            # ranks the pod by its own usage under node pressure.
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 10Gi
            limits:
              # No CPU limit (repo policy — docs/33); memory capped. Blob proxying
              # is I/O-bound, not memory-hungry.
              memory: 512Mi
              # Above the emptyDir cap below and inside the ~24Gi free on the
              # fullest node's 62.8Gi image filesystem, so the cap binds before
              # disk-pressure eviction does.
              ephemeral-storage: 12Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # The registry only writes to the emptyDir blob store below; the rest
            # of the rootfs can be read-only.
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: cache
              mountPath: /var/lib/registry
      volumes:
        # Node-local scratch cache with a hard cap: over sizeLimit the kubelet
        # evicts the pod, which reschedules and re-warms.
        - name: cache
          emptyDir:
            sizeLimit: 10Gi
