---
# VPA Initial: resize CPU and memory on natural pod restarts. The emptyDir
# cache is disposable, so a restart costs only a re-warm. Tier docs/33 gives
# single-pod apps; bounded so a runaway request cannot claim the node.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: registry-cache
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: registry-cache}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # 0.8x the container's 512Mi memory limit (deployment.yaml): the policy
      # also controls limits, so a cap at or above the limit would leave no
      # ceiling that ever binds (docs/33 § Limit oscillation).
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 1, memory: 409Mi}
        controlledResources: [cpu, memory]
