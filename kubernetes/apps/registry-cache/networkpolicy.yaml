---
# Default-deny egress; explicit allows below. The default-deny INGRESS half
# comes from the shared ../../components/netpol-baseline component
# (kustomization.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: registry-cache
spec:
  podSelector: {}
  policyTypes:
    - Egress

---
# Ingress: :5000 from the DinD job pods in gitlab-runner-privileged, :5001 from
# the Prometheus pod (servicemonitor.yaml). Kubelet probes are node-local and
# not gated by NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-registry-cache-ingress
  namespace: registry-cache
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: registry-cache
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitlab-runner-privileged
      ports:
        - protocol: TCP
          port: 5000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 5001

---
# Egress: :443 to traefik for the upstream fetch; kube-dns comes from the
# netpol-egress-dns component. registry.git is pinned to the internal Traefik
# VIP (hostAliases), which kube-proxy DNATs, so the peer is a namespaceSelector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-registry-cache
  namespace: registry-cache
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: registry-cache
  policyTypes:
    - Egress
  egress:
    # traefik namespace on :443 (upstream registry via the internal VIP .101)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        # The VIP ipBlock also admits the pre-DNAT form, so a CNI change
        # cannot silently break this.
        - ipBlock:
            cidr: 10.0.10.101/32
      ports:
        - protocol: TCP
          port: 443
