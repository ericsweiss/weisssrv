---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: registry-cache

resources:
  - namespace.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - vpa.yaml

# default-deny-ingress from the shared baseline component (see
# kubernetes/components/netpol-baseline).
components:
  - ../../components/netpol-baseline
