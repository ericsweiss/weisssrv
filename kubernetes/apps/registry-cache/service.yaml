---
# ClusterIP fronting the registry cache. :5000 is the registry API the DinD
# daemons in gitlab-runner-privileged consume; :5001 is the debug listener
# Prometheus scrapes. Cluster-internal and CI-only: no LoadBalancer or ingress.
apiVersion: v1
kind: Service
metadata:
  name: registry-cache
  namespace: registry-cache
  labels:
    app.kubernetes.io/name: registry-cache
spec:
  selector:
    app.kubernetes.io/name: registry-cache
  ports:
    - name: http
      port: 5000
      targetPort: http
    - name: metrics
      port: 5001
      targetPort: metrics
  type: ClusterIP
