---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: recipes

resources:
  - namespace.yaml
  - externalsecret.yaml
  - storage.yaml
  - mealie.yaml
  - bar-assistant.yaml
  - ingress-routes.yaml
  - certificate.yaml
  - networkpolicy.yaml
  - vpa.yaml
  - hpa.yaml

# default-deny-ingress from the shared baseline component (see
# kubernetes/components/netpol-baseline).
components:
  - ../../components/netpol-baseline
