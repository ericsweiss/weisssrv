---
# IngressRoutes for Mealie and Bar Assistant
# Both external (ericsweiss.com) and internal (esweiss.com) domains

# Mealie IngressRoutes

# External - food.ericsweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mealie
  namespace: recipes
  annotations:
    external-dns.alpha.kubernetes.io/target: ${cluster_external_domain}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`food.${cluster_external_domain}`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
        - name: security-headers
          namespace: traefik
      services:
        - name: mealie
          port: 9000
  tls:
    secretName: recipes-ericsweiss-tls

---
# Internal - food.esweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mealie-internal
  namespace: recipes
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`food.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: mealie
          port: 9000
  tls:
    secretName: recipes-esweiss-tls

---
# Bar Assistant IngressRoutes
# Salt Rim (frontend) serves the main UI
# Bar Assistant API is proxied at /api and /search paths

# External - bar.ericsweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bar-assistant
  namespace: recipes
  annotations:
    external-dns.alpha.kubernetes.io/target: ${cluster_external_domain}
spec:
  entryPoints:
    - websecure
  routes:
    # API backend
    - match: Host(`bar.${cluster_external_domain}`) && PathPrefix(`/api`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
        - name: security-headers
          namespace: traefik
      services:
        - name: bar-assistant
          port: 8080
    # Uploads (served by Bar Assistant)
    - match: Host(`bar.${cluster_external_domain}`) && PathPrefix(`/uploads`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
        - name: security-headers
          namespace: traefik
      services:
        - name: bar-assistant
          port: 8080
    # Meilisearch proxy for frontend search. No forward-auth: Meilisearch requires
    # MEILI_MASTER_KEY on every operation and the frontend holds only a
    # search-only key (docs/23).
    - match: Host(`bar.${cluster_external_domain}`) && PathPrefix(`/search`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
        - name: security-headers
          namespace: traefik
        - name: bar-assistant-search-strip
          namespace: recipes
      services:
        - name: bar-assistant-meilisearch
          port: 7700
    # Frontend (Salt Rim) - default route (must be last, handles /oauth too)
    - match: Host(`bar.${cluster_external_domain}`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
        - name: security-headers
          namespace: traefik
      services:
        - name: salt-rim
          port: 8080
  tls:
    secretName: recipes-ericsweiss-tls

---
# Canonical-host redirect bar.esweiss.com -> bar.ericsweiss.com: Bar Assistant
# pins one OIDC callback origin, so a login begun on the internal name cannot
# complete (docs/23). 302, not 301, so it stays clearable.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bar-assistant-canonical-host
  namespace: recipes
spec:
  redirectRegex:
    regex: ^https://bar\.esweiss\.com/(.*)
    # $${1}, not ${1}: Flux envsubst eats a bare ${1} and drops the path.
    replacement: https://bar.${cluster_external_domain}/$${1}
    permanent: false

---
# Internal - bar.esweiss.com (redirect only; see the Middleware above)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bar-assistant-internal
  namespace: recipes
spec:
  entryPoints:
    - websecure
  routes:
    # Single catch-all: every path redirects to the canonical host. The service
    # is still required by the CRD schema, but the middleware short-circuits
    # before anything is proxied to it.
    - match: Host(`bar.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        # HSTS on the redirect response itself, so the browser still pins HTTPS
        # for bar.esweiss.com.
        - name: hsts-header
          namespace: traefik
        - name: bar-assistant-canonical-host
          namespace: recipes
      services:
        - name: salt-rim
          port: 8080
  tls:
    secretName: recipes-esweiss-tls

---
# Middleware to strip /search prefix when proxying to Meilisearch
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bar-assistant-search-strip
  namespace: recipes
spec:
  stripPrefix:
    prefixes:
      - /search
