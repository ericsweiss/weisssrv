---
# IngressRoutes for Mealie and Bar Assistant
# Both external (ericsweiss.com) and internal (esweiss.com) domains

# =============================================================================
# Mealie IngressRoutes
# =============================================================================

# External - food.ericsweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mealie
  namespace: recipes
  annotations:
    external-dns.alpha.kubernetes.io/target: ericsweiss.com
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`food.ericsweiss.com`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
      services:
        - name: mealie
          port: 9000
  tls:
    secretName: recipes-ericsweiss-tls

---
# Internal - food.esweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mealie-internal
  namespace: recipes
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`food.esweiss.com`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: mealie
          port: 9000
  tls:
    secretName: recipes-esweiss-tls

---
# =============================================================================
# Bar Assistant IngressRoutes
# Salt Rim (frontend) serves the main UI
# Bar Assistant API is proxied at /api and /search paths
# =============================================================================

# External - bar.ericsweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bar-assistant
  namespace: recipes
  annotations:
    external-dns.alpha.kubernetes.io/target: ericsweiss.com
spec:
  entryPoints:
    - websecure
  routes:
    # API backend
    - match: Host(`bar.ericsweiss.com`) && PathPrefix(`/api`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
      services:
        - name: bar-assistant
          port: 8080
    # Uploads (served by Bar Assistant)
    - match: Host(`bar.ericsweiss.com`) && PathPrefix(`/uploads`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
      services:
        - name: bar-assistant
          port: 8080
    # Meilisearch proxy for frontend search
    # NOTE: No Authentik middleware here - Meilisearch requires an API key for all
    # operations (MEILI_MASTER_KEY), which is only known to the Bar Assistant backend.
    # The frontend uses a search-only API key generated by Bar Assistant, so direct
    # access without the key results in 401 Unauthorized. This is secure by design.
    - match: Host(`bar.ericsweiss.com`) && PathPrefix(`/search`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
        - name: bar-assistant-search-strip
          namespace: recipes
      services:
        - name: bar-assistant-meilisearch
          port: 7700
    # Frontend (Salt Rim) - default route (must be last, handles /oauth too)
    - match: Host(`bar.ericsweiss.com`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
      services:
        - name: salt-rim
          port: 8080
  tls:
    secretName: recipes-ericsweiss-tls

---
# Internal - bar.esweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bar-assistant-internal
  namespace: recipes
spec:
  entryPoints:
    - websecure
  routes:
    # API backend
    - match: Host(`bar.esweiss.com`) && PathPrefix(`/api`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: bar-assistant
          port: 8080
    # Uploads (served by Bar Assistant)
    - match: Host(`bar.esweiss.com`) && PathPrefix(`/uploads`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: bar-assistant
          port: 8080
    # Meilisearch proxy for frontend search
    - match: Host(`bar.esweiss.com`) && PathPrefix(`/search`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
        - name: bar-assistant-search-strip
          namespace: recipes
      services:
        - name: bar-assistant-meilisearch
          port: 7700
    # Frontend (Salt Rim) - default route (must be last, handles /oauth too)
    - match: Host(`bar.esweiss.com`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: salt-rim
          port: 8080
  tls:
    secretName: recipes-esweiss-tls

---
# Middleware to strip /search prefix when proxying to Meilisearch
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bar-assistant-search-strip
  namespace: recipes
spec:
  stripPrefix:
    prefixes:
      - /search
