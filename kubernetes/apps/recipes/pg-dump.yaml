---
# Nightly logical backup of the Mealie PostgreSQL. The postgres zvol is only a
# crash-consistent snapshot; this pg_dump adds a restorable logical dump
# (gzipped plain SQL, DROP-if-exists) to the per-app NFS export
# /backups-apps/mealie = tank/backups/apps/mealie (encrypted aes-256-gcm), NOT
# ssd/appdata — the landing zone is deliberately the offsite-eligible one, so the
# dump rides tank/backups -> archive AND the restic B2 file walk (docs/42). Restore:
# `gunzip -c <file> | psql -h mealie-postgres -U mealie mealie`.
#
# 02:45: after smartd's 02:00 short tests, well before the 03:30-~05:45 vzdump
# window, the 06:00 media-mover, and the 06:30 archive replication — so the
# fresh dump lands in that night's archive snapshot without contending for NAS
# I/O (docs/06). Staggered 15 min behind authentik's 02:30 dump.
#
# Credentials are reused from the app's own recipes-secrets Secret (no new 1P
# item). The postgres client image is pinned to the same ${mealie_postgresql_version}
# as the server so pg_dump major matches. NFS is mounted by the kubelet on the
# node, not the pod, so it is not governed by this namespace's egress
# NetworkPolicy — only kube-dns + Postgres :5432 need allowing (networkpolicy.yaml).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mealie-pg-dump
  namespace: recipes
  labels:
    app.kubernetes.io/name: mealie-pg-dump
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: mealie
spec:
  schedule: "45 2 * * *"
  # Local time so 02:45 lines up with the NAS's local-time overnight jobs
  # (vzdump/media-mover/archive) rather than the controller's default UTC.
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mealie-pg-dump
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 2000
            fsGroup: 2000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: postgres:${mealie_postgresql_version}
              imagePullPolicy: IfNotPresent
              # bash, not sh: dash has no pipefail, and without it a failed
              # pg_dump would still gzip to exit 0 — a truncated dump would be
              # rotated in as "successful" and the staleness alert never fires.
              command: ["/bin/bash", "-ec"]
              # Brace-free shell vars ($var, not ${var}): the ${var} form is
              # reserved for Flux postBuild substitution (cluster-versions) and
              # the flux:lint scanner rejects any ${x} not in that ConfigMap.
              args:
                - |
                  set -o pipefail
                  # NetworkPolicy ipset propagation to remote nodes lags pod
                  # creation by ~5-15s (measured 2026-07-22: the fresh job
                  # pod's first SYN is silently dropped at the postgres node;
                  # a retry connects at ~10s). A job that dials the instant it
                  # starts loses that race on every backoff attempt, so wait —
                  # bounded — until the server is actually reachable.
                  for i in $(seq 1 30); do
                    if pg_isready -q; then break; fi
                    if [ "$i" = 30 ]; then echo "postgres unreachable after 150s" >&2; exit 1; fi
                    sleep 5
                  done
                  # Sweep partial writes from earlier failed runs first: the
                  # retention loop below globs only *.sql.gz, so a crashed dump's
                  # .tmp file would otherwise sit in the restore directory forever
                  # and ride into B2.
                  rm -f /backups/mealie-*.sql.gz.tmp
                  ts="$(date +%Y%m%d-%H%M%S)"
                  out="/backups/mealie-$ts.sql.gz"
                  echo "pg_dump $PGDATABASE -> $out"
                  pg_dump --clean --if-exists | gzip -c > "$out.tmp"
                  mv "$out.tmp" "$out"
                  # Retain the newest $RETENTION dumps; delete older ones.
                  ls -1t /backups/mealie-*.sql.gz 2>/dev/null \
                    | tail -n +$((RETENTION + 1)) \
                    | while IFS= read -r f; do rm -f "$f"; done
                  echo "done; kept:"; ls -1t /backups/mealie-*.sql.gz
              env:
                - name: PGHOST
                  value: mealie-postgres.recipes.svc.cluster.local
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: mealie
                - name: PGDATABASE
                  value: mealie
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: recipes-secrets
                      key: mealie-postgres-password
                - name: RETENTION
                  value: "7"
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: mealie-pg-dump
            - name: tmp
              emptyDir: {}
