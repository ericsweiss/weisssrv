---
# Optional: OpenAI API key for Mealie recipe parsing.
# Isolated from recipes-secrets so a missing or invalid API key does not
# block the required database and SSO credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recipes-openai
  namespace: recipes
  labels:
    app.kubernetes.io/managed-by: flux
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: recipes-openai
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: plmhoiuxpih6qg6gcudaejrzum/api-key
