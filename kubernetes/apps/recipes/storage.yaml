---
# CRITICAL: mealie-pg-dump landing zone on tank/backups/apps/mealie, the
# file-walkable dataset the offsite backups walk (docs/42). The nas_storage
# role creates the subdir and export, so deploy storage before this reconciles.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mealie-pg-dump
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: mealie
spec:
  claimRef:
    namespace: recipes
    name: mealie-pg-dump
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: pve-nas-01.${cluster_internal_domain}
    path: /backups-apps/mealie
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-pg-dump
  namespace: recipes
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
  volumeName: mealie-pg-dump
