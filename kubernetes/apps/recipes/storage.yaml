---
# mealie-pg-dump landing zone: tank/backups/apps/mealie, the encrypted
# file-walkable dump dataset that rides both the nightly archive replication and
# the restic offsite B2 walk — where a zvol snapshot never could (docs/42).
#
# DEPLOY-ORDER DEPENDENCY: the nas_storage role creates the subdir and its
# per-app export, so run the ansible storage deploy before this PV reconciles.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mealie-pg-dump
  annotations:
    # Lets Flux delete+recreate this PV when an immutable field (server,
    # mountOptions) changes, instead of stalling the Kustomization. Retain
    # reclaim policy keeps the NFS data — data safe.
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: mealie
spec:
  claimRef:
    namespace: recipes
    name: mealie-pg-dump
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    # Hostname, not IP: xprtsec=tls verifies the server cert (SAN *.esweiss.com).
    server: pve-nas-01.${cluster_internal_domain}
    path: /backups-apps/mealie
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-pg-dump
  namespace: recipes
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
  volumeName: mealie-pg-dump
