    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bar-assistant-data
  namespace: recipes
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
