---
# Recipes storage: app configs on NFS (/appdata/{app} from pve-nas-01);
# Mealie PostgreSQL on a dedicated ZFS zvol (hostPath on k3s-agt-nas-01).
#
# The NFS PVs use server: pve-nas-01.esweiss.com (NOT the IP) so xprtsec=tls
# matches the *.esweiss.com cert. server: is an immutable PV field — the live
# IP->hostname cutover deletes+recreates each PV (Retain → data safe) and rolls
# the consuming pod. See docs/16 cutover procedure.

# =============================================================================
# Mealie App Config Storage
# =============================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: recipes-appdata-mealie
  labels:
    type: nfs
    app: mealie
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    # Hostname, not IP: xprtsec=tls verifies the server cert (SAN *.esweiss.com).
    # The IP fails cert verification; pve-nas-01.esweiss.com resolves to .102 via
    # AdGuard and matches the wildcard. See docs/07 Transport Security.
    server: pve-nas-01.esweiss.com
    path: /appdata/mealie
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    # Encrypt the /appdata wire with tlshd (on every agent). The export is
    # permissive (none:tls), so TLS is client-driven via this option.
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-data
  namespace: recipes
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 10Gi
  volumeName: recipes-appdata-mealie

---
# Mealie PostgreSQL Storage (persistent zvol on k3s-agt-nas-01)
# Uses dedicated ZFS zvol mounted at /mnt/mealie-postgres-data
# Data survives pod/VM recreation
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mealie-postgres-data
spec:
  capacity:
    storage: 32Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/mealie-postgres-data
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-agt-nas-01

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-postgres
  namespace: recipes
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 32Gi
  volumeName: mealie-postgres-data

---
# =============================================================================
# Bar Assistant App Config Storage
# =============================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: recipes-appdata-bar-assistant
  labels:
    type: nfs
    app: bar-assistant
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    # Hostname, not IP: xprtsec=tls verifies the server cert (SAN *.esweiss.com).
    # The IP fails cert verification; pve-nas-01.esweiss.com resolves to .102 via
    # AdGuard and matches the wildcard. See docs/07 Transport Security.
    server: pve-nas-01.esweiss.com
    path: /appdata/bar-assistant
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    # Encrypt the /appdata wire with tlshd (on every agent). The export is
    # permissive (none:tls), so TLS is client-driven via this option.
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bar-assistant-data
  namespace: recipes
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 10Gi
  volumeName: recipes-appdata-bar-assistant
