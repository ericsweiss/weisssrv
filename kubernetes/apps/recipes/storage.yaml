---
# Recipes storage: app configs on NFS (/appdata/{app} from pve-nas-01);
# Mealie PostgreSQL on a dedicated ZFS zvol (hostPath on k3s-agt-nas-01).
#
# The NFS PVs use server: pve-nas-01.esweiss.com (NOT the IP) so xprtsec=tls
# matches the *.esweiss.com cert. server: is an immutable PV field — the force
# annotation on each PV lets Flux delete+recreate it (Retain → data safe).

# Mealie App Config Storage
apiVersion: v1
kind: PersistentVolume
metadata:
  name: recipes-appdata-mealie
  annotations:
    # Lets Flux delete+recreate this PV when an immutable field (server,
    # mountOptions) changes, instead of stalling the Kustomization. Retain
    # reclaim policy keeps the NFS data — data safe.
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: mealie
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    # Hostname, not IP: xprtsec=tls verifies the server cert (SAN *.esweiss.com).
    # The IP fails cert verification; pve-nas-01.esweiss.com resolves to .102 via
    # AdGuard and matches the wildcard. See docs/07 Transport Security.
    server: pve-nas-01.${cluster_internal_domain}
    path: /appdata/mealie
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    # Encrypt the /appdata wire with tlshd (on every agent). The /appdata
    # k3s client lines require TLS (xprtsec=tls) — plaintext is rejected.
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-data
  namespace: recipes
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 10Gi
  volumeName: recipes-appdata-mealie

---
# Mealie PostgreSQL: dedicated ZFS zvol mounted at /mnt/mealie-postgres-data on
# k3s-agt-nas-01, so the data survives pod and VM recreation.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mealie-postgres-data
  labels:
    type: local
    app: mealie
spec:
  claimRef:
    namespace: recipes
    name: mealie-postgres
  capacity:
    storage: 32Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/mealie-postgres-data
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-agt-nas-01

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-postgres
  namespace: recipes
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 32Gi
  volumeName: mealie-postgres-data

