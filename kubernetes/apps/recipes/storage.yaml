---
# Recipes storage: app configs on NFS-over-TLS (/appdata/{app} from
# pve-nas-01); Mealie PostgreSQL on a ZFS zvol (hostPath on k3s-agt-nas-01).
# Hostname and force-annotation notes: _nfs-pv/resources.yaml and docs/07.

# Mealie App Config Storage
apiVersion: v1
kind: PersistentVolume
metadata:
  name: recipes-appdata-mealie
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: mealie
spec:
  # Pre-bind to the intended claim so no other empty-storageClass PVC can grab
  # this PV first.
  claimRef:
    namespace: recipes
    name: mealie-data
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: pve-nas-01.${cluster_internal_domain}
    path: /appdata/mealie
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-data
  namespace: recipes
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 10Gi
  volumeName: recipes-appdata-mealie

---
# Mealie PostgreSQL: dedicated ZFS zvol mounted at /mnt/mealie-postgres-data on
# k3s-agt-nas-01, so the data survives pod and VM recreation.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mealie-postgres-data
  labels:
    type: local
    app: mealie
spec:
  claimRef:
    namespace: recipes
    name: mealie-postgres
  capacity:
    storage: 32Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/mealie-postgres-data
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-agt-nas-01

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-postgres
  namespace: recipes
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 32Gi
  volumeName: mealie-postgres-data

