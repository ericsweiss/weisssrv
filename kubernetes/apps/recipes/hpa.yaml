---
# salt-rim is a stateless nginx frontend: min=2 is an HA floor, above it is burst
# headroom. The Deployment omits .spec.replicas so server-side apply does not
# fight this HPA, and salt-rim's VPA is memory-only so CPU is owned here.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: salt-rim
  namespace: recipes
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: salt-rim
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  # The CPU target is effectively inert at this load, so the behavior block is
  # what earns its keep: it damps a single scrape-window blip that would
  # otherwise jump straight to max and park there for the downscale window.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
