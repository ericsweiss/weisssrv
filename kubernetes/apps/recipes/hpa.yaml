---
# salt-rim is a stateless nginx frontend, so min=2 is an HA floor and anything
# above it is burst headroom. The Deployment omits .spec.replicas so Flux's
# server-side apply does not contend with this HPA, and salt-rim's VPA is
# memory-only so CPU is owned here alone.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: salt-rim
  namespace: recipes
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: salt-rim
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  # The CPU target is effectively inert at this load, so the behavior block is
  # what earns its keep: it damps a single scrape-window blip that would
  # otherwise jump straight to max and park there for the downscale window.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
# Keep at least one salt-rim replica during voluntary disruption (node drains,
# rolling upgrades) so the Bar Assistant UI stays reachable.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: salt-rim
  namespace: recipes
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: salt-rim
