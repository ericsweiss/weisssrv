---
# Consolidated recipes-stack secrets sourced from 1Password.
# Replaces the previously kubectl-created `mealie-secrets` and
# `bar-assistant-secrets` Secrets with a single Owner-managed Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recipes-secrets
  namespace: recipes
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: recipes-secrets
    creationPolicy: Owner
  data:
    # Mealie Secrets
    - secretKey: mealie-postgres-password
      remoteRef:
        key: Mealie Secrets
        property: postgres-password
    # Mealie SSO
    - secretKey: mealie-oidc-client-id
      remoteRef:
        key: Mealie SSO
        property: oidc-client-id
    - secretKey: mealie-oidc-client-secret
      remoteRef:
        key: Mealie SSO
        property: oidc-client-secret
    # Bar Assistant Secrets
    - secretKey: bar-assistant-meilisearch-master-key
      remoteRef:
        key: Bar Assistant Secrets
        property: meilisearch-master-key
    # Bar Assistant SSO
    - secretKey: bar-assistant-authentik-client-id
      remoteRef:
        key: Bar Assistant SSO
        property: authentik-client-id
    - secretKey: bar-assistant-authentik-client-secret
      remoteRef:
        key: Bar Assistant SSO
        property: authentik-client-secret
    # SMTP Relay Auth (shared between Mealie and Bar Assistant)
    - secretKey: smtp-username
      remoteRef:
        key: SMTP Relay Auth
        property: username
    - secretKey: smtp-password
      remoteRef:
        key: SMTP Relay Auth
        property: password
