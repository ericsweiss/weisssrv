---
# Consolidated recipes-stack secrets sourced from 1Password.
# Replaces the previously kubectl-created `mealie-secrets` and
# `bar-assistant-secrets` Secrets with a single Owner-managed Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recipes-secrets
  namespace: recipes
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: recipes-secrets
    creationPolicy: Owner
  data:
    # Mealie Secrets
    - secretKey: mealie-postgres-password
      remoteRef:
        key: xy6okwaamcebndtoxfwysia5tm/postgres-password  # Mealie Secrets
    # Mealie SSO
    - secretKey: mealie-oidc-client-id
      remoteRef:
        key: a4sbdyo2akkj3yum4qzx2bc5y4/oidc-client-id  # Mealie SSO
    - secretKey: mealie-oidc-client-secret
      remoteRef:
        key: a4sbdyo2akkj3yum4qzx2bc5y4/oidc-client-secret  # Mealie SSO
    # Bar Assistant Secrets
    - secretKey: bar-assistant-meilisearch-master-key
      remoteRef:
        key: 35fas2f7mebleyrj6xui6axqkm/meilisearch-master-key  # Bar Assistant Secrets
    # Bar Assistant SSO
    - secretKey: bar-assistant-authentik-client-id
      remoteRef:
        key: sb2zpidvom277uwbfanggbcnce/authentik-client-id  # Bar Assistant SSO
    - secretKey: bar-assistant-authentik-client-secret
      remoteRef:
        key: sb2zpidvom277uwbfanggbcnce/authentik-client-secret  # Bar Assistant SSO
    # SMTP Relay Auth (shared between Mealie and Bar Assistant)
    - secretKey: smtp-username
      remoteRef:
        key: t7467o7ebr72s2ao223mtbv6ba/username  # SMTP Relay Auth
    - secretKey: smtp-password
      remoteRef:
        key: t7467o7ebr72s2ao223mtbv6ba/password  # SMTP Relay Auth
