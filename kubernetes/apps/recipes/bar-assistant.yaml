---
# Bar Assistant (bar.esweiss.com / bar.ericsweiss.com) — four workloads laid out
# as in the upstream Docker setup: the Laravel API on SQLite, the Salt Rim Vue
# frontend, Meilisearch for full-text search, and Redis for cache + sessions.
# docs/23.


# Redis (cache and session storage)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bar-assistant-redis
  namespace: recipes
  labels:
    app.kubernetes.io/name: bar-assistant-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: bar-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bar-assistant-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bar-assistant-redis
        app.kubernetes.io/component: cache
    spec:
      # No kube-API use. runAsNonRoot/runAsUser deliberately NOT pinned: the
      # image starts as root and gosu-drops to redis itself, so forcing a
      # non-root UID risks startup.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Pin to NAS agent for storage locality
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s-agt-nas-01
      tolerations:
        - key: ${cluster_node_label_domain}/nas
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
      containers:
        - name: redis
          image: redis:${redis_version}
          imagePullPolicy: IfNotPresent
          # Cap the dataset under the 256Mi container limit (headroom for redis
          # overhead/fragmentation) and evict LRU keys rather than growing to an
          # OOMKill. Also gives redis_memory_max_bytes a non-zero value so the
          # dashboard Memory Usage gauge stops dividing by 0. args (not command)
          # so the image entrypoint still gosu-drops to the redis user.
          args:
            - redis-server
            - --maxmemory
            - 192mb
            - --maxmemory-policy
            - allkeys-lru
          # No drop:[ALL]/aPE:false — the gosu drop needs CAP_SETUID.
          env:
            # Accepted tradeoff: this cache holds sessions but is reachable only
            # from the bar-assistant pod and the redis-exporter
            # (networkpolicy.yaml). Any further workload in `recipes` means
            # switching to a REDIS_PASSWORD from recipes-secrets.
            - name: ALLOW_EMPTY_PASSWORD
              value: "yes"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: bar-assistant-redis
  namespace: recipes
  labels:
    app.kubernetes.io/name: bar-assistant-redis
spec:
  selector:
    app.kubernetes.io/name: bar-assistant-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  type: ClusterIP

---
# Meilisearch (search engine - using v1.15 per official docker-compose)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bar-assistant-meilisearch
  namespace: recipes
  labels:
    app.kubernetes.io/name: bar-assistant-meilisearch
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: bar-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bar-assistant-meilisearch
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bar-assistant-meilisearch
        app.kubernetes.io/component: search
    spec:
      # No kube-API use. The image runs as root and may chown /meili_data on
      # start, so runAsNonRoot and container drop-ALL/aPE:false are omitted —
      # same call as redis above.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Pin to NAS agent for storage locality
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s-agt-nas-01
      tolerations:
        - key: ${cluster_node_label_domain}/nas
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:${meilisearch_version}
          imagePullPolicy: IfNotPresent
          # No drop:[ALL]/aPE:false — the root start chowns its data dir.
          env:
            - name: MEILI_ENV
              value: production
            - name: MEILI_EXPERIMENTAL_ENABLE_METRICS
              value: "true"
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: recipes-secrets
                  key: bar-assistant-meilisearch-master-key
            - name: MEILI_NO_ANALYTICS
              value: "true"
          ports:
            - name: http
              containerPort: 7700
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /meili_data
              subPath: meilisearch
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bar-assistant-data

---
apiVersion: v1
kind: Service
metadata:
  name: bar-assistant-meilisearch
  namespace: recipes
  labels:
    app.kubernetes.io/name: bar-assistant-meilisearch
spec:
  selector:
    app.kubernetes.io/name: bar-assistant-meilisearch
  ports:
    - name: http
      port: 7700
      targetPort: http
  type: ClusterIP

---
# Bar Assistant API (Laravel backend with SQLite)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bar-assistant
  namespace: recipes
  labels:
    app.kubernetes.io/name: bar-assistant
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: bar-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bar-assistant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bar-assistant
        app.kubernetes.io/component: api
    spec:
      # No kube-API use. The image runs unprivileged as www-data, but its SQLite
      # and uploads live on a PVC that may not be 33-owned, so runAsNonRoot and
      # fsGroup are NOT forced — that would risk migration write failures.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Pin to NAS agent for storage locality (same as redis/meilisearch)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s-agt-nas-01
      tolerations:
        - key: ${cluster_node_label_domain}/nas
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
      containers:
        - name: bar-assistant
          image: barassistant/server:${bar_assistant_version}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: APP_URL
              value: https://bar.${cluster_external_domain}
            - name: MEILISEARCH_HOST
              value: http://bar-assistant-meilisearch:7700
            - name: MEILISEARCH_KEY
              valueFrom:
                secretKeyRef:
                  name: recipes-secrets
                  key: bar-assistant-meilisearch-master-key
            - name: REDIS_HOST
              value: bar-assistant-redis
            - name: CACHE_DRIVER
              value: redis
            - name: SESSION_DRIVER
              value: redis
            # Mail configuration (SASL-authenticated relay via smtp-relay.esweiss.com)
            - name: MAIL_MAILER
              value: smtp
            - name: MAIL_HOST
              value: smtp-relay.${cluster_internal_domain}
            - name: MAIL_PORT
              value: "587"
            - name: MAIL_ENCRYPTION
              value: tls
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: recipes-secrets
                  key: smtp-username
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recipes-secrets
                  key: smtp-password
            - name: MAIL_FROM_ADDRESS
              value: bar-assistant@${cluster_internal_domain}
            - name: MAIL_FROM_NAME
              value: Bar Assistant
            - name: AUTHENTIK_BASE_URL
              value: https://auth.${cluster_external_domain}
            - name: AUTHENTIK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: recipes-secrets
                  key: bar-assistant-authentik-client-id
            - name: AUTHENTIK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: recipes-secrets
                  key: bar-assistant-authentik-client-secret
            - name: AUTHENTIK_REDIRECT_URI
              value: https://bar.${cluster_external_domain}/oauth/callback
            # Required so Authentik logins can auto-create/link an account.
            # Who may sign in is gated by the authentik binding on the `bar`
            # application (terraform/authentik/policy_bindings.tf), not here.
            - name: ALLOW_REGISTRATION
              value: "true"
            - name: ENABLE_PASSWORD_LOGIN
              value: "false"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/server/version
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30  # Up to 5 minutes for initial startup/migration
          livenessProbe:
            httpGet:
              path: /api/server/version
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/server/version
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/www/cocktails/storage/bar-assistant
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bar-assistant-data

---
apiVersion: v1
kind: Service
metadata:
  name: bar-assistant
  namespace: recipes
  labels:
    app.kubernetes.io/name: bar-assistant
spec:
  selector:
    app.kubernetes.io/name: bar-assistant
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP

---
# Salt Rim Configuration (config.js)
apiVersion: v1
kind: ConfigMap
metadata:
  name: salt-rim-config
  namespace: recipes
data:
  config.js: |
    window.srConfig = {
      API_URL: "https://bar.${cluster_external_domain}",
      MEILISEARCH_URL: "/search",
      DEFAULT_LOCALE: "en-US"
    };

---
# Salt Rim (Bar Assistant Web UI)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: salt-rim
  namespace: recipes
  labels:
    app.kubernetes.io/name: salt-rim
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: bar-assistant
  annotations:
    # config.js is a subPath ConfigMap mount, which the kubelet never updates in
    # place — without this a git edit reconciles the ConfigMap and never reaches
    # the pod.
    reloader.stakater.com/auto: "true"
spec:
  # No static replicas: the salt-rim HPA (hpa.yaml) owns the count. Setting it
  # here would make Flux server-side apply fight the HPA on every reconcile.
  selector:
    matchLabels:
      app.kubernetes.io/name: salt-rim
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: salt-rim
        app.kubernetes.io/component: frontend
    spec:
      affinity:
        # Prefer non-NAS nodes for general workloads.
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: ${cluster_node_label_domain}/nas
                    operator: DoesNotExist
        # Spread the HPA-driven replicas across hosts so a single-node drain
        # doesn't take the UI offline.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: salt-rim
                topologyKey: kubernetes.io/hostname
      nodeSelector:
        ${cluster_node_label_domain}/general: "true"
      # Static nginx frontend: already non-root on :8080, so drop-ALL +
      # aPE:false are safe. runAsUser unpinned — the image sets uid 33 itself.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: salt-rim
          image: barassistant/salt-rim:${salt_rim_version}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: API_URL
              value: ""
            - name: MEILISEARCH_URL
              value: "/search"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: salt-rim-config

---
apiVersion: v1
kind: Service
metadata:
  name: salt-rim
  namespace: recipes
  labels:
    app.kubernetes.io/name: salt-rim
spec:
  selector:
    app.kubernetes.io/name: salt-rim
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
