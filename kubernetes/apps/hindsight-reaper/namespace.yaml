---
# Dedicated namespace for the Hindsight GPU-admission pod reaper CronJob. It
# keeps the reaper's kube-API egress out of hindsight's tight per-pod
# NetworkPolicy: here netpol-egress-{dns,apiserver} select the whole namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: hindsight-reaper
  labels:
    app.kubernetes.io/name: hindsight-reaper
    app.kubernetes.io/managed-by: flux
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
