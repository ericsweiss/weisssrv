---
# Hindsight admission-rejected pod reaper. The program is hindsight-reaper.py in
# this directory, mounted from the configMapGenerator in kustomization.yaml; unit
# tests in scripts/test_hindsight_reaper.py. Root cause (GPU-node reboot
# admission race) and why prevention would need the GPU Operator:
# docs/43-gpu-passthrough.md § Reaping admission-rejected pods.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hindsight-reaper
  namespace: hindsight-reaper
spec:
  # Failed pods only appear on a GPU-node reboot (infrequent), so a 6-hourly
  # sweep clears them well before they accumulate; there is no leak rate to
  # chase like the runner reaper's */15.
  schedule: "17 */6 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # Never overlap reaper runs.
  jobTemplate:
    spec:
      # Hard ceiling for the WHOLE Job, retries included — not per attempt. Holds
      # backoffLimit+1 = 3 attempts of the script's soft BUDGET_SECONDS (60s)
      # plus one API_TIMEOUT_SECONDS (10s) overrun and pod startup each:
      # 3 * ~75s, with margin.
      activeDeadlineSeconds: 240
      # Delete the reaper's OWN finished Job pods after 1h so it does not itself
      # leak pods.
      ttlSecondsAfterFinished: 3600
      # Retry on a transient API blip; a persistent failure (e.g. broken RBAC)
      # exhausts this and surfaces as a failed Job (the script exits non-zero on
      # any non-race list/delete error).
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: true
          serviceAccountName: hindsight-reaper
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reaper
              # The SAME trusted, digest-pinned image the runner reaper and
              # cloudflare-ddns run — python:3.14-slim has reliable date math
              # (datetime.fromisoformat), is already vetted here, and needs no
              # new image or version-pin. Digest-pinned because this is a
              # pod-DELETING workload.
              image: python:3.14-slim@sha256:b877e50bd90de10af8d82c57a022fc2e0dc731c5320d762a27986facfc3355c1
              command:
                - python3
                - /opt/reaper/hindsight-reaper.py
              env:
                - name: NAMESPACE
                  value: "hindsight"
                - name: MIN_AGE_MINUTES
                  value: "30"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: script
                  mountPath: /opt/reaper
                  readOnly: true
          volumes:
            - name: script
              configMap:
                # kustomize rewrites this to the hashed generator name, so a
                # script edit rolls a new ConfigMap instead of mutating in place.
                name: hindsight-reaper-script
                defaultMode: 0555
