---
# Hindsight admission-rejected pod reaper. The program is hindsight-reaper.py
# here, mounted from the configMapGenerator in kustomization.yaml.
# Background: docs/43-gpu-passthrough.md § Reaping admission-rejected pods.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hindsight-reaper
  namespace: hindsight-reaper
spec:
  # Failed pods only appear on a GPU-node reboot (infrequent), so a 6-hourly
  # sweep clears them well before they accumulate; there is no leak rate to
  # chase like the runner reaper's */15.
  schedule: "17 */6 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # Never overlap reaper runs.
  jobTemplate:
    spec:
      # Ceiling for the whole Job, retries included, not per attempt. Holds
      # 3 attempts of the script's 60s budget plus a 10s API overrun and startup.
      activeDeadlineSeconds: 240
      # Bounds how long a finished Job object lingers, leaving a half-day to
      # inspect a failure (the history limits bound the count).
      ttlSecondsAfterFinished: 43200
      # Retry on a transient API blip; a persistent failure (e.g. broken RBAC)
      # exhausts this and surfaces as a failed Job (the script exits non-zero on
      # any non-race list/delete error).
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: true
          serviceAccountName: hindsight-reaper
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reaper
              # The same digest-pinned image the runner reaper and cloudflare-ddns
              # run. Digest-pinned because this workload deletes pods.
              image: python:3.14-slim@sha256:b877e50bd90de10af8d82c57a022fc2e0dc731c5320d762a27986facfc3355c1
              command:
                - python3
                - /opt/reaper/hindsight-reaper.py
              env:
                - name: NAMESPACE
                  value: "hindsight"
                - name: MIN_AGE_MINUTES
                  value: "30"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: script
                  mountPath: /opt/reaper
                  readOnly: true
          volumes:
            - name: script
              configMap:
                # kustomize rewrites this to the hashed generator name, so a
                # script edit rolls a new ConfigMap instead of mutating in place.
                name: hindsight-reaper-script
                defaultMode: 0555
