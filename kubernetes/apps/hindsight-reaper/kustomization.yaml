---
# CRITICAL: no top-level `namespace:` directive. kustomize's namespace transformer
# overrides each resource's explicit metadata.namespace, which would drag the Role and
# RoleBinding out of the hindsight namespace and silently break the cross-namespace
# grant. Every resource here carries its own namespace instead.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - cronjob.yaml

# The reaper only talks to the kube-API, so kube-dns plus apiserver is its whole
# egress. Nothing serves traffic, hence the baseline ingress deny.
components:
  - ../../components/netpol-baseline
  - ../../components/netpol-egress-dns
  - ../../components/netpol-egress-apiserver

# The CronJob's program. It lives beside this kustomization because kustomize
# refuses generator sources outside the kustomization root; its unit tests are
# scripts/test_hindsight_reaper.py.
configMapGenerator:
  - name: hindsight-reaper-script
    namespace: hindsight-reaper
    files:
      - hindsight-reaper.py

patches:
  # With no top-level namespace transformer, the component-shipped policies are
  # namespaced here. `name` is a regex.
  - target:
      kind: NetworkPolicy
      name: (default-deny-ingress|allow-egress-dns|allow-egress-apiserver)
    patch: |
      - op: add
        path: /metadata/namespace
        value: hindsight-reaper
