---
# RBAC for the Hindsight admission-pod reaper: a ServiceAccount here, plus a
# namespaced Role granting only pods list/delete in the hindsight namespace and
# a RoleBinding to it. A RoleBinding may reference a SA in another namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hindsight-reaper
  namespace: hindsight-reaper
  labels:
    app.kubernetes.io/managed-by: flux
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hindsight-reaper
  namespace: hindsight
  labels:
    app.kubernetes.io/managed-by: flux
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hindsight-reaper
  namespace: hindsight
  labels:
    app.kubernetes.io/managed-by: flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hindsight-reaper
subjects:
  - kind: ServiceAccount
    name: hindsight-reaper
    namespace: hindsight-reaper
