# Traefik Helm Chart Values
# Ingress controller for esweiss.com homelab k3s cluster

# Deployment configuration
deployment:
  replicas: 2  # HA with 2 replicas
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"

# Service configuration (external/public traffic - *.ericsweiss.com)
# Note: traefik-internal-service.yaml provides separate LoadBalancer for internal traffic (*.esweiss.com) on .101
service:
  type: LoadBalancer
  annotations:
    # Use MetalLB public pool for external Traefik traffic
    metallb.universe.tf/loadBalancerIPs: "192.168.0.100"
  # Preserve source IP for IP allowlist middleware to work correctly
  spec:
    externalTrafficPolicy: Local

# Enable dashboard
ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.esweiss.com`)
    entryPoints:
      - websecure

# Logging
logs:
  general:
    level: INFO
  access:
    enabled: true
    format: json

# Metrics
metrics:
  prometheus:
    enabled: true
    entryPoint: metrics

# Providers
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true

# Ports configuration
ports:
  web:
    port: 80
  websecure:
    port: 443
    tls:
      enabled: true

# Global HTTP to HTTPS redirect
additionalArguments:
  - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
  - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
  - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

# Node selector - prefer ingress nodes
nodeSelector:
  esweiss.com/ingress: "true"

# Tolerations for scheduling
tolerations: []

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
