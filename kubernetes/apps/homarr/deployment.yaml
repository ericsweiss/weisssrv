---
# Homarr dashboard (docs/41) — one Next.js container on :7575, state in env +
# the SQLite DB on the NFS volume. Recreate + replicas 1: the RWO volume backs
# a single-writer SQLite store and must never be dual-mounted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr
  namespace: homarr
  labels:
    app.kubernetes.io/name: homarr
    app.kubernetes.io/part-of: homarr
  annotations:
    # NODE_EXTRA_CA_CERTS is read once at Node.js start, so a pve-root-ca
    # ConfigMap rotation only reaches the app via a pod restart.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homarr
        app.kubernetes.io/part-of: homarr
    spec:
      # NAS-avoid: state lives on NFS, not a node-local zvol, so nothing ties
      # this pod to the NAS agent. modern CPU keeps the Node/Next.js image off
      # the Core2-era legacy nodes.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: ${cluster_node_label_domain}/nas
                    operator: DoesNotExist
      nodeSelector:
        ${cluster_node_label_domain}/general: "true"
        ${cluster_node_label_domain}/cpu: "modern"
      # No in-cluster API access.
      automountServiceAccountToken: false
      # nginx-fronted: run.sh templates /etc/nginx/nginx.conf at boot, so the
      # image needs its root entrypoint — pinning runAsUser breaks that and
      # nothing listens on :7575. Data writes land 1000:2000 via all_squash.
      securityContext:
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          # ClusterFirst pod on the DNAT'd kube-dns path — fresh socket for the
          # second parallel A/AAAA query avoids the ~5s conntrack DNAT race.
          - name: single-request-reopen
      containers:
        - name: homarr
          # Public image (no imagePullSecret). homarr_version is a
          # v-prefixed docker tag, unlike every other pin in all.yml.
          image: ghcr.io/homarr-labs/homarr:${homarr_version}
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: ${cluster_timezone}
            # Trust the PVE cluster CA for the Proxmox integration's
            # https://<node>:8006 calls (see pve-ca-configmap.yaml).
            # NODE_EXTRA_CA_CERTS extends the default store, never replaces it.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/pve/pve-root-ca.pem
            # Encrypts the integration credentials Homarr stores in the SQLite
            # DB (openssl rand -hex 32). REQUIRED — see externalsecret.yaml.
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: homarr-secrets
                  key: secret-encryption-key
            # SSO-only: OIDC (Authentik) is the sole login provider and admin
            # comes from the `homarr-admins` groups claim, not from first login.
            # Authentik-outage break-glass: docs/41 §SSO.
            - name: AUTH_PROVIDERS
              value: "oidc"
            - name: AUTH_OIDC_CLIENT_ID
              value: homarr
            - name: AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: homarr-secrets
                  key: oidc-client-secret
            # Issuer = the `dashboard` slug on the EXTERNAL authentik host, WITH
            # the trailing slash discovery requires. In-pod that name resolves
            # to Traefik VIP .101, so discovery rides the traefik egress rule.
            - name: AUTH_OIDC_ISSUER
              value: https://auth.${cluster_external_domain}/application/o/dashboard/
            # Authorize endpoint, set for parity with the goauthentik integration
            # docs; harmless if v1 ignores it (discovery covers authorize/token/jwks).
            - name: AUTH_OIDC_URI
              value: https://auth.${cluster_external_domain}/application/o/authorize/
            # Login-button label.
            - name: AUTH_OIDC_CLIENT_NAME
              value: Authentik
            # Do NOT append `groups`: Authentik has no scope named `groups`; the
            # groups claim rides inside the default `profile` scope mapping
            # (same as Grafana's role mapping — kube-prometheus-stack).
            - name: AUTH_OIDC_SCOPE_OVERWRITE
              value: "openid email profile"
            # Reads the `groups` claim -> same-named Homarr groups. The
            # `homarr-admins` group (Authentik) maps to the Homarr admin group of
            # the same name (created at onboarding — docs/41 checklist).
            - name: AUTH_OIDC_GROUPS_ATTRIBUTE
              value: groups
            # No silent auto-redirect to Authentik (login page still shows the
            # explicit SSO button; harmless with credentials retired).
            - name: AUTH_OIDC_AUTO_LOGIN
              value: "false"
            # NextAuth must trust Traefik's forwarded Host to build the right
            # per-hostname callback. Safe here: Traefik overwrites those headers
            # and the NetworkPolicy admits only Traefik to :7575.
            - name: AUTH_TRUST_HOST
              value: "true"
          ports:
            - name: http
              containerPort: 7575
              protocol: TCP
          # tcpSocket, not httpGet: Homarr is a redirect-heavy SPA, so a
          # listener-up check is the honest health signal. startupProbe covers
          # the first Next.js boot + SQLite migration on the NFS volume.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # Hand-set limit (VPA is RequestsOnly - docs/33): 896Mi = 30d
          # working-set peak (548Mi) +60%. The request tracks the VPA target, so
          # a pod admitted while that webhook is down is still sized right.
          resources:
            requests:
              cpu: 50m
              memory: 576Mi
            limits:
              # No CPU limit (repo policy — docs/33); memory capped.
              memory: 896Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # The root entrypoint's needs, nothing more: chown data dirs,
              # setuid/setgid so nginx workers drop to the unprivileged user,
              # DAC_OVERRIDE for nginx's /var/lib/nginx dirs (else EACCES).
              add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE"]
            # run.sh writes /etc/nginx/nginx.conf + nginx tmp/cache dirs and
            # Next.js writes cache/tmp under the app tree — rootfs must be
            # writable (matches the mealie/*arr non-s6 web apps).
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: data
              mountPath: /appdata
            - name: pve-root-ca
              mountPath: /etc/ssl/pve
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homarr-data
        - name: pve-root-ca
          configMap:
            name: pve-root-ca
