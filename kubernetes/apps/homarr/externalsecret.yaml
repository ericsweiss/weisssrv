---
# CRITICAL: both fields must exist on the "Homarr SSO" 1Password item before
# this merges; a missing field fails the whole Secret sync. secret-encryption-key
# encrypts the integration credentials in Homarr's SQLite DB, so losing it makes
# every stored credential unreadable. terraform/authentik injects the same
# oidc-client-secret field into the provider, so the two cannot disagree
# (docs/40, docs/41).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homarr-secrets
  namespace: homarr
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: homarr-secrets
    creationPolicy: Owner
  data:
    - secretKey: oidc-client-secret
      remoteRef:
        key: Homarr SSO
        property: client-secret
    - secretKey: secret-encryption-key
      remoteRef:
        key: Homarr SSO
        property: secret-encryption-key
