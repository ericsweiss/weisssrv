---
# Homarr runtime secrets sourced from 1Password via ESO (onepassword-connect
# provider). Two fields off the single "Homarr SSO" item:
#   * oidc-client-secret    -> AUTH_OIDC_CLIENT_SECRET (the Authentik OIDC
#     client secret; terraform/authentik injects the SAME 1P field into the
#     provider via TF_VAR_oauth2_client_secret_homarr, so the two sides can
#     never disagree — docs/40, docs/41).
#   * secret-encryption-key -> SECRET_ENCRYPTION_KEY (openssl rand -hex 32;
#     encrypts the integration credentials Homarr stores in the SQLite DB —
#     LOSING IT makes every stored integration credential unreadable, so it
#     must live in 1Password, never only in the DB).
#
# Both fields MUST exist on the "Homarr SSO" item BEFORE this manifest merges:
# a missing field fails the whole Secret sync and the pod waits on the absent
# key. No registry-pull secret — ghcr.io/homarr-labs/homarr is a public image.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homarr-secrets
  namespace: homarr
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: homarr-secrets
    creationPolicy: Owner
  data:
    - secretKey: oidc-client-secret
      remoteRef:
        key: Homarr SSO
        property: client-secret
    - secretKey: secret-encryption-key
      remoteRef:
        key: Homarr SSO
        property: secret-encryption-key
