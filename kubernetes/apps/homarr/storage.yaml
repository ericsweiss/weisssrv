---
# NFS-backed Homarr state (SQLite DB, boards, icons, credentials) on encrypted
# ssd/appdata. SQLite takes one writer, so replicas: 1 + Recreate keep two pods
# off this RWO PV; docs/41 and apps/download-clients/_nfs-pv carry the rest.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: homarr-data
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: homarr
spec:
  # Pre-bind to the intended claim so no other empty-storageClass PVC can grab
  # this PV first (which would block Homarr or expose the wrong NFS path).
  claimRef:
    namespace: homarr
    name: homarr-data
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: pve-nas-01.${cluster_internal_domain}
    path: /appdata/homarr
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homarr-data
  namespace: homarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 2Gi
  volumeName: homarr-data
