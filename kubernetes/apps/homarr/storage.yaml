---
# NFS-backed persistent state for Homarr — the SQLite DB (default
# /appdata/db/db.sqlite), board config, uploaded icons and the encrypted
# integration credentials, all under a single writable mount at /appdata.
# Lives on the encrypted ssd/appdata dataset via the appdata NFS export;
# captured by the nightly ssd/appdata -> archive raw-ZFS replication (child of
# an existing backup root — no SRC_LIST edit needed). The export uses
# all_squash,anonuid=1000,anongid=2000, so every container write maps to
# 1000:2000 on the NAS regardless of the in-container UID; the /appdata/homarr
# subdir is created + owned 1000:2000 by the nas_storage role (nas_appdata_dirs).
#
# SQLite-on-NFS note (deliberate — same pattern hindsight already runs on this
# export): SQLite tolerates exactly ONE writer. replicas: 1 + strategy Recreate
# (deployment.yaml) guarantee no two pods ever dual-mount this RWO PV, which is
# what makes SQLite-over-NFS safe here. The volume is hard-mounted NFSv4.2. If
# WAL/locking ever bites, the follow-up is a dedicated ext4-on-zvol PV
# (NAS-pinned, like the Postgres apps) — documented in docs/41, not now.
#
# server: is an immutable PV field; the kustomize force annotation lets Flux
# delete+recreate it if server/mountOptions ever change (Retain -> data safe).
# Hostname (not IP) is required so xprtsec=tls verifies against the
# *.esweiss.com cert SAN — an IP mount fails the TLS handshake. See docs/07.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: homarr-data
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: homarr
spec:
  # Pre-bind to the intended claim so no other empty-storageClass PVC can grab
  # this PV first (which would block Homarr or expose the wrong NFS path).
  claimRef:
    namespace: homarr
    name: homarr-data
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: pve-nas-01.esweiss.com
    path: /appdata/homarr
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    # The /appdata k3s client export lines require TLS (xprtsec=tls); plaintext
    # is rejected. tlshd runs on every agent (nfs_tls role).
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homarr-data
  namespace: homarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 2Gi
  volumeName: homarr-data
