---
# NFS-backed persistent state for Homarr — the SQLite DB, board config, icons
# and the encrypted integration credentials, all under one writable /appdata
# mount. Lives on the encrypted ssd/appdata dataset, so the nightly
# ssd/appdata -> archive replication captures it; the export's all_squash maps
# every write to 1000:2000 and the nas_storage role owns the subdir.
#
# SQLite-on-NFS is deliberate: SQLite tolerates exactly one writer, and
# replicas: 1 + Recreate (deployment.yaml) guarantee no two pods dual-mount this
# RWO PV. docs/41 records the ext4-on-zvol fallback if WAL/locking ever bites.
#
# NFS-over-TLS PV; hostname (not IP) + force annotation rationale:
# apps/download-clients/_nfs-pv/resources.yaml and docs/07.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: homarr-data
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    type: nfs
    app: homarr
spec:
  # Pre-bind to the intended claim so no other empty-storageClass PVC can grab
  # this PV first (which would block Homarr or expose the wrong NFS path).
  claimRef:
    namespace: homarr
    name: homarr-data
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: pve-nas-01.${cluster_internal_domain}
    path: /appdata/homarr
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    - xprtsec=tls

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homarr-data
  namespace: homarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 2Gi
  volumeName: homarr-data
