---
# CRITICAL: Homarr runs its own Authentik OIDC gate (AUTH_PROVIDERS in
# deployment.yaml), so there is no forward-auth middleware here and Traefik
# passes straight through. The internal route scopes to LAN/Tailscale sources.
# Authentik objects live in terraform/authentik (docs/40).

# External - dashboard.ericsweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homarr
  namespace: homarr
  annotations:
    # external-dns auto-creates the Cloudflare record — no terraform/cloudflare
    # edit (same as hermes).
    external-dns.alpha.kubernetes.io/target: ${cluster_external_domain}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dashboard.${cluster_external_domain}`)
      kind: Rule
      middlewares:
        - name: hsts-header
          namespace: traefik
      services:
        - name: homarr
          port: 7575
  tls:
    secretName: homarr-ericsweiss-tls

---
# Internal - dashboard.esweiss.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homarr-internal
  namespace: homarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dashboard.${cluster_internal_domain}`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: homarr
          port: 7575
  tls:
    secretName: homarr-esweiss-tls
