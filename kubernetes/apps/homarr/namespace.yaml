---
apiVersion: v1
kind: Namespace
metadata:
  name: homarr
  labels:
    app.kubernetes.io/name: homarr
    app.kubernetes.io/part-of: homarr
    app.kubernetes.io/managed-by: flux
    # Baseline enforce: the image runs a root entrypoint that templates
    # /etc/nginx at boot, so it cannot pass restricted enforce. The container
    # keeps drop-ALL plus four load-bearing caps (docs/41).
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
