---
# Wildcard certificate for *.ericsweiss.com (external domain)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ericsweiss-com-wildcard
  namespace: default
spec:
  secretName: ericsweiss-com-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.ericsweiss.com"
  dnsNames:
    - "*.ericsweiss.com"
    - ericsweiss.com
  # Renew 30 days before expiration
  renewBefore: 720h
---
# Wildcard certificate for *.esweiss.com (internal domain)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: esweiss-com-wildcard
  namespace: default
spec:
  secretName: esweiss-com-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.esweiss.com"
  dnsNames:
    - "*.esweiss.com"
    - esweiss.com
  # Renew 30 days before expiration
  renewBefore: 720h
