# cert-manager Helm Chart Values
# Automatic TLS certificate management for k3s cluster

# Install CRDs (using new parameter name)
crds:
  enabled: true

# Deployment configuration
replicaCount: 1

# Enable Prometheus metrics
prometheus:
  enabled: true

# Resource limits
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Webhook configuration
webhook:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# CA injector configuration
cainjector:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Global configuration
global:
  leaderElection:
    namespace: cert-manager
