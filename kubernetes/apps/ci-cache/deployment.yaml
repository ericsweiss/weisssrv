---
# Garage single-node S3 backend for the GitLab runner cache. Design and
# durability posture: README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-cache
  namespace: ci-cache
  annotations:
    # garage reads garage.toml at start only, and the subPath ConfigMap mount
    # never updates in place: Reloader rolls the pod on a config change.
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: ci-cache
spec:
  replicas: 1
  strategy:
    # Recreate, not rolling: two garages on one sqlite metadata dir is a
    # corruption bet, and a cache tolerates the blip.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ci-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ci-cache
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: garage
          # Version in all.yml (garage_version), resolved by Flux
          # postBuild.substituteFrom (cluster-versions ConfigMap).
          image: dxflrs/garage:${garage_version}
          imagePullPolicy: IfNotPresent
          args: ["/garage", "server", "--single-node", "--default-bucket"]
          env:
            - name: GARAGE_CONFIG_FILE
              value: /etc/garage.toml
            - name: GARAGE_DEFAULT_BUCKET
              value: runner-cache
            - name: GARAGE_DEFAULT_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: ci-cache-garage-secrets, key: access-key}
            - name: GARAGE_DEFAULT_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: ci-cache-garage-secrets, key: secret-key}
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef: {name: ci-cache-garage-secrets, key: rpc-secret}
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: ci-cache-garage-secrets, key: admin-token}
            - name: GARAGE_METRICS_TOKEN
              valueFrom:
                secretKeyRef: {name: ci-cache-garage-secrets, key: metrics-token}
          ports:
            - {name: s3, containerPort: 3900, protocol: TCP}
            - {name: admin, containerPort: 3903, protocol: TCP}
          # /health on the admin port is unauthenticated by design (the data
          # endpoints are token-gated); startupProbe covers first-boot layout
          # initialization.
          startupProbe:
            httpGet: {path: /health, port: admin}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /health, port: admin}
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /health, port: admin}
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            # emptyDir.sizeLimit below is the data cap; this request is what
            # ranks the pod by its own usage under node pressure.
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 25Gi
            limits:
              memory: 1Gi
          volumeMounts:
            - {name: config, mountPath: /etc/garage.toml, subPath: garage.toml, readOnly: true}
            - {name: data, mountPath: /var/lib/garage}
      volumes:
        - name: config
          configMap:
            name: ci-cache-garage-config
        - name: data
          emptyDir:
            # Bound: a runaway cache evicts the pod (cold restart) instead of
            # filling the node. GitLab's per-cache zips are tens-of-MB class.
            sizeLimit: 25Gi
