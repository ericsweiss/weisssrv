---
# Garage topology only - every secret (rpc_secret, admin/metrics tokens, the
# default S3 key pair) arrives via GARAGE_* env from the ExternalSecret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ci-cache-garage-config
  namespace: ci-cache
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1

    rpc_bind_addr = "127.0.0.1:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    api_bind_addr = "0.0.0.0:3900"
    s3_region = "garage"
    root_domain = ".ci-cache.svc"

    [admin]
    api_bind_addr = "0.0.0.0:3903"
