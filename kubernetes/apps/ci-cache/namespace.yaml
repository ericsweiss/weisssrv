---
apiVersion: v1
kind: Namespace
metadata:
  name: ci-cache
  labels:
    app.kubernetes.io/name: ci-cache
    app.kubernetes.io/part-of: ci-cache
    app.kubernetes.io/managed-by: flux
    # PSA restricted: garage runs non-root with a read-only rootfs; its only
    # writable paths are the emptyDir mounts in deployment.yaml.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
