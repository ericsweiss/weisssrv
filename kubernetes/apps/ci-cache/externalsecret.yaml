---
# Runtime secrets for the garage server itself. The RUNNER-side copies of the
# S3 key pair live in the gitlab-runner / gitlab-runner-privileged namespaces
# (kubernetes/apps/gitlab-runner*/cache-externalsecret.yaml) — same 1Password
# item, chart-mandated key names there (accesskey/secretkey).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ci-cache-garage-secrets
  namespace: ci-cache
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: ci-cache-garage-secrets
  data:
    - secretKey: access-key
      remoteRef: {key: CI Cache Garage, property: access-key}
    - secretKey: secret-key
      remoteRef: {key: CI Cache Garage, property: secret-key}
    - secretKey: rpc-secret
      remoteRef: {key: CI Cache Garage, property: rpc-secret}
    - secretKey: admin-token
      remoteRef: {key: CI Cache Garage, property: admin-token}
    - secretKey: metrics-token
      remoteRef: {key: CI Cache Garage, property: metrics-token}
