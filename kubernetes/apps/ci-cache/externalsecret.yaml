---
# Runtime secrets for the garage server. The runner-side copies of the S3 key
# pair live in the gitlab-runner{,-privileged} namespaces, from the same
# 1Password item under the chart-mandated accesskey/secretkey names.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ci-cache-garage-secrets
  namespace: ci-cache
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab
  target:
    name: ci-cache-garage-secrets
    creationPolicy: Owner
  data:
    - secretKey: access-key
      remoteRef:
        key: CI Cache Garage
        property: access-key
    - secretKey: secret-key
      remoteRef:
        key: CI Cache Garage
        property: secret-key
    - secretKey: rpc-secret
      remoteRef:
        key: CI Cache Garage
        property: rpc-secret
    - secretKey: admin-token
      remoteRef:
        key: CI Cache Garage
        property: admin-token
    - secretKey: metrics-token
      remoteRef:
        key: CI Cache Garage
        property: metrics-token
