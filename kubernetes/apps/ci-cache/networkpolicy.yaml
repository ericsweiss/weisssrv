---
# Namespace-wide default-deny egress; the default-deny INGRESS half comes from
# the shared ../../components/netpol-baseline component (kustomization.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: ci-cache
spec:
  podSelector: {}
  policyTypes:
    - Egress

---
# Ingress: the S3 port for both runner namespaces, the admin/metrics port for
# observability. No egress rule at all — a single-node garage talks to nobody,
# DNS included (its RPC is loopback).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ci-cache
  namespace: ci-cache
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ci-cache
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitlab-runner
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitlab-runner-privileged
      ports:
        - {protocol: TCP, port: 3900}
    # Prometheus scrape of the token-gated metrics endpoint
    # (service-monitors/ci-cache.yaml).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - {protocol: TCP, port: 3903}
