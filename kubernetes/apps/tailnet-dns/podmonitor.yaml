---
# Scrape the CoreDNS prometheus plugin on :9153 for the same visibility as
# kube-system CoreDNS. Reaching that port needs the allow-observability-scrape
# NetworkPolicy in networkpolicy.yaml, since this namespace is default-deny.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: tailnet-dns
  namespace: tailnet-dns
  labels:
    app: tailnet-dns
spec:
  selector:
    matchLabels:
      app: tailnet-dns
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
