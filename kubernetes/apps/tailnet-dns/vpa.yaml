---
# VPA Initial for the tailnet-dns CoreDNS Deployment: cpu+memory resize on
# natural restarts, never eviction of a live resolver. Small caps bound a
# runaway estimate. Tier convention: docs/33.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: tailnet-dns
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tailnet-dns
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      # RequestsOnly; cap == the 160Mi limit in deployment.yaml, comfortably
      # over the ~85Mi 30d working-set peak (docs/33 § Limit oscillation).
      - containerName: coredns
        minAllowed: {cpu: 25m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 160Mi}
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
