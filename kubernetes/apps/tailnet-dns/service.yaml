---
# ts-dns exposes the CoreDNS resolver to the tailnet as an operator device; its
# 100.x address is read back by terraform/tailscale/split_dns.tf as the
# Split-DNS nameserver for esweiss.com. UDP and TCP 53 on one LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: ts-dns
  namespace: tailnet-dns
  annotations:
    tailscale.com/hostname: "ts-dns"
    # Sizes the operator-created proxy pod's resources (default request is ~1Mi
    # memory; actual RSS ~55Mi) — see controllers/tailscale-operator/proxyclass.yaml.
    tailscale.com/proxy-class: default-proxyclass
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: tailnet-dns
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
