---
# Keep one CoreDNS replica serving through a voluntary disruption. The 2 replicas
# can co-locate (topology spread is ScheduleAnyway), so without this a single
# kured drain evicts both and tailnet split-horizon DNS goes offline.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tailnet-dns
  namespace: tailnet-dns
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: tailnet-dns
