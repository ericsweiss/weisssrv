---
# Split-horizon resolver for Tailscale clients - the Split-DNS nameserver for the
# internal domain (terraform/tailscale/split_dns.tf). Traefik-fronted names CNAME
# the tailnet Traefik device; the direct/admin names below forward to AdGuard (docs/08).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tailnet-dns-corefile
  namespace: tailnet-dns
data:
  Corefile: |
    # Override zone: names that must resolve to their real LAN IP rather than
    # Traefik, plus the Traefik routes chained with lan-tailscale-strict.
    # Parity is enforced by scripts/check-tailnet-dns-parity.py.
    dns.${cluster_internal_domain} smtp-relay.${cluster_internal_domain} plex-direct.${cluster_internal_domain} gitlab.${cluster_internal_domain} nextcloud.${cluster_internal_domain} home-direct.${cluster_internal_domain} windows.${cluster_internal_domain} immich.${cluster_internal_domain} vip-public.${cluster_internal_domain} k3s.${cluster_internal_domain} pve-nas-01.${cluster_internal_domain} pve-laptop-01.${cluster_internal_domain} pve-opt-01.${cluster_internal_domain} pve-opt-02.${cluster_internal_domain} pve-opt-03.${cluster_internal_domain} pve-prec-01.${cluster_internal_domain} k3s-srv-nas-01.${cluster_internal_domain} k3s-srv-laptop-01.${cluster_internal_domain} k3s-srv-prec-01.${cluster_internal_domain} k3s-agt-nas-01.${cluster_internal_domain} k3s-agt-laptop-01.${cluster_internal_domain} k3s-agt-opt-01.${cluster_internal_domain} k3s-agt-opt-02.${cluster_internal_domain} k3s-agt-opt-03.${cluster_internal_domain} k3s-agt-prec-01.${cluster_internal_domain} traefik.${cluster_internal_domain} connect.${cluster_internal_domain} router.${cluster_internal_domain} dns-01.${cluster_internal_domain} dns-02.${cluster_internal_domain} {
        errors
        forward . ${cluster_upstream_dns_servers}
        cache 30
    }

    # Default: every other internal name is Traefik-fronted -> CNAME the tailnet
    # Traefik device, which the client's MagicDNS resolves to its 100.x. Other
    # qtypes fall through to AdGuard.
    ${cluster_internal_domain} {
        errors
        template IN A ${cluster_internal_domain} {
            answer "{{ .Name }} 60 IN CNAME traefik-tailnet.${cluster_tailnet_dns_suffix}."
        }
        template IN AAAA ${cluster_internal_domain} {
            answer "{{ .Name }} 60 IN CNAME traefik-tailnet.${cluster_tailnet_dns_suffix}."
        }
        forward . ${cluster_upstream_dns_servers}
        cache 30
    }

    # Catch-all (Split-DNS scopes queries to esweiss.com, so this is belt-and-
    # braces) + server-level health/readiness/metrics endpoints.
    .:53 {
        errors
        forward . ${cluster_upstream_dns_servers}
        cache 30
        health :8080
        ready :8181
        prometheus :9153
        reload
    }
