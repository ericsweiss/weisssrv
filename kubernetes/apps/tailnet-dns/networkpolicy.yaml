---
# Default-deny egress; explicit allows below. The default-deny INGRESS half
# comes from the shared ../../components/netpol-baseline component
# (kustomization.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: tailnet-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress

---
# Egress: the resolver forwards non-Traefik names to AdGuard (.150/.160) on 53.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-adguard
  namespace: tailnet-dns
spec:
  podSelector:
    matchLabels:
      app: tailnet-dns
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.10.150/32
        - ipBlock:
            cidr: 10.0.10.160/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Ingress: DNS queries arrive from the ts-dns tailscale proxy pod (namespace
# tailscale) on 53. Kubelet health/readiness probes are host-sourced and exempt.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-ts-proxy
  namespace: tailnet-dns
spec:
  podSelector:
    matchLabels:
      app: tailnet-dns
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Ingress: Prometheus scrapes the CoreDNS metrics endpoint (:9153) via the
# tailnet-dns PodMonitor. Scope the observability peer to the Prometheus pod
# (least-privilege, matching the recipes meilisearch/redis-exporter rules).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-scrape
  namespace: tailnet-dns
spec:
  podSelector:
    matchLabels:
      app: tailnet-dns
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9153
