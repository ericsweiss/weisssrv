---
# Services and EndpointSlices for backend services running outside the cluster
# Using ClusterIP services with manual EndpointSlices since these are IP addresses, not DNS names
# Mealie and Bar Assistant are in the recipes namespace (kubernetes/apps/recipes/)

# Home Assistant on 192.168.0.104:8123
apiVersion: v1
kind: Service
metadata:
  name: home-assistant-backend
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 8123
      targetPort: 8123
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: home-assistant-backend
  namespace: default
  labels:
    kubernetes.io/service-name: home-assistant-backend
    endpointslice.kubernetes.io/managed-by: manual
addressType: IPv4
ports:
  - port: 8123
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.0.104
    conditions:
      ready: true

---
# Router at 192.168.0.1:80
apiVersion: v1
kind: Service
