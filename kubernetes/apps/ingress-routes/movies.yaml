---
# IngressRoute for movies (Radarr - internal-only: LAN + Tailscale)
# Backend: Radarr pod on k3s cluster (future deployment)
# Both domain variants respond, but AdGuard Home rewrites BOTH to internal VIP (.101)
# No external DNS records exist - access controlled via DNS

# External domain variant (ericsweiss.com)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: movies
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`movies.ericsweiss.com`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: radarr
          port: 7878
  tls:
    secretName: ericsweiss-com-tls
---
# Internal domain variant (esweiss.com)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: movies-internal
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`movies.esweiss.com`)
      kind: Rule
      middlewares:
        - name: lan-tailscale-only
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: radarr
          port: 7878
  tls:
    secretName: esweiss-com-tls
