---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Middleware (in traefik namespace - has its own namespace set)
  - middleware.yaml

  # Backend services (in default namespace)
  - services.yaml

  # IngressRoutes (in default namespace)
  # These are for services running OUTSIDE the k3s cluster
  - adguard-home.yaml
  - bar.yaml
  - food.yaml
  - router.yaml
  - home-assistant.yaml
  - plex.yaml
