---
# IngressRoute for food.ericsweiss.com (public - external domain)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: food
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/target: ericsweiss.com
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`food.ericsweiss.com`)
      kind: Rule
      middlewares:
        - name: strip-www
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: food-backend
          port: 9925
  tls:
    secretName: ericsweiss-com-tls
---
# IngressRoute for food.esweiss.com (internal domain)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: food-internal
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`food.esweiss.com`)
      kind: Rule
      middlewares:
        - name: strip-www
          namespace: traefik
        - name: hsts-header
          namespace: traefik
      services:
        - name: food-backend
          port: 9925
  tls:
    secretName: esweiss-com-tls
