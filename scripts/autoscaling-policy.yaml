---
# Policy data for scripts/check-hpa-vpa-invariant.py (--policy-config) and, for
# the shared CPU-limit allowlist, scripts/validate-helm-values.py.
#
# chart_native_hpa_targets: workloads whose HPA is created by a Helm chart and
# is therefore absent from the kustomize corpus. Each must have a mutating VPA
# that excludes cpu (asserted with --require-chart-native-vpas). Keep in step
# with the HelmReleases that enable autoscaling.
chart_native_hpa_targets:
  - namespace: traefik
    kind: Deployment
    name: traefik
    source: traefik chart autoscaling.enabled
  - namespace: authentik
    kind: Deployment
    name: authentik-server
    source: authentik chart autoscaling
  - namespace: external-secrets
    kind: Deployment
    name: onepassword-connect
    source: connect.hpa

# "namespace/Kind/name" workloads intentionally permitted a CPU limit. Empty by
# design (docs/33-autoscaling.md) — add an entry only with an inline rationale.
cpu_limit_allowlist: []

# namespace/VerticalPodAutoscaler/name entries exempt from the VPA memory-cap
# rule (cap==limit under a limit-controlling policy). Empty: violations are
# fixed in the manifests instead.
vpa_cap_allowlist: []
