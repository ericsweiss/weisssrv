---
# Site data for scripts/check-netpol-except-parity.py (--config). The canonical
# except-lists and fence networks come from the vendored gate's built-ins; only
# `unrestricted_egress_ok` is site data, and its built-in allowlist is empty.

unrestricted_egress_ok:
  gitlab-runner-privileged/infrastructure-jobs-egress: >-
    infrastructure job pods deploy the homelab itself (ansible over SSH,
    kubectl, 1Password) — unrestricted egress is the point of the privileged
    runner class, and the namespace's default-deny-egress makes every pod
    WITHOUT the runner-class label fail closed
  flux-system/allow-egress: >-
    shipped verbatim inside the upstream gotk-components manifest; Flux's
    controllers reach arbitrary git/OCI/Helm origins. Editing it here would be
    reverted by the next `flux install` regeneration
