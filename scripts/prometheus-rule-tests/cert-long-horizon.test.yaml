---
# CertDistributionTargetFailed (25h) and CertRenewalStale. 30m interval keeps
# the horizons cheap; the 1h CertRenewalFailed lives in durability.test.yaml and
# the 14d CertRenewalFailedProlonged in cert-prolonged-long-horizon.test.yaml.
rule_files:
  - rules.yaml
evaluation_interval: 30m
tests:
  # CertRenewalStale: the gauge is a timestamp, so a negative start value is a
  # cert distributed that long before the harness clock. 76d of lag fires.
  - interval: 30m
    input_series:
      - series: 'cert_renewal_last_success_timestamp_seconds{instance="10.0.10.150:9101"}'
        values: '-6566400+0x8'
    alert_rule_test:
      - eval_time: 3h
        alertname: CertRenewalStale
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '10.0.10.150:9101'

  # A cycle that renewed 60 days ago is healthy: this pins the 75d threshold
  # from below, so lowering it past the renewal cycle turns this arm red.
  - interval: 30m
    input_series:
      - series: 'cert_renewal_last_success_timestamp_seconds{instance="10.0.10.150:9101"}'
        values: '-5184000+0x8'
    alert_rule_test:
      - eval_time: 3h
        alertname: CertRenewalStale
        exp_alerts: []

  # CertDistributionTargetFailed (25h `for:`) is per-target: one dead host
  # fires alone, and a probe the next daily check clears stays silent. The hold
  # spans the daily schedule plus its 30m random delay.
  - interval: 30m
    input_series:
      - series: 'cert_distribution_target_last_run_success{instance="10.0.10.150:9101", host="plex"}'
        values: '0+0x60'
      - series: 'cert_distribution_target_last_run_success{instance="10.0.10.150:9101", host="dns-02"}'
        values: '1+0x60'
    alert_rule_test:
      - eval_time: 24h
        alertname: CertDistributionTargetFailed
        exp_alerts: []
      - eval_time: 26h
        alertname: CertDistributionTargetFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '10.0.10.150:9101'
              host: plex

  # A target the next check clears inside the hold never fires.
  - interval: 30m
    input_series:
      - series: 'cert_distribution_target_last_run_success{instance="10.0.10.150:9101", host="plex"}'
        values: '0+0x46 1+0x14'
    alert_rule_test:
      - eval_time: 26h
        alertname: CertDistributionTargetFailed
        exp_alerts: []

  # Every target installed the cert: silent.
  - interval: 30m
    input_series:
      - series: 'cert_distribution_target_last_run_success{instance="10.0.10.150:9101", host="plex"}'
        values: '1+0x60'
    alert_rule_test:
      - eval_time: 26h
        alertname: CertDistributionTargetFailed
        exp_alerts: []
