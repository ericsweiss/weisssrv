---
# promtool unit tests for the blackbox/endpoint alerts. Pins the firing
# boundaries of the multi-series rules: power-state gates, hold windows,
# absent() guards, exclusions and count() aggregates.
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  # WindowsRdpDown fires only when the VM is powered on (max(pve_up qemu/155)==1)
  # AND RDP is down. Two pve_up series (distinct targets, as live) confirm the
  # max() aggregation dedups them — a bare vector would error duplicate-series.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.10.155:3389"}'
        values: '0+0x40'
      - series: 'pve_up{id="qemu/155", target="10.0.10.102"}'
        values: '1+0x40'
      - series: 'pve_up{id="qemu/155", target="10.0.10.107"}'
        values: '1+0x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: WindowsRdpDown
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '10.0.10.155:3389'

  # VM intentionally powered off (both pve_up == 0): RDP down is EXPECTED, so the
  # gate self-silences — no alert.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.10.155:3389"}'
        values: '0+0x40'
      - series: 'pve_up{id="qemu/155", target="10.0.10.102"}'
        values: '0+0x40'
      - series: 'pve_up{id="qemu/155", target="10.0.10.107"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: WindowsRdpDown
        exp_alerts: []

  # VM up and RDP answering (probe_success==1): no alert.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.10.155:3389"}'
        values: '1+0x40'
      - series: 'pve_up{id="qemu/155", target="10.0.10.102"}'
        values: '1+0x40'
      - series: 'pve_up{id="qemu/155", target="10.0.10.107"}'
        values: '1+0x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: WindowsRdpDown
        exp_alerts: []

  # EndpointDown holds for 10m (not 5m): a down endpoint is still pending at 7m
  # and only fires at 12m. Pins the widened warning-tier hold.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="https://plex.esweiss.com"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 7m
        alertname: EndpointDown
        exp_alerts: []
      - eval_time: 12m
        alertname: EndpointDown
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 'https://plex.esweiss.com'

  # The Windows RDP instance is excluded from EndpointDown (routed to
  # WindowsRdpDown), so a down 3389 probe must NOT fire the catch-all.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.10.155:3389"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: EndpointDown
        exp_alerts: []

  # BlackboxCertExpiringSoon fires for a Cloudflare-edge target under 14 days; a
  # 30d edge cert does not; esweiss.com is out of scope; and hosts whose TLS
  # terminates on our own Traefik are excluded (cert-manager owns those certs).
  - interval: 1m
    input_series:
      # 10 days to expiry, constant epoch value -> stays < 14d as time advances.
      - series: 'probe_ssl_earliest_cert_expiry{instance="https://home.ericsweiss.com"}'
        values: '864000+0x70'
      # 30 days -> healthy, must not fire.
      - series: 'probe_ssl_earliest_cert_expiry{instance="https://cloud.ericsweiss.com"}'
        values: '2592000+0x70'
      # cert-manager-owned certs, all expiring: must stay silent here.
      - series: 'probe_ssl_earliest_cert_expiry{instance="https://git.ericsweiss.com"}'
        values: '864000+0x70'
      - series: 'probe_ssl_earliest_cert_expiry{instance="https://registry.git.ericsweiss.com"}'
        values: '864000+0x70'
      - series: 'probe_ssl_earliest_cert_expiry{instance="https://pages.git.ericsweiss.com"}'
        values: '864000+0x70'
      - series: 'probe_ssl_earliest_cert_expiry{instance="https://photos.ericsweiss.com"}'
        values: '864000+0x70'
      - series: 'probe_ssl_earliest_cert_expiry{instance="https://auth.ericsweiss.com"}'
        values: '864000+0x70'
      # In-scope regex only matches *.ericsweiss.com; an esweiss.com target
      # (cert-manager-covered) must be excluded even at 5 days.
      - series: 'probe_ssl_earliest_cert_expiry{instance="https://grafana.esweiss.com"}'
        values: '432000+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BlackboxCertExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 'https://home.ericsweiss.com'

  # DNSResolverProbeMissing fires when EITHER resolver's probe series is absent.
  # .150 present, .160 removed -> fire, labelled with the missing instance.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.10.150:53"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: DNSResolverProbeMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '10.0.10.160:53'

  # Both resolver probes present -> no drift, no alert.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.10.150:53"}'
        values: '1+0x30'
      - series: 'probe_success{instance="10.0.10.160:53"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: DNSResolverProbeMissing
        exp_alerts: []

  # NetworkGearProbeFailed: a down UniFi device fires at 7m, labelled with the
  # device. The gateway probe pins the fully-anchored regex.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.10.1"}'
        values: '0+0x20'
      - series: 'probe_success{instance="10.0.1.2"}'
        values: '1+0x20'
      - series: 'probe_success{instance="10.0.1.3"}'
        values: '1+0x20'
      - series: 'probe_success{instance="10.0.10.150:53"}'
        values: '0+0x20'
      - series: 'probe_success{instance="10.0.10.155:3389"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: NetworkGearProbeFailed
        exp_alerts: []
      - eval_time: 7m
        alertname: NetworkGearProbeFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '10.0.10.1'

  # Switch and AP both down -> one alert per device, so the summary names the
  # one that failed rather than a collapsed aggregate.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.10.1"}'
        values: '1+0x20'
      - series: 'probe_success{instance="10.0.1.2"}'
        values: '0+0x20'
      - series: 'probe_success{instance="10.0.1.3"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 7m
        alertname: NetworkGearProbeFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '10.0.1.2'
          - exp_labels:
              severity: warning
              instance: '10.0.1.3'

  # NetworkGearProbeMissing fires when one of the three device probes has no
  # series. A failing probe is not a missing one. The 10m eval pins the 15m
  # hold.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.10.1"}'
        values: '1+0x30'
      - series: 'probe_success{instance="10.0.1.2"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: NetworkGearProbeMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: NetworkGearProbeMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '10.0.1.3'

  # Each absent() term needs a case dropping its own instance, or the term
  # could be deleted and the suite still pass.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.1.2"}'
        values: '1+0x30'
      - series: 'probe_success{instance="10.0.1.3"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: NetworkGearProbeMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '10.0.10.1'

  # ... and the switch leg.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.10.1"}'
        values: '1+0x30'
      - series: 'probe_success{instance="10.0.1.3"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: NetworkGearProbeMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '10.0.1.2'

  # All three present -> no drift, no alert.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.10.1"}'
        values: '1+0x30'
      - series: 'probe_success{instance="10.0.1.2"}'
        values: '1+0x30'
      - series: 'probe_success{instance="10.0.1.3"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: NetworkGearProbeMissing
        exp_alerts: []

  # All three answering -> silent.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.10.1"}'
        values: '1+0x20'
      - series: 'probe_success{instance="10.0.1.2"}'
        values: '1+0x20'
      - series: 'probe_success{instance="10.0.1.3"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 7m
        alertname: NetworkGearProbeFailed
        exp_alerts: []

  # The three network-gear instances and the 1.1.1.1 WAN witness are excluded
  # from the EndpointDown catch-all. IP-addressed targets are included on the
  # firing side so that widening the exclusion regex fails here.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.10.1"}'
        values: '0+0x20'
      - series: 'probe_success{instance="10.0.1.2"}'
        values: '0+0x20'
      - series: 'probe_success{instance="10.0.1.3"}'
        values: '0+0x20'
      - series: 'probe_success{instance="1.1.1.1"}'
        values: '0+0x20'
      - series: 'probe_success{instance="https://plex.esweiss.com"}'
        values: '0+0x20'
      - series: 'probe_success{instance="10.0.10.161:6443"}'
        values: '0+0x20'
      - series: 'probe_success{instance="10.0.10.150:53"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: EndpointDown
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '10.0.10.150:53'
          - exp_labels:
              severity: warning
              instance: '10.0.10.161:6443'
          - exp_labels:
              severity: warning
              instance: 'https://plex.esweiss.com'

  # DNSResolutionDown is count(failed) == count(present), so it scales with the
  # resolver set instead of naming a number. Both resolvers down fires it.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.10.150:53"}'
        values: '0+0x20'
      - series: 'probe_success{instance="10.0.10.160:53"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: DNSResolutionDown
        exp_alerts:
          - exp_labels:
              severity: critical

  # One resolver still answering is the degraded case EndpointDown covers, not
  # a full resolution outage.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.10.150:53"}'
        values: '0+0x20'
      - series: 'probe_success{instance="10.0.10.160:53"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: DNSResolutionDown
        exp_alerts: []

  # The disarm this shape has to accept: with the probe series gone entirely
  # both counts are empty, so nothing fires. BlackboxExporterDown is what covers
  # a missing prober.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.10.155:3389"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: DNSResolutionDown
        exp_alerts: []

  # EndpointDownCritical: the email-paging tier. auth down for 5m fires,
  # labelled with the instance the fully-anchored regex matched.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="https://auth.esweiss.com"}'
        values: '0+0x20'
      - series: 'probe_success{instance="https://git.esweiss.com"}'
        values: '1+0x20'
      - series: 'probe_success{instance="https://home.esweiss.com"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: EndpointDownCritical
        exp_alerts: []
      - eval_time: 12m
        alertname: EndpointDownCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 'https://auth.esweiss.com'

  # KeyEndpointProbeMissing: git's target given a path, so the fully-anchored
  # EndpointDownCritical regex no longer matches it.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="https://auth.esweiss.com"}'
        values: '1+0x30'
      - series: 'probe_success{instance="https://home.esweiss.com"}'
        values: '1+0x30'
      - series: 'probe_success{instance="https://git.esweiss.com/health"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: KeyEndpointProbeMissing
        exp_alerts:
          - exp_labels:
              severity: warning

  # Every key target gone: the `or on() vector(0)` fallback keeps the guard from
  # evaluating over an empty vector and going quiet.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.10.150:53"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: KeyEndpointProbeMissing
        exp_alerts:
          - exp_labels:
              severity: warning

  # All three load-bearing probes present -> no drift, no alert.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="https://auth.esweiss.com"}'
        values: '1+0x30'
      - series: 'probe_success{instance="https://git.esweiss.com"}'
        values: '1+0x30'
      - series: 'probe_success{instance="https://home.esweiss.com"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: KeyEndpointProbeMissing
        exp_alerts: []
