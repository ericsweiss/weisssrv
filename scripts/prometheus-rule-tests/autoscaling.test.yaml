---
# promtool unit tests for VPARecommendationCapped. The memory arm needs a 1.25x
# ratio and a 128Mi gap, the CPU arm the ratio alone (docs/33-autoscaling.md).
# 6h interval keeps the 24h `for` to 4 samples.
rule_files:
  - rules.yaml
evaluation_interval: 6h
tests:
  # 3Gi wanted against a 2Gi cap: 1.5x and a 1Gi gap, so both tests pass.
  - interval: 6h
    input_series:
      - series: 'vpa_recommendation_uncappedtarget{exported_namespace="observability", verticalpodautoscaler="prometheus", container="prometheus", resource="memory", unit="byte"}'
        values: '3221225472+0x8'
      - series: 'vpa_recommendation_target{exported_namespace="observability", verticalpodautoscaler="prometheus", container="prometheus", resource="memory", unit="byte"}'
        values: '2147483648+0x8'
    alert_rule_test:
      - eval_time: 30h
        alertname: VPARecommendationCapped
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_namespace: observability
              verticalpodautoscaler: prometheus
              container: prometheus
              resource: memory
              unit: byte

  # Recommendation not clamped (uncapped == target): no alert.
  - interval: 6h
    input_series:
      - series: 'vpa_recommendation_uncappedtarget{exported_namespace="observability", verticalpodautoscaler="prometheus", container="prometheus", resource="memory", unit="byte"}'
        values: '2147483648+0x8'
      - series: 'vpa_recommendation_target{exported_namespace="observability", verticalpodautoscaler="prometheus", container="prometheus", resource="memory", unit="byte"}'
        values: '2147483648+0x8'
    alert_rule_test:
      - eval_time: 30h
        alertname: VPARecommendationCapped
        exp_alerts: []

  # A 104.7Mi recommendation against a 102Mi cap — 2.6% over, and the shape a
  # cap that tracks its limit produces permanently. Neither test passes, so it
  # is not a worklist entry.
  - interval: 6h
    input_series:
      - series: 'vpa_recommendation_uncappedtarget{exported_namespace="tailnet-dns", verticalpodautoscaler="tailnet-dns", container="coredns", resource="memory", unit="byte"}'
        values: '109793280+0x8'
      - series: 'vpa_recommendation_target{exported_namespace="tailnet-dns", verticalpodautoscaler="tailnet-dns", container="coredns", resource="memory", unit="byte"}'
        values: '106954752+0x8'
    alert_rule_test:
      - eval_time: 30h
        alertname: VPARecommendationCapped
        exp_alerts: []

  # 137.9Mi against a 102Mi cap clears the 1.25x ratio but the 36MB gap is
  # under the 128Mi floor, so nothing fires.
  - interval: 6h
    input_series:
      - series: 'vpa_recommendation_uncappedtarget{exported_namespace="cert-manager", verticalpodautoscaler="cert-manager", container="cert-manager-controller", resource="memory", unit="byte"}'
        values: '144601088+0x8'
      - series: 'vpa_recommendation_target{exported_namespace="cert-manager", verticalpodautoscaler="cert-manager", container="cert-manager-controller", resource="memory", unit="byte"}'
        values: '106954752+0x8'
    alert_rule_test:
      - eval_time: 30h
        alertname: VPARecommendationCapped
        exp_alerts: []

  # nzbget and qbittorrent memory clamps are the sizing decision, not a
  # symptom (docs/33), so both are excluded.
  - interval: 6h
    input_series:
      - series: 'vpa_recommendation_uncappedtarget{exported_namespace="downloads", verticalpodautoscaler="nzbget", container="nzbget", resource="memory", unit="byte"}'
        values: '3221225472+0x8'
      - series: 'vpa_recommendation_target{exported_namespace="downloads", verticalpodautoscaler="nzbget", container="nzbget", resource="memory", unit="byte"}'
        values: '2147483648+0x8'
      - series: 'vpa_recommendation_uncappedtarget{exported_namespace="downloads", verticalpodautoscaler="qbittorrent", container="qbittorrent", resource="memory", unit="byte"}'
        values: '3221225472+0x8'
      - series: 'vpa_recommendation_target{exported_namespace="downloads", verticalpodautoscaler="qbittorrent", container="qbittorrent", resource="memory", unit="byte"}'
        values: '2147483648+0x8'
    alert_rule_test:
      - eval_time: 30h
        alertname: VPARecommendationCapped
        exp_alerts: []

  # Each exclusion is scoped to that VPA's memory series, so a CPU clamp on
  # the same VPA still alerts. The CPU arm carries the ratio alone.
  - interval: 6h
    input_series:
      - series: 'vpa_recommendation_uncappedtarget{exported_namespace="downloads", verticalpodautoscaler="nzbget", container="nzbget", resource="cpu", unit="core"}'
        values: '3+0x8'
      - series: 'vpa_recommendation_target{exported_namespace="downloads", verticalpodautoscaler="nzbget", container="nzbget", resource="cpu", unit="core"}'
        values: '2+0x8'
      - series: 'vpa_recommendation_uncappedtarget{exported_namespace="downloads", verticalpodautoscaler="nzbget", container="nzbget", resource="memory", unit="byte"}'
        values: '3221225472+0x8'
      - series: 'vpa_recommendation_target{exported_namespace="downloads", verticalpodautoscaler="nzbget", container="nzbget", resource="memory", unit="byte"}'
        values: '2147483648+0x8'
      - series: 'vpa_recommendation_uncappedtarget{exported_namespace="downloads", verticalpodautoscaler="sonarr", container="sonarr", resource="memory", unit="byte"}'
        values: '3221225472+0x8'
      - series: 'vpa_recommendation_target{exported_namespace="downloads", verticalpodautoscaler="sonarr", container="sonarr", resource="memory", unit="byte"}'
        values: '2147483648+0x8'
    alert_rule_test:
      - eval_time: 30h
        alertname: VPARecommendationCapped
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_namespace: downloads
              verticalpodautoscaler: nzbget
              container: nzbget
              resource: cpu
              unit: core
          - exp_labels:
              severity: warning
              exported_namespace: downloads
              verticalpodautoscaler: sonarr
              container: sonarr
              resource: memory
              unit: byte

  # A CPU clamp inside the ratio stays silent, so the CPU arm is a band and not
  # a bare `>`.
  - interval: 6h
    input_series:
      - series: 'vpa_recommendation_uncappedtarget{exported_namespace="downloads", verticalpodautoscaler="sonarr", container="sonarr", resource="cpu", unit="core"}'
        values: '2.1+0x8'
      - series: 'vpa_recommendation_target{exported_namespace="downloads", verticalpodautoscaler="sonarr", container="sonarr", resource="cpu", unit="core"}'
        values: '2+0x8'
    alert_rule_test:
      - eval_time: 30h
        alertname: VPARecommendationCapped
        exp_alerts: []

  # Recording rules aggregate kube-state-metrics scrape labels away, so alert
  # identity is the recommendation's own labels. Two overlapping KSM instances
  # prove `max by` on the uncapped side keeps the live recommendation.
  - interval: 6h
    input_series:
      - series: 'vpa_recommendation_uncappedtarget{exported_namespace="observability", verticalpodautoscaler="prometheus", container="prometheus", resource="memory", unit="byte", job="kube-state-metrics", instance="10.42.0.9:8080", pod="kube-state-metrics-abc", endpoint="http", service="kube-state-metrics"}'
        values: '3221225472+0x8'
      - series: 'vpa_recommendation_uncappedtarget{exported_namespace="observability", verticalpodautoscaler="prometheus", container="prometheus", resource="memory", unit="byte", job="kube-state-metrics", instance="10.42.1.4:8080", pod="kube-state-metrics-def", endpoint="http", service="kube-state-metrics"}'
        values: '1073741824+0x8'
      - series: 'vpa_recommendation_target{exported_namespace="observability", verticalpodautoscaler="prometheus", container="prometheus", resource="memory", unit="byte", job="kube-state-metrics", instance="10.42.0.9:8080", pod="kube-state-metrics-abc", endpoint="http", service="kube-state-metrics"}'
        values: '2147483648+0x8'
      - series: 'vpa_recommendation_target{exported_namespace="observability", verticalpodautoscaler="prometheus", container="prometheus", resource="memory", unit="byte", job="kube-state-metrics", instance="10.42.1.4:8080", pod="kube-state-metrics-def", endpoint="http", service="kube-state-metrics"}'
        values: '2147483648+0x8'
    alert_rule_test:
      - eval_time: 30h
        alertname: VPARecommendationCapped
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_namespace: observability
              verticalpodautoscaler: prometheus
              container: prometheus
              resource: memory
              unit: byte

  # The same overlap on the target side: `max` lets the raised 4Gi cap win and
  # the alert clears.
  - interval: 6h
    input_series:
      - series: 'vpa_recommendation_uncappedtarget{exported_namespace="observability", verticalpodautoscaler="prometheus", container="prometheus", resource="memory", unit="byte", job="kube-state-metrics", instance="10.42.0.9:8080", pod="kube-state-metrics-abc", endpoint="http", service="kube-state-metrics"}'
        values: '3221225472+0x8'
      - series: 'vpa_recommendation_uncappedtarget{exported_namespace="observability", verticalpodautoscaler="prometheus", container="prometheus", resource="memory", unit="byte", job="kube-state-metrics", instance="10.42.1.4:8080", pod="kube-state-metrics-def", endpoint="http", service="kube-state-metrics"}'
        values: '3221225472+0x8'
      - series: 'vpa_recommendation_target{exported_namespace="observability", verticalpodautoscaler="prometheus", container="prometheus", resource="memory", unit="byte", job="kube-state-metrics", instance="10.42.0.9:8080", pod="kube-state-metrics-abc", endpoint="http", service="kube-state-metrics"}'
        values: '1073741824+0x8'
      - series: 'vpa_recommendation_target{exported_namespace="observability", verticalpodautoscaler="prometheus", container="prometheus", resource="memory", unit="byte", job="kube-state-metrics", instance="10.42.1.4:8080", pod="kube-state-metrics-def", endpoint="http", service="kube-state-metrics"}'
        values: '4294967296+0x8'
    alert_rule_test:
      - eval_time: 30h
        alertname: VPARecommendationCapped
        exp_alerts: []

  # 2.25Gi against a 2Gi cap: the 256Mi gap clears the 128Mi floor, so the
  # 1.25x ratio is the only thing keeping this quiet.
  - interval: 6h
    input_series:
      - series: 'vpa_recommendation_uncappedtarget{exported_namespace="observability", verticalpodautoscaler="prometheus", container="prometheus", resource="memory", unit="byte"}'
        values: '2415919104+0x8'
      - series: 'vpa_recommendation_target{exported_namespace="observability", verticalpodautoscaler="prometheus", container="prometheus", resource="memory", unit="byte"}'
        values: '2147483648+0x8'
    alert_rule_test:
      - eval_time: 30h
        alertname: VPARecommendationCapped
        exp_alerts: []
