---
# promtool unit tests for the cert-renewal and Flux reconciliation alerts: each
# pair asserts the rule fires on its failure and stays quiet when healthy.
# rule_files resolves where the lint script copies this next to rules.yaml.
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  # CertRenewalFailed (for 1h) and CertRenewalFailedProlonged (for 72h) share
  # one metric, so the escalation is purely the `for:` duration.
  - interval: 1m
    input_series:
      - series: 'cert_renewal_last_run_success{instance="10.0.10.150:9101"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: CertRenewalFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '10.0.10.150:9101'
      - eval_time: 65m
        alertname: CertRenewalFailedProlonged
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'cert_renewal_last_run_success{instance="10.0.10.150:9101"}'
        values: '1+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: CertRenewalFailed
        exp_alerts: []

  # Second arm: a local renewal that succeeded while a distribution target
  # failed leaves the run bit at 1, so only the failed-target count sees it.
  - interval: 1m
    input_series:
      - series: 'cert_renewal_last_run_success{instance="10.0.10.150:9101"}'
        values: '1+0x70'
      - series: 'cert_distribution_last_run_failed_targets{instance="10.0.10.150:9101"}'
        values: '1+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: CertRenewalFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '10.0.10.150:9101'

  - interval: 1m
    input_series:
      - series: 'cert_renewal_last_run_success{instance="10.0.10.150:9101"}'
        values: '1+0x70'
      - series: 'cert_distribution_last_run_failed_targets{instance="10.0.10.150:9101"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: CertRenewalFailed
        exp_alerts: []

  # FluxReconciliationFailure keys on the error RATE, so a counter that stopped
  # advancing must stop firing — otherwise one historic error alerts forever.
  - interval: 1m
    input_series:
      - series: 'controller_runtime_reconcile_errors_total{job="observability/flux-system", controller="kustomization"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: FluxReconciliationFailure
        exp_alerts:
          - exp_labels:
              severity: warning
              controller: kustomization

  - interval: 1m
    input_series:
      - series: 'controller_runtime_reconcile_errors_total{job="observability/flux-system", controller="kustomization"}'
        values: '5+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: FluxReconciliationFailure
        exp_alerts: []

  # Both Flux arms must ignore SUSPENDED resources: a suspended Kustomization
  # keeps reporting its last state and would page indefinitely. The
  # Kustomization arm fires at 5m, which is the faster "nothing is reconciling".
  - interval: 1m
    input_series:
      - series: 'gotk_resource_info{job="kube-state-metrics", instance="10.42.7.87:8080", pod="ksm-a", customresource_group="kustomize.toolkit.fluxcd.io", customresource_kind="Kustomization", customresource_version="v1", exported_namespace="flux-system", name="apps", ready="False", suspended="false"}'
        values: '1+0x40'
      - series: 'gotk_resource_info{job="kube-state-metrics", instance="10.42.7.87:8080", pod="ksm-a", customresource_group="kustomize.toolkit.fluxcd.io", customresource_kind="Kustomization", customresource_version="v1", exported_namespace="flux-system", name="paused", ready="False", suspended="true"}'
        values: '1+0x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: FluxKustomizationNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              customresource_group: kustomize.toolkit.fluxcd.io
              customresource_kind: Kustomization
              customresource_version: v1
              exported_namespace: flux-system
              name: apps
      # The other arm excludes Kustomizations, so it never doubles the page.
      - eval_time: 35m
        alertname: FluxResourceNotReady
        exp_alerts: []

  # A kube-state-metrics reschedule hands the same resource a new instance/pod
  # identity. The `max by` aggregates that away, so one failure is one alert and
  # the `for:` clock is not restarted by a scrape-target change.
  - interval: 1m
    input_series:
      - series: 'gotk_resource_info{job="kube-state-metrics", instance="10.42.7.87:8080", pod="ksm-a", customresource_group="helm.toolkit.fluxcd.io", customresource_kind="HelmRelease", customresource_version="v2", exported_namespace="authentik", name="authentik", ready="False", suspended="false"}'
        values: '1+0x20 _x30'
      - series: 'gotk_resource_info{job="kube-state-metrics", instance="10.42.7.91:8080", pod="ksm-b", customresource_group="helm.toolkit.fluxcd.io", customresource_kind="HelmRelease", customresource_version="v2", exported_namespace="authentik", name="authentik", ready="False", suspended="false"}'
        values: '_x20 1+0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: FluxResourceNotReady
        exp_alerts: []
      - eval_time: 45m
        alertname: FluxResourceNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              customresource_group: helm.toolkit.fluxcd.io
              customresource_kind: HelmRelease
              customresource_version: v2
              exported_namespace: authentik
              name: authentik

  # keep_firing_for: 15m bridges a resource that flaps Ready, so one incident is
  # one Alertmanager group episode instead of a resolve/refire per flap.
  - interval: 1m
    input_series:
      - series: 'gotk_resource_info{job="kube-state-metrics", instance="10.42.7.87:8080", pod="ksm-a", customresource_group="kustomize.toolkit.fluxcd.io", customresource_kind="Kustomization", customresource_version="v1", exported_namespace="flux-system", name="apps", ready="False", suspended="false"}'
        values: '1+0x10 0+0x5 1+0x30'
    alert_rule_test:
      # The condition is false at 13m; keep_firing_for holds the alert firing.
      - eval_time: 13m
        alertname: FluxKustomizationNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              customresource_group: kustomize.toolkit.fluxcd.io
              customresource_kind: Kustomization
              customresource_version: v1
              exported_namespace: flux-system
              name: apps

  # CertificateNotReady is the only arm covering a Certificate cert-manager has
  # never issued: the expiry series does not exist until a first issuance.
  - interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{condition="False", name="wildcard-internal", namespace="observability"}'
        values: '1+0x70'
    alert_rule_test:
      - eval_time: 50m
        alertname: CertificateNotReady
        exp_alerts: []
      - eval_time: 65m
        alertname: CertificateNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              condition: 'False'
              name: wildcard-internal
              namespace: observability

  # A Certificate that issues stays quiet: the condition="False" sample is 0.
  - interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{condition="False", name="wildcard-internal", namespace="observability"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: CertificateNotReady
        exp_alerts: []
