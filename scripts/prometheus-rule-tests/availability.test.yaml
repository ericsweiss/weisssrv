---
# promtool unit tests for the availability alerts: the critical etcd/node pair,
# the wg-easy WAN endpoint, the *Down deployment/statefulset rules, and
# PostgresDown. Rules not covered here are single-series thresholds.
rule_files:
  - rules.yaml
# 5m interval: the etcd/node cases run to 6-7h of simulated time (README.md).
evaluation_interval: 5m
tests:
  # EtcdQuorumAtRisk fires at <= 2 members up, one member looser than upstream's
  # etcdInsufficientMembers. The 6h `for` sets the evaluation window.
  - interval: 1m
    input_series:
      - series: 'up{job="kube-etcd", instance="10.0.10.222:2381"}'
        values: '1+0x400'
      - series: 'up{job="kube-etcd", instance="10.0.10.223:2381"}'
        values: '1+0x400'
      - series: 'up{job="kube-etcd", instance="10.0.10.227:2381"}'
        values: '0+0x400'
    alert_rule_test:
      - eval_time: 6h5m
        alertname: EtcdQuorumAtRisk
        exp_alerts:
          - exp_labels:
              severity: critical

  # All three up => count 3 > 2 => silent. Pins the boundary.
  - interval: 1m
    input_series:
      - series: 'up{job="kube-etcd", instance="10.0.10.222:2381"}'
        values: '1+0x400'
      - series: 'up{job="kube-etcd", instance="10.0.10.223:2381"}'
        values: '1+0x400'
      - series: 'up{job="kube-etcd", instance="10.0.10.227:2381"}'
        values: '1+0x400'
    alert_rule_test:
      - eval_time: 6h5m
        alertname: EtcdQuorumAtRisk
        exp_alerts: []

  # `count(up == 1)` over an empty vector returns nothing, not 0, so the
  # `or absent(up{job="kube-etcd"} == 1)` arm is what catches a total etcd
  # scrape failure.
  - interval: 1m
    input_series:
      - series: 'up{job="kube-etcd", instance="10.0.10.222:2381"}'
        values: '0+0x400'
      - series: 'up{job="kube-etcd", instance="10.0.10.223:2381"}'
        values: '0+0x400'
      - series: 'up{job="kube-etcd", instance="10.0.10.227:2381"}'
        values: '0+0x400'
    alert_rule_test:
      - eval_time: 6h5m
        alertname: EtcdQuorumAtRisk
        exp_alerts:
          - exp_labels:
              severity: critical

  # No etcd series at all (job gone) — same arm, still fires.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 6h5m
        alertname: EtcdQuorumAtRisk
        exp_alerts:
          - exp_labels:
              severity: critical

  # NodeNotReadyProlonged: one node NotReady for 6h fires, labelled by node;
  # a Ready node does not. kured reboots complete far inside 6h.
  - interval: 5m
    input_series:
      - series: 'kube_node_status_condition{condition="Ready", status="true", node="k3s-agt-01"}'
        values: '0+0x100'
      - series: 'kube_node_status_condition{condition="Ready", status="true", node="k3s-srv-01"}'
        values: '1+0x100'
    alert_rule_test:
      - eval_time: 6h30m
        alertname: NodeNotReadyProlonged
        exp_alerts:
          - exp_labels:
              severity: critical
              condition: Ready
              status: 'true'
              node: k3s-agt-01

  # NodeOutageStormControl gates the inhibit chain: it fires only for a node
  # that was Ready inside the last 7d and self-clears after, so a node that
  # never comes back cannot suppress every per-pod warning for ever.
  - interval: 5m
    input_series:
      # Ready for the first hour (samples at 0..60m), then NotReady out past 8h.
      - series: 'kube_node_status_condition{condition="Ready", status="true", node="k3s-agt-01"}'
        values: '1+0x12 0+0x100'
    alert_rule_test:
      # Inside the 5m hold: the node goes NotReady at 1h5m, the inhibit arrives
      # at 1h10m.
      - eval_time: 1h8m
        alertname: NodeOutageStormControl
        exp_alerts: []
      # 1h into the outage.
      - eval_time: 2h
        alertname: NodeOutageStormControl
        exp_alerts:
          - exp_labels:
              severity: none
              condition: Ready
              status: 'true'
              node: k3s-agt-01
      # Past NodeNotReadyProlonged's 6h boundary the inhibit must still hold:
      # the per-pod warnings stay suppressed while the node is inside the 7d
      # window.
      - eval_time: 7h30m
        alertname: NodeOutageStormControl
        exp_alerts:
          - exp_labels:
              severity: none
              condition: Ready
              status: 'true'
              node: k3s-agt-01
      - eval_time: 7h30m
        alertname: NodeNotReadyProlonged
        exp_alerts:
          - exp_labels:
              severity: critical
              condition: Ready
              status: 'true'
              node: k3s-agt-01

  # The 7d release itself runs in node-outage-long-horizon.test.yaml, which
  # evaluates at 30m steps so a week of simulated time stays affordable.

  # A node that has been NotReady since Prometheus started (no prior Ready
  # sample) must NOT trip storm control — otherwise a never-joined node would
  # mute the cluster's workload alerts indefinitely.
  - interval: 5m
    input_series:
      - series: 'kube_node_status_condition{condition="Ready", status="true", node="k3s-agt-01"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 1h
        alertname: NodeOutageStormControl
        exp_alerts: []

  # WgEasyDown: 0 available replicas fires critical; a healthy replica does not;
  # and the absent() arm covers the Deployment being deleted outright.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="wg-easy", deployment="wg-easy"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: WgEasyDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: wg-easy
              deployment: wg-easy
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="wg-easy", deployment="wg-easy"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: WgEasyDown
        exp_alerts: []
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 20m
        alertname: WgEasyDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: wg-easy
              deployment: wg-easy

  # UptimeKumaDown: same three cases as WgEasyDown, at warning severity — the
  # empty-vector (Deployment deleted) arm is the one review cannot check by
  # reading the expression.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="uptime-kuma", deployment="uptime-kuma"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: UptimeKumaDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: uptime-kuma
              deployment: uptime-kuma
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="uptime-kuma", deployment="uptime-kuma"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: UptimeKumaDown
        exp_alerts: []
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 20m
        alertname: UptimeKumaDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: uptime-kuma
              deployment: uptime-kuma

  # WgEasyEndpointVipMissing asserts the VIP VALUE, not just that the Service
  # has some ingress IP: a VIP that moved pool leaves WgEasyDown green while
  # every external client fails to connect. A different IP must still fire.
  - interval: 1m
    input_series:
      - series: 'kube_service_status_load_balancer_ingress{namespace="wg-easy", service="wg-easy", ip="10.0.10.99"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: WgEasyEndpointVipMissing
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'kube_service_status_load_balancer_ingress{namespace="wg-easy", service="wg-easy", ip="10.0.10.100"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: WgEasyEndpointVipMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: wg-easy
              service: wg-easy
              ip: 10.0.10.99

  # The two Traefik ingress VIPs get the same value-asserting guard. Both
  # present: silent.
  - interval: 1m
    input_series:
      - series: 'kube_service_status_load_balancer_ingress{namespace="traefik", service="traefik", ip="10.0.10.100"}'
        values: '1+0x30'
      - series: 'kube_service_status_load_balancer_ingress{namespace="traefik", service="traefik-internal", ip="10.0.10.101"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: TraefikPublicVipMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: TraefikInternalVipMissing
        exp_alerts: []
  # The internal VIP lost while the public one holds: only the internal rule
  # fires, so the alert names which half of the ingress plane is down.
  - interval: 1m
    input_series:
      - series: 'kube_service_status_load_balancer_ingress{namespace="traefik", service="traefik", ip="10.0.10.100"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: TraefikPublicVipMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: TraefikInternalVipMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: traefik
              service: traefik-internal
              ip: 10.0.10.101
  # Mirror image: without it a typo'd service or ip on the absent() arm would
  # satisfy every assertion in the suite.
  - interval: 1m
    input_series:
      - series: 'kube_service_status_load_balancer_ingress{namespace="traefik", service="traefik-internal", ip="10.0.10.101"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: TraefikInternalVipMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: TraefikPublicVipMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: traefik
              service: traefik
              ip: 10.0.10.100

  # TailscaleProxyDown is namespace-scoped (the operator generates the
  # StatefulSet name suffixes), so it must fire per statefulset and only for the
  # one with no ready replica.
  - interval: 1m
    input_series:
      - series: 'kube_statefulset_status_replicas_ready{namespace="tailscale", statefulset="ts-k3s-api-abc12"}'
        values: '0+0x30'
      - series: 'kube_statefulset_status_replicas_ready{namespace="tailscale", statefulset="ts-grafana-def34"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: TailscaleProxyDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: tailscale
              statefulset: ts-k3s-api-abc12

  # GitLabAgentDown: the deployment is named weisssrv-k3s-gitlab-agent-v2, so
  # the rule is namespace-scoped. absent() arm covers the whole namespace going
  # away — which is also how a failed HelmRelease presents.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="gitlab-agent", deployment="weisssrv-k3s-gitlab-agent-v2"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: GitLabAgentDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: gitlab-agent
              deployment: weisssrv-k3s-gitlab-agent-v2
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 35m
        alertname: GitLabAgentDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: gitlab-agent

  # AuthentikWorkerDown: the worker is what runs outposts, tasks and the
  # e-mail/expiry pipeline — the server staying up hides it, so this is named
  # rather than left to the mixin's replicas-mismatch warning.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="authentik", deployment="authentik-worker"}'
        values: '0+0x30'
      - series: 'kube_deployment_status_replicas_available{namespace="authentik", deployment="authentik-server"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AuthentikWorkerDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: authentik
              deployment: authentik-worker
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="authentik", deployment="authentik-server"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AuthentikWorkerDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: authentik
              deployment: authentik-worker

  # PostgresDown covers five databases across three discovery shapes. The
  # pg_up==0 arm carries no job matcher, so a down database from any job fires,
  # one alert per instance.
  - interval: 1m
    input_series:
      - series: 'pg_up{job="authentik-postgresql-metrics", instance="10.42.3.11:9187"}'
        values: '0+0x20'
      - series: 'pg_up{job="gitlab", instance="10.0.10.153:9187"}'
        values: '0+0x20'
      - series: 'pg_up{job="nextcloud", instance="10.0.10.156:9187"}'
        values: '1+0x20'
      - series: 'pg_up{job="immich", instance="10.0.10.157:9187"}'
        values: '1+0x20'
      - series: 'pg_up{job="observability/mealie-postgres", instance="10.42.7.219:9187"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: PostgresDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: authentik-postgresql-metrics
              instance: 10.42.3.11:9187
          - exp_labels:
              severity: warning
              job: gitlab
              instance: 10.0.10.153:9187

  # An exporter dropping out of discovery stops producing pg_up, which the ==0
  # arm cannot see. The absent() arm names each of the five, so one vanishing
  # fires alone with the job label synthesized from the matcher.
  - interval: 1m
    input_series:
      - series: 'pg_up{job="authentik-postgresql-metrics", instance="10.42.3.11:9187"}'
        values: '1+0x20'
      - series: 'pg_up{job="gitlab", instance="10.0.10.153:9187"}'
        values: '1+0x20'
      - series: 'pg_up{job="nextcloud", instance="10.0.10.156:9187"}'
        values: '1+0x20'
      - series: 'pg_up{job="observability/mealie-postgres", instance="10.42.7.219:9187"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: PostgresDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: immich

  # An empty corpus fires all five arms. That is the deliberate cost of the
  # enumeration: a new Ansible-installed exporter must be deployed before its
  # name is added to the rule, never the other way round.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 15m
        alertname: PostgresDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: authentik-postgresql-metrics
          - exp_labels:
              severity: warning
              job: observability/mealie-postgres
          - exp_labels:
              severity: warning
              job: gitlab
          - exp_labels:
              severity: warning
              job: nextcloud
          - exp_labels:
              severity: warning
              job: immich

  # TraefikHighErrorRate: 5xx as a fraction of all requests over 5m, summed
  # across every service. The expression aggregates away every label, so the
  # alert carries only its severity.
  - interval: 1m
    input_series:
      - series: 'traefik_service_requests_total{code="500", service="tv-esweiss@kubernetes"}'
        values: '0+10x40'
      - series: 'traefik_service_requests_total{code="200", service="tv-esweiss@kubernetes"}'
        values: '0+90x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: TraefikHighErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning

  # 2% of the same volume is under the threshold — no alert.
  - interval: 1m
    input_series:
      - series: 'traefik_service_requests_total{code="500", service="tv-esweiss@kubernetes"}'
        values: '0+2x40'
      - series: 'traefik_service_requests_total{code="200", service="tv-esweiss@kubernetes"}'
        values: '0+98x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: TraefikHighErrorRate
        exp_alerts: []

  # The `and sum(rate(...)) > 0` guard: an idle Traefik divides 0 by 0. Flat
  # counters (no requests in the window) are the shape that produces the NaN,
  # and a proxy serving nothing is not a 5xx storm.
  - interval: 1m
    input_series:
      - series: 'traefik_service_requests_total{code="500", service="tv-esweiss@kubernetes"}'
        values: '7+0x40'
      - series: 'traefik_service_requests_total{code="200", service="tv-esweiss@kubernetes"}'
        values: '350+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: TraefikHighErrorRate
        exp_alerts: []

  # PostgresConnectionsHigh joins two exporter series on instance+job+namespace.
  # 90 of 100 connections is over the 80% threshold.
  - interval: 5m
    input_series:
      - series: 'pg_stat_activity_count{instance="10.43.0.9:9187", job="authentik-postgres", namespace="authentik", datname="authentik", state="active"}'
        values: '50+0x20'
      - series: 'pg_stat_activity_count{instance="10.43.0.9:9187", job="authentik-postgres", namespace="authentik", datname="authentik", state="idle"}'
        values: '40+0x20'
      - series: 'pg_settings_max_connections{instance="10.43.0.9:9187", job="authentik-postgres", namespace="authentik"}'
        values: '100+0x20'
    alert_rule_test:
      - eval_time: 25m
        alertname: PostgresConnectionsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.43.0.9:9187
              job: authentik-postgres
              namespace: authentik

  # A max_connections series carrying a different namespace does not join, so
  # the ratio has no series at all and a saturated database would go unseen.
  - interval: 5m
    input_series:
      - series: 'pg_stat_activity_count{instance="10.43.0.9:9187", job="authentik-postgres", namespace="authentik", state="active"}'
        values: '90+0x20'
      - series: 'pg_settings_max_connections{instance="10.43.0.9:9187", job="authentik-postgres", namespace="recipes"}'
        values: '100+0x20'
    alert_rule_test:
      - eval_time: 25m
        alertname: PostgresConnectionsHigh
        exp_alerts: []

  # ImmichDown: min by (job) over the two scrape targets, so one down target is
  # enough; absent() covers the target disappearing from the scrape config.
  - interval: 5m
    input_series:
      - series: 'up{job="immich-metrics", instance="10.0.10.157:8081"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 25m
        alertname: ImmichDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: immich-metrics

  - interval: 5m
    input_series:
      - series: 'up{job="immich-metrics", instance="10.0.10.157:8081"}'
        values: '1+0x20'
      - series: 'up{job="immich-metrics", instance="10.0.10.157:8082"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 25m
        alertname: ImmichDown
        exp_alerts: []

  # No immich-metrics series at all: the absent() arm fires, carrying the job
  # label from the selector.
  - interval: 5m
    input_series:
      - series: 'up{job="something-else"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 25m
        alertname: ImmichDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: immich-metrics

  # NextcloudDown: the same shape without a `by`, so neither arm carries labels.
  - interval: 5m
    input_series:
      - series: 'nextcloud_up{instance="10.0.10.156:9205"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 25m
        alertname: NextcloudDown
        exp_alerts:
          - exp_labels:
              severity: warning

  - interval: 5m
    input_series:
      - series: 'nextcloud_up{instance="10.0.10.156:9205"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 25m
        alertname: NextcloudDown
        exp_alerts: []

  - interval: 5m
    input_series:
      - series: 'up{job="something-else"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 25m
        alertname: NextcloudDown
        exp_alerts:
          - exp_labels:
              severity: warning

  # LokiRequestFailures: 10% of requests 5xx is over the 5% threshold.
  - interval: 1m
    input_series:
      - series: 'loki_request_duration_seconds_count{status_code="500", job="observability/loki", route="push"}'
        values: '0+60x40'
      - series: 'loki_request_duration_seconds_count{status_code="200", job="observability/loki", route="push"}'
        values: '0+540x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: LokiRequestFailures
        exp_alerts:
          - exp_labels:
              severity: warning

  # 2% of the same volume stays under it.
  - interval: 1m
    input_series:
      - series: 'loki_request_duration_seconds_count{status_code="500", job="observability/loki", route="push"}'
        values: '0+12x40'
      - series: 'loki_request_duration_seconds_count{status_code="200", job="observability/loki", route="push"}'
        values: '0+588x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: LokiRequestFailures
        exp_alerts: []

  # Flat counters: the denominator guard keeps an idle Loki from dividing 0 by 0.
  - interval: 1m
    input_series:
      - series: 'loki_request_duration_seconds_count{status_code="500", job="observability/loki", route="push"}'
        values: '9+0x40'
      - series: 'loki_request_duration_seconds_count{status_code="200", job="observability/loki", route="push"}'
        values: '400+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: LokiRequestFailures
        exp_alerts: []

  # HAInfraGuestDown watches four guest ids by anchored regex. The two decoys
  # pin that anchoring: lxc/152 is outside the set, and lxc/1500 would match an
  # unanchored `lxc/150`. max by (id) dedups the per-host scrape targets.
  - interval: 1m
    input_series:
      - series: 'pve_up{id="lxc/150", target="10.0.10.102"}'
        values: '0+0x20'
      - series: 'pve_up{id="lxc/150", target="10.0.10.103"}'
        values: '0+0x20'
      - series: 'pve_up{id="qemu/154", target="10.0.10.102"}'
        values: '1+0x20'
      - series: 'pve_up{id="lxc/152", target="10.0.10.102"}'
        values: '0+0x20'
      - series: 'pve_up{id="lxc/1500", target="10.0.10.102"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: HAInfraGuestDown
        exp_alerts:
          - exp_labels:
              severity: critical
              id: lxc/150

  # AuthentikFlowLatencyHigh: p95 flow planning past 1s. The healthy case is the
  # live baseline (about 10ms), which must stay silent.
  - interval: 1m
    input_series:
      - series: 'authentik_flows_plan_time_bucket{le="0.01"}'
        values: '0+0x60'
      - series: 'authentik_flows_plan_time_bucket{le="0.1"}'
        values: '0+0x60'
      - series: 'authentik_flows_plan_time_bucket{le="1"}'
        values: '0+0x60'
      - series: 'authentik_flows_plan_time_bucket{le="10"}'
        values: '0+10x60'
      - series: 'authentik_flows_plan_time_bucket{le="+Inf"}'
        values: '0+10x60'
    alert_rule_test:
      # Inside the 15m hold.
      - eval_time: 10m
        alertname: AuthentikFlowLatencyHigh
        exp_alerts: []
      - eval_time: 55m
        alertname: AuthentikFlowLatencyHigh
        exp_alerts:
          - exp_labels:
              severity: warning

  # The healthy arm sits just INSIDE the 1s budget (p95 lands at ~0.95s), so the
  # threshold is pinned from below as well as above.
  - interval: 1m
    input_series:
      - series: 'authentik_flows_plan_time_bucket{le="0.01"}'
        values: '0+0x60'
      - series: 'authentik_flows_plan_time_bucket{le="0.1"}'
        values: '0+0x60'
      - series: 'authentik_flows_plan_time_bucket{le="1"}'
        values: '0+10x60'
      - series: 'authentik_flows_plan_time_bucket{le="10"}'
        values: '0+10x60'
      - series: 'authentik_flows_plan_time_bucket{le="+Inf"}'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 55m
        alertname: AuthentikFlowLatencyHigh
        exp_alerts: []

  # ProxmoxHostDown is the fleet's host-down signal. min by (id) over a 5m
  # max_over_time dedups the per-host scrape targets, so a host is down only
  # when every target agrees.
  - interval: 1m
    input_series:
      - series: 'pve_up{id="node/pve-nas-01", target="10.0.10.102"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ProxmoxHostDown
        exp_alerts:
          - exp_labels:
              severity: critical
              id: node/pve-nas-01

  - interval: 1m
    input_series:
      - series: 'pve_up{id="node/pve-nas-01", target="10.0.10.102"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ProxmoxHostDown
        exp_alerts: []

  # The absent() arm: a renamed pve_up label or a dead Proxmox exporter reads as
  # a healthy fleet without it, and the alert carries no id to name the host.
  - interval: 1m
    input_series:
      - series: 'pve_up{id="node/pve-nas-01", target="10.0.10.102"}'
        values: '1 stale'
    alert_rule_test:
      - eval_time: 10m
        alertname: ProxmoxHostDown
        exp_alerts:
          - exp_labels:
              severity: critical
