---
# promtool unit tests for the SMART growth arms (homelab.storage group).
# The counters are normally non-zero and constant, so the property under test
# is that a standing value stays silent and only growth in the window fires.
rule_files:
  - rules.yaml
evaluation_interval: 5m
tests:
  # Reallocated sectors: 24h max-min. A constant historical count is silent.
  - interval: 5m
    input_series:
      - series: 'smartmon_reallocated_sector_count{instance="10.0.10.102:9101", disk="sda"}'
        values: '8+0x300'
    alert_rule_test:
      - eval_time: 24h
        alertname: SMARTReallocatedSectorsGrowing
        exp_alerts: []

  # The same drive gaining one sector inside the window fires.
  - interval: 5m
    input_series:
      - series: 'smartmon_reallocated_sector_count{instance="10.0.10.102:9101", disk="sda"}'
        values: '8+0x200 9+0x100'
    alert_rule_test:
      - eval_time: 24h
        alertname: SMARTReallocatedSectorsGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.0.10.102:9101
              disk: sda

  # The pending/offline-uncorrectable pair is DIRECTIONAL: latest reading minus
  # the 24h floor. A sector found days ago and never joined is silent.
  - interval: 5m
    input_series:
      - series: 'smartmon_current_pending_sector_count{instance="10.0.10.102:9101", device="/dev/sdf"}'
        values: '1+0x300'
    alert_rule_test:
      - eval_time: 24h
        alertname: SMARTPendingSectorsGrowing
        exp_alerts: []

  # A second sector inside the window fires.
  - interval: 5m
    input_series:
      - series: 'smartmon_current_pending_sector_count{instance="10.0.10.102:9101", device="/dev/sdf"}'
        values: '1+0x200 2+0x100'
    alert_rule_test:
      - eval_time: 24h
        alertname: SMARTPendingSectorsGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.0.10.102:9101
              device: /dev/sdf

  # Replacement reset: the counter DROPS to 0 on a new drive. The drop lands
  # inside the final hour, so max-minus-min reads 8 of growth there and
  # latest-minus-min reads 0 — the only shape that tells the two apart.
  - interval: 5m
    input_series:
      - series: 'smartmon_current_pending_sector_count{instance="10.0.10.102:9101", device="/dev/sdf"}'
        values: '8+0x280 0+0x8'
    alert_rule_test:
      - eval_time: 24h
        alertname: SMARTPendingSectorsGrowing
        exp_alerts: []

  # Self-closing: growth in the first hour still fires at 24h, and goes quiet
  # once the pre-growth floor has aged out of the 24h window.
  - interval: 5m
    input_series:
      - series: 'smartmon_current_pending_sector_count{instance="10.0.10.102:9101", device="/dev/sdf"}'
        values: '1+0x6 2+0x320'
    alert_rule_test:
      - eval_time: 24h
        alertname: SMARTPendingSectorsGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.0.10.102:9101
              device: /dev/sdf
      - eval_time: 26h
        alertname: SMARTPendingSectorsGrowing
        exp_alerts: []

  # Offline-uncorrectable, the same shape on its own attribute.
  - interval: 5m
    input_series:
      - series: 'smartmon_offline_uncorrectable_count{instance="10.0.10.102:9101", device="/dev/sdb"}'
        values: '2+0x300'
    alert_rule_test:
      - eval_time: 24h
        alertname: SMARTOfflineUncorrectableGrowing
        exp_alerts: []

  - interval: 5m
    input_series:
      - series: 'smartmon_offline_uncorrectable_count{instance="10.0.10.102:9101", device="/dev/sdb"}'
        values: '0+0x200 2+0x100'
    alert_rule_test:
      - eval_time: 24h
        alertname: SMARTOfflineUncorrectableGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.0.10.102:9101
              device: /dev/sdb

  # The same reset shape on this attribute, drop inside the final hour.
  - interval: 5m
    input_series:
      - series: 'smartmon_offline_uncorrectable_count{instance="10.0.10.102:9101", device="/dev/sdb"}'
        values: '4+0x280 0+0x8'
    alert_rule_test:
      - eval_time: 24h
        alertname: SMARTOfflineUncorrectableGrowing
        exp_alerts: []

  # Media errors, same shape, on the NVMe attribute set.
  - interval: 5m
    input_series:
      - series: 'smartmon_media_errors_count{instance="10.0.10.102:9101", disk="nvme0"}'
        values: '0+0x100'
    alert_rule_test:
      - eval_time: 6h
        alertname: SMARTMediaErrors
        exp_alerts: []

  - interval: 5m
    input_series:
      - series: 'smartmon_media_errors_count{instance="10.0.10.102:9101", disk="nvme0"}'
        values: '0+0x50 1+0x50'
    alert_rule_test:
      - eval_time: 6h
        alertname: SMARTMediaErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.0.10.102:9101
              disk: nvme0
