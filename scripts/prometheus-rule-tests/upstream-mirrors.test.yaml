---
# promtool unit tests for the three local copies of rules the chart disables —
# TargetDown (30m), NodeSystemSaturation (1h), KubeVersionMismatch (12h) — and
# the local TargetDownExportarr (1h). 5m interval pins each hold both ways.
rule_files:
  - rules.yaml
evaluation_interval: 5m
tests:
  # TargetDown: upstream's >10%-of-a-job threshold held for 30m. One of two
  # targets down is 50%, so it fires; keep_firing_for holds it 15m past the
  # recovery so a flapping exporter is one episode.
  - interval: 5m
    input_series:
      - series: 'up{job="kube-prometheus-stack-grafana", namespace="observability", service="kube-prometheus-stack-grafana", instance="10.42.1.10:3000"}'
        values: '0+0x40 1+0x20'
      - series: 'up{job="kube-prometheus-stack-grafana", namespace="observability", service="kube-prometheus-stack-grafana", instance="10.42.1.11:3000"}'
        values: '1+0x60'
    alert_rule_test:
      # 25m is still pending: shortening the hold to 10m fails here.
      - eval_time: 25m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 35m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: kube-prometheus-stack-grafana
              namespace: observability
              service: kube-prometheus-stack-grafana
      # Recovered at 200m; keep_firing_for: 15m still holds it at 210m.
      - eval_time: 210m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: kube-prometheus-stack-grafana
              namespace: observability
              service: kube-prometheus-stack-grafana
      - eval_time: 240m
        alertname: TargetDown
        exp_alerts: []

  # A rollout that recovers inside 30m is the case the hold exists for: the
  # condition runs 25 minutes and the rule stays pending throughout.
  - interval: 5m
    input_series:
      - series: 'up{job="kube-prometheus-stack-grafana", namespace="observability", service="kube-prometheus-stack-grafana", instance="10.42.1.10:3000"}'
        values: '0+0x5 1+0x40'
      - series: 'up{job="kube-prometheus-stack-grafana", namespace="observability", service="kube-prometheus-stack-grafana", instance="10.42.1.11:3000"}'
        values: '1+0x45'
    alert_rule_test:
      - eval_time: 90m
        alertname: TargetDown
        exp_alerts: []

  # The exportarr jobs reach the generic mirror through neither arm: a sonarr
  # target down for two hours leaves TargetDown silent and is TargetDownExportarr's
  # alone, so dropping either job matcher fails this case.
  - interval: 5m
    input_series:
      - series: 'up{job="exportarr-sonarr", namespace="observability", service="exportarr-sonarr", instance="10.42.1.10:9707"}'
        values: '0+0x24'
      - series: 'up{job="exportarr-radarr", namespace="observability", service="exportarr-radarr", instance="10.42.1.11:9707"}'
        values: '1+0x24'
    alert_rule_test:
      - eval_time: 120m
        alertname: TargetDown
        exp_alerts: []
      # 55m is still pending: shortening the hold to 30m fails here.
      - eval_time: 55m
        alertname: TargetDownExportarr
        exp_alerts: []
      - eval_time: 65m
        alertname: TargetDownExportarr
        exp_alerts:
          - exp_labels:
              severity: warning
              job: exportarr-sonarr
              namespace: observability
              service: exportarr-sonarr

  # The 54-minute stall the hour was measured against: the longest *arr API
  # stall on record stays pending, and keep_firing_for never arms.
  - interval: 5m
    input_series:
      - series: 'up{job="exportarr-sonarr", namespace="observability", service="exportarr-sonarr", instance="10.42.1.10:9707"}'
        values: '0+0x10 1+0x30'
    alert_rule_test:
      - eval_time: 180m
        alertname: TargetDownExportarr
        exp_alerts: []

  # NodeSystemSaturation: load1 per core above 2, held for an hour. Two cores
  # at load 6 is 3.0, so it fires; the alertname is upstream's so the
  # NodeOutageStormControl inhibit target list keeps matching it.
  - interval: 5m
    input_series:
      - series: 'node_load1{job="node-exporter", instance="10.0.10.204:9100"}'
        values: '6+0x40'
      - series: 'node_cpu_seconds_total{job="node-exporter", instance="10.0.10.204:9100", cpu="0", mode="idle"}'
        values: '0+10x40'
      - series: 'node_cpu_seconds_total{job="node-exporter", instance="10.0.10.204:9100", cpu="1", mode="idle"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: NodeSystemSaturation
        exp_alerts: []
      - eval_time: 90m
        alertname: NodeSystemSaturation
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.0.10.204:9100
              job: node-exporter

  # The CI burst this mirror exists for: 31 minutes is the longest benign run
  # on record, so a half-hour of load 3.0 per core must stay silent.
  - interval: 5m
    input_series:
      - series: 'node_load1{job="node-exporter", instance="10.0.10.204:9100"}'
        values: '6+0x6 1+0x40'
      - series: 'node_cpu_seconds_total{job="node-exporter", instance="10.0.10.204:9100", cpu="0", mode="idle"}'
        values: '0+10x46'
      - series: 'node_cpu_seconds_total{job="node-exporter", instance="10.0.10.204:9100", cpu="1", mode="idle"}'
        values: '0+10x46'
    alert_rule_test:
      - eval_time: 180m
        alertname: NodeSystemSaturation
        exp_alerts: []

  # KubeVersionMismatch: two minors on the cluster held for 12h. The upstream
  # label_replace trims the patch, so v1.37.1 and v1.37.4 are one version and
  # only a minor straddle counts.
  - interval: 5m
    input_series:
      - series: 'kubernetes_build_info{job="apiserver", cluster="weisssrv", git_version="v1.36.4+k3s1"}'
        values: '1+0x200'
      - series: 'kubernetes_build_info{job="kubelet", cluster="weisssrv", git_version="v1.37.1+k3s1"}'
        values: '1+0x200'
    alert_rule_test:
      # The planned 5-hour k3s minor upgrade straddle is still pending.
      - eval_time: 6h
        alertname: KubeVersionMismatch
        exp_alerts: []
      - eval_time: 13h
        alertname: KubeVersionMismatch
        exp_alerts:
          - exp_labels:
              severity: warning
              cluster: weisssrv

  # Two patch releases of one minor: label_replace collapses them, so a rolling
  # patch upgrade never arms the alert at all.
  - interval: 5m
    input_series:
      - series: 'kubernetes_build_info{job="apiserver", cluster="weisssrv", git_version="v1.37.1+k3s1"}'
        values: '1+0x200'
      - series: 'kubernetes_build_info{job="kubelet", cluster="weisssrv", git_version="v1.37.4+k3s1"}'
        values: '1+0x200'
    alert_rule_test:
      - eval_time: 13h
        alertname: KubeVersionMismatch
        exp_alerts: []
