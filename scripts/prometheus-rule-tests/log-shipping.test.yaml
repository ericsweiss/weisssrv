---
# promtool unit tests for PodLogShippingStale, the in-cluster container-log
# path. The host-journald twin is covered by test_host_log_staleness.py.
# The uptime arm keeps a freshly-started Alloy pod from firing the rule.
rule_files:
  - rules.yaml
evaluation_interval: 5m
tests:
  # A pod that stops shipping, up just past the 1h grace. The uptime sits close
  # to the threshold so raising the grace breaks this case, not only lowering it.
  - interval: 5m
    input_series:
      - series: 'loki_write_sent_entries_total{namespace="observability", pod="alloy-x7k2p", instance="10.42.0.56:12345"}'
        values: '1000+0x60'
      - series: 'process_start_time_seconds{namespace="observability", pod="alloy-x7k2p", instance="10.42.0.56:12345"}'
        values: '-1200+0x60'
    alert_rule_test:
      # 45m of flat counter plus the 15m hold.
      - eval_time: 65m
        alertname: PodLogShippingStale
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.42.0.56:12345
      # Inside the 15m hold. increase() over a flat counter reads zero as soon
      # as two samples are in the window, so the pending clock starts early —
      # the hold is what absorbs a brief quiet window, not the 45m range.
      - eval_time: 10m
        alertname: PodLogShippingStale
        exp_alerts: []

  # The same flat counter on a pod that is still inside the 1h grace, at ~55m.
  # This is the shape that made a bare `== 0` unusable; the uptime arm suppresses
  # it, and sitting just inside the grace pins the threshold from below.
  - interval: 5m
    input_series:
      - series: 'loki_write_sent_entries_total{namespace="observability", pod="alloy-x7k2p", instance="10.42.0.56:12345"}'
        values: '0+0x60'
      - series: 'process_start_time_seconds{namespace="observability", pod="alloy-x7k2p", instance="10.42.0.56:12345"}'
        values: '600+0x60'
    alert_rule_test:
      - eval_time: 65m
        alertname: PodLogShippingStale
        exp_alerts: []

  # A pod shipping normally: the counter advances every scrape, so the increase
  # is non-zero regardless of uptime.
  - interval: 5m
    input_series:
      - series: 'loki_write_sent_entries_total{namespace="observability", pod="alloy-x7k2p", instance="10.42.0.56:12345"}'
        values: '0+500x60'
      - series: 'process_start_time_seconds{namespace="observability", pod="alloy-x7k2p", instance="10.42.0.56:12345"}'
        values: '-100000+0x60'
    alert_rule_test:
      - eval_time: 65m
        alertname: PodLogShippingStale
        exp_alerts: []

  # The target disappearing entirely yields an empty vector, not an alert —
  # that case belongs to TargetDown, and the two are complementary by design.
  - interval: 5m
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: PodLogShippingStale
        exp_alerts: []

  # One quiet node out of several must alert alone: the rule is summed BY
  # instance, so a busy neighbour cannot mask it.
  - interval: 5m
    input_series:
      - series: 'loki_write_sent_entries_total{namespace="observability", pod="alloy-x7k2p", instance="10.42.0.56:12345"}'
        values: '1000+0x60'
      - series: 'process_start_time_seconds{namespace="observability", pod="alloy-x7k2p", instance="10.42.0.56:12345"}'
        values: '-100000+0x60'
      - series: 'loki_write_sent_entries_total{namespace="observability", pod="alloy-m4q9r", instance="10.42.8.54:12345"}'
        values: '0+500x60'
      - series: 'process_start_time_seconds{namespace="observability", pod="alloy-m4q9r", instance="10.42.8.54:12345"}'
        values: '-100000+0x60'
    alert_rule_test:
      - eval_time: 65m
        alertname: PodLogShippingStale
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.42.0.56:12345

  # alloy-syslog is the UniFi receiver Deployment, not the container-log
  # DaemonSet: its quiet counter is UnifiSyslogStale's signal, not this one's.
  - interval: 5m
    input_series:
      - series: 'loki_write_sent_entries_total{namespace="observability", pod="alloy-syslog-db5ff859b-cjxgz", instance="10.42.3.11:12345"}'
        values: '1000+0x60'
      - series: 'process_start_time_seconds{namespace="observability", pod="alloy-syslog-db5ff859b-cjxgz", instance="10.42.3.11:12345"}'
        values: '-100000+0x60'
      - series: 'loki_write_sent_entries_total{namespace="observability", pod="alloy-x7k2p", instance="10.42.0.56:12345"}'
        values: '1000+0x60'
      - series: 'process_start_time_seconds{namespace="observability", pod="alloy-x7k2p", instance="10.42.0.56:12345"}'
        values: '-100000+0x60'
    alert_rule_test:
      - eval_time: 65m
        alertname: PodLogShippingStale
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.42.0.56:12345
