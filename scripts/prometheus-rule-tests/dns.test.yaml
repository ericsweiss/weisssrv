---
# promtool unit tests for the Unbound resolver alerts: the dead-resolver and
# dead-exporter pair that must stay distinguishable, and the SERVFAIL ratio
# whose denominator excludes the nodata rcode.
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  # Unbound's control socket stops answering on dns-01 while the exporter is
  # still scraped: UnboundDown fires, UnboundExporterDown stays quiet.
  - interval: 1m
    input_series:
      - series: 'unbound_up{job="unbound-exporter", instance="10.0.10.150:9167"}'
        values: '1+0x5 0+0x30'
      - series: 'up{job="unbound-exporter", instance="10.0.10.150:9167"}'
        values: '1+0x35'
    alert_rule_test:
      # Inside the 5m hold — a unbound restart must not page.
      - eval_time: 8m
        alertname: UnboundDown
        exp_alerts: []
      - eval_time: 20m
        alertname: UnboundDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: unbound-exporter
              instance: 10.0.10.150:9167
      - eval_time: 20m
        alertname: UnboundExporterDown
        exp_alerts: []

  # Healthy resolver on both guests: neither arm fires.
  - interval: 1m
    input_series:
      - series: 'unbound_up{job="unbound-exporter", instance="10.0.10.150:9167"}'
        values: '1+0x35'
      - series: 'unbound_up{job="unbound-exporter", instance="10.0.10.160:9167"}'
        values: '1+0x35'
      - series: 'up{job="unbound-exporter", instance="10.0.10.150:9167"}'
        values: '1+0x35'
      - series: 'up{job="unbound-exporter", instance="10.0.10.160:9167"}'
        values: '1+0x35'
    alert_rule_test:
      - eval_time: 30m
        alertname: UnboundDown
        exp_alerts: []
      - eval_time: 30m
        alertname: UnboundExporterDown
        exp_alerts: []

  # The scrape fails on dns-02. unbound_up goes stale with it, so UnboundDown
  # cannot fire for that resolver and only the exporter arm covers the outage.
  - interval: 1m
    input_series:
      - series: 'up{job="unbound-exporter", instance="10.0.10.150:9167"}'
        values: '1+0x35'
      - series: 'up{job="unbound-exporter", instance="10.0.10.160:9167"}'
        values: '0+0x35'
      - series: 'unbound_up{job="unbound-exporter", instance="10.0.10.150:9167"}'
        values: '1+0x35'
    alert_rule_test:
      - eval_time: 10m
        alertname: UnboundExporterDown
        exp_alerts: []
      - eval_time: 25m
        alertname: UnboundExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: unbound-exporter
              instance: 10.0.10.160:9167
      - eval_time: 25m
        alertname: UnboundDown
        exp_alerts: []

  # No target at all: the absent() arm is the only thing that still reports.
  # absent() carries the selector's own job label and no instance.
  - interval: 1m
    input_series:
      - series: 'unbound_cache_hits_total{job="unbound-exporter", instance="10.0.10.150:9167", thread="0"}'
        values: '0+10x35'
    alert_rule_test:
      - eval_time: 25m
        alertname: UnboundExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: unbound-exporter

  # Upstreams wedged: 10 SERVFAIL per 70 answers is 14%, over the 5% threshold.
  # The nodata counter runs alongside at 200/min, so summing it into the
  # denominator would read 3.7% and this arm would go silent.
  - interval: 1m
    input_series:
      - series: 'unbound_answer_rcodes_total{job="unbound-exporter", instance="10.0.10.150:9167", rcode="SERVFAIL"}'
        values: '0+10x45'
      - series: 'unbound_answer_rcodes_total{job="unbound-exporter", instance="10.0.10.150:9167", rcode="NOERROR"}'
        values: '0+60x45'
      - series: 'unbound_answer_rcodes_total{job="unbound-exporter", instance="10.0.10.150:9167", rcode="nodata"}'
        values: '0+200x45'
    alert_rule_test:
      # Inside the 15m hold.
      - eval_time: 10m
        alertname: UnboundSERVFAILRatioHigh
        exp_alerts: []
      - eval_time: 40m
        alertname: UnboundSERVFAILRatioHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.0.10.150:9167

  # The threshold from below: 2 SERVFAIL per 100 answers is 2%, the ordinary
  # DNSSEC-failure floor, and must stay silent however long it runs.
  - interval: 1m
    input_series:
      - series: 'unbound_answer_rcodes_total{job="unbound-exporter", instance="10.0.10.150:9167", rcode="SERVFAIL"}'
        values: '0+2x45'
      - series: 'unbound_answer_rcodes_total{job="unbound-exporter", instance="10.0.10.150:9167", rcode="NOERROR"}'
        values: '0+98x45'
    alert_rule_test:
      - eval_time: 40m
        alertname: UnboundSERVFAILRatioHigh
        exp_alerts: []

  # An idle resolver answers nothing: 0/0 is NaN, not a ratio over threshold.
  - interval: 1m
    input_series:
      - series: 'unbound_answer_rcodes_total{job="unbound-exporter", instance="10.0.10.150:9167", rcode="SERVFAIL"}'
        values: '0+0x45'
      - series: 'unbound_answer_rcodes_total{job="unbound-exporter", instance="10.0.10.150:9167", rcode="NOERROR"}'
        values: '0+0x45'
    alert_rule_test:
      - eval_time: 40m
        alertname: UnboundSERVFAILRatioHigh
        exp_alerts: []
