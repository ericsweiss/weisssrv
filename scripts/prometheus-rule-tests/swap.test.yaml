---
# promtool unit tests for the NAS swap alerts: the swap-clean textfile guards and
# the NASSwapNotClearing 2-day min_over_time window (the load-bearing subquery).
# 30m interval keeps the 2-day window's sample count tractable.
rule_files:
  - rules.yaml
evaluation_interval: 30m
tests:
  # SwapCleanFailed fires when the daily job records a hard error (metric 0).
  - interval: 30m
    input_series:
      - series: 'swap_clean_last_run_success{instance="192.168.0.102:9101"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 90m
        alertname: SwapCleanFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '192.168.0.102:9101'

  # A clean run (metric 1) must not fire.
  - interval: 30m
    input_series:
      - series: 'swap_clean_last_run_success{instance="192.168.0.102:9101"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 90m
        alertname: SwapCleanFailed
        exp_alerts: []

  # SwapCleanStoppedGuests fires when the escalation stopped any guest in the
  # last day (max_over_time > 0).
  - interval: 30m
    input_series:
      - series: 'swap_clean_guests_stopped_count{instance="192.168.0.102:9101"}'
        values: '2+0x5'
    alert_rule_test:
      - eval_time: 60m
        alertname: SwapCleanStoppedGuests
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '192.168.0.102:9101'

  # No guests stopped (count 0) must not fire.
  - interval: 30m
    input_series:
      - series: 'swap_clean_guests_stopped_count{instance="192.168.0.102:9101"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 60m
        alertname: SwapCleanStoppedGuests
        exp_alerts: []

  # SwapCleanGuestRestartFailed fires when a stopped guest failed to come back
  # (swap_clean_guest_restart_failures > 0) — a production guest is likely down.
  - interval: 30m
    input_series:
      - series: 'swap_clean_guest_restart_failures{instance="192.168.0.102:9101"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 60m
        alertname: SwapCleanGuestRestartFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '192.168.0.102:9101'

  # A good run (metric always present, 0) must not fire.
  - interval: 30m
    input_series:
      - series: 'swap_clean_guest_restart_failures{instance="192.168.0.102:9101"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 60m
        alertname: SwapCleanGuestRestartFailed
        exp_alerts: []

  # NASSwapNotClearing: used swap (SwapTotal-SwapFree) staying above 2 GiB for
  # the FULL 2-day min window fires (min = 4 GiB > 2 GiB).
  - interval: 30m
    input_series:
      - series: 'node_memory_SwapTotal_bytes{instance="192.168.0.102:9101"}'
        values: '8589934592+0x110'
      - series: 'node_memory_SwapFree_bytes{instance="192.168.0.102:9101"}'
        values: '4294967296+0x110'
    alert_rule_test:
      - eval_time: 2940m
        alertname: NASSwapNotClearing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '192.168.0.102:9101'

  # A single dip below 2 GiB within the 2-day window (swap DID clear once) makes
  # min_over_time < 2 GiB, so it must NOT fire — this is the whole point of the
  # min-over-window: it demands SUSTAINED high swap, not a transient peak.
  - interval: 30m
    input_series:
      - series: 'node_memory_SwapTotal_bytes{instance="192.168.0.102:9101"}'
        values: '8589934592+0x110'
      # used = 4 GiB, except a 4-sample dip to used = 1 GiB (Free = 7 GiB) at
      # t=1500-1590m, inside the eval-time 2-day window.
      - series: 'node_memory_SwapFree_bytes{instance="192.168.0.102:9101"}'
        values: '4294967296+0x50 7516192768+0x3 4294967296+0x56'
    alert_rule_test:
      - eval_time: 2940m
        alertname: NASSwapNotClearing
        exp_alerts: []

  # NASSwapGone: SwapTotal == 0 sustained 30m fires (the swapless-NAS net the
  # accumulation alert can't see — no usage exists to accumulate).
  - interval: 1m
    input_series:
      - series: 'node_memory_SwapTotal_bytes{instance="192.168.0.102:9101"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: NASSwapGone
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '192.168.0.102:9101'

  # Healthy swap present (any non-zero SwapTotal) must NOT fire.
  - interval: 1m
    input_series:
      - series: 'node_memory_SwapTotal_bytes{instance="192.168.0.102:9101"}'
        values: '34359738368+0x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: NASSwapGone
        exp_alerts: []
