---
# promtool unit tests for the textfile-collector staleness guard family.
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  # PostfixQueueCollectorStale fires when the collector's last-success timestamp
  # is stale (>15m). A fresh timestamp does not fire.
  - interval: 1m
    input_series:
      - series: 'postfix_queue_collector_last_success_seconds{instance="10.0.10.151:9101"}'
        values: '-2000+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: PostfixQueueCollectorStale
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '10.0.10.151:9101'

  - interval: 1m
    input_series:
      # Fresh: timestamp tracks ~now, so time() - ts stays under 900s.
      - series: 'postfix_queue_collector_last_success_seconds{instance="10.0.10.151:9101"}'
        values: '0+60x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: PostfixQueueCollectorStale
        exp_alerts: []

  # absent() arm: the series missing entirely (collector undeployed/removed)
  # must fire — this is the "be loud instead of silently blind" half of the
  # rule, where a renamed metric or bad selector would otherwise hide.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 6m
        alertname: PostfixQueueCollectorStale
        exp_alerts:
          - exp_labels:
              severity: warning

  # SMARTCollectorStale, same three arms: stale timestamp, fresh timestamp,
  # series absent entirely.
  - interval: 1m
    input_series:
      - series: 'smartmon_collector_last_success_seconds{instance="10.0.10.102:9101"}'
        values: '-2000+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: SMARTCollectorStale
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '10.0.10.102:9101'

  - interval: 1m
    input_series:
      - series: 'smartmon_collector_last_success_seconds{instance="10.0.10.102:9101"}'
        values: '0+60x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: SMARTCollectorStale
        exp_alerts: []

  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 6m
        alertname: SMARTCollectorStale
        exp_alerts:
          - exp_labels:
              severity: warning

  # The success arm: a fresh timestamp with smartmon_collector_success 0 is the
  # "smartctl gone, no device enumerated" state the other arms read as healthy.
  - interval: 1m
    input_series:
      - series: 'smartmon_collector_last_success_seconds{instance="10.0.10.102:9101"}'
        values: '0+60x20'
      - series: 'smartmon_collector_success{instance="10.0.10.102:9101"}'
        values: '1+0x2 0+0x18'
    alert_rule_test:
      - eval_time: 10m
        alertname: SMARTCollectorStale
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '10.0.10.102:9101'

  # A host whose collector has only ever reported 0 has no SMART device to lose,
  # so the max_over_time guard keeps it quiet.
  - interval: 1m
    input_series:
      - series: 'smartmon_collector_last_success_seconds{instance="10.0.10.154:9101"}'
        values: '0+60x20'
      - series: 'smartmon_collector_success{instance="10.0.10.154:9101"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: SMARTCollectorStale
        exp_alerts: []
