---
# promtool unit tests for storage-hygiene alerts (homelab.storage group).
# rule_files resolves relative to this file's runtime location; the lint script
# copies the tests next to the extracted rules.yaml before running them.
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  # LocalPathPVExists fires per-PV when any PersistentVolume is on the local-path
  # StorageClass (the stateless VM bootdisk, excluded from backups). A PV on the
  # empty/static class must NOT fire; the alert carries the offending PV name.
  - interval: 1m
    input_series:
      - series: 'kube_persistentvolume_info{storageclass="local-path", persistentvolume="pvc-744de65c"}'
        values: '1+0x30'
      - series: 'kube_persistentvolume_info{storageclass="", persistentvolume="loki-data"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: LocalPathPVExists
        exp_alerts:
          - exp_labels:
              severity: warning
              storageclass: local-path
              persistentvolume: pvc-744de65c

  # No local-path PVs present -> no alert.
  - interval: 1m
    input_series:
      - series: 'kube_persistentvolume_info{storageclass="", persistentvolume="loki-data"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: LocalPathPVExists
        exp_alerts: []

  # KubeletImageGCIneffective is scoped to the in-cluster DaemonSet: a host
  # exporter target (job="node-exporter-host", :9101) at the same fill level
  # must not fire, and a node under the 70% watermark must not either.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node-exporter", instance="10.42.1.7:9100", mountpoint="/"}'
        values: '20+0x60'
      - series: 'node_filesystem_size_bytes{job="node-exporter", instance="10.42.1.7:9100", mountpoint="/"}'
        values: '100+0x60'
      - series: 'node_filesystem_avail_bytes{job="node-exporter", instance="10.42.1.8:9100", mountpoint="/"}'
        values: '40+0x60'
      - series: 'node_filesystem_size_bytes{job="node-exporter", instance="10.42.1.8:9100", mountpoint="/"}'
        values: '100+0x60'
      - series: 'node_filesystem_avail_bytes{job="node-exporter-host", instance="10.0.10.102:9101", mountpoint="/"}'
        values: '20+0x60'
      - series: 'node_filesystem_size_bytes{job="node-exporter-host", instance="10.0.10.102:9101", mountpoint="/"}'
        values: '100+0x60'
    alert_rule_test:
      # Inside the 30m hold.
      - eval_time: 20m
        alertname: KubeletImageGCIneffective
        exp_alerts: []
      - eval_time: 45m
        alertname: KubeletImageGCIneffective
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter
              instance: '10.42.1.7:9100'
              mountpoint: /

  # DiskUsageWarning floors the ratio over 1h, so the CI sawtooth on the
  # privileged-runner node (75% baseline, 15-40m bursts over 80%) is silent and
  # only a filesystem that stays over 80% for a full hour fires.
  - interval: 5m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node-exporter", instance="10.0.10.207:9100", mountpoint="/", fstype="ext4"}'
        values: '25+0x12 15+0x6 25+0x30'
      - series: 'node_filesystem_size_bytes{job="node-exporter", instance="10.0.10.207:9100", mountpoint="/", fstype="ext4"}'
        values: '100+0x48'
    alert_rule_test:
      # 85m is 20 minutes into the 85% burst, so the un-floored expr fires here
      # and the 1h floor still reads the 75% baseline. This pins the floor.
      - eval_time: 85m
        alertname: DiskUsageWarning
        exp_alerts: []
      - eval_time: 100m
        alertname: DiskUsageWarning
        exp_alerts: []

  - interval: 5m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node-exporter", instance="10.0.10.207:9100", mountpoint="/", fstype="ext4"}'
        values: '15+0x48'
      - series: 'node_filesystem_size_bytes{job="node-exporter", instance="10.0.10.207:9100", mountpoint="/", fstype="ext4"}'
        values: '100+0x48'
    alert_rule_test:
      # Inside the 10m hold the floor is already over 80, so this pins the hold.
      - eval_time: 5m
        alertname: DiskUsageWarning
        exp_alerts: []
      - eval_time: 100m
        alertname: DiskUsageWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter
              instance: '10.0.10.207:9100'
              mountpoint: /
              fstype: ext4
      # DiskUsageCritical keeps the un-floored fast path at 90%.
      - eval_time: 100m
        alertname: DiskUsageCritical
        exp_alerts: []
