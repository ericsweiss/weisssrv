---
# promtool unit tests for the PSI host alerts: the firing threshold, the 15m
# hold that keeps the nightly backup-chain burst silent, and the instance
# rescope so only the six bare-metal Proxmox hosts can fire.
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  # IO pressure rising at 0.5/s > 0.20 threshold on a Proxmox host fires once
  # past the 15m hold; the same load on the GitLab VM (.153) is excluded by the
  # instance filter.
  - interval: 1m
    input_series:
      - series: 'node_pressure_io_waiting_seconds_total{job="node-exporter-host", instance="10.0.10.102:9101"}'
        values: '0+30x40'
      - series: 'node_pressure_io_waiting_seconds_total{job="node-exporter-host", instance="10.0.10.153:9101"}'
        values: '0+30x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: ProxmoxHostIOPressure
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter-host
              instance: '10.0.10.102:9101'

  # The burst case: pve-nas-01's nightly backup chain crosses the threshold for
  # ~6 minutes most days as normal operation. Six minutes of stall then idle
  # stays silent, which is why the hold is 15m.
  - interval: 1m
    input_series:
      - series: 'node_pressure_io_waiting_seconds_total{job="node-exporter-host", instance="10.0.10.102:9101"}'
        values: '0+0x10 0+30x6 180+0x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: ProxmoxHostIOPressure
        exp_alerts: []

  # Memory pressure at 0.5/s > 0.10 threshold on a Proxmox host fires; the same
  # load on a k3s server VM (.222) is excluded by the instance filter.
  - interval: 1m
    input_series:
      - series: 'node_pressure_memory_waiting_seconds_total{job="node-exporter-host", instance="10.0.10.103:9101"}'
        values: '0+30x40'
      - series: 'node_pressure_memory_waiting_seconds_total{job="node-exporter-host", instance="10.0.10.222:9101"}'
        values: '0+30x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: ProxmoxHostMemoryPressure
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter-host
              instance: '10.0.10.103:9101'

  # The memory rule cascades from the IO one and shows the same nightly blip,
  # so it carries the same burst case.
  - interval: 1m
    input_series:
      - series: 'node_pressure_memory_waiting_seconds_total{job="node-exporter-host", instance="10.0.10.102:9101"}'
        values: '0+0x10 0+30x6 180+0x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: ProxmoxHostMemoryPressure
        exp_alerts: []

  # CorosyncWedged: corosync pinned near 100% CPU averaged over 10m. Normal CPU
  # is 1-2%, so the baseline arm must stay silent.
  - interval: 1m
    input_series:
      - series: 'proxmox_corosync_cpu_percent{instance="10.0.10.102:9101"}'
        values: '95+0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: CorosyncWedged
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: '10.0.10.102:9101'

  - interval: 1m
    input_series:
      - series: 'proxmox_corosync_cpu_percent{instance="10.0.10.102:9101"}'
        values: '2+0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: CorosyncWedged
        exp_alerts: []

  # A membership-change spike: 2m at 100% never averages past 90 over the 10m
  # window, which is what the window is there to absorb.
  - interval: 1m
    input_series:
      - series: 'proxmox_corosync_cpu_percent{instance="10.0.10.102:9101"}'
        values: '2+0x5 100+0x2 2+0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: CorosyncWedged
        exp_alerts: []
