---
# promtool unit tests for the PSI (pressure-stall) host alerts. These assert
# both the firing threshold AND the instance rescope: only the six bare-metal
# Proxmox hosts (192.168.0.102-107) may fire; the node-exporter-host job also
# scrapes DNS LXCs, smtp-relay, the GitLab VM, and the 3 k3s server VMs, which
# must NOT trip a "Proxmox host" alert.
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  # IO pressure rising at 0.5/s > 0.20 threshold on a Proxmox host fires; the
  # same load on the GitLab VM (.153) is excluded by the instance filter.
  - interval: 1m
    input_series:
      - series: 'node_pressure_io_waiting_seconds_total{job="node-exporter-host", instance="192.168.0.102:9101"}'
        values: '0+30x20'
      - series: 'node_pressure_io_waiting_seconds_total{job="node-exporter-host", instance="192.168.0.153:9101"}'
        values: '0+30x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ProxmoxHostIOPressure
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter-host
              instance: '192.168.0.102:9101'

  # Memory pressure at 0.5/s > 0.10 threshold on a Proxmox host fires; the same
  # load on a k3s server VM (.222) is excluded by the instance filter.
  - interval: 1m
    input_series:
      - series: 'node_pressure_memory_waiting_seconds_total{job="node-exporter-host", instance="192.168.0.103:9101"}'
        values: '0+30x20'
      - series: 'node_pressure_memory_waiting_seconds_total{job="node-exporter-host", instance="192.168.0.222:9101"}'
        values: '0+30x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ProxmoxHostMemoryPressure
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter-host
              instance: '192.168.0.103:9101'
