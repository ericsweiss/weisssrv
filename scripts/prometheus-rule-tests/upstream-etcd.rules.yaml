---
# Mirror of the kube-prometheus-stack etcdInsufficientMembers rule, which the
# chart ships where extract-prometheus-config cannot reach. Re-take the expr and
# the version line below on a chart bump; check-upstream-rule-mirror.py gates it.

# Taken from kube-prometheus-stack 92.1.0
groups:
  - name: etcd.upstream
    rules:
      - alert: etcdInsufficientMembers
        expr: sum(up{job=~".*etcd.*"} == bool 1) without (instance, pod) < ((count(up{job=~".*etcd.*"}) without (instance, pod) + 1) / 2)
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: etcd cluster has insufficient number of members.
          description: 'etcd cluster "{{ $labels.job }}": insufficient members ({{ $value }}).'
