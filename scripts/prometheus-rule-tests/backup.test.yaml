---
# promtool unit tests for the backup/durability alerts. Every "fresh" fixture
# carries a realistic lag (`-<lag>+60x...`); a gauge equal to time() pins a
# staleness threshold from above only. Rules with an `mtime > 0` guard differ.
rule_files:
  - rules.yaml
# 5m keeps the corpus re-evaluation cost down (README.md § Cost model) while
# still giving at least three evaluations inside the shortest `for:` here.
evaluation_interval: 5m
tests:
  # ArchiveBackupFailed fires only on a genuine send/receive error (metric 0).
  - interval: 1m
    input_series:
      - series: 'archive_backup_last_run_success'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ArchiveBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning

  # A successful run (metric 1) must NOT fire ArchiveBackupFailed.
  - interval: 1m
    input_series:
      - series: 'archive_backup_last_run_success'
        values: '1+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ArchiveBackupFailed
        exp_alerts: []

  # PveClusterBackupFailed: a failed /etc/pve tar pages. The fail-closed
  # unmounted-dataset guard writes this metric on exit, so it is the only signal
  # separating "guard tripped" from "ran fine" inside the 50h artefact window.
  - interval: 1m
    input_series:
      - series: 'pve_cluster_backup_last_run_success'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: PveClusterBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning

  # A successful run must not fire it, and neither must an ABSENT series: the
  # producer ships on the Ansible lifecycle, so the metric legitimately does not
  # exist until the first pve-nas-01 deploy.
  - interval: 1m
    input_series:
      - series: 'pve_cluster_backup_last_run_success'
        values: '1+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: PveClusterBackupFailed
        exp_alerts: []

  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: PveClusterBackupFailed
        exp_alerts: []

  # ArchiveBackupDatasetStale fires per-dataset when a dataset's last-success
  # timestamp is older than 2 days; a fresh dataset does not fire.
  - interval: 1m
    input_series:
      - series: 'archive_backup_dataset_last_success_timestamp_seconds{dataset="tank/proxmox"}'
        values: '-200000+0x70'
      - series: 'archive_backup_dataset_last_success_timestamp_seconds{dataset="ssd/appdata"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ArchiveBackupDatasetStale
        exp_alerts:
          - exp_labels:
              severity: warning
              dataset: 'tank/proxmox'

  # ArchiveBackupChronicallyDeferred covers the first-run edge (no timestamp
  # yet): >=3 consecutive deferrals fires; 2 does not.
  - interval: 1m
    input_series:
      - series: 'archive_backup_dataset_deferred_runs{dataset="tank/proxmox"}'
        values: '3+0x70'
      - series: 'archive_backup_dataset_deferred_runs{dataset="ssd/appdata"}'
        values: '2+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ArchiveBackupChronicallyDeferred
        exp_alerts:
          - exp_labels:
              severity: warning
              dataset: 'tank/proxmox'

  # VzdumpBackupStale fires per-node when the last vzdump is older than 36h.
  - interval: 1m
    input_series:
      - series: 'vzdump_backup_last_success_timestamp_seconds{instance="10.0.10.102:9101"}'
        values: '-140000+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: VzdumpBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '10.0.10.102:9101'

  # The absence arm is per-host: a vector-wide absent() would see .102 and stay
  # silent while .103 emits no vzdump metric at all. Only .103 may fire.
  - interval: 1m
    input_series:
      - series: 'vzdump_backup_last_success_timestamp_seconds{instance="10.0.10.102:9101"}'
        values: '-86400+60x70'
      - series: 'up{job="node-exporter-host", instance="10.0.10.102:9101"}'
        values: '1+0x70'
      - series: 'up{job="node-exporter-host", instance="10.0.10.103:9101"}'
        values: '1+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: VzdumpBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter-host
              instance: '10.0.10.103:9101'

  # AuthentikBackupStale: the nightly pg-dump CronJob's last success older than
  # 26h. exp_labels pins the reduced set the rule's `max by (namespace,
  # cronjob)` leaves, so Alertmanager cannot re-notify on a KSM reschedule.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="authentik", cronjob="authentik-pg-dump", job="kube-state-metrics", instance="10.42.3.7:8080", pod="kube-prometheus-stack-kube-state-metrics-6d9c", endpoint="http", service="kube-prometheus-stack-kube-state-metrics"}'
        values: '-93700+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: AuthentikBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: authentik
              cronjob: authentik-pg-dump

  # Fresh: last night's dump, a full 24h ago — the oldest a HEALTHY nightly
  # CronJob ever looks, and inside the 26h budget. It must stay silent, which is
  # what pins the 93600s threshold from below as well as above.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="authentik", cronjob="authentik-pg-dump", job="kube-state-metrics", instance="10.42.3.7:8080", pod="kube-prometheus-stack-kube-state-metrics-6d9c", endpoint="http", service="kube-prometheus-stack-kube-state-metrics"}'
        values: '-86400+60x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: AuthentikBackupStale
        exp_alerts: []

  # absent() arm: CronJob missing / never succeeded => fire, with the labels
  # synthesized from the selector's equality matchers.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: AuthentikBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: authentik
              cronjob: authentik-pg-dump

  # MealieBackupStale: same shape in the recipes namespace.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="recipes", cronjob="mealie-pg-dump", job="kube-state-metrics", instance="10.42.3.7:8080", pod="kube-prometheus-stack-kube-state-metrics-6d9c", endpoint="http", service="kube-prometheus-stack-kube-state-metrics"}'
        values: '-93700+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: MealieBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: recipes
              cronjob: mealie-pg-dump

  # Fresh (last night's dump, 24h ago) must NOT fire — parity with
  # AuthentikBackupStale, threshold pinned from below the same way.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="recipes", cronjob="mealie-pg-dump", job="kube-state-metrics", instance="10.42.3.7:8080", pod="kube-prometheus-stack-kube-state-metrics-6d9c", endpoint="http", service="kube-prometheus-stack-kube-state-metrics"}'
        values: '-86400+60x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: MealieBackupStale
        exp_alerts: []

  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: MealieBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: recipes
              cronjob: mealie-pg-dump

  # ResticOffsiteFailed fires only on a failed run (metric 0); a success (1) does not.
  - interval: 1m
    input_series:
      - series: 'restic_offsite_last_run_success'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ResticOffsiteFailed
        exp_alerts:
          - exp_labels:
              severity: warning
  - interval: 1m
    input_series:
      - series: 'restic_offsite_last_run_success'
        values: '1+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ResticOffsiteFailed
        exp_alerts: []

  # ResticOffsiteStale: last success older than 50h fires; a fresh timestamp does
  # not; the absent() arm fires if the collector never emitted (role undeployed).
  - interval: 1m
    input_series:
      - series: 'restic_offsite_last_success_timestamp_seconds'
        values: '-200000+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ResticOffsiteStale
        exp_alerts:
          - exp_labels:
              severity: warning
  # Fresh = last night's upload, 24h ago: inside the 50h budget, and low enough
  # that dropping the threshold toward it turns this arm red.
  - interval: 1m
    input_series:
      - series: 'restic_offsite_last_success_timestamp_seconds'
        values: '-86400+60x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ResticOffsiteStale
        exp_alerts: []
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: ResticOffsiteStale
        exp_alerts:
          - exp_labels:
              severity: warning

  # BackupArtifactStale — freshness arm: with all eight app series present, only
  # the app whose mtime is older than 50h fires, labelled by app. Fresh here is
  # last night's dump at 24h, the oldest a healthy nightly artefact gets.
  - interval: 1m
    input_series:
      - series: 'backup_artifact_last_mtime_seconds{app="authentik"}'
        values: '-86400+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="mealie"}'
        values: '-86400+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="hindsight"}'
        values: '-86400+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="gitlab"}'
        values: '-200000+0x70'
      - series: 'backup_artifact_last_mtime_seconds{app="immich"}'
        values: '-86400+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="nextcloud"}'
        values: '-86400+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="home-assistant"}'
        values: '-86400+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="pve-cluster"}'
        values: '-86400+60x70'
    alert_rule_test:
      # Inside the 1h hold: a textfile-collector gap must not page.
      - eval_time: 30m
        alertname: BackupArtifactStale
        exp_alerts: []
      - eval_time: 65m
        alertname: BackupArtifactStale
        exp_alerts:
          - exp_labels:
              severity: warning
              app: gitlab

  # Per-app absent arm: one app's landing dir is missing while the other seven
  # are fresh, so the immich arm fires labelled app=immich. Enumerating absent
  # per app rather than one family-level absent() is what makes that possible.
  - interval: 1m
    input_series:
      - series: 'backup_artifact_last_mtime_seconds{app="authentik"}'
        values: '-86400+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="mealie"}'
        values: '-86400+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="hindsight"}'
        values: '-86400+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="gitlab"}'
        values: '-86400+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="nextcloud"}'
        values: '-86400+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="home-assistant"}'
        values: '-86400+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="pve-cluster"}'
        values: '-86400+60x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactStale
        exp_alerts:
          - exp_labels:
              severity: warning
              app: immich

  # Nothing emitted at all (base dir gone / collector never populated the family)
  # on a cluster where the /etc/pve backup HAS run at least once: every per-app
  # absent arm fires — one alert per static app, pve-cluster included.
  - interval: 1m
    input_series:
      - series: 'pve_cluster_backup_last_success_timestamp_seconds{instance="10.0.10.102:9101"}'
        values: '1785000000+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactStale
        exp_alerts:
          - exp_labels:
              severity: warning
              app: authentik
          - exp_labels:
              severity: warning
              app: mealie
          - exp_labels:
              severity: warning
              app: hindsight
          - exp_labels:
              severity: warning
              app: gitlab
          - exp_labels:
              severity: warning
              app: immich
          - exp_labels:
              severity: warning
              app: nextcloud
          - exp_labels:
              severity: warning
              app: home-assistant
          - exp_labels:
              severity: warning
              app: pve-cluster

  # No series at all: the seven unconditional arms fire, and the gated
  # pve-cluster arm stays silent rather than page for a backup that has never
  # run.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactStale
        exp_alerts:
          - exp_labels:
              severity: warning
              app: authentik
          - exp_labels:
              severity: warning
              app: mealie
          - exp_labels:
              severity: warning
              app: hindsight
          - exp_labels:
              severity: warning
              app: gitlab
          - exp_labels:
              severity: warning
              app: immich
          - exp_labels:
              severity: warning
              app: nextcloud
          - exp_labels:
              severity: warning
              app: home-assistant

  # BackupArtifactEmpty: a newest artefact of 0 bytes must fire even when the
  # wrapper reports run-success 1.
  - interval: 1m
    input_series:
      - series: 'gitlab_backup_last_size_bytes{instance="10.0.10.153:9101"}'
        values: '0+0x70'
      - series: 'gitlab_backup_last_run_success{instance="10.0.10.153:9101"}'
        values: '1+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactEmpty
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 10.0.10.153:9101
              metric: gitlab_backup_last_size_bytes

  # A non-zero artefact size must not fire, and the name regex must not match
  # the neighbouring _last_run_success / _last_run_duration_seconds series
  # (which are legitimately 0).
  - interval: 1m
    input_series:
      - series: 'gitlab_backup_last_size_bytes{instance="10.0.10.153:9101"}'
        values: '41922560+0x70'
      - series: 'gitlab_backup_last_run_success{instance="10.0.10.153:9101"}'
        values: '0+0x70'
      - series: 'gitlab_backup_last_run_duration_seconds{instance="10.0.10.153:9101"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactEmpty
        exp_alerts: []

  # The regex is family-wide by design: every backup wrapper emits
  # <app>_backup_last_size_bytes, so a new producer inherits the gate.
  - interval: 1m
    input_series:
      - series: 'nextcloud_backup_last_size_bytes{instance="10.0.10.156:9101"}'
        values: '0+0x70'
      - series: 'pve_cluster_backup_last_size_bytes{instance="10.0.10.102:9101"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactEmpty
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 10.0.10.156:9101
              metric: nextcloud_backup_last_size_bytes
          - exp_labels:
              severity: critical
              instance: 10.0.10.102:9101
              metric: pve_cluster_backup_last_size_bytes

  # BackupArtifactZeroBytes: the only size arm for apps with no
  # <app>_backup_last_size_bytes series. A truncated dump lands with a fresh
  # mtime, so BackupArtifactStale stays green; zero-lag fixtures suit that guard.
  - interval: 1m
    input_series:
      - series: 'backup_artifact_last_size_bytes{app="authentik"}'
        values: '0+0x70'
      - series: 'backup_artifact_last_mtime_seconds{app="authentik"}'
        values: '0+60x70'
      - series: 'backup_artifact_last_size_bytes{app="mealie"}'
        values: '4194304+0x70'
      - series: 'backup_artifact_last_mtime_seconds{app="mealie"}'
        values: '0+60x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactZeroBytes
        exp_alerts:
          - exp_labels:
              severity: critical
              app: authentik
      # The fresh mtime is exactly why the staleness alert cannot cover this.
      - eval_time: 65m
        alertname: BackupArtifactStaleCritical
        exp_alerts: []

  # An ancient mtime with size 0 means "no file matching the glob at all",
  # written here as a negative mtime because the harness clock starts at 0.
  # BackupArtifactStale owns that case; the mtime guard stops a double page.
  - interval: 1m
    input_series:
      - series: 'backup_artifact_last_size_bytes{app="authentik"}'
        values: '0+0x70'
      - series: 'backup_artifact_last_mtime_seconds{app="authentik"}'
        values: '-400000+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactZeroBytes
        exp_alerts: []
      - eval_time: 65m
        alertname: BackupArtifactStaleCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              app: authentik

  # The literal shape the collector writes for a missing file: mtime 0, size 0.
  # The `> 0` guard must keep BackupArtifactZeroBytes silent on it.
  - interval: 1m
    input_series:
      - series: 'backup_artifact_last_size_bytes{app="authentik"}'
        values: '0+0x70'
      - series: 'backup_artifact_last_mtime_seconds{app="authentik"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactZeroBytes
        exp_alerts: []

  # BackupArtifactNeverLanded: mtime 0 across the whole window. The offset arm
  # keeps a young series out, and a dump that lands late clears the window arm.
  - interval: 5m
    input_series:
      - series: 'backup_artifact_last_mtime_seconds{app="authentik"}'
        values: '0+0x324'
      - series: 'backup_artifact_last_mtime_seconds{app="immich"}'
        values: '0+0x24 1700000000+0x300'
    alert_rule_test:
      # 25h of history, inside the 1h hold.
      - eval_time: 25h
        alertname: BackupArtifactNeverLanded
        exp_alerts: []
      - eval_time: 26h30m
        alertname: BackupArtifactNeverLanded
        exp_alerts:
          - exp_labels:
              severity: warning
              app: authentik
      # mtime 0 belongs to never-landed, not to either staleness arm.
      - eval_time: 26h30m
        alertname: BackupArtifactStaleCritical
        exp_alerts: []

  # BackupArtifactCompanionMissing — a companion absent from the landing zone
  # emits present=0 AND size=0. `or` matches on the label set minus __name__, so
  # the two arms must collapse to ONE alert per (app, file), not two.
  - interval: 1m
    input_series:
      - series: 'backup_artifact_companion_present{app="gitlab", file="gitlab-secrets.json"}'
        values: '0+0x70'
      - series: 'backup_artifact_companion_size_bytes{app="gitlab", file="gitlab-secrets.json"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactCompanionMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              app: gitlab
              file: gitlab-secrets.json

  # Truncated companion: the file IS there (present=1) but is 0 bytes. The
  # size arm is what catches it — present alone would report healthy.
  - interval: 1m
    input_series:
      - series: 'backup_artifact_companion_present{app="gitlab", file="gitlab-secrets.json"}'
        values: '1+0x70'
      - series: 'backup_artifact_companion_size_bytes{app="gitlab", file="gitlab-secrets.json"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactCompanionMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              app: gitlab
              file: gitlab-secrets.json

  # Healthy companion: no alert. No absent() arm either — companions are opt-in
  # per app in the inventory, so an empty family must stay silent.
  - interval: 1m
    input_series:
      - series: 'backup_artifact_companion_present{app="gitlab", file="gitlab-secrets.json"}'
        values: '1+0x70'
      - series: 'backup_artifact_companion_size_bytes{app="gitlab", file="gitlab-secrets.json"}'
        values: '5170+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactCompanionMissing
        exp_alerts: []
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactCompanionMissing
        exp_alerts: []

  # GitLabBackupSecretsMissing: gitlab-secrets.json sits outside the tarball and
  # the artefact glob, so a fresh full-size tarball is unrestorable without it
  # while every other backup alert stays green. Absent fires exactly once.
  - interval: 1m
    input_series:
      - series: 'gitlab_backup_secrets_present{instance="10.0.10.153:9101"}'
        values: '0+0x70'
      - series: 'gitlab_backup_secrets_size_bytes{instance="10.0.10.153:9101"}'
        values: '0+0x70'
      - series: 'gitlab_backup_last_run_success{instance="10.0.10.153:9101"}'
        values: '1+0x70'
      - series: 'gitlab_backup_last_size_bytes{instance="10.0.10.153:9101"}'
        values: '41922560+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: GitLabBackupSecretsMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 10.0.10.153:9101
      # The tarball itself is healthy, which is the whole point.
      - eval_time: 65m
        alertname: BackupArtifactEmpty
        exp_alerts: []
      - eval_time: 65m
        alertname: GitLabBackupFailed
        exp_alerts: []

  # Firing arm of GitLabBackupFailed (a permanently-silent expr must not pass).
  - interval: 1m
    input_series:
      - series: 'gitlab_backup_last_run_success{instance="10.0.10.153:9101"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: GitLabBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.0.10.153:9101

  # present=1 with size 0 is reachable: the wrapper stats whatever it copied, so
  # a truncated copy reports present. The size arm catches it.
  - interval: 1m
    input_series:
      - series: 'gitlab_backup_secrets_present{instance="10.0.10.153:9101"}'
        values: '1+0x70'
      - series: 'gitlab_backup_secrets_size_bytes{instance="10.0.10.153:9101"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: GitLabBackupSecretsMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 10.0.10.153:9101

  # Healthy, and no absent() arm — the metric appears only after the first
  # post-deploy backup run, so absent() would page on merge day.
  - interval: 1m
    input_series:
      - series: 'gitlab_backup_secrets_present{instance="10.0.10.153:9101"}'
        values: '1+0x70'
      - series: 'gitlab_backup_secrets_size_bytes{instance="10.0.10.153:9101"}'
        values: '5170+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: GitLabBackupSecretsMissing
        exp_alerts: []
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: GitLabBackupSecretsMissing
        exp_alerts: []

  # BackupRestoreDrillStale fires when the quarterly drill has not passed, or has
  # not been attempted, in 100 days — the attempt arm is the only one that sees a
  # drill that never passed. Absence is BackupRestoreDrillNeverRan below.
  - interval: 5m
    input_series:
      - series: 'backup_restore_drill_last_success_seconds{instance="10.0.10.102:9101"}'
        values: '-8700000+0x40'
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupRestoreDrillStale
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 10.0.10.102:9101
  # Never passed, but the timer stopped attempting 100 days ago: the run arm is
  # the whole coverage here, because the success series does not exist.
  - interval: 5m
    input_series:
      - series: 'backup_restore_drill_last_run_seconds{instance="10.0.10.102:9101"}'
        values: '-8700000+0x40'
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupRestoreDrillStale
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 10.0.10.102:9101
  # Both clocks stale. `or` matches on the label set minus __name__ and both
  # series carry the same instance, so the two arms must collapse to ONE alert.
  - interval: 5m
    input_series:
      - series: 'backup_restore_drill_last_success_seconds{instance="10.0.10.102:9101"}'
        values: '-8700000+0x40'
      - series: 'backup_restore_drill_last_run_seconds{instance="10.0.10.102:9101"}'
        values: '-8700000+0x40'
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupRestoreDrillStale
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 10.0.10.102:9101
  - interval: 5m
    input_series:
      - series: 'backup_restore_drill_last_success_seconds{instance="10.0.10.102:9101"}'
        values: '0+300x40'
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupRestoreDrillStale
        exp_alerts: []
  # Empty corpus: the critical tier must stay silent — the metric does not exist
  # until a drill has run.
  - interval: 5m
    input_series: []
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupRestoreDrillStale
        exp_alerts: []

  # BackupRestoreDrillNeverRan: the absence case, at WARNING behind 26h `for:`.
  # The role seeds a drill at install, so 26h absorbs a deploy at any hour plus
  # the collector pickup; what survives is a seed that never ran or passed.
  - interval: 30m
    input_series: []
    alert_rule_test:
      # Merge day: no seed metric yet, and nothing fires at either tier.
      - eval_time: 2h
        alertname: BackupRestoreDrillNeverRan
        exp_alerts: []
      # Still inside the deploy + pickup window.
      - eval_time: 25h
        alertname: BackupRestoreDrillNeverRan
        exp_alerts: []
      # Past 26h the seed demonstrably produced no passing drill.
      - eval_time: 27h
        alertname: BackupRestoreDrillNeverRan
        exp_alerts:
          - exp_labels:
              severity: warning
  # A drill that RAN but never PASSED — a failed seed. NeverRan is what surfaces
  # it (the success series is absent), and the 100-day critical stays quiet.
  - interval: 30m
    input_series:
      - series: 'backup_restore_drill_last_run_seconds{instance="10.0.10.102:9101"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 27h
        alertname: BackupRestoreDrillNeverRan
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 27h
        alertname: BackupRestoreDrillStale
        exp_alerts: []
  # Once any drill has passed, the absence alert must go quiet for good.
  - interval: 30m
    input_series:
      - series: 'backup_restore_drill_last_success_seconds{instance="10.0.10.102:9101"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 27h
        alertname: BackupRestoreDrillNeverRan
        exp_alerts: []

  # BackupRestoreDrillFailing: the gap between the two clocks. A drill that ran
  # and failed leaves _last_run_seconds ahead of _last_success_seconds, and
  # nothing else notices for the remaining ~99 days of the staleness window.
  - interval: 5m
    input_series:
      - series: 'backup_restore_drill_last_run_seconds{instance="10.0.10.102:9101"}'
        values: '900000+0x60'
      - series: 'backup_restore_drill_last_success_seconds{instance="10.0.10.102:9101"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupRestoreDrillFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.0.10.102:9101
  # A drill that passed writes both clocks in the same textfile flush, so the
  # difference is zero and the alert must stay silent.
  - interval: 5m
    input_series:
      - series: 'backup_restore_drill_last_run_seconds{instance="10.0.10.102:9101"}'
        values: '900000+0x60'
      - series: 'backup_restore_drill_last_success_seconds{instance="10.0.10.102:9101"}'
        values: '900000+0x60'
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupRestoreDrillFailing
        exp_alerts: []
  # Never passed at all: the success series is absent, the subtraction yields
  # nothing, and BackupRestoreDrillNeverRan owns that state instead.
  - interval: 5m
    input_series:
      - series: 'backup_restore_drill_last_run_seconds{instance="10.0.10.102:9101"}'
        values: '900000+0x60'
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupRestoreDrillFailing
        exp_alerts: []

  # BackupRestoreDrillProvedTooLittle: a passing drill must compare at least 3
  # files, so a token restore cannot read as coverage.
  - interval: 5m
    input_series:
      - series: 'backup_restore_drill_files_compared{instance="10.0.10.102:9101"}'
        values: '1+0x60'
      - series: 'backup_restore_drill_last_run_seconds{instance="10.0.10.102:9101"}'
        values: '900000+0x60'
      - series: 'backup_restore_drill_last_success_seconds{instance="10.0.10.102:9101"}'
        values: '900000+0x60'
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupRestoreDrillProvedTooLittle
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.0.10.102:9101
  # A drill that FAILED writes files_compared 0, which would otherwise look like
  # the thinnest possible pass. The run/success guard keeps it out of scope so
  # only BackupRestoreDrillFailing reports it.
  - interval: 5m
    input_series:
      - series: 'backup_restore_drill_files_compared{instance="10.0.10.102:9101"}'
        values: '0+0x60'
      - series: 'backup_restore_drill_last_run_seconds{instance="10.0.10.102:9101"}'
        values: '900000+0x60'
      - series: 'backup_restore_drill_last_success_seconds{instance="10.0.10.102:9101"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupRestoreDrillProvedTooLittle
        exp_alerts: []
      - eval_time: 2h
        alertname: BackupRestoreDrillFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.0.10.102:9101
  # A passing drill above the coverage floor must be quiet.
  - interval: 5m
    input_series:
      - series: 'backup_restore_drill_files_compared{instance="10.0.10.102:9101"}'
        values: '5+0x60'
      - series: 'backup_restore_drill_last_run_seconds{instance="10.0.10.102:9101"}'
        values: '900000+0x60'
      - series: 'backup_restore_drill_last_success_seconds{instance="10.0.10.102:9101"}'
        values: '900000+0x60'
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupRestoreDrillProvedTooLittle
        exp_alerts: []

  # ResticOffsiteVerifyStale: last successful `restic check` older than 8d.
  # A failed verify is ResticOffsiteVerifyFailed, so the two carry different
  # severities. Neither has an absent() arm, so an empty series set stays quiet.
  - interval: 1m
    input_series:
      - series: 'restic_offsite_last_verify_timestamp_seconds'
        values: '-800000+0x70'
      - series: 'restic_offsite_last_verify_success'
        values: '1+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ResticOffsiteVerifyStale
        exp_alerts:
          - exp_labels:
              severity: warning
  # Fresh = last week's verify, a full 7 days ago: the oldest a HEALTHY weekly
  # timer looks, and inside the 8d budget.
  - interval: 1m
    input_series:
      - series: 'restic_offsite_last_verify_timestamp_seconds'
        values: '-604800+60x70'
      - series: 'restic_offsite_last_verify_success'
        values: '1+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ResticOffsiteVerifyStale
        exp_alerts: []
  # A failed verify pages via ResticOffsiteVerifyFailed even when the timestamp
  # is recent — and must NOT also raise the staleness alert.
  - interval: 1m
    input_series:
      - series: 'restic_offsite_last_verify_timestamp_seconds'
        values: '-604800+60x70'
      - series: 'restic_offsite_last_verify_success'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ResticOffsiteVerifyFailed
        exp_alerts:
          - exp_labels:
              severity: critical
      - eval_time: 65m
        alertname: ResticOffsiteVerifyStale
        exp_alerts: []
  # No verify metrics at all (never run) — no absent() arm, so nothing fires.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: ResticOffsiteVerifyStale
        exp_alerts: []

  # BackupArtifactCollectorStale: the collector sentinel older than 2h fires; a
  # fresh sentinel does not; the absent() arm fires if the collector never emitted.
  - interval: 1m
    input_series:
      - series: 'backup_artifact_collector_last_success_seconds{instance="10.0.10.102:9101"}'
        values: '-10000+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactCollectorStale
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '10.0.10.102:9101'
  - interval: 1m
    input_series:
      - series: 'backup_artifact_collector_last_success_seconds{instance="10.0.10.102:9101"}'
        values: '-3600+60x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactCollectorStale
        exp_alerts: []
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactCollectorStale
        exp_alerts:
          - exp_labels:
              severity: warning

  # ResticOffsiteIncomplete / ...Prolonged: restic rc=3 held at 1. The warning
  # arm lands at 1h and the critical one at 36h; a 0 series stays silent.
  - interval: 5m
    input_series:
      - series: 'restic_offsite_last_run_incomplete{instance="10.0.10.107:9101"}'
        values: '1+0x600'
    alert_rule_test:
      - eval_time: 30m
        alertname: ResticOffsiteIncomplete
        exp_alerts: []
      - eval_time: 2h
        alertname: ResticOffsiteIncomplete
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.0.10.107:9101
      - eval_time: 2h
        alertname: ResticOffsiteIncompleteProlonged
        exp_alerts: []
      - eval_time: 40h
        alertname: ResticOffsiteIncompleteProlonged
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 10.0.10.107:9101

  - interval: 5m
    input_series:
      - series: 'restic_offsite_last_run_incomplete{instance="10.0.10.107:9101"}'
        values: '0+0x600'
    alert_rule_test:
      - eval_time: 40h
        alertname: ResticOffsiteIncomplete
        exp_alerts: []
      - eval_time: 40h
        alertname: ResticOffsiteIncompleteProlonged
        exp_alerts: []

  # The gauge survives runs that never reached `restic backup` (a freshness
  # abort), and only an rc=0 backup clears it — so one clean night inside the
  # window stops the escalation instead of the warning latching for a day.
  - interval: 5m
    input_series:
      - series: 'restic_offsite_last_run_incomplete{instance="10.0.10.107:9101"}'
        values: '1+0x300 0+0x300'
    alert_rule_test:
      - eval_time: 20h
        alertname: ResticOffsiteIncomplete
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.0.10.107:9101
      - eval_time: 40h
        alertname: ResticOffsiteIncomplete
        exp_alerts: []
      - eval_time: 40h
        alertname: ResticOffsiteIncompleteProlonged
        exp_alerts: []
