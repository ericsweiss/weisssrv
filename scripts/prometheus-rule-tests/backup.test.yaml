---
# promtool unit tests for the backup/durability alerts.
# rule_files is resolved relative to this file's runtime location; the lint
# script copies the tests next to the extracted rules.yaml before running them.
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  # ArchiveBackupFailed fires only on a genuine send/receive error (metric 0).
  - interval: 1m
    input_series:
      - series: 'archive_backup_last_run_success'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ArchiveBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning

  # A successful run (metric 1) must NOT fire ArchiveBackupFailed.
  - interval: 1m
    input_series:
      - series: 'archive_backup_last_run_success'
        values: '1+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ArchiveBackupFailed
        exp_alerts: []

  # PveClusterBackupFailed: a failed /etc/pve tar pages. This is the metric the
  # fail-closed unmounted-dataset guard writes on exit, so it is the only signal
  # that distinguishes "guard tripped" from "ran fine" until the 50h artefact
  # window elapses.
  - interval: 1m
    input_series:
      - series: 'pve_cluster_backup_last_run_success'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: PveClusterBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning

  # A successful run must not fire it, and — deliberately — neither must an
  # ABSENT series: the producer ships on the Ansible lifecycle, so the metric
  # legitimately does not exist between this rule merging and the first
  # pve-nas-01 deploy. An absent() arm here would page on merge day.
  - interval: 1m
    input_series:
      - series: 'pve_cluster_backup_last_run_success'
        values: '1+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: PveClusterBackupFailed
        exp_alerts: []

  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: PveClusterBackupFailed
        exp_alerts: []

  # ArchiveBackupDatasetStale fires per-dataset when a dataset's last-success
  # timestamp is older than 2 days; a fresh dataset does not fire.
  - interval: 1m
    input_series:
      - series: 'archive_backup_dataset_last_success_timestamp_seconds{dataset="tank/proxmox"}'
        values: '-200000+0x70'
      - series: 'archive_backup_dataset_last_success_timestamp_seconds{dataset="ssd/appdata"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ArchiveBackupDatasetStale
        exp_alerts:
          - exp_labels:
              severity: warning
              dataset: 'tank/proxmox'

  # ArchiveBackupChronicallyDeferred covers the first-run edge (no timestamp
  # yet): >=3 consecutive deferrals fires; 2 does not.
  - interval: 1m
    input_series:
      - series: 'archive_backup_dataset_deferred_runs{dataset="tank/proxmox"}'
        values: '3+0x70'
      - series: 'archive_backup_dataset_deferred_runs{dataset="ssd/appdata"}'
        values: '2+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ArchiveBackupChronicallyDeferred
        exp_alerts:
          - exp_labels:
              severity: warning
              dataset: 'tank/proxmox'

  # VzdumpBackupStale fires per-node when the last vzdump is older than 36h.
  - interval: 1m
    input_series:
      - series: 'vzdump_backup_last_success_timestamp_seconds{instance="192.168.0.102:9101"}'
        values: '-140000+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: VzdumpBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '192.168.0.102:9101'

  # AuthentikBackupStale: the nightly pg-dump CronJob's last-success timestamp is
  # older than 26h (kube_cronjob_status_last_successful_time). A fresh timestamp
  # does not fire; the absent() arm (below) fires if the CronJob has never
  # succeeded / kube-state is down.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="authentik", cronjob="authentik-pg-dump"}'
        values: '-93700+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: AuthentikBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: authentik
              cronjob: authentik-pg-dump

  # Fresh (timestamp tracks ~now) must NOT fire.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="authentik", cronjob="authentik-pg-dump"}'
        values: '0+60x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: AuthentikBackupStale
        exp_alerts: []

  # absent() arm: CronJob missing / never succeeded => fire, with the labels
  # synthesized from the selector's equality matchers.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: AuthentikBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: authentik
              cronjob: authentik-pg-dump

  # MealieBackupStale: same shape in the recipes namespace.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="recipes", cronjob="mealie-pg-dump"}'
        values: '-93700+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: MealieBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: recipes
              cronjob: mealie-pg-dump

  # Fresh (timestamp tracks ~now) must NOT fire (parity with AuthentikBackupStale).
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="recipes", cronjob="mealie-pg-dump"}'
        values: '0+60x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: MealieBackupStale
        exp_alerts: []

  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: MealieBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: recipes
              cronjob: mealie-pg-dump

  # ResticOffsiteFailed fires only on a failed run (metric 0); a success (1) does not.
  - interval: 1m
    input_series:
      - series: 'restic_offsite_last_run_success'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ResticOffsiteFailed
        exp_alerts:
          - exp_labels:
              severity: warning
  - interval: 1m
    input_series:
      - series: 'restic_offsite_last_run_success'
        values: '1+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ResticOffsiteFailed
        exp_alerts: []

  # ResticOffsiteStale: last success older than 50h fires; a fresh timestamp does
  # not; the absent() arm fires if the collector never emitted (role undeployed).
  - interval: 1m
    input_series:
      - series: 'restic_offsite_last_success_timestamp_seconds'
        values: '-200000+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ResticOffsiteStale
        exp_alerts:
          - exp_labels:
              severity: warning
  - interval: 1m
    input_series:
      - series: 'restic_offsite_last_success_timestamp_seconds'
        values: '0+60x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ResticOffsiteStale
        exp_alerts: []
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: ResticOffsiteStale
        exp_alerts:
          - exp_labels:
              severity: warning

  # BackupArtifactStale — freshness arm: with all seven static app series present,
  # only the app whose mtime is older than 50h fires (labelled by app); the six
  # fresh apps do not, and no per-app absent arm fires (all present).
  - interval: 1m
    input_series:
      - series: 'backup_artifact_last_mtime_seconds{app="authentik"}'
        values: '0+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="mealie"}'
        values: '0+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="gitlab"}'
        values: '-200000+0x70'
      - series: 'backup_artifact_last_mtime_seconds{app="immich"}'
        values: '0+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="nextcloud"}'
        values: '0+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="home-assistant"}'
        values: '0+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="pve-cluster"}'
        values: '0+60x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactStale
        exp_alerts:
          - exp_labels:
              severity: warning
              app: gitlab

  # Per-app absent arm: one app's landing dir went missing (its series absent)
  # while the other six are fresh — the immich arm fires, labelled app=immich,
  # even though every other app is healthy (the whole point of enumerating absent
  # per app instead of a single family-level absent()).
  - interval: 1m
    input_series:
      - series: 'backup_artifact_last_mtime_seconds{app="authentik"}'
        values: '0+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="mealie"}'
        values: '0+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="gitlab"}'
        values: '0+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="nextcloud"}'
        values: '0+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="home-assistant"}'
        values: '0+60x70'
      - series: 'backup_artifact_last_mtime_seconds{app="pve-cluster"}'
        values: '0+60x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactStale
        exp_alerts:
          - exp_labels:
              severity: warning
              app: immich

  # Nothing emitted at all (base dir gone / collector never populated the family)
  # on a cluster where the /etc/pve backup HAS run at least once: every per-app
  # absent arm fires — one alert per static app, pve-cluster included.
  - interval: 1m
    input_series:
      - series: 'pve_cluster_backup_last_success_timestamp_seconds{instance="192.168.0.102:9101"}'
        values: '1785000000+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactStale
        exp_alerts:
          - exp_labels:
              severity: warning
              app: authentik
          - exp_labels:
              severity: warning
              app: mealie
          - exp_labels:
              severity: warning
              app: gitlab
          - exp_labels:
              severity: warning
              app: immich
          - exp_labels:
              severity: warning
              app: nextcloud
          - exp_labels:
              severity: warning
              app: home-assistant
          - exp_labels:
              severity: warning
              app: pve-cluster

  # The merge-day state: the rule is live but the Ansible-side /etc/pve backup
  # has never run, so neither the artefact series nor the producer's success
  # timestamp exists. The six unconditional arms fire (nothing else is emitting
  # either, in this synthetic input); the gated pve-cluster arm must stay silent
  # rather than page for a backup that has never run.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactStale
        exp_alerts:
          - exp_labels:
              severity: warning
              app: authentik
          - exp_labels:
              severity: warning
              app: mealie
          - exp_labels:
              severity: warning
              app: gitlab
          - exp_labels:
              severity: warning
              app: immich
          - exp_labels:
              severity: warning
              app: nextcloud
          - exp_labels:
              severity: warning
              app: home-assistant

  # BackupArtifactEmpty: a wrapper reported success while its newest artefact
  # measured 0 bytes. This is the gate whose ABSENCE let gitlab_backup_last_size_bytes
  # sit at 0 for four days behind a green gitlab_backup_last_run_success — so the
  # test pins that a run-success of 1 does NOT suppress it.
  - interval: 1m
    input_series:
      - series: 'gitlab_backup_last_size_bytes{instance="192.168.0.153:9101"}'
        values: '0+0x70'
      - series: 'gitlab_backup_last_run_success{instance="192.168.0.153:9101"}'
        values: '1+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactEmpty
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 192.168.0.153:9101
              metric: gitlab_backup_last_size_bytes

  # A non-zero artefact size must not fire, and the name regex must not match
  # the neighbouring _last_run_success / _last_run_duration_seconds series
  # (which are legitimately 0).
  - interval: 1m
    input_series:
      - series: 'gitlab_backup_last_size_bytes{instance="192.168.0.153:9101"}'
        values: '41922560+0x70'
      - series: 'gitlab_backup_last_run_success{instance="192.168.0.153:9101"}'
        values: '0+0x70'
      - series: 'gitlab_backup_last_run_duration_seconds{instance="192.168.0.153:9101"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactEmpty
        exp_alerts: []

  # The regex is family-wide by design: every backup wrapper emits
  # <app>_backup_last_size_bytes, so a new producer inherits the gate.
  - interval: 1m
    input_series:
      - series: 'nextcloud_backup_last_size_bytes{instance="192.168.0.156:9101"}'
        values: '0+0x70'
      - series: 'pve_cluster_backup_last_size_bytes{instance="192.168.0.102:9101"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactEmpty
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 192.168.0.156:9101
              metric: nextcloud_backup_last_size_bytes
          - exp_labels:
              severity: critical
              instance: 192.168.0.102:9101
              metric: pve_cluster_backup_last_size_bytes

  # BackupArtifactZeroBytes — the NAS-side counterpart to BackupArtifactEmpty,
  # and the only size arm covering authentik/mealie/home-assistant (no VM-side
  # wrapper emits a size metric for them). A truncated dump lands with a FRESH
  # mtime, so BackupArtifactStale stays green: that is the case pinned here.
  - interval: 1m
    input_series:
      - series: 'backup_artifact_last_size_bytes{app="authentik"}'
        values: '0+0x70'
      - series: 'backup_artifact_last_mtime_seconds{app="authentik"}'
        values: '0+60x70'
      - series: 'backup_artifact_last_size_bytes{app="mealie"}'
        values: '4194304+0x70'
      - series: 'backup_artifact_last_mtime_seconds{app="mealie"}'
        values: '0+60x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactZeroBytes
        exp_alerts:
          - exp_labels:
              severity: critical
              app: authentik
      # The fresh mtime is exactly why the staleness alert cannot cover this.
      - eval_time: 65m
        alertname: BackupArtifactStaleCritical
        exp_alerts: []

  # An ancient mtime with size 0 = "no file matching the glob at all" (the
  # collector emits literal 0 for both; the harness clock starts at 0, so the
  # ancient case is written as a negative mtime here — neither is `> 0`).
  # BackupArtifactStale owns that case; the mtime guard keeps this alert from
  # double-paging on it.
  - interval: 1m
    input_series:
      - series: 'backup_artifact_last_size_bytes{app="authentik"}'
        values: '0+0x70'
      - series: 'backup_artifact_last_mtime_seconds{app="authentik"}'
        values: '-400000+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactZeroBytes
        exp_alerts: []
      - eval_time: 65m
        alertname: BackupArtifactStaleCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              app: authentik

  # The literal shape the collector writes for a missing file: mtime 0, size 0.
  # The `> 0` guard must keep BackupArtifactZeroBytes silent on it.
  - interval: 1m
    input_series:
      - series: 'backup_artifact_last_size_bytes{app="authentik"}'
        values: '0+0x70'
      - series: 'backup_artifact_last_mtime_seconds{app="authentik"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactZeroBytes
        exp_alerts: []

  # BackupArtifactCompanionMissing — a companion absent from the landing zone
  # emits present=0 AND size=0. `or` matches on the label set minus __name__, so
  # the two arms must collapse to ONE alert per (app, file), not two.
  - interval: 1m
    input_series:
      - series: 'backup_artifact_companion_present{app="gitlab", file="gitlab-secrets.json"}'
        values: '0+0x70'
      - series: 'backup_artifact_companion_size_bytes{app="gitlab", file="gitlab-secrets.json"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactCompanionMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              app: gitlab
              file: gitlab-secrets.json

  # Truncated companion: the file IS there (present=1) but is 0 bytes. The
  # size arm is what catches it — present alone would report healthy.
  - interval: 1m
    input_series:
      - series: 'backup_artifact_companion_present{app="gitlab", file="gitlab-secrets.json"}'
        values: '1+0x70'
      - series: 'backup_artifact_companion_size_bytes{app="gitlab", file="gitlab-secrets.json"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactCompanionMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              app: gitlab
              file: gitlab-secrets.json

  # Healthy companion: no alert. No absent() arm either — companions are opt-in
  # per app in the inventory, so an empty family must stay silent.
  - interval: 1m
    input_series:
      - series: 'backup_artifact_companion_present{app="gitlab", file="gitlab-secrets.json"}'
        values: '1+0x70'
      - series: 'backup_artifact_companion_size_bytes{app="gitlab", file="gitlab-secrets.json"}'
        values: '5170+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactCompanionMissing
        exp_alerts: []
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactCompanionMissing
        exp_alerts: []

  # GitLabBackupSecretsMissing — the DR-critical one: gitlab-secrets.json is
  # excluded from the tarball AND from the artefact glob, so a full-size,
  # perfectly fresh tarball is unrestorable without it and every other backup
  # alert stays green. Absent (present=0, size=0) fires exactly once.
  - interval: 1m
    input_series:
      - series: 'gitlab_backup_secrets_present{instance="192.168.0.153:9101"}'
        values: '0+0x70'
      - series: 'gitlab_backup_secrets_size_bytes{instance="192.168.0.153:9101"}'
        values: '0+0x70'
      - series: 'gitlab_backup_last_run_success{instance="192.168.0.153:9101"}'
        values: '1+0x70'
      - series: 'gitlab_backup_last_size_bytes{instance="192.168.0.153:9101"}'
        values: '41922560+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: GitLabBackupSecretsMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 192.168.0.153:9101
      # The tarball itself is healthy, which is the whole point.
      - eval_time: 65m
        alertname: BackupArtifactEmpty
        exp_alerts: []
      - eval_time: 65m
        alertname: GitLabBackupFailed
        exp_alerts: []

  # present=1 with size 0 is reachable: the wrapper stats whatever it copied, so
  # a truncated copy reports present. The size arm catches it.
  - interval: 1m
    input_series:
      - series: 'gitlab_backup_secrets_present{instance="192.168.0.153:9101"}'
        values: '1+0x70'
      - series: 'gitlab_backup_secrets_size_bytes{instance="192.168.0.153:9101"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: GitLabBackupSecretsMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 192.168.0.153:9101

  # Healthy, and no absent() arm — the metric appears only after the first
  # post-deploy backup run, so absent() would page on merge day.
  - interval: 1m
    input_series:
      - series: 'gitlab_backup_secrets_present{instance="192.168.0.153:9101"}'
        values: '1+0x70'
      - series: 'gitlab_backup_secrets_size_bytes{instance="192.168.0.153:9101"}'
        values: '5170+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: GitLabBackupSecretsMissing
        exp_alerts: []
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: GitLabBackupSecretsMissing
        exp_alerts: []

  # BackupRestoreDrillStale: integrity (`restic check`) is not restorability.
  # Fires when the quarterly drill has not PASSED in 100 days — or has not been
  # ATTEMPTED in 100 days, which is the only arm that can see a drill that has
  # never passed at all (no _last_success_seconds series exists in that state).
  # There is deliberately NO absent() arm; see BackupRestoreDrillNeverRan below.
  - interval: 5m
    input_series:
      - series: 'backup_restore_drill_last_success_seconds{instance="192.168.0.102:9101"}'
        values: '-8700000+0x40'
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupRestoreDrillStale
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 192.168.0.102:9101
  # Never passed, but the timer stopped attempting 100 days ago: the run arm is
  # the whole coverage here, because the success series does not exist.
  - interval: 5m
    input_series:
      - series: 'backup_restore_drill_last_run_seconds{instance="192.168.0.102:9101"}'
        values: '-8700000+0x40'
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupRestoreDrillStale
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 192.168.0.102:9101
  # Both clocks stale. `or` matches on the label set minus __name__ and both
  # series carry the same instance, so the two arms must collapse to ONE alert.
  - interval: 5m
    input_series:
      - series: 'backup_restore_drill_last_success_seconds{instance="192.168.0.102:9101"}'
        values: '-8700000+0x40'
      - series: 'backup_restore_drill_last_run_seconds{instance="192.168.0.102:9101"}'
        values: '-8700000+0x40'
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupRestoreDrillStale
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 192.168.0.102:9101
  - interval: 5m
    input_series:
      - series: 'backup_restore_drill_last_success_seconds{instance="192.168.0.102:9101"}'
        values: '0+300x40'
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupRestoreDrillStale
        exp_alerts: []
  # MERGE-DAY REGRESSION TEST. Before the split this group expected a critical:
  # the rule carried `or absent(backup_restore_drill_last_success_seconds)` at
  # severity critical / for 1h, and the metric does not exist until a drill has
  # actually run — so it paged continuously from deploy until the first
  # quarterly elapse. The critical tier must now stay silent on an empty corpus.
  - interval: 5m
    input_series: []
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupRestoreDrillStale
        exp_alerts: []

  # BackupRestoreDrillNeverRan: the absence case, at WARNING behind a 26h
  # `for:`. The role seeds a drill when the units are newly installed, so the
  # metric normally appears within a textfile-collector cycle of the deploy;
  # 26h absorbs a deploy at any hour plus that pickup, and what survives it is
  # a seed that never ran or never passed.
  - interval: 30m
    input_series: []
    alert_rule_test:
      # Merge day: no seed metric yet, and nothing fires at either tier.
      - eval_time: 2h
        alertname: BackupRestoreDrillNeverRan
        exp_alerts: []
      # Still inside the deploy + pickup window.
      - eval_time: 25h
        alertname: BackupRestoreDrillNeverRan
        exp_alerts: []
      # Past 26h the seed demonstrably produced no passing drill.
      - eval_time: 27h
        alertname: BackupRestoreDrillNeverRan
        exp_alerts:
          - exp_labels:
              severity: warning
  # A drill that RAN but never PASSED — a failed seed. NeverRan is what surfaces
  # it (the success series is absent), and the 100-day critical stays quiet.
  - interval: 30m
    input_series:
      - series: 'backup_restore_drill_last_run_seconds{instance="192.168.0.102:9101"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 27h
        alertname: BackupRestoreDrillNeverRan
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 27h
        alertname: BackupRestoreDrillStale
        exp_alerts: []
  # Once any drill has passed, the absence alert must go quiet for good.
  - interval: 30m
    input_series:
      - series: 'backup_restore_drill_last_success_seconds{instance="192.168.0.102:9101"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 27h
        alertname: BackupRestoreDrillNeverRan
        exp_alerts: []

  # ResticOffsiteVerifyStale: last successful `restic check` older than 8d.
  # A FAILED verify is a separate alert (ResticOffsiteVerifyFailed) so the two
  # can carry different severities. NO absent() arm on either, so an empty
  # series set (verify never run) must NOT fire.
  - interval: 1m
    input_series:
      - series: 'restic_offsite_last_verify_timestamp_seconds'
        values: '-800000+0x70'
      - series: 'restic_offsite_last_verify_success'
        values: '1+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ResticOffsiteVerifyStale
        exp_alerts:
          - exp_labels:
              severity: warning
  - interval: 1m
    input_series:
      - series: 'restic_offsite_last_verify_timestamp_seconds'
        values: '0+60x70'
      - series: 'restic_offsite_last_verify_success'
        values: '1+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ResticOffsiteVerifyStale
        exp_alerts: []
  # A failed verify pages via ResticOffsiteVerifyFailed even when the timestamp
  # is recent — and must NOT also raise the staleness alert.
  - interval: 1m
    input_series:
      - series: 'restic_offsite_last_verify_timestamp_seconds'
        values: '0+60x70'
      - series: 'restic_offsite_last_verify_success'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ResticOffsiteVerifyFailed
        exp_alerts:
          - exp_labels:
              severity: critical
      - eval_time: 65m
        alertname: ResticOffsiteVerifyStale
        exp_alerts: []
  # No verify metrics at all (never run) — no absent() arm, so nothing fires.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: ResticOffsiteVerifyStale
        exp_alerts: []

  # BackupArtifactCollectorStale: the collector sentinel older than 2h fires; a
  # fresh sentinel does not; the absent() arm fires if the collector never emitted.
  - interval: 1m
    input_series:
      - series: 'backup_artifact_collector_last_success_seconds{instance="192.168.0.102:9101"}'
        values: '-10000+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactCollectorStale
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: '192.168.0.102:9101'
  - interval: 1m
    input_series:
      - series: 'backup_artifact_collector_last_success_seconds{instance="192.168.0.102:9101"}'
        values: '0+60x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactCollectorStale
        exp_alerts: []
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupArtifactCollectorStale
        exp_alerts:
          - exp_labels:
              severity: warning
