---
# Backup escalations measuring a day or more: ResticOffsiteFailedProlonged,
# PruneFailed, PruneBlocked, RepoShrank. 30m interval; see README.md for the
# cost model and why these read elapsed time from the TSDB, not a long `for:`.
rule_files:
  - rules.yaml
evaluation_interval: 30m
tests:
  # ResticOffsiteFailedProlonged: `last_backup_success == 0` OR a failed run
  # with NO backup metric at all, each gated on a timestamp gauge more than a
  # day stale. promtool starts at unix 0, so a 0 timestamp is stale past 24h.
  - interval: 5m
    input_series:
      - series: 'restic_offsite_last_backup_success{instance="10.0.10.102:9101"}'
        values: '0+0x400'
      - series: 'restic_offsite_last_run_success{instance="10.0.10.102:9101"}'
        values: '0+0x400'
      - series: 'restic_offsite_last_backup_timestamp_seconds{instance="10.0.10.102:9101"}'
        values: '0+0x400'
    alert_rule_test:
      - eval_time: 26h
        alertname: ResticOffsiteFailedProlonged
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 10.0.10.102:9101
  # Series starting mid-window (a Prometheus restart): the metric timestamp
  # carries the age, so the escalation still fires.
  - interval: 5m
    input_series:
      - series: 'restic_offsite_last_backup_success{instance="10.0.10.102:9101"}'
        values: '_x240 0+0x120'
      - series: 'restic_offsite_last_run_success{instance="10.0.10.102:9101"}'
        values: '_x240 0+0x120'
      - series: 'restic_offsite_last_backup_timestamp_seconds{instance="10.0.10.102:9101"}'
        values: '_x240 0+0x120'
    alert_rule_test:
      - eval_time: 26h
        alertname: ResticOffsiteFailedProlonged
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 10.0.10.102:9101
  # A failure whose last successful backup was only an hour ago — one bad
  # night, not a prolonged loss. ResticOffsiteFailed covers the run itself.
  - interval: 5m
    input_series:
      - series: 'restic_offsite_last_backup_success{instance="10.0.10.102:9101"}'
        values: '0+0x400'
      - series: 'restic_offsite_last_run_success{instance="10.0.10.102:9101"}'
        values: '0+0x400'
      - series: 'restic_offsite_last_backup_timestamp_seconds{instance="10.0.10.102:9101"}'
        values: '86400+0x400'
    alert_rule_test:
      - eval_time: 26h
        alertname: ResticOffsiteFailedProlonged
        exp_alerts: []
  # Failed run, no backup-success series: the `unless` arm carries it, gated on
  # the run-level timestamp instead.
  - interval: 5m
    input_series:
      - series: 'restic_offsite_last_run_success{instance="10.0.10.102:9101"}'
        values: '0+0x400'
      - series: 'restic_offsite_last_success_timestamp_seconds{instance="10.0.10.102:9101"}'
        values: '0+0x400'
    alert_rule_test:
      - eval_time: 26h
        alertname: ResticOffsiteFailedProlonged
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 10.0.10.102:9101
  # Backup landed, run failed later (a crashed prune): the `unless` suppresses
  # the run arm, so the prolonged alert stays silent and ResticOffsiteFailed
  # covers the run.
  - interval: 5m
    input_series:
      - series: 'restic_offsite_last_backup_success{instance="10.0.10.102:9101"}'
        values: '1+0x400'
      - series: 'restic_offsite_last_run_success{instance="10.0.10.102:9101"}'
        values: '0+0x400'
      - series: 'restic_offsite_last_backup_timestamp_seconds{instance="10.0.10.102:9101"}'
        values: '0+0x400'
    alert_rule_test:
      - eval_time: 26h
        alertname: ResticOffsiteFailedProlonged
        exp_alerts: []
  # A repository that has never had a successful backup emits no timestamp
  # series at all. Neither arm may fire — ResticOffsiteStale's absent() arm owns
  # that state at warning, so an undeployed collector cannot page critical.
  - interval: 5m
    input_series:
      - series: 'restic_offsite_last_backup_success{instance="10.0.10.102:9101"}'
        values: '0+0x400'
      - series: 'restic_offsite_last_run_success{instance="10.0.10.102:9101"}'
        values: '0+0x400'
    alert_rule_test:
      - eval_time: 26h
        alertname: ResticOffsiteFailedProlonged
        exp_alerts: []

  # Retention pair: retention_blocked=1 with last_prune_success=0 may fire ONLY
  # PruneBlocked (48h window), never PruneFailed.
  - interval: 5m
    input_series:
      - series: 'restic_offsite_last_prune_success{instance="10.0.10.102:9101"}'
        values: '0+0x700'
      - series: 'restic_offsite_retention_blocked{instance="10.0.10.102:9101"}'
        values: '1+0x700'
    alert_rule_test:
      - eval_time: 26h
        alertname: ResticOffsitePruneFailed
        exp_alerts: []
      - eval_time: 50h
        alertname: ResticOffsitePruneBlocked
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.0.10.102:9101
  # HISTORY GUARD. The same blocked state, but the collector only started
  # shipping 10h ago. min_over_time alone is satisfied by those samples, so
  # without the `offset` arm a fresh deploy would fire two days early.
  - interval: 5m
    input_series:
      - series: 'restic_offsite_last_prune_success{instance="10.0.10.102:9101"}'
        values: '_x468 0+0x232'
      - series: 'restic_offsite_retention_blocked{instance="10.0.10.102:9101"}'
        values: '_x468 1+0x232'
    alert_rule_test:
      - eval_time: 50h
        alertname: ResticOffsitePruneBlocked
        exp_alerts: []
  # A prune that succeeded at some point inside the window clears the blocked
  # escalation even though the newest sample is 1 — the ceiling guard has to be
  # continuous to count.
  - interval: 5m
    input_series:
      - series: 'restic_offsite_retention_blocked{instance="10.0.10.102:9101"}'
        values: '1+0x300 0+0x50 1+0x350'
    alert_rule_test:
      - eval_time: 50h
        alertname: ResticOffsitePruneBlocked
        exp_alerts: []

  # A genuine prune error leaves retention_blocked at 0, so PruneFailed fires
  # and PruneBlocked stays silent.
  - interval: 5m
    input_series:
      - series: 'restic_offsite_last_prune_success{instance="10.0.10.102:9101"}'
        values: '0+0x700'
      - series: 'restic_offsite_retention_blocked{instance="10.0.10.102:9101"}'
        values: '0+0x700'
    alert_rule_test:
      - eval_time: 26h
        alertname: ResticOffsitePruneFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.0.10.102:9101
      - eval_time: 50h
        alertname: ResticOffsitePruneBlocked
        exp_alerts: []
  # A prune that applied inside the 24h window clears it: max_over_time sees
  # the 1 even though the newest sample is 0.
  - interval: 5m
    input_series:
      - series: 'restic_offsite_last_prune_success{instance="10.0.10.102:9101"}'
        values: '0+0x100 1+0x20 0+0x580'
      - series: 'restic_offsite_retention_blocked{instance="10.0.10.102:9101"}'
        values: '0+0x700'
    alert_rule_test:
      - eval_time: 26h
        alertname: ResticOffsitePruneFailed
        exp_alerts: []

  # ResticOffsiteRepoShrank must ignore the emitter's "0 = unknown" sentinel,
  # written by the EXIT trap on every aborted run: unguarded, the delta is
  # trivially negative and pages critical for a repo that never shrank.
  - interval: 5m
    input_series:
      - series: 'restic_offsite_repo_size_bytes{instance="10.0.10.102:9101"}'
        values: '666000000000+0x600 0+0x300'
    alert_rule_test:
      - eval_time: 73h
        alertname: ResticOffsiteRepoShrank
        exp_alerts: []

  # A real 50% shrink over the same window still fires.
  - interval: 5m
    input_series:
      - series: 'restic_offsite_repo_size_bytes{instance="10.0.10.102:9101"}'
        values: '666000000000+0x600 333000000000+0x300'
    alert_rule_test:
      - eval_time: 73h
        alertname: ResticOffsiteRepoShrank
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 10.0.10.102:9101

  # Recovery after a sentinel: the 0 is now the FIRST sample in the 2d window,
  # which makes delta positive — so the alert cannot false-fire on the run
  # after an abort either, and no second guard is needed for it.
  - interval: 5m
    input_series:
      - series: 'restic_offsite_repo_size_bytes{instance="10.0.10.102:9101"}'
        values: '0+0x300 666000000000+0x600'
    alert_rule_test:
      - eval_time: 73h
        alertname: ResticOffsiteRepoShrank
        exp_alerts: []

  # Steady growth never fires.
  - interval: 5m
    input_series:
      - series: 'restic_offsite_repo_size_bytes{instance="10.0.10.102:9101"}'
        values: '600000000000+100000000x900'
    alert_rule_test:
      - eval_time: 73h
        alertname: ResticOffsiteRepoShrank
        exp_alerts: []

  # ArchiveBackupPruneBlocked: the archive pool's retention half. Replication
  # keeps reporting success, so only this alert can see snapshots accumulating.
  # Two days of continuous failure, with the history to prove it -> fires.
  - interval: 5m
    input_series:
      - series: 'archive_backup_last_prune_success{instance="10.0.10.102:9101"}'
        values: '0+0x700'
    alert_rule_test:
      - eval_time: 50h
        alertname: ArchiveBackupPruneBlocked
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.0.10.102:9101
  # HISTORY GUARD. Same failing state, but the collector only started shipping
  # 10h ago: max_over_time alone is satisfied by those samples, so without the
  # `offset` arm a fresh deploy would fire two days early.
  - interval: 5m
    input_series:
      - series: 'archive_backup_last_prune_success{instance="10.0.10.102:9101"}'
        values: '_x468 0+0x232'
    alert_rule_test:
      - eval_time: 50h
        alertname: ArchiveBackupPruneBlocked
        exp_alerts: []
  # A prune that applied inside the window clears it, even though the newest
  # sample is 0 — the failure has to be continuous to count.
  - interval: 5m
    input_series:
      - series: 'archive_backup_last_prune_success{instance="10.0.10.102:9101"}'
        values: '0+0x300 1+0x50 0+0x350'
    alert_rule_test:
      - eval_time: 50h
        alertname: ArchiveBackupPruneBlocked
        exp_alerts: []
  # A healthy pruner never fires, and does not drag the replication alerts in.
  - interval: 5m
    input_series:
      - series: 'archive_backup_last_prune_success{instance="10.0.10.102:9101"}'
        values: '1+0x700'
      - series: 'archive_backup_last_run_success{instance="10.0.10.102:9101"}'
        values: '1+0x700'
    alert_rule_test:
      - eval_time: 50h
        alertname: ArchiveBackupPruneBlocked
        exp_alerts: []
      - eval_time: 50h
        alertname: ArchiveBackupFailed
        exp_alerts: []

  # ArchiveBackupExcludedOrphans: an excluded child's archive copy the stream
  # leaves behind. No other metric names it, so a leftover copy would otherwise
  # only be a line in the timer unit's journal.
  - interval: 5m
    input_series:
      - series: 'archive_backup_excluded_orphans{instance="10.0.10.102:9101"}'
        values: '2+0x400'
    alert_rule_test:
      - eval_time: 26h
        alertname: ArchiveBackupExcludedOrphans
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.0.10.102:9101
  # The 24h `for:` is what keeps one deploy's warning off the pager: the same
  # count, 12h in, is pending and must not have fired.
  - interval: 5m
    input_series:
      - series: 'archive_backup_excluded_orphans{instance="10.0.10.102:9101"}'
        values: '2+0x400'
    alert_rule_test:
      - eval_time: 12h
        alertname: ArchiveBackupExcludedOrphans
        exp_alerts: []
  # A reconciled run publishes 0, which must not fire however long it holds.
  - interval: 5m
    input_series:
      - series: 'archive_backup_excluded_orphans{instance="10.0.10.102:9101"}'
        values: '0+0x700'
    alert_rule_test:
      - eval_time: 50h
        alertname: ArchiveBackupExcludedOrphans
        exp_alerts: []

  # ResticOffsitePruneNeverRan: a host uploading to B2 that has published no
  # prune result at all. Its healthy peer, which has one, must not fire.
  - interval: 5m
    input_series:
      - series: 'restic_offsite_last_success_timestamp_seconds{instance="10.0.10.102:9101"}'
        values: '0+300x1200'
      - series: 'restic_offsite_last_success_timestamp_seconds{instance="10.0.10.103:9101"}'
        values: '0+300x1200'
      - series: 'restic_offsite_last_prune_success{instance="10.0.10.103:9101"}'
        values: '1+0x1200'
    alert_rule_test:
      # Inside the 3d window: the offset witness has no data yet.
      - eval_time: 40h
        alertname: ResticOffsitePruneNeverRan
        exp_alerts: []
      # Past the 71h offset witness but inside the 1h hold.
      - eval_time: 71h30m
        alertname: ResticOffsitePruneNeverRan
        exp_alerts: []
      - eval_time: 80h
        alertname: ResticOffsitePruneNeverRan
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 10.0.10.102:9101

  # A host that pruned once and then went quiet is not "never pruned": the 3d
  # lookback still sees that sample, so the alert stays silent.
  - interval: 5m
    input_series:
      - series: 'restic_offsite_last_success_timestamp_seconds{instance="10.0.10.104:9101"}'
        values: '0+300x1200'
      - series: 'restic_offsite_last_prune_success{instance="10.0.10.104:9101"}'
        values: '1+0x288'
    alert_rule_test:
      - eval_time: 80h
        alertname: ResticOffsitePruneNeverRan
        exp_alerts: []

  # No prune series at all: neither prune-outcome rule may fire on an absent
  # metric. ResticOffsitePruneNeverRan is the one that owns that state.
  - interval: 5m
    input_series:
      - series: 'restic_offsite_last_success_timestamp_seconds{instance="10.0.10.102:9101"}'
        values: '0+300x1200'
    alert_rule_test:
      - eval_time: 80h
        alertname: ResticOffsitePruneFailed
        exp_alerts: []
      - eval_time: 80h
        alertname: ResticOffsitePruneBlocked
        exp_alerts: []
