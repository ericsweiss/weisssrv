---
# This repo's vendored copies of weisssrv-lib files, checked by the library's
# check-vendored-copies.py via scripts/test_vendored_byte_identity.py under
# `task lint` at the pinned WEISSSRV_LIB_REF.

# `vendored:` entries are byte-identical to the library: drift in either
# direction fails, so fix upstream and re-vendor, never edit a copy here.

# `forked:` entries must still differ, carry a mandatory `reason:`, and their
# `reconciled_sha256` fails when the library blob moves until it is re-taken.

# An entry is a bare string, or a mapping with `lib:` and `consumer:` when the
# paths differ. Moving a copy inside this repo is an edit to this file alone.

vendored:
  - scripts/b2-bucket-drift.py
  - scripts/check-alertmanager-behaviour.py
  - scripts/check-backup-artifact-apps.py
  - scripts/check-default-deny-coverage.py
  - scripts/check-deploy-coverage.sh
  - scripts/check-doc-links.py
  - scripts/check-hpa-vpa-invariant.py
  - scripts/check-kubectl-version-pin.py
  - scripts/check-lib-pins.py
  # The gate's canonical suite travels with it, as in both templates.
  - lib: tests/test_check_lib_pins.py
    consumer: scripts/test_check_lib_pins.py
  - scripts/check-netpol-except-parity.py
  - scripts/check-pvc-storageclass.py
  - scripts/check-scrape-netpol.py
  - scripts/check-secretstore-scope.py
  - scripts/check-taskfile.sh
  - scripts/check-versions.py
  - scripts/find-pve-host-for-vm.sh
  - scripts/find-reachable-host.sh
  - scripts/flux-env.sh
  - scripts/flux-render.sh
  - scripts/generate-hosts-env.py
  - scripts/generate-versions-configmap.py
  - scripts/kubeconform-skipped.py
  - scripts/lint-prometheus-config.sh
  - scripts/molecule-retry.sh
  - scripts/resolve-tool.sh
  - scripts/sanitize-junit-expected-failures.py
  - scripts/shell-lib.sh
  - scripts/validate-helm-values.py
  - scripts/version-bump-mr.py
  - scripts/version-check-ci.py
  # Discovered by the tool at its conventional root name.
  - lib: lint/ruff.toml
    consumer: ruff.toml
  # Kept out of ansible-lint's discovery path: a repo-root `.yamllint` replaces
  # its yaml rule and disables fix mode. Callers pass `-c` at this path.
  - lint/yamllint-relaxed.yml
  # Pending the next pin bump — v0.17.1 offers none of these, so registering one now reds the gate:
  # lint/gitattributes, check-comment-length.py, ci_yaml.py, gate_common.py, check-kustomization.py, flux-child-kustomizations.py, check-deploy-preflight.py, inventory_tree.py,
  # molecule-shared/*, supervised-apply-guard.sh, maintenance-run-with-verify.sh, check-nfs-tls.py, check-runbook-anchors.py, check-secret-rotation-coverage.py, unifi-settings-drift.py, smoke-lib.sh, wait-for-reloader-roll.sh, check-flux-version-pin.py, check-live-cpu-limits.py, ci_playbook_invocations.py, cluster-config-value.sh, collect-state-lib.sh, deploy-verify-lib.sh.

  # CRITICAL: gate_common.py is imported from its own directory by the corpus
  # gates registered above (default-deny, scrape-netpol, secretstore-scope,
  # pvc-storageclass, hpa-vpa-invariant, netpol-except-parity, nfs-tls). The
  # bump that re-vendors any of them must vendor it in the same change, or all
  # of them exit 2 on import at `task lint`. ci_yaml.py pairs the same way with
  # the CI gates.

forked:
  # The library gained --rules-dir / --require-rules-dir after v0.17.1, which
  # makes this fork reason obsolete: un-fork it at the next pin bump.
  - lib: scripts/extract-prometheus-config.py
    reason: >-
      Rules extraction unions the HelmRelease with the standalone
      PrometheusRule manifests under observability/rules/; the library copy
      reads the HelmRelease alone.
    reconciled_sha256: 294bcbf560adf90c9318c10c10d5da9c33e96b0043498e55e11616a20b03adf9
  - lib: lint/gitleaks.toml
    consumer: .gitleaks.toml
    reason: Allowlist paths and fixture anchors are per-repo.
    reconciled_sha256: bffbe70c94436f4442aaeecc1f1f5715315fc5908b1486b2198796b9e097ff0d
  - lib: lint/secret-detection-ruleset.toml
    consumer: .gitlab/secret-detection-ruleset.toml
    reason: The header and ruleset description name this repo.
    reconciled_sha256: d6413e69a2d8a6f7d0c468d4370a406299894ad9e3fe274eb7f69eb30a7c936d
  - lib: lint/editorconfig
    consumer: .editorconfig
    reason: >-
      The header names this repo's own linters, and `[Dockerfile*]` covers the
      per-app Dockerfile suffixes under docker/. Nothing else differs.
    reconciled_sha256: 911171d9f26ba0bb47300c97a9e46b078d48eb852dfe9a050fbc3c8e41cc2944
  - lib: lint/pre-commit-config.yaml
    consumer: .pre-commit-config.yaml
    reason: Per-repo hook set on a shared base.
    reconciled_sha256: 39e7c3a5fbc7d2185ad73c436cbba736cae1e2b2b88f7f50387f041cbd87323c
