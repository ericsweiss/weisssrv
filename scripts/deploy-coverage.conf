# Config for scripts/check-deploy-coverage.sh ($DEPLOY_COVERAGE_CONFIG
# overrides). Entries name Ansible assets not wired to a CI deploy job, each
# with a trailing `# rationale` the script requires. Prefer wiring over listing.

[settings]
roles_dir = ansible/roles
playbooks_dir = ansible/playbooks
inventory_dir = ansible/inventories/prod
ci_file = .gitlab-ci.yml
job_prefix = deploy-
job_stage = deploy

# No [roles] section: this repo vendors no roles — every role comes from the
# weisssrv.infra collection, pinned in ansible/requirements.yml.

[playbooks]
site.yml                        # broad fan-out; each deploy-* job lists its own triggers
k3s.yml                         # node lifecycle: task k3s:deploy, never CI-driven
k3s-provision-vms.yml           # VM provisioning: task k3s:provision-vms
windows.yml                     # VM shell + guest firewall: task windows:provision, then an interactive install
zfs-encryption.yml              # cold-boot passphrase activation: task zfs:encrypt
proxmox-ha.yml                  # HA rules / replication: task proxmox:ha
proxmox-enable-autostart.yml    # one-shot after cluster expansion, manual
postflight.yml                  # operator-run post-deploy verification helper
mail.yml                        # SMTP relay alone: task mail:deploy; CI reaches it through deploy-base
rotate-mail-credential.yml      # credential rotation: task mail:rotate-credential (docs/15)
show-cert-host-keys.yml         # operator helper for host_vars/dns-01.yml host_key fields
bootstrap/storage-bootstrap.yml # one-shot ZFS pool bootstrap; pool creation is never automated
_reachability-probe.yml         # import_playbook'd by site.yml + base.yml; never run alone
_reachability-gate.yml          # import_playbook'd by site.yml + base.yml; never run alone
tasks/_check-mode-reachable.yml # shared guard imported by app playbooks; ships with their deploy job
tasks/_reseed-cert-target.yml   # shared re-seed task included by base/plex/gitlab/nextcloud/immich/mail; ships with their deploy job
maintenance/_apt-upgrade-and-reboot.yml      # helper included by the maintenance-* CI jobs
maintenance/_apt-upgrade.yml                 # helper included by the maintenance-* CI jobs
maintenance/_ensure-nfs-server-healthy.yml   # helper included by the maintenance-* CI jobs
maintenance/_reboot-if-needed.yml            # helper included by the maintenance-* CI jobs
tasks/_probe-pve-cluster.yml                 # helper included by the manual proxmox-enable-autostart one-shot
maintenance/_uncordon-and-wait-ready.yml     # helper included by the maintenance-* CI jobs
maintenance/_wait-no-kured-server-reboot.yml # helper included by the maintenance-* CI jobs
maintenance/update-applications.yml # run by the manual maintenance-* jobs, which carry their own rules
maintenance/update-full.yml         # run by the manual maintenance-* jobs
maintenance/update-k3s-nodes.yml    # run by the manual maintenance-* jobs
maintenance/update-packages.yml     # run by the manual maintenance-* jobs

# CRITICAL: per-guest firewall assignments live only in hosts.yml, so
# deploy-ansible-firewall watches that path explicitly. It is the sole trigger
# for an inventory-only firewall edit.
[inventory]
hosts.yml                # affects every deploy (group membership drives targeting); operator picks the jobs
group_vars/k3s.yml       # k3s cluster vars: task k3s:deploy
group_vars/windows_vms.yml  # Windows guest vars: operator-run task windows:deploy, no CI deploy job
