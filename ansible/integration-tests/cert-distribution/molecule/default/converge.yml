---
# Certificate Distribution Integration Test - Converge
# Tests acme_certs with SSH distribution to multiple hosts

- name: Converge - Certificate Stack (All Hosts)
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - ../../../../inventories/prod/group_vars/all.yml


  pre_tasks:
    # Wait for apt locks to be released (unattended-upgrades runs on container startup)
    - name: Wait for apt locks to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
              fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
          sleep 1
        done
      args:
        executable: /bin/bash
      changed_when: false

    # Fix any interrupted dpkg state in Docker containers
    - name: Fix any interrupted dpkg state
      ansible.builtin.shell: |
        dpkg --configure -a || true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      changed_when: false

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - systemd
          - openssh-server
          - openssh-client
          - curl
          - git
          - sudo
        state: present

    - name: Wait for systemd to be ready
      ansible.builtin.wait_for:
        path: /run/systemd/system
        state: present
        timeout: 30

    # Set up SSH for certificate distribution
    - name: Create admin user
      ansible.builtin.user:
        name: "{{ admin_username }}"
        state: present
        shell: /bin/bash
        create_home: true

    - name: Configure passwordless sudo for admin user
      ansible.builtin.copy:
        content: "{{ admin_username }} ALL=(ALL) NOPASSWD: ALL\n"
        dest: "/etc/sudoers.d/{{ admin_username }}"
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Start SSH service
      ansible.builtin.systemd:
        name: ssh
        state: started
        enabled: true

    - name: Ensure .ssh directory exists for admin user
      ansible.builtin.file:
        path: /home/{{ admin_username }}/.ssh
        state: directory
        owner: "{{ admin_username }}"
        group: "{{ admin_username }}"
        mode: '0700'

    - name: Accept host keys (for SSH distribution - eric user)
      ansible.builtin.shell: |
        ssh-keyscan -H {{ item }} >> /home/{{ admin_username }}/.ssh/known_hosts
        chown {{ admin_username }}:{{ admin_username }} /home/{{ admin_username }}/.ssh/known_hosts
      loop:
        - cert-client-01
        - cert-client-02
      when: "'cert_servers' in group_names"
      changed_when: false

    - name: Accept host keys (for SSH distribution - root user for distribution script)
      ansible.builtin.shell: |
        mkdir -p /root/.ssh
        ssh-keyscan -H {{ item }} >> /root/.ssh/known_hosts
        chmod 700 /root/.ssh
        chmod 644 /root/.ssh/known_hosts
      loop:
        - cert-client-01
        - cert-client-02
      when: "'cert_servers' in group_names"
      changed_when: false

    # Create destination directories on clients
    - name: Create certificate directories on clients
      ansible.builtin.file:
        path: /etc/ssl/certs/wildcard
        state: directory
        mode: '0755'
      when: "'cert_clients' in group_names"

# Generate the cert-distribution keypair + collect each client's host key,
# then add_host inject onto dns-01 so the role gets valid input.
#
# Why here and not in prepare.yml: molecule runs prepare and converge as
# separate ansible-playbook invocations, so add_host vars don't survive.
# Within a single converge.yml, add_host vars are visible to subsequent
# plays — including the cert_servers play that applies acme_certs.
- name: Converge - Collect cert client host keys
  hosts: cert_clients
  become: true
  gather_facts: false
  tasks:
    - name: Ensure SSH host keys exist
      ansible.builtin.command: ssh-keygen -A
      changed_when: false

    - name: Slurp ed25519 host public key
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_host_ed25519_key.pub
      register: host_ed25519_pub

    - name: Set host_key fact (algorithm + key only, drop trailing user@host comment)
      ansible.builtin.set_fact:
        client_host_key: >-
          {{
            (host_ed25519_pub.content | b64decode | trim).split()
            | reject('match', '^[a-zA-Z0-9_.+-]+@')
            | list
            | join(' ')
          }}

- name: Converge - Generate cert-distribution keypair + inject dns-01 vars
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    runtime_cert_targets:
      - host: cert-client-01
        ip: cert-client-01
        cert_dir: /etc/ssl/certs/wildcard
        owner: root
        group: root
        cert_mode: "0644"
        key_mode: "0600"
        restart_service: ssh
        host_key: "{{ hostvars['cert-client-01'].client_host_key }}"
      - host: cert-client-02
        ip: cert-client-02
        cert_dir: /etc/ssl/certs/wildcard
        owner: root
        group: root
        cert_mode: "0644"
        key_mode: "0600"
        restart_service: ssh
        host_key: "{{ hostvars['cert-client-02'].client_host_key }}"
  tasks:
    - name: Create temp dir for throwaway keypair
      ansible.builtin.tempfile:
        state: directory
        suffix: cert-dist-keys
      register: keytmp

    - name: Generate ed25519 keypair (throwaway, scoped to this molecule run)
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -N "" -C "cert-distribution@dns-01-test" -f {{ keytmp.path }}/id_ed25519_certs
        creates: "{{ keytmp.path }}/id_ed25519_certs"

    - name: Read generated private key
      ansible.builtin.slurp:
        src: "{{ keytmp.path }}/id_ed25519_certs"
      register: gen_priv

    - name: Read generated public key
      ansible.builtin.slurp:
        src: "{{ keytmp.path }}/id_ed25519_certs.pub"
      register: gen_pub

    # add_host facts override inventory group_vars — this gives dns-01 the
    # real keypair and host_key-populated cert_distribution_targets that
    # the role's asserts and authorized_key/known_hosts tasks demand.
    - name: Inject real key material onto dns-01 hostvars
      ansible.builtin.add_host:
        name: dns-01
        groups:
          - cert_stack
          - cert_servers
        dns01_ssh_private_key: "{{ gen_priv.content | b64decode | trim }}"
        dns01_ssh_public_key: "{{ gen_pub.content | b64decode | trim }}"
        cert_distribution_targets: "{{ runtime_cert_targets }}"

- name: Converge - Certificate Server
  hosts: cert_servers
  become: true
  gather_facts: true
  vars_files:
    - ../../../../inventories/prod/group_vars/all.yml

  vars:
    # Override defaults for container testing
    local_cert_dir: /opt/AdGuardHome/certs

  tasks:
    # Pre-create mock certificates (acme.sh would normally get these from Let's Encrypt)
    - name: Create acme.sh directory
      ansible.builtin.file:
        path: /root/.acme.sh
        state: directory
        mode: '0700'

    - name: Create mock domain directory
      ansible.builtin.file:
        path: "/root/.acme.sh/{{ item.domain }}"
        state: directory
        mode: '0755'
      loop: "{{ acme_domains }}"

    - name: Create mock certificates in acme.sh directory
      ansible.builtin.copy:
        content: |
          -----BEGIN CERTIFICATE-----
          MIICMzCCAZygAwIBAgIUMockTestCertificate{{ item.domain }}000000wDQYJKoZI
          -----END CERTIFICATE-----
        dest: "/root/.acme.sh/{{ item.domain }}/fullchain.cer"
        mode: '0644'
      loop: "{{ acme_domains }}"

    - name: Create mock private keys in acme.sh directory
      ansible.builtin.copy:
        content: |
          -----BEGIN PRIVATE KEY-----
          MIIEvgIBADANBgkqhkiGTestPrivateKey{{ item.domain }}00000000000000000
          -----END PRIVATE KEY-----
        dest: "/root/.acme.sh/{{ item.domain }}/{{ item.domain }}.key"
        mode: '0600'
      loop: "{{ acme_domains }}"

    - name: Create mock acme.sh binary
      ansible.builtin.copy:
        content: |
          #!/usr/bin/env bash
          # Mock acme.sh for testing
          echo "Mock acme.sh - test only"
        dest: /root/.acme.sh/acme.sh
        mode: '0755'

    # Create local cert dir with installed certs (simulates acme.sh --install-cert)
    - name: Create local certificate directory
      ansible.builtin.file:
        path: "{{ local_cert_dir }}"
        state: directory
        mode: '0755'

    - name: Create mock fullchain.pem in local cert dir
      ansible.builtin.copy:
        content: |
          -----BEGIN CERTIFICATE-----
          MIICMzCCAZygAwIBAgIUMockTestCertificateFullchain000000wDQYJKoZI
          -----END CERTIFICATE-----
        dest: "{{ local_cert_dir }}/fullchain.pem"
        mode: '0644'

    - name: Create mock privkey.pem in local cert dir
      ansible.builtin.copy:
        content: |
          -----BEGIN PRIVATE KEY-----
          MIIEvgIBADANBgkqhkiGTestPrivateKeyLocalCert00000000000000000
          -----END PRIVATE KEY-----
        dest: "{{ local_cert_dir }}/privkey.pem"
        mode: '0640'

    # Install sudo for the distribution script (runs sudo on remote hosts)
    - name: Install sudo
      ansible.builtin.apt:
        name: sudo
        state: present

    # Create mock AdGuardHome service (the reload script tries to restart it)
    - name: Create mock AdGuardHome binary
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Mock AdGuardHome running"
          sleep infinity
        dest: /usr/local/bin/AdGuardHome
        mode: '0755'

    - name: Create mock AdGuardHome systemd service
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Mock AdGuard Home for testing
          [Service]
          Type=simple
          ExecStart=/usr/local/bin/AdGuardHome
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/AdGuardHome.service
        mode: '0644'

    - name: Reload systemd and start mock AdGuardHome
      ansible.builtin.systemd:
        daemon_reload: true
        name: AdGuardHome
        state: started
        enabled: true

    # Vars come from molecule.yml inventory and all.yml vars_files
    - name: Apply acme_certs role
      ansible.builtin.include_role:
        name: acme_certs
      vars:
        # Override defaults for container testing (cert issuance is mocked
        # by the pre-created /root/.acme.sh content above)
        local_cert_dir: /opt/AdGuardHome/certs

    # The role deploys the real ed25519 keypair (generated earlier in this
    # converge, injected via add_host) to /home/eric/.ssh/id_ed25519_certs and pushes
    # the matching pubkey to each cert_distribution_targets host's
    # authorized_keys via ansible.posix.authorized_key. Both happen inside
    # acme_certs above, so no post-role keygen / authorized_key push is
    # needed here.

# Third play: Run the distribution script now that keys are in place
- name: Converge - Run Certificate Distribution
  hosts: cert_servers
  become: true
  gather_facts: false
  vars_files:
    - ../../../../inventories/prod/group_vars/all.yml

  vars:
    local_cert_dir: /opt/AdGuardHome/certs

  tasks:
    - name: Run certificate distribution script
      ansible.builtin.command: /usr/local/sbin/homelab-cert-reload.sh
      register: distribution_result
      changed_when: distribution_result.rc == 0
      failed_when: false  # Don't fail if distribution has issues (we'll check in verify)

    - name: Log distribution result
      ansible.builtin.debug:
        msg: |
          Distribution script exit code: {{ distribution_result.rc }}
          stdout: {{ distribution_result.stdout | default('') }}
          stderr: {{ distribution_result.stderr | default('') }}
