---
# Certificate Distribution Integration Test
# Tests: acme_certs with SSH-based distribution to multiple hosts

driver:
  name: docker

platforms:
  - name: dns-01
    # Shared systemd-container shape; only name/groups differ per platform.
    <<: &systemd_platform
      image: "${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:v0.19.0}"
      pre_build_image: true
      privileged: true
      cgroupns_mode: host
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup:rw
      command: /lib/systemd/systemd
      stop_signal: SIGRTMIN+3
      tty: true
      tmpfs:
        - /run
        - /tmp
      networks:
        - name: cert-stack-net
    groups:
      - cert_stack
      - cert_servers

  - name: cert-client-01
    <<: *systemd_platform
    groups:
      - cert_stack
      - cert_clients

  - name: cert-client-02
    <<: *systemd_platform
    groups:
      - cert_stack
      - cert_clients

dependency:
  name: galaxy
  options:
    # Single source of truth for the weisssrv.infra pin, resolved in molecule's
    # CWD (the stack dir).
    requirements-file: ../../requirements.yml
provisioner:
  name: ansible
  env:
    # Required for molecule_docker plugin (upstream broken conditional in destroy.yml)
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
    # Dummy key: all.yml looks SSH_PUBLIC_KEY up and the base role requires it.
    # yamllint disable-line rule:line-length
    SSH_PUBLIC_KEY: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC3qctest123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123== test@molecule"
  playbooks:
    prepare: ../../../_shared/prepare.yml
  inventory:
    group_vars:
      cert_servers:
        # acme.sh configuration
        acme_certs_enabled: true
        acme_certs_domain: "{{ internal_domain }}"
        acme_certs_email: test@example.com
        # Test-local list driving the mock cert fixtures in converge/verify —
        # NOT a role knob (acme_certs issues acme_certs_domain + its wildcard
        # and reads no domain-list variable).
        mock_cert_domains:
          - domain: "*.esweiss.com"
          - domain: esweiss.com

        # SSH keys (acme_certs_ssh_private_key/_public_key) are generated in
        # converge.yml and injected onto dns-01's hostvars via add_host. The
        # role's assert surfaces a clear error if that injection fails.

        # Certificate distribution targets. converge.yml slurps host_key from
        # each cert_clients container and re-injects the whole list via
        # add_host; the static fields stay here so verify.yml reads the shape.
        acme_certs_distribution_targets:
          - host: cert-client-01
            ip: cert-client-01
            cert_dir: /etc/ssl/certs/wildcard
            owner: root
            group: root
            cert_mode: "0644"
            key_mode: "0600"
            restart_service: ssh
          - host: cert-client-02
            ip: cert-client-02
            cert_dir: /etc/ssl/certs/wildcard
            owner: root
            group: root
            cert_mode: "0644"
            key_mode: "0600"
            restart_service: ssh

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Skip idempotence: a fresh throwaway keypair is generated per run, so
    # the deployed key files always change between converges
    # - idempotence
    - verify
    - cleanup
    - destroy
