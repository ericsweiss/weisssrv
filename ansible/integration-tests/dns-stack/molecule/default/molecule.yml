---
# DNS Stack Integration Test
# Tests: unbound + adguard_home + adguard_sync across two DNS servers

driver:
  name: docker

platforms:
  - name: dns-01
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    capabilities:
      - NET_ADMIN
      - NET_RAW
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    networks:
      - name: dns-stack-net
    groups:
      - dns
      - dns_primary

  - name: dns-02
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    capabilities:
      - NET_ADMIN
      - NET_RAW
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    networks:
      - name: dns-stack-net
    groups:
      - dns
      - dns_replica

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../../../roles
    # Required for molecule_docker plugin (upstream broken conditional in destroy.yml)
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
    # Provide dummy SSH key for testing (base role expects this via all.yml lookup)
    # yamllint disable-line rule:line-length
    SSH_PUBLIC_KEY: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC3qctest123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123== test@molecule"
  config_options:
    defaults:
      # Use /tmp for remote_tmp to avoid Docker container stability issues
      # The ~/.ansible/tmp directory can become inaccessible when containers restart
      remote_tmp: /tmp/.ansible-${USER}/tmp
  inventory:
    group_vars:
      dns:
        # Common DNS configuration
        timezone: "America/Chicago"
        # Docker containers have /etc/resolv.conf as a bind mount that can't be replaced
        skip_resolv_conf_update: true
        # Disable PrivateTmp in systemd service for Docker container compatibility
        # PrivateTmp can cause container crashes when systemd tries to create private mounts
        adguard_use_private_tmp: false
        # Disable ProtectSystem in systemd service for Docker container compatibility
        # ProtectSystem=strict can crash containers when systemd creates private mounts over system directories
        adguard_use_protect_system: false
        upstream_dns_servers:
          - 1.1.1.1
          - 8.8.8.8
        # AdGuard Home API configuration (required for full initialization)
        adguard_protection_enabled: true
        adguard_upstream_mode: "load_balance"
        adguard_fallback_dns: []
        adguard_enable_dnssec: false
        adguard_resolve_clients: true
        adguard_use_private_ptr_resolvers: false
        adguard_disable_ipv6: false
        adguard_cache_enabled: true
        adguard_cache_size: 4194304
        adguard_cache_ttl_min: 0
        adguard_cache_ttl_max: 0
        adguard_cache_optimistic: false
        adguard_ratelimit: 20
        adguard_ratelimit_whitelist: []
        adguard_dhcp_enabled: false
        adguard_rewrites: []
        adguard_user_rules: []
        # Note: Versions loaded from production group_vars via vars_files in converge.yml

      dns_primary:
        # Primary DNS server (dns-01)
        adguard_home_port: 3000
        adguard_admin_user: admin
        # bcrypt hash is generated automatically from password by adguard_home role
        adguard_admin_password: password
        adguard_bind_host: 0.0.0.0
        adguard_bind_port: 53
        unbound_port: 5335
        unbound_interface: 127.0.0.1
        adguard_tls_enabled: false  # Disable TLS in tests (no real certificates)
        # AdGuard Sync configuration (sync FROM dns-01 TO dns-02)
        adguardhome_sync_enabled: true
        adguardhome_sync_origin: "http://dns-01:3000"
        adguardhome_sync_replica: "http://dns-02:3000"
        adguardhome_sync_features:
          dns:
            accessLists: true
            serverConfig: true
            rewrites: true
          dhcp:
            serverConfig: false
          filters: true
          clients: true
          settings:
            generalSettings: true

      dns_replica:
        # Replica DNS server (dns-02)
        adguard_home_port: 3000
        adguard_admin_user: admin
        # bcrypt hash is generated automatically from password by adguard_home role
        adguard_admin_password: password
        adguard_bind_host: 0.0.0.0
        adguard_bind_port: 53
        unbound_port: 5335
        unbound_interface: 127.0.0.1

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
