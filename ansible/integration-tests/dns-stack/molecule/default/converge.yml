---
# DNS Stack Integration Test - Converge
# Deploys unbound + adguard_home on both servers, then adguard_sync on dns-02

- name: Converge - DNS Stack
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - ../../../../inventories/prod/group_vars/all.yml

  pre_tasks:
    # Note: adguard_admin_password_hash is now generated automatically by the adguard_home role
    # from adguard_admin_password using password_hash('bcrypt'). No manual set_fact needed.

    - name: Container warm-up (apt locks, dpkg state, cache, systemd)
      ansible.builtin.include_tasks: ../../../../molecule/tasks/container-warmup.yml

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - gnupg
          - systemd
          - dnsutils  # For dig command in tests
        state: present

  tasks:
    # Deploy Unbound on all DNS servers. Interface/port and the DoT forwarders
    # all come from the molecule.yml group_vars (NOT an include_role `vars:`
    # block) on purpose: adguard_home declares `dependencies: [unbound]`, so
    # unbound is applied a SECOND time as that dependency. include_role `vars:`
    # are include-scoped and would not reach the dependency, leaving the two
    # applications with different forwarder lists (override vs role default) that
    # overwrite each other every converge — a permanent idempotence failure.
    # Group_vars are seen by both, so the config converges. verify.yml asserts
    # the group-level forwarders render (and the role defaults do not).
    - name: Apply unbound role
      ansible.builtin.include_role:
        name: unbound

    # Deploy AdGuard Home on all DNS servers. The role completes the setup
    # wizard (POST /control/install/configure), sets the admin password, then
    # runs the FULL API path against the live instance:
    #   - api_base_config.yml (upstream DNS, cache, ratelimit, ...) on both hosts
    #   - api_config.yml (DNS-rewrite + filtering reconciliation) on dns-01 only
    # This exercises the add/reconcile path against a real AdGuard — verify.yml
    # asserts the codified adguard_rewrites (molecule.yml) actually landed.
    #
    # Still container-limited: AdGuard's own resolution path isn't representative
    # because the resolv.conf switch is skipped (skip_resolv_conf_update: true),
    # so DNS queries are validated via Unbound (AdGuard's upstream) instead.
    # Full end-to-end AdGuard resolution is validated in production by
    # postflight.yml.
    - name: Apply adguard_home role
      ansible.builtin.include_role:
        name: adguard_home
      vars:
        # Use local Unbound as upstream
        adguard_upstream_dns:
          - "127.0.0.1:5335"
        # Note: rewrites, ports, admin credentials come from molecule.yml inventory

    # Deploy AdGuard Sync on primary only (syncs TO replica)
    - name: Apply adguard_sync role
      ansible.builtin.include_role:
        name: adguard_sync
      when:
        - "'dns_primary' in group_names"
        - adguardhome_sync_enabled | default(false)
      # Note: All sync configuration comes from molecule.yml inventory
