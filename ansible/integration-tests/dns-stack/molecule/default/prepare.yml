---
# DNS Stack Integration Test - Prepare
# - Initialize containers for reliable testing
# - Configure systemd-resolved to not bind port 53

- name: Prepare - DNS Stack Environment
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Wait for systemd to be ready
      ansible.builtin.raw: |
        for i in $(seq 1 30); do
          if systemctl is-system-running 2>/dev/null | grep -qE '(running|degraded)'; then
            exit 0
          fi
          sleep 1
        done
        systemctl status >/dev/null 2>&1 && exit 0
        exit 1
      changed_when: false
      retries: 3
      delay: 2
      register: systemd_ready
      until: systemd_ready.rc == 0

    - name: Disable apt background services
      ansible.builtin.raw: |
        systemctl stop apt-daily.timer 2>/dev/null || true
        systemctl stop apt-daily-upgrade.timer 2>/dev/null || true
        systemctl stop unattended-upgrades.service 2>/dev/null || true
        systemctl disable apt-daily.timer 2>/dev/null || true
        systemctl disable apt-daily-upgrade.timer 2>/dev/null || true
        exit 0
      changed_when: false

    - name: Create systemd-resolved config directory
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure systemd-resolved to not bind port 53
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/no-dns-stub.conf
        content: |
          [Resolve]
          DNSStubListener=no
        owner: root
        group: root
        mode: "0644"

    - name: Restart systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
        daemon_reload: true
      failed_when: false

    - name: Wait for systemd-resolved to release port 53
      ansible.builtin.wait_for:
        port: 53
        state: stopped
        timeout: 30
      failed_when: false

    # Ensure container is fully stable before converge
    - name: Wait for system stability after systemd-resolved restart
      ansible.builtin.raw: |
        sleep 3
      changed_when: false

    # Create ansible temp directory to prevent "Failed to create temporary directory" errors
    - name: Ensure ansible temp directory exists
      ansible.builtin.raw: |
        mkdir -p /root/.ansible/tmp
        chmod 700 /root/.ansible/tmp
      changed_when: false
