---
# Base Infrastructure Integration Test
# Tests: base + qol + tailscale working together

driver:
  name: docker

platforms:
  - name: base-test-01
    image: ghcr.io/hifis-net/debian-systemd:trixie
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
    networks:
      - name: base-infra-net
    groups:
      - base_managed
      - qol_enabled

  - name: base-test-02
    image: ghcr.io/hifis-net/debian-systemd:trixie
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
    networks:
      - name: base-infra-net
    groups:
      - base_managed
      - qol_enabled

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../../../roles
    # Required for molecule_docker compatibility with newer Ansible versions
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
    # Provide dummy SSH key for testing (base role expects this via all.yml lookup)
    SSH_PUBLIC_KEY: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC3qctest123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123== test@molecule"
  inventory:
    group_vars:
      base_managed:
        # Base role configuration
        # timezone inherited from production all.yml (America/Los_Angeles)
        common_packages:
          - curl
          - wget
          - git
          - htop
          - tmux
          - neovim
          - net-tools
        admin_username: eric
        admin_user_shell: /bin/zsh
        skip_ssh_config: true  # SSH doesn't work in containers
        skip_dns_config: true  # DNS resolver needs real network

        # Tailscale configuration
        tailscale_auth_key: "tskey-test-key-not-real"
        skip_tailscale_up: true  # Can't actually connect in container

      qol_enabled:
        # Note: Versions loaded from production group_vars via vars_files in converge.yml

        # QoL configuration
        zsh_plugins:
          - git
          - docker
          - kubectl
          - ansible
          - golang
          - python
          - poetry
          - terraform
          - tmux
          - systemd
          - sudo
          - ssh-agent
          - gpg-agent
          - colored-man-pages
          - command-not-found
          - extract
          - safe-paste
          - zsh-syntax-highlighting
          - zsh-autosuggestions
        neovim_plugins:
          - VundleVim/Vundle.vim
          - tpope/vim-fugitive
          - preservim/nerdtree
        install_fzf: true
        install_ripgrep: true

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
