---
# Base Infrastructure Integration Test
# Tests: base + qol + tailscale working together

driver:
  name: docker

platforms:
  - name: base-test-01
    # Shared systemd-container shape including group membership; only the
    # name differs per platform.
    <<: &systemd_platform
      image: "${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:v0.19.0}"
      pre_build_image: true
      privileged: true
      cgroupns_mode: host
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup:rw
      command: /lib/systemd/systemd
      stop_signal: SIGRTMIN+3
      tty: true
      tmpfs:
        - /run
        - /tmp
      networks:
        - name: base-infra-net
      groups:
        - base_managed
        - qol_enabled

  - name: base-test-02
    <<: *systemd_platform

dependency:
  name: galaxy
  options:
    # Single source of truth for the weisssrv.infra pin, resolved in molecule's
    # CWD (the stack dir).
    requirements-file: ../../requirements.yml
provisioner:
  name: ansible
  env:
    # Required for molecule_docker plugin (upstream broken conditional in destroy.yml)
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
    # Dummy key: all.yml looks SSH_PUBLIC_KEY up and the base role requires it.
    # yamllint disable-line rule:line-length
    SSH_PUBLIC_KEY: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC3qctest123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123== test@molecule"
  playbooks:
    prepare: ../../../_shared/prepare.yml
  inventory:
    group_vars:
      base_managed:
        # timezone, admin_user and base_common_packages come from production
        # all.yml via the converge play's vars_files, which outranks this block.
        # SSH hardening is covered by the base role's own molecule scenario.
        base_skip_ssh_config: true
        base_skip_dns_config: true  # DNS resolver needs real network
        # No TAILSCALE_AUTH_KEY in the env, so the role installs and configures
        # the daemon but never runs `tailscale up` — which is what makes this
        # scenario runnable in a container.

      qol_enabled:
        # Trimmed to what the role actually reads: only OMZ-bundled plugins are
        # supported (the role templates the plugins=() array, it never clones
        # external ones), and the neovim plugin list drives Vundle.
        qol_omz_plugins:
          - git
          - docker
          - kubectl
          - ansible
          - golang
          - systemd
          - tmux
        qol_nvim_plugins:
          - tpope/vim-fugitive
          - sheerun/vim-polyglot
          - joshdick/onedark.vim

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
