---
# Base Infrastructure Integration Test - Verify
# Validates base + qol + tailscale integration

- name: Verify - Base Infrastructure Integration
  hosts: all
  become: true
  gather_facts: true

  tasks:
    # ============================================
    # Base Role Verification
    # ============================================
    - name: Check admin user exists
      ansible.builtin.user:
        name: eric
        state: present
      check_mode: true
      register: admin_user

    - name: Assert admin user configured
      ansible.builtin.assert:
        that:
          - admin_user is not changed
        fail_msg: "Admin user 'eric' not configured"
        success_msg: "Admin user exists"

    - name: Check admin user shell
      ansible.builtin.getent:
        database: passwd
        key: eric
      register: user_info

    - name: Assert admin user has zsh shell
      ansible.builtin.assert:
        that:
          - "'/bin/zsh' in user_info.ansible_facts.getent_passwd.eric[5]"
        fail_msg: "Admin user shell is not /bin/zsh"
        success_msg: "Admin user shell is /bin/zsh"

    - name: Check sudoers configuration
      ansible.builtin.stat:
        path: /etc/sudoers.d/eric
      register: sudoers_file

    - name: Assert sudoers file exists
      ansible.builtin.assert:
        that:
          - sudoers_file.stat.exists
          - sudoers_file.stat.mode == '0440'
        fail_msg: "Sudoers file missing or wrong permissions"
        success_msg: "Sudoers configured"

    - name: Check base packages installed
      ansible.builtin.package:
        name:
          - curl
          - wget
          - git
          - htop
          - tmux
          - neovim
        state: present
      check_mode: true
      register: base_pkgs
      failed_when: base_pkgs is changed

    - name: Assert base packages installed
      ansible.builtin.assert:
        that:
          - base_pkgs is not changed
        fail_msg: "Base packages not installed"
        success_msg: "Base packages installed"

    - name: Check timezone configuration
      ansible.builtin.stat:
        path: /etc/localtime
      register: timezone_link

    - name: Assert timezone is configured
      ansible.builtin.assert:
        that:
          - timezone_link.stat.exists
          - timezone_link.stat.islnk
          - "'America/Los_Angeles' in timezone_link.stat.lnk_source"
        fail_msg: "Timezone not configured correctly"
        success_msg: "Timezone configured"

    # ============================================
    # QoL Role Verification
    # ============================================
    - name: Check Oh My Zsh installed
      ansible.builtin.stat:
        path: /home/eric/.oh-my-zsh
      register: ohmyzsh_dir

    - name: Assert Oh My Zsh installed
      ansible.builtin.assert:
        that:
          - ohmyzsh_dir.stat.exists
          - ohmyzsh_dir.stat.isdir
        fail_msg: "Oh My Zsh not installed"
        success_msg: "Oh My Zsh installed"

    - name: Check .zshrc exists
      ansible.builtin.stat:
        path: /home/eric/.zshrc
      register: zshrc_file

    - name: Assert .zshrc configured
      ansible.builtin.assert:
        that:
          - zshrc_file.stat.exists
        fail_msg: ".zshrc not configured"
        success_msg: ".zshrc configured"

    - name: Check zsh plugins in .zshrc
      ansible.builtin.shell: sed -n '/^plugins=(/,/^)/p' /home/eric/.zshrc
      register: zsh_plugins_check
      changed_when: false
      failed_when: false

    - name: Assert zsh plugins configured
      ansible.builtin.assert:
        that:
          - "'git' in zsh_plugins_check.stdout"
          - "'docker' in zsh_plugins_check.stdout"
          - "'kubectl' in zsh_plugins_check.stdout"
        fail_msg: "Zsh plugins not configured correctly"
        success_msg: "Zsh plugins configured"

    - name: Check neovim installed
      ansible.builtin.command: which nvim
      register: neovim_check
      changed_when: false
      failed_when: false

    - name: Assert neovim installed
      ansible.builtin.assert:
        that:
          - neovim_check.rc == 0
        fail_msg: "Neovim not installed"
        success_msg: "Neovim installed"

    - name: Check Vundle installed
      ansible.builtin.stat:
        path: /home/eric/.vim/bundle/Vundle.vim
      register: vundle_dir

    - name: Assert Vundle installed
      ansible.builtin.assert:
        that:
          - vundle_dir.stat.exists
          - vundle_dir.stat.isdir
        fail_msg: "Vundle not installed"
        success_msg: "Vundle installed"

    - name: Check fzf installed
      ansible.builtin.command: which fzf
      register: fzf_check
      changed_when: false
      failed_when: false

    - name: Assert fzf installed
      ansible.builtin.assert:
        that:
          - fzf_check.rc == 0
        fail_msg: "fzf not installed"
        success_msg: "fzf installed"

    - name: Check ripgrep installed
      ansible.builtin.command: which rg
      register: ripgrep_check
      changed_when: false
      failed_when: false

    - name: Assert ripgrep installed
      ansible.builtin.assert:
        that:
          - ripgrep_check.rc == 0
        fail_msg: "ripgrep not installed"
        success_msg: "ripgrep installed"

    # ============================================
    # Tailscale Role Verification
    # ============================================
    - name: Check Tailscale apt source
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/tailscale.list
      register: tailscale_source

    - name: Assert Tailscale apt source exists
      ansible.builtin.assert:
        that:
          - tailscale_source.stat.exists
        fail_msg: "Tailscale apt source not configured"
        success_msg: "Tailscale apt source configured"

    - name: Check Tailscale package installed
      ansible.builtin.command: dpkg -l tailscale
      register: tailscale_pkg
      changed_when: false
      failed_when: false

    - name: Assert Tailscale package installed
      ansible.builtin.assert:
        that:
          - tailscale_pkg.rc == 0
          - "'ii  tailscale' in tailscale_pkg.stdout"
        fail_msg: "Tailscale package not installed"
        success_msg: "Tailscale package installed"

    - name: Check Tailscale daemon service
      ansible.builtin.systemd:
        name: tailscaled
        state: started
      check_mode: true
      register: tailscaled_service
      failed_when: false

    - name: Log Tailscale service status
      ansible.builtin.debug:
        msg: "Tailscaled service: {{ tailscaled_service.status.ActiveState }}"

    # ============================================
    # Integration Verification
    # ============================================
    - name: Test zsh is functional
      become_user: eric
      ansible.builtin.shell: zsh -c 'echo $SHELL'
      register: zsh_test
      changed_when: false

    - name: Assert zsh works
      ansible.builtin.assert:
        that:
          - "'/bin/zsh' in zsh_test.stdout"
        fail_msg: "Zsh not functional"
        success_msg: "Zsh functional"

    - name: Test Oh My Zsh theme loaded
      become_user: eric
      ansible.builtin.shell: zsh -c 'echo $ZSH_THEME'
      register: theme_test
      changed_when: false
      failed_when: false

    - name: Log Oh My Zsh theme
      ansible.builtin.debug:
        msg: "Oh My Zsh theme: {{ theme_test.stdout }}"

    # ============================================
    # Final Summary
    # ============================================
    - name: Integration test summary
      ansible.builtin.debug:
        msg: |
          Base Infrastructure Integration Test Results:
          =============================================
          Host: {{ inventory_hostname }}

          Base Role:
            - Admin User: {{ 'OK' if admin_user is not changed else 'FAILED' }}
            - Shell: {{ user_info.ansible_facts.getent_passwd.eric[5] }}
            - Sudoers: {{ 'OK' if sudoers_file.stat.exists else 'FAILED' }}
            - Base Packages: {{ 'OK' if base_pkgs is not changed else 'FAILED' }}
            - Timezone: {{ timezone_link.stat.lnk_source | default('UNKNOWN') }}

          QoL Role:
            - Oh My Zsh: {{ 'OK' if ohmyzsh_dir.stat.exists else 'FAILED' }}
            - Zsh Plugins: {{ 'OK' if 'git' in zsh_plugins_check.stdout else 'FAILED' }}
            - Neovim: {{ 'OK' if neovim_check.rc == 0 else 'FAILED' }}
            - Vundle: {{ 'OK' if vundle_dir.stat.exists else 'FAILED' }}
            - fzf: {{ 'OK' if fzf_check.rc == 0 else 'FAILED' }}
            - ripgrep: {{ 'OK' if ripgrep_check.rc == 0 else 'FAILED' }}

          Tailscale Role:
            - APT Source: {{ 'OK' if tailscale_source.stat.exists else 'FAILED' }}
            - Package: {{ 'OK' if tailscale_pkg.rc == 0 else 'FAILED' }}
            - Daemon: {{ tailscaled_service.status.ActiveState | default('UNKNOWN') }}
