---
# Mail Stack Integration Test
# Tests: smtp_relay (relay server) + postfix_null_client (client) communication

driver:
  name: docker

platforms:
  - name: smtp-relay
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
    networks:
      - name: mail-stack-net
    groups:
      - mail
      - relay_servers

  - name: mail-client-01
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
    networks:
      - name: mail-stack-net
    groups:
      - mail
      - mail_clients

  - name: mail-client-02
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
    networks:
      - name: mail-stack-net
    groups:
      - mail
      - mail_clients

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../../../roles
    # Required for molecule_docker plugin (upstream broken conditional in destroy.yml)
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
    # Provide dummy SSH key for testing (base role expects this via all.yml lookup)
    # yamllint disable-line rule:line-length
    SSH_PUBLIC_KEY: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC3qctest123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123== test@molecule"
    SMTP_RELAY_USER: relay_user
    SMTP_RELAY_PASSWORD: test_relay_password
    # admin_email in group_vars/all.yml hard-requires this env var
    # (undef() guard); the aliases template renders it on every host.
    ROOT_EMAIL_ALIAS: test-root@molecule.test
  inventory:
    group_vars:
      relay_servers:
        # SMTP Relay configuration (smtp_relay role)
        admin_user: root
        admin_email: admin@example.com
        smtp_gmail_user: test@example.com
        smtp_gmail_password: test_gmail_app_password
        smtp_relay_config:
          myhostname: smtp-relay.test.local
          myorigin: test.local
          inet_interfaces: all
          inet_protocols: ipv4
          mynetworks: "127.0.0.0/8, 172.16.0.0/12"
          relayhost: "[smtp.gmail.com]:587"
          smtpd_relay_restrictions: "permit_mynetworks, permit_sasl_authenticated, reject_unauth_destination"
          smtpd_tls_cert_file: "/etc/letsencrypt/live/smtp-relay/fullchain.pem"
          smtpd_tls_key_file: "/etc/letsencrypt/live/smtp-relay/privkey.pem"
          smtpd_tls_security_level: "may"
          smtpd_tls_loglevel: 1
          smtpd_tls_received_header: "yes"
          smtpd_tls_protocols: "!SSLv2, !SSLv3, !TLSv1, !TLSv1.1"
          smtpd_tls_mandatory_protocols: "!SSLv2, !SSLv3, !TLSv1, !TLSv1.1"
          smtp_tls_security_level: "encrypt"
          smtp_tls_CAfile: "/etc/ssl/certs/ca-certificates.crt"
          smtp_tls_protocols: "!SSLv2, !SSLv3, !TLSv1, !TLSv1.1"
          smtp_sasl_auth_enable: "yes"
          smtp_sasl_password_maps: "hash:/etc/postfix/sasl_passwd"
          smtp_sasl_security_options: "noanonymous"
          smtp_sasl_tls_security_options: "noanonymous"
          smtpd_sasl_type: "cyrus"
          smtpd_sasl_path: "smtpd"
          smtpd_sasl_auth_enable: "yes"
          smtpd_sasl_security_options: "noanonymous"
          smtpd_sasl_local_domain: "smtp-relay.test.local"
          broken_sasl_auth_clients: "yes"

      mail_clients:
        # Null client configuration (postfix_null_client role)
        admin_email: admin@example.com
        internal_domain: test.local
        smtp_relay_host: smtp-relay
        smtp_relay_port: 25
        postfix_sasl_user: relay_user
        postfix_sasl_password: test_relay_password
        postfix_config:
          myhostname: "{{ inventory_hostname }}.test.local"
          myorigin: "/etc/mailname"
          mydestination: "{{ inventory_hostname }}.test.local, test.local, localhost.localdomain, localhost"
          relayhost: "[smtp-relay]:25"
          mynetworks: "127.0.0.0/8"
          inet_interfaces: "loopback-only"
          smtp_tls_security_level: "may"
          smtp_tls_CAfile: "/etc/ssl/certs/ca-certificates.crt"
          smtp_sasl_auth_enable: "yes"
          smtp_sasl_security_options: "noanonymous"
          smtp_sasl_password_maps: "hash:/etc/postfix/sasl_passwd"
        postfix_virtual_aliases:
          - from: "admin@test.local"
            to: "admin@example.com"
          - from: "root@test.local"
            to: "admin@example.com"
        mail_aliases:
          postmaster: root
          nobody: root
          hostmaster: root
          webmaster: root
          root: "admin@example.com"

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
