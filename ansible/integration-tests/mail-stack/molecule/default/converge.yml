---
# Mail Stack Integration Test - Converge
# Deploys smtp_relay on relay server and postfix_null_client on clients

- name: Converge - Mail Stack
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - ../../../../inventories/prod/group_vars/all.yml


  pre_tasks:
    - name: Container warm-up (apt locks, dpkg state, cache, systemd)
      ansible.builtin.include_tasks: ../../../../molecule/tasks/container-warmup.yml

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - systemd
          - mailutils  # For testing mail
          - netcat-openbsd  # For port testing
          - openssl  # Mint the relay's self-signed STARTTLS cert (submission/587)
        state: present

    # The null clients relay over the submission service (587), whose smtpd
    # mandates STARTTLS before it will accept AUTH. Port 25 is chrooted and
    # cannot reach /etc/sasldb2 for the auxprop SASL lookup, so the smtp_relay
    # role ships AUTH off there and does inbound SASL only on 587 (behind TLS) —
    # which is also the port production null clients use. The STARTTLS handshake
    # therefore needs a *loadable* certificate (the previous placeholder PEMs
    # were truncated and unusable), so mint a real self-signed one. The clients
    # do not verify it (smtp_tls_security_level in the inventory), so self-signed
    # is sufficient to protect the SASL credential in transit.
    - name: Create TLS certificate directory
      ansible.builtin.file:
        path: /etc/letsencrypt/live/smtp-relay
        state: directory
        mode: '0755'
      when: "'relay_servers' in group_names"

    - name: Generate a self-signed TLS cert for the relay STARTTLS endpoint
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -newkey rsa:2048 -nodes
          -keyout /etc/letsencrypt/live/smtp-relay/privkey.pem
          -out /etc/letsencrypt/live/smtp-relay/fullchain.pem
          -days 3650 -subj "/CN=smtp-relay.test.local"
          -addext "subjectAltName=DNS:smtp-relay,DNS:smtp-relay.test.local"
        creates: /etc/letsencrypt/live/smtp-relay/fullchain.pem
      when: "'relay_servers' in group_names"

    - name: Restrict the relay TLS private key
      ansible.builtin.file:
        path: /etc/letsencrypt/live/smtp-relay/privkey.pem
        mode: '0600'
      when: "'relay_servers' in group_names"

  tasks:
    # Deploy SMTP relay server
    # Vars come from molecule.yml inventory and all.yml vars_files
    - name: Apply smtp_relay role
      ansible.builtin.include_role:
        name: weisssrv.infra.smtp_relay
      when: "'relay_servers' in group_names"

    # Deploy postfix null clients
    # Vars come from molecule.yml inventory and all.yml vars_files
    - name: Apply postfix_null_client role
      ansible.builtin.include_role:
        name: weisssrv.infra.postfix_null_client
      when: "'mail_clients' in group_names"
