---
# Custom destroy playbook for Ansible 2.20+ compatibility
# Fixes: "Conditional result was derived from value of type 'str'" error
- name: Destroy
  hosts: localhost
  connection: local
  gather_facts: false
  no_log: "{{ molecule_no_log }}"

  tasks:
    - name: Set async_dir for HOME env
      ansible.builtin.set_fact:
        ansible_async_dir: "{{ lookup('env', 'HOME') }}/.ansible_async/"
      when: lookup('env', 'HOME') | length > 0

    - name: Destroy molecule instance(s)
      community.docker.docker_container:
        name: "{{ item.name }}"
        docker_host: "{{ item.docker_host | default(lookup('env', 'DOCKER_HOST') or 'unix://var/run/docker.sock') }}"
        state: absent
        force_kill: "{{ item.force_kill | default(true) }}"
        keep_volumes: "{{ item.keep_volumes | default(true) }}"
        container_default_behavior: "{{ item.container_default_behavior | default('compatibility') }}"
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"
      register: docker_destroy_result
      async: 7200
      poll: 0

    - name: Wait for instance(s) deletion to complete
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ docker_destroy_result.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      register: docker_jobs
      until: docker_jobs.finished
      retries: 300
      delay: 1

    - name: Delete docker networks(s)
      community.docker.docker_network:
        name: "{{ item }}"
        docker_host: "{{ lookup('env', 'DOCKER_HOST') or 'unix://var/run/docker.sock' }}"
        state: absent
      loop:
        - storage-stack-net
      loop_control:
        label: "{{ item }}"
      failed_when: false  # Network may be in use by other containers
