---
# Storage Stack Integration Test
# Tests: nas_storage role configuration (NFS exports + Samba shares)
#
# IMPORTANT: Docker container limitations
# - NFS server: Configuration tested, but service won't fully work (kernel modules)
# - Samba server: Full testing works (user-space daemon)
# - NFS client mounts: NOT possible in Docker (requires kernel NFS support)
# - CIFS/SMB mounts: NOT possible without CAP_SYS_ADMIN and kernel modules
#
# This test validates:
# 1. Configuration files are correctly generated
# 2. Packages are installed
# 3. Samba service runs and shares are accessible
# 4. Idempotence of the role

driver:
  name: docker

platforms:
  # NAS Server - runs nas_storage role
  - name: nas-server
    # The systemd-container block is identical for both platforms, so it is
    # anchored once and merged into the client; name, groups and capabilities
    # stay per-entry (SYS_ADMIN is the NAS server's alone). Anchors are
    # per-file — YAML has no cross-file include — so each scenario carries its
    # own copy of the shape.
    <<: &systemd_platform
      image: "${MOLECULE_TEST_IMAGE:-registry.git.ericsweiss.com/eric/weisssrv-lib/molecule-test:v0.13.1}"
      pre_build_image: true
      privileged: true
      cgroupns_mode: host
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup:rw
      command: /lib/systemd/systemd
      stop_signal: SIGRTMIN+3
      tty: true
      tmpfs:
        - /run
        - /tmp
      networks:
        - name: storage-stack-net
    capabilities:
      - SYS_ADMIN
    groups:
      - storage
      - nas_servers

  # SMB Client - tests Samba connectivity (listing shares)
  # NFS client removed: mounting NFS shares doesn't work in Docker containers
  - name: smb-client-01
    <<: *systemd_platform
    groups:
      - storage
      - smb_clients

dependency:
  name: galaxy
  options:
    # The single source of truth for the weisssrv.infra pin these
    # scenarios exercise. Resolved by ansible-galaxy in molecule's CWD,
    # which is the scenario's stack dir (ansible/integration-tests/<stack>).
    requirements-file: ../../requirements.yml
provisioner:
  name: ansible
  env:
    # Required for molecule_docker plugin (upstream broken conditional in destroy.yml)
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
    # Provide dummy SSH key for testing (base role expects this via all.yml lookup)
    # yamllint disable-line rule:line-length
    SSH_PUBLIC_KEY: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC3qctest123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123TEST123== test@molecule"
    # Samba user password: the nas_storage role's nas_storage_samba_password
    # default reads this env var and sets the `nas` smbpasswd (anonymous access
    # is hardened off, so verify authenticates with it).
    SAMBA_NAS_PASSWORD: molecule-test-samba-pw
  config_options:
    defaults:
      callbacks_enabled: profile_tasks, timer
      stdout_callback: ansible.builtin.default
      result_format: yaml
  # Custom playbooks for Ansible 2.20+ compatibility
  playbooks:
    create: create.yml
    destroy: destroy.yml
    prepare: ../../../_shared/prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    group_vars:
      nas_servers:
        # Base role configuration (applied by converge). SSH hardening is
        # exercised by the base role's own molecule scenario; skip it here to
        # keep this integration test focused on the NFS/Samba storage path.
        base_skip_ssh_config: true
        base_skip_dns_config: true  # DNS resolver needs real network

        # NAS storage configuration - skip operations that don't work in containers
        nas_storage_skip_zfs_operations: true  # ZFS requires kernel modules (also bypasses the bind-source mountpoint guard)
        nas_storage_skip_nfs_reload: true      # exportfs -ra fails without NFS kernel support
        nas_storage_skip_smartd_service: true  # No block devices in container

        # NFS exports configuration (templates will be generated)
        nas_storage_exports:
          # 1777: the SMB write test proves the share layer is writable; the
          # fixture dirs stay sticky-world-writable so no unix user plumbing
          # is needed in the container.
          - path: /tank/media
            mode: "1777"
            clients:
              - spec: "172.16.0.0/12"
                options: "rw,sync,no_subtree_check,no_root_squash"
          - path: /tank/share
            mode: "1777"
            clients:
              - spec: "172.16.0.0/12"
                options: "rw,sync,no_subtree_check,no_root_squash"
          # Prod-shaped export mirroring host_vars/pve-nas-01.yml
          # (/export/appdata): bind_source under /mnt/tank (exercises the
          # ZFS-anchored fstab bind path), export-level xprtsec=tls, fsid, and
          # all_squash uid/gid mapping. verify.yml asserts the rendered
          # /etc/exports line (server-side render only; no TLS mount needed).
          - path: /export/appdata
            bind_source: /mnt/tank/appdata
            owner: 1000
            group: 2000
            mode: "02775"
            xprtsec: "tls"
            clients:
              - spec: "172.16.0.0/12"
                options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=11"

        # Samba shares configuration (Samba DOES work in containers)
        nas_storage_samba_shares:
          - name: media
            path: /tank/media
            comment: "Media Library"
            read_only: false
            browseable: true
            guest_ok: true
            create_mask: "0664"
            directory_mask: "0775"
          - name: share
            path: /tank/share
            comment: "Shared Files"
            read_only: false
            browseable: true
            guest_ok: true
            create_mask: "0664"
            directory_mask: "0775"

        # Mock ZFS mount points (created in converge)
        mock_zfs_mounts:
          - /tank/media
          - /tank/share

        # SMART monitoring (no real devices in container; the smartd_*_disks
        # lists the role consumes default to empty)
        nas_storage_smartd_enabled: true

      smb_clients:
        # Samba client configuration
        smb_server: nas-server
        smb_test_shares:
          - media
          - share

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
