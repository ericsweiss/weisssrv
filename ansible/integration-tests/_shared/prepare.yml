---
# Shared prepare playbook for the integration-test scenarios. The systemd/apt/
# temp-dir setup itself lives once, in ansible/molecule/prepare-common.yml.
# Wired via provisioner.playbooks.prepare (path relative to each scenario dir);
# a scenario with extra prep (dns-stack) imports this and appends its own play.
- name: Prepare the integration-test containers
  ansible.builtin.import_playbook: ../../molecule/prepare-common.yml
