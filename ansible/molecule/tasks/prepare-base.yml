---
# Shared Molecule prepare header: wait for systemd, then ensure the ansible
# temp dir exists. Imported at the top of each scenario's prepare.yml (and of
# prepare-common.yml) via
#   ansible.builtin.import_tasks: ../../../../molecule/tasks/prepare-base.yml
# mirroring the container-warmup.yml pattern (both role and integration-test
# scenario dirs sit 4 levels under ansible/). Scenarios whose role installs apt
# packages import prepare-apt-disable.yml right after this.
- name: Wait for systemd to be ready
  ansible.builtin.raw: |
    for i in $(seq 1 30); do
      if systemctl is-system-running 2>/dev/null | grep -qE '(running|degraded)'; then
        exit 0
      fi
      sleep 1
    done
    systemctl status >/dev/null 2>&1 && exit 0
    exit 1
  changed_when: false
  retries: 3
  delay: 2
  register: systemd_ready
  until: systemd_ready.rc == 0

- name: Ensure ansible temp directory exists
  ansible.builtin.raw: |
    mkdir -p /root/.ansible/tmp
    chmod 700 /root/.ansible/tmp
  changed_when: false
