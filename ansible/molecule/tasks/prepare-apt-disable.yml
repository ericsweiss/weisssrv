---
# Shared Molecule prepare step: stop + disable the apt background timers so
# unattended-upgrades can't race a role's own apt tasks on the dpkg lock.
# Imported after prepare-base.yml by scenarios whose role installs apt packages,
# via
#   ansible.builtin.import_tasks: ../../../../molecule/tasks/prepare-apt-disable.yml
# Render-only scenarios that never touch apt (home_assistant, resolv_conf)
# deliberately skip it.
- name: Disable apt background services
  ansible.builtin.raw: |
    systemctl stop apt-daily.timer 2>/dev/null || true
    systemctl stop apt-daily-upgrade.timer 2>/dev/null || true
    systemctl stop unattended-upgrades.service 2>/dev/null || true
    systemctl disable apt-daily.timer 2>/dev/null || true
    systemctl disable apt-daily-upgrade.timer 2>/dev/null || true
    exit 0
  changed_when: false
