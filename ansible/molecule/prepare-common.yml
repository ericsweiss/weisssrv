---
# Shared Molecule prepare playbook: initialize the container for reliable
# testing. Imported by integration-tests/_shared/prepare.yml, which every
# integration-test scenario wires as provisioner.playbooks.prepare.
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: tasks/prepare-base.yml

    - name: Disable apt background services
      ansible.builtin.import_tasks: tasks/prepare-apt-disable.yml
