---
# Shared Molecule prepare playbook: initialize the container for reliable
# testing. Wired as the default `provisioner.playbooks.prepare` in
# ansible/molecule/base.yml, so every default scenario inherits it and only
# roles needing extra prep ship their own molecule/default/prepare.yml (and
# re-point playbooks.prepare at it in their molecule.yml).
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: tasks/prepare-base.yml

    - name: Disable apt background services
      ansible.builtin.import_tasks: tasks/prepare-apt-disable.yml
