---
# Shared Molecule base config for the per-role default scenarios.
#
# Applied via `molecule -c <repo>/ansible/molecule/base.yml test` — wired into
# ansible/test-all-roles.sh and the .gitlab-ci.yml molecule-tests matrix. Molecule
# deep-merges this with each role's molecule/default/molecule.yml, so a role file
# only needs its per-role bits: `platforms` (list-replace, so the whole platform
# block stays per-role) and `provisioner.inventory.group_vars`. Roles that need a
# different `remote_tmp` or a scenario that skips `idempotence` (the proxmox_*
# roles) add just those keys back and they override/merge over this base.
#
# NOTE: integration-tests (ansible/integration-tests/*) do NOT use this base —
# they have multi-platform scenarios and run via their own molecule invocation.
dependency:
  name: galaxy
  options:
    # Both galaxy sub-dependencies (ansible-galaxy role install + collection
    # install) read the repo's single source of truth, ansible/requirements.yml,
    # instead of a per-scenario copy (which drifted into inconsistent, upper-
    # bound-less pins). role-file/requirements-file resolve relative to
    # molecule's CWD, which the CI job and test-all-roles.sh both set to the role
    # dir (ansible/roles/<role>), so ../../ reaches ansible/. NB: this is a
    # different depth than playbooks.prepare's ../../../../molecule/ below —
    # molecule resolves playbook paths relative to the scenario dir, but hands
    # role-file/requirements-file to ansible-galaxy which runs in the CWD.
    role-file: ../../requirements.yml
    requirements-file: ../../requirements.yml
driver:
  name: docker
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
    # Required for molecule_docker plugin (upstream broken conditional in destroy.yml)
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
  config_options:
    defaults:
      callbacks_enabled: profile_tasks, timer
      stdout_callback: ansible.builtin.default
      result_format: yaml
  playbooks:
    # Shared prepare for every default scenario. Roles that need extra prep ship
    # their own molecule/default/prepare.yml AND re-point playbooks.prepare at it
    # (deep-merge: an unset prepare in a role's molecule.yml inherits this one).
    prepare: ../../../../molecule/prepare-common.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
