---
# Central SMTP relay that forwards to Gmail. Postfix runs as root (normal for
# mail servers); SSH access is the usual 'eric' user.

proxmox_resource_pool: infra-core

# Boot order lives here, not group_vars/mail.yml: smtp-relay is the only mail host.
proxmox_lxc_onboot: true
proxmox_lxc_startup_order: 20
proxmox_lxc_startup_delay: 10

# Credentials for the upstream smarthost (Gmail), from 1Password at runtime via
# `op run`. No defaults — deployment MUST fail if a secret is missing rather
# than silently deploying an invalid credential that is hard to diagnose.
smtp_relay_upstream_user: "{{ lookup('ansible.builtin.env', 'SMTP_GMAIL_USER') or undef(hint='SMTP_GMAIL_USER env var must be set (run via op run)') }}"
smtp_relay_upstream_password: >-
  {{ lookup('ansible.builtin.env', 'SMTP_GMAIL_PASSWORD')
  or undef(hint='SMTP_GMAIL_PASSWORD env var must be set (run via op run)') }}
