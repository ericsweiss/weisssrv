---
# smtp-relay specific configuration
# Central SMTP relay that forwards to Gmail
#
# Note: This LXC uses 'eric' user for SSH access like all other containers.
# Postfix itself runs as root (which is normal/expected for mail servers).

# Proxmox resource pool for organization
proxmox_resource_pool: infra-core

# Container startup configuration (smtp-relay is the only mail host, so boot
# order lives here rather than group_vars/mail.yml)
# Boot order strategy: DNS (10) -> SMTP (20) -> k3s servers (30) -> k3s agents (40) -> apps (50)
proxmox_autostart_enabled: true
proxmox_startup_order: 20
proxmox_startup_delay: 10

# SMTP relay variables (from 1Password at runtime via `op run`)
# No defaults - deployment MUST fail if secrets are missing rather than
# silently deploying invalid credentials that are hard to diagnose
smtp_gmail_user: "{{ lookup('ansible.builtin.env', 'SMTP_GMAIL_USER') or undef(hint='SMTP_GMAIL_USER env var must be set (run via op run)') }}"
smtp_gmail_password: "{{ lookup('ansible.builtin.env', 'SMTP_GMAIL_PASSWORD') or undef(hint='SMTP_GMAIL_PASSWORD env var must be set (run via op run)') }}"
