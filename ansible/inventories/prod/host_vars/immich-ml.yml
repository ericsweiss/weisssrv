---
# Immich machine-learning LXC container configuration (OpenVINO, Intel Arc B580)
# Running on pve-nas-01 (10.0.10.102)

proxmox_host: pve-nas-01

proxmox_resource_pool: apps-private

proxmox_lxc_cores: 4
proxmox_lxc_memory: 8192
proxmox_lxc_swap: 2048
# 64G rootfs: the OpenVINO model cache is multi-GB and lives in the rootfs
# (named docker volume) — it is re-downloadable cache, not state.
proxmox_lxc_disk_size: 64G
# ssd (encrypted): the role only places NEW containers — the live rootfs was
# created on local-lvm and is migrated once with
# `pct move-volume 158 rootfs ssd --delete` (stopped, at a deploy window).
proxmox_lxc_storage: ssd

# Docker runs inside the container (compose stack). keyctl is required
# alongside nesting for Docker in an unprivileged LXC.
proxmox_lxc_nesting: true
proxmox_lxc_keyctl: true

#
# onboot=0: the rootfs lives on the ENCRYPTED ssd pool, so pct start fails
# until ssd unlocks. Like plex, this CT is started by
# pve-start-encrypted-guests.service AFTER zfs-mount-encrypted.service unlocks
# ssd — NOT by pve-guests at boot (zfs_encryption_guest_ctids in
# host_vars/pve-nas-01.yml; docs/32-zfs-encryption.md).
# Order 57 places it after the other apps (nextcloud 55, immich 56).
proxmox_lxc_onboot: false
proxmox_lxc_startup_order: 57
proxmox_lxc_startup_delay: 10

# NO proxmox_lxc_bind_mounts: the model cache lives in the LXC rootfs via a named
# docker volume — there is no host state to bind in. (proxmox_lxc applies the
# GPU lxc.idmap whenever proxmox_lxc_gpu_passthrough is set, bind mounts or not.)

# GPU passthrough for Intel Arc B580 OpenVINO ML inference.
# /dev/dri is SHARED with the plex LXC (vmid 152): LXC passthrough bind-mounts
# the host device nodes non-exclusively, so the kernel (xe driver) arbitrates
# between consumers — Plex transcode and ML inference coexist on the one card.
proxmox_lxc_gpu_passthrough: true
