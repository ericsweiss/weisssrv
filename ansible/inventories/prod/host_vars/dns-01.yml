---
# Primary DNS server; also runs acme.sh certificate management.

proxmox_resource_pool: infra-core

# Both DNS servers use order 10 with identical delays (no interdependency)
proxmox_lxc_onboot: true
proxmox_lxc_startup_order: 10
proxmox_lxc_startup_delay: 10

# This host runs acme.sh for certificate generation; the role issues
# acme_certs_domain + its wildcard.
acme_certs_enabled: true
acme_certs_domain: "{{ internal_domain }}"
acme_certs_email: "{{ admin_email }}"
# Pin the distribution key to this resolver in every target's authorized_keys
# (`from="..."`). Without it the root-equivalent key is usable from any source.
acme_certs_key_from: "{{ ansible_host }}"
# The distribution key belongs to the admin user (not root), so it lives in
# /home/eric/.ssh and each target's forced-command entry is on that user.
acme_certs_ssh_user: "{{ admin_user }}"
# The wildcard PEMs land in AdGuard's cert dir, and AdGuardHome is restarted
# locally after each renewal.
acme_certs_local_cert_dir: /opt/AdGuardHome/certs
acme_certs_local_cert_group: adguard
acme_certs_local_reload_command: "systemctl restart AdGuardHome"

# This resolver is the primary: it owns the rewrite/filtering API pass and is
# the sync origin.
adguard_home_is_primary: true
adguard_sync_enabled: true
adguard_sync_schedule: "*:0/5"  # Every 5 minutes
