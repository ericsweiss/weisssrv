---
# dns-01 specific configuration
# Primary DNS server with ACME certificate management

# Proxmox resource pool for organization
proxmox_resource_pool: infra-core

# Container startup configuration
# Boot order strategy: DNS (10) -> SMTP (20) -> k3s servers (30) -> k3s agents (40) -> apps (50)
# Both DNS servers use order 10 with identical delays (no interdependency)
proxmox_autostart_enabled: true
proxmox_startup_order: 10
proxmox_startup_delay: 10

# This host runs acme.sh for certificate generation
# (the acme_certs role gates on inventory_hostname == 'dns-01')
# The issued names are not configurable: the role issues
# "{{ internal_domain }}" + "*.{{ internal_domain }}" directly.
acme_email: "{{ admin_email }}"

# Certificate distribution targets.
#
# After every acme.sh renewal, /usr/local/sbin/homelab-cert-reload.sh
# pushes fullchain.pem + privkey.pem to each target via SSH (using
# /home/eric/.ssh/id_ed25519_certs), chowns/chmods, and runs the
# reload command. Adding a target here is enough for the cert to
# auto-rotate on every renewal.
#
# Per-target keys:
#   host             — inventory hostname (used for the IP env var name)
#   ip               — IP or hostname the SSH connection targets
#   host_key         — REQUIRED. Pinned SSH host key, format
#                      `<keytype> <base64>` (no leading IP). Captured
#                      once via `task certs:show-host-keys` and pasted
#                      here. Used by the role to deploy a strict
#                      known_hosts entry on dns-01; the cert-reload
#                      script then runs with StrictHostKeyChecking=yes
#                      so a fingerprint mismatch (host rebuild without
#                      inventory update, or MITM) fails the cert push
#                      loudly. Rotate by re-running the capture task
#                      after the rebuild + pasting the new value.
#   cert_dir         — directory on the target where fullchain.pem +
#                      privkey.pem are placed
#   owner / group    — ownership applied after the move
#   cert_mode        — chmod for fullchain.pem
#   key_mode         — chmod for privkey.pem
#   restart_service  — basic case: expanded to `[sudo] systemctl restart <svc>`
#                      (sudo prefix omitted automatically when
#                      ssh_no_sudo: true)
#   restart_command  — overrides restart_service when the backend
#                      needs something other than `systemctl restart`
#                      (e.g. gitlab-ctl hup, plex PFX regen, a
#                      multi-command conditional, etc.). MUST include
#                      its own `sudo` for any subcommand that needs
#                      root — the cert-reload script does NOT prepend
#                      sudo to restart_command, because compound shell
#                      constructs (`if … then … fi`) reject `sudo if`.
#   ssh_port         — defaults to 22 (HAOS uses 22222)
#   ssh_user         — defaults to eric (HAOS SSH add-on logs in as root)
#   ssh_no_sudo      — true on hosts that don't have sudo available
#                      (HAOS root-as-default; doesn't matter on
#                      sudo-bearing systems)
cert_distribution_targets:
  - host: dns-02
    ip: 192.168.0.160
    host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEWbN0fb8eOTlPeHMQ/sZ+vkEgtSPAnZ7OiZjYsAcAyu"
    cert_dir: /opt/AdGuardHome/certs
    owner: root
    group: adguard
    cert_mode: "0644"
    key_mode: "0640"
    restart_service: AdGuardHome
  - host: smtp-relay
    ip: 192.168.0.151
    host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK7o0NXu/ZssOvC0quOLUWBVm9q4l15hiHJ4LoVfHG98"
    cert_dir: /etc/postfix/tls
    owner: root
    group: root
    cert_mode: "0644"
    key_mode: "0600"
    restart_service: postfix
  # GitLab: cert lives in /etc/gitlab/ssl, referenced by gitlab.rb.
  # `gitlab-ctl hup nginx` reloads nginx without a full reconfigure.
  - host: gitlab
    ip: 192.168.0.153
    host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEVffoT/Az9ZPPECl054HTf4HxzlKL6sTcs6OVe3bQTi"
    cert_dir: /etc/gitlab/ssl
    owner: root
    group: root
    cert_mode: "0644"
    key_mode: "0600"
    restart_command: "sudo gitlab-ctl hup nginx"
  # Nextcloud (VM 156): the host nginx serves the wildcard cert from
  # /etc/ssl/nextcloud, reloaded with `systemctl reload nginx`. Pushing the real
  # *.esweiss.com cert here replaces the self-signed bootstrap cert the nextcloud
  # role seeds — which is what lets Traefik's vm-tls-wildcard backend validation
  # succeed for cloud.esweiss.com. host_key captured post-provision via
  # `task certs:show-host-keys`. See docs/35-nextcloud.md.
  - host: nextcloud
    ip: 192.168.0.156
    host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFSwM0yVCXOQ6t0PO2o54hGwdYvXcy/eZ/+rU4gtG11P"
    cert_dir: /etc/ssl/nextcloud
    owner: root
    group: root
    cert_mode: "0644"
    key_mode: "0600"
    restart_command: "sudo systemctl reload nginx"
  # Immich VM (.157): host nginx serves the wildcard cert on 443 and reloads on
  # each renewal. COMMENTED OUT until the VM exists — the host_key can only be
  # captured AFTER first provision. Post-provision (one-time): run
  #   task certs:show-host-keys   (or: ssh-keyscan -t ed25519 192.168.0.157)
  # paste the real ed25519 key below, uncomment this block, then `task dns:deploy`
  # to push the wildcard cert to the VM. Do NOT invent a key — a wrong one fails
  # the SSH host-key pin. See docs/36-immich.md (Deploy).
  # - host: immich
  #   ip: 192.168.0.157
  #   host_key: "ssh-ed25519 REPLACE_ME_WITH_REAL_IMMICH_HOST_KEY"
  #   cert_dir: /etc/nginx/ssl
  #   owner: root
  #   group: root
  #   cert_mode: "0644"
  #   key_mode: "0600"
  #   restart_command: "sudo systemctl reload nginx"
  # NFS+TLS endpoint: ONLY the NFS server (pve-nas-01) gets the wildcard cert +
  # key here. The six k3s agents are pure NFSv4 xprtsec=tls CLIENTS — they
  # validate pve-nas-01's server cert against the system CA truststore
  # (/etc/ssl/certs/ca-certificates.crt, which already trusts the Let's Encrypt
  # chain acme_certs issues from) and present NO client cert, so tlshd
  # references neither fullchain.pem nor privkey.pem on an agent
  # (nfs_tls_client_cert stays false; mTLS is not in use). The wildcard
  # *.esweiss.com key can impersonate every internal service, so for least
  # privilege the agents are deliberately NOT distribution targets — and the
  # nfs_tls role scrubs any stale /etc/ssl/private/{fullchain,privkey}.pem a
  # prior rollout left on a client. k3s SERVER nodes (.222/.223/.227) never
  # mount NFS, so they were never targets. HAOS (.154) keeps a plaintext NFS
  # media mount (its `home` entry below is for the HTTPS frontend, not tlshd).
  # NOTE: if an export is ever migrated to xprtsec=mtls and an agent gets
  # nfs_tls_client_cert=true, that agent must be re-added as a target here.
  #
  # restart_command reloads tlshd only when the unit exists and is enabled;
  # before nfs_tls is rolled out it skips cleanly with a stderr line (no blanket
  # `|| true`). The former &tlshd_reload anchor is gone now that pve-nas-01 is
  # the sole NFS-TLS endpoint.
  - host: pve-nas-01
    ip: 192.168.0.102
    host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGxyeQZee3W3aQ0EpeY5sLONaZB1Zy4eKoMAeSLnbRCr"
    cert_dir: /etc/ssl/private
    owner: root
    group: root
    cert_mode: "0644"
    key_mode: "0600"
    restart_command: >-
      if sudo systemctl list-unit-files tlshd.service >/dev/null 2>&1
      && sudo systemctl is-enabled --quiet tlshd.service; then
      sudo systemctl restart tlshd;
      else
      echo 'tlshd not yet enabled; skipping reload' >&2;
      fi
  # Plex: the plex role's cert-reload hook builds a PKCS#12 bundle from
  # the renewed PEM pair, atomically swaps it into place, and restarts
  # plexmediaserver. See ansible/roles/plex/templates/plex-cert-reload.sh.j2.
  - host: plex
    ip: 192.168.0.152
    host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO41P4DvFdeHkZW7Np3w71NH7WV2gGr2BQISIyjyeozB"
    cert_dir: /etc/ssl/plex
    # root-owned with plex group read — see plex role configure.yml.
    owner: root
    group: plex
    cert_mode: "0644"
    key_mode: "0640"
    restart_command: "sudo /usr/local/sbin/plex-cert-reload.sh"
  # HAOS: SSH add-on listens on port 22222 as root; no sudo. The
  # /ssl/ directory is the convention HAOS expects, referenced by
  # configuration.yaml's http: ssl_certificate / ssl_key. `ha core
  # restart` re-reads config and the new cert on the next bind.
  - host: home
    ip: 192.168.0.154
    ssh_port: 22222
    ssh_user: root
    ssh_no_sudo: true
    # Shared HAOS key — single source of truth in group_vars/all.yml,
    # also consumed by home_assistant_host_key in host_vars/home.yml.
    host_key: "{{ haos_ssh_host_key }}"
    cert_dir: /ssl
    owner: root
    group: root
    cert_mode: "0644"
    key_mode: "0600"
    restart_command: "ha core restart"

# Local certificate store on dns-01 (AdGuard Home's cert dir; the acme_certs
# role installs the issued PEMs here and the reload script reads them from here).
local_cert_dir: /opt/AdGuardHome/certs

# AdGuard Home Sync runs from dns-01
# (the adguard_sync role gates on inventory_hostname == 'dns-01')
adguardhome_sync_schedule: "*:0/5"  # Every 5 minutes
