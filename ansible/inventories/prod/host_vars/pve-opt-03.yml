---
# e1000e (nic0, 00:19.0): a wedged TX unit is not driver-recoverable and the link
# stays up, so the bond never fails over and the host drops off the Proxmox
# cluster until it is power-cycled. tso/gso/gro off is the cure — docs/34.
# nic_tuning applies it live and persists it via an ethtool ifup drop-in.
nic_tuning_overrides:
  - interface: nic0
    options:
      - feature: tso
        value: "off"
      - feature: gso
        value: "off"
      - feature: gro
        value: "off"

# ZFS ARC cap = 2 GiB, overriding the 8 GiB group default: a 14-15 GiB host
# running a 6 GiB k3s guest — a larger ARC competes with guest RAM and pushes it
# to swap. local-ssd here backs VM disks, not a media library, so a large cache
# wins little.
zfs_arc_cap_max_bytes: 2147483648
