---
# Home Assistant VM configuration
# Running Home Assistant OS on pve-prec-01 (192.168.0.154)
# Primary on pve-prec-01, HA-managed with multi-node replication

# Proxmox host for this VM (primary node for HA-managed resource)
proxmox_host: pve-prec-01

# Proxmox resource pool for organization
proxmox_resource_pool: apps-public

# VM startup configuration
# Boot order strategy: DNS (10) -> SMTP (20) -> k3s servers (30) -> k3s agents (40) -> apps (50)
proxmox_autostart_enabled: true
proxmox_startup_order: 50
proxmox_startup_delay: 10

# VM hardware configuration (for reference - VM created manually)
# These values document the actual configuration but are not used for provisioning
proxmox_vm_cores: 4
proxmox_vm_memory: 8192
proxmox_vm_disk_size: 64G
# local-ssd ZFS pool: required for the ZFS-to-ZFS HA replication of vmid 154
proxmox_storage: local-ssd

# Home Assistant OS details
haos_version: "17.0"  # Installed version (update manually via UI)
haos_type: "qcow2"    # Image format

# Network configuration (set via HAOS console)
# Static IP: 192.168.0.154/24
# Gateway: 192.168.0.1
# DNS: 192.168.0.150

# HAOS is not Ansible-managed beyond the config push below (the proxmox_vm
# values above document the live VM). Setup, SMTP, SSO, SSH access, updates,
# monitoring and the HA-bypass ingress routes: docs/24-home-assistant-deployment.md.
#
# Backups: HAOS scheduled backups write to the NFS export
# pve-nas-01:/backups-apps/home-assistant (plaintext — HAOS cannot do
# xprtsec=tls). One-time HA UI step; the artifact staleness/size arms watch it
# via nas_storage_backup_artifact_apps in host_vars/pve-nas-01.yml.

# SSH/SCP target for the config push (the HAOS add-on listens on 22222 as root).
# The play runs on localhost and loads this file via vars_files, so ansible_host
# would resolve to the controller — pull the address from the home inventory host.
home_assistant_host: "{{ hostvars['home']['ansible_host'] }}"

# Sources whose X-Forwarded-For HA trusts: the LAN (which is where every Traefik
# ingress node sits) and both k3s CIDRs.
home_assistant_trusted_proxies:
  - "192.168.0.0/24"
  - "10.42.0.0/16"
  - "10.43.0.0/16"

# OIDC discovery URL. The issuer host is ALWAYS the external one — HA's
# hass-openid integration fetches it server-side, and the split-horizon
# rewrite for auth.ericsweiss.com keeps that fetch off the WAN hairpin.
home_assistant_oidc_configure_url: >-
  https://auth.{{ external_domain }}/application/o/home/.well-known/openid-configuration

# TLS on HAOS backend (Traefik -> HAOS hop encrypted).
# Override the role default (false) once acme_certs has pushed
# /ssl/fullchain.pem + /ssl/privkey.pem at least once. The HAOS Files
# add-on must be configured to allow port-22222 SSH with the cert
# distribution pubkey in /root/.ssh/authorized_keys.
home_assistant_ssl_enabled: true

# HAOS host-key pin for SSH/SCP from the home_assistant role.
# HAOS runs SSH on a non-standard port (22222) as root with no sudo,
# so the role can't go through the standard ansible.cfg trust path —
# we pin the key and the role asserts it on every run. The key value
# itself is the shared haos_ssh_host_key defined in group_vars/all.yml
# (single source of truth; also consumed by the `home` cert target in
# host_vars/dns-01.yml). The role prepends "[192.168.0.154]:22222 "
# before writing into the operator's known_hosts.
home_assistant_host_key: "{{ haos_ssh_host_key }}"
