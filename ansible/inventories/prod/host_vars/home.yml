---
# Home Assistant VM configuration
# Running Home Assistant OS on pve-prec-01 (10.0.10.154)
# Primary on pve-prec-01, HA-managed with multi-node replication

# Proxmox host for this VM (primary node for HA-managed resource)
proxmox_host: pve-prec-01

proxmox_resource_pool: apps-public

proxmox_autostart_enabled: true
proxmox_startup_order: 50
proxmox_startup_delay: 10

# The VM was created manually: these values document it, they do not provision it.
proxmox_vm_cores: 4
proxmox_vm_memory: 8192
proxmox_vm_disk_size: 64G
# local-ssd ZFS pool: required for the ZFS-to-ZFS HA replication of vmid 154
proxmox_storage: local-ssd

# The network is set in the HAOS console: 10.0.10.154/24, gw 10.0.10.1.

# HAOS is not Ansible-managed beyond the config push below. Setup, SMTP, SSO,
# SSH, updates, monitoring, the HA-bypass ingress routes and the NFS backup
# landing zone: docs/24-home-assistant-deployment.md.

# SSH/SCP target for the config push (the HAOS add-on listens on 22222 as root).
# The play runs on localhost and loads this file via vars_files, so ansible_host
# would resolve to the controller — pull the address from the home inventory host.
home_assistant_host: "{{ hostvars['home']['ansible_host'] }}"

# Sources whose X-Forwarded-For a FRESH HA instance trusts: the k3s nodes
# running Traefik, plus both cluster CIDRs. This instance is storage-backed, so
# the live list is UI state and this value governs first boot only (docs/24).
home_assistant_trusted_proxies: >-
  {{ (groups['k3s_servers'] + groups['k3s_agents'])
     | map('extract', hostvars, 'ansible_host') | select('defined') | list
     + ['10.42.0.0/16', '10.43.0.0/16'] }}

# OIDC discovery URL. The issuer host is ALWAYS the external one — HA's
# hass-openid integration fetches it server-side, and the split-horizon
# rewrite for auth.ericsweiss.com keeps that fetch off the WAN hairpin.
home_assistant_oidc_configure_url: >-
  https://auth.{{ external_domain }}/application/o/home/.well-known/openid-configuration

# Traefik -> HAOS hop encrypted. Safe to enable only after acme_certs has
# pushed /ssl/fullchain.pem + /ssl/privkey.pem at least once, which needs the
# HAOS Files add-on allowing port-22222 SSH with the distribution pubkey.
home_assistant_ssl_enabled: true

# HAOS runs SSH on 22222 as root with no sudo, outside the ansible.cfg trust
# path, so the role asserts this pinned key on every run and prepends
# "[10.0.10.154]:22222 " before writing it into known_hosts.
home_assistant_host_key: "{{ haos_ssh_host_key }}"
