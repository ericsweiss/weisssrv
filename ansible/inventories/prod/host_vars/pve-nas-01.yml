---
# pve-nas-01 specific configuration
# Primary NAS/storage server running Proxmox VE

# ZFS native encryption: boot passphrase from 1Password Connect, token at
# /etc/onepassword-connect/token. Each pool listed must already hold an
# encrypted dataset or zfs-load-key@<pool> fails at boot (docs/32).
zfs_encryption_connect_vault: "Homelab-Boot"
zfs_encryption_pools:
  - name: tank
    item: "ZFS Pool tank Passphrase"
    field: passphrase
  - name: ssd
    item: "ZFS Pool ssd Passphrase"
    field: passphrase

# Guests on the encrypted ssd pool. Membership here, not onboot, starts them:
# pve-start-encrypted-guests runs after unlock, VMs in list order then CTs.
# VM 222 is absent so etcd quorum never waits on the unlock (docs/32).
zfs_encryption_guest_vmids: [202, 153, 156, 157, 155]
zfs_encryption_guest_ctids: [152, 158]

# NFS bind sources on ENCRYPTED datasets: nas_storage anchors their /export/*
# binds on the late zfs-mount-encrypted.service, so a bind captures the unlocked
# dataset instead of an empty mountpoint. /mnt/media (mergerfs) is not ZFS.
nas_storage_encrypted_bind_sources:
  - /mnt/ssd/appdata
  - /mnt/tank/share
  - /mnt/tank/proxmox
  - /mnt/ssd/k3s-etcd  # off-node k3s etcd snapshot copies (encrypted, ssd pool)
  # Per-app logical-dump landing subdirs of tank/backups/apps (exports below);
  # each bind anchors on zfs-mount-encrypted too.
  - /mnt/tank/backups/apps/authentik
  - /mnt/tank/backups/apps/mealie
  - /mnt/tank/backups/apps/hindsight
  - /mnt/tank/backups/apps/gitlab
  - /mnt/tank/backups/apps/immich
  - /mnt/tank/backups/apps/nextcloud
  - /mnt/tank/backups/apps/home-assistant

# ZFS pool configuration
nas_storage_zfs_pools:
  - name: tank
    datasets:
      - name: tank/media
        properties:
          mountpoint: /mnt/tank/media
          atime: "off"
          compression: zstd
          recordsize: 1M
          acltype: posix
          com.sun:auto-snapshot: "true"
      - name: tank/share
        properties:
          mountpoint: /mnt/tank/share
          atime: "off"
          compression: zstd
          recordsize: 128K
          acltype: posix
          com.sun:auto-snapshot: "true"
      - name: tank/proxmox
        properties:
          mountpoint: /mnt/tank/proxmox
          atime: "off"
          compression: zstd
          com.sun:auto-snapshot: "false"
          encryption: aes-256-gcm
      - name: tank/pve
        properties:
          mountpoint: /mnt/tank/pve
          atime: "off"
          compression: zstd
          com.sun:auto-snapshot: "false"
      # Nextcloud bulk user data: a hand-created encryption root whose data zvol
      # is a child. Properties match the live dataset and `encryption` guards
      # recreation; confirm the cipher with `zfs get encryption` (docs/44).
      - name: tank/nextcloud-data
        properties:
          mountpoint: /mnt/tank/nextcloud-data
          compression: zstd
          encryption: aes-256-gcm
      # Immich photo library: same shape as tank/nextcloud-data above - an
      # encryption root created by hand whose data zvol is a child.
      - name: tank/immich-data
        properties:
          mountpoint: /mnt/tank/immich-data
          encryption: aes-256-gcm
      # Legacy machine backups: 410k files at or under 64K, so those blocks live
      # on the special mirror; `encryption` is a plaintext-recreation guard.
      - name: tank/backups
        properties:
          mountpoint: /mnt/tank/backups
          encryption: aes-256-gcm
          special_small_blocks: 64K
      # Logical-dump landing zone: its OWN dataset so the restore drill can
      # sample it separately. CREATE MANUALLY FIRST - nas_storage hard-fails
      # DATASET_MISSING. `encryption` is a plaintext-recreation guard.
      - name: tank/backups/apps
        properties:
          mountpoint: /mnt/tank/backups/apps
          encryption: aes-256-gcm

  - name: ssd
    datasets:
      # Encryption root for every app /config dir and the app zvols below;
      # `encryption` is a plaintext-recreation guard.
      - name: ssd/appdata
        properties:
          mountpoint: /mnt/ssd/appdata
          atime: "off"
          compression: lz4
          com.sun:auto-snapshot: "true"
          encryption: aes-256-gcm
      # Prometheus's TSDB has its own retention, so zfs-auto-snapshot only holds
      # stale chunks. NOTE: false stops creation AND pruning - snapshots taken
      # before the flip must be swept by hand (docs/12 § Recovering Space).
      - name: ssd/appdata/prometheus
        properties:
          com.sun:auto-snapshot: "false"
      # Loki has its own retention; same sweep caveat as prometheus above.
      - name: ssd/appdata/loki
        properties:
          com.sun:auto-snapshot: "false"
      # mealie/postgres is a zvol, so an auto-created ssd/appdata/mealie parent
      # would mount over and shadow the directory the recipes NFS PV serves.
      # canmount=off keeps it unmounted; the nas_storage guard asserts it.
      - name: ssd/appdata/mealie
        properties:
          canmount: "off"
      # Off-node etcd snapshot copies (docs/17). Its OWN encryption root: the ssd
      # pool root is plaintext and children do not inherit, so create it by hand
      # first - nas_storage hard-fails DATASET_MISSING (docs/44).
      - name: ssd/k3s-etcd
        properties:
          mountpoint: /mnt/ssd/k3s-etcd
          atime: "off"
          compression: lz4
          com.sun:auto-snapshot: "false"
          encryption: aes-256-gcm

  - name: nvme
    datasets:
      - name: nvme/media
        properties:
          mountpoint: /mnt/nvme/media
          atime: "off"
          compression: zstd
          recordsize: 1M
          com.sun:auto-snapshot: "true"

  # The archive pool's datasets are owned by archive-backupctl, which locks them
  # to mountpoint=inherit, canmount=off, readonly=on as `zfs receive -F` targets.
  # Managing them here would unlock them on every deploy - only the scrub applies.
  - name: archive
    datasets: []

# ZFS scrub timer
nas_storage_zfs_scrub_enabled: true
nas_storage_zfs_scrub_schedule: "monthly"

# Per-app /config directories created under ssd/appdata (1000:2000, 0775) for
# the NFS-backed PVs and the LXC bind mounts.
nas_storage_appdata_dirs:
  - grafana
  - sonarr
  - radarr
  - lidarr
  - prowlarr
  - qbittorrent
  - nzbget
  - pulsarr
  - mealie
  - bar-assistant
  - wg-easy
  - hermes
  - hindsight
  - homarr
  - uptime-kuma

# Logical dumps tracked as node_exporter textfile metrics (BackupArtifact*).
# name = the tank/backups/apps subdir; `companions:` are restore-critical files
# outside `pattern:` and get their own alert arm - docs/42.
nas_storage_backup_artifact_apps:
  - name: authentik
    pattern: "authentik-*.sql.gz"
  - name: mealie
    pattern: "mealie-*.sql.gz"
  - name: hindsight
    pattern: "hindsight-*.sql.gz"
  - name: gitlab
    pattern: "*_gitlab_backup.tar"
    # gitlab-backup EXCLUDES both of these, and without them the tarball restores
    # to an instance that cannot decrypt its own CI variables, 2FA secrets or
    # runner tokens. gitlab-backup-run.sh copies them next to the tarball.
    companions:
      - "gitlab-secrets.json"
      - "gitlab.rb"
  - name: immich
    pattern: "immich-*.sql.gz"
  - name: nextcloud
    pattern: "nextcloud-db-*.sql.gz"
  - name: home-assistant
    # [Aa]utomatic_backup_* only: a bare "*.tar" also matched the add-on tars
    # HAOS writes here, which kept the staleness and zero-byte arms green through
    # a stopped full backup. The class covers HA 2026.8's lowercased name.
    pattern: "[Aa]utomatic_backup_*.tar"
  - name: pve-cluster
    pattern: "etc-pve-*.tar.gz"

# Nightly raw-encrypted replication to the archive pool (docs/42). Sources are
# replicated RECURSIVELY and each lands at archive/<basename>, so basenames must
# be unique and every root must be a filesystem (a top-level zvol is rejected).
nas_storage_archive_backup_enabled: true
nas_storage_archive_backup_pool: archive
nas_storage_archive_backup_vzdump_target: tank/proxmox
nas_storage_archive_backup_sources:
  - tank/share
  - tank/backups
  - tank/nextcloud-data
  - tank/proxmox
  - tank/immich-data
  - ssd/appdata
  - ssd/k3s-etcd

# An excluded child keeps no source-side `archsync-*` snapshot, and the stream
# leaves whatever archive copy it has: the run warns, counts it in
# archive_backup_excluded_orphans, and `zfs destroy -r` reclaims it (docs/12).
nas_storage_archive_backup_exclude:
  # Both TSDBs are re-derivable, dominate the pool and are already out of
  # restic. The exclusion needs `zfs send -X` (OpenZFS 2.3+).
  - ssd/appdata/prometheus
  - ssd/appdata/loki

# Hand off to the offsite run as soon as replication succeeds; the nightly
# restic timer is only the fallback.
nas_storage_archive_backup_on_success_units:
  - restic-offsite.service

# Per-cache slab metrics for the 192B leak watch. Only this host boots with
# slub_nomerge, so it is the only one whose cache names are attributable. The
# flag is on the kernel cmdline by hand, not by Ansible (docs/06).
node_exporter_host_slabinfo_collector: true
node_exporter_host_slab_caches:
  - skbuff_ext_cache
  - file_lock_cache
  - dentry
  - arc_buf_hdr_t_full

# ZFS ARC cap (12 GiB): a guard, not a target - uncapped, ARC takes about half of
# this host's RAM and collides with the 01:00-03:30 backup window, swapping idle
# guest anon. Rendered into /etc/modprobe.d/zfs.conf by nas_storage (docs/06).
nas_storage_zfs_arc_max_bytes: 12884901888

# Keep NFSv4 delegations ON. Without write delegations every *arr SQLite txn
# issues real NFS LOCK/LOCKU RPCs whose unlocks drain in-flight I/O, stalling
# the apps 15-30 s per background job. Slab-leak context: docs/06.
nas_storage_nfs_disable_delegations: false

# Nightly /etc/pve archive into the offsite-eligible landing zone. pmxcfs is
# cluster-shared, so archiving it from this node covers the whole cluster - and
# without it user.cfg, corosync.conf and priv/ have no backup at any tier (docs/17).
nas_storage_pve_cluster_backup_enabled: true

# Daily swap reset. vm.swappiness=1 + the ARC cap keep steady-state swap ~0, but
# a real peak still swaps and that swap never self-clears. The timer aborts if a
# swapoff would risk OOM. Only this host runs it.
nas_storage_swap_clean_enabled: true
# 07:00 — deliberately AFTER the NAS's own overnight jobs (media-mover 06:00,
# archive-backup 06:30) so it reclaims the swap THEY caused rather than running
# before/during them. If those ever run long, push this later.
nas_storage_swap_clean_schedule: "*-*-* 07:00:00"
# Safety interlock: without restic-offsite.service here swap-clean shrinks the
# ARC, swapoffs and stops the guests whose zvol clones restic is reading.
nas_storage_swap_clean_conflicting_units:
  - archive-backup.service
  - media-mover.service
  - restic-offsite.service
# Escalation when ARC-shrink headroom alone cannot cover the swap: shut these
# guests down in order, only as many as needed, swapoff, then restart every one
# stopped. "vmid:name:timeout(s)", least- to most-critical. Graceful only.
nas_storage_swap_clean_stop_guests:
  - "157:immich:120"
  - "153:gitlab:300"
  - "156:nextcloud:120"

# Merges NVMe (hot tier) + tank (cold tier) media into a unified /mnt/media.
# Only tank/media is a branch, so tank's other directories are NOT exposed.
nas_storage_mergerfs_mounts:
  - name: media
    sources:
      - /mnt/nvme/media          # Hot tier
      - /mnt/tank/media          # Cold tier (only tank/media, not entire tank)
    target: /mnt/media
    options:
      - defaults
      - allow_other
      - default_permissions
      - use_ino
      - inodecalc=path-hash      # Required for NFS: provides stable inodes for FUSE
      - noforget                 # Required for NFS: prevents ESTALE (stale file handle) errors
      - cache.files=off
      - dropcacheonclose=true
      - category.create=ff       # New files go to first branch (nvme)
      - category.action=epall    # Actions use all branches
      - moveonenospc=true        # Move to next branch when nvme fills
      - minfreespace=100G        # Keep 100G free on nvme
    systemd_requires:
      - /mnt/nvme/media
      - /mnt/tank/media

# NFSv4-over-TLS server: tlshd answers the server-side handshake for every
# xprtsec=tls client line below (the k3s exports, the app-VM backup exports and
# the six Proxmox hosts' /export/tank-proxmox). Plaintext lines are unaffected.
nfs_tls_enabled: true
# This host is the NFS server, so tlshd needs the [authenticate.server] cert +
# key; the clients present none under xprtsec=tls.
nfs_tls_is_server: true

# NFSv4 pseudo-root the role creates. The export paths below are site data and
# are not derived from it, so this must match the fsid=0 entry.
nas_storage_export_root: /export

# NFS exports. Every k3s/app export: owner 1000 (eric), group 2000 (media),
# mode 02775 (setgid). k3s clients 10.0.10.200/29 = agents, 10.0.10.220/29 =
# servers .222/.223, so 10.0.10.227/32 is listed explicitly on each k3s export.
nas_storage_exports:
  # CRITICAL: NFSv4 pseudo-root (fsid=0), traversal-only and read-only.
  # crossmnt is absent: it would export every child under /export to these
  # client lines with THIS line's options (plaintext, no xprtsec), bypassing
  # the per-child client lists. A new dataset under /export needs its own
  # entry. The .154 line stays: HAOS mounts /media relative to this root.
  - path: /export
    clients:
      - spec: "10.0.10.102/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "10.0.10.103/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "10.0.10.104/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "10.0.10.105/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "10.0.10.106/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "10.0.10.107/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "10.0.10.154/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      # App VMs (.153 gitlab, .156 nextcloud, .157 immich) traverse this
      # pseudo-root into their OWN /export/backups-apps/<app> export; .154 into
      # home-assistant. The parent dir is not exported, which is the isolation.
      - spec: "10.0.10.153/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "10.0.10.156/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "10.0.10.157/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "10.0.10.200/29"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      # k3s servers as explicit /32s: 10.0.10.220/29 masks .216-.223 and does NOT
      # cover .227, and with fsid=0 declared the synthesized pseudo-root is off,
      # so a server missing here cannot traverse into /export/k3s-etcd.
      - spec: "10.0.10.222/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "10.0.10.223/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "10.0.10.227/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"

  # K3s/app RW exports. all_squash + anonuid/anongid maps every client (root
  # included) to 1000:2000 so LinuxServer.io containers can chown at init.
  # xprtsec=tls REQUIRED, and PVs mount by hostname (the cert has no IP SAN).
  - path: /export/appdata
    bind_source: /mnt/ssd/appdata
    owner: 1000
    group: 2000
    mode: "02775"
    xprtsec: "tls"
    clients:
      - spec: "10.0.10.200/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=11"
      - spec: "10.0.10.220/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=11"
      - spec: "10.0.10.227/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=11"

  - path: /export/share
    bind_source: /mnt/tank/share
    owner: 1000
    group: 2000
    mode: "02775"
    xprtsec: "tls"  # require TLS — see /export/appdata note above
    clients:
      - spec: "10.0.10.200/29"
        options: "rw,sync,no_subtree_check,root_squash,fsid=12"
      - spec: "10.0.10.220/29"
        options: "rw,sync,no_subtree_check,root_squash,fsid=12"
      - spec: "10.0.10.227/32"
        options: "rw,sync,no_subtree_check,root_squash,fsid=12"

  # Unified media export (the mergerfs union). xprtsec is PER CLIENT, so the
  # require-TLS k3s lines and the plaintext .154 line coexist: HAOS hardcodes its
  # mount options and ships no tlshd (docs/24, docs/07).
  - path: /export/media
    bind_source: /mnt/media
    # Explicit: /mnt/media is the MergerFS union target, not a ZFS dataset, so
    # the mounted-dataset guard and the zfs-mount fstab ordering do not apply
    # here (the union's own branches carry them).
    zfs: false
    owner: 1000
    group: 2000
    mode: "02775"
    clients:
      - spec: "10.0.10.200/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=20"
        xprtsec: "tls"
      - spec: "10.0.10.220/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=20"
        xprtsec: "tls"
      - spec: "10.0.10.227/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=20"
        xprtsec: "tls"
      - spec: "10.0.10.154/32"  # HAOS — plaintext (no xprtsec; see comment above)
        options: "ro,sync,no_subtree_check,root_squash,fsid=20"

  # Off-node k3s etcd snapshot copies (docs/17). Servers only, xprtsec=tls, and
  # no_root_squash so each server's root copy script can write. The three /32s
  # are in the fsid=0 root above so NFSv4 traversal into this child works.
  - path: /export/k3s-etcd
    bind_source: /mnt/ssd/k3s-etcd
    owner: 0  # root
    group: 0  # root
    mode: "0700"
    xprtsec: "tls"
    clients:
      - spec: "10.0.10.222/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=15"
      - spec: "10.0.10.223/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=15"
      - spec: "10.0.10.227/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=15"

  # Offsite-eligible logical-dump landing zone (tank/backups/apps -> B2), one
  # export per app; all_squash lands every write as 1000:2000. Guest exports
  # are scoped to a single /32. fsids stay unique across this file.
  - path: /export/backups-apps/authentik
    bind_source: /mnt/tank/backups/apps/authentik
    bind_source_check: /mnt/tank/backups/apps
    owner: 1000
    group: 2000
    mode: "02775"
    xprtsec: "tls"
    clients:
      - spec: "10.0.10.200/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=16"
      - spec: "10.0.10.220/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=16"
      - spec: "10.0.10.227/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=16"

  - path: /export/backups-apps/mealie
    bind_source: /mnt/tank/backups/apps/mealie
    bind_source_check: /mnt/tank/backups/apps
    owner: 1000
    group: 2000
    mode: "02775"
    xprtsec: "tls"
    clients:
      - spec: "10.0.10.200/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=17"
      - spec: "10.0.10.220/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=17"
      - spec: "10.0.10.227/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=17"

  - path: /export/backups-apps/hindsight
    bind_source: /mnt/tank/backups/apps/hindsight
    bind_source_check: /mnt/tank/backups/apps
    owner: 1000
    group: 2000
    mode: "02775"
    xprtsec: "tls"
    clients:
      - spec: "10.0.10.200/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=23"
      - spec: "10.0.10.220/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=23"
      - spec: "10.0.10.227/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=23"

  # gitlab (.153) — TLS on the wire (VM runs tlshd via nfs_tls).
  - path: /export/backups-apps/gitlab
    bind_source: /mnt/tank/backups/apps/gitlab
    bind_source_check: /mnt/tank/backups/apps
    owner: 1000
    group: 2000
    mode: "02775"
    xprtsec: "tls"
    clients:
      - spec: "10.0.10.153/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=18"

  # immich (.157) — TLS on the wire (VM runs tlshd via nfs_tls).
  - path: /export/backups-apps/immich
    bind_source: /mnt/tank/backups/apps/immich
    bind_source_check: /mnt/tank/backups/apps
    owner: 1000
    group: 2000
    mode: "02775"
    xprtsec: "tls"
    clients:
      - spec: "10.0.10.157/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=19"

  # nextcloud (.156) — TLS on the wire (VM runs tlshd via nfs_tls).
  - path: /export/backups-apps/nextcloud
    bind_source: /mnt/tank/backups/apps/nextcloud
    bind_source_check: /mnt/tank/backups/apps
    owner: 1000
    group: 2000
    mode: "02775"
    xprtsec: "tls"
    clients:
      - spec: "10.0.10.156/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=21"

  # home-assistant (.154) - PLAINTEXT. HAOS Supervisor hardcodes its NFS mount
  # and ships no tlshd, so it can never request xprtsec=tls; it is the one
  # plaintext-on-wire backup flow. Native scheduled backup target (docs/24).
  - path: /export/backups-apps/home-assistant
    bind_source: /mnt/tank/backups/apps/home-assistant
    bind_source_check: /mnt/tank/backups/apps
    owner: 1000
    group: 2000
    mode: "02775"
    clients:
      - spec: "10.0.10.154/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=22"

  # Proxmox backup target (requires no_root_squash). REQUIRES TLS: every PVE host
  # already mounts it with xprtsec=tls, so this only enforces what the clients do
  # - ~12.5 TiB of dumps would otherwise travel plaintext with no_root_squash.
  - path: /export/tank-proxmox
    bind_source: /mnt/tank/proxmox
    owner: 1000
    group: 2000
    mode: "02775"
    xprtsec: "tls"
    clients:
      - spec: "10.0.10.102/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"
      - spec: "10.0.10.103/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"
      - spec: "10.0.10.104/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"
      - spec: "10.0.10.105/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"
      - spec: "10.0.10.106/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"
      - spec: "10.0.10.107/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"

# Samba shares: the "nas" user with the "media" group (GID 2000).
nas_storage_samba_shares:
  - name: share
    path: /mnt/tank/share
    comment: General file share
    browseable: true
    read_only: false
    guest_ok: false
    valid_users: "nas"
    force_group: "media"
    create_mask: "0664"
    directory_mask: "2775"  # setgid bit for group inheritance

  - name: media
    path: /mnt/tank/media
    comment: Media library
    browseable: true
    read_only: false
    guest_ok: false
    valid_users: "nas"
    force_group: "media"
    create_mask: "0664"
    directory_mask: "2775"  # setgid bit for group inheritance

# Moves old files from the NVMe hot tier down to tank.
nas_storage_media_mover_enabled: true
nas_storage_media_mover_src: /mnt/nvme/media/library    # Hot tier library
nas_storage_media_mover_dst: /mnt/tank/media/library    # Cold tier library
# 06:00: between the vzdump window (03:30 to ~05:45) and the 06:30 archive
# replication, so the nvme->tank rsync never stacks on either. An overrun is
# safe: tank/media is not replicated to archive.
nas_storage_media_mover_schedule: "*-*-* 06:00:00"

# Proxmox storage, reconciled by the proxmox_backup role. Mounted by HOSTNAME
# with xprtsec=tls (the wildcard cert has no IP SAN), which requires tlshd on
# every PVE host. server/export/path are create-fixed, so drift fails loud.
proxmox_backup_storage:
  - id: tank-proxmox
    type: nfs
    server: pve-nas-01.esweiss.com
    export: /tank-proxmox
    # Synced from the live storage.cfg. content is a mutable property, so the
    # role updates it on drift (unlike server/export/path, which are
    # create-fixed and fail loud).
    content: "snippets,backup,vztmpl,iso"
    path: /mnt/pve/tank-proxmox
    options: "vers=4.2,xprtsec=tls"
  # `pool` is create-fixed and asserted: id `ssd` maps to ssd/pve, the encryption
  # root carrying guest root disks. An id recreated against the pool root lands
  # new disks in plaintext. mountpoint, nodes, sparse sync from storage.cfg.
  - id: ssd
    type: zfspool
    pool: ssd/pve
    content: "images,rootdir"
    mountpoint: /mnt/ssd/pve
    nodes: pve-nas-01
    sparse: false
  # tank/nvme carry no guest disks today and are plaintext; declared so the id
  # -> dataset mapping is codified. Only pool + content are pinned, so the
  # reconcile inherits the live mountpoint/nodes/sparse rather than asserting them.
  - id: tank
    type: zfspool
    pool: tank/pve
    content: "images,rootdir"
  - id: nvme
    type: zfspool
    pool: nvme/pve
    content: "images,rootdir"

# Proxmox backup job (jobs.cfg via /cluster/backup), reconciled by the
# proxmox_backup role. IMPORTANT: `id` must match the live jobs.cfg id or the
# role CREATES A SECOND job. `script` publishes the vzdump_backup_* series.
proxmox_backup_vzdump_jobs:
  - id: backup-10f33360-a177
    storage: tank-proxmox
    schedule: "03:30"
    mode: snapshot
    compress: zstd
    all: true
    # k3s VMs excluded: rebuildable cattle whose persistent data lives on zvols
    # with backup=0, and a stale server image rejoins etcd stale. Adding a guest
    # here strands its existing dumps - sweep them by hand (docs/17).
    exclude: [202, 203, 204, 205, 206, 207, 222, 223, 227]
    # Per-node backup I/O cap (KiB/s): every node writes to this host's
    # tank-proxmox target at 03:30 at once, and unthrottled that saturates the
    # spinning tank pool. Keeps the window clear of the 06:00/06:30 jobs (docs/12).
    bwlimit: 61440
    prune_backups: "keep-daily=7,keep-weekly=4,keep-monthly=6"
    notification_mode: notification-system
    enabled: true
    script: /usr/local/bin/vzdump-metrics-hook.sh

# SMART monitoring
nas_storage_smartd_enabled: true
nas_storage_smartd_tank_disks:
  - /dev/disk/by-id/ata-ST22000NM000C-3WC103_ZXA18WD1
  - /dev/disk/by-id/ata-ST22000NM000C-3WC103_ZXA0RDDB
  - /dev/disk/by-id/ata-ST22000NM000C-3WC103_ZXA0EJDZ
  - /dev/disk/by-id/ata-ST22000NM000C-3WC103_ZXA0ZZ1R
  - /dev/disk/by-id/ata-ST22000NM000C-3WC103_ZXA0HR34
  - /dev/disk/by-id/ata-ST22000NM000C-3WC103_ZXA0FEGJ

nas_storage_smartd_ssd_disks:
  - /dev/disk/by-id/ata-Samsung_SSD_870_EVO_4TB_S757NL0Y902062Z
  - /dev/disk/by-id/ata-Samsung_SSD_870_EVO_4TB_S757NL0Y902052X
  - /dev/disk/by-id/ata-Samsung_SSD_870_EVO_4TB_S757NL0Y901976N

nas_storage_smartd_nvme_disks:
  - /dev/disk/by-id/nvme-Samsung_SSD_990_PRO_4TB_S7KGNU0YA04137V
  - /dev/disk/by-id/nvme-CT2000P5PSSD8_2334429F310B
  - /dev/disk/by-id/nvme-CT2000P5PSSD8_2334429F32EE
  - /dev/disk/by-id/nvme-Samsung_SSD_990_PRO_with_Heatsink_4TB_S7DSNJ0Y608388N

nas_storage_smartd_archive_disks:
  - /dev/disk/by-id/ata-SEAGATE_ST6000NM0024_Z4D2BDD2
  - /dev/disk/by-id/ata-ST6000NM0024-1HT17Z_Z4D1JCL6
  - /dev/disk/by-id/ata-ST6000NM0024-1HT17Z_Z4D1RQSM
  - /dev/disk/by-id/ata-ST6000NM0024-1HT17Z_Z4D1JQBA

# Disable GRO on the Aquantia AQC113 10G NIC: the driver deadlocks on a bridged
# interface with GRO on. A firmware update is a separate manual task (docs/16).
nic_tuning_overrides:
  - interface: nic1
    options:
      - feature: gro
        value: "off"

# Kill nic1's IPv6 link-local: nic1 is the NAS uplink and its UNTAGGED
# native-VLAN fe80:: is an L2 path from the Home segment the VLAN zone firewall
# never inspects. Strictly per-interface, so other interfaces keep IPv6 (docs/11).
nic_tuning_disable_ipv6:
  - nic1

# Swappiness 1 - the only host that sets it. Above 1 the kernel parks cold anon
# pages in swap even with free RAM and never pages them back, so swap ratchets
# up; at 1 it reclaims from ARC instead and swaps only near OOM.
nic_tuning_vm_swappiness: 1

# Nightly offsite backup to Backblaze B2 (docs/42). The bind sources are the
# archsync-quiesced datasets; the two zvol sources are clone-mounted read-only so
# the Immich/Nextcloud bulk data inside those guest filesystems is covered too.
restic_offsite_repo: "rclone:b2:weisssrv-backup/restic"
# Documented exception to the role's not-replicated cache rule: the archive job
# raw-sends ssd/appdata recursively and every encrypted root is replicated, so
# the only cost of this placement is churn of regenerable data (role README).
restic_offsite_cache_dir: /mnt/ssd/appdata/.restic-cache
# Fallback trigger when the archive OnSuccess handoff does not fire. Clear of
# swap-clean (07:00), which stops guests whose zvol clones a run reads.
restic_offsite_timer_calendar: "*-*-* 07:15:00"
# Reverse half of the swap-clean interlock: a swap-clean night that starts after
# this run took the lock would still shrink the ARC, swapoff and stop the guests
# whose zvol clones restic is reading.
restic_offsite_conflicting_units:
  - swap-clean.service
restic_offsite_sources:
  - name: backups     # tank/backups: legacy machine backups (apps/ is separate)
    mountpoint: /mnt/tank/backups
  # The app dumps get their OWN source: the drill draws round-robin one file per
  # source, so inside `backups` (~500k legacy files) their odds were ~0. Listed
  # SECOND so they are drawn in the first round; the walk sees no double capture.
  - name: backups-apps  # tank/backups/apps: per-app logical dumps
    mountpoint: /mnt/tank/backups/apps
  - name: share       # tank/share
    mountpoint: /mnt/tank/share
  - name: appdata     # ssd/appdata: app /config dirs (zvol children empty in the walk)
    mountpoint: /mnt/ssd/appdata
  - name: k3s-etcd    # ssd/k3s-etcd: off-node etcd snapshot copies (DR chain)
    mountpoint: /mnt/ssd/k3s-etcd
# Restore-drill spread: prove at least 4 of the 5 file sources per drill, so a
# drill that narrows to one source fails instead of passing. The 16 MiB
# per-drill cap keeps the large artefacts out.
restic_offsite_restore_drill_min_sources: 4
restic_offsite_zvol_sources:
  - name: immich-data
    zvol: tank/immich-data/disk
    fstype: ext4
    # Plain `ro`: `noload` skips journal replay, so a clone taken mid-write
    # reads back EBADMSG and restic reports the run incomplete.
    mount_opts: ro
  - name: nextcloud-data
    zvol: tank/nextcloud-data/disk
    fstype: ext4
    mount_opts: ro
# Retention never forgets snapshots tagged `legacy`: they pin the excluded
# machine-backup trees in B2 while the GFS churn continues around them. Tagging
# is a one-time operator act per generation (docs/42).
restic_offsite_keep_tags:
  - legacy
# Churn and cache paths: the databases are covered by their own logical dumps
# under tank/backups/apps, and Prometheus/Loki/Plex caches are re-derivable.
restic_offsite_excludes:
  # Immutable machine backups: kept on tank + archive + B2, skipped by the
  # nightly walk. Their B2 data is pinned by the forever-kept snapshot above -
  # check that pin still exists before removing an exclude (docs/42).
  - /mnt/restic-src/backups/Eric-Laptop/**
  - /mnt/restic-src/backups/Desktop-Backup/**
  - /mnt/restic-src/backups/Amy-Laptop-Old/**
  - /mnt/restic-src/backups/Erics-MBP/**
  - /mnt/restic-src/appdata/prometheus/**
  - /mnt/restic-src/appdata/loki/**
  - /mnt/restic-src/appdata/authentik/postgres/**
  - /mnt/restic-src/appdata/mealie/postgres/**
  - /mnt/restic-src/appdata/gitlab/**
  - /mnt/restic-src/appdata/immich/**
  - /mnt/restic-src/appdata/nextcloud/**
  - "/mnt/restic-src/appdata/plex/Library/Application Support/Plex Media Server/Cache/**"
  - "/mnt/restic-src/appdata/plex/Library/Application Support/Plex Media Server/Metadata/**"
  - "/mnt/restic-src/appdata/plex/Library/Application Support/Plex Media Server/Media/**"
  # llama.cpp GGUF weights, re-downloaded on first start.
  - /mnt/restic-src/appdata/hindsight/models/**
  # HAOS also drops PRE-UPDATE ADD-ON backups here that nothing tracks and HA
  # never prunes. Exclude every tar in that dir, then cancel the match for the
  # automatic ones (`!` is restic's exception pattern; [Aa] covers HA 2026.8).
  - /mnt/restic-src/backups-apps/home-assistant/*.tar
  - "!/mnt/restic-src/backups-apps/home-assistant/[Aa]utomatic_backup_*.tar"

# NAMING TRAP: these hold the RESTRICTED (hide-only) key, from the 1Password
# fields restic_key_id / restic_application_key. The identically named FULL key
# is for scripts/b2-bucket-drift.py only - read the op:// field (docs/42).
restic_offsite_b2_key_id: "{{ lookup('ansible.builtin.env', 'B2_KEY_ID') or undef(hint='B2_KEY_ID env var must be set (run via op run)') }}"
restic_offsite_b2_application_key: >-
  {{ lookup('ansible.builtin.env', 'B2_APPLICATION_KEY')
  or undef(hint='B2_APPLICATION_KEY env var must be set (run via op run)') }}
restic_offsite_repo_password: >-
  {{ lookup('ansible.builtin.env', 'RESTIC_REPO_PASSWORD')
  or undef(hint='RESTIC_REPO_PASSWORD env var must be set (run via op run)') }}
