  - /dev/disk/by-id/nvme-CT2000P5PSSD8_2334429F310B
  - /dev/disk/by-id/nvme-CT2000P5PSSD8_2334429F32EE
  - /dev/disk/by-id/nvme-Samsung_SSD_990_PRO_with_Heatsink_4TB_S7DSNJ0Y608388N

nas_storage_smartd_archive_disks:
  - /dev/disk/by-id/ata-SEAGATE_ST6000NM0024_Z4D2BDD2
  - /dev/disk/by-id/ata-ST6000NM0024-1HT17Z_Z4D1JCL6
  - /dev/disk/by-id/ata-ST6000NM0024-1HT17Z_Z4D1RQSM
  - /dev/disk/by-id/ata-ST6000NM0024-1HT17Z_Z4D1JQBA

# Disable GRO on the Aquantia AQC113 10G NIC: the driver deadlocks on a bridged
# interface with GRO on. A firmware update is a separate manual task (docs/16).
nic_tuning_overrides:
  - interface: nic1
    options:
      - feature: gro
        value: "off"

# Swappiness 1 — the only host that sets it (the others run neither ZFS ARC nor
# memory-pinned guests). Above 1 the kernel parks cold anon pages to swap even
# with free RAM and never pages them back in, so swap ratchets upward; at 1 it
# reclaims from ARC, which is instantly reclaimable, and swaps only near OOM.
# Applied live + persisted via nic_tuning's sysctl.d drop-in.
nic_tuning_vm_swappiness: 1

# Nightly offsite backup to Backblaze B2 (docs/42). The bind sources are the
# archsync-quiesced datasets; the two zvol sources are clone-mounted read-only
# so the Immich/Nextcloud bulk data (which lives INSIDE a guest filesystem, not
# on a ZFS dataset the walk can see) is covered too.
restic_offsite_repo: "rclone:b2:weisssrv-backup/restic"
# Documented exception to the role's not-replicated cache rule: the archive job
# raw-sends ssd/appdata recursively and every encrypted root is replicated, so
# the only cost of this placement is churn of regenerable data (role README).
restic_offsite_cache_dir: /mnt/ssd/appdata/.restic-cache
restic_offsite_sources:
  - name: backups     # tank/backups: legacy machine backups (apps/ is separate)
    mountpoint: /mnt/tank/backups
  # The app dumps get their OWN source: the restore drill draws round-robin one
  # file per source, so inside `backups` (with ~500k legacy files) their sampling
  # odds were ~0. Listed SECOND so it is drawn in the first round. As a child
  # dataset it appears in the `backups` walk as an empty mountpoint dir — no
  # double capture, no exclude needed.
  - name: backups-apps  # tank/backups/apps: per-app logical dumps
    mountpoint: /mnt/tank/backups/apps
  - name: share       # tank/share
    mountpoint: /mnt/tank/share
  - name: appdata     # ssd/appdata: app /config dirs (zvol children empty in the walk)
    mountpoint: /mnt/ssd/appdata
  - name: databases   # ssd/databases
    mountpoint: /mnt/ssd/databases
  - name: k3s-etcd    # ssd/k3s-etcd: off-node etcd snapshot copies (DR chain)
    mountpoint: /mnt/ssd/k3s-etcd
# Restore-drill spread: prove at least 4 of the 6 file sources per drill, so a
# drill that silently narrows to one source fails instead of passing. Only 5 can
# ever yield a candidate (ssd/databases is empty), so 4 keeps one source of
# headroom and cannot be met without backups-apps contributing. The gate counts
# sources, it cannot require a named one (lib follow-up). The 16 MiB per-drill
# cap keeps the large artefacts out of reach — the point is proving the landing
# zone restores, not the size of what it draws.
restic_offsite_restore_drill_min_sources: 4
restic_offsite_zvol_sources:
  - name: immich-data
    zvol: tank/immich-data/disk
    fstype: ext4
    mount_opts: ro,noload
  - name: nextcloud-data
    zvol: tank/nextcloud-data/disk
    fstype: ext4
    mount_opts: ro,noload
# Churn and cache paths: the databases are covered by their own logical dumps
# under tank/backups/apps, and Prometheus/Loki/Plex caches are re-derivable.
restic_offsite_excludes:
  - /mnt/restic-src/appdata/prometheus/**
  - /mnt/restic-src/appdata/loki/**
  - /mnt/restic-src/appdata/authentik/postgres/**
  - /mnt/restic-src/appdata/mealie/postgres/**
  - /mnt/restic-src/appdata/gitlab/**
  - /mnt/restic-src/appdata/immich/**
  - /mnt/restic-src/appdata/nextcloud/**
  - "/mnt/restic-src/appdata/plex/Library/Application Support/Plex Media Server/Cache/**"
  - "/mnt/restic-src/appdata/plex/Library/Application Support/Plex Media Server/Metadata/**"
  - "/mnt/restic-src/appdata/plex/Library/Application Support/Plex Media Server/Media/**"
  # HAOS also drops PRE-UPDATE ADD-ON backups here; nothing tracks them and HA's
  # retention never prunes them, so they would ride to B2 and outlive a full
  # rotation of the real backups. Exclude every tar in that dir, then cancel the
  # match for the automatic ones (a leading `!` is a restic exception pattern;
  # the role renders these into one --exclude-file). The automatic backups
  # already carry the add-ons.
  - /mnt/restic-src/backups-apps/home-assistant/*.tar
  - "!/mnt/restic-src/backups-apps/home-assistant/Automatic_backup_*.tar"

# restic_offsite secrets (B2 offsite backup, docs/42), injected via `op run`
# from the "B2 Archive Backup" item.
# NAMING TRAP: these vars are called b2_key_id / b2_application_key but hold the
# RESTRICTED (hide-only, no deleteFiles) key, sourced from the 1Password fields
# restic_key_id / restic_application_key. The FULL-capability master key lives on
# that item's identically-named fields and is used only by
# scripts/b2-bucket-drift.py. Read the op:// field, not the var name (docs/42).
restic_offsite_b2_key_id: "{{ lookup('ansible.builtin.env', 'B2_KEY_ID') or undef(hint='B2_KEY_ID env var must be set (run via op run)') }}"
restic_offsite_b2_application_key: >-
  {{ lookup('ansible.builtin.env', 'B2_APPLICATION_KEY')
  or undef(hint='B2_APPLICATION_KEY env var must be set (run via op run)') }}
restic_offsite_repo_password: >-
  {{ lookup('ansible.builtin.env', 'RESTIC_REPO_PASSWORD')
  or undef(hint='RESTIC_REPO_PASSWORD env var must be set (run via op run)') }}
