---
# pve-nas-01 specific configuration
# Primary NAS/storage server running Proxmox VE

# ZFS native encryption — boot-time passphrase fetch from 1Password Connect.
# tank and ssd are encrypted (appdata, databases, backups, personal share,
# VM disks). The media domain is NOT encrypted by design: tank/media (the
# ~14.5T Plex library) and all of nvme (hot-tier media, transcode scratch,
# ephemeral VM images). Media is non-sensitive, the only path to encrypt the
# 14.5T tier is a send/recv that has destabilized this host, and AES would
# tax the streaming/transcode hot path — see docs/32 "What is encrypted,
# what isn't". archive is a plaintext raidz1 pool; its sensitive
# replicated datasets are encrypted at rest via raw `zfs send -w` streams
# from the encrypted tank/ssd sources (docs/32). local-ssd on the
# compute hosts is intentionally NOT encrypted — see docs/32 "What is
# encrypted, what isn't" for the chicken-and-egg rationale (k3s VMs live on
# local-ssd; Connect runs in k3s; encrypting it deadlocks cold boot). The
# control there is the drive-wipe SOP in docs/15-credential-rotation.md.
#
# Each listed pool must already have at least one encrypted dataset
# (docs/32 §2a) — the role asserts this and refuses to activate
# zfs-load-key@<pool>.service on a fully plaintext pool (the unit would
# fail at boot and drag zfs-mount.service down via RequiredBy=). To stage
# before encryption, leave this list empty.
zfs_encryption_pools:
  - name: tank
    item: "ZFS Pool tank Passphrase"
    field: passphrase
  - name: ssd
    item: "ZFS Pool ssd Passphrase"
    field: passphrase

# Proxmox guests on this host whose disks live on the encrypted ssd pool.
# pve-start-encrypted-guests.service starts these AFTER zfs-mount-encrypted
# unlocks+mounts ssd (they're onboot=0 in hosts.yml/plex.yml). VM 222
# (srv-nas-01, etcd) is deliberately ABSENT — it has no encrypted disk and
# starts early on its normal onboot path so cluster quorum never waits on
# this NAS's unlock.
#   202 = k3s-agt-nas-01 (4 data zvols scsi1-4 on ssd: authentik/mealie pg,
#         prometheus, loki)
#   153 = gitlab (scsi0 + repos zvol on ssd)
#   152 = plex LXC (mp0 /config on ssd)
# Order mirrors proxmox_startup_order: the k3s agent (202, order 40) before the
# gitlab app (153, order 50); pve-start-encrypted-guests.sh starts VMs in this
# list order, then CTs.
zfs_encryption_guest_vmids: [202, 153]
zfs_encryption_guest_ctids: [152]

# NFS bind sources that live on ENCRYPTED datasets. nas_storage anchors their
# /export/* fstab binds (and the nfs-server drop-in) on the late
# zfs-mount-encrypted.service rather than the early zfs-mount.service, so the
# binds capture the real (unlocked) datasets, never an empty mountpoint. All
# four ZFS-backed exports (appdata, share, tank/proxmox, k3s-etcd) are encrypted;
# /mnt/media (mergerfs, plaintext) is not ZFS-backed and keeps a plain bind.
nas_encrypted_bind_sources:
  - /mnt/ssd/appdata
  - /mnt/tank/share
  - /mnt/tank/proxmox
  - /mnt/ssd/k3s-etcd  # off-node k3s etcd snapshot copies (encrypted, ssd pool)

# ZFS pool configuration
zfs_pools:
  - name: tank
    datasets:
      - name: tank/media
        properties:
          mountpoint: /mnt/tank/media
          atime: "off"
          compression: zstd
          recordsize: 1M
          acltype: posix
          com.sun:auto-snapshot: "true"
      - name: tank/share
        properties:
          mountpoint: /mnt/tank/share
          atime: "off"
          compression: zstd
          recordsize: 128K
          acltype: posix
          com.sun:auto-snapshot: "true"
      - name: tank/proxmox
        properties:
          mountpoint: /mnt/tank/proxmox
          atime: "off"
          compression: zstd
          com.sun:auto-snapshot: "false"
      - name: tank/pve
        properties:
          mountpoint: /mnt/tank/pve
          atime: "off"
          compression: zstd
          com.sun:auto-snapshot: "false"

  - name: ssd
    datasets:
      - name: ssd/appdata
        properties:
          mountpoint: /mnt/ssd/appdata
          atime: "off"
          compression: lz4
          com.sun:auto-snapshot: "true"
      # Prometheus's TSDB has its own retention (365d / 140 GiB max); the
      # zfs-auto-snapshot frequent/hourly/daily/weekly/monthly cadence held
      # ~77 GiB of stale chunks on top of 53 GiB of live data with no
      # operational benefit. Disable on this dataset (zvol child inherits).
      - name: ssd/appdata/prometheus
        properties:
          com.sun:auto-snapshot: "false"
      # Loki has its own retention (loki.compactor.retention_enabled);
      # zfs-auto-snapshot adds no value and grows the zvol footprint.
      - name: ssd/appdata/loki
        properties:
          com.sun:auto-snapshot: "false"
      # mealie/postgres is a zvol (proxmox_vm `zfs create -p -V ssd/appdata/
      # mealie/postgres`), so the auto-created ssd/appdata/mealie parent would
      # mount over /mnt/ssd/appdata/mealie and shadow the /appdata/mealie dir
      # the recipes-appdata-mealie NFS PV serves (mealie's /app/data). canmount
      # =off keeps it unmounted so the NFS bind exports the real directory; the
      # nas_storage appdata shadowing-guard asserts this holds.
      - name: ssd/appdata/mealie
        properties:
          canmount: "off"
      # Off-node etcd snapshot copies from the k3s servers (docs/17). Small, lz4,
      # no auto-snapshot (snapshotting etcd snapshots is pointless). Its OWN
      # encryption root — the ssd pool root is plaintext and children do NOT
      # inherit encryption (docs/32), so it must be created with explicit
      # encryption flags. CREATE MANUALLY FIRST — nas_storage does not create
      # datasets (hard-fails DATASET_MISSING on the next NAS deploy):
      #   zfs create -o encryption=aes-256-gcm -o keyformat=passphrase \
      #     -o keylocation=prompt -o mountpoint=/mnt/ssd/k3s-etcd ssd/k3s-etcd
      # (passphrase from 1P "ZFS Pool ssd Passphrase"; name == encryptionroot so
      # the zfs-load-key@ssd boot loop unlocks it automatically). The
      # encryption=aes-256-gcm property below makes nas_storage fail loudly if the
      # dataset was accidentally created plaintext (zfs set encryption errors).
      - name: ssd/k3s-etcd
        properties:
          mountpoint: /mnt/ssd/k3s-etcd
          atime: "off"
          compression: lz4
          com.sun:auto-snapshot: "false"
          encryption: aes-256-gcm

  - name: nvme
    datasets:
      - name: nvme/media
        properties:
          mountpoint: /mnt/nvme/media
          atime: "off"
          compression: zstd
          recordsize: 1M
          com.sun:auto-snapshot: "true"

  # The archive pool's datasets (archive/proxmox, archive/backups, ...) are
  # owned by archive-backupctl, which locks them to mountpoint=inherit,
  # canmount=off, readonly=on as `zfs receive -F` targets. Managing them here
  # too would unlock them on every deploy and fight the replication lockdown,
  # so the pool carries no datasets entry — only the scrub timer applies.
  - name: archive
    datasets: []

# ZFS scrub timer
zfs_scrub_enabled: true
zfs_scrub_schedule: "monthly"

# ZFS ARC cap (bytes). This host is memory-over-committed (~42.5GB pinned
# guest RAM of 62GB), so the ARC is capped hard at ~6.25GiB. Matches the cap
# already live on the host (hand-applied /etc/modprobe.d/zfs.conf, baked into
# the initramfs) so a rebuild does not silently revert to the ~31GB default
# and swap-thrash the guests. Rendered into /etc/modprobe.d/zfs.conf by
# nas_storage (with an update-initramfs handler so it applies at early boot).
zfs_arc_max_bytes: 6711934976

# NVMe fast storage
nvme_storage:
  data: /mnt/nvme/media
  appdata: /mnt/ssd/appdata

# MergerFS configuration
# Merges NVMe (hot tier) + tank (cold tier) media into unified /mnt/media
# Only downloads/ and library/ are visible - tank's other directories are NOT exposed
mergerfs_mounts:
  - name: media
    sources:
      - /mnt/nvme/media          # Hot tier
      - /mnt/tank/media          # Cold tier (only tank/media, not entire tank)
    target: /mnt/media
    options:
      - defaults
      - allow_other
      - default_permissions
      - use_ino
      - inodecalc=path-hash      # Required for NFS: provides stable inodes for FUSE
      - noforget                 # Required for NFS: prevents ESTALE (stale file handle) errors
      - cache.files=off
      - dropcacheonclose=true
      - category.create=ff       # New files go to first branch (nvme)
      - category.action=epall    # Actions use all branches
      - moveonenospc=true        # Move to next branch when nvme fills
      - minfreespace=100G        # Keep 100G free on nvme
    systemd_requires:
      - /mnt/nvme/media
      - /mnt/tank/media

# NFSv4-over-TLS server: install + start tlshd so the kernel can answer
# the server-side TLS handshake for the k3s client lines that require
# xprtsec=tls (see /export/{appdata,share,media} below). tlshd is live on
# this server and all six k3s agents. The always-plaintext lines (HAOS .154,
# the fsid=0 root, tank-proxmox) carry no xprtsec and are unaffected.
nfs_tls_enabled: true
# This host is the NFS server, so tlshd needs the [authenticate.server]
# block (cert + private key) to answer the server-side TLS handshake. The
# k3s agents are clients only (nfs_tls_is_server defaults false) and, under
# xprtsec=tls, present no client cert — so they never load the wildcard
# private key. See nfs_tls role defaults for nfs_tls_is_server /
# nfs_tls_client_cert semantics.
nfs_tls_is_server: true

# NFS exports
nfs_exports:
  # NFSv4 pseudo-root (fsid=0): traversal-only, so read-only. NFSv4 clients
  # cross from here into whichever child exports below are explicitly listed
  # for them — no crossmnt needed for that. crossmnt is deliberately ABSENT:
  # per exports(5) it would implicitly export any child filesystem bound under
  # /export to every client line here WITH THIS LINE'S OPTIONS (plaintext, no
  # xprtsec), bypassing the per-child client lists and TLS requirements. Any
  # new dataset bound under /export MUST get its own explicit export entry.
  # The .154 (HAOS) line must stay: its fstab mounts /media relative to this
  # pseudo-root, and an explicit fsid=0 export disables nfsd's synthesized
  # pseudo-root entirely.
  - path: /export
    clients:
      - spec: "192.168.0.102/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.103/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.104/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.105/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.106/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.107/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.154/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.200/29"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      # k3s servers (.222/.223/.227) as explicit /32s. 192.168.0.220/29 masks to
      # .216-.223 and does NOT cover .227 (prec-01); with the explicit fsid=0
      # export disabling the synthesized pseudo-root, a server missing here can
      # not traverse into /export/k3s-etcd (off-node etcd snapshot copy).
      - spec: "192.168.0.222/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.223/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.227/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"

  # K3s/app RW exports
  # These directories use UID 1000 (eric) and GID 2000 (media) with setgid for shared access
  # all_squash + anonuid/anongid: Maps ALL clients (including root) to uid 1000/gid 2000
  # This allows LinuxServer.io containers to run chmod/chown during init
  #
  # Two CIDR blocks for k3s nodes:
  #   192.168.0.200/29 (.200-.207) = k3s agents
  #   192.168.0.220/29 = k3s servers .222/.223 (masks to .216-.223, NOT .227).
  #     Servers do not mount these RW exports; the off-node etcd export (the one
  #     servers DO use) and the fsid=0 pseudo-root list the three servers as /32s.
  # xprtsec=tls: REQUIRE — these k3s client lines reject plaintext mounts.
  # The k3s PVs mount with xprtsec=tls by hostname (pve-nas-01.esweiss.com,
  # so the *.esweiss.com cert verifies; an IP mount fails the handshake).
  # tlshd is live on the server + every k3s agent (group_vars/k3s.yml
  # nfs_tls_enabled), so the TLS path always completes.
  - path: /export/appdata
    bind_source: /mnt/ssd/appdata
    owner: 1000  # eric
    group: 2000  # media
    mode: "02775"  # rwxrwsr-x (setgid for group inheritance)
    xprtsec: "tls"
    clients:
      - spec: "192.168.0.200/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=11"
      - spec: "192.168.0.220/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=11"

  - path: /export/share
    bind_source: /mnt/tank/share
    owner: 1000  # eric
    group: 2000  # media
    mode: "02775"  # rwxrwsr-x (setgid for group inheritance)
    xprtsec: "tls"  # require TLS — see /export/appdata note above
    clients:
      - spec: "192.168.0.200/29"
        options: "rw,sync,no_subtree_check,root_squash,fsid=12"
      - spec: "192.168.0.220/29"
        options: "rw,sync,no_subtree_check,root_squash,fsid=12"

  # Unified media export (mergerfs mount - exposes only downloads/ and library/)
  # NFS clients mount this as /media, pods mount it as /media
  # k3s client lines require TLS (per-client xprtsec=tls — reject plaintext);
  # HAOS (.154) stays fully plaintext on its own client line. HAOS Supervisor
  # hardcodes its NFS mount options and the appliance ships no tlshd, so it can
  # never request xprtsec=tls — locking it down would break its media mount.
  # The k3s pods drive TLS by mounting with xprtsec=tls (by hostname, so the
  # *.esweiss.com cert verifies). xprtsec is per-client, so the require-TLS k3s
  # lines and the plaintext .154 line coexist on one export. See docs/24 (HAOS
  # NFS) and docs/07 (Transport Security).
  - path: /export/media
    bind_source: /mnt/media
    owner: 1000  # eric
    group: 2000  # media
    mode: "02775"  # rwxrwsr-x (setgid for group inheritance)
    clients:
      - spec: "192.168.0.200/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=20"
        xprtsec: "tls"
      - spec: "192.168.0.220/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=20"
        xprtsec: "tls"
      - spec: "192.168.0.154/32"  # HAOS — plaintext (no xprtsec; see comment above)
        options: "ro,sync,no_subtree_check,root_squash,fsid=20"

  # Off-node k3s etcd snapshot copies (docs/17). Servers only (.222/.223/.227),
  # xprtsec=tls REQUIRED, no_root_squash so each server's root copy script can
  # write its snapshots. Servers mount by hostname (pve-nas-01.esweiss.com) as
  # /k3s-etcd (pseudo-root-relative — the fsid=0 root is at /export). fsid=15
  # (unique). The three servers are listed as /32s in the fsid=0 pseudo-root
  # above so NFSv4 traversal into this child works (the /29 there omits .227).
  - path: /export/k3s-etcd
    bind_source: /mnt/ssd/k3s-etcd
    owner: 0  # root
    group: 0  # root
    mode: "0700"
    xprtsec: "tls"
    clients:
      - spec: "192.168.0.222/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=15"
      - spec: "192.168.0.223/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=15"
      - spec: "192.168.0.227/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=15"

  # Proxmox backup target (requires no_root_squash)
  - path: /export/tank-proxmox
    bind_source: /mnt/tank/proxmox
    owner: 1000  # eric
    group: 2000  # media
    mode: "02775"  # rwxrwsr-x (setgid for group inheritance)
    clients:
      - spec: "192.168.0.102/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"
      - spec: "192.168.0.103/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"
      - spec: "192.168.0.104/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"
      - spec: "192.168.0.105/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"
      - spec: "192.168.0.106/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"
      - spec: "192.168.0.107/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"

# Samba shares
# Use "nas" user with "media" group (GID 2000) for shared access
samba_shares:
  - name: share
    path: /mnt/tank/share
    comment: General file share
    browseable: true
    read_only: false
    guest_ok: false
    valid_users: "nas"
    force_group: "media"
    create_mask: "0664"
    directory_mask: "2775"  # setgid bit for group inheritance

  - name: media
    path: /mnt/tank/media
    comment: Media library
    browseable: true
    read_only: false
    guest_ok: false
    valid_users: "nas"
    force_group: "media"
    create_mask: "0664"
    directory_mask: "2775"  # setgid bit for group inheritance

# Media mover configuration
# Moves old files from NVMe (hot tier) to tank (cold tier) to free up fast storage
media_mover_enabled: true
media_mover_src: /mnt/nvme/media/library    # Hot tier library
media_mover_dst: /mnt/tank/media/library    # Cold tier library
# 04:15, NOT 02:00: 02:00 already carries smartd's daily short tests, and the
# cluster-wide vzdump run (pve_vzdump_jobs below, 03:30 daily) writes into
# tank/proxmox until ~03:48 — stacking the nvme->tank rsync on either thrashed
# the NAS every night. 04:15 clears the observed vzdump tail while still
# finishing well before the 05:00 archive replication snapshot.
media_mover_schedule: "*-*-* 04:15:00"

# Proxmox storage configuration — reconciled by the proxmox_backup role
# (storage.yml / site.yml NAS play). Codified target: mount by HOSTNAME with
# xprtsec=tls (the *.esweiss.com cert has no IP SAN, so an IP mount fails the
# TLS handshake). The live entry still carries the legacy plaintext IP; server
# is create-fixed in Proxmox, so the role fails loud until the one-time
# migration (outside a backup window):
#   ssh pve-nas-01 "sudo pvesh delete /storage/tank-proxmox"  # config only, data untouched
# then re-run the role. Prerequisite: tlshd on every PVE host
# (nfs_tls_enabled in group_vars/proxmox.yml).
pve_storage:
  - id: tank-proxmox
    type: nfs
    server: pve-nas-01.esweiss.com
    export: /tank-proxmox
    # Synced from the live storage.cfg. content is a mutable property, so the
    # role updates it on drift (unlike server/export/path, which are
    # create-fixed and fail loud).
    content: "snippets,backup,vztmpl,iso"
    path: /mnt/pve/tank-proxmox
    options: "vers=4.2,xprtsec=tls"

# Proxmox backup job (jobs.cfg via /cluster/backup) — reconciled by the
# proxmox_backup role. IMPORTANT: `id` must match the live jobs.cfg id or the
# role CREATES A SECOND job (check with: pvesh get /cluster/backup
# --output-format json); GUI-created ids look like backup-xxxxxxxx-xxxx.
# Schedule is a systemd-style calendar event (not cron). Adopted from the live
# GUI job: 03:30 daily, all guests, keep-daily=7/weekly=4/monthly=6, routed
# through the modern notification-system (mailnotification/mailto are the
# deprecated pre-8.x keys and are no longer set).
# The job's `script` key publishes vzdump_backup_last_run_success +
# _last_success_timestamp_seconds (the series the VzdumpBackupFailed/Stale
# alerts consume). The hookscript is deployed to every Proxmox host by
# node_exporter_host — this is a cluster-wide `all` job, so it runs (and invokes
# the hook) on each node for that node's local guests, not just here.
pve_vzdump_jobs:
  - id: backup-10f33360-a177
    storage: tank-proxmox
    schedule: "03:30"
    mode: snapshot
    compress: zstd
    all: true
    # bwlimit caps per-node backup I/O (KiB/s). Because this is a cluster-wide
    # `all` job it fires on EVERY node at 03:30 and they all write their guests
    # to THIS host's tank-proxmox NFS target at once. Unthrottled, that combined
    # write saturated the (spinning) tank pool and froze pve-nas-01 on 2026-07-13
    # (I/O-pressure PSI 0.59, load 26, KVM guest page-fault hang, ~12h outage).
    # 30720 KiB/s = 30 MiB/s per node keeps the aggregate (<=6 nodes -> ~180 MB/s)
    # comfortably under saturation; each host's backup just runs proportionally
    # longer (fine at 03:30). Raise only if the ProxmoxHost I/O-pressure alerts
    # stay quiet through a full backup window.
    bwlimit: 30720
    prune_backups: "keep-daily=7,keep-weekly=4,keep-monthly=6"
    notification_mode: notification-system
    enabled: true
    script: /usr/local/bin/vzdump-metrics-hook.sh

# SMART monitoring
smartd_enabled: true
smartd_tank_disks:
  - /dev/disk/by-id/ata-ST22000NM000C-3WC103_ZXA18WD1
  - /dev/disk/by-id/ata-ST22000NM000C-3WC103_ZXA0RDDB
  - /dev/disk/by-id/ata-ST22000NM000C-3WC103_ZXA0EJDZ
  - /dev/disk/by-id/ata-ST22000NM000C-3WC103_ZXA0ZZ1R
  - /dev/disk/by-id/ata-ST22000NM000C-3WC103_ZXA0HR34
  - /dev/disk/by-id/ata-ST22000NM000C-3WC103_ZXA0FEGJ

smartd_ssd_disks:
  - /dev/disk/by-id/ata-Samsung_SSD_870_EVO_4TB_S757NL0Y902062Z
  - /dev/disk/by-id/ata-Samsung_SSD_870_EVO_4TB_S757NL0Y902052X
  - /dev/disk/by-id/ata-Samsung_SSD_870_EVO_4TB_S757NL0Y901976N

smartd_nvme_disks:
  - /dev/disk/by-id/nvme-Samsung_SSD_990_PRO_4TB_S7KGNU0YA04137V
  - /dev/disk/by-id/nvme-CT2000P5PSSD8_2334429F310B
  - /dev/disk/by-id/nvme-CT2000P5PSSD8_2334429F32EE
  - /dev/disk/by-id/nvme-Samsung_SSD_990_PRO_with_Heatsink_4TB_S7DSNJ0Y608388N

smartd_archive_disks:
