---
# pve-nas-01 specific configuration
# Primary NAS/storage server running Proxmox VE

# ZFS native encryption — boot-time passphrase fetch from 1Password Connect.
# tank and ssd are encrypted (appdata, databases, backups, personal share,
# VM disks). The media domain is NOT encrypted by design: tank/media (the
# ~14.5T Plex library) and all of nvme (hot-tier media, transcode scratch,
# ephemeral VM images). Media is non-sensitive, the only path to encrypt the
# 14.5T tier is a send/recv that has destabilized this host, and AES would
# tax the streaming/transcode hot path — see docs/32 "What is encrypted,
# what isn't". archive is a plaintext raidz1 pool; its sensitive
# replicated datasets are encrypted at rest via raw `zfs send -w` streams
# from the encrypted tank/ssd sources (docs/32). local-ssd on the
# compute hosts is intentionally NOT encrypted — see docs/32 "What is
# encrypted, what isn't" for the chicken-and-egg rationale (k3s VMs live on
# local-ssd; Connect runs in k3s; encrypting it deadlocks cold boot). The
# control there is the drive-wipe SOP in docs/15-credential-rotation.md.
#
# Each listed pool must already have at least one encrypted dataset
# (docs/32 §2a) — the role asserts this and refuses to activate
# zfs-load-key@<pool>.service on a fully plaintext pool (the unit would
# fail at boot and drag zfs-mount.service down via RequiredBy=). To stage
# before encryption, leave this list empty.
zfs_encryption_pools:
  - name: tank
    item: "ZFS Pool tank Passphrase"
    field: passphrase
  - name: ssd
    item: "ZFS Pool ssd Passphrase"
    field: passphrase

# Proxmox guests on this host whose disks live on the encrypted ssd pool.
# pve-start-encrypted-guests.service starts these AFTER zfs-mount-encrypted
# unlocks+mounts ssd (they're onboot=0 in hosts.yml/plex.yml). VM 222
# (srv-nas-01, etcd) is deliberately ABSENT — it has no encrypted disk and
# starts early on its normal onboot path so cluster quorum never waits on
# this NAS's unlock.
#   202 = k3s-agt-nas-01 (4 data zvols scsi1-4 on ssd: authentik/mealie pg,
#         prometheus, loki)
#   153 = gitlab (scsi0 + repos zvol on ssd)
#   156 = nextcloud (scsi0 + app/postgres zvols on ssd; data zvol on encrypted
#         tank/nextcloud-data)
#   157 = immich (scsi0 + app/postgres zvols on ssd; data zvol on encrypted
#         tank/immich-data)
#   155 = windows (scsi0 root + EFI/TPM state on ssd). It idles on ~13G it
#         cannot be reliably ballooned out of, so it is ordered last.
#
#         NOTE the mechanism, which is why membership of THIS list — not
#         onboot — is what makes a guest start at boot: every guest here stays
#         onboot=0 (VMs in hosts.yml, the plex LXC in host_vars/plex.yml as
#         proxmox_lxc_onboot), because pve-guests runs before
#         zfs-mount-encrypted has unlocked the ssd pool. onboot=1 would fail
#         against a locked pool; this list is the working equivalent, applied
#         after the unlock. See docs/32, 39.
#   152 = plex LXC (mp0 /config on ssd)
# Order mirrors the per-guest startup order (proxmox_startup_order on VMs,
# proxmox_lxc_startup_order on the LXC): the k3s agent (202, order 40) before the
# gitlab app (153, order 50), nextcloud (156, order 55), immich (157, order 56)
# and windows (155, order 60); pve-start-encrypted-guests.sh starts VMs in this
# list order, then CTs. 157 (immich) has disks on both the ssd pool and
# tank/immich-data — both unlocked by zfs-mount-encrypted before this cohort
# starts. Windows is LAST: it is the least critical guest here and the slowest to
# settle, so it claims its memory after the services have theirs.
zfs_encryption_guest_vmids: [202, 153, 156, 157, 155]
zfs_encryption_guest_ctids: [152]

# NFS bind sources that live on ENCRYPTED datasets. nas_storage anchors their
# /export/* fstab binds (and the nfs-server drop-in) on the late
# zfs-mount-encrypted.service rather than the early zfs-mount.service, so the
# binds capture the real (unlocked) datasets, never an empty mountpoint. All
# four ZFS-backed exports (appdata, share, tank/proxmox, k3s-etcd) are encrypted;
# /mnt/media (mergerfs, plaintext) is not ZFS-backed and keeps a plain bind.
nas_storage_encrypted_bind_sources:
  - /mnt/ssd/appdata
  - /mnt/tank/share
  - /mnt/tank/proxmox
  - /mnt/ssd/k3s-etcd  # off-node k3s etcd snapshot copies (encrypted, ssd pool)
  # Offsite-eligible logical-dump landing zone, now split into per-app exports
  # (see nas_storage_exports below). Each is a SUBDIR of tank/backups (aes-256-gcm): the
  # exports set bind_source_check: /mnt/tank/backups so the mounted-dataset guard
  # checks the parent dataset, and these entries anchor each bind on the late
  # zfs-mount-encrypted.service.
  - /mnt/tank/backups/apps/authentik
  - /mnt/tank/backups/apps/mealie
  - /mnt/tank/backups/apps/gitlab
  - /mnt/tank/backups/apps/immich
  - /mnt/tank/backups/apps/nextcloud
  - /mnt/tank/backups/apps/home-assistant

# ZFS pool configuration
nas_storage_zfs_pools:
  - name: tank
    datasets:
      - name: tank/media
        properties:
          mountpoint: /mnt/tank/media
          atime: "off"
          compression: zstd
          recordsize: 1M
          acltype: posix
          com.sun:auto-snapshot: "true"
      - name: tank/share
        properties:
          mountpoint: /mnt/tank/share
          atime: "off"
          compression: zstd
          recordsize: 128K
          acltype: posix
          com.sun:auto-snapshot: "true"
      - name: tank/proxmox
        properties:
          mountpoint: /mnt/tank/proxmox
          atime: "off"
          compression: zstd
          com.sun:auto-snapshot: "false"
      - name: tank/pve
        properties:
          mountpoint: /mnt/tank/pve
          atime: "off"
          compression: zstd
          com.sun:auto-snapshot: "false"
      # Nextcloud bulk user data. Pre-existing encryption root (created manually
      # like ssd/k3s-etcd — nas_storage does not create datasets), already in the
      # nas_storage_archive_backup_sources (raw-encrypted recursive send). The 2T
      # sparse data zvol tank/nextcloud-data/disk (created by proxmox_vm for VM 156)
      # is a CHILD and inherits it. The properties below are declared to MATCH
      # the live dataset exactly (mountpoint/compression/encryption verified on
      # the NAS) so nas_storage never mutates it — the encryption property is a
      # guard: `zfs set encryption` errors loudly if the dataset were ever
      # recreated plaintext.
      - name: tank/nextcloud-data
        properties:
          mountpoint: /mnt/tank/nextcloud-data
          compression: zstd
          encryption: aes-256-gcm

  - name: ssd
    datasets:
      - name: ssd/appdata
        properties:
          mountpoint: /mnt/ssd/appdata
          atime: "off"
          compression: lz4
          com.sun:auto-snapshot: "true"
      # Prometheus's TSDB has its own retention (365d / 140 GiB max); the
      # zfs-auto-snapshot frequent/hourly/daily/weekly/monthly cadence held
      # ~77 GiB of stale chunks on top of 53 GiB of live data with no
      # operational benefit. Disable on this dataset (zvol child inherits).
      - name: ssd/appdata/prometheus
        properties:
          com.sun:auto-snapshot: "false"
      # Loki has its own retention (loki.compactor.retention_enabled);
      # zfs-auto-snapshot adds no value and grows the zvol footprint.
      - name: ssd/appdata/loki
        properties:
          com.sun:auto-snapshot: "false"
      # mealie/postgres is a zvol (proxmox_vm `zfs create -p -V ssd/appdata/
      # mealie/postgres`), so the auto-created ssd/appdata/mealie parent would
      # mount over /mnt/ssd/appdata/mealie and shadow the /appdata/mealie dir
      # the recipes-appdata-mealie NFS PV serves (mealie's /app/data). canmount
      # =off keeps it unmounted so the NFS bind exports the real directory; the
      # nas_storage appdata shadowing-guard asserts this holds.
      - name: ssd/appdata/mealie
        properties:
          canmount: "off"
      # Off-node etcd snapshot copies from the k3s servers (docs/17). Small, lz4,
      # no auto-snapshot (snapshotting etcd snapshots is pointless). Its OWN
      # encryption root — the ssd pool root is plaintext and children do NOT
      # inherit encryption (docs/32), so it must be created with explicit
      # encryption flags. CREATE MANUALLY FIRST — nas_storage does not create
      # datasets (hard-fails DATASET_MISSING on the next NAS deploy):
      #   zfs create -o encryption=aes-256-gcm -o keyformat=passphrase \
      #     -o keylocation=prompt -o mountpoint=/mnt/ssd/k3s-etcd ssd/k3s-etcd
      # (passphrase from 1P "ZFS Pool ssd Passphrase"; name == encryptionroot so
      # the zfs-load-key@ssd boot loop unlocks it automatically). The
      # encryption=aes-256-gcm property below makes nas_storage fail loudly if the
      # dataset was accidentally created plaintext (zfs set encryption errors).
      - name: ssd/k3s-etcd
        properties:
          mountpoint: /mnt/ssd/k3s-etcd
          atime: "off"
          compression: lz4
          com.sun:auto-snapshot: "false"
          encryption: aes-256-gcm

  - name: nvme
    datasets:
      - name: nvme/media
        properties:
          mountpoint: /mnt/nvme/media
          atime: "off"
          compression: zstd
          recordsize: 1M
          com.sun:auto-snapshot: "true"

  # The archive pool's datasets (archive/proxmox, archive/backups, ...) are
  # owned by archive-backupctl, which locks them to mountpoint=inherit,
  # canmount=off, readonly=on as `zfs receive -F` targets. Managing them here
  # too would unlock them on every deploy and fight the replication lockdown,
  # so the pool carries no datasets entry — only the scrub timer applies.
  - name: archive
    datasets: []

# ZFS scrub timer
nas_storage_zfs_scrub_enabled: true
nas_storage_zfs_scrub_schedule: "monthly"

# Per-app /config directories created under ssd/appdata (1000:2000, 0775) for
# the NFS-backed PVs and the LXC bind mounts.
nas_storage_appdata_dirs:
  - grafana
  - sonarr
  - radarr
  - lidarr
  - prowlarr
  - qbittorrent
  - nzbget
  - pulsarr
  - mealie
  - bar-assistant
  - wg-easy
  - hermes
  - hindsight
  - homarr

# Logical dumps whose freshness/size is tracked as node_exporter textfile
# metrics (BackupArtifact* alerts). name = the tank/backups/apps subdir.
#
# `companions:` are the files an artefact cannot be RESTORED without but which
# are deliberately outside its `pattern:` — no freshness/size arm sees them, so
# they get their own BackupArtifactCompanionMissing arm. Each entry is a glob
# matched at depth 1 inside the app's landing dir. Declaring none is a claim
# that the app's dump is self-contained; check-backup-artifact-apps.py fails if
# the alert exists while nothing in this list declares a companion, so the rule
# can never be shipped inert.
nas_storage_backup_artifact_apps:
  - name: authentik
    pattern: "authentik-*.sql.gz"
  - name: mealie
    pattern: "mealie-*.sql.gz"
  - name: gitlab
    pattern: "*_gitlab_backup.tar"
    # gitlab-backup EXCLUDES both of these, and without them the tarball
    # restores to an instance that cannot decrypt its own CI variables, 2FA
    # secrets or runner tokens. gitlab-backup-run.sh copies them next to the
    # tarball on success (`cp /etc/gitlab/gitlab-secrets.json /etc/gitlab/gitlab.rb
    # "${BACKUP_PATH}/"`), and BACKUP_PATH is /mnt/backups-offsite on .153 —
    # the NFS mount of pve-nas-01:/backups-apps/gitlab, i.e. this very dir.
    # This is the NAS-side witness for what GitLabBackupSecretsMissing asserts
    # from inside the VM: that alert believes the VM's own metrics, this one
    # believes the landing zone.
    companions:
      - "gitlab-secrets.json"
      - "gitlab.rb"
  - name: immich
    pattern: "immich-*.sql.gz"
  - name: nextcloud
    pattern: "nextcloud-db-*.sql.gz"
  - name: home-assistant
    pattern: "*.tar"
  - name: pve-cluster
    pattern: "etc-pve-*.tar.gz"

# Nightly raw-encrypted replication of the sensitive datasets to the archive
# pool (docs/42). Every source is replicated RECURSIVELY, so children ride
# along; each lands at archive/<basename>, which must therefore be unique.
# ssd/pve (the GitLab VM disks) is deliberately absent — those are already in
# the nightly vzdump this list replicates via tank/proxmox. ssd/k3s-etcd IS
# here so the etcd DR chain closes (local snapshots + NAS off-node + archive +
# B2). Each root must be a filesystem; a top-level zvol is rejected on receive.
nas_storage_archive_backup_enabled: true
nas_storage_archive_backup_pool: archive
nas_storage_archive_backup_vzdump_target: tank/proxmox
nas_storage_archive_backup_sources:
  - tank/share
  - tank/backups
  - tank/nextcloud-data
  - tank/proxmox
  - tank/immich-data
  - ssd/appdata
  - ssd/databases
  - ssd/k3s-etcd

# ZFS ARC cap (bytes) = 16 GiB.
#
# The cap is a guard, not a performance target: uncapped, ARC takes ~half of RAM
# (~62 GiB on this host), and a rebuild must never silently revert to that and
# squeeze the guests.
#
# The measured working set is far below the ceiling — ARC runs a 98% hit ratio on
# a ~2.5 GiB hot set, almost entirely metadata, since the pools are
# large-but-cold (media is streamed once, not re-cached). 16 GiB therefore leaves
# room for the metadata cache to grow as the pools fill and as guests are added,
# rather than pinning it just above today's working set. ARC self-tunes downward
# under pressure and is instantly reclaimable, so unused ceiling costs nothing.
#
# Rendered into /etc/modprobe.d/zfs.conf by nas_storage (with an update-initramfs
# handler so it applies at early boot).
nas_storage_zfs_arc_max_bytes: 17179869184

# Nightly /etc/pve archive into the offsite-eligible landing zone. pmxcfs is
# cluster-shared, so archiving it from this one node covers the whole cluster —
# and this is the node whose landing zone rides archsync into restic B2. Without
# it, user.cfg (users/ACLs/API tokens), corosync.conf and priv/ (cluster CA +
# node certs + authkey) have no backup at ANY tier: vzdump captures guests, not
# the cluster filesystem. docs/17.
nas_storage_pve_cluster_backup_enabled: true

# Daily swap reset. Paired with vm.swappiness=1 (nic_tuning) + the ARC cap above:
# those keep steady-state swap ~0, but a real peak (deploys/backups/ML) can still
# swap, and that swap never self-clears. This timer resets it each night, guarded
# to abort if a swapoff would risk OOM (nas_storage/templates/swap-clean.sh.j2).
# Only this host runs it (the compute hosts have headroom + default swappiness).
#
# It is a backstop: on a normal night it finds ~0 swap and does nothing, which
# costs nothing. Retire it only if the guest-shutdown escalation below goes
# unused across a few months of real peaks.
nas_storage_swap_clean_enabled: true
# 07:00 — deliberately AFTER the NAS's own overnight jobs (media-mover 06:00,
# archive-backup 06:30) so it reclaims the swap THEY caused rather than running
# before/during them. If those ever run long, push this later.
nas_storage_swap_clean_schedule: "*-*-* 07:00:00"
# Recovery escalation: when the ARC-shrink headroom alone can't cover the swap,
# the reset gracefully shuts these guests down (in order, only as many as needed
# to reach the required headroom), does the swapoff, then restarts every guest it
# stopped (guaranteed by an EXIT trap, even on failure). "vmid:name:timeout(s)".
# immich first (~5.5G, smallest/least-critical/fastest restart) usually suffices
# on its own, so GitLab (heaviest, slowest) is only stopped if immich isn't
# enough. All are graceful only (qm shutdown) — a guest that won't stop in its
# timeout aborts the reclaim rather than being force-killed (Postgres-safe). With
# the right-sized k3s VMs (hosts.yml) the no-downtime ARC-shrink path covers the
# common case, so a guest stop is the rare-overflow exception, not a nightly event.
nas_storage_swap_clean_stop_guests:
  - "157:immich:120"
  - "153:gitlab:300"
  - "156:nextcloud:120"

# MergerFS configuration
# Merges NVMe (hot tier) + tank (cold tier) media into unified /mnt/media
# Only downloads/ and library/ are visible - tank's other directories are NOT exposed
nas_storage_mergerfs_mounts:
  - name: media
    sources:
      - /mnt/nvme/media          # Hot tier
      - /mnt/tank/media          # Cold tier (only tank/media, not entire tank)
    target: /mnt/media
    options:
      - defaults
      - allow_other
      - default_permissions
      - use_ino
      - inodecalc=path-hash      # Required for NFS: provides stable inodes for FUSE
      - noforget                 # Required for NFS: prevents ESTALE (stale file handle) errors
      - cache.files=off
      - dropcacheonclose=true
      - category.create=ff       # New files go to first branch (nvme)
      - category.action=epall    # Actions use all branches
      - moveonenospc=true        # Move to next branch when nvme fills
      - minfreespace=100G        # Keep 100G free on nvme
    systemd_requires:
      - /mnt/nvme/media
      - /mnt/tank/media

# NFSv4-over-TLS server: install + start tlshd so the kernel can answer
# the server-side TLS handshake for the client lines that require xprtsec=tls —
# the k3s exports (/export/{appdata,share,media}) AND the app-VM backup exports
# (/export/backups-apps/{gitlab,immich,nextcloud} .153/.157/.156, whose VMs now
# run tlshd via the nfs_tls role in their deploy plays). tlshd is live on this
# server, all six k3s agents, and those three app VMs. The always-plaintext lines
# (HAOS .154 backups-apps + media, the fsid=0 root, tank-proxmox) carry no
# xprtsec and are unaffected.
nfs_tls_enabled: true
# This host is the NFS server, so tlshd needs the [authenticate.server]
# block (cert + private key) to answer the server-side TLS handshake. The
# k3s agents are clients only (nfs_tls_is_server defaults false) and, under
# xprtsec=tls, present no client cert — so they never load the wildcard
# private key. See nfs_tls role defaults for nfs_tls_is_server /
# nfs_tls_client_cert semantics.
nfs_tls_is_server: true

# NFS exports
nas_storage_exports:
  # NFSv4 pseudo-root (fsid=0): traversal-only, so read-only. NFSv4 clients
  # cross from here into whichever child exports below are explicitly listed
  # for them — no crossmnt needed for that. crossmnt is deliberately ABSENT:
  # per exports(5) it would implicitly export any child filesystem bound under
  # /export to every client line here WITH THIS LINE'S OPTIONS (plaintext, no
  # xprtsec), bypassing the per-child client lists and TLS requirements. Any
  # new dataset bound under /export MUST get its own explicit export entry.
  # The .154 (HAOS) line must stay: its fstab mounts /media relative to this
  # pseudo-root, and an explicit fsid=0 export disables nfsd's synthesized
  # pseudo-root entirely.
  - path: /export
    clients:
      - spec: "192.168.0.102/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.103/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.104/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.105/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.106/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.107/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.154/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      # App VMs (.153 gitlab, .156 nextcloud, .157 immich) traverse the fsid=0
      # pseudo-root into their OWN /export/backups-apps/<app> export (each scoped
      # to just that VM); .154 (HAOS, above) traverses into backups-apps/
      # home-assistant. /export/backups-apps itself is a plain dir on this root fs,
      # so pseudo-root traversal reaches each per-app export without exporting the
      # parent (which is what isolates the apps from each other).
      - spec: "192.168.0.153/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.156/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.157/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.200/29"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      # k3s servers (.222/.223/.227) as explicit /32s. 192.168.0.220/29 masks to
      # .216-.223 and does NOT cover .227 (prec-01); with the explicit fsid=0
      # export disabling the synthesized pseudo-root, a server missing here can
      # not traverse into /export/k3s-etcd (off-node etcd snapshot copy).
      - spec: "192.168.0.222/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.223/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.227/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"

  # K3s/app RW exports
  # These directories use UID 1000 (eric) and GID 2000 (media) with setgid for shared access
  # all_squash + anonuid/anongid: Maps ALL clients (including root) to uid 1000/gid 2000
  # This allows LinuxServer.io containers to run chmod/chown during init
  #
  # k3s node client blocks:
  #   192.168.0.200/29 (.200-.207) = k3s agents
  #   192.168.0.220/29 = k3s servers .222/.223 (masks to .216-.223, NOT .227)
  #   192.168.0.227/32 = k3s-srv-prec-01, which sits outside both /29 blocks.
  #     Every k3s RW export lists all three. The server taints keep normal pods
  #     off the servers today, but pod-mounted PVs (e.g. the pg-dump CronJobs)
  #     must not silently lose their mount if a pod ever lands there — backup
  #     reliability cannot hinge on taint config.
  # xprtsec=tls: REQUIRE — these k3s client lines reject plaintext mounts.
  # The k3s PVs mount with xprtsec=tls by hostname (pve-nas-01.esweiss.com,
  # so the *.esweiss.com cert verifies; an IP mount fails the handshake).
  # tlshd is live on the server + every k3s agent (group_vars/k3s.yml
  # nfs_tls_enabled), so the TLS path always completes.
  - path: /export/appdata
    bind_source: /mnt/ssd/appdata
    owner: 1000  # eric
    group: 2000  # media
    mode: "02775"  # rwxrwsr-x (setgid for group inheritance)
    xprtsec: "tls"
    clients:
      - spec: "192.168.0.200/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=11"
      - spec: "192.168.0.220/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=11"
      - spec: "192.168.0.227/32"  # k3s-srv-prec-01 — outside both /29 blocks
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=11"

  - path: /export/share
    bind_source: /mnt/tank/share
    owner: 1000  # eric
    group: 2000  # media
    mode: "02775"  # rwxrwsr-x (setgid for group inheritance)
    xprtsec: "tls"  # require TLS — see /export/appdata note above
    clients:
      - spec: "192.168.0.200/29"
        options: "rw,sync,no_subtree_check,root_squash,fsid=12"
      - spec: "192.168.0.220/29"
        options: "rw,sync,no_subtree_check,root_squash,fsid=12"
      - spec: "192.168.0.227/32"  # k3s-srv-prec-01 — outside both /29 blocks
        options: "rw,sync,no_subtree_check,root_squash,fsid=12"

  # Unified media export (mergerfs mount - exposes only downloads/ and library/)
  # NFS clients mount this as /media, pods mount it as /media
  # k3s client lines require TLS (per-client xprtsec=tls — reject plaintext);
  # HAOS (.154) stays fully plaintext on its own client line. HAOS Supervisor
  # hardcodes its NFS mount options and the appliance ships no tlshd, so it can
  # never request xprtsec=tls — locking it down would break its media mount.
  # The k3s pods drive TLS by mounting with xprtsec=tls (by hostname, so the
  # *.esweiss.com cert verifies). xprtsec is per-client, so the require-TLS k3s
  # lines and the plaintext .154 line coexist on one export. See docs/24 (HAOS
  # NFS) and docs/07 (Transport Security).
  - path: /export/media
    bind_source: /mnt/media
    owner: 1000  # eric
    group: 2000  # media
    mode: "02775"  # rwxrwsr-x (setgid for group inheritance)
    clients:
      - spec: "192.168.0.200/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=20"
        xprtsec: "tls"
      - spec: "192.168.0.220/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=20"
        xprtsec: "tls"
      - spec: "192.168.0.227/32"  # k3s-srv-prec-01 — outside both /29 blocks
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=20"
        xprtsec: "tls"
      - spec: "192.168.0.154/32"  # HAOS — plaintext (no xprtsec; see comment above)
        options: "ro,sync,no_subtree_check,root_squash,fsid=20"

  # Off-node k3s etcd snapshot copies (docs/17). Servers only (.222/.223/.227),
  # xprtsec=tls REQUIRED, no_root_squash so each server's root copy script can
  # write its snapshots. Servers mount by hostname (pve-nas-01.esweiss.com) as
  # /k3s-etcd (pseudo-root-relative — the fsid=0 root is at /export). fsid=15
  # (unique). The three servers are listed as /32s in the fsid=0 pseudo-root
  # above so NFSv4 traversal into this child works (the /29 there omits .227).
  - path: /export/k3s-etcd
    bind_source: /mnt/ssd/k3s-etcd
    owner: 0  # root
    group: 0  # root
    mode: "0700"
    xprtsec: "tls"
    clients:
      - spec: "192.168.0.222/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=15"
      - spec: "192.168.0.223/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=15"
      - spec: "192.168.0.227/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=15"

  # Offsite-eligible logical-dump landing zone (tank/backups/apps -> B2), split
  # into PER-APP exports each scoped to ONLY its writer (was one shared export
  # every backup client could read — a cross-app exposure). Each subdir binds
  # under /export/backups-apps/<app>; bind_source_check points the mounted-dataset
  # guard at the parent tank/backups dataset (the subdir is never a mountpoint).
  # all_squash,anonuid=1000,anongid=2000 so each client write lands 1000:2000
  # (matching the 02775 subdirs) regardless of in-guest UID (git 998, postgres,
  # HAOS root, etc.). Every flow now runs OVER TLS except HAOS (.154), the one
  # appliance that cannot speak xprtsec=tls (documented exception, docs/24) — it
  # is also the only NON-co-resident backup client (HAOS is a separate VM). The
  # restic offsite walk reads tank/backups LOCALLY, so it needs no export here.
  # fsids are unique per export (11/12/14/15/20 are taken by other exports).
  #
  # authentik + mealie: the k3s pg-dump PVs (agents .200/29 + servers .220/29),
  # require TLS (mount path=/backups-apps/<app> by hostname with xprtsec=tls).
  - path: /export/backups-apps/authentik
    bind_source: /mnt/tank/backups/apps/authentik
    bind_source_check: /mnt/tank/backups
    owner: 1000  # eric
    group: 2000  # media
    mode: "02775"  # rwxrwsr-x (setgid for group inheritance)
    xprtsec: "tls"
    clients:
      - spec: "192.168.0.200/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=16"
      - spec: "192.168.0.220/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=16"
      - spec: "192.168.0.227/32"  # k3s-srv-prec-01 — outside both /29 blocks
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=16"

  - path: /export/backups-apps/mealie
    bind_source: /mnt/tank/backups/apps/mealie
    bind_source_check: /mnt/tank/backups
    owner: 1000  # eric
    group: 2000  # media
    mode: "02775"  # rwxrwsr-x (setgid for group inheritance)
    xprtsec: "tls"
    clients:
      - spec: "192.168.0.200/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=17"
      - spec: "192.168.0.220/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=17"
      - spec: "192.168.0.227/32"  # k3s-srv-prec-01 — outside both /29 blocks
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=17"

  # gitlab (.153) — now REQUIRES TLS on the wire (VM runs tlshd via the nfs_tls
  # role; mounts /backups-apps/gitlab by hostname with xprtsec=tls).
  - path: /export/backups-apps/gitlab
    bind_source: /mnt/tank/backups/apps/gitlab
    bind_source_check: /mnt/tank/backups
    owner: 1000  # eric
    group: 2000  # media
    mode: "02775"  # rwxrwsr-x (setgid for group inheritance)
    xprtsec: "tls"
    clients:
      - spec: "192.168.0.153/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=18"

  # immich (.157) — TLS on the wire (VM runs tlshd via nfs_tls).
  - path: /export/backups-apps/immich
    bind_source: /mnt/tank/backups/apps/immich
    bind_source_check: /mnt/tank/backups
    owner: 1000  # eric
    group: 2000  # media
    mode: "02775"  # rwxrwsr-x (setgid for group inheritance)
    xprtsec: "tls"
    clients:
      - spec: "192.168.0.157/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=19"

  # nextcloud (.156) — TLS on the wire (VM runs tlshd via nfs_tls).
  - path: /export/backups-apps/nextcloud
    bind_source: /mnt/tank/backups/apps/nextcloud
    bind_source_check: /mnt/tank/backups
    owner: 1000  # eric
    group: 2000  # media
    mode: "02775"  # rwxrwsr-x (setgid for group inheritance)
    xprtsec: "tls"
    clients:
      - spec: "192.168.0.156/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=21"

  # home-assistant (.154) — PLAINTEXT. HAOS Supervisor hardcodes its NFS mount and
  # ships no tlshd, so it can never request xprtsec=tls; it is the one plaintext
  # -on-wire backup flow (and the only non-co-resident one). Native scheduled
  # backup target — one-time HA UI step (docs/24).
  - path: /export/backups-apps/home-assistant
    bind_source: /mnt/tank/backups/apps/home-assistant
    bind_source_check: /mnt/tank/backups
    owner: 1000  # eric
    group: 2000  # media
    mode: "02775"  # rwxrwsr-x (setgid for group inheritance)
    clients:
      - spec: "192.168.0.154/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=22"

  # Proxmox backup target (requires no_root_squash)
  - path: /export/tank-proxmox
    bind_source: /mnt/tank/proxmox
    owner: 1000  # eric
    group: 2000  # media
    mode: "02775"  # rwxrwsr-x (setgid for group inheritance)
    clients:
      - spec: "192.168.0.102/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"
      - spec: "192.168.0.103/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"
      - spec: "192.168.0.104/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"
      - spec: "192.168.0.105/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"
      - spec: "192.168.0.106/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"
      - spec: "192.168.0.107/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"

# Samba shares
# Use "nas" user with "media" group (GID 2000) for shared access
nas_storage_samba_shares:
  - name: share
    path: /mnt/tank/share
    comment: General file share
    browseable: true
    read_only: false
    guest_ok: false
    valid_users: "nas"
    force_group: "media"
    create_mask: "0664"
    directory_mask: "2775"  # setgid bit for group inheritance

  - name: media
    path: /mnt/tank/media
    comment: Media library
    browseable: true
    read_only: false
    guest_ok: false
    valid_users: "nas"
    force_group: "media"
    create_mask: "0664"
    directory_mask: "2775"  # setgid bit for group inheritance

# Media mover configuration
# Moves old files from NVMe (hot tier) to tank (cold tier) to free up fast storage
nas_storage_media_mover_enabled: true
nas_storage_media_mover_src: /mnt/nvme/media/library    # Hot tier library
nas_storage_media_mover_dst: /mnt/tank/media/library    # Cold tier library
# 06:00: after the cluster-wide vzdump window, before the 06:30 archive
# replication. vzdump (proxmox_backup_vzdump_jobs below, 03:30 daily) writes into
# tank/proxmox until ~05:45 now that bwlimit throttles it (measured
# 2026-07-14; unthrottled it ended ~03:48), and 02:00 carries smartd's daily
# short tests — stacking the nvme->tank rsync on either thrashed the NAS
# every night. The mover normally finishes in minutes, so it clears before
# the archive snapshot; even when it overruns, they touch disjoint datasets
# (tank/media is not replicated to archive) and both are I/O-deprioritized.
nas_storage_media_mover_schedule: "*-*-* 06:00:00"

# Proxmox storage configuration — reconciled by the proxmox_backup role
# (storage.yml / site.yml NAS play). Mounted by HOSTNAME with xprtsec=tls
# (the *.esweiss.com cert has no IP SAN, so an IP mount fails the TLS
# handshake); the one-time migration off the legacy plaintext-IP entry is
# complete and the live storage.cfg matches this block. server/export/path
# are create-fixed in Proxmox — the role fails loud on drift there.
# Prerequisite: tlshd on every PVE host (nfs_tls_enabled in
# group_vars/proxmox.yml).
proxmox_backup_storage:
  - id: tank-proxmox
    type: nfs
    server: pve-nas-01.esweiss.com
    export: /tank-proxmox
    # Synced from the live storage.cfg. content is a mutable property, so the
    # role updates it on drift (unlike server/export/path, which are
    # create-fixed and fail loud).
    content: "snippets,backup,vztmpl,iso"
    path: /mnt/pve/tank-proxmox
    options: "vers=4.2,xprtsec=tls"

# Proxmox backup job (jobs.cfg via /cluster/backup) — reconciled by the
# proxmox_backup role. IMPORTANT: `id` must match the live jobs.cfg id or the
# role CREATES A SECOND job (check with: pvesh get /cluster/backup
# --output-format json); GUI-created ids look like backup-xxxxxxxx-xxxx.
# Schedule is a systemd-style calendar event (not cron). Adopted from the live
# GUI job: 03:30 daily, all guests, keep-daily=7/weekly=4/monthly=6, routed
# through the modern notification-system (mailnotification/mailto are the
# deprecated pre-8.x keys and are no longer set).
# The job's `script` key publishes vzdump_backup_last_run_success +
# _last_success_timestamp_seconds (the series the VzdumpBackupFailed/Stale
# alerts consume). The hookscript is deployed to every Proxmox host by
# node_exporter_host — this is a cluster-wide `all` job, so it runs (and invokes
# the hook) on each node for that node's local guests, not just here.
proxmox_backup_vzdump_jobs:
  - id: backup-10f33360-a177
    storage: tank-proxmox
    schedule: "03:30"
    mode: snapshot
    compress: zstd
    all: true
    # EXCLUDE the 9 k3s VMs from vzdump — the biggest lever, zero restore-value
    # lost. They are IaC-rebuildable CATTLE (reprovisioned by `task k3s:deploy`);
    # ALL persistent data lives on zvols already carrying backup=0 (authentik/
    # mealie pg, prometheus, loki) and is covered by archive replication + the
    # pg-dumps + restic B2. Beyond wasting ~200G/night of dump I/O, keeping the
    # OS-disk images is a STALE-MEMBER-RESTORE HAZARD: restoring a weeks-old k3s
    # server image would rejoin etcd with a stale member and can corrupt quorum —
    # the supported recovery is reprovision + etcd-snapshot restore, never an
    # image roll-back. So excluding them removes a footgun as well as the I/O.
    # (proxmox_backup clears a removed exclude via --delete; `all` stays true.)
    #
    # CHECKLIST when adding a guest to this exclude list: Proxmox's
    # prune-backups runs PER GUEST, immediately AFTER that guest's backup — so a
    # guest that is no longer backed up is never revisited and its existing dumps
    # are NEVER pruned. Excluding a guest therefore strands its whole dump
    # history on tank/proxmox (and, via archsync, on archive/proxmox) forever.
    # Sweep them by hand in the same change:
    #   sudo ls -lt /mnt/tank/proxmox/dump/vzdump-qemu-<vmid>-*
    #   sudo rm -f  /mnt/tank/proxmox/dump/vzdump-{qemu,lxc}-<vmid>-*
    # then let archsync retention age the archive copy out. Measured 2026-07-25:
    # the 9 VMIDs below had accumulated 2.8 T of orphaned dumps against a 4.00 T
    # tank/proxmox refer — ~70% dead weight, faithfully replicated to archive.
    exclude: [202, 203, 204, 205, 206, 207, 222, 223, 227]
    # bwlimit caps per-node backup I/O (KiB/s). Because this is a cluster-wide
    # `all` job it fires on EVERY node at 03:30 and they all write their guests
    # to THIS host's tank-proxmox NFS target at once. Unthrottled, that combined
    # write saturated the (spinning) tank pool and froze pve-nas-01 on 2026-07-13
    # (I/O-pressure PSI 0.59, load 26, KVM guest page-fault hang, ~12h outage).
    #
    # RAISED 30720 -> 61440 (30 -> 60 MiB/s): the 07-20 window measured every
    # progress line read-pinned at ~29.9 MiB/s, proving 30 was the BINDING
    # constraint, not pool capability; and the incident's real drivers (CI DinD
    # on the NAS k3s agent, since moved off; memory/swap thrash, since fixed by the
    # 4G ARC cap + swappiness=1 + right-sized k3s VMs) are resolved, so 30 is now
    # over-conservative. 60 is a deliberate 2x step (80+ explicitly REJECTED for
    # now — honoring the I/O-incident history): with the k3s VMs excluded above
    # removing the concurrent writers, aggregate write to the 6x ST22000 RAIDZ
    # (sequential >> 360 MB/s) stays well under saturation, windows 155 drops 38G
    # 2h23m -> ~11m, and the pve-nas-01 slice clears ~03:30->~04:45 — comfortably
    # before media-mover (06:00) and the archive-backup timer (06:30), so
    # tank/proxmox is no longer deferred by archive-backupctl's vzdump-quiesce
    # guard. Reversible; guarded by ProxmoxHostIOPressure.
    #
    # RE-MEASURE CHECKLIST after deploy (do ONE full 03:30 window):
    #   1. pve-nas-01 slice completes by ~04:45 with ProxmoxHostIOPressure quiet.
    #   2. archive_backup_dataset_deferred_runs{dataset="tank/proxmox"} back to 0
    #      (ArchiveBackupChronicallyDeferred clears).
    #   3. Only THEN consider a further raise (>60); keep media-mover/archive
    #      schedules in mind. VM 155 (windows, 250G on ssd/pve) is start-on-demand
    #      but still dumps when running — re-check the slice still ends before 06:00.
    bwlimit: 61440
    prune_backups: "keep-daily=7,keep-weekly=4,keep-monthly=6"
    notification_mode: notification-system
    enabled: true
    script: /usr/local/bin/vzdump-metrics-hook.sh

