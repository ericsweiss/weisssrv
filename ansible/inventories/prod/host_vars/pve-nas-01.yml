---
# pve-nas-01 specific configuration
# Primary NAS/storage server running Proxmox VE

# ZFS native encryption — boot-time passphrase fetch from 1Password Connect.
# tank and ssd are encrypted; media (tank/media + all of nvme) and archive are
# plaintext by design, and local-ssd on the compute hosts cannot be encrypted
# without deadlocking cold boot. Which tiers and why: docs/32 "What is
# encrypted, what isn't".
#
# Each listed pool must ALREADY have at least one encrypted dataset — the role
# refuses to activate zfs-load-key@<pool>.service on a fully plaintext pool,
# where the unit would fail at boot and drag zfs-mount.service down via
# RequiredBy=. Leave this list empty to stage before encryption.
# The unlock token at /etc/onepassword-connect/token is scoped to the dedicated
# Homelab-Boot vault: it can reach the two pool passphrases and nothing else.
zfs_encryption_connect_vault: "Homelab-Boot"
zfs_encryption_pools:
  - name: tank
    item: "ZFS Pool tank Passphrase"
    field: passphrase
  - name: ssd
    item: "ZFS Pool ssd Passphrase"
    field: passphrase

# Guests whose disks live on the encrypted ssd pool (202 k3s-agt-nas-01,
# 153 gitlab, 156 nextcloud, 157 immich, 155 windows; 152 plex + 158 immich-ml
# LXCs). MEMBERSHIP OF THIS LIST — not onboot — is what starts them at boot:
# they all stay onboot=0 because pve-guests runs before zfs-mount-encrypted has
# unlocked ssd, and onboot=1 would fail against a locked pool.
# pve-start-encrypted-guests.service starts them after the unlock, VMs in list
# order then CTs, so the order mirrors each guest's proxmox_startup_order.
# Windows is last: least critical, slowest to settle, and it claims ~13G it
# cannot be ballooned out of. VM 222 (srv-nas-01, etcd) is deliberately ABSENT —
# it has no encrypted disk and starts on its normal onboot path so cluster
# quorum never waits on this NAS's unlock. docs/32, 39.
zfs_encryption_guest_vmids: [202, 153, 156, 157, 155]
zfs_encryption_guest_ctids: [152, 158]

# NFS bind sources that live on ENCRYPTED datasets. nas_storage anchors their
# /export/* fstab binds (and the nfs-server drop-in) on the late
# zfs-mount-encrypted.service rather than the early zfs-mount.service, so the
# binds capture the real (unlocked) datasets, never an empty mountpoint. All
# four ZFS-backed exports (appdata, share, tank/proxmox, k3s-etcd) are encrypted;
# /mnt/media (mergerfs, plaintext) is not ZFS-backed and keeps a plain bind.
nas_storage_encrypted_bind_sources:
  - /mnt/ssd/appdata
  - /mnt/tank/share
  - /mnt/tank/proxmox
  - /mnt/ssd/k3s-etcd  # off-node k3s etcd snapshot copies (encrypted, ssd pool)
  # Offsite-eligible logical-dump landing zone, now split into per-app exports
  # (see nas_storage_exports below). Each is a SUBDIR of the tank/backups/apps
  # dataset (encryption inherited from tank/backups): the exports set
  # bind_source_check: /mnt/tank/backups/apps so the mounted-dataset guard sees
  # the dataset the subdirs actually live on, and these entries anchor each bind
  # on the late zfs-mount-encrypted.service.
  - /mnt/tank/backups/apps/authentik
  - /mnt/tank/backups/apps/mealie
  - /mnt/tank/backups/apps/gitlab
  - /mnt/tank/backups/apps/immich
  - /mnt/tank/backups/apps/nextcloud
  - /mnt/tank/backups/apps/home-assistant

# ZFS pool configuration
nas_storage_zfs_pools:
  - name: tank
    datasets:
      - name: tank/media
        properties:
          mountpoint: /mnt/tank/media
          atime: "off"
          compression: zstd
          recordsize: 1M
          acltype: posix
          com.sun:auto-snapshot: "true"
      - name: tank/share
        properties:
          mountpoint: /mnt/tank/share
          atime: "off"
          compression: zstd
          recordsize: 128K
          acltype: posix
          com.sun:auto-snapshot: "true"
      - name: tank/proxmox
        properties:
          mountpoint: /mnt/tank/proxmox
          atime: "off"
          compression: zstd
          com.sun:auto-snapshot: "false"
      - name: tank/pve
        properties:
          mountpoint: /mnt/tank/pve
          atime: "off"
          compression: zstd
          com.sun:auto-snapshot: "false"
      # Nextcloud bulk user data: an encryption root created by hand
      # (nas_storage does not create datasets); the data zvol is a child and
      # inherits it. The properties below MATCH the live dataset exactly so
      # nas_storage never mutates it, and `encryption` is a plaintext-recreation
      # guard.
      - name: tank/nextcloud-data
        properties:
          mountpoint: /mnt/tank/nextcloud-data
          compression: zstd
          encryption: aes-256-gcm
      # Logical-dump landing zone. Its OWN dataset (not a subdir of
      # tank/backups) so the restic restore drill can sample it as a separate
      # source — see restic_offsite_sources below. It inherits tank/backups'
      # encryption root and rides the same recursive `zfs send -w`. Only the
      # properties this repo can assert are declared; `encryption` is a
      # plaintext-recreation guard (`zfs set encryption` errors loudly).
      # CREATE MANUALLY FIRST — nas_storage does not create datasets and
      # hard-fails DATASET_MISSING on the next NAS deploy.
      - name: tank/backups/apps
        properties:
          mountpoint: /mnt/tank/backups/apps
          encryption: aes-256-gcm

  - name: ssd
    datasets:
      - name: ssd/appdata
        properties:
          mountpoint: /mnt/ssd/appdata
          atime: "off"
          compression: lz4
          com.sun:auto-snapshot: "true"
      # Prometheus's TSDB has its own retention (365d / 140 GiB max); the
      # zfs-auto-snapshot frequent/hourly/daily/weekly/monthly cadence held
      # ~77 GiB of stale chunks on top of 53 GiB of live data with no
      # operational benefit. Disable on this dataset (zvol child inherits).
      - name: ssd/appdata/prometheus
        properties:
          com.sun:auto-snapshot: "false"
      # Loki has its own retention (loki.compactor.retention_enabled);
      # zfs-auto-snapshot adds no value and grows the zvol footprint.
      - name: ssd/appdata/loki
        properties:
          com.sun:auto-snapshot: "false"
      # mealie/postgres is a zvol (proxmox_vm `zfs create -p -V ssd/appdata/
      # mealie/postgres`), so the auto-created ssd/appdata/mealie parent would
      # mount over /mnt/ssd/appdata/mealie and shadow the /appdata/mealie dir
      # the recipes-appdata-mealie NFS PV serves (mealie's /app/data). canmount
      # =off keeps it unmounted so the NFS bind exports the real directory; the
      # nas_storage appdata shadowing-guard asserts this holds.
      - name: ssd/appdata/mealie
        properties:
          canmount: "off"
      # Off-node etcd snapshot copies from the k3s servers (docs/17). Its OWN
      # encryption root: the ssd pool root is plaintext and children do NOT
      # inherit encryption, so it must be created by hand with explicit flags
      # (nas_storage does not create datasets — it hard-fails DATASET_MISSING):
      #   zfs create -o encryption=aes-256-gcm -o keyformat=passphrase \
      #     -o keylocation=prompt -o mountpoint=/mnt/ssd/k3s-etcd ssd/k3s-etcd
      # Passphrase from 1P "ZFS Pool ssd Passphrase"; name == encryptionroot, so
      # the zfs-load-key@ssd boot loop unlocks it automatically.
      - name: ssd/k3s-etcd
        properties:
          mountpoint: /mnt/ssd/k3s-etcd
          atime: "off"
          compression: lz4
          com.sun:auto-snapshot: "false"
          encryption: aes-256-gcm

  - name: nvme
    datasets:
      - name: nvme/media
        properties:
          mountpoint: /mnt/nvme/media
          atime: "off"
          compression: zstd
          recordsize: 1M
          com.sun:auto-snapshot: "true"

  # The archive pool's datasets (archive/proxmox, archive/backups, ...) are
  # owned by archive-backupctl, which locks them to mountpoint=inherit,
  # canmount=off, readonly=on as `zfs receive -F` targets. Managing them here
  # too would unlock them on every deploy and fight the replication lockdown,
  # so the pool carries no datasets entry — only the scrub timer applies.
  - name: archive
    datasets: []

# ZFS scrub timer
nas_storage_zfs_scrub_enabled: true
nas_storage_zfs_scrub_schedule: "monthly"

# Per-app /config directories created under ssd/appdata (1000:2000, 0775) for
# the NFS-backed PVs and the LXC bind mounts.
nas_storage_appdata_dirs:
  - grafana
  - sonarr
  - radarr
  - lidarr
  - prowlarr
  - qbittorrent
  - nzbget
  - pulsarr
  - mealie
  - bar-assistant
  - wg-easy
  - hermes
  - hindsight
  - homarr

# Logical dumps whose freshness/size is tracked as node_exporter textfile
# metrics (BackupArtifact* alerts). name = the tank/backups/apps subdir.
#
# `companions:` are the files an artefact cannot be RESTORED without but which
# are deliberately outside its `pattern:` — no freshness/size arm sees them, so
# they get their own BackupArtifactCompanionMissing arm. Each entry is a glob
# matched at depth 1 inside the app's landing dir. Declaring none is a claim
# that the app's dump is self-contained; check-backup-artifact-apps.py fails if
# the alert exists while nothing in this list declares a companion, so the rule
# can never be shipped inert.
nas_storage_backup_artifact_apps:
  - name: authentik
    pattern: "authentik-*.sql.gz"
  - name: mealie
    pattern: "mealie-*.sql.gz"
  - name: gitlab
    pattern: "*_gitlab_backup.tar"
    # gitlab-backup EXCLUDES both of these, and without them the tarball
    # restores to an instance that cannot decrypt its own CI variables, 2FA
    # secrets or runner tokens. gitlab-backup-run.sh copies them next to the
    # tarball on success (`cp /etc/gitlab/gitlab-secrets.json /etc/gitlab/gitlab.rb
    # "${BACKUP_PATH}/"`), and BACKUP_PATH is /mnt/backups-offsite on .153 —
    # the NFS mount of pve-nas-01:/backups-apps/gitlab, i.e. this very dir.
    # This is the NAS-side witness for what GitLabBackupSecretsMissing asserts
    # from inside the VM: that alert believes the VM's own metrics, this one
    # believes the landing zone.
    companions:
      - "gitlab-secrets.json"
      - "gitlab.rb"
  - name: immich
    pattern: "immich-*.sql.gz"
  - name: nextcloud
    pattern: "nextcloud-db-*.sql.gz"
  - name: home-assistant
    # Automatic_backup_* only: a bare "*.tar" also matched the add-on tars HAOS
    # writes here (34 MB, and they outlive a full rotation of the real 300+ MB
    # backups), so a stopped full backup kept both the staleness and zero-byte
    # arms green. Trade-off: a hand-triggered MANUAL full backup no longer
    # counts, so the metric reads stale until the next automatic one lands.
    pattern: "Automatic_backup_*.tar"
  - name: pve-cluster
    pattern: "etc-pve-*.tar.gz"

# Nightly raw-encrypted replication to the archive pool (docs/42). Sources are
# replicated RECURSIVELY and each lands at archive/<basename>, so basenames must
# be unique and every root must be a filesystem (a top-level zvol is rejected on
# receive). ssd/pve is absent on purpose — the GitLab VM disks already ride the
# nightly vzdump this list replicates via tank/proxmox.
nas_storage_archive_backup_enabled: true
nas_storage_archive_backup_pool: archive
nas_storage_archive_backup_vzdump_target: tank/proxmox
nas_storage_archive_backup_sources:
  - tank/share
  - tank/backups
  - tank/nextcloud-data
  - tank/proxmox
  - tank/immich-data
  - ssd/appdata
  - ssd/databases
  - ssd/k3s-etcd

# ZFS ARC cap (16 GiB): a guard, not a target — uncapped, ARC takes about half
# of this host's RAM and squeezes the guests. The working set is far below the
# ceiling, and unused ceiling costs nothing (ARC self-tunes down under pressure
# and is instantly reclaimable). Rendered into /etc/modprobe.d/zfs.conf by
# nas_storage, with an update-initramfs handler so it applies at early boot.
nas_storage_zfs_arc_max_bytes: 17179869184

# Nightly /etc/pve archive into the offsite-eligible landing zone. pmxcfs is
# cluster-shared, so archiving it from this one node covers the whole cluster —
# and this is the node whose landing zone rides archsync into restic B2. Without
# it, user.cfg (users/ACLs/API tokens), corosync.conf and priv/ (cluster CA +
# node certs + authkey) have no backup at ANY tier: vzdump captures guests, not
# the cluster filesystem. docs/17.
nas_storage_pve_cluster_backup_enabled: true

# Daily swap reset. vm.swappiness=1 + the ARC cap keep steady-state swap ~0, but
# a real peak still swaps and that swap never self-clears. The timer aborts if a
# swapoff would risk OOM (nas_storage/templates/swap-clean.sh.j2). Only this
# host runs it — the compute hosts have headroom and the default swappiness.
nas_storage_swap_clean_enabled: true
# 07:00 — deliberately AFTER the NAS's own overnight jobs (media-mover 06:00,
# archive-backup 06:30) so it reclaims the swap THEY caused rather than running
# before/during them. If those ever run long, push this later.
nas_storage_swap_clean_schedule: "*-*-* 07:00:00"
# Escalation when ARC-shrink headroom alone cannot cover the swap: shut these
# guests down in order, only as many as needed, swapoff, then restart every one
# stopped (an EXIT trap guarantees it even on failure). "vmid:name:timeout(s)",
# ordered least- to most-critical. Graceful only (qm shutdown) — a guest that
# misses its timeout aborts the reclaim rather than being killed (Postgres-safe).
nas_storage_swap_clean_stop_guests:
  - "157:immich:120"
  - "153:gitlab:300"
  - "156:nextcloud:120"

# Merges NVMe (hot tier) + tank (cold tier) media into a unified /mnt/media.
# Only tank/media is a branch, so tank's other directories are NOT exposed.
nas_storage_mergerfs_mounts:
  - name: media
    sources:
      - /mnt/nvme/media          # Hot tier
      - /mnt/tank/media          # Cold tier (only tank/media, not entire tank)
    target: /mnt/media
    options:
      - defaults
      - allow_other
      - default_permissions
      - use_ino
      - inodecalc=path-hash      # Required for NFS: provides stable inodes for FUSE
      - noforget                 # Required for NFS: prevents ESTALE (stale file handle) errors
      - cache.files=off
      - dropcacheonclose=true
      - category.create=ff       # New files go to first branch (nvme)
      - category.action=epall    # Actions use all branches
      - moveonenospc=true        # Move to next branch when nvme fills
      - minfreespace=100G        # Keep 100G free on nvme
    systemd_requires:
      - /mnt/nvme/media
      - /mnt/tank/media

# NFSv4-over-TLS server: install + start tlshd so the kernel can answer
# the server-side TLS handshake for the client lines that require xprtsec=tls —
# the k3s exports (/export/{appdata,share,media}) AND the app-VM backup exports
# (/export/backups-apps/{gitlab,immich,nextcloud} .153/.157/.156, whose VMs now
# run tlshd via the nfs_tls role in their deploy plays) AND the six Proxmox hosts'
# /export/tank-proxmox. tlshd is live on this server, all six k3s agents, the six
# Proxmox hosts (nfs_tls_enabled in group_vars/proxmox.yml) and those three app
# VMs. The always-plaintext lines (HAOS .154 backups-apps + media, the fsid=0
# root) carry no xprtsec and are unaffected.
nfs_tls_enabled: true
# This host is the NFS server, so tlshd needs the [authenticate.server]
# block (cert + private key) to answer the server-side TLS handshake. The
# k3s agents are clients only (nfs_tls_is_server defaults false) and, under
# xprtsec=tls, present no client cert — so they never load the wildcard
# private key. See nfs_tls role defaults for nfs_tls_is_server /
# nfs_tls_client_cert semantics.
nfs_tls_is_server: true

# NFS exports.
# Convention for every k3s/app export: owner 1000 (eric), group 2000 (media),
# mode 02775 (setgid so the group is inherited).
# k3s client blocks: 192.168.0.200/29 = agents; 192.168.0.220/29 = servers
# .222/.223 (masks to .216-.223, NOT .227); 192.168.0.227/32 = k3s-srv-prec-01,
# which sits outside both /29s and must therefore be listed explicitly on every
# k3s export — pod-mounted PVs must not lose their mount if a pod ever lands on
# a server.
nas_storage_exports:
  # NFSv4 pseudo-root (fsid=0): traversal-only, so read-only. NFSv4 clients
  # cross from here into whichever child exports below are explicitly listed
  # for them — no crossmnt needed for that. crossmnt is deliberately ABSENT:
  # per exports(5) it would implicitly export any child filesystem bound under
  # /export to every client line here WITH THIS LINE'S OPTIONS (plaintext, no
  # xprtsec), bypassing the per-child client lists and TLS requirements. Any
  # new dataset bound under /export MUST get its own explicit export entry.
  # The .154 (HAOS) line must stay: its fstab mounts /media relative to this
  # pseudo-root, and an explicit fsid=0 export disables nfsd's synthesized
  # pseudo-root entirely.
  - path: /export
    clients:
      - spec: "192.168.0.102/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.103/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.104/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.105/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.106/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.107/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.154/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      # App VMs (.153 gitlab, .156 nextcloud, .157 immich) traverse the fsid=0
      # pseudo-root into their OWN /export/backups-apps/<app> export (each scoped
      # to just that VM); .154 (HAOS, above) traverses into backups-apps/
      # home-assistant. /export/backups-apps itself is a plain dir on this root fs,
      # so pseudo-root traversal reaches each per-app export without exporting the
      # parent (which is what isolates the apps from each other).
      - spec: "192.168.0.153/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.156/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.157/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.200/29"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      # k3s servers (.222/.223/.227) as explicit /32s. 192.168.0.220/29 masks to
      # .216-.223 and does NOT cover .227 (prec-01); with the explicit fsid=0
      # export disabling the synthesized pseudo-root, a server missing here can
      # not traverse into /export/k3s-etcd (off-node etcd snapshot copy).
      - spec: "192.168.0.222/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.223/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"
      - spec: "192.168.0.227/32"
        options: "ro,sync,hide,no_subtree_check,fsid=0,sec=sys,root_squash"

  # K3s/app RW exports. all_squash + anonuid/anongid maps every client (root
  # included) to 1000:2000 so LinuxServer.io containers can chmod/chown at init.
  # xprtsec=tls REQUIRED: these client lines reject plaintext, and the PVs mount
  # by hostname because the wildcard cert has no IP SAN.
  - path: /export/appdata
    bind_source: /mnt/ssd/appdata
    owner: 1000
    group: 2000
    mode: "02775"
    xprtsec: "tls"
    clients:
      - spec: "192.168.0.200/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=11"
      - spec: "192.168.0.220/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=11"
      - spec: "192.168.0.227/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=11"

  - path: /export/share
    bind_source: /mnt/tank/share
    owner: 1000
    group: 2000
    mode: "02775"
    xprtsec: "tls"  # require TLS — see /export/appdata note above
    clients:
      - spec: "192.168.0.200/29"
        options: "rw,sync,no_subtree_check,root_squash,fsid=12"
      - spec: "192.168.0.220/29"
        options: "rw,sync,no_subtree_check,root_squash,fsid=12"
      - spec: "192.168.0.227/32"
        options: "rw,sync,no_subtree_check,root_squash,fsid=12"

  # Unified media export (the mergerfs union). xprtsec is PER CLIENT, so the
  # require-TLS k3s lines and the plaintext .154 line coexist here: HAOS
  # hardcodes its NFS mount options and ships no tlshd, so it can never request
  # xprtsec=tls — docs/24 (HAOS NFS), docs/07 (Transport Security).
  - path: /export/media
    bind_source: /mnt/media
    # Explicit: /mnt/media is the MergerFS union target, not a ZFS dataset, so
    # the mounted-dataset guard and the zfs-mount fstab ordering do not apply
    # here (the union's own branches carry them).
    zfs: false
    owner: 1000
    group: 2000
    mode: "02775"
    clients:
      - spec: "192.168.0.200/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=20"
        xprtsec: "tls"
      - spec: "192.168.0.220/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=20"
        xprtsec: "tls"
      - spec: "192.168.0.227/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=20"
        xprtsec: "tls"
      - spec: "192.168.0.154/32"  # HAOS — plaintext (no xprtsec; see comment above)
        options: "ro,sync,no_subtree_check,root_squash,fsid=20"

  # Off-node k3s etcd snapshot copies (docs/17). Servers only (.222/.223/.227),
  # xprtsec=tls REQUIRED, no_root_squash so each server's root copy script can
  # write its snapshots. Servers mount by hostname (pve-nas-01.esweiss.com) as
  # /k3s-etcd (pseudo-root-relative — the fsid=0 root is at /export). fsid=15
  # (unique). The three servers are listed as /32s in the fsid=0 pseudo-root
  # above so NFSv4 traversal into this child works (the /29 there omits .227).
  - path: /export/k3s-etcd
    bind_source: /mnt/ssd/k3s-etcd
    owner: 0  # root
    group: 0  # root
    mode: "0700"
    xprtsec: "tls"
    clients:
      - spec: "192.168.0.222/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=15"
      - spec: "192.168.0.223/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=15"
      - spec: "192.168.0.227/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=15"

  # Offsite-eligible logical-dump landing zone (tank/backups/apps -> B2), one
  # export PER APP scoped to only its writer, so the apps cannot read each
  # other's dumps. bind_source_check points the mounted-dataset guard at the
  # tank/backups/apps dataset (the per-app subdir is never a mountpoint itself).
  # all_squash lands every write as 1000:2000 whatever the in-guest UID. All flows
  # are over TLS except HAOS (.154), which cannot speak xprtsec=tls (docs/24).
  # The restic walk reads tank/backups locally, so it needs no export here.
  # fsids must stay unique across ALL exports in this file.
  - path: /export/backups-apps/authentik
    bind_source: /mnt/tank/backups/apps/authentik
    bind_source_check: /mnt/tank/backups/apps
    owner: 1000
    group: 2000
    mode: "02775"
    xprtsec: "tls"
    clients:
      - spec: "192.168.0.200/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=16"
      - spec: "192.168.0.220/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=16"
      - spec: "192.168.0.227/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=16"

  - path: /export/backups-apps/mealie
    bind_source: /mnt/tank/backups/apps/mealie
    bind_source_check: /mnt/tank/backups/apps
    owner: 1000
    group: 2000
    mode: "02775"
    xprtsec: "tls"
    clients:
      - spec: "192.168.0.200/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=17"
      - spec: "192.168.0.220/29"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=17"
      - spec: "192.168.0.227/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=17"

  # gitlab (.153) — TLS on the wire (VM runs tlshd via nfs_tls).
  - path: /export/backups-apps/gitlab
    bind_source: /mnt/tank/backups/apps/gitlab
    bind_source_check: /mnt/tank/backups/apps
    owner: 1000
    group: 2000
    mode: "02775"
    xprtsec: "tls"
    clients:
      - spec: "192.168.0.153/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=18"

  # immich (.157) — TLS on the wire (VM runs tlshd via nfs_tls).
  - path: /export/backups-apps/immich
    bind_source: /mnt/tank/backups/apps/immich
    bind_source_check: /mnt/tank/backups/apps
    owner: 1000
    group: 2000
    mode: "02775"
    xprtsec: "tls"
    clients:
      - spec: "192.168.0.157/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=19"

  # nextcloud (.156) — TLS on the wire (VM runs tlshd via nfs_tls).
  - path: /export/backups-apps/nextcloud
    bind_source: /mnt/tank/backups/apps/nextcloud
    bind_source_check: /mnt/tank/backups/apps
    owner: 1000
    group: 2000
    mode: "02775"
    xprtsec: "tls"
    clients:
      - spec: "192.168.0.156/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=21"

  # home-assistant (.154) — PLAINTEXT. HAOS Supervisor hardcodes its NFS mount and
  # ships no tlshd, so it can never request xprtsec=tls; it is the one plaintext
  # -on-wire backup flow (and the only non-co-resident one). Native scheduled
  # backup target — one-time HA UI step (docs/24).
  - path: /export/backups-apps/home-assistant
    bind_source: /mnt/tank/backups/apps/home-assistant
    bind_source_check: /mnt/tank/backups/apps
    owner: 1000
    group: 2000
    mode: "02775"
    clients:
      - spec: "192.168.0.154/32"
        options: "rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=2000,fsid=22"

  # Proxmox backup target (requires no_root_squash). REQUIRES TLS: every PVE host
  # already mounts it with xprtsec=tls via the tank-proxmox storage entry below,
  # so this only enforces what the clients do — ~12.5 TiB of VM dumps otherwise
  # travel plaintext with no_root_squash.
  - path: /export/tank-proxmox
    bind_source: /mnt/tank/proxmox
    owner: 1000
    group: 2000
    mode: "02775"
    xprtsec: "tls"
    clients:
      - spec: "192.168.0.102/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"
      - spec: "192.168.0.103/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"
      - spec: "192.168.0.104/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"
      - spec: "192.168.0.105/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"
      - spec: "192.168.0.106/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"
      - spec: "192.168.0.107/32"
        options: "rw,sync,no_subtree_check,no_root_squash,fsid=14"

# Samba shares: the "nas" user with the "media" group (GID 2000).
nas_storage_samba_shares:
  - name: share
    path: /mnt/tank/share
    comment: General file share
    browseable: true
    read_only: false
    guest_ok: false
    valid_users: "nas"
    force_group: "media"
    create_mask: "0664"
    directory_mask: "2775"  # setgid bit for group inheritance

  - name: media
    path: /mnt/tank/media
    comment: Media library
    browseable: true
    read_only: false
    guest_ok: false
    valid_users: "nas"
    force_group: "media"
    create_mask: "0664"
    directory_mask: "2775"  # setgid bit for group inheritance

# Moves old files from the NVMe hot tier down to tank.
nas_storage_media_mover_enabled: true
nas_storage_media_mover_src: /mnt/nvme/media/library    # Hot tier library
nas_storage_media_mover_dst: /mnt/tank/media/library    # Cold tier library
# 06:00: after the throttled vzdump window (03:30, runs to ~05:45) and clear of
# smartd's 02:00 short tests, before the 06:30 archive replication — stacking
# the nvme->tank rsync on any of them thrashed the NAS. An overrun is safe:
# tank/media is not replicated to archive, so the datasets are disjoint.
nas_storage_media_mover_schedule: "*-*-* 06:00:00"

# Proxmox storage, reconciled by the proxmox_backup role. Mounted by HOSTNAME
# with xprtsec=tls — the wildcard cert has no IP SAN, so an IP mount fails the
# handshake — which requires tlshd on every PVE host (nfs_tls_enabled in
# group_vars/proxmox.yml). server/export/path are create-fixed in Proxmox, so
# the role fails loud on drift there.
proxmox_backup_storage:
  - id: tank-proxmox
    type: nfs
    server: pve-nas-01.esweiss.com
    export: /tank-proxmox
    # Synced from the live storage.cfg. content is a mutable property, so the
    # role updates it on drift (unlike server/export/path, which are
    # create-fixed and fail loud).
    content: "snippets,backup,vztmpl,iso"
    path: /mnt/pve/tank-proxmox
    options: "vers=4.2,xprtsec=tls"
  # zfspool ids. `pool` is create-fixed and asserted, which is the point: the
  # `ssd` id maps to ssd/pve, the ENCRYPTION ROOT (aes-256-gcm) that carries the
  # GitLab/Windows/Nextcloud/Immich root disks. An id recreated by hand against
  # the pool ROOT (`ssd`, encryption=off) would land every new guest disk in
  # plaintext with no other signal. postflight.yml asserts ssd/pve's encryption
  # property alongside this.
  #
  # mountpoint/nodes/sparse are declared here (unlike tank/nvme below) and are
  # SYNCED FROM THE LIVE storage.cfg — `pvesh get /storage` reports exactly
  # /mnt/ssd/pve, pve-nas-01, sparse 0. The role reconciles all three on drift,
  # so declaring an unverified value would rewrite live state; `sparse` in
  # particular reads as 0 when PVE omits it, and asserting `false` against a
  # thin store would silently flip it to thick for every future guest disk.
  # Re-verify against `pvesh get /storage --output-format json` before editing.
  - id: ssd
    type: zfspool
    pool: ssd/pve
    content: "images,rootdir"
    mountpoint: /mnt/ssd/pve
    nodes: pve-nas-01
    sparse: false
  # tank/nvme carry no guest disks today and both datasets are plaintext (they
  # are not encryption roots); they are declared so the id -> dataset mapping is
  # codified. Only pool + content are pinned — mountpoint/nodes/sparse are
  # omitted so the reconcile inherits the live values rather than asserting
  # values this repo has never captured.
  - id: tank
    type: zfspool
    pool: tank/pve
    content: "images,rootdir"
  - id: nvme
    type: zfspool
    pool: nvme/pve
    content: "images,rootdir"

# Proxmox backup job (jobs.cfg via /cluster/backup), reconciled by the
# proxmox_backup role. IMPORTANT: `id` must match the live jobs.cfg id or the
# role CREATES A SECOND job (`pvesh get /cluster/backup --output-format json`).
# Schedule is a systemd calendar event, not cron.
# The `script` key publishes the vzdump_backup_* series the VzdumpBackupFailed/
# Stale alerts consume; node_exporter_host deploys that hookscript to every
# Proxmox host, since this is a cluster-wide `all` job that runs on each node.
proxmox_backup_vzdump_jobs:
  - id: backup-10f33360-a177
    storage: tank-proxmox
    schedule: "03:30"
    mode: snapshot
    compress: zstd
    all: true
    # The k3s VMs are excluded: they are IaC-rebuildable cattle whose persistent
    # data lives on zvols already carrying backup=0. Keeping their OS images is a
    # HAZARD, not a safety net — restoring a stale k3s server image rejoins etcd
    # with a stale member and can corrupt quorum; the supported recovery is
    # reprovision + etcd-snapshot restore.
    # (proxmox_backup clears a removed exclude via --delete; `all` stays true.)
    #
    # Adding a guest here STRANDS its existing dumps: prune-backups runs per
    # guest right after that guest's backup, so an excluded guest is never
    # revisited. Sweep its dumps by hand in the same change — docs/17
    # § Retention gotcha when excluding a guest.
    exclude: [202, 203, 204, 205, 206, 207, 222, 223, 227]
    # Per-node backup I/O cap (KiB/s). Every node writes to this host's
    # tank-proxmox target at 03:30 at once; unthrottled that saturates the
    # spinning tank pool (docs/12). The cap keeps the window clear of
    # media-mover (06:00) and the archive-backup timer (06:30), so tank/proxmox
    # is not deferred by archive-backupctl's vzdump-quiesce guard.
    bwlimit: 61440
    prune_backups: "keep-daily=7,keep-weekly=4,keep-monthly=6"
    notification_mode: notification-system
    enabled: true
    script: /usr/local/bin/vzdump-metrics-hook.sh

# SMART monitoring
nas_storage_smartd_enabled: true
nas_storage_smartd_tank_disks:
