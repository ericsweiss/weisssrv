---
# Plex Media Server LXC container configuration
# Running on pve-nas-01 (10.0.10.102)

proxmox_host: pve-nas-01

proxmox_resource_pool: apps-public

proxmox_lxc_cores: 4
proxmox_lxc_memory: 8192
proxmox_lxc_swap: 2048
proxmox_lxc_disk_size: 64G
# ssd (encrypted): the role only places NEW containers. Migrate a live rootfs
# once with `pct move-volume 152 rootfs ssd --delete`, stopped, at a window.
proxmox_lxc_storage: ssd

# Nesting required for systemd 257+ (Debian 13).
proxmox_lxc_nesting: true

# onboot=0: the rootfs and the /config bind both live on the ENCRYPTED ssd
# pool, so pct start fails until ssd unlocks. pve-start-encrypted-guests.service
# starts this CT after zfs-mount-encrypted.service, not pve-guests (docs/32).
proxmox_lxc_onboot: false
proxmox_lxc_startup_order: 50
proxmox_lxc_startup_delay: 10

# Unprivileged LXC: host dirs are eric:media (1000:2000) and the in-container
# plex user is in the mapped media group (GID 2000). Bind mounts are applied by
# the proxmox_lxc role via `pct set --mpN` at container-creation time.
proxmox_lxc_bind_mounts:
  # Plex configuration/database. Already backed up via ssd/appdata -> archive
  # (raw ZFS), so backup=0 excludes it from vzdump to avoid double-storing it
  # in tank/proxmox (/transcode and /media are already backup=0).
  - host_path: /mnt/ssd/appdata/plex
    container_path: /config
    options: "mp=/config,backup=0"
  # Transcoding workspace (NVMe for speed)
  - host_path: /mnt/nvme/fast/plex-transcode
    container_path: /transcode
    options: "mp=/transcode,backup=0"
  # Media library (mergerfs - read-write for Plex metadata/watch status)
  # Full mergerfs mount to match *arr app paths (/media/library/*)
  - host_path: /mnt/media
    container_path: /media
    options: "mp=/media,backup=0,ro=0"

# Container-side bind-mount targets, restated because they must stay coupled
# to proxmox_lxc_bind_mounts above; the role fails loudly when config or
# transcode is not mounted. Media group/gid take the role default (media/2000).
plex_config_dir: /config
plex_transcode_dir: /transcode
plex_media_dir: /media

# GPU passthrough for Intel Arc B580 hardware transcoding
# Pass through /dev/dri devices for hardware-accelerated transcoding
proxmox_lxc_gpu_passthrough: true
