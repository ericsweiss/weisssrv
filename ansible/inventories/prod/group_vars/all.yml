---
# Global variables for all hosts in the homelab

# Domain configuration
internal_domain: esweiss.com
external_domain: ericsweiss.com

# DNS servers
dns_servers:
  - 192.168.0.150
  - 192.168.0.160

# Proxmox autostart defaults
proxmox_autostart_enabled: true
proxmox_startup_order: 100
proxmox_startup_delay: 0

# Proxmox storage defaults by host role
# NAS node (pve-nas-01) uses ssd pool for VMs/containers (raidz1 3x 4TB SSDs)
# General/compute nodes (Optiplexes, laptops) use local-ssd (single 1TB SSD per node)
# These defaults can be overridden per-VM/container by setting proxmox_storage or lxc_storage
proxmox_storage_defaults:
  nas: ssd
  compute: local-ssd
  general: local-ssd

# SMTP relay configuration
smtp_relay_host: smtp-relay.esweiss.com
smtp_relay_port: 587

# Admin user configuration
admin_user: eric
admin_email: "{{ lookup('ansible.builtin.env', 'ROOT_EMAIL_ALIAS') or undef(hint='ROOT_EMAIL_ALIAS env var must be set (run via the task wrapper / op run)') }}"

# SSH configuration
ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: false
ssh_pubkey_authentication: true

# Pinned HAOS (Home Assistant OS) SSH host key. Single source of truth
# consumed by both the home_assistant role (via home_assistant_host_key
# in host_vars/home.yml) and the acme_certs cert push (via the `home`
# entry in cert_distribution_targets in host_vars/dns-01.yml). Rotate
# here once after a HAOS rebuild:
#   ssh-keyscan -t ed25519 -p 22222 192.168.0.154
# Paste only the algorithm + base64 key (no leading "[host]:port").
haos_ssh_host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKcIncJ961hzakmaNlj9Nw6zwOWRZm0sEYgDntiKDb9O"

# SSH authorized keys
# IMPORTANT: SSH_PUBLIC_KEY must be set via 'op run' - empty key will fail validation
#
# from= ranges: LAN, Tailscale, and the k3s pod CIDR. The pod CIDR is
# required because CI deploy jobs run as runner pods in-cluster: a pod
# SSHing to any OTHER host is masqueraded to its node's LAN IP (already
# permitted), but a pod SSHing to its OWN node hairpins without SNAT and
# arrives with its 10.42.x.x pod IP — sshd then rejects the deploy key
# with "Refused by key options" and that node drops out of the play
# (pipeline 355, k3s-agt-opt-02). Since cross-host pod connections are
# already permitted via masquerade, listing the pod CIDR adds no
# practical exposure beyond what the SNAT path always allowed.
ssh_authorized_keys:
  - >-
    from="192.168.0.0/24,100.64.0.0/10,10.42.0.0/16"
    {{ lookup('ansible.builtin.env', 'SSH_PUBLIC_KEY') or undef(hint='SSH_PUBLIC_KEY env var must be set') }}

# 1Password secret references
secrets:
  cloudflare_api_token: "op://Homelab/Cloudflare DNS Token/credential"
  cloudflare_account_id: "op://Homelab/Cloudflare DNS Token/username"
  smtp_gmail_password: "op://Homelab/SMTP Relay Gmail/password"
  smtp_gmail_user: "op://Homelab/SMTP Relay Gmail/username"
  smtp_relay_user: "op://Homelab/SMTP Relay Auth/username"
  smtp_relay_password: "op://Homelab/SMTP Relay Auth/password"
  root_email_alias: "op://Homelab/Email Config/root_alias"
  # AdGuard password - bcrypt hash is generated at deploy time by the adguard_home role
  adguard_admin_password: "op://Homelab/AdGuard Home/password"
  tailscale_auth_key: "op://Homelab/Tailscale Auth Key/credential"
  ssh_public_key: "op://Homelab/SSH Key/public key"
  samba_nas_password: "op://Homelab/Samba NAS User/password"
  dns01_ssh_private_key: "op://Homelab/DNS-01 SSH Key/private key"
  dns01_ssh_public_key: "op://Homelab/DNS-01 SSH Key/public key"
  k3s_token: "op://Homelab/K3s Cluster Token/credential"
  # Authentik SSO secrets
  # Note: Redis password is no longer needed as of Authentik 2025.10
  authentik_secret_key: "op://Homelab/Authentik Secrets/secret-key"
  authentik_postgresql_password: "op://Homelab/Authentik Secrets/postgresql-password"
  authentik_postgresql_admin_password: "op://Homelab/Authentik Secrets/postgresql-admin-password"
  # Mealie SSO and OpenAI secrets
  mealie_oidc_client_id: "op://Homelab/Mealie SSO/oidc-client-id"
  mealie_oidc_client_secret: "op://Homelab/Mealie SSO/oidc-client-secret"
  mealie_openai_api_key: "op://Homelab/OpenAI API Key/api-key"
  # Bar Assistant SSO secrets
  bar_assistant_authentik_client_id: "op://Homelab/Bar Assistant SSO/authentik-client-id"
  bar_assistant_authentik_client_secret: "op://Homelab/Bar Assistant SSO/authentik-client-secret"
  # GitLab secrets
  gitlab_root_password: "op://Homelab/GitLab/root-password"
  gitlab_saml_cert_fingerprint: "op://Homelab/GitLab SSO/saml-cert-fingerprint"
  gitlab_runner_token: "op://Homelab/GitLab Runner/runner-token"

# Timezone
timezone: America/Los_Angeles

# Package management
common_packages:
  - curl
  - wget
  - neovim
  - htop
  - tmux
  - screen
  - git
  - jq
  - unzip
  - rsync
  - net-tools
  - dnsutils
  - ca-certificates
  - gnupg
  - lsb-release
  - sudo
  - pciutils  # Required for lspci (e1000e NIC detection workaround)

# Tailscale configuration
tailscale_enabled: true
tailscale_accept_routes: false  # Hosts should NOT accept routes (prevents routing loops)
tailscale_accept_dns: false  # Use local DNS infrastructure
tailscale_advertise_routes: []  # Only subnet routers (Proxmox hosts) should advertise routes

# Application version pins
adguard_home_version: "0.107.77"
adguardhome_sync_version: "0.9.2"
tailscale_version: "1.98.8"
debian_version: "13"
k3s_version: "v1.36.2+k3s1"
# Optional: pin the sha256 of install.sh for the k3s_version tag to verify the
# root-run installer script before exec (host-side ansible, NOT a Flux version —
# do not add to the versions ConfigMap). Compute on bump:
#   curl -sfL https://raw.githubusercontent.com/k3s-io/k3s/<k3s_version>/install.sh | sha256sum
# then set e.g.  k3s_install_script_checksum: "sha256:<hex>"
# Left empty here so get_url omits the checksum (install.sh still verifies the
# k3s binary's own sha256 against the GitHub release).
k3s_install_script_checksum: ""
kube_vip_version: "v1.2.1"
# Flux CLI used by CI deploy-verify; the job pins a matching sha256 —
# update both together when bumping.
flux_version: "2.9.0"

# Authentik SSO identity provider
authentik_version: "2026.5.3"

# PostgreSQL version for Authentik (bundled with Helm chart)
# Using Debian Trixie base for consistency with homelab standard
# Available tags: https://hub.docker.com/_/postgres/tags
postgresql_version: "18.4-trixie"

# PostgreSQL version for Mealie (standalone deployment)
# Using Alpine base for lighter footprint
# Available tags: https://hub.docker.com/_/postgres/tags
mealie_postgresql_version: "18.4-alpine"

# Download clients and media stack versions
# Pinned to specific versions for reproducible deployments and controlled updates.
# After editing a version here, run `task flux:sync-versions` to regenerate
# kubernetes/infrastructure/sources/versions-configmap.yaml, then commit +
# push both files — Flux reconciles the new image tags into the running pods.
# LinuxServer.io images: https://docs.linuxserver.io/images/
# Gluetun: https://github.com/qdm12/gluetun/releases
# Pulsarr: https://github.com/jamcalli/Pulsarr/releases
# busybox: init container utility image used by VPN sidecar pre-checks
busybox_version: "1.38"
gluetun_version: "v3.41.1"
nzbget_version: "26.2"
qbittorrent_version: "5.2.2"
prowlarr_version: "2.4.0.5397"
sonarr_version: "4.0.19.2979"
radarr_version: "6.2.1.10461"
lidarr_version: "3.1.0.4875"
pulsarr_version: "0.17.2"

# Recipe management stack versions
# Mealie: https://github.com/mealie-recipes/mealie/releases
# Bar Assistant: https://github.com/bar-assistant/bar-assistant/releases
# Salt Rim: https://hub.docker.com/r/barassistant/salt-rim/tags
# Meilisearch: https://github.com/meilisearch/meilisearch/releases (pinned to 1.15.x for Bar Assistant compat)
# Redis: https://hub.docker.com/_/redis/tags (Alpine variant)
mealie_version: "v3.20.1"
bar_assistant_version: "5.15.2"
salt_rim_version: "4.15.0"
meilisearch_version: "v1.15.2"
redis_version: "8.8.0-alpine"

# Plex Media Server version (apt-managed via official repository)
plex_version: "1.43.2.10687-563d026ea"

# GitLab EE (using CE features) - Omnibus package
# https://packages.gitlab.com/gitlab/gitlab-ee
gitlab_version: "19.1.1-ee.0"  # 19.1.x line (incl. CVE-2026-5816 Web IDE single-origin fix); 19.1.1 = latest patch. Applied via apt on the gitlab VM by maintenance-run-all (omnibus reconfigure).

# GitLab Runner version for k3s cluster
# https://gitlab.com/gitlab-org/charts/gitlab-runner/tags
gitlab_runner_helm_version: "0.90.1"

# GitLab Agent for Kubernetes Helm chart version
# https://gitlab.com/gitlab-org/charts/gitlab-agent/tags
gitlab_agent_helm_version: "2.28.0"

# Observability stack versions
# kube-prometheus-stack, Loki, Alloy chart versions are in helm_chart_versions below.
# Container image versions for standalone exporters:
# Exportarr: https://github.com/onedr0p/exportarr/releases
# Blackbox exporter chart version is in helm_chart_versions below.
# Proxmox VE Exporter: https://github.com/prometheus-pve/prometheus-pve-exporter/releases
# ZFS Exporter: https://github.com/pdf/zfs_exporter/releases
# AdGuard Exporter: https://github.com/henrywhitaker3/adguard-exporter/releases
# Unbound Exporter: https://github.com/letsencrypt/unbound_exporter/releases
# Redis Exporter: https://hub.docker.com/r/oliver006/redis_exporter/tags
exportarr_version: "v2.3.0"
proxmox_exporter_version: "3.9.0"
zfs_exporter_version: "2.3.12"
# sha256 of zfs_exporter-<version>.linux-amd64.tar.gz from the release's
# sha256sums.txt — verified by get_url so a tampered/MITM'd binary (run as
# root with /dev/zfs access) fails the download. Update on every version bump.
zfs_exporter_checksum: "sha256:7f2c953967bfcbd5ddd4931fb9d74122c45fa36df72be78d1025ab2371514a2d"
adguard_exporter_version: "v1.2.1"
# 0.6.0 publishes an x86_64 .deb again (0.5.0 was source-only); the role
# installs via .deb (prometheus_exporter_artifact_type: deb). Upstream ships no
# checksum file, so we pin our own sha256 of the release asset for supply-chain
# integrity. On bump: shasum -a 256 the downloaded .deb and update both lines.
unbound_exporter_version: "0.6.0"
unbound_exporter_checksum: "sha256:4f61876a292b49f918baf6b6b57d17dcf94f97513787282b0dadb88b95084890"
redis_exporter_version: "v1.86.0"

# Helm chart versions for k3s platform workloads
# These flow into kubernetes/infrastructure/sources/versions-configmap.yaml
# via scripts/generate-versions-configmap.py, and Flux substitutes them into
# HelmReleases at reconcile time.
# Update workflow: edit these versions → task flux:sync-versions → commit → push.
# Flux reconciles within ~1 minute (or run `task flux:reconcile` to force).
# Check ArtifactHub or chart repos for latest stable versions:
# - MetalLB: https://artifacthub.io/packages/helm/metallb/metallb
# - Traefik: https://github.com/traefik/traefik-helm-chart/releases
# - cert-manager: https://artifacthub.io/packages/helm/cert-manager/cert-manager
# - external-dns: https://artifacthub.io/packages/helm/external-dns/external-dns
# - VPA: https://artifacthub.io/packages/helm/fairwinds-stable/vpa
helm_chart_versions:
  # 0.16.x has an open regression in the L2 ServiceL2Status reconciler that
  # floods the apiserver (~34 r/s 500s in our setup, enough to trip
  # KubeAPIErrorBudgetBurn). Pinned to 0.15.3 — the v0.16 CRDs already in
  # the cluster are schema-compatible with the 0.15.3 controller+speaker
  # images per upstream. Re-evaluate when the fix lands.
  # Upstream issue: https://github.com/metallb/metallb/issues/3063
  metallb: "0.15.3"
  traefik: "41.0.1"  # App version v3.7.5 (chart 41.x: logs.general->log, logs.access->accessLog)
  cert_manager: "v1.20.3"
  external_dns: "1.21.1"  # App version 0.20.0
  external_secrets: "2.7.0"  # ESO with 1Password Connect provider
  kube_prometheus_stack: "87.10.1"  # prometheus-operator v0.92.x (additive CRD fields; crds: CreateReplace)
  loki: "18.4.0"  # grafana-community/loki (OSS chart after the grafana/ GEL fork at 6.55.0); 18.0.0 = dashboard-gen only
  alloy: "1.10.0"
  prometheus_blackbox_exporter: "11.15.1"
  onepassword_connect: "2.4.1"
  vpa: "4.12.3"
  kured: "6.0.0"  # Kubernetes Reboot Daemon (app 1.22.1); owns k3s-node reboots flagged by maintenance
  reloader: "2.2.12"  # stakater/Reloader (app v1.4.17); auto-restarts annotated workloads on ConfigMap/Secret change

# Proxmox resource pools
# These are created automatically when provisioning VMs/LXCs
proxmox_resource_pools:
  - infra-core      # DNS, SMTP relay, core infrastructure
  - apps-public     # Plex, public-facing applications
  - platform        # k3s nodes, GitOps platform
  - apps-private    # Internal applications

# Firewall IPSet special entries
firewall_ipset_special_entries:
  k3s_nodes:
    - ip: 192.168.0.161
      comment: k3s API VIP

# Proxmox HA configuration
# HA rules (Proxmox 9+) define node affinity for resources
# node-affinity rules restrict which nodes can run specific resources
# All critical services excluded from pve-nas-01 to avoid I/O contention with NAS workloads
#
# Each critical service gets a per-service rule that (a) lists ONLY the five
# local-ssd compute nodes, so it never lands on pve-nas-01 unless every compute
# node is down (strict=false), and (b) gives its HOME node priority 2 vs 1 for the
# rest, so after an HA failover the service fails BACK to its home when that node
# returns instead of stranding on the failover node — the placement drift the
# storage_replication_jobs source-node warnings flag. Replaces the old flat
# critical-services-no-nas rule (kept off nas but had no per-service home
# preference). Homes match the storage_replication_jobs primary layout above,
# EXCEPT dns-01 (ct:150): its home is temporarily pve-opt-01 (not pve-laptop-01)
# because pve-laptop-01 has bad RAM — restore to pve-laptop-01 after the DIMM is
# replaced + re-tested (see the laptop-ssd-watch memory).
ha_rules:
  - name: affinity-dns-01
    type: node-affinity
    resources:
      - ct:150  # dns-01 (AdGuard Home primary)
    nodes:
      # Home moved OFF pve-laptop-01: that host has confirmed bad RAM (one dead
      # cell masked via GRUB_BADRAM, DIMM pending replacement — see the
      # laptop-ssd-watch memory). pve-laptop-01 must never be a HOME (priority>=2)
      # for any service; it stays at :1 so dns-01 can run there only as a last-
      # resort fallback and always migrates back off it. Restore home=pve-laptop-01
      # once the RAM is replaced and re-tested.
      - "pve-opt-01:2"  # home (where dns-01 currently runs)
      - "pve-opt-02:1"
      - "pve-opt-03:1"
      - "pve-prec-01:1"
      - "pve-laptop-01:1"  # fallback only — bad RAM, never a home
    strict: false
    comment: "dns-01 home pve-opt-01 (fails back when available); pve-laptop-01 fallback-only (bad RAM); never pve-nas-01"
    enabled: true

  - name: affinity-smtp-relay
    type: node-affinity
    resources:
      - ct:151  # smtp-relay (Postfix relay)
    nodes:
      - "pve-opt-01:2"  # home
      - "pve-laptop-01:1"
      - "pve-opt-02:1"
      - "pve-opt-03:1"
      - "pve-prec-01:1"
    strict: false
    comment: "smtp-relay home pve-opt-01 (fails back when available); never pve-nas-01"
    enabled: true

  - name: affinity-dns-02
    type: node-affinity
    resources:
      - ct:160  # dns-02 (AdGuard Home secondary)
    nodes:
      - "pve-opt-03:2"  # home
      - "pve-laptop-01:1"
      - "pve-opt-01:1"
      - "pve-opt-02:1"
      - "pve-prec-01:1"
    strict: false
    comment: "dns-02 home pve-opt-03 (fails back when available); never pve-nas-01"
    enabled: true

  - name: affinity-home-assistant
    type: node-affinity
    resources:
      - vm:154  # home-assistant (HAOS VM)
    nodes:
      - "pve-prec-01:2"  # home
      - "pve-laptop-01:1"
      - "pve-opt-01:1"
      - "pve-opt-02:1"
      - "pve-opt-03:1"
    strict: false
    comment: "home-assistant home pve-prec-01 (fails back when available); never pve-nas-01"
    enabled: true

  # Superseded by the per-service affinity rules above. Kept (disabled) for one
  # deploy so the role's remove step deletes the live rule; safe to drop afterward.
  - name: critical-services-no-nas
    type: node-affinity
    resources:
      - ct:150
      - ct:151
      - ct:160
      - vm:154
    nodes:
      - pve-laptop-01
      - pve-opt-01
      - pve-opt-02
      - pve-opt-03
      - pve-prec-01
    strict: false
    enabled: false

# HA resources define which VMs/containers are managed by HA
# These will automatically restart/relocate on node failure
ha_resources:
  - type: ct
    vmid: 150
    state: started
    comment: "dns-01 (AdGuard Home primary)"
    enabled: true

  - type: ct
    vmid: 151
    state: started
    comment: "smtp-relay (Postfix relay)"
    enabled: true

  - type: ct
    vmid: 160
    state: started
    comment: "dns-02 (AdGuard Home secondary)"
    enabled: true

  - type: vm
    vmid: 154
    state: started
    comment: "home-assistant (HAOS VM)"
    enabled: true

# Proxmox Storage Replication configuration
# Replication jobs provide near-synchronous data replication for fast failover
# Jobs replicate from primary node to ALL other eligible nodes every 15 minutes
#
# Multi-target replication:
# - Proxmox supports replicating a guest to MULTIPLE target nodes
# - Each service replicates to ALL 4 other local-ssd nodes (not just one)
# - This allows HA to failover to ANY available node, not just a single backup
# - Replication job IDs: <VMID>-<job_number> (0, 1, 2, 3 for 4 targets)
# - pve-nas-01 excluded: no local-ssd storage, services migrated OFF for I/O contention
#
# Node layout (primary locations):
# - pve-laptop-01: dns-01 (150)
# - pve-opt-01: smtp-relay (151)
# - pve-opt-02: (no primary services - backup only)
# - pve-opt-03: dns-02 (160)
# - pve-prec-01: home-assistant (154)
#
storage_replication_jobs:
  # dns-01 (VMID 150) - Primary on pve-laptop-01
  # Replicate to all other local-ssd nodes
  # Staggered: offset 0 (explicit times instead of */15 so the four
  # services' offsets stay deterministic)
  - id: "150-0"
    source_node: pve-laptop-01
    target_node: pve-opt-01
    schedule: "0,15,30,45"
    comment: "dns-01 -> pve-opt-01"
    enabled: true
  - id: "150-1"
    source_node: pve-laptop-01
    target_node: pve-opt-02
    schedule: "0,15,30,45"
    comment: "dns-01 -> pve-opt-02"
    enabled: true
  - id: "150-2"
    source_node: pve-laptop-01
    target_node: pve-opt-03
    schedule: "0,15,30,45"
    comment: "dns-01 -> pve-opt-03"
    enabled: true
  - id: "150-3"
    source_node: pve-laptop-01
    target_node: pve-prec-01
    schedule: "0,15,30,45"
    comment: "dns-01 -> pve-prec-01"
    enabled: true

  # smtp-relay (VMID 151) - Primary on pve-opt-01
  # Replicate to all other local-ssd nodes
  # Staggered: offset 3 from dns-01's slots
  - id: "151-0"
    source_node: pve-opt-01
    target_node: pve-laptop-01
    schedule: "3,18,33,48"
    comment: "smtp-relay -> pve-laptop-01"
    enabled: true
  - id: "151-1"
    source_node: pve-opt-01
    target_node: pve-opt-02
    schedule: "3,18,33,48"
    comment: "smtp-relay -> pve-opt-02"
    enabled: true
  - id: "151-2"
    source_node: pve-opt-01
    target_node: pve-opt-03
    schedule: "3,18,33,48"
    comment: "smtp-relay -> pve-opt-03"
    enabled: true
  - id: "151-3"
    source_node: pve-opt-01
    target_node: pve-prec-01
    schedule: "3,18,33,48"
    comment: "smtp-relay -> pve-prec-01"
    enabled: true

  # dns-02 (VMID 160) - Primary on pve-opt-03
  # Replicate to all other local-ssd nodes
  # Staggered: offset 6
  - id: "160-0"
    source_node: pve-opt-03
    target_node: pve-laptop-01
    schedule: "6,21,36,51"
    comment: "dns-02 -> pve-laptop-01"
    enabled: true
  - id: "160-1"
    source_node: pve-opt-03
    target_node: pve-opt-01
    schedule: "6,21,36,51"
    comment: "dns-02 -> pve-opt-01"
    enabled: true
  - id: "160-2"
    source_node: pve-opt-03
    target_node: pve-opt-02
    schedule: "6,21,36,51"
    comment: "dns-02 -> pve-opt-02"
    enabled: true
  - id: "160-3"
    source_node: pve-opt-03
    target_node: pve-prec-01
    schedule: "6,21,36,51"
    comment: "dns-02 -> pve-prec-01"
    enabled: true

  # home-assistant (VMID 154) - Primary on pve-prec-01
  # Replicate to all other local-ssd nodes
  # Staggered: offset 9
  - id: "154-0"
    source_node: pve-prec-01
    target_node: pve-laptop-01
    schedule: "9,24,39,54"
    comment: "home-assistant -> pve-laptop-01"
    enabled: true
  - id: "154-1"
    source_node: pve-prec-01
    target_node: pve-opt-01
    schedule: "9,24,39,54"
    comment: "home-assistant -> pve-opt-01"
    enabled: true
  - id: "154-2"
    source_node: pve-prec-01
    target_node: pve-opt-02
    schedule: "9,24,39,54"
    comment: "home-assistant -> pve-opt-02"
    enabled: true
  - id: "154-3"
    source_node: pve-prec-01
    target_node: pve-opt-03
    schedule: "9,24,39,54"
    comment: "home-assistant -> pve-opt-03"
    enabled: true

# Postfix null client SASL credentials (shared by all hosts running postfix_null_client)
# Credentials injected via 'op run --' (handled automatically by task wrapper)
postfix_sasl_user: "{{ lookup('ansible.builtin.env', 'SMTP_RELAY_USER') or undef(hint='SMTP_RELAY_USER env var must be set') }}"
postfix_sasl_password: "{{ lookup('ansible.builtin.env', 'SMTP_RELAY_PASSWORD') or undef(hint='SMTP_RELAY_PASSWORD env var must be set') }}"

# Mail aliases (shared by all hosts)
mail_aliases:
  postmaster: root
  nobody: root
  hostmaster: root
  webmaster: root
  root: "{{ admin_email }}"
