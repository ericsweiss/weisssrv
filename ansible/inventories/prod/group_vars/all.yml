---
# Global variables for all hosts in the homelab

# Domain configuration
internal_domain: esweiss.com
external_domain: ericsweiss.com

# DNS servers
dns_servers:
  - 192.168.0.150
  - 192.168.0.160

# Hosts that are KNOWINGLY out of the fleet (hardware work, decommissioning) and
# may therefore be skipped by base.yml / site.yml without failing the run.
# Read by playbooks/_reachability-gate.yml: a listed host downgrades an
# UNREACHABLE skip from a hard failure to a loud warning; anything else still
# ends the playbook non-zero, because `ignore_unreachable` alone would exit 0
# having configured nothing there. Keep this list EMPTY in steady state — an
# entry is a dated, reviewable concession, not a permanent exemption, and every
# role that host needs stays undeployed for as long as it sits here.
# The downgrade only covers hosts the multi-host plays tolerate. site.yml's
# SINGLE-host plays (mail, pve-nas-01) deliberately keep no ignore_unreachable,
# so losing their one host is still a hard UNREACHABLE that ends the run rc 4 —
# listing smtp-relay or pve-nas-01 here does NOT make site.yml green.
deploy_expected_absent_hosts: []

# Proxmox autostart / boot order is set PER GUEST, never here.
#
# There is deliberately no group-wide `proxmox_autostart_enabled` /
# `proxmox_startup_order` / `proxmox_startup_delay`: the proxmox_lxc role reads
# `proxmox_autostart_enabled | default(proxmox_lxc_onboot)` (same shape for
# order/delay), so a value at this level SHADOWS every per-container
# `proxmox_lxc_*` host_var and reconciles all five LXC guests to
# onboot=1,order=100,up=0 — which would flip plex to onboot=1 (its /config bind
# mount is on the encrypted ssd pool; only pve-start-encrypted-guests may start
# it) and flatten the DNS(10) -> SMTP(20) -> apps(50/57) cold-boot ordering.
# VMs keep the neutral `proxmox_autostart_*` names in hosts.yml (proxmox_vm has
# no prefixed alias); LXC containers use `proxmox_lxc_onboot` /
# `proxmox_lxc_startup_order` / `proxmox_lxc_startup_delay` in host_vars. The
# role defaults (true / 100 / 0) are the fallback for a guest that sets neither.

# LAN gateway for guest provisioning. Required inputs with no role default:
# proxmox_lxc asserts proxmox_lxc_gateway and proxmox_vm asserts
# proxmox_vm_cloudinit_gateway at role entry (both were site-specific role
# defaults before the weisssrv.infra extraction).
proxmox_lxc_gateway: 192.168.0.1
proxmox_vm_cloudinit_gateway: 192.168.0.1

# Proxmox storage default per proxmox_role; override per guest with
# proxmox_storage (VMs) / proxmox_lxc_storage (LXC). Pool geometry: docs/06.
proxmox_storage_defaults:
  nas: ssd
  compute: local-ssd
  general: local-ssd

# Central relay every postfix_null_client host forwards to, and the domain
# appended to inventory_hostname to form each null client's myhostname.
postfix_null_client_relay_host: "smtp-relay.{{ internal_domain }}"
postfix_null_client_relay_port: 587
postfix_null_client_mail_domain: "{{ internal_domain }}"

# Admin user configuration
admin_user: eric
admin_email: "{{ lookup('ansible.builtin.env', 'ROOT_EMAIL_ALIAS') or undef(hint='ROOT_EMAIL_ALIAS env var must be set (run via the task wrapper / op run)') }}"

# SSH configuration
ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: false
ssh_pubkey_authentication: true

# Pinned HAOS (Home Assistant OS) SSH host key. Single source of truth
# consumed by both the home_assistant role (via home_assistant_host_key
# in host_vars/home.yml) and the acme_certs cert push (via the `home`
# entry in acme_certs_distribution_targets in host_vars/dns-01.yml). Rotate
# here once after a HAOS rebuild:
#   ssh-keyscan -t ed25519 -p 22222 192.168.0.154
# Paste only the algorithm + base64 key (no leading "[host]:port").
haos_ssh_host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKcIncJ961hzakmaNlj9Nw6zwOWRZm0sEYgDntiKDb9O"

# SSH authorized keys
# IMPORTANT: SSH_PUBLIC_KEY must be set via 'op run' - empty key will fail validation
#
# from= ranges: LAN, Tailscale, and the k3s pod CIDR. The pod CIDR is required
# because a CI deploy pod SSHing to its OWN node hairpins without SNAT and
# arrives with a 10.42.x source; cross-host pod connections already masquerade
# to a permitted LAN IP, so it adds no exposure.
ssh_authorized_keys:
  - >-
    from="192.168.0.0/24,100.64.0.0/10,10.42.0.0/16"
    {{ lookup('ansible.builtin.env', 'SSH_PUBLIC_KEY') or undef(hint='SSH_PUBLIC_KEY env var must be set') }}

# fail2ban never-ban list. The role default is loopback only; the LAN and the
# tailnet are added back so an admin source cannot be banned out of its own
# hosts (both are already the only sources the firewall admits to :22).
base_fail2ban_ignoreip:
  - 127.0.0.1/8
  - ::1
  - 192.168.0.0/24
  - 100.64.0.0/10

# 1Password references are NOT duplicated here. `op run --` resolves them from
# the literal op:// strings in the Taskfile's per-task `env:` blocks (and the
# equivalent CI job variables); the authoritative item inventory is
# docs/15-credential-rotation.md § Required 1Password Items.

# Timezone
timezone: America/Los_Angeles

# Package management
base_common_packages:
  - curl
  - wget
  - neovim
  - htop
  - tmux
  - screen
  - git
  - jq
  - unzip
  - rsync
  - net-tools
  - dnsutils
  - ca-certificates
  - gnupg
  - lsb-release
  - sudo
  - pciutils  # Required for lspci (e1000e NIC detection workaround)

# Host-side journald -> Loki shipping (alloy_host). The role asserts the URL at
# entry, and asserts the credentials for an https:// endpoint. The push goes
# through the internal Traefik IngressRoute; NodePort :31100 stays the
# emergency fallback (override alloy_host_loki_url per host).
alloy_host_loki_url: "https://loki.{{ internal_domain }}/loki/api/v1/push"
alloy_host_loki_user: "{{ lookup('ansible.builtin.env', 'LOKI_PUSH_USER') | default('', true) }}"
alloy_host_loki_password: "{{ lookup('ansible.builtin.env', 'LOKI_PUSH_PASSWORD') | default('', true) }}"

# Placeholder-cert SAN for a direct compose_app run (was a role default before
# the extraction). The wrapper roles override it: immich passes
# immich_nginx_self_signed_san, nextcloud passes "" (single-host CN).
compose_app_nginx_self_signed_san: "DNS:*.{{ internal_domain }}"

# Tailscale configuration
tailscale_enabled: true
tailscale_accept_routes: false  # Hosts should NOT accept routes (prevents routing loops)
tailscale_accept_dns: false  # Use local DNS infrastructure
tailscale_advertise_routes: []  # Only subnet routers (Proxmox hosts) should advertise routes

# Application version pins
adguard_home_version: "0.107.78"
adguard_sync_version: "0.9.2"
# Host-side Alloy apt package (alloy_host role; distinct from the in-cluster
# helm_chart_versions.alloy chart pin below).
alloy_host_version: "1.18.1-1"
tailscale_version: "1.102.2"
# qol shell/editor pins. Oh My Zsh publishes no release tags, so the clone is
# pinned to a commit (https://github.com/ohmyzsh/ohmyzsh/commits/master);
# Vundle is tagged. Host-side only — not Flux versions.
qol_omz_commit: "061f773dd356df52a8bccd5e73377c012f97ef14"
qol_vundle_version: "v0.10.2"
# CoreDNS image for the tailnet-dns split-horizon resolver (kubernetes/apps/
# tailnet-dns). Pinned to the rancher mirror k3s already caches on every node.
coredns_tailnet_version: "1.14.6"
debian_version: "13"
# Proxmox LXC root template (pveam appliance). Authoritative pin — mirrors the
# proxmox_lxc role default (bump both together; the role default is the
# molecule/standalone fallback). Not a Flux version (host-side Ansible), so it is
# NOT added to the versions ConfigMap. Upstream silently rotates the point
# release (13.1-2 -> 13.6-1 broke a cached-template recreate — see the
# proxmox_lxc role), so it is tracked in check-versions.py (category
# "manual"); check for a newer build with `pveam update && pveam available
# --section system | grep debian-13-standard`.
proxmox_lxc_template: "debian-13-standard_13.6-1_amd64.tar.zst"
k3s_version: "v1.36.3+k3s1"
# Pin the sha256 of install.sh for the k3s_version tag so get_url verifies the
# root-run installer script before exec (fail-closed against a force-pushed tag /
# compromised CDN / MITM — install.sh's own check covers the k3s binary, not the
# script itself). Host-side ansible, NOT a Flux version — do not add to the
# versions ConfigMap. Recompute + update in lockstep with every k3s_version bump:
#   curl -sfL https://raw.githubusercontent.com/k3s-io/k3s/<k3s_version>/install.sh | sha256sum
k3s_install_script_checksum: "sha256:46177d4c99440b4c0311b67233823a8e8a2fc09693f6c89af1a7161e152fbfad"
kube_vip_version: "v1.2.3"
# Flux CLI used by CI deploy-verify; the job pins a matching sha256 —
# update both together when bumping.
flux_version: "2.9.0"

# Authentik SSO identity provider
authentik_version: "2026.5.6"

# PostgreSQL version for Authentik (bundled with Helm chart)
# Using Debian Trixie base for consistency with homelab standard
# Available tags: https://hub.docker.com/_/postgres/tags
postgresql_version: "18.6-trixie"

# PostgreSQL version for Mealie (standalone deployment)
# Using Alpine base for lighter footprint
# Available tags: https://hub.docker.com/_/postgres/tags
mealie_postgresql_version: "18.6-alpine"

# Download clients and media stack versions
# Pinned to specific versions for reproducible deployments and controlled updates.
# After editing a version here, run `task flux:sync-versions` to regenerate
# kubernetes/infrastructure/sources/versions-configmap.yaml, then commit +
# push both files — Flux reconciles the new image tags into the running pods.
# LinuxServer.io images: https://docs.linuxserver.io/images/
# Gluetun: https://github.com/qdm12/gluetun/releases
# Pulsarr: https://github.com/jamcalli/Pulsarr/releases
# busybox: init container utility image used by VPN sidecar pre-checks
busybox_version: "1.38"
gluetun_version: "v3.41.3"
nzbget_version: "26.2"
qbittorrent_version: "5.2.3"
prowlarr_version: "2.5.2.5491"
sonarr_version: "4.0.19.2979"
radarr_version: "6.3.0.10514"
lidarr_version: "3.1.0.4875"
pulsarr_version: "0.18.0"

# wg-easy WireGuard VPN (internet-exit VPN for the user + friends/family).
# Container tag has NO leading "v" (upstream convention: :15.3.0, not :v15.3.0).
# https://github.com/wg-easy/wg-easy/releases
wg_easy_version: "15.4.0"

# Recipe management stack versions
# Mealie: https://github.com/mealie-recipes/mealie/releases
# Bar Assistant: https://github.com/bar-assistant/bar-assistant/releases
# Salt Rim: https://hub.docker.com/r/barassistant/salt-rim/tags
# Meilisearch: https://github.com/meilisearch/meilisearch/releases (pinned to 1.15.x for Bar Assistant compat)
# Redis: https://hub.docker.com/_/redis/tags (Alpine variant)
mealie_version: "v3.22.0"
bar_assistant_version: "5.15.4"
salt_rim_version: "4.15.0"
meilisearch_version: "v1.15.2"
redis_version: "8.10.0-alpine"

# Plex Media Server version (apt-managed via official repository)
plex_version: "1.43.3.10861-07dfddaeb"

# GitLab EE (using CE features) - Omnibus package
# https://packages.gitlab.com/gitlab/gitlab-ee
# 19.1.x line (incl. CVE-2026-5816 Web IDE single-origin fix); 19.1.2-ee.0 =
# current latest patch. Applied by task gitlab:deploy / the deploy-gitlab CI
# job (triggered on all.yml changes); maintenance apt-upgrade honors the
# gitlab-ee package hold and will not bump it.
gitlab_version: "19.2.2-ee.0"

# GitLab Runner version for k3s cluster
# https://gitlab.com/gitlab-org/charts/gitlab-runner/tags
gitlab_runner_helm_version: "0.91.2"

# GitLab Agent for Kubernetes Helm chart version
# https://gitlab.com/gitlab-org/charts/gitlab-agent/tags
gitlab_agent_helm_version: "2.29.0"

# In-cluster pull-through Docker registry cache for CI (kubernetes/apps/
# registry-cache, docs/27 § Registry pull-through cache) — the CNCF distribution
# `registry` image (Docker Hub library/registry), run in proxy mode in front of
# registry.git.ericsweiss.com so molecule CI jobs warm-hit the molecule-test
# image on the LAN. Bare X.Y.Z tag. https://hub.docker.com/_/registry/tags
registry_cache_version: "3.1.1"

# Nextcloud (Docker Compose stack on the NAS-pinned VM, 192.168.0.156)
# Consumed by Ansible (the nextcloud role) directly from all.yml — the VM
# containers are NOT Flux-managed, but the pins live here per the
# single-source-of-truth convention (they flow harmlessly into the versions
# ConfigMap; no k8s manifest references them).
# Nextcloud server: https://github.com/nextcloud/docker/blob/master/versions.json (34 = current stable, PHP 8.5, Debian trixie)
nextcloud_version: "34.0.3"
# PostgreSQL: PG 18 is Nextcloud-recommended; matches the homelab postgres pin.
# https://hub.docker.com/_/postgres/tags
nextcloud_postgres_version: "18.6-trixie"
# Redis (cache + transactional file locking) reuses the shared `redis_version`
# pin above — same image/tag, tracked once by the "Redis" version-check entry.
# Nextcloud exporter: https://github.com/xperimental/nextcloud-exporter/releases
nextcloud_exporter_version: "0.9.1"
# The Nextcloud VM's Docker engine uses the shared docker_engine_* pins below —
# one source of truth across immich / immich_ml / nextcloud.

# Immich (photo-management VM, docker-compose stack — consumed by the immich
# Ansible role; the VM-only pins ride the versions-configmap as a harmless
# superset). App: https://github.com/immich-app/immich/releases
# The Postgres + Valkey images (tag AND digest) are whatever Immich's pinned
# release pins in its own docker/docker-compose.yml — the DB is release-coupled
# (vectorchord/pgvectors build), so NEVER bump it independently of immich_version.
immich_version: "v3.1.0"
immich_postgres_version: "14-vectorchord0.4.3-pgvectors0.2.0"
immich_postgres_digest: "sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23"
immich_valkey_version: "9"
immich_valkey_digest: "sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9"

# Docker Engine — the single pinned apt versions for the Debian 13/trixie VM
# compose stacks (immich, immich_ml, nextcloud via the shared docker_engine
# role). dpkg-held so the maintenance apt-upgrade never bumps them under a
# running stack. Bump workflow:
# https://download.docker.com/linux/debian/dists/trixie/stable/binary-amd64/Packages
docker_engine_ce_version: "5:29.6.2-1~debian.13~trixie"
docker_engine_containerd_version: "2.2.6-1~debian.13~trixie"
docker_engine_buildx_plugin_version: "0.35.0-1~debian.13~trixie"
docker_engine_compose_plugin_version: "5.3.1-1~debian.13~trixie"
# VirtIO driver ISO for the Windows 11 VM (proxmox_vm windows guest path).
# The proxmox_vm role downloads + checksum-verifies this ISO to the
# tank-proxmox store so Windows setup can load the virtio-scsi (viostor) and
# virtio-net (netkvm) drivers. Pinned to a versioned Fedora ARCHIVE URL (the
# stable-virtio/ symlink is a moving target that breaks the pin on the next
# upstream release). Fedora publishes no ISO checksum in its CHECKSUM file
# (RPMs only), so this sha256 is computed from the pinned archive artifact.
# On bump: change proxmox_vm_virtio_win_version, then recompute the new ISO's sha256
#   curl -sL https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/archive-virtio/virtio-win-<ver>-1/virtio-win-<ver>.iso | sha256sum
# and update both lines. The Windows install ISO itself is downloaded manually
# from Microsoft (it can't be redistributed) — see docs/39-windows-vm.md.
# https://github.com/virtio-win/virtio-win-pkg-scripts
proxmox_vm_virtio_win_version: "0.1.285"
proxmox_vm_virtio_win_checksum: "sha256:e14cf2b94492c3e925f0070ba7fdfedeb2048c91eea9c5a5afb30232a3976331"
# Hermes Agent (NousResearch) - autonomous AI agent + web dashboard
# https://github.com/NousResearch/hermes-agent/releases
# Upstream ships no published image; the build-hermes-agent CI job clones the
# repo at this git tag and builds THEIR Dockerfile into the GitLab registry as
# hermes-agent:${hermes_version}. The value is the upstream RELEASE TAG (used
# verbatim both as `git clone --branch` and as the built image tag), NOT the
# semver whl version (v2026.7.7.2 == release 0.18.2). Bump = pick a newer tag,
# update hermes_git_sha below to that tag's commit, run task flux:sync-versions,
# commit — CI verifies the tag→SHA, rebuilds, Flux rolls the pods.
hermes_version: "v2026.8.13"
# Immutable commit the pinned tag must resolve to. build-hermes-agent refuses to
# build if `git clone --branch hermes_version` resolves to a different HEAD,
# defending against a moved/compromised upstream tag. Update in lockstep with
# hermes_version (get it from the tag on GitHub or the CI build log).
hermes_git_sha: "f80f453ae0679347e38abc917c7f94f717bf96c5"
# PUBLISHED image tag = <hermes_version>-r<N>. The -rN local revision exists
# because the image is upstream + our reviewed patches (docker/hermes-agent/
# patches/): a patch change without an upstream bump must produce a NEW tag or
# the nodes' IfNotPresent cache would keep serving the unpatched image. Bump
# -rN when patches change; reset to -r1 on a hermes_version bump. CI asserts
# the prefix matches hermes_version so the two can never drift.
hermes_image_version: "v2026.8.13-r2"
# OpenAI Codex CLI (https://github.com/openai/codex/releases, npm @openai/codex).
# Hermes' Codex app-server runtime delegates OpenAI/Codex turns to this CLI over
# JSON-RPC stdio, authenticated with a ChatGPT subscription (OAuth) — no API
# billing. The build-hermes-agent CI job bakes it into the image via the thin
# docker/hermes-agent/Dockerfile.codex wrapper (npm i -g @openai/codex@<pin>).
# Requires >=0.130.0 for the Hermes runtime; the image already ships Node 22.
# Bump = pick a newer stable release, sync-versions, commit — CI rebuilds the
# wrapper, Flux rolls the pods. NOT substituted into any manifest (build-time
# only); it rides in the versions ConfigMap as a harmless superset.
hermes_codex_version: "0.147.0"
# Claude Code CLI (https://github.com/anthropics/claude-code, npm
# @anthropic-ai/claude-code). Baked into the hermes-agent image alongside the
# Codex CLI so Hermes can DELEGATE coding tasks to Claude Code headlessly
# (`claude -p` via the terminal tool / the bundled claude-code skill),
# authenticated with a Claude Max subscription long-lived OAuth token
# (`claude setup-token` -> CLAUDE_CODE_OAUTH_TOKEN via ESO — subscription
# billing, no API key; the CLI holds the credential, Hermes only reads stdout).
# Bump = pick a newer stable release, sync-versions, commit — CI rebuilds the
# wrapper, Flux rolls the pods. Build-time only; rides in the versions
# ConfigMap as a harmless superset (same as hermes_codex_version).
hermes_claude_version: "2.1.233"
# 1Password CLI (op), the official first-party binary. Baked into the hermes
# image (docker/hermes-agent/Dockerfile.codex) so Hermes' first-party 1Password
# skill can drive `op` against the isolated Agent vault via a service-account
# token (OP_SERVICE_ACCOUNT_TOKEN — wired in kubernetes/apps/hermes; docs/37
# §1Password). Value is the full DEB version string (apt pin), not the bare
# semver `op --version` reports (2.39.0). No release feed to poll — bump by
# checking `apt-cache madison 1password-cli` against 1Password's signed repo,
# then sync-versions + commit; CI rebuilds the wrapper. Build-time only (not
# substituted into any manifest); rides in the versions ConfigMap as a harmless
# superset like hermes_codex_version.
#
# NOT optional maintenance: the repo carries exactly ONE version at a time —
# 1Password prunes the rest — so a stale pin FAILS the image build outright
# (not merely lags), and every upstream release invalidates this pin whether or
# not anything else changed. version-check cannot catch it: there is no release
# feed. Read the current version straight off the Packages index:
#   curl -fsSL https://downloads.1password.com/linux/debian/amd64/dists/stable/main/binary-amd64/Packages \
#     | awk '/^Package: 1password-cli$/{p=1} p&&/^Version:/{print $2; p=0}'
# 2.38.1-1 was pruned in favour of 2.39.0-1 and broke build-hermes-agent on
# pipeline 1333 (2026-08-14).
hermes_op_version: "2.39.0-1"
# Camofox anti-detection browser server (jo-inc/camofox-browser) — the sidecar
# behind Hermes' camofox browser tool (CAMOFOX_URL). Upstream publishes no
# container image; the build-camofox-browser CI job clones the repo at tag
# v<version> and builds THEIR Dockerfile unmodified into the GitLab registry as
# camofox-browser:<version>. The pin is the bare semver (the image tag); the
# git tag carries the leading "v". Bump = pick a newer stable tag, update
# hermes_camofox_git_sha below to that tag's commit, sync-versions, commit.
# https://github.com/jo-inc/camofox-browser/releases
hermes_camofox_version: "1.13.0"
# Immutable commit tag v${hermes_camofox_version} must resolve to.
# build-camofox-browser refuses to build if the clone resolves elsewhere
# (moved/compromised tag defence — same pattern as hermes_git_sha). Update in
# lockstep with hermes_camofox_version.
hermes_camofox_git_sha: "8b5b0959adfadadae38ecce9d7eed706ab102bf1"

# Hindsight agent-memory server (vectorize-io/hindsight) — Hermes' long-term
# memory backend (kubernetes/apps/hindsight, docs/37 §Memory backend). The pin
# is the ghcr.io/vectorize-io/hindsight image tag (bare semver; the git tag
# carries a leading "v"). https://github.com/vectorize-io/hindsight/releases
hindsight_version: "0.9.1"
# llama.cpp server sidecar for Hindsight's local LLM. The deployment builds the
# image tag as ghcr.io/ggml-org/llama.cpp:server-cuda-<pin> — the CUDA build,
# for GPU offload on the pve-prec-01 1660 Ti (docs/43). Upstream tags a build
# (bNNNN) many times per day and publishes BOTH server-<build> (CPU) and
# server-cuda-<build> (CUDA) for a given build, so this one pin drives both; not
# every build publishes images, so it is bumped opportunistically (any recent
# build with a server-cuda- variant serves the pinned Gemma GGUF), category
# "manual" in check-versions. https://github.com/ggml-org/llama.cpp/releases
hindsight_llamacpp_version: "b10068"

# GPU stack for the pve-prec-01 1660 Ti (Hindsight CUDA offload, docs/43).
# nvidia-open (the open GPU kernel modules) comes from NVIDIA's own CUDA apt repo
# (debian13), NOT Debian non-free — installed on the agent VM by the k3s role's
# tasks/gpu.yml. The open modules support Turing (TU116 is GSP-equipped) and are
# CUDA-12.8-capable: the Hindsight llama.cpp image is built against CUDA 12.8,
# which needs a native driver >= 570 on a consumer GeForce card (cuda-compat
# forward-compat is unsupported there), so the Debian non-free 550 is too old.
# The driver pin is an EXACT apt version. gpu.yml HOLDS nvidia-open after install
# so a routine `apt upgrade` can't move it off the pin; bump this pin to upgrade
# (the install passes allow_change_held_packages, so it applies over the hold).
# https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64/
nvidia_driver_version: "610.43.02-1"
# NVIDIA CUDA apt repo keyring. The debian13 CUDA repo InRelease is signed by a key
# NVIDIA does NOT publish as a standalone .pub (unlike debian12's older 3bf863cc.pub
# — a DIFFERENT key); it ships ONLY in the official cuda-keyring package, which also
# drops the matching sources file. gpu.yml verifies this SHA256 BEFORE installing
# the deb (it runs maintainer scripts as root, so the artifact is checked up front
# — verify-before-trust); the repo it drops (signed key 02182E60…8793F200) is then
# apt-verified against that key on every fetch. Bump version + sha256 in lockstep.
# https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64/
nvidia_cuda_keyring_version: "1.1-1"
nvidia_cuda_keyring_sha256: "d0d4ef986a44400f9db33c600ef33a985175e7cc63d805a10e1839c7a1e78f5f"
# nvidia-container-toolkit from NVIDIA's libnvidia-container apt repo (added via
# the apt_signed_repo pattern). Provides nvidia-container-runtime, which k3s
# (>=1.30) auto-detects on PATH and wires into its generated containerd config as
# the `nvidia` runtime handler (no config-v3.toml.tmpl needed). Exact apt pin.
# https://github.com/NVIDIA/nvidia-container-toolkit/releases
nvidia_container_toolkit_version: "1.19.1-1"
# NVIDIA DCGM exporter image (raw DaemonSet on the GPU node,
# kubernetes/infrastructure/observability/exporters/dcgm-exporter.yaml). Tag form
# is <DCGM ver>-<exporter ver>-<variant>. nvcr.io/nvidia/k8s/dcgm-exporter.
# https://github.com/NVIDIA/dcgm-exporter/releases
dcgm_exporter_version: "4.6.0-4.8.3-distroless"

# Homarr dashboard (kubernetes/apps/homarr, docs/41) — the ghcr.io/homarr-labs/
# homarr image tag. The Docker tag is v-PREFIXED (v1.71.0 returns 200; a bare
# 1.71.0 is 404), so keep the leading "v". https://github.com/homarr-labs/homarr/releases
homarr_version: "v1.75.0"

# Offsite backup binaries (restic_offsite role on pve-nas-01, docs/42).
# restic installs from Debian apt (0.18.x, current); a NON-EMPTY restic_version
# becomes an EXACT apt pin (restic=<value>) — leave empty ("" = distro).
# rclone installs from rclone.org's official .deb, pinned + sha256-verified
# (Debian ships a 2022-era 1.60.1-DEV build; the pin keeps the backup
# transport reproducible). Bump BOTH values together from
# https://downloads.rclone.org/vX.Y.Z/SHA256SUMS (linux-amd64.deb line).
# Host-side only — no k8s substitution.
restic_offsite_restic_version: ""
restic_offsite_rclone_version: "1.74.4"
restic_offsite_rclone_deb_sha256: "a9da2eaa70428c6dcc5acbb0b7eac0faec4c61643e0b468d9fe09ddf79b7e929"

# Observability stack versions
# kube-prometheus-stack, Loki, Alloy chart versions are in helm_chart_versions below.
# Container image versions for standalone exporters:
# Exportarr: https://github.com/onedr0p/exportarr/releases
# Blackbox exporter chart version is in helm_chart_versions below.
# Proxmox VE Exporter: https://github.com/prometheus-pve/prometheus-pve-exporter/releases
# ZFS Exporter: https://github.com/pdf/zfs_exporter/releases
# AdGuard Exporter: https://github.com/henrywhitaker3/adguard-exporter/releases
# Unbound Exporter: https://github.com/letsencrypt/unbound_exporter/releases
# Redis Exporter: https://hub.docker.com/r/oliver006/redis_exporter/tags
exportarr_version: "v2.3.0"
proxmox_exporter_version: "3.10.0"
zfs_exporter_version: "2.4.1"
# sha256 of zfs_exporter-<version>.linux-amd64.tar.gz from the release's
# sha256sums.txt — verified by get_url so a tampered/MITM'd binary (run as
# root with /dev/zfs access) fails the download. Update on every version bump.
zfs_exporter_checksum: "sha256:60489e74e8f41eadff4f313fb16e94fc0964d37b9cf1be79c25c927b285a3228"
adguard_exporter_version: "v1.2.1"
# 0.6.0 publishes an x86_64 .deb again (0.5.0 was source-only); the role
# installs via .deb (prometheus_exporter_artifact_type: deb). Upstream ships no
# checksum file, so we pin our own sha256 of the release asset for supply-chain
# integrity. On bump: shasum -a 256 the downloaded .deb and update both lines.
unbound_exporter_version: "0.6.0"
unbound_exporter_checksum: "sha256:4f61876a292b49f918baf6b6b57d17dcf94f97513787282b0dadb88b95084890"
redis_exporter_version: "v1.89.0"
# postgres_exporter sidecar for the VM compose stacks (immich, nextcloud). The
# GitLab VM uses the exporter Omnibus already bundles, so it carries no pin.
# https://github.com/prometheus-community/postgres_exporter/releases
postgres_exporter_version: "v0.20.1"

# Helm chart versions for k3s platform workloads
# These flow into kubernetes/infrastructure/sources/versions-configmap.yaml
# via scripts/generate-versions-configmap.py, and Flux substitutes them into
# HelmReleases at reconcile time.
# Update workflow: edit these versions → task flux:sync-versions → commit → push.
# Flux reconciles within ~1 minute (or run `task flux:reconcile` to force).
# Check ArtifactHub or chart repos for latest stable versions:
# - MetalLB: https://artifacthub.io/packages/helm/metallb/metallb
# - Traefik: https://github.com/traefik/traefik-helm-chart/releases
# - cert-manager: https://artifacthub.io/packages/helm/cert-manager/cert-manager
# - external-dns: https://artifacthub.io/packages/helm/external-dns/external-dns
# - VPA: https://artifacthub.io/packages/helm/fairwinds-stable/vpa
helm_chart_versions:
  # 0.16.x has an open regression in the L2 ServiceL2Status reconciler that
  # floods the apiserver (~34 r/s 500s in our setup, enough to trip
  # KubeAPIErrorBudgetBurn). Pinned to 0.15.3 — the v0.16 CRDs already in
  # the cluster are schema-compatible with the 0.15.3 controller+speaker
  # images per upstream. Re-evaluate when the fix lands.
  # Upstream issue: https://github.com/metallb/metallb/issues/3063
  metallb: "0.15.3"
  traefik: "41.2.0"  # App version v3.7.10 (chart 41.x: logs.general->log, logs.access->accessLog)
  cert_manager: "v1.21.1"
  external_dns: "1.21.1"  # App version 0.20.0
  external_secrets: "2.9.0"  # ESO with 1Password Connect provider
  kube_prometheus_stack: "88.3.0"  # prometheus-operator v0.93.0 (additive CRD fields; crds: CreateReplace)
  # prometheus-community/prometheus-operator-crds chart. Owns the
  # monitoring.coreos.com CRDs in the dedicated infrastructure-crds stage so
  # controllers (Traefik's ServiceMonitor) reconcile before kube-prometheus-stack
  # (docs/29). 31.0.1 = appVersion v0.93.1, at-or-ahead of kube_prometheus_stack
  # 88.3.0's operator v0.93.0 (CRDs may lead the operator, never trail). COUPLING: bump in lockstep with kube_prometheus_stack so the
  # CRD set stays version-matched to the operator kps deploys (docs/12).
  prometheus_operator_crds: "31.0.1"
  loki: "18.9.0"  # grafana-community/loki (OSS chart after the grafana/ GEL fork at 6.55.0); 18.0.0 = dashboard-gen only
  alloy: "1.11.1"
  prometheus_blackbox_exporter: "11.17.2"
  onepassword_connect: "2.4.1"
  vpa: "5.0.0"  # chart major = app 1.7.1; every values key this repo sets is unchanged in 5.x
  kured: "6.1.0"  # Kubernetes Reboot Daemon (app 1.22.1); owns k3s-node reboots flagged by maintenance
  reloader: "2.2.16"  # stakater/Reloader (app v1.4.20); auto-restarts annotated workloads on ConfigMap change (Secrets excluded via ignoreSecrets)
  # Tailscale K8s operator (appVersion v1.102.2; tracks the host
  # tailscale_version); exposes internal Traefik + tailnet-dns to the tailnet
  tailscale_operator: "1.102.2"
  # NVIDIA k8s device plugin — advertises nvidia.com/gpu on the labelled GPU node
  # (kubernetes/infrastructure/controllers/nvidia-device-plugin). Chart tracks the
  # plugin appVersion. https://github.com/NVIDIA/k8s-device-plugin/releases
  nvidia_device_plugin: "0.19.3"
  # kubernetes-sigs/metrics-server (chart 3.13.1 = app v0.8.1). Replaces the k3s
  # packaged AddOn, which is disabled on the servers — see
  # kubernetes/infrastructure/controllers/metrics-server/release.yaml.
  metrics_server: "3.13.1"

# Proxmox resource pools
# These are created automatically when provisioning VMs/LXCs
proxmox_resource_pools:
  - infra-core      # DNS, SMTP relay, core infrastructure
  - apps-public     # Plex, public-facing applications
  - platform        # k3s nodes, GitOps platform
  - apps-private    # Internal applications

# Firewall IPSet special entries
firewall_ipset_special_entries:
  k3s_nodes:
    - ip: 192.168.0.161
      comment: k3s API VIP

# Admin sources for the management plane (:22, :8006, :6443) — the whole /24.
# Accepted risk: the LAN is one flat, unsegmented L2 (VLANs for IoT/guest/
# management are planned — docs/01), so this also covers IoT/guest devices.
# Compensated by key-only SSH + fail2ban + Proxmox/k3s auth; narrow it to a
# dedicated management subnet once vmbr0 VLAN-tagging lands (docs/16).
# proxmox_firewall_admin_ts_cidrs keeps the role default (the full Tailscale
# CGNAT range) — single-owner tailnet, and per-device pins risk DR lockout
# (docs/05); proxmox_firewall_smb_client_cidrs defaults to this list.
proxmox_firewall_admin_lan_cidrs:
  - 192.168.0.0/24

# The router forwards :51820/udp to the wg-easy MetalLB VIP. `-dest` scopes the
# WAN rule to the VIP so it never opens a node's own :51820/udp (flannel
# wireguard-native). docs/38.
proxmox_firewall_wan_wireguard_vips:
  - 192.168.0.99

# Resolver admin surfaces rendered into sg-dns ({port, sources[], comment?}).
# The role default is the two admin sets only.
#
# Read the source lists as BOOKKEEPING, not as a reachability boundary:
# admin_lan is the whole flat 192.168.0.0/24 (above) and every k3s node sits
# inside it, with pod egress SNATed to the node's LAN IP — so naming k3s_nodes
# admits nothing admin_lan does not already admit, and omitting it closes
# nothing. Both entries are still spelled out deliberately:
#   :443 names k3s_nodes because those ARE the in-cluster callers of AdGuard's
#   own TLS listener (Traefik's vm-ingress and the adguard-exporter, which pins
#   the name to the host IP with hostAliases —
#   kubernetes/infrastructure/observability/exporters/adguard-exporter.yaml), so
#   the rule documents them and survives a future admin_lan narrowing.
#   :3000 is the PLAINTEXT admin API carrying a reusable admin credential and
#   names only the two human break-glass sets, so that narrowing admin_lan (VLAN
#   segmentation, docs/16) closes it to the cluster in one edit. Until that
#   lands, anything on the LAN still reaches it — Homarr's two AdGuard
#   integrations do exactly that (kubernetes/apps/homarr/networkpolicy.yaml,
#   docs/41). The credential hardening here is the exporter's move to HTTPS,
#   not the source list.
proxmox_firewall_dns_admin_ports:
  - port: 443
    sources: [k3s_nodes, admin_ts, admin_lan]
    comment: AdGuard Home HTTPS admin UI
  - port: 3000
    sources: [admin_ts, admin_lan]
    comment: AdGuard Home plaintext admin API

# Application scrape targets appended to sg-metrics ({port, sources[],
# comment?}). The role builds in only the exporters its own roles bind (9100,
# 9101, 9134, 9167); every app port below opens on EVERY node, which is why the
# scraper set is named rather than defaulted. k3s SNATs pod traffic to node IPs,
# so k3s_nodes is the scrape source; :31100 is the Loki push NodePort, i.e.
# host -> k8s, not a scrape.
proxmox_firewall_metrics_scrape_ports:
  - port: 8123
    sources: [k3s_nodes]
    comment: home-assistant
  - port: 32400
    sources: [k3s_nodes]
    comment: plex
  - port: 7472
    sources: [k3s_nodes]
    comment: metallb speaker
  - port: 7473
    sources: [k3s_nodes]
    comment: metallb controller
  - port: 31100
    sources: [core-cluster]
    comment: loki push (NodePort, host->k8s)

# Per-application security groups. The role owns the infrastructure groups
# (sg-dns, sg-host-admin, sg-vm-admin, sg-k3s-*, sg-nfs-server, sg-metrics,
# sg-pve-cluster, sg-smb-server, sg-smtp-relay, sg-host-egress); everything
# application-shaped is site data and lives here. `rules` are raw cluster.fw
# lines emitted verbatim, in order — pve-firewall is first-match-wins within a
# group. Guests reference these by name via guest_security_groups (hosts.yml).
proxmox_firewall_security_groups:
  - name: sg-gitlab
    rules:
      # GitLab web — Traefik connects to nginx on 443 with the distributed
      # wildcard cert (gitlab_nginx_listen_https).
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 443 -log nolog"
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 443 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 443 -log nolog"
      # Port 80 — Omnibus nginx keeps it for the HTTP->HTTPS redirect. Admin
      # sources only; Traefik goes straight to 443.
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 80 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 80 -log nolog"
      # Container Registry (5050) and Pages (pages_nginx TLS 8443), both routed
      # via Traefik.
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 5050 -log nolog"
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 8443 -log nolog"
      # Git-over-SSH on 2222 — INTENTIONALLY open to the WAN for external Git
      # access. Protected by the gitlab-ssh fail2ban jail (5 failures = 1h ban);
      # auth failures land in the journal.
      - "IN ACCEPT -p tcp -dport 2222 -log nolog"
      # Git-over-SSH on 22 for internal access.
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 22 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 22 -log nolog"
      # postgres_exporter on the bundled Omnibus Postgres.
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 9187 -log nolog"

  - name: sg-nextcloud
    rules:
      # Host nginx terminates 443 with the distributed wildcard cert; Traefik
      # (k3s_nodes) proxies to it, admin sources allowed for direct debug.
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 443 -log nolog"
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 443 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 443 -log nolog"
      # nextcloud-exporter (9205) + postgres_exporter (9187).
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 9205 -log nolog"
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 9187 -log nolog"

  - name: sg-immich
    rules:
      # Host nginx terminates 443 with the distributed wildcard cert; Traefik
      # connects with serversTransport vm-tls-wildcard.
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 443 -log nolog"
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 443 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 443 -log nolog"
      # Native immich-server telemetry: API 8081 + microservices 8082, plus
      # postgres_exporter 9187. k3s SNATs pod traffic to node IPs, so k3s_nodes
      # is the scrape source. (sg-metrics covers node_exporter :9101.)
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 8081 -log nolog"
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 8082 -log nolog"
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 9187 -log nolog"

  - name: sg-immich-ml
    rules:
      # The ML inference API is AUTHLESS by upstream design, so this rule IS the
      # security boundary: admit ONLY the Immich VM (.157), its sole legitimate
      # consumer. No admin/LAN debug access on purpose — probe it from the VM or
      # over an SSH loopback (SSH/ICMP admin comes from sg-vm-admin).
      - "IN ACCEPT -source 192.168.0.157 -p tcp -dport 3003 -log nolog"

  - name: sg-haos
    rules:
      - "IN ACCEPT -source +dc/admin_lan -p udp -dport 1900 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p udp -dport 5353 -log nolog"
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 8123 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 8123 -log nolog"
      # SSH add-on (22222)
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 22222 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 22222 -log nolog"
      # ICMP from admin sources for ping/traceroute during triage; see
      # docs/11-firewall.md (2026-06-10 conntrack incident).
      - "IN ACCEPT -source +dc/admin_ts -p icmp -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p icmp -log nolog"

  - name: sg-plex
    rules:
      # DLNA/GDM discovery + companion ports stay LAN-only (no remote use case).
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 32469 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p udp -dport 32410:32414 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p udp -dport 1900 -log nolog"
      # Media port 32400 — INTENTIONALLY open to the WAN for direct remote
      # streaming (the router forwards it here, docs/20 §4). Plex authenticates
      # every remote session against plex.tv before serving media, so this is an
      # authenticated endpoint; restricting the source would force remote
      # playback through the bandwidth-limited plex.tv relay.
      - "IN ACCEPT -p tcp -dport 32400 -log nolog"

  - name: sg-windows
    rules:
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 3389 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 3389 -log nolog"

# Proxmox HA configuration
# HA rules (Proxmox 9+) define node affinity for resources
# node-affinity rules restrict which nodes can run specific resources
# All critical services excluded from pve-nas-01 to avoid I/O contention with NAS workloads
#
# Each critical service gets a per-service rule that (a) lists ONLY the five
# local-ssd compute nodes, so it never lands on pve-nas-01 unless every compute
# node is down (strict=false), and (b) gives its HOME node priority 2 vs 1 for the
# rest, so after an HA failover the service fails BACK to its home when that node
# returns instead of stranding on the failover node — the placement drift the
# proxmox_ha_replication_jobs source-node warnings flag. Homes match the
# proxmox_ha_replication_jobs primary layout below.
proxmox_ha_rules:
  - name: affinity-dns-01
    type: node-affinity
    resources:
      - ct:150  # dns-01 (AdGuard Home primary)
    nodes:
      # Home is pve-prec-01: it has 62 GiB against the 14-15 GiB of the opt and
      # laptop hosts, and those five are permanently capped at that size. dns-01
      # is 2 GiB of guest that a small host cannot spare and prec-01 does not
      # notice, so the primary lives where the headroom is.
      #
      # dns-02 is on pve-opt-03, so the pair stays split across hosts.
      #
      # THIS ENTRY, the 150-* proxmox_ha_replication_jobs source_node, and dns-01's
      # proxmox_host in hosts.yml are ONE UNIT — move all three together or
      # proxmox_ha/replication.yml cannot manage the jobs.
      - "pve-prec-01:2"  # home
      - "pve-laptop-01:1"
      - "pve-opt-01:1"
      - "pve-opt-02:1"
      - "pve-opt-03:1"
    strict: false
    comment: "dns-01 home pve-prec-01 (fails back when available); never pve-nas-01"
    enabled: true

  - name: affinity-smtp-relay
    type: node-affinity
    resources:
      - ct:151  # smtp-relay (Postfix relay)
    nodes:
      - "pve-opt-01:2"  # home
      - "pve-laptop-01:1"
      - "pve-opt-02:1"
      - "pve-opt-03:1"
      - "pve-prec-01:1"
    strict: false
    comment: "smtp-relay home pve-opt-01 (fails back when available); never pve-nas-01"
    enabled: true

  - name: affinity-dns-02
    type: node-affinity
    resources:
      - ct:160  # dns-02 (AdGuard Home secondary)
    nodes:
      - "pve-opt-03:2"  # home
      - "pve-laptop-01:1"
      - "pve-opt-01:1"
      - "pve-opt-02:1"
      - "pve-prec-01:1"
    strict: false
    comment: "dns-02 home pve-opt-03 (fails back when available); never pve-nas-01"
    enabled: true

  - name: affinity-home-assistant
    type: node-affinity
    resources:
      - vm:154  # home-assistant (HAOS VM)
    nodes:
      - "pve-prec-01:2"  # home
      - "pve-laptop-01:1"
      - "pve-opt-01:1"
      - "pve-opt-02:1"
      - "pve-opt-03:1"
    strict: false
    comment: "home-assistant home pve-prec-01 (fails back when available); never pve-nas-01"
    enabled: true

# HA resources define which VMs/containers are managed by HA
# These will automatically restart/relocate on node failure
proxmox_ha_resources:
  - type: ct
    vmid: 150
    state: started
    comment: "dns-01 (AdGuard Home primary)"
    enabled: true

  - type: ct
    vmid: 151
    state: started
    comment: "smtp-relay (Postfix relay)"
    enabled: true

  - type: ct
    vmid: 160
    state: started
    comment: "dns-02 (AdGuard Home secondary)"
    enabled: true

  - type: vm
    vmid: 154
    state: started
    comment: "home-assistant (HAOS VM)"
    enabled: true

# Proxmox Storage Replication configuration
# Replication jobs provide near-synchronous data replication for fast failover
# Jobs replicate from primary node to ALL other eligible nodes every 15 minutes
#
# Multi-target replication:
# - Proxmox supports replicating a guest to MULTIPLE target nodes
# - Each service replicates to ALL 4 other local-ssd nodes (not just one)
# - This allows HA to failover to ANY available node, not just a single backup
# - Replication job IDs: <VMID>-<job_number> (0, 1, 2, 3 for 4 targets)
# - pve-nas-01 excluded: no local-ssd storage, services migrated OFF for I/O contention
#
# Node layout (primary locations): pve-prec-01 = dns-01 (150) + home-assistant
# (154); pve-opt-01 = smtp-relay (151); pve-opt-03 = dns-02 (160);
# pve-laptop-01 / pve-opt-02 = replication targets only.
#
proxmox_ha_replication_jobs:
  # dns-01 (VMID 150) - Primary on pve-prec-01 (matches the affinity-dns-01
  # home above; source_node MUST track the HA home or the role's replication pass
  # cannot manage these jobs). Note 150-3 targets pve-laptop-01 rather than
  # pve-prec-01: the source node cannot also be a replication target.
  # Replicate to all other local-ssd nodes
  # Staggered: offset 0 (explicit times instead of */15 so the four
  # services' offsets stay deterministic)
  - id: "150-0"
    source_node: pve-prec-01
    target_node: pve-opt-01
    schedule: "0,15,30,45"
    comment: "dns-01 -> pve-opt-01"
    enabled: true
  - id: "150-1"
    source_node: pve-prec-01
    target_node: pve-opt-02
    schedule: "0,15,30,45"
    comment: "dns-01 -> pve-opt-02"
    enabled: true
  - id: "150-2"
    source_node: pve-prec-01
    target_node: pve-opt-03
    schedule: "0,15,30,45"
    comment: "dns-01 -> pve-opt-03"
    enabled: true
  - id: "150-3"
    source_node: pve-prec-01
    target_node: pve-laptop-01
    schedule: "0,15,30,45"
    comment: "dns-01 -> pve-laptop-01"
    enabled: true

  # smtp-relay (VMID 151) - Primary on pve-opt-01
  # Replicate to all other local-ssd nodes
  # Staggered: offset 3 from dns-01's slots
  - id: "151-0"
    source_node: pve-opt-01
    target_node: pve-laptop-01
    schedule: "3,18,33,48"
    comment: "smtp-relay -> pve-laptop-01"
    enabled: true
  - id: "151-1"
    source_node: pve-opt-01
    target_node: pve-opt-02
