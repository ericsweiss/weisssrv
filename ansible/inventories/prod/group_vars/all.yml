---
# Global variables for all hosts in the homelab

# Domain configuration
internal_domain: esweiss.com
external_domain: ericsweiss.com

# DNS servers
dns_servers:
  - 192.168.0.150
  - 192.168.0.160

# Hosts that are KNOWINGLY out of the fleet (hardware work, decommissioning) and
# may therefore be skipped by base.yml / site.yml without failing the run.
# Read by playbooks/_reachability-gate.yml: a listed host downgrades an
# UNREACHABLE skip from a hard failure to a loud warning; anything else still
# ends the playbook non-zero, because `ignore_unreachable` alone would exit 0
# having configured nothing there. Keep this list EMPTY in steady state — an
# entry is a dated, reviewable concession, not a permanent exemption, and every
# role that host needs stays undeployed for as long as it sits here.
# The downgrade only covers hosts the multi-host plays tolerate. site.yml's
# SINGLE-host plays (mail, pve-nas-01) deliberately keep no ignore_unreachable,
# so losing their one host is still a hard UNREACHABLE that ends the run rc 4 —
# listing smtp-relay or pve-nas-01 here does NOT make site.yml green.
deploy_expected_absent_hosts: []

# Proxmox autostart / boot order is set PER GUEST, never here.
# Order legend: DNS 10 -> SMTP 20 -> k3s servers 30 -> agents 40 -> apps 50+.
#
# There is deliberately no group-wide `proxmox_autostart_enabled` /
# `proxmox_startup_order` / `proxmox_startup_delay`: the proxmox_lxc role reads
# `proxmox_autostart_enabled | default(proxmox_lxc_onboot)` (same shape for
# order/delay), so a value at this level SHADOWS every per-container
# `proxmox_lxc_*` host_var and reconciles all five LXC guests to
# onboot=1,order=100,up=0 — which would flip plex to onboot=1 (its /config bind
# mount is on the encrypted ssd pool; only pve-start-encrypted-guests may start
# it) and flatten the DNS(10) -> SMTP(20) -> apps(50/57) cold-boot ordering.
# VMs keep the neutral `proxmox_autostart_*` names in hosts.yml (proxmox_vm has
# no prefixed alias); LXC containers use `proxmox_lxc_onboot` /
# `proxmox_lxc_startup_order` / `proxmox_lxc_startup_delay` in host_vars. The
# role defaults (true / 100 / 0) are the fallback for a guest that sets neither.

# LAN gateway for guest provisioning. Required inputs with no role default:
# proxmox_lxc asserts proxmox_lxc_gateway and proxmox_vm asserts
# proxmox_vm_cloudinit_gateway at role entry (both were site-specific role
# defaults before the weisssrv.infra extraction).
proxmox_lxc_gateway: 192.168.0.1
proxmox_vm_cloudinit_gateway: 192.168.0.1

# Proxmox storage default per proxmox_role; override per guest with
# proxmox_storage (VMs) / proxmox_lxc_storage (LXC). Pool geometry: docs/06.
proxmox_storage_defaults:
  nas: ssd
  compute: local-ssd
  general: local-ssd

# Central relay every postfix_null_client host forwards to, and the domain
# appended to inventory_hostname to form each null client's myhostname.
postfix_null_client_relay_host: "smtp-relay.{{ internal_domain }}"
postfix_null_client_relay_port: 587
postfix_null_client_mail_domain: "{{ internal_domain }}"

# Admin user configuration
admin_user: eric
admin_email: "{{ lookup('ansible.builtin.env', 'ROOT_EMAIL_ALIAS') or undef(hint='ROOT_EMAIL_ALIAS env var must be set (run via the task wrapper / op run)') }}"

# SSH configuration
ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: false
ssh_pubkey_authentication: true

# Pinned HAOS (Home Assistant OS) SSH host key. Single source of truth
# consumed by both the home_assistant role (via home_assistant_host_key
# in host_vars/home.yml) and the acme_certs cert push (via the `home`
# entry in acme_certs_distribution_targets in host_vars/dns-01.yml). Rotate
# here once after a HAOS rebuild:
#   ssh-keyscan -t ed25519 -p 22222 192.168.0.154
# Paste only the algorithm + base64 key (no leading "[host]:port").
haos_ssh_host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKcIncJ961hzakmaNlj9Nw6zwOWRZm0sEYgDntiKDb9O"

# SSH authorized keys
# IMPORTANT: SSH_PUBLIC_KEY must be set via 'op run' - empty key will fail validation
#
# from= ranges: the homelab LAN, the admin-device block on the Home VLAN,
# Tailscale, and the k3s pod CIDR. The pod CIDR is required because a CI deploy
# pod SSHing to its OWN node hairpins without SNAT and arrives with a 10.42.x
# source; cross-host pod connections already masquerade to a permitted LAN IP,
# so it adds no exposure. The sshd layer mirrors the firewall's admin split
# (proxmox_firewall_admin_lan_cidrs): only the /29, never the whole Home VLAN.
ssh_authorized_keys:
  - >-
    from="192.168.0.0/24,10.0.20.8/29,100.64.0.0/10,10.42.0.0/16"
    {{ lookup('ansible.builtin.env', 'SSH_PUBLIC_KEY') or undef(hint='SSH_PUBLIC_KEY env var must be set') }}

# fail2ban never-ban list. The role default is loopback only; the LAN, the admin
# block on the Home VLAN and the tailnet are added back so an admin source
# cannot be banned out of its own hosts (all three are already the only sources
# the firewall admits to :22).
base_fail2ban_ignoreip:
  - 127.0.0.1/8
  - ::1
  - 192.168.0.0/24
  - 10.0.20.8/29
  - 100.64.0.0/10

# 1Password references are NOT duplicated here. `op run --` resolves them from
# the literal op:// strings in the Taskfile's per-task `env:` blocks (and the
# equivalent CI job variables); the authoritative item inventory is
# docs/15-credential-rotation.md § Required 1Password Items.

# Timezone
timezone: America/Los_Angeles

# Package management
base_common_packages:
  - curl
  - wget
  - neovim
  - htop
  - tmux
  - screen
  - git
  - jq
  - unzip
  - rsync
  - net-tools
  - dnsutils
  - ca-certificates
  - gnupg
  - lsb-release
  - sudo
  - pciutils  # Required for lspci (e1000e NIC detection workaround)

# Host-side journald -> Loki shipping (alloy_host). The role asserts the URL at
# entry, and asserts the credentials for an https:// endpoint. The push goes
# through the internal Traefik IngressRoute; NodePort :31100 stays the
# emergency fallback (override alloy_host_loki_url per host).
alloy_host_loki_url: "https://loki.{{ internal_domain }}/loki/api/v1/push"
alloy_host_loki_user: "{{ lookup('ansible.builtin.env', 'LOKI_PUSH_USER') | default('', true) }}"
alloy_host_loki_password: "{{ lookup('ansible.builtin.env', 'LOKI_PUSH_PASSWORD') | default('', true) }}"

# Placeholder-cert SAN for a direct compose_app run (was a role default before
# the extraction). The wrapper roles override it: immich passes
# immich_nginx_self_signed_san, nextcloud passes "" (single-host CN).
compose_app_nginx_self_signed_san: "DNS:*.{{ internal_domain }}"

# Tailscale configuration
tailscale_enabled: true
tailscale_accept_routes: false  # Hosts should NOT accept routes (prevents routing loops)
tailscale_accept_dns: false  # Use local DNS infrastructure
tailscale_advertise_routes: []  # Only subnet routers (Proxmox hosts) should advertise routes

# Application version pins. Bump = pick a newer tag, update any paired
# *_git_sha / *_checksum, run `task flux:sync-versions`, commit; CI verifies and
# rebuilds, Flux rolls the pods (docs/12). Each pin below carries its upstream
# feed and only what the tag itself cannot express.
adguard_home_version: "0.107.79"
adguard_sync_version: "0.9.2"
# Host-side Alloy apt package (alloy_host role; distinct from the in-cluster
# helm_chart_versions.alloy chart pin below).
alloy_host_version: "1.18.1-1"
tailscale_version: "1.102.3"
# qol shell/editor pins. Oh My Zsh publishes no release tags, so the clone is
# pinned to a commit (https://github.com/ohmyzsh/ohmyzsh/commits/master);
# Vundle is tagged. Host-side only — not Flux versions.
qol_omz_commit: "061f773dd356df52a8bccd5e73377c012f97ef14"
qol_vundle_version: "v0.10.2"
# CoreDNS image for the tailnet-dns split-horizon resolver (kubernetes/apps/
# tailnet-dns). Pinned to the rancher mirror k3s already caches on every node.
coredns_tailnet_version: "1.14.7"
debian_version: "13"
# Proxmox LXC root template (pveam appliance). Authoritative pin — mirrors the
# proxmox_lxc role default (bump both together). Upstream silently rotates the
# point release, which breaks a cached-template recreate, so it is tracked in
# check-versions.py as category "manual": `pveam update && pveam available
# --section system | grep debian-13-standard`.
proxmox_lxc_template: "debian-13-standard_13.6-1_amd64.tar.zst"
k3s_version: "v1.36.3+k3s1"
# sha256 of install.sh for the k3s_version tag: get_url verifies the root-run
# installer before exec (install.sh's own check covers the k3s binary, not the
# script). Recompute in lockstep with every k3s_version bump:
#   curl -sfL https://raw.githubusercontent.com/k3s-io/k3s/<k3s_version>/install.sh | sha256sum
k3s_install_script_checksum: "sha256:46177d4c99440b4c0311b67233823a8e8a2fc09693f6c89af1a7161e152fbfad"
kube_vip_version: "v1.2.3"
# Flux CLI used by CI deploy-verify; the job pins a matching sha256 —
# update both together when bumping.
flux_version: "2.9.0"

# Authentik SSO identity provider
authentik_version: "2026.8.0"

# Postgres for Authentik (bundled with the Helm chart); trixie base.
# https://hub.docker.com/_/postgres/tags
postgresql_version: "18.6-trixie"

# Postgres for Mealie (standalone deployment); alpine base.
mealie_postgresql_version: "18.6-alpine"

# Download clients and media stack.
# LinuxServer.io images: https://docs.linuxserver.io/images/
# Gluetun: https://github.com/qdm12/gluetun/releases
# Pulsarr: https://github.com/jamcalli/Pulsarr/releases
# busybox: init container utility image used by VPN sidecar pre-checks
busybox_version: "1.38"
gluetun_version: "v3.41.3"
nzbget_version: "26.2"
qbittorrent_version: "5.2.3"
prowlarr_version: "2.5.2.5491"
sonarr_version: "4.0.19.2979"
radarr_version: "6.3.0.10514"
lidarr_version: "3.1.0.4875"
pulsarr_version: "0.18.0"

# wg-easy WireGuard VPN (internet-exit VPN for the user + friends/family).
# Container tag has NO leading "v" (upstream convention: :15.3.0, not :v15.3.0).
# https://github.com/wg-easy/wg-easy/releases
wg_easy_version: "15.4.0"

# Recipe management stack.
# Mealie: https://github.com/mealie-recipes/mealie/releases
# Bar Assistant: https://github.com/bar-assistant/bar-assistant/releases
# Salt Rim: https://hub.docker.com/r/barassistant/salt-rim/tags
# Meilisearch: https://github.com/meilisearch/meilisearch/releases (pinned to 1.15.x for Bar Assistant compat)
# Redis: https://hub.docker.com/_/redis/tags (Alpine variant)
mealie_version: "v3.23.1"
bar_assistant_version: "6.2.0"
salt_rim_version: "5.2.0"
meilisearch_version: "v1.15.2"
redis_version: "8.10.1-alpine"

# Plex Media Server version (apt-managed via official repository)
plex_version: "1.43.3.10896-cb3ebc72d"

# GitLab EE (using CE features) — Omnibus package.
# https://packages.gitlab.com/gitlab/gitlab-ee
# Applied by task gitlab:deploy / the deploy-gitlab CI job; the maintenance
# apt-upgrade honours the gitlab-ee package hold and will not bump it.
gitlab_version: "19.3.0-ee.0"

# https://gitlab.com/gitlab-org/charts/gitlab-runner/tags
gitlab_runner_helm_version: "0.92.0"

# https://gitlab.com/gitlab-org/charts/gitlab-agent/tags
gitlab_agent_helm_version: "2.30.0"

# In-cluster pull-through registry cache for CI (docs/27 § Registry pull-through
# cache). Bare X.Y.Z tag. https://hub.docker.com/_/registry/tags
registry_cache_version: "3.1.1"

# Nextcloud (compose stack on the VM — consumed by the nextcloud Ansible role;
# the VM-only pins ride the versions ConfigMap as a harmless superset).
# https://github.com/nextcloud/docker/blob/master/versions.json
nextcloud_version: "34.0.3"
# PG 18 is Nextcloud-recommended and matches the homelab postgres pin.
nextcloud_postgres_version: "18.6-trixie"
# Redis (cache + transactional file locking) reuses the shared `redis_version`
# pin above, tracked once by the "Redis" version-check entry.
# Nextcloud exporter: https://github.com/xperimental/nextcloud-exporter/releases
nextcloud_exporter_version: "0.9.1"
# The Nextcloud VM's Docker engine uses the shared docker_engine_* pins below —
# one source of truth across immich / immich_ml / nextcloud.

# Immich (compose stack on the VM). https://github.com/immich-app/immich/releases
# The Postgres + Valkey images (tag AND digest) are whatever Immich's pinned
# release pins in its own docker/docker-compose.yml — the DB is release-coupled
# (vectorchord/pgvectors build), so NEVER bump it independently of immich_version.
immich_version: "v3.1.0"
immich_postgres_version: "14-vectorchord0.4.3-pgvectors0.2.0"
immich_postgres_digest: "sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23"
immich_valkey_version: "9"
immich_valkey_digest: "sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9"

# Docker Engine for the trixie VM compose stacks (immich, immich_ml, nextcloud).
# dpkg-held so the maintenance apt-upgrade never bumps them under a running stack.
# https://download.docker.com/linux/debian/dists/trixie/stable/binary-amd64/Packages
docker_engine_ce_version: "5:29.6.2-1~debian.13~trixie"
docker_engine_containerd_version: "2.2.6-1~debian.13~trixie"
docker_engine_buildx_plugin_version: "0.35.0-1~debian.13~trixie"
docker_engine_compose_plugin_version: "5.3.1-1~debian.13~trixie"
# VirtIO driver ISO for the Windows 11 VM. Pinned to a versioned Fedora ARCHIVE
# URL — the stable-virtio/ symlink is a moving target that breaks the pin on the
# next upstream release. Fedora publishes no ISO checksum (RPMs only), so the
# sha256 is computed from the pinned artifact and bumped with it. The Windows
# install ISO itself is fetched manually from Microsoft — docs/39-windows-vm.md.
# https://github.com/virtio-win/virtio-win-pkg-scripts
proxmox_vm_virtio_win_version: "0.1.285"
proxmox_vm_virtio_win_checksum: "sha256:e14cf2b94492c3e925f0070ba7fdfedeb2048c91eea9c5a5afb30232a3976331"
# Hermes Agent. https://github.com/NousResearch/hermes-agent/releases
# Upstream ships no image; build-hermes-agent clones the repo at this git tag
# and builds THEIR Dockerfile. The value is the upstream RELEASE TAG (used
# verbatim as `git clone --branch` and as the built image tag), NOT the semver
# whl version.
hermes_version: "v2026.8.19"
# Immutable commit the pinned tag must resolve to — build-hermes-agent refuses
# to build on a mismatch (moved/compromised tag defence). Lockstep with
# hermes_version.
hermes_git_sha: "fcbd1076a93841fa88855acce810e342a5b78101"
# PUBLISHED image tag = <hermes_version>-r<N>. The image is upstream + our
# patches (docker/hermes-agent/patches/), so a patch change without an upstream
# bump MUST produce a new tag or the nodes' IfNotPresent cache keeps serving the
# unpatched image. Bump -rN when patches change; reset to -r1 on a
# hermes_version bump. CI asserts the prefix matches hermes_version.
hermes_image_version: "v2026.8.19-r3"
# OpenAI Codex CLI, baked into the hermes image by Dockerfile.codex. Requires
# >=0.130.0 for the Hermes runtime. Build-time only — not substituted into any
# manifest. https://github.com/openai/codex/releases (npm @openai/codex)
hermes_codex_version: "0.149.0"
# Claude Code CLI, baked into the hermes image alongside the Codex CLI so Hermes
# can delegate coding tasks headlessly (`claude -p`), authenticated with a
# long-lived OAuth token (CLAUDE_CODE_OAUTH_TOKEN via ESO — no API key; the CLI
# holds the credential, Hermes only reads stdout). Build-time only — docs/37.
# https://github.com/anthropics/claude-code (npm @anthropic-ai/claude-code)
hermes_claude_version: "2.1.241"
# 1Password CLI (op), baked into the hermes image so Hermes' 1Password skill can
# drive `op` against the isolated Agent vault (docs/37 §1Password). Value is the
# full DEB version string, not the bare semver `op --version` reports.
#
# NOT optional maintenance: the repo keeps exactly ONE version — 1Password
# prunes the rest — so a stale pin FAILS the image build outright, and
# version-check cannot see it (no release feed). Read the current version off
# the Packages index:
#   curl -fsSL https://downloads.1password.com/linux/debian/amd64/dists/stable/main/binary-amd64/Packages \
#     | awk '/^Package: 1password-cli$/{p=1} p&&/^Version:/{print $2; p=0}'
hermes_op_version: "2.39.0-1"
# Camofox browser server — the sidecar behind Hermes' camofox tool. Upstream
# publishes no image; build-camofox-browser clones the repo at tag v<version>.
# The pin is the bare semver (the image tag); the git tag carries the "v".
# https://github.com/jo-inc/camofox-browser/releases
hermes_camofox_version: "1.13.0"
# Immutable commit tag v${hermes_camofox_version} must resolve to; the build
# refuses on a mismatch. Lockstep with hermes_camofox_version.
hermes_camofox_git_sha: "8b5b0959adfadadae38ecce9d7eed706ab102bf1"

# Hindsight agent-memory server (vectorize-io/hindsight) — Hermes' long-term
# memory backend (kubernetes/apps/hindsight, docs/37 §Memory backend). The pin
# is the ghcr.io/vectorize-io/hindsight image tag (bare semver; the git tag
# carries a leading "v"). https://github.com/vectorize-io/hindsight/releases
hindsight_version: "0.9.1"
# llama.cpp server sidecar for Hindsight's local LLM, built as
# ghcr.io/ggml-org/llama.cpp:server-cuda-<pin> for GPU offload (docs/43).
# Upstream tags builds (bNNNN) many times a day and not every build publishes
# images, so this is bumped opportunistically — category "manual" in
# check-versions. https://github.com/ggml-org/llama.cpp/releases
hindsight_llamacpp_version: "b10068"

# GPU stack for the pve-prec-01 1660 Ti (Hindsight CUDA offload, docs/43).
# nvidia-open comes from NVIDIA's own CUDA apt repo, NOT Debian non-free: the
# llama.cpp image is built against CUDA 12.8, which needs a native driver >= 570
# on a consumer GeForce card (cuda-compat forward-compat is unsupported there).
# Exact apt version; gpu.yml HOLDS the package, and bumping this pin applies
# over the hold. https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64/
nvidia_driver_version: "610.43.02-1"
# NVIDIA CUDA apt repo keyring. The debian13 repo's signing key is published
# ONLY inside this cuda-keyring package (no standalone .pub), so gpu.yml verifies
# this SHA256 BEFORE installing the deb — its maintainer scripts run as root.
# Bump version + sha256 in lockstep.
nvidia_cuda_keyring_version: "1.1-1"
nvidia_cuda_keyring_sha256: "d0d4ef986a44400f9db33c600ef33a985175e7cc63d805a10e1839c7a1e78f5f"
# Provides nvidia-container-runtime, which k3s auto-detects on PATH and wires
# into its generated containerd config as the `nvidia` runtime handler (no
# config-v3.toml.tmpl needed). Exact apt pin.
# https://github.com/NVIDIA/nvidia-container-toolkit/releases
nvidia_container_toolkit_version: "1.19.1-1"
# NVIDIA DCGM exporter (raw DaemonSet on the GPU node). Tag form is
# <DCGM ver>-<exporter ver>-<variant>, nvcr.io/nvidia/k8s/dcgm-exporter.
# https://github.com/NVIDIA/dcgm-exporter/releases
dcgm_exporter_version: "4.6.0-4.8.3-distroless"

# Homarr (docs/41). The Docker tag is v-PREFIXED — a bare semver 404s.
# https://github.com/homarr-labs/homarr/releases
homarr_version: "v1.76.0"

# Uptime Kuma (docs/45). BARE semver tag on Docker Hub (no "v"); the manifest
# appends "-rootless", which is the same release built with USER node and is
# what lets the namespace enforce PSA restricted.
# https://github.com/louislam/uptime-kuma/releases
uptime_kuma_version: "2.5.3"

# Garage — the runners' S3 cache backend (kubernetes/apps/ci-cache, docs/13
# § Runner cache backend). Docker Hub dxflrs/garage; the pinned value is the
# full upstream tag (vX.Y.Z). Chosen over MinIO: that upstream was archived
# 2026-04.
garage_version: "v2.3.0"

# Offsite backup binaries (restic_offsite role on pve-nas-01, docs/42).
# A NON-EMPTY restic_version becomes an EXACT apt pin — "" means distro.
# rclone installs from rclone.org's own .deb (Debian's build is years stale);
# bump version + sha256 together from
# https://downloads.rclone.org/vX.Y.Z/SHA256SUMS (linux-amd64.deb line).
restic_offsite_restic_version: ""
restic_offsite_rclone_version: "1.74.4"
restic_offsite_rclone_deb_sha256: "a9da2eaa70428c6dcc5acbb0b7eac0faec4c61643e0b468d9fe09ddf79b7e929"

# Observability stack versions
# kube-prometheus-stack, Loki, Alloy chart versions are in helm_chart_versions below.
# Container image versions for standalone exporters:
# Exportarr: https://github.com/onedr0p/exportarr/releases
# Blackbox exporter chart version is in helm_chart_versions below.
# Proxmox VE Exporter: https://github.com/prometheus-pve/prometheus-pve-exporter/releases
# ZFS Exporter: https://github.com/pdf/zfs_exporter/releases
# AdGuard Exporter: https://github.com/henrywhitaker3/adguard-exporter/releases
# Unbound Exporter: https://github.com/letsencrypt/unbound_exporter/releases
# Redis Exporter: https://hub.docker.com/r/oliver006/redis_exporter/tags
exportarr_version: "v2.3.0"
proxmox_exporter_version: "3.10.0"
zfs_exporter_version: "2.4.1"
# sha256 of zfs_exporter-<version>.linux-amd64.tar.gz from the release's
# sha256sums.txt — the binary runs as root with /dev/zfs access, so get_url
# fails closed on a mismatch. Update on every version bump.
zfs_exporter_checksum: "sha256:60489e74e8f41eadff4f313fb16e94fc0964d37b9cf1be79c25c927b285a3228"
adguard_exporter_version: "v1.2.1"
# Installed from the release .deb (prometheus_exporter_artifact_type: deb) —
# check a new release still publishes one. Upstream ships no checksum file, so
# the sha256 is our own: `shasum -a 256` the .deb and bump both lines.
unbound_exporter_version: "0.6.0"
unbound_exporter_checksum: "sha256:4f61876a292b49f918baf6b6b57d17dcf94f97513787282b0dadb88b95084890"
redis_exporter_version: "v1.89.0"
# postgres_exporter sidecar for the VM compose stacks (immich, nextcloud). The
# GitLab VM uses the exporter Omnibus already bundles, so it carries no pin.
# https://github.com/prometheus-community/postgres_exporter/releases
postgres_exporter_version: "v0.20.1"

# Helm chart versions for the k3s platform workloads.
# - MetalLB: https://artifacthub.io/packages/helm/metallb/metallb
# - Traefik: https://github.com/traefik/traefik-helm-chart/releases
# - cert-manager: https://artifacthub.io/packages/helm/cert-manager/cert-manager
# - external-dns: https://artifacthub.io/packages/helm/external-dns/external-dns
# - VPA: https://artifacthub.io/packages/helm/fairwinds-stable/vpa
helm_chart_versions:
  # 0.16.x has an open regression in the L2 ServiceL2Status reconciler that
  # floods the apiserver (~34 r/s 500s in our setup, enough to trip
  # KubeAPIErrorBudgetBurn). Pinned to 0.15.3 — the v0.16 CRDs already in
  # the cluster are schema-compatible with the 0.15.3 controller+speaker
  # images per upstream. Re-evaluate when the fix lands.
  # Upstream issue: https://github.com/metallb/metallb/issues/3063
  metallb: "0.15.3"
  traefik: "41.3.0"  # App version v3.7.11 (chart 41.x: logs.general->log, logs.access->accessLog)
  cert_manager: "v1.21.1"
  external_dns: "1.21.1"  # App version 0.20.0
  external_secrets: "2.9.0"  # ESO with 1Password Connect provider
  kube_prometheus_stack: "88.5.3"  # prometheus-operator v0.93.1 (additive CRD fields; crds: CreateReplace)
  # prometheus-community/prometheus-operator-crds chart. Owns the
  # monitoring.coreos.com CRDs in the dedicated infrastructure-crds stage so
  # controllers (Traefik's ServiceMonitor) reconcile before kube-prometheus-stack
  # (docs/29). 31.0.1 = appVersion v0.93.1, matching kube_prometheus_stack
  # 88.5.0's operator v0.93.1 (CRDs may lead the operator, never trail). COUPLING: bump in lockstep with kube_prometheus_stack so the
  # CRD set stays version-matched to the operator kps deploys (docs/12).
  prometheus_operator_crds: "31.0.1"
  loki: "18.11.0"  # grafana-community/loki (OSS chart after the grafana/ GEL fork at 6.55.0); 18.0.0 = dashboard-gen only
  alloy: "1.11.1"
  prometheus_blackbox_exporter: "11.17.2"
  onepassword_connect: "2.4.1"
  vpa: "5.0.0"  # chart major = app 1.7.1; every values key this repo sets is unchanged in 5.x
  kured: "6.1.0"  # Kubernetes Reboot Daemon (app 1.22.1); owns k3s-node reboots flagged by maintenance
  reloader: "2.2.16"  # stakater/Reloader (app v1.4.20); auto-restarts annotated workloads on ConfigMap change (Secrets excluded via ignoreSecrets)
  # Tailscale K8s operator (appVersion v1.102.3; tracks the host
  # tailscale_version, but only once the chart actually publishes — flux-lint's
  # helm-values gate fails a phantom chart version)
  tailscale_operator: "1.102.3"
  # NVIDIA k8s device plugin — advertises nvidia.com/gpu on the labelled GPU node
  # (kubernetes/infrastructure/controllers/nvidia-device-plugin). Chart tracks the
  # plugin appVersion. https://github.com/NVIDIA/k8s-device-plugin/releases
  nvidia_device_plugin: "0.20.0"
  # kubernetes-sigs/metrics-server (chart 3.14.0 = app v0.9.0). Replaces the k3s
  # packaged AddOn, which is disabled on the servers — see
  # kubernetes/infrastructure/controllers/metrics-server/release.yaml.
  metrics_server: "3.14.0"

# Created automatically when provisioning VMs/LXCs.
proxmox_resource_pools:
  - infra-core      # DNS, SMTP relay, core infrastructure
  - apps-public     # Plex, public-facing applications
  - platform        # k3s nodes, GitOps platform
  - apps-private    # Internal applications

# Firewall IPSet special entries. Sets whose members are inventory hosts are
# derived from each host's `firewall_ipsets`; the sets below carry addresses and
# CIDRs that are not inventory hosts, and a key that no host references creates
# the set outright (docs/11-firewall.md).
firewall_ipset_special_entries:
  k3s_nodes:
    - ip: 192.168.0.161
      comment: k3s API VIP
  # SERVICE scope, the counterpart to admin_lan: the client subnets allowed at
  # user-facing app ports (Traefik 80/443, Home Assistant 8123, GitLab web,
  # Nextcloud/Immich 443, Plex + HAOS discovery, SMB). Deliberately excludes
  # IoT/Guest/Work — those reach only the ports named for them explicitly.
  lan_clients:
    - ip: 192.168.0.0/24
      comment: homelab LAN
    - ip: 10.0.20.0/24
      comment: Home VLAN 20 (trusted personal devices)
  # Resolver scope: every CLIENT VLAN uses the weisssrv resolvers, handed out by
  # UniFi DHCP, so :53 has to admit subnets that must never reach an admin
  # surface. Wider than lan_clients on purpose, and only ever referenced
  # from :53.
  #
  # The Default/mgmt VLAN (10.0.1.0/24) is deliberately NOT a member: its DHCP
  # hands out public resolvers to avoid a bootstrap loop (the resolvers are LXCs
  # behind the gear on that VLAN), and no UniFi zone policy admits
  # Internal -> homelab (terraform/unifi/networks.tf). Re-pointing a management
  # device at AdGuard means adding the zone policy AND the entry here.
  dns_clients:
    - ip: 192.168.0.0/24
      comment: homelab LAN
    - ip: 10.0.20.0/24
      comment: Home VLAN 20
    - ip: 10.0.30.0/24
      comment: IoT VLAN 30
    - ip: 10.0.40.0/24
      comment: Guest VLAN 40
    - ip: 10.0.50.0/24
      comment: Work VLAN 50

# ADMIN scope: the management plane only (:22, :8006, :6443, :3389, :3000,
# :22222). With VLAN segmentation the flat-LAN accepted risk is gone — client
# devices live on the Home/IoT/Guest/Work VLANs and reach service ports through
# the lan_clients set above, never this one. Members are the homelab LAN (cert
# distribution, CI deploy sources, tailnet SNAT all originate there) plus the
# 10.0.20.8/29 admin-device block on the Home VLAN, which UniFi DHCP reserves
# for admin workstations (docs/46).
# proxmox_firewall_admin_ts_cidrs keeps the role default (the full Tailscale
# CGNAT range) — single-owner tailnet, per-device pins risk DR lockout, and the
# Tailscale ACL policy already enforces device/user granularity (docs/05).
proxmox_firewall_admin_lan_cidrs:
  - 192.168.0.0/24
  - 10.0.20.8/29

# SMB clients, NOT inheriting admin_lan: file shares are a service surface, so
# they follow the lan_clients membership, not the admin one. The role renders
# the `smb_clients` IPSet from this variable rather than from
# firewall_ipset_special_entries, so the list has to exist separately — but it
# is DERIVED, not restated: two literal copies of one scope is how a Phase 2
# renumber (or a new client VLAN) moves one and silently leaves the other,
# breaking every SMB mount with nothing pointing at the cause.
proxmox_firewall_smb_client_cidrs: "{{ firewall_ipset_special_entries.lan_clients | map(attribute='ip') | list }}"

# The router forwards :51820/udp to the wg-easy MetalLB VIP. `-dest` scopes the
# WAN rule to the VIP so it never opens a node's own :51820/udp (flannel
# wireguard-native). docs/38.
proxmox_firewall_wan_wireguard_vips:
  - 192.168.0.99

# Source sets for the two rule groups the collection renders itself but the
# site re-scopes: sg-dns's `:53` (tcp+udp) and the whole of
# sg-k3s-ingress-int (`:80`/`:443`). Both default to [admin_ts, admin_lan] in
# the role, so naming the client sets here is what lets a VLAN outside
# admin_lan resolve or reach the internal Traefik VIP at all
# (weisssrv.infra v0.13.0; docs/11-firewall.md § Client scopes).
#
# :53 takes dns_clients — UniFi DHCP hands the weisssrv resolvers to every
# VLAN, including the ones with no other homelab access. The internal ingress
# takes lan_clients — Home-VLAN devices only; IoT/Guest/Work reach nothing but
# the ports named for them. admin_ts stays on both so the tailnet is unchanged.
proxmox_firewall_dns_client_sources:
  - admin_ts
  - dns_clients

proxmox_firewall_k3s_ingress_int_sources:
  - admin_ts
  - lan_clients

# Resolver admin surfaces rendered into sg-dns ({port, sources[], comment?}).
# The role default is the two admin sets only.
#
# Both surfaces stay on the ADMIN sets after the VLAN split: :443 is the AdGuard
# UI and :3000 its plaintext API carrying a reusable admin credential, so no
# client VLAN reaches either — the client VLANs get :53 and nothing else, via
# the dns_clients set above. Naming k3s_nodes on :443 admits nothing extra
# (every node sits inside the homelab LAN and pod egress SNATs to the node IP);
# it is spelled out so the in-cluster callers are documented.
proxmox_firewall_dns_admin_ports:
  - port: 443
    sources: [k3s_nodes, admin_ts, admin_lan]
    comment: AdGuard Home HTTPS admin UI
  - port: 3000
    sources: [admin_ts, admin_lan]
    comment: AdGuard Home plaintext admin API

# Application scrape targets appended to sg-metrics ({port, sources[],
# comment?}). The role builds in only the exporters its own roles bind (9100,
# 9101, 9134, 9167); every app port below opens on EVERY node, which is why the
# scraper set is named rather than defaulted. k3s SNATs pod traffic to node IPs,
# so k3s_nodes is the scrape source; :31100 is the Loki push NodePort, i.e.
# host -> k8s, not a scrape.
proxmox_firewall_metrics_scrape_ports:
  - port: 8123
    sources: [k3s_nodes]
    comment: home-assistant
  - port: 32400
    sources: [k3s_nodes]
    comment: plex
  - port: 7472
    sources: [k3s_nodes]
    comment: metallb speaker
  - port: 7473
    sources: [k3s_nodes]
    comment: metallb controller
  - port: 31100
    sources: [core-cluster]
    comment: loki push (NodePort, host->k8s)

# Per-application security groups. The role owns the infrastructure groups
# (sg-dns, sg-host-admin, sg-vm-admin, sg-k3s-*, sg-nfs-server, sg-metrics,
# sg-pve-cluster, sg-smb-server, sg-smtp-relay, sg-host-egress); everything
# application-shaped is site data and lives here. `rules` are raw cluster.fw
# lines emitted verbatim, in order — pve-firewall is first-match-wins within a
# group. Guests reference these by name via guest_security_groups (hosts.yml).
#
# Source-set convention after the VLAN split: a USER-facing port takes
# +dc/lan_clients (homelab LAN + Home VLAN), an ADMIN port keeps +dc/admin_lan
# (homelab LAN + the /29 admin block). lan_clients is a superset of admin_lan,
# so a port that moved needs no second admin rule.
proxmox_firewall_security_groups:
  - name: sg-gitlab
    rules:
      # GitLab web — Traefik connects to nginx on 443 with the distributed
      # wildcard cert (gitlab_nginx_listen_https); browsers reach it from any
      # client VLAN in lan_clients.
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 443 -log nolog"
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 443 -log nolog"
      - "IN ACCEPT -source +dc/lan_clients -p tcp -dport 443 -log nolog"
      # Port 80 — Omnibus nginx keeps it for the HTTP->HTTPS redirect, so it
      # follows 443's sources; Traefik goes straight to 443.
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 80 -log nolog"
      - "IN ACCEPT -source +dc/lan_clients -p tcp -dport 80 -log nolog"
      # Container Registry (5050) and Pages (pages_nginx TLS 8443), both routed
      # via Traefik.
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 5050 -log nolog"
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 8443 -log nolog"
      # Git-over-SSH on 2222 — INTENTIONALLY open to the WAN for external Git
      # access. Protected by the gitlab-ssh fail2ban jail (5 failures = 1h ban);
      # auth failures land in the journal.
      - "IN ACCEPT -p tcp -dport 2222 -log nolog"
      # Git-over-SSH on 22 for internal access — ADMIN scope: pushes come from
      # an admin device or the tailnet, and the CI/cert paths live in the
      # homelab LAN. Mirrored at the sshd layer by gitlab_ssh_allowed_users.
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 22 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 22 -log nolog"
      # postgres_exporter on the bundled Omnibus Postgres.
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 9187 -log nolog"

  - name: sg-nextcloud
    rules:
      # Host nginx terminates 443 with the distributed wildcard cert; Traefik
      # (k3s_nodes) proxies to it. Client VLANs (lan_clients) and the tailnet
      # are allowed for direct access/debug.
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 443 -log nolog"
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 443 -log nolog"
      - "IN ACCEPT -source +dc/lan_clients -p tcp -dport 443 -log nolog"
      # nextcloud-exporter (9205) + postgres_exporter (9187).
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 9205 -log nolog"
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 9187 -log nolog"

  - name: sg-immich
    rules:
      # Host nginx terminates 443 with the distributed wildcard cert; Traefik
      # connects with serversTransport vm-tls-wildcard. Client VLANs
      # (lan_clients) reach it directly for the mobile app on the LAN.
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 443 -log nolog"
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 443 -log nolog"
      - "IN ACCEPT -source +dc/lan_clients -p tcp -dport 443 -log nolog"
      # Native immich-server telemetry: API 8081 + microservices 8082, plus
      # postgres_exporter 9187. k3s SNATs pod traffic to node IPs, so k3s_nodes
      # is the scrape source. (sg-metrics covers node_exporter :9101.)
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 8081 -log nolog"
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 8082 -log nolog"
      - "IN ACCEPT -source +dc/k3s_nodes -p tcp -dport 9187 -log nolog"

  - name: sg-immich-ml
    rules:
      # The ML inference API is AUTHLESS by upstream design, so this rule IS the
      # security boundary: admit ONLY the Immich VM (.157), its sole legitimate
      # consumer. No admin/LAN debug access on purpose — probe it from the VM or
      # over an SSH loopback (SSH/ICMP admin comes from sg-vm-admin).
      - "IN ACCEPT -source 192.168.0.157 -p tcp -dport 3003 -log nolog"

  - name: sg-haos
    rules:
      # SSDP (1900) and mDNS (5353) discovery from the client VLANs in
      # lan_clients. NOTE the layering: the UniFi zone firewall is the FIRST
      # gate for anything arriving from another VLAN (terraform/unifi
      # local.policies), so a rule here only ever sees traffic a zone policy
      # already admitted.
      - "IN ACCEPT -source +dc/lan_clients -p udp -dport 1900 -log nolog"
      - "IN ACCEPT -source +dc/lan_clients -p udp -dport 5353 -log nolog"
      # mDNS from the IoT VLAN. Kept inline (and NOT folded into lan_clients)
      # because it is the one IoT->here flow that can arrive with a 10.0.30.x
      # source: UniFi's mDNS repeater re-transmits the query on this interface
      # with the ORIGINAL source address, not the gateway's. There is
      # deliberately no 1900 counterpart — SSDP is link-local multicast that no
      # UniFi feature reflects, so such a rule could never match (docs/46).
      - "IN ACCEPT -source 10.0.30.0/24 -p udp -dport 5353 -log nolog"
      # The web UI is a user-facing surface — phones and tablets live on the
      # Home VLAN, so it follows lan_clients.
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 8123 -log nolog"
      - "IN ACCEPT -source +dc/lan_clients -p tcp -dport 8123 -log nolog"
      # HA's device-INITIATED paths from IoT: a Cast speaker fetching the TTS
      # proxy URL HA handed it, and integration webhooks posting back to HA's
      # internal_url. Gated first by the `iot-to-homelab-ha` zone policy, which
      # scopes it to this guest's address.
      - "IN ACCEPT -source 10.0.30.0/24 -p tcp -dport 8123 -log nolog"
      # SSH add-on (22222) — ADMIN scope.
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 22222 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 22222 -log nolog"
      # ICMP from admin sources for ping/traceroute during triage; see
      # docs/11-firewall.md.
      - "IN ACCEPT -source +dc/admin_ts -p icmp -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p icmp -log nolog"

  - name: sg-plex
    rules:
      # DLNA (32469), GDM (32410-32414) and SSDP (1900) discovery stay LAN-only
      # (no remote use case), sourced from the client VLANs in lan_clients.
      #
      # The IoT VLAN is deliberately ABSENT from all three. GDM and SSDP are
      # multicast, which does not route between VLANs at all, and unicast DLNA
      # would be dropped by the UniFi zone firewall first — the only iot->homelab
      # allowances are :53, Plex :32400 and HA :8123 (terraform/unifi
      # local.policies). TVs on IoT still stream: :32400 is world-open below and
      # the Plex client finds the server through plex.tv rather than by
      # discovery.
      - "IN ACCEPT -source +dc/lan_clients -p tcp -dport 32469 -log nolog"
      - "IN ACCEPT -source +dc/lan_clients -p udp -dport 32410:32414 -log nolog"
      - "IN ACCEPT -source +dc/lan_clients -p udp -dport 1900 -log nolog"
      # Media port 32400 — INTENTIONALLY open to the WAN for direct remote
      # streaming (the router forwards it here, docs/20 §4). Plex authenticates
      # every remote session against plex.tv before serving media, so this is an
      # authenticated endpoint; restricting the source would force remote
      # playback through the bandwidth-limited plex.tv relay.
      - "IN ACCEPT -p tcp -dport 32400 -log nolog"

  - name: sg-windows
    rules:
      - "IN ACCEPT -source +dc/admin_ts -p tcp -dport 3389 -log nolog"
      - "IN ACCEPT -source +dc/admin_lan -p tcp -dport 3389 -log nolog"

# Per-service node-affinity rules. Each (a) lists ONLY the five local-ssd
# compute nodes, so the service never lands on pve-nas-01 unless every compute
# node is down (strict=false, avoiding I/O contention with the NAS), and (b)
# gives its HOME node priority 2 vs 1, so after a failover it fails BACK instead
# of stranding. Homes match the proxmox_ha_replication_jobs layout below.
proxmox_ha_rules:
  - name: affinity-dns-01
    type: node-affinity
    resources:
      - ct:150  # dns-01 (AdGuard Home primary)
    nodes:
      # Home is pve-prec-01, the only host with real RAM headroom; dns-02 sits
      # on pve-opt-03 so the pair stays split across hosts.
      #
      # THIS ENTRY, the 150-* proxmox_ha_replication_jobs source_node, and
      # dns-01's proxmox_host in hosts.yml are ONE UNIT — move all three
      # together or proxmox_ha/replication.yml cannot manage the jobs.
      - "pve-prec-01:2"  # home
      - "pve-laptop-01:1"
      - "pve-opt-01:1"
      - "pve-opt-02:1"
      - "pve-opt-03:1"
    strict: false
    comment: "dns-01 home pve-prec-01 (fails back when available); never pve-nas-01"
    enabled: true

  - name: affinity-smtp-relay
    type: node-affinity
    resources:
      - ct:151  # smtp-relay (Postfix relay)
    nodes:
      - "pve-opt-01:2"  # home
      - "pve-laptop-01:1"
      - "pve-opt-02:1"
      - "pve-opt-03:1"
      - "pve-prec-01:1"
    strict: false
    comment: "smtp-relay home pve-opt-01 (fails back when available); never pve-nas-01"
    enabled: true

  - name: affinity-dns-02
    type: node-affinity
    resources:
      - ct:160  # dns-02 (AdGuard Home secondary)
    nodes:
      - "pve-opt-03:2"  # home
      - "pve-laptop-01:1"
      - "pve-opt-01:1"
      - "pve-opt-02:1"
      - "pve-prec-01:1"
    strict: false
    comment: "dns-02 home pve-opt-03 (fails back when available); never pve-nas-01"
    enabled: true

  - name: affinity-home-assistant
    type: node-affinity
    resources:
      - vm:154  # home-assistant (HAOS VM)
    nodes:
      - "pve-prec-01:2"  # home
      - "pve-laptop-01:1"
      - "pve-opt-01:1"
      - "pve-opt-02:1"
      - "pve-opt-03:1"
    strict: false
    comment: "home-assistant home pve-prec-01 (fails back when available); never pve-nas-01"
    enabled: true

# Guests HA manages: restarted/relocated automatically on node failure.
proxmox_ha_resources:
  - type: ct
    vmid: 150
    state: started
    comment: "dns-01 (AdGuard Home primary)"
    enabled: true

  - type: ct
    vmid: 151
    state: started
    comment: "smtp-relay (Postfix relay)"
    enabled: true

  - type: ct
    vmid: 160
    state: started
    comment: "dns-02 (AdGuard Home secondary)"
    enabled: true

  - type: vm
    vmid: 154
    state: started
    comment: "home-assistant (HAOS VM)"
    enabled: true

# Storage replication, every 15 minutes. Each service replicates to ALL 4 other
# local-ssd nodes so HA can fail over to any of them; job id is
# <VMID>-<job_number>. pve-nas-01 is excluded (no local-ssd).
# Schedules are explicit times, not */15, so the four services' offsets stay
# deterministic.
proxmox_ha_replication_jobs:
  # dns-01 (150), offset 0. source_node MUST track the affinity-dns-01 home or
  # the role's replication pass cannot manage these jobs; the source node cannot
  # also be a target, which is why 150-3 goes to pve-laptop-01.
  - id: "150-0"
    source_node: pve-prec-01
    target_node: pve-opt-01
    schedule: "0,15,30,45"
    comment: "dns-01 -> pve-opt-01"
    enabled: true
  - id: "150-1"
    source_node: pve-prec-01
    target_node: pve-opt-02
    schedule: "0,15,30,45"
    comment: "dns-01 -> pve-opt-02"
    enabled: true
  - id: "150-2"
    source_node: pve-prec-01
    target_node: pve-opt-03
    schedule: "0,15,30,45"
    comment: "dns-01 -> pve-opt-03"
    enabled: true
  - id: "150-3"
    source_node: pve-prec-01
    target_node: pve-laptop-01
    schedule: "0,15,30,45"
    comment: "dns-01 -> pve-laptop-01"
    enabled: true

  # smtp-relay (151), home pve-opt-01, offset 3.
  - id: "151-0"
    source_node: pve-opt-01
    target_node: pve-laptop-01
    schedule: "3,18,33,48"
    comment: "smtp-relay -> pve-laptop-01"
    enabled: true
  - id: "151-1"
    source_node: pve-opt-01
    target_node: pve-opt-02
    schedule: "3,18,33,48"
    comment: "smtp-relay -> pve-opt-02"
    enabled: true
  - id: "151-2"
    source_node: pve-opt-01
    target_node: pve-opt-03
    schedule: "3,18,33,48"
    comment: "smtp-relay -> pve-opt-03"
    enabled: true
  - id: "151-3"
    source_node: pve-opt-01
    target_node: pve-prec-01
    schedule: "3,18,33,48"
    comment: "smtp-relay -> pve-prec-01"
    enabled: true

  # dns-02 (160), home pve-opt-03, offset 6.
  - id: "160-0"
    source_node: pve-opt-03
    target_node: pve-laptop-01
    schedule: "6,21,36,51"
    comment: "dns-02 -> pve-laptop-01"
    enabled: true
  - id: "160-1"
    source_node: pve-opt-03
    target_node: pve-opt-01
    schedule: "6,21,36,51"
    comment: "dns-02 -> pve-opt-01"
    enabled: true
  - id: "160-2"
    source_node: pve-opt-03
    target_node: pve-opt-02
    schedule: "6,21,36,51"
    comment: "dns-02 -> pve-opt-02"
    enabled: true
  - id: "160-3"
    source_node: pve-opt-03
    target_node: pve-prec-01
    schedule: "6,21,36,51"
    comment: "dns-02 -> pve-prec-01"
    enabled: true

  # home-assistant (154), home pve-prec-01, offset 9.
  - id: "154-0"
