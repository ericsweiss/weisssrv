# Relay SASL credential, injected via `op run --` (handled by the task wrapper).
# One credential, two consumers: every null client authenticates WITH it, and the
# relay stores it in its own sasldb — so the two role-prefixed names are anchored
# to a single definition rather than kept in step by hand.
postfix_null_client_sasl_user: &relay_sasl_user >-
  {{ lookup('ansible.builtin.env', 'SMTP_RELAY_USER')
     or undef(hint='SMTP_RELAY_USER env var must be set') }}
postfix_null_client_sasl_password: &relay_sasl_password >-
  {{ lookup('ansible.builtin.env', 'SMTP_RELAY_PASSWORD')
     or undef(hint='SMTP_RELAY_PASSWORD env var must be set') }}
smtp_relay_sasl_user: *relay_sasl_user
smtp_relay_sasl_password: *relay_sasl_password

# Root's mail goes to the admin address; the postfix_null_client and smtp_relay
# alias maps are otherwise the role defaults (postmaster/nobody/hostmaster/
# webmaster -> root).
postfix_null_client_root_alias: "{{ admin_email }}"
