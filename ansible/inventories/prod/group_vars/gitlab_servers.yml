---
# GitLab servers configuration

# Repository storage on separate ZFS zvol (200GB on ssd pool)
# Mounted at /mnt/gitlab-repos, data stored in /mnt/gitlab-repos/git-data
# This separates repo data from root disk for:
#   - Better I/O isolation
#   - Independent sizing and growth
#   - Easier backup and migration
gitlab_git_data_dir: "/mnt/gitlab-repos/git-data"

# Container Registry blob store on the same ZFS zvol (raw-ZFS replicated
# ssd/appdata -> archive). The registry (~7.5G) is the largest component and the
# DiskUsageCritical culprit; relocating it off the OS disk is a one-time move
# performed by the gitlab role (brief registry outage on the next deploy).
gitlab_registry_data_dir: "/mnt/gitlab-repos/registry"

# SAML Group-based access control (Authentik group names)
# Only users in these groups can access GitLab
gitlab_saml_required_groups:
  - "gitlab-users"
  - "gitlab-admins"

# Users in this group become GitLab admins
gitlab_saml_admin_groups:
  - "gitlab-admins"

# Postfix null client uses the role default postfix_config (relay via
# smtp-relay over SASL+TLS, loopback-only). postfix_sasl_user,
# postfix_sasl_password, and mail_aliases are defined in all.yml.

# Monitoring whitelist: role default (loopback + LAN /24) PLUS the k3s pod
# CIDR. The deploy-verify / maintenance-verify readiness probes run in runner
# PODS: when such a pod lands on a node hosting a Traefik replica, its
# connection to the internal VIP short-circuits in-cluster
# (externalTrafficPolicy: Local preserves the pod source IP), so GitLab sees a
# 10.42.x client and 404s /-/readiness; on other nodes the traffic SNATs to a
# node IP and passes — a placement-dependent flake that failed
# maintenance-run-all's verify on 2026-07-16. The pod CIDR is
# cluster-internal and unroutable from outside; the exposure ceiling is
# unauthenticated /-/metrics to in-cluster pods (incl. shared-runner CI jobs),
# accepted for deterministic verify.
gitlab_monitoring_whitelist:
  - 127.0.0.1
  - 192.168.0.0/24
  - 10.42.0.0/16
