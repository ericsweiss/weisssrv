---
# These hosts act as Tailscale subnet routers for remote access to the homelab.
# Route auto-approval and the SSH/access ACLs are managed as code in
# terraform/tailscale (see that module's README).
tailscale_accept_routes: false  # CRITICAL: subnet routers must NOT accept routes (routing loop)
tailscale_advertise_routes:
  - "10.0.10.0/24"

tailscale_additional_flags:
  - "--operator=eric"
  - "--ssh"

# Adopted via the role's best-effort `tailscale set --advertise-tags` reconcile
# task, NOT the initial `tailscale up` — a tag on `up` hard-fails a join before
# tagOwners exists. DEPLOY ORDER MATTERS: apply the ACL first (it defines
# tagOwners + the tag-based route auto-approver), THEN run this role so the
# hosts adopt the tag — see terraform/tailscale/README.md.
tailscale_advertise_tags:
  - "tag:subnet-router"

# Root SSH with keys is required for migrations and replication; overrides the
# "no" default from group_vars/all.yml.
base_ssh_permit_root_login: "prohibit-password"

# The relay host and SASL credentials are defined in all.yml.

# pveproxy jail: brute-force protection for the Proxmox web UI (8006).
base_fail2ban_pveproxy_enabled: true

# ip_forward=1 required for Tailscale subnet routing (advertised above).
# pve_firewall occasionally resets this; nic_tuning role installs a sysctl.d
# drop-in that persists across reboots and `sysctl --system` reloads.
nic_tuning_ip_forward: true

# Proxmox-only host metrics: smartmontools + drivetemp and the four textfile
# collectors (corosync, zpool, smartmon, vzdump). Without this the exporter
# installs but publishes none of them.
node_exporter_host_proxmox: true

# Host-originated egress filtering on every Proxmox host: default-deny OUT plus
# the sg-host-egress allowlist (proxmox_firewall/templates/cluster.fw.j2).
# FORWARDed guest/subnet traffic is unaffected — host.fw OUT is host-originated
# only.
proxmox_firewall_egress_filtering: true

# ZFS ARC cap for the COMPUTE hosts (8 GiB). site.yml runs zfs_arc_cap only
# where proxmox_role != 'nas' (pve-nas-01's ARC is owned by nas_storage —
# nas_storage_zfs_arc_max_bytes in its host_vars). Sized for pve-prec-01, whose
# VFIO guest RAM is host-pinned (docs/43); the 14-15 GiB opt/laptop hosts
# override to 2 GiB in host_vars, because an ARC free to grow to 8 GiB there
# competes with the guests it exists to serve.
zfs_arc_cap_max_bytes: 8589934592

# NFSv4-over-TLS handshake daemon on every Proxmox host: prerequisite for the
# tank-proxmox storage.cfg target moving to hostname + xprtsec=tls (the
# proxmox_backup role's codified shape — storage.cfg is clustered, so EVERY
# node mounts it and needs tlshd). Client mode only: hosts need just the
# system CA truststore, no cert/key (pve-nas-01 overrides nfs_tls_is_server
# in host_vars — it is the NFS server).
nfs_tls_enabled: true
