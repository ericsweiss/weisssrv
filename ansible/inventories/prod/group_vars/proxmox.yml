---
# Proxmox-specific variables
# These hosts act as Tailscale subnet routers for remote access to the homelab

# Tailscale subnet routing configuration
# Proxmox hosts advertise the internal LAN but do NOT accept routes from other peers
# This prevents routing loops where the host routes its own traffic through Tailscale
#
# Advertising a route only makes it usable once APPROVED in the tailnet. Route
# auto-approval (so all six hosts' advertisements approve = real HA failover, not
# a single-host SPOF) and the SSH/access ACLs are managed as code in
# terraform/tailscale (see that module's README).
tailscale_accept_routes: false  # CRITICAL: Subnet routers must NOT accept routes
tailscale_advertise_routes:
  - "192.168.0.0/24"  # Advertise internal LAN for remote access via Tailscale

# Additional Tailscale flags for subnet routers
# These are passed to `tailscale up` command
tailscale_additional_flags:
  - "--operator=eric"  # Allow eric user to manage Tailscale
  - "--ssh"  # Enable Tailscale SSH

# ACL tag advertised by every Proxmox subnet router. The least-privilege tailnet
# policy (terraform/tailscale/policy.hujson) scopes host access and route
# auto-approval to tag:subnet-router. Adopted via the role's best-effort
# `tailscale set --advertise-tags` reconcile task (NOT the initial `tailscale up`
# — a tag on `up` would hard-fail a join before tagOwners exists). DEPLOY ORDER
# MATTERS: apply the ACL first (it defines tagOwners + the tag-based route
# auto-approver), THEN run this role so the hosts adopt the tag — see
# terraform/tailscale/README.md. The owner entry stays in the ACL's autoApprovers
# during migration so untagged hosts keep route approval.
# NOTE: on merge, the deploy-ansible-proxmox pipeline runs this role automatically
# (before the supervised ACL apply). The tag-reconcile task will benignly report
# "needs reauth" until tagOwners exists live — by default it is best-effort
# (tailscale_tags_require_adoption=false), so the pipeline stays green; the tags
# actually adopt during the supervised step, which is run with
# `-e tailscale_tags_require_adoption=true` to catch any host that fails to adopt.
tailscale_advertise_tags:
  - "tag:subnet-router"

# SSH configuration override for Proxmox cluster
# Allow root SSH with keys (required for migrations and replication)
# This overrides the default "no" from group_vars/all.yml
base_ssh_permit_root_login: "prohibit-password"

# The relay host and SASL credentials are defined in all.yml.

# Fail2ban configuration for Proxmox hosts
# Enable pveproxy jail to protect Proxmox web UI (port 8006) from brute-force attacks
base_fail2ban_pveproxy_enabled: true

# ip_forward=1 required for Tailscale subnet routing (advertised above).
# pve_firewall occasionally resets this; nic_tuning role installs a sysctl.d
# drop-in that persists across reboots and `sysctl --system` reloads.
nic_tuning_ip_forward: true

# Proxmox-only host metrics: smartmontools + drivetemp and the four textfile
# collectors (corosync, zpool, smartmon, vzdump). Without this the exporter
# installs but publishes none of them.
node_exporter_host_proxmox: true

# Host-originated egress filtering on every Proxmox host: default-deny OUT plus
# the sg-host-egress allowlist (proxmox_firewall/templates/cluster.fw.j2).
# FORWARDed guest/subnet traffic is unaffected — host.fw OUT is host-originated
# only.
proxmox_firewall_egress_filtering: true

# ZFS ARC cap for the COMPUTE hosts (8 GiB). site.yml runs zfs_arc_cap only
# where proxmox_role != 'nas' (pve-nas-01's ARC is owned by nas_storage —
# nas_storage_zfs_arc_max_bytes in its host_vars). Sized for pve-prec-01, whose
# VFIO guest RAM is host-pinned (docs/43); the 14-15 GiB opt/laptop hosts
# override to 2 GiB in host_vars, because an ARC free to grow to 8 GiB there
# competes with the guests it exists to serve.
zfs_arc_cap_max_bytes: 8589934592

# NFSv4-over-TLS handshake daemon on every Proxmox host: prerequisite for the
# tank-proxmox storage.cfg target moving to hostname + xprtsec=tls (the
# proxmox_backup role's codified shape — storage.cfg is clustered, so EVERY
# node mounts it and needs tlshd). Client mode only: hosts need just the
# system CA truststore, no cert/key (pve-nas-01 overrides nfs_tls_is_server
# in host_vars — it is the NFS server).
nfs_tls_enabled: true
