---
# Proxmox-specific variables
# These hosts act as Tailscale subnet routers for remote access to the homelab

# Tailscale subnet routing configuration
# Proxmox hosts advertise the internal LAN but do NOT accept routes from other peers
# This prevents routing loops where the host routes its own traffic through Tailscale
#
# Advertising a route only makes it usable once APPROVED in the tailnet. Route
# auto-approval (so all six hosts' advertisements approve = real HA failover, not
# a single-host SPOF) and the SSH/access ACLs are managed as code in
# terraform/tailscale (see that module's README).
tailscale_accept_routes: false  # CRITICAL: Subnet routers must NOT accept routes
tailscale_advertise_routes:
  - "192.168.0.0/24"  # Advertise internal LAN for remote access via Tailscale

# Additional Tailscale flags for subnet routers
# These are passed to `tailscale up` command
tailscale_additional_flags:
  - "--operator=eric"  # Allow eric user to manage Tailscale
  - "--ssh"  # Enable Tailscale SSH

# SSH configuration override for Proxmox cluster
# Allow root SSH with keys (required for migrations and replication)
# This overrides the default "no" from group_vars/all.yml
ssh_permit_root_login: "prohibit-password"

# postfix_sasl_user and postfix_sasl_password are defined in all.yml

# Fail2ban configuration for Proxmox hosts
# Enable pveproxy jail to protect Proxmox web UI (port 8006) from brute-force attacks
fail2ban_pveproxy_enabled: true

# ip_forward=1 required for Tailscale subnet routing (advertised above).
# pve_firewall occasionally resets this; nic_tuning role installs a sysctl.d
# drop-in that persists across reboots and `sysctl --system` reloads.
nic_tuning_ip_forward: true

# Host-originated egress filtering (default-deny OUT on the node itself + the
# sg-host-egress allowlist; see proxmox_firewall/templates/cluster.fw.j2). ON for
# ALL Proxmox hosts. Rolled out + validated in two waves: the 5 compute hosts
# (2026-07-04), then pve-nas-01 (2026-07-05, after confirming no Tailscale exit
# node and fallback jumps via opt-01/opt-02). On every host: cluster stayed
# Quorate (corosync 5404:5412 allowlisted), Tailscale subnet-routing + SSH-jump
# forwarding survived (FORWARD chain / dport 22+443 allowed), NFS serving intact,
# and the OUT DROP rule logged zero legitimate drops. FORWARDed guest/subnet
# traffic is unaffected (host.fw OUT rules are host-originated only).
proxmox_firewall_egress_filtering: true
