---
# SMTP relay server configuration

# LXC container settings
# Nesting required for systemd 257+ (Debian 13) to function correctly
proxmox_lxc_nesting: true

# The SAME from=-restricted key base deploys, not the plain SSH_PUBLIC_KEY the
# role defaults to, so the two managers agree; the ternary short-circuits when
# SSH_PUBLIC_KEY is unset (skip, not error). Same block in dns.yml.
proxmox_lxc_ssh_public_keys: >-
  {{ ssh_authorized_keys | join("\n")
     if lookup('ansible.builtin.env', 'SSH_PUBLIC_KEY', default='') else '' }}

# Boot order (proxmox_lxc_startup_order/delay) is set in host_vars/smtp-relay.yml
# (the only mail host).

# Smarthost the relay forwards to. myhostname/myorigin derive from
# internal_domain in the role.
smtp_relay_upstream: "[smtp.gmail.com]:587"

# CRITICAL: deltas over smtp_relay_default_config only, so upstream hardening
# defaults reach this relay. mynetworks and smtpd_relay_restrictions stay at the
# role default of loopback-only plus SASL-only. Adding the LAN to mynetworks
# opens unauthenticated relay from the whole /24.
smtp_relay_config:
  # /etc/mailname rather than the bare domain: the Debian package keeps the FQDN
  # there and postfix reads it at start, so the two cannot drift.
  myorigin: "/etc/mailname"
