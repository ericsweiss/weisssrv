---
# SMTP relay server configuration

# LXC container settings
# Nesting required for systemd 257+ (Debian 13) to function correctly
proxmox_lxc_nesting: true

# Boot order (proxmox_lxc_startup_order/delay) is set in host_vars/smtp-relay.yml
# (the only mail host).

# Smarthost the relay forwards to. myhostname/myorigin derive from
# internal_domain in the role.
smtp_relay_upstream: "[smtp.gmail.com]:587"

# Deltas over smtp_relay_default_config only — everything else (TLS levels and
# protocol lists, both SASL halves, cert paths, mydestination, inet_*) is the
# role default and is deliberately NOT restated, so a hardening default added
# upstream actually reaches this relay.
smtp_relay_config:
  # /etc/mailname rather than the bare domain: the Debian package keeps the FQDN
  # there and postfix reads it at start, so the two cannot drift.
  myorigin: "/etc/mailname"
  # Loopback + host LAN. The k3s pod CIDR (10.42.0.0/16) is deliberately absent:
  # it never matched anyway (pods reaching this LXC are SNAT'd to their node IP,
  # which is in 192.168.0.0/24), and every in-cluster sender (Alertmanager,
  # Mealie, Bar Assistant, Authentik) relays via SASL on 587
  # (permit_sasl_authenticated), not permit_mynetworks on 25.
  mynetworks: "127.0.0.0/8,192.168.0.0/24"
  # permit_mynetworks is added back on top of the role's SASL-only default so
  # LAN hosts can relay on 25; the guest firewall admits :25 from core-cluster
  # only (sg-smtp-relay).
  smtpd_relay_restrictions: "permit_mynetworks,permit_sasl_authenticated,reject_unauth_destination"
