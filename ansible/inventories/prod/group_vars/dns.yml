---
# DNS server configuration (dns-01, dns-02)

proxmox_lxc_nesting: true  # Required for systemd 257+

# The SAME from=-restricted key base deploys, not the plain SSH_PUBLIC_KEY the
# role defaults to, so the two managers agree; the ternary short-circuits when
# SSH_PUBLIC_KEY is unset (skip, not error). Same block in mail.yml.
proxmox_lxc_ssh_public_keys: >-
  {{ ssh_authorized_keys | join("\n")
     if lookup('ansible.builtin.env', 'SSH_PUBLIC_KEY', default='') else '' }}

# These hosts ARE the resolvers, so base must not point their /etc/resolv.conf
# at themselves before AdGuard is up; it uses base_bootstrap_dns_servers until
# the resolver answers.
base_is_resolver_host: true

# A resolver's Proxmox-level nameserver is ITSELF (127.0.0.1), not the client
# default: Proxmox rewrites the container's /etc/resolv.conf from this on every
# restart, and the proxmox_lxc DNS reconcile would otherwise repoint it.
proxmox_lxc_nameserver: "127.0.0.1"

# Boot order (proxmox_lxc_startup_order/delay) is set per host in
# host_vars/dns-01.yml and host_vars/dns-02.yml (both order 10, delay 10).

# Set here (not left to the unbound role default) because adguard_home
# references it below.
unbound_port: 5335

# This site's superseded drop-in name, removed on every run. Without it the
# stale file survives, and unbound merges the drop-in dir with a SORTED glob, so
# weisssrv.conf wins every scalar it duplicates from managed.conf.
unbound_legacy_dropins:
  - weisssrv.conf

# Deltas over the adguard_home role defaults only. These two ARE the default
# value, kept because playbooks outside the role dereference them with no
# fallback: update-applications.yml the path, postflight.yml the port.
adguard_home_install_path: /opt/AdGuardHome
adguard_home_http_port: 3000
adguard_home_admin_user: eric
# Password from 1Password; bcrypt hash is generated at deploy time by the adguard_home role
adguard_home_admin_password: >-
  {{ lookup('ansible.builtin.env', 'ADGUARD_ADMIN_PASSWORD')
     or undef(hint='ADGUARD_ADMIN_PASSWORD env var must be set (run via op run)') }}

# AdGuard terminates the wildcard cert on :443 (UI + DoH) and :853 (DoT/DoQ);
# Traefik re-originates rather than terminating. :3000 is the plaintext admin
# API, firewalled to the admin sets (proxmox_firewall_dns_admin_ports, all.yml).
adguard_home_tls_enabled: true
adguard_home_tls_server_name: "dns.{{ internal_domain }}"

adguard_home_upstream_dns:
  - "127.0.0.1:{{ unbound_port }}"

# Request limiter for the client VLANs; AdGuard DROPS the excess, so the client
# waits out its resolver timeout. Managed homelab hosts are whitelisted.
# Plain IPs only, and the order must match GET /control/dns_info.
adguard_home_ratelimit: 20
# AdGuard counts the limit per subnet, so the whitelist below only has bite per
# address at 32: at the default 24 one noisy client consumes the bucket for the
# whole homelab /24. A query forwarded by a k3s node arrives as that node.
adguard_home_ratelimit_subnet_len_ipv4: 32
# Every inventory host that has an address, so a host add, removal or renumber
# cannot leave one rate-limited. Sorted for idempotence against the API order.
_dns_addressed_hosts: >-
  {{ groups['all'] | map('extract', hostvars)
     | selectattr('ansible_host', 'defined') | list }}
adguard_home_ratelimit_whitelist: >-
  {{ _dns_addressed_hosts | map(attribute='ansible_host') | unique | sort | list }}

# DNS rewrites for internal services. Codified removal of the LAST rewrite (or
# the last entry in adguard_home_user_rules) needs adguard_home_prune_rewrites /
# _prune_user_rules true — an empty list means "manage none", not "delete all".
adguard_home_rewrites:
  # DNS web UIs accessed via Traefik Internal for HTTPS and DoH
  - domain: "dns-01.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "dns-02.{{ internal_domain }}"
    answer: "10.0.10.101"
  # SSO-fronted AdGuard dashboards (Authentik forward-auth + credential
  # injection, docs/08). Same Traefik VIP; the raw dns-01/dns-02 names above
  # stay as the no-SSO break-glass path.
  - domain: "adguard.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "adguard-02.{{ internal_domain }}"
    answer: "10.0.10.101"
  # Direct DNS access (for DoT/DoQ on port 853)
  - domain: "dns.{{ internal_domain }}"
    answer: "10.0.10.150"
  - domain: "dns.{{ internal_domain }}"
    answer: "10.0.10.160"
  - domain: "smtp-relay.{{ internal_domain }}"
    answer: "10.0.10.151"
  - domain: "plex-direct.{{ internal_domain }}"
    answer: "10.0.10.152"
  - domain: "gitlab.{{ internal_domain }}"
    answer: "10.0.10.153"
  # Direct-to-VM (admin/ssh convenience; mirrors gitlab.esweiss.com). The
  # Traefik-fronted web hostname is cloud.esweiss.com -> .101 (below).
  - domain: "nextcloud.{{ internal_domain }}"
    answer: "10.0.10.156"
  - domain: "home-direct.{{ internal_domain }}"
    answer: "10.0.10.154"
  - domain: "windows.{{ internal_domain }}"
    answer: "10.0.10.155"
  # Immich VM direct address (admin/SSH convenience; the web UI is fronted by
  # Traefik at photos.{{ internal_domain }} -> .101 below).
  - domain: "immich.{{ internal_domain }}"
    answer: "10.0.10.157"
  # ML inference LXC: LAN-only API for the Immich VM (docs/36).
  - domain: "immich-ml.{{ internal_domain }}"
    answer: "10.0.10.158"
  - domain: "pve-nas-01.{{ internal_domain }}"
    answer: "10.0.10.102"
  - domain: "pve-laptop-01.{{ internal_domain }}"
    answer: "10.0.10.103"
  - domain: "pve-opt-01.{{ internal_domain }}"
    answer: "10.0.10.104"
  - domain: "pve-opt-02.{{ internal_domain }}"
    answer: "10.0.10.105"
  - domain: "pve-opt-03.{{ internal_domain }}"
    answer: "10.0.10.106"
  - domain: "pve-prec-01.{{ internal_domain }}"
    answer: "10.0.10.107"
  - domain: "k3s.{{ internal_domain }}"
    answer: "10.0.10.161"
  - domain: "k3s-srv-nas-01.{{ internal_domain }}"
    answer: "10.0.10.222"
  - domain: "k3s-srv-laptop-01.{{ internal_domain }}"
    answer: "10.0.10.223"
  - domain: "k3s-srv-prec-01.{{ internal_domain }}"
    answer: "10.0.10.227"
  - domain: "k3s-agt-nas-01.{{ internal_domain }}"
    answer: "10.0.10.202"
  - domain: "k3s-agt-laptop-01.{{ internal_domain }}"
    answer: "10.0.10.203"
  - domain: "k3s-agt-opt-01.{{ internal_domain }}"
    answer: "10.0.10.204"
  - domain: "k3s-agt-opt-02.{{ internal_domain }}"
    answer: "10.0.10.205"
  - domain: "k3s-agt-opt-03.{{ internal_domain }}"
    answer: "10.0.10.206"
  - domain: "k3s-agt-prec-01.{{ internal_domain }}"
    answer: "10.0.10.207"
  - domain: "vip-internal.{{ internal_domain }}"
    answer: "10.0.10.101"
  # 1Password Connect API exposed via internal Traefik so bare-metal
  # Proxmox hosts can fetch ZFS-encryption passphrases at boot.
  - domain: "connect.{{ internal_domain }}"
    answer: "10.0.10.101"
  # Loki push API for host-side Alloy (replaces the plaintext NodePort).
  - domain: "loki.{{ internal_domain }}"
    answer: "10.0.10.101"
  # Internal name for the public MetalLB VIP (.100); matches the PTR below
  # so forward/reverse round-trip. External clients reach .100 via Cloudflare.
  - domain: "vip-public.{{ internal_domain }}"
    answer: "10.0.10.100"
  - domain: "traefik.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "grafana.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "bar.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "food.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "home.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "plex.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "router.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "auth.{{ internal_domain }}"
    answer: "10.0.10.101"
  # wg-easy admin UI (internal-only, Traefik-fronted). The WireGuard endpoint
  # itself is vpn.ericsweiss.com (external, UDP) — no esweiss rewrite for it.
  - domain: "vpn.{{ internal_domain }}"
    answer: "10.0.10.101"
  # Hermes Agent web dashboard (Authentik forward-auth)
  - domain: "agent.{{ internal_domain }}"
    answer: "10.0.10.101"
  # Homarr dashboard (Authentik OIDC; Traefik-internal). External name
  # dashboard.ericsweiss.com is Cloudflare-only (created by external-dns).
  - domain: "dashboard.{{ internal_domain }}"
    answer: "10.0.10.101"
  # Uptime Kuma (docs/45): status page unauthenticated, admin UI behind
  # Authentik forward-auth. The external name status.ericsweiss.com is
  # Cloudflare-only (created by external-dns) and serves the status page only.
  - domain: "status.{{ internal_domain }}"
    answer: "10.0.10.101"
  # DOCUMENTED EXCEPTION to the internal-only rule below: auth.ericsweiss.com
  # resolves internally so server-side OIDC discovery skips the WAN hairpin. The
  # issuer must stay the external name (docs/08).
  - domain: "auth.ericsweiss.com"
    answer: "10.0.10.101"
  # SECOND DOCUMENTED EXCEPTION - the GitLab family: a public answer hairpins to
  # our own WAN address, which the gateway does not loop back. ide.git and
  # *.ide.git are deliberately NOT rewritten - docs/08 § Cross-domain rewrites.
  - domain: "git.ericsweiss.com"
    answer: "10.0.10.101"
  - domain: "registry.git.ericsweiss.com"
    answer: "10.0.10.101"
  - domain: "pages.git.ericsweiss.com"
    answer: "10.0.10.101"
  - domain: "*.pages.git.ericsweiss.com"
    answer: "10.0.10.101"
  # THIRD DOCUMENTED EXCEPTION - photos is DNS-only at Cloudflare (docs/36) and
  # must resolve internally. Answer is the PUBLIC VIP: its external router lives
  # on websecure (kubernetes/apps/vm-ingress/immich.yaml).
  - domain: "photos.ericsweiss.com"
    answer: "10.0.10.100"
  # Hermes gateway OpenAI-compatible API (bearer-keyed; Home Assistant Voice
  # pipeline — docs/37 §Voice assistant). Internal-only, no external record.
  - domain: "agent-api.{{ internal_domain }}"
    answer: "10.0.10.101"
  # Internal-only services: esweiss.com rewrites only, no ericsweiss.com
  # variant. Sole exception is auth.ericsweiss.com above.
  - domain: "nzbget.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "qbittorrent.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "prowlarr.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "tv.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "movies.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "music.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "pulsarr.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "git.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "registry.git.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "pages.git.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "*.pages.git.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "cloud.{{ internal_domain }}"
    answer: "10.0.10.101"
  - domain: "photos.{{ internal_domain }}"
    answer: "10.0.10.101"

adguard_home_user_rules:
  - '@@||moneroocean.stream^'
  # PTR records for internal infrastructure
  - '||150.10.0.10.in-addr.arpa^$dnsrewrite=NOERROR;PTR;dns-01.{{ internal_domain }}.'
  - '||160.10.0.10.in-addr.arpa^$dnsrewrite=NOERROR;PTR;dns-02.{{ internal_domain }}.'
  - '||151.10.0.10.in-addr.arpa^$dnsrewrite=NOERROR;PTR;smtp-relay.{{ internal_domain }}.'
  - '||152.10.0.10.in-addr.arpa^$dnsrewrite=NOERROR;PTR;plex-direct.{{ internal_domain }}.'
  - '||153.10.0.10.in-addr.arpa^$dnsrewrite=NOERROR;PTR;gitlab.{{ internal_domain }}.'
  - '||154.10.0.10.in-addr.arpa^$dnsrewrite=NOERROR;PTR;home-direct.{{ internal_domain }}.'
  - '||155.10.0.10.in-addr.arpa^$dnsrewrite=NOERROR;PTR;windows.{{ internal_domain }}.'
  - '||156.10.0.10.in-addr.arpa^$dnsrewrite=NOERROR;PTR;nextcloud.{{ internal_domain }}.'
  - '||157.10.0.10.in-addr.arpa^$dnsrewrite=NOERROR;PTR;immich.{{ internal_domain }}.'
  - '||158.10.0.10.in-addr.arpa^$dnsrewrite=NOERROR;PTR;immich-ml.{{ internal_domain }}.'
  - '||102.10.0.10.in-addr.arpa^$dnsrewrite=NOERROR;PTR;pve-nas-01.{{ internal_domain }}.'
  - '||103.10.0.10.in-addr.arpa^$dnsrewrite=NOERROR;PTR;pve-laptop-01.{{ internal_domain }}.'
