---
# DNS server configuration (dns-01, dns-02)

proxmox_lxc_nesting: true  # Required for systemd 257+

# Write the SAME key base deploys (from=-restricted), not the plain
# SSH_PUBLIC_KEY the role defaults to: these LXCs are base_managed AND
# proxmox_lxc-managed, so mismatched content makes every deploy report changed.
# The ternary short-circuits so a job without SSH_PUBLIC_KEY skips (not errors).
proxmox_lxc_ssh_public_keys: >-
  {{ ssh_authorized_keys | join("\n")
     if lookup('ansible.builtin.env', 'SSH_PUBLIC_KEY', default='') else '' }}

# These hosts ARE the resolvers, so base must not point their /etc/resolv.conf
# at themselves before AdGuard is up; it uses base_bootstrap_dns_servers until
# the resolver answers.
base_is_resolver_host: true

# Boot order (proxmox_lxc_startup_order/delay) is set per host in
# host_vars/dns-01.yml and host_vars/dns-02.yml (both order 10, delay 10).

# Set here (not left to the unbound role default) because adguard_home
# references it below.
unbound_port: 5335

# This site's superseded drop-in name, removed on every run. Site data, so it
# belongs here rather than in the role default (which is due to become []) —
# without it the stale file survives, and unbound merges the drop-in dir with a
# SORTED glob, so weisssrv.conf wins every scalar it duplicates from managed.conf.
unbound_legacy_dropins:
  - weisssrv.conf

adguard_home_user: adguard
adguard_home_group: adguard
adguard_home_install_path: /opt/AdGuardHome
adguard_home_http_port: 3000
adguard_home_dns_port: 53
adguard_home_dot_port: 853
adguard_home_https_port: 443
adguard_home_admin_user: eric
# Password from 1Password; bcrypt hash is generated at deploy time by the adguard_home role
adguard_home_admin_password: >-
  {{ lookup('ansible.builtin.env', 'ADGUARD_ADMIN_PASSWORD')
     or undef(hint='ADGUARD_ADMIN_PASSWORD env var must be set (run via op run)') }}

# AdGuard terminates the wildcard cert on :443 (UI + DoH) and :853 (DoT/DoQ);
# Traefik re-originates rather than terminating. :3000 is the plaintext admin
# API, firewalled to the admin sets (proxmox_firewall_dns_admin_ports in all.yml).
adguard_home_tls_enabled: true
adguard_home_tls_server_name: "dns.{{ internal_domain }}"
adguard_home_cert_path: "{{ adguard_home_install_path }}/certs"
adguard_home_doq_port: 853

adguard_home_upstream_dns:
  - "127.0.0.1:{{ unbound_port }}"

adguard_home_protection_enabled: true
adguard_home_upstream_mode: "load_balance"
adguard_home_fallback_dns: []
adguard_home_enable_dnssec: true
adguard_home_resolve_clients: true
adguard_home_use_private_ptr_resolvers: false
adguard_home_disable_ipv6: false

adguard_home_cache_enabled: true
adguard_home_cache_size: 8388608
adguard_home_cache_ttl_min: 0
adguard_home_cache_ttl_max: 0
adguard_home_cache_optimistic: false

adguard_home_ratelimit: 20
adguard_home_ratelimit_whitelist: []

# DNS rewrites for internal services. Codified removal of the LAST rewrite (or
# the last entry in adguard_home_user_rules) needs adguard_home_prune_rewrites /
# _prune_user_rules true — an empty list means "manage none", not "delete all".
adguard_home_rewrites:
  # DNS web UIs accessed via Traefik Internal for HTTPS and DoH
  - domain: "dns-01.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "dns-02.{{ internal_domain }}"
    answer: "192.168.0.101"
  # SSO-fronted AdGuard dashboards (Authentik forward-auth + credential
  # injection, docs/08). Same Traefik VIP; the raw dns-01/dns-02 names above
  # stay as the no-SSO break-glass path.
  - domain: "adguard.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "adguard-02.{{ internal_domain }}"
    answer: "192.168.0.101"
  # Direct DNS access (for DoT/DoQ on port 853)
  - domain: "dns.{{ internal_domain }}"
    answer: "192.168.0.150"
  - domain: "dns.{{ internal_domain }}"
    answer: "192.168.0.160"
  - domain: "smtp-relay.{{ internal_domain }}"
    answer: "192.168.0.151"
  - domain: "plex-direct.{{ internal_domain }}"
    answer: "192.168.0.152"
  - domain: "gitlab.{{ internal_domain }}"
    answer: "192.168.0.153"
  # Direct-to-VM (admin/ssh convenience; mirrors gitlab.esweiss.com). The
  # Traefik-fronted web hostname is cloud.esweiss.com -> .101 (below).
  - domain: "nextcloud.{{ internal_domain }}"
    answer: "192.168.0.156"
  - domain: "home-direct.{{ internal_domain }}"
    answer: "192.168.0.154"
  - domain: "windows.{{ internal_domain }}"
    answer: "192.168.0.155"
  # Immich VM direct address (admin/SSH convenience; the web UI is fronted by
  # Traefik at photos.{{ internal_domain }} -> .101 below).
  - domain: "immich.{{ internal_domain }}"
    answer: "192.168.0.157"
  - domain: "pve-nas-01.{{ internal_domain }}"
    answer: "192.168.0.102"
  - domain: "pve-laptop-01.{{ internal_domain }}"
    answer: "192.168.0.103"
  - domain: "pve-opt-01.{{ internal_domain }}"
    answer: "192.168.0.104"
  - domain: "pve-opt-02.{{ internal_domain }}"
    answer: "192.168.0.105"
  - domain: "pve-opt-03.{{ internal_domain }}"
    answer: "192.168.0.106"
  - domain: "pve-prec-01.{{ internal_domain }}"
    answer: "192.168.0.107"
  - domain: "k3s.{{ internal_domain }}"
    answer: "192.168.0.161"
  - domain: "k3s-srv-nas-01.{{ internal_domain }}"
    answer: "192.168.0.222"
  - domain: "k3s-srv-laptop-01.{{ internal_domain }}"
    answer: "192.168.0.223"
  - domain: "k3s-srv-prec-01.{{ internal_domain }}"
    answer: "192.168.0.227"
  - domain: "k3s-agt-nas-01.{{ internal_domain }}"
    answer: "192.168.0.202"
  - domain: "k3s-agt-laptop-01.{{ internal_domain }}"
    answer: "192.168.0.203"
  - domain: "k3s-agt-opt-01.{{ internal_domain }}"
    answer: "192.168.0.204"
  - domain: "k3s-agt-opt-02.{{ internal_domain }}"
    answer: "192.168.0.205"
  - domain: "k3s-agt-opt-03.{{ internal_domain }}"
    answer: "192.168.0.206"
  - domain: "k3s-agt-prec-01.{{ internal_domain }}"
    answer: "192.168.0.207"
  - domain: "vip-internal.{{ internal_domain }}"
    answer: "192.168.0.101"
  # 1Password Connect API exposed via internal Traefik so bare-metal
  # Proxmox hosts can fetch ZFS-encryption passphrases at boot.
  - domain: "connect.{{ internal_domain }}"
    answer: "192.168.0.101"
  # Loki push API for host-side Alloy (replaces the plaintext NodePort).
  - domain: "loki.{{ internal_domain }}"
    answer: "192.168.0.101"
  # Internal name for the public MetalLB VIP (.100); matches the PTR below
  # so forward/reverse round-trip. External clients reach .100 via Cloudflare.
  - domain: "vip-public.{{ internal_domain }}"
    answer: "192.168.0.100"
  - domain: "traefik.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "grafana.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "bar.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "food.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "home.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "plex.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "router.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "auth.{{ internal_domain }}"
    answer: "192.168.0.101"
  # wg-easy admin UI (internal-only, Traefik-fronted). The WireGuard endpoint
  # itself is vpn.ericsweiss.com (external, UDP) — no esweiss rewrite for it.
  - domain: "vpn.{{ internal_domain }}"
    answer: "192.168.0.101"
  # Hermes Agent web dashboard (Authentik forward-auth)
  - domain: "agent.{{ internal_domain }}"
    answer: "192.168.0.101"
  # Homarr dashboard (Authentik OIDC; Traefik-internal). External name
  # dashboard.ericsweiss.com is Cloudflare-only (created by external-dns).
  - domain: "dashboard.{{ internal_domain }}"
    answer: "192.168.0.101"
  # DOCUMENTED EXCEPTION to the internal-only rule below: auth.ericsweiss.com
  # resolves internally so server-side OIDC discovery/JWKS fetches skip the WAN
  # hairpin (Cloudflare bot protection 403s non-browser user agents). The issuer
  # must stay the external name — docs/08.
  - domain: "auth.ericsweiss.com"
    answer: "192.168.0.101"
  # Hermes gateway OpenAI-compatible API (bearer-keyed; Home Assistant Voice
  # pipeline — docs/37 §Voice assistant). Internal-only, no external record.
  - domain: "agent-api.{{ internal_domain }}"
    answer: "192.168.0.101"
  # Internal-only services: esweiss.com rewrites only, no ericsweiss.com
  # variant. Sole exception is auth.ericsweiss.com above.
  - domain: "nzbget.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "qbittorrent.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "prowlarr.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "tv.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "movies.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "music.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "pulsarr.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "git.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "registry.git.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "pages.git.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "*.pages.git.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "cloud.{{ internal_domain }}"
    answer: "192.168.0.101"
  - domain: "photos.{{ internal_domain }}"
    answer: "192.168.0.101"

adguard_home_user_rules:
  - '@@||moneroocean.stream^'
  # PTR records for internal infrastructure
  - '||150.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;dns-01.{{ internal_domain }}.'
  - '||160.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;dns-02.{{ internal_domain }}.'
  - '||151.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;smtp-relay.{{ internal_domain }}.'
  - '||152.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;plex-direct.{{ internal_domain }}.'
  - '||153.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;gitlab.{{ internal_domain }}.'
  - '||154.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;home-direct.{{ internal_domain }}.'
  - '||155.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;windows.{{ internal_domain }}.'
  - '||156.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;nextcloud.{{ internal_domain }}.'
  - '||157.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;immich.{{ internal_domain }}.'
  - '||102.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;pve-nas-01.{{ internal_domain }}.'
  - '||103.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;pve-laptop-01.{{ internal_domain }}.'
  - '||104.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;pve-opt-01.{{ internal_domain }}.'
  - '||105.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;pve-opt-02.{{ internal_domain }}.'
  - '||106.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;pve-opt-03.{{ internal_domain }}.'
  - '||107.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;pve-prec-01.{{ internal_domain }}.'
  - '||161.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;k3s.{{ internal_domain }}.'
  - '||222.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;k3s-srv-nas-01.{{ internal_domain }}.'
  - '||223.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;k3s-srv-laptop-01.{{ internal_domain }}.'
  - '||227.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;k3s-srv-prec-01.{{ internal_domain }}.'
  - '||202.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;k3s-agt-nas-01.{{ internal_domain }}.'
  - '||203.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;k3s-agt-laptop-01.{{ internal_domain }}.'
  - '||204.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;k3s-agt-opt-01.{{ internal_domain }}.'
  - '||205.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;k3s-agt-opt-02.{{ internal_domain }}.'
  - '||206.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;k3s-agt-opt-03.{{ internal_domain }}.'
  - '||207.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;k3s-agt-prec-01.{{ internal_domain }}.'
  - '||100.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;vip-public.{{ internal_domain }}.'
  - '||101.0.168.192.in-addr.arpa^$dnsrewrite=NOERROR;PTR;vip-internal.{{ internal_domain }}.'

adguard_home_dhcp_enabled: false

# Postfix null client uses the role default postfix_null_client_config (relay
# via smtp-relay over SASL+TLS, loopback-only); the relay host, credentials and
# aliases are defined in all.yml.

# dns-01 SSH key for certificate delivery to dns-02 and smtp-relay
acme_certs_ssh_private_key: >-
  {{ lookup('ansible.builtin.env', 'DNS01_SSH_PRIVATE_KEY')
     or undef(hint='DNS01_SSH_PRIVATE_KEY env var must be set (run via op run)') }}
acme_certs_ssh_public_key: >-
  {{ lookup('ansible.builtin.env', 'DNS01_SSH_PUBLIC_KEY')
     or undef(hint='DNS01_SSH_PUBLIC_KEY env var must be set (run via op run)') }}

# AdGuard Home Sync (dns-01 -> dns-02). Both URLs go through Traefik (.101), so
# the sync hop is TLS on the wire and the lan-tailscale-only middleware keeps
# the API off the WAN. adguard_sync_enabled is set on dns-01 only.
adguard_sync_origin: "https://dns-01.{{ internal_domain }}"
adguard_sync_replica: "https://dns-02.{{ internal_domain }}"
adguard_sync_admin_user: "{{ adguard_home_admin_user }}"
adguard_sync_admin_password: "{{ adguard_home_admin_password }}"
# adguard_sync_features is deliberately NOT set: restating the role default
# would freeze a copy and keep an upstream change from reaching these resolvers.
# Deltas only, same policy as group_vars/mail.yml.
