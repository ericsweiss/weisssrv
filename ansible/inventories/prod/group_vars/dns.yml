adguard_home_dhcp_enabled: false

# Postfix null client uses the role default postfix_null_client_config (relay
# via smtp-relay over SASL+TLS, loopback-only); the relay host, credentials and
# aliases are defined in all.yml.

# dns-01 SSH key for certificate delivery to dns-02 and smtp-relay
acme_certs_ssh_private_key: >-
  {{ lookup('ansible.builtin.env', 'DNS01_SSH_PRIVATE_KEY')
     or undef(hint='DNS01_SSH_PRIVATE_KEY env var must be set (run via op run)') }}
acme_certs_ssh_public_key: >-
  {{ lookup('ansible.builtin.env', 'DNS01_SSH_PUBLIC_KEY')
     or undef(hint='DNS01_SSH_PUBLIC_KEY env var must be set (run via op run)') }}

# Distribution targets: the role's reload script pushes the PEM pair to each
# after renewal. Addresses come from the roster, host_key is pinned by hand
# (`task certs:show-host-keys`). Schema: the acme_certs role README.
_acme_certs_targets:
  - host: dns-02
    ip: "{{ hostvars['dns-02'].ansible_host }}"
    host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEWbN0fb8eOTlPeHMQ/sZ+vkEgtSPAnZ7OiZjYsAcAyu"
    cert_dir: /opt/AdGuardHome/certs
    owner: root
    group: adguard
    cert_mode: "0644"
    key_mode: "0640"
    restart_service: AdGuardHome
  - host: smtp-relay
    ip: "{{ hostvars['smtp-relay'].ansible_host }}"
    host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK7o0NXu/ZssOvC0quOLUWBVm9q4l15hiHJ4LoVfHG98"
    cert_dir: /etc/postfix/tls
    owner: root
    group: root
    cert_mode: "0644"
    key_mode: "0600"
    restart_service: postfix
  # GitLab: cert lives in /etc/gitlab/ssl, referenced by gitlab.rb.
  # `gitlab-ctl hup nginx` reloads nginx without a full reconfigure.
  - host: gitlab
    ip: "{{ hostvars['gitlab'].ansible_host }}"
    host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH61P4VRLs1h6QR4YJDlDKDpjJiustrfFboC/O8CS1hB"
    cert_dir: /etc/gitlab/ssl
    owner: root
    group: root
    cert_mode: "0644"
    key_mode: "0600"
    restart_command: "sudo gitlab-ctl hup nginx"
  # Nextcloud (156): host nginx serves the wildcard from /etc/ssl/nextcloud,
  # replacing the role's self-signed bootstrap cert so Traefik's vm-tls-wildcard
  # backend validation succeeds for cloud (docs/35).
  - host: nextcloud
    ip: "{{ hostvars['nextcloud'].ansible_host }}"
    host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOf5zslX71wElT423JUsYIBkp1qIUpAmjLUvy/exDpIk"
    cert_dir: /etc/ssl/nextcloud
    owner: root
    group: root
    cert_mode: "0644"
    key_mode: "0600"
    restart_command: "sudo systemctl reload nginx"
  # Immich (157): host nginx serves the wildcard on 443 from /etc/nginx/ssl,
  # replacing the role's self-signed bootstrap cert so Traefik's vm-tls-wildcard
  # backend validation succeeds for photos (docs/36).
  - host: immich
    ip: "{{ hostvars['immich'].ansible_host }}"
    host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINvksbwaHJ2UoHAYNmpFeKuC7xPZIfhy4BRVWHFzpbt8"
    cert_dir: /etc/nginx/ssl
    owner: root
    group: root
    cert_mode: "0644"
    key_mode: "0600"
    restart_command: "sudo systemctl reload nginx"
  # CRITICAL: only the NFS server gets the wildcard cert + key. The
  # *.esweiss.com key impersonates every internal service, and k3s nodes are
  # xprtsec=tls clients that present no cert. Add one only if an export moves
  # to xprtsec=mtls. restart_command reloads tlshd when that unit is enabled.
  - host: pve-nas-01
    ip: "{{ hostvars['pve-nas-01'].ansible_host }}"
    host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGxyeQZee3W3aQ0EpeY5sLONaZB1Zy4eKoMAeSLnbRCr"
    cert_dir: /etc/ssl/private
    owner: root
    group: root
    cert_mode: "0644"
    key_mode: "0600"
    restart_command: >-
      if sudo systemctl list-unit-files tlshd.service >/dev/null 2>&1
      && sudo systemctl is-enabled --quiet tlshd.service; then
      sudo systemctl restart tlshd;
      else
      echo 'tlshd not yet enabled; skipping reload' >&2;
      fi
  # Plex: the plex role's cert-reload hook builds a PKCS#12 bundle from
  # the renewed PEM pair, atomically swaps it into place, and restarts
  # plexmediaserver.
  - host: plex
    ip: "{{ hostvars['plex'].ansible_host }}"
    host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO41P4DvFdeHkZW7Np3w71NH7WV2gGr2BQISIyjyeozB"
    cert_dir: /etc/ssl/plex
    # root-owned with plex group read — see plex role configure.yml.
    owner: root
    group: plex
    cert_mode: "0644"
    key_mode: "0640"
    restart_command: "sudo /usr/local/sbin/plex-cert-reload.sh"
  # HAOS: the SSH add-on listens on 22222 as root with no sudo. /ssl is the
  # directory configuration.yaml's http: ssl_certificate expects; `ha core
  # restart` re-reads config and binds the new cert.
  - host: home
    ip: "{{ hostvars['home'].ansible_host }}"
    ssh_port: 22222
    ssh_user: root
    ssh_no_sudo: true
    # Shared HAOS key — single source of truth in group_vars/all.yml,
    # also consumed by home_assistant_host_key in host_vars/home.yml.
    host_key: "{{ haos_ssh_host_key }}"
    cert_dir: /ssl
    owner: root
    group: root
    cert_mode: "0644"
    key_mode: "0600"
    restart_command: "ha core restart"

# An entry whose host_key is still empty is dropped here rather than pushed to:
# an unpinned target would accept the key from any host.
acme_certs_distribution_targets: >-
  {{ _acme_certs_targets
     | selectattr('host_key', 'defined')
     | rejectattr('host_key', 'equalto', '') | list }}

# AdGuard Home Sync (dns-01 -> dns-02). Both URLs go through Traefik (.101), so
# the sync hop is TLS on the wire and the lan-tailscale-only middleware keeps
# the API off the WAN. adguard_sync_enabled is set on dns-01 only.
adguard_sync_origin: "https://dns-01.{{ internal_domain }}"
adguard_sync_replica: "https://dns-02.{{ internal_domain }}"
adguard_sync_admin_user: "{{ adguard_home_admin_user }}"
adguard_sync_admin_password: "{{ adguard_home_admin_password }}"
# adguard_sync_features is deliberately NOT set: restating the role default
# would freeze a copy and keep an upstream change from reaching these resolvers.
# Deltas only, same policy as group_vars/mail.yml.
