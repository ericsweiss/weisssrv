---
k3s_api_vip: 10.0.10.161
k3s_api_port: 6443
# apiserver SAN list. The role adds the VIP, inventory_hostname and
# ansible_host itself; this is the stable service name clients use.
k3s_tls_sans:
  - "k3s.{{ internal_domain }}"

# /etc/hosts pins so a node can pull images and mount its NFS PVs while cluster
# DNS is down (both names are served by AdGuard, which runs in guests that may
# themselves be waiting on the cluster).
k3s_registry_host_pins:
  - name: "registry.git.{{ external_domain }}"
    ip: 10.0.10.101
  # containerd is handed a 401 pointing at the auth realm on git.ericsweiss.com,
  # so pinning the registry name alone still leaves the pull resolving that name
  # publicly - and a public answer hairpins to our own WAN address (docs/08).
  - name: "git.{{ external_domain }}"
    ip: 10.0.10.101
k3s_storage_host_pins:
  - name: "{{ (groups['nas'] | first) ~ '.' ~ internal_domain }}"
    ip: "{{ hostvars[groups['nas'] | first].ansible_host }}"

# Server (control-plane) token — grants the ability to join as a SERVER and pull
# cluster CA material (from 1Password at runtime).
k3s_token: "{{ lookup('ansible.builtin.env', 'K3S_TOKEN') or undef(hint='K3S_TOKEN env var must be set (run via op run)') }}"

# Lower-privilege agent token (1Password "K3s Agent Token", injected as
# K3S_AGENT_TOKEN by the Taskfile and every deploy job) so a compromised agent
# cannot register a control-plane node or fetch the cluster CA.
k3s_agent_token: >-
  {{ lookup('ansible.builtin.env', 'K3S_AGENT_TOKEN')
     or undef(hint='K3S_AGENT_TOKEN env var must be set (run via op run)') }}

# Network configuration. k3s derives the cluster DNS ClusterIP (.10) from the
# service CIDR itself, so there is no cluster-dns knob to set here.
k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"

# Empty for k3s VMs: kubelet copies the host's resolv.conf search domains into
# every pod, and ndots:5 plus `search esweiss.com` would suffix and probe every
# cluster-internal lookup externally first.
resolv_conf_search_domains: []

# CRITICAL: built-in components we replace. metrics-server here and the
# HelmRelease in infrastructure/controllers/metrics-server/ are one unit.
# Applying a change restarts the k3s servers - needs a healthy etcd quorum.
k3s_disable:
  - servicelb       # Using MetalLB
  - traefik         # Deploying our own Traefik
  - local-storage   # No dynamic provisioning: all PVs are static (see above)
  - metrics-server  # Replaced by the Flux HelmRelease (see above)

# wireguard-native encrypts pod-to-pod traffic across nodes (UDP/51820) at ~5%
# throughput cost. Switching the backend on a running cluster needs a
# server-by-server restart and UDP/8472 re-added to sg-k3s-core - docs/19.
k3s_flannel_backend: "wireguard-native"

# image-gc-{high,low}-threshold 70/50, not the 85/80 default: the thresholds are
# a PERCENTAGE of the disk, so on the small k3s VM root disks the default lets
# the image store crowd out ephemeral storage before pruning starts.
k3s_kubelet_args:
  - "image-gc-high-threshold=70"
  - "image-gc-low-threshold=50"

# tlshd for the xprtsec=tls mounts of pve-nas-01's exports, group-wide.
# Client-only - do NOT add k3s nodes to acme_certs_distribution_targets;
# the role scrubs stale cert material.
nfs_tls_enabled: true

# Keep removing the wildcard PEM acme_certs may stage on a client. Every k3s
# node is a client, so the scrub always runs here.
nfs_tls_scrub_client_cert: true

# Off-node etcd snapshot copy (servers only; docs/17). A systemd timer copies
# each server's newest snapshot to the NAS over xprtsec=tls and emits
# etcd_snapshot_last_copy_timestamp_seconds for the EtcdSnapshotStale alert.
k3s_etcd_snapshot_offnode_enabled: true
# Mounted by hostname — the *.esweiss.com cert has no IP SAN, so an IP mount
# fails the TLS handshake.
k3s_etcd_snapshot_nfs_server: "{{ (groups['nas'] | first) ~ '.' ~ internal_domain }}"

# kube-apiserver audit logging (servers only; docs/19, docs/31). The log is
# node-local and NOT shipped to Loki - alloy_host reads journald only. Changing
# this costs a rolling control-plane restart; needs a healthy etcd quorum.
k3s_audit_enabled: true

k3s_kube_vip_interface: "eth0"

# Delegate target for cluster-wide kubectl in the maintenance playbooks: a k3s
# server OTHER than the host being worked on, falling back to the first server.
# _reboot-if-needed.yml uses its own proxmox_host-aware variant.
k3s_delegate_server: "{{ (groups['k3s_servers'] | difference([inventory_hostname]) | first) | default(groups['k3s_servers'][0]) }}"

# Boot order and the `platform` resource pool are per host in hosts.yml —
# servers and agents use different orders, so a group value would be shadowed.

# The relay host and SASL credentials are defined in all.yml.
