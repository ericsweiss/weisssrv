---
# Nextcloud servers configuration
#
# App configuration and all image/version pins live in the nextcloud role
# defaults and group_vars/all.yml respectively. This file is the home for any
# Nextcloud-group-wide overrides.
#
# Postfix null client uses the role default postfix_config (relay via
# smtp-relay over SASL+TLS, loopback-only). postfix_sasl_user,
# postfix_sasl_password, and mail_aliases are defined in all.yml.

# Nextcloud state rides ZFS zvol passthrough disks only (no NFS); the VM is
# pinned to pve-nas-01. See hosts.yml (vm_additional_disks) and docs/35.

# Offsite-eligible backup landing (mirrors gitlab_servers.yml): pg_dump artifacts
# relocate onto the per-app tank/backups/apps NFS export so they ride the
# archsync file walk into restic B2 (docs/42). Mounted over TLS (xprtsec=tls;
# tlshd via the nfs_tls role, gated on this flag); the dataset is aes-256-gcm.
nextcloud_backup_nfs_enabled: true
