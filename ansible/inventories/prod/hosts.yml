---
# Production inventory for weisssrv homelab
# All hosts are managed via SSH with key-based authentication

all:
  vars:
    ansible_user: eric
    ansible_become: true
    ansible_python_interpreter: /usr/bin/python3

  children:
    # Proxmox VE hypervisors (managed by Ansible)
    proxmox:
      hosts:
        pve-nas-01:
          ansible_host: 192.168.0.102
          proxmox_role: nas
          # Unsafe to auto-reboot unattended: tank+ssd need a boot-time
          # encryption-key load (nvme is plaintext by design; archive replicas
          # stay locked). The unlock IS automated — zfs-load-key@{tank,ssd} +
          # zfs-mount-encrypted, then pve-start-encrypted-guests starts the
          # onboot=0 guests (docs/32) — but it depends on in-cluster 1Password
          # Connect being reachable, so an unattended reboot can still strand
          # the NAS if Connect is down. The maintenance self-host reboot path
          # therefore keeps deferring this host to an operator. (Default for
          # all other hosts is true — their k3s VMs are onboot=1 and pools are
          # unencrypted.)
          proxmox_self_reboot_safe: false
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-laptop-01:
          ansible_host: 192.168.0.103
          proxmox_role: compute
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-opt-01:
          ansible_host: 192.168.0.104
          proxmox_role: compute
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-opt-02:
          ansible_host: 192.168.0.105
          proxmox_role: compute
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-opt-03:
          ansible_host: 192.168.0.106
          proxmox_role: compute
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-prec-01:
          ansible_host: 192.168.0.107
          proxmox_role: compute
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients

    # DNS servers (LXC containers)
    dns:
      hosts:
        dns-01:
          ansible_host: 192.168.0.150
          vmid: 150
          proxmox_host: pve-laptop-01
          dns_role: primary
          proxmox_resource_pool: infra-core
          firewall_ipsets:
            - core-cluster
          guest_security_groups:
            - sg-vm-admin
            - sg-dns
            - sg-metrics
        dns-02:
          ansible_host: 192.168.0.160
          vmid: 160
          proxmox_host: pve-opt-03
          dns_role: replica
          proxmox_resource_pool: infra-core
          firewall_ipsets:
            - core-cluster
          guest_security_groups:
            - sg-vm-admin
            - sg-dns
            - sg-metrics

    # Mail relay (LXC container)
    # Uses eric user like all other LXC containers; Postfix runs as root (normal)
    mail:
      hosts:
        smtp-relay:
          ansible_host: 192.168.0.151
          vmid: 151
          # For LXC provisioning (site.yml's provisioning play); matches the HA
          # home in affinity-smtp-relay. proxmox_lxc handles the container
          # having been HA-migrated elsewhere.
          proxmox_host: pve-opt-01
          proxmox_resource_pool: infra-core
          firewall_ipsets:
            - core-cluster
          guest_security_groups:
            - sg-vm-admin
            - sg-smtp-relay
            - sg-metrics
          # Default-deny egress: enforces the sg-smtp-relay OUT allowlist
          # (DNS 53/853, SMTP submission 587, apt 80/443, ICMP — already in
          # cluster.fw.j2). Proxmox guests honor policy_out (unlike hosts), so
          # this flips the guest from the default ACCEPT to DROP. Deploy the
          # cluster.fw first, then verify relay mail + apt still egress.
          guest_firewall_policy_out: "DROP"

    # Plex Media Server (LXC container on pve-nas-01)
    # Note: proxmox_host is only needed for LXC provisioning (initial creation)
    # Firewall deployment works cluster-wide and doesn't need proxmox_host
    plex_servers:
      hosts:
        plex:
          ansible_host: 192.168.0.152
          vmid: 152
          proxmox_host: pve-nas-01  # For LXC provisioning via proxmox_lxc role
          proxmox_resource_pool: apps-public
          firewall_ipsets:
            - core-cluster
          guest_security_groups:
            - sg-vm-admin
            - sg-plex
            - sg-metrics

    # GitLab Server (VM on pve-nas-01)
    gitlab_servers:
      hosts:
        gitlab:
          ansible_host: 192.168.0.153
          vmid: 153
          proxmox_host: pve-nas-01
          proxmox_storage: ssd
          proxmox_resource_pool: apps-private
          vm_cores: 6
          vm_memory: 16384
          vm_disk_size: 100G
          vm_cpu_type: host
          # Additional disk for GitLab repository data (separate from root)
          # Zvol on ssd pool for I/O performance on git operations
          vm_additional_disks:
            - name: gitlab-repos
              size: 200G
              zvol: ssd/appdata/gitlab/repos
              mount_point: /mnt/gitlab-repos
              fstype: ext4
              # Stable SCSI slot — proxmox_vm pins disks by scsi_slot, never list
              # position. NEVER reuse or reorder a slot; it remaps a live zvol.
              scsi_slot: 1
              # Already backed up via ssd/appdata -> archive (raw ZFS); exclude
              # from vzdump so it isn't double-stored in tank/proxmox.
              vzdump_backup: false
          # onboot=0: scsi0 root + the repos zvol live on the ENCRYPTED ssd
          # pool, so this guest is started by pve-start-encrypted-guests.service
          # AFTER zfs-mount-encrypted.service unlocks ssd — NOT by pve-guests at
          # boot (which runs before the late, network-ordered unlock and would
          # only log a failed start against the still-locked storage). See the
          # zfs_encryption role and docs/32-zfs-encryption.md.
          proxmox_autostart_enabled: false
          proxmox_startup_order: 50
          proxmox_startup_delay: 30
          firewall_ipsets:
            - core-cluster
          guest_security_groups:
            - sg-vm-admin
            - sg-gitlab
            - sg-metrics

    # Nextcloud Server (VM on pve-nas-01)
    nextcloud_servers:
      hosts:
        nextcloud:
          ansible_host: 192.168.0.156
          vmid: 156
          proxmox_host: pve-nas-01
          proxmox_storage: ssd
          proxmox_resource_pool: apps-private
          vm_cores: 4
          vm_memory: 8192
          vm_disk_size: 40G
          vm_cpu_type: host
          # Nextcloud state lives entirely on ZFS zvol passthrough disks (no NFS
          # — the VM is NAS-pinned). scsi_slots are unique PER VM; never reuse or
          # reorder a slot (it remaps a live zvol). app + postgres zvols are
          # children of the encrypted ssd/appdata (backed up via
          # ssd/appdata -> archive + excluded from vzdump). The bulk data zvol is
          # a SPARSE child of the pre-existing encrypted tank/nextcloud-data
          # dataset, which is already in the archive SRC_LIST (raw-encrypted
          # recursive send) — so it inherits encryption and backup with zero
          # config change here.
          vm_additional_disks:
            - name: nextcloud-app
              size: 20G
              zvol: ssd/appdata/nextcloud/app
              mount_point: /mnt/nextcloud-app
              fstype: ext4
              scsi_slot: 1
              vzdump_backup: false
            - name: nextcloud-postgres
              size: 16G
              zvol: ssd/appdata/nextcloud/postgres
              mount_point: /mnt/nextcloud-postgres
              fstype: ext4
              scsi_slot: 2
              vzdump_backup: false
            - name: nextcloud-data
              size: 2T
              zvol: tank/nextcloud-data/disk
              mount_point: /mnt/nextcloud-data
              fstype: ext4
              scsi_slot: 3
              # Thin-provisioned: 2T ceiling, reserved lazily as users upload.
              sparse: true
              vzdump_backup: false
          # onboot=0: scsi0 root + the app/postgres zvols live on the ENCRYPTED
          # ssd pool (and the data zvol on encrypted tank/nextcloud-data), so
          # this guest is started by pve-start-encrypted-guests.service AFTER
          # zfs-mount-encrypted.service unlocks the pools — its vmid is added to
          # zfs_encryption_guest_vmids in host_vars/pve-nas-01.yml. See the
          # zfs_encryption role and docs/32-zfs-encryption.md.
          proxmox_autostart_enabled: false
          proxmox_startup_order: 55
          proxmox_startup_delay: 30
          firewall_ipsets:
            - core-cluster
          guest_security_groups:
            - sg-vm-admin
            - sg-nextcloud
            - sg-metrics

    # Immich photo-management VM on pve-nas-01 (docker-compose stack)
    immich_servers:
      hosts:
        immich:
          ansible_host: 192.168.0.157
          vmid: 157
          proxmox_host: pve-nas-01
          proxmox_storage: ssd
          proxmox_resource_pool: apps-private
          # ML is CPU-hungry (no GPU — the NAS iGPU is allocated to Plex).
          vm_cores: 6
          vm_memory: 12288
          vm_disk_size: 40G
          vm_cpu_type: host                 # host CPU since node-pinned (no live migration)
          # Three passthrough zvols. App + postgres on the encrypted ssd pool
          # (fast, small); the photo library on a 2TB SPARSE zvol under the
          # existing encrypted tank/immich-data dataset (inherits aes-256-gcm and
          # rides the existing archive SRC_LIST entry — zero backup-config change).
          # Every zvol is excluded from vzdump (backed up via archive/appdata or,
          # for the library, the tank/immich-data archive replication).
          vm_additional_disks:
            - name: immich-app
              size: 20G
              zvol: ssd/appdata/immich/app
              mount_point: /mnt/immich-app
              fstype: ext4
              # Stable SCSI slot — proxmox_vm pins disks by scsi_slot, never list
              # position. NEVER reuse or reorder a slot; it remaps a live zvol.
              scsi_slot: 1
              vzdump_backup: false
            - name: immich-postgres
              size: 24G
              zvol: ssd/appdata/immich/postgres
              mount_point: /mnt/immich-postgres
              fstype: ext4
              scsi_slot: 2
              vzdump_backup: false
            - name: immich-data
              size: 2T
              # SPARSE so the 2TB library grows on demand (thin). Child of the
              # pre-existing encrypted tank/immich-data dataset.
              sparse: true
              zvol: tank/immich-data/disk
              mount_point: /mnt/immich-data
              fstype: ext4
              scsi_slot: 3
              vzdump_backup: false
          # onboot=0: all disks live on ENCRYPTED pools (ssd + tank/immich-data),
          # so this guest is started by pve-start-encrypted-guests.service AFTER
          # zfs-mount-encrypted.service unlocks them — NOT by pve-guests at boot
          # (which runs before the late, network-ordered unlock). vmid 157 is in
          # zfs_encryption_guest_vmids (host_vars/pve-nas-01.yml). See docs/32.
          proxmox_autostart_enabled: false
          proxmox_startup_order: 56
          proxmox_startup_delay: 30
          firewall_ipsets:
            - core-cluster
          guest_security_groups:
            - sg-vm-admin
            - sg-immich
            - sg-metrics

    # Services and VMs (not managed by Ansible directly, firewall rules only)
    # ansible_connection: local prevents SSH to these hosts (HAOS/Windows can't run Ansible)
    # The proxmox_firewall role uses delegate_to to deploy .fw files via a Proxmox host
    # IMPORTANT: gather_facts must be false for this group (local facts would be your Mac)
    services:
      vars:
        # ansible_connection: local means any non-delegated task would run on
        # the operator's workstation — never let it inherit the global
        # ansible_become: true and try to sudo there. Delegated tasks (the only
        # kind this group runs) still escalate on the delegate host via its own
        # hostvars.
        ansible_become: false
      hosts:
        home:
          ansible_host: 192.168.0.154
          ansible_connection: local
          vmid: 154
          firewall_ipsets:
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-haos
            - sg-metrics
        windows:
          ansible_host: 192.168.0.155
          ansible_connection: local
          vmid: 155
          firewall_ipsets:
            - core-cluster
          guest_security_groups:
            - sg-windows

    # K3s cluster nodes (VMs - provisioned by Ansible)
    k3s_servers:
      vars:
        k3s_role: server
        # Server nodes get control-plane label and taint to reserve for kube-system
        k3s_labels:
          esweiss.com/control-plane: "true"
        k3s_taints:
          - key: node-role.kubernetes.io/control-plane
            value: "true"
            effect: NoSchedule
      hosts:
        k3s-srv-nas-01:
          ansible_host: 192.168.0.222
          vmid: 222
          k3s_is_first_server: true
          proxmox_host: pve-nas-01
          proxmox_storage: local-lvm
          proxmox_resource_pool: platform
          vm_cpu_type: host  # Pinned to this host, no live migration — host CPU type is safe
          vm_cores: 2
          vm_memory: 6144
          vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 30
          proxmox_startup_delay: 10
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-metrics
        # Server 2 (on pve-laptop-01)
        k3s-srv-laptop-01:
          ansible_host: 192.168.0.223
          vmid: 223
          k3s_is_first_server: false
          proxmox_host: pve-laptop-01
          proxmox_storage: local-ssd
          proxmox_resource_pool: platform
          vm_cpu_type: host
          vm_cores: 2
          vm_memory: 6144
          vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 30
          proxmox_startup_delay: 10
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-metrics
        # Server 3 (on pve-prec-01)
        k3s-srv-prec-01:
          ansible_host: 192.168.0.227
          vmid: 227
          k3s_is_first_server: false
          proxmox_host: pve-prec-01
          proxmox_storage: local-ssd
          proxmox_resource_pool: platform
          vm_cpu_type: host
          vm_cores: 2
          vm_memory: 6144
          vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 30
          proxmox_startup_delay: 10
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-metrics

    k3s_agents:
      vars:
        k3s_role: agent
      hosts:
        # NAS workloads agent (on pve-nas-01)
        k3s-agt-nas-01:
          ansible_host: 192.168.0.202
          vmid: 202
          proxmox_host: pve-nas-01
          proxmox_storage: local-lvm
          proxmox_resource_pool: platform
          vm_cpu_type: host  # Pinned to this host, no live migration — host CPU type is safe
          vm_cores: 6
          vm_memory: 12288
          vm_disk_size: 64G
          # Additional disks for persistent app data (survives VM recreation).
          # All are app-data zvols already backed up via ssd/appdata -> archive
          # (raw ZFS), so vzdump_backup: false excludes them from the VM image
          # backup to avoid double-storing them in tank/proxmox. Cutover ordering
          # (apply only after the ssd/appdata re-seed is green): docs/17.
          # Each disk pins an explicit, stable scsi_slot. proxmox_vm attaches by
          # scsi_slot, never list position, and refuses to remap a slot already
          # holding a different live zvol. NEVER reuse or reorder a slot — that
          # would rebind a data-bearing zvol onto the wrong device.
          vm_additional_disks:
            - name: postgres-data
              size: 10G
              zvol: ssd/appdata/authentik/postgres
              mount_point: /mnt/postgres-data
              fstype: ext4
              scsi_slot: 1
              vzdump_backup: false
            - name: mealie-postgres-data
              size: 32G
              zvol: ssd/appdata/mealie/postgres
              mount_point: /mnt/mealie-postgres-data
              fstype: ext4
              scsi_slot: 2
              vzdump_backup: false
            - name: prometheus-data
              size: 150G
              zvol: ssd/appdata/prometheus/data
              mount_point: /mnt/prometheus-data
              fstype: ext4
              scsi_slot: 3
              vzdump_backup: false
            - name: loki-data
              size: 75G
              zvol: ssd/appdata/loki/data
              mount_point: /mnt/loki-data
              fstype: ext4
              scsi_slot: 4
              vzdump_backup: false
          # onboot=0: the 4 data zvols (scsi1-4) live on the ENCRYPTED ssd pool,
          # so qm start fails until ssd unlocks. Started by
          # pve-start-encrypted-guests.service after zfs-mount-encrypted.service,
          # NOT by pve-guests at boot. (scsi0 root is on local-lvm, but a guest
          # with any missing configured disk won't start.) See the zfs_encryption
          # role and docs/32-zfs-encryption.md.
          proxmox_autostart_enabled: false
          proxmox_startup_order: 40
          proxmox_startup_delay: 10
          k3s_labels:
            esweiss.com/nas: "true"
            esweiss.com/general: "true"
            esweiss.com/cpu: "modern"
          k3s_taints:
            - key: esweiss.com/nas
              value: "true"
              effect: PreferNoSchedule
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-metrics
        # Ingress + general agent (on pve-laptop-01)
        k3s-agt-laptop-01:
          ansible_host: 192.168.0.203
          vmid: 203
          proxmox_host: pve-laptop-01
          proxmox_storage: local-ssd
          proxmox_resource_pool: platform
          vm_cpu_type: host
          vm_cores: 4
          vm_memory: 6144
          vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 40
          proxmox_startup_delay: 10
          k3s_labels:
            esweiss.com/general: "true"
            esweiss.com/ingress: "true"
            esweiss.com/cpu: "modern"
          k3s_taints:
            - key: esweiss.com/ingress
              value: "true"
              effect: PreferNoSchedule
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-k3s-ingress-int
            - sg-k3s-ingress-pub
            - sg-metrics
        # Ingress + general agent (on pve-opt-01)
        # NOTE: All OptiPlex nodes host Core 2 Quad Q9650 CPUs (Penryn, 2008) which
        # lack POPCNT (SSE4.2). Some modern binaries (e.g., GitLab secret-detection
        # gitleaks) crash with SIGILL on these CPUs. Nodes are labeled with
        # esweiss.com/cpu=legacy (OptiPlex) or esweiss.com/cpu=modern (others).
        # CI jobs that require modern instructions set:
        #   KUBERNETES_NODE_SELECTOR_CPU: esweiss.com/cpu=modern
        k3s-agt-opt-01:
          ansible_host: 192.168.0.204
          vmid: 204
          proxmox_host: pve-opt-01
          proxmox_storage: local-ssd
          proxmox_resource_pool: platform
          vm_cpu_type: host
          vm_cores: 3
          vm_memory: 6144
          vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 40
          proxmox_startup_delay: 10
          k3s_labels:
            esweiss.com/general: "true"
            esweiss.com/ingress: "true"
            esweiss.com/cpu: "legacy"
          k3s_taints:
            - key: esweiss.com/ingress
              value: "true"
              effect: PreferNoSchedule
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-k3s-ingress-int
            - sg-k3s-ingress-pub
            - sg-metrics
        # Ingress + general agent (on pve-opt-02)
        k3s-agt-opt-02:
          ansible_host: 192.168.0.205
          vmid: 205
          proxmox_host: pve-opt-02
          proxmox_storage: local-ssd
          proxmox_resource_pool: platform
          vm_cpu_type: host
          vm_cores: 3
          vm_memory: 6144
          vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 40
          proxmox_startup_delay: 10
          k3s_labels:
            esweiss.com/general: "true"
            esweiss.com/ingress: "true"
            esweiss.com/cpu: "legacy"
          k3s_taints:
            - key: esweiss.com/ingress
              value: "true"
              effect: PreferNoSchedule
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-k3s-ingress-int
            - sg-k3s-ingress-pub
            - sg-metrics
        # Ingress + general agent (on pve-opt-03)
        k3s-agt-opt-03:
          ansible_host: 192.168.0.206
          vmid: 206
          proxmox_host: pve-opt-03
          proxmox_storage: local-ssd
          proxmox_resource_pool: platform
          vm_cpu_type: host  # K3s nodes pinned to specific hosts, no migration
          vm_cores: 3
          vm_memory: 6144
          vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 40
          proxmox_startup_delay: 10
          k3s_labels:
            esweiss.com/general: "true"
            esweiss.com/ingress: "true"
            esweiss.com/cpu: "legacy"
          k3s_taints:
            - key: esweiss.com/ingress
              value: "true"
              effect: PreferNoSchedule
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-k3s-ingress-int
            - sg-k3s-ingress-pub
            - sg-metrics
        # General + compute agent (on pve-prec-01)
        k3s-agt-prec-01:
          ansible_host: 192.168.0.207
          vmid: 207
          proxmox_host: pve-prec-01
          proxmox_storage: local-ssd
          proxmox_resource_pool: platform
          vm_cpu_type: host
          # Higher specs for compute workloads
          vm_cores: 6
          vm_memory: 12288
          vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 40
          proxmox_startup_delay: 10
          k3s_labels:
            esweiss.com/general: "true"
            esweiss.com/compute: "true"
            esweiss.com/cpu: "modern"
            # Modern-CPU ingress candidate so Traefik + the MetalLB L2 speaker are
            # not 100% bound to the legacy-CPU opt nodes when pve-laptop-01 is out.
            # Label only (no ingress taint) — prec-01 stays a compute node too.
            esweiss.com/ingress: "true"
          k3s_taints:
            - key: esweiss.com/compute
              value: "true"
              effect: PreferNoSchedule
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            # prec-01 carries esweiss.com/ingress=true (modern-CPU ingress fallback,
            # see k3s_labels above) so Traefik schedules here and the MetalLB L2
            # speaker can announce the .100/.101 VIPs from this node. It therefore
            # needs the ingress security groups (80/443) like the opt-* ingress
            # nodes — without them the VIP black-holes at this VM's guest firewall
            # whenever MetalLB elects prec-01 as the announcer.
            - sg-k3s-ingress-int
            - sg-k3s-ingress-pub
            - sg-metrics

    # Aggregate groups for convenience
    lxc_containers:
      children:
        dns:
        mail:
        plex_servers:

    k3s:
      children:
        k3s_servers:
        k3s_agents:

    base_managed:
      children:
        proxmox:
        dns:
        mail:
