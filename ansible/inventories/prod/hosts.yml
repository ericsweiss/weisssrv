    base_managed:
      children:
        proxmox:
        dns:
        mail:

    # Runtime ledger groups, populated by playbooks/_reachability-probe.yml and
    # consumed by the `:!deploy_skipped` play patterns. Declared empty so those
    # patterns do not warn on a clean run - never add a host by hand.
    deploy_skipped:
    deploy_reached:
    deploy_lost:

    # Application VMs/LXCs enrolled in OS-package patching (the rolling
    # update-packages.yml play targets this group; base_managed and k3s have
    # their own plays there). Add a new app host here to patch it.
    app_servers:
      children:
        plex_servers:
        gitlab_servers:
        nextcloud_servers:
        immich_servers:
        immich_ml_servers:
