---
# Production inventory for weisssrv homelab
# All hosts are managed via SSH with key-based authentication

all:
  vars:
    ansible_user: eric
    ansible_become: true
    ansible_python_interpreter: /usr/bin/python3

  children:
    # Proxmox VE hypervisors (managed by Ansible)
    proxmox:
      hosts:
        pve-nas-01:
          ansible_host: 192.168.0.102
          proxmox_role: nas
          # Unsafe to auto-reboot unattended: the boot-time encryption-key load
          # is automated but depends on in-cluster 1Password Connect being
          # reachable, so a reboot can strand the NAS if Connect is down
          # (docs/32). The maintenance self-reboot path defers this host to an
          # operator; every other host defaults to true.
          proxmox_self_reboot_safe: false
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-laptop-01:
          ansible_host: 192.168.0.103
          proxmox_role: compute
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-opt-01:
          ansible_host: 192.168.0.104
          proxmox_role: compute
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-opt-02:
          ansible_host: 192.168.0.105
          proxmox_role: compute
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-opt-03:
          ansible_host: 192.168.0.106
          proxmox_role: compute
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-prec-01:
          ansible_host: 192.168.0.107
          proxmox_role: compute
          # The group ARC cap (zfs_arc_cap_max_bytes, group_vars/proxmox.yml)
          # protects VM 207's VFIO-pinned, non-swappable RAM from an ARC free to
          # grow into it (docs/43). Deliberately not re-declared here, so a
          # group-var edit cannot silently skip this host.
          # GPU passthrough host: vfio_passthrough blacklists nouveau and binds
          # vfio-pci to the whole TU116 (all four functions) so VM 207 can claim
          # it. Config-only — it stages grub/modprobe.d and flags
          # reboot-required, and NEVER reboots (operator does, docs/43).
          vfio_passthrough_enabled: true
          vfio_passthrough_pci_ids:
            - "10de:2182"
            - "10de:1aeb"
            - "10de:1aec"
            - "10de:1aed"
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients

    # DNS servers (LXC containers)
    dns:
      hosts:
        dns-01:
          ansible_host: 192.168.0.150
          vmid: 150
          # MUST match the HA home in affinity-dns-01 and the source_node of the
          # 150-* replication jobs (all.yml) — all three are one unit and move
          # together. pve-prec-01 is the only host with RAM headroom to spare;
          # dns-02 stays on pve-opt-03 so the pair remains split across hosts.
          proxmox_host: pve-prec-01
          # cluster.fw [ALIASES] entry, derived from this host's address.
          firewall_alias: dns-01
          firewall_alias_comment: Primary DNS server
          proxmox_resource_pool: infra-core
          firewall_ipsets:
            - core-cluster
          guest_security_groups:
            - sg-vm-admin
            - sg-dns
            - sg-metrics
        dns-02:
          ansible_host: 192.168.0.160
          vmid: 160
          proxmox_host: pve-opt-03
          firewall_alias: dns-02
          firewall_alias_comment: Secondary DNS server
          proxmox_resource_pool: infra-core
          firewall_ipsets:
            - core-cluster
          guest_security_groups:
            - sg-vm-admin
            - sg-dns
            - sg-metrics

    # Mail relay (LXC container)
    # Uses eric user like all other LXC containers; Postfix runs as root (normal)
    mail:
      hosts:
        smtp-relay:
          ansible_host: 192.168.0.151
          vmid: 151
          # For LXC provisioning (site.yml's provisioning play); matches the HA
          # home in affinity-smtp-relay. proxmox_lxc handles the container
          # having been HA-migrated elsewhere.
          proxmox_host: pve-opt-01
          proxmox_resource_pool: infra-core
          firewall_alias: smtp-relay
          firewall_alias_comment: SMTP relay server
          firewall_ipsets:
            - core-cluster
          guest_security_groups:
            - sg-vm-admin
            - sg-smtp-relay
            - sg-metrics
          # Default-deny egress: enforces the sg-smtp-relay OUT allowlist
          # (DNS 53/853, SMTP submission 587, apt 80/443, ICMP — already in
          # cluster.fw.j2). Proxmox guests honor policy_out (unlike hosts), so
          # this flips the guest from the default ACCEPT to DROP. Deploy the
          # cluster.fw first, then verify relay mail + apt still egress.
          guest_firewall_policy_out: "DROP"

    # Plex Media Server (LXC container on pve-nas-01)
    plex_servers:
      hosts:
        plex:
          ansible_host: 192.168.0.152
          vmid: 152
          proxmox_host: pve-nas-01  # For LXC provisioning via proxmox_lxc role
          proxmox_resource_pool: apps-public
          firewall_ipsets:
            - core-cluster
          guest_security_groups:
            - sg-vm-admin
            - sg-plex
            - sg-metrics

    # GitLab Server (VM on pve-nas-01)
    gitlab_servers:
      hosts:
        gitlab:
          ansible_host: 192.168.0.153
          vmid: 153
          proxmox_host: pve-nas-01
          proxmox_storage: ssd
          proxmox_resource_pool: apps-private
          proxmox_vm_cores: 6
          proxmox_vm_memory: 16384
          # Ballooning floor == proxmox_vm_memory, i.e. ballooning is off for
          # this guest: the memory above its working set is page cache, which is
          # what makes git operations fast, so it is held rather than reclaimed.
          # (Balloon reconcile is live via `qm set --balloon`, no guest restart.)
          proxmox_vm_balloon: 16384
          proxmox_vm_disk_size: 100G
          proxmox_vm_cpu_type: host
          # Additional disk for GitLab repository data (separate from root)
          # Zvol on ssd pool for I/O performance on git operations
          vm_additional_disks:
            - name: gitlab-repos
              size: 200G
              zvol: ssd/appdata/gitlab/repos
              mount_point: /mnt/gitlab-repos
              fstype: ext4
              # Stable SCSI slot — proxmox_vm pins disks by scsi_slot, never list
              # position. NEVER reuse or reorder a slot; it remaps a live zvol.
              scsi_slot: 1
              # Already backed up via ssd/appdata -> archive (raw ZFS); exclude
              # from vzdump so it isn't double-stored in tank/proxmox.
              vzdump_backup: false
          # onboot=0: the disks are on the ENCRYPTED ssd pool, so pve-guests
          # runs too early. Started by pve-start-encrypted-guests after the
          # unlock — vmid listed in zfs_encryption_guest_vmids
          # (host_vars/pve-nas-01.yml).
          proxmox_autostart_enabled: false
          proxmox_startup_order: 50
          proxmox_startup_delay: 30
          firewall_ipsets:
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-gitlab
            - sg-metrics

    # Nextcloud Server (VM on pve-nas-01)
    nextcloud_servers:
      hosts:
        nextcloud:
          ansible_host: 192.168.0.156
          vmid: 156
          proxmox_host: pve-nas-01
          proxmox_storage: ssd
          proxmox_resource_pool: apps-private
          proxmox_vm_cores: 4
          proxmox_vm_memory: 8192
          # Ballooning floor: Proxmox reclaims idle RAM down to this under host
          # pressure. Kept conservative for an upload spike rather than sized to
          # the idle working set.
          proxmox_vm_balloon: 3072
          proxmox_vm_disk_size: 40G
          proxmox_vm_cpu_type: host
          # Nextcloud state lives entirely on ZFS zvol passthrough disks (no
          # NFS — the VM is NAS-pinned). scsi_slots are unique PER VM: never
          # reuse or reorder one, it remaps a live zvol. Every zvol is a child of
          # an encrypted dataset already in the archive replication sources, so
          # it inherits encryption and backup and is excluded from vzdump.
          vm_additional_disks:
            - name: nextcloud-app
              size: 20G
              zvol: ssd/appdata/nextcloud/app
              mount_point: /mnt/nextcloud-app
              fstype: ext4
              scsi_slot: 1
              vzdump_backup: false
            - name: nextcloud-postgres
              size: 16G
              zvol: ssd/appdata/nextcloud/postgres
              mount_point: /mnt/nextcloud-postgres
              fstype: ext4
              scsi_slot: 2
              vzdump_backup: false
            - name: nextcloud-data
              size: 2T
              zvol: tank/nextcloud-data/disk
              mount_point: /mnt/nextcloud-data
              fstype: ext4
              scsi_slot: 3
              # Thin-provisioned: 2T ceiling, reserved lazily as users upload.
              sparse: true
              vzdump_backup: false
          # onboot=0: the disks are on ENCRYPTED pools, so pve-guests runs too
          # early. Started by pve-start-encrypted-guests after the unlock — vmid
          # listed in zfs_encryption_guest_vmids (host_vars/pve-nas-01.yml).
          proxmox_autostart_enabled: false
          proxmox_startup_order: 55
          proxmox_startup_delay: 30
          firewall_ipsets:
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-nextcloud
            - sg-metrics

    # Immich photo-management VM on pve-nas-01 (docker-compose stack)
    immich_servers:
      hosts:
        immich:
          ansible_host: 192.168.0.157
          vmid: 157
          proxmox_host: pve-nas-01
          proxmox_storage: ssd
          proxmox_resource_pool: apps-private
          # The in-VM ML container is the CPU FAILOVER endpoint (primary ML is
          # the GPU OpenVINO LXC immich-ml, .158 — see immich_ml_servers below).
          # Keep the cores: a GPU-LXC outage fails ML back onto this CPU.
          proxmox_vm_cores: 6
          proxmox_vm_memory: 12288
          # Ballooning floor kept high: ML jobs spike RAM on demand, so reclaim
          # only down to 6G (idle ML holds ~265M; models load lazily).
          proxmox_vm_balloon: 6144
          proxmox_vm_disk_size: 40G
          proxmox_vm_cpu_type: host                 # host CPU since node-pinned (no live migration)
          # App + postgres on the encrypted ssd pool; the photo library on a
          # SPARSE zvol under encrypted tank/immich-data. Both parents are in the
          # archive replication sources, so the zvols inherit encryption and
          # backup and are excluded from vzdump.
          vm_additional_disks:
            - name: immich-app
              size: 20G
              zvol: ssd/appdata/immich/app
              mount_point: /mnt/immich-app
              fstype: ext4
              # Stable SCSI slot — proxmox_vm pins disks by scsi_slot, never list
              # position. NEVER reuse or reorder a slot; it remaps a live zvol.
              scsi_slot: 1
              vzdump_backup: false
            - name: immich-postgres
              size: 24G
              zvol: ssd/appdata/immich/postgres
              mount_point: /mnt/immich-postgres
              fstype: ext4
              scsi_slot: 2
              vzdump_backup: false
            - name: immich-data
              size: 2T
              # SPARSE so the 2TB library grows on demand (thin). Child of the
              # pre-existing encrypted tank/immich-data dataset.
              sparse: true
              zvol: tank/immich-data/disk
              mount_point: /mnt/immich-data
              fstype: ext4
              scsi_slot: 3
              vzdump_backup: false
          # onboot=0: the disks are on ENCRYPTED pools, so pve-guests runs too
          # early. Started by pve-start-encrypted-guests after the unlock — vmid
          # listed in zfs_encryption_guest_vmids (host_vars/pve-nas-01.yml).
          proxmox_autostart_enabled: false
          proxmox_startup_order: 56
          proxmox_startup_delay: 30
          firewall_ipsets:
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-immich
            - sg-metrics

    # Immich GPU machine-learning LXC (docker compose, OpenVINO) on pve-nas-01
    immich_ml_servers:
      hosts:
        immich-ml:
          ansible_host: 192.168.0.158
          vmid: 158
          proxmox_host: pve-nas-01  # For LXC provisioning via proxmox_lxc role
          proxmox_resource_pool: apps-private
          firewall_ipsets:
            - core-cluster
          # sg-metrics intentionally omitted: nothing here is scraped. The ML
          # container exposes no /metrics, and LXC guests run no
          # node_exporter_host (host metrics ride the Proxmox host's exporter).
          # plex carries sg-metrics only because Prometheus scrapes plex itself
          # on 32400; there is no equivalent here. alloy_host pushes logs
          # outbound, so log shipping needs no inbound rule either.
          guest_security_groups:
            - sg-vm-admin
            - sg-immich-ml

    # Firewall-only hosts: ansible_connection: local prevents SSH (HAOS cannot
    # run Ansible), and proxmox_firewall delegates the .fw writes to a Proxmox
    # host. gather_facts MUST be false for this group — local facts would be the
    # operator's workstation.
    services:
      # ansible_become: false lives in group_vars/services.yml (precedence — see
      # that file), never here.
      hosts:
        home:
          ansible_host: 192.168.0.154
          ansible_connection: local
          vmid: 154
          firewall_ipsets:
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-haos
            - sg-metrics

    # Windows 11 VM (provisioned by proxmox_vm, then installed INTERACTIVELY —
    # docs/39). Its own group rather than `services` because it IS
    # Ansible-provisioned and needs the inherited ansible_become: true so the
    # qm/pveum/.fw writes escalate on the DELEGATE; there is no SSH into the
    # guest, and the non-delegated tasks never escalate on the controller.
    # gather_facts MUST stay false in the windows plays (local facts would be
    # the operator's workstation).
    windows_vms:
      hosts:
        windows:
          ansible_host: 192.168.0.155
          ansible_connection: local
          vmid: 155
          proxmox_host: pve-nas-01
          proxmox_storage: ssd            # encrypted ssd pool (root disk -> ssd)
          proxmox_resource_pool: apps-private
          proxmox_vm_guest_type: windows          # proxmox_vm builds the OVMF/TPM/q35 shell
          proxmox_vm_cores: 8
          # 8 GiB, not 16: the desktop is idle RDP duty, ballooning already
          # floors it at 4 GiB, and the halved MAX is what shrinks the NAS's
          # worst-case commit during the backup window (ballooning is
          # best-effort; the cap is the guarantee) — docs/06 § NAS memory
          # management.
          proxmox_vm_memory: 8192
          # Ballooning floor: Windows idles holding memory it is not using
          # (VirtIO Balloon driver + service installed in-guest). The guest
          # auto-starts after every NAS unlock (see the onboot note below), so
          # this floor — not "off" — is the standing footprint until an operator
          # shuts it down.
          proxmox_vm_balloon: 4096
          proxmox_vm_disk_size: 250G
          proxmox_vm_cpu_type: host               # NAS-pinned, no live migration
          # Download MANUALLY from Microsoft to the tank-proxmox ISO store and
          # name it to match this exactly — it cannot be redistributed, so no
          # role fetches it. docs/39-windows-vm.md.
          proxmox_vm_install_iso: "Win11_25H2_English_x64_v2.iso"
          # proxmox_vm_virtio_iso defaults to virtio-win-<proxmox_vm_virtio_win_version>.iso
          # and is downloaded + checksum-verified by proxmox_vm (all.yml pins version).
          # onboot=0 AND auto-started: not a contradiction. The disks are on the
          # ENCRYPTED ssd pool, so pve-start-encrypted-guests starts this guest
          # after the unlock (last in zfs_encryption_guest_vmids). onboot=1 would
          # fail against a locked pool — to stop Windows auto-starting, remove it
          # from that list instead. docs/32, 39.
          proxmox_autostart_enabled: false
          proxmox_startup_order: 60       # after gitlab (50)
          proxmox_startup_delay: 30
          firewall_ipsets:
            - core-cluster
          # RDP-only (3389 from admin_lan + admin_ts); no sg-vm-admin/sg-metrics
          # (no SSH admin, no in-guest exporter) — keeps 155.fw identical to the
          # firewall-only placeholder this VM replaces.
          guest_security_groups:
            - sg-windows

    # K3s cluster nodes (VMs - provisioned by Ansible)
    k3s_servers:
      vars:
        k3s_role: server
        # Server nodes get control-plane label and taint to reserve for kube-system
        k3s_labels:
          esweiss.com/control-plane: "true"
        k3s_taints:
          - key: node-role.kubernetes.io/control-plane
            value: "true"
            effect: NoSchedule
      hosts:
        k3s-srv-nas-01:
          ansible_host: 192.168.0.222
          vmid: 222
          k3s_is_first_server: true
          proxmox_host: pve-nas-01
          proxmox_storage: local-lvm
          proxmox_resource_pool: platform
          proxmox_vm_cpu_type: host  # Pinned to this host, no live migration — host CPU type is safe
          proxmox_vm_cores: 2
          # Margin rather than need, deliberately: etcd is latency-sensitive and
          # the one guest whose degradation takes the whole cluster with it, and
          # this server shares the NAS host with everything else. Do NOT size
          # this to measured usage.
          proxmox_vm_memory: 8192
          proxmox_vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 30
          proxmox_startup_delay: 10
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-metrics
        # Server 2 (on pve-laptop-01) — quorum is 3/3.
        k3s-srv-laptop-01:
          ansible_host: 192.168.0.223
          vmid: 223
          k3s_is_first_server: false
          proxmox_host: pve-laptop-01
          proxmox_storage: local-ssd
          proxmox_resource_pool: platform
          proxmox_vm_cpu_type: host
          proxmox_vm_cores: 2
          # Budgeted, not defaulted: pve-laptop-01 has 15 GiB and carries this
          # guest plus k3s-agt-laptop-01, and was paging guest memory to swap.
          # The server taint reserves this node for kube-system, so it carries
          # the smaller standing set — of the two guests on that host, this is
          # the one to grow back LAST.
          proxmox_vm_memory: 5120
          proxmox_vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 30
          proxmox_startup_delay: 10
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-metrics
        # Server 3 (on pve-prec-01)
        k3s-srv-prec-01:
          ansible_host: 192.168.0.227
          vmid: 227
          k3s_is_first_server: false
          proxmox_host: pve-prec-01
          proxmox_storage: local-ssd
          proxmox_resource_pool: platform
          proxmox_vm_cpu_type: host
          proxmox_vm_cores: 2
          proxmox_vm_memory: 6144
          proxmox_vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 30
          proxmox_startup_delay: 10
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-metrics

    k3s_agents:
      vars:
        k3s_role: agent
      hosts:
        # NAS workloads agent (on pve-nas-01)
        k3s-agt-nas-01:
          ansible_host: 192.168.0.202
          vmid: 202
          proxmox_host: pve-nas-01
          proxmox_storage: local-lvm
          proxmox_resource_pool: platform
          proxmox_vm_cpu_type: host  # Pinned to this host, no live migration — host CPU type is safe
          proxmox_vm_cores: 6
          # Sized for the heavy in-cluster state (prometheus, loki, the
          # authentik/mealie postgres zvols) PLUS burst room for CI job pods;
          # tighter and a landing pipeline OOM-kills the observability stack.
          # Cores are deliberately NOT raised to match — the host is oversubscribed
          # on vCPU, and the PreferNoSchedule taint plus the low core count is
          # what keeps this node the last choice for jobs.
          proxmox_vm_memory: 24576
          proxmox_vm_disk_size: 64G
          # Persistent app-data zvols (survive VM recreation), already backed up
          # via ssd/appdata -> archive, so vzdump_backup: false keeps them out of
          # the VM image backup. proxmox_vm attaches by scsi_slot, never list
          # position: NEVER reuse or reorder a slot — it rebinds a data-bearing
          # zvol onto the wrong device.
          vm_additional_disks:
            - name: postgres-data
              size: 10G
              zvol: ssd/appdata/authentik/postgres
              mount_point: /mnt/postgres-data
              fstype: ext4
              scsi_slot: 1
              vzdump_backup: false
            - name: mealie-postgres-data
              size: 32G
              zvol: ssd/appdata/mealie/postgres
              mount_point: /mnt/mealie-postgres-data
              fstype: ext4
              scsi_slot: 2
              vzdump_backup: false
            - name: prometheus-data
              size: 150G
              zvol: ssd/appdata/prometheus/data
              mount_point: /mnt/prometheus-data
              fstype: ext4
              scsi_slot: 3
              vzdump_backup: false
            - name: loki-data
              size: 75G
              zvol: ssd/appdata/loki/data
              mount_point: /mnt/loki-data
              fstype: ext4
              scsi_slot: 4
              vzdump_backup: false
          # onboot=0: the 4 data zvols live on the ENCRYPTED ssd pool, so qm
          # start fails until it unlocks — the scsi0 root is on local-lvm, but a
          # guest with ANY missing configured disk won't start. Started by
          # pve-start-encrypted-guests after the unlock (docs/32).
          proxmox_autostart_enabled: false
          proxmox_startup_order: 40
          proxmox_startup_delay: 10
          k3s_labels:
            esweiss.com/nas: "true"
            esweiss.com/general: "true"
            esweiss.com/cpu: "modern"
          k3s_taints:
            - key: esweiss.com/nas
              value: "true"
              effect: PreferNoSchedule
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-metrics
        # Ingress + general agent (on pve-laptop-01)
        k3s-agt-laptop-01:
          ansible_host: 192.168.0.203
          vmid: 203
          proxmox_host: pve-laptop-01
          proxmox_storage: local-ssd
          proxmox_resource_pool: platform
          proxmox_vm_cpu_type: host
          proxmox_vm_cores: 4
          # Budgeted, not defaulted: pve-laptop-01 has 15 GiB and will not get
          # more. Sized for burst — this is the ingress agent (Traefik) and a CI
          # landing zone. Raise to 6144 first if CI pods sit Pending here or
          # Traefik gets tight.
          proxmox_vm_memory: 5120
          proxmox_vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 40
          proxmox_startup_delay: 10
          k3s_labels:
            esweiss.com/general: "true"
            esweiss.com/ingress: "true"
            esweiss.com/cpu: "modern"
          k3s_taints:
            - key: esweiss.com/ingress
              value: "true"
              effect: PreferNoSchedule
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-k3s-ingress-int
            - sg-k3s-ingress-pub
            - sg-metrics
        # Ingress + general agent (on pve-opt-01)
        # NOTE: All OptiPlex nodes host Core 2 Quad Q9650 CPUs (Penryn, 2008) which
        # lack POPCNT (SSE4.2). Some modern binaries (e.g., GitLab secret-detection
        # gitleaks) crash with SIGILL on these CPUs. Nodes are labeled with
        # esweiss.com/cpu=legacy (OptiPlex) or esweiss.com/cpu=modern (others).
        # CI jobs that require modern instructions set:
        #   KUBERNETES_NODE_SELECTOR_CPU: esweiss.com/cpu=modern
        k3s-agt-opt-01:
          ansible_host: 192.168.0.204
          vmid: 204
          proxmox_host: pve-opt-01
          proxmox_storage: local-ssd
          proxmox_resource_pool: platform
          proxmox_vm_cpu_type: host
          proxmox_vm_cores: 3
          proxmox_vm_memory: 6144
          proxmox_vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 40
          proxmox_startup_delay: 10
          k3s_labels:
            esweiss.com/general: "true"
            esweiss.com/ingress: "true"
            esweiss.com/cpu: "legacy"
          k3s_taints:
            - key: esweiss.com/ingress
              value: "true"
              effect: PreferNoSchedule
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-k3s-ingress-int
            - sg-k3s-ingress-pub
            - sg-metrics
        # Ingress + general agent (on pve-opt-02)
        k3s-agt-opt-02:
          ansible_host: 192.168.0.205
          vmid: 205
          proxmox_host: pve-opt-02
          proxmox_storage: local-ssd
          proxmox_resource_pool: platform
          proxmox_vm_cpu_type: host
          proxmox_vm_cores: 3
          proxmox_vm_memory: 6144
          proxmox_vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 40
          proxmox_startup_delay: 10
          k3s_labels:
            esweiss.com/general: "true"
            esweiss.com/ingress: "true"
            esweiss.com/cpu: "legacy"
          k3s_taints:
            - key: esweiss.com/ingress
              value: "true"
              effect: PreferNoSchedule
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-k3s-ingress-int
            - sg-k3s-ingress-pub
            - sg-metrics
        # Ingress + general agent (on pve-opt-03)
        k3s-agt-opt-03:
          ansible_host: 192.168.0.206
          vmid: 206
          proxmox_host: pve-opt-03
          proxmox_storage: local-ssd
          proxmox_resource_pool: platform
          proxmox_vm_cpu_type: host  # K3s nodes pinned to specific hosts, no migration
          proxmox_vm_cores: 3
          proxmox_vm_memory: 6144
          proxmox_vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 40
          proxmox_startup_delay: 10
          k3s_labels:
            esweiss.com/general: "true"
            esweiss.com/ingress: "true"
            esweiss.com/cpu: "legacy"
          k3s_taints:
            - key: esweiss.com/ingress
              value: "true"
              effect: PreferNoSchedule
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-k3s-ingress-int
            - sg-k3s-ingress-pub
            - sg-metrics
        # General + compute agent (on pve-prec-01)
        k3s-agt-prec-01:
          ansible_host: 192.168.0.207
          vmid: 207
          proxmox_host: pve-prec-01
          proxmox_storage: local-ssd
          proxmox_resource_pool: platform
          proxmox_vm_cpu_type: host
          # This node is the fleet's modern-CPU allocatable headroom — the
          # backfill target for cpu=modern workloads the other modern agents and
          # the kept-clear NAS agent cannot take. It is a HARD reservation: k3s
          # agents are non-ballooned (fixed memory = scheduler-stable
          # allocatable) and a VFIO guest's RAM is host-pinned/non-swappable.
          # proxmox_vm applies proxmox_vm_memory at qm-create ONLY, so changing it
          # on the live VM is a manual `qm set` + drain/reboot (docs/43).
          proxmox_vm_cores: 6
          proxmox_vm_memory: 30720
          proxmox_vm_disk_size: 64G
          # Whole GTX 1660 Ti (TU116) for the Hindsight llama.cpp CUDA sidecar.
          # Bare `0000:01:00` (no function suffix) hands all four functions to
          # the guest. KEEP i440fx + SeaBIOS: q35+OVMF would risk a NIC rename
          # against kube_vip_interface: eth0 (docs/43 §Machine type). Applied at
          # qm-create ONLY — a live VM needs a manual `qm set --hostpci0`.
          proxmox_vm_hostpci:
            - "0000:01:00"
          # Install the NVIDIA driver + container-toolkit on this agent (k3s role
          # tasks/gpu.yml) so k3s auto-detects the nvidia runtime and the
          # device-plugin advertises nvidia.com/gpu here.
          k3s_gpu_node: true
          proxmox_autostart_enabled: true
          proxmox_startup_order: 40
          proxmox_startup_delay: 10
          k3s_labels:
            esweiss.com/general: "true"
            esweiss.com/compute: "true"
            esweiss.com/cpu: "modern"
            # Modern-CPU ingress candidate so Traefik + the MetalLB L2 speaker are
            # not 100% bound to the legacy-CPU opt nodes when pve-laptop-01 is out.
            # Label only (no ingress taint) — prec-01 stays a compute node too.
            esweiss.com/ingress: "true"
            # GPU node marker. The nvidia-device-plugin DaemonSet + dcgm-exporter
            # nodeSelect on this; Hindsight's llama container requests
            # nvidia.com/gpu, which only this node advertises.
            esweiss.com/gpu: "nvidia"
          k3s_taints:
            - key: esweiss.com/compute
              value: "true"
              effect: PreferNoSchedule
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            # prec-01 carries esweiss.com/ingress=true (modern-CPU ingress fallback,
            # see k3s_labels above) so Traefik schedules here and the MetalLB L2
            # speaker can announce the .100/.101 VIPs from this node. It therefore
            # needs the ingress security groups (80/443) like the opt-* ingress
            # nodes — without them the VIP black-holes at this VM's guest firewall
            # whenever MetalLB elects prec-01 as the announcer.
            - sg-k3s-ingress-int
            - sg-k3s-ingress-pub
            - sg-metrics

    # Aggregate groups for convenience
    lxc_containers:
      children:
        dns:
        mail:
        plex_servers:
        immich_ml_servers:

    k3s:
      children:
        k3s_servers:
        k3s_agents:

    base_managed:
      children:
        proxmox:
        dns:
        mail:

    # Runtime ledger groups, populated by playbooks/_reachability-probe.yml
    # (group_by) and consumed by the `:!deploy_skipped` play patterns and
    # _reachability-gate.yml. Declared empty here only so those patterns do not
    # emit "Could not match supplied host pattern" on every clean run — never
    # add a host by hand.
    deploy_skipped:
    deploy_reached:
    deploy_lost:

    # Application VMs/LXCs enrolled in OS-package patching (the rolling
    # update-packages.yml play targets this group; base_managed + k3s have their
    # own plays there). Mixes VMs (gitlab, nextcloud, immich) and LXCs (plex,
    # immich-ml) — apt "safe" upgrade + reboot-if-needed handles both, and an LXC
    # reboot restarts only the container, never its Proxmox host (so rebooting
    # immich-ml does not touch pve-nas-01). Add a new app host here to patch it.
    app_servers:
      children:
        plex_servers:
        gitlab_servers:
        nextcloud_servers:
        immich_servers:
        immich_ml_servers:
