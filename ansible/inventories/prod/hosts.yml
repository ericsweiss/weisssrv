---
# Production inventory for weisssrv homelab
# All hosts are managed via SSH with key-based authentication

all:
  vars:
    ansible_user: eric
    ansible_become: true
    ansible_python_interpreter: /usr/bin/python3

  children:
    # Proxmox VE hypervisors (managed by Ansible)
    proxmox:
      hosts:
        pve-nas-01:
          ansible_host: 192.168.0.102
          proxmox_role: nas
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-opt-03:
          ansible_host: 192.168.0.106
          proxmox_role: compute
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients

    # Proxmox VE hosts not yet managed by Ansible (firewall only)
    proxmox_unmanaged:
      hosts:
        pve-laptop-01:
          ansible_host: 192.168.0.103
          ansible_connection: local
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-opt-01:
          ansible_host: 192.168.0.104
          ansible_connection: local
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-opt-02:
          ansible_host: 192.168.0.105
          ansible_connection: local
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-prec-01:
          ansible_host: 192.168.0.107
          ansible_connection: local
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients

    # DNS servers (LXC containers)
    dns:
      vars:
        ansible_user: eric
      hosts:
        dns-01:
          ansible_host: 192.168.0.150
          vmid: 150
          dns_role: primary
          acme_enabled: true
          proxmox_resource_pool: infra-core
          firewall_ipsets:
            - core-cluster
          guest_security_groups:
            - sg-vm-admin
            - sg-dns
        dns-02:
          ansible_host: 192.168.0.160
          vmid: 160
          dns_role: replica
          acme_enabled: false
          proxmox_resource_pool: infra-core
          firewall_ipsets:
            - core-cluster
          guest_security_groups:
            - sg-vm-admin
            - sg-dns

    # Mail relay (LXC container)
    # Uses eric user like all other LXC containers; Postfix runs as root (normal)
    mail:
      vars:
        ansible_user: eric
      hosts:
        smtp-relay:
          ansible_host: 192.168.0.151
          vmid: 151
          proxmox_resource_pool: infra-core
          firewall_ipsets:
            - core-cluster
          guest_security_groups:
            - sg-vm-admin
            - sg-smtp-relay

    # Plex Media Server (LXC container on pve-nas-01)
    # Note: proxmox_host is only needed for LXC provisioning (initial creation)
    # Firewall deployment works cluster-wide and doesn't need proxmox_host
    plex_servers:
      vars:
        ansible_user: eric
      hosts:
        plex:
          ansible_host: 192.168.0.152
          vmid: 152
          proxmox_host: pve-nas-01  # For LXC provisioning via proxmox_lxc role
          proxmox_resource_pool: apps-public
          firewall_ipsets:
            - core-cluster
          guest_security_groups:
            - sg-vm-admin
            - sg-plex

    # Services and VMs (not managed by Ansible, firewall only)
    services:
      hosts:
        gitlab:
          ansible_host: 192.168.0.153
          ansible_connection: local
          firewall_ipsets:
            - core-cluster
        home:
          ansible_host: 192.168.0.154
          ansible_connection: local
          firewall_ipsets:
            - core-cluster
            - nfs_clients
        windows:
          ansible_host: 192.168.0.155
          ansible_connection: local
          firewall_ipsets:
            - core-cluster

    # K3s cluster nodes (VMs - provisioned by Ansible)
    k3s_servers:
      vars:
        ansible_user: eric
        k3s_role: server
        # Server nodes get control-plane label and taint to reserve for kube-system
        k3s_labels:
          esweiss.com/control-plane: "true"
        k3s_taints:
          - key: node-role.kubernetes.io/control-plane
            value: "true"
            effect: NoSchedule
      hosts:
        k3s-srv-nas-01:
          ansible_host: 192.168.0.222
          vmid: 222
          k3s_is_first_server: true
          proxmox_host: pve-nas-01
          proxmox_storage: local-lvm
          proxmox_resource_pool: platform
          vm_cpu_type: host  # NAS-only: expose AVX/AVX2 from 12th Gen Intel
          vm_cores: 2
          vm_memory: 4096
          vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 30
          proxmox_startup_delay: 10
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
        # Future HA expansion - uncomment when ready
        # k3s-srv-laptop-01:
        #   ansible_host: 192.168.0.223
        #   vmid: 223
        #   ansible_connection: local
        #   k3s_is_first_server: false
        #   proxmox_host: pve-laptop-01
        #   proxmox_storage: local-ssd
        #   firewall_ipsets:
        #     - k3s_nodes
        #     - core-cluster
        #     - nfs_clients
        # k3s-srv-prec-01:
        #   ansible_host: 192.168.0.227
        #   vmid: 227
        #   ansible_connection: local
        #   k3s_is_first_server: false
        #   proxmox_host: pve-prec-01
        #   firewall_ipsets:
        #     - k3s_nodes
        #     - core-cluster
        #     - nfs_clients
    k3s_agents:
      vars:
        ansible_user: eric
        k3s_role: agent
      hosts:
        # Future expansion - uncomment when ready
        # k3s-agt-laptop-01:
        #   ansible_host: 192.168.0.203
        #   vmid: 203
        #   proxmox_host: pve-laptop-01
        #   proxmox_storage: local-ssd
        #   vm_cores: 4
        #   vm_memory: 8192
        #   vm_disk_size: 64G
        #   k3s_labels:
        #     esweiss.com/general: "true"
        #     esweiss.com/ingress: "true"
        #   k3s_taints:
        #     - key: esweiss.com/ingress
        #       value: "true"
        #       effect: PreferNoSchedule
        #   firewall_ipsets:
        #     - k3s_nodes
        #     - core-cluster
        #     - nfs_clients
        #   guest_security_groups:
        #     - sg-vm-admin
        #     - sg-k3s-core
        #     - sg-k3s-ingress-int
        #     - sg-k3s-ingress-pub
        # k3s-agt-opt-01:
        #   ansible_host: 192.168.0.204
        #   vmid: 204
        #   proxmox_host: pve-opt-01
        #   proxmox_storage: local-ssd
        #   vm_cores: 3
        #   vm_memory: 6144
        #   vm_disk_size: 64G
        #   k3s_labels:
        #     esweiss.com/general: "true"
        #     esweiss.com/ingress: "true"
        #   firewall_ipsets:
        #     - k3s_nodes
        #     - core-cluster
        #     - nfs_clients
        # k3s-agt-opt-02:
        #   ansible_host: 192.168.0.205
        #   vmid: 205
        #   proxmox_host: pve-opt-02
        #   proxmox_storage: local-ssd
        #   vm_cores: 3
        #   vm_memory: 6144
        #   vm_disk_size: 64G
        #   k3s_labels:
        #     esweiss.com/general: "true"
        #     esweiss.com/ingress: "true"
        #   firewall_ipsets:
        #     - k3s_nodes
        #     - core-cluster
        #     - nfs_clients
        # k3s-agt-prec-01:
        #   ansible_host: 192.168.0.207
        #   vmid: 207
        #   proxmox_host: pve-prec-01
        #   # Higher specs for compute workloads (exact values TBD based on hardware)
        #   vm_cores: 6
        #   vm_memory: 16384
        #   vm_disk_size: 64G
        #   k3s_labels:
        #     esweiss.com/general: "true"
        #     esweiss.com/compute: "true"
        #   k3s_taints:
        #     - key: esweiss.com/compute
        #       value: "true"
        #       effect: PreferNoSchedule
        #   firewall_ipsets:
        #     - k3s_nodes
        #     - core-cluster
        #     - nfs_clients
        #   guest_security_groups:
        #     - sg-vm-admin
        #     - sg-k3s-core
        k3s-agt-nas-01:
          ansible_host: 192.168.0.202
          vmid: 202
          proxmox_host: pve-nas-01
          proxmox_storage: local-lvm
          proxmox_resource_pool: platform
          vm_cpu_type: host  # NAS-only: expose AVX/AVX2 from 12th Gen Intel
          vm_cores: 4
          vm_memory: 8192
          vm_disk_size: 64G
          # Additional disks for persistent PostgreSQL data (survives VM recreation)
          vm_additional_disks:
            - name: postgres-data
              size: 10G
              zvol: ssd/appdata/authentik/postgres
              mount_point: /mnt/postgres-data
              fstype: ext4
            - name: mealie-postgres-data
              size: 32G
              zvol: ssd/appdata/mealie/postgres
              mount_point: /mnt/mealie-postgres-data
              fstype: ext4
          proxmox_autostart_enabled: true
          proxmox_startup_order: 40
          proxmox_startup_delay: 10
          k3s_labels:
            esweiss.com/nas: "true"
            esweiss.com/general: "true"
          k3s_taints:
            - key: esweiss.com/nas
              value: "true"
              effect: PreferNoSchedule
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
        k3s-agt-opt-03:
          ansible_host: 192.168.0.206
          vmid: 206
          proxmox_host: pve-opt-03
          proxmox_storage: local-lvm
          proxmox_resource_pool: platform
          vm_cpu_type: host  # K3s nodes pinned to specific hosts, no migration
          vm_cores: 3
          vm_memory: 6144
          vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 40
          proxmox_startup_delay: 10
          k3s_labels:
            esweiss.com/general: "true"
            esweiss.com/ingress: "true"
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-k3s-ingress-int
            - sg-k3s-ingress-pub

    # Aggregate groups for convenience
    lxc_containers:
      children:
        dns:
        mail:
        plex_servers:

    k3s:
      children:
        k3s_servers:
        k3s_agents:

    base_managed:
      children:
        proxmox:
        dns:
        mail:
