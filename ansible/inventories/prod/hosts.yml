        # Ingress + general agent (on pve-opt-03)
        k3s-agt-opt-03:
          ansible_host: 10.0.10.206
          vmid: 206
          proxmox_host: pve-opt-03
          proxmox_storage: local-ssd
          proxmox_resource_pool: platform
          proxmox_vm_cpu_type: host  # K3s nodes pinned to specific hosts, no migration
          proxmox_vm_cores: 3
          proxmox_vm_memory: 6144
          proxmox_vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 40
          proxmox_startup_delay: 10
          k3s_labels:
            esweiss.com/general: "true"
            esweiss.com/ingress: "true"
            esweiss.com/cpu: "legacy"
          k3s_taints:
            - key: esweiss.com/ingress
              value: "true"
              effect: PreferNoSchedule
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-k3s-ingress-int
            - sg-k3s-ingress-pub
            - sg-syslog-vip
            - sg-k3s-gitssh
            - sg-metrics
        # General + compute agent (on pve-prec-01)
        k3s-agt-prec-01:
          ansible_host: 10.0.10.207
          vmid: 207
          proxmox_host: pve-prec-01
          proxmox_storage: local-ssd
          proxmox_resource_pool: platform
          proxmox_vm_cpu_type: host
          # A hard reservation: k3s agents are non-ballooned and a VFIO guest's RAM is host-pinned.
          # proxmox_vm reconciles memory with `qm set`, landing at the guest's next start; a shrink
          # needs proxmox_vm_memory_shrink_ok. Cores, disk and hostpci are create-time only (docs/43).
          proxmox_vm_cores: 6
          proxmox_vm_memory: 30720
          # 128G, not the fleet's 64G: this node also carries the NVIDIA driver
          # image set (llama.cpp CUDA, DCGM, device plugin), which does not fit 64G
          # under the 70/50 image-gc thresholds in group_vars/k3s.yml.
          proxmox_vm_disk_size: 128G
          # Whole GTX 1660 Ti (TU116) for the Hindsight llama.cpp CUDA sidecar;
          # bare `0000:01:00` hands over all four functions. KEEP i440fx+SeaBIOS:
          # q35+OVMF risks a NIC rename against kube_vip_interface eth0 (docs/43).
          proxmox_vm_hostpci:
            - "0000:01:00"
          # Install the NVIDIA driver + container-toolkit on this agent (k3s role
          # tasks/gpu.yml) so k3s auto-detects the nvidia runtime and the
          # device-plugin advertises nvidia.com/gpu here.
          k3s_gpu_node: true
          proxmox_autostart_enabled: true
          proxmox_startup_order: 40
          proxmox_startup_delay: 10
          k3s_labels:
            esweiss.com/general: "true"
            esweiss.com/compute: "true"
            esweiss.com/cpu: "modern"
            # Modern-CPU ingress candidate so Traefik + the MetalLB L2 speaker are
            # not 100% bound to the legacy-CPU opt nodes when pve-laptop-01 is out.
            # Label only (no ingress taint) — prec-01 stays a compute node too.
            esweiss.com/ingress: "true"
            # GPU node marker. The nvidia-device-plugin DaemonSet + dcgm-exporter
            # nodeSelect on this; Hindsight's llama container requests
            # nvidia.com/gpu, which only this node advertises.
            esweiss.com/gpu: "nvidia"
          k3s_taints:
            - key: esweiss.com/compute
              value: "true"
              effect: PreferNoSchedule
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            # prec-01 carries esweiss.com/ingress=true, so Traefik schedules
            # here and MetalLB can announce .100/.101 from it - without the
            # ingress groups the VIP black-holes at this guest's firewall.
            - sg-k3s-ingress-int
            - sg-k3s-ingress-pub
            - sg-syslog-vip
            - sg-k3s-gitssh
            - sg-metrics

