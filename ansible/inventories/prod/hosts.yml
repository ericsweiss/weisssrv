---
# Production inventory for weisssrv homelab
# All hosts are managed via SSH with key-based authentication

all:
  vars:
    ansible_user: eric
    ansible_become: true
    ansible_python_interpreter: /usr/bin/python3

  children:
    # Proxmox VE hypervisors (managed by Ansible)
    proxmox:
      hosts:
        pve-nas-01:
          ansible_host: 192.168.0.102
          proxmox_role: nas
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-opt-03:
          ansible_host: 192.168.0.106
          proxmox_role: compute
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients

    # Proxmox VE hosts not yet managed by Ansible (firewall only)
    proxmox_unmanaged:
      hosts:
        pve-laptop-01:
          ansible_host: 192.168.0.103
          ansible_connection: local
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-opt-01:
          ansible_host: 192.168.0.104
          ansible_connection: local
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-opt-02:
          ansible_host: 192.168.0.105
          ansible_connection: local
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients

    # DNS servers (LXC containers)
    dns:
      hosts:
        dns-01:
          ansible_host: 192.168.0.150
          ansible_user: root
          dns_role: primary
          acme_enabled: true
          firewall_ipsets:
            - core-cluster
        dns-02:
          ansible_host: 192.168.0.160
          ansible_user: root
          dns_role: replica
          acme_enabled: false
          firewall_ipsets:
            - core-cluster

    # Mail relay (LXC container)
    mail:
      hosts:
        smtp-relay:
          ansible_host: 192.168.0.151
          ansible_user: root
          firewall_ipsets:
            - core-cluster

    # Services and VMs (not managed by Ansible, firewall only)
    services:
      hosts:
        plex:
          ansible_host: 192.168.0.152
          ansible_connection: local
          firewall_ipsets:
            - core-cluster
        gitlab:
          ansible_host: 192.168.0.153
          ansible_connection: local
          firewall_ipsets:
            - core-cluster
        home:
          ansible_host: 192.168.0.154
          ansible_connection: local
          firewall_ipsets:
            - core-cluster
            - nfs_clients
        windows:
          ansible_host: 192.168.0.155
          ansible_connection: local
          firewall_ipsets:
            - core-cluster

    # K3s cluster nodes (VMs - pre-allocated in firewall)
    k3s_servers:
      hosts:
        k3s-nas-server-01:
          ansible_host: 192.168.0.202
          ansible_connection: local
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
        k3s-laptop-01:
          ansible_host: 192.168.0.203
          ansible_connection: local
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
        k3s-opt-01:
          ansible_host: 192.168.0.204
          ansible_connection: local
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
        k3s-opt-02:
          ansible_host: 192.168.0.205
          ansible_connection: local
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
        k3s-opt-03:
          ansible_host: 192.168.0.206
          ansible_connection: local
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients

    k3s_workers:
      hosts:
        k3s-nas-worker-01:
          ansible_host: 192.168.0.207
          ansible_connection: local
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients

    # Aggregate groups for convenience
    lxc_containers:
      children:
        dns:
        mail:

    base_managed:
      children:
        proxmox:
        dns:
        mail:
