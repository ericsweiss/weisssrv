---
# Production inventory for weisssrv homelab
# All hosts are managed via SSH with key-based authentication

all:
  vars:
    ansible_user: eric
    ansible_become: true
    ansible_python_interpreter: /usr/bin/python3

  children:
    # Proxmox VE hypervisors (managed by Ansible)
    proxmox:
      hosts:
        pve-nas-01:
          ansible_host: 10.0.10.102
          proxmox_role: nas
          # Unsafe to auto-reboot unattended: the boot-time encryption-key load
          # depends on in-cluster 1Password Connect, so a reboot can strand the
          # NAS if Connect is down (docs/32). Every other host defaults to true.
          proxmox_self_reboot_safe: false
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-laptop-01:
          ansible_host: 10.0.10.103
          proxmox_role: compute
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-opt-01:
          ansible_host: 10.0.10.104
          proxmox_role: compute
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-opt-02:
          ansible_host: 10.0.10.105
          proxmox_role: compute
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-opt-03:
          ansible_host: 10.0.10.106
          proxmox_role: compute
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients
        pve-prec-01:
          ansible_host: 10.0.10.107
          proxmox_role: compute
          # The group ARC cap (group_vars/proxmox.yml) protects VM 207's
          # VFIO-pinned, non-swappable RAM. vfio_passthrough stages grub and
          # modprobe.d and flags reboot-required; the operator reboots (docs/43).
          vfio_passthrough_enabled: true
          vfio_passthrough_pci_ids:
            - "10de:2182"
            - "10de:1aeb"
            - "10de:1aec"
            - "10de:1aed"
          firewall_ipsets:
            - pve_hosts
            - core-cluster
            - nfs_clients

      # Role and hardware-trait child groups. Being children of proxmox, their
      # group_vars outrank group_vars/proxmox.yml. The role groups are what the
      # plays address, so no playbook spells a hypervisor hostname.
      children:
        nas:
          hosts:
            pve-nas-01:
        compute:
          hosts:
            pve-laptop-01:
            pve-opt-01:
            pve-opt-02:
            pve-opt-03:
            pve-prec-01:
        e1000e_hosts:
          hosts:
            pve-opt-01:
            pve-opt-02:
            pve-opt-03:
            pve-prec-01:
        small_ram_hosts:
          hosts:
            pve-opt-01:
            pve-opt-02:
            pve-opt-03:
            pve-laptop-01:
        bonded_hosts:
          hosts:
            pve-opt-01:
            pve-opt-02:
            pve-opt-03:

    # DNS servers (LXC containers)
    dns:
      hosts:
        dns-01:
          ansible_host: 10.0.10.150
          vmid: 150
          # HA triad: this value, the affinity-dns-01 home node and the 150-*
          # replication source_node move together - asserted by
          # scripts/test_inventory_invariants.py.
          proxmox_host: pve-prec-01
          # cluster.fw [ALIASES] entry, derived from this host's address.
          firewall_alias: dns-01
          firewall_alias_comment: Primary DNS server
          proxmox_resource_pool: infra-core
          firewall_ipsets:
            - core-cluster
          guest_security_groups:
            - sg-vm-admin
            - sg-dns
            - sg-metrics
        dns-02:
          ansible_host: 10.0.10.160
          vmid: 160
          proxmox_host: pve-opt-03
          firewall_alias: dns-02
          firewall_alias_comment: Secondary DNS server
          proxmox_resource_pool: infra-core
          firewall_ipsets:
            - core-cluster
          guest_security_groups:
            - sg-vm-admin
            - sg-dns
            - sg-metrics

      # The certificate authority and the AdGuard sync origin; the plays address
      # this group rather than a hostname, so promoting a replica is one edit.
      children:
        dns_primary:
          hosts:
            dns-01:

    # Mail relay (LXC container)
    # Uses eric user like all other LXC containers; Postfix runs as root (normal)
    mail:
      hosts:
        smtp-relay:
          ansible_host: 10.0.10.151
          vmid: 151
          # For LXC provisioning (site.yml's provisioning play); matches the HA
          # home in affinity-smtp-relay. proxmox_lxc handles the container
          # having been HA-migrated elsewhere.
          proxmox_host: pve-opt-01
          proxmox_resource_pool: infra-core
          firewall_alias: smtp-relay
          firewall_alias_comment: SMTP relay server
          firewall_ipsets:
            - core-cluster
          guest_security_groups:
            - sg-vm-admin
            - sg-smtp-relay
            - sg-metrics
          # Default-deny egress: enforces the sg-smtp-relay OUT allowlist
          # (DNS 53/853, submission 587, apt 80/443, ICMP). Deploy the cluster.fw
          # first, then verify relay mail and apt still egress.
          guest_firewall_policy_out: "DROP"

    # Plex Media Server (LXC container on pve-nas-01)
    plex_servers:
      hosts:
        plex:
          ansible_host: 10.0.10.152
          vmid: 152
          proxmox_host: pve-nas-01  # For LXC provisioning via proxmox_lxc role
          proxmox_resource_pool: apps-public
          firewall_ipsets:
            - core-cluster
          guest_security_groups:
            - sg-vm-admin
            - sg-plex
            - sg-metrics

    # GitLab Server (VM on pve-nas-01)
    gitlab_servers:
      hosts:
        gitlab:
          ansible_host: 10.0.10.153
          vmid: 153
          proxmox_host: pve-nas-01
          proxmox_storage: ssd
          proxmox_resource_pool: apps-private
          proxmox_vm_cores: 6
          proxmox_vm_memory: 16384
          # Ballooning floor == proxmox_vm_memory, i.e. ballooning is off for this
          # guest: the memory above its working set is page cache, which is what
          # makes git operations fast, so it is held rather than reclaimed.
          proxmox_vm_balloon: 16384
          proxmox_vm_disk_size: 100G
          proxmox_vm_cpu_type: host
          # Additional disk for GitLab repository data (separate from root)
          # Zvol on ssd pool for I/O performance on git operations
          vm_additional_disks:
            - name: gitlab-repos
              size: 200G
              zvol: ssd/appdata/gitlab/repos
              mount_point: /mnt/gitlab-repos
              fstype: ext4
              # Stable SCSI slot — proxmox_vm pins disks by scsi_slot, never list
              # position. NEVER reuse or reorder a slot; it remaps a live zvol.
              scsi_slot: 1
              # Already backed up via ssd/appdata -> archive (raw ZFS); exclude
              # from vzdump so it isn't double-stored in tank/proxmox.
              vzdump_backup: false
          # onboot=0: the disks are on the ENCRYPTED ssd pool, so pve-guests runs
          # too early. pve-start-encrypted-guests starts it after the unlock (vmid
          # in zfs_encryption_guest_vmids, host_vars/pve-nas-01.yml).
          proxmox_autostart_enabled: false
          proxmox_startup_order: 50
          proxmox_startup_delay: 30
          firewall_ipsets:
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-gitlab
            - sg-metrics

    # Nextcloud Server (VM on pve-nas-01)
    nextcloud_servers:
      hosts:
        nextcloud:
          ansible_host: 10.0.10.156
          vmid: 156
          proxmox_host: pve-nas-01
          proxmox_storage: ssd
          proxmox_resource_pool: apps-private
          proxmox_vm_cores: 4
          proxmox_vm_memory: 8192
          # Ballooning floor: Proxmox reclaims idle RAM down to this under host
          # pressure. Kept conservative for an upload spike rather than sized to
          # the idle working set.
          proxmox_vm_balloon: 3072
          proxmox_vm_disk_size: 40G
          proxmox_vm_cpu_type: host
          # Nextcloud state lives entirely on ZFS zvol passthrough disks (no NFS -
          # the VM is NAS-pinned). scsi_slots are unique PER VM: never reuse or
          # reorder one, it remaps a live zvol.
          vm_additional_disks:
            - name: nextcloud-app
              size: 20G
              zvol: ssd/appdata/nextcloud/app
              mount_point: /mnt/nextcloud-app
              fstype: ext4
              scsi_slot: 1
              vzdump_backup: false
            - name: nextcloud-postgres
              size: 16G
              zvol: ssd/appdata/nextcloud/postgres
              mount_point: /mnt/nextcloud-postgres
              fstype: ext4
              scsi_slot: 2
              vzdump_backup: false
            - name: nextcloud-data
              size: 2T
              zvol: tank/nextcloud-data/disk
              mount_point: /mnt/nextcloud-data
              fstype: ext4
              scsi_slot: 3
              # Thin-provisioned: 2T ceiling, reserved lazily as users upload.
              sparse: true
              vzdump_backup: false
          # onboot=0: the disks are on ENCRYPTED pools, so pve-guests runs too
          # early. Started by pve-start-encrypted-guests after the unlock — vmid
          # listed in zfs_encryption_guest_vmids (host_vars/pve-nas-01.yml).
          proxmox_autostart_enabled: false
          proxmox_startup_order: 55
          proxmox_startup_delay: 30
          firewall_ipsets:
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-nextcloud
            - sg-metrics

    # Immich photo-management VM on pve-nas-01 (docker-compose stack)
    immich_servers:
      hosts:
        immich:
          ansible_host: 10.0.10.157
          vmid: 157
          proxmox_host: pve-nas-01
          proxmox_storage: ssd
          proxmox_resource_pool: apps-private
          # The in-VM ML container is the CPU FAILOVER endpoint (primary ML is
          # the GPU OpenVINO LXC immich-ml, .158 — see immich_ml_servers below).
          # Keep the cores: a GPU-LXC outage fails ML back onto this CPU.
          proxmox_vm_cores: 6
          proxmox_vm_memory: 12288
          # Ballooning floor kept high: ML jobs spike RAM on demand, so reclaim
          # only down to 6G (idle ML holds ~265M; models load lazily).
          proxmox_vm_balloon: 6144
          proxmox_vm_disk_size: 40G
          proxmox_vm_cpu_type: host                 # host CPU since node-pinned (no live migration)
          # App + postgres on the encrypted ssd pool; the photo library on a
          # SPARSE zvol under encrypted tank/immich-data. Both parents are archive
          # replication sources, so the zvols inherit encryption and backup.
          vm_additional_disks:
            - name: immich-app
              size: 20G
              zvol: ssd/appdata/immich/app
              mount_point: /mnt/immich-app
              fstype: ext4
              # Stable SCSI slot — proxmox_vm pins disks by scsi_slot, never list
              # position. NEVER reuse or reorder a slot; it remaps a live zvol.
              scsi_slot: 1
              vzdump_backup: false
            - name: immich-postgres
              size: 24G
              zvol: ssd/appdata/immich/postgres
              mount_point: /mnt/immich-postgres
              fstype: ext4
              scsi_slot: 2
              vzdump_backup: false
            - name: immich-data
              size: 2T
              # SPARSE so the 2TB library grows on demand (thin). Child of the
              # pre-existing encrypted tank/immich-data dataset.
              sparse: true
              zvol: tank/immich-data/disk
              mount_point: /mnt/immich-data
              fstype: ext4
              scsi_slot: 3
              vzdump_backup: false
          # onboot=0: the disks are on ENCRYPTED pools, so pve-guests runs too
          # early. Started by pve-start-encrypted-guests after the unlock — vmid
          # listed in zfs_encryption_guest_vmids (host_vars/pve-nas-01.yml).
          proxmox_autostart_enabled: false
          proxmox_startup_order: 56
          proxmox_startup_delay: 30
          firewall_ipsets:
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-immich
            - sg-metrics

    # Immich GPU machine-learning LXC (docker compose, OpenVINO) on pve-nas-01
    immich_ml_servers:
      hosts:
        immich-ml:
          ansible_host: 10.0.10.158
          vmid: 158
          proxmox_host: pve-nas-01  # For LXC provisioning via proxmox_lxc role
          proxmox_resource_pool: apps-private
          firewall_ipsets:
            - core-cluster
          # sg-metrics intentionally omitted: nothing here is scraped. The ML
          # container exposes no /metrics and this guest runs no
          # node_exporter_host; alloy_host pushes logs outbound.
          guest_security_groups:
            - sg-vm-admin
            - sg-immich-ml

    # Firewall-only hosts: ansible_connection: local prevents SSH (HAOS cannot
    # run Ansible) and proxmox_firewall delegates the .fw writes to a Proxmox
    # host. gather_facts MUST be false for this group.
    services:
      # ansible_become: false lives in group_vars/services.yml (precedence — see
      # that file), never here.
      hosts:
        home:
          ansible_host: 10.0.10.154
          ansible_connection: local
          vmid: 154
          firewall_ipsets:
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-haos
            - sg-metrics

    # CRITICAL: Windows 11 VM, provisioned by proxmox_vm then installed
    # interactively (docs/39). ansible_become: false lives in
    # group_vars/windows_vms.yml (precedence — see that file); gather_facts
    # must stay false.
    windows_vms:
      hosts:
        windows:
          ansible_host: 10.0.10.155
          ansible_connection: local
          vmid: 155
          proxmox_host: pve-nas-01
          proxmox_storage: ssd            # encrypted ssd pool (root disk -> ssd)
          proxmox_resource_pool: apps-private
          proxmox_vm_guest_type: windows          # proxmox_vm builds the OVMF/TPM/q35 shell
          proxmox_vm_cores: 8
          # 8 GiB, not 16: idle RDP duty, ballooning already floors it at 4 GiB,
          # and the halved MAX is what shrinks the NAS's worst-case commit during
          # the backup window (docs/06 § NAS memory management).
          proxmox_vm_memory: 8192
          # Ballooning floor: Windows idles holding memory it is not using. The
          # guest auto-starts after every NAS unlock, so this floor - not "off" -
          # is the standing footprint until an operator shuts it down.
          proxmox_vm_balloon: 4096
          proxmox_vm_disk_size: 250G
          proxmox_vm_cpu_type: host               # NAS-pinned, no live migration
          # Download MANUALLY from Microsoft to the tank-proxmox ISO store and
          # name it to match this exactly — it cannot be redistributed, so no
          # role fetches it. docs/39-windows-vm.md.
          proxmox_vm_install_iso: "Win11_25H2_English_x64_v2.iso"
          # proxmox_vm_virtio_iso defaults to virtio-win-<version>.iso and is
          # downloaded and checksum-verified by proxmox_vm (all.yml pins it).

          # CRITICAL: onboot=0 and auto-started. The disks are on the encrypted
          # ssd pool, so pve-start-encrypted-guests starts this guest after the
          # unlock (last in zfs_encryption_guest_vmids). To stop that, remove it
          # from that list; onboot=1 fails against a locked pool (docs/32, 39).
          proxmox_autostart_enabled: false
          proxmox_startup_order: 60       # after gitlab (50)
          proxmox_startup_delay: 30
          firewall_ipsets:
            - core-cluster
          # RDP-only (3389 from admin_lan + admin_ts); no sg-vm-admin/sg-metrics
          # (no SSH admin, no in-guest exporter) — keeps 155.fw identical to the
          # firewall-only placeholder this VM replaces.
          guest_security_groups:
            - sg-windows

    # K3s cluster nodes (VMs - provisioned by Ansible)
    k3s_servers:
      vars:
        k3s_role: server
        # Server nodes get control-plane label and taint to reserve for kube-system
        k3s_labels:
          esweiss.com/control-plane: "true"
        k3s_taints:
          - key: node-role.kubernetes.io/control-plane
            value: "true"
            effect: NoSchedule
      hosts:
        k3s-srv-nas-01:
          ansible_host: 10.0.10.222
          vmid: 222
          k3s_is_first_server: true
          proxmox_host: pve-nas-01
          proxmox_storage: local-lvm
          proxmox_resource_pool: platform
          proxmox_vm_cpu_type: host  # Pinned to this host, no live migration — host CPU type is safe
          proxmox_vm_cores: 2
          # Margin rather than need: etcd is latency-sensitive and the one guest
          # whose degradation takes the whole cluster with it. Do NOT size this to
          # measured usage.
          proxmox_vm_memory: 8192
          proxmox_vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 30
          proxmox_startup_delay: 10
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-metrics
        # Server 2 (on pve-laptop-01) — quorum is 3/3.
        k3s-srv-laptop-01:
          ansible_host: 10.0.10.223
          vmid: 223
          k3s_is_first_server: false
          proxmox_host: pve-laptop-01
          proxmox_storage: local-ssd
          proxmox_resource_pool: platform
          proxmox_vm_cpu_type: host
          proxmox_vm_cores: 2
          # Budgeted, not defaulted: pve-laptop-01 has 15 GiB and carries this
          # guest plus k3s-agt-laptop-01. The server taint reserves it for
          # kube-system, so of the two it is the one to grow back LAST.
          proxmox_vm_memory: 5120
          proxmox_vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 30
          proxmox_startup_delay: 10
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-metrics
        # Server 3 (on pve-prec-01)
        k3s-srv-prec-01:
          ansible_host: 10.0.10.227
          vmid: 227
          k3s_is_first_server: false
          proxmox_host: pve-prec-01
          proxmox_storage: local-ssd
          proxmox_resource_pool: platform
          proxmox_vm_cpu_type: host
          proxmox_vm_cores: 2
          proxmox_vm_memory: 6144
          proxmox_vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 30
          proxmox_startup_delay: 10
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-metrics

    k3s_agents:
      vars:
        k3s_role: agent
      hosts:
        # NAS workloads agent (on pve-nas-01)
        k3s-agt-nas-01:
          ansible_host: 10.0.10.202
          vmid: 202
          proxmox_host: pve-nas-01
          proxmox_storage: local-lvm
          proxmox_resource_pool: platform
          proxmox_vm_cpu_type: host  # Pinned to this host, no live migration — host CPU type is safe
          proxmox_vm_cores: 6
          # Sized for the heavy in-cluster state (prometheus, loki, the
          # authentik/mealie postgres zvols) plus burst room for CI pods. Low
          # cores plus the PreferNoSchedule taint keep this node a last choice.
          proxmox_vm_memory: 24576
          proxmox_vm_disk_size: 64G
          # Persistent app-data zvols (survive VM recreation), already backed up
          # via ssd/appdata -> archive, so vzdump_backup keeps them out of the VM
          # image. proxmox_vm pins by scsi_slot: NEVER reuse or reorder a slot.
          vm_additional_disks:
            - name: postgres-data
              size: 10G
              zvol: ssd/appdata/authentik/postgres
              mount_point: /mnt/postgres-data
              fstype: ext4
              scsi_slot: 1
              vzdump_backup: false
            - name: mealie-postgres-data
              size: 32G
              zvol: ssd/appdata/mealie/postgres
              mount_point: /mnt/mealie-postgres-data
              fstype: ext4
              scsi_slot: 2
              vzdump_backup: false
            - name: prometheus-data
              size: 150G
              zvol: ssd/appdata/prometheus/data
              mount_point: /mnt/prometheus-data
              fstype: ext4
              scsi_slot: 3
              vzdump_backup: false
            - name: loki-data
              size: 75G
              zvol: ssd/appdata/loki/data
              mount_point: /mnt/loki-data
              fstype: ext4
              scsi_slot: 4
              vzdump_backup: false
          # onboot=0: the 4 data zvols are on the ENCRYPTED ssd pool, and a guest
          # with any missing configured disk will not start.
          # pve-start-encrypted-guests starts it after the unlock (docs/32).
          proxmox_autostart_enabled: false
          proxmox_startup_order: 40
          proxmox_startup_delay: 10
          k3s_labels:
            esweiss.com/nas: "true"
            esweiss.com/general: "true"
            esweiss.com/cpu: "modern"
          k3s_taints:
            - key: esweiss.com/nas
              value: "true"
              effect: PreferNoSchedule
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-metrics
        # Ingress + general agent (on pve-laptop-01)
        k3s-agt-laptop-01:
          ansible_host: 10.0.10.203
          vmid: 203
          proxmox_host: pve-laptop-01
          proxmox_storage: local-ssd
          proxmox_resource_pool: platform
          proxmox_vm_cpu_type: host
          proxmox_vm_cores: 4
          # Budgeted, not defaulted: pve-laptop-01 has 15 GiB and will not get
          # more. This is the ingress agent (Traefik) and a CI landing zone -
          # raise to 6144 first if CI pods sit Pending here.
          proxmox_vm_memory: 5120
          proxmox_vm_disk_size: 64G
          proxmox_autostart_enabled: true
          proxmox_startup_order: 40
          proxmox_startup_delay: 10
          k3s_labels:
            esweiss.com/general: "true"
            esweiss.com/ingress: "true"
            esweiss.com/cpu: "modern"
          k3s_taints:
            - key: esweiss.com/ingress
              value: "true"
              effect: PreferNoSchedule
          firewall_ipsets:
            - k3s_nodes
            - core-cluster
            - nfs_clients
          guest_security_groups:
            - sg-vm-admin
            - sg-k3s-core
            - sg-k3s-ingress-int
            - sg-k3s-ingress-pub
            - sg-syslog-vip
            - sg-k3s-gitssh
            - sg-metrics
        # Ingress + general agent (on pve-opt-01). The three OptiPlex AGENTS are
        # Core 2 Quad (no SSE4.2) and carry esweiss.com/cpu=legacy; the other
        # three agents are cpu=modern, the servers carry none (docs/25).
        k3s-agt-opt-01:
          ansible_host: 10.0.10.204
          vmid: 204
          proxmox_host: pve-opt-01
          proxmox_storage: local-ssd
          proxmox_resource_pool: platform
          proxmox_vm_cpu_type: host
          proxmox_vm_cores: 3
          proxmox_vm_memory: 6144
