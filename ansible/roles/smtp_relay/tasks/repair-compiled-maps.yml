---
# Self-heal for postfix's COMPILED map databases (.db) — the relay's copy of
# the postfix_null_client repair (same two map files, same hazard). The roles
# are kept self-contained rather than sharing one file: a cross-role include
# would make a change here ship without deploy-ansible-mail's `changes:` filter
# firing, which is the same class of silent gap this repair exists to close.
#
# Both source files are templated with `notify:`, so the .db is rebuilt only
# when the source CHANGES. Any run that loses its handlers — a play that fails
# before flush_handlers — leaves a correct source next to a stale .db, and
# nothing ever reports changed again. Postfix reads the .db.
#
#   /etc/aliases: found stale on four null clients (pve-opt-01/02, pve-prec-01,
#   gitlab) — root: was in the source but absent from aliases.db, so root mail
#   was delivered to /var/mail/root instead of relayed. Silent for months.
#
#   /etc/postfix/sasl_passwd: holds the GMAIL credential here, so a stale .db
#   defers the whole fleet's outbound mail after a Gmail app-password rotation.
#
# Both checks compare the .db against the CONFIGURED value, not merely "resolves
# to something": a .db holding a RETIRED target/credential satisfies a non-empty
# test, so a value-blind guard skips the rebuild and the drift is permanent.

- name: Check that the compiled alias database resolves root to the configured target
  ansible.builtin.command:
    cmd: postmap -q root hash:/etc/aliases
  register: smtp_relay_alias_root
  changed_when: false
  failed_when: false
  check_mode: false

- name: Rebuild the alias database when it does not match the configured target
  ansible.builtin.command:
    cmd: newaliases
  changed_when: true
  when: (smtp_relay_alias_root.stdout | trim) != (mail_aliases.root | default(''))

# The credential must never reach the log or a registered value, so the whole
# comparison happens inside the shell and only its EXIT STATUS leaves: rc 0 =
# the .db serves what the source holds, non-zero = rebuild. A missing .db, a
# stale value and an unparseable source all land on non-zero, which self-heals
# (and, if the source were ever unparseable, reports changed on every run
# instead of passing silently — molecule's idempotence step catches that).
- name: Check that the compiled SASL map matches the deployed credential
  ansible.builtin.shell: |
    set -o pipefail
    key=$(awk '$1 !~ /^#/ && NF > 1 {print $1; exit}' /etc/postfix/sasl_passwd)
    [ -n "$key" ] || exit 2
    src=$(awk -v k="$key" '$1 == k {sub(/^[^[:blank:]]+[[:blank:]]+/, ""); print; exit}' \
      /etc/postfix/sasl_passwd | sha256sum)
    db=$(postmap -q "$key" hash:/etc/postfix/sasl_passwd | sha256sum)
    [ "$src" = "$db" ]
  args:
    executable: /bin/bash
  register: smtp_relay_sasl_map
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Rebuild the SASL password database when it does not match the source
  ansible.builtin.command:
    cmd: postmap /etc/postfix/sasl_passwd
  changed_when: true
  when: smtp_relay_sasl_map.rc != 0
  no_log: true
