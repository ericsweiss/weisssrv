---
# Handlers for smtp_relay role
# NOTE: Handler execution order matters! Handlers run in the order they are
# defined here, not in the order they are notified. postmap must run before
# reload so Postfix picks up the updated .db file.

- name: Postmap sasl_passwd
  ansible.builtin.command: postmap /etc/postfix/sasl_passwd
  changed_when: true

- name: Newaliases
  ansible.builtin.command: newaliases
  changed_when: true

- name: Reload postfix
  ansible.builtin.service:
    name: postfix
    state: reloaded

# The postfix-queue-collector timer is reloaded + restarted on a unit change by
# the shared textfile_collector role (restart-on-change task), so this role no
# longer carries a collector reload handler.
