---
# Handlers for smtp_relay role

- name: Reload postfix
  ansible.builtin.service:
    name: postfix
    state: reloaded

- name: Postmap sasl_passwd
  ansible.builtin.command: postmap /etc/postfix/sasl_passwd
  changed_when: true

- name: Newaliases
  ansible.builtin.command: newaliases
  changed_when: true
