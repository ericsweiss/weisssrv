---
# Wrap the write in immutable-flag (chattr) handling: drop the flag before
# writing, re-set it afterwards, and verify it stuck. Consumers that want
# /etc/resolv.conf protected from DHCP/systemd overwrites (base, adguard_home)
# set this true.
resolv_conf_immutable: false

# chattr +i needs CAP_LINUX_IMMUTABLE in the owning user namespace, which
# unprivileged containers (LXC guests, molecule docker) lack — there the role
# warns about the missing protection instead of failing.
resolv_conf_is_container: "{{ ansible_facts['virtualization_type'] | default('') in ['docker', 'lxc', 'container', 'podman'] }}"

# Default search domains. Empty list = no `search` line is written.
#
# Default keeps current behaviour for Proxmox hosts and admin shells
# (typing `pve-nas-01` resolves via search-suffix). K3s VMs override
# to [] in group_vars/k3s.yml because kubelet propagates the host's
# search domains into every pod's /etc/resolv.conf, which interacts
# badly with the default ndots:5 to amplify cluster-internal lookups
# (each one is suffixed and probed against AdGuard before the literal
# is tried).
resolv_conf_search_domains:
  - "{{ internal_domain }}"
