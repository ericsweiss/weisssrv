---
# Scenario overrides; shared config in ansible/molecule/base.yml (ansible/TESTING.md).
platforms:
  - name: resolv-conf-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    prepare: prepare.yml
    # In a privileged container chattr +i sticks on the bind-mounted
    # /etc/resolv.conf; cleanup.yml strips it before destroy so docker rm
    # doesn't fail with EPERM.
    cleanup: cleanup.yml
  inventory:
    group_vars:
      all:
        host_dns_servers:
          - 192.168.0.150
          - 192.168.0.160
        internal_domain: esweiss.com
        resolv_conf_unsafe_writes: true
        # Exercises the immutable-flag wrap (strip -> write -> chattr +i). This
        # container is privileged, so unlike an unprivileged LXC guest chattr +i
        # actually sticks here; cleanup.yml removes it before destroy so docker
        # rm can succeed. (The host is detected as a container, so the assert is
        # skipped — the warning path is not reachable when +i sticks.)
        resolv_conf_immutable: true
