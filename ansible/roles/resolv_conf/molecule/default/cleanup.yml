---
# Runs before destroy. This scenario converges with resolv_conf_immutable: true,
# and in a privileged container chattr +i DOES stick on the bind-mounted
# /etc/resolv.conf — leaving it set would make `docker rm` fail with EPERM.
# Strip it so destroy can remove the container.
- name: Cleanup
  hosts: all
  gather_facts: false
  # The `test` matrix runs cleanup BEFORE create (and again after a failed
  # converge), so the container often does not exist when this play runs —
  # especially on a reused CI runner with a stale molecule instance-config.
  # The docker connection then errors "No such container", which is reported as
  # a task FAILURE (rc=1), not an unreachable host — so failed_when: false is
  # what actually tolerates it; ignore_unreachable covers runners that classify
  # the missing container the other way. Either way there is nothing to strip
  # when the container isn't there.
  ignore_unreachable: true
  tasks:
    - name: Strip immutable attr off /etc/resolv.conf before destroy
      ansible.builtin.raw: chattr -i /etc/resolv.conf 2>/dev/null || true
      changed_when: false
      failed_when: false
