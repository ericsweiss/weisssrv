---
# Per-role Molecule scenario. Shared driver/provisioner/verifier/scenario config
# is inherited from ansible/molecule/base.yml (applied via the `-c` flag in
# test-all-roles.sh and the CI molecule-tests matrix). Only the per-role platform
# and inventory live here (plus role-specific provisioner.env / remote_tmp / a
# custom scenario where needed).
platforms:
  # Server host: [authenticate.server] rendered, PEMs must survive cleanup.
  - name: nfs-tls-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
  # Client-only host (the least-privilege path the six k3s agents take):
  # key-free tlshd.conf, and prepare-staged PEMs must be REMOVED by the
  # cleanup task.
  - name: nfs-tls-client-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
  # Opted-out host (nfs_tls_enabled: false): starts from an already-configured
  # tlshd (enabled unit + /etc/tlshd.conf staged in prepare) and exercises the
  # de-list reconcile — the unit must be stopped/disabled and the config removed.
  - name: nfs-tls-optout-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    prepare: prepare.yml
  inventory:
    group_vars:
      all:
        nfs_tls_enabled: true
    host_vars:
      nfs-tls-test:
        nfs_tls_is_server: true
      nfs-tls-client-test:
        nfs_tls_is_server: false
      nfs-tls-optout-test:
        nfs_tls_enabled: false
        nfs_tls_is_server: false
