---
# Verify playbook for nfs_tls role testing.
#
# Container-bound checks: package is installed, tlshd.conf rendered with
# our cert paths, and systemd recognizes tlshd.service. We do NOT verify
# tlshd is *running* against real NFS traffic — that requires a kernel
# with AF_TLSH netlink and an actual NFSv4 client/server pair.
#
# Two platforms cover both render paths: the SERVER host (nfs_tls_is_server,
# [authenticate.server] with cert + key, PEMs spared) and the CLIENT-only
# host (key-free [authenticate.client], staged PEMs removed by the
# least-privilege cleanup). Assertions gate on nfs_tls_is_server from the
# scenario inventory.
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    # 1. ktls-utils package installed (both hosts)
    - name: Check ktls-utils is installed
      ansible.builtin.package_facts:
        manager: apt

    - name: Assert ktls-utils + nfs-common packages present
      ansible.builtin.assert:
        that:
          - "'ktls-utils' in ansible_facts.packages"
          # mount.nfs must ship with the TLS client tooling: a first-time NFS
          # client VM otherwise fails fsconfig() with "mount program didn't
          # pass remote address" (pipeline 803).
          - "'nfs-common' in ansible_facts.packages"
        fail_msg: "ktls-utils/nfs-common not installed — role's apt step incomplete"
        success_msg: "ktls-utils (tlshd) + nfs-common (mount.nfs) installed"

    # 2. /etc/tlshd.conf rendered (TLS-enabled hosts; content differs per role)
    - name: Stat /etc/tlshd.conf
      ansible.builtin.stat:
        path: /etc/tlshd.conf
      register: tlshd_conf

    # (TLS-enabled hosts only) config must be rendered; opted-out host asserts
    # its removal in section 4 below.
    - name: Assert tlshd.conf exists with correct mode/owner
      ansible.builtin.assert:
        that:
          - tlshd_conf.stat.exists
          - tlshd_conf.stat.pw_name == 'root'
          - tlshd_conf.stat.gr_name == 'root'
          - tlshd_conf.stat.mode == '0644'
        fail_msg: >-
          /etc/tlshd.conf missing or has wrong perms (exists={{ tlshd_conf.stat.exists }},
          mode={{ tlshd_conf.stat.mode | default('?') }})
        success_msg: "/etc/tlshd.conf exists, owned by root:root, mode 0644"
      when: nfs_tls_enabled | default(true)

    - name: Read /etc/tlshd.conf
      ansible.builtin.slurp:
        src: /etc/tlshd.conf
      register: tlshd_conf_body
      when: nfs_tls_enabled | default(true)

    - name: Assert tlshd.conf carries the client block + truststore (both hosts)
      ansible.builtin.assert:
        that:
          - "'[authenticate.client]' in (tlshd_conf_body.content | b64decode)"
          - "'/etc/ssl/certs/ca-certificates.crt' in (tlshd_conf_body.content | b64decode)"
        fail_msg: "tlshd.conf does not reference the client block/truststore"
        success_msg: "tlshd.conf renders the client block with the system truststore"
      when: nfs_tls_enabled | default(true)

    - name: Assert server render carries the server identity (cert + key)
      ansible.builtin.assert:
        that:
          - "'[authenticate.server]' in (tlshd_conf_body.content | b64decode)"
          - "'/etc/ssl/private/fullchain.pem' in (tlshd_conf_body.content | b64decode)"
          - "'/etc/ssl/private/privkey.pem' in (tlshd_conf_body.content | b64decode)"
        fail_msg: "server tlshd.conf does not reference the expected cert/key paths"
        success_msg: "server tlshd.conf renders cert + key + truststore"
      when:
        - nfs_tls_enabled | default(true)
        - nfs_tls_is_server | default(false)

    # Least-privilege client render: with nfs_tls_client_cert: false (the
    # default, correct for xprtsec=tls), the [authenticate.client] block must
    # NOT carry the private key — only the truststore. On the server host
    # (nfs_tls_is_server: true) the private key appears exactly once, in the
    # [authenticate.server] block. A second occurrence means the client block
    # is leaking the wildcard key it doesn't need under server-only TLS.
    - name: Verify the private key is referenced exactly once (server block only)
      ansible.builtin.assert:
        that:
          - "(tlshd_conf_body.content | b64decode).count('x509.private_key') == 1"
        fail_msg: >-
          x509.private_key appears
          {{ (tlshd_conf_body.content | b64decode).count('x509.private_key') }}
          times — under xprtsec=tls the client block must omit the private key.
        success_msg: "private key is referenced once (server identity only); client block is key-free"
      when:
        - nfs_tls_enabled | default(true)
        - nfs_tls_is_server | default(false)

    - name: Verify the client-only render is entirely key- and cert-free
      ansible.builtin.assert:
        that:
          - "'[authenticate.server]' not in (tlshd_conf_body.content | b64decode)"
          - "'x509.private_key' not in (tlshd_conf_body.content | b64decode)"
          - "'x509.certificate' not in (tlshd_conf_body.content | b64decode)"
        fail_msg: >-
          Client-only tlshd.conf references a server block, cert or private
          key — the xprtsec=tls least-privilege render regressed.
        success_msg: "client tlshd.conf carries only the truststore (no server block, no key)"
      when:
        - nfs_tls_enabled | default(true)
        - not (nfs_tls_is_server | default(false))

    # The least-privilege cleanup task removes the wildcard cert + key only on
    # CLIENT-only hosts (not nfs_tls_is_server, not nfs_tls_client_cert).
    # prepare.yml staged both PEMs on BOTH hosts: the server's must survive (a
    # regression dropping the is_server guard would delete pve-nas-01's own
    # NFS-TLS identity), the client's must be gone (the security-motivated
    # wildcard-key cleanup on agents).
    - name: Stat the wildcard cert + key after converge
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/ssl/private/fullchain.pem
        - /etc/ssl/private/privkey.pem
      register: server_pem_stat

    - name: Assert the cleanup spared the server's cert + key
      ansible.builtin.assert:
        that:
          - server_pem_stat.results | map(attribute='stat.exists') | list == [true, true]
        fail_msg: >-
          The least-privilege cleanup removed the wildcard cert/key on a SERVER
          host — the nfs_tls_is_server gating regressed; pve-nas-01 would lose
          its own NFS-TLS identity.
        success_msg: "cleanup spared the server's cert + key (is_server gating holds)"
      when: nfs_tls_is_server | default(false)

    - name: Assert the cleanup removed the client's staged cert + key
      ansible.builtin.assert:
        that:
          - server_pem_stat.results | map(attribute='stat.exists') | list == [false, false]
        fail_msg: >-
          The wildcard cert/key survived on a CLIENT-only host — the
          least-privilege cleanup regressed; the impersonation-capable
          *.esweiss.com key would linger on every k3s agent.
        success_msg: "cleanup removed the client's PEMs (least-privilege holds)"
      when:
        - nfs_tls_enabled | default(true)
        - not (nfs_tls_is_server | default(false))

    # 3. tlshd.service unit recognized by systemd (both hosts)
    # `systemctl cat` is intentional here (not systemd_service module): we
    # want a read-only check that the unit file is on disk and parseable
    # by systemd, with an actionable error message if it isn't. The unit
    # ships with the ktls-utils package; if it's missing, the role's
    # `state: started` step would have failed earlier — this is a final
    # belt-and-braces check.
    - name: Verify systemd recognizes tlshd.service  # noqa command-instead-of-module
      ansible.builtin.command: systemctl cat tlshd.service
      register: tlshd_unit_cat
      changed_when: false
      failed_when: tlshd_unit_cat.rc != 0

    - name: Check tlshd.service enabled state  # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: systemctl is-enabled tlshd.service
      register: tlshd_enabled
      changed_when: false
      # is-enabled returns non-zero for 'disabled'; don't fail the read.
      failed_when: false

    - name: Assert tlshd.service is enabled
      ansible.builtin.assert:
        that:
          - tlshd_enabled.stdout | trim == 'enabled'
        fail_msg: "Expected tlshd.service to be 'enabled', got '{{ tlshd_enabled.stdout | trim }}'"
        success_msg: "tlshd.service is enabled (will start at boot on real hosts)"
      when: nfs_tls_enabled | default(true)

    # 4. Opt-out reconcile (nfs_tls_enabled: false): unit stopped + disabled,
    #    /etc/tlshd.conf removed. prepare.yml staged the opposite state.
    - name: Assert tlshd.service is disabled after opt-out reconcile
      ansible.builtin.assert:
        that:
          - tlshd_enabled.stdout | trim == 'disabled'
        fail_msg: >-
          Expected tlshd.service 'disabled' after opt-out reconcile, got
          '{{ tlshd_enabled.stdout | trim }}' — the de-list stop/disable regressed.
        success_msg: "tlshd.service disabled after opt-out reconcile"
      when: not (nfs_tls_enabled | default(true))

    - name: Assert /etc/tlshd.conf removed after opt-out reconcile
      ansible.builtin.assert:
        that:
          - not tlshd_conf.stat.exists
        fail_msg: "/etc/tlshd.conf survived the opt-out reconcile — removal regressed."
        success_msg: "/etc/tlshd.conf removed after opt-out reconcile"
      when: not (nfs_tls_enabled | default(true))

    # Summary
    - name: Display test results
      ansible.builtin.debug:
        msg:
          - "ktls-utils package installed"
          - "/etc/tlshd.conf rendered for this host's role (server identity vs key-free client)"
          - "PEM handling verified (server spared, client-only removed)"
          - "tlshd.service unit recognized by systemd and enabled"
          - "All nfs_tls role verifications passed"
