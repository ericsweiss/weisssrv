---
# Prepare playbook for nfs_tls role testing.
#
# Two preconditions the role expects from the host:
#   1. /etc/ssl/private/{fullchain,privkey}.pem exist (acme_certs would
#      have distributed these in production). The role asserts they
#      exist before rendering tlshd.conf on the SERVER host; on the
#      client-only host they simulate a stale pre-least-privilege rollout
#      that the cleanup task must remove (verify.yml asserts both sides).
#   2. tlshd.service must accept a `state: started` request, but the
#      container lacks the AF_TLSH netlink subsystem the real binary
#      needs. We pre-install ktls-utils and drop in a unit override
#      that replaces ExecStart with /bin/true so systemd happily
#      "starts" the service as far as the role is concerned. The
#      verify.yml file/config/unit-recognition checks are unaffected.
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule/tasks/prepare-base.yml

    - name: Disable apt background services
      ansible.builtin.import_tasks: ../../../../molecule/tasks/prepare-apt-disable.yml

    - name: Gather facts
      ansible.builtin.setup:

    # Synthetic cert files so the role's preflight assertion passes.
    # In production these are written by acme_certs's homelab-cert-reload.sh.
    - name: Ensure /etc/ssl/private exists
      ansible.builtin.file:
        path: /etc/ssl/private
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Touch synthetic fullchain.pem
      ansible.builtin.copy:
        dest: /etc/ssl/private/fullchain.pem
        content: |
          -----BEGIN CERTIFICATE-----
          synthetic-test-fixture-not-a-real-cert
          -----END CERTIFICATE-----
        owner: root
        group: root
        mode: "0644"

    - name: Touch synthetic privkey.pem
      ansible.builtin.copy:
        dest: /etc/ssl/private/privkey.pem
        content: |
          -----BEGIN PRIVATE KEY-----
          synthetic-test-fixture-not-a-real-key
          -----END PRIVATE KEY-----
        owner: root
        group: root
        mode: "0600"

    # Pre-install ktls-utils so the unit file is on disk before the
    # role's apt step runs (the role's apt is then a fast no-op) and so
    # the drop-in below has something to override.
    - name: Pre-install ktls-utils
      ansible.builtin.apt:
        name: ktls-utils
        state: present
        update_cache: true

    # Replace tlshd's ExecStart with /bin/true. Without this the role's
    # final `systemd: state: started` step fails in a container — tlshd
    # exits immediately because the kernel-TLS handshake netlink family
    # isn't compiled into the container's kernel.
    - name: Create tlshd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/tlshd.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Drop in test-only no-op ExecStart override
      ansible.builtin.copy:
        dest: /etc/systemd/system/tlshd.service.d/molecule-test-noop.conf
        content: |
          # Molecule-only override: replace the real tlshd ExecStart with
          # /bin/true so `state: started` succeeds in a container without
          # AF_TLSH netlink. This file is created by prepare.yml and is
          # NEVER deployed to production hosts.
          [Service]
          ExecStart=
          ExecStart=/bin/true
          Type=oneshot
          RemainAfterExit=yes
        owner: root
        group: root
        mode: "0644"

    - name: Reload systemd to pick up the drop-in
      ansible.builtin.systemd:
        daemon_reload: true

    # Opted-out host precondition: simulate a host that WAS running NFS-TLS
    # before nfs_tls_enabled flipped false. Stage the enabled unit + a stale
    # /etc/tlshd.conf so the role's de-list reconcile has something to undo.
    # Gated on the opted-out host only (nfs_tls_enabled: false in host_vars).
    - name: Stage opted-out precondition (enabled tlshd + stale config)
      when: not (nfs_tls_enabled | default(true))
      block:
        - name: Enable and start tlshd on the opted-out host
          ansible.builtin.systemd:
            name: tlshd.service
            enabled: true
            state: started

        - name: Write a stale /etc/tlshd.conf on the opted-out host
          ansible.builtin.copy:
            dest: /etc/tlshd.conf
            content: |
              # Stale pre-opt-out config; the role's reconcile must remove this.
              [authenticate.client]
              x509.truststore = /etc/ssl/certs/ca-certificates.crt
            owner: root
            group: root
            mode: "0644"
