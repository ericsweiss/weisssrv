---
# Installs and configures tlshd (kernel TLS handshake daemon) for use
# by NFSv4's xprtsec=tls/mtls. Idempotent; safe to re-run.
- name: Install ktls-utils (provides tlshd)
  ansible.builtin.apt:
    name:
      # tlshd (the TLS handshake daemon xprtsec=tls requires)
      - ktls-utils
      # mount.nfs — the userspace helper that resolves the server and passes
      # its address to the kernel mount API. Proxmox hosts and k3s agents
      # always had it from base tooling, but a first-time NFS client VM does
      # not: without it the kernel fsconfig() fails with "NFS: mount program
      # didn't pass remote address" (pipeline 803: gitlab/immich/nextcloud
      # per-app export mounts).
      - nfs-common
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - nfs_tls_enabled | default(false)
    - ansible_facts['os_family'] == "Debian"

# Refuse to start tlshd if the cert files aren't there yet. Without
# this guard, a misordered rollout (enable the role before acme_certs
# has distributed the cert) silently brings up tlshd that can't open
# its cert file and either crash-loops or returns the wrong handshake
# at the next NFS mount attempt — both modes are hard to debug.
- name: Verify cert + key + truststore are present before starting tlshd
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ nfs_tls_cert_path }}"
    - "{{ nfs_tls_key_path }}"
    # Truststore defaults to /etc/ssl/certs/ca-certificates.crt
    # (provided by the ca-certificates package, present on every Debian
    # base install). Operators overriding nfs_tls_truststore to a
    # private CA bundle path will silently break tlshd startup if the
    # path doesn't exist — stat upfront and fail loud instead.
    - "{{ nfs_tls_truststore }}"
  register: nfs_tls_files
  when: nfs_tls_enabled | default(false)

- name: Assert cert + key + truststore exist
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      {{ item.item }} missing — for the cert (and the key, on a server or
      mTLS client), run acme_certs distribution first (`task dns:deploy`) so
      the wildcard cert/key reaches this host. For the truststore, verify
      nfs_tls_truststore points at a real CA bundle (default
      /etc/ssl/certs/ca-certificates.crt is from the `ca-certificates` package).
  loop: "{{ nfs_tls_files.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - nfs_tls_enabled | default(false)
    # xprtsec=tls clients present no cert, so they need only the truststore.
    # The cert AND key (which tlshd.conf.j2 emits together) are required only on
    # an NFS server or an mTLS client — otherwise a least-privilege client where
    # neither is distributed would fail this preflight.
    - >-
      item.item == nfs_tls_truststore
      or (item.item in [nfs_tls_cert_path, nfs_tls_key_path]
          and ((nfs_tls_is_server | default(false)) or (nfs_tls_client_cert | default(false))))

# acme_certs is supposed to distribute the private key as root:0600, but tlshd
# loads a loose-permission key silently, so verify and fail loud here (the
# wildcard key is high-value — see README "Private-key least privilege").
# stat.mode is the octal perms (no file-type bits), e.g. "0600". Require the key
# to be owner-readable (4 or 6) with NO execute bit and NO group/other access —
# i.e. 0600 (rw) or 0400 (r). This rejects group/other-readable modes AND
# unreadable owner modes like 0000/0200 that would silently break tlshd's key
# load while a bare "no group/other" check passed. Leading 0 optional.
- name: Assert private key is owner-readable + not group/other-readable (0600/0400)
  ansible.builtin.assert:
    that:
      - item.stat.mode is match('^0?[46]00$')
    fail_msg: >-
      {{ item.item }} has mode {{ item.stat.mode }} — the *.esweiss.com
      private key must be 0600 (no group/other access). Tighten with
      `chmod 600 {{ item.item }}` and check acme_certs's distribution
      key_mode for this host.
    quiet: true
  loop: "{{ nfs_tls_files.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - nfs_tls_enabled | default(false)
    # Same gating as the existence check: the key only lives on a server or
    # mTLS client, so only there is its mode our concern.
    - (nfs_tls_is_server | default(false)) or (nfs_tls_client_cert | default(false))
    - item.item == nfs_tls_key_path
    - item.stat.exists

- name: Ensure /etc/tlshd.conf exists with our config
  ansible.builtin.template:
    src: tlshd.conf.j2
    dest: /etc/tlshd.conf
    owner: root
    group: root
    mode: "0644"
  when: nfs_tls_enabled | default(false)
  notify: Restart tlshd

- name: Enable and start tlshd
  ansible.builtin.systemd:
    name: tlshd.service
    enabled: true
    state: started
    daemon_reload: true
  when: nfs_tls_enabled | default(false)

# Least-privilege cleanup: on a client-only host the wildcard *.esweiss.com
# cert/key are NOT needed. Under xprtsec=tls the client presents no cert and
# validates the server purely via the system truststore (tlshd.conf.j2 emits
# only x509.truststore in [authenticate.client] when nfs_tls_client_cert is
# false) — so the rendered config above references neither PEM on a client, and
# removing them after tlshd starts is safe. The wildcard private key can
# impersonate every internal *.esweiss.com service, so it must not linger here.
# This enforces the cert_distribution_targets trim in host_vars/dns-01.yml even
# if an earlier rollout already pushed a copy. Idempotent (state: absent). Runs
# on NEITHER the NFS server (pve-nas-01, nfs_tls_is_server) NOR an mTLS client
# (nfs_tls_client_cert) — both legitimately keep the cert/key.
- name: Remove wildcard cert + key on client-only hosts (least privilege)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ nfs_tls_cert_path }}"
    - "{{ nfs_tls_key_path }}"
  when:
    - nfs_tls_enabled | default(false)
    - not (nfs_tls_is_server | default(false))
    - not (nfs_tls_client_cert | default(false))

# Opt-out reconciliation: flipping nfs_tls_enabled back to false must not
# leave tlshd enabled and running with a stale /etc/tlshd.conf — mirror the
# zfs_encryption pattern of disabling units and removing files on de-listed
# hosts. Tolerate ONLY the missing-unit case (hosts that never had ktls-utils
# installed, so systemd knows no tlshd.service) — a blanket failed_when: false
# would silence a real regression (e.g. a typo'd unit name) and never
# reconcile anything.
- name: Stop and disable tlshd when NFS-TLS is opted out
  ansible.builtin.systemd:
    name: tlshd.service
    enabled: false
    state: stopped
  register: tlshd_optout
  failed_when:
    - tlshd_optout is failed
    - "'Could not find the requested service' not in (tlshd_optout.msg | default(''))"
  when: not (nfs_tls_enabled | default(false))

- name: Remove tlshd configuration when NFS-TLS is opted out
  ansible.builtin.file:
    path: /etc/tlshd.conf
    state: absent
  when: not (nfs_tls_enabled | default(false))
