---
# Tailscale VPN setup
# Note: `tailscale up` runs automatically when TAILSCALE_AUTH_KEY is injected
# via `op run`; otherwise the play ends with the exact manual command to run

- name: Create keyrings directory
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'
  when: ansible_facts['os_family'] == "Debian"

# The key is re-fetched on every run (force: true) so a rotated upstream
# signing key is picked up without manual file removal — but into a staging
# path, and fingerprint-verified BEFORE being copied into the trusted keyring
# location. Installing first and verifying after would leave a tampered
# download trusted by apt (tailscale.list already references the keyring path
# on established hosts) even though the play fails.
- name: Create staging file for Tailscale GPG key
  ansible.builtin.tempfile:
    state: file
    suffix: tailscale-gpg
  register: tailscale_gpg_staging
  changed_when: false
  check_mode: false
  when: ansible_facts['os_family'] == "Debian"

- name: Verify the Tailscale GPG key, then install it
  when: ansible_facts['os_family'] == "Debian"
  block:
    - name: Download Tailscale GPG key to staging path
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
        dest: "{{ tailscale_gpg_staging.path }}"
        mode: '0644'
        force: true
      changed_when: false

    - name: Verify Tailscale GPG key fingerprint (primary key must match exactly)
      ansible.builtin.shell: |
        set -o pipefail
        # Extract the primary key fingerprint (first fpr record after first pub)
        # and verify it matches the expected value exactly (full-line match).
        primary_fpr=$(gpg --show-keys --with-colons {{ tailscale_gpg_staging.path | quote }} 2>/dev/null \
            | awk -F: '/^pub/{p=1; next} p && /^fpr/{print $10; exit}')
        [ "$primary_fpr" = "2596A99EAAB33821893C0A79458CA832957F5868" ]
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install verified Tailscale GPG key
      ansible.builtin.copy:
        src: "{{ tailscale_gpg_staging.path }}"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        owner: root
        group: root
        mode: '0644'
        remote_src: true
  always:
    - name: Clean up the GPG key staging file
      ansible.builtin.file:
        path: "{{ tailscale_gpg_staging.path }}"
        state: absent
      changed_when: false
      check_mode: false

- name: Add Tailscale repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} main
    state: present
    filename: tailscale
  when: ansible_facts['os_family'] == "Debian"

- name: Install Tailscale (pinned version)
  ansible.builtin.apt:
    name: "tailscale={{ tailscale_version }}"
    state: present
    update_cache: true
    allow_downgrade: true
    allow_change_held_packages: true
  when:
    - ansible_facts['os_family'] == "Debian"

# Hold the package so a manual `apt upgrade` can't move Tailscale past the pin
# (pkgs.tailscale.com continuously serves newer builds). Mirrors the alloy/plex
# host-side pins; the install above sets allow_change_held_packages so a pinned
# re-install still proceeds through the hold.
- name: Hold Tailscale package to prevent unintended upgrades
  ansible.builtin.dpkg_selections:
    name: tailscale
    selection: hold
  when: ansible_facts['os_family'] == "Debian"

- name: Enable Tailscale service
  ansible.builtin.service:
    name: tailscaled
    state: started
    enabled: true

# Persisted in a role-owned sysctl.d drop-in (NOT the module's /etc/sysctl.conf
# default, and NOT nic_tuning's 99-nic-tuning-ip-forward.conf — that file is
# deleted by nic_tuning's disable path).
- name: Enable IP forwarding for subnet routing
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_file: /etc/sysctl.d/99-tailscale-ip-forward.conf
    sysctl_set: true
    state: present
    reload: true
  when: tailscale_advertise_routes | length > 0

# Removing the drop-in stops ip_forward being re-asserted at boot, but does NOT
# reset the live net.ipv4.ip_forward (a demoted subnet router keeps forwarding
# until reboot). Deliberately not forced to 0 here: nic_tuning independently owns
# ip_forward on the same Proxmox hosts (its own 99-nic-tuning-ip-forward.conf), so
# forcing 0 would fight that role. A reboot — or the owning role — re-establishes
# the correct value. This teardown path is dead code today (every host advertises
# 192.168.0.0/24).
- name: Remove ip_forward sysctl drop-in when subnet routing disabled
  ansible.builtin.file:
    path: /etc/sysctl.d/99-tailscale-ip-forward.conf
    state: absent
  when: tailscale_advertise_routes | length == 0

# Earlier revisions of this role persisted the value in /etc/sysctl.conf (the
# sysctl module default); remove that entry so the drop-in above is the single
# owner. Only matches the uncommented directive — the distribution's commented
# example line is left alone.
- name: Remove ip_forward entry from /etc/sysctl.conf
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    regexp: '^net\.ipv4\.ip_forward\s*='
    state: absent

- name: Create tailscaled systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/tailscaled.service.d
    state: directory
    mode: '0755'
  when: tailscale_advertise_routes | length > 0

# On Proxmox hosts, ip_forward can be reset to 0 during boot by bridge/network
# module initialization that occurs after systemd-sysctl. This drop-in ensures
# ip_forward is re-applied after tailscaled starts (which is after networking).
- name: Persist IP forwarding via tailscaled ExecStartPost
  ansible.builtin.copy:
    dest: /etc/systemd/system/tailscaled.service.d/ip-forward.conf
    mode: '0644'
    content: |
      [Service]
      ExecStartPost=-/sbin/sysctl -w net.ipv4.ip_forward=1
  when: tailscale_advertise_routes | length > 0
  notify: Reload and restart tailscaled

- name: Remove IP forwarding drop-in when subnet routing disabled
  ansible.builtin.file:
    path: /etc/systemd/system/tailscaled.service.d/ip-forward.conf
    state: absent
  when: tailscale_advertise_routes | length == 0
  notify: Reload and restart tailscaled


- name: Check Tailscale status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

# Auth key via TS_AUTHKEY env (tailscale reads it natively) so it never
# appears on the command line / in the process list.
#
# --advertise-tags is intentionally NOT passed here. Tag adoption is handled only
# by the best-effort `tailscale set --advertise-tags` reconcile task below. A tag
# on the initial `up` would HARD-FAIL a first-time join while the live ACL has no
# `tagOwners` entry yet (the migration window before the supervised ACL apply),
# or trigger an interactive reauth `up` cannot complete non-interactively —
# breaking the "pipeline stays green" staging contract. Decoupling keeps the join
# unconditional and lets the reconcile path adopt the tag once tagOwners exists.
- name: Authenticate Tailscale with auth key
  ansible.builtin.command: >
    tailscale up
    --accept-routes={{ tailscale_accept_routes | lower }}
    --accept-dns={{ tailscale_accept_dns | lower }}
    {% if tailscale_advertise_routes | length > 0 %}--advertise-routes={{ tailscale_advertise_routes | join(',') }}{% endif %}
    {% if tailscale_additional_flags is defined %}{{ tailscale_additional_flags | join(' ') }}{% endif %}
  environment:
    TS_AUTHKEY: "{{ lookup('ansible.builtin.env', 'TAILSCALE_AUTH_KEY') }}"
  when:
    - not ansible_check_mode
    - tailscale_status.rc != 0 or (tailscale_status.stdout | default('{}') | from_json).get('BackendState', '') != "Running"
    - lookup('ansible.builtin.env', 'TAILSCALE_AUTH_KEY', default='') != ''
  no_log: true
  register: tailscale_up
  changed_when: "'Success' in tailscale_up.stdout or tailscale_up.rc == 0"

# `tailscale up` above only runs for the initial authentication (gated on
# BackendState), so prefs edited in inventory afterwards would never reach an
# already-Running node. Reconcile them every run with `tailscale set`, which is
# idempotent and applies changes without re-auth. (Advertised routes still need
# approval in the admin console; this only sets the node's own prefs.)
# tailscale_additional_flags (e.g. --ssh, --operator) are applied only by the
# initial `up` — they rarely drift and --operator isn't a `tailscale set` pref.
# changed_when is false because `tailscale set` is idempotent and gives no
# reliable changed signal; a drift diff would need `tailscale debug prefs`.
- name: Reconcile Tailscale preferences on authenticated node
  ansible.builtin.command: >
    tailscale set
    --accept-routes={{ tailscale_accept_routes | lower }}
    --accept-dns={{ tailscale_accept_dns | lower }}
    --advertise-routes={{ tailscale_advertise_routes | join(',') }}
  when:
    - not ansible_check_mode
    - tailscale_status.rc == 0
    - (tailscale_status.stdout | default('{}') | from_json).get('BackendState', '') == "Running"
  changed_when: false

# ACL tags are reconciled in their own task (not folded into the route/DNS
# reconcile above). The FIRST transition of a user-owned device to a tag-owned
# identity requires an interactive reauthentication (Tailscale platform
# behavior), which this non-interactive run cannot complete — the supervised
# migration runbook (terraform/tailscale/README.md) drives that reauth and
# confirms adoption via `tailscale status`. Once a host is tagged, re-running
# this is a clean no-op. `tailscale set` only changes flags it is passed, so
# gating on a non-empty tag list means this never clears tags on hosts that
# advertise none. Keeping it separate ensures a mid-migration reauth prompt
# cannot fail the route/DNS reconcile that every host depends on.
#
# FAILURE HANDLING is a two-mode design so genuine errors are not masked:
#   - Default (tailscale_tags_require_adoption=false): BEST-EFFORT. A non-zero rc
#     does not fail the play — this is the pre-ACL-cutover / automatic-pipeline
#     state where "needs reauth" is expected and the pipeline must stay green.
#     The debug task below always prints rc + stderr, so an unexpected error
#     (invalid tag, daemon/permission fault) is still VISIBLE, not swallowed.
#   - Supervised adoption step (run with `-e tailscale_tags_require_adoption=true`
#     per the runbook, AFTER the ACL defines tagOwners): STRICT. Any non-zero rc
#     fails the play, so an adoption that silently fails on a host is caught
#     instead of leaving the lockdown half-applied behind a green run.
- name: Reconcile advertised Tailscale ACL tags on authenticated node
  ansible.builtin.command: >
    tailscale set
    --advertise-tags={{ tailscale_advertise_tags | join(',') }}
  when:
    - not ansible_check_mode
    - tailscale_advertise_tags | length > 0
    - tailscale_status.rc == 0
    - (tailscale_status.stdout | default('{}') | from_json).get('BackendState', '') == "Running"
  changed_when: false
  failed_when:
    - tailscale_tags_require_adoption | default(false) | bool
    - (tailscale_set_tags.rc | default(1)) != 0
  register: tailscale_set_tags

- name: Surface Tailscale tag reconciliation result
  ansible.builtin.debug:
    msg: >-
      {% if tailscale_set_tags is defined and tailscale_set_tags.rc is defined and tailscale_set_tags.rc != 0 %}
      Advertising {{ tailscale_advertise_tags | join(',') }} did not complete non-interactively
      (rc={{ tailscale_set_tags.rc }}; stderr={{ tailscale_set_tags.stderr | default('') | trim }}).
      Expected BEFORE the live ACL defines tagOwners (the host needs an interactive reauth to adopt
      the tag) — follow terraform/tailscale/README.md (tag adoption), then verify with `tailscale status`.
      If tagOwners already exists live and this persists, it is NOT the expected reauth case — investigate
      the stderr above. Re-run the supervised adoption step with `-e tailscale_tags_require_adoption=true`
      to make a non-zero result fail the play.
      {% else %}
      Advertised ACL tags reconciled: {{ tailscale_advertise_tags | join(',') }}
      {% endif %}
  when:
    - not ansible_check_mode
    - tailscale_advertise_tags | length > 0
    - tailscale_status.rc == 0
    - (tailscale_status.stdout | default('{}') | from_json).get('BackendState', '') == "Running"

- name: Display Tailscale authentication status
  ansible.builtin.debug:
    msg: |
      {% if tailscale_up is defined and tailscale_up.changed %}
      Tailscale authenticated successfully
      {% elif tailscale_status.rc == 0 and (tailscale_status.stdout | default('{}') | from_json).get('BackendState', '') == "Running" %}
      Tailscale already authenticated and running
      {% else %}
      WARNING: Tailscale authentication may need manual intervention
      Run:
      sudo tailscale up
      --accept-routes={{ tailscale_accept_routes | lower }}
      --accept-dns={{ tailscale_accept_dns | lower }}
      {% if tailscale_advertise_routes | length > 0 %}
      --advertise-routes={{ tailscale_advertise_routes | join(',') }}
      {% endif %}
      {% if tailscale_additional_flags is defined %}
      {{ tailscale_additional_flags | join(' ') }}
      {% endif %}
      {% if tailscale_advertise_tags | length > 0 %}
      Then adopt the ACL tag (after the ACL defines tagOwners): tailscale set --advertise-tags={{ tailscale_advertise_tags | join(',') }}
      (first tag adoption on a user-owned host needs a reauth — see terraform/tailscale/README.md)
      {% endif %}
      {% endif %}
  when: not ansible_check_mode
