---
# Tailscale VPN setup
# Note: tailscale up must be run manually with auth key to avoid storing keys in git

- name: Create keyrings directory
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'
  when: ansible_facts['os_family'] == "Debian"

- name: Check if Tailscale GPG key exists
  ansible.builtin.stat:
    path: /usr/share/keyrings/tailscale-archive-keyring.gpg
  register: tailscale_gpg_key
  when: ansible_facts['os_family'] == "Debian"

- name: Download Tailscale GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'
  when: ansible_facts['os_family'] == "Debian"
  register: gpg_download_result
  changed_when: gpg_download_result.changed and not tailscale_gpg_key.stat.exists

- name: Verify Tailscale GPG key fingerprint (primary key must match exactly)
  ansible.builtin.shell: |
    set -o pipefail
    # Extract the primary key fingerprint (first fpr record after first pub)
    # and verify it matches the expected value exactly (full-line match).
    primary_fpr=$(gpg --show-keys --with-colons /usr/share/keyrings/tailscale-archive-keyring.gpg 2>/dev/null \
        | awk -F: '/^pub/{p=1; next} p && /^fpr/{print $10; exit}')
    [ "$primary_fpr" = "2596A99EAAB33821893C0A79458CA832957F5868" ]
  args:
    executable: /bin/bash
  changed_when: false
  when: ansible_facts['os_family'] == "Debian"

- name: Add Tailscale repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} main
    state: present
    filename: tailscale
  when: ansible_facts['os_family'] == "Debian"

- name: Install Tailscale (pinned version)
  ansible.builtin.apt:
    name: "tailscale={{ tailscale_version }}"
    state: present
    update_cache: true
    allow_downgrade: true
  when:
    - ansible_facts['os_family'] == "Debian"

- name: Enable Tailscale service
  ansible.builtin.service:
    name: tailscaled
    state: started
    enabled: true

- name: Enable IP forwarding for subnet routing
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: true
    state: present
    reload: true
  when: tailscale_advertise_routes | length > 0

- name: Create tailscaled systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/tailscaled.service.d
    state: directory
    mode: '0755'
  when: tailscale_advertise_routes | length > 0

# On Proxmox hosts, ip_forward can be reset to 0 during boot by bridge/network
# module initialization that occurs after systemd-sysctl. This drop-in ensures
# ip_forward is re-applied after tailscaled starts (which is after networking).
- name: Persist IP forwarding via tailscaled ExecStartPost
  ansible.builtin.copy:
    dest: /etc/systemd/system/tailscaled.service.d/ip-forward.conf
    mode: '0644'
    content: |
      [Service]
      ExecStartPost=-/sbin/sysctl -w net.ipv4.ip_forward=1
  when: tailscale_advertise_routes | length > 0
  notify: Reload and restart tailscaled

- name: Remove IP forwarding drop-in when subnet routing disabled
  ansible.builtin.file:
    path: /etc/systemd/system/tailscaled.service.d/ip-forward.conf
    state: absent
  when: tailscale_advertise_routes | length == 0
  notify: Reload and restart tailscaled


- name: Check Tailscale status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Authenticate Tailscale with auth key
  ansible.builtin.command: >
    tailscale up
    --authkey={{ lookup('ansible.builtin.env', 'TAILSCALE_AUTH_KEY') }}
    --accept-routes={{ tailscale_accept_routes | lower }}
    --accept-dns={{ tailscale_accept_dns | lower }}
    {% if tailscale_advertise_routes | length > 0 %}--advertise-routes={{ tailscale_advertise_routes | join(',') }}{% endif %}
    {% if tailscale_additional_flags is defined %}{{ tailscale_additional_flags | join(' ') }}{% endif %}
  when:
    - not ansible_check_mode
    - tailscale_status.rc != 0 or (tailscale_status.stdout | default('{}') | from_json).get('BackendState', '') != "Running"
    - lookup('ansible.builtin.env', 'TAILSCALE_AUTH_KEY', default='') != ''
  no_log: true  # Don't log the auth key
  register: tailscale_up
  changed_when: "'Success' in tailscale_up.stdout or tailscale_up.rc == 0"

- name: Display Tailscale authentication status
  ansible.builtin.debug:
    msg: |
      {% if tailscale_up is defined and tailscale_up.changed %}
      Tailscale authenticated successfully
      {% elif tailscale_status.rc == 0 and (tailscale_status.stdout | default('{}') | from_json).get('BackendState', '') == "Running" %}
      Tailscale already authenticated and running
      {% else %}
      WARNING: Tailscale authentication may need manual intervention
      Run:
      sudo tailscale up
      --accept-routes={{ tailscale_accept_routes | lower }}
      --accept-dns={{ tailscale_accept_dns | lower }}
      {% if tailscale_advertise_routes | length > 0 %}
      --advertise-routes={{ tailscale_advertise_routes | join(',') }}
      {% endif %}
      {% if tailscale_additional_flags is defined %}
      {{ tailscale_additional_flags | join(' ') }}
      {% endif %}
      {% endif %}
  when: not ansible_check_mode
