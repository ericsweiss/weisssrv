---
# Prepare playbook: Initialize container for reliable testing
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule/tasks/prepare-base.yml

    - name: Disable apt background services
      ansible.builtin.import_tasks: ../../../../molecule/tasks/prepare-apt-disable.yml

    # Install ca-certificates so HTTPS downloads work (needed for GPG key + apt repo)
    - name: Install prerequisites for HTTPS downloads
      ansible.builtin.raw: |
        apt-get update -qq && apt-get install -y -qq ca-certificates curl gnupg
      changed_when: false
