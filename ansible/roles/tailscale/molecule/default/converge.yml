---
# Converge playbook for tailscale role testing
# Invokes the actual tailscale role to test:
# - GPG key deployment and repository setup
# - Version-pinned package installation
# - Service enablement
# - IP forwarding / sysctl configuration (when advertise_routes is set)
# - systemd drop-in for IP forwarding persistence
# Skips: tailscale up (requires auth key and network connectivity)
- name: Converge
  hosts: all
  become: true
  roles:
    - role: tailscale
