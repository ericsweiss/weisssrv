---
# zfs_arc_cap — cap the ZFS ARC on the compute Proxmox hosts.
#
# When set to a byte count, rendered into /etc/modprobe.d/zfs.conf as
# `options zfs zfs_arc_max=<bytes>`, baked into the initramfs (a Rebuild
# initramfs handler runs so the cap applies at EARLY boot, before the local-ssd
# pool imports and the ARC grows to the ~half-RAM default), and ALSO written to
# the running kernel's /sys/module/zfs/parameters/zfs_arc_max so a changed cap is
# live immediately (no reboot). Empty ("" = the default) -> the role is a no-op:
# it manages nothing and removes nothing.
#
# This is the COMPUTE counterpart to nas_storage's zfs_arc_max_bytes (which owns
# pve-nas-01's cap on a different playbook lifecycle). It exists because a
# VFIO-passthrough guest's RAM is host-pinned/mlock'd (non-reclaimable), so on a
# 62 GiB host an uncapped ARC (~31 GiB default) would collide with the pinned VM
# and thrash — see docs/43-gpu-passthrough.md.
zfs_arc_cap_max_bytes: ""

# Skip the update-initramfs handler (molecule / check-mode). The modprobe.d file
# still renders; only the initramfs rebuild — which needs a real /boot kernel —
# is suppressed so the role converges inside a plain CI container.
zfs_arc_cap_skip_initramfs: false
