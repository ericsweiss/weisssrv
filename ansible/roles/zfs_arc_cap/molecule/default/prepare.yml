---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    # Render-only scenario: the role never installs apt packages, so import the
    # shared prepare-base (systemd-wait + temp-dir) WITHOUT prepare-apt-disable
    # (mirrors resolv_conf / home_assistant).
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule/tasks/prepare-base.yml

    # The role writes /etc/modprobe.d/zfs.conf. That directory always exists on a
    # real Debian/Proxmox host (shipped by kmod), so the role deliberately does
    # NOT create it — but the minimal molecule image lacks it, which would fail
    # the template render with "Destination directory /etc/modprobe.d does not
    # exist". Seed it here (test fixture only). Mirrors nic_tuning's prepare.
    - name: Ensure /etc/modprobe.d exists (minimal test container may lack it)
      ansible.builtin.file:
        path: /etc/modprobe.d
        state: directory
        owner: root
        group: root
        mode: "0755"
