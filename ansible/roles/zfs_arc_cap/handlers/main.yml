---
# zfs_arc_max is a LOAD-TIME module parameter, and the local-ssd pool imports
# from the initramfs at early boot, so the cap must be baked into the initramfs
# to take effect there (a bare /etc/modprobe.d write applies only on the next
# module (re)load, which never happens for the already-loaded zfs module short
# of a reboot). Rebuild the initramfs whenever /etc/modprobe.d/zfs.conf changes.
# The running value is separately made authoritative by the sysfs task, so this
# only governs the NEXT-boot cap. Skipped in molecule/check-mode (no real /boot).
- name: Rebuild initramfs for zfs arc cap
  ansible.builtin.command: update-initramfs -u
  changed_when: true
  when: not (zfs_arc_cap_skip_initramfs | default(false))
