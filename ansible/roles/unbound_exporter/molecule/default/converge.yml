---
# Converge playbook for unbound_exporter role testing.
#
# We install the real .deb rather than dropping a mock binary. The role's
# version check uses `dpkg-query` (not file existence - see the comment in
# tasks/main.yml), so a mock script at /usr/bin/unbound_exporter doesn't
# satisfy the check: dpkg-query still returns rc=1, the role downloads
# and installs the real deb on top of the mock on first converge, and on
# the idempotence run the mock task overwrites the real binary again
# (`changed`) - idempotence fails. Installing the real .deb makes both
# runs match: first converge downloads+installs, idempotence skips
# install because dpkg-query now reports the pinned version.
#
# The unbound_exporter binary will fail to connect to the non-existent
# Unbound control socket inside the container, but the role's "Verify
# unbound_exporter is listening" task is tagged `molecule-notest` so the
# scenario doesn't actually require it to come up.
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    # Wait for apt locks to be released (unattended-upgrades runs on container startup)
    - name: Wait for apt locks to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
              fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
          sleep 1
        done
      args:
        executable: /bin/bash
      changed_when: false
      when: ansible_os_family == "Debian"

  roles:
    - role: unbound_exporter
