---
# Verify playbook for unbound_exporter role testing
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    # Verify binary is installed
    - name: Check if unbound_exporter binary exists
      ansible.builtin.stat:
        path: /usr/bin/unbound_exporter
      register: unbound_exporter_binary
      failed_when: not unbound_exporter_binary.stat.exists

    - name: Verify binary is executable
      ansible.builtin.assert:
        that:
          - unbound_exporter_binary.stat.executable
        fail_msg: "unbound_exporter binary is not executable"
        success_msg: "unbound_exporter binary is executable"

    # Verify systemd service file exists and has expected content
    - name: Check if systemd service file exists
      ansible.builtin.stat:
        path: /etc/systemd/system/unbound-exporter.service
      register: service_file
      failed_when: not service_file.stat.exists

    - name: Read service file content
      ansible.builtin.slurp:
        src: /etc/systemd/system/unbound-exporter.service
      register: service_content

    - name: Verify service file content
      ansible.builtin.assert:
        that:
          - "'Unbound Exporter for Prometheus' in (service_content.content | b64decode)"
          - "'/usr/bin/unbound_exporter' in (service_content.content | b64decode)"
          - "'9167' in (service_content.content | b64decode)"
          - "'unbound.ctl' in (service_content.content | b64decode)"
        fail_msg: "Service file missing expected configuration"
        success_msg: "Service file has correct configuration"

    # Verify service is enabled (may not be actively running with mock binary)
    - name: Check service status
      ansible.builtin.systemd:
        name: unbound-exporter
      register: service_status

    - name: Verify service is enabled
      ansible.builtin.assert:
        that:
          - service_status.status.UnitFileState == 'enabled'
        fail_msg: "unbound-exporter service is not enabled"
        success_msg: "unbound-exporter service is enabled"

    - name: Display test results
      ansible.builtin.debug:
        msg:
          - "unbound_exporter installed and configured:"
          - "  - Binary: /usr/bin/unbound_exporter (executable)"
          - "  - Service: unbound-exporter.service (enabled)"
          - "  - Port: 9167"
          - "(Real Unbound metrics require Unbound control socket)"
