---
# Scenario overrides; shared config in ansible/molecule/base.yml (ansible/TESTING.md).
platforms:
  - name: unbound-exporter-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  inventory:
    group_vars:
      all:
        unbound_exporter_version: 0.6.0
        # Same pinned sha256 as all.yml — without it the CI .deb installs
        # unverified (install.yml omits the checksum param when unset).
        unbound_exporter_checksum: "sha256:4f61876a292b49f918baf6b6b57d17dcf94f97513787282b0dadb88b95084890"
        unbound_exporter_port: 9167
