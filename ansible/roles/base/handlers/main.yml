---
# Handlers for base role

- name: Restart sshd
  ansible.builtin.service:
    name: "{{ ssh_service_name | default('sshd') }}"
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  when: fail2ban_enabled | default(true)
