---
# Handlers for base role

- name: Restart sshd
  ansible.builtin.service:
    name: "{{ ssh_service_name | default('sshd') }}"
    state: restarted

- name: Restart networking
  ansible.builtin.debug:
    msg: "DNS configuration updated - changes take effect immediately"
  changed_when: false

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  when: fail2ban_enabled | default(true)
