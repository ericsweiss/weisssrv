---
# Handlers for base role

- name: Restart sshd
  ansible.builtin.service:
    name: "{{ ssh_service_name | default('ssh') }}"
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# The e1000e fix unit is a RemainAfterExit oneshot, so `state: started` is a
# no-op once it has run. Restart it when the fix script changes so an updated
# offload list takes effect immediately (not deferred to the next reboot).
- name: Restart e1000e TSO fix service
  ansible.builtin.systemd:
    name: e1000e-tso-fix
    state: restarted
    daemon_reload: true

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  when: fail2ban_enabled | default(true)
