---
# Prepare playbook: Initialize container for reliable testing
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for systemd to be ready
      ansible.builtin.raw: |
        for i in $(seq 1 30); do
          if systemctl is-system-running 2>/dev/null | grep -qE '(running|degraded)'; then
            exit 0
          fi
          sleep 1
        done
        systemctl status >/dev/null 2>&1 && exit 0
        exit 1
      changed_when: false
      retries: 3
      delay: 2
      register: systemd_ready
      until: systemd_ready.rc == 0

    - name: Disable apt background services
      ansible.builtin.raw: |
        systemctl stop apt-daily.timer 2>/dev/null || true
        systemctl stop apt-daily-upgrade.timer 2>/dev/null || true
        systemctl stop unattended-upgrades.service 2>/dev/null || true
        systemctl disable apt-daily.timer 2>/dev/null || true
        systemctl disable apt-daily-upgrade.timer 2>/dev/null || true
        exit 0
      changed_when: false

    # Create ansible temp directory to prevent "Failed to create temporary directory" errors
    - name: Ensure ansible temp directory exists
      ansible.builtin.raw: |
        mkdir -p /root/.ansible/tmp
        chmod 700 /root/.ansible/tmp
      changed_when: false

    # openssh-server ships in the molecule image; host keys and the privilege
    # separation dir must exist for the role's sshd -t/-T validation to work
    # (/run is tmpfs, so /run/sshd is gone on every container start).
    - name: Ensure sshd host keys and runtime dir exist
      ansible.builtin.raw: |
        mkdir -p /run/sshd
        ssh-keygen -A
      changed_when: false

    # Seed a conflicting cloud-init style drop-in: the role's 00-hardening.conf
    # must sort ahead of it (sshd is FIRST-match-wins), which the role's own
    # sshd -T assert and the verify playbook prove.
    - name: Seed a conflicting 50-cloud-init.conf sshd drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/50-cloud-init.conf
        content: |
          PasswordAuthentication yes
        owner: root
        group: root
        mode: "0644"
