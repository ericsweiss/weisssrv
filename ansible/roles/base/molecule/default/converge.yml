---
# Converge playbook for base role testing
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    # Wait for apt locks to be released (unattended-upgrades runs on container startup)
    - name: Wait for apt locks to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
              fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
          sleep 1
        done
      args:
        executable: /bin/bash
      changed_when: false
      when: ansible_os_family == "Debian"

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - systemd
          - sudo
        state: present
      when: ansible_os_family == "Debian"

    - name: Create testuser before running base role
      ansible.builtin.user:
        name: testuser
        state: present
        create_home: true

  roles:
    - role: base
