---
# Verify playbook for base role testing
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Check if common packages are installed
      ansible.builtin.command: dpkg -l {{ item }}
      register: package_check
      changed_when: false
      failed_when: package_check.rc != 0
      loop:
        - curl
        - wget
        - neovim
        - htop
        - tmux
        - git
        - jq
        - unzip
        - rsync
        - net-tools
        - dnsutils
        - ca-certificates
        - gnupg
        - lsb-release

    - name: Verify testuser exists
      ansible.builtin.getent:
        database: passwd
        key: testuser
      register: testuser_check
      failed_when: testuser_check.ansible_facts.getent_passwd.testuser is not defined

    - name: Check testuser is in sudo group
      ansible.builtin.command: id testuser
      register: testuser_groups
      changed_when: false
      failed_when: "'sudo' not in testuser_groups.stdout"

    - name: Check if .ssh directory exists for testuser
      ansible.builtin.stat:
        path: /home/testuser/.ssh
      register: ssh_dir
      failed_when: not ssh_dir.stat.exists or ssh_dir.stat.mode != '0700'

    - name: Check if authorized_keys exists for testuser
      ansible.builtin.stat:
        path: /home/testuser/.ssh/authorized_keys
      register: auth_keys
      failed_when: not auth_keys.stat.exists

    - name: Read authorized_keys content
      ansible.builtin.slurp:
        src: /home/testuser/.ssh/authorized_keys
      register: auth_keys_content

    - name: Verify authorized_keys contains test key
      ansible.builtin.assert:
        that:
          - "'ssh-ed25519' in (auth_keys_content.content | b64decode)"
          - "'TestKeyForMolecule' in (auth_keys_content.content | b64decode)"
        fail_msg: "authorized_keys does not contain expected test key"
        success_msg: "authorized_keys contains expected test key"

    - name: Check sudoers file exists for testuser
      ansible.builtin.stat:
        path: /etc/sudoers.d/testuser
      register: sudoers_file
      failed_when: not sudoers_file.stat.exists

    - name: Read sudoers file content
      ansible.builtin.slurp:
        src: /etc/sudoers.d/testuser
      register: sudoers_content

    - name: Verify sudoers file has passwordless sudo
      ansible.builtin.assert:
        that:
          - "'testuser ALL=(ALL) NOPASSWD: ALL' in (sudoers_content.content | b64decode)"
        fail_msg: "sudoers file does not have passwordless sudo for testuser"
        success_msg: "testuser has passwordless sudo configured"

    - name: Check sudoers file permissions
      ansible.builtin.stat:
        path: /etc/sudoers.d/testuser
      register: sudoers_stat
      failed_when: sudoers_stat.stat.mode != '0440'

    - name: Verify sudoers file is valid syntax
      ansible.builtin.command: visudo -cf /etc/sudoers.d/testuser
      register: sudoers_syntax
      changed_when: false
      failed_when: sudoers_syntax.rc != 0

    - name: Verify timezone is set (symlink method for container)
      ansible.builtin.stat:
        path: /etc/localtime
      register: localtime_stat
      failed_when: not localtime_stat.stat.exists

    - name: Check if localtime points to correct timezone
      ansible.builtin.command: readlink -f /etc/localtime
      register: localtime_target
      changed_when: false

    - name: Verify timezone target
      ansible.builtin.assert:
        that:
          - "'America/Los_Angeles' in localtime_target.stdout"
        fail_msg: "Timezone is not set to America/Los_Angeles"
        success_msg: "Timezone correctly set to America/Los_Angeles"

    - name: Verify VM packages were NOT installed (container is not KVM)
      ansible.builtin.command: dpkg -l qemu-guest-agent
      register: qemu_check
      changed_when: false
      failed_when: false

    - name: Assert qemu-guest-agent is not installed
      ansible.builtin.assert:
        that:
          - qemu_check.rc != 0
        fail_msg: "qemu-guest-agent should not be installed in docker container"
        success_msg: "VM packages correctly skipped (not a KVM guest)"

    # Additional validations for testuser home directory
    - name: Check testuser home directory exists
      ansible.builtin.stat:
        path: /home/testuser
      register: testuser_home
      failed_when: not testuser_home.stat.exists or not testuser_home.stat.isdir

    - name: Verify testuser home directory ownership
      ansible.builtin.assert:
        that:
          - testuser_home.stat.pw_name == 'testuser'
          - testuser_home.stat.gr_name == 'testuser'
        fail_msg: "testuser home directory has incorrect ownership"
        success_msg: "testuser home directory has correct ownership"

    # resolv.conf template coverage lives in the resolv_conf role's own
    # molecule scenarios (default, empty-search); dns.yml is skipped here
    # because /etc/resolv.conf is a docker bind mount.

    # SSH hardening verification
    - name: Check the SSH hardening drop-in exists
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config.d/00-hardening.conf
      register: hardening_dropin
      failed_when: not hardening_dropin.stat.exists or hardening_dropin.stat.mode != '0644'

    - name: Read effective sshd configuration
      ansible.builtin.command: sshd -T
      register: sshd_effective
      changed_when: false

    # The prepare step seeds a conflicting 50-cloud-init.conf
    # (PasswordAuthentication yes); 00-hardening.conf must win under sshd's
    # first-match-wins precedence.
    - name: Verify hardening directives are effective despite the seeded conflict
      ansible.builtin.assert:
        that:
          - sshd_effective.stdout | lower is search('(?m)^passwordauthentication no$')
          - sshd_effective.stdout | lower is search('(?m)^permitrootlogin no$')
          - sshd_effective.stdout | lower is search('(?m)^port 22$')
        fail_msg: >-
          sshd -T does not reflect the hardening drop-in — the seeded
          50-cloud-init.conf conflict may have won over 00-hardening.conf
        success_msg: "SSH hardening effective (00-hardening.conf wins over 50-cloud-init.conf)"

    - name: Check SSH service is running
      ansible.builtin.systemd:
        name: ssh
      register: ssh_service_status

    - name: Verify SSH service state
      ansible.builtin.assert:
        that:
          - ssh_service_status.status.ActiveState == 'active'
          - ssh_service_status.status.UnitFileState == 'enabled'
        fail_msg: "ssh service is not active/enabled"
        success_msg: "ssh service is active and enabled"

    # Fail2ban verification
    - name: Check if fail2ban is installed
      ansible.builtin.command: dpkg -l fail2ban
      register: fail2ban_pkg
      changed_when: false
      failed_when: fail2ban_pkg.rc != 0

    - name: Check if fail2ban jail.local exists
      ansible.builtin.stat:
        path: /etc/fail2ban/jail.local
      register: jail_local
      failed_when: not jail_local.stat.exists

    - name: Read fail2ban jail.local content
      ansible.builtin.slurp:
        src: /etc/fail2ban/jail.local
      register: jail_local_content

    - name: Verify jail.local renders the container branch (this host is a container)
      ansible.builtin.assert:
        that:
          - "'ignoreip' in (jail_local_content.content | b64decode)"
          - "'127.0.0.1' in (jail_local_content.content | b64decode)"
          - "'[sshd]' in (jail_local_content.content | b64decode)"
          - "'enabled = true' in (jail_local_content.content | b64decode)"
          # Container branch: route banaction, no iptables, no recidive jail.
          - "'banaction = route' in (jail_local_content.content | b64decode)"
          - "'iptables-multiport' not in (jail_local_content.content | b64decode)"
          - "'[recidive]' not in (jail_local_content.content | b64decode)"
        fail_msg: "jail.local does not render the expected container-mode fail2ban configuration"
        success_msg: "jail.local renders the container branch (banaction = route, no recidive)"

    # Physical/VM branch coverage. The container above renders banaction=route;
    # the branch all 6 bare-metal Proxmox hosts use (iptables banaction,
    # recidive jail, pveproxy jail + proxmox.conf filter) is never rendered in a
    # container, so render jail.local.j2 + proxmox.conf.j2 with is_container=false
    # and the recidive/pveproxy jails on, then assert the physical branch.
    - name: Render the physical/VM branch of jail.local
      vars:
        # Role templates dir, derived without '../' (playbook_dir is
        # <role>/molecule/default).
        base_role_templates: "{{ playbook_dir | dirname | dirname }}/templates"
        is_container: false
        fail2ban_email_enabled: false
        fail2ban_ignoreip: ["127.0.0.1/8", "::1", "192.168.0.0/24"]
        fail2ban_default_bantime: "1h"
        fail2ban_default_findtime: "10m"
        fail2ban_default_maxretry: 5
        fail2ban_sshd_enabled: true
        fail2ban_sshd_port: 22
        fail2ban_sshd_maxretry: 5
        fail2ban_sshd_bantime: "1h"
        fail2ban_sshd_findtime: "10m"
        fail2ban_pveproxy_enabled: true
        fail2ban_pveproxy_port: 8006
        fail2ban_pveproxy_maxretry: 5
        fail2ban_pveproxy_bantime: "1h"
        fail2ban_pveproxy_findtime: "10m"
        fail2ban_recidive_enabled: true
        fail2ban_recidive_bantime: "1w"
        fail2ban_recidive_findtime: "1d"
        fail2ban_recidive_maxretry: 3
      ansible.builtin.template:
        src: "{{ base_role_templates }}/jail.local.j2"
        dest: /tmp/jail.local.physical
        mode: "0644"

    - name: Read the rendered physical jail.local
      ansible.builtin.slurp:
        src: /tmp/jail.local.physical
      register: jail_local_physical

    - name: Verify the physical branch renders iptables, recidive, and pveproxy
      ansible.builtin.assert:
        that:
          - "'banaction = iptables-multiport' in (jail_local_physical.content | b64decode)"
          - "'banaction_allports = iptables-allports' in (jail_local_physical.content | b64decode)"
          - "'[recidive]' in (jail_local_physical.content | b64decode)"
          - "'logpath = /var/log/fail2ban.log' in (jail_local_physical.content | b64decode)"
          - "'[proxmox]' in (jail_local_physical.content | b64decode)"
          - "'banaction = route' not in (jail_local_physical.content | b64decode)"
        fail_msg: "physical-branch jail.local missing iptables/recidive/pveproxy config"
        success_msg: "physical branch renders iptables banaction, recidive, and pveproxy jails"

    - name: Render the Proxmox pveproxy filter
      vars:
        base_role_templates: "{{ playbook_dir | dirname | dirname }}/templates"
      ansible.builtin.template:
        src: "{{ base_role_templates }}/proxmox.conf.j2"
        dest: /tmp/proxmox.conf.physical
        mode: "0644"

    - name: Read the rendered pveproxy filter
      ansible.builtin.slurp:
        src: /tmp/proxmox.conf.physical
      register: proxmox_filter_physical

    - name: Verify the pveproxy filter is a valid fail2ban filter
      ansible.builtin.assert:
        that:
          - "'[Definition]' in (proxmox_filter_physical.content | b64decode)"
          - "'failregex' in (proxmox_filter_physical.content | b64decode)"
          - "'<HOST>' in (proxmox_filter_physical.content | b64decode)"
        fail_msg: "proxmox.conf filter missing [Definition]/failregex/<HOST>"
        success_msg: "proxmox.conf renders a valid fail2ban filter with a HOST-capturing failregex"

    - name: Check fail2ban service status
      ansible.builtin.command: fail2ban-client status
      register: fail2ban_status
      changed_when: false
      failed_when: false

    - name: Verify fail2ban is running
      ansible.builtin.assert:
        that:
          - fail2ban_status.rc == 0
        fail_msg: "fail2ban is not running"
        success_msg: "fail2ban is running"

    - name: Check fail2ban sshd jail status
      ansible.builtin.command: fail2ban-client status sshd
      register: sshd_jail_status
      changed_when: false
      failed_when: false

    - name: Display fail2ban jail status
      ansible.builtin.debug:
        msg: "{{ sshd_jail_status.stdout_lines | default(['sshd jail status not available']) }}"
      when: sshd_jail_status.rc == 0
