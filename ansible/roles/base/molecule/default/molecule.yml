---
# Per-role Molecule scenario. Shared driver/provisioner/verifier/scenario config
# is inherited from ansible/molecule/base.yml (applied via the `-c` flag in
# test-all-roles.sh and the CI molecule-tests matrix). Only the per-role platform
# and inventory live here (plus role-specific provisioner.env / remote_tmp / a
# custom scenario where needed).
platforms:
  - name: base-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    prepare: prepare.yml
  inventory:
    group_vars:
      all:
        admin_user: testuser
        admin_email: test@test.local
        timezone: America/Los_Angeles
        skip_dns_config: true
        skip_sudoers_validation: true
        ssh_authorized_keys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAITestKeyForMolecule test@molecule
        common_packages:
          - curl
          - wget
          - neovim
          - htop
          - tmux
          - git
          - jq
          - unzip
          - rsync
          - net-tools
          - dnsutils
          - ca-certificates
          - gnupg
          - lsb-release
        vm_packages:
          - qemu-guest-agent
        fail2ban_enabled: true
        fail2ban_pveproxy_enabled: false
        fail2ban_recidive_enabled: false
        fail2ban_ignoreip:
          - 127.0.0.1/8
          - ::1
