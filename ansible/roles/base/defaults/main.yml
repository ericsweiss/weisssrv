---
# Default variables for base role

admin_user: eric

ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: false
ssh_pubkey_authentication: true
ssh_service_name: ssh

timezone: America/Los_Angeles

common_packages:
  - curl
  - wget
  - neovim
  - htop
  - tmux
  - git
  - jq
  - unzip
  - rsync
  - net-tools
  - dnsutils
  - ca-certificates
  - gnupg
  - lsb-release

# VM-specific packages (only installed on VMs, not LXC or bare metal)
vm_packages:
  - qemu-guest-agent

# SSH authorized keys to deploy
# ssh_authorized_keys:
#   - "ssh-ed25519 AAAA... user@host"

# ============================================================================
# Fail2ban Configuration
# ============================================================================
# Fail2ban provides intrusion prevention by banning IPs after failed auth attempts
# Enabled by default on all hosts for SSH protection
#
# LXC container mode uses banaction=route — see the header in
# tasks/fail2ban.yml for the trade-offs and references.

fail2ban_enabled: true

# Trusted networks that should never be banned
# Default: internal LAN and Tailscale networks
fail2ban_ignoreip:
  - 127.0.0.1/8
  - ::1
  - 192.168.0.0/24      # Internal LAN
  - 100.64.0.0/10       # Tailscale CGNAT range

# Default jail settings (can be overridden per-jail)
fail2ban_default_bantime: 1h       # Duration of IP ban
fail2ban_default_findtime: 10m     # Window to count failures
fail2ban_default_maxretry: 5       # Failures before ban

# Progressive ban multiplier for recidivists
# Each repeat offense multiplies bantime by this factor
fail2ban_recidive_enabled: true
fail2ban_recidive_bantime: 1w      # Ban repeat offenders for 1 week
fail2ban_recidive_findtime: 1d     # Look back 1 day for repeat bans
fail2ban_recidive_maxretry: 3      # 3 bans triggers recidive

# SSH jail configuration
fail2ban_sshd_enabled: true
fail2ban_sshd_port: "{{ ssh_port }}"
fail2ban_sshd_maxretry: 5
fail2ban_sshd_bantime: 1h
fail2ban_sshd_findtime: 10m

# Proxmox web UI (pveproxy) jail - only for Proxmox hosts
# Uses the custom 'proxmox' filter (filter.d/proxmox.conf) with the systemd journal backend
fail2ban_pveproxy_enabled: false  # Explicitly enabled on proxmox hosts
fail2ban_pveproxy_port: 8006
fail2ban_pveproxy_maxretry: 5
fail2ban_pveproxy_bantime: 1h
fail2ban_pveproxy_findtime: 10m

# Email notifications (optional - uses local SMTP relay)
fail2ban_email_enabled: false
fail2ban_email_dest: "{{ admin_email | default('root@localhost') }}"
fail2ban_email_sender: "fail2ban@{{ inventory_hostname }}"
fail2ban_email_action: "%(action_mwl)s"  # Ban with email + whois + log lines
