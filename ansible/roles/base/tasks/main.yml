---
# Base role: common packages, SSH hardening, and user setup

# Configure Proxmox repositories first (disable enterprise, enable community)
- name: Configure Proxmox repositories
  ansible.builtin.include_tasks: proxmox-repos.yml
  tags: [packages, base, proxmox-repos]

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"
  changed_when: false  # Cache updates are maintenance, not config changes
  tags: [packages, base]

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  when: ansible_facts['os_family'] == "Debian"
  tags: [packages, base]

- name: Detect if running in a VM
  ansible.builtin.set_fact:
    is_virtual_machine: "{{ ansible_facts['virtualization_role'] == 'guest' and ansible_facts['virtualization_type'] == 'kvm' }}"

- name: Install VM-specific packages
  ansible.builtin.apt:
    name: "{{ vm_packages }}"
    state: present
  when:
    - ansible_facts['os_family'] == "Debian"
    - is_virtual_machine | bool

- name: Enable and start qemu-guest-agent service
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started
  when:
    - ansible_facts['os_family'] == "Debian"
    - is_virtual_machine | bool

- name: Ensure admin user exists with sudo group
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: sudo
    append: true
    create_home: true
    state: present
  when: admin_user != 'root'
  tags: [users, security, base]

- name: Create .ssh directory for admin user
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.ssh"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"
  when: admin_user != 'root'

- name: Validate SSH keys are not empty
  ansible.builtin.assert:
    that:
      - item | trim | length > 0
      - "'ssh-' in item or 'ecdsa-' in item or 'sk-' in item"
    fail_msg: "SSH key appears empty or invalid. Ensure SSH_PUBLIC_KEY env var is set via 'op run'."
    quiet: true
  loop: "{{ ssh_authorized_keys | default([]) }}"
  when: ssh_authorized_keys is defined and ssh_authorized_keys | length > 0

- name: Deploy authorized_keys for admin user
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    state: present
    key: "{{ item }}"
  loop: "{{ ssh_authorized_keys | default([]) }}"
  when: ssh_authorized_keys is defined and ssh_authorized_keys | length > 0

- name: Configure sudoers for admin user (passwordless sudo)
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/{{ admin_user }}
    line: "{{ admin_user }} ALL=(ALL) NOPASSWD: ALL"
    create: true
    mode: "0440"
    validate: "{{ 'visudo -cf %s' if not (skip_sudoers_validation | default(false)) else omit }}"
  when: admin_user != 'root'

- name: Include SSH hardening tasks
  ansible.builtin.include_tasks: ssh.yml
  when: not (skip_ssh_config | default(false))
  tags: [ssh, security, base]

- name: Detect if running in a container (no hwclock access)
  ansible.builtin.set_fact:
    is_container: "{{ ansible_facts['virtualization_type'] | default('') in ['docker', 'lxc', 'container', 'podman'] }}"

- name: Set timezone (physical/VM - with hwclock)
  community.general.timezone:
    name: "{{ timezone }}"
    hwclock: UTC
  when:
    - timezone is defined
    - not (skip_timezone_config | default(false))
    - not is_container
  tags: [config, base]

- name: Set timezone (container - symlink only, no hwclock)
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ timezone }}"
    dest: /etc/localtime
    state: link
    force: true
  when:
    - timezone is defined
    - not (skip_timezone_config | default(false))
    - is_container
  tags: [config, base]

- name: Configure DNS servers
  ansible.builtin.include_tasks: dns.yml
  when: not (skip_dns_config | default(false))
  tags: [dns, networking, base]
