---
# Base role: common packages, SSH hardening, and user setup

# Configure Proxmox repositories first (disable enterprise, enable community)
- name: Configure Proxmox repositories
  ansible.builtin.include_tasks: proxmox-repos.yml
  tags: [packages, base, proxmox-repos]

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"
  changed_when: false  # Cache updates are maintenance, not config changes
  tags: [packages, base]

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  when: ansible_facts['os_family'] == "Debian"
  tags: [packages, base]

# Downstream tasks gate on this fact — it must exist for any --tags subset.
- name: Detect if running in a VM
  ansible.builtin.set_fact:
    is_virtual_machine: "{{ ansible_facts['virtualization_role'] == 'guest' and ansible_facts['virtualization_type'] == 'kvm' }}"
  tags: [always]

- name: Install VM-specific packages
  ansible.builtin.apt:
    name: "{{ vm_packages }}"
    state: present
  when:
    - ansible_facts['os_family'] == "Debian"
    - is_virtual_machine | bool
  tags: [packages, base]

- name: Enable and start qemu-guest-agent service
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started
  when:
    - ansible_facts['os_family'] == "Debian"
    - is_virtual_machine | bool
  tags: [packages, base]

# Disable unattended-upgrades on VMs to prevent unexpected updates/reboots
# We manage updates via controlled Task/Ansible workflows instead
- name: Check if unattended-upgrades is installed
  ansible.builtin.stat:
    path: /etc/apt/apt.conf.d/20auto-upgrades
  register: auto_upgrades_config
  when: is_virtual_machine | bool
  tags: [config, base]

- name: Disable unattended-upgrades auto-update
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      // Managed by Ansible - unattended-upgrades disabled
      // Updates are managed via Task/Ansible workflows
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Unattended-Upgrade "0";
      APT::Periodic::Download-Upgradeable-Packages "0";
      APT::Periodic::AutocleanInterval "0";
    mode: "0644"
    owner: root
    group: root
  when:
    - is_virtual_machine | bool
    - auto_upgrades_config.stat.exists | default(false)
  tags: [config, base]

- name: Stop and disable unattended-upgrades service
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: false
    state: stopped
  failed_when: false  # Service may not exist on all systems
  when: is_virtual_machine | bool
  tags: [config, base]

# OpenIPMI ships an LSB init script that tries to load IPMI drivers at boot.
# On hosts with no BMC/IPMI hardware the load fails ("ipmi_si: Unable to find
# any System Interface(s)"), leaving the unit failed and the whole system in
# 'degraded' state on every boot. Mask it where there's no IPMI device so the
# boot stays clean. No-op where openipmi isn't installed (VMs/containers/CI) or
# where real IPMI hardware exists. The role only masks (never unmasks): if a
# host later gains a BMC, re-enable manually with `systemctl unmask
# openipmi.service` — the conditional below won't auto-revert it.
- name: Check for IPMI hardware device
  ansible.builtin.stat:
    path: /dev/ipmi0
  register: base_ipmi_device
  tags: [config, base]

- name: Check whether openipmi init script is present
  ansible.builtin.stat:
    path: /etc/init.d/openipmi
  register: base_openipmi_initscript
  tags: [config, base]

- name: Mask openipmi.service on hosts without IPMI hardware
  ansible.builtin.systemd:
    name: openipmi.service
    masked: true
  failed_when: false  # Unit may not be generated yet on first run
  when:
    - base_openipmi_initscript.stat.exists
    - not base_ipmi_device.stat.exists
  tags: [config, base]

- name: Ensure admin user exists with sudo group
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: sudo
    append: true
    create_home: true
    state: present
  when: admin_user != 'root'
  tags: [users, security, base]

- name: Create .ssh directory for admin user
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.ssh"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"
  when: admin_user != 'root'
  tags: [ssh, users, security, base]

- name: Validate SSH keys are not empty
  ansible.builtin.assert:
    that:
      - item | trim | length > 0
      - "'ssh-' in item or 'ecdsa-' in item or 'sk-' in item"
    fail_msg: "SSH key appears empty or invalid. Ensure SSH_PUBLIC_KEY env var is set via 'op run'."
    quiet: true
  loop: "{{ ssh_authorized_keys | default([]) }}"
  when: ssh_authorized_keys is defined and ssh_authorized_keys | length > 0
  tags: [ssh, users, security, base]

- name: Deploy authorized_keys for admin user
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    state: present
    key: "{{ item }}"
  loop: "{{ ssh_authorized_keys | default([]) }}"
  when: ssh_authorized_keys is defined and ssh_authorized_keys | length > 0
  tags: [ssh, users, security, base]

- name: Configure sudoers for admin user (passwordless sudo)
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/{{ admin_user }}
    line: "{{ admin_user }} ALL=(ALL) NOPASSWD: ALL"
    create: true
    mode: "0440"
    validate: "{{ 'visudo -cf %s' if not (skip_sudoers_validation | default(false)) else omit }}"
  when: admin_user != 'root'
  tags: [ssh, users, security, base]

- name: Include SSH hardening tasks
  ansible.builtin.include_tasks: ssh.yml
  when: not (skip_ssh_config | default(false))
  tags: [ssh, security, base]

# Downstream tasks (timezone, fail2ban template) gate on this fact — it
# must exist for any --tags subset.
- name: Detect if running in a container (no hwclock access)
  ansible.builtin.set_fact:
    is_container: "{{ ansible_facts['virtualization_type'] | default('') in ['docker', 'lxc', 'container', 'podman'] }}"
  tags: [always]

- name: Set timezone (physical/VM - with hwclock)
  community.general.timezone:
    name: "{{ timezone }}"
    hwclock: UTC
  when:
    - timezone is defined
    - not (skip_timezone_config | default(false))
    - not is_container
  tags: [config, base]

- name: Set timezone (container - symlink only, no hwclock)
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ timezone }}"
    dest: /etc/localtime
    state: link
    force: true
  when:
    - timezone is defined
    - not (skip_timezone_config | default(false))
    - is_container
  tags: [config, base]

- name: Configure DNS servers
  ansible.builtin.include_tasks: dns.yml
  when: not (skip_dns_config | default(false))
  tags: [dns, networking, base]

# ============================================================================
# Intel e1000e NIC workaround
# The e1000e driver has known issues causing "Hardware Unit Hang" on
# I219-LM/I219-V NICs. Disabling TSO/GSO prevents these hangs.
# See: https://www.intel.com/content/www/us/en/support/articles/000057074/
# ============================================================================

- name: Check for Intel e1000e NIC
  ansible.builtin.shell: |
    set -o pipefail
    lspci | grep -i ethernet | grep -i intel | grep -qE 'I219|I218|I217' && echo 'yes' || echo 'no'
  args:
    executable: /bin/bash
  register: has_intel_e1000e
  changed_when: false
  failed_when: false
  when: not is_virtual_machine | default(false)
  tags: [networking, base]

- name: Install ethtool for NIC configuration
  ansible.builtin.apt:
    name: ethtool
    state: present
  when:
    - not is_virtual_machine | default(false)
    - has_intel_e1000e.stdout | default('no') == 'yes'
  tags: [networking, base]

- name: Install e1000e TSO fix script
  ansible.builtin.copy:
    src: e1000e-tso-fix.sh
    dest: /usr/local/sbin/e1000e-tso-fix.sh
    mode: "0755"
    owner: root
    group: root
  when:
    - not is_virtual_machine | default(false)
    - has_intel_e1000e.stdout | default('no') == 'yes'
  notify: Restart e1000e TSO fix service
  tags: [networking, base]

- name: Create e1000e TSO fix service
  ansible.builtin.copy:
    dest: /etc/systemd/system/e1000e-tso-fix.service
    content: |
      # Managed by Ansible - Intel e1000e Hardware Unit Hang workaround
      # Disables TSO/GSO/GRO on Intel I219/I218/I217 NICs to prevent driver hangs
      [Unit]
      Description=Disable TSO/GSO/GRO on Intel e1000e NICs
      After=network-pre.target
      Before=network.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/e1000e-tso-fix.sh

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
    owner: root
    group: root
  when:
    - not is_virtual_machine | default(false)
    - has_intel_e1000e.stdout | default('no') == 'yes'
  notify: Reload systemd
  tags: [networking, base]

- name: Enable and start e1000e TSO fix service
  ansible.builtin.systemd:
    name: e1000e-tso-fix
    enabled: true
    state: started
    daemon_reload: true
  when:
    - not is_virtual_machine | default(false)
    - has_intel_e1000e.stdout | default('no') == 'yes'
  tags: [networking, base]

# NOTE: The Aquantia/Marvell AQC113 GRO workaround lives in the `nic_tuning`
# role, which owns all NIC offload workarounds (declarative per-host
# `nic_tuning_overrides` + inline ethtool apply). pve-nas-01 disables GRO there.
#
# One-time cleanup: hosts deployed from the previous base role still carry the
# orphaned atlantic-gro-fix oneshot unit + script (nic_tuning uses a different
# mechanism, so they would otherwise linger as unmanaged config). Remove them.
# Safe to drop from this role once all AQC113 hosts have converged.
- name: Check for orphaned atlantic-gro-fix unit
  ansible.builtin.stat:
    path: /etc/systemd/system/atlantic-gro-fix.service
  register: atlantic_gro_orphan
  tags: [networking, base]

- name: Disable orphaned atlantic-gro-fix service
  ansible.builtin.systemd:
    name: atlantic-gro-fix.service
    enabled: false
    state: stopped
  when: atlantic_gro_orphan.stat.exists
  tags: [networking, base]

- name: Remove orphaned atlantic-gro-fix unit and script
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/atlantic-gro-fix.service
    - /usr/local/sbin/atlantic-gro-fix.sh
  when: atlantic_gro_orphan.stat.exists
  notify: Reload systemd
  tags: [networking, base]

# ============================================================================
# Fail2ban - Intrusion Prevention
# ============================================================================
# Protects against brute-force attacks on SSH and other services
# Whitelists internal LAN (192.168.0.0/24) and Tailscale (100.64.0.0/10)

- name: Include fail2ban tasks
  ansible.builtin.include_tasks: fail2ban.yml
  when: fail2ban_enabled | default(true)
  tags: [security, fail2ban, base]
