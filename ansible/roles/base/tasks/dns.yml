---
# Configure DNS servers on all hosts

- name: Set DNS servers for DNS containers (localhost)
  ansible.builtin.set_fact:
    host_dns_servers:
      - "127.0.0.1"
  when: inventory_hostname in groups['dns']

- name: Set DNS servers for all other hosts
  ansible.builtin.set_fact:
    host_dns_servers: "{{ dns_servers }}"
  when: inventory_hostname not in groups['dns']

- name: Configure /etc/resolv.conf with DNS servers
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart networking

- name: Check if resolv.conf is immutable
  ansible.builtin.command:
    cmd: lsattr /etc/resolv.conf
  register: resolv_conf_attrs
  changed_when: false
  failed_when: false

- name: Ensure resolv.conf is immutable
  ansible.builtin.command:
    cmd: chattr +i /etc/resolv.conf
  # lsattr output format: "----i---------e----- /etc/resolv.conf"
  # The 'i' appears at position 4 (0-indexed) when immutable is set
  # We check if there's an 'i' in the attributes portion (before the space)
  when: resolv_conf_attrs.stdout.split()[0] | default('') is not search('i')
  changed_when: true
  failed_when: false
