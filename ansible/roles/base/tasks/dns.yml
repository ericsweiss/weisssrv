---
# Configure DNS servers on all hosts

# DNS containers get external bootstrap DNS only while the local resolver
# stack is not yet answering (chicken-and-egg on first deploy: the unbound and
# adguard_home roles run later and switch resolv.conf to localhost). Once
# 127.0.0.1 resolves, keep it — otherwise a standalone base re-run would leave
# a healthy DNS container pointed at external DNS (and immutable) until the
# dns play next runs, breaking internal *.esweiss.com resolution.
- name: Probe the local resolver on DNS containers
  ansible.builtin.command:
    cmd: dig +short +time=2 +tries=1 @127.0.0.1 google.com A
  register: base_local_resolver_probe
  changed_when: false
  failed_when: false
  check_mode: false
  when: inventory_hostname in groups['dns']

- name: Set DNS servers for DNS containers
  ansible.builtin.set_fact:
    host_dns_servers: >-
      {{ ['127.0.0.1']
         if (base_local_resolver_probe.rc | default(1) == 0
             and base_local_resolver_probe.stdout | default('') | trim | length > 0)
         else ['1.1.1.1', '8.8.8.8'] }}
  when: inventory_hostname in groups['dns']

- name: Set DNS servers for all other hosts
  ansible.builtin.set_fact:
    host_dns_servers: "{{ dns_servers }}"
  when: inventory_hostname not in groups['dns']

# The immutable-flag (chattr) handling lives in the resolv_conf role.
# resolv.conf changes take effect immediately; no networking restart is needed.
- name: Configure /etc/resolv.conf with DNS servers
  ansible.builtin.include_role:
    name: resolv_conf
    apply:
      tags: [dns, networking, base]
  vars:
    resolv_conf_immutable: true
