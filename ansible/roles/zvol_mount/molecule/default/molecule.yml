---
# Molecule configuration for zvol_mount role testing
#
# Tests the role's logic using loopback devices to simulate SCSI-attached ZFS zvols.
# In production, Proxmox attaches zvols as SCSI devices with predictable paths:
#   /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi{N}
# Here we create a loopback device and symlink it to that path.
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: docker
platforms:
  - name: zvol-mount-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
    # Required for molecule_docker plugin (upstream broken conditional in destroy.yml)
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
  config_options:
    defaults:
      callbacks_enabled: profile_tasks, timer
      stdout_callback: ansible.builtin.default
      result_format: yaml
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        zvol_mount_disks:
          - name: test-data
            mount_point: /mnt/test-data
            fstype: ext4
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
