---
# Prepare playbook: Set up loopback device to simulate SCSI-attached ZFS zvol
#
# In production, Proxmox attaches zvols as SCSI devices with stable paths:
#   /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
# Docker containers don't have real SCSI devices, so we simulate this with:
#   1. A loopback device backed by a disk image file
#   2. A symlink at the expected SCSI path pointing to the loopback device
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for systemd to be ready
      ansible.builtin.raw: |
        for i in $(seq 1 30); do
          if systemctl is-system-running 2>/dev/null | grep -qE '(running|degraded)'; then
            exit 0
          fi
          sleep 1
        done
        systemctl status >/dev/null 2>&1 && exit 0
        exit 1
      changed_when: false
      retries: 3
      delay: 2
      register: systemd_ready
      until: systemd_ready.rc == 0

    - name: Disable apt background services
      ansible.builtin.raw: |
        systemctl stop apt-daily.timer 2>/dev/null || true
        systemctl stop apt-daily-upgrade.timer 2>/dev/null || true
        systemctl stop unattended-upgrades.service 2>/dev/null || true
        systemctl disable apt-daily.timer 2>/dev/null || true
        systemctl disable apt-daily-upgrade.timer 2>/dev/null || true
        exit 0
      changed_when: false

    # Create ansible temp directory to prevent "Failed to create temporary directory" errors
    - name: Ensure ansible temp directory exists
      ansible.builtin.raw: |
        mkdir -p /root/.ansible/tmp
        chmod 700 /root/.ansible/tmp
      changed_when: false

    # Gather facts now that ansible temp dir exists
    - name: Gather facts
      ansible.builtin.setup:

    # Install packages needed by the role (filesystem formatting and mount checks)
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - e2fsprogs
          - util-linux
        state: present
        update_cache: true

    # Create a loopback block device simulating a SCSI-attached zvol
    - name: Create test disk image (64MB)
      ansible.builtin.command: dd if=/dev/zero of=/tmp/test-disk.img bs=1M count=64
      args:
        creates: /tmp/test-disk.img

    # Loop devices are KERNEL-GLOBAL, but the /dev/loopN device NODES live in
    # each container's private /dev, which has no udev to create them. So
    # `losetup -f --show` gets a free number from the kernel (/dev/loop-control)
    # and then fails — "device node /dev/loopN (7:N) is lost. You may use
    # mknod(1) to recover it" — whenever that node was never materialized in
    # this container (job 20006 / the recurring zvol_mount retry-tax). Fix per
    # the error's own hint: ask the kernel for a free number, mknod that exact
    # node ourselves, then attach — retrying when a concurrent molecule job wins
    # the same number between our probe and our attach (loops are shared
    # host-wide). The -j probe makes a re-run reuse the existing attachment.
    - name: Attach loopback device (dynamic allocation, mknod recovery, race-safe)
      ansible.builtin.shell: |
        set -euo pipefail
        # NOTE: keep these comments apostrophe-free. ansible split_args tokenizes
        # the shell free-form value, so a stray single quote in a comment (a
        # contraction or possessive) trips "unbalanced quotes" at PARSE time.
        #
        # Loop devices are KERNEL-GLOBAL, but the /dev/loopN NODES live in a
        # per-container private /dev with no udev to materialize them, so a
        # kernel-allocated device has no node and losetup reports it "lost".
        # losetup can also print the path with a trailing " (lost)" annotation,
        # so trust ONLY the loop-index digits, rebuild a clean /dev/loopN path,
        # and recreate the node unconditionally (major 7 / minor N) -- which also
        # covers a missing, stale, or wrong node.
        loop_num() { n=${1##*loop}; printf '%s' "${n%%[!0-9]*}"; }
        node_for() {
          n=$(loop_num "$1"); [ -n "$n" ] || return 1
          d="/dev/loop$n"
          rm -f "$d" 2>/dev/null || true
          mknod "$d" b 7 "$n" 2>/dev/null || true
          [ -b "$d" ] || return 1   # mknod failed: do not hand back an invalid node
          printf '%s' "$d"
        }
        # Reuse an existing attachment (idempotent re-run); its node may be gone too.
        existing=$(losetup -j /tmp/test-disk.img 2>/dev/null | cut -d: -f1 | head -1 || true)
        if [ -n "$existing" ]; then
          d=$(node_for "$existing") && { printf '%s' "$d"; exit 0; }
        fi
        # Fresh allocation: get a free number, materialize its node, attach --
        # retry when a concurrent molecule job wins the number between our probe
        # and our attach (loops are shared host-wide).
        for _ in $(seq 1 10); do
          raw=$(losetup -f 2>/dev/null || true)
          [ -n "$raw" ] || { sleep 1; continue; }
          d=$(node_for "$raw") || { sleep 1; continue; }
          if losetup "$d" /tmp/test-disk.img 2>/dev/null; then
            printf '%s' "$d"
            exit 0
          fi
          sleep 1
        done
        echo "could not attach a loop device for /tmp/test-disk.img after 10 attempts" >&2
        exit 1
      args:
        executable: /bin/bash
      register: zvol_loop_device
      changed_when: false

    # This simulates what QEMU/Proxmox creates for SCSI-attached disks
    - name: Create /dev/disk/by-id directory
      ansible.builtin.file:
        path: /dev/disk/by-id
        state: directory
        mode: "0755"

    - name: Create symlink simulating SCSI device path
      ansible.builtin.file:
        src: "{{ zvol_loop_device.stdout | trim }}"
        dest: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
        state: link
        force: true
