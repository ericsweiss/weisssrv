---
# Verify playbook for zvol_mount role testing
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    # ========================================================================
    # 1. Mount point directory exists
    # ========================================================================
    - name: Check mount point directory exists
      ansible.builtin.stat:
        path: /mnt/test-data
      register: mount_dir
      failed_when: not mount_dir.stat.exists or not mount_dir.stat.isdir

    - name: Verify mount point permissions
      ansible.builtin.assert:
        that:
          - mount_dir.stat.mode == '0755'
        fail_msg: "Mount point /mnt/test-data has wrong permissions: {{ mount_dir.stat.mode }}"
        success_msg: "Mount point /mnt/test-data exists with correct permissions (0755)"

    # ========================================================================
    # 2. Device is formatted as ext4
    # ========================================================================
    - name: Check device filesystem type with blkid
      ansible.builtin.command: blkid -s TYPE -o value /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
      register: blkid_result
      changed_when: false
      failed_when: blkid_result.rc != 0

    - name: Verify filesystem is ext4
      ansible.builtin.assert:
        that:
          - blkid_result.stdout | trim == 'ext4'
        fail_msg: "Device is not ext4, got: {{ blkid_result.stdout | trim }}"
        success_msg: "Device is correctly formatted as ext4"

    # ========================================================================
    # 3. Device is mounted at the correct mount point
    # ========================================================================
    - name: Check device is mounted with findmnt
      ansible.builtin.command: findmnt -n -o TARGET --source /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
      register: findmnt_result
      changed_when: false
      failed_when: findmnt_result.rc != 0

    - name: Verify mount target is correct
      ansible.builtin.assert:
        that:
          - findmnt_result.stdout | trim == '/mnt/test-data'
        fail_msg: "Device mounted at '{{ findmnt_result.stdout | trim }}', expected '/mnt/test-data'"
        success_msg: "Device is correctly mounted at /mnt/test-data"

    # ========================================================================
    # 4. fstab entry exists with UUID and correct mount point
    # ========================================================================
    - name: Get filesystem UUID
      ansible.builtin.command: blkid -s UUID -o value /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
      register: disk_uuid
      changed_when: false
      failed_when: disk_uuid.rc != 0

    - name: Verify UUID is not empty
      ansible.builtin.assert:
        that:
          - disk_uuid.stdout | trim | length > 0
        fail_msg: "Device has no filesystem UUID"
        success_msg: "Device has UUID: {{ disk_uuid.stdout | trim }}"

    - name: Read fstab contents
      ansible.builtin.slurp:
        src: /etc/fstab
      register: fstab_content

    - name: Verify fstab contains UUID-based entry for mount point
      ansible.builtin.assert:
        that:
          - "'UUID=' ~ disk_uuid.stdout | trim in (fstab_content.content | b64decode)"
          - "'/mnt/test-data' in (fstab_content.content | b64decode)"
          - "'ext4' in (fstab_content.content | b64decode)"
        fail_msg: "fstab is missing UUID-based mount entry for /mnt/test-data"
        success_msg: "fstab contains correct UUID-based entry for /mnt/test-data"

    # ========================================================================
    # Summary
    # ========================================================================
    - name: Display test results
      ansible.builtin.debug:
        msg:
          - "Mount point /mnt/test-data exists with correct permissions"
          - "Device formatted as ext4"
          - "Device mounted at /mnt/test-data"
          - "fstab entry exists with UUID={{ disk_uuid.stdout | trim }}"
          - "All zvol_mount role verifications passed"
