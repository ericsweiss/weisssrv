---
# Mount ZFS zvols attached as SCSI devices by the proxmox_vm role
#
# IMPORTANT: Linux device naming (/dev/sdX) is NOT deterministic!
# We use /dev/disk/by-id/scsi-* symlinks which are stable across reboots.
# QEMU creates predictable IDs: scsi-0QEMU_QEMU_HARDDISK_drive-scsi{N}
# scsi0 is the root disk, so additional disks start at scsi1 (index 0 -> scsi1)
#
# Input: zvol_mount_disks - list of dicts with name, mount_point, fstype

- name: Reset zvol_mount_disk_devices for this invocation
  ansible.builtin.set_fact:
    zvol_mount_disk_devices: []

- name: Build disk device paths using stable QEMU SCSI IDs
  vars:
    # Use explicit scsi_slot if provided, else fall back to loop index + 1.
    # Explicit slots protect against SCSI reordering after VM hardware edits.
    scsi_slot: "{{ item.scsi_slot | default(idx + 1) }}"
    scsi_path: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi{{ scsi_slot }}"
    disk_entry:
      name: "{{ item.name }}"
      path: "{{ scsi_path }}"
      mount_point: "{{ item.mount_point }}"
      fstype: "{{ item.fstype }}"
  ansible.builtin.set_fact:
    zvol_mount_disk_devices: "{{ zvol_mount_disk_devices | default([]) + [disk_entry] }}"
  loop: "{{ zvol_mount_disks }}"
  loop_control:
    index_var: idx
    label: "{{ item.name }}"

- name: Check if additional disk device exists
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ zvol_mount_disk_devices | default([]) }}"
  loop_control:
    label: "{{ item.name }} ({{ item.path }})"
  register: disk_exists
  when: zvol_mount_disk_devices is defined

- name: Fail if disk device doesn't exist
  ansible.builtin.fail:
    msg: |
      Disk {{ item.item.name }} device {{ item.item.path }} does not exist!
      Check that the zvol is attached to the VM in Proxmox.
      Expected: {{ item.item.path }}
  loop: "{{ disk_exists.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - disk_exists is defined
    - not item.stat.exists

# Use lsblk -no FSTYPE to detect existing filesystems. Unlike blkid, which can
# return non-zero for transient I/O errors (leading to destructive reformat),
# lsblk returns empty string only when the disk is truly unformatted.
- name: Detect filesystem type on additional disks
  ansible.builtin.command: "lsblk -no FSTYPE {{ item.path }}"
  loop: "{{ zvol_mount_disk_devices | default([]) }}"
  loop_control:
    label: "{{ item.name }} ({{ item.path }})"
  register: disk_fstypes
  changed_when: false
  when: zvol_mount_disk_devices is defined

# Fail fast if a disk has an existing filesystem different from the expected type.
# Without this check, the next task would skip formatting (since the disk is "already formatted")
# but then try to mount it with the wrong fstype, which can fail at boot.
- name: Assert existing filesystem matches expected type (or disk is empty)
  ansible.builtin.assert:
    that:
      - (item.stdout | default('') | trim) in ['', item.item.fstype]
    fail_msg: >-
      Disk {{ item.item.name }} at {{ item.item.path }} has filesystem
      '{{ item.stdout | trim }}' but expected '{{ item.item.fstype }}'.
      Refusing to continue to avoid unsafe mounts.
    quiet: true
  loop: "{{ disk_fstypes.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }} ({{ item.item.path }})"
  when: zvol_mount_disk_devices is defined

- name: Format additional disks only when no filesystem exists
  community.general.filesystem:
    fstype: "{{ item.item.fstype }}"
    dev: "{{ item.item.path }}"
  loop: "{{ disk_fstypes.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }} ({{ item.item.path }})"
  when:
    - not ansible_check_mode  # Never format disks in check mode
    - zvol_mount_disk_devices is defined
    - (item.stdout | default('') | trim) == ''

# After formatting, discover the filesystem UUID for stable mounting
# This avoids reliance on positional /dev/sdX names which can change
- name: Get filesystem UUID for additional disks
  ansible.builtin.command: "blkid -s UUID -o value {{ item.path }}"
  loop: "{{ zvol_mount_disk_devices | default([]) }}"
  loop_control:
    label: "{{ item.name }} ({{ item.path }})"
  register: disk_uuids
  changed_when: false
  # In check mode with unformatted disks, blkid will fail (disk not formatted yet)
  # We allow failure in check mode since we can't format disks in check mode anyway
  failed_when: false
  when: zvol_mount_disk_devices is defined

# Fail early if any disk doesn't have a valid UUID (prevents empty UUID in fstab)
- name: Validate all additional disks have UUIDs
  ansible.builtin.assert:
    that:
      - item.stdout | length > 0
    fail_msg: |
      Disk {{ item.item.name }} ({{ item.item.path }}) has no filesystem UUID!
      This usually means the disk is not attached or not formatted.
    quiet: true
  loop: "{{ disk_uuids.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - zvol_mount_disk_devices is defined
    - disk_uuids is defined
    - not ansible_check_mode  # Skip validation in check mode (disks may not be formatted)

- name: Create mount points for additional disks
  ansible.builtin.file:
    path: "{{ item.mount_point }}"
    state: directory
    mode: "0755"
  loop: "{{ zvol_mount_disk_devices | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: zvol_mount_disk_devices is defined

# Check if any disk is currently mounted at a WRONG location
# This can happen if device naming changed (/dev/sdX is non-deterministic)
- name: Check current mount status of additional disks
  ansible.builtin.shell: |
    findmnt -n -o TARGET "UUID={{ item.1.stdout | trim }}" 2>/dev/null || echo "not-mounted"
  args:
    executable: /bin/bash
  loop: "{{ zvol_mount_disk_devices | zip(disk_uuids.results) | list }}"
  loop_control:
    label: "{{ item.0.name }}"
  register: current_mounts
  changed_when: false
  when:
    - zvol_mount_fix_wrong_locations | default(true)
    - zvol_mount_disk_devices is defined
    - disk_uuids is defined

# Unmount disks that are mounted at incorrect locations
- name: Unmount disks mounted at wrong locations
  ansible.posix.mount:
    path: "{{ item.stdout | trim }}"
    state: unmounted
  loop: "{{ current_mounts.results | default([]) }}"
  loop_control:
    label: "{{ item.item.0.name }}: {{ item.stdout | trim }} (should be {{ item.item.0.mount_point }})"
  when:
    - zvol_mount_fix_wrong_locations | default(true)
    - current_mounts is defined
    - item.stdout | trim != "not-mounted"
    - item.stdout | trim != item.item.0.mount_point

# Clean up incorrect fstab entries for these UUIDs (only when wrong mount detected)
- name: Remove incorrect fstab entries
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^UUID={{ item.item.1.stdout | trim }}\\s+"
    state: absent
  loop: "{{ current_mounts.results | default([]) }}"
  loop_control:
    label: "{{ item.item.0.name }}"
  when:
    - zvol_mount_fix_wrong_locations | default(true)
    - current_mounts is defined
    - item.stdout | trim != "not-mounted"
    - item.stdout | trim != item.item.0.mount_point

- name: Mount additional disks by UUID
  ansible.posix.mount:
    path: "{{ item.0.mount_point }}"
    src: "UUID={{ item.1.stdout | trim }}"
    fstype: "{{ item.0.fstype }}"
    # CRITICAL: Do NOT use nofail - if disk fails to mount, services must not start
    # (prevents writing to empty mountpoint on root disk, causing split-brain data)
    # x-systemd.device-timeout: fail fast if device doesn't appear (30s)
    opts: defaults,noatime,x-systemd.device-timeout=30
    state: mounted
  loop: "{{ zvol_mount_disk_devices | zip(disk_uuids.results) | list }}"
  loop_control:
    label: "{{ item.0.name }} (UUID={{ item.1.stdout | default('pending') }}) -> {{ item.0.mount_point }}"
  when:
    - zvol_mount_disk_devices is defined
    - disk_uuids is defined
    # In check mode, skip mount if UUID is missing (disk may not be formatted yet)
    - not ansible_check_mode or (item.1.stdout | default('') | length > 0)
