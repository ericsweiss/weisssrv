---
# K3s installation defaults

# Pin the GitLab container registry's external hostname to the internal Traefik
# VIP in each node's /etc/hosts. The external name (registry.git.ericsweiss.com)
# otherwise resolves to a public IP via the upstream/Cloudflare path, whose DNS
# lookup intermittently fails ("Try again") and flakes CI image pulls. A local
# pin skips the DNS query entirely and uses the direct internal Traefik path.
# TLS is unaffected: Traefik serves the existing cert for this hostname (the pin
# only overrides the A record; SNI/validation still use the hostname). Empty list
# disables. (Verify per-node after deploy: `getent hosts <name>` -> the VIP, and a
# test image pull succeeds — roll to one agent first.)
k3s_registry_host_pins:
  - name: "registry.git.{{ external_domain | default('ericsweiss.com') }}"
    ip: "192.168.0.101"

# K3s version and installation
# Note: Version should be set in group_vars/k3s.yml or all.yml
# This is a fallback default
k3s_version: "v1.35.3+k3s1"

# Agent (worker) join token, used for agent installs and the server config's
# `agent-token`. Defaults to the server token so the role is self-contained
# (molecule sets only k3s_token); prod overrides it in group_vars/k3s.yml with a
# dedicated lower-privilege token. See group_vars/k3s.yml and docs/19.
k3s_agent_token: "{{ k3s_token }}"

# Pin to a specific k3s release tag instead of the mutable get.k3s.io redirect.
# This fixes the installer URL path (not the bytes) per version. The script is
# downloaded to a local file and executed separately (no `curl | sh`), so its
# integrity can optionally be pinned via k3s_install_script_checksum below.
k3s_install_script_url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version }}/install.sh"
# Optional sha256 pin for the install.sh fetched above. Empty by default => the
# get_url checksum: param is omitted. Set in all.yml alongside k3s_version
# (e.g. "sha256:<hex>") to verify the root-run installer script before exec,
# mirroring zfs_exporter_checksum. install.sh itself already verifies the k3s
# binary's sha256 against the GitHub release; this closes the gap on the script.
k3s_install_script_checksum: ""

# Role configuration
k3s_role: agent  # or 'server'
k3s_is_first_server: false

# Network configuration
k3s_api_vip: 192.168.0.161
k3s_api_port: 6443
k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"

# Components to disable
k3s_disable:
  - servicelb
  - traefik

# Flannel CNI backend. Default to wireguard-native so cross-node pod traffic
# is encrypted out of the box; a standalone consumer of this role (or a dropped
# group_var) gets the secure backend rather than plaintext vxlan. Set to vxlan
# to roll back (see group_vars/k3s.yml for the full rationale and caveats).
k3s_flannel_backend: "wireguard-native"

# Node configuration
k3s_labels: {}
k3s_taints: []

# kube-vip configuration
# Note: Version should be set in group_vars/k3s.yml or all.yml (all.yml pins the
# live value). Keep this default aligned with all.yml's kube_vip_version so a
# standalone run or a dropped group_var does not silently regress the API VIP.
kube_vip_version: "v1.2.0"
kube_vip_interface: "eth0"
