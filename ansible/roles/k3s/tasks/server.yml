---
# K3s server installation

- name: Validate required k3s variables
  ansible.builtin.assert:
    that:
      - k3s_token is defined
      - k3s_token | length > 0
      - k3s_version is defined
      - k3s_version | length > 0
      - k3s_api_vip is defined
      - k3s_api_vip | length > 0
    fail_msg: >-
      Required k3s variables are not set. Ensure K3S_TOKEN environment variable
      is provided via 'op run' and k3s_version/k3s_api_vip are set in group_vars.
      Run deployment with: task k3s:deploy (which injects 1Password secrets)
    success_msg: "Required k3s variables are present"
  tags: [validation, always]

- name: Debug - Show k3s server configuration variables
  ansible.builtin.debug:
    msg:
      - "Host: {{ inventory_hostname }}"
      - "k3s_role: {{ k3s_role }}"
      - "k3s_is_first_server: {{ k3s_is_first_server | default(false) }}"
      - "k3s_api_vip: {{ k3s_api_vip }}"
      - "Config will be written to: /etc/rancher/k3s/config.yaml"
  tags: [debug]

# Rebuild guard: k3s_is_first_server is pinned in hosts.yml, so a wiped/rebuilt
# first server would otherwise render `cluster-init: true` and bootstrap a NEW
# single-node etcd cluster (fresh CA) while the surviving servers still hold the
# old quorum — with both sides' kube-vip contending for the API VIP. If this
# node has no local etcd data but the VIP already serves a cluster, render the
# join stanza instead. A healthy first server keeps cluster-init (etcd data
# present, so the probe is skipped; the flag is a no-op on an initialized
# datastore), and a genuine first bootstrap (no data, dead VIP) still inits.
- name: Check for existing local etcd data
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/db/etcd
  register: k3s_local_etcd

- name: Probe the API VIP for an existing cluster (rebuilt first-server guard)
  ansible.builtin.uri:
    url: "https://{{ k3s_api_vip }}:{{ k3s_api_port }}/ping"
    validate_certs: false
    timeout: 5
  register: k3s_vip_probe
  # Any HTTP response (status != -1) proves an apiserver holds the VIP; a
  # connection failure (fresh bootstrap) is the expected negative, not an error.
  failed_when: false
  check_mode: false
  # Retry so a single transient VIP blip during a rebuild cannot mis-select
  # cluster-init and split-brain. until-exhaustion (VIP dead across ~21s) marks
  # the task failed even with failed_when:false, so ignore_errors keeps that
  # legitimate fresh-bootstrap negative from aborting the play.
  retries: 3
  delay: 3
  until: (k3s_vip_probe.status | default(-1)) != -1
  ignore_errors: true
  when:
    - k3s_is_first_server | default(false)
    - not k3s_local_etcd.stat.exists
    - not (skip_k3s_install | default(false))

- name: Force join mode when the cluster already exists elsewhere
  ansible.builtin.set_fact:
    k3s_join_existing: "{{ (k3s_vip_probe.status | default(-1)) != -1 }}"
  when: k3s_vip_probe is not skipped

- name: Deploy k3s server config
  ansible.builtin.template:
    src: k3s-server-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  # Config now renders agent-token (a cluster secret); no_log keeps it out of
  # task output and --diff.
  no_log: true
  notify:
    - Restart k3s
    - Wait for k3s API healthy

- name: Verify config file was created
  ansible.builtin.stat:
    path: /etc/rancher/k3s/config.yaml
  register: config_file_stat
  when: not ansible_check_mode

- name: Assert config file exists
  ansible.builtin.assert:
    that:
      - config_file_stat.stat.exists
    fail_msg: "Config file was NOT created at /etc/rancher/k3s/config.yaml!"
    success_msg: "Config file successfully created at /etc/rancher/k3s/config.yaml"
  when: not ansible_check_mode

- name: Create manifests directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    mode: "0755"
  when: k3s_is_first_server | default(false)

# Runs on every server (kube-vip announces the API VIP from each control-plane
# node): a NIC-name mismatch would otherwise let kube-vip start but silently fail
# to bring up the VIP. Fail loudly at deploy time instead.
- name: Assert the kube-vip interface exists on this server
  ansible.builtin.assert:
    that:
      - kube_vip_interface in (ansible_facts.interfaces | default([]))
    fail_msg: >-
      kube_vip_interface '{{ kube_vip_interface }}' is not a NIC on
      {{ inventory_hostname }} (have:
      {{ ansible_facts.interfaces | default([]) | sort | join(', ') }}). The API VIP
      ({{ k3s_api_vip | default('?') }}) would silently fail to announce. Set
      kube_vip_interface in group_vars/k3s.yml or host_vars to the right interface.
    success_msg: "kube-vip interface {{ kube_vip_interface }} present"

- name: Deploy kube-vip manifest (first server only)
  ansible.builtin.template:
    src: kube-vip-manifest.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/kube-vip.yaml
    mode: "0600"
  when: k3s_is_first_server | default(false)

# A rebuilt/rejoined etcd server's on-disk cred/passwd diverges from the
# datastore bootstrap entry, so k3s fatals "cred/passwd newer than datastore"
# on EVERY restart and cannot self-heal (it only writes disk->datastore for the
# first server / --cluster-reset; see k3s-io/k3s#4910). An ExecStartPre drop-in
# reconciles it from the datastore before each start: a no-op for an in-sync
# server (recreates identical content), the documented remedy for a diverged
# one. Installed before the (re)start below so it is in effect when k3s starts.
- name: Ensure k3s systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install cred/passwd datastore-reconcile drop-in (etcd-member restart safety)
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service.d/50-reconcile-cred-passwd.conf
    content: |
      # Managed by Ansible (k3s role). Reconcile cred/passwd from the datastore
      # before each start so a rebuilt/rejoined etcd member does not fatal
      # "cred/passwd newer than datastore" on restart. See k3s-io/k3s#4910.
      [Service]
      ExecStartPre=-/usr/bin/rm -f /var/lib/rancher/k3s/server/cred/passwd
    owner: root
    group: root
    mode: "0644"
  register: k3s_cred_reconcile_dropin

# Inline (not a handler) on purpose: the reload must precede the k3s (re)start
# below so the ExecStartPre is in effect, whereas handlers only flush at play end.
- name: Reload systemd when the cred reconcile drop-in changes  # noqa: no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: k3s_cred_reconcile_dropin is changed

# Version detection + install-script staging (shared with agent.yml)
- name: Detect k3s version and stage install script
  ansible.builtin.include_tasks: install-script.yml

- name: Install or upgrade k3s server
  ansible.builtin.command: /root/k3s-install.sh server
  environment:
    K3S_TOKEN: "{{ k3s_token }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when:
    - k3s_needs_install | bool
    - not (skip_k3s_install | default(false))
  notify:
    - Restart k3s
    - Wait for k3s API healthy
  changed_when: true
  no_log: true

- name: Wait for k3s to be ready
  ansible.builtin.command: k3s kubectl get nodes
  register: k3s_ready
  retries: 30
  delay: 10
  until: k3s_ready.rc == 0
  changed_when: false
  when: not (skip_k3s_install | default(false))

- name: Wait for kube-vip to assign VIP
  ansible.builtin.wait_for:
    host: "{{ k3s_api_vip }}"
    port: "{{ k3s_api_port }}"
    timeout: 120
  when:
    - k3s_is_first_server | default(false)
    - not (skip_k3s_install | default(false))

- name: Apply node labels
  ansible.builtin.command: >
    k3s kubectl label node {{ inventory_hostname }}
    {{ item.key }}={{ item.value }} --overwrite
  loop: "{{ k3s_labels | dict2items }}"
  when:
    - k3s_labels | length > 0
    - not (skip_k3s_install | default(false))
  register: k3s_label_result
  # kubectl prints "node/X labeled" on mutation, "node/X not labeled" on no-op.
  changed_when: "' not labeled' not in (k3s_label_result.stdout | default(''))"

- name: Apply node taints
  ansible.builtin.command: >
    k3s kubectl taint node {{ inventory_hostname }}
    {{ item.key }}={{ item.value }}:{{ item.effect }} --overwrite
  loop: "{{ k3s_taints }}"
  when:
    - k3s_taints | length > 0
    - not (skip_k3s_install | default(false))
  register: k3s_taint_result
  # kubectl prints "node/X tainted/untainted/modified" on mutation.
  changed_when: >-
    ('tainted' in (k3s_taint_result.stdout | default('')))
    or ('modified' in (k3s_taint_result.stdout | default('')))

# Off-node etcd snapshot copy (docs/17). Server nodes hold the etcd snapshots on
# local disk only; this copies the newest one to pve-nas-01 so losing all three
# servers (or their Proxmox hosts) does not lose etcd. Opt-in — off by default
# until the companion NFS export + node_exporter_host exist (see defaults).
# No skip_k3s_install gate: the container-hostile steps inside (NFS mount, tlshd
# assert, timer enable+start) are molecule-notest-tagged, and the rest are pure
# file/template ops that don't need k3s installed — so molecule can render and
# assert the artifacts. Prod never sets skip_k3s_install.
- name: Configure off-node etcd snapshot copy
  ansible.builtin.include_tasks: etcd-snapshot-offnode.yml
  when: k3s_etcd_snapshot_offnode_enabled | bool
