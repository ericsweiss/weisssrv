---
# K3s server installation

- name: Validate required k3s variables
  ansible.builtin.assert:
    that:
      - k3s_token is defined
      - k3s_token | length > 0
      - k3s_version is defined
      - k3s_version | length > 0
      - k3s_api_vip is defined
      - k3s_api_vip | length > 0
    fail_msg: >-
      Required k3s variables are not set. Ensure K3S_TOKEN environment variable
      is provided via 'op run' and k3s_version/k3s_api_vip are set in group_vars.
      Run deployment with: task k3s:deploy (which injects 1Password secrets)
    success_msg: "Required k3s variables are present"
  tags: [validation, always]

- name: Debug - Show k3s server configuration variables
  ansible.builtin.debug:
    msg:
      - "Host: {{ inventory_hostname }}"
      - "k3s_role: {{ k3s_role }}"
      - "k3s_is_first_server: {{ k3s_is_first_server | default(false) }}"
      - "k3s_api_vip: {{ k3s_api_vip }}"
      - "Config will be written to: /etc/rancher/k3s/config.yaml"
  tags: [debug]

- name: Deploy k3s server config
  ansible.builtin.template:
    src: k3s-server-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify:
    - Restart k3s
    - Wait for k3s API healthy

- name: Verify config file was created
  ansible.builtin.stat:
    path: /etc/rancher/k3s/config.yaml
  register: config_file_stat
  when: not ansible_check_mode

- name: Assert config file exists
  ansible.builtin.assert:
    that:
      - config_file_stat.stat.exists
    fail_msg: "Config file was NOT created at /etc/rancher/k3s/config.yaml!"
    success_msg: "Config file successfully created at /etc/rancher/k3s/config.yaml"
  when: not ansible_check_mode

- name: Create manifests directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    mode: "0755"
  when: k3s_is_first_server | default(false)

# Runs on every server (kube-vip announces the API VIP from each control-plane
# node): a NIC-name mismatch would otherwise let kube-vip start but silently fail
# to bring up the VIP. Fail loudly at deploy time instead.
- name: Assert the kube-vip interface exists on this server
  ansible.builtin.assert:
    that:
      - kube_vip_interface in (ansible_facts.interfaces | default([]))
    fail_msg: >-
      kube_vip_interface '{{ kube_vip_interface }}' is not a NIC on
      {{ inventory_hostname }} (have:
      {{ ansible_facts.interfaces | default([]) | join(', ') }}). The API VIP
      ({{ k3s_api_vip | default('?') }}) would silently fail to announce. Set
      kube_vip_interface in group_vars/k3s.yml or host_vars to the right interface.
    success_msg: "kube-vip interface {{ kube_vip_interface }} present"

- name: Deploy kube-vip manifest (first server only)
  ansible.builtin.template:
    src: kube-vip-manifest.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/kube-vip.yaml
    mode: "0600"
  when: k3s_is_first_server | default(false)

- name: Check current k3s version
  ansible.builtin.command: k3s --version
  register: k3s_current_version
  changed_when: false
  failed_when: false

- name: Parse current k3s version
  ansible.builtin.set_fact:
    k3s_installed_version: "{{ k3s_current_version.stdout | regex_search('v[0-9]+\\.[0-9]+\\.[0-9]+\\+k3s[0-9]+') | default('') }}"
  when: k3s_current_version.rc == 0

- name: Debug k3s version info
  ansible.builtin.debug:
    msg:
      - "Installed version: {{ k3s_installed_version | default('not installed') }}"
      - "Target version: {{ k3s_version }}"
      - "Needs install/upgrade: {{ k3s_current_version.rc != 0 or (k3s_installed_version | default('')) != k3s_version }}"
  tags: [debug]

- name: Download k3s install script
  ansible.builtin.get_url:
    # Download and execute are deliberately separate tasks (no `curl | sh`) so
    # the root-run installer can be integrity-checked before it executes.
    # Write to /root with 0700 to prevent local tampering/symlink abuse in /tmp.
    # force: true ensures upgrades always use the current upstream installer.
    # checksum (optional): pin a sha256 of install.sh per k3s_version in all.yml
    # alongside k3s_version to close the unverified-script-execution gap. Empty
    # default => get_url omits the param. NOTE: install.sh ALSO verifies the
    # downloaded k3s binary's sha256 against the GitHub release on its own; this
    # pin protects the installer script itself (a force-push to the tag, a
    # compromised CDN, or MITM cannot deliver an arbitrary root-run script).
    url: "{{ k3s_install_script_url }}"
    dest: /root/k3s-install.sh
    owner: root
    group: root
    mode: "0700"
    force: true
    checksum: "{{ k3s_install_script_checksum | default(omit, true) }}"
  when:
    - k3s_current_version.rc != 0 or (k3s_installed_version | default('')) != k3s_version
    - not (skip_k3s_install | default(false))

- name: Install or upgrade k3s server
  ansible.builtin.command: /root/k3s-install.sh server
  environment:
    K3S_TOKEN: "{{ k3s_token }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when:
    - k3s_current_version.rc != 0 or (k3s_installed_version | default('')) != k3s_version
    - not (skip_k3s_install | default(false))
  notify:
    - Restart k3s
    - Wait for k3s API healthy
  changed_when: true
  no_log: true

- name: Wait for k3s to be ready
  ansible.builtin.command: k3s kubectl get nodes
  register: k3s_ready
  retries: 30
  delay: 10
  until: k3s_ready.rc == 0
  changed_when: false
  when: not (skip_k3s_install | default(false))

- name: Wait for kube-vip to assign VIP
  ansible.builtin.wait_for:
    host: "{{ k3s_api_vip }}"
    port: "{{ k3s_api_port }}"
    timeout: 120
  when:
    - k3s_is_first_server | default(false)
    - not (skip_k3s_install | default(false))

- name: Apply node labels
  ansible.builtin.command: >
    k3s kubectl label node {{ inventory_hostname }}
    {{ item.key }}={{ item.value }} --overwrite
  loop: "{{ k3s_labels | dict2items }}"
  when:
    - k3s_labels | length > 0
    - not (skip_k3s_install | default(false))
  register: k3s_label_result
  # kubectl prints "node/X labeled" on mutation, "node/X not labeled" on no-op.
  changed_when: "' not labeled' not in (k3s_label_result.stdout | default(''))"

- name: Apply node taints
  ansible.builtin.command: >
    k3s kubectl taint node {{ inventory_hostname }}
    {{ item.key }}={{ item.value }}:{{ item.effect }} --overwrite
  loop: "{{ k3s_taints }}"
  when:
    - k3s_taints | length > 0
    - not (skip_k3s_install | default(false))
  register: k3s_taint_result
  # kubectl prints "node/X tainted/untainted/modified" on mutation.
  changed_when: >-
    ('tainted' in (k3s_taint_result.stdout | default('')))
    or ('modified' in (k3s_taint_result.stdout | default('')))
