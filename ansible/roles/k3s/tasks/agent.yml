---
# K3s agent installation

- name: Validate required k3s variables
  ansible.builtin.assert:
    that:
      - k3s_agent_token is defined
      - k3s_agent_token | length > 0
      - k3s_version is defined
      - k3s_version | length > 0
      - k3s_api_vip is defined
      - k3s_api_vip | length > 0
    fail_msg: >-
      Required k3s variables are not set. Ensure K3S_TOKEN (and optionally
      K3S_AGENT_TOKEN) environment variables are provided via 'op run' and
      k3s_version/k3s_api_vip are set in group_vars.
      Run deployment with: task k3s:deploy (which injects 1Password secrets)
    success_msg: "Required k3s variables are present"
  tags: [validation, always]

- name: Debug - Show k3s agent configuration variables
  ansible.builtin.debug:
    msg:
      - "Host: {{ inventory_hostname }}"
      - "k3s_role: {{ k3s_role }}"
      - "k3s_api_vip: {{ k3s_api_vip }}"
      - "k3s_labels: {{ k3s_labels }}"
      - "Config will be written to: /etc/rancher/k3s/config.yaml"
  tags: [debug]

- name: Deploy k3s agent config
  ansible.builtin.template:
    src: k3s-agent-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify:
    - Restart k3s-agent
    - Confirm the restarted k3s-agent is up and stable
    - Wait for agent node Ready

- name: Verify config file was created
  ansible.builtin.stat:
    path: /etc/rancher/k3s/config.yaml
  register: config_file_stat
  when: not ansible_check_mode

- name: Assert config file exists
  ansible.builtin.assert:
    that:
      - config_file_stat.stat.exists
    fail_msg: "Config file was NOT created at /etc/rancher/k3s/config.yaml!"
    success_msg: "Config file successfully created at /etc/rancher/k3s/config.yaml"
  when: not ansible_check_mode

# Version detection + install-script staging (shared with server.yml)
- name: Detect k3s version and stage install script
  ansible.builtin.include_tasks: install-script.yml

- name: Install or upgrade k3s agent
  ansible.builtin.command: /root/k3s-install.sh agent
  environment:
    K3S_TOKEN: "{{ k3s_agent_token }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_URL: "https://{{ k3s_api_vip }}:{{ k3s_api_port }}"
  when:
    - k3s_needs_install | bool
    - not (skip_k3s_install | default(false))
  notify:
    - Restart k3s-agent
    - Confirm the restarted k3s-agent is up and stable
    - Wait for agent node Ready
  changed_when: true
  no_log: true

# k3s-install.sh only writes K3S_TOKEN to the agent env file on a (re)install,
# which is version-gated above — so an already-joined agent would keep whatever
# token it first joined with. When a distinct lower-privilege agent token is
# configured (k3s_agent_token != k3s_token), reconcile it on every run so existing
# agents migrate off the full server token. Servers advertise agent-token earlier
# in the play (serial server restart), so the new token is already accepted.
# Gated on the env file existing (in prod it only exists after an install)
# rather than skip_k3s_install, so the molecule agent scenario can pre-stage
# the file and cover the migration.
- name: Check for the k3s agent service env file
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s-agent.service.env
  register: k3s_agent_env_file

- name: Reconcile k3s agent token in service env (migrate existing agents)
  ansible.builtin.lineinfile:
    path: /etc/systemd/system/k3s-agent.service.env
    regexp: '^K3S_TOKEN='
    line: "K3S_TOKEN={{ k3s_agent_token }}"
  notify:
    - Restart k3s-agent
    - Confirm the restarted k3s-agent is up and stable
    - Wait for agent node Ready
  no_log: true
  when:
    - k3s_agent_env_file.stat.exists
    - k3s_agent_token != k3s_token

# SAFEGUARD: Ensure k3s.service (server) is never running on agent nodes.
# This protects against incorrect manual installations or bugs.
- name: Check if k3s.service exists (server service on agent node)
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s.service
  register: k3s_server_service

- name: Stop and disable k3s.service if present (wrong service for agent)
  ansible.builtin.systemd:
    name: k3s
    state: stopped
    enabled: false
    daemon_reload: true
  when:
    - k3s_server_service.stat.exists
    - not (skip_k3s_install | default(false))
  failed_when: false  # Don't fail if service doesn't exist in systemd

- name: Wait for k3s-agent service to be active
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true
  register: k3s_agent_service
  retries: 5
  delay: 10
  until: k3s_agent_service is succeeded
  when: not (skip_k3s_install | default(false))

- name: Wait for agent node to register with cluster
  ansible.builtin.command: k3s kubectl get node {{ inventory_hostname }}
  register: k3s_node_ready
  retries: 30
  delay: 10
  until: k3s_node_ready.rc == 0
  changed_when: false
  delegate_to: "{{ groups['k3s_servers'][0] | default(inventory_hostname) }}"
  when:
    - not (skip_k3s_install | default(false))
    - groups['k3s_servers'] is defined
    - groups['k3s_servers'] | length > 0

- name: Apply node labels
  ansible.builtin.command: >
    k3s kubectl label node {{ inventory_hostname }}
    {{ item.key }}={{ item.value }} --overwrite
  loop: "{{ k3s_labels | dict2items }}"
  when:
    - k3s_labels | length > 0
    - not (skip_k3s_install | default(false))
    - groups['k3s_servers'] is defined
    - groups['k3s_servers'] | length > 0
  delegate_to: "{{ groups['k3s_servers'][0] | default(inventory_hostname) }}"
  register: k3s_label_result
  # kubectl prints "node/X labeled" on mutation, "node/X not labeled" on no-op.
  changed_when: "' not labeled' not in (k3s_label_result.stdout | default(''))"

- name: Apply node taints
  ansible.builtin.command: >
    k3s kubectl taint node {{ inventory_hostname }}
    {{ item.key }}={{ item.value }}:{{ item.effect }} --overwrite
  loop: "{{ k3s_taints }}"
  when:
    - k3s_taints | length > 0
    - not (skip_k3s_install | default(false))
    - groups['k3s_servers'] is defined
    - groups['k3s_servers'] | length > 0
  delegate_to: "{{ groups['k3s_servers'][0] | default(inventory_hostname) }}"
  register: k3s_taint_result
  # kubectl prints "node/X tainted/untainted/modified" on mutation.
  changed_when: >-
    ('tainted' in (k3s_taint_result.stdout | default('')))
    or ('modified' in (k3s_taint_result.stdout | default('')))
