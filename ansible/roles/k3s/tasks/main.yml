---
# K3s installation

- name: Install k3s prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - open-iscsi
      - nfs-common
    state: present
    update_cache: true
  when: not (skip_k3s_install | default(false))

- name: Install k3s prerequisites (minimal for config testing)
  ansible.builtin.apt:
    name:
      - curl
    state: present
    update_cache: true
  when: skip_k3s_install | default(false)

- name: Enable iscsid service
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started
  when: not (skip_k3s_install | default(false))

- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

# Mount additional persistent disks (ZFS zvols attached as SCSI devices by proxmox_vm role)
- name: Mount additional persistent disks
  ansible.builtin.include_role:
    name: zvol_mount
  vars:
    zvol_mount_disks: "{{ vm_additional_disks | default([]) }}"
  when: vm_additional_disks is defined and vm_additional_disks | length > 0

- name: Include server tasks
  ansible.builtin.include_tasks: server.yml
  when: k3s_role == 'server'

- name: Include agent tasks
  ansible.builtin.include_tasks: agent.yml
  when: k3s_role == 'agent'
