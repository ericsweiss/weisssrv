---
# K3s installation

- name: Install k3s prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - open-iscsi
      - nfs-common
    state: present
    update_cache: true
  when: not (skip_k3s_install | default(false))

- name: Install k3s prerequisites (minimal for config testing)
  ansible.builtin.apt:
    name:
      - curl
    state: present
    update_cache: true
  when: skip_k3s_install | default(false)

- name: Enable iscsid service
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started
  when: not (skip_k3s_install | default(false))

- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

# Mount additional persistent disks (ZFS zvols attached as scsi1, scsi2, etc.)
# IMPORTANT: Linux device naming (/dev/sdX) is NOT deterministic!
# We use /dev/disk/by-id/scsi-* symlinks which are stable across reboots.
# QEMU creates predictable IDs: scsi-0QEMU_QEMU_HARDDISK_drive-scsi{N}
# scsi0 is the root disk, so additional disks start at scsi1 (index 0 -> scsi1)
# Skipped in container testing (no real block devices)

- name: Build disk device paths using stable QEMU SCSI IDs
  vars:
    scsi_path: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi{{ idx + 1 }}"
    disk_entry:
      name: "{{ item.name }}"
      path: "{{ scsi_path }}"
      mount_point: "{{ item.mount_point }}"
      fstype: "{{ item.fstype }}"
  ansible.builtin.set_fact:
    disk_devices: "{{ disk_devices | default([]) + [disk_entry] }}"
  loop: "{{ vm_additional_disks | default([]) }}"
  loop_control:
    index_var: idx
    label: "{{ item.name }}"
  when: vm_additional_disks is defined

- name: Check if additional disk device exists
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ disk_devices | default([]) }}"
  loop_control:
    label: "{{ item.name }} ({{ item.path }})"
  register: disk_exists
  when: disk_devices is defined

- name: Fail if disk device doesn't exist
  ansible.builtin.fail:
    msg: |
      Disk {{ item.item.name }} device {{ item.item.path }} does not exist!
      Check that the zvol is attached to the VM in Proxmox.
      Expected: {{ item.item.path }}
  loop: "{{ disk_exists.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - disk_exists is defined
    - not item.stat.exists

- name: Check if additional disk is formatted
  ansible.builtin.command: "blkid {{ item.path }}"
  loop: "{{ disk_devices | default([]) }}"
  loop_control:
    label: "{{ item.name }} ({{ item.path }})"
  register: disk_formatted
  failed_when: false
  changed_when: false
  when: disk_devices is defined

- name: Format additional disks
  community.general.filesystem:
    fstype: "{{ item.item.fstype }}"
    dev: "{{ item.item.path }}"
  loop: "{{ disk_formatted.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }} ({{ item.item.path }})"
  when:
    - not ansible_check_mode  # Never format disks in check mode
    - disk_devices is defined
    - item.rc != 0

# After formatting, discover the filesystem UUID for stable mounting
# This avoids reliance on positional /dev/sdX names which can change
- name: Get filesystem UUID for additional disks
  ansible.builtin.command: "blkid -s UUID -o value {{ item.path }}"
  loop: "{{ disk_devices | default([]) }}"
  loop_control:
    label: "{{ item.name }} ({{ item.path }})"
  register: disk_uuids
  changed_when: false
  when: disk_devices is defined

# Fail early if any disk doesn't have a valid UUID (prevents empty UUID in fstab)
- name: Validate all additional disks have UUIDs
  ansible.builtin.assert:
    that:
      - item.stdout | length > 0
    fail_msg: |
      Disk {{ item.item.name }} ({{ item.item.path }}) has no filesystem UUID!
      This usually means the disk is not attached or not formatted.
      Run with --tags k3s to retry, or check the VM disk configuration in Proxmox.
    quiet: true
  loop: "{{ disk_uuids.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - disk_devices is defined
    - disk_uuids is defined

- name: Create mount points for additional disks
  ansible.builtin.file:
    path: "{{ item.mount_point }}"
    state: directory
    mode: "0755"
  loop: "{{ disk_devices | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: disk_devices is defined

# Check if any disk is currently mounted at a WRONG location
# This can happen if device naming changed (/dev/sdX is non-deterministic)
- name: Check current mount status of additional disks
  ansible.builtin.shell: |
    findmnt -n -o TARGET "UUID={{ item.1.stdout }}" 2>/dev/null || echo "not-mounted"
  loop: "{{ disk_devices | zip(disk_uuids.results) | list }}"
  loop_control:
    label: "{{ item.0.name }}"
  register: current_mounts
  changed_when: false
  when:
    - disk_devices is defined
    - disk_uuids is defined

# Unmount disks that are mounted at incorrect locations
- name: Unmount disks mounted at wrong locations
  ansible.posix.mount:
    path: "{{ item.stdout | trim }}"
    state: unmounted
  loop: "{{ current_mounts.results | default([]) }}"
  loop_control:
    label: "{{ item.item.0.name }}: {{ item.stdout | trim }} (should be {{ item.item.0.mount_point }})"
  when:
    - current_mounts is defined
    - item.stdout | trim != "not-mounted"
    - item.stdout | trim != item.item.0.mount_point

# Clean up incorrect fstab entries for these UUIDs (only when wrong mount detected)
- name: Remove incorrect fstab entries
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^UUID={{ item.item.1.stdout }}\\s+"
    state: absent
  loop: "{{ current_mounts.results | default([]) }}"
  loop_control:
    label: "{{ item.item.0.name }}"
  when:
    - current_mounts is defined
    - item.stdout | trim != "not-mounted"
    - item.stdout | trim != item.item.0.mount_point

- name: Mount additional disks by UUID
  ansible.posix.mount:
    path: "{{ item.0.mount_point }}"
    src: "UUID={{ item.1.stdout }}"
    fstype: "{{ item.0.fstype }}"
    # CRITICAL: Do NOT use nofail - if disk fails to mount, services must not start
    # (prevents writing to empty mountpoint on root disk, causing split-brain data)
    # x-systemd.device-timeout: fail fast if device doesn't appear (30s)
    opts: defaults,noatime,x-systemd.device-timeout=30
    state: mounted
  loop: "{{ disk_devices | zip(disk_uuids.results) | list }}"
  loop_control:
    label: "{{ item.0.name }} (UUID={{ item.1.stdout }}) -> {{ item.0.mount_point }}"
  when:
    - disk_devices is defined
    - disk_uuids is defined

- name: Include server tasks
  ansible.builtin.include_tasks: server.yml
  when: k3s_role == 'server'

- name: Include agent tasks
  ansible.builtin.include_tasks: agent.yml
  when: k3s_role == 'agent'
