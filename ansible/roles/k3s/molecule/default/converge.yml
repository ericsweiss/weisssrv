---
# Converge playbook for k3s role testing
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Wait for apt locks to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
              fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
          sleep 1
        done
      args:
        executable: /bin/bash
      changed_when: false
      when: ansible_os_family == "Debian"

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - systemd
          - ca-certificates
        state: present
      when: ansible_os_family == "Debian"

  roles:
    - role: k3s

  post_tasks:
    # Negative test for the kube-vip interface assert (server.yml): with a NIC
    # name that doesn't exist on the host, the role MUST fail loudly rather than
    # let kube-vip start and silently fail to announce the API VIP. The positive
    # path is covered by the main role run above (kube_vip_interface: eth0).
    - name: Re-run k3s with a nonexistent kube-vip interface (expect failure)
      block:
        - name: Include k3s with a bogus interface
          ansible.builtin.include_role:
            name: k3s
          vars:
            kube_vip_interface: nonexistent999
        - name: Interface assert failed to trigger
          ansible.builtin.copy:
            dest: /tmp/kube-vip-iface-assert.json
            content: '{"failed": false}'
            mode: "0644"
      rescue:
        - name: Interface assert correctly rejected a missing NIC
          ansible.builtin.copy:
            dest: /tmp/kube-vip-iface-assert.json
            mode: "0644"
            content: |
              {"failed": true, "msg": {{ ansible_failed_result.msg | to_json }}}
          # This is a test-result marker, not state convergence — the negative
          # test re-runs (and this rescue fires) on every converge, so it must
          # not count toward molecule's idempotence check.
          changed_when: false
