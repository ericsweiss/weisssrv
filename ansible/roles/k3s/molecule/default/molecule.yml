---
# Per-role Molecule scenario. Shared driver/provisioner/verifier/scenario config
# is inherited from ansible/molecule/base.yml (applied via the `-c` flag in
# test-all-roles.sh and the CI molecule-tests matrix). Only the per-role platform
# and inventory live here (plus role-specific provisioner.env / remote_tmp / a
# custom scenario where needed).
platforms:
  - name: k3s-server-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    capabilities:
      - SYS_ADMIN
    tmpfs:
      - /run
      - /tmp
    networks:
      - name: k3s-test-net
provisioner:
  inventory:
    group_vars:
      all:
        k3s_version: v1.35.0+k3s3
        kube_vip_version: v1.0.4
        k3s_api_vip: 192.168.0.161
        k3s_token: test-token-for-molecule-testing
        k3s_role: server
        k3s_is_first_server: true
        kube_vip_interface: eth0
        k3s_labels:
          test: 'true'
        k3s_taints: []
        admin_user: root
        internal_domain: test.local
        skip_ssh_config: true
        skip_dns_config: true
        skip_k3s_install: true
