---
# Verify playbook for k3s agent role testing
# Tests agent-specific configuration deployment
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Check if k3s config directory exists
      ansible.builtin.stat:
        path: /etc/rancher/k3s
      register: k3s_config_dir
      failed_when: not k3s_config_dir.stat.exists

    - name: Check if k3s config file exists
      ansible.builtin.stat:
        path: /etc/rancher/k3s/config.yaml
      register: k3s_config_file
      failed_when: not k3s_config_file.stat.exists

    - name: Verify k3s config file permissions
      ansible.builtin.stat:
        path: /etc/rancher/k3s/config.yaml
      register: config_perms
      failed_when: config_perms.stat.mode != '0600'

    - name: Read k3s config file
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/config.yaml
      register: k3s_config_content

    - name: Decode k3s config
      ansible.builtin.set_fact:
        k3s_config_text: "{{ k3s_config_content.content | b64decode }}"

    - name: Debug - Show agent config
      ansible.builtin.debug:
        msg: "{{ k3s_config_text }}"

    # Agent-specific configuration tests
    - name: Verify agent config has server URL
      ansible.builtin.assert:
        that:
          - "'server:' in k3s_config_text"
          - "'https://192.168.0.161:6443' in k3s_config_text"
        fail_msg: "Agent config missing server URL"
        success_msg: "Agent config has correct server URL"

    - name: Verify agent config has node labels
      ansible.builtin.assert:
        that:
          - "'node-label:' in k3s_config_text"
          - "'node-type=general' in k3s_config_text"
          - "'workload=media' in k3s_config_text"
        fail_msg: "Agent config missing expected node labels"
        success_msg: "Agent config has correct node labels"

    - name: Verify agent config has node taints
      ansible.builtin.assert:
        that:
          - "'node-taint:' in k3s_config_text"
          - "'node.kubernetes.io/ingress=true:NoSchedule' in k3s_config_text"
        fail_msg: "Agent config missing expected node taints"
        success_msg: "Agent config has correct node taints"

    # Token migration: prepare.yml pre-stages the env file with the stale
    # server token; the reconcile lineinfile in tasks/agent.yml must rewrite
    # it to the dedicated agent token.
    - name: Read the k3s-agent service env
      ansible.builtin.slurp:
        src: /etc/systemd/system/k3s-agent.service.env
      register: k3s_agent_env

    - name: Assert the stale server token was migrated to the agent token
      ansible.builtin.assert:
        that:
          - "'K3S_TOKEN=test-agent-token-for-molecule' in (k3s_agent_env.content | b64decode)"
          - "'test-token-for-molecule-agent-testing' not in (k3s_agent_env.content | b64decode)"
        fail_msg: >-
          k3s-agent.service.env still holds the server token — the agent-token
          migration lineinfile in tasks/agent.yml did not reconcile it.
        success_msg: "Agent env token migrated to the dedicated agent token"

    # Negative test recorded by converge: an empty k3s_agent_token must fail
    # the role at the validation assert.
    - name: Read agent-token negative-assert result
      ansible.builtin.slurp:
        src: /tmp/k3s-agent-token-assert.json
      register: k3s_agent_token_assert

    - name: Assert an empty agent token fails the role
      ansible.builtin.assert:
        that:
          - (k3s_agent_token_assert.content | b64decode | from_json).failed
        fail_msg: >-
          The agent-token assert did not reject an empty token — an agent
          would try to join with an empty credential instead of failing
          loudly. Check the validation assert in tasks/agent.yml.

    # GPU-node include path (tasks/gpu.yml): the non-free component-enable must
    # have rewritten the scratch sources file (real installs are skipped via
    # skip_k3s_gpu_install). Proves the k3s_gpu_node include is reached + wired.
    - name: Read the GPU-path scratch sources file
      ansible.builtin.slurp:
        src: /tmp/gpu-test-debian.sources
      register: k3s_gpu_sources

    - name: Assert the GPU node enabled non-free components
      ansible.builtin.assert:
        that:
          - "'Components: main contrib non-free non-free-firmware' in (k3s_gpu_sources.content | b64decode)"
        fail_msg: >-
          tasks/gpu.yml did not enable contrib/non-free/non-free-firmware — the
          k3s_gpu_node include path or the component-enable is broken.
        success_msg: "GPU node enabled the non-free Debian components"

    # Verify kube-vip manifest does NOT exist for agents
    - name: Check kube-vip manifest does NOT exist
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/manifests/kube-vip.yaml
      register: kube_vip_manifest

    - name: Assert kube-vip is not deployed for agents
      ansible.builtin.assert:
        that:
          - not kube_vip_manifest.stat.exists
        fail_msg: "kube-vip should NOT be deployed on agent nodes"
        success_msg: "kube-vip correctly not deployed on agent node"

    - name: Display test results
      ansible.builtin.debug:
        msg:
          - "k3s agent configuration deployed successfully"
          - "Config directory: /etc/rancher/k3s"
          - "Config file: /etc/rancher/k3s/config.yaml (mode 0600)"
          - "Agent-specific settings verified:"
          - "  - Server URL: https://192.168.0.161:6443"
          - "  - Node labels: node-type=general, workload=media"
          - "  - Node taints: node.kubernetes.io/ingress=true:NoSchedule"
          - "  - kube-vip NOT deployed (correct for agent)"
          - "  - Agent token migrated in k3s-agent.service.env"
          - "  - Empty agent token rejected by the validation assert"
          - "(k3s binary install skipped in container testing)"
