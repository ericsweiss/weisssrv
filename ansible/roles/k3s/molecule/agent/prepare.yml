---
# Prepare playbook: Wait for systemd to be ready in the container
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule/tasks/prepare-base.yml

    - name: Disable apt background services
      ansible.builtin.import_tasks: ../../../../molecule/tasks/prepare-apt-disable.yml

    # tasks/agent.yml reconciles K3S_TOKEN in this env file whenever it exists
    # (in prod k3s-install.sh creates it on install). Pre-stage it holding the
    # stale server token so verify.yml can assert the migration to the
    # dedicated agent token.
    - name: Pre-stage k3s-agent service env with a stale server token
      ansible.builtin.raw: |
        printf 'K3S_TOKEN=%s\n' 'test-token-for-molecule-agent-testing' \
          > /etc/systemd/system/k3s-agent.service.env
        chmod 600 /etc/systemd/system/k3s-agent.service.env
      changed_when: false

    # Scratch deb822 sources file for the GPU-node component-enable
    # (k3s_gpu_debian_sources_path). Keeping it out of /etc/apt keeps the
    # container's real apt sources — and `apt update` in converge — untouched
    # while still letting tasks/gpu.yml exercise + assert the non-free enable.
    # Seed the trixie DEFAULT (`Components: main non-free-firmware` — the firmware
    # GR ships it), which is exactly the state a non-free-firmware-gated match
    # would wrongly skip: it makes the test a real regression guard that the
    # component-enable still adds contrib/non-free on a fresh agent.
    - name: Stage a scratch Debian sources file for the GPU component-enable
      ansible.builtin.raw: |
        printf 'Types: deb\nURIs: http://deb.debian.org/debian\nSuites: trixie\nComponents: main non-free-firmware\n' \
          > /tmp/gpu-test-debian.sources
      changed_when: false
