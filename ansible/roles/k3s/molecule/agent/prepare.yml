---
# Prepare playbook: Wait for systemd to be ready in the container
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for systemd to be ready
      ansible.builtin.raw: |
        for i in $(seq 1 30); do
          if systemctl is-system-running 2>/dev/null | grep -qE '(running|degraded)'; then
            exit 0
          fi
          sleep 1
        done
        # Fallback: check if systemd is at least responding
        systemctl status >/dev/null 2>&1 && exit 0
        exit 1
      changed_when: false
      retries: 3
      delay: 2
      register: systemd_ready
      until: systemd_ready.rc == 0

    - name: Disable apt background services
      ansible.builtin.raw: |
        systemctl stop apt-daily.timer 2>/dev/null || true
        systemctl stop apt-daily-upgrade.timer 2>/dev/null || true
        systemctl stop unattended-upgrades.service 2>/dev/null || true
        systemctl disable apt-daily.timer 2>/dev/null || true
        systemctl disable apt-daily-upgrade.timer 2>/dev/null || true
        exit 0
      changed_when: false

    # Create ansible temp directory to prevent "Failed to create temporary directory" errors
    - name: Ensure ansible temp directory exists
      ansible.builtin.raw: |
        mkdir -p /root/.ansible/tmp
        chmod 700 /root/.ansible/tmp
      changed_when: false

    # tasks/agent.yml reconciles K3S_TOKEN in this env file whenever it exists
    # (in prod k3s-install.sh creates it on install). Pre-stage it holding the
    # stale server token so verify.yml can assert the migration to the
    # dedicated agent token.
    - name: Pre-stage k3s-agent service env with a stale server token
      ansible.builtin.raw: |
        printf 'K3S_TOKEN=%s\n' 'test-token-for-molecule-agent-testing' \
          > /etc/systemd/system/k3s-agent.service.env
        chmod 600 /etc/systemd/system/k3s-agent.service.env
      changed_when: false
