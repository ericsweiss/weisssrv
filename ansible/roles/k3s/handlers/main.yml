---
# Restart, then gate on the API actually coming back. On a busy node (the NAS
# server) k3s can exit once during startup (etcd rejoin) and be recovered by
# Restart=always seconds later; a plain restart reports failure on that first
# exit even though it recovers, which spuriously failed a maintenance-run-all on
# k3s-srv-nas-01. failed_when:false tolerates that transient, and the config
# tasks notify "Wait for k3s API healthy" alongside this so the health poll runs
# regardless — it is the real gate (a genuinely-stuck k3s fails there).
- name: Restart k3s
  ansible.builtin.systemd:
    name: k3s
    state: restarted
    daemon_reload: true
  failed_when: false
  when: not (skip_k3s_install | default(false))

- name: Wait for k3s API healthy
  # /readyz (stricter than /healthz) gates on the apiserver being fully ready to
  # serve, not merely up — reduces flaky follow-up ops right after a restart.
  # kubectl --raw returns rc 0 only on HTTP 200 (readyz "ok"), non-zero otherwise.
  # --request-timeout bounds each probe so a hung API call fails fast and the
  # retry budget (30 x 10s) stays predictable instead of stalling on one call.
  ansible.builtin.command: k3s kubectl --request-timeout=5s get --raw=/readyz
  register: k3s_api_readyz
  changed_when: false
  until: k3s_api_readyz.rc == 0
  retries: 30
  delay: 10
  when: not (skip_k3s_install | default(false))

# Agents are lighter (no etcd/API) and rarely flake on restart; failed_when:false
# tolerates a transient exit, and the "Wait for agent node Ready" handler below
# (notified alongside this one) is the real gate.
- name: Restart k3s-agent
  ansible.builtin.systemd:
    name: k3s-agent
    state: restarted
    daemon_reload: true
  failed_when: false
  when: not (skip_k3s_install | default(false))

# A restarted agent must come back node-Ready, not merely have systemd accept
# the restart: the restart above is fire-and-forget and the agents play is not
# serial. The play-level "Fail if any node is not Ready" assert (k3s.yml) does
# hard-fail now, but it targets k3s_servers[0] and is skipped under
# `--limit k3s_agents`, so without this gate a bad agent config rolls out to
# every agent and a local `task k3s:deploy` still exits green. (CI runs are
# additionally covered by post-maintenance-verify.sh.)
#
# A dead kubelet's node object keeps Ready=True for the node-monitor grace
# period (~40s), so the delegated poll below can pass on stale status right after
# the restart. Confirm on the agent itself first that k3s-agent is active AND has
# stopped restarting (NRestarts stable across a recheck) — this catches the
# Type=exec exec-then-die race a bad config produces before trusting the Ready
# condition. Mirrors "Wait for k3s API healthy" on servers.
- name: Confirm the restarted k3s-agent is up and stable
  ansible.builtin.shell: |
    set -e
    r1="$(systemctl show k3s-agent -p NRestarts --value)"
    sleep 15
    r2="$(systemctl show k3s-agent -p NRestarts --value)"
    [ "$(systemctl is-active k3s-agent)" = "active" ] && [ "$r1" = "$r2" ]
  register: k3s_agent_stable
  changed_when: false
  until: k3s_agent_stable.rc == 0
  retries: 12
  delay: 10
  when: not (skip_k3s_install | default(false))

- name: Wait for agent node Ready
  ansible.builtin.command: >-
    k3s kubectl get node {{ inventory_hostname }}
    -o 'jsonpath={.status.conditions[?(@.type=="Ready")].status}'
  register: k3s_agent_node_ready
  changed_when: false
  until: k3s_agent_node_ready.stdout == "True"
  retries: 30
  delay: 10
  delegate_to: "{{ groups['k3s_servers'][0] | default(inventory_hostname) }}"
  when:
    - not (skip_k3s_install | default(false))
    - groups['k3s_servers'] is defined
    - groups['k3s_servers'] | length > 0

# Defensive end-of-play daemon-reload after the snapshot copy service/timer units
# change. Handlers flush at end of play, AFTER the enable+start task in
# etcd-snapshot-offnode.yml has already run — that task carries its own
# daemon_reload: true and is the real mechanism that picks up unit changes during
# a run. This handler only covers runs where that task is skipped (check mode).
- name: Reload systemd for etcd snapshot copy
  ansible.builtin.systemd:
    daemon_reload: true
  when: not (skip_k3s_install | default(false))
