---
# Loki push endpoint via the internal Traefik IngressRoute. Encrypts
# the host->Loki hop with the wildcard cert; the IngressRoute is gated
# by lan-tailscale-only so the API is unreachable from outside the LAN.
# AdGuard rewrite (loki.esweiss.com -> 192.168.0.101) routes the
# request to Traefik on the internal MetalLB VIP.
#
# Fallback: the NodePort at http://192.168.0.161:31100 is kept in
# kubernetes/infrastructure/observability/loki/nodeport.yaml for
# emergencies (e.g. Traefik down). Override on a host that needs the
# fallback by setting alloy_host_loki_url in host_vars.
alloy_host_loki_url: "https://loki.esweiss.com/loki/api/v1/push"

# Basic auth for the Traefik loki-push-auth middleware (1P item "Loki Push
# Auth"; injected by the task wrapper or CI job variables). tasks/main.yml
# asserts these are non-empty whenever the default Traefik URL is in use —
# a 401-at-runtime config is a deploy-time error, not a runtime surprise.
# The NodePort fallback bypasses Traefik and ignores these.
alloy_host_loki_user: "{{ lookup('ansible.builtin.env', 'LOKI_PUSH_USER') | default('', true) }}"
alloy_host_loki_password: "{{ lookup('ansible.builtin.env', 'LOKI_PUSH_PASSWORD') | default('', true) }}"

# On-disk write-ahead log for the loki.write client. This host-side Alloy is
# circularly dependent on the very Loki it observes: Loki runs *inside* the k3s
# cluster, so a cluster/Loki/Traefik outage is exactly when we most want host
# journald (kubelet/etcd/containerd unit logs) preserved — yet without a WAL
# those logs are dropped after the in-memory queue fills. Enabling the WAL
# buffers entries to disk (under Alloy's storage path) and backfills them once
# Loki returns, so an outage degrades to delayed delivery instead of loss.
# max_segment_age bounds how long a segment is held before being cut/flushed,
# capping disk use and replay lag. Override per-host if a node is space-constrained.
alloy_host_wal_enabled: true
alloy_host_wal_max_segment_age: "1h"
