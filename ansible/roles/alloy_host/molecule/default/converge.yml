---
# Converge playbook for alloy_host role testing
# Installs Alloy from the real Grafana APT repo (publicly available).
# The systemd test container runs journald, so Alloy starts and the role's
# /-/ready health check runs for real during converge.
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    # Wait for apt locks to be released (unattended-upgrades runs on container startup)
    - name: Wait for apt locks to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
              fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
          sleep 1
        done
      args:
        executable: /bin/bash
      changed_when: false
      when: ansible_os_family == "Debian"

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - systemd
          - ca-certificates
          - gnupg
        state: present
      when: ansible_os_family == "Debian"

  roles:
    - role: alloy_host
