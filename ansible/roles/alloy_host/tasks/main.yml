---
# Grafana Alloy — journald log collection agent
# Installs Alloy from the Grafana APT repository and ships journald logs to Loki

# The Traefik route enforces basic auth (loki-push-auth middleware), so a config
# rendered with empty LOKI_PUSH_* creds ships 401s and silently drops the fleet's
# journals. Fail at deploy time instead. Gate on the URL scheme, not a literal
# hostname: every authenticated push path is behind Traefik over https, so any
# https:// endpoint needs creds; only the plaintext NodePort fallback
# (http://<node>:31100) bypasses Traefik and legitimately needs none. Scheme-
# gating also re-arms the assert if an operator repoints at a different
# authenticated host without touching this file.
- name: Assert Loki push credentials are present
  ansible.builtin.assert:
    that:
      - alloy_host_loki_user | trim | length > 0
      - alloy_host_loki_password | trim | length > 0
    fail_msg: >-
      LOKI_PUSH_USER / LOKI_PUSH_PASSWORD are empty. Run via the task
      wrapper or `op run` (1P item "Loki Push Auth") so the rendered
      config can authenticate to the loki-push-auth middleware.
    quiet: true
  when: alloy_host_loki_url is match('^https://')

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Check if Grafana GPG key exists
  ansible.builtin.stat:
    path: /etc/apt/keyrings/grafana.gpg
  register: alloy_host_gpg_key

# The verify/dearmor steps below call gpg. The base role normally provisions
# gnupg, but this role has no meta dependency on it, so install it explicitly
# (gated on the same condition as the key steps) to stay correct standalone.
- name: Ensure gnupg is installed
  ansible.builtin.apt:
    name: gnupg
    state: present
  when: not alloy_host_gpg_key.stat.exists

- name: Download Grafana GPG key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /tmp/grafana.gpg.key
    mode: "0644"
  when: not alloy_host_gpg_key.stat.exists

- name: Verify Grafana GPG key fingerprint (primary key must match exactly)
  ansible.builtin.shell: |
    set -o pipefail
    primary_fpr=$(gpg --show-keys --with-colons /tmp/grafana.gpg.key 2>/dev/null \
        | awk -F: '/^pub/{p=1; next} p && /^fpr/{print $10; exit}')
    [ "$primary_fpr" = "B53AE77BADB630A683046005963FA27710458545" ]
  args:
    executable: /bin/bash
  changed_when: false
  when: not alloy_host_gpg_key.stat.exists

- name: Add Grafana GPG key to keyring
  ansible.builtin.shell: |
    gpg --yes --dearmor -o /etc/apt/keyrings/grafana.gpg < /tmp/grafana.gpg.key
  args:
    creates: /etc/apt/keyrings/grafana.gpg
  when: not alloy_host_gpg_key.stat.exists

- name: Clean up downloaded GPG key
  ansible.builtin.file:
    path: /tmp/grafana.gpg.key
    state: absent
  when: not alloy_host_gpg_key.stat.exists

- name: Add Grafana APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main"
    filename: grafana
    state: present
    update_cache: true

- name: Install Alloy
  ansible.builtin.apt:
    name: alloy
    state: present

- name: Disable Alloy usage reporting
  ansible.builtin.lineinfile:
    path: /etc/default/alloy
    regexp: '^CUSTOM_ARGS='
    line: 'CUSTOM_ARGS="--disable-reporting"'
  notify: Restart alloy

- name: Deploy Alloy configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    # Group-readable only: the config embeds the Loki push credential —
    # which is also why diffs are suppressed here.
    mode: "0640"
  notify: Restart alloy
  no_log: true

- name: Enable and start Alloy service
  ansible.builtin.systemd:
    name: alloy
    enabled: true
    state: started
    daemon_reload: true

- name: Verify Alloy is listening on port 12345
  ansible.builtin.uri:
    url: "http://localhost:12345/-/ready"
    return_content: false
    status_code: 200
  register: alloy_host_health
  retries: 5
  delay: 3
  until: alloy_host_health.status == 200
  when: not ansible_check_mode
