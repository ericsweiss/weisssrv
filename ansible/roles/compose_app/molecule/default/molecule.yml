---
# Scenario overrides; shared config in ansible/molecule/base.yml.
# This is a render/contract scenario: compose_app_skip_install skips the
# service-touching steps, so the shared compose unit (both the
# RequiresMountsFor-present and -absent cases) and the write_prom_metrics
# helper library are rendered + asserted (and the lib is exercised end to end)
# without a container runtime.
provisioner:
  playbooks:
    prepare: prepare.yml
platforms:
  - name: compose-app-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
