---
# Converge: render the shared compose unit in BOTH shapes (RequiresMountsFor
# present, as immich/nextcloud use it; and absent, as immich_ml uses it) and
# deploy the write_prom_metrics helper library — all in skip-install mode so no
# container runtime or systemd service management is needed.
- name: Converge
  hosts: all
  become: true
  tasks:
    # Case A: RequiresMountsFor present (immich/nextcloud shape).
    - name: Render the compose unit with RequiresMountsFor
      ansible.builtin.include_role:
        name: compose_app
      vars:
        compose_app_skip_install: true
        compose_app_service_name: mounts-present
        compose_app_description: "Test app (mounts)"
        compose_app_working_directory: /opt/testapp/compose
        compose_app_requires_mounts_for:
          - /mnt/testapp-a
          - /mnt/testapp-b
        compose_app_requires_mounts_comment:
          - "Mount-ordering comment line one."
          - "Mount-ordering comment line two."
        compose_app_reconcile_comment:
          - "Reconcile comment line one."
          - "Reconcile comment line two."

    # Case B: no RequiresMountsFor (immich_ml shape — empty list omits the line
    # AND its comment).
    - name: Render the compose unit without RequiresMountsFor
      ansible.builtin.include_role:
        name: compose_app
      vars:
        compose_app_skip_install: true
        compose_app_service_name: mounts-absent
        compose_app_description: "Test app (no mounts)"
        compose_app_working_directory: /opt/testapp2/compose
        compose_app_requires_mounts_for: []
        compose_app_requires_mounts_comment: []
        compose_app_reconcile_comment:
          - "Reconcile-only comment line."

    # Deploy the shared backup-metrics helper library (immich noun = database dump).
    - name: Deploy the write_prom_metrics helper library
      ansible.builtin.include_role:
        name: compose_app
        tasks_from: backup_lib.yml
      vars:
        compose_app_skip_install: true
        compose_app_backup_lib_dest: /usr/local/lib/testapp-backup-lib.sh
        compose_app_backup_size_help_object: "database dump"

    # Case C: the shared host-nginx task flow (skip_install, so nginx is neither
    # installed nor reloaded). The sites/ssl layout, sentinel cert + key, and
    # packaged default vhost are seeded once in prepare.yml — seeding them here
    # would ping-pong with the flow's remove/chmod tasks on the idempotence run.
    - name: Run the shared host-nginx task flow (render-only)
      ansible.builtin.include_role:
        name: compose_app
        tasks_from: nginx.yml
      vars:
        compose_app_skip_install: true
        compose_app_nginx_site_name: testapp.conf
        compose_app_nginx_site_template: "{{ playbook_dir }}/files/testapp-nginx-site.conf.j2"
        compose_app_nginx_ssl_cert: /etc/nginx/ssl/fullchain.pem
        compose_app_nginx_ssl_key: /etc/nginx/ssl/privkey.pem
