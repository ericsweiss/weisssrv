---
# Verify the shared compose unit (both shapes) + the write_prom_metrics library.
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    # ==========================================================================
    # Compose unit — RequiresMountsFor present (immich/nextcloud shape)
    # ==========================================================================
    - name: Slurp the mounts-present compose unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/mounts-present.service
      register: compose_app_unit_a

    - name: Verify the mounts-present unit body
      ansible.builtin.assert:
        that:
          - (compose_app_unit_a.content | b64decode) is search('Description=Test app \(mounts\)')
          - (compose_app_unit_a.content | b64decode) is search('Requires=docker.service')
          - (compose_app_unit_a.content | b64decode) is search('RequiresMountsFor=/mnt/testapp-a /mnt/testapp-b')
          - (compose_app_unit_a.content | b64decode) is search('# Mount-ordering comment line one.')
          - (compose_app_unit_a.content | b64decode) is search('WorkingDirectory=/opt/testapp/compose')
          # RemainAfterExit standardised to `yes` (systemd treats yes/true alike).
          - (compose_app_unit_a.content | b64decode) is search('RemainAfterExit=yes')
          - (compose_app_unit_a.content | b64decode) is search('# Reconcile comment line one.')
          - (compose_app_unit_a.content | b64decode) is search('ExecStart=/usr/bin/docker compose up -d --remove-orphans')
          - (compose_app_unit_a.content | b64decode) is search('ExecStop=/usr/bin/docker compose down')
        fail_msg: "mounts-present compose unit missing expected lines"
        success_msg: "mounts-present compose unit renders description, mounts, reconcile comment, lifecycle"

    # ==========================================================================
    # Compose unit — RequiresMountsFor absent (immich_ml shape)
    # ==========================================================================
    - name: Slurp the mounts-absent compose unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/mounts-absent.service
      register: compose_app_unit_b

    - name: Verify the mounts-absent unit omits RequiresMountsFor + its comment
      ansible.builtin.assert:
        that:
          - (compose_app_unit_b.content | b64decode) is search('WorkingDirectory=/opt/testapp2/compose')
          - (compose_app_unit_b.content | b64decode) is search('RemainAfterExit=yes')
          - (compose_app_unit_b.content | b64decode) is search('# Reconcile-only comment line.')
          # Empty requires_mounts_for => no RequiresMountsFor line AND no mount comment.
          - (compose_app_unit_b.content | b64decode) is not search('RequiresMountsFor')
          - (compose_app_unit_b.content | b64decode) is not search('Mount-ordering')
        fail_msg: "mounts-absent unit must omit RequiresMountsFor and its comment"
        success_msg: "mounts-absent unit omits RequiresMountsFor (empty list) — immich_ml shape"

    # ==========================================================================
    # write_prom_metrics helper library — content + end-to-end behaviour
    # ==========================================================================
    - name: Stat the helper library
      ansible.builtin.stat:
        path: /usr/local/lib/testapp-backup-lib.sh
      register: compose_app_lib_stat

    - name: Slurp the helper library
      ansible.builtin.slurp:
        src: /usr/local/lib/testapp-backup-lib.sh
      register: compose_app_lib

    - name: Verify the helper library defines the runtime-prefixed metric series
      ansible.builtin.assert:
        that:
          - compose_app_lib_stat.stat.exists
          - (compose_app_lib.content | b64decode) is search('write_prom_metrics\(\)')
          # Metric names are runtime-prefixed (${prefix}) so the logic is shared.
          - (compose_app_lib.content | b64decode) is search('\$\{prefix\}_last_run_success')
          - (compose_app_lib.content | b64decode) is search('\$\{prefix\}_last_success_timestamp_seconds')
          # The size-gauge HELP noun is set per app at render time.
          - (compose_app_lib.content | b64decode) is search('Size of the most recent database dump in bytes')
        fail_msg: "helper library missing write_prom_metrics / prefixed metrics / size noun"
        success_msg: "helper library defines write_prom_metrics with runtime-prefixed metrics"

    - name: Exercise the helper library (success path)
      ansible.builtin.shell: |
        set -euo pipefail
        source /usr/local/lib/testapp-backup-lib.sh
        write_prom_metrics test_backup 1 42 12345 /tmp/compose-app-verify.prom
      args:
        executable: /bin/bash
      changed_when: false

    - name: Read the metric file after success
      ansible.builtin.slurp:
        src: /tmp/compose-app-verify.prom
      register: compose_app_prom_ok

    - name: Assert all metrics present on success
      ansible.builtin.assert:
        that:
          - "'test_backup_last_run_success 1' in (compose_app_prom_ok.content | b64decode)"
          - "'test_backup_last_run_duration_seconds 42' in (compose_app_prom_ok.content | b64decode)"
          - "'test_backup_last_size_bytes 12345' in (compose_app_prom_ok.content | b64decode)"
          - "'test_backup_last_success_timestamp_seconds ' in (compose_app_prom_ok.content | b64decode)"
        fail_msg: "helper library did not emit the full metric series on success"
        success_msg: "helper library emits the full metric series on success"

    - name: Capture the success timestamp (to assert preservation on failure)
      ansible.builtin.shell: >-
        awk '/^test_backup_last_success_timestamp_seconds/ {print $2}'
        /tmp/compose-app-verify.prom
      register: compose_app_ts_ok
      changed_when: false

    - name: Exercise the helper library (failure path)
      ansible.builtin.shell: |
        set -euo pipefail
        source /usr/local/lib/testapp-backup-lib.sh
        write_prom_metrics test_backup 0 7 0 /tmp/compose-app-verify.prom
      args:
        executable: /bin/bash
      changed_when: false

    - name: Read the metric file after failure
      ansible.builtin.slurp:
        src: /tmp/compose-app-verify.prom
      register: compose_app_prom_fail

    - name: Assert failure records success=0 and preserves the prior timestamp
      ansible.builtin.assert:
        that:
          - "'test_backup_last_run_success 0' in (compose_app_prom_fail.content | b64decode)"
          - >-
            'test_backup_last_success_timestamp_seconds ' ~ compose_app_ts_ok.stdout
            in (compose_app_prom_fail.content | b64decode)
        fail_msg: "failure path did not record success=0 or lost the prior success timestamp"
        success_msg: "failure path records success=0 and preserves the last success timestamp"

    # ==========================================================================
    # Host-nginx task flow (Case C) — cert untouched via creates:, site deployed,
    # packaged default vhost removed.
    # ==========================================================================
    - name: Read the pre-seeded cert after the nginx flow
      ansible.builtin.slurp:
        src: /etc/nginx/ssl/fullchain.pem
      register: compose_app_nginx_cert

    - name: Assert the openssl placeholder left the pre-seeded cert untouched (creates guard)
      ansible.builtin.assert:
        that:
          - "'SENTINEL-PRESEEDED-fullchain.pem' in (compose_app_nginx_cert.content | b64decode)"
        fail_msg: "the openssl self-signed seed clobbered the existing cert — the creates: guard failed"
        success_msg: "the creates: guard left the pre-seeded cert untouched"

    - name: Stat the deployed nginx site
      ansible.builtin.stat:
        path: /etc/nginx/sites-available/testapp.conf
      register: compose_app_nginx_site
      failed_when: not compose_app_nginx_site.stat.exists

    - name: Stat the enabled-site symlink
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/testapp.conf
      register: compose_app_nginx_symlink
      failed_when: >-
        not compose_app_nginx_symlink.stat.exists
        or not compose_app_nginx_symlink.stat.islnk

    - name: Stat the packaged default vhost (must be removed)
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: compose_app_nginx_default
      failed_when: compose_app_nginx_default.stat.exists

    - name: Report the nginx-flow result
      ansible.builtin.debug:
        msg: "host-nginx flow: cert untouched (creates:), site deployed + enabled, default vhost removed"
