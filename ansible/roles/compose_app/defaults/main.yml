---
# compose_app: shared scaffolding for the single-project docker-compose app
# guests (immich, immich_ml, nextcloud). Callers include this role's task files
# with the vars below — nothing here is app-specific; every value a caller
# diverges on is a parameter:
#   tasks/docker.yml     -> install Docker Engine (via docker_engine)
#   tasks/nginx.yml      -> host-nginx TLS terminator task flow
#   tasks/main.yml       -> compose systemd-unit lifecycle (deploy/enable/start)
#   tasks/backup_lib.yml -> deploy the write_prom_metrics helper library

# Render-only escape hatch mirrored from each caller's own skip flag
# (immich_skip_install / skip_immich_ml_deploy / skip_nextcloud_deploy): gates
# the service-touching steps so the molecule scenarios render + assert without a
# container runtime. Callers pass compose_app_skip_install: "{{ <their flag> }}".
compose_app_skip_install: false

# --- Compose systemd unit (tasks/main.yml + templates/compose.service.j2) -----
compose_app_service_name: compose            # unit basename (<name>.service)
compose_app_description: "Docker Compose stack"
compose_app_working_directory: /opt/compose
# Empty list => the unit omits the RequiresMountsFor line AND its comment.
compose_app_requires_mounts_for: []
compose_app_requires_mounts_comment: []
compose_app_reconcile_comment: []
# systemd treats `yes` and `true` identically; standardised on `yes`.
compose_app_remain_after_exit: "yes"

# --- Backup-metrics helper library (tasks/backup_lib.yml) ---------------------
compose_app_backup_lib_dest: /usr/local/lib/compose-app-backup-lib.sh
# Noun in the size-gauge HELP line ("Size of the most recent <object> in bytes").
compose_app_backup_size_help_object: dump

# --- Host nginx TLS terminator (tasks/nginx.yml) ------------------------------
# Cert material (paths + dir mode) and the self-signed placeholder parameters
# are per-app; the site template stays in the caller's role (byte-unchanged) and
# is passed by an eagerly-resolved absolute path (compose_app_nginx_site_template).
compose_app_nginx_cert_dir: /etc/nginx/ssl
compose_app_nginx_cert_dir_mode: "0750"
compose_app_nginx_ssl_cert: /etc/nginx/ssl/fullchain.pem
compose_app_nginx_ssl_key: /etc/nginx/ssl/privkey.pem
compose_app_nginx_site_name: site.conf
compose_app_nginx_site_template: ""
compose_app_nginx_self_signed_days: 3650
compose_app_nginx_self_signed_subj: "/CN=vm.esweiss.com"
# Falsy => no -addext (nextcloud); a value => -addext "subjectAltName=<value>".
compose_app_nginx_self_signed_san: "DNS:*.esweiss.com"
# Whether to seed the self-signed placeholder + secure its key. Independent of
# skip_install because immich's molecule asserts the placeholder is seeded, while
# nextcloud gates seeding on a real deploy.
compose_app_nginx_bootstrap_cert: true
