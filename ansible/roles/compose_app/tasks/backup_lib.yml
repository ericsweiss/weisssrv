---
# Deploy the shared write_prom_metrics helper library that the caller's
# <app>-backup-run.sh sources. The metric-name prefix + .prom path are passed as
# call args (so the logic is byte-identical across apps); only the size-gauge
# HELP noun (compose_app_backup_size_help_object) is set per app at render time.
# Sourced, not executed, so 0644 is sufficient. Ungated: the render-only molecule
# scenarios exercise the sourced wrapper against a mocked docker.
- name: Deploy the shared backup-metrics helper library
  ansible.builtin.template:
    src: write_prom_metrics.sh.j2
    dest: "{{ compose_app_backup_lib_dest }}"
    owner: root
    group: root
    mode: "0644"
