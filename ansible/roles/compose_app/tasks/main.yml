---
# Shared compose systemd-unit lifecycle for the docker-compose app guests
# (immich, immich_ml, nextcloud). The caller renders its app-specific
# compose.yml/.env/config first (notifying "Restart compose stack"), then
# includes this to deploy + enable + start the shared compose.service unit.
#
# One unit template serves all three guests; RemainAfterExit is standardised to
# `yes` (systemd treats `yes` and `true` identically).

- name: Deploy the compose systemd unit
  ansible.builtin.template:
    src: compose.service.j2
    dest: "/etc/systemd/system/{{ compose_app_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd (compose_app)
    - Restart compose stack

- name: Enable the compose unit
  ansible.builtin.systemd:
    name: "{{ compose_app_service_name }}.service"
    enabled: true
    daemon_reload: true
  when: not (compose_app_skip_install | default(false))

# Bring the stack up (and apply any pending compose/.env/config changes) before
# the caller's post-start steps (health probes, backups) run.
- name: Flush handlers so the compose stack starts with current config
  ansible.builtin.meta: flush_handlers

- name: Ensure the compose stack is running
  ansible.builtin.systemd:
    name: "{{ compose_app_service_name }}.service"
    state: started
  when: not (compose_app_skip_install | default(false))
