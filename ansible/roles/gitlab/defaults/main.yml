---
# GitLab EE (CE features) role defaults
#
# IMPORTANT: This role requires environment variables for secrets.
# Always deploy using: task gitlab:deploy
# Direct ansible-playbook usage will fail validation for SMTP and SAML secrets.
# See docs/27-gitlab-deployment.md for deployment instructions.
#
# Required environment variables (set by Taskfile from 1Password):
#   - GITLAB_ROOT_PASSWORD: Initial root user password
#   - GITLAB_SAML_CERT_FINGERPRINT: Authentik SAML certificate SHA1 fingerprint
#   - GITLAB_API_TOKEN: Admin PAT (api scope) for the Web IDE Application
#     Settings block (asserted on every non-skip deploy)
#   - SMTP_RELAY_USER: SMTP relay username
#   - SMTP_RELAY_PASSWORD: SMTP relay password
#   - ROOT_EMAIL_ALIAS: Admin email address
#   - SSH_PUBLIC_KEY: SSH public key for VM access

# GitLab URLs (use external domain as canonical - internal access still works via AdGuard rewrites)
gitlab_external_url: "https://git.ericsweiss.com"
# SSH host for clone URLs - same as web URL since git.ericsweiss.com is DNS-only (not Cloudflare-proxied)
# This provides a unified URL for both HTTPS and SSH access
gitlab_ssh_host: "git.ericsweiss.com"
# SSH port displayed in clone URLs - external port (the router forwards 2222 to
# the VM; the role's iptables PREROUTING rule redirects 2222 -> 22 locally)
gitlab_ssh_port: 2222

# Repository storage path
# Default: /var/opt/gitlab/git-data (on root disk)
# Override to use separate storage: /mnt/gitlab-repos/git-data
gitlab_git_data_dir: "/var/opt/gitlab/git-data"

# Container Registry
gitlab_registry_enabled: true
gitlab_registry_external_url: "https://registry.git.ericsweiss.com"
# Registry blob store path
# Default: /var/opt/gitlab/gitlab-rails/shared/registry (Omnibus default, on root disk)
# Override to use separate storage: /mnt/gitlab-repos/registry
# When overridden, the role relocates the existing store onto the new path
# once (tasks/main.yml) and gitlab.rb.j2 emits gitlab_rails['registry_path'].
gitlab_registry_data_dir: "/var/opt/gitlab/gitlab-rails/shared/registry"

# GitLab Pages
gitlab_pages_enabled: true
gitlab_pages_external_url: "https://pages.git.ericsweiss.com"

# Web IDE extension host (CVE-2026-5816 / single-origin fallback fix)
# The extension host serves VS Code static assets and per-extension iframes.
# It MUST be a different origin from gitlab_external_url so the browser SOP
# isolates extension code from the GitLab session cookie.
# DNS + cert + IngressRoute are managed by Terraform/Flux; see:
#   - terraform/cloudflare/dns.tf (cloudflare_record.ide_git*)
#   - kubernetes/apps/vm-ingress/gitlab-certificate.yaml (gitlab-web-ide-wildcard)
#   - kubernetes/apps/vm-ingress/gitlab.yaml (gitlab-web-ide)
# Bare hostname (no wildcard prefix). GitLab generates per-extension subdomains
# <ext-id>.ide.git.ericsweiss.com from this parent. The wildcard cert + IngressRoute
# cover those generated hostnames. The Application Settings API rejects the wildcard
# form with HTTP 400 (regex pattern: ^(?=.{1,253}$)(?!-)(?:[a-zA-Z0-9-]{1,63}(?<!-)\.)+[a-zA-Z]{2,63}...$).
gitlab_web_ide_extension_host_domain: "ide.git.ericsweiss.com"
gitlab_web_ide_marketplace_enabled: true
gitlab_web_ide_single_origin_fallback: false  # Disabled on purpose - SOP breach mitigation

# GitLab Application Settings API token (PAT with api scope)
# Used to drive Web IDE settings that have no Omnibus gitlab.rb key on the
# pinned release; re-check for a gitlab.rb equivalent on major bumps.
gitlab_api_token: "{{ lookup('ansible.builtin.env', 'GITLAB_API_TOKEN') }}"

# SMTP configuration (via smtp-relay.esweiss.com)
gitlab_smtp_enabled: true
gitlab_smtp_address: "smtp-relay.esweiss.com"
gitlab_smtp_port: 587
gitlab_smtp_user: "{{ lookup('ansible.builtin.env', 'SMTP_RELAY_USER') }}"
gitlab_smtp_password: "{{ lookup('ansible.builtin.env', 'SMTP_RELAY_PASSWORD') }}"
gitlab_smtp_domain: "esweiss.com"
gitlab_smtp_authentication: "login"
gitlab_smtp_enable_starttls_auto: true
gitlab_email_from: "gitlab@esweiss.com"
gitlab_email_display_name: "GitLab"
gitlab_email_reply_to: "noreply@esweiss.com"

# SAML SSO (Authentik)
gitlab_saml_enabled: true
gitlab_saml_label: "Authentik"
# Get fingerprint from Authentik: System → Certificates → expand cert → SHA1 Fingerprint
gitlab_saml_idp_cert_fingerprint: "{{ lookup('ansible.builtin.env', 'GITLAB_SAML_CERT_FINGERPRINT') }}"
# SSO URL from Authentik provider
gitlab_saml_idp_sso_url: "https://auth.ericsweiss.com/application/saml/git/sso/binding/redirect/"

# SAML Group-based access control (Authentik group names)
gitlab_saml_groups_attribute: "http://schemas.xmlsoap.org/claims/Group"
# required_groups: Only users in these groups can sign in (empty = allow all).
# Auto-created users are unblocked and SAML auto sign-in is on (gitlab.rb.j2),
# so an empty list auto-provisions every Authentik user; default to the prod
# groups (also pinned in group_vars/gitlab_servers.yml) so a dropped group_var
# fails closed instead of silently opening sign-up.
gitlab_saml_required_groups:
  - "gitlab-users"
  - "gitlab-admins"
# admin_groups: Users in these groups become GitLab admins
gitlab_saml_admin_groups: []
# external_groups: Users in these groups are marked as external (limited access)
gitlab_saml_external_groups: []

# Let's Encrypt: Disabled in GitLab (hardcoded in gitlab.rb.j2).
# Traefik also has its own cert-manager/Let's Encrypt path; we don't
# want GitLab racing for the same cert. Instead, the cert distributed
# to /etc/gitlab/ssl by acme_certs (see host_vars/dns-01.yml's
# cert_distribution_targets) is what GitLab's nginx serves on 443.

# NGINX configuration. With gitlab_nginx_listen_https: true, GitLab's
# nginx terminates TLS using the distributed cert and serves 443. The
# Traefik IngressRoute uses scheme: https with a serversTransport so
# the Traefik->GitLab hop is no longer plaintext on the LAN.
#
# The gitlab role asserts that the cert + key exist on disk before
# `gitlab-ctl reconfigure` runs, so a fresh-deploy where acme_certs
# hasn't yet distributed the cert fails the play with a clear pointer
# instead of crashing the omnibus chef recipe. Set false to fall back
# to plain port 80 (e.g. during initial bring-up before first cert
# distribution) — but note registry/pages nginx always terminate TLS
# with the same cert, so a certless bring-up also needs
# gitlab_registry_enabled/gitlab_pages_enabled: false.
gitlab_nginx_listen_https: true
gitlab_nginx_listen_port: 443
gitlab_nginx_ssl_certificate: /etc/gitlab/ssl/fullchain.pem
gitlab_nginx_ssl_certificate_key: /etc/gitlab/ssl/privkey.pem
# TLS floor for the omnibus nginx(es) (web UI + registry + pages). TLS 1.3-only:
# every consumer is Traefik (which speaks 1.3), so the Traefik->GitLab hops all
# negotiate 1.3 and legacy protocol versions are refused.
gitlab_nginx_ssl_protocols: "TLSv1.3"

# Trust proxy headers from Traefik
gitlab_nginx_real_ip_trusted_addresses:
  - 192.168.0.0/24
  - 10.42.0.0/16
  - 10.43.0.0/16

# Sources allowed to reach GitLab's unauthenticated monitoring endpoints
# (/-/metrics, /-/readiness, /-/liveness; /-/health is unrestricted). Narrow
# least-privilege default: loopback + the firewall-gated LAN /24. GitLab
# matches the real_ip from X-Forwarded-For, so Traefik-proxied probes are
# matched on their REAL client IP. Deployments whose verify probes run in
# k8s pods must opt the pod CIDR in via inventory (prod does — see
# group_vars/gitlab_servers.yml for the full mechanics).
gitlab_monitoring_whitelist:
  - 127.0.0.1
  - 192.168.0.0/24

# Backup configuration. Default: local OS-disk path (Proxmox VM snapshots for
# DR). Prod (group_vars/gitlab_servers.yml) relocates the landing onto the
# offsite-eligible tank/backups/apps NFS export so the tarball +
# gitlab-secrets.json + gitlab.rb ride the archsync file walk into restic B2.
gitlab_backup_path: "/var/opt/gitlab/backups"

# NFS-backed backup landing (relocates gitlab_backup_path onto the NAS). When
# enabled the role mounts the export at gitlab_backup_mountpoint and gitlab_
# backup_path should point there (set both in group_vars). Mounted OVER TLS
# (xprtsec=tls) BY HOSTNAME so the *.esweiss.com cert verifies — the VM runs
# tlshd via the nfs_tls role in the deploy play, and the per-app export
# (/export/backups-apps/gitlab) REQUIRES TLS. The tarball lands on the
# aes-256-gcm tank/backups dataset. The export all_squashes every write to
# 1000:2000, so the git user's tarball + the root-run secrets copy both land
# 1000:2000 on a 02775 dir (the NAS owns the dir — the role does NOT chown it).
gitlab_backup_nfs_enabled: false
gitlab_backup_nfs_server: "pve-nas-01.esweiss.com"
gitlab_backup_nfs_export: "/backups-apps/gitlab"
gitlab_backup_nfs_options: "vers=4.2,rw,hard,noatime,_netdev,nofail,xprtsec=tls"
gitlab_backup_mountpoint: "/mnt/backups-offsite"
# The Rails config `gitlab-ctl reconfigure` renders from gitlab.rb. The role
# reads it back to prove the backup path actually converged — gitlab.rb alone is
# inert, and a lost `notify: Reconfigure gitlab` once left the two disagreeing
# for four days with no offsite tarball and every metric green.
gitlab_effective_rails_config: "/var/opt/gitlab/gitlab-rails/etc/gitlab.yml"
# Components excluded from the tarball (gitlab-backup SKIP=). The container
# registry was ~7.5G and CI artifacts ~1.4G — vs a 16K repo — so unfiltered
# backups were ~6.5-8.5G/day and overran the 99G OS disk (DiskUsageCritical ->
# failed backups -> no prune -> vicious cycle). Both are non-irreplaceable
# (registry images are re-pushable from CI, and the registry blob store now
# lives on the /mnt/gitlab-repos zvol — see gitlab_registry_data_dir — which is
# raw-ZFS replicated ssd/appdata -> archive; artifacts are ephemeral CI
# output), so a DB+repos+config backup is the right scope and is sub-GB. Set to
# "" to back up everything (only with a dedicated/off-OS-disk path).
gitlab_backup_skip: "registry,artifacts"
# Retention. With registry/artifacts skipped the tarball is small, so 3 days on
# the OS disk is comfortable; raise only alongside a larger/dedicated (e.g.
# NFS-backed) backup volume. Prune only runs after a SUCCESSFUL backup.
gitlab_backup_keep_time: 259200  # 3 days in seconds

# Backup schedule (gitlab-backup.timer / .service — replaced the root cron entry
# so the run gets RequiresMountsFor on the NFS landing zone + a bounded timeout).
gitlab_backup_oncalendar: "*-*-* 02:00:00"
gitlab_backup_timer_random_delay: "0"
# Generous ceiling for a full DB+repos backup plus the offsite copy.
gitlab_backup_service_timeout: "3h"

# Performance tuning for 16GB RAM
gitlab_puma_workers: 3
gitlab_sidekiq_concurrency: 15

# Root password (from 1Password, used only on initial setup)
gitlab_root_password: "{{ lookup('ansible.builtin.env', 'GITLAB_ROOT_PASSWORD') }}"

# SSH security hardening
# fail2ban protects against brute-force attacks on port 2222 (open to internet)
gitlab_fail2ban_enabled: true

# WAN-exposed Git SSH (2222, REDIRECTed to 22) reaches the full system sshd, so
# without a login restriction every local account accepts internet pubkey auth
# attempts — defeating the firewall's admin-only intent for :22. Restrict sshd
# to the git user (any source) and the admin user from admin networks only
# (LAN + the full Tailscale CGNAT range — 100.64.0.0/10, not 100.64.*, so
# devices at 100.65+ aren't locked out). CI/Ansible as the admin user is
# unaffected: runner pods SNAT to k3s node IPs inside the LAN /24.
gitlab_ssh_allowusers_enabled: true
gitlab_ssh_allowed_users:
  - git
  - "{{ admin_user | default('eric') }}@192.168.0.0/24"
  - "{{ admin_user | default('eric') }}@100.64.0.0/10"

# Kernel tuning for Redis safety (vm.overcommit_memory + THP disable). On real
# GitLab hosts this MUST stay on (the missing sysctl caused the 2026-06-02
# Redis BGSAVE SIGSEGV that broke git push). The molecule scenario overrides
# this to false so converge.yml doesn't mutate the CI runner's kernel state.
gitlab_kernel_tuning_enabled: true
