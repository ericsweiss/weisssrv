---
# GitLab EE installation and configuration

# =============================================================================
# Mount additional persistent disks (ZFS zvols)
# =============================================================================

# Mount additional persistent disks (ZFS zvols attached as SCSI devices by proxmox_vm role)
- name: Mount additional persistent disks
  ansible.builtin.include_role:
    name: zvol_mount
  vars:
    zvol_mount_disks: "{{ vm_additional_disks | default([]) }}"
  when: vm_additional_disks is defined and vm_additional_disks | length > 0

# =============================================================================
# Prepare GitLab data directories
# =============================================================================
# If using separate storage for repositories, create the git-data directory
# with proper ownership. The 'git' user/group (998:998) is created by GitLab.

- name: Create git-data directories on external storage
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ gitlab_git_data_dir }}"
    - "{{ gitlab_git_data_dir }}/repositories"
  when: gitlab_git_data_dir != '/var/opt/gitlab/git-data'
  notify: Reconfigure gitlab

# /etc/gitlab/ssl is the canonical Omnibus location for TLS material.
# acme_certs (running on dns-01) drops fullchain.pem + privkey.pem into
# this directory after every Let's Encrypt renewal; nginx is reloaded
# via `gitlab-ctl hup nginx`. Create the directory ahead of the first
# distribution.
#
# Mode 0750 (not 0755): Omnibus's own /etc/gitlab/ssl is 0700 by
# default; this is the next-tighter mode that still lets the gitlab
# user (running nginx as gitlab-www) traverse to read the certs via
# group permissions when needed.
- name: Ensure /etc/gitlab/ssl exists with secure mode
  ansible.builtin.file:
    path: /etc/gitlab/ssl
    state: directory
    owner: root
    group: root
    mode: "0750"

# Fresh-deploy guard: before `gitlab-ctl reconfigure` runs (notified by
# the gitlab.rb template task below), assert that the cert + key files
# exist when listen_https is true. Otherwise the omnibus chef recipe
# crashes at the nginx::ssl recipe with a confusing error. acme_certs
# distribution is event-driven from dns-01; on a brand-new GitLab VM
# it hasn't fired yet, so either flip gitlab_nginx_listen_https to
# false for the initial deploy OR deploy the cert manually first.
- name: Verify SSL cert exists when nginx HTTPS is enabled
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ gitlab_nginx_ssl_certificate }}"
    - "{{ gitlab_nginx_ssl_certificate_key }}"
  register: gitlab_ssl_files
  when: gitlab_nginx_listen_https | default(false)

- name: Assert SSL cert files are present
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      {{ item.item }} missing — either run cert distribution from
      dns-01 first (`task dns:deploy`), or set
      gitlab_nginx_listen_https: false for the initial deploy and
      flip back to true after the first cert push.
  loop: "{{ gitlab_ssl_files.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: gitlab_nginx_listen_https | default(false)

# Ownership is set after GitLab install (git user doesn't exist yet)
# See task below: "Set ownership on git-data directory"

# =============================================================================
# GitLab Installation
# =============================================================================

- name: Validate required SMTP credentials
  ansible.builtin.assert:
    that:
      - gitlab_smtp_user | default('') | length > 0
      - gitlab_smtp_password | default('') | length > 0
    fail_msg: >-
      SMTP credentials not set. Ensure SMTP_RELAY_USER and SMTP_RELAY_PASSWORD
      are provided via 'op run'. Run: task gitlab:deploy
    success_msg: "SMTP credentials present"
  no_log: true
  when: gitlab_smtp_enabled

- name: Validate required SAML credentials (if enabled)
  ansible.builtin.assert:
    that:
      - gitlab_saml_idp_cert_fingerprint | default('') | length > 0
    fail_msg: >-
      SAML certificate fingerprint not set. Get it from Authentik:
      System → Certificates → expand cert → SHA1 Fingerprint.
      Then add to 1Password: GitLab SSO/saml-cert-fingerprint.
      Or set gitlab_saml_enabled: false to skip SSO configuration.
    success_msg: "SAML certificate fingerprint present"
  no_log: true
  when: gitlab_saml_enabled

- name: Validate GitLab root password is set
  ansible.builtin.assert:
    that:
      - gitlab_root_password | default('') | length > 0
    fail_msg: >-
      GitLab root password not set. Ensure GITLAB_ROOT_PASSWORD is set
      in 1Password and provided via 'op run'. Run: task gitlab:deploy
    success_msg: "GitLab root password present"
  no_log: true

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - openssh-server
      - perl
      - tzdata
      - cron
      - gnupg
    state: present
    update_cache: true
  when: not (skip_gitlab_install | default(false))

# =============================================================================
# Kernel tuning required by GitLab Omnibus Redis
# =============================================================================
# Two settings the upstream Redis docs require, applied here because Omnibus
# does not manage them itself:
#
#   1. vm.overcommit_memory=1 — RDB BGSAVE forks the Redis process. Under the
#      kernel default (0, heuristic) the forked child's COW reservation
#      accounting can be refused by the heuristic, killing the child even
#      though almost none of the COW pages were written. The child dying
#      trips Redis' `stop-writes-on-bgsave-error`, which turns every GitLab
#      write into a 500 (gitlab-shell reports "Internal API unreachable").
#
#   2. transparent_hugepage=never — under THP=always, COW page faults in the
#      forked child can promote to 2MB hugepages and segfault inside libc on
#      memcpy/memcmp. Same outcome: BGSAVE child dies, writes blocked. THP has
#      no sysctl knob, so a systemd oneshot writes the sysfs file at boot.
#
# We observed both symptoms on this VM 2026-06-02 (every push failing); applying
# both fixes resolved it. Refs:
#   https://redis.io/docs/latest/operate/oss_and_stack/management/admin/
#   https://docs.gitlab.com/omnibus/settings/redis.html
#
# The kernel-tuning tasks below are gated only by gitlab_kernel_tuning_enabled
# and are deliberately independent of skip_gitlab_install: tuning is required
# for Redis safety on any host that already runs the Omnibus stack, and the
# operator who passes skip_gitlab_install=true does so to avoid touching the
# apt package — they still expect the host config to converge.

- name: Install sysctl drop-in for Redis memory overcommit
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-gitlab-redis.conf
    content: |
      # Managed by Ansible gitlab role.
      # Redis RDB BGSAVE forks the server; the COW child's allocation
      # accounting is refused by the default heuristic (0) under common
      # conditions, killing the child and tripping stop-writes-on-bgsave-error.
      vm.overcommit_memory=1
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl gitlab-redis
  when: gitlab_kernel_tuning_enabled | default(true)

- name: Install systemd unit to disable Transparent Huge Pages
  ansible.builtin.copy:
    dest: /etc/systemd/system/disable-transparent-hugepages.service
    content: |
      # Managed by Ansible gitlab role.
      # THP=always causes Redis BGSAVE child to segfault inside libc when COW
      # faults promote to 2MB hugepages. Redis docs explicitly recommend
      # disabling THP. No sysctl knob — write the sysfs file at boot.
      #
      # Operator note: to reapply at runtime after a manual override, use
      # `systemctl restart disable-transparent-hugepages.service`. `start` is
      # a no-op while RemainAfterExit holds the "active" state.
      [Unit]
      Description=Disable Transparent Huge Pages (Redis recommendation)
      DefaultDependencies=no
      After=sysinit.target local-fs.target
      Before=basic.target

      [Service]
      Type=oneshot
      # Attempt both writes independently, but track each rc so a silent
      # kernel rename (one of the sysfs paths missing) fails the unit.
      # `sh -c "a ; b"` would have returned only b's rc, silently masking
      # a failure on the first write — the exact future-proofing we want.
      # Each continuation is joined by systemd at parse time.
      #
      # `$$` escapes a literal `$` past systemd's own variable expansion —
      # see systemd.service(5): unset `$VAR`/`${VAR}` references in ExecStart
      # expand to empty BEFORE the command runs under sh, so a bare `$?` /
      # `$rc` would be silently stripped and `exit` would run with no arg.
      ExecStart=/bin/sh -c 'rc=0; \
          echo never > /sys/kernel/mm/transparent_hugepage/enabled || rc=$$?; \
          echo never > /sys/kernel/mm/transparent_hugepage/defrag || rc=$$?; \
          exit $$rc'
      RemainAfterExit=yes

      [Install]
      WantedBy=basic.target
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for THP unit
  when: gitlab_kernel_tuning_enabled | default(true)

# This task keeps the unit enabled + active at all times (idempotent on a
# stable host) — it intentionally duplicates the handler's enable/start. The
# handler additionally does `state: restarted` when the unit *file* changes,
# which is required to re-run the new ExecStart since RemainAfterExit makes
# `state: started` a no-op for an already-active oneshot.
- name: Enable + start THP-disable service (also applies at runtime)
  ansible.builtin.systemd:
    name: disable-transparent-hugepages.service
    enabled: true
    state: started
    daemon_reload: true
  when: gitlab_kernel_tuning_enabled | default(true)

- name: Check if GitLab is installed
  ansible.builtin.stat:
    path: /opt/gitlab/bin/gitlab-ctl
  register: gitlab_installed

# Clean up old keyring format (.asc) if it exists - we use .gpg now
# This prevents "Conflicting values set for option Signed-By" errors
- name: Remove old GitLab keyring files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/share/keyrings/gitlab-ee.asc
    - /etc/apt/sources.list.d/gitlab_gitlab-ee.list
  when:
    - not (skip_gitlab_install | default(false))

# Check if keyring already exists (needed for conditional dearmor)
- name: Check if GitLab keyring exists
  ansible.builtin.stat:
    path: /usr/share/keyrings/gitlab-ee.gpg
  register: gitlab_keyring_exists
  when:
    - not (skip_gitlab_install | default(false))

- name: Download GitLab repository GPG key (ASCII armored)
  ansible.builtin.get_url:
    url: https://packages.gitlab.com/gpg.key
    dest: /tmp/gitlab-ee.asc
    mode: '0644'
    # Force download to check for key rotation
    # The checksum comparison happens automatically by get_url
    force: true
  register: gitlab_gpg_key_download
  when:
    - not (skip_gitlab_install | default(false))

- name: Verify GitLab GPG key fingerprint (primary key must match exactly)
  ansible.builtin.shell: |
    set -o pipefail
    # Extract the primary key fingerprint (first fpr record after first pub)
    # and verify it matches the expected value exactly (full-line match).
    primary_fpr=$(gpg --show-keys --with-colons /tmp/gitlab-ee.asc 2>/dev/null \
        | awk -F: '/^pub/{p=1; next} p && /^fpr/{print $10; exit}')
    [ "$primary_fpr" = "F6403F6544A38863DAA0B6E03F01618A51312F3F" ]
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - not (skip_gitlab_install | default(false))

# Dearmor the key for compatibility with all Debian/apt configurations
# Binary .gpg format is preferred over ASCII .asc for signed-by
# Re-run when the downloaded key changes (handles key rotation)
- name: Convert GPG key to binary format
  ansible.builtin.shell: |
    gpg --yes --dearmor -o /usr/share/keyrings/gitlab-ee.gpg < /tmp/gitlab-ee.asc
  when:
    - not (skip_gitlab_install | default(false))
    - gitlab_gpg_key_download.changed | default(false) or not (gitlab_keyring_exists.stat.exists | default(false))
  changed_when: true

- name: Set permissions on GPG keyring
  ansible.builtin.file:
    path: /usr/share/keyrings/gitlab-ee.gpg
    mode: '0644'
  when:
    - not (skip_gitlab_install | default(false))

- name: Clean up temporary ASCII key
  ansible.builtin.file:
    path: /tmp/gitlab-ee.asc
    state: absent
  when:
    - not (skip_gitlab_install | default(false))

- name: Add GitLab EE repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/gitlab-ee.gpg] https://packages.gitlab.com/gitlab/gitlab-ee/debian/ {{ ansible_distribution_release }} main"
    state: present
    filename: gitlab-ee
  when:
    - not (skip_gitlab_install | default(false))

# Install or upgrade GitLab EE to the pinned version. allow_change_held_packages
# upgrades through the apt hold without the old unhold/hold cycle (which
# reported changed every run and briefly left the package unheld).
# EXTERNAL_URL and GITLAB_ROOT_PASSWORD are only used during initial install
# and are safely ignored on upgrades (existing config is preserved)
- name: Install/upgrade GitLab EE (pinned version)
  ansible.builtin.apt:
    name: "gitlab-ee={{ gitlab_version }}"
    state: present
    update_cache: true
    allow_downgrade: true
    allow_change_held_packages: true
  environment:
    EXTERNAL_URL: "{{ gitlab_external_url }}"
    GITLAB_ROOT_PASSWORD: "{{ gitlab_root_password }}"
  no_log: true
  when:
    - not (skip_gitlab_install | default(false))
  notify:
    - Reconfigure gitlab

# Always re-apply hold after apt task to prevent unintended upgrades via apt upgrade.
# This is not a handler because handlers only run when notified, and the apt task
# is a no-op when the pinned version is already installed (no notification).
# Without this, gitlab-ee would remain unheld after no-op playbook runs.
- name: Hold GitLab package to prevent unintended upgrades
  ansible.builtin.dpkg_selections:
    name: gitlab-ee
    selection: hold
  when:
    - not (skip_gitlab_install | default(false))

# Set ownership on external git-data directory after GitLab creates git user
# Check ownership first to avoid expensive recursive traversal on every run
#
# NOTE: We only check top-level directory ownership because:
# 1. Subdirectory drift (where children have wrong ownership but parent is correct)
#    is extremely rare - it would require manual intervention or a bug in GitLab
# 2. Checking a child path would add complexity and still not cover all cases
# 3. If subdirectory ownership drift occurs, gitlab-rake gitlab:check will report
#    it, and manual 'chown -R git:git /mnt/gitlab-repos/git-data' can fix it
- name: Check git-data directory ownership
  ansible.builtin.stat:
    path: "{{ gitlab_git_data_dir }}"
  register: git_data_stat
  when: gitlab_git_data_dir != '/var/opt/gitlab/git-data'

- name: Set ownership on git-data directory (non-recursive)
  ansible.builtin.file:
    path: "{{ gitlab_git_data_dir }}"
    state: directory
    owner: git
    group: git
    mode: "0700"
  when:
    - gitlab_git_data_dir != '/var/opt/gitlab/git-data'
    - git_data_stat.stat.exists

# Only recurse if ownership doesn't match (first-time setup or after migration)
# NOTE: This task is guarded by the ownership check - if top-level dir has correct
# ownership, we assume subdirs are also correct. Use changed_when: false since
# the guard condition means this only runs when needed.
- name: Set recursive ownership on git-data directory (only if needed)
  ansible.builtin.command:
    cmd: chown -R git:git "{{ gitlab_git_data_dir }}"
  changed_when: false
  when:
    - gitlab_git_data_dir != '/var/opt/gitlab/git-data'
    - git_data_stat.stat.exists
    - git_data_stat.stat.pw_name != 'git' or git_data_stat.stat.gr_name != 'git'

- name: Deploy gitlab.rb configuration
  ansible.builtin.template:
    src: gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: Reconfigure gitlab

- name: Create backup directory
  ansible.builtin.file:
    path: "{{ gitlab_backup_path }}"
    state: directory
    owner: git
    group: git
    mode: '0700'

# The wrapper runs the backup, copies gitlab-secrets.json + gitlab.rb on
# success (a restore needs them to decrypt CI variables, 2FA, runner
# tokens), and emits node_exporter textfile metrics so GitLabBackupFailed /
# GitLabBackupStale can fire. It owns the create-then-copy semantics the
# cron line used to carry inline.
- name: Deploy GitLab backup wrapper (runs backup + emits metric)
  ansible.builtin.template:
    src: gitlab-backup-run.sh.j2
    dest: /usr/local/sbin/gitlab-backup-run.sh
    owner: root
    group: root
    mode: "0755"

# The cron module keys on `name`, so changing `job` rewrites the existing
# line in place — no duplicate or stale entry from the prior inline command.
- name: Configure GitLab backup cron job
  ansible.builtin.cron:
    name: "GitLab backup"
    minute: "0"
    hour: "2"
    job: "/usr/local/sbin/gitlab-backup-run.sh"
    user: root

- name: Check if GitLab is installed (for check mode safety)
  ansible.builtin.stat:
    path: /opt/gitlab/bin/gitlab-ctl
  register: gitlab_ctl_check

- name: Ensure GitLab is running
  ansible.builtin.command: /opt/gitlab/bin/gitlab-ctl status
  register: gitlab_status
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - gitlab_ctl_check.stat.exists

- name: Start GitLab if not running
  ansible.builtin.command: /opt/gitlab/bin/gitlab-ctl start
  when:
    - not ansible_check_mode
    - gitlab_ctl_check.stat.exists
    - gitlab_status.rc is defined
    - gitlab_status.rc != 0
  changed_when: true

# =============================================================================
# SSH Port Redirect ({{ gitlab_ssh_port }} -> 22)
# =============================================================================
# GitLab SSH runs on port 22, but external access uses port {{ gitlab_ssh_port }}.
# We use iptables to redirect incoming connections on {{ gitlab_ssh_port }} to 22.

- name: Install iptables-persistent for saving rules
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

# Ensure exactly one iptables NAT rule for SSH redirect (port 2222 -> 22)
# Uses check-then-add pattern for idempotency, with duplicate cleanup for existing drift
- name: Check PREROUTING SSH redirect rule count
  ansible.builtin.shell: |
    set -o pipefail
    iptables -t nat -S PREROUTING 2>/dev/null | grep -c '\-\-dport {{ gitlab_ssh_port }} .* REDIRECT \-\-to-ports 22' || echo 0
  args:
    executable: /bin/bash
  register: prerouting_rule_count
  changed_when: false

- name: Remove duplicate PREROUTING SSH redirect rules (keep none, re-add below)
  ansible.builtin.shell: |
    while iptables -t nat -C PREROUTING -p tcp --dport {{ gitlab_ssh_port }} -j REDIRECT --to-port 22 2>/dev/null; do
      iptables -t nat -D PREROUTING -p tcp --dport {{ gitlab_ssh_port }} -j REDIRECT --to-port 22
    done
  when:
    - prerouting_rule_count.stdout | int > 1
    - not ansible_check_mode
  changed_when: true

- name: Add PREROUTING SSH redirect rule for GitLab SSH
  ansible.builtin.iptables:
    table: nat
    chain: PREROUTING
    protocol: tcp
    destination_port: "{{ gitlab_ssh_port }}"
    jump: REDIRECT
    to_ports: "22"
    state: present
  when: not ansible_check_mode
  notify: Save iptables rules

- name: Check OUTPUT SSH redirect rule count
  ansible.builtin.shell: |
    set -o pipefail
    iptables -t nat -S OUTPUT 2>/dev/null | grep -c '\-\-dport {{ gitlab_ssh_port }} .* REDIRECT \-\-to-ports 22' || echo 0
  args:
    executable: /bin/bash
  register: output_rule_count
  changed_when: false

- name: Remove duplicate OUTPUT SSH redirect rules (keep none, re-add below)
  ansible.builtin.shell: |
    while iptables -t nat -C OUTPUT -o lo -p tcp --dport {{ gitlab_ssh_port }} -j REDIRECT --to-port 22 2>/dev/null; do
      iptables -t nat -D OUTPUT -o lo -p tcp --dport {{ gitlab_ssh_port }} -j REDIRECT --to-port 22
    done
  when:
    - output_rule_count.stdout | int > 1
    - not ansible_check_mode
  changed_when: true

- name: Add OUTPUT SSH redirect rule for GitLab SSH loopback
  ansible.builtin.iptables:
    table: nat
    chain: OUTPUT
    protocol: tcp
    destination_port: "{{ gitlab_ssh_port }}"
    jump: REDIRECT
    to_ports: "22"
    out_interface: lo
    state: present
  when: not ansible_check_mode
  notify: Save iptables rules

# =============================================================================
# GitLab-specific fail2ban jail (SSH protection)
# =============================================================================
# Port {{ gitlab_ssh_port }} is open to the internet for Git SSH access.
# fail2ban protects against brute-force attacks on GitLab SSH.
#
# NOTE: fail2ban is installed and configured globally by the base role.
# This section adds a GitLab-specific jail for Git SSH on port {{ gitlab_ssh_port }}.
#
# Architecture: GitLab Git SSH uses OpenSSH with AuthorizedKeysCommand
# to authenticate the 'git' user. SSH auth failures are logged to the
# systemd journal (not gitlab-shell.log), so we use the standard sshd
# filter with journald backend.

- name: Check if fail2ban is installed
  ansible.builtin.command: which fail2ban-server
  register: gitlab_fail2ban_installed
  changed_when: false
  failed_when: false
  when: gitlab_fail2ban_enabled | default(true)

- name: Create fail2ban jail for GitLab SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/gitlab-ssh.conf
    content: |
      # Managed by Ansible - GitLab SSH brute-force protection
      # Monitors OpenSSH authentication failures for Git SSH access
      # External Git SSH uses port {{ gitlab_ssh_port }} (open to internet via NAT)
      #
      # GitLab uses OpenSSH with AuthorizedKeysCommand for git user auth.
      # SSH failures are logged to systemd journal, not gitlab-shell.log.
      # We use the built-in sshd filter with journald backend.
      [gitlab-ssh]
      enabled = true
      port = 22,{{ gitlab_ssh_port }}
      filter = sshd[mode=aggressive]
      # Use systemd journal - Debian 13 logs SSH to journal
      backend = systemd
      journalmatch = _SYSTEMD_UNIT=ssh.service + _COMM=sshd
      maxretry = 5
      findtime = 10m
      bantime = 1h
      # Ban IPs at the firewall level
      banaction = iptables-multiport
    mode: "0644"
    owner: root
    group: root
  notify: Restart fail2ban
  when:
    - gitlab_fail2ban_enabled | default(true)
    - gitlab_fail2ban_installed.rc | default(1) == 0

# Clean up old custom filter (no longer needed - using built-in sshd filter)
- name: Remove obsolete gitlab-shell filter
  ansible.builtin.file:
    path: /etc/fail2ban/filter.d/gitlab-shell.conf
    state: absent
  notify: Restart fail2ban
  when:
    - gitlab_fail2ban_enabled | default(true)
    - gitlab_fail2ban_installed.rc | default(1) == 0

# =============================================================================
# Web IDE extension host configuration (API-driven; no Omnibus key on 18.11)
# =============================================================================
# CVE-2026-5816 mitigation: disable single-origin fallback once the
# self-hosted ide.git.ericsweiss.com extension host is reachable.
# Settings are sequenced so the host domain is configured BEFORE the fallback
# is removed. The marketplace toggle is best-effort: 400/403 are accepted
# (Free-tier rejection) by the explicit fail-task gate below; any other
# non-2xx (or connection error) aborts the play with a diagnostic body.
#
# Runs from the Ansible controller (delegate_to: localhost) so the API call
# uses the same network path as the operator's browser, not the VM's
# outbound connectivity.

- name: Web IDE | Apply Application Settings
  when: not (skip_gitlab_install | default(false))
  block:
    - name: Web IDE | Assert GitLab API token is present
      ansible.builtin.assert:
        that:
          - gitlab_api_token | default('') | length > 0
          - not (gitlab_api_token | default('') | string).startswith('op://')
        fail_msg: >-
          GITLAB_API_TOKEN env var is empty or unresolved (still op:// reference).
          Web IDE security settings (CVE-2026-5816 mitigation) cannot be applied via API.
          Ensure 'op run' resolves op://Homelab/GitLab API Token/credential.
          Run: task gitlab:deploy
        success_msg: "GitLab API token present"
      no_log: true

    # All API tasks below run on the controller via delegate_to: localhost.
    # The `vars:` block on each task forces local connection and disables
    # become — needed because inventory-level `ansible_become: true` is a
    # connection var that propagates through delegate_to and isn't overridden
    # by task-level `become: false`. Without this we'd try `sudo` on the
    # operator's workstation, which prompts for a password and stalls.

    # Retries cover the case where this task runs while GitLab is
    # reconfiguring after a version bump (handlers flush at end of play; this
    # task is in the middle, so the install/upgrade may have just restarted
    # the service). 20 * 15s = 5 min ceiling.
    - name: Web IDE | Read current GitLab application settings
      ansible.builtin.uri:
        url: "{{ gitlab_external_url }}/api/v4/application/settings"
        method: GET
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        return_content: true
        status_code: 200
      register: gitlab_app_settings
      delegate_to: localhost
      vars:
        ansible_connection: local
        ansible_become: false
      no_log: true
      retries: 20
      delay: 15
      until: gitlab_app_settings.status == 200

    - name: Web IDE | Set extension host domain
      ansible.builtin.uri:
        url: "{{ gitlab_external_url }}/api/v4/application/settings"
        method: PUT
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        body_format: form-urlencoded
        body:
          vscode_extension_marketplace_extension_host_domain: "{{ gitlab_web_ide_extension_host_domain }}"
        status_code: 200
      delegate_to: localhost
      vars:
        ansible_connection: local
        ansible_become: false
      no_log: true
      when: >-
        gitlab_app_settings.json.vscode_extension_marketplace_extension_host_domain | default(none)
        != gitlab_web_ide_extension_host_domain

    - name: Web IDE | Enable VS Code extension marketplace (best-effort on Free)
      ansible.builtin.uri:
        url: "{{ gitlab_external_url }}/api/v4/application/settings"
        method: PUT
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        body_format: form-urlencoded
        body:
          vscode_extension_marketplace_enabled: "{{ gitlab_web_ide_marketplace_enabled | string | lower }}"
        # failed_when:false + the next two tasks (debug + fail) surface 400/403
        # (Free-tier rejection - acceptable), 401/5xx (real errors), and
        # connection errors (uri sets `failed: true` with no `status` field).
      register: gitlab_marketplace_result
      failed_when: false
      delegate_to: localhost
      vars:
        ansible_connection: local
        ansible_become: false
      no_log: true
      when: >-
        gitlab_app_settings.json.vscode_extension_marketplace_enabled | default(none)
        != gitlab_web_ide_marketplace_enabled

    - name: Web IDE | Surface marketplace enable result on failure or non-200
      ansible.builtin.debug:
        msg: >-
          Marketplace enable
          HTTP {{ gitlab_marketplace_result.status | default('connection error') }}
          ({{ gitlab_marketplace_result.msg | default('no msg') }}).
          Body: {{ gitlab_marketplace_result.json
                  | default(gitlab_marketplace_result.content | default('-')) }}
      when:
        - gitlab_marketplace_result is defined
        - (gitlab_marketplace_result.failed | default(false))
          or (gitlab_marketplace_result.status | default(200) != 200)
      changed_when: false

    - name: Web IDE | Fail loudly on unexpected marketplace API status
      ansible.builtin.fail:
        msg: >-
          Marketplace enable failed:
          HTTP {{ gitlab_marketplace_result.status | default('connection error') }}.
          Expected 200 (success) or 400/403 (Free-tier rejection).
          See debug output above for body / error message.
          Investigate (token scope, GitLab version field rename, network path) before re-running.
      when:
        - gitlab_marketplace_result is defined
        - not (gitlab_marketplace_result.skipped | default(false))
        - (gitlab_marketplace_result.failed | default(false))
          or (gitlab_marketplace_result.status | default(200) not in [200, 400, 403])

    # Pre-flight only when we're DISABLING fallback (the dangerous direction).
    # Re-enabling fallback (rollback) doesn't need the host to be reachable.
    # Probe matches Test 8 in `task gitlab:verify`; 10 * 15s = 2.5 min ceiling
    # is enough for a fresh DNS-01 cert issuance.
    - name: Web IDE | Verify extension host route is reachable before disabling fallback
      ansible.builtin.uri:
        url: "https://probe.{{ gitlab_web_ide_extension_host_domain }}/-/health"
        method: GET
        status_code: 200
      register: gitlab_web_ide_probe
      delegate_to: localhost
      vars:
        ansible_connection: local
        ansible_become: false
      retries: 10
      delay: 15
      until: gitlab_web_ide_probe.status == 200
      changed_when: false
      when:
        - not gitlab_web_ide_single_origin_fallback
        - gitlab_app_settings.json.vscode_extension_marketplace_single_origin_fallback_enabled | default(none)
          != gitlab_web_ide_single_origin_fallback

    - name: Web IDE | Disable single-origin fallback (CVE-2026-5816)
      ansible.builtin.uri:
        url: "{{ gitlab_external_url }}/api/v4/application/settings"
        method: PUT
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        body_format: form-urlencoded
        body:
          vscode_extension_marketplace_single_origin_fallback_enabled: "{{ gitlab_web_ide_single_origin_fallback | string | lower }}"
        status_code: 200
      delegate_to: localhost
      vars:
        ansible_connection: local
        ansible_become: false
      no_log: true
      when: >-
        gitlab_app_settings.json.vscode_extension_marketplace_single_origin_fallback_enabled | default(none)
        != gitlab_web_ide_single_origin_fallback
