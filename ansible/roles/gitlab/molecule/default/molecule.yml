---
# Per-role Molecule scenario. Shared driver/provisioner/verifier/scenario config
# is inherited from ansible/molecule/base.yml (applied via the `-c` flag in
# test-all-roles.sh and the CI molecule-tests matrix). Only the per-role platform
# and inventory live here (plus role-specific provisioner.env / remote_tmp / a
# custom scenario where needed).
platforms:
  - name: gitlab-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    prepare: prepare.yml
  env:
    SMTP_RELAY_USER: testsmtp@example.com
    SMTP_RELAY_PASSWORD: testsmtppassword
    GITLAB_ROOT_PASSWORD: testrootpassword123
    GITLAB_SAML_CERT_FINGERPRINT: AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD
  inventory:
    group_vars:
      all:
        gitlab_version: 18.9.1-ee.0
        gitlab_external_url: https://git.test.local
        gitlab_ssh_host: git.test.local
        # Prod default, so the NAT redirect tasks and fail2ban jail are
        # exercised with the real 2222 -> 22 mapping.
        gitlab_ssh_port: 2222
        gitlab_registry_enabled: true
        gitlab_registry_external_url: https://registry.git.test.local
        gitlab_pages_enabled: true
        gitlab_pages_external_url: https://pages.git.test.local
        gitlab_smtp_enabled: true
        gitlab_smtp_address: smtp-relay.test.local
        gitlab_smtp_port: 587
        gitlab_smtp_domain: test.local
        gitlab_smtp_authentication: login
        gitlab_smtp_enable_starttls_auto: true
        gitlab_email_from: gitlab@test.local
        gitlab_email_display_name: GitLab
        gitlab_email_reply_to: noreply@test.local
        gitlab_saml_enabled: true
        gitlab_saml_label: Authentik
        gitlab_saml_idp_sso_url: https://auth.test.local/application/saml/git/sso/binding/redirect/
        gitlab_saml_groups_attribute: http://schemas.xmlsoap.org/claims/Group
        gitlab_saml_required_groups: []
        gitlab_saml_admin_groups:
          - gitlab-admins
        gitlab_saml_external_groups: []
        gitlab_nginx_listen_https: false
        gitlab_nginx_listen_port: 80
        gitlab_nginx_real_ip_trusted_addresses:
          - 192.168.0.0/24
          - 10.42.0.0/16
        gitlab_backup_path: /var/opt/gitlab/backups
        gitlab_backup_keep_time: 604800
        gitlab_puma_workers: 2
        gitlab_sidekiq_concurrency: 10
        gitlab_git_data_dir: /mnt/gitlab-repos/git-data
        # Exercises the registry_path template branch. The Omnibus default store
        # path is absent in the container, so the stop/mv relocation correctly
        # skips (only the gitlab.rb render is covered here).
        gitlab_registry_data_dir: /mnt/gitlab-repos/registry
        skip_ssh_config: true
        skip_dns_config: true
        gitlab_kernel_tuning_enabled: false
