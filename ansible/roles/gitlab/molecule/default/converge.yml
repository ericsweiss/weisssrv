---
# Converge playbook for gitlab role testing
# Tests configuration template rendering and directory/file management
# Skips actual GitLab package installation (too heavy for CI)
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Wait for apt locks to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
              fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
          sleep 1
        done
      args:
        executable: /bin/bash
      changed_when: false
      when: ansible_os_family == "Debian"

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install minimal prerequisites for testing
      ansible.builtin.apt:
        name:
          - ca-certificates
          - systemd
          - cron
          # openssh-server: the role installs + validates an AllowUsers
          # drop-in (sshd -t), which needs sshd and its host keys present.
          - openssh-server
        state: present
      when: ansible_os_family == "Debian"

  roles:
    - role: gitlab
      vars:
        skip_gitlab_install: true

  post_tasks:
    # Branch coverage for the nginx TLS half of gitlab.rb.j2 (prod default is
    # listen_https: true; the converged file above tests the HTTP fallback).
    # Rendered to a side path so verify can assert both branches from one
    # converge without flip-flopping /etc/gitlab/gitlab.rb (which would break
    # the idempotence run).
    # The role template lives outside the scenario dir; the relative src is
    # deliberate (renders the role's own template without re-running the role).
    - name: Render gitlab.rb with nginx TLS enabled (branch coverage)  # noqa: no-relative-paths
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/gitlab.rb.j2"
        dest: /tmp/gitlab.rb.tls
        mode: "0600"
      vars:
        gitlab_nginx_listen_https: true
        gitlab_nginx_listen_port: 443

    # Whitespace-stripping contract of the backup wrapper: an overridden
    # gitlab_backup_skip containing spaces must render to a single
    # comma-separated SKIP value.
    - name: Render backup wrapper with a spaced SKIP override  # noqa: no-relative-paths
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/gitlab-backup-run.sh.j2"
        dest: /tmp/gitlab-backup-run-spaced.sh
        mode: "0755"
      vars:
        gitlab_backup_skip: "registry, artifacts"

    # NFS-backed render (fail-closed guard). BACKUP_PATH points at a non-mountpoint
    # and PROM_DIR at a temp dir so verify can run it and assert it aborts with
    # success=0 without clobbering the main /var/lib/node_exporter metric.
    - name: Render backup wrapper with NFS-backed landing (fail-closed guard)  # noqa: no-relative-paths
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/gitlab-backup-run.sh.j2"
        dest: /tmp/gitlab-backup-run-nfs.sh
        mode: "0755"
      vars:
        gitlab_backup_nfs_enabled: true
        gitlab_backup_path: /tmp/gitlab-nfs-not-a-mount
        node_exporter_host_textfile_dir: /tmp/gitlab-nfs-guard
