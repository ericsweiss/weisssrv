---
- name: Reconfigure gitlab
  ansible.builtin.command: /opt/gitlab/bin/gitlab-ctl reconfigure
  changed_when: true

- name: Restart gitlab
  ansible.builtin.command: /opt/gitlab/bin/gitlab-ctl restart
  changed_when: true

- name: Save iptables rules
  ansible.builtin.command: netfilter-persistent save
  changed_when: true

- name: Restart sshd
  ansible.builtin.service:
    name: "{{ ssh_service_name | default('ssh') }}"
    state: restarted

# Apply the vm.overcommit_memory drop-in immediately so a freshly-deployed VM
# doesn't have to wait for a reboot for the kernel knob to take effect.
#
# ansible.posix.sysctl with sysctl_file is idempotent against the file that
# the preceding `copy:` task already wrote (same key, same value) — same
# pattern as nic_tuning. It additionally runs `sysctl -p` (reload: true) to
# apply at runtime.
- name: Reload sysctl gitlab-redis
  ansible.posix.sysctl:
    name: vm.overcommit_memory
    value: "1"
    state: present
    sysctl_file: /etc/sysctl.d/99-gitlab-redis.conf
    reload: true

# Picks up gitlab-backup.service/.timer unit-file changes. The enable task also
# daemon-reloads, so this is belt-and-suspenders for a service-file-only change.
- name: Reload systemd for gitlab-backup
  ansible.builtin.systemd:
    daemon_reload: true

# Picks up unit-file changes for the THP unit. `state: restarted` (not started)
# is required because RemainAfterExit makes `started` a no-op for an already-
# active oneshot — the new ExecStart wouldn't run until next boot otherwise.
- name: Reload systemd for THP unit
  ansible.builtin.systemd:
    name: disable-transparent-hugepages.service
    daemon_reload: true
    state: restarted

# Restart fail2ban if installed - check existence first since base role may have it disabled
- name: Check if fail2ban service exists
  ansible.builtin.stat:
    path: /lib/systemd/system/fail2ban.service
  register: gitlab_fail2ban_service_file
  listen: Restart fail2ban

- name: Restart fail2ban service
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  when: gitlab_fail2ban_service_file.stat.exists | default(false)
  listen: Restart fail2ban
