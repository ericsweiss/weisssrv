---
# Per-role Molecule scenario. Shared driver/provisioner/verifier/scenario config
# is inherited from ansible/molecule/base.yml (applied via the `-c` flag in
# test-all-roles.sh and the CI molecule-tests matrix). Only the per-role platform
# and inventory live here (plus role-specific provisioner.env / remote_tmp / a
# custom scenario where needed).
platforms:
  - name: home-assistant-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    prepare: prepare.yml
  env:
    HA_OIDC_CLIENT_ID: test-oidc-client-id
    HA_OIDC_CLIENT_SECRET: test-oidc-client-secret
  inventory:
    group_vars:
      all:
        home_assistant_render_only: true
        # Pin the staging dir so verify.yml can assert on stable
        # /tmp/ha-{configuration,secrets}.yaml paths (production uses a
        # private per-run tempdir instead).
        home_assistant_staging_dir: /tmp
        home_assistant_ssl_enabled: true
        home_assistant_trusted_proxies:
          - 192.168.0.0/24
          - 10.42.0.0/16
          - 10.43.0.0/16
