---
# Converge playbook — runs the role with home_assistant_render_only=true
# (set in molecule.yml group_vars). The role writes the two rendered
# files to /tmp on the container and skips every ssh/scp/`ha core
# check` task. The verify play then asserts on /tmp content.
- name: Converge
  hosts: all
  become: true
  roles:
    - role: home_assistant
