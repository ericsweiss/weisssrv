---
# Prepare playbook — minimal setup for a render-only contract test.
#
# The role in render-only mode only writes /tmp/ha-configuration.yaml
# and /tmp/ha-secrets.yaml on the test container; it doesn't apt-install
# anything or touch systemd. We still wait for systemd here so the
# container is in a deterministic state for the rest of the run, and
# pre-create /root/.ansible/tmp because Ansible's command/template
# tasks need it.
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    # Render-only contract test: no apt install, so the shared prepare-base
    # (systemd-wait + temp-dir) is imported WITHOUT prepare-apt-disable.
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule/tasks/prepare-base.yml

    - name: Gather facts
      ansible.builtin.setup:
