---
# Prepare playbook — minimal setup for a render-only contract test.
#
# The role in render-only mode only writes /tmp/ha-configuration.yaml
# and /tmp/ha-secrets.yaml on the test container; it doesn't apt-install
# anything or touch systemd. We still wait for systemd here so the
# container is in a deterministic state for the rest of the run, and
# pre-create /root/.ansible/tmp because Ansible's command/template
# tasks need it.
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for systemd to be ready
      ansible.builtin.raw: |
        for i in $(seq 1 30); do
          if systemctl is-system-running 2>/dev/null | grep -qE '(running|degraded)'; then
            exit 0
          fi
          sleep 1
        done
        systemctl status >/dev/null 2>&1 && exit 0
        exit 1
      changed_when: false
      retries: 3
      delay: 2
      register: systemd_ready
      until: systemd_ready.rc == 0

    - name: Ensure ansible temp directory exists
      ansible.builtin.raw: |
        mkdir -p /root/.ansible/tmp
        chmod 700 /root/.ansible/tmp
      changed_when: false

    - name: Gather facts
      ansible.builtin.setup:
