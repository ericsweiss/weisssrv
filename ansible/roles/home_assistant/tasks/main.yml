---
# Home Assistant configuration management
#
# IMPORTANT: Home Assistant OS is NOT a traditional Linux distribution
# This role only manages configuration files via SSH/SCP
# It does NOT attempt to manage the OS itself via Ansible

# ---------------------------------------------------------------------
# SSH host-key pinning
# ---------------------------------------------------------------------
# HAOS exposes SSH on port 22222 as root with no sudo, so we cannot use
# the standard accept-new TOFU path used elsewhere — a swapped HAOS
# image would silently re-register a new host key. Instead the operator
# captures the HAOS host key once, pins it in host_vars/home.yml as
# `home_assistant_host_key`, and we:
#   1. Assert the pin is non-empty (fail fast with remediation).
#   2. Write it into the running user's known_hosts so the subsequent
#      scp/ssh calls succeed under StrictHostKeyChecking=yes.
# In render-only mode (molecule contract test) we skip both — the
# scenario doesn't actually contact HAOS.
# See ansible/roles/home_assistant/README.md "Host-key pinning".

- name: Assert HAOS SSH host-key pin is set
  ansible.builtin.assert:
    that:
      - home_assistant_host_key | default('') | length > 0
    fail_msg: |
      home_assistant_host_key is unset. Capture the HAOS host key with:

          ssh-keyscan -t ed25519 -p {{ home_assistant_ssh_port }} {{ home_assistant_host }}

      then paste the algorithm+key portion (without the leading host:port)
      into ansible/inventories/prod/host_vars/home.yml as
      `home_assistant_host_key`. See the home_assistant role README
      "Host-key pinning" section for details.
    success_msg: "HAOS SSH host-key pin is present"
  when: not (home_assistant_render_only | default(false))

- name: Pin HAOS host key in operator known_hosts
  ansible.builtin.known_hosts:
    name: "[{{ home_assistant_host }}]:{{ home_assistant_ssh_port }}"
    key: "[{{ home_assistant_host }}]:{{ home_assistant_ssh_port }} {{ home_assistant_host_key }}"
    state: present
  when: not (home_assistant_render_only | default(false))

- name: Validate required SMTP relay credentials and admin email are set
  ansible.builtin.assert:
    that:
      - home_assistant_smtp_username | default('') | length > 0
      - home_assistant_smtp_password | default('') | length > 0
      # admin_email feeds the notify recipient in configuration.yaml; a
      # missing ADMIN_EMAIL env would render admin_email: "" and silently
      # break notifications.
      - home_assistant_admin_email | default('') | length > 0
    fail_msg: >-
      SMTP relay credentials or admin email are not set. Ensure SMTP_RELAY_USER,
      SMTP_RELAY_PASSWORD and ADMIN_EMAIL environment variables are provided via 'op run'.
      Run deployment with: task home-assistant:deploy-config (which injects 1Password secrets)
    success_msg: "SMTP relay credentials and admin email are present"
  no_log: true

- name: Validate required OIDC credentials are set
  ansible.builtin.assert:
    that:
      - home_assistant_oidc_client_id | default('') | length > 0
      - home_assistant_oidc_client_secret | default('') | length > 0
    fail_msg: >-
      OIDC credentials are not set. Ensure HA_OIDC_CLIENT_ID and
      HA_OIDC_CLIENT_SECRET environment variables are provided via 'op run'.
      Run deployment with: task home-assistant:deploy-config (which injects 1Password secrets)
    success_msg: "OIDC credentials are present"
  no_log: true

- name: Verify HAOS SSL cert files exist (only when ssl_enabled)
  # configuration.yaml.j2 references /ssl/{fullchain,privkey}.pem when
  # home_assistant_ssl_enabled=true. If those files aren't there yet
  # (fresh HAOS, factory reset, or before acme_certs has pushed the
  # cert), HAOS fails to bind 8123 after the next restart. Pre-flight
  # the check so we fail loudly with a clear remediation message rather
  # than crashing HAOS post-deploy. Mirror of gitlab/tasks/main.yml's
  # cert-presence assert.
  ansible.builtin.command:
    cmd: >
      ssh -p {{ home_assistant_ssh_port }}
      -o BatchMode=yes -o ConnectTimeout=10
      -o StrictHostKeyChecking=yes
      root@{{ home_assistant_host }}
      'test -r /ssl/fullchain.pem && test -r /ssl/privkey.pem'
  register: haos_ssl_cert_check
  changed_when: false
  failed_when: false
  when:
    - home_assistant_ssl_enabled | default(false)
    - not (home_assistant_render_only | default(false))

- name: Assert HAOS SSL cert files are in place when ssl_enabled
  ansible.builtin.assert:
    that:
      - haos_ssl_cert_check.rc == 0
    fail_msg: |
      home_assistant_ssl_enabled is true but /ssl/fullchain.pem or
      /ssl/privkey.pem is missing on HAOS. Run `task dns:deploy` first
      so acme_certs distributes the cert (cert_distribution_targets
      entry host=home in host_vars/dns-01.yml), or temporarily set
      home_assistant_ssl_enabled=false in host_vars/home.yml until the
      cert is in place.
  when:
    - home_assistant_ssl_enabled | default(false)
    - not (home_assistant_render_only | default(false))

- name: Deploy and validate Home Assistant configuration
  block:
    # Render into a per-run private tempdir instead of fixed, predictable
    # controller-side /tmp paths (mktemp/tempfile is the repo standard for
    # this risk class — see the ansible.cfg staging in .gitlab-ci.yml). The
    # molecule render-only scenario pins home_assistant_staging_dir=/tmp so
    # verify.yml can assert on stable paths.
    - name: Create private staging directory for rendered config
      ansible.builtin.tempfile:
        state: directory
        prefix: ha-config.
      register: ha_staging_tmp
      when: home_assistant_staging_dir | length == 0

    - name: Resolve the staging directory path
      ansible.builtin.set_fact:
        # The default() covers check mode, where tempfile is skipped and
        # nothing is rendered anyway.
        ha_staging_dir: >-
          {{ home_assistant_staging_dir
             if home_assistant_staging_dir | length > 0
             else (ha_staging_tmp.path | default('/tmp')) }}

    - name: Generate Home Assistant configuration from template
      ansible.builtin.template:
        src: configuration.yaml.j2
        dest: "{{ ha_staging_dir }}/ha-configuration.yaml"
        mode: '0644'

    - name: Generate Home Assistant secrets from template
      ansible.builtin.template:
        src: secrets.yaml.j2
        dest: "{{ ha_staging_dir }}/ha-secrets.yaml"
        mode: '0600'
      no_log: true

    - name: Stage HA config and secrets to HAOS /tmp (single round trip)
      # Both files copied to remote /tmp first so the install step has
      # both staged before either is moved into /config. If the scp
      # fails, /config keeps its prior state — staging both files first
      # prevents a half-updated /config where configuration.yaml
      # references !secret keys not yet in the deployed secrets.yaml.
      ansible.builtin.command:
        cmd: >
          scp -P {{ home_assistant_ssh_port }}
          -o BatchMode=yes -o ConnectTimeout=10
          -o StrictHostKeyChecking=yes
          {{ ha_staging_dir }}/ha-configuration.yaml
          {{ ha_staging_dir }}/ha-secrets.yaml
          root@{{ home_assistant_host }}:/tmp/
      changed_when: true
      no_log: true  # secrets.yaml content visible in command stdout on error
      when: not (home_assistant_render_only | default(false))

    - name: Back up current HA config before install (rollback source on check failure)
      ansible.builtin.command:
        cmd: >
          ssh -p {{ home_assistant_ssh_port }}
          -o BatchMode=yes -o ConnectTimeout=10
          -o StrictHostKeyChecking=yes
          root@{{ home_assistant_host }}
          'set -e;
           for f in configuration secrets; do
             if [ -f {{ home_assistant_config_path }}/$f.yaml ]; then
               cp -a {{ home_assistant_config_path }}/$f.yaml {{ home_assistant_config_path }}/$f.yaml.bak;
             else
               rm -f {{ home_assistant_config_path }}/$f.yaml.bak;
             fi;
           done'
      register: ha_config_backup
      changed_when: false
      when: not (home_assistant_render_only | default(false))

    - name: Atomically install HA configuration files
      # Install secrets.yaml first so configuration.yaml's `!secret`
      # references always resolve against an up-to-date secrets file.
      # The chained && short-circuits the second mv if the first fails,
      # leaving /config in its prior consistent state.
      ansible.builtin.command:
        cmd: >
          ssh -p {{ home_assistant_ssh_port }}
          -o BatchMode=yes -o ConnectTimeout=10
          -o StrictHostKeyChecking=yes
          root@{{ home_assistant_host }}
          'mv /tmp/ha-secrets.yaml {{ home_assistant_config_path }}/secrets.yaml &&
           mv /tmp/ha-configuration.yaml {{ home_assistant_config_path }}/configuration.yaml'
      changed_when: true
      when: not (home_assistant_render_only | default(false))

    - name: Validate Home Assistant configuration
      ansible.builtin.command:
        cmd: >
          ssh -p {{ home_assistant_ssh_port }}
          -o BatchMode=yes -o ConnectTimeout=10
          -o StrictHostKeyChecking=yes
          root@{{ home_assistant_host }}
          'ha core check'
      register: ha_config_check
      changed_when: false
      # `ha core check` returns non-zero on an invalid config; fail the play
      # so the operator is alerted rather than silently shipping a config that
      # breaks HAOS on its next restart.
      failed_when: ha_config_check.rc != 0
      when: not (home_assistant_render_only | default(false))

    - name: Display configuration check results
      ansible.builtin.debug:
        var: ha_config_check.stdout_lines
      when: not (home_assistant_render_only | default(false))

    - name: Remove config backups after a successful `ha core check`
      ansible.builtin.command:
        cmd: >
          ssh -p {{ home_assistant_ssh_port }}
          -o BatchMode=yes -o ConnectTimeout=10
          -o StrictHostKeyChecking=yes
          root@{{ home_assistant_host }}
          'rm -f {{ home_assistant_config_path }}/configuration.yaml.bak
                 {{ home_assistant_config_path }}/secrets.yaml.bak'
      register: ha_backup_cleanup
      changed_when: false
      # Best-effort: the deploy already passed `ha core check`, so a cleanup
      # hiccup must NOT enter the rescue block and roll back a good config.
      failed_when: false
      when: not (home_assistant_render_only | default(false))

    - name: Warn if HA backup cleanup failed (deploy still succeeded)
      ansible.builtin.debug:
        msg: >-
          WARNING: HA config deployed and passed `ha core check`, but removing
          the .bak files failed (rc={{ ha_backup_cleanup.rc | default('n/a') }});
          stale backups will be overwritten on the next deploy.
      when:
        - not (home_assistant_render_only | default(false))
        - ha_backup_cleanup.rc | default(0) != 0

  rescue:
    # The install or `ha core check` failed. Restore the pre-deploy /config so a
    # bad config is never left live (HAOS would break on its next restart). A
    # .bak exists iff the file existed before THIS deploy (the backup task clears
    # a stale .bak otherwise), so per file: a .bak present -> restore it; no .bak
    # but the file now present -> it was newly created by this deploy, so remove
    # the bad new file. (This SSH-to-HAOS path is not exercised by molecule,
    # which runs render_only=true.)
    - name: Roll back HA config to the pre-deploy state
      ansible.builtin.command:
        cmd: >
          ssh -p {{ home_assistant_ssh_port }}
          -o BatchMode=yes -o ConnectTimeout=10
          -o StrictHostKeyChecking=yes
          root@{{ home_assistant_host }}
          'set -e;
           rolled_back=0;
           for f in configuration secrets; do
             if [ -f {{ home_assistant_config_path }}/$f.yaml.bak ]; then
               mv {{ home_assistant_config_path }}/$f.yaml.bak {{ home_assistant_config_path }}/$f.yaml;
               rolled_back=1;
             elif [ -f {{ home_assistant_config_path }}/$f.yaml ]; then
               rm -f {{ home_assistant_config_path }}/$f.yaml;
               rolled_back=1;
             fi;
           done;
           echo "rolled_back=$rolled_back"'
      register: ha_rollback
      changed_when: "'rolled_back=1' in (ha_rollback.stdout | default(''))"
      # Only roll back once the backup task has actually run and succeeded.
      # If the rescue fires earlier (e.g. a failed scp before backup), no
      # reliable .bak exists and the remove-new-file branch could otherwise
      # delete the LIVE config — so skip rollback entirely in that case.
      when:
        - not (home_assistant_render_only | default(false))
        - ha_config_backup is defined
        - ha_config_backup is succeeded

    - name: Re-raise the failure with the rollback outcome
      ansible.builtin.fail:
        # Each string literal is kept on ONE line: in this `>-` scalar the
        # if/else keywords are more-indented (newlines preserved), and a literal
        # split across lines would embed those newlines+indent in the rendered
        # message. (Block-style {% if %} would be cleaner but trips ansible-lint
        # jinja[spacing], so the single-expression ternary stays.)
        msg: >-
          Home Assistant deploy failed.
          {{ 'Render-only: no remote change was made.'
             if (home_assistant_render_only | default(false))
             else ('/config rolled back to its pre-deploy state (backups restored / new files removed); fix the template or secrets and re-run.'
                   if ('rolled_back=1' in (ha_rollback.stdout | default('')))
                   else 'Nothing to roll back (the deploy failed before the install), so /config was not modified.') }}
          Review the check/SSH output above.

  always:
    - name: Clean up the private staging directory
      ansible.builtin.file:
        path: "{{ ha_staging_tmp.path }}"
        state: absent
      when: (ha_staging_tmp.path | default('')) | length > 0

    - name: Clean up rendered files in a pinned staging directory
      ansible.builtin.file:
        path: "{{ home_assistant_staging_dir }}/{{ item }}"
        state: absent
      loop:
        - ha-configuration.yaml
        - ha-secrets.yaml
      # In render-only mode (molecule contract test) we leave the
      # rendered files in place so the verify play can slurp + assert
      # on their contents. Production deploys always reach the cleanup.
      when:
        - not (home_assistant_render_only | default(false))
        - home_assistant_staging_dir | length > 0

    - name: Clean up any leftover staged files on HAOS
      # If the play aborted between scp-stage and the atomic install
      # mv, /tmp on HAOS has stale ha-{configuration,secrets}.yaml.
      # Best-effort cleanup; failure is OK (files already gone /
      # HAOS unreachable).
      ansible.builtin.command:
        cmd: >
          ssh -p {{ home_assistant_ssh_port }}
          -o BatchMode=yes -o ConnectTimeout=10
          -o StrictHostKeyChecking=yes
          root@{{ home_assistant_host }}
          'rm -f /tmp/ha-configuration.yaml /tmp/ha-secrets.yaml'
      changed_when: false
      failed_when: false
      when: not (home_assistant_render_only | default(false))
