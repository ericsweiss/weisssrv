---
# Home Assistant role defaults

# Home Assistant VM connection details
home_assistant_host: "192.168.0.154"
home_assistant_ssh_port: 22222
home_assistant_config_path: "/config"

# HAOS SSH host key (pin for StrictHostKeyChecking=yes).
# Empty default forces the pre-flight assert in tasks/main.yml to fail
# with a clear remediation message rather than tripping an
# undefined-variable error. Override in host_vars/home.yml — see the
# role README "Host-key pinning" section for the capture command.
home_assistant_host_key: ""

# SMTP configuration (from 1Password via environment variables)
home_assistant_smtp_host: "smtp-relay.esweiss.com"
home_assistant_smtp_port: 587
home_assistant_smtp_encryption: "starttls"
home_assistant_smtp_username: "{{ lookup('ansible.builtin.env', 'SMTP_RELAY_USER') }}"
home_assistant_smtp_password: "{{ lookup('ansible.builtin.env', 'SMTP_RELAY_PASSWORD') }}"
home_assistant_smtp_sender: "home-assistant@esweiss.com"
home_assistant_smtp_sender_name: "Home Assistant"
home_assistant_admin_email: "{{ lookup('ansible.builtin.env', 'ADMIN_EMAIL') }}"

# Trusted proxies for reverse proxy setup
# INTENTIONAL: Broad ranges are required here because:
# - 192.168.0.0/24: Traefik runs on k3s agents with LAN IPs, and the specific
#   node handling traffic can change (MetalLB speaker election). Trusting the
#   full LAN is acceptable since this is a private network behind a firewall.
# - 10.42.0.0/16 and 10.43.0.0/16: k3s internal pod/service CIDRs. Traefik
#   pods forward X-Forwarded-For headers from these source IPs.
home_assistant_trusted_proxies:
  - "192.168.0.0/24"      # Local LAN (includes all Traefik ingress nodes)
  - "10.42.0.0/16"        # k3s pod network
  - "10.43.0.0/16"        # k3s service network

# SSO/OIDC configuration (from 1Password via environment variables)
home_assistant_oidc_client_id: "{{ lookup('ansible.builtin.env', 'HA_OIDC_CLIENT_ID') }}"
home_assistant_oidc_client_secret: "{{ lookup('ansible.builtin.env', 'HA_OIDC_CLIENT_SECRET') }}"

# TLS on the HA backend itself. When true, configuration.yaml's `http:`
# block adds ssl_certificate / ssl_key pointing at /ssl/{fullchain,privkey}.pem.
# acme_certs distributes the wildcard cert to /ssl/ on every renewal
# (cert_distribution_targets entry: host=home, ssh_port=22222, ssh_no_sudo=true).
#
# Defaults to false so a fresh HAOS deploy doesn't crash bind-time when
# the cert files haven't been distributed yet. host_vars/home.yml flips
# it true on the production HAOS once acme_certs has pushed the cert.
home_assistant_ssl_enabled: false

# Controller-side staging directory for the rendered configuration.yaml +
# secrets.yaml before they are scp'd to HAOS. Empty (production) -> a
# private per-run tempfile directory is created and removed in always:,
# so the rendered secrets never sit at a fixed, predictable /tmp path.
# The molecule render-only scenario pins this to /tmp so verify.yml can
# assert on stable paths.
home_assistant_staging_dir: ""

# Render-only mode. When true, the role renders configuration.yaml +
# secrets.yaml from templates into home_assistant_staging_dir on the
# controller and stops there — it does NOT touch the live HAOS (no ssh,
# no scp, no `ha core check`, no /ssl pre-flight). Used by the molecule
# contract test (the scp/ssh path can't be exercised against HAOS in a
# Docker container, but the templates are pure Jinja2 and easy to verify
# in isolation). Production deploys leave this false; the molecule
# converge flips it true (and pins the staging dir) so it can assert on
# rendered output. See ansible/roles/home_assistant/molecule/default/.
home_assistant_render_only: false
