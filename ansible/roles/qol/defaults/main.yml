---
admin_user: eric

# Packages installed by the QoL role (override per host/group as needed).
qol_packages:
  - zsh
  - neovim  # also in base common_packages; kept so `--tags qol` works standalone
  - fzf
  - ripgrep
  - fd-find

# Oh My Zsh pinned commit — the framework clone is checked out at this commit
# (no release tags upstream; pin for reproducibility).
# Update by checking: https://github.com/ohmyzsh/ohmyzsh/commits/master
omz_commit: "061f773dd356df52a8bccd5e73377c012f97ef14"

omz_theme: risto
omz_plugins:
  - 1password
  - ansible
  - command-not-found
  - docker
  - docker-compose
  - dotenv
  - fzf
  - git
  - golang
  - kubectl
  - rsync
  - systemd
  - terraform
  - tmux
  - vscode

nvim_plugins:
  - tpope/vim-fugitive
  - sheerun/vim-polyglot
  - joshdick/onedark.vim

# Must be provided by one of nvim_plugins (or be a built-in scheme). Applied
# with `silent!` so overriding nvim_plugins without the matching colorscheme
# plugin degrades to the default look instead of erroring at every start.
nvim_colorscheme: onedark
