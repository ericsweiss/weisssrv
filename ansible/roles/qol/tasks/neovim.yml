---
# Neovim setup with Vundle

- name: Create neovim config directory
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.config/nvim"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"
  when: admin_user != 'root'

- name: Create vim bundle directory for Vundle
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.vim/bundle"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"
  when: admin_user != 'root'

- name: Clone Vundle plugin manager
  ansible.builtin.git:
    repo: https://github.com/VundleVim/Vundle.vim.git
    dest: "/home/{{ admin_user }}/.vim/bundle/Vundle.vim"
    version: v0.10.2
    depth: 1
  become: true
  become_user: "{{ admin_user }}"
  when: admin_user != 'root'
  # GitHub git fetches intermittently reset from CI runners — retry before failing.
  register: vundle_clone
  until: vundle_clone is succeeded
  retries: 3
  delay: 5

- name: Deploy neovim init.vim configuration
  ansible.builtin.template:
    src: init.vim.j2
    dest: "/home/{{ admin_user }}/.config/nvim/init.vim"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
  when: admin_user != 'root'

- name: Install Vundle plugins
  ansible.builtin.command:
    cmd: nvim --headless +PluginInstall +qall
    # Sentinel keyed to the plugin LIST (sha1), not a fixed filename: a static
    # marker meant adding a plugin to nvim_plugins silently no-op'd (the marker
    # already existed), and a different first plugin would never re-trigger it.
    # A per-list-hash marker re-runs PluginInstall whenever the list changes,
    # while still avoiding the old "first plugin in the list" coupling.
    # (join(',') not '\n' — YAML would turn \n into a real newline here.)
    creates: "/home/{{ admin_user }}/.vim/bundle/.vundle-installed-{{ (nvim_plugins | default([]) | join(',')) | hash('sha1') }}"
  become: true
  become_user: "{{ admin_user }}"
  register: vundle_install
  when: admin_user != 'root'

# Write the list-hash sentinel only when PluginInstall actually ran, so the
# command's `creates:` guard skips it on subsequent plays until the plugin list
# changes (which yields a new hash → new marker → re-run).
- name: Mark Vundle plugins as installed (marker keyed to the plugin-list hash)
  ansible.builtin.copy:
    content: >-
      Vundle plugins installed by the qol role for plugin-list hash
      {{ (nvim_plugins | default([]) | join(',')) | hash('sha1') }}.
      Delete this marker to force a reinstall.
    dest: "/home/{{ admin_user }}/.vim/bundle/.vundle-installed-{{ (nvim_plugins | default([]) | join(',')) | hash('sha1') }}"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
  when:
    - admin_user != 'root'
    - vundle_install is changed
