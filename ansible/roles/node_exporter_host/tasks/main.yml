---
# Node Exporter (host-level) -- hardware metrics from bare-metal Proxmox hosts
# Installs from Debian packages and runs on port 9101 to avoid conflicting
# with the k3s DaemonSet node-exporter on port 9100.

- name: Install prometheus-node-exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600

# smartctl only makes sense on bare-metal Proxmox hosts (smartmon
# collector below, collect-state.sh, postflight, smartd on the NAS).
# The DNS/smtp LXCs and the GitLab VM have no visible block devices,
# so the package would just be dead weight there — same gate rationale
# as the drivetemp tasks below.
- name: Install smartmontools (bare-metal Proxmox hosts only)
  ansible.builtin.apt:
    name: smartmontools
    state: present
  when: inventory_hostname in groups['proxmox'] | default([])

# drivetemp only makes sense on bare-metal Proxmox hosts — it's a kernel
# module that exposes SATA drive temperatures via hwmon. DNS LXCs (which
# also receive this role for node_exporter) are unprivileged containers
# that can't load kernel modules, and they have no local disks anyway.
# Without this gate the modprobe task fails on dns-01/dns-02.
- name: Persist drivetemp kernel module load across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/drivetemp.conf
    content: "drivetemp\n"
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname in groups['proxmox'] | default([])

- name: Load drivetemp kernel module now (exposes SATA disk temps via hwmon)
  community.general.modprobe:
    name: drivetemp
    state: present
  when: inventory_hostname in groups['proxmox'] | default([])
  tags:
    - molecule-notest

- name: Create textfile collector directory
  ansible.builtin.file:
    path: "{{ node_exporter_host_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure systemd override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-node-exporter.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy node-exporter-host systemd override
  ansible.builtin.template:
    src: node-exporter-host.service.j2
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter_host

- name: Enable and start prometheus-node-exporter service
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending restarts before health check
  ansible.builtin.meta: flush_handlers

- name: Verify node_exporter is listening on port {{ node_exporter_host_port }}
  ansible.builtin.uri:
    url: "http://localhost:{{ node_exporter_host_port }}/metrics"
    return_content: false
    status_code: 200
  register: node_exporter_host_health
  retries: 5
  delay: 3
  until: node_exporter_host_health.status == 200
  when: not ansible_check_mode
  tags:
    - molecule-notest

# ---------------------------------------------------------------------------
# Corosync + pmxcfs health collector (Proxmox cluster nodes only)
# ---------------------------------------------------------------------------
# Detects the failure class that took out pve-nas-01's pmxcfs around
# 2026-05-09: corosync alive (so ProxmoxHostDown stayed green) but stuck at
# 99% CPU, /etc/pve/ha/manager_status frozen for weeks. The collector writes
# three metrics to the textfile dir so PrometheusRules in
# kubernetes/infrastructure/observability/kube-prometheus-stack/release.yaml
# (homelab.monitoring group) can fire on either condition + on collector
# meta-failure.
- name: Install corosync health collector script (proxmox hosts only)
  ansible.builtin.copy:
    src: corosync-health-collector.sh
    dest: /usr/local/sbin/corosync-health-collector.sh
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups['proxmox'] | default([])

- name: Install corosync health collector service unit
  ansible.builtin.template:
    src: corosync-health-collector.service.j2
    dest: /etc/systemd/system/corosync-health-collector.service
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname in groups['proxmox'] | default([])
  notify: Reload systemd for corosync health collector

- name: Install corosync health collector timer unit
  ansible.builtin.copy:
    src: corosync-health-collector.timer
    dest: /etc/systemd/system/corosync-health-collector.timer
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname in groups['proxmox'] | default([])
  notify: Reload systemd for corosync health collector

- name: Enable + start corosync health collector timer
  ansible.builtin.systemd:
    name: corosync-health-collector.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - inventory_hostname in groups['proxmox'] | default([])
    - not ansible_check_mode
  tags:
    - molecule-notest

# ---------------------------------------------------------------------------
# zpool status collector (Proxmox hosts only — they carry the ZFS pools)
# ---------------------------------------------------------------------------
# Catches the failure class that corrupted pve-laptop-01's local-ssd
# (2026-06-12): a pool accumulating vdev checksum errors stays ONLINE, so
# health-based monitoring (zfs_exporter on the NAS, SMART) never fires —
# a May 10 scrub had already counted errors and nothing surfaced it. The
# collector exports per-pool error counters + scrub age fleet-wide;
# companion alerts live in release.yaml (homelab.monitoring group).
- name: Install zpool status collector script (proxmox hosts only)
  ansible.builtin.copy:
    src: zpool-status-collector.sh
    dest: /usr/local/sbin/zpool-status-collector.sh
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups['proxmox'] | default([])

- name: Install zpool status collector service unit
  ansible.builtin.template:
    src: zpool-status-collector.service.j2
    dest: /etc/systemd/system/zpool-status-collector.service
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname in groups['proxmox'] | default([])
  notify: Reload systemd for zpool status collector

- name: Install zpool status collector timer unit
  ansible.builtin.copy:
    src: zpool-status-collector.timer
    dest: /etc/systemd/system/zpool-status-collector.timer
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname in groups['proxmox'] | default([])
  notify: Reload systemd for zpool status collector

- name: Enable + start zpool status collector timer
  ansible.builtin.systemd:
    name: zpool-status-collector.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - inventory_hostname in groups['proxmox'] | default([])
    - not ansible_check_mode
  tags:
    - molecule-notest

# ---------------------------------------------------------------------------
# vzdump backup metrics hookscript (Proxmox hosts only)
# ---------------------------------------------------------------------------
# Referenced by the proxmox_backup vzdump job's `script` property. jobs.cfg is
# clustered, so the `all` job runs on every node for its local guests and vzdump
# invokes this hook on each — it must exist fleet-wide or the run aborts on any
# node that lacks it. Deployed here (not in proxmox_backup, which reconciles the
# single clustered config on one node) so it lands on every Proxmox host. Each
# node writes its own /var/lib/node_exporter/vzdump_backup.prom, distinguished
# by the instance label at scrape time; feeds VzdumpBackupFailed/Stale.
- name: Install vzdump metrics hookscript (proxmox hosts only)
  ansible.builtin.copy:
    src: vzdump-metrics-hook.sh
    dest: /usr/local/bin/vzdump-metrics-hook.sh
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups['proxmox'] | default([])

# ---------------------------------------------------------------------------
# SMART health collector (Proxmox hosts only — they carry the physical drives)
# ---------------------------------------------------------------------------
# smartd on pve-nas-01 emails on attribute failures, but nothing exported
# SMART to Prometheus: Grafana/Alertmanager were blind to reallocated/
# pending/uncorrectable sectors and ZFS error events (e.g. the archive
# ZFSPoolDeviceErrors) couldn't be attributed to a disk. The collector is
# standby-aware (`smartctl -n standby`) so it never wakes drives or aborts
# long self-tests — the documented reason DEVICESCAN left smartd.conf.
- name: Install smartmon collector script (proxmox hosts only)
  ansible.builtin.copy:
    src: smartmon-collector.sh
    dest: /usr/local/sbin/smartmon-collector.sh
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups['proxmox'] | default([])

- name: Install smartmon collector service unit
  ansible.builtin.template:
    src: smartmon-collector.service.j2
    dest: /etc/systemd/system/smartmon-collector.service
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname in groups['proxmox'] | default([])
  notify: Reload systemd for smartmon collector

- name: Install smartmon collector timer unit
  ansible.builtin.copy:
    src: smartmon-collector.timer
    dest: /etc/systemd/system/smartmon-collector.timer
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname in groups['proxmox'] | default([])
  notify: Reload systemd for smartmon collector

- name: Enable + start smartmon collector timer
  ansible.builtin.systemd:
    name: smartmon-collector.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - inventory_hostname in groups['proxmox'] | default([])
    - not ansible_check_mode
  tags:
    - molecule-notest

# Note: we deliberately do NOT auto-clean the collectors on hosts dropped
# from the proxmox group. The natural conditional
# `inventory_hostname not in groups['proxmox'] | default([])` fails OPEN
# (an undefined group → empty list → membership-not-test is True
# everywhere), and a wrong-cleanup risk on actual Proxmox hosts is worse
# than stale files on a host that was demoted. Operator removes manually
# in that rare case (`rm /usr/local/sbin/corosync-health-collector.sh
# /etc/systemd/system/corosync-health-collector.*` and the zpool
# equivalents).
