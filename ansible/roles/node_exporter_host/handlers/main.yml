---
- name: Restart node_exporter_host
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    state: restarted
    daemon_reload: true

# The healthcheck .service is oneshot (fired by the timer), so only the timer
# needs re-arming when either unit file changes.
- name: Restart node_exporter_host_healthcheck_timer
  ansible.builtin.systemd:
    name: node-exporter-healthcheck.timer
    state: restarted
    daemon_reload: true

# The corosync/zpool/smartmon collector timers are reloaded + restarted on a
# unit change by the shared textfile_collector role (restart-on-change task),
# so this role no longer carries per-collector reload handlers.
