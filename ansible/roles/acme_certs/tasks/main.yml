---
# ACME certificate management with acme.sh
# Only runs on dns-01 (primary) and distributes to other hosts
# Certificate distribution uses SSH with eric user (dns-01 -> dns-02, smtp-relay)

- name: Validate required acme.sh variables (dns-01 only)
  ansible.builtin.assert:
    that:
      - dns01_ssh_private_key is defined
      - dns01_ssh_private_key | length > 0
      - dns01_ssh_public_key is defined
      - dns01_ssh_public_key | length > 0
      - acme_email is defined
      - acme_email | length > 0
      - internal_domain is defined
      - internal_domain | length > 0
    fail_msg: >-
      Required acme.sh variables are not set. Ensure DNS01_SSH_PRIVATE_KEY,
      DNS01_SSH_PUBLIC_KEY environment variables are provided via 'op run'.
      Run deployment with: task dns:deploy (which injects 1Password secrets)
    success_msg: "Required acme.sh variables are present"
  when: inventory_hostname == 'dns-01'
  tags: [validation, always]

- name: Ensure eric .ssh directory exists for cert distribution
  ansible.builtin.file:
    path: /home/eric/.ssh
    state: directory
    owner: eric
    group: eric
    mode: "0700"
  when: inventory_hostname == 'dns-01'

- name: Deploy dns-01 SSH private key for certificate distribution
  ansible.builtin.copy:
    content: "{{ dns01_ssh_private_key }}\n"
    dest: /home/eric/.ssh/id_ed25519_certs
    owner: eric
    group: eric
    mode: "0600"
  when:
    - inventory_hostname == 'dns-01'
    - dns01_ssh_private_key is defined
    - dns01_ssh_private_key != ''
  no_log: true

- name: Deploy dns-01 SSH public key for certificate distribution
  ansible.builtin.copy:
    content: "{{ dns01_ssh_public_key }}\n"
    dest: /home/eric/.ssh/id_ed25519_certs.pub
    owner: eric
    group: eric
    mode: "0644"
  when:
    - inventory_hostname == 'dns-01'
    - dns01_ssh_public_key is defined
    - dns01_ssh_public_key != ''

- name: Deploy dns-01 public key to dns-02 eric authorized_keys
  ansible.posix.authorized_key:
    user: eric
    state: present
    key: "{{ dns01_ssh_public_key }}"
    comment: "eric@dns-01 (cert distribution)"
  when:
    - inventory_hostname == 'dns-02'
    - dns01_ssh_public_key is defined
    - dns01_ssh_public_key != ''

- name: Deploy dns-01 public key to smtp-relay eric authorized_keys
  ansible.posix.authorized_key:
    user: eric
    state: present
    key: "{{ dns01_ssh_public_key }}"
    comment: "eric@dns-01 (cert distribution)"
  when:
    - inventory_hostname == 'smtp-relay'
    - dns01_ssh_public_key is defined
    - dns01_ssh_public_key != ''

- name: Install acme.sh dependencies
  ansible.builtin.apt:
    name:
      - curl
      - openssl
      - socat
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Check if acme.sh is installed
  ansible.builtin.stat:
    path: /root/.acme.sh/acme.sh
  register: acme_installed
  when: inventory_hostname == 'dns-01'

- name: Download acme.sh installer
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/acmesh-official/acme.sh/{{ acme_sh_version }}/acme.sh"
    dest: /tmp/acme_installer.sh
    mode: '0755'
  when:
    - inventory_hostname == 'dns-01'
    - not acme_installed.stat.exists

- name: Install acme.sh
  ansible.builtin.shell: |
    sh /tmp/acme_installer.sh --install --nocron --email {{ acme_email }}
  args:
    creates: /root/.acme.sh/acme.sh
  when:
    - inventory_hostname == 'dns-01'
    - not acme_installed.stat.exists

- name: Remove acme.sh installer
  ansible.builtin.file:
    path: /tmp/acme_installer.sh
    state: absent
  when:
    - inventory_hostname == 'dns-01'
    - not acme_installed.stat.exists

- name: Deploy homelab-cert-reload script
  ansible.builtin.template:
    src: homelab-cert-reload.sh.j2
    dest: /usr/local/sbin/homelab-cert-reload.sh
    owner: root
    group: root
    mode: "0700"
  when: inventory_hostname == 'dns-01'

# Automatic certificate installation if certs exist in acme.sh but not in local_cert_dir
# This handles the case where certs were manually issued but never installed to the target directory
- name: Check if certificates exist in acme.sh
  ansible.builtin.stat:
    path: "/root/.acme.sh/{{ internal_domain }}_ecc/fullchain.cer"
  register: acme_cert_exists
  when: inventory_hostname == 'dns-01'

- name: Check if certificates are already installed locally
  ansible.builtin.stat:
    path: "{{ local_cert_dir }}/fullchain.pem"
  register: local_cert_exists
  when: inventory_hostname == 'dns-01'

- name: Install certificates to local directory (if acme.sh has certs but local dir is empty)
  ansible.builtin.command:
    cmd: >
      /root/.acme.sh/acme.sh --install-cert -d "{{ internal_domain }}"
      --cert-file {{ local_cert_dir }}/cert.pem
      --key-file {{ local_cert_dir }}/privkey.pem
      --fullchain-file {{ local_cert_dir }}/fullchain.pem
      --reloadcmd "/usr/local/sbin/homelab-cert-reload.sh"
  when:
    - inventory_hostname == 'dns-01'
    - acme_cert_exists.stat.exists | default(false)
    - not (local_cert_exists.stat.exists | default(false))
  register: cert_install_result
  changed_when: cert_install_result.rc == 0

- name: Set proper ownership on installed certificates
  ansible.builtin.file:
    path: "{{ local_cert_dir }}/{{ item.name }}"
    owner: root
    group: "{{ adguard_group | default('adguard') }}"
    mode: "{{ item.mode }}"
  loop:
    - { name: "fullchain.pem", mode: "0644" }
    - { name: "privkey.pem", mode: "0640" }
    - { name: "cert.pem", mode: "0644" }
  when:
    - inventory_hostname == 'dns-01'
    - cert_install_result.changed | default(false)

- name: Display acme.sh setup instructions (only if no certs exist yet)
  ansible.builtin.debug:
    msg: |
      ACME.sh is installed but no certificates have been issued yet.

      To issue certificates manually:

      1. Set Cloudflare credentials (from 1Password):
         export CF_Token=$(op read "{{ secrets.cloudflare_api_token }}")
         export CF_Account_ID=$(op read "{{ secrets.cloudflare_account_id }}")

      2. Issue wildcard certificate:
         /root/.acme.sh/acme.sh --issue --dns dns_cf \
           -d "{{ internal_domain }}" \
           -d "*.{{ internal_domain }}"

      After issuing, re-run Ansible to automatically install and distribute the certs:
         task dns:deploy
  when:
    - inventory_hostname == 'dns-01'
    - not (acme_cert_exists.stat.exists | default(false))

- name: Display certificate installation status
  ansible.builtin.debug:
    msg: "Certificates are installed at {{ local_cert_dir }} and configured for automatic renewal with distribution."
  when:
    - inventory_hostname == 'dns-01'
    - acme_cert_exists.stat.exists | default(false)
    - local_cert_exists.stat.exists | default(false) or (cert_install_result.changed | default(false))

# Proactive certificate distribution to ensure remote hosts have certs
# This runs every time Ansible deploys if local certs exist, handling cases where:
# - Certs were manually installed but never distributed
# - A target host was rebuilt and lost its certs
# - Distribution failed during a previous renewal
- name: Check if local certificates exist for distribution
  ansible.builtin.stat:
    path: "{{ local_cert_dir }}/fullchain.pem"
  register: local_certs_for_dist
  when: inventory_hostname == 'dns-01'

- name: Distribute certificates to remote hosts
  ansible.builtin.command:
    cmd: /usr/local/sbin/homelab-cert-reload.sh
  when:
    - inventory_hostname == 'dns-01'
    - local_certs_for_dist.stat.exists | default(false)
    - cert_distribution_targets is defined
    - cert_distribution_targets | length > 0
    - not ansible_check_mode
    - not (skip_cert_distribution | default(false))
  register: cert_distribution_result
  changed_when: cert_distribution_result.rc == 0
  failed_when: false  # Don't fail the play if distribution fails (target might be down)

- name: Warn if certificate distribution failed
  ansible.builtin.debug:
    msg: |
      WARNING: Certificate distribution failed with return code {{ cert_distribution_result.rc }}.
      stderr: {{ cert_distribution_result.stderr | default('none') }}
      Ensure target hosts (dns-02, smtp-relay) are reachable and SSH keys are properly configured.
  when:
    - inventory_hostname == 'dns-01'
    - cert_distribution_result is defined
    - cert_distribution_result.rc is defined
    - cert_distribution_result.rc != 0
