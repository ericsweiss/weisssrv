---
# Enroll the cert-distribution key on ONE target: the forced-command receiver,
# its sudoers drop-in, then the pinned authorized_keys entry (that order — the
# key forces `sudo <receiver>`, so the receiver and its sudoers rule must exist
# before the key that invokes them).
#
# Included once per target from main.yml's loop. Deliberately a looped INCLUDE
# around single delegated tasks, never `loop:` + `delegate_to: item.host` — the
# same pattern (and for the same reason) as
# proxmox_firewall/tasks/probe-delegate.yml: when one delegate of a LOOPED
# delegate_to is down, the connection plugin marks the loop's AGGREGATE result
# unreachable for dns-01 itself, so dns-01 is dropped from the play. Both
# dns.yml and site.yml run this play with serial: 1, which makes dns-01 a batch
# of one — the playbook then ends with NO MORE HOSTS LEFT before the certs are
# distributed, before the target host keys are pinned, and before adguard_sync
# runs. One powered-off target VM used to cost the entire cert play.
- name: Probe cert target for reachability — {{ _acme_target.host }}
  ansible.builtin.ping:
  delegate_to: "{{ _acme_target.host }}"
  ignore_unreachable: true
  # A module-level failure (reachable host, broken python) must be treated like
  # an unreachable one: only a real pong enrolls the key.
  failed_when: false
  changed_when: false
  register: _acme_target_probe

- name: Record cert target as unreachable — {{ _acme_target.host }}
  ansible.builtin.set_fact:
    acme_certs_unreachable_targets: >-
      {{ (acme_certs_unreachable_targets | default([])) + [_acme_target.host] }}
  when: _acme_target_probe.ping | default('') != 'pong'

- name: Deploy cert-receive forced-command receiver — {{ _acme_target.host }}
  ansible.builtin.template:
    src: cert-receive.sh.j2
    dest: "{{ acme_certs_receiver_path }}"
    owner: root
    group: root
    mode: "0500"
  delegate_to: "{{ _acme_target.host }}"
  ignore_unreachable: true
  when: _acme_target_probe.ping | default('') == 'pong'

# Scopes the escalation: the cert key's forced command `sudo <receiver>` is the
# ONLY thing this rule permits, so even if eric's broad sudo is later tightened
# the receiver still runs — and the key can do nothing else.
- name: Deploy cert-receive sudoers drop-in — {{ _acme_target.host }}
  ansible.builtin.copy:
    # Static marker, not {{ ansible_managed }}: the copy module (unlike template)
    # does not inject ansible_managed, so referencing it here is undefined on
    # modern ansible-core and aborts the task.
    content: |
      # Ansible managed - acme_certs cert-receive sudoers drop-in
      {{ _acme_target.ssh_user | default('eric') }} ALL=(root) NOPASSWD: {{ acme_certs_receiver_path }}
      Defaults!{{ acme_certs_receiver_path }} !requiretty
    dest: /etc/sudoers.d/cert-receive
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  delegate_to: "{{ _acme_target.host }}"
  ignore_unreachable: true
  when: _acme_target_probe.ping | default('') == 'pong'

- name: Deploy dns-01 cert-distribution pubkey to authorized_keys — {{ _acme_target.host }}
  ansible.posix.authorized_key:
    user: "{{ _acme_target.ssh_user | default('eric') }}"
    state: present
    key: "{{ dns01_ssh_public_key }}"
    comment: "eric@dns-01 (cert distribution)"
    # Lock the key to the forced-command receiver: restrict (no pty/agent/port/
    # X11/user-rc) + command="sudo <receiver>" so a leaked key can only install a
    # validated cert and run the target's baked-in reload — never a shell. The
    # from= source pin is kept as defense in depth (dns-01 holds .150 across HA
    # moves); acme_certs_key_from empty drops only that clause (e.g. molecule).
    key_options: >-
      {{ (('from="' ~ acme_certs_key_from ~ '",') if (acme_certs_key_from | default('') | length > 0) else '')
         ~ 'command="sudo ' ~ acme_certs_receiver_path ~ '",restrict' }}
  delegate_to: "{{ _acme_target.host }}"
  ignore_unreachable: true
  when:
    - _acme_target_probe.ping | default('') == 'pong'
    - dns01_ssh_public_key != ''
