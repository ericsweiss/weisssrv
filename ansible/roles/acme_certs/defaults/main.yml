---
# Default variables for acme_certs role

acme_email: "admin@esweiss.com"
acme_dns_provider: dns_cf
# Pin acme.sh installer to a specific release (avoid mutable get.acme.sh redirect)
# Update by checking: https://github.com/acmesh-official/acme.sh/releases
acme_sh_version: "3.1.2"

internal_domain: esweiss.com
local_cert_dir: /opt/AdGuardHome/certs
# Group that owns the locally-installed certs on dns-01 (AdGuard reads them).
# Mirrors the per-target `group` field in cert_distribution_targets.
acme_local_cert_group: "{{ adguard_group | default('adguard') }}"

acme_domains:
  - "*.{{ internal_domain }}"
  - "{{ internal_domain }}"

# Certificate distribution targets — see the schema in
# inventories/prod/host_vars/dns-01.yml for the full field set
# (host_key is REQUIRED per target; get it via `task certs:show-host-keys`).
# cert_distribution_targets:
#   - host: dns-02
#     ip: 192.168.0.160
#     host_key: "ssh-ed25519 AAAA..."
#     cert_dir: /opt/AdGuardHome/certs
#     owner: root
#     group: adguard
#     cert_mode: "0644"
#     key_mode: "0640"
#     restart_service: AdGuardHome
