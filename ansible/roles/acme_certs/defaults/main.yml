---
# Default variables for acme_certs role

acme_email: "admin@esweiss.com"
# Pin acme.sh to a specific release tag (avoid mutable get.acme.sh redirect).
# The full release tarball is installed — not the single acme.sh file — so the
# dnsapi/ hooks (dns_cf) ship with it. Update both values together by checking:
# https://github.com/acmesh-official/acme.sh/releases
acme_sh_version: "3.1.2"
acme_sh_tarball_sha256: "a51511ad0e2912be45125cf189401e4ae776ca1a29d5768f020a1e35a9560186"

internal_domain: esweiss.com
local_cert_dir: /opt/AdGuardHome/certs
# Group that owns the locally-installed certs on dns-01 (AdGuard reads them).
# Mirrors the per-target `group` field in cert_distribution_targets.
acme_local_cert_group: "{{ adguard_group | default('adguard') }}"

# Source-IP restriction (from="...") applied to the cert-distribution key in each
# target's authorized_keys. dns-01 keeps .150 across Proxmox-HA moves; pinning the
# source shrinks the blast radius if this root-equivalent key leaks. Set empty to
# disable the restriction (e.g. molecule, where the cert source isn't .150).
acme_certs_key_from: "192.168.0.150"

# Path of the forced-command receiver deployed to each sudo target. The
# cert-distribution key is pinned in authorized_keys with
# command="sudo <this>",restrict so a leaked key can only install a validated
# *.{{ internal_domain }} cert and run the target's baked-in reload — never a
# shell. ssh_no_sudo targets (HAOS) are operator-managed and keep the legacy
# push path (see docs/09-certs.md); they are not receiver-deployed here.
acme_certs_receiver_path: /usr/local/sbin/cert-receive

# Certificate distribution targets — see the schema in
# inventories/prod/host_vars/dns-01.yml for the full field set
# (host_key is REQUIRED per target; get it via `task certs:show-host-keys`).
# cert_distribution_targets:
#   - host: dns-02
#     ip: 192.168.0.160
#     host_key: "ssh-ed25519 AAAA..."
#     cert_dir: /opt/AdGuardHome/certs
#     owner: root
#     group: adguard
#     cert_mode: "0644"
#     key_mode: "0640"
#     restart_service: AdGuardHome
