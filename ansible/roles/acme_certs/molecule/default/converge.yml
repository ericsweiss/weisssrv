---
# Converge playbook for acme_certs role testing
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Wait for apt locks to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
              fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
          sleep 1
        done
      args:
        executable: /bin/bash
      changed_when: false
      when: ansible_os_family == "Debian"

    # Fix any interrupted dpkg state in Docker containers
    # Note: We only run dpkg --configure -a to recover from interrupted installs
    # We do NOT clean apt cache as this can cause race conditions with concurrent downloads
    - name: Fix any interrupted dpkg state
      ansible.builtin.shell: |
        dpkg --configure -a || true
      args:
        executable: /bin/bash
      changed_when: false
      when: ansible_os_family == "Debian"

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
      when: ansible_os_family == "Debian"

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - systemd
          - sudo
          - curl
          - openssl
        state: present
      when: ansible_os_family == "Debian"

    - name: Create eric user for SSH key deployment
      ansible.builtin.user:
        name: eric
        state: present
        create_home: true
        shell: /bin/bash

    - name: Create certificate directory
      ansible.builtin.file:
        path: /opt/AdGuardHome/certs
        state: directory
        owner: root
        group: root
        mode: "0755"

  roles:
    - role: acme_certs
