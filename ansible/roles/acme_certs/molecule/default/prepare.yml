---
# Prepare playbook: Wait for systemd to be ready in the container
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for systemd to be ready
      ansible.builtin.raw: |
        for i in $(seq 1 30); do
          if systemctl is-system-running 2>/dev/null | grep -qE '(running|degraded)'; then
            exit 0
          fi
          sleep 1
        done
        # Fallback: check if systemd is at least responding
        systemctl status >/dev/null 2>&1 && exit 0
        exit 1
      changed_when: false
      retries: 3
      delay: 2
      register: systemd_ready
      until: systemd_ready.rc == 0
