---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Stat the accept-path keyring and both reject-path keyrings
      ansible.builtin.stat:
        path: "{{ item }}"
      register: apt_signed_repo_keyrings
      loop:
        - /etc/apt/keyrings/test-ok.gpg
        - /etc/apt/keyrings/test-bad.gpg
        - /etc/apt/keyrings/test-multi.gpg

    - name: Accept path wrote a keyring; both reject paths did not
      ansible.builtin.assert:
        that:
          - apt_signed_repo_keyrings.results[0].stat.exists
          - apt_signed_repo_keyrings.results[0].stat.mode == '0644'
          - not apt_signed_repo_keyrings.results[1].stat.exists
          - not apt_signed_repo_keyrings.results[2].stat.exists
        fail_msg: >-
          Expected /etc/apt/keyrings/test-ok.gpg present (0644), test-bad.gpg
          absent (wrong fingerprint), and test-multi.gpg absent (bundled second
          key rejected before dearmor).

    - name: Read the accept-path keyring for a dearmor (binary) check
      ansible.builtin.slurp:
        src: /etc/apt/keyrings/test-ok.gpg
      register: apt_signed_repo_keyring_blob

    - name: Keyring is dearmored (binary GPG, not the armored ASCII download)
      ansible.builtin.assert:
        that:
          # base64 of '-----BEGIN PGP' — an armored file would start with this.
          - not (apt_signed_repo_keyring_blob.content is match('LS0tLS1CRUdJTiBQR1A'))
        fail_msg: >-
          test-ok.gpg is armored ASCII, not a dearmored binary keyring.

    - name: The sources file was written with the signed-by keyring reference
      ansible.builtin.slurp:
        src: /etc/apt/sources.list.d/apt-signed-repo-test-ok.list
      register: apt_signed_repo_sources

    - name: Sources entry pins signed-by to the accept-path keyring
      ansible.builtin.assert:
        that:
          - >-
            'signed-by=/etc/apt/keyrings/test-ok.gpg'
            in (apt_signed_repo_sources.content | b64decode)
        fail_msg: "sources entry missing signed-by keyring pin"

    - name: The staging key was cleaned up
      ansible.builtin.stat:
        # Default staging path: /tmp/<keyring-basename>.download
        path: /tmp/test-ok.gpg.download
      register: apt_signed_repo_stage

    - name: No downloaded key left behind
      ansible.builtin.assert:
        that:
          - not apt_signed_repo_stage.stat.exists
        fail_msg: "downloaded signing key was not cleaned up"
