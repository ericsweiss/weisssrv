---
# Scenario overrides; shared config in ansible/molecule/base.yml.
# This scenario is fully hermetic: converge generates a throwaway signing key
# locally and serves it over file://, so no network or upstream key is
# touched.
platforms:
  - name: apt-signed-repo-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
