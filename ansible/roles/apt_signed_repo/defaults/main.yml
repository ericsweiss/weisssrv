---
# Optional inputs. The required inputs have no default and must be supplied by
# the caller (via include_role vars):
#   apt_signed_repo_key_url       — URL of the (ASCII-armored) signing key
#   apt_signed_repo_fingerprint   — expected primary-key fingerprint (no spaces)
#   apt_signed_repo_keyring_path  — dearmored binary keyring destination
#   apt_signed_repo_repo_line     — full `deb [signed-by=...] ...` sources line
#   apt_signed_repo_filename      — apt sources.list.d filename (no extension)

# Extra gate threaded through every task, so a caller can pass its own skip
# condition (e.g. gitlab's skip_gitlab_install) without wrapping the include.
apt_signed_repo_when: true

# Install gnupg (gated on key absence) for callers with no other guarantee it
# is present. Left off where a prerequisite task or the base role provides it.
apt_signed_repo_install_gnupg: false

# Explicit keyring mode. Empty skips the permission task entirely (the keyring
# keeps whatever gpg --dearmor created); set e.g. "0644" to pin it.
apt_signed_repo_keyring_mode: ""

# Staging path for the downloaded key before verification + dearmor. Cleaned up
# after dearmor; the exact name is irrelevant.
apt_signed_repo_tmp_key: "/tmp/{{ apt_signed_repo_keyring_path | basename }}.download"

# Refresh the apt cache when adding the repo. Left true so every real caller
# picks up the new repo immediately; the molecule scenario sets it false to keep
# the key-handling test hermetic (no apt-get update against an unreachable repo).
apt_signed_repo_update_cache: true
