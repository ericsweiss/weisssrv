---
# Regenerate the GRUB config so the appended IOMMU cmdline lands in the boot
# entries. `update-grub` covers a GRUB-managed host (pve-prec-01); if the host is
# additionally proxmox-boot-tool-managed (UUIDs file present), refresh the ESP
# copies too. Skipped under molecule/check-mode (no real GRUB in the container).
# Applies only at the next reboot — the role never reboots.
- name: Update GRUB for VFIO
  ansible.builtin.shell: |
    set -euo pipefail
    update-grub
    if [ -e /etc/kernel/proxmox-boot-uuids ] && command -v proxmox-boot-tool >/dev/null 2>&1; then
      proxmox-boot-tool refresh
    fi
  args:
    executable: /bin/bash
  changed_when: true
  when: not (vfio_passthrough_skip_boot_update | default(false))

# vfio.conf is a load-time module config; the pools/drivers are decided during
# the initramfs at early boot, so bake it in there. Skipped under molecule.
- name: Rebuild initramfs for VFIO
  ansible.builtin.command: update-initramfs -u
  changed_when: true
  when: not (vfio_passthrough_skip_boot_update | default(false))

# PRINT reboot-required — never auto-reboot. VFIO changes (kernel cmdline +
# vfio-pci bind + nouveau blacklist) only take effect on the next boot; the
# operator reboots pve-prec-01 in a maintenance window (docs/43). This handler
# fires only when a config file actually changed (it is notified by the render
# tasks), so a no-op run stays quiet.
- name: Warn that a VFIO reboot is required
  ansible.builtin.debug:
    msg: >-
      VFIO passthrough config changed on {{ inventory_hostname }} — a HOST REBOOT
      is required to bind the GPU to vfio-pci (nouveau is now blacklisted and the
      IOMMU cmdline is staged). NOT rebooting automatically. Apply in a
      maintenance window per docs/43-gpu-passthrough.md.
