---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    # Render-only scenario: the role never installs apt packages, so import the
    # shared prepare-base (systemd-wait + temp-dir) WITHOUT prepare-apt-disable
    # (mirrors resolv_conf / home_assistant).
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule/tasks/prepare-base.yml

    # The role writes /etc/modprobe.d/vfio.conf and
    # /etc/modules-load.d/vfio-pci.conf. Both directories always exist on a real
    # Debian/Proxmox host (shipped by kmod and systemd), so the role deliberately
    # does NOT create them — but the minimal molecule image lacks them, which
    # would fail the template renders with "Destination directory ... does not
    # exist". Seed both here (test fixture only). Mirrors nic_tuning's prepare.
    # NB: /etc/default/grub.d is NOT seeded here — the role creates that one
    # itself, since it can legitimately be absent on a real host.
    - name: Ensure /etc/modprobe.d and /etc/modules-load.d exist (minimal test container may lack them)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/modprobe.d
        - /etc/modules-load.d
