---
# Scenario overrides; shared config in ansible/molecule/base.yml (ansible/TESTING.md).
#
# The container has no GRUB and no real /boot kernel, so
# vfio_passthrough_skip_boot_update suppresses the update-grub/update-initramfs
# handlers. What is exercised: the grub drop-in + modprobe.d renders and their
# exact content (ids=, blacklist, softdep, IOMMU cmdline).
platforms:
  - name: vfio-passthrough-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    # Role-specific prepare: seed /etc/modprobe.d + /etc/modules-load.d (absent in
    # the minimal image) on top of the shared systemd-wait prep. Re-points
    # playbooks.prepare off the inherited prepare-common.yml (deep-merge keeps
    # converge/verify from base).
    prepare: prepare.yml
  inventory:
    group_vars:
      all:
        vfio_passthrough_enabled: true
        # TU116 [GTX 1660 Ti] — the four functions (see hosts.yml pve-prec-01).
        vfio_passthrough_pci_ids:
          - "10de:2182"
          - "10de:1aeb"
          - "10de:1aec"
          - "10de:1aed"
        # No real GRUB / /boot in the container — render the files, skip rebuilds.
        vfio_passthrough_skip_boot_update: true
