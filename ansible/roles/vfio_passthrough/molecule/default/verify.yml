---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the vfio-pci modprobe.d file
      ansible.builtin.slurp:
        src: /etc/modprobe.d/vfio.conf
      register: vfio_conf

    - name: Assert vfio.conf binds the GPU functions, blacklists nouveau, and softdeps the host drivers
      ansible.builtin.assert:
        that:
          - "'options vfio-pci ids=10de:2182,10de:1aeb,10de:1aec,10de:1aed' in (vfio_conf.content | b64decode)"
          - "'blacklist nouveau' in (vfio_conf.content | b64decode)"
          # nouveau is blacklisted so its softdep would be dead — it must NOT be emitted.
          - "'softdep nouveau pre: vfio-pci' not in (vfio_conf.content | b64decode)"
          # The real host drivers of the non-VGA functions get the softdep so vfio-pci wins.
          - "'softdep snd_hda_intel pre: vfio-pci' in (vfio_conf.content | b64decode)"
          - "'softdep xhci_hcd pre: vfio-pci' in (vfio_conf.content | b64decode)"
        fail_msg: "vfio.conf missing the expected ids=/blacklist/softdep lines (or still carries the dead nouveau softdep)"
        success_msg: "vfio.conf binds all four GPU functions, blacklists nouveau, softdeps the audio/USB drivers"

    - name: Read the modules-load.d file
      ansible.builtin.slurp:
        src: /etc/modules-load.d/vfio-pci.conf
      register: vfio_modules_load

    - name: Assert vfio-pci is force-loaded at boot
      ansible.builtin.assert:
        that:
          - "'vfio-pci' in (vfio_modules_load.content | b64decode)"
        fail_msg: "/etc/modules-load.d/vfio-pci.conf does not force-load vfio-pci"
        success_msg: "modules-load.d force-loads vfio-pci at boot"

    - name: Read the GRUB IOMMU drop-in
      ansible.builtin.slurp:
        src: /etc/default/grub.d/vfio-iommu.cfg
      register: grub_vfio

    - name: Assert the IOMMU + vfio-pci.ids cmdline params are appended
      ansible.builtin.assert:
        that:
          - "'intel_iommu=on iommu=pt' in (grub_vfio.content | b64decode)"
          - "'GRUB_CMDLINE_LINUX_DEFAULT=' in (grub_vfio.content | b64decode)"
          # Earliest-bind belt: vfio-pci grabs the four functions the moment it
          # loads in the initramfs, before the host drivers can claim them.
          - "'vfio-pci.ids=10de:2182,10de:1aeb,10de:1aec,10de:1aed' in (grub_vfio.content | b64decode)"
        fail_msg: "grub.d drop-in missing the IOMMU params or the vfio-pci.ids= cmdline bind"
        success_msg: "grub.d drop-in appends intel_iommu=on iommu=pt and vfio-pci.ids= for all four functions"
