---
# Default variables for postfix null client role

smtp_relay_host: smtp-relay.esweiss.com
smtp_relay_port: 587

postfix_config:
  myhostname: "{{ inventory_hostname }}.esweiss.com"
  myorigin: "/etc/mailname"
  # $myhostname must stay listed: the /etc/aliases root->admin_email rewrite
  # only applies to locally delivered mail. The bare domain must NOT be
  # listed, or every null client would deliver/bounce *@esweiss.com locally
  # instead of relaying it.
  mydestination: "$myhostname, localhost.localdomain, localhost"
  relayhost: "[{{ smtp_relay_host }}]:{{ smtp_relay_port }}"
  mynetworks: "127.0.0.0/8"
  inet_interfaces: "loopback-only"
  # "secure" = encrypt AND verify the relay's certificate against CAfile.
  # The relay presents the wildcard *.esweiss.com cert (covers the
  # smtp-relay.esweiss.com relayhost) and the system CA bundle trusts the
  # Let's Encrypt chain, so "encrypt" alone would let a LAN MITM capture the
  # SASL relay credentials inside STARTTLS.
  smtp_tls_security_level: "secure"
  smtp_tls_CAfile: "/etc/ssl/certs/ca-certificates.crt"
  smtp_sasl_auth_enable: "yes"
  smtp_sasl_security_options: "noanonymous"
  smtp_sasl_password_maps: "hash:/etc/postfix/sasl_passwd"

mail_aliases:
  postmaster: root
  nobody: root
  hostmaster: root
  webmaster: root
  root: "{{ admin_email }}"

# Required: postfix_sasl_user / postfix_sasl_password — defined in
# group_vars/all.yml from the SMTP_RELAY_* env vars injected by `op run`.
