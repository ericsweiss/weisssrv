---
# Postfix null client configuration
# Forwards all mail to the central SMTP relay

# This catches misconfiguration when env vars aren't injected via 'op run'
- name: Validate SMTP relay credentials are present
  ansible.builtin.assert:
    that:
      - postfix_sasl_user is defined
      - postfix_sasl_user | length > 0
      - postfix_sasl_password is defined
      - postfix_sasl_password | length > 0
    fail_msg: >-
      SMTP relay credentials not set.
      Ensure SMTP_RELAY_USER and SMTP_RELAY_PASSWORD are provided via 'op run --'.
      Use the appropriate task command (e.g., 'task dns:deploy' or 'task gitlab:deploy')
      which automatically injects secrets from 1Password.
    success_msg: "SMTP relay credentials validated"
  no_log: true

- name: Install postfix and dependencies
  ansible.builtin.apt:
    name:
      - postfix
      - libsasl2-modules
      - mailutils
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Configure mailname
  ansible.builtin.copy:
    content: "{{ postfix_config.myhostname }}\n"
    dest: /etc/mailname
    owner: root
    group: root
    mode: "0644"
  notify: Reload postfix

- name: Deploy postfix main.cf
  ansible.builtin.template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    mode: "0644"
  notify: Reload postfix

- name: Deploy SASL password file
  ansible.builtin.template:
    src: sasl_passwd.j2
    dest: /etc/postfix/sasl_passwd
    owner: root
    group: root
    mode: "0600"
  notify:
    - Postmap sasl_passwd
    - Reload postfix
  no_log: true

- name: Deploy virtual aliases
  ansible.builtin.template:
    src: virtual.j2
    dest: /etc/postfix/virtual
    owner: root
    group: root
    mode: "0644"
  notify:
    - Postmap virtual
    - Reload postfix
  when: postfix_virtual_aliases is defined

# main.cf.j2 drops virtual_alias_maps under the same guard, so when the var is
# removed the table is no longer referenced — clean up the orphaned files rather
# than leaving unmanaged state a future re-add could silently reuse.
- name: Remove orphaned virtual alias table when no aliases are configured
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/postfix/virtual
    - /etc/postfix/virtual.db
  when: postfix_virtual_aliases is not defined
  notify: Reload postfix

- name: Configure mail aliases
  ansible.builtin.template:
    src: aliases.j2
    dest: /etc/aliases
    owner: root
    group: root
    mode: "0644"
  notify: Newaliases

# Both map sources above are notify-only, so a lost handler leaves a correct
# source next to a stale compiled .db that postfix keeps reading. Assert the
# .db against the configured values, not the source. Runs before postfix is
# started so a first converge has a usable sasl_passwd.db without waiting for
# the handler flush.
- name: Repair stale compiled postfix maps
  ansible.builtin.import_tasks: repair-compiled-maps.yml

- name: Ensure postfix is enabled and running
  ansible.builtin.service:
    name: postfix
    state: started
    enabled: true
