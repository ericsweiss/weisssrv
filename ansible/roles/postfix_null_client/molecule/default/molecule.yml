---
# Scenario overrides; shared config in ansible/molecule/base.yml (ansible/TESTING.md).
platforms:
  - name: postfix-null-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  inventory:
    group_vars:
      all:
        internal_domain: test.local
        admin_email: test@test.local
        smtp_relay_host: smtp-relay.test.local
        smtp_relay_port: 587
        postfix_sasl_user: testuser
        postfix_sasl_password: testpassword
        postfix_config:
          myhostname: postfix-null-test.test.local
          myorigin: /etc/mailname
          mydestination: postfix-null-test.test.local, localhost.localdomain, localhost
          relayhost: '[smtp-relay.test.local]:587'
          mynetworks: 127.0.0.0/8
          inet_interfaces: loopback-only
          smtp_tls_security_level: secure
          smtp_tls_CAfile: /etc/ssl/certs/ca-certificates.crt
          smtp_sasl_auth_enable: 'yes'
          smtp_sasl_security_options: noanonymous
          smtp_sasl_password_maps: hash:/etc/postfix/sasl_passwd
        mail_aliases:
          postmaster: root
          nobody: root
          hostmaster: root
          webmaster: root
          root: test@test.local
