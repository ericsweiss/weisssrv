---
# Handlers for postfix null client role.
# Definition order is execution order: the map rebuilds must run before
# 'Reload postfix' so the reload picks up fresh .db files.

- name: Postmap sasl_passwd
  ansible.builtin.command: postmap /etc/postfix/sasl_passwd
  changed_when: true

- name: Postmap virtual
  ansible.builtin.command: postmap /etc/postfix/virtual
  changed_when: true

- name: Newaliases
  ansible.builtin.command: newaliases
  changed_when: true

- name: Reload postfix
  ansible.builtin.service:
    name: postfix
    state: reloaded
