---
# Verify playbook for nas_storage role testing
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Check if NFS server is installed
      ansible.builtin.package:
        name: nfs-kernel-server
        state: present
      check_mode: true
      register: nfs_installed
      failed_when: nfs_installed.changed

    - name: Check if exports file exists
      ansible.builtin.stat:
        path: /etc/exports
      register: exports_file
      failed_when: not exports_file.stat.exists

    - name: Verify exports file contains expected exports
      ansible.builtin.command: grep -q "/tank/media/unified" /etc/exports
      register: exports_check
      failed_when: exports_check.rc != 0
      changed_when: false

    # exports.j2 xprtsec precedence (the per-client override that keeps a
    # plaintext client on a mixed export whose other clients require TLS —
    # the HAOS .154 lockout-class regression guard). Exports require TLS
    # (xprtsec=tls), so this guards that no xprtsec at all leaks onto the .154
    # line. grep each rendered client line directly; client lines are
    # backslash-continued so each client spec lands on its own physical line,
    # which is exactly what we match.

    - name: Assert plaintext export has no xprtsec on its client line
      ansible.builtin.command: >-
        grep -F '192.168.0.0/24(ro,sync,no_subtree_check)' /etc/exports
      register: plain_grep
      changed_when: false
      failed_when: plain_grep.rc != 0 or 'xprtsec' in plain_grep.stdout

    - name: Assert export-level xprtsec=tls reaches the first client line
      ansible.builtin.command: >-
        grep -F '/tank/appdata/tls 192.168.0.200/29(rw,sync,no_subtree_check,fsid=91,xprtsec=tls)' /etc/exports
      register: tls_first
      changed_when: false
      failed_when: tls_first.rc != 0

    - name: Assert export-level xprtsec=tls reaches the continued client line
      ansible.builtin.command: >-
        grep -F '192.168.0.220/29(rw,sync,no_subtree_check,fsid=91,xprtsec=tls)' /etc/exports
      register: tls_cont
      changed_when: false
      failed_when: tls_cont.rc != 0

    - name: Assert mixed export requires TLS (xprtsec=tls) on the opted-in k3s client
      ansible.builtin.command: >-
        grep -F '/tank/media/mixed 192.168.0.200/29(rw,sync,no_subtree_check,fsid=92,xprtsec=tls)' /etc/exports
      register: mixed_tls
      changed_when: false
      failed_when: mixed_tls.rc != 0

    - name: Assert mixed export leaves the .154 client plaintext (no xprtsec)
      ansible.builtin.command: >-
        grep -F '192.168.0.154/32(ro,sync,no_subtree_check,fsid=92)' /etc/exports
      register: mixed_plain
      changed_when: false
      # rc 0 = the exact plaintext spec is present; if xprtsec had leaked onto
      # the .154 line the option string would differ and this grep would miss.
      failed_when: mixed_plain.rc != 0 or 'xprtsec' in mixed_plain.stdout

    - name: Check if Samba is installed
      ansible.builtin.package:
        name: samba
        state: present
      check_mode: true
      register: samba_installed
      failed_when: samba_installed.changed

    - name: Check if smb.conf exists
      ansible.builtin.stat:
        path: /etc/samba/smb.conf
      register: smb_conf
      failed_when: not smb_conf.stat.exists

    - name: Verify smb.conf contains expected shares
      ansible.builtin.command: grep -q "\[media\]" /etc/samba/smb.conf
      register: smb_check
      failed_when: smb_check.rc != 0
      changed_when: false

    - name: Check if NFS service exists
      ansible.builtin.systemd:
        name: nfs-kernel-server
      register: nfs_service
      failed_when: nfs_service.status.LoadState != 'loaded'

    - name: Check if Samba service exists
      ansible.builtin.systemd:
        name: smbd
      register: smb_service
      failed_when: smb_service.status.LoadState != 'loaded'

    # archive-backupctl contract. The script threads each replicated dataset
    # through six parallel lists (SRC_LIST/MAP/RMAP, the lock list, and both
    # restore case statements) plus a zvol-vs-filesystem receive branch. The
    # assertions live in files/archive-contract-assert.sh (a real *.sh: shellcheck
    # lints it, and its embedded quotes don't trip Ansible's arg splitter the way
    # an inline `shell:` block would). It pins the lists with NO runtime self-
    # protection — SRC_LIST, both restore paths (per-target + all), and the lock
    # list (a dataset missing there is silently left writable); MAP/RMAP need no
    # static check (a missing key fails loudly under set -u). It also bash -n's the
    # REAL render and pins the type->arm coupling so an inversion is caught.
    - name: Assert the archive-backupctl contract (restorable, lock-listed, type-coupled)
      ansible.builtin.script: files/archive-contract-assert.sh
      changed_when: false

    - name: Display test results
      ansible.builtin.debug:
        msg:
          - "✓ NFS server installed"
          - "✓ /etc/exports configured"
          - "✓ Exports file contains expected paths"
          - "✓ Samba installed"
          - "✓ smb.conf configured"
          - "✓ smb.conf contains expected shares"
          - "✓ NFS service loaded"
          - "✓ Samba service loaded"
          - "✓ archive-backupctl contract (restorable + lock-listed + type-coupled)"
