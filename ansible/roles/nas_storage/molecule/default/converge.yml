---
# Converge playbook for nas_storage role testing
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - nfs-kernel-server
          - samba
          - systemd
        state: present
      when: ansible_os_family == "Debian"

    - name: Create mock ZFS mount points for testing
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /tank/media/unified
        - /tank/media
        - /nvme/media

  roles:
    - role: nas_storage
