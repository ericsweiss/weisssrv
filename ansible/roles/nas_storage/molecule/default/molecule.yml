---
# Per-role Molecule scenario. Shared driver/provisioner/verifier/scenario config
# is inherited from ansible/molecule/base.yml (applied via the `-c` flag in
# test-all-roles.sh and the CI molecule-tests matrix). Only the per-role platform
# and inventory live here (plus role-specific provisioner.env / remote_tmp / a
# custom scenario where needed).
platforms:
  - name: nas-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    capabilities:
      - SYS_ADMIN
    tmpfs:
      - /run
      - /tmp
provisioner:
  inventory:
    group_vars:
      all:
        admin_user: root
        admin_email: test@test.local
        internal_domain: test.local
        skip_ssh_config: true
        skip_dns_config: true
        nfs_exports:
          - path: /tank/media/unified
            clients:
              - spec: 192.168.0.0/24
                options: ro,sync,no_subtree_check
          - path: /tank/appdata/tls
            xprtsec: tls
            clients:
              - spec: 192.168.0.200/29
                options: rw,sync,no_subtree_check,fsid=91
              - spec: 192.168.0.220/29
                options: rw,sync,no_subtree_check,fsid=91
          - path: /tank/media/mixed
            clients:
              - spec: 192.168.0.200/29
                options: rw,sync,no_subtree_check,fsid=92
                xprtsec: tls
              - spec: 192.168.0.154/32
                options: ro,sync,no_subtree_check,fsid=92
          # bind_source exports: one on an encrypted dataset, one plaintext, so
          # the fstab _zfs_anchor split (zfs-mount-encrypted.service vs
          # zfs-mount.service) and the nfs-server drop-in scoping are asserted
          # in verify.yml. The dirs are plain container paths — the mounted-
          # dataset guard is bypassed by skip_zfs_operations.
          - path: /export/appdata
            bind_source: /mnt/ssd/appdata
            clients:
              - spec: 192.168.0.200/29
                options: rw,sync,no_subtree_check,fsid=93
          - path: /export/share
            bind_source: /mnt/tank/share
            clients:
              - spec: 192.168.0.200/29
                options: rw,sync,no_subtree_check,fsid=94
        nas_encrypted_bind_sources:
          - /mnt/ssd/appdata
        media_mover_enabled: true
        media_mover_src: /mnt/nvme/media/library
        media_mover_dst: /mnt/tank/media/library
        nas_swap_clean_enabled: true
        samba_shares:
          - name: media
            path: /tank/media/unified
            read_only: true
            guest_ok: false
        skip_zfs_operations: true
        skip_mergerfs: true
        skip_nfs_reload: true
        skip_smartd_service: true
