---
# Daily swap reset for the memory-tight NAS. vm.swappiness=1 (nic_tuning) stops
# the opportunistic cold-page parking, but a near-capacity host still swaps under
# real peak events (deploys/backups/ML) and that swap never self-clears — so it
# accumulates over time. This timer resets it safely each night. See the script
# header (swap-clean.sh.j2) + docs/06.

- name: Deploy swap-clean script
  ansible.builtin.template:
    src: swap-clean.sh.j2
    dest: /usr/local/sbin/swap-clean.sh
    owner: root
    group: root
    mode: "0755"

- name: Create swap-clean systemd service
  ansible.builtin.template:
    src: swap-clean.service.j2
    dest: /etc/systemd/system/swap-clean.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Create swap-clean systemd timer
  ansible.builtin.template:
    src: swap-clean.timer.j2
    dest: /etc/systemd/system/swap-clean.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable swap-clean timer
  ansible.builtin.systemd:
    name: swap-clean.timer
    enabled: true
    state: started
    daemon_reload: true
