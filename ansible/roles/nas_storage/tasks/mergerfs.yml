---
# MergerFS configuration for tiered storage
#
# TECH DEBT (known): the safe-remount path below is a long inline-shell state
# machine (unexport NFS -> unmount binds -> remount MergerFS -> re-export). It is
# fragile and effectively untestable in molecule (needs live NFS). Future work:
# extract the sequence into one shellcheck-linted helper script invoked by a
# single task (as done for archive-backupctl), and scope the NFS unexport to the
# affected media export rather than the blanket `exportfs -u -a`. Deferred here
# deliberately — an in-place rewrite manipulates live NFS exports and can't be
# validated without molecule + a real NFS server.
#
# IMPORTANT NOTES ON MERGERFS OPTIONS:
# 1. MergerFS options are NOT fully visible in `mount` output or /proc/mounts
#    FUSE only shows generic options (rw, relatime, user_id, etc.)
# 2. Only SOME options are queryable via xattrs (minfreespace, policies, etc.)
# 3. Mount-time-only options (inodecalc, noforget, use_ino, cache.files) are
#    NOT queryable at runtime - they're applied when MergerFS starts
# 4. The only reliable way to verify these options is to check fstab and
#    ensure a fresh mount was done with those options
#
# Verification strategy:
# - Check if fstab has the correct options (authoritative source)
# - Check if current mount appears to be using fstab entry (by presence of .mergerfs)
# - If fstab is correct and mount exists, trust that options are applied
# - If we need to change options, remount cycle is required

- name: Install MergerFS
  ansible.builtin.apt:
    name: mergerfs
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Configure MergerFS mounts in fstab
  ansible.posix.mount:
    path: "{{ item.target }}"
    src: "{{ item.sources | join(':') }}"
    fstype: fuse.mergerfs
    opts: >-
      {{ item.options | join(',') }},fsname={{ item.name }}{%- if item.systemd_requires is defined -%}
      ,{% for req in item.systemd_requires %}x-systemd.requires-mounts-for={{ req }}{% if not loop.last %},{% endif %}{% endfor -%}
      {% endif -%}
    state: mounted
  loop: "{{ mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  register: mergerfs_fstab_changed

# Verify MergerFS mount and options by checking:
# 1. Mount exists and has .mergerfs control file (confirms it's MergerFS)
# 2. Fstab entry contains the critical options we need
# 3. Compare fstab options with what we expect
- name: Verify MergerFS mount status and fstab options
  ansible.builtin.shell: |
    set -o pipefail
    MOUNTPOINT="{{ item.target }}"
    CONTROL_FILE="${MOUNTPOINT}/.mergerfs"

    # Check if mount exists
    if ! mountpoint -q "$MOUNTPOINT" 2>/dev/null; then
      echo "STATUS: NOT_MOUNTED"
      exit 1
    fi

    # Check if it's actually a MergerFS mount (has control file)
    if [ ! -e "$CONTROL_FILE" ]; then
      echo "STATUS: NOT_MERGERFS - mount exists but no .mergerfs control file"
      exit 1
    fi

    # Get fstab entry for this mountpoint
    fstab_opts=$(grep "^[^#].*[[:space:]]{{ item.target }}[[:space:]]" /etc/fstab | awk '{print $4}')
    if [ -z "$fstab_opts" ]; then
      echo "STATUS: NO_FSTAB_ENTRY"
      exit 1
    fi

    echo "FSTAB_OPTS: $fstab_opts"

    # Check for critical NFS options in fstab
    missing_opts=""
    if ! echo "$fstab_opts" | grep -q "inodecalc=path-hash"; then
      missing_opts="${missing_opts}inodecalc=path-hash "
    fi
    if ! echo "$fstab_opts" | grep -q "noforget"; then
      missing_opts="${missing_opts}noforget "
    fi

    if [ -n "$missing_opts" ]; then
      echo "STATUS: FSTAB_MISSING_OPTIONS - $missing_opts"
      exit 1
    fi

    # Check if mount was done recently (after last fstab change)
    # We can't directly verify runtime options, but if fstab is correct
    # and mount exists, we trust it (or flag for remount if fstab just changed)
    echo "STATUS: OK - MergerFS mounted with correct fstab options"
    exit 0
  args:
    executable: /bin/bash
  loop: "{{ mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  register: mergerfs_status_check
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

# Determine if remount is needed:
# - fstab was just changed by ansible.posix.mount (mergerfs_fstab_changed.changed)
# - OR status check shows mount doesn't match fstab
- name: Determine if MergerFS remount is needed
  ansible.builtin.set_fact:
    mergerfs_needs_remount: >-
      {{ (mergerfs_fstab_changed.results | selectattr('changed', 'equalto', true) | list | length > 0)
         or (mergerfs_status_check.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length > 0) }}
  when: not ansible_check_mode

- name: Display MergerFS status
  ansible.builtin.debug:
    msg: |
      MergerFS mount: {{ item.item.name }}
      Status: {{ item.stdout | default('unknown') }}
      Needs remount: {{ mergerfs_needs_remount | default(false) }}
  loop: "{{ mergerfs_status_check.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('unknown') }}"
  when:
    - not ansible_check_mode
    - item.stdout is defined

# If remount needed, check for active NFS exports and processes
- name: Check for active NFS clients on MergerFS-backed exports
  ansible.builtin.shell: |
    set -o pipefail
    MOUNTPOINT="{{ item.target }}"

    # Find bind mounts from this mountpoint to /export
    bind_exports=$(findmnt --list --noheadings -o TARGET | grep "^/export" | while read exp; do
      src=$(findmnt --noheadings -o SOURCE "$exp" 2>/dev/null)
      if [ "$src" = "$MOUNTPOINT" ]; then
        echo "$exp"
      fi
    done)

    if [ -z "$bind_exports" ]; then
      echo "NO_NFS_BIND_EXPORTS"
      exit 0
    fi

    echo "BIND_EXPORTS: $bind_exports"

    # Check for active NFS clients using ss or netstat
    # NFS clients maintain connections on port 2049
    nfs_connections=$(ss -tn state established '( sport = :2049 )' 2>/dev/null | grep -v "^State" | head -5)
    if [ -n "$nfs_connections" ]; then
      echo "ACTIVE_NFS_CLIENTS:"
      echo "$nfs_connections"
      exit 1
    fi

    echo "NFS_IDLE"
    exit 0
  args:
    executable: /bin/bash
  loop: "{{ mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  register: mergerfs_nfs_check
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - mergerfs_needs_remount | default(false)

- name: Check for processes using MergerFS mount
  ansible.builtin.shell: |
    set -o pipefail
    MOUNTPOINT="{{ item.target }}"

    # Use fuser to check for processes
    if fuser -m "$MOUNTPOINT" 2>/dev/null | grep -q .; then
      echo "IN_USE:"
      fuser -vm "$MOUNTPOINT" 2>&1 | head -20
      exit 1
    fi

    echo "IDLE"
    exit 0
  args:
    executable: /bin/bash
  loop: "{{ mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  register: mergerfs_process_check
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - mergerfs_needs_remount | default(false)
    - mergerfs_nfs_check.results | selectattr('rc', 'defined') | selectattr('rc', 'eq', 0) | list | length > 0

# Display warning if remount is blocked
- name: Display warning - MergerFS remount blocked
  ansible.builtin.debug:
    msg: |
      WARNING: MergerFS mount {{ item.item.name }} needs remount to apply fstab options,
      but cannot proceed safely.

      {% if mergerfs_nfs_check.results is defined %}
      {% for nfs in mergerfs_nfs_check.results %}
      {% if nfs.rc is defined and nfs.rc != 0 %}
      NFS Status: {{ nfs.stdout | default('Active clients detected') }}
      {% endif %}
      {% endfor %}
      {% endif %}

      {% if mergerfs_process_check.results is defined %}
      {% for proc in mergerfs_process_check.results %}
      {% if proc.rc is defined and proc.rc != 0 %}
      Process Status: {{ proc.stdout | default('Processes using mount') }}
      {% endif %}
      {% endfor %}
      {% endif %}

      To apply correct options:
      1. Stop all NFS clients and services using the mount
      2. Re-run: task storage:deploy
      -- OR --
      Reboot the system (fstab has correct options, will apply on boot)
      -- OR --
      Manual remount:
        exportfs -u -a
        umount /export/media
        umount /mnt/media
        mount /mnt/media
        mount /export/media
        exportfs -a
  loop: "{{ mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - mergerfs_needs_remount | default(false)
    - (mergerfs_nfs_check.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length > 0)
      or (mergerfs_process_check.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length > 0)

# Perform safe remount if everything is idle
- name: Check if safe remount is possible
  ansible.builtin.set_fact:
    mergerfs_safe_to_remount: >-
      {{ mergerfs_needs_remount | default(false)
         and (mergerfs_nfs_check.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length == 0)
         and (mergerfs_process_check.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length == 0) }}
  when: not ansible_check_mode

- name: Temporarily unexport all NFS paths
  ansible.builtin.command: exportfs -u -a
  when:
    - not ansible_check_mode
    - mergerfs_safe_to_remount | default(false)
  register: nfs_unexport
  changed_when: nfs_unexport.rc == 0

# Unmount bind mounts that source from MergerFS
- name: Identify and unmount bind mounts sourced from MergerFS
  ansible.builtin.shell: |
    set -o pipefail
    MOUNTPOINT="{{ item.target }}"

    # Find bind mounts where source is this mountpoint
    findmnt --list --noheadings -o TARGET,SOURCE -t none | while read target source; do
      if [ "$source" = "$MOUNTPOINT" ]; then
        echo "Unmounting: $target (bind from $source)"
        umount "$target" || echo "Warning: failed to unmount $target"
      fi
    done
  args:
    executable: /bin/bash
  loop: "{{ mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - nfs_unexport is defined
    - nfs_unexport.changed | default(false)
  register: bind_unmount
  changed_when: "'Unmounting:' in stdout"

- name: Unmount MergerFS
  ansible.posix.mount:
    path: "{{ item.target }}"
    state: unmounted
  loop: "{{ mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - bind_unmount is defined
    - bind_unmount.changed | default(false)
  register: mergerfs_unmount

- name: Mount MergerFS with fstab options
  ansible.posix.mount:
    path: "{{ item.target }}"
    state: mounted
  loop: "{{ mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - mergerfs_unmount is defined
    - mergerfs_unmount.changed | default(false)
  register: mergerfs_mount

# Remount bind mounts for NFS exports
- name: Identify bind mounts to remount
  ansible.builtin.set_fact:
    mergerfs_bind_paths: >-
      {{ nfs_exports | default([])
         | selectattr('bind_source', 'defined')
         | selectattr('bind_source', 'in', mergerfs_mounts | map(attribute='target') | list)
         | map(attribute='path')
         | list }}
  when:
    - not ansible_check_mode
    - mergerfs_mount is defined
    - mergerfs_mount.changed | default(false)

- name: Remount bind mounts for NFS exports
  ansible.posix.mount:
    path: "{{ item }}"
    state: mounted
  loop: "{{ mergerfs_bind_paths | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when:
    - not ansible_check_mode
    - mergerfs_mount is defined
    - mergerfs_mount.changed | default(false)
    - mergerfs_bind_paths | default([]) | length > 0
  register: bind_remount

- name: Re-export NFS paths
  ansible.builtin.command: exportfs -a
  when:
    - not ansible_check_mode
    - nfs_unexport is defined
    - nfs_unexport.changed | default(false)
  register: nfs_reexport
  changed_when: nfs_reexport.rc == 0

# Final verification
- name: Verify MergerFS mount after remount cycle
  ansible.builtin.shell: |
    set -o pipefail
    MOUNTPOINT="{{ item.target }}"
    CONTROL_FILE="${MOUNTPOINT}/.mergerfs"

    if ! mountpoint -q "$MOUNTPOINT"; then
      echo "FAILED: Not mounted"
      exit 1
    fi

    if [ ! -e "$CONTROL_FILE" ]; then
      echo "FAILED: No .mergerfs control file"
      exit 1
    fi

    # Verify fstab has correct options
    fstab_opts=$(grep "^[^#].*[[:space:]]{{ item.target }}[[:space:]]" /etc/fstab | awk '{print $4}')
    if echo "$fstab_opts" | grep -q "inodecalc=path-hash" && echo "$fstab_opts" | grep -q "noforget"; then
      echo "SUCCESS: MergerFS mounted, fstab has correct options"
      echo "FSTAB: $fstab_opts"
      exit 0
    else
      echo "WARNING: Fstab options may be incomplete: $fstab_opts"
      exit 1
    fi
  args:
    executable: /bin/bash
  loop: "{{ mergerfs_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  register: mergerfs_final_verify
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - mergerfs_mount is defined
    - mergerfs_mount.changed | default(false)

- name: Report final MergerFS status
  ansible.builtin.debug:
    msg: "{{ item.stdout }}"
  loop: "{{ mergerfs_final_verify.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('unknown') }}"
  when:
    - item.stdout is defined

- name: Deploy MergerFS remount service
  ansible.builtin.template:
    src: mergerfs-remount.service.j2
    dest: /etc/systemd/system/mergerfs-remount.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable MergerFS remount service
  ansible.builtin.systemd:
    name: mergerfs-remount.service
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode
