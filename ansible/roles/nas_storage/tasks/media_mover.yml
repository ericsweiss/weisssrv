---
# Media mover script and scheduling

# media-mover.sh.j2 references media_mover_src/media_mover_dst with no default()
# filter, so an undefined value would otherwise fail with a bare 'undefined
# variable' render error. Assert the contract up front with an actionable msg.
- name: Assert media-mover source and destination are defined
  ansible.builtin.assert:
    that:
      - media_mover_src is defined and (media_mover_src | length > 0)
      - media_mover_dst is defined and (media_mover_dst | length > 0)
    fail_msg: >-
      media_mover_enabled is true but media_mover_src/media_mover_dst are not
      set. Define both (hot-tier source and archival-tier destination) in
      host_vars before enabling the media mover.

- name: Deploy media-mover script
  ansible.builtin.template:
    src: media-mover.sh.j2
    dest: /usr/local/sbin/media-mover.sh
    owner: root
    group: root
    mode: "0755"

- name: Create media-mover systemd service
  ansible.builtin.template:
    src: media-mover.service.j2
    dest: /etc/systemd/system/media-mover.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Create media-mover systemd timer
  ansible.builtin.template:
    src: media-mover.timer.j2
    dest: /etc/systemd/system/media-mover.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable media-mover timer
  ansible.builtin.systemd:
    name: media-mover.timer
    enabled: true
    state: started
    daemon_reload: true
