---
# Archive backup — nightly ZFS replication to archive pool

- name: Deploy archive-backupctl script
  ansible.builtin.template:
    src: archive-backupctl.sh.j2
    dest: /usr/local/sbin/archive-backupctl
    owner: root
    group: root
    mode: "0755"

- name: Deploy archive-backup systemd service
  ansible.builtin.template:
    src: archive-backup.service.j2
    dest: /etc/systemd/system/archive-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Deploy archive-backup systemd timer
  ansible.builtin.template:
    src: archive-backup.timer.j2
    dest: /etc/systemd/system/archive-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable and start archive-backup timer
  ansible.builtin.systemd:
    name: archive-backup.timer
    enabled: true
    state: started
    daemon_reload: true
