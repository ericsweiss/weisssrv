---
# NAS-side backup-artifact freshness collector (independent of the VM/k8s
# wrappers). Deploys a templated collector script + a node_exporter textfile
# collector oneshot/timer via the shared textfile_collector scaffold.

- name: Deploy backup-artifact mtime collector script
  ansible.builtin.template:
    src: backup-artifact-mtime-collector.sh.j2
    dest: /usr/local/sbin/backup-artifact-mtime-collector.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy backup-artifact collector unit + timer
  ansible.builtin.include_role:
    name: textfile_collector
  vars:
    textfile_collector_name: backup-artifact-mtime-collector
    textfile_collector_service_description: Sample tank/backups/apps artifact mtimes to node_exporter textfile collector
    textfile_collector_timer_description: Periodically sample backup-artifact mtimes
    textfile_collector_script: /usr/local/sbin/backup-artifact-mtime-collector.sh
    textfile_collector_textfile_dir: "{{ nas_backup_artifact_metrics_dir | default(node_exporter_host_textfile_dir | default('/var/lib/node_exporter')) }}"
    textfile_collector_extra_read_write_paths: []
    textfile_collector_on_unit_inactive_sec: 10min
    textfile_collector_timeout_start_sec: 30s

- name: Enable + start the backup-artifact collector timer
  ansible.builtin.systemd:
    name: backup-artifact-mtime-collector.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
