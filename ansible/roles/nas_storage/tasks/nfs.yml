---
# NFS server configuration

- name: Ensure media group exists
  ansible.builtin.group:
    name: media
    gid: 2000
    state: present

- name: Install NFS server packages
  ansible.builtin.apt:
    name:
      - nfs-kernel-server
      - nfs-common
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Create export root directory
  ansible.builtin.file:
    path: /export
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create bind mount directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ nfs_exports }}"
  loop_control:
    label: "{{ item.path }}"

# Guard against capturing the still-empty mountpoint of an unmounted ZFS
# dataset. If the pool is exported or its encryption key is unloaded, the
# mountpoint is a bare directory on the root fs; the file task below would
# mkdir/chown it there, and "Configure bind mounts in fstab" (state: mounted)
# could then bind that empty root-fs dir, which "Deploy NFS exports" serves —
# exactly the empty-mountpoint capture the bind fstab comment and the
# zfs_encryption RequiredBy=zfs-mount ordering guard against. Only the
# tank/ssd/nvme-backed sources are ZFS datasets (same regex the fstab task
# uses to scope its boot-ordering opts); mergerfs sources like /mnt/media are
# not single datasets and are checked separately by mergerfs.yml.
# bind_source_check lets an export whose bind_source is a SUBDIRECTORY of a ZFS
# dataset (e.g. /mnt/tank/backups/apps under tank/backups) point the
# mounted-dataset guard at the parent DATASET mountpoint — the subdir itself is
# never a mountpoint, so guarding it directly would always fail. Defaults to
# bind_source (the common dataset-root case is unchanged).
- name: Verify ZFS-backed bind sources are mounted datasets
  ansible.builtin.command: "mountpoint -q {{ item.bind_source_check | default(item.bind_source) }}"
  loop: "{{ nfs_exports }}"
  loop_control:
    label: "{{ item.bind_source_check | default(item.bind_source) | default('N/A') }}"
  register: nfs_bind_source_mounted
  changed_when: false
  check_mode: false
  # Fail closed on an unmounted ZFS source in production. The bypass is gated on
  # skip_zfs_operations — set ONLY in the molecule container (no real ZFS mounts)
  # — NOT skip_nfs_reload: skipping the NFS reload must never silently disable
  # this safety check (otherwise the tasks below would mkdir/chown + bind an
  # empty root-fs dir that "Deploy NFS exports" would then serve).
  failed_when:
    - nfs_bind_source_mounted.rc != 0
    - not (skip_zfs_operations | default(false))
  when:
    - item.bind_source is defined
    - item.bind_source is match('^/mnt/(tank|ssd|nvme)/')

- name: Set ownership on bind source directories
  ansible.builtin.file:
    path: "{{ item.bind_source }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ nfs_exports }}"
  loop_control:
    label: "{{ item.bind_source | default('N/A') }}"
  when: item.bind_source is defined

# Fail loud if a per-app appdata path is itself a mountpoint. A nested ZFS
# dataset auto-created under ssd/appdata/<name> (e.g. proxmox_vm's
# `zfs create -p -V ...mealie/postgres` materializes ssd/appdata/mealie) can
# mount over the stub the task below chowns, while NFS clients read the
# shadowed dir under the NON-recursive /export/appdata bind. Detect the
# shadowing instead of silently chowning the wrong filesystem; the fix is
# `canmount=off` on the nested dataset (codified in host_vars zfs_pools).
- name: Guard against a per-app appdata path being a shadowing mountpoint
  ansible.builtin.command: "mountpoint -q {{ nas_appdata_base }}/{{ item }}"
  loop: "{{ nas_appdata_dirs | default([]) }}"
  loop_control:
    label: "{{ nas_appdata_base }}/{{ item }}"
  register: nfs_appdata_mountpoint
  changed_when: false
  check_mode: false
  failed_when:
    - nfs_appdata_mountpoint.rc == 0
    - not (skip_zfs_operations | default(false))
  when:
    - nas_appdata_dirs | default([]) | length > 0
    - nas_appdata_base in (nfs_exports | selectattr('bind_source', 'defined')
        | map(attribute='bind_source') | list)

# Per-app subdirectories under the appdata NFS export. The apps that persist
# config on this export (Grafana + the downloads/recipes clients) mount
# /appdata/<name>; the directory must exist and be owned 1000:2000 (the export
# all_squashes every client write to that uid/gid, so a container running as any
# other UID still writes as 1000:2000) before the app's first write, or a
# floating pod lands on an unwritable/absent path. Placed AFTER the
# mounted-dataset guard above so a locked/unmounted ssd pool never gets these
# mkdir'd onto its bare mountpoint — the same empty-mountpoint capture the guard
# prevents for the binds. Skipped on any host that does not export appdata.
- name: Create per-app appdata subdirectories
  ansible.builtin.file:
    path: "{{ nas_appdata_base }}/{{ item }}"
    state: directory
    owner: "{{ nas_appdata_owner }}"
    group: "{{ nas_appdata_group }}"
    mode: "{{ nas_appdata_mode }}"
  loop: "{{ nas_appdata_dirs | default([]) }}"
  loop_control:
    label: "{{ nas_appdata_base }}/{{ item }}"
  when:
    - nas_appdata_dirs | default([]) | length > 0
    - nas_appdata_base in (nfs_exports | selectattr('bind_source', 'defined')
        | map(attribute='bind_source') | list)

# The per-app tank/backups/apps/<app> subdirs are now each their own scoped NFS
# export (host_vars nfs_exports), so they are bind_sources — created + owned
# (1000:2000 02775) by "Set ownership on bind source directories" above (which
# runs AFTER the mounted-dataset guard, so a locked tank/backups can never have
# them mkdir'd onto a bare root-fs mountpoint). No dedicated subdir-creation step
# is needed.

- name: Configure bind mounts in fstab
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.bind_source }}"
    fstype: none
    # Order ZFS-backed export binds after the ZFS mounts. Without this the fstab
    # bind units race the mount at boot — a bind can capture the still-empty
    # mountpoint on the root fs instead of the ZFS dataset, stacking a stale
    # layer under the real bind and making the NFS export serve an empty/stale
    # directory (surfaced as backups failing with "could not activate storage
    # 'tank-proxmox' ... unreachable"). `nofail` keeps a not-yet-mounted source
    # from blocking boot. zfs-mount-generator is not enabled here (no
    # /etc/zfs/zfs-list.cache), so we order against the bulk mount unit
    # explicitly.
    #
    # ANCHOR CHOICE (see _zfs_anchor below): ENCRYPTED bind sources order on the
    # LATE zfs-mount-encrypted.service — the early stock zfs-mount.service runs
    # before keys are loaded and SKIPS the locked datasets, so an encrypted bind
    # ordered on it would capture the empty mountpoint. Plaintext ZFS sources
    # keep ordering on the early zfs-mount.service. Non-ZFS sources (mergerfs
    # /mnt/media, lifecycle-managed by mergerfs.yml) keep a plain bind.
    opts: >-
      {{
        'bind,nofail,x-systemd.requires=' ~ _zfs_anchor
        ~ ',x-systemd.after=' ~ _zfs_anchor
        ~ ',x-systemd.requires-mounts-for=' ~ item.bind_source
        if item.bind_source is match('^/mnt/(tank|ssd|nvme)/')
        else 'bind'
      }}
    state: mounted
  loop: "{{ nfs_exports }}"
  loop_control:
    label: "{{ item.path }}"
  vars:
    _zfs_anchor: >-
      {{ 'zfs-mount-encrypted.service'
         if item.bind_source in (nas_encrypted_bind_sources | default([]))
         else 'zfs-mount.service' }}
  when: item.bind_source is defined

- name: Deploy NFS exports configuration
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  notify: Reload NFS exports

# nfsd must not begin exporting the encrypted datasets until they are unlocked
# and mounted — otherwise it serves the empty/locked mountpoint and the
# NFS-over-TLS data path wedges for NEW client mounts (observed 2026-06-21,
# when nfsd was force-started ahead of the mounts via --job-mode). Order nfsd
# after the late mount anchor + require the encrypted export bind mounts.
- name: Ensure nfs-server drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/nfs-server.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy nfs-server ordering drop-in (gate nfsd on encrypted-dataset mounts)
  ansible.builtin.template:
    src: nfs-server-zfs.conf.j2
    dest: /etc/systemd/system/nfs-server.service.d/zfs-encrypted.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart nfs-server for ordering

# Flush now — BEFORE starting/probing nfsd — so the drop-in's daemon-reload and
# the "Restart nfs-server for ordering" handler run first. Otherwise a stopped
# nfsd is started once with the OLD unit config (the drop-in isn't loaded until
# the handler's daemon_reload), and the readiness probe could check the
# pre-restart listener. (meta: flush_handlers ignores `when`; the handlers
# themselves are guarded by skip_nfs_reload, so this is a no-op under molecule.)
- name: Flush pending NFS handlers before starting/probing NFS
  ansible.builtin.meta: flush_handlers

- name: Ensure NFS server is enabled and running
  ansible.builtin.service:
    name: nfs-kernel-server
    state: started
    enabled: true
  when: not (skip_nfs_reload | default(false))

# Real client-facing readiness signal. nfs-server.service is Type=oneshot
# (active/exited) so its unit state does not prove nfsd is serving; the TCP
# listener on 2049 does. Fails the play loudly if nfsd isn't accepting
# connections (every NFS-over-TLS client would fail to mount).
- name: Verify nfsd is serving on TCP 2049
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 2049
    state: started
    timeout: 30
  changed_when: false
  when: not (skip_nfs_reload | default(false))
