---
# ZFS dataset configuration and scrub timers

- name: Verify ZFS datasets exist and set properties
  ansible.builtin.shell: |
    if zfs list {{ item.1.name }} >/dev/null 2>&1; then
      {% for prop, value in item.1.properties.items() %}
      zfs set {{ prop }}={{ value }} {{ item.1.name }}
      {% endfor %}
      echo "CONFIGURED"
    else
      echo "DATASET_MISSING"
    fi
  loop: "{{ zfs_pools | subelements('datasets') }}"
  loop_control:
    label: "{{ item.1.name }}"
  register: zfs_result
  changed_when: "'CONFIGURED' in zfs_result.stdout"
  failed_when: "'DATASET_MISSING' in zfs_result.stdout"

- name: Enable ZFS scrub timer
  ansible.builtin.systemd:
    name: "zfs-scrub-{{ zfs_scrub_schedule | default('monthly') }}@{{ item.name }}.timer"
    enabled: true
    state: started
  loop: "{{ zfs_pools }}"
  loop_control:
    label: "{{ item.name }}"
  when: zfs_scrub_enabled | default(true)
  failed_when: false

- name: Ensure zfs-auto-snapshot is installed
  ansible.builtin.apt:
    name: zfs-auto-snapshot
    state: present
  when: ansible_facts['os_family'] == "Debian"
