---
# ZFS dataset configuration and scrub timers

# Pools can be legitimately absent at deploy time — the archive pool's
# documented steady state is exported/unplugged. Probe each pool once and
# skip its datasets/scrub timer when it is not imported, rather than
# hard-failing the whole storage deploy on a `zfs list` miss.
- name: Probe imported ZFS pools
  ansible.builtin.command: zpool list -H -o name
  register: zfs_imported_pools
  changed_when: false
  check_mode: false

# Reads each property's current value and only `zfs set`s on a mismatch,
# so the task reports changed only when it actually changed something.
# Datasets in a pool that is not imported are skipped (not failed).
# NOTE: property values in zfs_pools[].properties MUST be in the canonical form
# `zfs get -H -o value <prop>` returns — ZFS normalizes several inputs (e.g.
# compression 'on' -> active algorithm, recordsize '1M' -> '1048576', quota
# '1T' -> a byte count). A human-form value here would never compare equal, so
# the task would `zfs set` and report changed on every run (masking real drift).
- name: Verify ZFS datasets exist and set properties
  ansible.builtin.shell: |
    if ! zfs list {{ item.1.name | quote }} >/dev/null 2>&1; then
      echo "DATASET_MISSING"
      exit 0
    fi
    changed=0
    {% for prop, value in item.1.properties.items() %}
    current=$(zfs get -H -o value {{ prop | quote }} {{ item.1.name | quote }} 2>/dev/null)
    if [ "$current" != {{ value | quote }} ]; then
      zfs set {{ prop | quote }}={{ value | quote }} {{ item.1.name | quote }}
      changed=1
    fi
    {% endfor %}
    if [ "$changed" -eq 1 ]; then echo "CHANGED"; else echo "OK"; fi
  loop: "{{ zfs_pools | subelements('datasets') }}"
  loop_control:
    label: "{{ item.1.name }}"
  register: zfs_result
  changed_when: "'CHANGED' in zfs_result.stdout"
  # The pool is imported (the when: gate guarantees it), so a missing dataset
  # here is a real misconfiguration, not the exported-archive steady state —
  # surface it. Datasets in an un-imported pool are skipped by the when: gate.
  failed_when: "'DATASET_MISSING' in zfs_result.stdout"
  when: item.0.name in zfs_imported_pools.stdout_lines

# The zfs-scrub-<schedule>@.timer template units are shipped by
# zfsutils-linux and exist for any imported pool, so enabling/starting them
# is expected to succeed. We deliberately do NOT blanket-swallow with
# failed_when: false — that masked a misspelled zfs_scrub_schedule (which
# builds a non-existent unit name) and let scrubs silently never run on the
# multi-TB raidz pools. The imported-pool when: gate already covers the
# exported/absent-pool steady state; any remaining failure here (e.g. a bad
# schedule -> "Unit ... not found") is a real misconfiguration and must
# surface.
- name: Enable ZFS scrub timer
  ansible.builtin.systemd:
    name: "zfs-scrub-{{ zfs_scrub_schedule | default('monthly') }}@{{ item.name }}.timer"
    enabled: true
    state: started
  loop: "{{ zfs_pools }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - zfs_scrub_enabled | default(true)
    - item.name in zfs_imported_pools.stdout_lines

- name: Ensure zfs-auto-snapshot is installed
  ansible.builtin.apt:
    name: zfs-auto-snapshot
    state: present
  when: ansible_facts['os_family'] == "Debian"
