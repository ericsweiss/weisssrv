---
# ZFS dataset configuration and scrub timers

# Pools can be legitimately absent at deploy time: the archive pool is normally
# IMPORTED (the nightly archive-backup -> restic -> B2 chain depends on it), but
# the absent branch is the unplug/DR path. Probe each pool once and skip its
# datasets/scrub timer when it is not imported, rather than hard-failing the
# whole storage deploy on a `zfs list` miss.
- name: Probe imported ZFS pools
  ansible.builtin.command: zpool list -H -o name
  register: zfs_imported_pools
  changed_when: false
  check_mode: false

# Reads each property's current value and only `zfs set`s on a mismatch,
# so the task reports changed only when it actually changed something.
# Datasets in a pool that is not imported are skipped (not failed).
# `set -e` after the existence probe: a failing `zfs set` (or a bad property
# name in `zfs get`) must fail the task, not fall through to CHANGED/OK —
# failed_when checks rc because setting failed_when replaces Ansible's
# default rc!=0 handling.
# NOTE: property values in zfs_pools[].properties MUST be written exactly as
# `zfs get -H -o value <prop>` prints them — the HUMAN-READABLE form, since the
# comparison runs without -p (recordsize prints '1M', not 1048576; acltype
# prints 'posix'). A value in any other form (e.g. a byte count) would never
# compare equal, so the task would `zfs set` and report changed on every run
# (masking real drift).
- name: Verify ZFS datasets exist and set properties
  ansible.builtin.shell: |
    if ! zfs list {{ item.1.name | quote }} >/dev/null 2>&1; then
      echo "DATASET_MISSING"
      exit 0
    fi
    set -e
    changed=0
    {% for prop, value in item.1.properties.items() %}
    current=$(zfs get -H -o value {{ prop | quote }} {{ item.1.name | quote }} 2>/dev/null)
    if [ "$current" != {{ value | quote }} ]; then
      zfs set {{ prop | quote }}={{ value | quote }} {{ item.1.name | quote }}
      changed=1
    fi
    {% endfor %}
    if [ "$changed" -eq 1 ]; then echo "CHANGED"; else echo "OK"; fi
  loop: "{{ zfs_pools | subelements('datasets') }}"
  loop_control:
    label: "{{ item.1.name }}"
  register: zfs_result
  changed_when: "'CHANGED' in zfs_result.stdout"
  # The pool is imported (the when: gate guarantees it), so a missing dataset
  # here is a real misconfiguration, not the exported-archive steady state —
  # surface it. Datasets in an un-imported pool are skipped by the when: gate.
  failed_when: "zfs_result.rc != 0 or 'DATASET_MISSING' in zfs_result.stdout"
  when: item.0.name in zfs_imported_pools.stdout_lines

# The zfs-scrub-<schedule>@.timer template units are shipped by
# zfsutils-linux and exist for any imported pool, so enabling/starting them
# is expected to succeed. We deliberately do NOT blanket-swallow with
# failed_when: false — that masked a misspelled zfs_scrub_schedule (which
# builds a non-existent unit name) and let scrubs silently never run on the
# multi-TB raidz pools. The imported-pool when: gate already covers the
# exported/absent-pool steady state; any remaining failure here (e.g. a bad
# schedule -> "Unit ... not found") is a real misconfiguration and must
# surface.
- name: Enable ZFS scrub timer
  ansible.builtin.systemd:
    name: "zfs-scrub-{{ zfs_scrub_schedule | default('monthly') }}@{{ item.name }}.timer"
    enabled: true
    state: started
  loop: "{{ zfs_pools }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - zfs_scrub_enabled | default(true)
    - item.name in zfs_imported_pools.stdout_lines

- name: Ensure zfs-auto-snapshot is installed
  ansible.builtin.apt:
    name: zfs-auto-snapshot
    state: present
  when: ansible_facts['os_family'] == "Debian"

# Cap the ZFS ARC via a module parameter when zfs_arc_max_bytes is set. Baked
# into the initramfs (Update initramfs handler) so it applies at early boot,
# before the data pools import and the ARC grows to the ~half-RAM default and
# swap-thrashes the pinned guests on this memory-over-committed host. Empty
# default -> the file is not managed (no cap enforced, nothing removed).
- name: Cap ZFS ARC via modprobe.d
  ansible.builtin.template:
    src: zfs-modprobe.conf.j2
    dest: /etc/modprobe.d/zfs.conf
    owner: root
    group: root
    mode: "0644"
  when: zfs_arc_max_bytes | default('') | string | length > 0
  notify: Update initramfs

# The modprobe.d file + initramfs rebuild above only take effect at the next
# boot. Apply the cap to the running kernel too so a changed zfs_arc_max_bytes
# is live immediately (compare-then-set, matching the property task above).
# Guarded on the sysfs param existing — the molecule container has no ZFS
# module, so the file is absent there.
- name: Check for running ZFS ARC parameter
  ansible.builtin.stat:
    path: /sys/module/zfs/parameters/zfs_arc_max
  register: zfs_arc_max_param
  when: zfs_arc_max_bytes | default('') | string | length > 0

- name: Apply ZFS ARC cap to the running kernel
  ansible.builtin.shell: |
    current=$(cat /sys/module/zfs/parameters/zfs_arc_max)
    if [ "$current" != {{ zfs_arc_max_bytes | quote }} ]; then
      echo {{ zfs_arc_max_bytes | quote }} > /sys/module/zfs/parameters/zfs_arc_max
      echo "CHANGED"
    else
      echo "OK"
    fi
  register: zfs_arc_runtime
  changed_when: "'CHANGED' in zfs_arc_runtime.stdout"
  # No check_mode:false — this task writes /sys, so a dry-run (task infra:check)
  # must skip it rather than mutate the running kernel on the live NAS.
  when:
    - zfs_arc_max_bytes | default('') | string | length > 0
    - zfs_arc_max_param.stat.exists | default(false)
