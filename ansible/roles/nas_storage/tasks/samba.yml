---
# Samba file sharing configuration

- name: Install Samba packages
  ansible.builtin.apt:
    name:
      - samba
      - samba-common-bin
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Ensure media group exists
  ansible.builtin.group:
    name: media
    gid: 2000
    state: present

- name: Ensure nas user exists
  ansible.builtin.user:
    name: nas
    comment: "Samba NAS user"
    groups: media
    append: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

# Password reaches smbpasswd via stdin (never the shell command text).
# Idempotency comes from probing whether the current 1Password value
# already authenticates — so rotations apply, but steady-state runs
# report ok.
# smbclient reads PASSWD from the environment — the secret never appears
# in argv/process listings.
# NOTE: this check fails-OPEN on transport errors — any non-zero rc (smbd
# mid-restart, loopback socket refused, etc.), not just an auth failure,
# triggers the password reset below. Blast radius is small (re-sets the same
# secret), but a transport blip during a deploy will report a spurious
# 'changed' and could reset the stored password if the env secret has drifted.
- name: Check whether the current Samba password already works
  ansible.builtin.command:
    cmd: smbclient -L localhost -U nas
  environment:
    PASSWD: "{{ lookup('ansible.builtin.env', 'SAMBA_NAS_PASSWORD') }}"
  register: samba_password_check
  changed_when: false
  failed_when: false
  no_log: true
  check_mode: false
  when: lookup('ansible.builtin.env', 'SAMBA_NAS_PASSWORD', default='') != ''

- name: Set Samba password for nas user
  ansible.builtin.command:
    cmd: smbpasswd -a -s nas
    stdin: "{{ pw }}\n{{ pw }}"
  vars:
    pw: "{{ lookup('ansible.builtin.env', 'SAMBA_NAS_PASSWORD') }}"
  when:
    - lookup('ansible.builtin.env', 'SAMBA_NAS_PASSWORD', default='') != ''
    - samba_password_check.rc | default(1) != 0
  no_log: true
  register: samba_password_set
  changed_when: true

- name: Deploy Samba configuration
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
    validate: "testparm -s %s"
  notify: Restart smbd

- name: Ensure Samba services are enabled and running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - smbd
    - nmbd
