---
# Handlers for NAS storage role

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload NFS exports
  ansible.builtin.command: exportfs -ra
  changed_when: true
  when: not (skip_nfs_reload | default(false))

- name: Restart smbd
  ansible.builtin.service:
    name: smbd
    state: restarted

- name: Restart smartd
  ansible.builtin.service:
    name: smartd
    state: restarted
  when: not (skip_smartd_service | default(false))
