---
# encrypted_swap — configure dm-crypt plain-mode, random-key swap via
# /etc/crypttab + /etc/fstab; activation is DEFERRED to the next reboot. The
# config never leaves a state where `swapon -a` yields zero swap: the plaintext
# backing line stays in fstab alongside a higher-priority `nofail` mapper line,
# and the boot finalize unit drops the plaintext device once the encrypted mapper
# has come up (and completes the switch at boot if the plaintext line won the boot
# race — the only safe moment to swapoff, when memory is empty). See README +
# docs/42.
#
# There is deliberately NO live (running-host) switchover. Converting an ACTIVE
# swap device to encrypted needs a swapoff first, and systemd-cryptsetup's mkswap
# on the mapper overwrites the plaintext device's swap header — so a switch that
# fails its post-swapon check cannot restore plaintext swap and leaves the host
# swapless. Activation on reboot is the clean, standard path (systemd-cryptsetup
# opens + mkswaps the mapper via crypttab) and swap is ephemeral, so deferring
# costs nothing. (The live path is gone after it left five hosts swapless on its
# first real run — pipeline 887.)

- name: Configure encrypted swap
  when: encrypted_swap_enabled | default(true)
  block:
    # BOTH packages: Debian trixie / PVE 9 split the systemd crypttab
    # machinery into the separate systemd-cryptsetup package (the
    # systemd-cryptsetup-generator + systemd-cryptsetup@.service template).
    # Without it the generator never materializes the unit and swap never
    # activates at boot (first fleet deploy, pipeline 887) — cryptsetup alone
    # only ships the userspace tools.
    - name: Install cryptsetup + the systemd crypttab machinery
      ansible.builtin.apt:
        name:
          - cryptsetup
          - systemd-cryptsetup
        state: present
        update_cache: true
        cache_valid_time: 3600

    # crypttab: systemd-cryptsetup opens <source> with a RANDOM key from
    # /dev/urandom (plain mode — no `luks` option) and mkswaps the mapper (the
    # `swap` option) at every boot, so the on-disk swap is unrecoverable after a
    # reboot. Managed as a single keyed line so a future crypttab entry is
    # untouched.
    - name: Ensure /etc/crypttab exists
      ansible.builtin.file:
        path: /etc/crypttab
        state: touch
        owner: root
        group: root
        mode: "0600"
        modification_time: preserve
        access_time: preserve

    - name: Manage the encrypted-swap crypttab entry
      ansible.builtin.lineinfile:
        path: /etc/crypttab
        regexp: '^{{ encrypted_swap_mapper_name | regex_escape }}\s+'
        line: >-
          {{ encrypted_swap_mapper_name }} {{ encrypted_swap_source_device }}
          /dev/urandom swap,cipher={{ encrypted_swap_cipher }},size={{ encrypted_swap_key_size }},sector-size={{ encrypted_swap_sector_size }}
        owner: root
        group: root
        mode: "0600"

    # fstab: the encrypted MAPPER line, higher-priority + nofail. It coexists with
    # the plaintext backing line until the boot finalize unit drops the plaintext
    # device after the activation reboot. `nofail` lets `swapon -a` silently skip
    # the mapper while it is still absent (the pre-reboot defer window) — so swap
    # is never zero in any state; `pri=` makes the kernel prefer the encrypted
    # mapper the moment it comes up.
    - name: Ensure the encrypted-swap fstab line (mapper, higher priority, nofail)
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^/dev/mapper/{{ encrypted_swap_mapper_name | regex_escape }}\s+'
        line: "/dev/mapper/{{ encrypted_swap_mapper_name }} none swap sw,pri={{ encrypted_swap_mapper_swap_priority }},nofail 0 0"
        owner: root
        group: root
        mode: "0644"

    # Remove the obsolete live-switch decision script left on hosts managed
    # before the live path was dropped. It is no longer invoked, but it still
    # carries the unsafe swapoff→open→swapon logic (the one that stranded hosts
    # swapless), so purge it rather than leave a hand-runnable footgun on disk.
    - name: Remove the obsolete encrypted-swap live-switch script
      ansible.builtin.file:
        path: /usr/local/sbin/encrypted-swap-switch.sh
        state: absent

    # Boot finalize: after the activation reboot, drop the plaintext backing swap
    # and comment its fstab line exactly once (guarded on the mapper being ACTIVE
    # swap in /proc/swaps); and — if the plaintext line won the boot race so the
    # mapper never opened — complete the switch at boot (memory empty, so the
    # swapoff cannot OOM), always keeping a working swap on any failure.
    - name: Deploy the encrypted-swap boot finalize script
      ansible.builtin.template:
        src: encrypted-swap-finalize.sh.j2
        dest: /usr/local/sbin/encrypted-swap-finalize.sh
        owner: root
        group: root
        mode: "0755"

    - name: Deploy the encrypted-swap boot finalize unit
      ansible.builtin.template:
        src: encrypted-swap-finalize.service.j2
        dest: /etc/systemd/system/encrypted-swap-finalize.service
        owner: root
        group: root
        mode: "0644"

    - name: Enable the encrypted-swap boot finalize unit
      ansible.builtin.systemd:
        name: encrypted-swap-finalize.service
        enabled: true
        daemon_reload: true

    # Reload so the crypttab generator materializes systemd-cryptsetup@<mapper>
    # now (it also runs at boot); harmless, and keeps the unit inspectable after
    # a deploy.
    - name: Reload systemd so the crypttab generator materializes the unit
      ansible.builtin.systemd:
        daemon_reload: true
      when: not ansible_check_mode

    - name: Report encrypted-swap configuration state
      ansible.builtin.debug:
        msg: >-
          encrypted_swap: crypttab + fstab + boot finalize configured on
          {{ inventory_hostname }} — the encrypted mapper activates on the next
          reboot (swap is ephemeral; there is no live switchover). Any existing
          plaintext swap keeps running until then.
