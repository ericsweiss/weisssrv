---
# Scenario: assert the crypttab + fstab rendering (the live swapoff/cryptsetup
# switchover is molecule-notest — it needs real devices). Shared driver/
# provisioner config comes from ansible/molecule/base.yml via `-c`.
platforms:
  - name: encrypted-swap-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    capabilities:
      - SYS_ADMIN
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    prepare: prepare.yml
  inventory:
    group_vars:
      all:
        encrypted_swap_enabled: true
        encrypted_swap_source_device: /dev/pve/swap
