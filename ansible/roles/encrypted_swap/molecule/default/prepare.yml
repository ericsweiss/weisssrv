---
# Prepare: shared systemd/apt prep + seed a plaintext swap fstab line for the
# backing device so verify can confirm the role removes it.
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule/tasks/prepare-base.yml

    - name: Disable apt background services
      ansible.builtin.import_tasks: ../../../../molecule/tasks/prepare-apt-disable.yml

    - name: Seed a plaintext swap fstab line for the backing device
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/dev/pve/swap none swap sw 0 0"
        create: true
        owner: root
        group: root
        mode: "0644"
