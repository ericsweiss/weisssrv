---
# nic_tuning role defaults.
#
# Per-NIC feature overrides via ethtool drop-ins in /etc/network/interfaces.d/,
# plus an optional sysctl drop-in for ip_forward (needed for Tailscale subnet
# routing on Proxmox hosts).
#
# Set `nic_tuning_overrides` per-host/group to apply ethtool overrides:
#   nic_tuning_overrides:
#     - interface: nic1
#       options:
#         - feature: gro
#           value: "off"
#         - feature: tso
#           value: "on"
#
# Set `nic_tuning_ip_forward: true` on hosts that need ip_forward=1 at boot
# (pve_firewall on Proxmox can otherwise reset sysctl values; this drop-in
# lands in /etc/sysctl.d/ and is re-applied on each reboot).
nic_tuning_overrides: []
nic_tuning_ip_forward: false

# `ethtool -K` takes short feature names; `ethtool --show-features` reports the
# long ones. The role verifies each applied override by reading the state back,
# so every short name used in nic_tuning_overrides needs an entry here — a
# missing one fails that assert with exactly that message instead of silently
# passing. Names per ethtool(8) "feature names" / netdev_features.h.
# Read the applied overrides back out of the kernel and fail the play when they
# did not take. ONLY ever set false by the molecule scenario: a container's lo
# and veth expose no ethtool feature ioctls at all (`ethtool -K` itself returns
# "Inappropriate ioctl for device" there), so the apply the check verifies
# cannot run in the first place. Every real host leaves this true.
#
# The assert hard-fails base.yml (and therefore deploy-ansible-base), so it was
# validated read-only against the actual hardware before it shipped —
# `ethtool --show-features` on 2026-07-27 reported, on every interface this
# fleet overrides:
#   pve-opt-01/02/03 nic0 (e1000e): tcp-segmentation-offload: off
#                                   generic-segmentation-offload: off
#                                   generic-receive-offload: off
#   pve-nas-01       nic1 (atlantic): generic-receive-offload: off
# i.e. all four match the requested values verbatim, with no `[fixed]` suffix
# and no driver that refuses the feature. Adding an override for a NIC/driver
# not in that list means adding a case this gate has never seen: read the
# feature back by hand first (`ethtool --show-features <iface>`) and confirm the
# long name in nic_tuning_feature_names appears with the value you are asking
# for, rather than discovering it as a red fleet deploy.
nic_tuning_verify_offloads: true

nic_tuning_feature_names:
  gro: generic-receive-offload
  gso: generic-segmentation-offload
  lro: large-receive-offload
  ntuple: ntuple-filters
  rx: rx-checksumming
  rxhash: receive-hashing
  rxvlan: rx-vlan-offload
  sg: scatter-gather
  tso: tcp-segmentation-offload
  tx: tx-checksumming
  txvlan: tx-vlan-offload
  ufo: udp-fragmentation-offload

# Lower vm.swappiness on memory-committed Proxmox hosts. Set to an integer
# (0-100) per host/group to write a /etc/sysctl.d/ drop-in and apply it live;
# leave null (the default) to leave swappiness unmanaged (kernel default 60).
# pve-nas-01 runs the app VMs + ZFS ARC and thrashed swap at the default — it
# sets 1 (see host_vars/pve-nas-01.yml and the ballooning floors in hosts.yml),
# paired with the 4 GiB ARC cap + daily swap-reset to keep swap flat.
nic_tuning_vm_swappiness: null

# Guard against a MAC-flap black-hole on active-backup bonds whose two legs
# share an unmanaged (dumb) switch. With `all_slaves_active=1` the bonding
# driver DELIVERS frames received on the inactive backup leg; the switch floods
# each guest's own frames back onto that leg, so the host bridge learns the
# guest MAC on bond0 (not its veth) and misdirects the guest's unicast return
# traffic out to the switch — an intermittent, recurring outage. Forcing
# `all_slaves_active=0` drops those inactive-leg frames and stops the bridge-FDB
# poisoning. The guard sets the value in three places (see tasks/main.yml); the
# authoritative one is the /etc/modprobe.d/bonding.conf bonding module option,
# which the kernel applies at boot — the interfaces stanza alone does NOT survive
# a reboot (ifupdown2 ignores it). Set false only if a bond legitimately needs =1
# (e.g. multicast RX across multiple switches), which this fleet does not.
# See docs/34-bond-mac-flapping.md.
nic_tuning_bond_asa_guard: true
