---
# Read the live offload state for every overridden interface, then hand it to
# assert-offloads.yml. Split in two so the assert can be exercised against
# captured `ethtool --show-features` output (molecule/default/verify.yml) —
# containers have no ethtool feature ioctls, so that is the only place the
# comparison logic can be tested at all.
- name: Read back the effective NIC offload state
  ansible.builtin.command:
    cmd: "ethtool --show-features {{ item.interface }}"
  loop: "{{ nic_tuning_overrides }}"
  loop_control:
    label: "{{ item.interface }}"
  register: nic_tuning_offload_state
  changed_when: false
  check_mode: false
  # A missing interface fails the assert below (which reports the ethtool
  # error), not here — one task owns the diagnosis.
  failed_when: false

- name: Assert the offload overrides are live
  ansible.builtin.include_tasks: assert-offloads.yml
