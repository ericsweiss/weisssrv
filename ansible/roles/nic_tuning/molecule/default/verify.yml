---
# Verify the nic_tuning role's observable state:
#   1. ip_forward sysctl drop-in is written with the right content and perms
#   2. kernel's actual net.ipv4.ip_forward is 1
#   3. per-interface ethtool drop-in exists in /etc/network/interfaces.d/ and
#      contains the expected post-up line(s) + the `logger` failure guard
#   4. (idempotence is enforced by the test_sequence step in molecule.yml)
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Stat sysctl drop-in
      ansible.builtin.stat:
        path: /etc/sysctl.d/99-nic-tuning-ip-forward.conf
      register: sysctl_dropin

    - name: Assert sysctl drop-in exists with expected perms
      ansible.builtin.assert:
        that:
          - sysctl_dropin.stat.exists
          - sysctl_dropin.stat.pw_name == 'root'
          - sysctl_dropin.stat.gr_name == 'root'
          - sysctl_dropin.stat.mode == '0644'
        fail_msg: "99-nic-tuning-ip-forward.conf missing or has wrong owner/perms"

    - name: Read sysctl drop-in content
      ansible.builtin.slurp:
        src: /etc/sysctl.d/99-nic-tuning-ip-forward.conf
      register: sysctl_content

    - name: Assert sysctl drop-in sets ip_forward=1
      ansible.builtin.assert:
        that:
          - "'net.ipv4.ip_forward=1' in (sysctl_content.content | b64decode)"
        fail_msg: "sysctl drop-in missing ip_forward=1 directive"

    - name: Read current kernel ip_forward
      ansible.builtin.command: sysctl -n net.ipv4.ip_forward
      register: ip_forward_active
      changed_when: false

    - name: Assert kernel has ip_forward=1 active
      ansible.builtin.assert:
        that:
          - ip_forward_active.stdout == '1'
        fail_msg: "kernel net.ipv4.ip_forward is not 1 — handler didn't apply"

    - name: Stat ethtool drop-in for lo
      ansible.builtin.stat:
        path: /etc/network/interfaces.d/99-nic-lo-tuning.cfg
      register: ethtool_dropin

    - name: Assert ethtool drop-in exists
      ansible.builtin.assert:
        that:
          - ethtool_dropin.stat.exists
          - ethtool_dropin.stat.mode == '0644'
        fail_msg: "99-nic-lo-tuning.cfg missing or has wrong perms"

    - name: Read ethtool drop-in content
      ansible.builtin.slurp:
        src: /etc/network/interfaces.d/99-nic-lo-tuning.cfg
      register: ethtool_content

    - name: Assert ethtool drop-in includes the iface header and both features
      ansible.builtin.assert:
        that:
          - "'iface lo inet manual' in (ethtool_content.content | b64decode)"
          - "'post-up /sbin/ethtool -K lo rx on' in (ethtool_content.content | b64decode)"
          - "'post-up /sbin/ethtool -K lo tx on' in (ethtool_content.content | b64decode)"
        fail_msg: "ethtool drop-in missing iface stanza header or expected post-up lines"

    # Parse validity: ifupdown2 must associate the post-up lines with the
    # interface. A bare post-up line (no iface header) is rejected with
    # "error processing line" and would be silently inert at boot.
    - name: Query lo through ifupdown2
      ansible.builtin.command: ifquery lo
      register: ifquery_lo
      changed_when: false

    - name: Assert ifupdown2 parses the drop-in and attaches the post-up lines
      ansible.builtin.assert:
        that:
          - ifquery_lo.rc == 0
          - "'post-up /sbin/ethtool -K lo rx on' in ifquery_lo.stdout"
          - "'post-up /sbin/ethtool -K lo tx on' in ifquery_lo.stdout"
          - "'error' not in (ifquery_lo.stderr | lower)"
        fail_msg: >-
          ifupdown2 did not attach the drop-in's post-up lines to lo — the
          boot-time persistence would be inert

    - name: Assert ethtool drop-in pipes failures to logger
      ansible.builtin.assert:
        that:
          - "'|| logger -t nic-tuning-ifup' in (ethtool_content.content | b64decode)"
        fail_msg: >-
          ethtool post-up line lacks the `|| logger` failure guard — silent
          regressions on interface rename would go unlogged

    - name: Check stale NIC drop-in was removed
      ansible.builtin.stat:
        path: /etc/network/interfaces.d/99-nic-stale0-tuning.cfg
      register: stale_dropin

    - name: Assert stale NIC drop-in was cleaned up
      ansible.builtin.assert:
        that:
          - not stale_dropin.stat.exists
        fail_msg: "Stale NIC tuning drop-in was not removed by the role"
        success_msg: "Stale NIC tuning drop-in correctly removed"

    # active-backup bond MAC-flap guard: the seeded `bond-all_slaves_active 1`
    # must be rewritten in place to 0 (surgical replace, rest of the stanza
    # untouched). The runtime sysfs task is a no-op in the container (no bond).
    - name: Read /etc/network/interfaces after the bond guard
      ansible.builtin.slurp:
        src: /etc/network/interfaces
      register: etc_interfaces_content

    - name: Assert bond all_slaves_active was corrected to 0 (and 1 is gone)
      ansible.builtin.assert:
        that:
          - "'bond-all_slaves_active 0' in (etc_interfaces_content.content | b64decode)"
          - "'bond-all_slaves_active 1' not in (etc_interfaces_content.content | b64decode)"
          # surrounding stanza lines must survive the surgical replace
          - "'bond-mode active-backup' in (etc_interfaces_content.content | b64decode)"
          - "'bond-slaves nic0 nic1' in (etc_interfaces_content.content | b64decode)"
        fail_msg: >-
          bond-all_slaves_active was not rewritten to 0 (or the surgical replace
          damaged the surrounding bond0 stanza)
        success_msg: "bond-all_slaves_active correctly forced to 0 in place"
