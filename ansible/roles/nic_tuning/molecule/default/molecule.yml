---
# Molecule configuration for nic_tuning role testing.
#
# Tests the role's generated drop-ins and idempotence without requiring real
# NICs. We use a loopback interface (`lo`) for the ethtool overrides — the
# kernel accepts the commands (they no-op; lo doesn't have these features)
# and the generated /etc/network/interfaces.d/*.cfg file can be content-checked.
#
# The template + sysctl file verification is the hot path; ethtool itself
# no-ops on loopback but the generated drop-in content is fully verified.
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: docker
platforms:
  - name: nic-tuning-test
    image: ghcr.io/hifis-net/debian-systemd:trixie
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
    # Required for molecule_docker plugin (upstream broken conditional in destroy.yml)
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
  config_options:
    defaults:
      callbacks_enabled: profile_tasks, timer
      stdout_callback: ansible.builtin.default
      result_format: yaml
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        nic_tuning_ip_forward: true
        nic_tuning_overrides:
          - interface: lo
            options:
              - feature: rx
                value: "on"
              - feature: tx
                value: "on"
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
lint: |
  set -e
  yamllint .
  ansible-lint .
