---
# Scenario overrides; shared config in ansible/molecule/base.yml (ansible/TESTING.md).
platforms:
  - name: nic-tuning-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    prepare: prepare.yml
  inventory:
    group_vars:
      all:
        nic_tuning_ip_forward: true
        # The container's lo/eth0 have no ethtool feature ioctls (both
        # `ethtool -K` and `ethtool --show-features` return ENOTTY), so the
        # role's read-back verification has nothing real to assert against.
        # The drop-in rendering + cleanup paths below are what this scenario
        # covers; the verification logic is unit-tested against captured
        # `ethtool --show-features` output instead.
        nic_tuning_verify_offloads: false
        nic_tuning_vm_swappiness: 10
        nic_tuning_overrides:
          - interface: lo
            options:
              - feature: rx
                value: 'on'
              - feature: tx
                value: 'on'
