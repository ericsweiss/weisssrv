---
# Prepare: seed the directory structure the role writes into so the
# template-render path works without a live Docker/nginx install.
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule/tasks/prepare-base.yml

    - name: Disable apt background services
      ansible.builtin.import_tasks: ../../../../molecule/tasks/prepare-apt-disable.yml

    # nginx isn't installed in this scenario (skip_nextcloud_deploy), but the
    # role renders its site file + symlink; create the dirs nginx would own.
    - name: Create mock nginx sites directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/nginx/sites-available
        - /etc/nginx/sites-enabled

    # node_exporter_host isn't in this scenario; create the textfile dir the
    # backup wrapper writes into.
    - name: Ensure node_exporter textfile collector dir exists
      ansible.builtin.file:
        path: /var/lib/node_exporter
        state: directory
        mode: "0755"

    # Mock `docker` so the backup wrapper's pg_dump pipe can be exercised end to
    # end (success + failure metric paths), mirroring immich's mock backup.
    # /tmp/nextcloud-backup-fail arms the failure path.
    - name: Install mock docker for the backup-wrapper test
      ansible.builtin.copy:
        dest: /usr/local/bin/docker
        mode: "0755"
        content: |
          #!/bin/bash
          if [ "$1" = "compose" ]; then
            for a in "$@"; do
              if [ "$a" = "pg_dump" ]; then
                if [ -f /tmp/nextcloud-backup-fail ]; then
                  echo "mock pg_dump FAILED" >&2
                  exit 1
                fi
                # Emit incompressible data so the gzipped dump is non-empty and
                # passes the wrapper's `[ -s ]` guard (repetitive text gzips away).
                head -c 8192 /dev/urandom | base64
                exit 0
              fi
            done
            exit 0
          fi
          exit 0
