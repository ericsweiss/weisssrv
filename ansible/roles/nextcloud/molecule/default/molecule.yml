---
# Scenario overrides; shared config in ansible/molecule/base.yml (ansible/TESTING.md).
#
# skip_nextcloud_deploy: true — the CI container has no Docker daemon and no
# Nextcloud, so this scenario exercises the template-render + config contract
# (compose file, .env, systemd units, nginx site, backup wrapper), not the live
# stack. occ/SSO wiring is syntax/lint-validated, not run here.
platforms:
  - name: nextcloud-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    prepare: prepare.yml
  env:
    NEXTCLOUD_ADMIN_PASSWORD: testadminpassword123
    NEXTCLOUD_POSTGRES_PASSWORD: testpostgrespassword123
    NEXTCLOUD_SERVERINFO_TOKEN: testserverinfotoken123
    NEXTCLOUD_OIDC_CLIENT_ID: test-client-id
    NEXTCLOUD_OIDC_CLIENT_SECRET: test-client-secret
  inventory:
    group_vars:
      all:
        internal_domain: esweiss.test
        external_domain: ericsweiss.test
        # Version pins normally sourced from group_vars/all.yml.
        nextcloud_version: "34.0.1"
        nextcloud_postgres_version: "18.4-trixie"
        # Nextcloud's Redis reuses the shared redis_version pin (all.yml).
        redis_version: "8.8.0-alpine"
        nextcloud_exporter_version: "0.9.1"
        # Shared Docker engine pins (all.yml) — consumed by the docker_engine
        # role, which is skipped here (skip_nextcloud_deploy), so these are
        # representative only.
        docker_ce_version: "5:29.6.1-1~debian.13~trixie"
        containerd_version: "2.2.6-1~debian.13~trixie"
        docker_buildx_plugin_version: "0.35.0-1~debian.13~trixie"
        docker_compose_plugin_version: "5.3.1-1~debian.13~trixie"
        skip_nextcloud_deploy: true
