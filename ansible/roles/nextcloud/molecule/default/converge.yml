---
# Converge: exercise template rendering + directory/unit management. The live
# Docker stack + occ are skipped via skip_nextcloud_deploy (set in molecule.yml).
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Wait for apt locks to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
              fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
          sleep 1
        done
      args:
        executable: /bin/bash
      changed_when: false
      when: ansible_os_family == "Debian"

    - name: Install minimal prerequisites for testing
      ansible.builtin.apt:
        name:
          - ca-certificates
          - systemd
        state: present
      when: ansible_os_family == "Debian"

  roles:
    - role: nextcloud
