---
# Nextcloud (Docker Compose) role defaults
#
# IMPORTANT: This role requires environment variables for secrets.
# Always deploy using: task nextcloud:deploy
# Direct ansible-playbook usage will fail the secret-presence assertions.
# See docs/35-nextcloud.md for deployment instructions.
#
# Required environment variables (set by the Taskfile from 1Password):
#   - NEXTCLOUD_ADMIN_PASSWORD    : initial break-glass admin password
#   - NEXTCLOUD_POSTGRES_PASSWORD : PostgreSQL role password for the nextcloud DB
#   - NEXTCLOUD_SERVERINFO_TOKEN  : serverinfo app token consumed by the exporter
#   - NEXTCLOUD_OIDC_CLIENT_ID    : Authentik OIDC client id (user_oidc provider)
#   - NEXTCLOUD_OIDC_CLIENT_SECRET: Authentik OIDC client secret

# --- Image pins (resolved from group_vars/all.yml) --------------------------
# Container image tags are pinned centrally in all.yml so the maintenance
# version-check flow tracks them alongside every other component.
nextcloud_image: "nextcloud:{{ nextcloud_version }}-apache"
nextcloud_postgres_image: "postgres:{{ nextcloud_postgres_version }}"
nextcloud_redis_image: "redis:{{ redis_version }}"
nextcloud_exporter_image: "ghcr.io/xperimental/nextcloud-exporter:{{ nextcloud_exporter_version }}"

# The Docker engine + plugins are installed and version-pinned by the shared
# docker_engine role from the single group_vars/all.yml pins (docker_ce_version
# etc.) — this role no longer carries its own Docker apt-version aliases.

# --- Filesystem layout (zvol passthrough disks; NO NFS) ---------------------
# ssd/appdata/nextcloud/app  -> /mnt/nextcloud-app       (compose + html + config + backups)
# ssd/appdata/nextcloud/postgres -> /mnt/nextcloud-postgres (PGDATA)
# tank/nextcloud-data/disk  -> /mnt/nextcloud-data       (bulk user data)
nextcloud_app_dir: /mnt/nextcloud-app
nextcloud_postgres_dir: /mnt/nextcloud-postgres
nextcloud_data_mount: /mnt/nextcloud-data
nextcloud_compose_dir: "{{ nextcloud_app_dir }}/compose"
nextcloud_html_dir: "{{ nextcloud_app_dir }}/html"
nextcloud_data_dir: "{{ nextcloud_data_mount }}/data"
# The nightly pg_dump lands on the offsite NFS landing zone when
# nextcloud_backup_nfs_enabled is set (see --- Backup --- below), otherwise the
# app zvol. Resolving the path from the toggle means group_vars flips one var.
nextcloud_backup_dir: "{{ nextcloud_backup_mountpoint if nextcloud_backup_nfs_enabled else nextcloud_app_dir + '/backups' }}"

# Nextcloud container runs as www-data (uid/gid 33). The bind-mounted html +
# data directories must be owned by that uid so PHP can write.
nextcloud_uid: 33
nextcloud_gid: 33

# --- Database ---------------------------------------------------------------
nextcloud_db_name: nextcloud
nextcloud_db_user: nextcloud
nextcloud_db_password: "{{ lookup('ansible.builtin.env', 'NEXTCLOUD_POSTGRES_PASSWORD') }}"

# --- Admin (break-glass; SSO is the normal login path) ----------------------
nextcloud_admin_user: admin
nextcloud_admin_password: "{{ lookup('ansible.builtin.env', 'NEXTCLOUD_ADMIN_PASSWORD') }}"

# --- Reverse-proxy / trusted-proxy wiring -----------------------------------
# Nextcloud must accept BOTH hostnames (external + internal). overwritehost is
# deliberately NOT forced to a single host so the served host tracks the
# incoming Host header; only the protocol and CLI URL are overwritten.
nextcloud_external_host: "cloud.{{ external_domain }}"   # cloud.ericsweiss.com
nextcloud_internal_host: "cloud.{{ internal_domain }}"   # cloud.esweiss.com
# Trusted domains: the two user-facing hosts + the compose service name (the
# exporter reaches Nextcloud as http://nextcloud) + localhost (occ/CLI).
nextcloud_trusted_domains: >-
  {{ nextcloud_external_host }} {{ nextcloud_internal_host }} nextcloud localhost
nextcloud_overwrite_protocol: https
nextcloud_overwrite_cli_url: "https://{{ nextcloud_external_host }}"

# Outgoing mail via the SMTP relay (smtp-relay.esweiss.com / .151). The Nextcloud
# VM (.156) is in the relay's mynetworks (192.168.0.0/24), so it relays on port 25
# WITHOUT SASL (permit_mynetworks) — no credential to manage; the relay adds TLS on
# the Gmail hop. Applied via occ (the image's SMTP_* env only autoconfigures a
# FRESH install, not this already-provisioned instance).
nextcloud_smtp_host: smtp-relay.esweiss.com
nextcloud_smtp_port: "25"
nextcloud_smtp_secure: ""            # no encryption on port 25 (plaintext on the LAN)
nextcloud_mail_from_address: nextcloud
nextcloud_mail_domain: ericsweiss.com
# Docker bridge subnet for the compose project. The VM-local nginx publishes to
# 127.0.0.1:8080; docker-proxy rewrites the source to this network's gateway,
# so trusted_proxies must include the subnet (not just 127.0.0.1) for Nextcloud
# to read the X-Forwarded-* headers at all (the container's REMOTE_ADDR is this
# gateway).
nextcloud_docker_subnet: "172.28.0.0/16"
# Trust chain for resolving the real client IP:
#   client -> Traefik pod -> (k3s/flannel SNATs the pod source to the k3s NODE
#   IP, because .156 is a VM outside the pod network) -> VM nginx -> nextcloud
#   container.
# The VM nginx resolves the true client IP with its real_ip module — trusting
# ONLY the k3s node IPs below as proxy sources — and then REPLACES
# X-Forwarded-For with that single resolved value (see nginx-nextcloud.conf.j2).
# So Nextcloud only ever needs to trust its immediate hop: the compose bridge
# gateway (the container's REMOTE_ADDR) plus loopback for occ/CLI. It must NOT
# trust the LAN /24 — the firewall also permits direct :443 from admin/LAN for
# debugging, and trusting the /24 would let such a directly connected client
# forge X-Forwarded-For and have it walked back past nginx, spoofing the client
# IP used for audit logs, brute-force protection, and rate limiting.
nextcloud_trusted_proxies: "127.0.0.1 {{ nextcloud_docker_subnet }}"
# k3s node IPs (servers .222/.223/.227 + agents .202-.207): the ONLY legitimate
# source of Traefik-proxied traffic reaching this VM (pod traffic is SNAT'd to
# the node IP before it leaves the cluster). nginx trusts ONLY these as real_ip
# sources, so a directly connected LAN/admin client — which is NOT in this set —
# cannot forge X-Forwarded-For: its connection is not a trusted real_ip source,
# so nginx ignores its inbound XFF and $remote_addr stays its true address. Keep
# in sync with the k3s_servers/k3s_agents groups in hosts.yml.
nextcloud_nginx_real_ip_trusted_addresses:
  - 192.168.0.202
  - 192.168.0.203
  - 192.168.0.204
  - 192.168.0.205
  - 192.168.0.206
  - 192.168.0.207
  - 192.168.0.222
  - 192.168.0.223
  - 192.168.0.227

# --- PHP tuning -------------------------------------------------------------
nextcloud_php_memory_limit: "1024M"
# Large upload ceiling. External uploads chunk (Nextcloud clients default 10MiB)
# so the Cloudflare-proxied path's 100MB single-request cap is not hit; raw
# single-PUT WebDAV uploads over the external host are still capped by Cloudflare
# (docs/35 "Upload size").
nextcloud_php_upload_limit: "16G"

# --- Port bindings ----------------------------------------------------------
# Web: loopback-only; the VM-local nginx terminates TLS and proxies here.
nextcloud_http_bind_address: "127.0.0.1"
nextcloud_http_bind_port: 8080
# Exporter: bound on all interfaces so the in-cluster Prometheus scrapes
# 192.168.0.156:9205 (firewall sg-nextcloud opens it from k3s_nodes only).
nextcloud_exporter_port: 9205
nextcloud_serverinfo_token: "{{ lookup('ansible.builtin.env', 'NEXTCLOUD_SERVERINFO_TOKEN') }}"

# --- Host nginx TLS front end -----------------------------------------------
# acme_certs (running on dns-01) distributes fullchain.pem + privkey.pem here
# after each Let's Encrypt renewal (see host_vars/dns-01.yml cert_distribution_
# targets); nginx is reloaded with `systemctl reload nginx`. On a fresh VM the
# cert has not been pushed yet, so the role generates a self-signed placeholder
# so nginx can start; the real wildcard cert replaces it on the first
# `task dns:deploy`.
nextcloud_nginx_enabled: true
nextcloud_nginx_cert_dir: /etc/ssl/nextcloud
nextcloud_nginx_ssl_certificate: "{{ nextcloud_nginx_cert_dir }}/fullchain.pem"
nextcloud_nginx_ssl_certificate_key: "{{ nextcloud_nginx_cert_dir }}/privkey.pem"
nextcloud_nginx_server_names: "{{ nextcloud_external_host }} {{ nextcloud_internal_host }}"

# --- SSO (Authentik OIDC via the user_oidc app) -----------------------------
# SSO is the only interactive login path. The admin account above is break-glass
# only, reachable at https://cloud.ericsweiss.com/login?direct=1.
nextcloud_oidc_enabled: true
nextcloud_oidc_provider_id: authentik
nextcloud_oidc_discovery_uri: "https://auth.{{ external_domain }}/application/o/cloud/.well-known/openid-configuration"
nextcloud_oidc_client_id: "{{ lookup('ansible.builtin.env', 'NEXTCLOUD_OIDC_CLIENT_ID') }}"
nextcloud_oidc_client_secret: "{{ lookup('ansible.builtin.env', 'NEXTCLOUD_OIDC_CLIENT_SECRET') }}"
nextcloud_oidc_scope: "openid email profile groups"
# preferred_username -> Nextcloud user id; groups claim -> Nextcloud groups.
nextcloud_oidc_mapping_uid: preferred_username
nextcloud_oidc_mapping_display_name: name
nextcloud_oidc_mapping_email: email
nextcloud_oidc_mapping_groups: groups
nextcloud_oidc_group_provisioning: 1
# unique-uid=0: use the claim value verbatim as the Nextcloud uid (not a hash),
# so a user provisioned by Authentik has a readable, stable username.
nextcloud_oidc_unique_uid: 0
# allow_multiple_user_backends=0: make OIDC the default login and auto-redirect
# to Authentik (hides the local login form; ?direct=1 bypasses for break-glass).
nextcloud_oidc_sso_only: true

# --- Backup (nightly pg_dump -> offsite NFS landing zone -> archive + B2) ----
nextcloud_backup_enabled: true
# Local retention is deliberately minimal: long-term history now lives on the
# shared landing zone's archive replication (KEEP_RECENT 3 + KEEP_MONTHLY 6) and
# the B2 GFS retention, so only a few days are kept on the mount itself.
nextcloud_backup_keep_days: 3
nextcloud_backup_oncalendar: "*-*-* 02:30:00"
# Sourceable write_prom_metrics helper library (deployed by compose_app), sourced
# by nextcloud-backup-run.sh so the metric-writing logic is shared with immich.
nextcloud_backup_lib_path: /usr/local/lib/nextcloud-backup-lib.sh

# --- Offsite backup landing zone (NFS mount of tank/backups/apps/nextcloud) ---
# When enabled, the pg_dump lands on the shared, file-walkable tank/backups/apps
# zone (rides the archsync file walk into B2 — docs/42) instead of the app zvol.
# OFF by default (opt-in): flip nextcloud_backup_nfs_enabled in group_vars once
# the NAS-side export (/export/backups-apps/nextcloud, all_squash 1000:2000,
# 02775) exists — mirrors the gitlab role's NFS-backed backup landing. Mounted
# OVER TLS (xprtsec=tls, by hostname so the *.esweiss.com cert verifies): the
# per-app export REQUIRES TLS, and the VM runs tlshd via the nfs_tls role in
# nextcloud.yml (gated on this flag). The dump lands on the aes-256-gcm
# tank/backups dataset. nofail keeps a NAS-down boot from hanging;
# nextcloud-backup.service's RequiresMountsFor pulls it on demand.
nextcloud_backup_nfs_enabled: false
nextcloud_backup_nfs_server: "pve-nas-01.esweiss.com"
nextcloud_backup_nfs_export: /backups-apps/nextcloud
nextcloud_backup_mountpoint: /mnt/backups-offsite
nextcloud_backup_nfs_options: "vers=4.2,rw,hard,noatime,_netdev,nofail,xprtsec=tls"

# Readiness wait for the first-install completion before running occ.
nextcloud_install_wait_retries: 60
nextcloud_install_wait_delay: 10

# Escape hatch for molecule/CI: skip everything that needs a live Docker daemon
# and a running Nextcloud (apt install of docker, compose up, occ). The scenario
# still renders every template and assembles the occ command contract.
skip_nextcloud_deploy: false
