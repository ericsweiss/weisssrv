---
# Host-level nginx: terminates 443 with the distributed *.esweiss.com wildcard
# cert and reverse-proxies to the loopback-bound Nextcloud web container.

- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
  when: not (skip_nextcloud_deploy | default(false))

- name: Ensure the Nextcloud TLS cert directory exists
  ansible.builtin.file:
    path: "{{ nextcloud_nginx_cert_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# acme_certs (dns-01) distributes the real wildcard cert here after the VM is
# added to cert_distribution_targets and `task dns:deploy` runs. On a fresh VM
# that has not happened yet, so seed a self-signed placeholder ONLY when the
# cert is absent — it lets nginx start and is replaced on the first cert push.
- name: Check whether a TLS certificate is already present
  ansible.builtin.stat:
    path: "{{ nextcloud_nginx_ssl_certificate }}"
  register: nextcloud_cert_stat

- name: Generate a self-signed bootstrap certificate (only if none exists)
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -nodes -newkey rsa:2048
      -keyout {{ nextcloud_nginx_ssl_certificate_key }}
      -out {{ nextcloud_nginx_ssl_certificate }}
      -days 365 -subj "/CN={{ nextcloud_external_host }}"
    creates: "{{ nextcloud_nginx_ssl_certificate }}"
  when:
    - not (skip_nextcloud_deploy | default(false))
    - not nextcloud_cert_stat.stat.exists

- name: Secure the TLS private key
  ansible.builtin.file:
    path: "{{ nextcloud_nginx_ssl_certificate_key }}"
    owner: root
    group: root
    mode: "0600"
  when: not (skip_nextcloud_deploy | default(false))

- name: Deploy the Nextcloud nginx site
  ansible.builtin.template:
    src: nginx-nextcloud.conf.j2
    dest: /etc/nginx/sites-available/nextcloud.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable the Nextcloud nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/nextcloud.conf
    dest: /etc/nginx/sites-enabled/nextcloud.conf
    state: link
  notify: Reload nginx

- name: Disable the default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

# Validate the rendered config against the running nginx before the reload
# handler fires, so a broken template fails the play instead of the reload.
- name: Validate the nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
  when: not (skip_nextcloud_deploy | default(false))

- name: Ensure nginx is enabled + started
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
  when: not (skip_nextcloud_deploy | default(false))
