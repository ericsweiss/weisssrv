---
# Nextcloud on a NAS-pinned Debian VM via Docker Compose.
#
# Layout: three ZFS zvol passthrough disks (attached by proxmox_vm, mounted by
# zvol_mount) hold the app dir, the PostgreSQL data, and the bulk user data.
# The stack (nextcloud-apache + postgres + redis + cron + exporter) runs under a
# single systemd-managed compose project; a host-level nginx terminates TLS with
# the distributed *.esweiss.com wildcard cert and proxies to the loopback-bound
# web container. There is NO NFS anywhere — all state rides the zvols.

# =============================================================================
# Persistent disks (ZFS zvols attached as SCSI devices by proxmox_vm)
# =============================================================================
- name: Mount additional persistent disks
  ansible.builtin.include_role:
    name: zvol_mount
  vars:
    zvol_mount_disks: "{{ vm_additional_disks | default([]) }}"
  when: vm_additional_disks is defined and vm_additional_disks | length > 0

# =============================================================================
# Secret-presence assertions (fail fast with a clear pointer)
# =============================================================================
- name: Validate required Nextcloud secrets are present
  ansible.builtin.assert:
    that:
      - nextcloud_admin_password | default('') | length > 0
      - nextcloud_db_password | default('') | length > 0
      - nextcloud_serverinfo_token | default('') | length > 0
    fail_msg: >-
      Nextcloud secrets not set. NEXTCLOUD_ADMIN_PASSWORD,
      NEXTCLOUD_POSTGRES_PASSWORD, and NEXTCLOUD_SERVERINFO_TOKEN must be
      provided via 'op run'. Run: task nextcloud:deploy
    success_msg: "Nextcloud core secrets present"
  no_log: true
  when: not (skip_nextcloud_deploy | default(false))

- name: Validate required Nextcloud OIDC secrets are present
  ansible.builtin.assert:
    that:
      - nextcloud_oidc_client_id | default('') | length > 0
      - nextcloud_oidc_client_secret | default('') | length > 0
    fail_msg: >-
      Nextcloud OIDC secrets not set. NEXTCLOUD_OIDC_CLIENT_ID and
      NEXTCLOUD_OIDC_CLIENT_SECRET must be provided via 'op run' (1Password item
      "Nextcloud SSO"). Set nextcloud_oidc_enabled: false to skip SSO wiring.
      Run: task nextcloud:deploy
    success_msg: "Nextcloud OIDC secrets present"
  no_log: true
  when:
    - not (skip_nextcloud_deploy | default(false))
    - nextcloud_oidc_enabled | default(true)

# =============================================================================
# Docker Engine + Compose plugin (download.docker.com apt repo, via compose_app)
# =============================================================================
# Pinned-engine install + dpkg hold + journald daemon.json via the shared
# docker_engine role (also backs immich + immich_ml), included through the shared
# compose_app role. skip_nextcloud_deploy maps onto compose_app_skip_install.
- name: Install Docker Engine and the compose plugin
  ansible.builtin.include_role:
    name: compose_app
    tasks_from: docker.yml
  vars:
    compose_app_skip_install: "{{ skip_nextcloud_deploy | default(false) }}"

# =============================================================================
# Persistent directories on the zvols
# =============================================================================
- name: Create Nextcloud application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ nextcloud_app_dir }}"
    - "{{ nextcloud_compose_dir }}"

# html + data are bind-mounted into the container and written by www-data
# (uid/gid 33). Pre-create + chown so the container never has to chown a large
# populated data tree on start.
- name: Create Nextcloud html + data directories (owned by www-data uid/gid)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nextcloud_uid }}"
    group: "{{ nextcloud_gid }}"
    mode: "0750"
  loop:
    - "{{ nextcloud_html_dir }}"
    - "{{ nextcloud_data_dir }}"

# =============================================================================
# Host nginx TLS front end (shared compose_app task flow)
# =============================================================================
# Capture this role's nginx site template as an absolute path BEFORE the include
# (role_path inside an include_role resolves to the INCLUDED role, so it must be
# resolved eagerly here). compose_app/nginx.yml deploys it byte-unchanged.
- name: Resolve the Nextcloud nginx site template path
  ansible.builtin.set_fact:
    nextcloud_nginx_site_template: "{{ role_path }}/templates/nginx-nextcloud.conf.j2"
  when: nextcloud_nginx_enabled | default(true)

- name: Configure the host nginx reverse proxy
  ansible.builtin.include_role:
    name: compose_app
    tasks_from: nginx.yml
  vars:
    compose_app_skip_install: "{{ skip_nextcloud_deploy | default(false) }}"
    compose_app_nginx_cert_dir: "{{ nextcloud_nginx_cert_dir }}"
    compose_app_nginx_cert_dir_mode: "0755"
    compose_app_nginx_ssl_cert: "{{ nextcloud_nginx_ssl_certificate }}"
    compose_app_nginx_ssl_key: "{{ nextcloud_nginx_ssl_certificate_key }}"
    compose_app_nginx_site_name: nextcloud.conf
    compose_app_nginx_site_template: "{{ nextcloud_nginx_site_template }}"
    compose_app_nginx_self_signed_days: 365
    compose_app_nginx_self_signed_subj: "/CN={{ nextcloud_external_host }}"
    # Nextcloud's placeholder carries no SAN (single-host CN).
    compose_app_nginx_self_signed_san: ""
    # Only seed the placeholder on a real deploy (matches the former gated task).
    compose_app_nginx_bootstrap_cert: "{{ not (skip_nextcloud_deploy | default(false)) }}"
  when: nextcloud_nginx_enabled | default(true)

# =============================================================================
# Compose project (.env holds secrets; compose file is secret-free)
# =============================================================================
- name: Deploy the Nextcloud compose environment file
  ansible.builtin.template:
    src: nextcloud.env.j2
    dest: "{{ nextcloud_compose_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart compose stack

- name: Deploy the Nextcloud compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ nextcloud_compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart compose stack

# =============================================================================
# Systemd unit that owns the compose lifecycle (shared compose_app unit)
# =============================================================================
# compose_app main.yml deploys the shared unit, enables it, flushes handlers
# (bringing the stack up so the readiness wait + occ/SSO tasks below act on the
# freshly-applied containers), and starts it.
- name: Deploy + start the Nextcloud compose stack
  ansible.builtin.include_role:
    name: compose_app
  vars:
    compose_app_skip_install: "{{ skip_nextcloud_deploy | default(false) }}"
    compose_app_service_name: nextcloud-compose
    compose_app_description: "Nextcloud Docker Compose stack"
    compose_app_working_directory: "{{ nextcloud_compose_dir }}"
    compose_app_requires_mounts_for:
      - "{{ nextcloud_app_dir }}"
      - "{{ nextcloud_postgres_dir }}"
      - "{{ nextcloud_data_mount }}"
    compose_app_requires_mounts_comment:
      - "Path-based mount ordering (systemd escapes these to the right .mount units):"
      - "the zvol data disks must be mounted before the stack starts."
    compose_app_reconcile_comment:
      - "`up -d` reconciles the running stack to the rendered compose/.env, recreating"
      - "only the containers whose definition changed (ExecReload matches ExecStart so"
      - "`systemctl reload` re-applies without a full down/up)."

# =============================================================================
# Wait for first-install to complete, then configure SSO + serverinfo
# =============================================================================
- name: Wait for Nextcloud to finish installing
  ansible.builtin.command:
    cmd: docker compose exec -T -u www-data nextcloud php occ status --output=json
    chdir: "{{ nextcloud_compose_dir }}"
  register: nextcloud_status
  changed_when: false
  failed_when: false
  retries: "{{ nextcloud_install_wait_retries }}"
  delay: "{{ nextcloud_install_wait_delay }}"
  # Single short-circuiting expression: `and` skips the from_json parse while the
  # command is still failing during first-install init (stdout not yet valid JSON).
  until: >-
    nextcloud_status.rc == 0
    and (nextcloud_status.stdout | from_json).installed | default(false)
  when: not (skip_nextcloud_deploy | default(false))

- name: Configure Authentik OIDC SSO
  ansible.builtin.include_tasks: sso.yml
  when:
    - not (skip_nextcloud_deploy | default(false))
    - nextcloud_oidc_enabled | default(true)

# The serverinfo app ships enabled; the exporter authenticates to its API with
# this token (NEXTCLOUD_AUTH_TOKEN). Set it idempotently.
- name: Set the serverinfo token consumed by the exporter
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T -u www-data nextcloud
      php occ config:app:set serverinfo token --value={{ nextcloud_serverinfo_token | quote }}
    chdir: "{{ nextcloud_compose_dir }}"
  no_log: true
  # Idempotent occ upsert with no change signal; ok can hide a first-set/rotate.
  changed_when: false
  when: not (skip_nextcloud_deploy | default(false))

# Outgoing mail via the SMTP relay. Applied with occ because the image's SMTP_*
# env only autoconfigures a FRESH install, not this already-provisioned instance.
# mail_smtpauth is left at its default (off) — the VM is in the relay's mynetworks
# so it relays on port 25 without SASL (see defaults). Idempotent set.
- name: Configure Nextcloud outgoing SMTP (relay)
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T -u www-data nextcloud
      php occ config:system:set {{ item.key }} --value={{ item.value | quote }}
    chdir: "{{ nextcloud_compose_dir }}"
  loop:
    - { key: mail_smtpmode, value: "smtp" }
    - { key: mail_smtphost, value: "{{ nextcloud_smtp_host }}" }
    - { key: mail_smtpport, value: "{{ nextcloud_smtp_port }}" }
    - { key: mail_smtpsecure, value: "{{ nextcloud_smtp_secure }}" }
    - { key: mail_from_address, value: "{{ nextcloud_mail_from_address }}" }
    - { key: mail_domain, value: "{{ nextcloud_mail_domain }}" }
  loop_control:
    label: "{{ item.key }}"
  # Idempotent occ config:system:set upserts with no change signal; ok can hide
  # a real value change on first deploy or a settings edit.
  changed_when: false
  when: not (skip_nextcloud_deploy | default(false))

# =============================================================================
# Backup landing zone (offsite NFS when enabled) + nightly PostgreSQL backup
# =============================================================================
# nextcloud_backup_dir resolves to the NFS mountpoint when
# nextcloud_backup_nfs_enabled (tank/backups/apps/nextcloud -> archsync -> B2),
# otherwise the app zvol. This one task creates whichever; the mount below
# (gated) overlays it when NFS-backed.
- name: Create the backup landing directory
  ansible.builtin.file:
    path: "{{ nextcloud_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# Mounted over TLS (xprtsec=tls — the per-app export rejects plaintext); the VM
# runs tlshd via the nfs_tls role, wired in nextcloud.yml gated on this flag.
# nofail keeps a NAS-down boot from hanging; the backup service's
# RequiresMountsFor pulls it on demand. Opt-in via nextcloud_backup_nfs_enabled.
- name: Mount the offsite backup NFS export
  ansible.posix.mount:
    path: "{{ nextcloud_backup_mountpoint }}"
    src: "{{ nextcloud_backup_nfs_server }}:{{ nextcloud_backup_nfs_export }}"
    fstype: nfs4
    opts: "{{ nextcloud_backup_nfs_options }}"
    state: mounted
  when:
    - not (skip_nextcloud_deploy | default(false))
    - nextcloud_backup_nfs_enabled | default(false)
  tags:
    - molecule-notest

# The metric-writing logic is the shared write_prom_metrics helper (deployed by
# compose_app); nextcloud-backup-run.sh sources it.
- name: Deploy the shared backup-metrics helper library
  ansible.builtin.include_role:
    name: compose_app
    tasks_from: backup_lib.yml
  vars:
    compose_app_skip_install: "{{ skip_nextcloud_deploy | default(false) }}"
    compose_app_backup_lib_dest: "{{ nextcloud_backup_lib_path }}"
    compose_app_backup_size_help_object: "dump"

- name: Deploy the Nextcloud backup wrapper
  ansible.builtin.template:
    src: nextcloud-backup-run.sh.j2
    dest: /usr/local/sbin/nextcloud-backup-run.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy the Nextcloud backup service + timer
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: nextcloud-backup.service.j2, dest: nextcloud-backup.service }
    - { src: nextcloud-backup.timer.j2, dest: nextcloud-backup.timer }
  notify: Reload systemd

- name: Enable + start the Nextcloud backup timer
  ansible.builtin.systemd:
    name: nextcloud-backup.timer
    enabled: "{{ nextcloud_backup_enabled | default(true) }}"
    state: "{{ 'started' if (nextcloud_backup_enabled | default(true)) else 'stopped' }}"
    daemon_reload: true
  when: not (skip_nextcloud_deploy | default(false))
