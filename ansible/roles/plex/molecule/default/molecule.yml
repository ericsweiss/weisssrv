---
# Scenario overrides; shared config in ansible/molecule/base.yml (ansible/TESTING.md).
platforms:
  - name: plex-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  inventory:
    group_vars:
      all:
        plex_version: latest
        plex_user: plex
        media_group: media
        media_gid: 2000
        plex_claim: ''
        plex_config_dir: /tmp/plex-config
        plex_transcode_dir: /tmp/plex-transcode
        plex_media_dir: /tmp/plex-media
        plex_service_after:
          - network-online.target
        skip_gpu_drivers: true
        plex_pfx_passphrase: molecule-mock-pfx-passphrase
        skip_plex_service: true
        skip_ssh_config: true
        skip_dns_config: true
