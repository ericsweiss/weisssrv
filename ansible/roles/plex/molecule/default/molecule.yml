---
# Molecule configuration for plex role testing
# Tests: apt repo setup, package installation, systemd service
# Skips: GPU drivers (not available in containers), actual Plex startup (requires config)
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: docker
platforms:
  - name: plex-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
    # Required for molecule_docker plugin (upstream broken conditional in destroy.yml)
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
  config_options:
    defaults:
      callbacks_enabled: profile_tasks, timer
      stdout_callback: ansible.builtin.default
      result_format: yaml
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        # Plex configuration
        plex_version: "latest"
        plex_user: plex
        media_group: media
        media_gid: 2000
        plex_claim: ""
        # Directories (created for testing)
        plex_config_dir: /tmp/plex-config
        plex_transcode_dir: /tmp/plex-transcode
        plex_media_dir: /tmp/plex-media
        plex_service_after:
          - network-online.target
        # Skip GPU driver installation in containers
        skip_gpu_drivers: true
        # PFX passphrase mock — `task plex:deploy` injects this from 1Password
        # via `op run`; molecule doesn't run under op, so the role's
        # "validate the PFX passphrase env var was injected" assert would
        # otherwise fire and fail the test before any meaningful task runs.
        # The value is fake; the role only feeds it to openssl pkcs12 inside
        # the cert-reload flow, which the molecule scenario doesn't exercise.
        plex_pfx_passphrase: "molecule-mock-pfx-passphrase"
        # Skip Plex service startup (no valid config)
        skip_plex_service: true
        skip_ssh_config: true
        skip_dns_config: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
