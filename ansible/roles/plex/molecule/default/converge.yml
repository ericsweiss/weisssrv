---
# Converge playbook for plex role testing
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Wait for apt locks to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
              fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
          sleep 1
        done
      args:
        executable: /bin/bash
      changed_when: false
      when: ansible_os_family == "Debian"

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - systemd
          - ca-certificates
          - sudo
          - gnupg
        state: present
      when: ansible_os_family == "Debian"

    # Create test directories for bind mount simulation
    - name: Create plex config directory
      ansible.builtin.file:
        path: /tmp/plex-config
        state: directory
        mode: "0755"

    - name: Create plex transcode directory
      ansible.builtin.file:
        path: /tmp/plex-transcode
        state: directory
        mode: "0755"

    - name: Create plex media directory
      ansible.builtin.file:
        path: /tmp/plex-media
        state: directory
        mode: "0755"

    - name: Create media group
      ansible.builtin.group:
        name: media
        gid: 2000
        state: present

  roles:
    - role: plex
