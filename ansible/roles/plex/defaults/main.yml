---
# Plex Media Server defaults

# Plex user (created by the plexmediaserver apt package; the package also
# creates a matching `plex` group, which configure.yml references via plex_user).
plex_user: plex

# Media group (matches NAS storage configuration)
media_group: media
media_gid: 2000

# Plex version (latest from official repo)
plex_version: latest

# Plex claim token (optional - for linking to account during initial setup)
# Set via environment variable: PLEX_CLAIM. Once the server is claimed,
# re-run the role WITHOUT the env var so the token is removed from the
# systemd override (the Environment= line is only rendered when non-empty).
plex_claim: "{{ lookup('ansible.builtin.env', 'PLEX_CLAIM', default='') }}"

# Plex Custom Certificate PFX passphrase. Read from env var injected by
# `task plex:deploy` via `op run --`. Used by /usr/local/sbin/plex-cert-reload.sh
# (deployed by this role) when converting the renewed PEM cert into the
# PKCS#12 form Plex requires. The matching value MUST be configured in
# Plex Settings -> Network -> "Custom certificate encryption key" by the
# operator on first deploy. 1Password item: "Plex Custom Certificate".
plex_pfx_passphrase: "{{ lookup('ansible.builtin.env', 'PLEX_PFX_PASSPHRASE', default='') }}"

# Plex directories (inside container)
plex_config_dir: /config
plex_transcode_dir: /transcode
plex_media_dir: /media

# FALLBACK only for the cert-reload probe's SNI. Plex serves the custom
# certificate exclusively to handshakes whose SNI matches its
# customCertificateDomain preference — everything else gets the *.plex.direct
# fallback — so plex-cert-reload.sh must send that name when it verifies the
# swap took effect. The script reads the live value out of Preferences.xml and
# only falls back to this if Plex has not written the key yet, so changing the
# domain in Plex's UI cannot silently break the probe. Keep it in step with
# Settings -> Network -> "Custom certificate domain" anyway.
plex_cert_domain: vm.esweiss.com

# Systemd service dependencies
# Plex starts after the network is online
plex_service_after:
  - network-online.target
