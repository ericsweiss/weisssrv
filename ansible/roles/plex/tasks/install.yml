---
# Plex Media Server installation

- name: Install required packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - curl
      - gnupg
    state: present
    update_cache: true

# Intel Arc GPU hardware transcoding support
# Skip in container testing where GPU drivers aren't available
- name: Enable non-free and non-free-firmware repositories
  ansible.builtin.apt_repository:
    repo: "{{ item }}"
    state: present
    update_cache: false
  loop:
    - "deb https://deb.debian.org/debian {{ ansible_distribution_release }} non-free non-free-firmware"
    - "deb https://deb.debian.org/debian {{ ansible_distribution_release }}-updates non-free non-free-firmware"
  when: not (skip_gpu_drivers | default(false))

# Drop the superseded plaintext http:// entries left on hosts provisioned
# before the https switch, so apt no longer fetches non-free over http.
- name: Remove legacy plaintext non-free repositories
  ansible.builtin.apt_repository:
    repo: "{{ item }}"
    state: absent
    update_cache: false
  loop:
    - "deb http://deb.debian.org/debian {{ ansible_distribution_release }} non-free non-free-firmware"
    - "deb http://deb.debian.org/debian {{ ansible_distribution_release }}-updates non-free non-free-firmware"

- name: Update apt cache after adding non-free repos
  ansible.builtin.apt:
    update_cache: true
  when: not (skip_gpu_drivers | default(false))

- name: Install Intel GPU drivers for hardware transcoding
  ansible.builtin.apt:
    name:
      - intel-media-va-driver-non-free  # Intel media driver for VA-API (Arc support)
      - vainfo                          # Tool to verify VA-API
      - intel-gpu-tools                 # Intel GPU monitoring tools
    state: present
  when: not (skip_gpu_drivers | default(false))

# Plex repository v2 (as of Plex v1.43.0)
# https://support.plex.tv/articles/235974187-enable-repository-updating-for-supported-linux-server-distributions/

- name: Remove legacy Plex repository configuration
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/plexmediaserver.list
    - /etc/apt/sources.list.d/plexmediaserver.sources
    - /etc/apt/apt.conf.d/99allow-plex-sha1
    - /usr/share/keyrings/plex-archive-keyring.gpg
    - /usr/share/keyrings/plexmediaserver.gpg

# Shared stat -> download -> verify-fingerprint -> dearmor -> add-repo pipeline.
# gnupg is already installed by the "Install required packages" task above.
- name: Add Plex v2 signed APT repository
  ansible.builtin.include_role:
    name: apt_signed_repo
  vars:
    apt_signed_repo_key_url: https://downloads.plex.tv/plex-keys/PlexSign.v2.key
    apt_signed_repo_fingerprint: 6EFFEB478A6559D75C7C4FE706C521790B9CFFDE
    apt_signed_repo_keyring_path: /etc/apt/keyrings/plexmediaserver.v2.gpg
    apt_signed_repo_repo_line: "deb [signed-by=/etc/apt/keyrings/plexmediaserver.v2.gpg] https://repo.plex.tv/deb/ public main"
    apt_signed_repo_filename: plex

- name: Install Plex Media Server (pinned version)
  ansible.builtin.apt:
    name: "plexmediaserver={{ plex_version }}"
    state: present
    allow_downgrade: true
    allow_change_held_packages: true
  when: plex_version != 'latest'
  notify: Restart plex

- name: Install Plex Media Server (latest)  # noqa package-latest
  ansible.builtin.apt:
    name: plexmediaserver
    state: latest
    allow_change_held_packages: true
  when: plex_version == 'latest'
  notify: Restart plex

# Hold the package at the pinned version so a manual `apt upgrade` on the LXC
# can't move Plex past it (the Plex repo continuously serves newer builds).
# Mirrors the gitlab role. Not a handler: the install task is a no-op when the
# pinned version is already present, so a handler would never fire on a re-run.
- name: Hold Plex package to prevent unintended upgrades
  ansible.builtin.dpkg_selections:
    name: plexmediaserver
    selection: hold
  when: plex_version != 'latest'

# In auto-update mode, ensure the package is not held (undo a prior pin) so
# state: latest / apt upgrade can move it forward.
- name: Unhold Plex package (auto-update mode)
  ansible.builtin.dpkg_selections:
    name: plexmediaserver
    selection: install
  when: plex_version == 'latest'

- name: Verify Plex package version
  ansible.builtin.command: dpkg-query -W -f='${Version}' plexmediaserver
  register: plex_installed_version
  changed_when: false

- name: Display installed Plex version
  ansible.builtin.debug:
    msg: "Plex Media Server version: {{ plex_installed_version.stdout }}"
