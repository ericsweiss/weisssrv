---
# Plex Media Server installation

- name: Install required packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - curl
      - gnupg
    state: present
    update_cache: true

# Intel Arc GPU hardware transcoding support
# Skip in container testing where GPU drivers aren't available
- name: Enable non-free and non-free-firmware repositories
  ansible.builtin.apt_repository:
    repo: "{{ item }}"
    state: present
    update_cache: false
  loop:
    - "deb http://deb.debian.org/debian {{ ansible_distribution_release }} non-free non-free-firmware"
    - "deb http://deb.debian.org/debian {{ ansible_distribution_release }}-updates non-free non-free-firmware"
  when: not (skip_gpu_drivers | default(false))

- name: Update apt cache after adding non-free repos
  ansible.builtin.apt:
    update_cache: true
  when: not (skip_gpu_drivers | default(false))

- name: Install Intel GPU drivers for hardware transcoding
  ansible.builtin.apt:
    name:
      - intel-media-va-driver-non-free  # Intel media driver for VA-API (Arc support)
      - vainfo                          # Tool to verify VA-API
      - intel-gpu-tools                 # Intel GPU monitoring tools
    state: present
  when: not (skip_gpu_drivers | default(false))

# Plex repository v2 (as of Plex v1.43.0)
# https://support.plex.tv/articles/235974187-enable-repository-updating-for-supported-linux-server-distributions/

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Remove legacy Plex repository configuration
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/plexmediaserver.list
    - /usr/share/keyrings/plex-archive-keyring.gpg
    - /usr/share/keyrings/plexmediaserver.gpg

- name: Download Plex v2 GPG key
  ansible.builtin.get_url:
    url: https://downloads.plex.tv/plex-keys/PlexSign.v2.key
    dest: /tmp/PlexSign.v2.key
    mode: "0644"

- name: Verify Plex v2 GPG key fingerprint (primary key must match exactly)
  ansible.builtin.shell: |
    set -o pipefail
    # Extract the primary key fingerprint (first fpr record after first pub)
    # and verify it matches the expected value exactly (full-line match).
    primary_fpr=$(gpg --show-keys --with-colons /tmp/PlexSign.v2.key 2>/dev/null \
        | awk -F: '/^pub/{p=1; next} p && /^fpr/{print $10; exit}')
    [ "$primary_fpr" = "6EFFEB478A6559D75C7C4FE706C521790B9CFFDE" ]
  args:
    executable: /bin/bash
  changed_when: false

- name: Add Plex v2 GPG key to keyring
  ansible.builtin.shell: |
    gpg --yes --dearmor -o /etc/apt/keyrings/plexmediaserver.v2.gpg < /tmp/PlexSign.v2.key
  args:
    creates: /etc/apt/keyrings/plexmediaserver.v2.gpg

- name: Add Plex v2 repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/plexmediaserver.v2.gpg] https://repo.plex.tv/deb/ public main"
    filename: plex
    state: present
    update_cache: true

- name: Install Plex Media Server (pinned version)
  ansible.builtin.apt:
    name: "plexmediaserver={{ plex_version }}"
    state: present
    allow_downgrade: true
  when: plex_version != 'latest'
  notify: Restart plex

- name: Install Plex Media Server (latest)  # noqa package-latest
  ansible.builtin.apt:
    name: plexmediaserver
    state: latest
  when: plex_version == 'latest'
  notify: Restart plex

- name: Verify Plex package version
  ansible.builtin.command: dpkg-query -W -f='${Version}' plexmediaserver
  register: plex_installed_version
  changed_when: false

- name: Display installed Plex version
  ansible.builtin.debug:
    msg: "Plex Media Server version: {{ plex_installed_version.stdout }}"
