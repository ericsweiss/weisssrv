---
# Plex Media Server service management

# Version bumps (install.yml) and override/group changes (configure.yml)
# notify "Restart plex"; flush them here so the health check below
# validates the restarted daemon, not the still-running old one.
- name: Apply pending restarts before health check
  # Also flushes the notified "Reload systemd" handler (daemon-reload on an
  # override change), so no separate daemon-reload task is needed here.
  ansible.builtin.meta: flush_handlers

- name: Enable Plex service
  ansible.builtin.systemd:
    name: plexmediaserver
    enabled: true
  when:
    - not ansible_check_mode
    - not (skip_plex_service | default(false))

- name: Start Plex service
  ansible.builtin.systemd:
    name: plexmediaserver
    state: started
  when:
    - not ansible_check_mode
    - not (skip_plex_service | default(false))

- name: Wait for Plex to start
  ansible.builtin.uri:
    url: "http://127.0.0.1:32400/identity"
    status_code: 200
    timeout: 5
  register: plex_health
  retries: 12
  delay: 5
  until: plex_health.status == 200
  when:
    - not ansible_check_mode
    - not (skip_plex_service | default(false))

- name: Display Plex server info
  ansible.builtin.debug:
    msg: "Plex server started successfully: {{ plex_health.json.MediaContainer.machineIdentifier | default('unknown') }}"
  when:
    - not ansible_check_mode
    - not (skip_plex_service | default(false))
    - plex_health is defined
    - plex_health.json is defined
