---
# Plex Media Server service management

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  when: not ansible_check_mode

- name: Enable Plex service
  ansible.builtin.systemd:
    name: plexmediaserver
    enabled: true
  when: not ansible_check_mode

- name: Start Plex service
  ansible.builtin.systemd:
    name: plexmediaserver
    state: started
  when: not ansible_check_mode

- name: Wait for Plex to start
  ansible.builtin.uri:
    url: "http://127.0.0.1:32400/identity"
    status_code: 200
    timeout: 5
  register: plex_health
  retries: 12
  delay: 5
  until: plex_health.status == 200
  when: not ansible_check_mode

- name: Display Plex server info
  ansible.builtin.debug:
    msg: "Plex server started successfully: {{ plex_health.json.MediaContainer.machineIdentifier | default('unknown') }}"
  when:
    - not ansible_check_mode
    - plex_health is defined
    - plex_health.json is defined
