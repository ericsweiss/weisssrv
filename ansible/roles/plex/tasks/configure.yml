---
# Plex Media Server configuration

- name: Ensure media group exists
  ansible.builtin.group:
    name: "{{ media_group }}"
    gid: "{{ media_gid }}"
    state: present

- name: Add plex user to media group
  ansible.builtin.user:
    name: "{{ plex_user }}"
    groups: "{{ media_group }}"
    append: true
  notify: Restart plex

# Hardware transcoding support for Intel Arc GPU
- name: Add plex user to video group (for GPU access)
  ansible.builtin.user:
    name: "{{ plex_user }}"
    groups: video
    append: true
  notify: Restart plex

- name: Add plex user to render group (for GPU access)
  ansible.builtin.user:
    name: "{{ plex_user }}"
    groups: render
    append: true
  notify: Restart plex
  # render group may not exist on all systems
  failed_when: false

# NOTE: We do NOT chown bind-mounted directories (/config, /transcode, /media)
# These are bind mounts from the host with UID/GID passthrough configured.
# Host directories are owned by eric:media (1000:2000) and the plex user
# is added to the media group, allowing access via group permissions.
# Changing ownership from inside the container would rewrite host ownership
# to high-mapped UIDs (e.g., 100997), breaking access for other processes.
#

# =============================================================================
# Plex custom-certificate hook
# =============================================================================
# acme_certs distributes the wildcard cert to /etc/ssl/plex (cert_dir
# in host_vars/dns-01.yml's cert_distribution_targets entry for
# host=plex). plex-cert-reload.sh converts the PEM pair into a PKCS#12
# bundle (Plex's "Custom certificate location" requires .pfx) and
# restarts the daemon so Plex re-reads it. The PFX passphrase comes
# from a 1Password item; operator configures the matching value once
# under Plex Settings -> Network -> Custom certificate encryption key.

# root-owned, plex group-readable: a compromised plex account must not be
# able to swap files that root's cert-reload script later consumes.
- name: Ensure /etc/ssl/plex directory exists
  ansible.builtin.file:
    path: /etc/ssl/plex
    state: directory
    owner: root
    group: "{{ plex_user }}"
    mode: "0750"

# Fail loudly if the env var wasn't injected. The reload script (next
# task) refuses to run without /etc/ssl/plex/pfx-passphrase, so a missing
# passphrase silently breaks every subsequent cert renewal.
- name: Validate that the PFX passphrase env var was injected
  ansible.builtin.assert:
    that: plex_pfx_passphrase | length > 0
    fail_msg: >-
      plex_pfx_passphrase is empty. Run `task plex:deploy` (which injects
      PLEX_PFX_PASSPHRASE from 1Password). 1P item: "Plex Custom Certificate".

- name: Deploy PFX passphrase from 1Password
  ansible.builtin.copy:
    dest: /etc/ssl/plex/pfx-passphrase
    content: "{{ plex_pfx_passphrase }}\n"
    owner: root
    group: "{{ plex_user }}"
    mode: "0640"
  no_log: true

- name: Deploy plex-cert-reload.sh
  ansible.builtin.template:
    src: plex-cert-reload.sh.j2
    dest: /usr/local/sbin/plex-cert-reload.sh
    owner: root
    group: root
    mode: "0750"
# The host directories should be pre-created with:
#   sudo chown -R 1000:2000 /mnt/ssd/appdata/plex /mnt/nvme/fast/plex-transcode
#   sudo chmod 2775 /mnt/ssd/appdata/plex /mnt/nvme/fast/plex-transcode

- name: Verify Plex config directory exists (bind mount)
  ansible.builtin.stat:
    path: "{{ plex_config_dir }}"
  register: plex_config_stat
  when: plex_config_dir is defined

- name: Fail if Plex config directory is not mounted
  ansible.builtin.fail:
    msg: |
      Plex config directory {{ plex_config_dir }} does not exist.
      Ensure the bind mount is configured and the host directory exists:
        sudo mkdir -p /mnt/ssd/appdata/plex
        sudo chown -R 1000:2000 /mnt/ssd/appdata/plex
        sudo chmod 2775 /mnt/ssd/appdata/plex
  when:
    - plex_config_dir is defined
    - not plex_config_stat.stat.exists | default(false)

- name: Verify Plex transcode directory exists (bind mount)
  ansible.builtin.stat:
    path: "{{ plex_transcode_dir }}"
  register: plex_transcode_stat
  when: plex_transcode_dir is defined

- name: Fail if Plex transcode directory is not mounted
  ansible.builtin.fail:
    msg: |
      Plex transcode directory {{ plex_transcode_dir }} does not exist.
      Ensure the bind mount is configured and the host directory exists:
        sudo mkdir -p /mnt/nvme/fast/plex-transcode
        sudo chown -R 1000:2000 /mnt/nvme/fast/plex-transcode
        sudo chmod 2775 /mnt/nvme/fast/plex-transcode
  when:
    - plex_transcode_dir is defined
    - not plex_transcode_stat.stat.exists | default(false)

- name: Check if Plex preferences exist
  ansible.builtin.stat:
    path: "{{ plex_config_dir }}/Library/Application Support/Plex Media Server/Preferences.xml"
  register: plex_preferences

- name: Display Plex preferences status
  ansible.builtin.debug:
    msg: "Plex preferences {{ 'exist' if plex_preferences.stat.exists else 'do not exist (fresh install)' }}"

# Deploy systemd override for Plex service
- name: Create Plex systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/plexmediaserver.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# 0640: the override embeds the PLEX_CLAIM token when set; it is
# short-lived (~4 min) but shouldn't sit world-readable.
- name: Deploy Plex systemd override
  ansible.builtin.template:
    src: plex-override.conf.j2
    dest: /etc/systemd/system/plexmediaserver.service.d/override.conf
    owner: root
    group: root
    mode: "0640"
  # The rendered override can embed Environment="PLEX_CLAIM=..." (a credential),
  # so keep the content out of --diff/-v output.
  no_log: true
  notify:
    - Reload systemd
    - Restart plex
