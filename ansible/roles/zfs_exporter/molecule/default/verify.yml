---
# Verify playbook for zfs_exporter role testing
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    # Verify binary is installed
    - name: Check if zfs_exporter binary exists
      ansible.builtin.stat:
        path: /usr/local/bin/zfs_exporter
      register: zfs_exporter_binary
      failed_when: not zfs_exporter_binary.stat.exists

    - name: Verify binary is executable
      ansible.builtin.assert:
        that:
          - zfs_exporter_binary.stat.executable
        fail_msg: "zfs_exporter binary is not executable"
        success_msg: "zfs_exporter binary is executable"

    # Verify systemd service file exists and has expected content
    - name: Check if systemd service file exists
      ansible.builtin.stat:
        path: /etc/systemd/system/zfs-exporter.service
      register: service_file
      failed_when: not service_file.stat.exists

    - name: Read service file content
      ansible.builtin.slurp:
        src: /etc/systemd/system/zfs-exporter.service
      register: service_content

    - name: Verify service file content
      ansible.builtin.assert:
        that:
          - "'ZFS Exporter for Prometheus' in (service_content.content | b64decode)"
          - "'/usr/local/bin/zfs_exporter' in (service_content.content | b64decode)"
          - "'9134' in (service_content.content | b64decode)"
        fail_msg: "Service file missing expected configuration"
        success_msg: "Service file has correct configuration"

    # Verify service is enabled (may not be actively running with mock binary)
    - name: Check service status
      ansible.builtin.systemd:
        name: zfs-exporter
      register: service_status

    - name: Verify service is enabled
      ansible.builtin.assert:
        that:
          - service_status.status.UnitFileState == 'enabled'
        fail_msg: "zfs-exporter service is not enabled"
        success_msg: "zfs-exporter service is enabled"

    - name: Display test results
      ansible.builtin.debug:
        msg:
          - "zfs_exporter installed and configured:"
          - "  - Binary: /usr/local/bin/zfs_exporter (executable)"
          - "  - Service: zfs-exporter.service (enabled)"
          - "  - Port: 9134"
          - "(Real ZFS metrics require ZFS kernel modules)"
