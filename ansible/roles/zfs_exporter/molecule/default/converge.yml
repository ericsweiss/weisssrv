---
# Converge playbook for zfs_exporter role testing
# Mocks the zfs_exporter binary since there is no real ZFS in Docker.
# The role's download/extract tasks are skipped via the `creates:` idempotency guard.
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Wait for apt locks to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
              fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
          sleep 1
        done
      args:
        executable: /bin/bash
      changed_when: false
      when: ansible_os_family == "Debian"

    # Mock the zfs_exporter binary — real binary needs ZFS kernel modules
    - name: Create mock zfs_exporter binary
      ansible.builtin.copy:
        dest: /usr/local/bin/zfs_exporter
        mode: "0755"
        content: |
          #!/bin/bash
          case "$1" in
            --version) echo "zfs_exporter, version {{ zfs_exporter_version }}"; exit 0 ;;
          esac
          while true; do sleep 3600; done
      when: ansible_os_family == "Debian"

  roles:
    - role: zfs_exporter
