---
# ZFS Exporter — Prometheus metrics for ZFS pools and datasets
# Downloads binary from GitHub releases and runs as a systemd service

- name: Check installed zfs_exporter version
  # zfs_exporter --version writes to stderr (kingpin behavior), and the
  # output line is `zfs_exporter, version X.Y.Z (branch: ..., revision: ...)`.
  # Extract just the version token with awk so the equality check below
  # is exact-equal — substring matching against the whole output would
  # be fooled by unrelated text containing the desired version (e.g. a
  # build timestamp or revision hash that happens to contain it).
  ansible.builtin.shell: |
    set -o pipefail
    /usr/local/bin/zfs_exporter --version 2>&1 | awk '/^zfs_exporter, version/ { print $3; exit }'
  args:
    executable: /bin/bash
  register: zfs_exporter_current
  changed_when: false
  failed_when: false
  # Read-only probe; must run under --check or the rc/stdout comparisons
  # below explode on a skipped-task result.
  check_mode: false

- name: Download zfs_exporter tarball
  ansible.builtin.get_url:
    url: "https://github.com/pdf/zfs_exporter/releases/download/v{{ zfs_exporter_version }}/zfs_exporter-{{ zfs_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/zfs_exporter-{{ zfs_exporter_version }}.linux-amd64.tar.gz"
    mode: "0644"
  when: zfs_exporter_current.rc != 0 or zfs_exporter_current.stdout != zfs_exporter_version

- name: Extract zfs_exporter tarball
  ansible.builtin.unarchive:
    src: "/tmp/zfs_exporter-{{ zfs_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
  when: zfs_exporter_current.rc != 0 or zfs_exporter_current.stdout != zfs_exporter_version

- name: Install zfs_exporter binary
  ansible.builtin.copy:
    src: "/tmp/zfs_exporter-{{ zfs_exporter_version }}.linux-amd64/zfs_exporter"
    dest: /usr/local/bin/zfs_exporter
    mode: "0755"
    remote_src: true
  when: zfs_exporter_current.rc != 0 or zfs_exporter_current.stdout != zfs_exporter_version
  notify: Restart zfs_exporter

- name: Clean up downloaded files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/zfs_exporter-{{ zfs_exporter_version }}.linux-amd64.tar.gz"
    - "/tmp/zfs_exporter-{{ zfs_exporter_version }}.linux-amd64"
  when: zfs_exporter_current.rc != 0 or zfs_exporter_current.stdout != zfs_exporter_version

- name: Deploy zfs-exporter systemd service
  ansible.builtin.template:
    src: zfs-exporter.service.j2
    dest: /etc/systemd/system/zfs-exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart zfs_exporter

- name: Enable and start zfs-exporter service
  ansible.builtin.systemd:
    name: zfs-exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Verify zfs_exporter is listening
  ansible.builtin.uri:
    url: "http://localhost:{{ zfs_exporter_port }}/metrics"
    return_content: false
    status_code: 200
  register: zfs_exporter_health
  retries: 5
  delay: 3
  until: zfs_exporter_health.status == 200
  when: not ansible_check_mode
  tags:
    - molecule-notest
