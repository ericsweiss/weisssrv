---
# Download + install half of the shared exporter pipeline. The caller's
# version-check command decides whether anything happens; when the pinned
# version is already installed every task below is skipped (idempotent).

- name: Check installed version of {{ prometheus_exporter_name }}
  # The caller supplies the probe (zfs_exporter reads --version off stderr;
  # unbound_exporter queries dpkg). Read-only, so it must run under --check
  # or the rc/stdout comparison below explodes on a skipped-task result.
  ansible.builtin.shell: "{{ prometheus_exporter_version_check_cmd }}"
  args:
    executable: /bin/bash
  register: prometheus_exporter_current
  changed_when: false
  failed_when: false
  check_mode: false

- name: Determine install need for {{ prometheus_exporter_name }}
  ansible.builtin.set_fact:
    # trim guards against probes that emit a trailing newline (dpkg-query).
    prometheus_exporter_needs_install: >-
      {{ prometheus_exporter_current.rc != 0
         or (prometheus_exporter_current.stdout | trim) != prometheus_exporter_version }}

- name: Download artifact for {{ prometheus_exporter_name }}
  ansible.builtin.get_url:
    url: "{{ prometheus_exporter_download_url }}"
    dest: "{{ prometheus_exporter_tmp_dir }}/{{ prometheus_exporter_download_url | basename }}"
    mode: "0644"
    # Empty checksum omits the param entirely (preserves unbound's
    # no-checksum behavior; zfs pins a sha256 in all.yml).
    checksum: "{{ prometheus_exporter_checksum | default(omit, true) }}"
  when: prometheus_exporter_needs_install

- name: Extract tarball for {{ prometheus_exporter_name }}
  ansible.builtin.unarchive:
    src: "{{ prometheus_exporter_tmp_dir }}/{{ prometheus_exporter_download_url | basename }}"
    dest: "{{ prometheus_exporter_tmp_dir }}"
    remote_src: true
  when:
    - prometheus_exporter_needs_install
    - prometheus_exporter_artifact_type == 'tarball'

- name: Install binary for {{ prometheus_exporter_name }}
  ansible.builtin.copy:
    src: "{{ prometheus_exporter_tmp_dir }}/{{ prometheus_exporter_archive_member }}"
    dest: "{{ prometheus_exporter_binary_path }}"
    mode: "0755"
    remote_src: true
  when:
    - prometheus_exporter_needs_install
    - prometheus_exporter_artifact_type == 'tarball'
  notify: Restart prometheus exporter

- name: Install deb package for {{ prometheus_exporter_name }}
  ansible.builtin.apt:
    deb: "{{ prometheus_exporter_tmp_dir }}/{{ prometheus_exporter_download_url | basename }}"
    state: present
  when:
    - prometheus_exporter_needs_install
    - prometheus_exporter_artifact_type == 'deb'
  notify: Restart prometheus exporter

- name: Clean up downloaded files for {{ prometheus_exporter_name }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ _prometheus_exporter_cleanup_paths }}"
  vars:
    _prometheus_exporter_archive: "{{ prometheus_exporter_tmp_dir }}/{{ prometheus_exporter_download_url | basename }}"
    # The download is always removed. Tarballs additionally extract a
    # directory (the binary's parent inside the archive) that must go too.
    _prometheus_exporter_cleanup_paths: >-
      {{ [_prometheus_exporter_archive]
         + ([(prometheus_exporter_tmp_dir ~ '/' ~ (prometheus_exporter_archive_member | dirname))]
            if prometheus_exporter_artifact_type == 'tarball'
            and (prometheus_exporter_archive_member | dirname) not in ['', '.']
            else []) }}
  when: prometheus_exporter_needs_install
