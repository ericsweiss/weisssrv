---
# Default LXC container configuration

# When true, skip two specific real-Proxmox-only tasks: the `pveam download`
# template fetch, and the final `wait_for` SSH connectivity probe. Lets the
# role drive its storage-selection and pool-validation logic against stub
# `pct`/`pvesh` shims under molecule without trying to pull a template image
# or block on TCP/22 against a container that was never started.
#
# NOTE: this flag does NOT bypass the `pct create` / `pct exec` bootstrap,
# idmap edits, or /etc/pve/lxc/<id>.conf writes — those tasks already gate
# themselves on `container_exists.rc != 0`, so stubbing `pvesh` to report
# the container already exists is the supported way to keep them no-ops in
# a test rig.
proxmox_lxc_skip_create: false

# IP address handed to the role's pct-create + SSH-wait logic. Defaults to
# ansible_host because production inventory routes traffic to each container
# via that field. Molecule scenarios override this so they can keep
# ansible_host pointing at the docker container (= connection target) while
# still feeding a realistic per-container IP into the pct create --net0 line.
proxmox_lxc_target_ip: "{{ ansible_host }}"

# Container resource defaults
lxc_cores: 2
lxc_memory: 2048
lxc_swap: 512
lxc_disk_size: 8G
# NOTE: lxc_storage is intentionally NOT defined here.
# The role auto-selects storage based on proxmox_host role (nas -> ssd, compute -> local-ssd).
# Override per-container by setting lxc_storage in host_vars.
lxc_bridge: vmbr0
lxc_unprivileged: true

# Template settings
lxc_template: "debian-13-standard_13.1-2_amd64.tar.zst"
lxc_template_storage: local

# Network configuration
lxc_nameserver: "192.168.0.150 192.168.0.160"
lxc_searchdomain: "{{ internal_domain }}"
lxc_gateway: 192.168.0.1

# User configuration for Ansible access
# This user will be created with sudo privileges and SSH key access
lxc_admin_user: "{{ admin_user | default('eric') }}"

# SSH configuration
lxc_ssh_public_keys: "{{ lookup('ansible.builtin.env', 'SSH_PUBLIC_KEY', default='') }}"

# Startup configuration
lxc_onboot: true
lxc_startup_order: 100
lxc_startup_delay: 0

# Features
lxc_nesting: false
lxc_keyctl: false
