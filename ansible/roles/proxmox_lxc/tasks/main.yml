---
# Proxmox LXC container provisioning

- name: Set container ID from IP last octet
  ansible.builtin.set_fact:
    container_id: "{{ ansible_host.split('.')[-1] }}"

# Storage selection logic: auto-select based on Proxmox host role if not specified
- name: Determine Proxmox host role
  ansible.builtin.set_fact:
    _proxmox_host_role: "{{ hostvars[proxmox_host]['proxmox_role'] | default('compute') }}"
  when: proxmox_host is defined

- name: Auto-select storage based on Proxmox host role
  ansible.builtin.set_fact:
    _effective_lxc_storage: >-
      {{
        lxc_storage |
        default(proxmox_storage_defaults[_proxmox_host_role] | default('local-ssd'))
      }}
  when: proxmox_host is defined

- name: Use explicitly defined storage when proxmox_host not set
  ansible.builtin.set_fact:
    _effective_lxc_storage: "{{ lxc_storage | default('local-lvm') }}"
  when: proxmox_host is not defined

- name: Display storage selection
  vars:
    _host_info: "{% if proxmox_host is defined %} (host: {{ proxmox_host }}, role: {{ _proxmox_host_role }}){% endif %}"
  ansible.builtin.debug:
    msg: "Container {{ inventory_hostname }} will use storage: {{ _effective_lxc_storage }}{{ _host_info }}"

- name: Check if container already exists
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    set -o errexit -o nounset -o pipefail
    # Check cluster-wide — containers may be HA-migrated to a different node.
    resources_json="$(pvesh get /cluster/resources --type vm --output-format json)"
    python3 -c "import sys,json; vmids=[r['vmid'] for r in json.loads(sys.argv[1])]; sys.exit(0 if {{ container_id | int }} in vmids else 1)" "$resources_json"
  args:
    executable: /bin/bash
  register: container_exists
  changed_when: false
  failed_when: container_exists.rc not in [0, 1]
  check_mode: false

# Verify storage pool exists on target host before proceeding
# Only check when creating a new container - existing containers may be on different storage during migrations
- name: Get available storage pools on target host
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.command: pvesm status
  register: storage_list
  changed_when: false
  check_mode: false
  when:
    - proxmox_host is defined
    - container_exists.rc != 0

- name: Check if required storage pool exists
  ansible.builtin.set_fact:
    _storage_exists: "{{ storage_list.stdout_lines | select('match', '^' + _effective_lxc_storage + '\\s') | list | length > 0 }}"
  when:
    - proxmox_host is defined
    - container_exists.rc != 0

- name: Fail if required storage pool does not exist
  ansible.builtin.fail:
    msg: |
      Storage pool '{{ _effective_lxc_storage }}' not found on {{ proxmox_host }}.

      For compute nodes, you must create the local-ssd ZFS pool first.
      See docs/06-zfs.md for pool creation commands.

      Available storage pools on {{ proxmox_host }}:
      {{ storage_list.stdout | default('(unable to retrieve)') }}
  when:
    - proxmox_host is defined
    - container_exists.rc != 0
    - not _storage_exists | default(true)
    - not ansible_check_mode

# Ensure all standard resource pools exist on the Proxmox host
# With loops + register, changed_when is evaluated per-iteration using the current result
# We use 'item' in the shell command and check stdout for "created" to track changes
- name: Ensure standard resource pools exist
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell:
    cmd: |
      if ! pvesh get /pools/{{ item }} --output-format json 2>/dev/null; then
        pvesh create /pools --poolid {{ item }}
        echo "created"
      else
        echo "exists"
      fi
    executable: /bin/bash
  loop: "{{ proxmox_resource_pools | default([]) }}"
  register: pool_creation_result
  changed_when: "'created' in pool_creation_result.stdout"
  loop_control:
    label: "{{ item }}"
  when:
    - not ansible_check_mode
    - container_exists.rc != 0
    - proxmox_resource_pools is defined

# Validate that the requested pool is in the allowed list
- name: Validate resource pool is in standard list
  ansible.builtin.fail:
    msg: |
      Resource pool '{{ proxmox_resource_pool }}' is not in the standard pools list.

      Standard pools: {{ proxmox_resource_pools | default([]) | join(', ') }}

      Either use one of the standard pools or add '{{ proxmox_resource_pool }}'
      to proxmox_resource_pools in group_vars/all.yml.
  when:
    - container_exists.rc != 0
    - proxmox_resource_pool is defined
    - proxmox_resource_pools is defined
    - proxmox_resource_pool not in proxmox_resource_pools

- name: Download LXC template if not present
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    pveam update
    pveam download {{ lxc_template_storage }} {{ lxc_template }}
  when:
    - not ansible_check_mode
    - container_exists.rc != 0
  failed_when: false
  changed_when: false

# Detect host video and render group GIDs for GPU passthrough
- name: Get host video group GID
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    set -o pipefail
    getent group video | cut -d: -f3
  args:
    executable: /bin/bash
  register: host_video_gid_result
  changed_when: false
  check_mode: false
  when:
    - lxc_gpu_passthrough | default(false)

- name: Get host render group GID
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    set -o pipefail
    getent group render | cut -d: -f3
  args:
    executable: /bin/bash
  register: host_render_gid_result
  changed_when: false
  check_mode: false
  when:
    - lxc_gpu_passthrough | default(false)

- name: Set GPU group GID facts
  ansible.builtin.set_fact:
    host_video_gid: "{{ host_video_gid_result.stdout | int }}"
    host_render_gid: "{{ host_render_gid_result.stdout | int }}"
  when:
    - lxc_gpu_passthrough | default(false)
    - host_video_gid_result.stdout is defined
    - host_render_gid_result.stdout is defined

# Configure host UID/GID passthrough for unprivileged containers
# Runs on every deployment to reconcile drift
- name: Configure subuid/subgid for container UID/GID passthrough
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    CHANGED=false

    # Add eric user (UID 1000) passthrough if not present
    if ! grep -q "^root:1000:1" /etc/subuid; then
      echo "root:1000:1" >> /etc/subuid
      CHANGED=true
    fi

    # Add media group (GID 2000) passthrough if not present
    if ! grep -q "^root:2000:1" /etc/subgid; then
      echo "root:2000:1" >> /etc/subgid
      CHANGED=true
    fi

    {% if lxc_gpu_passthrough | default(false) %}
    # GPU passthrough requires video and render groups (dynamically detected)
    VIDEO_GID="{{ host_video_gid }}"
    RENDER_GID="{{ host_render_gid }}"

    if ! grep -q "^root:${VIDEO_GID}:1" /etc/subgid; then
      echo "root:${VIDEO_GID}:1" >> /etc/subgid
      CHANGED=true
    fi
    if ! grep -q "^root:${RENDER_GID}:1" /etc/subgid; then
      echo "root:${RENDER_GID}:1" >> /etc/subgid
      CHANGED=true
    fi
    {% endif %}

    if [ "$CHANGED" = "true" ]; then echo "CHANGED"; fi
  when:
    - not ansible_check_mode
    - lxc_unprivileged | default(true)
  register: subuid_result
  changed_when: "'CHANGED' in (subuid_result.stdout | default(''))"

- name: Set resource pool argument
  ansible.builtin.set_fact:
    pool_arg: "{{ ' --pool ' + proxmox_resource_pool if proxmox_resource_pool is defined else '' }}"
  when: container_exists.rc != 0

- name: Create LXC container
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    pct create {{ container_id }} \
      {{ lxc_template_storage }}:vztmpl/{{ lxc_template }} \
      --hostname {{ inventory_hostname }} \
      --cores {{ lxc_cores }} \
      --memory {{ lxc_memory }} \
      --swap {{ lxc_swap }} \
      --rootfs {{ _effective_lxc_storage }}:{{ lxc_disk_size | regex_replace('G$', '') }} \
      --net0 name=eth0,bridge={{ lxc_bridge }},ip={{ ansible_host }}/24,gw={{ lxc_gateway }} \
      --nameserver "{{ lxc_nameserver }}" \
      --searchdomain "{{ lxc_searchdomain }}" \
      --unprivileged {{ lxc_unprivileged | ternary(1, 0) }} \
      --features nesting={{ lxc_nesting | ternary(1, 0) }},keyctl={{ lxc_keyctl | ternary(1, 0) }} \
      --onboot {{ proxmox_autostart_enabled | default(lxc_onboot) | ternary(1, 0) }} \
      --startup order={{ proxmox_startup_order | default(lxc_startup_order) }},up={{ proxmox_startup_delay | default(lxc_startup_delay) }}{{ pool_arg }}
  when:
    - not ansible_check_mode
    - container_exists.rc != 0
  changed_when: true
  register: container_create

# Configure bind mounts for containers that need host storage access
# This must be done before starting the container
- name: Configure bind mounts
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    pct set {{ container_id }} --mp{{ idx }} {{ item.host_path }},{{ item.options }}
  loop: "{{ lxc_bind_mounts | default([]) }}"
  loop_control:
    index_var: idx
    label: "{{ item.container_path }}"
  when:
    - not ansible_check_mode
    - container_exists.rc != 0
    - lxc_bind_mounts is defined
    - lxc_bind_mounts | length > 0
  changed_when: true

# For unprivileged containers with bind mounts, we need UID/GID mapping
# This allows the container to access host files owned by specific UIDs
# The mapping format: container-uid:host-uid:count
- name: Configure UID/GID mapping (standard)
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    CONF_FILE="/etc/pve/lxc/{{ container_id }}.conf"

    # Remove default lxc.idmap entries created by Proxmox
    grep -v "^lxc.idmap" "$CONF_FILE" > "${CONF_FILE}.tmp" || true
    mv "${CONF_FILE}.tmp" "$CONF_FILE"

    # UID mapping - passthrough for eric (1000)
    echo "lxc.idmap: u 0 100000 1000" >> "$CONF_FILE"
    echo "lxc.idmap: u 1000 1000 1" >> "$CONF_FILE"
    echo "lxc.idmap: u 1001 101001 64535" >> "$CONF_FILE"

    # GID mapping - passthrough for media (2000)
    echo "lxc.idmap: g 0 100000 2000" >> "$CONF_FILE"
    echo "lxc.idmap: g 2000 2000 1" >> "$CONF_FILE"
    echo "lxc.idmap: g 2001 102001 63535" >> "$CONF_FILE"
  when:
    - not ansible_check_mode
    - container_exists.rc != 0
    - lxc_bind_mounts is defined
    - lxc_bind_mounts | length > 0
    - lxc_unprivileged | default(true)
    - not (lxc_gpu_passthrough | default(false))
  changed_when: true

- name: Configure UID/GID mapping (with GPU)
  delegate_to: "{{ proxmox_host }}"
  vars:
    video_gid: "{{ host_video_gid }}"
    render_gid: "{{ host_render_gid }}"
  ansible.builtin.shell:
    cmd: |
      CONF_FILE="/etc/pve/lxc/{{ container_id }}.conf"

      # Remove default lxc.idmap entries created by Proxmox
      grep -v "^lxc.idmap" "$CONF_FILE" > "${CONF_FILE}.tmp" || true
      mv "${CONF_FILE}.tmp" "$CONF_FILE"

      # UID mapping - passthrough for eric (1000)
      echo "lxc.idmap: u 0 100000 1000" >> "$CONF_FILE"
      echo "lxc.idmap: u 1000 1000 1" >> "$CONF_FILE"
      echo "lxc.idmap: u 1001 101001 64535" >> "$CONF_FILE"

      # GID mapping with GPU group passthrough
      VIDEO_GID={{ video_gid }}
      RENDER_GID={{ render_gid }}

      if [ "$VIDEO_GID" -lt "$RENDER_GID" ]; then
        FIRST_GPU_GID="$VIDEO_GID"
        SECOND_GPU_GID="$RENDER_GID"
      else
        FIRST_GPU_GID="$RENDER_GID"
        SECOND_GPU_GID="$VIDEO_GID"
      fi

      echo "lxc.idmap: g 0 100000 ${FIRST_GPU_GID}" >> "$CONF_FILE"
      echo "lxc.idmap: g ${FIRST_GPU_GID} ${FIRST_GPU_GID} 1" >> "$CONF_FILE"

      NEXT_GID=$((FIRST_GPU_GID + 1))
      GAP=$((SECOND_GPU_GID - NEXT_GID))
      if [ "$GAP" -gt 0 ]; then
        MAPPED_START=$((100000 + NEXT_GID))
        echo "lxc.idmap: g ${NEXT_GID} ${MAPPED_START} ${GAP}" >> "$CONF_FILE"
      fi

      echo "lxc.idmap: g ${SECOND_GPU_GID} ${SECOND_GPU_GID} 1" >> "$CONF_FILE"

      NEXT_GID=$((SECOND_GPU_GID + 1))
      if [ "$NEXT_GID" -lt 2000 ]; then
        GAP=$((2000 - NEXT_GID))
        MAPPED_START=$((100000 + NEXT_GID))
        echo "lxc.idmap: g ${NEXT_GID} ${MAPPED_START} ${GAP}" >> "$CONF_FILE"
      fi

      echo "lxc.idmap: g 2000 2000 1" >> "$CONF_FILE"
      echo "lxc.idmap: g 2001 102001 63535" >> "$CONF_FILE"
  when:
    - not ansible_check_mode
    - container_exists.rc != 0
    - lxc_bind_mounts is defined
    - lxc_bind_mounts | length > 0
    - lxc_unprivileged | default(true)
    - lxc_gpu_passthrough | default(false)
  changed_when: true

# Configure GPU passthrough for hardware transcoding
# Pass through /dev/dri devices for Intel/AMD GPU access
- name: Configure GPU passthrough
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    CONF_FILE="/etc/pve/lxc/{{ container_id }}.conf"

    # Check if GPU passthrough is already configured
    if ! grep -q "lxc.cgroup2.devices.allow" "$CONF_FILE"; then
      # Allow access to DRI devices (GPU)
      echo "lxc.cgroup2.devices.allow: c 226:* rwm" >> "$CONF_FILE"
      # Mount /dev/dri into container
      echo "lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir" >> "$CONF_FILE"
    fi
  when:
    - not ansible_check_mode
    - container_exists.rc != 0
    - lxc_gpu_passthrough | default(false)
  changed_when: true

- name: Start LXC container
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    pct start {{ container_id }}
  when:
    - not ansible_check_mode
    - container_exists.rc != 0
  changed_when: true
  register: container_start

- name: Wait for container to initialize
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.pause:
    seconds: 5
  when:
    - not ansible_check_mode
    - container_exists.rc != 0

# Bootstrap eric user for Ansible access
# This replicates the manual bootstrap process from docs/18-bootstrap-new-systems.md

- name: Wait for container network connectivity
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    set -o pipefail
    # Use bash /dev/tcp to test connectivity (works without iputils-ping on minimal Debian)
    for i in $(seq 1 30); do
      # Test TCP connection to gateway on common ports (SSH or HTTP) or use /proc/net/route
      # First check if we have an IP assigned and a default route
      route_check='ip route show default 2>/dev/null | grep -q "via {{ lxc_gateway }}"'
      if pct exec {{ container_id }} -- bash -c "$route_check"; then
        # Gateway is in routing table, verify we can reach it via TCP on port 22 (SSH is common)
        # Fall back to checking if the interface is up with an IP
        tcp_check='timeout 2 bash -c "</dev/tcp/{{ lxc_gateway }}/22" 2>/dev/null'
        ip_check='ip addr show eth0 2>/dev/null | grep -q "inet "'
        if pct exec {{ container_id }} -- bash -c "$tcp_check || $ip_check"; then
          echo "Gateway reachable"
          exit 0
        fi
      fi
      sleep 2
    done
    echo "Gateway unreachable after 60 seconds"
    exit 1
  when:
    - not ansible_check_mode
    - container_exists.rc != 0
  changed_when: false

- name: Verify DNS resolution in container
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    # First check what nameservers are configured
    echo "Current resolv.conf:"
    pct exec {{ container_id }} -- cat /etc/resolv.conf
    # Try apt-get update to test DNS (most reliable test)
    echo "Testing DNS with apt-get update..."
    if pct exec {{ container_id }} -- apt-get update >/dev/null 2>&1; then
      echo "DNS working"
      exit 0
    fi
    # If DNS fails, fall back to public DNS
    echo "DNS not working with internal servers, using public DNS fallback..."
    pct exec {{ container_id }} -- bash -c 'echo "nameserver 1.1.1.1" > /etc/resolv.conf'
    if pct exec {{ container_id }} -- apt-get update >/dev/null 2>&1; then
      echo "DNS working with public fallback"
      exit 0
    fi
    echo "DNS resolution failed even with public DNS"
    exit 1
  when:
    - not ansible_check_mode
    - container_exists.rc != 0
  changed_when: false

- name: Install required packages in container
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    pct exec {{ container_id }} -- bash -c 'apt-get update && apt-get install -y openssh-server sudo'
  when:
    - not ansible_check_mode
    - container_exists.rc != 0
  changed_when: true

- name: Create eric user with sudo group
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    pct exec {{ container_id }} -- bash -c 'id {{ lxc_admin_user }} &>/dev/null || useradd -m -s /bin/bash -G sudo {{ lxc_admin_user }}'
  when:
    - not ansible_check_mode
    - container_exists.rc != 0
  changed_when: true

- name: Create SSH directory for eric user
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    pct exec {{ container_id }} -- bash -c 'mkdir -p /home/{{ lxc_admin_user }}/.ssh && chmod 700 /home/{{ lxc_admin_user }}/.ssh'
  when:
    - not ansible_check_mode
    - container_exists.rc != 0
  changed_when: true

- name: Deploy SSH authorized keys for eric user
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    pct exec {{ container_id }} -- bash -c 'echo "{{ lxc_ssh_public_keys }}" > /home/{{ lxc_admin_user }}/.ssh/authorized_keys'
  when:
    - not ansible_check_mode
    - container_exists.rc != 0
    - lxc_ssh_public_keys | length > 0
  changed_when: true

- name: Set permissions on authorized_keys and home directory
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    pct exec {{ container_id }} -- bash -c '
      chmod 600 /home/{{ lxc_admin_user }}/.ssh/authorized_keys &&
      chown -R {{ lxc_admin_user }}:{{ lxc_admin_user }} /home/{{ lxc_admin_user }}
    '
  when:
    - not ansible_check_mode
    - container_exists.rc != 0
    - lxc_ssh_public_keys | length > 0
  changed_when: true

- name: Configure passwordless sudo for eric user
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    pct exec {{ container_id }} -- bash -c '
      echo "{{ lxc_admin_user }} ALL=(ALL) NOPASSWD: ALL" \
        > /etc/sudoers.d/{{ lxc_admin_user }} &&
      chmod 440 /etc/sudoers.d/{{ lxc_admin_user }}
    '
  when:
    - not ansible_check_mode
    - container_exists.rc != 0
  changed_when: true

- name: Enable and start SSH service
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    pct exec {{ container_id }} -- bash -c 'systemctl enable ssh && systemctl start ssh'
  when:
    - not ansible_check_mode
    - container_exists.rc != 0
  changed_when: true

- name: Wait for container to be reachable via SSH
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 22
    delay: 5
    timeout: 120
  when:
    - not ansible_check_mode
    - container_exists.rc != 0

- name: Display container creation status
  vars:
    status_msg: >-
      Container {{ inventory_hostname }} (ID {{ container_id }})
      {% if ansible_check_mode and container_exists.rc != 0 %}
      would be created (check mode - no changes made)
      {% elif container_exists.rc != 0 %}
      created and started with user {{ lxc_admin_user }}
      {% else %}
      already exists
      {% endif %}
  ansible.builtin.debug:
    msg: "{{ status_msg }}"
