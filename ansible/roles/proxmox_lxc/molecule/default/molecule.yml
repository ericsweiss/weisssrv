---
# Molecule scenario for proxmox_lxc.
# Same shape as proxmox_vm: storage selection + pool validation + existence
# guard, with `pct`/`pvesh`/`pvesm`/`pveam` stubbed in /usr/local/bin and the
# in-container bootstrap (pct exec, /etc/pve/lxc/<id>.conf writes, SSH wait)
# bypassed via proxmox_lxc_skip_create=true.
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: docker
platforms:
  - name: proxmox-lxc-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    # /tmp NOT tmpfs — see proxmox_vm/molecule/default/molecule.yml.
    tmpfs:
      - /run
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
    SSH_PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAITESTKEYDONOTUSE molecule@test"
  config_options:
    defaults:
      callbacks_enabled: profile_tasks, timer
      stdout_callback: ansible.builtin.default
      result_format: yaml
      # Anchor remote_tmp under /tmp; see proxmox_vm/molecule/default/
      # molecule.yml for the full rationale. Literal path because the
      # scenario's `env:` block drops USER from the molecule-to-Ansible
      # env, leaving `${USER}` expanding to empty.
      remote_tmp: /tmp/ansible-tmp
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        internal_domain: esweiss.com
        proxmox_lxc_skip_create: true
        proxmox_storage_defaults:
          nas: ssd
          compute: local-ssd
          general: local-ssd
        proxmox_resource_pools:
          - infra-core
          - apps-public
          - platform
          - apps-private
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
