---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  vars:
    # Golden GPU idmap render for video=44 / render=104 (docs/20-plex.md):
    # ordered GID passthrough with gap mappings, media (2000) preserved, and
    # the /dev/dri passthrough appended. Must be identical for BOTH GID
    # orderings (the role sorts FIRST/SECOND_GPU_GID).
    expected_conf_gpu: |
      arch: amd64
      lxc.idmap: u 0 100000 1000
      lxc.idmap: u 1000 1000 1
      lxc.idmap: u 1001 101001 64535
      lxc.idmap: g 0 100000 44
      lxc.idmap: g 44 44 1
      lxc.idmap: g 45 100045 59
      lxc.idmap: g 104 104 1
      lxc.idmap: g 105 100105 1895
      lxc.idmap: g 2000 2000 1
      lxc.idmap: g 2001 102001 63535
      lxc.cgroup2.devices.allow: c 226:* rwm
      lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir
    expected_conf_standard: |
      arch: amd64
      lxc.idmap: u 0 100000 1000
      lxc.idmap: u 1000 1000 1
      lxc.idmap: u 1001 101001 64535
      lxc.idmap: g 0 100000 2000
      lxc.idmap: g 2000 2000 1
      lxc.idmap: g 2001 102001 63535
  tasks:
    - name: Load converge artifacts
      ansible.builtin.slurp:
        src: "/tmp/molecule-results/{{ item }}"
      loop:
        - 01-compute-default.json
        - 02-override.json
        - 03-pool-validation.json
        - 04-pool-list.json
        - 05-existence-guard.json
        - 06-idmap-gpu.json
        - 07-idmap-gpu-inverted.json
        - 08-idmap-standard.json
        - 09-firewall-reconcile.json
        - 10-meta-drift.json
      register: artifacts

    - name: Decode artifacts
      ansible.builtin.set_fact:
        compute_default: "{{ artifacts.results[0].content | b64decode | from_json }}"
        override: "{{ artifacts.results[1].content | b64decode | from_json }}"
        pool_val: "{{ artifacts.results[2].content | b64decode | from_json }}"
        pool_list: "{{ artifacts.results[3].content | b64decode | from_json }}"
        existence: "{{ artifacts.results[4].content | b64decode | from_json }}"
        idmap_gpu: "{{ artifacts.results[5].content | b64decode | from_json }}"
        idmap_gpu_inverted: "{{ artifacts.results[6].content | b64decode | from_json }}"
        idmap_standard: "{{ artifacts.results[7].content | b64decode | from_json }}"
        fw_reconcile: "{{ artifacts.results[8].content | b64decode | from_json }}"
        meta_drift: "{{ artifacts.results[9].content | b64decode | from_json }}"

    - name: Compute host defaults to local-ssd
      ansible.builtin.assert:
        that:
          - compute_default.host_role == 'compute'
          - compute_default.effective_storage == 'local-ssd'

    - name: Lxc_storage override beats default
      ansible.builtin.assert:
        that:
          - override.effective_storage == 'ssd'

    - name: Missing storage pool fails the role
      ansible.builtin.assert:
        that:
          - pool_val.failed
          - "'nonexistent-pool' in pool_val.msg"

    - name: Non-standard resource_pool is rejected
      ansible.builtin.assert:
        that:
          - pool_list.failed
          - "'not-a-real-pool' in pool_list.msg"

    - name: Existence guard prevents pct create and any mutating pct set on re-run
      ansible.builtin.assert:
        that:
          - existence.pct_create_calls == 0
          # With the NIC/onboot/startup stub state matching inventory, the
          # reconcile tasks must be pure no-ops (zero-mutation invariant).
          - existence.pct_set_calls == 0

    # GPU idmap contract: exact rendered conf for video=44/render=104, the
    # same output when the GID order is inverted, plus exactly one bind-mount
    # pct set on the create path.
    - name: GPU idmap renders the exact ordered GID map (44 < 104)
      ansible.builtin.assert:
        that:
          - idmap_gpu.conf == expected_conf_gpu
          - idmap_gpu.mp0_calls == 1
        fail_msg: |
          Rendered conf differs from the golden GPU idmap (or bind-mount set
          count != 1, got {{ idmap_gpu.mp0_calls }}):
          {{ idmap_gpu.conf }}

    - name: GPU idmap is identical with inverted GID order (104 > 44)
      ansible.builtin.assert:
        that:
          - idmap_gpu_inverted.conf == expected_conf_gpu
        fail_msg: |
          Inverted-GID render must match the golden GPU idmap byte-for-byte:
          {{ idmap_gpu_inverted.conf }}

    - name: Standard idmap renders the eric/media passthrough map
      ansible.builtin.assert:
        that:
          - idmap_standard.conf == expected_conf_standard
          - idmap_standard.mp0_calls == 1
        fail_msg: |
          Rendered conf differs from the golden standard idmap (or bind-mount
          set count != 1, got {{ idmap_standard.mp0_calls }}):
          {{ idmap_standard.conf }}

    # NIC firewall reconcile: a legacy NIC (no firewall key) gets exactly one
    # repair set; an explicit firewall=0 is REPLACED, never duplicated.
    - name: Firewall reconcile repairs a legacy NIC with one pct set
      ansible.builtin.assert:
        that:
          - fw_reconcile.legacy_repair_calls == 1
          - fw_reconcile.legacy_any_set == 1

    - name: Firewall reconcile replaces firewall=0 without duplicating the key
      ansible.builtin.assert:
        that:
          - fw_reconcile.fw0_repair_calls == 1
          - fw_reconcile.fw0_stale_key_in_set == 0

    # onboot/startup drift -> exactly one combined pct set with the canonical
    # desired startup string.
    - name: Onboot/startup drift triggers exactly one combined pct set
      ansible.builtin.assert:
        that:
          - meta_drift.startup_set == 1
          - meta_drift.any_onboot_set == 1
