---
# Contract verify: assert the role issued exactly the right pvesh mutations
# for absent / already-correct / drifted storage entries and vzdump jobs,
# using the logged stub invocations from converge.
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Load backup contract artifact
      ansible.builtin.slurp:
        src: /tmp/molecule-results/backup-contract.json
      register: backup_artifact

    - name: Decode backup contract artifact
      ansible.builtin.set_fact:
        bk: "{{ backup_artifact.content | b64decode | from_json }}"

    # (a) Absent storage + job are created with the exact expected argument
    #     vectors, and nothing else is mutated.
    - name: A — absent storage/job trigger exactly one create each
      ansible.builtin.assert:
        that:
          - bk.a_storage_create == 1
          - bk.a_job_create == 1
          - bk.a_total == 2
        fail_msg: "Expected storage_create=1/job_create=1/total=2, got {{ bk.a_storage_create }}/{{ bk.a_job_create }}/{{ bk.a_total }}"

    # (b) Matching live state (with Proxmox-reordered comma lists) is the
    #     idempotency contract: ZERO mutations, or every deploy churns.
    - name: B — already-correct state triggers NO mutations
      ansible.builtin.assert:
        that:
          - bk.b_total == 0
        fail_msg: "Expected 0 mutations for matching state, got {{ bk.b_total }}"

    # (c) A drifted job schedule is corrected with exactly one job set and
    #     no storage mutation.
    - name: C — drifted job schedule triggers exactly one job set
      ansible.builtin.assert:
        that:
          - bk.c_job_set == 1
          - bk.c_total == 1
        fail_msg: "Expected job_set=1/total=1 for schedule drift, got {{ bk.c_job_set }}/{{ bk.c_total }}"

    # (c2) A guest-selection drift (all=1 job gaining an exclude) is corrected
    #      with exactly one job set carrying --exclude and no storage mutation.
    - name: C2 — added exclude triggers exactly one job set
      ansible.builtin.assert:
        that:
          - bk.c2_job_set == 1
          - bk.c2_total == 1
        fail_msg: "Expected job_set=1/total=1 for exclude drift, got {{ bk.c2_job_set }}/{{ bk.c2_total }}"

    # (c3) A REMOVED optional field (live job has a stale exclude the config no
    #      longer sets) is cleared with exactly one job set carrying
    #      --delete exclude — proving removals are reconciled, not just adds.
    - name: C3 — removed exclude triggers exactly one job set with --delete
      ansible.builtin.assert:
        that:
          - bk.c3_job_set == 1
          - bk.c3_total == 1
        fail_msg: "Expected job_set=1/total=1 for exclude removal, got {{ bk.c3_job_set }}/{{ bk.c3_total }}"

    # (d) Drifted mutable storage content is corrected with exactly one
    #     storage set and no job mutation.
    - name: D — drifted storage content triggers exactly one storage set
      ansible.builtin.assert:
        that:
          - bk.d_storage_set == 1
          - bk.d_total == 1
        fail_msg: "Expected storage_set=1/total=1 for content drift, got {{ bk.d_storage_set }}/{{ bk.d_total }}"

    # (e) Create-fixed drift (server IP -> hostname migration) must fail
    #     loud with ZERO mutations — recreation is a deliberate manual step.
    - name: E — fixed-property drift fails loud with NO mutations
      ansible.builtin.assert:
        that:
          - bk.e_failed
          - bk.e_total == 0
        fail_msg: "Expected failure with 0 mutations for fixed-property drift, got failed={{ bk.e_failed }}/total={{ bk.e_total }}"
