---
- name: Converge — exercise storage + vzdump job reconcile contracts
  hosts: all
  become: true
  # See proxmox_vm/molecule/default/converge.yml for the rationale on
  # deferring gather_facts behind a raw mkdir.
  gather_facts: false
  vars:
    test_pve_storage:
      - id: tank-proxmox
        type: nfs
        server: pve-nas-01.esweiss.com
        export: /tank-proxmox
        # path is create-fixed like server/export — mirror the production
        # host_vars so Case A drives the create `--path` arm and Cases D/E
        # actually compare path in the fixed-property assert (not short-circuit).
        path: /mnt/pve/tank-proxmox
        content: "snippets,backup,vztmpl,iso"
        options: "vers=4.2,xprtsec=tls"
    test_pve_vzdump_jobs:
      - id: backup-test
        storage: tank-proxmox
        schedule: "03:30"
        mode: snapshot
        compress: zstd
        all: true
        prune_backups: "keep-daily=7,keep-weekly=4,keep-monthly=3"
        notification_mode: notification-system
        enabled: true
    # Same job but adds an exclude to the all=1 selection — proves guest
    # selection (all/vmid/exclude) is part of the drift comparison.
    test_pve_vzdump_jobs_c2:
      - id: backup-test
        storage: tank-proxmox
        schedule: "03:30"
        mode: snapshot
        compress: zstd
        all: true
        exclude: [100]
        prune_backups: "keep-daily=7,keep-weekly=4,keep-monthly=3"
        notification_mode: notification-system
        enabled: true
    # Live state matching test_pve_storage/-jobs exactly, but with the comma
    # lists REORDERED the way Proxmox normalizes them — proves the drift
    # comparison is set-based, not string-based.
    stub_storage_match: |
      [{"storage": "tank-proxmox", "type": "nfs",
        "server": "pve-nas-01.esweiss.com", "export": "/tank-proxmox",
        "path": "/mnt/pve/tank-proxmox",
        "content": "backup,iso,snippets,vztmpl",
        "options": "xprtsec=tls,vers=4.2"}]
    stub_backup_match: |
      [{"id": "backup-test", "storage": "tank-proxmox", "schedule": "03:30",
        "mode": "snapshot", "compress": "zstd", "enabled": 1, "all": 1,
        "prune-backups": "keep-daily=7,keep-monthly=3,keep-weekly=4",
        "notification-mode": "notification-system"}]
  pre_tasks:
    - name: Pre-create Ansible remote_tmp (raw bypasses tmpdir setup)
      ansible.builtin.raw: |
        set -e
        mkdir -p /tmp/ansible-tmp
        chmod 1777 /tmp/ansible-tmp
      changed_when: false

    - name: Gather facts now that remote_tmp exists
      ansible.builtin.setup:

    - name: Result directory
      ansible.builtin.file:
        path: /tmp/molecule-results
        state: directory
        mode: "0755"

  tasks:
    # =====================================================================
    # CASE A — storage entry + vzdump job both absent: exactly one
    # `pvesh create /storage` and one `pvesh create /cluster/backup`, each
    # with the exact expected argument vector.
    # =====================================================================
    - name: A — reset log and set empty live state
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesh.log, content: ""}
        - {name: pvesh_storage, content: "[]\n"}
        - {name: pvesh_backup, content: "[]\n"}
      loop_control:
        label: "{{ item.name }}"

    - name: A — run role with everything absent
      ansible.builtin.include_role:
        name: proxmox_backup
      vars:
        pve_storage: "{{ test_pve_storage }}"
        pve_vzdump_jobs: "{{ test_pve_vzdump_jobs }}"

    - name: A — count pvesh mutations
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/pvesh.log
        exp_storage='pvesh create /storage --storage tank-proxmox --type nfs'
        exp_storage="$exp_storage --server pve-nas-01.esweiss.com --export /tank-proxmox"
        exp_storage="$exp_storage --path /mnt/pve/tank-proxmox"
        exp_storage="$exp_storage --content snippets,backup,vztmpl,iso --options vers=4.2,xprtsec=tls"
        exp_job='pvesh create /cluster/backup --id backup-test --storage tank-proxmox'
        exp_job="$exp_job --schedule 03:30 --mode snapshot --compress zstd --enabled 1 --all 1"
        exp_job="$exp_job --prune-backups keep-daily=7,keep-weekly=4,keep-monthly=3"
        exp_job="$exp_job --notification-mode notification-system"
        storage_create=$(grep -cxF "$exp_storage" "$log" || true)
        job_create=$(grep -cxF "$exp_job" "$log" || true)
        total=$(grep -c '^pvesh ' "$log" || true)
        echo "{\"storage_create\": ${storage_create}, \"job_create\": ${job_create}, \"total\": ${total}}"
      args:
        executable: /bin/bash
      register: case_a
      changed_when: false

    # =====================================================================
    # CASE B — both present and matching (with Proxmox-reordered comma
    # lists): ZERO mutations. This is the no-churn idempotency contract.
    # =====================================================================
    - name: B — reset log, seed matching live state
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesh.log, content: ""}
        - {name: pvesh_storage, content: "{{ stub_storage_match }}"}
        - {name: pvesh_backup, content: "{{ stub_backup_match }}"}
      loop_control:
        label: "{{ item.name }}"

    - name: B — run role with everything already correct
      ansible.builtin.include_role:
        name: proxmox_backup
      vars:
        pve_storage: "{{ test_pve_storage }}"
        pve_vzdump_jobs: "{{ test_pve_vzdump_jobs }}"

    - name: B — count pvesh mutations
      ansible.builtin.shell: |
        set -o pipefail
        total=$(grep -c '^pvesh ' /tmp/molecule-stub-state/pvesh.log || true)
        echo "{\"total\": ${total}}"
      args:
        executable: /bin/bash
      register: case_b
      changed_when: false

    # =====================================================================
    # CASE C — vzdump job present with a drifted schedule: exactly one
    # `pvesh set /cluster/backup/<id>` and no storage mutation.
    # =====================================================================
    - name: C — reset log, seed matching storage + drifted job schedule
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesh.log, content: ""}
        - {name: pvesh_storage, content: "{{ stub_storage_match }}"}
        - name: pvesh_backup
          content: |
            [{"id": "backup-test", "storage": "tank-proxmox", "schedule": "02:00",
              "mode": "snapshot", "compress": "zstd", "enabled": 1, "all": 1,
              "prune-backups": "keep-daily=7,keep-monthly=3,keep-weekly=4",
              "notification-mode": "notification-system"}]
      loop_control:
        label: "{{ item.name }}"

    - name: C — run role with drifted job schedule
      ansible.builtin.include_role:
        name: proxmox_backup
      vars:
        pve_storage: "{{ test_pve_storage }}"
        pve_vzdump_jobs: "{{ test_pve_vzdump_jobs }}"

    - name: C — count pvesh mutations
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/pvesh.log
        exp_set='pvesh set /cluster/backup/backup-test --storage tank-proxmox'
        exp_set="$exp_set --schedule 03:30 --mode snapshot --compress zstd --enabled 1 --all 1"
        exp_set="$exp_set --prune-backups keep-daily=7,keep-weekly=4,keep-monthly=3"
        exp_set="$exp_set --notification-mode notification-system"
        job_set=$(grep -cxF "$exp_set" "$log" || true)
        total=$(grep -c '^pvesh ' "$log" || true)
        echo "{\"job_set\": ${job_set}, \"total\": ${total}}"
      args:
        executable: /bin/bash
      register: case_c
      changed_when: false

    # =====================================================================
    # CASE C2 — vzdump job present with all=1/no exclude, config adds an
    # exclude: exactly one `pvesh set /cluster/backup/<id>` carrying
    # `--exclude 100` and no storage mutation. Guards guest-selection drift.
    # =====================================================================
    - name: C2 — reset log, seed matching storage + all=1 job with no exclude
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesh.log, content: ""}
        - {name: pvesh_storage, content: "{{ stub_storage_match }}"}
        - {name: pvesh_backup, content: "{{ stub_backup_match }}"}
      loop_control:
        label: "{{ item.name }}"

    - name: C2 — run role with config adding an exclude to the all=1 job
      ansible.builtin.include_role:
        name: proxmox_backup
      vars:
        pve_storage: "{{ test_pve_storage }}"
        pve_vzdump_jobs: "{{ test_pve_vzdump_jobs_c2 }}"

    - name: C2 — count pvesh mutations
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/pvesh.log
        exp_set='pvesh set /cluster/backup/backup-test --storage tank-proxmox'
        exp_set="$exp_set --schedule 03:30 --mode snapshot --compress zstd --enabled 1 --all 1 --exclude 100"
        exp_set="$exp_set --prune-backups keep-daily=7,keep-weekly=4,keep-monthly=3"
        exp_set="$exp_set --notification-mode notification-system"
        job_set=$(grep -cxF "$exp_set" "$log" || true)
        total=$(grep -c '^pvesh ' "$log" || true)
        echo "{\"job_set\": ${job_set}, \"total\": ${total}}"
      args:
        executable: /bin/bash
      register: case_c2
      changed_when: false

    # =====================================================================
    # CASE C3 — live job carries a stale `exclude` (100) that the config no
    # longer sets: the role must clear it with `--delete exclude`. pvesh set
    # only updates the flags it is given, so a removed exclude/vmid must be
    # explicitly deleted or it keeps silently skipping guests. Exactly one
    # `pvesh set` carrying `--delete exclude` and no storage mutation.
    # =====================================================================
    - name: C3 — reset log, seed matching job WITH a stale exclude
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesh.log, content: ""}
        - {name: pvesh_storage, content: "{{ stub_storage_match }}"}
        - name: pvesh_backup
          content: |
            [{"id": "backup-test", "storage": "tank-proxmox", "schedule": "03:30",
              "mode": "snapshot", "compress": "zstd", "enabled": 1, "all": 1,
              "exclude": "100",
              "prune-backups": "keep-daily=7,keep-monthly=3,keep-weekly=4",
              "notification-mode": "notification-system"}]
      loop_control:
        label: "{{ item.name }}"

    - name: C3 — run role with the exclude removed from config
      ansible.builtin.include_role:
        name: proxmox_backup
      vars:
        pve_storage: "{{ test_pve_storage }}"
        pve_vzdump_jobs: "{{ test_pve_vzdump_jobs }}"

    - name: C3 — count pvesh mutations
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/pvesh.log
        exp_set='pvesh set /cluster/backup/backup-test --storage tank-proxmox'
        exp_set="$exp_set --schedule 03:30 --mode snapshot --compress zstd --enabled 1 --all 1"
        exp_set="$exp_set --prune-backups keep-daily=7,keep-weekly=4,keep-monthly=3"
        exp_set="$exp_set --notification-mode notification-system --delete exclude"
        job_set=$(grep -cxF "$exp_set" "$log" || true)
        total=$(grep -c '^pvesh ' "$log" || true)
        echo "{\"job_set\": ${job_set}, \"total\": ${total}}"
      args:
        executable: /bin/bash
      register: case_c3
      changed_when: false

    # =====================================================================
    # CASE D — storage present with drifted (mutable) content: exactly one
    # `pvesh set /storage/<id>` and no job mutation.
    # =====================================================================
    - name: D — reset log, seed drifted storage content + matching job
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesh.log, content: ""}
        - name: pvesh_storage
          content: |
            [{"storage": "tank-proxmox", "type": "nfs",
              "server": "pve-nas-01.esweiss.com", "export": "/tank-proxmox",
              "path": "/mnt/pve/tank-proxmox",
              "content": "backup,images,rootdir",
              "options": "xprtsec=tls,vers=4.2"}]
        - {name: pvesh_backup, content: "{{ stub_backup_match }}"}
      loop_control:
        label: "{{ item.name }}"

    - name: D — run role with drifted storage content
      ansible.builtin.include_role:
        name: proxmox_backup
      vars:
        pve_storage: "{{ test_pve_storage }}"
        pve_vzdump_jobs: "{{ test_pve_vzdump_jobs }}"

    - name: D — count pvesh mutations
      ansible.builtin.shell: |
        set -o pipefail
        log=/tmp/molecule-stub-state/pvesh.log
        storage_set=$(grep -c '^pvesh set /storage/tank-proxmox --content snippets,backup,vztmpl,iso --options vers=4.2,xprtsec=tls$' "$log" || true)
        total=$(grep -c '^pvesh ' "$log" || true)
        echo "{\"storage_set\": ${storage_set}, \"total\": ${total}}"
      args:
        executable: /bin/bash
      register: case_d
      changed_when: false

    # =====================================================================
    # CASE E — storage present with a drifted CREATE-FIXED property (server
    # still the old IP): the role must FAIL LOUD (recreation is a manual
    # step) and issue ZERO mutations.
    # =====================================================================
    - name: E — reset log, seed storage with the legacy IP server
      ansible.builtin.copy:
        dest: "/tmp/molecule-stub-state/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: pvesh.log, content: ""}
        - name: pvesh_storage
          content: |
            [{"storage": "tank-proxmox", "type": "nfs",
              "server": "192.168.0.102", "export": "/tank-proxmox",
              "path": "/mnt/pve/tank-proxmox",
              "content": "backup,iso,snippets,vztmpl",
              "options": "xprtsec=tls,vers=4.2"}]
        - {name: pvesh_backup, content: "{{ stub_backup_match }}"}
      loop_control:
        label: "{{ item.name }}"

    - name: E — run role expecting the fixed-property assert to fail
      block:
        - name: E — include proxmox_backup (expected to fail)
          ansible.builtin.include_role:
            name: proxmox_backup
          vars:
            pve_storage: "{{ test_pve_storage }}"
            pve_vzdump_jobs: "{{ test_pve_vzdump_jobs }}"
        - name: E — fixed-property drift did not fail
          ansible.builtin.set_fact:
            fixed_drift_failed: false
      rescue:
        - name: E — fixed-property drift failed as expected
          ansible.builtin.set_fact:
            fixed_drift_failed: true

    - name: E — count pvesh mutations
      ansible.builtin.shell: |
        set -o pipefail
        total=$(grep -c '^pvesh ' /tmp/molecule-stub-state/pvesh.log || true)
        echo "{\"total\": ${total}}"
      args:
        executable: /bin/bash
      register: case_e
      changed_when: false

    # ---------------------------------------------------------------------
    - name: Capture backup contract results
      ansible.builtin.copy:
        dest: /tmp/molecule-results/backup-contract.json
        mode: "0644"
        content: |
          {"a_storage_create": {{ (case_a.stdout | from_json).storage_create }},
           "a_job_create": {{ (case_a.stdout | from_json).job_create }},
           "a_total": {{ (case_a.stdout | from_json).total }},
           "b_total": {{ (case_b.stdout | from_json).total }},
           "c_job_set": {{ (case_c.stdout | from_json).job_set }},
           "c_total": {{ (case_c.stdout | from_json).total }},
           "c2_job_set": {{ (case_c2.stdout | from_json).job_set }},
           "c2_total": {{ (case_c2.stdout | from_json).total }},
           "c3_job_set": {{ (case_c3.stdout | from_json).job_set }},
           "c3_total": {{ (case_c3.stdout | from_json).total }},
           "d_storage_set": {{ (case_d.stdout | from_json).storage_set }},
           "d_total": {{ (case_d.stdout | from_json).total }},
           "e_failed": {{ fixed_drift_failed | ternary('true', 'false') }},
           "e_total": {{ (case_e.stdout | from_json).total }}}
