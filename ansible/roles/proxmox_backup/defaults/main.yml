---
# Declarative Proxmox storage entries (storage.cfg), reconciled via pvesh:
# absent entries are created; mutable properties (content, options) are
# updated on drift; create-fixed properties (server, export, path) fail loud
# with recreation instructions instead of silently diverging. Entries are
# defined in host_vars — pve-nas-01 owns tank-proxmox.
pve_storage: []  # maintained example: host_vars/pve-nas-01.yml

# Declarative vzdump backup jobs (jobs.cfg), reconciled via pvesh
# (/cluster/backup): absent jobs are created with the configured id; existing
# jobs are updated on drift. A job's `id` must match the live jobs.cfg id to
# adopt an existing job (GUI-created ids look like backup-xxxxxxxx-xxxx).
# Unmanaged live jobs are warned about, never deleted.
#
# `bwlimit` (KiB/s per node) is not optional in practice for a cluster-wide
# `all` job: every node runs it at 03:30 and writes to the same target, and an
# unthrottled aggregate froze pve-nas-01 once (see the host_vars comment).
pve_vzdump_jobs: []  # maintained example: host_vars/pve-nas-01.yml

# The vzdump metrics hookscript that a job's `script` key points at is deployed
# fleet-wide by node_exporter_host (to /usr/local/bin/vzdump-metrics-hook.sh on
# every Proxmox host) — a cluster-wide `all` job runs on each node for its local
# guests and invokes the hook there, so it must exist on all of them, not only
# the node where this role reconciles the clustered jobs.cfg. The hook writes
# vzdump_backup_last_run_success + _last_success_timestamp_seconds, feeding the
# VzdumpBackupFailed/Stale alerts.
