---
# zfs_encryption role defaults.
#
# This role deploys the boot-time mechanism that lets bare-metal Proxmox
# hosts unlock ZFS-native encrypted pools by fetching their passphrase
# from 1Password Connect (running in the cluster, exposed at
# connect.esweiss.com via internal Traefik).
#
# Cold-cluster boot fallback: if Connect is unreachable, the unit fails
# fast and logs to journald. Operator unlocks manually:
#     ssh <host>
#     sudo zfs load-key <pool>     # paste passphrase from 1P phone app
#     sudo zfs mount -a
# See docs/32-zfs-encryption.md for the full procedure.

# Connect access point. Reachable from any LAN/Tailscale host because
# the IngressRoute is gated by lan-tailscale-only, and the AdGuard
# rewrite for connect.esweiss.com points at Traefik's internal VIP.
zfs_encryption_connect_url: "https://connect.{{ internal_domain }}"

# Vault that holds passphrase items. Single Homelab vault matches the
# rest of the project (CLAUDE.md > Required 1Password Items).
zfs_encryption_connect_vault: "Homelab"

# Connect access token. Caller injects via 1Password lookup, e.g.
#     -e "zfs_encryption_connect_token=$(op read 'op://Homelab/ZFS Encryption Connect Token/credential')"
# or (preferred) by setting the variable in group_vars referencing op://
# and running through `op run --`.
#
# Required in active mode; ignored in bootstrap-only mode.
zfs_encryption_connect_token: ""

# Per-host list of encrypted pools and their 1Password items.
# Format:
#   - name: tank          # ZFS pool name
#     item: "ZFS Pool tank Passphrase"   # 1P item title in vault above
#     field: passphrase   # field on the item that holds the passphrase
# Empty list = bootstrap-only (deploy script + unit but don't enable).
zfs_encryption_pools: []

# When true, install the script + unit but do not enable any
# zfs-load-key@<pool>.service instances. Use during the rollout phase
# before pools are actually encrypted.
zfs_encryption_bootstrap_only: false

# How long the boot-time fetch retries before giving up. The unit will
# also be retried by systemd on Restart=on-failure, so total wait can
# exceed this; this controls how long ONE invocation tries before
# returning failure.
zfs_encryption_fetch_timeout_seconds: 120

# Sleep between Connect retries within a single fetch attempt.
zfs_encryption_fetch_retry_seconds: 5
