---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  vars:
    expected_pool: testpool
    expected_item: "ZFS Pool testpool Passphrase"
  tasks:
    # 1. Connect token file
    - name: Stat /etc/onepassword-connect/token
      ansible.builtin.stat:
        path: /etc/onepassword-connect/token
      register: token_stat

    - name: Assert token file exists with strict mode 0400 root:root
      ansible.builtin.assert:
        that:
          - token_stat.stat.exists
          - token_stat.stat.mode == '0400'
          - token_stat.stat.pw_name == 'root'
          - token_stat.stat.gr_name == 'root'
        fail_msg: |
          token file missing or wrong perms: exists={{ token_stat.stat.exists }},
          mode={{ token_stat.stat.mode | default('?') }},
          owner={{ token_stat.stat.pw_name | default('?') }}:{{ token_stat.stat.gr_name | default('?') }}

    - name: Read token file
      ansible.builtin.slurp:
        src: /etc/onepassword-connect/token
      register: token_content

    - name: Assert token file content matches injected fake token
      ansible.builtin.assert:
        that:
          - (token_content.content | b64decode) is search('fake-test-token-must-be-non-empty')
        fail_msg: "token file does not contain the fake test token"

    # 2. Per-pool environment file
    - name: Stat /etc/zfs/encryption/pools/testpool.conf
      ansible.builtin.stat:
        path: "/etc/zfs/encryption/pools/{{ expected_pool }}.conf"
      register: pool_conf

    - name: Assert per-pool env file exists with strict mode 0400 root:root
      ansible.builtin.assert:
        that:
          - pool_conf.stat.exists
          - pool_conf.stat.mode == '0400'
          - pool_conf.stat.pw_name == 'root'
          - pool_conf.stat.gr_name == 'root'

    - name: Read per-pool env file
      ansible.builtin.slurp:
        src: "/etc/zfs/encryption/pools/{{ expected_pool }}.conf"
      register: pool_conf_content

    - name: Assert per-pool env file has expected ITEM and FIELD lines
      ansible.builtin.assert:
        that:
          - (pool_conf_content.content | b64decode) is search('^ZFS_ENCRYPTION_ITEM=' ~ expected_item, multiline=True)
          - (pool_conf_content.content | b64decode) is search('^ZFS_ENCRYPTION_FIELD=passphrase', multiline=True)

    # 3. Boot-time unlock script
    - name: Stat /usr/local/sbin/zfs-load-key.sh
      ansible.builtin.stat:
        path: /usr/local/sbin/zfs-load-key.sh
      register: script_stat

    - name: Assert script exists with mode 0750 root:root and executable
      ansible.builtin.assert:
        that:
          - script_stat.stat.exists
          - script_stat.stat.mode == '0750'
          - script_stat.stat.pw_name == 'root'
          - script_stat.stat.gr_name == 'root'
          - script_stat.stat.executable

    - name: Read first lines of the script for content sanity
      ansible.builtin.slurp:
        src: /usr/local/sbin/zfs-load-key.sh
      register: script_content

    - name: Assert script declares the expected exit-code taxonomy + safe shell mode
      ansible.builtin.assert:
        that:
          # set -euo pipefail must be in place
          - (script_content.content | b64decode) is search('set -euo pipefail')
          # exit-code taxonomy from the role README
          - (script_content.content | b64decode) is search('Exit codes:')
          # token-via-stdin (-H @-) — never on argv (avoids /proc/<pid>/cmdline leak)
          - (script_content.content | b64decode) is search('-H @-')

    # 4. Systemd template unit
    - name: Stat /etc/systemd/system/zfs-load-key@.service
      ansible.builtin.stat:
        path: /etc/systemd/system/zfs-load-key@.service
      register: unit_stat

    - name: Assert unit file exists with mode 0644
      ansible.builtin.assert:
        that:
          - unit_stat.stat.exists
          - unit_stat.stat.mode == '0644'

    - name: Read unit file
      ansible.builtin.slurp:
        src: /etc/systemd/system/zfs-load-key@.service
      register: unit_content

    # Strip comment lines before matching so the template's explanatory header
    # (which names the dangerous "Before=zfs-mount" / "RequiredBy=" edges it
    # deliberately omits) can't satisfy the directive asserts below.
    - name: Build a comment-free view of the unit body
      # Double-quoted (not a >- block): YAML must interpret the `\n` in
      # join('\n') as a real newline. In a folded/literal block scalar the `\n`
      # stays a literal backslash-n, splitlines/join silently no-op, and the
      # body collapses to empty (every directive search below then false-passes).
      ansible.builtin.set_fact:
        unit_body_no_comments: "{{ (unit_content.content | b64decode).splitlines() | reject('match', '\\s*#') | join('\n') }}"

    - name: Assert post-incident ordering and Install hooks
      ansible.builtin.assert:
        that:
          # After=zfs-import.target — pool must be imported first
          - unit_body_no_comments is search('After=.*zfs-import\\.target')
          # Install hook is WantedBy the late mount anchor — a failed key-load
          # must never drag a mount (or any boot target) down with it.
          - unit_body_no_comments is search('WantedBy=zfs-mount-encrypted\\.service')
          # Regression guard for the boot-hang incident: the early-boot edges that
          # closed the zfs-load-key<->zfs-mount ordering cycle must be ABSENT.
          - unit_body_no_comments is not search('Before=.*zfs-mount\\.service')
          - unit_body_no_comments is not search('RequiredBy=.*zfs-mount\\.service')
          # ConditionPathExists guards against unknown pools
          - unit_body_no_comments is search('ConditionPathExists=/etc/zfs/encryption/pools/%i\\.conf')
          # Restart budget for cold-cluster boot grace
          - unit_body_no_comments is search('StartLimitBurst=60')
          - unit_body_no_comments is search('StartLimitIntervalSec=3600s')
          # RestartPreventExitStatus = 1 3 4 7 surfaces config-level errors
          # (token/item missing, auth failure, zfs load-key failed/rotated
          # passphrase = exit 4) as `failed` instead of retrying for hours.
          - unit_body_no_comments is search('RestartPreventExitStatus=1 3 4 7')

    # We deliberately use `command: systemctl ...` here (not the
    # systemd_service module) because we want read-only state checks
    # that don't risk mutating the unit. `systemd_service` with no
    # `state:` is a getter, but the failure message it produces on a
    # missing unit is less actionable than `systemctl`'s, and it has
    # a habit of changing across module rewrites.
    - name: Verify systemd recognizes the template unit  # noqa command-instead-of-module
      ansible.builtin.command: systemctl cat zfs-load-key@.service
      register: systemctl_cat
      changed_when: false
      failed_when: systemctl_cat.rc != 0

    # 5. Per-pool service is enabled
    - name: Check zfs-load-key@testpool.service enabled state  # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: systemctl is-enabled zfs-load-key@testpool.service
      register: pool_unit_enabled
      changed_when: false
      # is-enabled returns rc=1 when the unit isn't enabled but the
      # template + instance combo can still be considered "valid"; we
      # specifically want enabled here.
      failed_when: pool_unit_enabled.rc != 0

    - name: Assert per-pool service is enabled
      ansible.builtin.assert:
        that:
          - pool_unit_enabled.stdout | trim == 'enabled'
        fail_msg: "Expected zfs-load-key@testpool.service to be 'enabled', got '{{ pool_unit_enabled.stdout | trim }}'"

    # 6. Late encrypted-dataset mount anchor (zfs-mount-encrypted.service)
    - name: Stat /etc/systemd/system/zfs-mount-encrypted.service
      ansible.builtin.stat:
        path: /etc/systemd/system/zfs-mount-encrypted.service
      register: mount_unit_stat

    - name: Assert mount-anchor unit exists with mode 0644
      ansible.builtin.assert:
        that:
          - mount_unit_stat.stat.exists
          - mount_unit_stat.stat.mode == '0644'

    - name: Read mount-anchor unit file
      ansible.builtin.slurp:
        src: /etc/systemd/system/zfs-mount-encrypted.service
      register: mount_unit_content

    # Strip comment lines before matching so the template's explanatory header
    # can't satisfy the directive asserts below (mirrors unit_body_no_comments).
    - name: Build a comment-free view of the mount-anchor unit body
      # Double-quoted (not a >- block) so YAML interprets the join('\n') newline;
      # see the unit_body_no_comments note above.
      ansible.builtin.set_fact:
        mount_body_no_comments: "{{ (mount_unit_content.content | b64decode).splitlines() | reject('match', '\\s*#') | join('\n') }}"

    - name: Assert mount anchor retries until mounted and stays off the boot-critical path
      ansible.builtin.assert:
        that:
          # until-loop ExecStart holds the unit "activating" until the mount succeeds
          - mount_body_no_comments is search('until /usr/local/sbin/zfs-mount-encrypted\\.sh')
          # anchored to multi-user.target (never Before= a boot target)
          - mount_body_no_comments is search('WantedBy=multi-user\\.target')
          # burst limit disabled so it retries forever for the cold-cluster case
          - mount_body_no_comments is search('StartLimitIntervalSec=0')

    - name: Check zfs-mount-encrypted.service enabled state  # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: systemctl is-enabled zfs-mount-encrypted.service
      register: mount_unit_enabled
      changed_when: false
      failed_when: mount_unit_enabled.rc != 0

    - name: Assert mount anchor is enabled
      ansible.builtin.assert:
        that:
          - mount_unit_enabled.stdout | trim == 'enabled'
        fail_msg: "Expected zfs-mount-encrypted.service to be 'enabled', got '{{ mount_unit_enabled.stdout | trim }}'"

    # The per-pool key-load is wired into the late anchor's .wants (best-effort),
    # NOT the old zfs-mount.service.requires (the fatal early-boot edge). Assert
    # the new link exists and the old one is gone — the core regression guard.
    - name: Stat the per-pool .wants symlink under the mount anchor
      ansible.builtin.stat:
        path: /etc/systemd/system/zfs-mount-encrypted.service.wants/zfs-load-key@testpool.service
      register: pool_wants_link

    - name: Stat the old (fatal) zfs-mount.service.requires symlink
      ansible.builtin.stat:
        path: /etc/systemd/system/zfs-mount.service.requires/zfs-load-key@testpool.service
      register: pool_requires_link

    - name: Assert per-pool unit is WantedBy the anchor and not RequiredBy zfs-mount
      ansible.builtin.assert:
        that:
          - pool_wants_link.stat.exists
          - not pool_requires_link.stat.exists
        fail_msg: >-
          zfs-load-key@testpool.service must be linked into
          zfs-mount-encrypted.service.wants (got exists={{ pool_wants_link.stat.exists }})
          and must NOT be in zfs-mount.service.requires (got
          exists={{ pool_requires_link.stat.exists }}) — the early-boot edge that
          caused the documented boot-hang incident.

    # 7. Encrypted-storage guest-start cohort (pve-start-encrypted-guests)
    - name: Read the guest-start script
      ansible.builtin.slurp:
        src: /usr/local/sbin/zfs-start-encrypted-guests.sh
      register: guest_script_content

    - name: Assert the guest-start script renders the configured VM cohort
      ansible.builtin.assert:
        that:
          - (guest_script_content.content | b64decode) is search('VMIDS=\(999\)')
        fail_msg: "zfs-start-encrypted-guests.sh does not render zfs_encryption_guest_vmids (expected VMIDS=(999))"

    - name: Check pve-start-encrypted-guests.service enabled state  # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: systemctl is-enabled pve-start-encrypted-guests.service
      register: guest_unit_enabled
      changed_when: false
      failed_when: guest_unit_enabled.rc != 0

    - name: Assert guest-start unit is enabled (host has an encrypted-storage cohort)
      ansible.builtin.assert:
        that:
          - guest_unit_enabled.stdout | trim == 'enabled'
        fail_msg: "Expected pve-start-encrypted-guests.service to be 'enabled', got '{{ guest_unit_enabled.stdout | trim }}'"

    # 8. Reconciliation of de-listed pools (prepare.yml staged stalepool
    #    artifacts; converge must have removed both)
    - name: Stat the stale pool env file
      ansible.builtin.stat:
        path: /etc/zfs/encryption/pools/stalepool.conf
      register: stale_conf

    - name: Stat the stale wants-symlink
      ansible.builtin.stat:
        path: /etc/systemd/system/zfs-mount-encrypted.service.wants/zfs-load-key@stalepool.service
      register: stale_link

    - name: Assert de-listed pool artifacts were reconciled away
      ansible.builtin.assert:
        that:
          - not stale_conf.stat.exists
          - not stale_link.stat.exists
        fail_msg: >-
          Stale artifacts for a de-listed pool survived converge
          (conf exists={{ stale_conf.stat.exists }},
          wants-link exists={{ stale_link.stat.exists }}) — the reconcile
          tasks (Remove stale pool env files / Disable stale per-pool
          zfs-load-key services) regressed.

    # Summary
    - name: Display test results
      ansible.builtin.debug:
        msg:
          - "Connect token file deployed (0400 root:root)"
          - "Per-pool env file rendered with ITEM/FIELD"
          - "zfs-load-key.sh deployed (0750 root:root, set -euo pipefail, -H @-, exit-code taxonomy)"
          - "zfs-load-key@.service template ordering + Install hooks correct (WantedBy anchor, no early-boot edges)"
          - "systemctl recognizes the template unit"
          - "zfs-load-key@testpool.service enabled"
          - "zfs-mount-encrypted.service deployed, enabled, until-loop, off the boot-critical path"
          - "per-pool unit wired into the anchor's .wants, not zfs-mount.service.requires"
          - "pve-start-encrypted-guests enabled with the rendered VM cohort"
          - "stale (de-listed) pool env file + wants-symlink reconciled away"
          - "All zfs_encryption role verifications passed"
