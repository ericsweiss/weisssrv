---
# Per-role Molecule scenario. Shared driver/provisioner/verifier/scenario config
# is inherited from ansible/molecule/base.yml (applied via the `-c` flag in
# test-all-roles.sh and the CI molecule-tests matrix). Only the per-role platform
# and inventory live here (plus role-specific provisioner.env / remote_tmp / a
# custom scenario where needed).
platforms:
  - name: zfs-encryption-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    prepare: prepare.yml
  inventory:
    group_vars:
      all:
        internal_domain: test.local
        zfs_encryption_connect_token: fake-test-token-must-be-non-empty
        zfs_encryption_pools:
          - name: testpool
            item: ZFS Pool testpool Passphrase
        # Exercise the guest-start half of the boot rework: the unit must be
        # ENABLED (not just deployed) and the script must render the cohort.
        zfs_encryption_guest_vmids: [999]
        zfs_encryption_install_zfsutils: false
