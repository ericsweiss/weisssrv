---
# Prepare the test container so the role's apt step can succeed and
# systemd-related tasks have a working d-bus/systemd environment.
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply the shared systemd-wait + temp-dir prep
      ansible.builtin.import_tasks: ../../../../molecule/tasks/prepare-base.yml

    - name: Disable apt background services
      ansible.builtin.import_tasks: ../../../../molecule/tasks/prepare-apt-disable.yml

    - name: Gather facts
      ansible.builtin.setup:

    # The role installs zfsutils-linux + curl + jq via apt. Pre-update
    # the cache so the first run isn't slow.
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    # Stage stale artifacts from a pool that is NOT in zfs_encryption_pools —
    # a de-listed/renamed pool leaves exactly these behind. Converge must
    # reconcile both away (env-file removal + unit disable); verify.yml
    # asserts they are gone. Staged in prepare (not a second converge play)
    # so the idempotence stage stays clean.
    - name: Ensure the pools env directory exists for the stale file
      ansible.builtin.file:
        path: /etc/zfs/encryption/pools
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Stage a stale per-pool env file
      ansible.builtin.copy:
        dest: /etc/zfs/encryption/pools/stalepool.conf
        content: |
          ZFS_ENCRYPTION_ITEM=ZFS Pool stalepool Passphrase
          ZFS_ENCRYPTION_FIELD=passphrase
        owner: root
        group: root
        mode: "0400"

    - name: Ensure the anchor .wants directory exists for the stale link
      ansible.builtin.file:
        path: /etc/systemd/system/zfs-mount-encrypted.service.wants
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Stage a stale zfs-load-key@stalepool wants-symlink
      ansible.builtin.file:
        src: /etc/systemd/system/zfs-load-key@.service
        dest: /etc/systemd/system/zfs-mount-encrypted.service.wants/zfs-load-key@stalepool.service
        state: link
        force: true
