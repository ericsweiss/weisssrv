---
# Default variables for adguard_sync role.
# Runs on dns-01 only (tasks gate on inventory_hostname == 'dns-01') and syncs
# AdGuard Home config from the primary (dns-01) to the replica (dns-02).

# How often the sync timer fires (systemd OnCalendar). Overridden per host in
# host_vars/dns-01.yml.
adguardhome_sync_schedule: "*:0/5"

# Which AdGuard config sections dns-01 pushes to dns-02. tlsConfig stays false:
# cert files/paths are host-local and reconciled per host by the adguard_home
# role, so syncing them would fight the Ansible-managed config on dns-02.
adguardhome_sync_features:
  dns:
    accessLists: true
    serverConfig: true
    rewrites: true
  dhcp:
    serverConfig: true
    staticLeases: true
  generalSettings: true
  queryLogConfig: true
  statsConfig: true
  clientSettings: true
  services: true
  filters: true
  theme: true
  tlsConfig: false

# Required externals (no role default):
# - adguardhome_sync_version: pinned centrally in group_vars/all.yml (version
#   management), fetched by the shared prometheus_exporter install pipeline.
# - adguardhome_sync_origin / adguardhome_sync_replica: primary/replica AdGuard
#   API URLs, defined in group_vars/dns.yml.
# - adguard_admin_user: AdGuard admin username, defined in group_vars/dns.yml
#   (also defaulted by the adguard_home role).
# - adguard_admin_password: AdGuard admin password (secret) — group_vars/all.yml
#   op:// reference injected via `op run`. Never defaulted here.
