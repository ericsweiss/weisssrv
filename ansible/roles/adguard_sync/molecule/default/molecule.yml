---
# Per-role Molecule scenario. Shared driver/provisioner/verifier/scenario config
# is inherited from ansible/molecule/base.yml (applied via the `-c` flag in
# test-all-roles.sh and the CI molecule-tests matrix). Only the per-role platform
# and inventory live here (plus role-specific provisioner.env / remote_tmp / a
# custom scenario where needed).
platforms:
  - name: dns-01
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  inventory:
    group_vars:
      all:
        adguardhome_sync_version: 0.9.2
        # Custom textfile dir so the metrics-writer template's PROM_DIR is proven
        # to track node_exporter_host_textfile_dir (not the hardcoded default).
        node_exporter_host_textfile_dir: /tmp/adg-textfile
        adguardhome_sync_schedule: '*:0/5'
        adguardhome_sync_origin: http://192.168.0.150:3000
        adguardhome_sync_replica: http://192.168.0.160:3000
        adguard_admin_user: admin
        adguard_admin_password: test-password
        adguardhome_sync_features:
          generalSettings: true
          queryLogConfig: true
          statsConfig: true
          clientSettings: true
          services: true
          filters: true
          dhcp:
            serverConfig: false
            staticLeases: false
          dns:
            serverConfig: true
            accessLists: true
            rewrites: true
