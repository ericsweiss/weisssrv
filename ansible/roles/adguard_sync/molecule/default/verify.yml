---
# Verify playbook for adguard_sync role testing
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    # Verify binary is installed
    - name: Check if adguardhome-sync binary exists
      ansible.builtin.stat:
        path: /usr/local/bin/adguardhome-sync
      register: sync_binary
      failed_when: not sync_binary.stat.exists

    - name: Verify binary is executable
      ansible.builtin.assert:
        that:
          - sync_binary.stat.executable
        fail_msg: "adguardhome-sync binary is not executable"
        success_msg: "adguardhome-sync binary is executable"

    - name: Check adguardhome-sync version
      ansible.builtin.command: /usr/local/bin/adguardhome-sync version
      register: sync_version
      changed_when: false
      # May fail in cross-architecture testing (e.g., arm64 host, amd64 binary)
      failed_when: false

    - name: Display installed version
      ansible.builtin.debug:
        msg: "adguardhome-sync version: {{ sync_version.stdout | default('(binary incompatible with test host architecture)') }}"

    # No home-directory check: StateDirectory= creates
    # /var/lib/private/adguardhome-sync on the service's first run, not at
    # deploy time.

    # Verify configuration file
    - name: Check if config file exists
      ansible.builtin.stat:
        path: /etc/adguardhome-sync.yaml
      register: config_file
      failed_when: not config_file.stat.exists

    - name: Verify config file has restrictive permissions
      ansible.builtin.assert:
        that:
          - config_file.stat.mode == '0600'
        fail_msg: "Config file should have 0600 permissions (contains credentials)"
        success_msg: "Config file has correct restrictive permissions"

    - name: Read config file content
      ansible.builtin.slurp:
        src: /etc/adguardhome-sync.yaml
      register: config_content
      no_log: true

    - name: Verify config file structure
      ansible.builtin.assert:
        that:
          - "'origin:' in (config_content.content | b64decode)"
          - "'replica:' in (config_content.content | b64decode)"
          - "'features:' in (config_content.content | b64decode)"
          - "'api:' in (config_content.content | b64decode)"
        fail_msg: "Config file missing expected sections"
        success_msg: "Config file has correct structure"

    # Verify systemd service
    - name: Check if systemd service file exists
      ansible.builtin.stat:
        path: /etc/systemd/system/adguardhome-sync.service
      register: service_file
      failed_when: not service_file.stat.exists

    - name: Read service file content
      ansible.builtin.slurp:
        src: /etc/systemd/system/adguardhome-sync.service
      register: service_content

    - name: Verify service file content
      ansible.builtin.assert:
        that:
          - "'Type=oneshot' in (service_content.content | b64decode)"
          - "'ExecStart=/usr/local/bin/adguardhome-sync' in (service_content.content | b64decode)"
          - "'LoadCredential=config.yaml:/etc/adguardhome-sync.yaml' in (service_content.content | b64decode)"
          - "'DynamicUser=yes' in (service_content.content | b64decode)"
          - "'ProtectSystem=strict' in (service_content.content | b64decode)"
          - "'StateDirectory=adguardhome-sync' in (service_content.content | b64decode)"
          # Metrics ExecStopPost: '+' prefix so it runs as root outside the
          # sandbox and can write the node_exporter textfile dir.
          - "'ExecStopPost=+/usr/local/bin/adguardhome-sync-metrics.sh $SERVICE_RESULT' in (service_content.content | b64decode)"
        fail_msg: "Service file missing expected configuration"
        success_msg: "Service file has correct configuration (sandboxed DynamicUser + metrics ExecStopPost)"

    # Failure-signal metrics writer (closes the silent-sync-failure gap).
    - name: Check the adguardhome-sync metrics writer is installed
      ansible.builtin.stat:
        path: /usr/local/bin/adguardhome-sync-metrics.sh
      register: sync_metrics_script
      failed_when: >-
        not sync_metrics_script.stat.exists
        or not sync_metrics_script.stat.executable
        or sync_metrics_script.stat.mode != '0755'

    # The textfile dir is templated from node_exporter_host_textfile_dir (set to
    # a custom path in molecule.yml), so the rendered PROM_DIR must track it.
    - name: Verify the metrics writer templates PROM_DIR from the host var
      ansible.builtin.command: >-
        grep -qF 'PROM_DIR="/tmp/adg-textfile"' /usr/local/bin/adguardhome-sync-metrics.sh
      register: sync_metrics_grep
      changed_when: false
      failed_when: sync_metrics_grep.rc != 0

    # Execute the writer (the ExecStopPost passes $SERVICE_RESULT): success and
    # failure arms, asserting the failure arm preserves the last-success timestamp.
    - name: Create the templated textfile dir (no node_exporter_host in this scenario)
      ansible.builtin.file:
        path: /tmp/adg-textfile
        state: directory
        mode: "0755"

    - name: Run the metrics writer (success arm)
      ansible.builtin.command: /usr/local/bin/adguardhome-sync-metrics.sh success
      changed_when: false

    - name: Read adguardhome_sync.prom after success
      ansible.builtin.slurp:
        src: /tmp/adg-textfile/adguardhome_sync.prom
      register: adg_prom_ok

    - name: Assert the success arm records success=1 with a fresh timestamp
      ansible.builtin.assert:
        that:
          - "'adguardhome_sync_last_run_success 1' in (adg_prom_ok.content | b64decode)"
          - "'adguardhome_sync_last_success_timestamp_seconds ' in (adg_prom_ok.content | b64decode)"
        fail_msg: "success arm did not emit success=1 + a timestamp"
        success_msg: "success arm emits success=1 + a fresh timestamp"

    - name: Capture the success timestamp (to assert preservation on failure)
      ansible.builtin.shell: >-
        awk '/^adguardhome_sync_last_success_timestamp_seconds/ {print $2}'
        /tmp/adg-textfile/adguardhome_sync.prom
      register: adg_ts_ok
      changed_when: false

    - name: Run the metrics writer (failure arm — $SERVICE_RESULT != success)
      ansible.builtin.command: /usr/local/bin/adguardhome-sync-metrics.sh failed
      changed_when: false

    - name: Read adguardhome_sync.prom after failure
      ansible.builtin.slurp:
        src: /tmp/adg-textfile/adguardhome_sync.prom
      register: adg_prom_fail

    - name: Assert the failure arm records success=0 and preserves the timestamp
      ansible.builtin.assert:
        that:
          - "'adguardhome_sync_last_run_success 0' in (adg_prom_fail.content | b64decode)"
          - >-
            'adguardhome_sync_last_success_timestamp_seconds ' ~ adg_ts_ok.stdout
            in (adg_prom_fail.content | b64decode)
        fail_msg: "failure arm did not record success=0 or lost the prior timestamp"
        success_msg: "failure arm records success=0 and preserves the last-success timestamp"

    # Verify systemd timer
    - name: Check if systemd timer file exists
      ansible.builtin.stat:
        path: /etc/systemd/system/adguardhome-sync.timer
      register: timer_file
      failed_when: not timer_file.stat.exists

    - name: Read timer file content
      ansible.builtin.slurp:
        src: /etc/systemd/system/adguardhome-sync.timer
      register: timer_content

    - name: Verify timer file content
      ansible.builtin.assert:
        that:
          - "'OnCalendar=' in (timer_content.content | b64decode)"
          - "'*:0/5' in (timer_content.content | b64decode)"
          - "'Persistent=true' in (timer_content.content | b64decode)"
          - "'WantedBy=timers.target' in (timer_content.content | b64decode)"
        fail_msg: "Timer file missing expected configuration"
        success_msg: "Timer file configured for 5-minute intervals"

    # Verify timer is enabled and running
    - name: Check timer status
      ansible.builtin.systemd:
        name: adguardhome-sync.timer
      register: timer_status

    - name: Verify timer is enabled
      ansible.builtin.assert:
        that:
          - timer_status.status.UnitFileState == 'enabled'
        fail_msg: "Timer is not enabled"
        success_msg: "Timer is enabled"

    - name: Verify timer is active
      ansible.builtin.assert:
        that:
          - timer_status.status.ActiveState == 'active'
        fail_msg: "Timer is not active"
        success_msg: "Timer is active"

    - name: Display test results
      ansible.builtin.debug:
        msg:
          - "adguardhome-sync installed and configured:"
          - "  - Binary: /usr/local/bin/adguardhome-sync (executable)"
          - "  - Version: {{ (sync_version.stdout | default('N/A')) | trim }}"
          - "Configuration:"
          - "  - Config file: /etc/adguardhome-sync.yaml (mode 0600, via LoadCredential)"
          - "  - Contains origin/replica/features/api sections"
          - "Systemd:"
          - "  - Service: /etc/systemd/system/adguardhome-sync.service (sandboxed DynamicUser oneshot)"
          - "  - Timer: /etc/systemd/system/adguardhome-sync.timer (every 5 min)"
          - "  - Timer status: enabled and active"
          - "(Actual sync requires two AdGuard Home instances - not tested)"
