---
# AdGuard Home Sync configuration
# Syncs settings from dns-01 (primary) to dns-02 (replica)
# Only runs on dns-01

- name: Configure AdGuard Home Sync on dns-01
  when: inventory_hostname == 'dns-01'
  block:
    - name: Check if adguardhome-sync binary exists
      ansible.builtin.stat:
        path: /usr/local/bin/adguardhome-sync
      register: sync_binary

    # Version-aware install: detect the installed binary's version so a bump to
    # adguardhome_sync_version actually upgrades a host already running an older
    # build. Without this the download only fired on first install and silently
    # skipped every later version bump. `adguardhome-sync --version` prints
    # "adguardhome-sync version X.Y.Z" (GoReleaser strips the tag's v prefix);
    # pull the bare semver to compare against the pin.
    - name: Check installed adguardhome-sync version
      ansible.builtin.command: /usr/local/bin/adguardhome-sync --version
      register: sync_version_check
      changed_when: false
      failed_when: false
      check_mode: false
      when: sync_binary.stat.exists

    - name: Determine adguardhome-sync install need
      ansible.builtin.set_fact:
        # Reinstall when the binary is missing, the probe failed, or the parsed
        # version differs from the pin (no-op when they match -> idempotent).
        sync_needs_install: >-
          {{ not sync_binary.stat.exists
             or sync_version_check.rc | default(1) != 0
             or (sync_version_check.stdout | default('')
                 | regex_search('[0-9]+\.[0-9]+\.[0-9]+') | default('')) != adguardhome_sync_version }}

    - name: Download adguardhome-sync binary
      ansible.builtin.get_url:
        url: "https://github.com/bakito/adguardhome-sync/releases/download/v{{ adguardhome_sync_version }}/adguardhome-sync_{{ adguardhome_sync_version }}_linux_amd64.tar.gz"  # noqa yaml[line-length]
        # Use upstream filename so get_url's checksum lookup matches an entry in checksums.txt
        dest: "/tmp/adguardhome-sync_{{ adguardhome_sync_version }}_linux_amd64.tar.gz"
        mode: "0644"
        force: false
        checksum: "sha256:https://github.com/bakito/adguardhome-sync/releases/download/v{{ adguardhome_sync_version }}/checksums.txt"
      when: sync_needs_install

    - name: Extract adguardhome-sync
      ansible.builtin.unarchive:
        src: "/tmp/adguardhome-sync_{{ adguardhome_sync_version }}_linux_amd64.tar.gz"
        dest: /tmp
        remote_src: true
        # No `creates:` guard here — on an upgrade the freshly downloaded
        # tarball must overwrite a stale /tmp/adguardhome-sync from a prior run.
      when: sync_needs_install

    - name: Install adguardhome-sync binary
      ansible.builtin.copy:
        src: /tmp/adguardhome-sync
        dest: /usr/local/bin/adguardhome-sync
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      when: sync_needs_install

    - name: Cleanup download
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/adguardhome-sync_{{ adguardhome_sync_version }}_linux_amd64.tar.gz"
        - /tmp/adguardhome-sync
      when: sync_needs_install

    - name: Create adguardhome-sync home directory
      ansible.builtin.file:
        path: /var/lib/adguardhome-sync
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy adguardhome-sync configuration
      ansible.builtin.template:
        src: adguardhome-sync.yaml.j2
        dest: /etc/adguardhome-sync.yaml
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Deploy adguardhome-sync systemd service
      ansible.builtin.template:
        src: adguardhome-sync.service.j2
        dest: /etc/systemd/system/adguardhome-sync.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Deploy adguardhome-sync systemd timer
      ansible.builtin.template:
        src: adguardhome-sync.timer.j2
        dest: /etc/systemd/system/adguardhome-sync.timer
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Enable adguardhome-sync timer
      ansible.builtin.systemd:
        name: adguardhome-sync.timer
        enabled: true
        state: started
        daemon_reload: true
