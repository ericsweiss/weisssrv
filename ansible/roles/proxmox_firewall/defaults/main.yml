---
# Default variables for Proxmox firewall role

pve_firewall_enabled: true

# Filesystem paths for the Proxmox firewall config. Defaults match the real
# clustered FUSE filesystem; molecule scenarios override these to redirect
# template writes to a stub directory.
pve_firewall_config_dir: /etc/pve/firewall
pve_firewall_node_dir: /etc/pve/nodes
# When true, skip pveum / pve-firewall systemd tasks so the role can run in
# a container without the real Proxmox CLI.
pve_firewall_skip_pveum: false

# Core cluster nodes (Proxmox hosts)
pve_firewall_core_cluster:
  - 192.168.0.102  # pve-nas-01
  - 192.168.0.103  # pve-laptop-01
  - 192.168.0.104  # pve-opt-01
  - 192.168.0.105  # pve-opt-02
  - 192.168.0.106  # pve-opt-03
  - 192.168.0.107  # pve-prec-01

# K3s cluster nodes
# Servers: .22X range (222, 223, 227)
# Agents:  .20X range (202, 203, 204, 205, 206, 207)
pve_firewall_k3s_nodes:
  - 192.168.0.222  # k3s-srv-nas-01
  - 192.168.0.223  # k3s-srv-laptop-01
  - 192.168.0.227  # k3s-srv-prec-01
  - 192.168.0.202  # k3s-agt-nas-01
  - 192.168.0.203  # k3s-agt-laptop-01
  - 192.168.0.204  # k3s-agt-opt-01
  - 192.168.0.205  # k3s-agt-opt-02
  - 192.168.0.206  # k3s-agt-opt-03
  - 192.168.0.207  # k3s-agt-prec-01

# NFS client allowlist
pve_firewall_nfs_clients:
  - 192.168.0.102
  - 192.168.0.103
  - 192.168.0.104
  - 192.168.0.105
  - 192.168.0.106
  - 192.168.0.107
  - 192.168.0.154
  - 192.168.0.200/29   # k3s agents (.200-.207)
  - 192.168.0.220/29   # k3s servers (.220-.227)

# SMB client allowlist
pve_firewall_smb_clients:
  - 192.168.0.0/24

# Named aliases
pve_firewall_aliases:
  - name: dns-01
    cidr: 192.168.0.150
    comment: Primary DNS server
  - name: dns-02
    cidr: 192.168.0.160
    comment: Secondary DNS server
  - name: smtp-relay
    cidr: 192.168.0.151
    comment: SMTP relay server
