---
# Proxmox VE firewall configuration
# Manages cluster.fw, ipsets, security groups, and per-node host.fw

- name: Ensure Proxmox firewall directory exists
  ansible.builtin.file:
    path: "{{ pve_firewall_config_dir }}"
    state: directory
    owner: root
    group: www-data
    mode: "0755"
  when: inventory_hostname in groups['proxmox'] | default([])

# Proxmox auto-creates /etc/pve/nodes/<hostname> on cluster join (it's
# pmxcfs-managed with root:www-data 0755), but ensuring it exists here
# makes the role robust against fresh-node edge cases and lets the
# molecule scenario render host.fw without each per-host dir being set
# up in prepare.yml.
#
# unsafe_writes is required for any task that mutates /etc/pve — pmxcfs
# is a FUSE filesystem and Ansible's default "write to .tmp + atomic
# rename" path fails because pmxcfs doesn't support cross-directory
# rename(2). This task is normally a no-op on production hosts where
# the directory already exists with the expected owner/mode; the
# unsafe_writes flag only matters on the create / repair path.
- name: Ensure per-node firewall directory exists
  ansible.builtin.file:
    path: "{{ pve_firewall_node_dir }}/{{ inventory_hostname }}"
    state: directory
    owner: root
    group: www-data
    mode: "0755"
    unsafe_writes: true
  when: inventory_hostname in groups['proxmox'] | default([])

- name: Deploy cluster firewall configuration
  ansible.builtin.template:
    src: cluster.fw.j2
    dest: "{{ pve_firewall_config_dir }}/cluster.fw"
    owner: root
    group: www-data
    mode: "0640"
    unsafe_writes: true  # Required for /etc/pve clustered filesystem
  # cluster.fw is on the shared /etc/pve filesystem - only deploy once, via a Proxmox node.
  # delegate_to ensures this works even when the play runs for non-Proxmox groups (services, etc.)
  # where inventory_hostname may not be in groups['proxmox'].
  run_once: true
  delegate_to: "{{ groups['proxmox'][0] }}"
  when:
    - pve_firewall_enabled | default(true)
    - (groups['proxmox'] | default([]) | length) > 0

- name: Deploy node-specific host.fw configuration
  ansible.builtin.template:
    src: host.fw.j2
    dest: "{{ pve_firewall_node_dir }}/{{ inventory_hostname }}/host.fw"
    owner: root
    group: www-data
    mode: "0640"
    unsafe_writes: true  # Required for /etc/pve clustered filesystem
  when:
    - pve_firewall_enabled | default(true)
    - inventory_hostname in groups['proxmox'] | default([])

# Note: The "firewall: 1" option in /etc/pve/datacenter.cfg is deprecated in Proxmox VE 8+
# Firewall is now enabled via /etc/pve/firewall/cluster.fw (deployed above) and the pve-firewall service
# The deprecated option causes parse errors: 'firewall': property is not defined in schema

- name: Ensure pve-firewall service is enabled and running
  ansible.builtin.systemd:
    name: pve-firewall
    state: started
    enabled: true
  when:
    - pve_firewall_enabled | default(true)
    - inventory_hostname in groups['proxmox'] | default([])
    - not (pve_firewall_skip_pveum | default(false))

# Deploy per-guest firewall rules
- name: Include guest firewall tasks
  ansible.builtin.include_tasks: guest.yml
  when:
    - vmid is defined
    - guest_security_groups is defined

# Proxmox monitoring user and API token for Prometheus exporters.
# PVE user management is cluster-wide — run_once + delegate_to ensures
# these tasks execute exactly once on a single Proxmox node regardless
# of which play or host group invokes this role.
- name: Check if monitoring@pve user exists
  ansible.builtin.command: pveum user list --output-format json
  register: pve_users
  changed_when: false
  check_mode: false
  run_once: true
  delegate_to: "{{ groups['proxmox'][0] }}"
  when:
    - groups.get('proxmox', []) | length > 0
    - not (pve_firewall_skip_pveum | default(false))

- name: Create monitoring@pve user
  ansible.builtin.command: >
    pveum user add monitoring@pve
    --comment 'Prometheus observability exporter'
  changed_when: true
  run_once: true
  delegate_to: "{{ groups['proxmox'][0] }}"
  when:
    - groups.get('proxmox', []) | length > 0
    # Explicit gate on skip_pveum so a future refactor that pre-seeds
    # pve_users.stdout from cache (making `.stdout is defined` true) can't
    # accidentally fire pveum against a container without the binary.
    - not (pve_firewall_skip_pveum | default(false))
    - pve_users.stdout is defined
    - >-
      pve_users.stdout | from_json | default([]) |
      selectattr('userid', 'equalto', 'monitoring@pve') |
      list | length == 0

- name: Check PVEAuditor ACL for monitoring@pve
  ansible.builtin.command: pveum acl list --output-format json
  register: pve_acls
  changed_when: false
  check_mode: false
  run_once: true
  delegate_to: "{{ groups['proxmox'][0] }}"
  when:
    - groups.get('proxmox', []) | length > 0
    - not (pve_firewall_skip_pveum | default(false))

- name: Assign PVEAuditor role to monitoring@pve
  ansible.builtin.command: >
    pveum aclmod / --users monitoring@pve --roles PVEAuditor
  changed_when: true
  run_once: true
  delegate_to: "{{ groups['proxmox'][0] }}"
  when:
    - groups.get('proxmox', []) | length > 0
    - not (pve_firewall_skip_pveum | default(false))
    - pve_acls.stdout is defined
    - >-
      pve_acls.stdout | from_json | default([]) |
      selectattr('ugid', 'equalto', 'monitoring@pve') |
      selectattr('path', 'equalto', '/') |
      selectattr('roleid', 'equalto', 'PVEAuditor') |
      list | length == 0

- name: Check if exporter API token exists for monitoring@pve
  ansible.builtin.command: pveum user token list monitoring@pve --output-format json
  register: pve_tokens
  changed_when: false
  check_mode: false
  run_once: true
  delegate_to: "{{ groups['proxmox'][0] }}"
  when:
    - groups.get('proxmox', []) | length > 0
    - not (pve_firewall_skip_pveum | default(false))

- name: Create exporter API token for monitoring@pve
  ansible.builtin.command: >
    pveum user token add monitoring@pve exporter --privsep 0
  changed_when: true
  no_log: true
  register: pve_token_created
  run_once: true
  delegate_to: "{{ groups['proxmox'][0] }}"
  when:
    - groups.get('proxmox', []) | length > 0
    - not (pve_firewall_skip_pveum | default(false))
    - pve_tokens.stdout is defined
    - >-
      (pve_tokens.stdout | from_json | default([]) |
      map(attribute='tokenid') | list) |
      intersect(['exporter', 'monitoring@pve!exporter']) | length == 0

- name: Notify if new API token was created
  ansible.builtin.debug:
    msg: >
      API token monitoring@pve!exporter created. Retrieve the secret
      from the Proxmox UI and store it in the "Proxmox API Token"
      1Password item.
  run_once: true
  delegate_to: "{{ groups['proxmox'][0] }}"
  when:
    - pve_token_created is defined
    - pve_token_created is changed
