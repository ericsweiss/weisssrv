---
# Deploy per-guest firewall configuration

- name: Deploy guest firewall configuration
  ansible.builtin.include_tasks:
    file: deploy-pmxcfs-config.yml
    apply:
      become: true
      delegate_to: "{{ firewall_deploy_host | default(groups['proxmox'][0]) }}"
  vars:
    pmxcfs_config_src: guest.fw.j2
    pmxcfs_config_dest: "{{ pve_firewall_config_dir }}/{{ vmid }}.fw"
    pmxcfs_config_label: "{{ vmid }}.fw"
  when:
    - guest_security_groups is defined
    - guest_security_groups | length > 0
    - vmid is defined
