---
# Publish a rendered Jinja template into pmxcfs (/etc/pve) content-only.
#
# pmxcfs (the Proxmox clustered FUSE filesystem) auto-enforces owner=root
# group=www-data mode=0640 on the files under /etc/pve/firewall and REJECTS
# every explicit chown / chmod / utime with EPERM. Ansible's template & copy
# modules land content through atomic_move, whose fallback path runs
# shutil.copy2 (which calls utime) and then re-applies the requested
# owner/group/mode — so a first create or any content change false-fails on
# "Operation not permitted" even though the bytes were written. unsafe_writes
# does not route around it on ansible-core 2.20+. Render to a staging file on
# the node's normal root filesystem (where template's metadata ops are legal),
# then publish with a plain `cp` — no metadata syscalls — only when the live
# content differs, letting pmxcfs stamp its enforced ownership and mode.
#
# Caller contract (set as include_tasks vars):
#   pmxcfs_config_src    - template filename (in the role's templates/)
#   pmxcfs_config_dest   - absolute destination path inside /etc/pve
#   pmxcfs_config_label  - unique, filesystem-safe id (also the staging filename)
# The caller applies become / delegate_to (via the include's `apply:`) and
# run_once / when on the include_tasks statement.

- name: Ensure the pmxcfs firewall staging directory exists
  ansible.builtin.file:
    path: "{{ pve_firewall_staging_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Render firewall config to staging off pmxcfs for {{ pmxcfs_config_label }}
  ansible.builtin.template:
    src: "{{ pmxcfs_config_src }}"
    dest: "{{ pve_firewall_staging_dir }}/{{ pmxcfs_config_label }}"
    owner: root
    group: root
    mode: "0640"
  register: proxmox_firewall_pmxcfs_render

- name: Read the live pmxcfs checksum for {{ pmxcfs_config_label }}
  ansible.builtin.stat:
    path: "{{ pmxcfs_config_dest }}"
    checksum_algorithm: sha1
  register: proxmox_firewall_pmxcfs_live

# cp is the only write primitive pmxcfs accepts here: pmxcfs enforces
# root:www-data 0640 (no group/other write bit), so plain `cp` (no -p) issues
# no post-copy fchmod/chown/utime and dodges the EPERM. This is content-only —
# if this helper is ever reused for a pmxcfs file whose mode carries a write
# bit, cp would restore that mode and reintroduce the fchmod/EPERM.
#
# The compare is render-vs-live-pmxcfs, so out-of-band drift in /etc/pve is
# detected and corrected. It carries its own idempotence: publish only when the
# rendered content differs from what already lives in pmxcfs (or nothing does).
# In `--check` mode `template` renders nothing and returns no checksum, so this
# guard collapses and the publish previews as "skipped" — the render-to-staging
# task's `changed` is the dry-run signal that a firewall change is pending
# (the command never runs in check mode regardless).
- name: Publish the firewall config into pmxcfs when changed for {{ pmxcfs_config_label }}
  ansible.builtin.command:
    cmd: "cp -- {{ pve_firewall_staging_dir }}/{{ pmxcfs_config_label }} {{ pmxcfs_config_dest }}"
  when: >-
    (proxmox_firewall_pmxcfs_render.checksum | default(''))
    != (proxmox_firewall_pmxcfs_live.stat.checksum | default(''))
  changed_when: true
