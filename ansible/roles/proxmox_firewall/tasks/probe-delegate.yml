---
# Probe ONE Proxmox host over its ansible connection and record it in the
# _pve_fw_reachable list when it answers. Included once per host from
# main.yml's delegate-selection loop — deliberately a looped INCLUDE around a
# single delegated ping, never a looped ping: when a looped delegate is down,
# the connection plugin marks the loop's AGGREGATE result unreachable for the
# executing host and — ignore_unreachable notwithstanding — the strategy
# silently ends the play with rc 0 (observed 2026-07-22 with pve-prec-01 down:
# every play stopped dead after the probe, so a single dead node turned the
# whole fleet's firewall deploy into a green no-op). A single non-looped ping
# with ignore_unreachable is handled correctly and the play continues.
- name: Probe for reachability — {{ _pve_fw_probe_host }}
  ansible.builtin.ping:
  delegate_to: "{{ _pve_fw_probe_host }}"
  ignore_unreachable: true
  # A module-level probe failure (reachable host, broken python — or the
  # molecule scenario's connection:local stand-ins, which fail become) must
  # not abort the fleet deploy either — only a real pong is recorded, so such
  # a host is passed over like an unreachable one.
  failed_when: false
  changed_when: false
  register: _pve_fw_probe

- name: Record as reachable — {{ _pve_fw_probe_host }}
  ansible.builtin.set_fact:
    _pve_fw_reachable: "{{ (_pve_fw_reachable | default([])) + [_pve_fw_probe_host] }}"
  when: _pve_fw_probe.ping | default('') == 'pong'
