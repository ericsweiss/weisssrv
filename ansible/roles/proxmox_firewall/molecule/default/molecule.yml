---
# Per-role Molecule scenario. Shared driver/provisioner/verifier/scenario config
# is inherited from ansible/molecule/base.yml (applied via the `-c` flag in
# test-all-roles.sh and the CI molecule-tests matrix). Only the per-role platform
# and inventory live here (plus role-specific provisioner.env / remote_tmp / a
# custom scenario where needed).
platforms:
  - name: proxmox-firewall-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
    groups:
      - proxmox
provisioner:
  playbooks:
    prepare: prepare.yml
  inventory:
    group_vars:
      all:
        pve_firewall_config_dir: /tmp/pve-firewall-test/firewall
        pve_firewall_node_dir: /tmp/pve-firewall-test/nodes
        pve_firewall_skip_pveum: true
        firewall_ipset_special_entries:
          k3s_nodes:
            - ip: 192.168.0.161
              comment: k3s API VIP
    host_vars:
      proxmox-firewall-test:
        pve_firewall_node_ip: 192.168.0.102
        proxmox_role: nas
        firewall_ipsets:
          - pve_hosts
          - core-cluster
          - nfs_clients
        vmid: 100
        guest_security_groups:
          - sg-vm-admin
          - sg-dns
          - sg-metrics
    hosts:
      proxmox:
        hosts:
          pve-nas-01:
            ansible_host: 192.168.0.102
            ansible_connection: local
            proxmox_role: nas
            firewall_ipsets:
              - pve_hosts
              - core-cluster
              - nfs_clients
          pve-laptop-01:
            ansible_host: 192.168.0.103
            ansible_connection: local
            proxmox_role: compute
            firewall_ipsets:
              - pve_hosts
              - core-cluster
              - nfs_clients
          pve-opt-01:
            ansible_host: 192.168.0.104
            ansible_connection: local
            proxmox_role: compute
            firewall_ipsets:
              - pve_hosts
              - core-cluster
              - nfs_clients
      dns:
        hosts:
          dns-01:
            ansible_host: 192.168.0.150
            ansible_connection: local
            vmid: 150
            firewall_ipsets:
              - core-cluster
            guest_security_groups:
              - sg-vm-admin
              - sg-dns
              - sg-metrics
          smtp-relay:
            ansible_host: 192.168.0.151
            ansible_connection: local
            vmid: 151
            firewall_ipsets:
              - core-cluster
            guest_firewall_policy_out: "DROP"
            guest_security_groups:
              - sg-vm-admin
              - sg-smtp-relay
              - sg-metrics
