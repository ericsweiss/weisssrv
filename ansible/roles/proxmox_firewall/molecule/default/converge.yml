---
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Wait for apt locks to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
              fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
          sleep 1
        done
      args:
        executable: /bin/bash
      changed_when: false
      when: ansible_os_family == "Debian"
  roles:
    - role: proxmox_firewall

# Second play in the SAME invocation: proves the cross-play run-once guard.
# After the first play, `_pve_fw_cluster_done` must be set on groups['proxmox'][0]
# (pve-nas-01) via delegate_facts, so a later including play reads it from
# hostvars and SKIPS re-deploying cluster.fw. We capture the fact's pre-include
# value to disk, then re-include the role to confirm it still runs cleanly.
- name: Cross-play guard — second include must see the run-once fact already set
  hosts: proxmox-firewall-test
  become: true
  tasks:
    # Self-contained: don't rely on the first play's role run having created the
    # dir (the copy below would fail if pve_firewall_config_dir ever changes).
    - name: Ensure the cross-play guard output directory exists
      ansible.builtin.file:
        path: /tmp/pve-firewall-test
        state: directory
        mode: "0755"

    - name: Capture _pve_fw_cluster_done as seen at the start of a later play
      ansible.builtin.copy:
        dest: /tmp/pve-firewall-test/cross-play-guard.json
        mode: "0644"
        content: |
          {"cluster_done_before_second_include":
           {{ hostvars[groups['proxmox'][0]]['_pve_fw_cluster_done']
              | default(false) | to_json }}}

    - name: Re-include proxmox_firewall in a second play (guard should skip cluster.fw)
      ansible.builtin.include_role:
        name: proxmox_firewall
