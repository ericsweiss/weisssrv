---
# Deploys the boot-time LUKS-open mechanism for the archive pool. Idempotent;
# safe to re-run. No-op on hosts without luks_archive_devices set.

- name: Ensure base script dependencies are present
  ansible.builtin.apt:
    name:
      - curl
      - jq
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"

- name: Ensure cryptsetup is present
  ansible.builtin.apt:
    name: cryptsetup
    state: present
  when:
    - ansible_facts['os_family'] == "Debian"
    - luks_archive_install_cryptsetup | default(true)

# Active-mode safety check: fetching the passphrase at boot requires a valid
# Connect token. Mirror zfs_encryption's loud-failure pattern so an operator
# who forgets `op run --` gets a clear pointer rather than a confused boot.
# Token validation. length > 0 alone lets common-sentinel mistakes through:
# unrendered `op://Homelab/...` references, literal "REPLACE_ME", or the
# string "None" from a failed lookup. Each of these would deploy a
# guaranteed-401-at-runtime token, surfacing the failure only at the next
# reboot. Refuse them at play time instead.
- name: Validate Connect token is present and not a sentinel (active mode)
  ansible.builtin.assert:
    that:
      - luks_archive_connect_token | length > 0
      - not (luks_archive_connect_token | string).startswith('op://')
      - luks_archive_connect_token | string not in
          ['REPLACE_ME', 'CHANGE_ME', 'None', 'null', 'TODO']
    fail_msg: >-
      luks_archive_connect_token is empty or a sentinel value. Run with
      `op run -- env LUKS_ARCHIVE_CONNECT_TOKEN="$(op read 'op://Homelab/ZFS Encryption Connect Token/credential')"
      ansible-playbook ...` — the same Connect token zfs_encryption uses
      (single token shared between both roles). NOTE: this assert is
      skipped in bootstrap mode; re-run with `bootstrap_only=false`
      once devices are LUKS-formatted.
  when:
    - not (luks_archive_bootstrap_only | default(false))
    - luks_archive_devices | default([]) | length > 0

- name: Ensure /etc/onepassword-connect directory exists
  ansible.builtin.file:
    path: /etc/onepassword-connect
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: luks_archive_devices | default([]) | length > 0

# Shared with zfs_encryption: if zfs_encryption already deployed the token,
# this re-writes the same content (idempotent). If neither role ran first,
# this is the deploy. Token contents are no_log: true so they don't show up
# in ansible diff output.
- name: Deploy 1Password Connect access token
  ansible.builtin.copy:
    dest: /etc/onepassword-connect/token
    content: "{{ luks_archive_connect_token }}\n"
    owner: root
    group: root
    mode: "0400"
  when:
    - luks_archive_connect_token | length > 0
    - luks_archive_devices | default([]) | length > 0
  no_log: true

# Mirror zfs_encryption's "remove stale Connect token on non-encryption
# hosts" task. Both roles share the same token file at
# /etc/onepassword-connect/token, so either role's cleanup is sufficient
# in practice — but keeping parity prevents drift if pve-nas-01 ever
# drops its zfs_encryption_pools or stops being subject to that role.
- name: Remove stale Connect token on non-LUKS hosts
  ansible.builtin.file:
    path: /etc/onepassword-connect/token
    state: absent
  when:
    - luks_archive_devices | default([]) | length == 0
    - zfs_encryption_pools | default([]) | length == 0

- name: Ensure /etc/luks/archive directory exists
  ansible.builtin.file:
    path: /etc/luks/archive
    state: directory
    owner: root
    group: root
    mode: "0700"

# Per-device env files: tell the open script which underlying block device
# to unlock for a given mapper name. systemd EnvironmentFile format —
# parsed by systemd, not shell, so no quoting needed for the device path.
- name: Deploy per-device environment files
  ansible.builtin.copy:
    dest: "/etc/luks/archive/{{ item.name }}.conf"
    content: |
      LUKS_ARCHIVE_DEVICE={{ item.device }}
      LUKS_ARCHIVE_ITEM={{ luks_archive_passphrase_item }}
      LUKS_ARCHIVE_FIELD={{ luks_archive_passphrase_field }}
    owner: root
    group: root
    mode: "0400"
  loop: "{{ luks_archive_devices }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy luks-archive-open script
  ansible.builtin.template:
    src: luks-archive-open.sh.j2
    dest: /usr/local/sbin/luks-archive-open.sh
    owner: root
    group: root
    mode: "0750"

- name: Deploy archive-luks-open@.service systemd template
  ansible.builtin.template:
    src: archive-luks-open@.service.j2
    dest: /etc/systemd/system/archive-luks-open@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Apply pending systemd reloads
  ansible.builtin.meta: flush_handlers

# Footgun guard: enabling a unit against a device that isn't actually
# LUKS-formatted would cryptsetup-open something that's not a LUKS volume,
# the unit would fail at boot, and RequiredBy=zfs-import-cache.service
# would drag the whole archive import down. Probe each listed device with
# `cryptsetup isLuks` before enabling the corresponding unit. Skipped in
# bootstrap mode (the whole point of bootstrap mode is "deploy plumbing
# while devices are still plaintext").
#
# Probe gate is `luks_archive_skip_isluks_probe` (defaulting false), NOT
# `luks_archive_install_cryptsetup`. The two used to be the same flag,
# but conflating them lets a flag intended as a test-rig escape hatch
# (skip apt install) silently disable the safety probe on any prod run
# where cryptsetup happens to be missing for an unrelated reason.
- name: Probe each listed device for LUKS header
  ansible.builtin.command: "cryptsetup isLuks {{ item.device }}"
  register: luks_archive_isluks_results
  changed_when: false
  failed_when: false
  # cryptsetup isLuks can hang indefinitely on certain LUKS2 header-
  # corruption modes; cap at 10s so a hung probe doesn't stall the
  # whole play. failed_when: false still applies — the assert below
  # catches rc=124 (Ansible's timeout-killed exit) like any other
  # non-zero.
  timeout: 10
  loop: "{{ luks_archive_devices }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not (luks_archive_bootstrap_only | default(false))
    - luks_archive_devices | default([]) | length > 0
    - not (luks_archive_skip_isluks_probe | default(false))

# rc values actually emitted by `cryptsetup isLuks` (the wider 0-7
# taxonomy applies to subcommands that take a key/device; isLuks is
# much narrower):
#   0   — device has a LUKS header (good)
#   1   — device exists but is NOT a LUKS volume (the case we're
#         guarding against, OR a stale-mapper / device-busy shell case
#         that surfaces the same rc)
#   124 — Ansible's `timeout:` killed the probe; LUKS2 header
#         corruption can hang isLuks indefinitely
#   127 — `cryptsetup` binary not in PATH (apt install failed earlier)
# Anything not 0 should fail the play with the operator-actionable
# message below. Include item.stderr so the cryptsetup message surfaces
# verbatim, distinguishing "not a valid LUKS device" from "doesn't
# exist or access denied" without forcing the operator into journald.
- name: Assert each listed device has a LUKS header
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: >-
      Device '{{ item.item.device }}' (mapper '{{ item.item.name }}')
      failed cryptsetup isLuks (rc={{ item.rc }}, stderr='{{ item.stderr | default('') | trim }}').
      rc=1 means no LUKS header (or device-busy / open-failed shell
      case) — luksFormat the device per docs/32-zfs-encryption.md §LUKS
      rolling conversion first, OR run `cryptsetup status <mapper>` +
      `cryptsetup close <mapper>` to release a stale mapping that's
      holding the device. rc=124 means the probe timed out (10s cap);
      LUKS2 header corruption can hang isLuks — collect the device's
      LUKS dump for analysis. rc=127 means the cryptsetup binary is
      missing — install it via `luks_archive_install_cryptsetup: true`
      or by hand. Bypass the probe entirely by re-running with `task
      luks-archive:bootstrap` (bootstrap_only=true) or
      `-e luks_archive_skip_isluks_probe=true`.
  loop: "{{ luks_archive_isluks_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - not (luks_archive_bootstrap_only | default(false))
    - luks_archive_devices | default([]) | length > 0
    - not (luks_archive_skip_isluks_probe | default(false))
    # When the probe didn't run, item is the raw device dict (no rc
    # attribute) — skip rather than crash with attribute access errors.
    - item.rc is defined

- name: Enable per-device archive-luks-open services
  ansible.builtin.systemd:
    name: "archive-luks-open@{{ item.name }}.service"
    enabled: true
    daemon_reload: true
  loop: "{{ luks_archive_devices }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not (luks_archive_bootstrap_only | default(false))
    - luks_archive_devices | default([]) | length > 0

# Reconcile drift: if a device was removed from luks_archive_devices,
# remove its env file AND disable the unit symlink. Otherwise an orphan
# archive-luks-open@<old>.service would try to cryptsetup-open a stale
# device at next boot, fail, and block import.
#
# This cleanup does NOT `cryptsetup close` a currently-open mapper
# whose device was removed from the inventory. The pool may still be
# referencing /dev/mapper/<old-name> as a vdev, and closing it would
# fault the pool. Operator must `sudo zpool detach archive <old-mapper>`
# and `sudo cryptsetup close <old-mapper>` manually before re-running
# this role with the device removed from luks_archive_devices.

- name: Enumerate deployed device env files
  ansible.builtin.find:
    paths: /etc/luks/archive
    patterns: "*.conf"
    file_type: file
  register: luks_archive_env_files_present
  changed_when: false

- name: Remove stale device env files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ luks_archive_env_files_present.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename | regex_replace('\\.conf$', '')) not in (luks_archive_devices | map(attribute='name') | list)

# Walk `zfs-import-cache.service.requires` because that's where
# `systemctl enable` drops the symlinks under the unit's
# `RequiredBy=zfs-import-cache.service` install hook. If the template's
# RequiredBy= target ever changes (e.g. to zfs-import.target to also
# cover the scan-import path), this find path must be updated to match
# or stale enable symlinks will be silently left in place.
- name: Enumerate enabled per-device unit symlinks
  ansible.builtin.find:
    paths: /etc/systemd/system/zfs-import-cache.service.requires
    patterns: "archive-luks-open@*.service"
    file_type: link
  register: luks_archive_unit_links_present
  changed_when: false
  failed_when: false   # dir may not exist if no unit was ever enabled

- name: Disable stale per-device archive-luks-open services
  ansible.builtin.systemd:
    name: "{{ item.path | basename }}"
    enabled: false
  loop: "{{ luks_archive_unit_links_present.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  vars:
    _device_name: >-
      {{ item.path | basename
         | regex_replace('^archive-luks-open@', '')
         | regex_replace('\.service$', '') }}
    _desired_devices: "{{ luks_archive_devices | map(attribute='name') | list }}"
  when:
    - _device_name not in _desired_devices
