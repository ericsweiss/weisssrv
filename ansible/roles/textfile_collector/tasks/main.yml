---
# Render a node_exporter textfile-collector oneshot service + its timer from
# per-collector vars, with the shared systemd hardening. Mirrors the
# prometheus_exporter wrapper pattern: callers include_role this with vars.
#
# Scope: this helper owns ONLY the unit/timer scaffold. The collector SCRIPT and
# the enable/start of the timer stay in the calling role — the enable/start
# carries each role's own molecule gating (node_exporter_host tags it
# molecule-notest; smtp_relay starts + asserts the timer live).

- name: Install collector service unit for {{ textfile_collector_name }}
  ansible.builtin.template:
    src: collector.service.j2
    dest: "/etc/systemd/system/{{ textfile_collector_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: _textfile_collector_service

- name: Install collector timer unit for {{ textfile_collector_name }}
  ansible.builtin.template:
    src: collector.timer.j2
    dest: "/etc/systemd/system/{{ textfile_collector_name }}.timer"
    owner: root
    group: root
    mode: "0644"
  register: _textfile_collector_timer

# Pick up a unit change without a reboot. state: restarted (not started) so a
# cadence/hardening edit takes effect against an already-active timer; gated on
# a real change so re-converge stays idempotent. Replaces the per-collector
# "Reload systemd for <x>" handlers the calling roles used to carry.
- name: Reload systemd + restart timer on unit change for {{ textfile_collector_name }}
  ansible.builtin.systemd:
    name: "{{ textfile_collector_name }}.timer"
    daemon_reload: true
    state: restarted
  # not ansible_check_mode: in a dry run the templates report changed without
  # writing units, and restarting a not-yet-existing timer would fail the
  # check (same gate the calling roles' enable tasks carry).
  when:
    - not ansible_check_mode
    - _textfile_collector_service is changed or _textfile_collector_timer is changed
