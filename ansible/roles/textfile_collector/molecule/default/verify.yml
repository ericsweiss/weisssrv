---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Stat the rendered service unit
      ansible.builtin.stat:
        path: /etc/systemd/system/molecule-test-collector.service
      register: svc_unit

    - name: Assert service unit exists and is mode 0644 root:root
      ansible.builtin.assert:
        that:
          - svc_unit.stat.exists
          - svc_unit.stat.mode == "0644"
          - svc_unit.stat.pw_name == "root"
          - svc_unit.stat.gr_name == "root"
        fail_msg: "molecule-test-collector.service missing or has wrong perms"

    - name: Stat the rendered timer unit
      ansible.builtin.stat:
        path: /etc/systemd/system/molecule-test-collector.timer
      register: timer_unit

    - name: Assert timer unit exists and is mode 0644 root:root
      ansible.builtin.assert:
        that:
          - timer_unit.stat.exists
          - timer_unit.stat.mode == "0644"
          - timer_unit.stat.pw_name == "root"
          - timer_unit.stat.gr_name == "root"
        fail_msg: "molecule-test-collector.timer missing or has wrong perms"

    - name: Read the rendered service unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/molecule-test-collector.service
      register: svc_content

    - name: Assert the service renders the oneshot + hardening scaffold
      ansible.builtin.assert:
        that:
          - "'Type=oneshot' in svc"
          - "'ExecStart=/usr/local/sbin/molecule-test-collector.sh /var/lib/node_exporter' in svc"
          - "'User=root' in svc"
          - "'TimeoutStartSec=20s' in svc"
          - "'Nice=10' in svc"
          - "'After=network.target' in svc"
          # Full systemd hardening block must be present.
          - "'NoNewPrivileges=yes' in svc"
          - "'ProtectSystem=strict' in svc"
          - "'ProtectHome=yes' in svc"
          - "'PrivateTmp=yes' in svc"
          - "'ProtectKernelModules=yes' in svc"
          - "'ProtectControlGroups=yes' in svc"
          - "'RestrictRealtime=yes' in svc"
          - "'RestrictNamespaces=yes' in svc"
          - "'LockPersonality=yes' in svc"
          - "'SystemCallArchitectures=native' in svc"
          # Extra ReadWritePaths entry is appended after the textfile dir.
          - "'ReadWritePaths=/var/lib/node_exporter /var/lib/molecule-extra' in svc"
        fail_msg: "rendered service unit is missing an expected directive"
      vars:
        svc: "{{ svc_content.content | b64decode }}"

    - name: Read the rendered timer unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/molecule-test-collector.timer
      register: timer_content

    - name: Assert the timer renders the configured cadence
      ansible.builtin.assert:
        that:
          - "'OnBootSec=2min' in tmr"
          - "'OnUnitInactiveSec=5min' in tmr"
          - "'AccuracySec=30s' in tmr"
          - "'Unit=molecule-test-collector.service' in tmr"
          - "'WantedBy=timers.target' in tmr"
        fail_msg: "rendered timer unit is missing an expected directive"
      vars:
        tmr: "{{ timer_content.content | b64decode }}"

    - name: Confirm systemd parses the rendered units (no bad directive)
      ansible.builtin.command: systemd-analyze verify /etc/systemd/system/molecule-test-collector.timer
      changed_when: false
      # systemd-analyze exits non-zero only on a real unit-file error; the
      # collector script/service resolve so a clean run proves the render is valid.
