---
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Wait for apt locks to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
              fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
          sleep 1
        done
      args:
        executable: /bin/bash
      changed_when: false
      when: ansible_os_family == "Debian"

    - name: Create the node_exporter textfile collector directory
      ansible.builtin.file:
        path: /var/lib/node_exporter
        state: directory
        mode: "0755"

    - name: Install a dummy collector script (the calling role owns the real one)
      ansible.builtin.copy:
        dest: /usr/local/sbin/molecule-test-collector.sh
        mode: "0755"
        content: |
          #!/bin/bash
          printf 'molecule_test 1\n' > "${1:-/var/lib/node_exporter}/molecule_test.prom"
  tasks:
    # Exercise the shared scaffold with a representative collector (After= and an
    # extra ReadWritePaths entry, non-default timer cadence + timeout).
    - name: Deploy a test collector via the shared role
      ansible.builtin.include_role:
        name: textfile_collector
      vars:
        textfile_collector_name: molecule-test-collector
        textfile_collector_service_description: Sample molecule test metric to node_exporter textfile collector
        textfile_collector_timer_description: Periodically run the molecule test collector
        textfile_collector_script: /usr/local/sbin/molecule-test-collector.sh
        textfile_collector_textfile_dir: /var/lib/node_exporter
        textfile_collector_after:
          - network.target
        textfile_collector_timeout_start_sec: 20s
        textfile_collector_on_boot_sec: 2min
        textfile_collector_on_unit_inactive_sec: 5min
        textfile_collector_accuracy_sec: 30s
        textfile_collector_extra_read_write_paths:
          - /var/lib/molecule-extra
