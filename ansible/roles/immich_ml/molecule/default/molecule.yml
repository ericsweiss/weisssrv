---
# Per-role Molecule scenario. Shared driver/provisioner/verifier/scenario config
# is inherited from ansible/molecule/base.yml (applied via the `-c` flag in
# test-all-roles.sh and the CI molecule-tests matrix). This is a render/contract
# scenario: skip_immich_ml_deploy skips the GPU guard, the Docker install, and
# all service management, so the compose file + systemd unit are rendered and
# asserted without a container runtime or a /dev/dri device.
platforms:
  - name: immich-ml-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  inventory:
    group_vars:
      all:
        timezone: America/Los_Angeles
        # Image pin normally in group_vars/all.yml.
        immich_version: v3.0.3
