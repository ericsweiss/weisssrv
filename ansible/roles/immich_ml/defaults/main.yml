---
# Immich machine-learning (OpenVINO) compose stack on a GPU LXC. Mirrors the
# immich role's docker-compose pattern: proxmox_lxc provisions the container
# (with the /dev/dri passthrough), this role installs Docker Engine and brings
# the single-service compose stack up via a systemd unit.
#
# The endpoint is AUTHLESS by upstream design — the guest firewall
# (sg-immich-ml) is the security boundary and admits only the Immich VM
# (.157). See docs/36-immich.md (GPU machine learning).
#
# No secrets: this role needs no `op run` env vars.

# --- Compose project layout (LXC rootfs) -------------------------------------
# The model cache (multi-GB, downloaded on first run) lives in a named docker
# volume in the rootfs — re-downloadable cache, not state, so no zvol/bind
# mount and no backup enrollment.
immich_ml_compose_dir: /opt/immich-ml/compose

# --- Listen port --------------------------------------------------------------
# Upstream immich-machine-learning default (3003). Published on the LAN;
# reachability is scoped by sg-immich-ml, not by the bind address.
immich_ml_listen_port: 3003

# --- Container image (from group_vars/all.yml) --------------------------------
# Derived from the SAME immich_version pin as the VM's server/ML containers,
# so the documented server/ML version-lockstep is automatic: any
# immich_version bump MR redeploys both the VM stack (deploy-immich) and this
# LXC (deploy-immich-ml) with matching tags. `-openvino` is upstream's Intel
# GPU ML image variant; it bundles its own compute-runtime — the host only
# supplies the xe kernel driver (already proven by Plex on the same card).
immich_ml_image: "ghcr.io/immich-app/immich-machine-learning:{{ immich_version }}-openvino"

# --- GPU device access --------------------------------------------------------
# GIDs granted to the ML container (compose group_add) so it can open the
# idmapped /dev/dri nodes: in an unprivileged LXC the container's root is not
# host root, so CAP_DAC_OVERRIDE cannot bypass the 0660 root:video/render
# device perms — the group match is the only access path. proxmox_lxc passes
# the HOST's video/render GIDs 1:1 into the container, so these fallbacks are
# the pve-nas-01 values; tasks/main.yml re-discovers them from the actual
# /dev/dri nodes at deploy time.
immich_ml_video_gid: 44
immich_ml_render_gid: 104
