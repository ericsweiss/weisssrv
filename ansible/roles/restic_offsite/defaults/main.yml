---
# restic_offsite role defaults — nightly offsite backup to Backblaze B2 via
# restic + rclone. Runs on pve-nas-01 only, chained OnSuccess= after
# archive-backup.service. See README.md + docs/42-offsite-backup.md.

restic_offsite_enabled: true

# restic/rclone are installed from the Debian archive (state: present) so the
# molecule scenario stays hermetic (no GitHub-release fetch). These pins are
# restic — ADVISORY: set to an exact Debian package version to hard-pin, or
# leave empty to track the distro.
restic_version: ""
# rclone — REQUIRED semantic version + .deb sha256: installed from
# rclone.org's official release deb, never Debian apt (trixie ships a
# 2022-era 1.60.1-DEV build; the pinned current build keeps the backup
# transport reproducible — see tasks/main.yml). all.yml carries the
# production values; these defaults keep molecule/standalone runs working.
rclone_version: "1.74.4"
rclone_deb_sha256: "a9da2eaa70428c6dcc5acbb0b7eac0faec4c61643e0b468d9fe09ddf79b7e929"

# restic repository = rclone remote 'b2' -> bucket weisssrv-backup, path restic.
# (rclone b2 backend path form is remote:bucket/path.)
restic_offsite_repo: "rclone:b2:weisssrv-backup/restic"

# restic metadata cache on the ENCRYPTED ssd pool (was the plaintext nvme pool).
# The cache holds the repo tree/index — including file PATHS — in plaintext, so it
# belongs on an encrypted dataset even though the data blobs are client-encrypted
# (regenerable + host-internal, but paths still leak layout). The role creates it
# 0700 root; it is deliberately NOT in nas_storage's nas_appdata_dirs, so it is
# never made client-writable and the all_squashed (anonuid=1000) /export/appdata
# cannot read a 0700-root dir. restic's own CACHEDIR.TAG + `--exclude-caches`
# keeps it out of the appdata file-walk, so it is not re-uploaded.
restic_offsite_cache_dir: /mnt/ssd/appdata/.restic-cache

# Stable path roots: file sources bind their latest archsync snapshot subtree
# here; the data-zvol clones mount here. Stable paths let restic's parent-
# snapshot optimization re-read only changed files instead of re-hashing ~1T.
restic_offsite_bind_root: /mnt/restic-src
restic_offsite_zvol_mount_root: /run/restic-offsite
# bind (real host: mount --bind the .zfs snapshot) | direct (molecule: no ZFS).
restic_offsite_bind_mode: bind
restic_offsite_zvol_clone_suffix: b2walk

# Throttles (respect the July I/O-pressure history — mirror media-mover). The
# WAN upload is the real cap; RCLONE_BWLIMIT bounds it anyway.
restic_offsite_bwlimit: "50M"           # RCLONE_BWLIMIT
restic_offsite_rclone_transfers: 4      # RCLONE_TRANSFERS
restic_offsite_gogc: 20                 # GOGC — caps restic heap during index/prune

restic_offsite_metrics_dir: "{{ node_exporter_host_textfile_dir | default('/var/lib/node_exporter') }}"
restic_offsite_snap_prefix: archsync
# Abort (do not upload) if any source's latest archsync snapshot is older than
# this — B2 chains OnSuccess= after archive-backup, so a fresh snapshot is the
# norm; >26h tolerates one deferred-archive night while still refusing a stale tree.
restic_offsite_freshness_max_age_h: 26

restic_offsite_restore_base: /mnt/restore/restic
restic_offsite_config_dir: /etc/restic-offsite
restic_offsite_excludes_file: "{{ restic_offsite_config_dir }}/excludes.txt"

# GFS retention (task-mandated).
restic_offsite_keep_daily: 3
restic_offsite_keep_weekly: 2
restic_offsite_keep_monthly: 3
restic_offsite_keep_yearly: 1

# systemd load-shaping (mirror media-mover: deferential under contention).
restic_offsite_nice: 10
restic_offsite_io_class: best-effort
restic_offsite_io_priority: 6
restic_offsite_cpu_weight: 20
restic_offsite_io_weight: 20
# Fallback timer (the PRIMARY trigger is OnSuccess=restic-offsite.service on
# archive-backup.service). 07:15 = shortly after the 06:30 archive run finishes.
restic_offsite_timer_calendar: "*-*-* 07:15:00"
# Weekly rotating deep verify (restic check --read-data-subset, ISO-week % 12):
# midday Sunday, far from the nightly 02:00-07:30 backup window. The full repo
# is re-read against bit-rot every ~12 weeks; ResticOffsiteVerifyStale (8d)
# pages when a week's verify is missed or fails.
restic_offsite_verify_timer_calendar: "Sun *-*-* 12:00:00"
restic_offsite_timer_randomized_delay: 10m

# File-walkable sources: each item binds <mountpoint>'s latest archsync snapshot
# subtree at <bind_root>/<name>, so restic sees a STABLE path. The zvol-backed
# CHILDREN of these datasets (postgres/prometheus/loki/etc.) are empty
# mountpoint dirs in the file walk and are covered by the logical dumps that
# land on tank/backups/apps (which the 'backups' source below walks whole).
restic_offsite_sources:
  - name: backups     # tank/backups: legacy machine backups + apps/ logical dumps
    mountpoint: /mnt/tank/backups
  - name: share       # tank/share
    mountpoint: /mnt/tank/share
  - name: appdata     # ssd/appdata: app /config dirs (zvol children empty in the walk)
    mountpoint: /mnt/ssd/appdata
  - name: databases   # ssd/databases
    mountpoint: /mnt/ssd/databases
  - name: k3s-etcd    # ssd/k3s-etcd: off-node etcd snapshot copies (DR chain)
    mountpoint: /mnt/ssd/k3s-etcd

# File-bearing data zvols: cloned from their latest archsync snapshot and mounted
# read-only so their ext4 contents ride into B2 (a file walk cannot see a live
# zvol). The control script owns the full clone -> mount -> restic -> umount ->
# destroy lifecycle with EXIT-trap cleanup. Empty in molecule (no ZFS).
restic_offsite_zvol_sources:
  - name: immich-data
    zvol: tank/immich-data/disk
    fstype: ext4
    mount_opts: ro,noload
  - name: nextcloud-data
    zvol: tank/nextcloud-data/disk
    fstype: ext4
    mount_opts: ro,noload

# Datasets deliberately NOT offsited (documented in README + docs/42):
#   tank/proxmox (vzdump images: local + archive DR only; poor dedup, huge)
#   tank/media (huge, non-sensitive, local + Samba only)
#   ssd/appdata/{prometheus,loki} (own retention / regenerable)
restic_offsite_excludes:
  - /mnt/restic-src/appdata/prometheus/**
  - /mnt/restic-src/appdata/loki/**
  # zvol mountpoint dirs (empty in the file walk — exclude for clarity)
  - /mnt/restic-src/appdata/authentik/postgres/**
  - /mnt/restic-src/appdata/mealie/postgres/**
  - /mnt/restic-src/appdata/gitlab/**
  - /mnt/restic-src/appdata/immich/**
  - /mnt/restic-src/appdata/nextcloud/**
  # Plex: keep the DBs + Preferences, drop the ~60G regenerable cache/metadata.
  - "/mnt/restic-src/appdata/plex/Library/Application Support/Plex Media Server/Cache/**"
  - "/mnt/restic-src/appdata/plex/Library/Application Support/Plex Media Server/Metadata/**"
  - "/mnt/restic-src/appdata/plex/Library/Application Support/Plex Media Server/Media/**"
