---
# Hermetic scenario: a LOCAL restic file repo (no B2/network) + bind mode
# (mount --bind of the seeded .zfs/snapshot tree — the container is privileged
# with SYS_ADMIN, and plain-dir bind mounts work here, as nas_storage's export
# binds prove) + a fake .zfs/snapshot tree seeded by prepare.yml. Exercises the
# control script end to end (freshness guard -> bind -> restic backup -> metrics
# -> restore round-trip -> verify) and statically pins the zvol-clone / subcommand
# / metric-name contract that the ZFS-less container can't run. Shared driver/
# provisioner config comes from ansible/molecule/base.yml via `-c`.
platforms:
  - name: restic-offsite-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    capabilities:
      - SYS_ADMIN
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    prepare: prepare.yml
  inventory:
    group_vars:
      all:
        restic_offsite_enabled: true
        # LOCAL file repo — no rclone/B2 contacted.
        restic_offsite_repo: /tmp/restic-molecule-repo
        # bind mode: mount --bind the seeded snapshot subtree at BIND_ROOT/<name>,
        # so the backed-up paths match cmd_restore's --include prefixes (restore
        # round-trip is testable). Plain-dir bind mounts work in this privileged
        # SYS_ADMIN container.
        restic_offsite_bind_mode: bind
        restic_offsite_zvol_sources: []
        restic_offsite_cache_dir: /tmp/restic-molecule-cache
        restic_offsite_bind_root: /tmp/restic-molecule-bind
        restic_offsite_zvol_mount_root: /tmp/restic-molecule-zvol
        restic_offsite_metrics_dir: /var/lib/node_exporter
        restic_offsite_restore_base: /tmp/restic-molecule-restore
        # Seeded fake snapshot trees (prepare.yml). Names match the seeded dirs.
        restic_offsite_sources:
          - name: backups
            mountpoint: /tmp/molsrc/backups
          - name: appdata
            mountpoint: /tmp/molsrc/appdata
        # Secrets: test values (dummy B2, real-enough restic password for the
        # local file repo).
        b2_key_id: molecule-b2-key-id
        b2_application_key: molecule-b2-app-key
        rclone_crypt_password: molecule-test-password
