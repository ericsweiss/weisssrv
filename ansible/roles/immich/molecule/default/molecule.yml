---
# Per-role Molecule scenario. Shared driver/provisioner/verifier/scenario config
# is inherited from ansible/molecule/base.yml (applied via the `-c` flag in
# test-all-roles.sh and the CI molecule-tests matrix). This is a render/contract
# scenario: immich_skip_install skips the Docker/nginx install + all service
# management, so the templates (compose, config, .env, nginx, systemd units,
# backup wrapper) are rendered and asserted without a real container runtime.
platforms:
  - name: immich-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  playbooks:
    prepare: prepare.yml
  env:
    # The role asserts these are injected (normally by `op run`).
    IMMICH_DB_PASSWORD: testdbpassword123
    IMMICH_OAUTH_CLIENT_ID: test-immich-client-id
    IMMICH_OAUTH_CLIENT_SECRET: test-immich-client-secret
  inventory:
    group_vars:
      all:
        timezone: America/Los_Angeles
        # Image pins normally in group_vars/all.yml.
        immich_version: v3.0.3
        immich_postgres_version: 14-vectorchord0.4.3-pgvectors0.2.0
        immich_postgres_digest: sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
        immich_valkey_version: "9"
        immich_valkey_digest: sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
