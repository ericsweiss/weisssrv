---
# Immich compose stack on a NAS-pinned Debian VM. Order: mount the persistent
# zvols -> install Docker + nginx -> render config/compose/nginx -> bring the
# stack up via a systemd unit -> install the pg_dump backup timer. The shared
# compose scaffolding (Docker install, compose systemd unit, nginx task flow,
# backup-metrics helper) lives in the compose_app role, included below with
# immich-specific vars.

# =============================================================================
# Persistent storage (ZFS zvols attached as SCSI devices by proxmox_vm)
# =============================================================================
- name: Mount additional persistent disks
  ansible.builtin.include_role:
    name: zvol_mount
  vars:
    zvol_mount_disks: "{{ vm_additional_disks | default([]) }}"
  when: vm_additional_disks is defined and vm_additional_disks | length > 0

# =============================================================================
# Credential guards (fail early + clearly if `op run` didn't inject secrets)
# =============================================================================
- name: Validate required database credential
  ansible.builtin.assert:
    that:
      - immich_db_password | default('') | length > 0
    fail_msg: >-
      IMMICH_DB_PASSWORD is not set. Deploy via `task immich:deploy` so `op run`
      injects it from 1Password ("Immich Secrets"/postgres-password).
    success_msg: "Database credential present"
  no_log: true

- name: Validate required OIDC credentials
  ansible.builtin.assert:
    that:
      - immich_oauth_client_id | default('') | length > 0
      - immich_oauth_client_secret | default('') | length > 0
    fail_msg: >-
      IMMICH_OAUTH_CLIENT_ID / IMMICH_OAUTH_CLIENT_SECRET not set. Deploy via
      `task immich:deploy` so `op run` injects them from 1Password ("Immich
      SSO"). Create the Authentik OAuth2/OpenID provider first — see
      docs/36-immich.md (SSO setup).
    success_msg: "OIDC credentials present"
  no_log: true

# =============================================================================
# Docker Engine (shared docker_engine via compose_app)
# =============================================================================
# immich_skip_install gates the install/service-management steps (mapped onto
# compose_app_skip_install) so the molecule scenario can render + assert every
# template without Docker/systemd services in the CI container. It defaults
# false, so real deploys run the full flow. The pinned-engine install + dpkg
# hold + journald daemon.json is the shared docker_engine role.
- name: Install Docker Engine + compose plugin
  ansible.builtin.include_role:
    name: compose_app
    tasks_from: docker.yml
  vars:
    compose_app_skip_install: "{{ immich_skip_install | default(false) }}"

# =============================================================================
# Compose project directories (on the encrypted zvols)
# =============================================================================
- name: Create Immich compose project directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ immich_compose_dir }}"
    - "{{ immich_config_dir }}"
    - "{{ immich_model_cache_dir }}"

# The immich-server container runs as root (upstream default) and writes the
# library tree here; the mount root gets a dedicated library subdir so the tank
# zvol root stays single-purpose.
- name: Create the photo library directory on the data zvol
  ansible.builtin.file:
    path: "{{ immich_upload_location }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# =============================================================================
# Host nginx (TLS terminator in front of the compose stack) — shared task flow
# =============================================================================
# Capture this role's nginx site template as an absolute path BEFORE the include
# (role_path inside an include_role resolves to the INCLUDED role, so it must be
# resolved eagerly here). compose_app/nginx.yml deploys it byte-unchanged.
- name: Resolve the Immich nginx site template path
  ansible.builtin.set_fact:
    immich_nginx_site_template: "{{ role_path }}/templates/immich.nginx.conf.j2"

- name: Configure the host nginx reverse proxy
  ansible.builtin.include_role:
    name: compose_app
    tasks_from: nginx.yml
  vars:
    compose_app_skip_install: "{{ immich_skip_install | default(false) }}"
    compose_app_nginx_cert_dir: "{{ immich_nginx_ssl_cert | dirname }}"
    compose_app_nginx_cert_dir_mode: "0750"
    compose_app_nginx_ssl_cert: "{{ immich_nginx_ssl_cert }}"
    compose_app_nginx_ssl_key: "{{ immich_nginx_ssl_key }}"
    compose_app_nginx_site_name: immich.conf
    compose_app_nginx_site_template: "{{ immich_nginx_site_template }}"
    compose_app_nginx_self_signed_days: 3650
    compose_app_nginx_self_signed_subj: "/CN=vm.esweiss.com"
    compose_app_nginx_self_signed_san: "DNS:*.esweiss.com"
    # Immich seeds the placeholder unconditionally (its molecule asserts it).
    compose_app_nginx_bootstrap_cert: true

# =============================================================================
# Rendered config: the SSO/telemetry config file, the compose .env, the stack
# =============================================================================
# IMMICH_CONFIG_FILE holds the system config (oauth secret inline) — no_log.
- name: Render the Immich system config file
  ansible.builtin.template:
    src: immich-config.json.j2
    dest: "{{ immich_config_dir }}/immich-config.json"
    owner: root
    group: root
    mode: "0640"
  no_log: true
  notify: Restart compose stack

# Compose .env carries DB_PASSWORD — no_log.
- name: Render the compose environment file
  ansible.builtin.template:
    src: immich.env.j2
    dest: "{{ immich_compose_dir }}/.env"
    owner: root
    group: root
    mode: "0640"
  no_log: true
  notify: Restart compose stack

- name: Render the docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ immich_compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart compose stack

# =============================================================================
# Systemd unit that owns the compose lifecycle (shared compose_app unit)
# =============================================================================
- name: Deploy + start the Immich compose stack
  ansible.builtin.include_role:
    name: compose_app
  vars:
    compose_app_skip_install: "{{ immich_skip_install | default(false) }}"
    compose_app_service_name: immich-compose
    compose_app_description: "Immich (docker compose stack)"
    compose_app_working_directory: "{{ immich_compose_dir }}"
    compose_app_requires_mounts_for:
      - "{{ immich_app_dir }}"
      - "{{ immich_db_data_location }}"
      - "{{ immich_data_dir }}"
    compose_app_requires_mounts_comment:
      - "Never start the stack before its encrypted zvols are mounted — otherwise"
      - "compose would write into the (unmounted) root filesystem. These map to the"
      - "fstab-generated mount units for the app/postgres/library zvols."
    compose_app_reconcile_comment:
      - "`up -d` reconciles the running stack to the rendered compose/.env/config,"
      - "recreating only the containers whose definition changed."

# =============================================================================
# Backup landing zone (offsite NFS when enabled) + nightly pg_dump timer
# =============================================================================
# immich_backup_dir resolves to the NFS mountpoint when immich_backup_nfs_enabled
# (tank/backups/apps/immich -> archsync -> B2), otherwise the app zvol. This one
# task creates whichever; the mount below (gated) overlays it when NFS-backed.
- name: Create the backup landing directory
  ansible.builtin.file:
    path: "{{ immich_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# Mounted over TLS (xprtsec=tls — the per-app export rejects plaintext); the VM
# runs tlshd via the nfs_tls role, wired in immich.yml gated on this flag.
# nofail keeps a NAS-down boot from hanging; the backup service's
# RequiresMountsFor pulls it on demand. Opt-in via immich_backup_nfs_enabled.
- name: Mount the offsite backup NFS export
  ansible.posix.mount:
    path: "{{ immich_backup_mountpoint }}"
    src: "{{ immich_backup_nfs_server }}:{{ immich_backup_nfs_export }}"
    fstype: nfs4
    opts: "{{ immich_backup_nfs_options }}"
    state: mounted
  when:
    - not (immich_skip_install | default(false))
    - immich_backup_nfs_enabled | default(false)
  tags:
    - molecule-notest

- name: Ensure the node_exporter textfile collector directory exists
  ansible.builtin.file:
    path: "{{ immich_backup_metrics_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The metric-writing logic is the shared write_prom_metrics helper (deployed by
# compose_app); immich-backup-run.sh sources it.
- name: Deploy the shared backup-metrics helper library
  ansible.builtin.include_role:
    name: compose_app
    tasks_from: backup_lib.yml
  vars:
    compose_app_skip_install: "{{ immich_skip_install | default(false) }}"
    compose_app_backup_lib_dest: "{{ immich_backup_lib_path }}"
    compose_app_backup_size_help_object: "database dump"

- name: Deploy the Immich backup wrapper (pg_dump + freshness metric)
  ansible.builtin.template:
    src: immich-backup-run.sh.j2
    dest: /usr/local/sbin/immich-backup-run.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy the Immich backup service unit
  ansible.builtin.template:
    src: immich-backup.service.j2
    dest: /etc/systemd/system/immich-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Deploy the Immich backup timer
  ansible.builtin.template:
    src: immich-backup.timer.j2
    dest: /etc/systemd/system/immich-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers so the backup timer unit is loaded before enabling
  ansible.builtin.meta: flush_handlers

- name: Enable and start the Immich backup timer
  ansible.builtin.systemd:
    name: immich-backup.timer
    enabled: true
    state: started
  when: not (immich_skip_install | default(false))
