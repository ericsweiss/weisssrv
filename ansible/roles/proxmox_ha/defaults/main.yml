---
# Default configuration for Proxmox HA

# HA resources define which VMs/containers are managed by HA; ha_rules pin
# their home/fallback nodes. Maintained examples (and the authoritative live
# set): group_vars/all.yml `ha_resources` / `ha_rules` / `storage_replication_jobs`.

# All three managed variables default to empty lists (tasks guard every read
# with `| default([])` / `is defined`, but defaulting them here keeps the three
# consistent and matches the README).
ha_resources: []
ha_rules: []
storage_replication_jobs: []
