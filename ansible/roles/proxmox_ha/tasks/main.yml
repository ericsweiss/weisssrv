---
# Proxmox VE High Availability management (Proxmox 9+)
# Manages HA rules, resources, and ZFS replication

- name: Ensure we're running on a Proxmox VE cluster
  ansible.builtin.assert:
    that:
      - inventory_hostname in groups['proxmox'] | default([])
    fail_msg: "This role can only run on Proxmox VE hosts"
  tags: [proxmox_ha]

- name: Check if Proxmox cluster is configured
  ansible.builtin.command: pvecm status
  become: true
  register: cluster_status
  changed_when: false
  failed_when: false
  check_mode: false  # Must run even in check mode to validate cluster state
  tags: [proxmox_ha]

- name: Parse quorum status from cluster output
  ansible.builtin.set_fact:
    # Extract the quorum status value from pvecm output
    # The output format is: "Quorate:          Yes" (with variable whitespace)
    # Find the line, split on colon, take the value part
    cluster_quorate: >-
      {{
        (cluster_status.stdout_lines
        | select('search', 'Quorate:')
        | first
        | default('Quorate:'))
        .split(':')[1]
        | trim
      }}
  when: cluster_status.rc == 0
  tags: [proxmox_ha]

- name: Ensure Proxmox cluster exists and is quorate
  ansible.builtin.assert:
    that:
      - cluster_status.rc == 0
      - cluster_quorate | default('') | lower == 'yes'
    fail_msg: |
      Proxmox cluster is not configured or not quorate.
      Cluster command return code: {{ cluster_status.rc }}
      Quorum status: {{ cluster_quorate | default('unknown') }}

      HA operations require a quorate cluster (majority of nodes online).
      Check cluster health with: pvecm status
  tags: [proxmox_ha]

- name: Manage HA rules (node-affinity)
  ansible.builtin.include_tasks: rules.yml
  when: ha_rules is defined and ha_rules | length > 0
  tags: [proxmox_ha, proxmox_ha_rules]

- name: Manage HA groups
  ansible.builtin.include_tasks: groups.yml
  when: ha_groups is defined and ha_groups | length > 0
  tags: [proxmox_ha, proxmox_ha_groups]

- name: Manage HA resources
  ansible.builtin.include_tasks: resources.yml
  when: ha_resources is defined and ha_resources | length > 0
  tags: [proxmox_ha, proxmox_ha_resources]

# Note: Storage replication is NOT included here.
# The playbook (playbooks/proxmox-ha.yml) has a dedicated second play that
# runs replication on source nodes directly via tasks_from: replication.
# Including replication.yml here would cause duplicate execution.
