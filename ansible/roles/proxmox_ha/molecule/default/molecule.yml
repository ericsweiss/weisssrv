---
# Scenario overrides; shared config in ansible/molecule/base.yml (ansible/TESTING.md).
platforms:
  - name: proxmox-ha-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
    groups:
      - proxmox
provisioner:
  playbooks:
    prepare: prepare.yml
  inventory:
    group_vars:
      all:
        ha_rules: []
        storage_replication_jobs: []
        ha_resources: []
  config_options:
    defaults:
      remote_tmp: /tmp/ansible-tmp
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
