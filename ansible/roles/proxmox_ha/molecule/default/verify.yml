---
# Contract verify: assert the role issued exactly the right Proxmox CLI
# mutations for absent / already-correct / drifted HA resources and for an
# absent ZFS replication job, using the logged stub invocations from converge.
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Sanity — the role still queries cluster status (quorate gate)
      ansible.builtin.command: pvecm status
      register: pvecm_check
      changed_when: false

    - name: Pvecm reports quorate
      ansible.builtin.assert:
        that:
          - "'Quorate:          Yes' in pvecm_check.stdout"

    - name: Load HA contract artifact
      ansible.builtin.slurp:
        src: /tmp/molecule-results/ha-contract.json
      register: ha_artifact

    - name: Decode HA contract artifact
      ansible.builtin.set_fact:
        ha: "{{ ha_artifact.content | b64decode | from_json }}"

    # (a) An absent resource must be created via `ha-manager add` and must NOT
    #     be `set` (nothing exists to update yet).
    - name: A — absent resource triggers exactly one `ha-manager add` and no `set`
      ansible.builtin.assert:
        that:
          - ha.a_add == 1
          - ha.a_set == 0
        fail_msg: "Expected add=1/set=0 for absent resource, got add={{ ha.a_add }}/set={{ ha.a_set }}"

    # (b) An already-correct resource is the idempotency contract: NO `set`
    #     (and no `add`, since it already exists). This is the no-churn case.
    - name: B — already-correct resource triggers NO `ha-manager set` (idempotent)
      ansible.builtin.assert:
        that:
          - ha.b_set == 0
          - ha.b_add == 0
        fail_msg: "Expected add=0/set=0 for matching resource, got add={{ ha.b_add }}/set={{ ha.b_set }}"

    # (c) A drifted resource (state started -> stopped) must be corrected with
    #     exactly one `ha-manager set` and no `add`.
    - name: C — drifted resource triggers exactly one `ha-manager set` and no `add`
      ansible.builtin.assert:
        that:
          - ha.c_set == 1
          - ha.c_add == 0
        fail_msg: "Expected add=0/set=1 for drifted resource, got add={{ ha.c_add }}/set={{ ha.c_set }}"

    # (d) An absent replication job whose source VM resides locally must be
    #     created via `pvesr create-local-job` (and not `update`).
    - name: D — absent replication job is created via `pvesr create-local-job`
      ansible.builtin.assert:
        that:
          - ha.d_create == 1
          - ha.d_update == 0
        fail_msg: "Expected create=1/update=0 for absent job, got create={{ ha.d_create }}/update={{ ha.d_update }}"

    # (j) REAL target drift (desired target set differs) with the VM local:
    #     the stale job is deleted and recreated on the correct target.
    - name: J — target drift with VM local triggers exactly one delete + one create
      ansible.builtin.assert:
        that:
          - ha.j_delete == 1
          - ha.j_create == 1
        fail_msg: "Expected delete=1/create=1 for target drift (VM local), got delete={{ ha.j_delete }}/create={{ ha.j_create }}"

    # (k) Target drift with the VM NOT local: the live job must never be
    #     deleted (recreation is impossible here — deleting would silently
    #     drop a replication target). Warning only.
    - name: K — target drift with VM not local triggers NO delete and NO create
      ansible.builtin.assert:
        that:
          - ha.k_delete == 0
          - ha.k_create == 0
        fail_msg: "Expected delete=0/create=0 for target drift (VM not local), got delete={{ ha.k_delete }}/create={{ ha.k_create }}"

    # (l) Permuted job-ID<->target assignments with an identical target set
    #     (post-migration state) are NOT drift: zero mutations, or every
    #     `task proxmox:ha` run would force full ZFS resyncs.
    - name: L — permuted IDs with matching target set trigger NO mutations
      ansible.builtin.assert:
        that:
          - ha.l_delete == 0
          - ha.l_create == 0
          - ha.l_update == 0
        fail_msg: "Expected delete=0/create=0/update=0 for permuted target set, got delete={{ ha.l_delete }}/create={{ ha.l_create }}/update={{ ha.l_update }}"

    # (m) An orphaned job (on this node but absent from config) is warned
    #     about, never deleted — orphan cleanup is deliberately manual.
    - name: M — orphaned job triggers warning only, NO mutations
      ansible.builtin.assert:
        that:
          - ha.m_delete == 0
          - ha.m_create == 0
          - ha.m_update == 0
        fail_msg: "Expected delete=0/create=0/update=0 with an orphan present, got delete={{ ha.m_delete }}/create={{ ha.m_create }}/update={{ ha.m_update }}"

    # (e) An already-correct node-affinity rule is the rule idempotency contract:
    #     PVE9 returns nodes/resources as hashes, so the drift comparison must
    #     normalise them — no `rules set` (and no `rules add`, it already exists).
    - name: E — already-correct node-affinity rule triggers NO `rules set` (idempotent)
      ansible.builtin.assert:
        that:
          - ha.e_set == 0
          - ha.e_add == 0
        fail_msg: "Expected rules add=0/set=0 for matching rule, got add={{ ha.e_add }}/set={{ ha.e_set }}"

    # (f) A drifted node-affinity rule (a node removed) must be corrected with
    #     exactly one `rules set`.
    - name: F — drifted node-affinity rule triggers exactly one `rules set`
      ansible.builtin.assert:
        that:
          - ha.f_set == 1
        fail_msg: "Expected rules set=1 for drifted rule, got set={{ ha.f_set }}"

    # (e2) Already-correct rule with EXPLICIT node priorities (real inventory
    #      shape) must be idempotent: NO `rules set`/`add`. Proves the role
    #      preserves "node:priority" instead of churning it back to ":0".
    - name: E2 — already-correct prioritised rule triggers NO `rules set` (idempotent)
      ansible.builtin.assert:
        that:
          - ha.e2_set == 0
          - ha.e2_add == 0
        fail_msg: "Expected rules add=0/set=0 for matching prioritised rule, got add={{ ha.e2_add }}/set={{ ha.e2_set }}"

    # (g/h/i) Each non-node drift dimension (strict, comment, resources) must
    #         independently trigger exactly one `rules set`.
    - name: G — strict drift triggers exactly one `rules set`
      ansible.builtin.assert:
        that:
          - ha.g_set == 1
        fail_msg: "Expected rules set=1 for strict drift, got set={{ ha.g_set }}"

    - name: H — comment drift triggers exactly one `rules set`
      ansible.builtin.assert:
        that:
          - ha.h_set == 1
        fail_msg: "Expected rules set=1 for comment drift, got set={{ ha.h_set }}"

    - name: I — resource drift triggers exactly one `rules set`
      ansible.builtin.assert:
        that:
          - ha.i_set == 1
        fail_msg: "Expected rules set=1 for resource drift, got set={{ ha.i_set }}"
