---
# Default variables for adguard_home role

adguard_user: adguard
adguard_group: adguard
adguard_install_path: /opt/AdGuardHome
adguard_http_port: 3000
adguard_dns_port: 53
adguard_dot_port: 853
adguard_https_port: 443
adguard_admin_user: eric

# Skip API configuration (useful for integration tests)
skip_adguard_api_config: false

# Use PrivateTmp in systemd service (disable for Docker containers)
# Docker containers may have issues with PrivateTmp causing container crashes
adguard_use_private_tmp: true

# Use ProtectSystem=strict in systemd service (disable for Docker containers)
# Docker containers may crash when systemd creates private mounts over system directories
adguard_use_protect_system: true

adguard_tls_enabled: true
adguard_tls_server_name: "dns.esweiss.com"
adguard_cert_path: "{{ adguard_install_path }}/certs"

# Upstream DNS (local Unbound)
adguard_upstream_dns:
  - "127.0.0.1:5335"
