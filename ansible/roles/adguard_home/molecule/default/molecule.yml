---
# Per-role Molecule scenario. Shared driver/provisioner/verifier/scenario config
# is inherited from ansible/molecule/base.yml (applied via the `-c` flag in
# test-all-roles.sh and the CI molecule-tests matrix). Only the per-role platform
# and inventory live here (plus role-specific provisioner.env / remote_tmp / a
# custom scenario where needed).
platforms:
  - name: adguard-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    capabilities:
      - NET_ADMIN
      - NET_RAW
    tmpfs:
      - /run
      - /tmp
provisioner:
  inventory:
    group_vars:
      all:
        adguard_home_version: 0.107.71
        adguard_user: adguard
        adguard_group: adguard
        adguard_install_path: /opt/AdGuardHome
        adguard_cert_path: /opt/AdGuardHome/certs
        adguard_http_port: 3000
        adguard_dns_port: 53
        adguard_admin_password: testpassword123
        adguard_protection_enabled: true
        adguard_upstream_dns:
          - 127.0.0.1:5335
        adguard_enable_dnssec: true
        internal_domain: test.local
        skip_ssh_config: true
        skip_dns_config: true
        skip_adguard_api_config: true
        skip_resolv_conf_update: true
        adguard_use_private_tmp: false
        adguard_use_protect_system: false
