---
# AdGuard Home installation and configuration
# Runs as unprivileged user with CAP_NET_BIND_SERVICE

- name: Install python3-passlib for password verification and dnsutils for the DNS probe
  ansible.builtin.apt:
    name:
      - python3-passlib
      # PyYAML backs adguard-admin-hash.py, which parses AdGuardHome.yaml to
      # find the admin's password line instead of pattern-matching for it.
      - python3-yaml
      # dig backs the DNS-resolution verify below; install it here so the role
      # is self-contained rather than relying on the base role having run first.
      - dnsutils
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Check if adguard user exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ adguard_user }}"
  register: adguard_user_check
  failed_when: false

- name: Check if AdGuard Home service exists
  ansible.builtin.stat:
    path: /etc/systemd/system/AdGuardHome.service
  register: adguard_service

- name: Stop AdGuard Home for user creation
  ansible.builtin.service:
    name: AdGuardHome
    state: stopped
  when:
    - adguard_service.stat.exists
    - adguard_user_check.ansible_facts.getent_passwd is not defined or adguard_user_check.ansible_facts.getent_passwd[adguard_user] is not defined
  changed_when: false  # Service stop/start is deployment process, not config drift

- name: Create adguard group
  ansible.builtin.group:
    name: "{{ adguard_group }}"
    system: true
    state: present

- name: Create adguard user
  ansible.builtin.user:
    name: "{{ adguard_user }}"
    group: "{{ adguard_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ adguard_install_path }}"
    create_home: false

- name: Create AdGuard Home directory
  ansible.builtin.file:
    path: "{{ adguard_install_path }}"
    state: directory
    owner: "{{ adguard_user }}"
    group: "{{ adguard_group }}"
    mode: "0755"

- name: Create AdGuard Home certs directory
  ansible.builtin.file:
    path: "{{ adguard_cert_path }}"
    state: directory
    owner: root
    group: "{{ adguard_group }}"
    mode: "2750"  # setgid so new files inherit group

- name: Create AdGuard Home data directory
  ansible.builtin.file:
    path: "{{ adguard_install_path }}/data"
    state: directory
    owner: "{{ adguard_user }}"
    group: "{{ adguard_group }}"
    mode: "0700"

- name: Check if AdGuard Home is installed
  ansible.builtin.stat:
    path: "{{ adguard_install_path }}/AdGuardHome"
  register: adguard_binary

# Version-aware install: detect the running binary's version so bumps to
# adguard_home_version actually upgrade a host already running an older build.
# AdGuardHome --version prints "AdGuard Home, version vX.Y.Z"; pull the bare
# semver to compare against the pin.
- name: Check installed AdGuard Home version
  ansible.builtin.command: "{{ adguard_install_path }}/AdGuardHome --version"
  register: adguard_version_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: adguard_binary.stat.exists

- name: Determine AdGuard Home install need
  ansible.builtin.set_fact:
    # Reinstall when the binary is missing, the probe failed, or the parsed
    # version differs from the pin (no-op when they match -> idempotent).
    adguard_needs_install: >-
      {{ not adguard_binary.stat.exists
         or adguard_version_check.rc | default(1) != 0
         or (adguard_version_check.stdout | default('')
             | regex_search('[0-9]+\.[0-9]+\.[0-9]+') | default('')) != adguard_home_version }}

- name: Set AdGuard Home architecture
  ansible.builtin.set_fact:
    adguard_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Download and install AdGuard Home
  when: adguard_needs_install
  block:
    - name: Download AdGuard Home
      ansible.builtin.get_url:
        url: "https://github.com/AdguardTeam/AdGuardHome/releases/download/v{{ adguard_home_version }}/AdGuardHome_linux_{{ adguard_arch }}.tar.gz"
        # Use upstream filename so get_url's checksum lookup matches an entry in checksums.txt
        dest: "/tmp/AdGuardHome_linux_{{ adguard_arch }}.tar.gz"
        mode: "0644"
        checksum: "sha256:https://github.com/AdguardTeam/AdGuardHome/releases/download/v{{ adguard_home_version }}/checksums.txt"

    - name: Extract AdGuard Home
      ansible.builtin.unarchive:
        src: "/tmp/AdGuardHome_linux_{{ adguard_arch }}.tar.gz"
        dest: /tmp
        remote_src: true

    # On an upgrade the service is already running; stop it before swapping the
    # binary on disk so the replacement is clean (avoids text-file-busy and a
    # stale process serving the old build). The "Ensure AdGuard Home is enabled
    # and running" task below brings it back up on the new binary. Skipped on a
    # fresh install where the unit does not exist yet.
    - name: Stop AdGuard Home for binary upgrade
      ansible.builtin.service:
        name: AdGuardHome
        state: stopped
      when: adguard_service.stat.exists
      changed_when: false  # Service stop/start is deployment process, not config drift

    - name: Install AdGuard Home binary
      ansible.builtin.copy:
        src: /tmp/AdGuardHome/AdGuardHome
        dest: "{{ adguard_install_path }}/AdGuardHome"
        owner: root
        group: root
        mode: "0755"
        remote_src: true

    - name: Cleanup download
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/AdGuardHome_linux_{{ adguard_arch }}.tar.gz"
        - /tmp/AdGuardHome

- name: Deploy AdGuard Home systemd service
  ansible.builtin.template:
    src: adguardhome.service.j2
    dest: /etc/systemd/system/AdGuardHome.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart AdGuardHome

# Flush handlers to ensure systemd daemon reload happens before starting the service.
# On a fresh install, the new unit file won't be visible to systemd until daemon-reload runs.
- name: Flush handlers before starting service
  ansible.builtin.meta: flush_handlers

# The .sig file has been observed with restrictive perms (on dns-02),
# unreadable by the non-root adguard user; failed_when: false because the
# file may legitimately not exist
- name: Ensure AdGuardHome.sig is readable by the adguard user
  ansible.builtin.file:
    path: "{{ adguard_install_path }}/AdGuardHome.sig"
    mode: "0644"
  failed_when: false

- name: Ensure AdGuard Home is enabled and running
  ansible.builtin.systemd:
    name: AdGuardHome
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for AdGuard Home to be ready
  ansible.builtin.wait_for:
    port: "{{ adguard_http_port }}"
    timeout: 60

- name: Check if AdGuard Home config exists (fresh install check)
  ansible.builtin.stat:
    path: "{{ adguard_install_path }}/AdGuardHome.yaml"
  register: adguard_initial_config

# This prevents sending a blank password to the setup wizard
- name: Validate AdGuard admin password is set (for initial setup)
  ansible.builtin.assert:
    that:
      - adguard_admin_password is defined
      - adguard_admin_password | length > 0
    fail_msg: >-
      AdGuard admin password not set. Ensure ADGUARD_ADMIN_PASSWORD is set
      in 1Password and provided via 'op run'. Run: task dns:deploy
    success_msg: "AdGuard admin password is set"
  when: not adguard_initial_config.stat.exists
  no_log: true

# Complete initial setup wizard for fresh installations
# This creates the config file and enables DNS binding
# Without this, AdGuard Home stays in setup mode and won't serve DNS
- name: Complete AdGuard Home initial setup (fresh install only)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ adguard_http_port }}/control/install/configure"
    method: POST
    body_format: json
    body:
      web:
        ip: "0.0.0.0"
        port: "{{ adguard_http_port }}"
      dns:
        ip: "0.0.0.0"
        port: "{{ adguard_dns_port }}"
      username: "{{ adguard_admin_user }}"
      password: "{{ adguard_admin_password }}"
    status_code: 200
  when:
    - not ansible_check_mode
    - not adguard_initial_config.stat.exists
  no_log: true

- name: Wait for AdGuard Home to be ready after initial setup
  ansible.builtin.wait_for:
    port: "{{ adguard_http_port }}"
    timeout: 60
  when: not adguard_initial_config.stat.exists

# Password hash management: Check if existing hash matches password before regenerating
# This prevents unnecessary config rewrites and restarts on every run
# bcrypt generates a different salt each time, so we can't compare hashes directly
- name: Check if AdGuard Home config exists (for password check)
  ansible.builtin.stat:
    path: "{{ adguard_install_path }}/AdGuardHome.yaml"
  register: adguard_config

# Read and write both go through adguard-admin-hash.py, which resolves the
# admin's password line by PARSING the YAML (files/adguard-admin-hash.py has the
# full rationale). The previous pair — `grep '^\s+password:' | tail -1` to read,
# a bare-regexp lineinfile to write — both meant "the last indented password key
# in the file", so a second AdGuard user would have had its hash read and
# overwritten on every deploy while the admin's was never reconciled.
#
# Both invoke the script THROUGH python3 rather than letting `script` execve the
# copy it drops in remote_tmp: remote_tmp can land on a noexec mount — the
# dns-stack scenario points it at a Docker tmpfs /tmp, which Docker mounts noexec
# by default — where the +x bit `script` sets still yields rc=126. Naming the
# interpreter only reads the file, so it works either way.
- name: Read existing password hash from config
  ansible.builtin.script: adguard-admin-hash.py --config {{ adguard_install_path }}/AdGuardHome.yaml --user {{ adguard_admin_user }} read
  args:
    executable: python3
  register: existing_hash_result
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - not (skip_adguard_api_config | default(false))
    - adguard_config.stat.exists
  no_log: true

# Deferred and re-raised for the same reason as the write below: no_log would
# otherwise collapse the script's distinct errors into "output has been hidden".
# A swallowed read is not benign — it leaves stdout empty, which skips the
# verify, re-salts the hash, and so rewrites the config and restarts the resolver
# on every single run.
- name: Surface an admin-password-hash read failure
  ansible.builtin.fail:
    msg: >-
      adguard-admin-hash.py read failed on {{ inventory_hostname }}
      (rc={{ existing_hash_result.rc | default('?') }}):
      {{ existing_hash_result.stderr | default('') | trim
         | default('no stderr captured', true) }}
  when:
    - not (skip_adguard_api_config | default(false))
    - adguard_config.stat.exists
    - existing_hash_result.rc | default(0) != 0

- name: Verify existing hash against password
  ansible.builtin.shell: |
    python3 -c "
    import os
    try:
        from passlib.hash import bcrypt
        password = os.environ['ADGUARD_PASSWORD']
        hash_value = os.environ['ADGUARD_HASH']
        if bcrypt.verify(password, hash_value):
            print('valid')
        else:
            print('invalid')
    except Exception:
        print('error')
    "
  args:
    executable: /bin/bash
  environment:
    ADGUARD_PASSWORD: "{{ adguard_admin_password }}"
    ADGUARD_HASH: "{{ existing_hash_result.stdout | trim }}"
  register: hash_verify_result
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - not (skip_adguard_api_config | default(false))
    - adguard_admin_password is defined
    - adguard_admin_password | length > 0
    - existing_hash_result.stdout is defined
    - existing_hash_result.stdout | trim | length > 0
    - existing_hash_result.stdout | trim is match('^\$2[aby]\$')
  no_log: true

- name: Set password hash validity
  ansible.builtin.set_fact:
    password_hash_valid: "{{ (hash_verify_result.stdout | default('') | trim == 'valid') | bool }}"
  when:
    - not (skip_adguard_api_config | default(false))
    - hash_verify_result is defined

# Generate bcrypt hash from password at deploy time
# Only regenerate if: no existing hash, hash is invalid, or verification failed
# Uses passlib on target host (installed as prerequisite) to avoid controller dependency
- name: Generate bcrypt hash from admin password
  ansible.builtin.shell: |
    python3 -c "
    import os
    from passlib.hash import bcrypt
    password = os.environ['ADGUARD_PASSWORD']
    print(bcrypt.using(rounds=10).hash(password))
    "
  args:
    executable: /bin/bash
  environment:
    ADGUARD_PASSWORD: "{{ adguard_admin_password }}"
  register: generated_hash_result
  changed_when: false
  check_mode: false
  when:
    - not (skip_adguard_api_config | default(false))
    - adguard_admin_password is defined
    - adguard_admin_password | length > 0
    - not (password_hash_valid | default(false) | bool)
  no_log: true

- name: Set generated password hash fact
  ansible.builtin.set_fact:
    adguard_admin_password_hash: "{{ generated_hash_result.stdout | trim }}"
  when:
    - not (skip_adguard_api_config | default(false))
    - generated_hash_result.stdout is defined
    - generated_hash_result.stdout | length > 0
  no_log: true

# If existing hash is valid, use it instead of generating a new one
- name: Use existing valid password hash
  ansible.builtin.set_fact:
    adguard_admin_password_hash: "{{ existing_hash_result.stdout | trim }}"
  when:
    - not (skip_adguard_api_config | default(false))
    - password_hash_valid | default(false) | bool
  no_log: true

- name: Validate AdGuard admin password hash is available
  ansible.builtin.assert:
    that:
      - adguard_admin_password_hash is defined
      - adguard_admin_password_hash | length > 0
      - adguard_admin_password_hash is match('^\$2[aby]\$')
    fail_msg: "Failed to generate AdGuard admin password hash! Ensure ADGUARD_ADMIN_PASSWORD is set in 1Password."
    success_msg: "AdGuard admin password hash validated"
  when: not (skip_adguard_api_config | default(false))

- name: Update admin password in AdGuard Home config
  ansible.builtin.script: adguard-admin-hash.py --config {{ adguard_install_path }}/AdGuardHome.yaml --user {{ adguard_admin_user }} write
  args:
    executable: python3
  environment:
    # Env, not a script argument, so the hash never reaches
    # adguard-admin-hash.py's OWN argv (where it would sit in
    # /proc/<pid>/cmdline for anyone on the box, and in any crash/trace of it).
    # It is NOT invisible: ansible.builtin.script prefixes the assignment onto
    # the command string it hands the remote shell (plugins/action/script.py
    # joins _compute_environment_string with the command), so the wrapping
    # `sh -c` argv carries it for the length of the run — which is also why
    # no_log below is not optional.
    ADGUARD_HASH: "{{ adguard_admin_password_hash }}"
  register: adguard_hash_write_result
  # The script rewrites only the admin's line and re-parses the result before
  # committing it, so a real change is the only path to CHANGED — and therefore
  # the only path to a restart of the resolver. Compared exactly, NOT with the
  # `'CHANGED' in ...` idiom the rest of the repo uses: this script's negative
  # verdict is UNCHANGED, which contains CHANGED, so `in` matches both.
  changed_when: adguard_hash_write_result.stdout | default('') | trim == 'CHANGED'
  when:
    - adguard_config.stat.exists
    - not (skip_adguard_api_config | default(false))
  notify: Restart AdGuardHome
  # no_log because the hash is in this task's `environment`, which Ansible does
  # render into the verbose exec line. It costs nothing here — the script's own
  # stdout is only CHANGED/UNCHANGED — but it would otherwise reduce all five of
  # the script's distinct exit-1 conditions (user absent, duplicate users, no
  # password key, multi-line scalar, post-write verification failed) to "the
  # output has been hidden", on the host the whole LAN resolves through. So the
  # failure is deferred and re-raised by the next task, which prints the
  # script's stderr; none of its ERROR messages contain the hash.
  no_log: true
  failed_when: false
  # Serialize execution to prevent Docker exec race conditions in test containers
  throttle: 1

- name: Surface an admin-password-hash rewrite failure
  ansible.builtin.fail:
    msg: >-
      adguard-admin-hash.py write failed on {{ inventory_hostname }}
      (rc={{ adguard_hash_write_result.rc | default('?') }}):
      {{ adguard_hash_write_result.stderr | default('') | trim
         | default('no stderr captured', true) }}
  when:
    - adguard_config.stat.exists
    - not (skip_adguard_api_config | default(false))
    - adguard_hash_write_result.rc | default(0) != 0

# The rewrite preserves the file's existing mode/ownership rather than asserting
# it (the lineinfile it replaced set both inline); keep the assertion here so a
# config left world-readable by AdGuard or an operator is still corrected.
- name: Enforce ownership and mode on the AdGuard Home config
  ansible.builtin.file:
    path: "{{ adguard_install_path }}/AdGuardHome.yaml"
    owner: "{{ adguard_user }}"
    group: "{{ adguard_group }}"
    mode: "0600"
  when:
    - adguard_config.stat.exists
    - not (skip_adguard_api_config | default(false))

# Brief pause after config update to stabilize Docker exec interface
# This prevents race conditions when multiple containers modify configs concurrently
- name: Stabilize after config update
  ansible.builtin.pause:
    seconds: 1
  when:
    - adguard_config.stat.exists
    - ansible_connection == "docker"

# Flush handlers to ensure AdGuard Home is fully restarted before API configuration
# This is critical because the password update above triggers a restart
# Note: The Restart AdGuardHome handler includes a built-in sleep for container stability
- name: Flush handlers before API configuration
  ansible.builtin.meta: flush_handlers

# Wait for AdGuard Home to be ready after any restarts
- name: Wait for AdGuard Home to be ready before API configuration
  ansible.builtin.wait_for:
    port: "{{ adguard_http_port }}"
    timeout: 60
  when: not ansible_check_mode

# Configure base settings via API (ALL DNS hosts)
# Manages upstream DNS (Unbound), TLS, and other core settings
# This MUST run on all hosts to ensure DNS works before verification
# DNS rewrites and filtering rules are synced from dns-01 via adguardhome-sync
- name: Configure base AdGuard Home settings via API
  ansible.builtin.include_tasks: api_base_config.yml
  when:
    - not (skip_adguard_api_config | default(false))

# Configure DNS rewrites and filtering rules via API (dns-01 only)
# dns-02 will sync automatically via adguardhome-sync
- name: Configure DNS rewrites and filtering rules via API
  ansible.builtin.include_tasks: api_config.yml
  when:
    - inventory_hostname == 'dns-01'
    - not (skip_adguard_api_config | default(false))

# Verify AdGuard Home can resolve DNS before updating resolv.conf
# This must succeed with actual DNS results (not just rc=0) before we switch resolv.conf
# Skip in molecule tests - Docker containers can't replace bind-mounted resolv.conf
# Note: Use -4 to force IPv4 since IPv6 responses would fail the regex validation
- name: Verify AdGuard Home DNS resolution is working
  ansible.builtin.command:
    cmd: dig -4 @127.0.0.1 google.com +short +time=5
  register: adguard_dns_test
  changed_when: false
  retries: 5
  delay: 3
  until:
    - adguard_dns_test.rc == 0
    - adguard_dns_test.stdout | length > 0
    - adguard_dns_test.stdout is regex('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+')
  when:
    - not ansible_check_mode
    - not (skip_resolv_conf_update | default(false))

- name: Display DNS verification result
  ansible.builtin.debug:
    msg: "DNS verification successful - resolved google.com to: {{ adguard_dns_test.stdout | default('N/A') }}"
  when:
    - not ansible_check_mode
    - not (skip_resolv_conf_update | default(false))

# Update resolv.conf to use localhost now that AdGuard Home is verified working
# Architecture: resolv.conf -> AdGuard Home (53) -> Unbound (5335) -> Internet (DoT)
# Skip in molecule tests - Docker containers have resolv.conf as a bind mount that can't be replaced
# The shared resolv_conf role (invoked below with resolv_conf_immutable: true)
# owns the chattr -i/+i wrap, stuck-flag verification, and the
# unprivileged-container warning path.
# Override host_dns_servers to use localhost
# This must use set_fact (not task-level vars) to ensure the template module
# uses the correct value when computing the destination file checksum
- name: Set DNS to localhost for resolv.conf update
  ansible.builtin.set_fact:
    host_dns_servers:
      - "127.0.0.1"
  when:
    - not ansible_check_mode
    - not (skip_resolv_conf_update | default(false))

- name: Update resolv.conf to use localhost for DNS
  ansible.builtin.include_role:
    name: resolv_conf
  vars:
    resolv_conf_immutable: true
  when:
    - not ansible_check_mode
    - not (skip_resolv_conf_update | default(false))

- name: Display resolv.conf update status
  ansible.builtin.debug:
    msg: "resolv.conf updated to use localhost (127.0.0.1): {{ resolv_conf_result.changed | default(false) }}"
  when:
    - not ansible_check_mode
    - not (skip_resolv_conf_update | default(false))

- name: Verify resolv.conf content
  ansible.builtin.command:
    cmd: cat /etc/resolv.conf
  register: resolv_conf_content
  changed_when: false
  when:
    - not ansible_check_mode
    - not (skip_resolv_conf_update | default(false))

- name: Display final resolv.conf
  ansible.builtin.debug:
    msg: "Final /etc/resolv.conf:\n{{ resolv_conf_content.stdout }}"
  when:
    - not ansible_check_mode
    - not (skip_resolv_conf_update | default(false))

- name: Display resolv.conf skip notice (molecule test)
  ansible.builtin.debug:
    msg: "Skipping resolv.conf update - Docker containers have resolv.conf as a bind mount"
  when: skip_resolv_conf_update | default(false)
