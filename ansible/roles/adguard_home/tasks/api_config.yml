---
# AdGuard Home API-based configuration management
# Manages DNS rewrites and custom filtering rules via REST API
# Ensures DNS records match codified state (adds missing, removes orphaned)
#
# NOTE: API tasks are skipped in check mode since we cannot query/modify
# the running AdGuard Home instance during dry-run

- name: Skip API configuration in check mode
  ansible.builtin.debug:
    msg: "Skipping AdGuard Home API configuration in check mode (cannot query live API)"
  when: ansible_check_mode

- name: Get existing DNS rewrites
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ adguard_http_port }}/control/rewrite/list"
    method: GET
    user: "{{ adguard_admin_user }}"
    password: "{{ adguard_admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: existing_rewrites
  no_log: true
  when: not ansible_check_mode

- name: Build list of codified domains
  ansible.builtin.set_fact:
    codified_domains: "{{ adguard_rewrites | map(attribute='domain') | list }}"
  when: not ansible_check_mode

- name: Delete DNS rewrites not in codified list
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ adguard_http_port }}/control/rewrite/delete"
    method: POST
    user: "{{ adguard_admin_user }}"
    password: "{{ adguard_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      domain: "{{ item.domain }}"
      answer: "{{ item.answer }}"
    status_code: 200
  loop: "{{ existing_rewrites.json | default([]) }}"
  when:
    - not ansible_check_mode
    - item.domain not in codified_domains
  no_log: true
  register: deleted_rewrites

- name: Build list of codified domain-answer pairs
  ansible.builtin.set_fact:
    codified_pairs: >-
      {{ adguard_rewrites | map('combine', {}) |
         map('dict2items') |
         map('selectattr', 'key', 'in', ['domain', 'answer']) |
         map('items2dict') |
         list }}
  when: not ansible_check_mode

- name: Delete DNS rewrites with incorrect answer (for update)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ adguard_http_port }}/control/rewrite/delete"
    method: POST
    user: "{{ adguard_admin_user }}"
    password: "{{ adguard_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      domain: "{{ item.domain }}"
      answer: "{{ item.answer }}"
    status_code: 200
  loop: "{{ existing_rewrites.json | default([]) }}"
  when:
    - not ansible_check_mode
    # Only delete if domain is in codified list (we want to manage it)
    - item.domain in codified_domains
    # But this specific (domain, answer) pair is not in codified list (it's stale/wrong)
    - codified_pairs | selectattr('domain', 'equalto', item.domain) |
      selectattr('answer', 'equalto', item.answer) | list | length == 0
  no_log: true
  register: updated_rewrites_deleted

- name: Refresh existing DNS rewrites after deletions
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ adguard_http_port }}/control/rewrite/list"
    method: GET
    user: "{{ adguard_admin_user }}"
    password: "{{ adguard_admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: existing_rewrites_refreshed
  no_log: true
  when: not ansible_check_mode

- name: Add missing or updated DNS rewrites
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ adguard_http_port }}/control/rewrite/add"
    method: POST
    user: "{{ adguard_admin_user }}"
    password: "{{ adguard_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      domain: "{{ item.domain }}"
      answer: "{{ item.answer }}"
    status_code: 200
  loop: "{{ adguard_rewrites }}"
  when:
    - not ansible_check_mode
    # Use refreshed data to check if entry already exists
    - >
      existing_rewrites_refreshed.json | default([]) |
      selectattr('domain', 'equalto', item.domain) |
      selectattr('answer', 'equalto', item.answer) |
      list |
      length == 0
  no_log: true
  register: added_rewrites

- name: Get existing custom filtering rules
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ adguard_http_port }}/control/filtering/status"
    method: GET
    user: "{{ adguard_admin_user }}"
    password: "{{ adguard_admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: filtering_status
  no_log: true
  when: not ansible_check_mode

- name: Get current user rules
  ansible.builtin.set_fact:
    current_user_rules: "{{ filtering_status.json.user_rules | default([]) }}"
  when: not ansible_check_mode

- name: Update custom filtering rules to match codified state
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ adguard_http_port }}/control/filtering/set_rules"
    method: POST
    user: "{{ adguard_admin_user }}"
    password: "{{ adguard_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      rules: "{{ adguard_user_rules }}"
    status_code: 200
  when:
    - not ansible_check_mode
    - current_user_rules != adguard_user_rules
  no_log: true
  register: rules_updated

- name: Display DNS rewrite summary
  ansible.builtin.debug:
    msg:
      - >-
        DNS rewrites added:
        {{ (added_rewrites.results | default([]) | selectattr('changed', 'defined') |
        selectattr('changed', 'equalto', true) | list | length) if not ansible_check_mode else 'N/A (check mode)' }}
      - >-
        DNS rewrites deleted:
        {{ (deleted_rewrites.results | default([]) | selectattr('changed', 'defined') |
        selectattr('changed', 'equalto', true) | list | length) if not ansible_check_mode else 'N/A (check mode)' }}
      - >-
        Custom filtering rules updated:
        {{ rules_updated.changed | default(false) if not ansible_check_mode else 'N/A (check mode)' }}
