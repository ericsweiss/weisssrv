---
# Per-role Molecule scenario. Shared driver/provisioner/verifier/scenario config
# is inherited from ansible/molecule/base.yml (applied via the `-c` flag in
# test-all-roles.sh and the CI molecule-tests matrix). Only the per-role platform
# and inventory live here (plus role-specific provisioner.env / remote_tmp / a
# custom scenario where needed).
platforms:
  - name: proxmox-vm-test
    image: registry.git.ericsweiss.com/eric/weisssrv/molecule-test:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    stop_signal: SIGRTMIN+3
    tty: true
    tmpfs:
      - /run
provisioner:
  env:
    SSH_PUBLIC_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAITESTKEYDONOTUSE molecule@test
  inventory:
    host_vars:
      proxmox-vm-test:
        proxmox_role: nas
    group_vars:
      all:
        proxmox_vm_skip_create: true
        proxmox_storage_defaults:
          nas: ssd
          compute: local-ssd
          general: local-ssd
        proxmox_resource_pools:
          - infra-core
          - apps-public
          - platform
          - apps-private
  config_options:
    defaults:
      remote_tmp: /tmp/ansible-tmp
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
