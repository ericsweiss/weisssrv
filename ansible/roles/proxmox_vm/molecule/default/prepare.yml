---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for systemd
      ansible.builtin.raw: |
        for i in $(seq 1 30); do
          if systemctl is-system-running 2>/dev/null | grep -qE '(running|degraded)'; then
            exit 0
          fi
          sleep 1
        done
        systemctl status >/dev/null 2>&1 && exit 0
        exit 1
      changed_when: false
      retries: 3
      delay: 2
      register: systemd_ready
      until: systemd_ready.rc == 0

    - name: Disable apt background services
      ansible.builtin.raw: |
        systemctl stop apt-daily.timer 2>/dev/null || true
        systemctl stop apt-daily-upgrade.timer 2>/dev/null || true
        exit 0
      changed_when: false

    - name: Ensure ansible temp directory exists
      ansible.builtin.raw: |
        mkdir -p /root/.ansible/tmp && chmod 700 /root/.ansible/tmp
      changed_when: false

    - name: Stub state directory
      ansible.builtin.file:
        path: /tmp/molecule-stub-state
        state: directory
        mode: "0755"
      become: true

    - name: Default stubs to "VM does not exist"
      ansible.builtin.copy:
        dest: /tmp/molecule-stub-state/vm_exists_state
        content: "missing\n"
        mode: "0644"
      become: true

    - name: Install pvesh stub (cluster resources + pool create/get)
      ansible.builtin.copy:
        dest: /usr/local/bin/pvesh
        mode: "0755"
        content: |
          #!/bin/bash
          if [[ "$1 $2" == "get /cluster/resources" ]]; then
            if grep -q "^exists$" /tmp/molecule-stub-state/vm_exists_state 2>/dev/null; then
              echo '[{"vmid": 999, "type": "qemu"}]'
            else
              echo '[]'
            fi
            exit 0
          fi
          if [[ "$1" == "get" && "$2" == /pools/* ]]; then exit 1; fi
          exit 0
      become: true

    - name: Install pvesm stub (advertises ssd + local-ssd)
      ansible.builtin.copy:
        dest: /usr/local/bin/pvesm
        mode: "0755"
        content: |
          #!/bin/bash
          echo "Name             Type     Status           Total            Used       Available        %"
          echo "ssd              zfspool  active      4000000000       100000000      3900000000    2.50%"
          echo "local-ssd        zfspool  active      1000000000       100000000       900000000   10.00%"
      become: true

    - name: Install qm stub (records calls, answers `config`)
      ansible.builtin.copy:
        dest: /usr/local/bin/qm
        mode: "0755"
        content: |
          #!/bin/bash
          echo "qm $*" >> /tmp/molecule-stub-state/qm.log
          # The role's firewall reconcile parses `qm config` for the
          # net0 line. Default: NIC already carries firewall=1 (no-op).
          # The override file, when present, supplies the net0 value
          # verbatim so converge can exercise legacy variants (flag
          # missing entirely, or explicit firewall=0).
          if [ "$1" = "config" ]; then
            if [ -f /tmp/molecule-stub-state/vm_net0_override ]; then
              echo "net0: $(cat /tmp/molecule-stub-state/vm_net0_override)"
            else
              echo "net0: virtio=BC:24:11:AA:BB:CC,bridge=vmbr0,firewall=1"
            fi
            # Emit agent/onboot/startup. Defaults match the role defaults so the
            # reconcile tasks see NO drift and stay no-op (existence-guard's
            # zero-mutation invariant). Override files let converge inject drift.
            # NOTE the default startup is "order=100" (NO up=0): mirrors Proxmox
            # dropping the up=0 default from the stored string, so the startup
            # reconcile's normalize-both-sides must treat it as equal to the
            # desired "order=100,up=0" — else it churns every run.
            if [ -f /tmp/molecule-stub-state/vm_agent_override ]; then
              echo "agent: $(cat /tmp/molecule-stub-state/vm_agent_override)"
            else
              echo "agent: enabled=1"
            fi
            if [ -f /tmp/molecule-stub-state/vm_onboot_override ]; then
              echo "onboot: $(cat /tmp/molecule-stub-state/vm_onboot_override)"
            else
              echo "onboot: 1"
            fi
            if [ -f /tmp/molecule-stub-state/vm_startup_override ]; then
              echo "startup: $(cat /tmp/molecule-stub-state/vm_startup_override)"
            else
              echo "startup: order=100"
            fi
            # The additional-disk attach task parses `qm config` for its scsiN
            # line. The override file, when present, supplies the scsi1 value
            # verbatim so converge can simulate a passthrough disk already
            # attached with or without backup=0 (absent => slot not attached).
            if [ -f /tmp/molecule-stub-state/vm_scsi1_override ]; then
              echo "scsi1: $(cat /tmp/molecule-stub-state/vm_scsi1_override)"
            fi
          fi
          exit 0
      become: true

    - name: Install zfs stub (no-op; not exercised in this scenario)
      ansible.builtin.copy:
        dest: /usr/local/bin/zfs
        mode: "0755"
        content: |
          #!/bin/bash
          exit 0
      become: true
