---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Load converge artifacts
      ansible.builtin.slurp:
        src: "/tmp/molecule-results/{{ item }}"
      loop:
        - 01-nas-default.json
        - 02-override.json
        - 03-pool-validation.json
        - 04-pool-list.json
        - 05-existence-guard.json
        - 06-firewall-reconcile.json
        - 07-firewall-zero.json
        - 08-disk-vzdump-backup.json
        - 09-disk-slot-assert.json
        - 10-meta-drift.json
        - 11-windows-guest.json
        - 12-hostpci.json
      register: artifacts

    - name: Decode artifacts
      ansible.builtin.set_fact:
        nas_default: "{{ artifacts.results[0].content | b64decode | from_json }}"
        override: "{{ artifacts.results[1].content | b64decode | from_json }}"
        pool_val: "{{ artifacts.results[2].content | b64decode | from_json }}"
        pool_list: "{{ artifacts.results[3].content | b64decode | from_json }}"
        existence: "{{ artifacts.results[4].content | b64decode | from_json }}"
        fw_reconcile: "{{ artifacts.results[5].content | b64decode | from_json }}"
        fw_zero: "{{ artifacts.results[6].content | b64decode | from_json }}"
        disk_backup: "{{ artifacts.results[7].content | b64decode | from_json }}"
        slot_assert: "{{ artifacts.results[8].content | b64decode | from_json }}"
        meta_drift: "{{ artifacts.results[9].content | b64decode | from_json }}"
        windows: "{{ artifacts.results[10].content | b64decode | from_json }}"
        hostpci: "{{ artifacts.results[11].content | b64decode | from_json }}"

    - name: NAS host defaults to ssd
      ansible.builtin.assert:
        that:
          - nas_default.host_role == 'nas'
          - nas_default.effective_storage == 'ssd'

    - name: Proxmox_storage override beats default
      ansible.builtin.assert:
        that:
          - override.effective_storage == 'local-ssd'

    - name: Missing storage pool fails the role
      ansible.builtin.assert:
        that:
          - pool_val.failed
          - "'nonexistent-pool' in pool_val.msg"

    - name: Non-standard resource_pool is rejected
      ansible.builtin.assert:
        that:
          - pool_list.failed
          - "'not-a-real-pool' in pool_list.msg"

    # The firewall, agent, and startup reconciles are deliberately ungated by
    # the existence check, so read-only `qm config` probes are expected. The
    # guard contract is: no MUTATING qm calls when the VM exists and its NIC
    # already carries firewall=1 and agent/onboot/startup already match.
    - name: Existence guard prevents mutating qm calls when VM already exists
      ansible.builtin.assert:
        that:
          - existence.qm_config_calls >= 1
          - existence.qm_calls == existence.qm_config_calls
          - not existence.reconcile_changed

    - name: Firewall reconcile repairs a legacy NIC with one qm set
      ansible.builtin.assert:
        that:
          - fw_reconcile.repair_calls == 1
          # The repair must be the only mutation: total calls = the
          # config probe(s) + exactly one qm set.
          - fw_reconcile.qm_calls == fw_reconcile.qm_config_calls + 1
          - fw_reconcile.reconcile_changed

    - name: Firewall reconcile replaces firewall=0 without duplicating the key
      ansible.builtin.assert:
        that:
          - fw_zero.repair_calls == 1
          - fw_zero.qm_calls == fw_zero.qm_config_calls + 1
          # The stale firewall=0 must not survive into the qm set
          # argument (would mean append-instead-of-replace).
          - fw_zero.stale_key_in_set == 0
          - fw_zero.reconcile_changed

    # vzdump_backup idempotency on additional (passthrough) disks. The contract:
    # set backup=0 exactly when a vzdump_backup:false disk's state lacks it,
    # no-op when it already matches (critical — no churn on every deploy), and
    # never add backup=0 to a default disk that should stay in vzdump.
    - name: Additional-disk backup=0 is applied + idempotent + scoped to vzdump_backup:false
      ansible.builtin.assert:
        that:
          # 8a: absent disk + vzdump_backup:false -> exactly one backup=0 attach
          - disk_backup.absent_applied_backup0 == 1
          - disk_backup.absent_any_set == 1
          # 8b: attached without backup=0 -> exactly one re-set adding it
          - disk_backup.missing_flag_applied_backup0 == 1
          # 8c: already backup=0 -> NO qm set (the no-churn idempotency case)
          - disk_backup.idempotent_any_set == 0
          # 8d: default disk -> no qm set, and never backup=0
          - disk_backup.default_any_set == 0
          - disk_backup.default_set_with_backup0 == 0
          # 8e: slot on a different live zvol (.../data-old) -> role refuses to
          # remap without allow_remap and issues NO qm set (data-loss guard)
          - disk_backup.remap_refused
          - disk_backup.remap_any_set == 0
          # 8f: same slot WITH allow_remap -> exactly one re-set to the correct
          # EXACT path (proves data-old is not substring-matched for data)
          - disk_backup.allow_remap_reset_to_correct == 1

    - name: Assert scsi_slot rejects duplicate and missing slots
      ansible.builtin.assert:
        that:
          # 8g: two disks sharing scsi_slot:1 -> assert fails (uniqueness)
          - slot_assert.dup_rejected
          # 8h: a disk with no scsi_slot -> assert fails (presence)
          - slot_assert.missing_rejected
          # 8i: scsi_slot 0 (reserved boot disk) -> assert fails (>=1 floor)
          - slot_assert.zero_rejected

    # The agent/onboot/startup reconciles must MUTATE on real drift (existence
    # case 5 already proves the no-op path, incl. the up=0 normalization since the
    # default stub reports `startup: order=100`). Each drift case expects exactly
    # one targeted `qm set`.
    - name: Agent/memory/onboot/startup drift each triggers exactly one qm set
      ansible.builtin.assert:
        that:
          # 7b: agent enabled=0 -> exactly one `qm set --agent 1`
          - meta_drift.agent_set == 1
          # 7b-ii: stub reports memory 4096 against the desired 2048 -> exactly
          #        one `qm set --memory 2048`. Exactly one matters in BOTH
          #        directions: more than one is churn, and ZERO means a hosts.yml
          #        memory change reaches an existing guest through nothing at all
          #        — not a deploy, and not a reboot either, since the guest
          #        restarts against the unchanged config. That silent no-op is
          #        the defect this reconcile exists to close.
          - meta_drift.memory_set == 1
          # 7c: onboot:0 + stale startup -> exactly one combined onboot/startup set
          #     written with the canonical desired `order=100,up=0` string
          - meta_drift.startup_set == 1
          - meta_drift.any_onboot_set == 1

    # The Windows guest path (vm_guest_type: windows) must assemble a full
    # Win11-capable VM and emit NONE of the Linux cloud-init artifacts.
    - name: Windows guest assembles OVMF/TPM/q35 + VirtIO + ISOs, no cloud-init
      ansible.builtin.assert:
        that:
          # Firmware + machine type + ostype in the qm create
          - windows.machine == 1
          - windows.ovmf == 1
          - windows.ostype == 1
          # EFI vars disk + TPM 2.0 + empty SSD-flagged boot disk
          - windows.efidisk == 1
          - windows.tpm == 1
          - windows.bootdisk == 1
          # Install + VirtIO driver CDROMs + std VGA + install-CD-first boot order
          - windows.install_iso == 1
          - windows.virtio_iso == 1
          - windows.vga >= 1
          - windows.bootorder == 1
          # Negative: no Linux cloud-init path, and the VM is left STOPPED
          - windows.cloudinit == 0
          - windows.importdisk == 0
          - windows.ciuser == 0
          - windows.start == 0
