---
# Default VM configuration for Proxmox VMs

# When true, skip cloud-image download + the final SSH-reachability wait_for.
# Lets the role run under molecule against stub `qm`/`pvesh` shims without
# attempting to fetch the real Debian cloud image or wait for SSH on a fake IP.
proxmox_vm_skip_create: false

# Host the post-create SSH-reachability wait_for is delegated to. Defaults to
# localhost (the controller), which works from a LAN-attached runner. Set to
# the Proxmox host (which always shares the VM's bridge) when running from an
# off-LAN/Tailscale controller where the VM's 192.168.0.x is unroutable.
proxmox_vm_ssh_wait_delegate: localhost

# IP address handed to the role's cloud-init + SSH-wait logic. Defaults to
# ansible_host because production inventory routes traffic to each VM via
# that field. Molecule scenarios override this so they can keep ansible_host
# pointing at the docker container (= connection target) while still feeding
# a realistic per-VM IP into the role's cloud-init render.
proxmox_vm_target_ip: "{{ ansible_host }}"

# VM resource defaults
vm_cores: 2
vm_memory: 2048
vm_disk_size: 32G
vm_bridge: vmbr0
vm_ostype: l26
vm_agent_enabled: true

# PCI passthrough (VFIO). A list of Proxmox `hostpci` device specs — each entry
# becomes `--hostpci<index> <entry>` on the create-time `qm set` (Linux guests
# only). Empty by default (no passthrough). CREATE-TIME ONLY: PCI attach needs
# the guest stopped, so this is realized when the VM is first provisioned; an
# already-existing guest is attached by hand in a maintenance window (see the
# task comment + docs/43). The entry is passed verbatim, so it may include
# Proxmox options, e.g.:
#   vm_hostpci:
#     - "0000:01:00"            # whole multifunction device on i440fx (no pcie=1)
#     - "0000:01:00,pcie=1"     # PCIe passthrough on q35
# A passthrough guest cannot live-migrate and its RAM is host-pinned/mlock'd, so
# it must also be pinned (vm_cpu_type: host) and non-ballooned.
vm_hostpci: []
vm_cpu_type: Penryn  # Baseline CPU for live migration across heterogeneous cluster
# Override to 'host' for VMs pinned to a specific node (all k3s and gitlab
# VMs do this) — exposes the full host CPU, e.g. AVX/AVX2 on modern nodes.
# Penryn (SSE3/SSSE3/SSE4.1, NO SSE4.2/AVX) is only needed for guests that
# may live-migrate across the OptiPlex Core 2 Quad Q9650 nodes.

# Cloud image settings
cloud_image_url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2"
cloud_image_name: "debian-13-generic-amd64.qcow2"

# Cloud-init defaults
cloudinit_user: eric
cloudinit_dns:
  - 192.168.0.150
  - 192.168.0.160
cloudinit_gateway: 192.168.0.1

# Guest type
# 'linux'  (default) — the cloud-init Debian path above; every existing VM
#          (k3s nodes, gitlab, …) uses this and is unaffected.
# 'windows' — a full-spec Win11 guest: q35 + OVMF/UEFI + pre-enrolled Secure
#          Boot keys + TPM 2.0 + VirtIO disk/NIC + install & driver CDROMs.
#          The cloud image download/import, cloud-init drive, SSH-key assert,
#          and post-create SSH wait are all skipped. The VM is created STOPPED
#          — the operator installs Windows interactively (see docs/39). Nothing
#          about the config is a "compatibility mode"; the NAS is 12th-gen Intel.
vm_guest_type: linux

# Windows guest knobs (ignored unless vm_guest_type == 'windows').
vm_windows_machine: q35
vm_windows_ostype: win11
# std VGA is the most install-compatible: virtio-gpu needs its driver loaded,
# which isn't available at Windows' first boot. Switch to virtio post-install
# by hand if desired (documented in docs/39).
vm_windows_vga: std

# ISO store used for the install + VirtIO CDROMs. tank-proxmox is the NFS
# storage on the NAS whose content list includes `iso`; its on-host mount is
# /mnt/pve/<id>/template/iso. See host_vars/pve-nas-01.yml (pve_storage).
vm_iso_storage: tank-proxmox
vm_iso_storage_path: "/mnt/pve/{{ vm_iso_storage }}/template/iso"

# Windows 11 install media — downloaded MANUALLY from Microsoft to the ISO
# store (it cannot be redistributed). REQUIRED when vm_guest_type == 'windows';
# the role asserts it is set. Set to the ISO's filename in hosts.yml.
vm_install_iso: ""

# VirtIO driver ISO — DOWNLOADED + checksum-verified by the role (idempotent)
# from the pinned Fedora archive URL. virtio_win_version / virtio_win_checksum
# are pinned centrally in group_vars/all.yml.
vm_virtio_iso: "virtio-win-{{ virtio_win_version }}.iso"
# Double-quoted YAML `\<newline>` is an escaped line-continuation that inserts
# NO character (and trims the next line's leading space), so this wraps cleanly.
virtio_win_url: "https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/archive-virtio/virtio-win-\
  {{ virtio_win_version }}-1/virtio-win-{{ virtio_win_version }}.iso"
