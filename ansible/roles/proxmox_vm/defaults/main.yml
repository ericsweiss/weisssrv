---
# Default VM configuration for Proxmox VMs

# When true, skip cloud-image download + the final SSH-reachability wait_for.
# Lets the role run under molecule against stub `qm`/`pvesh` shims without
# attempting to fetch the real Debian cloud image or wait for SSH on a fake IP.
proxmox_vm_skip_create: false

# IP address handed to the role's cloud-init + SSH-wait logic. Defaults to
# ansible_host because production inventory routes traffic to each VM via
# that field. Molecule scenarios override this so they can keep ansible_host
# pointing at the docker container (= connection target) while still feeding
# a realistic per-VM IP into the role's cloud-init render.
proxmox_vm_target_ip: "{{ ansible_host }}"

# VM resource defaults
vm_cores: 2
vm_memory: 2048
vm_disk_size: 32G
vm_bridge: vmbr0
vm_ostype: l26
vm_agent_enabled: true
vm_cpu_type: Penryn  # Baseline CPU for live migration across heterogeneous cluster
# Override to 'host' per-host for NAS-only VMs that need AVX/AVX2
# Penryn provides SSE3/SSSE3/SSE4.1 - compatible with oldest node:
#   Core 2 Quad Q9650 (pve-opt-03, Penryn arch, NO SSE4.2/AVX)
# Use 'host' for VMs pinned to modern CPUs (pve-nas-01, 12th Gen Intel)

# Cloud image settings
cloud_image_url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2"
cloud_image_storage: local
cloud_image_name: "debian-13-generic-amd64.qcow2"

# Cloud-init defaults
cloudinit_user: eric
cloudinit_dns:
  - 192.168.0.150
  - 192.168.0.160
cloudinit_gateway: 192.168.0.1
