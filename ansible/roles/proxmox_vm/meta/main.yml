---
# Role metadata

galaxy_info:
  # Explicit role_name + namespace so ansible-compat's FQCN derivation
  # doesn't fall back to "<author>.proxmox_vm" (which contains a space
  # and fails the Galaxy name validator since ansible-compat tightened
  # the check). Same reason the sibling proxmox_* roles below carry these.
  role_name: proxmox_vm
  namespace: weisssrv
  author: Eric Weiss
  description: Proxmox VM provisioning with cloud-init and persistent ZFS zvols
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Debian
      versions:
        - trixie

dependencies: []
