---
# Proxmox VM provisioning with cloud-init

- name: Set VM ID
  ansible.builtin.set_fact:
    vm_id: "{{ vmid | default(proxmox_vm_target_ip.split('.')[-1]) }}"

# Storage selection logic: auto-select based on Proxmox host role if not specified
- name: Determine Proxmox host role
  ansible.builtin.set_fact:
    _proxmox_host_role: "{{ hostvars[proxmox_host]['proxmox_role'] | default('compute') }}"

- name: Auto-select storage based on Proxmox host role
  ansible.builtin.set_fact:
    _effective_storage: >-
      {{
        proxmox_storage |
        default(proxmox_storage_defaults[_proxmox_host_role] | default('local-ssd'))
      }}

- name: Display storage selection
  ansible.builtin.debug:
    msg: "VM {{ inventory_hostname }} will use storage: {{ _effective_storage }} (host: {{ proxmox_host }}, role: {{ _proxmox_host_role }})"

- name: Check if VM already exists
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    set -o errexit -o nounset -o pipefail
    # Check cluster-wide — VMs may be HA-migrated to a different node.
    resources_json="$(pvesh get /cluster/resources --type vm --output-format json)"
    python3 -c "import sys,json; vmids=[r['vmid'] for r in json.loads(sys.argv[1])]; sys.exit(0 if {{ vm_id | int }} in vmids else 1)" "$resources_json"
  args:
    executable: /bin/bash
  register: vm_exists
  changed_when: false
  failed_when: vm_exists.rc not in [0, 1]
  check_mode: false

# An existing VM may have HA-migrated off the inventory proxmox_host, so
# reconcile tasks (qm config/set against a live VM) must run on its ACTUAL
# node. Look it up cluster-wide; a not-yet-created VM falls back to
# proxmox_host, where the create path below places it. (Mirrors proxmox_lxc's
# lxc_reconcile_host.)
- name: Look up the existing VM's current node
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.command:
    cmd: pvesh get /cluster/resources --type vm --output-format json
  register: vm_cluster_resources
  changed_when: false
  check_mode: false
  when: vm_exists.rc == 0

- name: Resolve the node to delegate VM reconcile tasks to
  ansible.builtin.set_fact:
    # For an existing VM, resolve its CURRENT node with NO proxmox_host
    # fallback: silently defaulting to proxmox_host could reconcile against
    # the wrong node if the lookup ever returned nothing. The assert below
    # fails loud instead. A not-yet-created VM uses proxmox_host (create path).
    vm_reconcile_host: >-
      {{ (vm_cluster_resources.stdout | from_json
          | selectattr('vmid', 'equalto', vm_id | int)
          | map(attribute='node') | first | default(''))
         if vm_exists.rc == 0 else proxmox_host }}

- name: Fail loud if an existing VM's current node could not be resolved
  ansible.builtin.assert:
    that:
      - vm_reconcile_host | length > 0
    fail_msg: >-
      Could not resolve the current node for existing VM {{ vm_id }}
      from /cluster/resources; refusing to fall back to the inventory
      proxmox_host ({{ proxmox_host }}), which may not hold the VM.
  when: vm_exists.rc == 0

# Verify storage pool exists on target host before proceeding
# Only check when creating a new VM - existing VMs may be on different storage during migrations
- name: Get available storage pools on target host
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.command: pvesm status
  register: storage_list
  changed_when: false
  check_mode: false
  when: vm_exists.rc != 0

- name: Check if required storage pool exists
  ansible.builtin.set_fact:
    _storage_exists: "{{ storage_list.stdout_lines | select('match', '^' + _effective_storage + '\\s') | list | length > 0 }}"
  when: vm_exists.rc != 0

- name: Fail if required storage pool does not exist
  ansible.builtin.fail:
    msg: |
      Storage pool '{{ _effective_storage }}' not found on {{ proxmox_host }}.

      For compute nodes, you must create the local-ssd ZFS pool first.
      See docs/06-zfs.md for pool creation commands.

      Available storage pools on {{ proxmox_host }}:
      {{ storage_list.stdout | default('(unable to retrieve)') }}
  when:
    - vm_exists.rc != 0
    - not _storage_exists | default(true)
    - not ansible_check_mode

# Ensure all standard resource pools exist on the Proxmox host
# With loops + register, changed_when is evaluated per-iteration using the current result
# We use 'item' in the shell command and check stdout for "created" to track changes
- name: Ensure standard resource pools exist
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell:
    cmd: |
      if ! pvesh get /pools/{{ item }} --output-format json 2>/dev/null; then
        pvesh create /pools --poolid {{ item }}
        echo "created"
      else
        echo "exists"
      fi
    executable: /bin/bash
  loop: "{{ proxmox_resource_pools | default([]) }}"
  register: pool_creation_result
  changed_when: "'created' in pool_creation_result.stdout"
  loop_control:
    label: "{{ item }}"
  when:
    - not ansible_check_mode
    - vm_exists.rc != 0
    - proxmox_resource_pools is defined

# Validate that the requested pool is in the allowed list
- name: Validate resource pool is in standard list
  ansible.builtin.fail:
    msg: |
      Resource pool '{{ proxmox_resource_pool }}' is not in the standard pools list.

      Standard pools: {{ proxmox_resource_pools | default([]) | join(', ') }}

      Either use one of the standard pools or add '{{ proxmox_resource_pool }}'
      to proxmox_resource_pools in group_vars/all.yml.
  when:
    - vm_exists.rc != 0
    - proxmox_resource_pool is defined
    - proxmox_resource_pools is defined
    - proxmox_resource_pool not in proxmox_resource_pools

# Only reach out to cloud.debian.org when the image is genuinely missing.
# get_url does a conditional (timestamp) request to the URL even when dest
# already exists, so an unconditional get_url makes every VM provision depend on
# cloud.debian.org being reachable — which fails on this IPv4-only estate when
# the round-robin resolves to an IPv6-only (or egress-filtered) mirror. Stat
# first and skip the download when the image is already staged.
- name: Check whether the cloud image is already staged on the node
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.stat:
    path: "/var/lib/vz/template/iso/{{ cloud_image_name }}"
  register: proxmox_vm_cloud_image
  when:
    - not ansible_check_mode
    - vm_exists.rc != 0
    - not (proxmox_vm_skip_create | default(false))

- name: Download cloud image if not present
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.get_url:
    url: "{{ cloud_image_url }}"
    dest: "/var/lib/vz/template/iso/{{ cloud_image_name }}"
    mode: "0644"
    checksum: "sha512:https://cloud.debian.org/images/cloud/trixie/latest/SHA512SUMS"
  when:
    - not ansible_check_mode
    - vm_exists.rc != 0
    - not (proxmox_vm_skip_create | default(false))
    - not (proxmox_vm_cloud_image.stat.exists | default(false))

- name: Create VM
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    qm create {{ vm_id }} \
      --name {{ inventory_hostname }} \
      --memory {{ vm_memory }} \
      --cores {{ vm_cores }} \
      --cpu {{ vm_cpu_type | default('host') }} \
      --net0 virtio,bridge={{ vm_bridge }},firewall=1 \
      --ostype {{ vm_ostype }} \
      --agent enabled={{ vm_agent_enabled | ternary(1, 0) }}{{ ' --pool ' + proxmox_resource_pool if proxmox_resource_pool is defined else '' }}
  when:
    - not ansible_check_mode
    - vm_exists.rc != 0
  changed_when: true

# Per-guest .fw rules are only enforced when the NIC carries firewall=1;
# reconcile VMs created before the flag was added to qm create above.
- name: Ensure VM NIC has the guest firewall flag
  delegate_to: "{{ vm_reconcile_host }}"
  ansible.builtin.shell: |
    set -euo pipefail
    current=$(qm config {{ vm_id }} | sed -n 's/^net0: //p')
    if [ -n "$current" ] && ! printf '%s' "$current" | grep -Eq '(^|,)firewall=1($|,)'; then
      # Strip any existing firewall=<v> (e.g. firewall=0) first so the
      # repair cannot produce a duplicate key in the net0 string.
      cleaned=$(printf '%s' "$current" | sed -E 's/(^|,)firewall=[^,]*//g' | sed -E 's/^,//')
      qm set {{ vm_id }} --net0 "${cleaned},firewall=1"
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  register: vm_net0_firewall
  changed_when: "'CHANGED' in (vm_net0_firewall.stdout | default(''))"
  when: not ansible_check_mode

- name: Import cloud image disk
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    qm importdisk {{ vm_id }} \
      /var/lib/vz/template/iso/{{ cloud_image_name }} \
      {{ _effective_storage }}
  when:
    - not ansible_check_mode
    - vm_exists.rc != 0
  changed_when: true

- name: Attach disk to VM
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    qm set {{ vm_id }} \
      --scsihw virtio-scsi-pci \
      --scsi0 {{ _effective_storage }}:vm-{{ vm_id }}-disk-0
  when:
    - not ansible_check_mode
    - vm_exists.rc != 0
  changed_when: true

- name: Resize disk
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    qm resize {{ vm_id }} scsi0 {{ vm_disk_size }}
  when:
    - not ansible_check_mode
    - vm_exists.rc != 0
  changed_when: true

- name: Configure cloud-init drive
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    qm set {{ vm_id }} --ide2 {{ _effective_storage }}:cloudinit
  when:
    - not ansible_check_mode
    - vm_exists.rc != 0
  changed_when: true

- name: Configure boot order
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    qm set {{ vm_id }} --boot c --bootdisk scsi0
  when:
    - not ansible_check_mode
    - vm_exists.rc != 0
  changed_when: true

# An empty key would still "provision successfully" — and leave the VM
# unreachable over SSH.
- name: Assert SSH public key is available for cloud-init
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'SSH_PUBLIC_KEY') | length > 0
    fail_msg: >-
      SSH_PUBLIC_KEY is empty. Run via the task wrapper (op run) so
      cloud-init gets an authorized key.
  when:
    - not ansible_check_mode
    - vm_exists.rc != 0
    - not (proxmox_vm_skip_create | default(false))

# Private temp file (mode 0600, random suffix) instead of a guessable
# /tmp/ssh_key_<vmid>.pub — on a shared Proxmox host a predictable path is a
# race/clobber target. Registered so the path flows to qm set and cleanup.
# Stage the key, consume it via `qm set --sshkeys`, then remove it in `always`
# so a failure between staging and consuming never leaves the (public) key file
# behind on the shared Proxmox host. delegate_to/when propagate to all of the
# block's tasks, including the always cleanup.
- name: Stage and consume the cloud-init SSH public key
  delegate_to: "{{ proxmox_host }}"
  when:
    - not ansible_check_mode
    - vm_exists.rc != 0
  block:
    - name: Create private temp file for cloud-init SSH key
      ansible.builtin.tempfile:
        state: file
        prefix: "ssh_key_{{ vm_id }}_"
        suffix: ".pub"
      register: _ci_ssh_key_tmp

    - name: Deploy SSH public key for cloud-init
      ansible.builtin.copy:
        content: "{{ ssh_public_key }}"
        dest: "{{ _ci_ssh_key_tmp.path }}"
        mode: "0600"
      vars:
        ssh_public_key: "{{ lookup('ansible.builtin.env', 'SSH_PUBLIC_KEY') }}"

    - name: Configure cloud-init settings
      ansible.builtin.shell: |
        qm set {{ vm_id }} \
          --ciuser {{ cloudinit_user }} \
          --sshkeys {{ _ci_ssh_key_tmp.path | quote }} \
          --ipconfig0 ip={{ proxmox_vm_target_ip }}/24,gw={{ cloudinit_gateway }} \
          --nameserver "{{ cloudinit_dns | join(' ') }}"
      # Honor skip_create alongside the other create-path tasks (molecule stub).
      when: not (proxmox_vm_skip_create | default(false))
      changed_when: true
  always:
    - name: Clean up the cloud-init SSH key temp file (even on failure)
      ansible.builtin.file:
        path: "{{ _ci_ssh_key_tmp.path }}"
        state: absent
      when:
        - _ci_ssh_key_tmp is defined
        - _ci_ssh_key_tmp.path is defined

# Reconcile the QEMU guest-agent flag on existing VMs too (it's metadata-only —
# controls host-side polling, never touches the running guest). Idempotent:
# re-sets only when live `qm config` differs from the desired flag.
- name: Ensure VM QEMU agent flag matches inventory
  delegate_to: "{{ vm_reconcile_host }}"
  ansible.builtin.shell: |
    set -euo pipefail
    want="{{ vm_agent_enabled | default(true) | ternary(1, 0) }}"
    # `agent:` may be "1", "0", or "enabled=1,..." — extract the leading enabled bit.
    cur=$(qm config {{ vm_id }} | sed -n 's/^agent: //p' | sed -E 's/^enabled=//; s/,.*$//')
    cur=${cur:-0}
    if [ "$cur" != "$want" ]; then
      qm set {{ vm_id }} --agent "$want"
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  register: vm_agent_reconcile
  changed_when: "'CHANGED' in (vm_agent_reconcile.stdout | default(''))"
  when:
    - not ansible_check_mode
    # Drift reconcile for existing VMs only — new VMs get --agent at create time
    # (qm create above). Matches the onboot/startup reconcile's guard below.
    - vm_exists.rc == 0

- name: Configure VM autostart and boot order
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    qm set {{ vm_id }} \
      --onboot {{ proxmox_autostart_enabled | default(true) | ternary(1, 0) }} \
      --startup order={{ proxmox_startup_order | default(100) }},up={{ proxmox_startup_delay | default(0) }}
  when:
    - not ansible_check_mode
    - vm_exists.rc != 0
    # Honor skip_create alongside the sibling create-path tasks (Create VM,
    # cloud-init qm set) — don't mutate/fail during a skip-create/stub run.
    - not (proxmox_vm_skip_create | default(false))
  changed_when: true

# Reconcile onboot/startup on existing VMs too (metadata-only, applied at next
# boot — never disrupts a running guest). Idempotent: re-sets only on real drift.
# startup is normalized to a canonical order=/up=/down= form on BOTH sides before
# comparing, because Proxmox drops default fields (e.g. up=0) from the stored
# string — a raw string compare would see false drift and re-`qm set` every run.
- name: Reconcile VM autostart and boot order on existing VM
  delegate_to: "{{ vm_reconcile_host }}"
  ansible.builtin.shell: |
    set -euo pipefail
    want_onboot="{{ proxmox_autostart_enabled | default(true) | ternary(1, 0) }}"
    # Canonicalize a Proxmox startup property-string to "order=O,up=U,down=D"
    # with absent fields defaulting to 0, so desired and stored compare equal
    # regardless of which default fields Proxmox omits.
    norm_startup() {
      local s="$1" order=0 up=0 down=0 kv k v
      local IFS=','
      for kv in $s; do
        k=${kv%%=*}; v=${kv#*=}
        case "$k" in order) order=$v ;; up) up=$v ;; down) down=$v ;; esac
      done
      echo "order=${order},up=${up},down=${down}"
    }
    want_startup=$(norm_startup "order={{ proxmox_startup_order | default(100) }},up={{ proxmox_startup_delay | default(0) }}")
    cfg=$(qm config {{ vm_id }})
    # Default onboot when the key is absent from qm config is 0 (Proxmox default).
    cur_onboot=$(printf '%s\n' "$cfg" | sed -n 's/^onboot: //p'); cur_onboot=${cur_onboot:-0}
    cur_startup=$(norm_startup "$(printf '%s\n' "$cfg" | sed -n 's/^startup: //p')")
    changed=0
    [ "$cur_onboot" != "$want_onboot" ] && changed=1
    [ "$cur_startup" != "$want_startup" ] && changed=1
    if [ "$changed" = 1 ]; then
      qm set {{ vm_id }} --onboot "$want_onboot" --startup "order={{ proxmox_startup_order | default(100) }},up={{ proxmox_startup_delay | default(0) }}"
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  register: vm_startup_reconcile
  changed_when: "'CHANGED' in (vm_startup_reconcile.stdout | default(''))"
  when:
    - not ansible_check_mode
    - vm_exists.rc == 0

# Additional persistent disks (ZFS zvols)
# Each disk pins an explicit, unique scsi_slot. Attaching by list position would
# remap a live data-bearing zvol onto the wrong device if the list is ever
# reordered or an entry removed, so the slot is required and validated here.
- name: Assert every additional disk pins a unique, explicit scsi_slot
  ansible.builtin.assert:
    that:
      - (vm_additional_disks | selectattr('scsi_slot', 'defined') | list | length) == (vm_additional_disks | length)
      - (vm_additional_disks | selectattr('scsi_slot', 'defined') | map(attribute='scsi_slot') | unique | list | length) == (vm_additional_disks | length)
      - (vm_additional_disks | selectattr('scsi_slot', 'defined') | map(attribute='scsi_slot') | map('int') | select('lt', 1) | list | length) == 0
    fail_msg: >-
      Every vm_additional_disks entry must set a unique 'scsi_slot' >= 1 (scsi0 is
      reserved for the VM boot disk). Slots pin a zvol to a stable SCSI device;
      assigning by list position would remap a live data-bearing zvol if the list
      is reordered or an entry removed.
    success_msg: "All {{ vm_additional_disks | length }} additional disk(s) have unique scsi_slots."
  when:
    - vm_additional_disks is defined
    - vm_additional_disks | length > 0

# With loops + register, changed_when is evaluated per-iteration using the current result
# sparse: true creates a thin-provisioned zvol (`zfs create -s`), so the volsize
# is reserved lazily as data is written (used for large data disks like the
# Nextcloud/Immich bulk user-data stores). Omitting the key preserves the
# historical thick-provisioned behavior — existing disks are unaffected.
- name: Create ZFS zvol for additional disks
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    if ! zfs list {{ item.zvol }} 2>/dev/null; then
      zfs create -p {{ '-s ' if (item.sparse | default(false) | bool) else '' }}-V {{ item.size }} {{ item.zvol }}
      echo "created"
    else
      echo "exists"
    fi
  loop: "{{ vm_additional_disks | default([]) }}"
  register: zvol_creation_result
  changed_when: "'created' in zvol_creation_result.stdout"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - vm_additional_disks is defined

# qm config/set must run where the VM resides (vm_reconcile_host). The zvol
# create above stays on proxmox_host — that's the inventory-declared pool
# owner; zvol-bearing VMs are node-pinned, so the two only diverge if such a
# VM is migrated by hand, and then attaching a fresh zvol elsewhere would be
# wrong anyway.
- name: Attach additional disks to VM
  delegate_to: "{{ vm_reconcile_host }}"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      EXPECTED_PATH="/dev/zvol/{{ item.zvol }}"
      SCSI_SLOT="scsi{{ item.scsi_slot }}"
      ALLOW_REMAP="{{ 1 if (item.allow_remap | default(false) | bool) else 0 }}"
      # vzdump_backup: false sets backup=0 so the nightly vzdump skips this
      # passthrough disk. Use it for app-data zvols already backed up by direct
      # ZFS replication (ssd/appdata -> archive); without it vzdump double-stores
      # them in the VM image backup (tank/proxmox).
      WANT_NOBACKUP="{{ 1 if not (item.vzdump_backup | default(true) | bool) else 0 }}"
      if [ "$WANT_NOBACKUP" = 1 ]; then DISK_SPEC="${EXPECTED_PATH},backup=0"; else DISK_SPEC="$EXPECTED_PATH"; fi
      CURRENT_CONFIG=$(qm config {{ vm_id }} | grep "^${SCSI_SLOT}:" || true)
      # Drive value without the "scsiN: " prefix; the path is its first
      # comma-separated token. Compare the path EXACTLY — a substring grep would
      # treat .../data-old as a match for .../data and skip a needed correction.
      CURRENT_VALUE="${CURRENT_CONFIG#*: }"
      CURRENT_PATH="${CURRENT_VALUE%%,*}"
      HAS_NOBACKUP=0
      echo "$CURRENT_VALUE" | grep -qE '(^|,)backup=0(,|$)' && HAS_NOBACKUP=1

      # Idempotent on BOTH the zvol path and the backup= state: re-set if the disk
      # is absent, on the wrong path, or its backup flag differs from desired.
      if [ -z "$CURRENT_CONFIG" ]; then
        qm set {{ vm_id }} --${SCSI_SLOT} "$DISK_SPEC"
        echo "CHANGED:attached"
      elif [ "$CURRENT_PATH" = "$EXPECTED_PATH" ] && [ "$HAS_NOBACKUP" = "$WANT_NOBACKUP" ]; then
        echo "OK:exists"
      else
        # Slot occupied by a DIFFERENT drive spec: refuse to remap ANY occupied
        # slot (not just zvols — an LVM/raw disk is just as destructive to
        # rebind) so a reorder/removal/typo can't silently overwrite it. A
        # matching path here is only a backup= flag change and is allowed.
        if [ "$CURRENT_PATH" != "$EXPECTED_PATH" ] && [ -n "$CURRENT_PATH" ] && [ "$CURRENT_PATH" != "none" ] && [ "$ALLOW_REMAP" != 1 ]; then
          echo "ERROR: ${SCSI_SLOT} maps $CURRENT_PATH, expected $EXPECTED_PATH." >&2
          echo "Refusing to remap an occupied slot; set allow_remap: true to override intentionally." >&2
          exit 1
        fi
        qm set {{ vm_id }} --${SCSI_SLOT} "$DISK_SPEC"
        echo "CHANGED:updated"
      fi
    executable: /bin/bash
  loop: "{{ vm_additional_disks | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: disk_attach_result
  changed_when: "'CHANGED:' in (disk_attach_result.stdout | default(''))"
  when:
    - not ansible_check_mode
    - vm_additional_disks is defined

- name: Report disk attachment changes
  ansible.builtin.debug:
    msg: "Disk {{ item.item.name }}: {{ item.stdout | regex_replace('^(CHANGED:|OK:)', '') }}"
  loop: "{{ disk_attach_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('N/A') }}"
  when:
    - disk_attach_result.results is defined
    - item.stdout is defined
  changed_when: false

# (The cloud-init SSH key temp file is now removed in the `always` of the
# "Stage and consume the cloud-init SSH public key" block above, so it is
# cleaned up even when a create-path task between staging and consuming fails.)

- name: Start VM
  delegate_to: "{{ proxmox_host }}"
  ansible.builtin.shell: |
    qm start {{ vm_id }}
  when:
    - not ansible_check_mode
    - vm_exists.rc != 0
  changed_when: true
  register: vm_start

- name: Wait for VM to be reachable via SSH
  delegate_to: "{{ proxmox_vm_ssh_wait_delegate }}"
  ansible.builtin.wait_for:
    host: "{{ proxmox_vm_target_ip }}"
    port: 22
    delay: 30
    timeout: 300
  when:
    - not ansible_check_mode
    - vm_exists.rc != 0
    - not (proxmox_vm_skip_create | default(false))

- name: Display VM creation status
  vars:
    status_msg: >-
      VM {{ inventory_hostname }} (ID {{ vm_id }})
      {% if ansible_check_mode and vm_exists.rc != 0 %}
      would be created (check mode - no changes made)
      {% elif vm_exists.rc != 0 %}
      created and started
      {% else %}
      already exists
      {% endif %}
  ansible.builtin.debug:
    msg: "{{ status_msg }}"
