[defaults]
inventory = inventories/prod/hosts.yml
# No roles_path: every role is addressed by FQCN from the weisssrv.infra
# collection (requirements.yml). `ansible-galaxy install -r requirements.yml`
# installs it to the default collections path; set ANSIBLE_COLLECTIONS_PATH to
# use a scratch location instead.
remote_user = eric
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml
callbacks_enabled = timer, profile_tasks

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

# SSH trust model: host_key_checking stays on; accept-new is TOFU against the
# operator's ~/.ssh/known_hosts. A "key changed" failure is a real signal —
# after a legitimate rebuild, `ssh-keygen -R <host>` and let accept-new record
# the new key. Never set host_key_checking=False.
[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts

[inventory]
enable_plugins = yaml, ini
