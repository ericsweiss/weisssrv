[defaults]
inventory = inventories/prod/hosts.yml
roles_path = roles
remote_user = eric
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml
callbacks_enabled = timer, profile_tasks

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

# SSH trust model
# -----------------
# We rely on Ansible's default `host_key_checking = True` (the line was
# previously set to False, which silently trusted any key any host
# offered — equivalent to no MITM protection on the control channel).
#
# Trust store: the operator's ~/.ssh/known_hosts on whatever box runs
# Ansible (laptop, runner, etc.). That file is the single source of
# truth for which host keys we accept.
#
# First contact: `StrictHostKeyChecking=accept-new` is TOFU — the first
# time we connect to a host we record its key into known_hosts and
# proceed. Every subsequent connection re-verifies that key. If a host
# ever presents a *different* key, SSH will refuse to connect and
# Ansible will fail loudly. That is the desired behaviour: a swapped
# key indicates either a legitimate rebuild or a MITM, and either way
# the operator should investigate before continuing.
#
# Handling a host rebuild (the legitimate "key changed" case):
#   1. Remove the stale entry from your known_hosts:
#        ssh-keygen -R <host-or-ip>
#   2. Re-keyscan the new key into known_hosts:
#        ssh-keyscan -t ed25519,rsa <host-or-ip> >> ~/.ssh/known_hosts
#   3. Re-run Ansible. The fresh accept-new will record the new key.
# Do NOT work around a key-change failure by deleting known_hosts
# wholesale or re-introducing host_key_checking=False; treat it as a
# real signal.
[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts

[inventory]
enable_plugins = yaml, ini
