[defaults]
inventory = inventories/prod/hosts.yml
# No roles_path: every role is addressed by FQCN from the weisssrv.infra
# collection (requirements.yml), installed to the default collections path.
# Set ANSIBLE_COLLECTIONS_PATH for a scratch location instead.
remote_user = eric
retry_files_enabled = False
# 15 forks: sized to the CI runner build container's memory cap (README.md).
# `serial:` on a play still overrides this.
forks = 15
# No fact_caching backend on purpose: a cache that outlives the run goes stale
# exactly when it hurts - mid-incident, or right after a host is rebuilt.
gathering = smart
stdout_callback = default
callback_result_format = yaml
callbacks_enabled = timer, profile_tasks

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

# SSH trust model: accept-new TOFU against the operator's known_hosts. A "key
# changed" failure is a real signal - never set host_key_checking=False.
[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts

[inventory]
enable_plugins = yaml, ini
