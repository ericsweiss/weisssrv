[defaults]
inventory = inventories/prod/hosts.yml
# No roles_path: every role is addressed by FQCN from the weisssrv.infra
# collection (requirements.yml). `ansible-galaxy install -r requirements.yml`
# installs it to the default collections path; set ANSIBLE_COLLECTIONS_PATH to
# use a scratch location instead.
remote_user = eric
retry_files_enabled = False
# The fleet is ~25 hosts; the default forks = 5 processes it in five waves and
# makes deploy-ansible-base the pipeline's critical path. The runner build
# container is capped at 4Gi (kubernetes/apps/gitlab-runner/release.yaml), which
# comfortably holds 15 forks. serial: on a play still overrides this, so the
# rolling one-host-at-a-time plays are unaffected.
forks = 15
# smart = gather a host's facts once per RUN, reused across the plays of that
# run. Deliberately no fact_caching backend: a cache that outlives the run makes
# facts stale exactly when it hurts — mid-incident, or right after a host is
# rebuilt — and every play here is idempotent enough that re-gathering is cheap.
gathering = smart
stdout_callback = default
callback_result_format = yaml
callbacks_enabled = timer, profile_tasks

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

# SSH trust model: host_key_checking stays on; accept-new is TOFU against the
# operator's ~/.ssh/known_hosts. A "key changed" failure is a real signal —
# after a legitimate rebuild, `ssh-keygen -R <host>` and let accept-new record
# the new key. Never set host_key_checking=False.
[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts

[inventory]
enable_plugins = yaml, ini
