[defaults]
inventory = inventories/prod/hosts.yml
roles_path = roles
remote_user = eric
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml
callbacks_enabled = timer, profile_tasks

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

# SSH trust model: Ansible's default host_key_checking = True; the trust
# store is the operator's ~/.ssh/known_hosts, and accept-new is TOFU
# (record on first contact, refuse loudly if a host's key ever changes).
# Handling a host rebuild (the legitimate "key changed" case):
#   1. ssh-keygen -R <host-or-ip>
#   2. ssh-keyscan -t ed25519,rsa <host-or-ip> >> ~/.ssh/known_hosts
#   3. Re-run Ansible. The fresh accept-new will record the new key.
# Do NOT work around a key-change failure by deleting known_hosts
# wholesale or re-introducing host_key_checking=False; treat it as a
# real signal.
[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts

[inventory]
enable_plugins = yaml, ini
