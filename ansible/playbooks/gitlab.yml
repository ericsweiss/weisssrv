---
# GitLab deployment playbook
#
# This playbook provisions the GitLab VM and deploys GitLab EE.
#
# Prerequisites:
#   - Authentik SAML provider configured (for SSO)
#   - 1Password items created (GitLab, GitLab SSO)
#
# Usage:
#   task gitlab:deploy              # Full deployment (VM + GitLab)
#   task gitlab:deploy-check        # Dry-run

- name: Provision GitLab VM
  hosts: gitlab
  gather_facts: false
  roles:
    - proxmox_vm

- name: Deploy GitLab
  hosts: gitlab
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait for GitLab VM to be reachable
      ansible.builtin.wait_for_connection:
        timeout: 300
      when: not ansible_check_mode

    - name: Check if host is reachable (check mode safety)
      ansible.builtin.wait_for_connection:
        timeout: 10
      register: host_reachable
      ignore_errors: true
      ignore_unreachable: true
      when: ansible_check_mode

    - name: Skip play if host unreachable in check mode
      ansible.builtin.meta: end_host
      when:
        - ansible_check_mode
        - host_reachable is defined
        - host_reachable is failed or host_reachable.unreachable | default(false)

    - name: Gather facts after connection is established
      ansible.builtin.setup:
  roles:
    - base
    - postfix_null_client
    # node_exporter_host runs node_exporter with the textfile collector pointed
    # at /var/lib/node_exporter, which is what exposes the gitlab backup
    # wrapper's gitlab_backup.prom to Prometheus (the wrapper creates the dir +
    # file itself). site.yml deploys node_exporter_host to gitlab_servers, but a
    # standalone `task gitlab:deploy` never did, so on this VM the metric was
    # written but no exporter exposed it (GitLabBackupStale via absent()).
    # Ordered before gitlab so the exporter is in place when the wrapper lands.
    - node_exporter_host
    # site.yml deploys alloy_host (host journald -> Loki) to gitlab_servers in a
    # dedicated play; include it here so a standalone `task gitlab:deploy` keeps
    # log shipping in sync.
    - alloy_host
    - gitlab
    - proxmox_firewall
