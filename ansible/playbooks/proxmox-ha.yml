---
# Configure Proxmox HA node-affinity rules, HA resources and the ZFS storage
# replication jobs behind fast failover. HA config is cluster-wide and applies from
# one node; replication jobs apply on each source node.

- name: Configure Proxmox HA
  hosts: proxmox
  become: true
  gather_facts: false

  roles:
    # /etc/pve is clustered, so the role reconciles HA once for the whole
    # cluster and probes for a reachable host itself.
    - role: weisssrv.infra.proxmox_ha
      tags: [proxmox_ha]

# Storage replication runs on every compute node: the role's per-job source_node
# filter makes non-source hosts read-only no-ops, so no per-service host list is
# needed. The NAS is out of the group: it has no local-ssd pool.
- name: Configure Proxmox Storage Replication
  hosts: compute
  become: true
  gather_facts: false
  ignore_unreachable: true  # Skip unreachable hosts; replication jobs are node-specific

  tasks:
    - name: Include replication management
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_ha
        tasks_from: replication
      when: proxmox_ha_replication_jobs | default([]) | length > 0
      tags: [proxmox_ha, proxmox_ha_replication]
