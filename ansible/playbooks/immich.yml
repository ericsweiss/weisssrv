---
# Immich deployment playbook.
#
# Provisions the Immich VM (proxmox_vm) and deploys the docker-compose stack.
#
# Prerequisites:
#   - Authentik OAuth2/OpenID provider + application configured (SSO)
#   - 1Password items created ("Immich Secrets", "Immich SSO")
#   - The wildcard cert distributed to the VM (task dns:deploy) — see
#     docs/36-immich.md for the first-deploy order and the SSO bootstrap flow.
#
# Usage:
#   task immich:deploy              # Full deployment (VM + stack)
#   task immich:deploy-check        # Dry-run

- name: Provision Immich VM
  hosts: immich
  gather_facts: false
  roles:
    - weisssrv.infra.proxmox_vm

- name: Deploy Immich
  hosts: immich
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait for Immich VM to be reachable
      ansible.builtin.wait_for_connection:
        timeout: 300
      when: not ansible_check_mode

    - name: Guard against unreachable host in check mode
      ansible.builtin.include_tasks: tasks/_check-mode-reachable.yml
      vars:
        reachable_check_timeout: 10

    - name: Gather facts after connection is established
      ansible.builtin.setup:
  roles:
    - weisssrv.infra.base
    - weisssrv.infra.postfix_null_client
    # Exposes the backup wrapper's immich_backup.prom textfile; ordered before
    # immich so the exporter is in place first.
    # Also in site.yml; listed here so a standalone deploy stays in sync.
    - weisssrv.infra.node_exporter_host
    # Also in site.yml; listed here so a standalone deploy stays in sync.
    - weisssrv.infra.alloy_host
    # tlshd for the xprtsec=tls backup mount; must precede the app role, which
    # mounts by hostname. Client-only.
    - role: weisssrv.infra.nfs_tls
      vars:
        nfs_tls_enabled: "{{ immich_backup_nfs_enabled | default(false) }}"
    - weisssrv.infra.immich
    - weisssrv.infra.proxmox_firewall
