---
# The SMTP relay on its own, so a mail-only change ships without re-running
# every other host's base configuration. site.yml deploys the same roles as part
# of a full base run.

- name: Provision SMTP relay LXC container
  hosts: mail
  gather_facts: false
  roles:
    - weisssrv.infra.proxmox_lxc

- name: Deploy SMTP relay configuration
  hosts: mail
  become: true
  roles:
    - weisssrv.infra.base
    - weisssrv.infra.smtp_relay
    # Shared with site.yml; scripts/test_shared_role_playbook_sync.py keeps the
    # two in step, so a standalone mail deploy leaves the relay unmetered.
    - weisssrv.infra.node_exporter_host
    - weisssrv.infra.alloy_host

- name: Deploy SMTP guest firewall rules
  hosts: mail
  roles:
    - weisssrv.infra.proxmox_firewall

# CRITICAL: the base role above rewrites the relay's authorized_keys and drops
# the pinned cert-distribution key, so the next renewal push from dns-01 would
# fail until acme_certs runs again. Re-seed it from the primary here.
- name: Re-seed the cert-distribution key on the relay
  hosts: dns_primary
  become: true
  gather_facts: false
  ignore_unreachable: true
  tasks:
    - name: Re-seed each mail cert-distribution target
      ansible.builtin.include_tasks: tasks/_reseed-cert-target.yml
      loop: >-
        {{ acme_certs_distribution_targets | default([])
           | selectattr('host', 'in', groups['mail'] | default([])) | list }}
      loop_control:
        loop_var: reseed_cert_target_host_entry
        label: "{{ reseed_cert_target_host_entry.host }}"
      vars:
        reseed_cert_target_host: "{{ reseed_cert_target_host_entry.host }}"
