---
# Deploy boot-time ZFS-encryption key fetch on every Proxmox host.
# Run via the Taskfile wrappers, which inject the Connect token and SSH key:
# `task zfs:encrypt -- --limit pve-nas-01`. Workflow: docs/32-zfs-encryption.md.

- name: Deploy ZFS-encryption boot-time unlock
  hosts: proxmox
  become: true
  vars:
    # Connect access token. `op run` substitutes from 1Password at
    # runtime; never written to disk before deploy.
    zfs_encryption_connect_token: >-
      {{ lookup('ansible.builtin.env', 'ZFS_ENCRYPTION_CONNECT_TOKEN', default='') }}
  roles:
    - role: weisssrv.infra.zfs_encryption
      tags: [zfs_encryption]
