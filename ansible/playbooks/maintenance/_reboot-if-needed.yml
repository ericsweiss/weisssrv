---
# CRITICAL: shared reboot-if-needed logic routing each host to synchronous, detached
# or defer. It does NOT drain Proxmox HA guests, so drain first if a guest must stay up.
# Reboot needed = /var/run/reboot-required, or a running/installed kernel mismatch.
# Optional variables: auto_reboot, skip_reboot, reboot_timeout, self_reboot_delay (CI passes 5400; keep the job timeout below it).
# Routing model and the HA-drain runbook: docs/12.

- name: Check if reboot-required file exists
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Get running kernel version
  ansible.builtin.command: uname -r
  register: running_kernel
  changed_when: false
  check_mode: false

# `|| true` on the grep alone, so a no-match is empty (not a failure) while a
# real dpkg/awk/sort failure still reds the task. Swallowing both would make
# "could not read the installed kernel" indistinguishable from "no reboot needed".
- name: Get latest installed kernel version (Proxmox)
  ansible.builtin.shell: |
    set -o pipefail
    # [[:space:]] not \s: POSIX ERE. Matches signed and unsigned kernels.
    dpkg -l | { grep -E '^ii[[:space:]]+proxmox-kernel-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-pve(-signed)?[[:space:]]' || true; } | awk '{print $3}' | sort -V | tail -1
  args:
    executable: /bin/bash
  register: installed_kernel_proxmox
  changed_when: false
  # Read-only, so it runs under --check too: skipped, the assert below would
  # false-fail a clean dry run on every kernel-owning host.
  check_mode: false

- name: Get latest installed kernel version (Debian/VM)
  ansible.builtin.shell: |
    set -o pipefail
    dpkg -l | { grep -E '^ii[[:space:]]+linux-image-[0-9]' || true; } | awk '{print $2}' | sed 's/linux-image-//' | sort -V | tail -1
  args:
    executable: /bin/bash
  register: installed_kernel_debian
  changed_when: false
  check_mode: false
  when: installed_kernel_proxmox.stdout | default('') == ''

# Fail LOUD rather than reporting no-reboot-needed: a host that owns a kernel
# package and matches neither pattern means the package naming moved, which
# would silently disable reboot-after-kernel-upgrade fleet-wide.
- name: Assert the installed kernel was determined on a kernel-owning host
  ansible.builtin.assert:
    that:
      - (installed_kernel_proxmox.stdout | default('') != '') or
        ((installed_kernel_debian | default({})).stdout | default('') != '')
    fail_msg: >-
      Could not determine the installed kernel on {{ inventory_hostname }};
      refusing to report no-reboot-needed. Check the kernel package naming
      (proxmox-kernel-* / linux-image-*) in _reboot-if-needed.yml.
    quiet: true
  when: inventory_hostname not in (groups['lxc_containers'] | default([]))

# The installed package version carries no "-pve" suffix; strip it to compare.
- name: Normalize running kernel version for comparison
  ansible.builtin.set_fact:
    running_kernel_normalized: "{{ running_kernel.stdout | regex_replace('-pve$', '') }}"

- name: Determine if kernel was updated
  ansible.builtin.set_fact:
    kernel_updated: >-
      {{
        (installed_kernel_proxmox.stdout | default('') != '' and
         running_kernel_normalized != installed_kernel_proxmox.stdout) or
        ((installed_kernel_debian | default({})).stdout | default('') != '' and
         running_kernel.stdout != (installed_kernel_debian | default({})).stdout | default(''))
      }}

- name: Set reboot required flag
  ansible.builtin.set_fact:
    reboot_required: "{{ reboot_required_file.stat.exists or (kernel_updated | bool) }}"

# A k3s server that is NOT on the host being processed, for the delegated
# lookups below.
- name: Pick a k3s server off this host for delegated lookups
  ansible.builtin.set_fact:
    reboot_delegate_server: >-
      {{ (groups['k3s_servers']
          | map('extract', hostvars)
          | selectattr('proxmox_host', 'defined')
          | rejectattr('proxmox_host', 'eq', inventory_hostname)
          | map(attribute='inventory_hostname')
          | list | first) | default(groups['k3s_servers'][0]) }}

- name: Display reboot requirement
  ansible.builtin.debug:
    msg: |
      WARNING: {{ inventory_hostname }} requires reboot
      Running kernel: {{ running_kernel.stdout }} (normalized: {{ running_kernel_normalized }})
      Installed kernel: {{ installed_kernel_proxmox.stdout | default((installed_kernel_debian | default({})).stdout | default('unknown')) }}
      Reboot-required file: {{ reboot_required_file.stat.exists }}
      Kernel mismatch: {{ kernel_updated }}
  when: reboot_required | bool

# CI self-host safety: if this host runs the VM hosting the active runner
# executor pod, reboot DETACHED so the job survives. Manual runs never match.
- name: Identify the CI executor pod + whether we run inside a k8s pod
  ansible.builtin.set_fact:
    # HOSTNAME is the executor pod name; KUBERNETES_SERVICE_HOST proves we are
    # inside the cluster even if that naming changes.
    ci_executor_pod: "{{ lookup('env', 'HOSTNAME') | default('', true) }}"
    ci_in_k8s: "{{ (lookup('env', 'KUBERNETES_SERVICE_HOST') | default('', true)) | length > 0 }}"
  changed_when: false
  when:
    - reboot_required | bool
    - not (skip_reboot | default(false))

- name: Find the k3s node hosting the CI executor pod
  # Delegated to a k3s server off this host and retried, so a blip cannot decide the
  # routing. A persistent failure or empty nodeName fails closed via
  # ci_detection_failed -> defer. Maintenance jobs land on the privileged runner.
  ansible.builtin.command: >-
    k3s kubectl get pod {{ ci_executor_pod }}
    -n {{ maintenance_ci_runner_namespace | default('gitlab-runner-privileged') }}
    -o jsonpath={.spec.nodeName}
  register: ci_executor_node_q
  changed_when: false
  failed_when: false
  retries: 3
  delay: 5
  until: ci_executor_node_q.rc == 0
  delegate_to: "{{ reboot_delegate_server }}"
  when:
    - reboot_required | bool
    - not (skip_reboot | default(false))
    # Only a k8s executor pod carries the runner prefix; a manual run skips the
    # lookup entirely and takes the synchronous path.
    - ci_executor_pod is match('^' ~ (maintenance_ci_executor_pod_prefix | default('runner-')))
    - groups['k3s_servers'] | default([]) | length > 0

- name: Compute whether this host is the CI executor's Proxmox host
  ansible.builtin.set_fact:
    # The executor's k3s node maps to its Proxmox host via hostvars.proxmox_host.
    # | trim matches ci_detection_failed so the two facts cannot disagree.
    is_ci_self_host: >-
      {{ (ci_executor_node_q.stdout | default('') | trim) in
           ((groups['k3s_agents'] | default([])) + (groups['k3s_servers'] | default([])))
         and inventory_hostname ==
           (hostvars[ci_executor_node_q.stdout | default('') | trim] | default({})).proxmox_host | default('') }}
  changed_when: false
  when:
    - reboot_required | bool
    - not (skip_reboot | default(false))

# Routing inputs: host_runs_etcd_server, ci_detection_failed and
# proxmox_self_reboot_safe. What each one means, and the fail-closed table:
# docs/12 § Maintenance reboot routing.
- name: Compute reboot-routing facts (etcd host, detection failure)
  ansible.builtin.set_fact:
    host_runs_etcd_server: >-
      {{ inventory_hostname in (groups['k3s_servers'] | default([])
         | map('extract', hostvars) | selectattr('proxmox_host', 'defined')
         | map(attribute='proxmox_host') | list) }}
    host_etcd_server_node: >-
      {{ (groups['k3s_servers'] | default([])
          | map('extract', hostvars) | selectattr('proxmox_host', 'defined')
          | selectattr('proxmox_host', 'eq', inventory_hostname)
          | map(attribute='inventory_hostname') | list | first) | default('') }}
    # True iff EVERY k3s VM hosted here is onboot=1: a detached host reboot is
    # only safe if the executor's VM comes back on its own.
    host_vms_autostart: >-
      {{ (((groups['k3s_servers'] | default([])) + (groups['k3s_agents'] | default([])))
          | map('extract', hostvars) | selectattr('proxmox_host', 'defined')
          | selectattr('proxmox_host', 'eq', inventory_hostname)
          | map(attribute='proxmox_autostart_enabled') | map('default', false)
          | reject('equalto', true) | list | length) == 0 }}
    # Fail closed: inside the cluster but unable to confirm the executor's
    # node->host mapping, for any reason, means DEFER rather than reboot.
    ci_detection_failed: >-
      {{ (ci_in_k8s | default(false))
         and (not ((ci_executor_pod | default('')) is match('^' ~ (maintenance_ci_executor_pod_prefix | default('runner-'))))
              or (ci_executor_node_q.rc | default(1)) != 0
              or (ci_executor_node_q.stdout | default('') | trim) == ''
              or ((ci_executor_node_q.stdout | default('') | trim) != ''
                  and (hostvars[ci_executor_node_q.stdout | default('') | trim] | default({})
                       ).proxmox_host | default('') == '')) }}
  changed_when: false
  when:
    - reboot_required | bool
    - not (skip_reboot | default(false))

- name: Decide reboot action (synchronous | detached | defer)
  ansible.builtin.set_fact:
    # defer -> operator + alert metric; detached -> arm a reboot that survives
    # the job; synchronous -> reboot in place. docs/12 § Maintenance reboot routing.
    reboot_action: >-
      {{ 'defer'
         if ((not (proxmox_self_reboot_safe | default(true)))
             or (ci_detection_failed | default(false))
             or ((is_ci_self_host | default(false)) and (host_runs_etcd_server | default(false)))
             or ((is_ci_self_host | default(false)) and not (host_vms_autostart | default(false))))
         else ('detached' if (is_ci_self_host | default(false)) else 'synchronous') }}
  changed_when: false
  when:
    - reboot_required | bool
    - not (skip_reboot | default(false))

# --- SYNCHRONOUS: a safe, confirmed-non-executor host; play 1 is serial:1.
- name: Reboot this host synchronously
  when:
    - reboot_required | bool
    - not (skip_reboot | default(false))
    - reboot_action | default('') == 'synchronous'
  block:
    # Prompt only where the reboot would actually happen here: on a defer-class
    # host the reboot goes to an operator regardless, so a confirmation would
    # be misleading.
    - name: Pause for manual reboot decision
      ansible.builtin.pause:
        prompt: |
          {{ inventory_hostname }} requires a reboot.
          Press ENTER to reboot now, or Ctrl+C then 'A' to abort and reboot manually later.
      when: not (auto_reboot | default(false) | bool)

    # CRITICAL: etcd-quorum trap. Never reboot an etcd-server host while kured is
    # mid-reboot of ANOTHER server - that drops two of three members at once.
    - name: Serialize against kured before a synchronous etcd-host reboot
      ansible.builtin.include_tasks: _wait-no-kured-server-reboot.yml
      vars:
        kured_clear_reason: synchronous etcd-host reboot
        kured_clear_delegate: "{{ reboot_delegate_server }}"
      when: host_runs_etcd_server | default(false)

    # `reboot` blocks until the connection returns, with the same timeout.
    - name: Reboot host if required
      ansible.builtin.reboot:
        reboot_timeout: "{{ reboot_timeout | default(600) }}"
        msg: "Rebooting {{ inventory_hostname }} after package updates"

    # CRITICAL: etcd quorum. This blocks serial:1 from advancing until this server's
    # node is Ready again, so two etcd members are never down at once, and a rejoin
    # that never completes fails the run. The nesting kubectl --timeout=180s <
    # --request-timeout=190s < outer `timeout` 200s must be raised together.
    - name: Wait for this host's k3s server (etcd member) to rejoin before serial advances
      ansible.builtin.command: >-
        timeout --kill-after=10s 200s
        k3s kubectl --request-timeout=190s wait
        --for=condition=Ready node/{{ host_etcd_server_node }} --timeout=180s
      register: etcd_rejoin_wait
      changed_when: false
      retries: 3
      delay: 15
      until: etcd_rejoin_wait.rc == 0
      delegate_to: "{{ reboot_delegate_server }}"
      when:
        - host_runs_etcd_server | default(false)
        - host_etcd_server_node | default('') | length > 0

# --- DETACHED: a safe host with no etcd member that runs the CI executor's VM.
# Arms a fallback timer that survives the job; the CI after_script re-arms a
# prompt reboot and disarms this one.
- name: Arm a detached reboot on the CI self-host
  when:
    - reboot_required | bool
    - not (skip_reboot | default(false))
    - reboot_action | default('') == 'detached'
  block:
    - name: Clear any pending/failed self-reboot timer + service (idempotent re-run)  # noqa: command-instead-of-module
      # `systemctl stop` does not clear a FAILED unit and systemd-run --unit collides
      # with one; only reset-failed clears it, and it has no module equivalent.
      ansible.builtin.shell: |
        systemctl reset-failed maintenance-self-reboot.timer maintenance-self-reboot.service 2>/dev/null || true
        systemctl stop maintenance-self-reboot.timer maintenance-self-reboot.service 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Schedule detached fallback reboot (this host runs the CI executor's VM)
      ansible.builtin.command: >-
        systemd-run --no-block --collect
        --on-active={{ self_reboot_delay | default(3600) }}s
        --unit=maintenance-self-reboot
        systemctl reboot
      changed_when: true

    - name: Record the detached self-host on the controller (for after_script re-arm/disarm)
      ansible.builtin.copy:
        # Hardcoded so it cannot diverge from scripts/maintenance-rearm-self-reboot.sh,
        # which reads the same path.
        dest: /tmp/maintenance-self-host
        content: "{{ inventory_hostname }}\n"
        mode: "0644"
      delegate_to: localhost
      # The including play is become: true, which a delegate_to: localhost task
      # inherits and would sudo inside the CI runner pod. /tmp needs no escalation.
      become: false
      changed_when: false

    - name: Report armed detached self-host reboot
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} runs the CI executor's VM
          ({{ ci_executor_node_q.stdout | default('?') }}); armed a DETACHED fallback
          reboot (+{{ self_reboot_delay | default(3600) }}s) that survives this job.
          The CI after_script re-arms a prompt reboot once the job ends.

# --- DEFER to operator: unsafe host, an executor host that also runs an etcd
# server, or a CI run where self-host detection failed. Surfaces an alertable
# metric instead of rebooting.
- name: Defer the reboot to an operator
  when:
    - reboot_required | bool
    - not (skip_reboot | default(false))
    - reboot_action | default('') == 'defer'
  block:
    - name: Report reboot DEFERRED to operator
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ inventory_hostname }} needs a reboot but it was DEFERRED to an
          operator. Reason:
          {{ 'unsafe to auto-reboot (encrypted pools / onboot=0 VMs)'
             if not (proxmox_self_reboot_safe | default(true))
             else ('CI self-host detection failed (failing closed)'
                   if (ci_detection_failed | default(false))
                   else ('runs the CI executor VM AND a k3s etcd server (avoiding a kured quorum race)'
                         if (host_runs_etcd_server | default(false))
                         else 'runs the CI executor VM but a hosted k3s VM is not onboot=1 (a host reboot would strand it)')) }}.
          Reboot it manually when convenient.

    # The dir is created first so the metric also lands on host classes without
    # node_exporter_host; on scraped hosts it fires MaintenanceRebootDeferred.
    - name: Ensure the node_exporter textfile dir exists (for the deferred-reboot metric)
      ansible.builtin.file:
        path: "{{ node_exporter_host_textfile_dir | default('/var/lib/node_exporter') }}"
        state: directory
        mode: "0755"

    - name: Surface a DEFERRED reboot as a node_exporter metric
      ansible.builtin.copy:
        dest: "{{ node_exporter_host_textfile_dir | default('/var/lib/node_exporter') }}/maintenance_reboot_deferred.prom"
        mode: "0644"
        content: |
          # HELP maintenance_reboot_deferred Host needs a manual reboot deferred by maintenance (1=pending).
          # TYPE maintenance_reboot_deferred gauge
          maintenance_reboot_deferred{host="{{ inventory_hostname }}"} 1

# TRAP: this host set must stay in sync with every group that can reach the defer
# path (base_managed + app_servers). A group that can write the metric but is not
# cleared here latches the alert forever.
- name: Clear a stale deferred-reboot metric on any run that did not defer
  ansible.builtin.file:
    path: "{{ node_exporter_host_textfile_dir | default('/var/lib/node_exporter') }}/maintenance_reboot_deferred.prom"
    state: absent
  when:
    - (not (reboot_required | bool))
      or (reboot_action | default('') in ['synchronous', 'detached'])
    - inventory_hostname in ((groups['base_managed'] | default([]))
        + (groups['app_servers'] | default([])))
