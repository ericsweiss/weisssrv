---
# CRITICAL: etcd-quorum guard. Block until no k3s server carries kured's
# reboot-in-progress annotation, so an operation that drops this server's etcd
# member never coincides with kured rebooting another one. Two of three members
# down at once loses the cluster.

# Caller must set kured_clear_delegate, a k3s server that stays reachable and is
# not the host going down. kured_clear_reason optionally labels the task.
- name: "Wait for kured to not be rebooting any k3s server ({{ kured_clear_reason | default('etcd quorum') }})"
  ansible.builtin.shell: |
    set -o pipefail
    for n in {{ groups['k3s_servers'] | join(' ') }}; do
      # A server is actively rebooting only when it is both kured-annotated and
      # cordoned: kured annotates before checking blockers and never clears it,
      # so annotated-but-schedulable is stale. jsonpath emits both fields.

      # Fail closed on a kubectl error: an unreadable node cannot prove no
      # server is rebooting, so exit 1 and let the until retry.
      st=$(k3s kubectl get node "$n" \
        -o jsonpath='{.metadata.annotations.weave\.works/kured-reboot-in-progress}{" "}{.spec.unschedulable}' \
        2>/dev/null) || st=KUBECTL_ERR
      case "$st" in
        KUBECTL_ERR) echo "kubectl get node $n failed - cannot confirm kured state"; exit 1 ;;
        ?*" true") echo "kured rebooting server $n"; exit 1 ;;
      esac
    done
    exit 0
  args:
    executable: /bin/bash
  register: kured_server_clear
  changed_when: false
  # 8 min budget, past kured's 5m drainTimeout so a normal server reboot does
  # not fail the run. On exhaustion the task fails the play, aborting rather
  # than risking a second etcd member.
  retries: 48
  delay: 10
  until: kured_server_clear.rc == 0
  delegate_to: "{{ kured_clear_delegate }}"
