---
# Shared etcd-quorum guard. Block until NO k3s SERVER node carries the
# weave.works/kured-reboot-in-progress annotation, so an operation that briefly
# drops THIS server's etcd member (a k3s service restart, or a host reboot) never
# coincides with kured rebooting ANOTHER server — which would put 2 of 3 etcd
# members down at once. Used by update-k3s-nodes.yml (before cordon+upgrade and
# again right before the k3s restart, to shrink the check->act window) and by
# _reboot-if-needed.yml (before a synchronous reboot of an etcd-server host).
#
# Caller MUST set:
#   kured_clear_delegate - a k3s server that stays reachable during the operation
#                          (NOT the server/host that is going down).
# Caller MAY set:
#   kured_clear_reason   - short label for the task name.
- name: "Wait for kured to not be rebooting any k3s server ({{ kured_clear_reason | default('etcd quorum') }})"
  ansible.builtin.shell: |
    set -o pipefail
    for n in {{ groups['k3s_servers'] | join(' ') }}; do
      # A server is ACTIVELY rebooting only if it is BOTH kured-annotated AND
      # cordoned (unschedulable). kured writes the reboot-in-progress annotation
      # BEFORE it checks reboot blockers (lock/alerts/blockingPodSelector) and does
      # NOT clear it when blocked — so an annotated-but-still-schedulable server is
      # blocked/stale, not mid-reboot. Requiring `unschedulable: true` (kured
      # cordons just before the actual reboot) avoids waiting forever on a stale
      # annotation. jsonpath emits "<annotation> <unschedulable>".
      # Fail CLOSED on a kubectl error: if we cannot read the node we cannot prove
      # no server is rebooting, so exit 1 (the until retries; a persistent failure
      # aborts the op rather than risking a second etcd member). A sentinel value
      # plus a case branch handles the error without a brace group.
      st=$(k3s kubectl get node "$n" \
        -o jsonpath='{.metadata.annotations.weave\.works/kured-reboot-in-progress}{" "}{.spec.unschedulable}' \
        2>/dev/null) || st=KUBECTL_ERR
      case "$st" in
        KUBECTL_ERR) echo "kubectl get node $n failed - cannot confirm kured state"; exit 1 ;;
        ?*" true") echo "kured rebooting server $n"; exit 1 ;;
      esac
    done
    exit 0
  args:
    executable: /bin/bash
  register: kured_server_clear
  changed_when: false
  # 8 min budget, comfortably past kured's drainTimeout (5m) so a slow-but-normal
  # kured server reboot doesn't spuriously fail the run. On exhaustion the task
  # DOES fail the play (no failed_when:false) — that is the safe direction: abort
  # before risking a second etcd member rather than proceed blindly.
  retries: 48
  delay: 10
  until: kured_server_clear.rc == 0
  delegate_to: "{{ kured_clear_delegate }}"
