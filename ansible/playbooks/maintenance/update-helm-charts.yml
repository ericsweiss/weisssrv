---
# Helm chart update playbook
# Updates k3s platform Helm charts to versions in group_vars/all.yml
# Run this from your workstation with kubectl configured to k3s cluster

- name: Update k3s Helm charts
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    ansible_become: false
  tasks:
    - name: Verify kubectl access
      ansible.builtin.command: kubectl get nodes
      changed_when: false
      register: kubectl_check
      failed_when: kubectl_check.rc != 0

    - name: Display cluster info
      ansible.builtin.debug:
        msg: "{{ kubectl_check.stdout_lines }}"

    - name: Ensure Helm repositories are added
      ansible.builtin.command: "helm repo add {{ item.name }} {{ item.url }} --force-update"
      loop:
        - { name: metallb, url: "https://metallb.github.io/metallb" }
        - { name: traefik, url: "https://traefik.github.io/charts" }
        - { name: jetstack, url: "https://charts.jetstack.io" }
        - { name: external-dns, url: "https://kubernetes-sigs.github.io/external-dns" }
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

    - name: Update Helm repositories
      ansible.builtin.command: helm repo update
      changed_when: true

    - name: Update MetalLB
      ansible.builtin.command: >
        helm upgrade metallb metallb/metallb
        -n metallb-system
        --version {{ helm_chart_versions.metallb }}
        --reuse-values
        --wait
        --timeout 5m
      changed_when: true
      register: metallb_upgrade

    - name: Display MetalLB upgrade result
      ansible.builtin.debug:
        msg: "{{ metallb_upgrade.stdout_lines }}"

    - name: Update Traefik
      ansible.builtin.command: >
        helm upgrade traefik traefik/traefik
        -n traefik
        --version {{ helm_chart_versions.traefik }}
        --reuse-values
        --wait
        --timeout 5m
      changed_when: true
      register: traefik_upgrade

    - name: Display Traefik upgrade result
      ansible.builtin.debug:
        msg: "{{ traefik_upgrade.stdout_lines }}"

    # NOTE: Helm does not update CRDs on upgrade by default. cert-manager CRDs
    # must be applied explicitly before the Helm upgrade to avoid broken upgrades
    # when CRD schemas change between versions.
    - name: Download cert-manager CRDs before upgrade
      ansible.builtin.get_url:
        url: "https://github.com/cert-manager/cert-manager/releases/download/{{ helm_chart_versions.cert_manager }}/cert-manager.crds.yaml"
        dest: /tmp/cert-manager-crds.yaml
        mode: "0644"
        force: true
        # Note: cert-manager does not publish separate checksum files for CRDs.
        # Downloaded locally first to avoid kubectl applying directly from URL.

    - name: Apply cert-manager CRDs before upgrade
      ansible.builtin.command: >
        kubectl apply -f /tmp/cert-manager-crds.yaml
      changed_when: true
      register: certmanager_crds

    - name: Display cert-manager CRD apply result
      ansible.builtin.debug:
        msg: "{{ certmanager_crds.stdout_lines }}"

    - name: Update cert-manager
      ansible.builtin.command: >
        helm upgrade cert-manager jetstack/cert-manager
        -n cert-manager
        --version {{ helm_chart_versions.cert_manager }}
        --reuse-values
        --wait
        --timeout 5m
      changed_when: true
      register: certmanager_upgrade

    - name: Display cert-manager upgrade result
      ansible.builtin.debug:
        msg: "{{ certmanager_upgrade.stdout_lines }}"

    - name: Update external-dns
      ansible.builtin.command: >
        helm upgrade external-dns external-dns/external-dns
        -n external-dns
        --version {{ helm_chart_versions.external_dns }}
        --reuse-values
        --wait
        --timeout 5m
      changed_when: true
      register: externaldns_upgrade

    - name: Display external-dns upgrade result
      ansible.builtin.debug:
        msg: "{{ externaldns_upgrade.stdout_lines }}"

    - name: Verify all pods are running
      ansible.builtin.command: kubectl get pods --all-namespaces
      changed_when: false
      register: pod_status

    - name: Display pod status
      ansible.builtin.debug:
        msg: "{{ pod_status.stdout_lines }}"

    - name: Check for unhealthy pods
      ansible.builtin.shell: |
        kubectl get pods --all-namespaces --field-selector=status.phase!=Running,status.phase!=Succeeded -o name
      args:
        executable: /bin/bash
      changed_when: false
      register: unhealthy_pods

    - name: Warn if pods are unhealthy
      ansible.builtin.debug:
        msg: "WARNING: Unhealthy pods detected: {{ unhealthy_pods.stdout_lines }}"
      when: unhealthy_pods.stdout != ""

    - name: Display Helm chart versions
      ansible.builtin.command: helm list --all-namespaces
      changed_when: false
      register: helm_list

    - name: Show current Helm releases
      ansible.builtin.debug:
        msg: "{{ helm_list.stdout_lines }}"
