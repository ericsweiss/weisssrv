---
# Application update playbook
# Updates homelab applications to versions specified in group_vars/all.yml
#
# Covers: AdGuard Home, adguardhome-sync, Tailscale, Plex, Ansible collections
# This playbook is also imported by update-full.yml (single source of truth)
#
# The upgrades themselves are the collection roles — every one of them is
# version-aware and idempotent (adguard_home compares the running binary against
# adguard_home_version, adguard_sync goes through the shared prometheus_exporter
# install pipeline, tailscale/plex install the pinned apt version behind a hold).
# Re-implementing them here produced two divergent upgrade paths, so this
# playbook now only carries the site-specific steps the roles genuinely lack.

- name: Update AdGuard Home
  hosts: dns
  become: true
  serial: 1  # One host at a time to maintain DNS availability
  # With serial: 1 a failure on the first resolver must stop the run before the
  # second batch takes the surviving resolver down too.
  any_errors_fatal: true
  tasks:
    - name: Display target AdGuard Home version
      ansible.builtin.debug:
        msg: "Reconciling {{ inventory_hostname }} to AdGuard Home {{ adguard_home_version }}"

    - name: Check for an installed AdGuard Home configuration
      ansible.builtin.stat:
        path: "{{ adguard_home_install_path }}/AdGuardHome.yaml"
      register: adguard_home_config_stat

    # Suffix from a task-time controller lookup, NOT ansible_date_time.epoch:
    # ansible.cfg sets gathering = smart, so facts are gathered once per RUN and
    # that epoch is frozen for every play in it — two backups in one run would
    # collide on the suffix and the second copy would no-op onto the first,
    # discarding the pre-upgrade config it was meant to preserve.
    # Gated on the stat: on a host where the role has not installed a config yet
    # this play would otherwise fail on a missing source.
    - name: Back up the AdGuard Home configuration before the upgrade
      ansible.builtin.copy:
        src: "{{ adguard_home_install_path }}/AdGuardHome.yaml"
        dest: "{{ adguard_home_install_path }}/AdGuardHome.yaml.backup-{{ lookup('pipe', 'date +%s') }}"
        remote_src: true
        mode: "0644"
      when: adguard_home_config_stat.stat.exists

    # DNS chicken-and-egg: each resolver points /etc/resolv.conf at itself, so
    # the window where the role stops AdGuardHome to swap the binary would leave
    # this host with no resolution. Point it at the peer first — serial: 1, so
    # the peer is always the one that is NOT being upgraded. On success the
    # role's own resolv_conf pass puts the file back to 127.0.0.1 (immutable) at
    # the end of the run; the always: below is what covers the failure path,
    # which otherwise leaves the resolver stopped and resolv.conf mutable.
    - name: Upgrade AdGuard Home behind the peer resolver
      block:
        - name: Clear the immutable flag on resolv.conf for the upgrade window
          ansible.builtin.command:
            cmd: chattr -i /etc/resolv.conf
          changed_when: false
          # The file may not be immutable, or the FS may not support attrs.
          failed_when: false

        - name: Point resolv.conf at the peer DNS server for the upgrade window
          vars:
            dns_peer: "{{ groups['dns'] | difference([inventory_hostname]) | first }}"
          ansible.builtin.copy:
            content: |
              # Temporary DNS configuration during AdGuard upgrade
              # Using {{ dns_peer }} for resolution while {{ inventory_hostname }}'s AdGuard is stopped
              nameserver {{ hostvars[dns_peer].ansible_host }}
            dest: /etc/resolv.conf
            mode: "0644"

        - name: Reconcile AdGuard Home to the pinned version
          ansible.builtin.include_role:
            name: weisssrv.infra.adguard_home
      always:
        # Best-effort first, then re-lock the file, and only then fail: a fail:
        # placed earlier would skip the rest of this block. Leaving resolv.conf
        # pointing at the peer is a working resolution path — the next
        # successful role run rewrites it to 127.0.0.1 — but leaving it MUTABLE
        # lets DHCP clobber it, so the +i goes back on either way.
        - name: Start AdGuard Home again after the upgrade window
          ansible.builtin.service:
            name: AdGuardHome
            state: started
          failed_when: false

        - name: Read the AdGuard Home service state  # noqa: command-instead-of-module
          ansible.builtin.command: systemctl is-active AdGuardHome
          register: adguard_home_active
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Re-assert the immutable flag on resolv.conf
          ansible.builtin.command:
            cmd: chattr +i /etc/resolv.conf
          register: resolv_conf_relock
          changed_when: false
          # Already immutable, or the FS does not support attrs — non-fatal, but
          # a real failure leaves the file writable for DHCP, so the terminal
          # message below reports the rc rather than dropping it.
          failed_when: false

        - name: Fail when AdGuard Home is still down after the upgrade window
          ansible.builtin.fail:
            msg: >-
              AdGuard Home on {{ inventory_hostname }} is
              '{{ adguard_home_active.stdout | default('unknown') | trim }}' after the
              upgrade window — this resolver is NOT answering. resolv.conf points at
              the peer, re-lock rc={{ resolv_conf_relock.rc | default('?') }}
              {{ '(NOT immutable — DHCP can clobber it)'
                 if (resolv_conf_relock.rc | default(1)) != 0 else '(immutable)' }};
              fix this host before the peer's own serial: 1 turn takes the other
              resolver down.
          when: (adguard_home_active.stdout | default('') | trim) != 'active'

- name: Update adguardhome-sync (dns-01 only)
  hosts: dns-01
  become: true
  tasks:
    # The role self-gates on adguard_sync_enabled (host_vars/dns-01.yml), so it
    # is a no-op anywhere the sync is not deployed.
    - name: Reconcile adguardhome-sync to the pinned version
      ansible.builtin.include_role:
        name: weisssrv.infra.adguard_sync

- name: Update Tailscale (Proxmox hosts only)
  hosts: proxmox
  become: true
  serial: 1  # One host at a time
  tasks:
    # The role installs `tailscale={{ tailscale_version }}` with
    # allow_change_held_packages, so a pin bump moves through the apt hold; the
    # deb's postinst restarts tailscaled. `tailscale up` is gated on
    # BackendState, so an already-joined node needs no auth key here.
    - name: Reconcile Tailscale to the pinned version
      ansible.builtin.include_role:
        name: weisssrv.infra.tailscale

- name: Update Plex Media Server
  hosts: plex
  become: true
  tasks:
    # install.yml honours both the pinned and the `latest` value of plex_version
    # and manages the apt hold; the role's service tasks flush the restart
    # handler and wait for /identity before the play ends.
    - name: Reconcile Plex Media Server to the pinned version
      ansible.builtin.include_role:
        name: weisssrv.infra.plex

- name: Update Ansible collections
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    ansible_become: false
  tasks:
    # --force, not --upgrade: requirements.yml is a PIN, and bumping it is an MR,
    # never a maintenance action. This only re-materializes the pinned versions
    # on the controller (ansible-galaxy will not refresh an already-installed
    # collection without --force), so it is never a "change".
    - name: Reinstall the pinned Galaxy collections on the controller
      ansible.builtin.command: ansible-galaxy collection install -r requirements.yml --force
      args:
        chdir: "{{ playbook_dir }}/../.."  # Go up to ansible/ directory
      become: false
      register: collection_update
      changed_when: false

    - name: Display collection update results
      ansible.builtin.debug:
        msg: "{{ collection_update.stdout_lines }}"
