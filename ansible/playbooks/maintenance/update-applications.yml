---
# Reconciles AdGuard Home, adguardhome-sync, Tailscale, Plex and the Ansible
# collections to the versions pinned in group_vars/all.yml. The upgrades are the
# collection roles; this carries the site steps around them. Imported by update-full.yml.

- name: Update AdGuard Home
  hosts: dns
  become: true
  serial: 1  # One host at a time to maintain DNS availability
  # With serial: 1 a failure on the first resolver must stop the run before the
  # second batch takes the surviving resolver down too.
  any_errors_fatal: true
  tasks:
    - name: Display target AdGuard Home version
      ansible.builtin.debug:
        msg: "Reconciling {{ inventory_hostname }} to AdGuard Home {{ adguard_home_version }}"

    - name: Check for an installed AdGuard Home configuration
      ansible.builtin.stat:
        path: "{{ adguard_home_install_path }}/AdGuardHome.yaml"
      register: adguard_home_config_stat

    # CRITICAL: every dns host runs AdGuard Home, so an absent config means a
    # wrong path. Failing here keeps the upgrade from running with no backup.
    - name: Require the AdGuard Home configuration the backup copies
      ansible.builtin.assert:
        that: adguard_home_config_stat.stat.exists
        fail_msg: >-
          {{ adguard_home_install_path }}/AdGuardHome.yaml does not exist; set
          adguard_home_install_path or skip this play

    # One fixed pre-upgrade copy, overwritten each run: adguardhome-sync
    # replicates the config every five minutes and the nightly dump captures it,
    # so a growing backup-<epoch> set only clutters the install dir.
    - name: Back up the AdGuard Home configuration before the upgrade
      ansible.builtin.copy:
        src: "{{ adguard_home_install_path }}/AdGuardHome.yaml"
        dest: "{{ adguard_home_install_path }}/AdGuardHome.yaml.pre-upgrade"
        remote_src: true
        owner: "{{ adguard_home_user | default('adguard') }}"
        group: "{{ adguard_home_group | default(adguard_home_user | default('adguard')) }}"
        mode: "0600"

    # The install dir keeps one .pre-upgrade copy, so any backup-<epoch> file is
    # removed rather than accumulated.
    - name: Remove superseded timestamped AdGuard Home backups
      ansible.builtin.find:
        paths: "{{ adguard_home_install_path }}"
        patterns: "AdGuardHome.yaml.backup-*"
      register: adguard_home_stale_backups

    - name: Delete superseded timestamped AdGuard Home backups
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ adguard_home_stale_backups.files }}"
      loop_control:
        label: "{{ item.path }}"

    # DNS chicken-and-egg: each resolver resolves through itself, so the binary
    # swap would leave it with no resolution. Point resolv.conf at the peer for
    # the window (serial: 1); a single-resolver group has no peer and skips it.
    - name: Upgrade AdGuard Home behind the peer resolver
      vars:
        dns_peer: "{{ (groups['dns'] | difference([inventory_hostname]) | first) | default('') }}"
      block:
        - name: Clear the immutable flag on resolv.conf for the upgrade window
          ansible.builtin.command:
            cmd: chattr -i /etc/resolv.conf
          changed_when: false
          # The file may not be immutable, or the FS may not support attrs.
          failed_when: false

        - name: Back up resolv.conf for the upgrade window
          ansible.builtin.copy:
            src: /etc/resolv.conf
            dest: /etc/resolv.conf.pre-upgrade
            remote_src: true
            mode: "0644"

        - name: Point resolv.conf at the peer DNS server for the upgrade window
          ansible.builtin.copy:
            content: |
              # Temporary DNS configuration during AdGuard upgrade
              # Using {{ dns_peer }} for resolution while {{ inventory_hostname }}'s AdGuard is stopped
              nameserver {{ hostvars[dns_peer].ansible_host }}
            dest: /etc/resolv.conf
            mode: "0644"
          when: dns_peer | length > 0

        - name: Reconcile AdGuard Home to the pinned version
          ansible.builtin.include_role:
            name: weisssrv.infra.adguard_home

        - name: Record that the AdGuard Home reconcile completed
          ansible.builtin.set_fact:
            adguard_reconcile_ok: true
      always:
        # Best-effort first, re-lock resolv.conf, then fail: an earlier fail: would
        # skip the rest of this block. Pointing at the peer still resolves, but leaving
        # the file mutable lets DHCP clobber it, so the +i goes back on either way.
        - name: Start AdGuard Home again after the upgrade window
          ansible.builtin.service:
            name: AdGuardHome
            state: started
          failed_when: false

        - name: Read the AdGuard Home service state  # noqa: command-instead-of-module
          ansible.builtin.command: systemctl is-active AdGuardHome
          register: adguard_home_active
          changed_when: false
          failed_when: false
          check_mode: false

        # The +i below must never lock the temporary peer pointer, so put the
        # pre-upgrade file back whenever the reconcile or the resolver failed.
        - name: Restore resolv.conf when the resolver did not come back
          ansible.builtin.copy:
            src: /etc/resolv.conf.pre-upgrade
            dest: /etc/resolv.conf
            remote_src: true
            mode: "0644"
          register: resolv_conf_restore
          failed_when: false
          when: >-
            not (adguard_reconcile_ok | default(false))
            or (adguard_home_active.stdout | default('') | trim) != 'active'

        - name: Remove the resolv.conf upgrade-window backup
          ansible.builtin.file:
            path: /etc/resolv.conf.pre-upgrade
            state: absent
          failed_when: false
          when:
            - adguard_reconcile_ok | default(false)
            - (adguard_home_active.stdout | default('') | trim) == 'active'

        - name: Re-assert the immutable flag on resolv.conf
          ansible.builtin.command:
            cmd: chattr +i /etc/resolv.conf
          register: resolv_conf_relock
          changed_when: false
          # Already immutable, or the FS does not support attrs — non-fatal, but
          # a real failure leaves the file writable for DHCP, so the terminal
          # message below reports the rc rather than dropping it.
          failed_when: false

        - name: Fail when AdGuard Home is still down after the upgrade window
          ansible.builtin.fail:
            msg: >-
              AdGuard Home on {{ inventory_hostname }} is
              '{{ adguard_home_active.stdout | default('unknown') | trim }}' after the
              upgrade window — this resolver is NOT answering.
              {{ 'resolv.conf restored from the pre-upgrade copy'
                 if resolv_conf_restore.dest is defined
                 else 'resolv.conf still names the peer, chattr -i it before hand-fixing'
              }}, re-lock rc={{ resolv_conf_relock.rc | default('?') }}
              {{ '(NOT immutable — DHCP can clobber it)'
                 if (resolv_conf_relock.rc | default(1)) != 0 else '(immutable)' }};
              fix this host before the peer's own serial: 1 turn takes the other
              resolver down.
          when: (adguard_home_active.stdout | default('') | trim) != 'active'

- name: Update adguardhome-sync (the sync origin only)
  hosts: dns_primary
  become: true
  tasks:
    # The role self-gates on adguard_sync_enabled (host_vars/dns-01.yml), so it
    # is a no-op anywhere the sync is not deployed.
    - name: Reconcile adguardhome-sync to the pinned version
      ansible.builtin.include_role:
        name: weisssrv.infra.adguard_sync

- name: Update Tailscale (Proxmox hosts only)
  hosts: proxmox
  become: true
  serial: 1  # One host at a time
  tasks:
    # The role installs the pinned version with allow_change_held_packages, so a bump
    # moves through the apt hold and the deb's postinst restarts tailscaled. `tailscale
    # up` is gated on BackendState, so an already-joined node needs no auth key.
    - name: Reconcile Tailscale to the pinned version
      ansible.builtin.include_role:
        name: weisssrv.infra.tailscale

- name: Update Plex Media Server
  hosts: plex
  become: true
  tasks:
    # install.yml honours both the pinned and the `latest` value of plex_version
    # and manages the apt hold; the role's service tasks flush the restart
    # handler and wait for /identity before the play ends.
    - name: Reconcile Plex Media Server to the pinned version
      ansible.builtin.include_role:
        name: weisssrv.infra.plex

- name: Update Ansible collections
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    ansible_become: false
  tasks:
    # --force, not --upgrade: requirements.yml is a pin, and bumping it is an MR.
    # This only re-materializes the pinned versions on the controller, which
    # ansible-galaxy will not do for an already-installed collection without --force.
    - name: Reinstall the pinned Galaxy collections on the controller
      ansible.builtin.command: ansible-galaxy collection install -r requirements.yml --force
      args:
        chdir: "{{ playbook_dir }}/../.."  # Go up to ansible/ directory
      become: false
      register: collection_update
      changed_when: false

    - name: Display collection update results
      ansible.builtin.debug:
        msg: "{{ collection_update.stdout_lines }}"
