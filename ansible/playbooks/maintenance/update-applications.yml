---
# Application update playbook
# Updates homelab applications to versions specified in group_vars/all.yml
#
# Covers: AdGuard Home, adguardhome-sync, Tailscale, Plex, Ansible collections
# This playbook is also imported by update-full.yml (single source of truth)

- name: Update AdGuard Home
  hosts: dns
  become: true
  serial: 1  # One host at a time to maintain DNS availability
  vars:
    force_adguard_upgrade: false  # Set to true to force upgrade even if version matches
  tasks:
    - name: Check current AdGuard Home version
      ansible.builtin.command: "{{ adguard_install_path }}/AdGuardHome --version"
      register: current_version
      changed_when: false
      failed_when: false

    - name: Display current version
      ansible.builtin.debug:
        msg: "Current: {{ current_version.stdout | default('not installed') }}, Target: {{ adguard_home_version }}"

    - name: Determine if upgrade needed
      ansible.builtin.set_fact:
        needs_upgrade: >-
          {{
            force_adguard_upgrade or
            current_version.rc != 0 or
            adguard_home_version not in (current_version.stdout | default(''))
          }}

    - name: Skip if no upgrade needed
      ansible.builtin.debug:
        msg: "AdGuard Home already at version {{ adguard_home_version }}, skipping"
      when: not needs_upgrade

    # Upgrade AdGuard with error handling to ensure service always restarts
    - name: Upgrade AdGuard Home with failure recovery
      when: needs_upgrade
      block:
        # Set architecture for download URL (same logic as adguard_home role)
        - name: Set AdGuard Home architecture
          ansible.builtin.set_fact:
            adguard_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

        # DNS chicken-and-egg fix: dns-01 uses itself for DNS resolution
        # Before stopping AdGuard, configure it to use dns-02 temporarily
        - name: Backup resolv.conf (dns-01 only)
          ansible.builtin.copy:
            src: /etc/resolv.conf
            dest: /etc/resolv.conf.backup-upgrade
            remote_src: true
            mode: "0644"
          when: inventory_hostname == 'dns-01'

        - name: Configure temporary DNS to use dns-02 (dns-01 only)
          ansible.builtin.copy:
            content: |
              # Temporary DNS configuration during AdGuard upgrade
              # Using dns-02 for resolution while dns-01's AdGuard is stopped
              nameserver 192.168.0.160
            dest: /etc/resolv.conf
            mode: "0644"
          when: inventory_hostname == 'dns-01'

        - name: Stop AdGuard Home for upgrade
          ansible.builtin.service:
            name: AdGuardHome
            state: stopped

        - name: Backup AdGuard Home configuration
          ansible.builtin.copy:
            src: "{{ adguard_install_path }}/AdGuardHome.yaml"
            dest: "{{ adguard_install_path }}/AdGuardHome.yaml.backup-{{ ansible_date_time.epoch }}"
            remote_src: true
            mode: "0644"

        - name: Download new AdGuard Home version
          ansible.builtin.get_url:
            url: "https://github.com/AdguardTeam/AdGuardHome/releases/download/v{{ adguard_home_version }}/AdGuardHome_linux_{{ adguard_arch }}.tar.gz"
            dest: /tmp/adguardhome-{{ adguard_home_version }}.tar.gz
            mode: "0644"
            timeout: 60

        - name: Extract new version
          ansible.builtin.unarchive:
            src: /tmp/adguardhome-{{ adguard_home_version }}.tar.gz
            dest: /tmp
            remote_src: true

        - name: Install new binary
          ansible.builtin.copy:
            src: /tmp/AdGuardHome/AdGuardHome
            dest: "{{ adguard_install_path }}/AdGuardHome"
            owner: root
            group: root
            mode: "0755"
            remote_src: true

        - name: Start AdGuard Home
          ansible.builtin.service:
            name: AdGuardHome
            state: started

        - name: Wait for AdGuard Home to be ready
          ansible.builtin.wait_for:
            port: "{{ adguard_http_port }}"
            timeout: 60

        # Restore original DNS configuration after AdGuard is back up
        - name: Restore original resolv.conf (dns-01 only)
          ansible.builtin.copy:
            src: /etc/resolv.conf.backup-upgrade
            dest: /etc/resolv.conf
            remote_src: true
            mode: "0644"
          when: inventory_hostname == 'dns-01'

        - name: Remove resolv.conf backup (dns-01 only)
          ansible.builtin.file:
            path: /etc/resolv.conf.backup-upgrade
            state: absent
          when: inventory_hostname == 'dns-01'

        - name: Cleanup download
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /tmp/adguardhome-{{ adguard_home_version }}.tar.gz
            - /tmp/AdGuardHome

      rescue:
        - name: Display upgrade failure warning
          ansible.builtin.debug:
            msg: "WARNING: AdGuard upgrade failed! Ensuring service is started and DNS is restored..."

        - name: Ensure AdGuard Home is started after failure
          ansible.builtin.service:
            name: AdGuardHome
            state: started
          failed_when: false  # Best effort recovery

        - name: Restore original resolv.conf after failure (dns-01 only)
          ansible.builtin.copy:
            src: /etc/resolv.conf.backup-upgrade
            dest: /etc/resolv.conf
            remote_src: true
            mode: "0644"
          when: inventory_hostname == 'dns-01'
          failed_when: false  # Best effort recovery

        - name: Remove resolv.conf backup after failure (dns-01 only)
          ansible.builtin.file:
            path: /etc/resolv.conf.backup-upgrade
            state: absent
          when: inventory_hostname == 'dns-01'
          failed_when: false  # Best effort cleanup

        - name: Fail with original error
          ansible.builtin.fail:
            msg: "AdGuard Home upgrade failed. Service has been restarted with previous version."

    - name: Verify new version
      ansible.builtin.command: "{{ adguard_install_path }}/AdGuardHome --version"
      changed_when: false
      register: new_version

    - name: Display upgrade result
      ansible.builtin.debug:
        msg: "AdGuard Home {{ 'upgraded to' if needs_upgrade else 'already at' }} version: {{ new_version.stdout }}"

- name: Update adguardhome-sync (dns-01 only)
  hosts: dns-01
  become: true
  vars:
    force_sync_upgrade: false
  tasks:
    - name: Check if adguardhome-sync exists
      ansible.builtin.stat:
        path: /usr/local/bin/adguardhome-sync
      register: sync_binary

    - name: Get current version if exists
      ansible.builtin.command: /usr/local/bin/adguardhome-sync --version
      register: current_sync_version
      changed_when: false
      failed_when: false
      when: sync_binary.stat.exists

    - name: Display current vs target version
      ansible.builtin.debug:
        msg: "Current: {{ current_sync_version.stdout | default('not installed') }}, Target: {{ adguardhome_sync_version }}"

    - name: Determine if sync upgrade needed
      ansible.builtin.set_fact:
        needs_sync_upgrade: >-
          {{
            force_sync_upgrade or
            not sync_binary.stat.exists or
            adguardhome_sync_version not in (current_sync_version.stdout | default(''))
          }}

    - name: Skip if no upgrade needed
      ansible.builtin.debug:
        msg: "adguardhome-sync already at version {{ adguardhome_sync_version }}, skipping"
      when: not needs_sync_upgrade

    - name: Upgrade adguardhome-sync with safe restart handling
      when: needs_sync_upgrade
      block:
        # Set architecture for download URL (same logic as adguard_home role)
        - name: Set adguardhome-sync architecture
          ansible.builtin.set_fact:
            adguard_sync_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

        - name: Download new adguardhome-sync version
          ansible.builtin.get_url:
            url: "https://github.com/bakito/adguardhome-sync/releases/download/v{{ adguardhome_sync_version }}/adguardhome-sync_{{ adguardhome_sync_version }}_linux_{{ adguard_sync_arch }}.tar.gz"  # noqa yaml[line-length]
            dest: /tmp/adguardhome-sync.tar.gz
            mode: "0644"
            timeout: 60
          register: sync_download

        - name: Extract adguardhome-sync
          ansible.builtin.unarchive:
            src: /tmp/adguardhome-sync.tar.gz
            dest: /tmp
            remote_src: true

        - name: Stop sync timer before upgrade
          ansible.builtin.systemd:
            name: adguardhome-sync.timer
            state: stopped

        - name: Install new binary
          ansible.builtin.copy:
            src: /tmp/adguardhome-sync
            dest: /usr/local/bin/adguardhome-sync
            owner: root
            group: root
            mode: "0755"
            remote_src: true

      always:
        - name: Ensure sync timer is started after upgrade (even on failure)
          ansible.builtin.systemd:
            name: adguardhome-sync.timer
            state: started
            daemon_reload: true

    - name: Cleanup
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/adguardhome-sync.tar.gz
        - /tmp/adguardhome-sync
      when: needs_sync_upgrade

    - name: Display upgrade result
      ansible.builtin.debug:
        msg: "adguardhome-sync {{ 'upgraded' if needs_sync_upgrade else 'already at version ' + adguardhome_sync_version }}"

- name: Update Tailscale (Proxmox hosts only)
  hosts: proxmox
  become: true
  serial: 1  # One host at a time
  tasks:
    - name: Check current Tailscale version
      ansible.builtin.command: tailscale version
      register: current_tailscale_version
      changed_when: false
      failed_when: false

    - name: Parse current Tailscale version
      ansible.builtin.set_fact:
        tailscale_installed: "{{ current_tailscale_version.stdout_lines[0] | default('') }}"
      when: current_tailscale_version.rc == 0

    # NOTE: We intentionally compare the base version from `tailscale version`
    # (e.g., "1.94.1") against our pinned tailscale_version, not the full Debian
    # package version (e.g., "1.94.1-2"). This means Debian revision-only bumps
    # (packaging fixes, not functional changes) won't trigger an upgrade.
    # This is acceptable for a homelab -- revision bumps rarely matter for
    # Tailscale and avoiding unnecessary restarts preserves VPN stability.
    # If revision-level tracking is ever needed, compare against:
    #   dpkg-query -W -f='${Version}' tailscale | sed 's/^//'
    - name: Display version info
      ansible.builtin.debug:
        msg: "Current: {{ tailscale_installed | default('not detected') }}, Target: {{ tailscale_version }}"

    - name: Determine if Tailscale upgrade needed
      ansible.builtin.set_fact:
        needs_tailscale_upgrade: >-
          {{
            current_tailscale_version.rc != 0 or
            (tailscale_installed | default('')) != tailscale_version
          }}

    - name: Skip if no upgrade needed
      ansible.builtin.debug:
        msg: "Tailscale already at version {{ tailscale_version }}, skipping"
      when: not needs_tailscale_upgrade

    - name: Upgrade Tailscale package
      ansible.builtin.apt:
        name: "tailscale={{ tailscale_version }}"
        state: present
        update_cache: true
        allow_downgrade: true
      when: needs_tailscale_upgrade

    - name: Restart Tailscale service if upgraded
      ansible.builtin.systemd:
        name: tailscaled
        state: restarted
        daemon_reload: true
      when: needs_tailscale_upgrade

    - name: Verify Tailscale version after upgrade
      ansible.builtin.command: tailscale version
      register: new_tailscale_version
      changed_when: false

    - name: Display upgrade result
      ansible.builtin.debug:
        msg: >-
          Tailscale {{ 'upgraded to' if needs_tailscale_upgrade else 'already at' }}
          version: {{ new_tailscale_version.stdout_lines[0] | default('unknown') }}

- name: Update Plex Media Server
  hosts: plex
  become: true
  vars:
    force_plex_upgrade: false  # Set to true to force apt upgrade
  tasks:
    - name: Check current Plex version
      ansible.builtin.command: dpkg-query -W -f='${Version}' plexmediaserver
      register: current_plex_version
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Display current Plex version
      ansible.builtin.debug:
        msg: "Current: {{ current_plex_version.stdout | default('not installed') }}, Target: {{ plex_version }}"

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    # When plex_version is "latest": upgrade to whatever apt has available
    - name: Check for available Plex updates (latest mode)
      ansible.builtin.shell: |
        set -o pipefail
        apt list --upgradable 2>/dev/null | grep plexmediaserver || echo "no updates"
      args:
        executable: /bin/bash
      register: plex_upgradable
      changed_when: false
      check_mode: false
      when: plex_version == 'latest'

    - name: Upgrade Plex Media Server (latest mode)  # noqa package-latest
      ansible.builtin.apt:
        name: plexmediaserver
        state: latest
      when: plex_version == 'latest' and (force_plex_upgrade or 'plexmediaserver' in (plex_upgradable.stdout | default('')))
      register: plex_upgrade_latest

    # When plex_version is pinned: install that exact version
    - name: Determine if pinned version differs from installed
      ansible.builtin.set_fact:
        needs_plex_upgrade: >-
          {{
            force_plex_upgrade or
            current_plex_version.rc != 0 or
            plex_version != (current_plex_version.stdout | default(''))
          }}
      when: plex_version != 'latest'

    - name: Install pinned Plex version
      ansible.builtin.apt:
        name: "plexmediaserver={{ plex_version }}"
        state: present
        allow_downgrade: true
      when: plex_version != 'latest' and (needs_plex_upgrade | default(false))
      register: plex_upgrade_pinned

    # Safe handling of upgrade result registers
    # The pattern (var | default({})).changed | default(false) ensures:
    # 1. If var is undefined, we get {} (empty dict)
    # 2. Accessing .changed on {} returns undefined, which defaults to false
    # This avoids Ansible errors when a register was never set (e.g., skipped tasks)
    - name: Set combined upgrade result
      ansible.builtin.set_fact:
        plex_was_upgraded: >-
          {{
            ((plex_upgrade_latest | default({})).changed | default(false)) or
            ((plex_upgrade_pinned | default({})).changed | default(false))
          }}

    - name: Restart Plex service if upgraded  # noqa no-handler
      ansible.builtin.systemd:
        name: plexmediaserver
        state: restarted
      when: plex_was_upgraded | bool

    - name: Wait for Plex to be ready  # noqa no-handler
      ansible.builtin.wait_for:
        port: 32400
        timeout: 60
      when: plex_was_upgraded | bool

    - name: Verify Plex version after upgrade
      ansible.builtin.command: dpkg-query -W -f='${Version}' plexmediaserver
      register: new_plex_version
      changed_when: false
      check_mode: false

    - name: Display Plex upgrade result
      ansible.builtin.debug:
        msg: "Plex {{ 'upgraded to' if (plex_was_upgraded | bool) else 'already at' }} version: {{ new_plex_version.stdout }}"

- name: Update Ansible collections
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    ansible_become: false
  tasks:
    - name: Update Galaxy collections
      ansible.builtin.command: ansible-galaxy collection install -r requirements.yml --upgrade
      args:
        chdir: "{{ playbook_dir }}/../.."  # Go up to ansible/ directory
      become: false
      register: collection_update
      changed_when: "'was installed successfully' in collection_update.stdout or 'Upgrading' in collection_update.stdout"

    - name: Display collection update results
      ansible.builtin.debug:
        msg: "{{ collection_update.stdout_lines }}"
