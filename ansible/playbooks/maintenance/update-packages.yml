---
# OS package update playbook
# Performs rolling updates one host at a time to minimize disruption

- name: Update OS packages on all hosts (rolling)
  hosts: base_managed
  become: true
  serial: 1  # One host at a time
  tasks:
    # Shared with update-full.yml Phase 1 — apt upgrade, reboot routing, nfsd recovery.
    - name: Upgrade packages and handle the reboot
      ansible.builtin.include_tasks: _apt-upgrade-and-reboot.yml
      vars:
        apt_upgrade_phase_label: "Updating packages on {{ inventory_hostname }}"

- name: Update OS packages on k3s nodes (rolling; kernel reboots delegated to kured)
  hosts: k3s
  become: true
  serial: 1  # One node at a time to maintain cluster availability
  tasks:
    # Verify kured is rolled out ONCE, up front, while it is idle: a dead or
    # absent kured means the sentinel below flags a reboot that never happens.
    # `when: inventory_hostname == ansible_play_hosts_all[0]` — NOT run_once,
    # which re-fires per serial:1 batch and would abort on a node whose kured pod
    # is legitimately mid-reboot. Catches kured ABSENT only; present-but-wedged is
    # backstopped by NodeStuckCordoned + the MaintenanceRebootDeferred metric.
    - name: Verify kured DaemonSet is healthy before delegating reboots to it
      ansible.builtin.command: >-
        k3s kubectl -n kube-system rollout status ds/kured --timeout=120s
      register: kured_rollout
      changed_when: false
      # Budget tolerates an agent VM still rejoining after an earlier host
      # reboot. Delegates to a server other than the first play host, falling
      # back to the first server.
      retries: 6
      delay: 20
      until: kured_rollout.rc == 0
      run_once: true
      when: inventory_hostname == ansible_play_hosts_all[0]
      delegate_to: "{{ (groups['k3s_servers'] | difference([inventory_hostname]) | first) | default(groups['k3s_servers'][0]) }}"

    - name: Display current k3s node being updated
      ansible.builtin.debug:
        msg: "=== Updating k3s node: {{ inventory_hostname }} ==="

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    - name: Check for available updates
      ansible.builtin.command: apt list --upgradable
      register: upgradable_packages
      changed_when: false

    - name: Display available updates
      ansible.builtin.debug:
        msg: "{{ upgradable_packages.stdout_lines }}"
      when: upgradable_packages.stdout_lines | length > 1

    - name: Upgrade packages (safe upgrade)
      ansible.builtin.apt:
        upgrade: safe
        autoclean: true
        autoremove: true
      register: apt_upgrade

    - name: Display upgrade summary
      ansible.builtin.debug:
        msg:
          - "Packages upgraded: {{ apt_upgrade.changed }}"
          - "{{ apt_upgrade.stdout_lines | default([]) }}"

    - name: Check and detect if reboot needed (skip actual reboot - kured handles it)
      ansible.builtin.include_tasks: _reboot-if-needed.yml
      vars:
        skip_reboot: true

    # k3s kernel reboots are kured's job — draining from CI would evict the
    # executor's own pod and deadlock. Flagging the sentinel hands the node to
    # kured, which reboots one at a time, outliving this job. See
    # kubernetes/infrastructure/controllers/kured/release.yaml.
    - name: Flag node for kured reboot (kernel updated)
      ansible.builtin.file:
        path: /var/run/reboot-required
        state: touch
        mode: "0644"
      when: reboot_required | bool

    - name: Report node flagged for kured
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} flagged /var/run/reboot-required; kured will
          cordon/drain/reboot/uncordon it (one node at a time).
      when: reboot_required | bool

- name: Update OS packages on application hosts (rolling)
  # app_servers = plex, gitlab, nextcloud, immich, immich-ml (see hosts.yml).
  hosts: app_servers
  become: true
  serial: 1  # One host at a time
  tasks:
    - name: Display current host being updated
      ansible.builtin.debug:
        msg: "=== Updating application host: {{ inventory_hostname }} ==="

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    - name: Check for available updates
      ansible.builtin.command: apt list --upgradable
      register: upgradable_packages
      changed_when: false

    - name: Display available updates
      ansible.builtin.debug:
        msg: "{{ upgradable_packages.stdout_lines }}"
      when: upgradable_packages.stdout_lines | length > 1

    - name: Upgrade packages (safe upgrade)
      ansible.builtin.apt:
        upgrade: safe
        autoclean: true
        autoremove: true
      register: apt_upgrade

    - name: Display upgrade summary
      ansible.builtin.debug:
        msg:
          - "Packages upgraded: {{ apt_upgrade.changed }}"
          - "{{ apt_upgrade.stdout_lines | default([]) }}"

    - name: Check and reboot if needed
      ansible.builtin.include_tasks: _reboot-if-needed.yml

    - name: Verify services after reboot
      ansible.builtin.service:
        name: ssh
        state: started
      when: reboot_required | bool

- name: Update summary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "========================================="
          - "Package Update Complete"
          - "========================================="
          - "Updated hosts:"
          - "  - Base infrastructure (Proxmox, DNS, SMTP)"
          - "  - K3s cluster nodes (kernel reboots delegated to kured, one node at a time)"
          - "  - Application hosts (Plex, GitLab, Nextcloud, Immich, immich-ml)"
          - "Check the output above for any hosts that required reboots."
