---
# OS package update playbook
# Performs rolling updates one host at a time to minimize disruption

- name: Update OS packages on all hosts (rolling)
  hosts: base_managed
  become: true
  serial: 1  # One host at a time
  tasks:
    - name: Display current host being updated
      ansible.builtin.debug:
        msg: "Updating packages on {{ inventory_hostname }}"

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    - name: Check for available updates
      ansible.builtin.command: apt list --upgradable
      register: upgradable_packages
      changed_when: false

    - name: Display available updates
      ansible.builtin.debug:
        msg: "{{ upgradable_packages.stdout_lines }}"
      when: upgradable_packages.stdout_lines | length > 1

    - name: Upgrade packages (safe upgrade)
      ansible.builtin.apt:
        upgrade: safe
        autoclean: true
        autoremove: true
      register: apt_upgrade

    - name: Display upgrade summary
      ansible.builtin.debug:
        msg:
          - "Packages upgraded: {{ apt_upgrade.changed }}"
          - "{{ apt_upgrade.stdout_lines | default([]) }}"

    - name: Check and reboot if needed
      ansible.builtin.include_tasks: _reboot-if-needed.yml

    - name: Verify services after reboot
      ansible.builtin.service:
        name: ssh
        state: started
      when: reboot_required | bool

    - name: Ensure the NFS server is healthy after the upgrade (recover nfsd stop-hang)
      ansible.builtin.include_tasks: _ensure-nfs-server-healthy.yml

- name: Update OS packages on k3s nodes (rolling; kernel reboots delegated to kured)
  hosts: k3s
  become: true
  serial: 1  # One node at a time to maintain cluster availability
  tasks:
    # Verify ONCE, up front (before any node is flagged, so kured is idle and every
    # server VM is up to delegate to), that kured is actually rolled out. If it is
    # dead/absent, touching the sentinel later would silently flag a reboot that
    # never happens (the node stays Ready — invisible to verify); fail loudly here.
    # Retries ride out a transient mid-rollout (e.g. a Flux chart bump just landed).
    # This catches kured ABSENT, not kured present-but-wedged (lock held / alert-
    # paused) — that residual is backstopped by the verify's NodeStuckCordoned and
    # the MaintenanceRebootDeferred metric. MUST run truly ONCE at play start:
    # run_once alone runs once PER SERIAL BATCH, and with serial:1 every node is its
    # own batch, so run_once would re-run on every node — and on later nodes
    # `rollout status ds/kured` legitimately reports NotAvailable (an earlier node's
    # kured pod is gone mid-reboot) and would abort the rolling update. The
    # `when: == ansible_play_hosts_all[0]` (first host of the WHOLE play, stable
    # across batches) pins it to a single up-front execution while kured is idle.
    - name: Verify kured DaemonSet is healthy before delegating reboots to it
      ansible.builtin.command: >-
        k3s kubectl -n kube-system rollout status ds/kured --timeout=120s
      register: kured_rollout
      changed_when: false
      # ~3 min budget: tolerant of an AGENT VM still rejoining after a play-1 host
      # reboot (kured pod re-scheduling) so this doesn't spuriously fail. Delegate to
      # a server NOT the first play host, falling back to the first server (resilient
      # pattern used elsewhere), in case that server is itself momentarily down.
      retries: 6
      delay: 20
      until: kured_rollout.rc == 0
      run_once: true
      when: inventory_hostname == ansible_play_hosts_all[0]
      delegate_to: "{{ (groups['k3s_servers'] | difference([inventory_hostname]) | first) | default(groups['k3s_servers'][0]) }}"

    - name: Display current k3s node being updated
      ansible.builtin.debug:
        msg: "=== Updating k3s node: {{ inventory_hostname }} ==="

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    - name: Check for available updates
      ansible.builtin.command: apt list --upgradable
      register: upgradable_packages
      changed_when: false

    - name: Display available updates
      ansible.builtin.debug:
        msg: "{{ upgradable_packages.stdout_lines }}"
      when: upgradable_packages.stdout_lines | length > 1

    - name: Upgrade packages (safe upgrade)
      ansible.builtin.apt:
        upgrade: safe
        autoclean: true
        autoremove: true
      register: apt_upgrade

    - name: Display upgrade summary
      ansible.builtin.debug:
        msg:
          - "Packages upgraded: {{ apt_upgrade.changed }}"
          - "{{ apt_upgrade.stdout_lines | default([]) }}"

    - name: Check and detect if reboot needed (skip actual reboot - kured handles it)
      ansible.builtin.include_tasks: _reboot-if-needed.yml
      vars:
        skip_reboot: true

    # k3s node KERNEL reboots are delegated to kured (Kubernetes Reboot Daemon,
    # a DaemonSet). We do NOT cordon/drain/reboot here: from a CI job that would
    # drain the very node hosting the job's own runner executor pod and deadlock
    # (observed: maintenance-run-all hung ~29 min on the executor's node).
    # Instead we flag the sentinel; kured reboots each flagged node one at a time
    # (cordon -> drain -> reboot -> uncordon), decoupled from and surviving this
    # CI job. See kubernetes/infrastructure/controllers/kured/release.yaml.
    - name: Flag node for kured reboot (kernel updated)
      ansible.builtin.file:
        path: /var/run/reboot-required
        state: touch
        mode: "0644"
      when: reboot_required | bool

    - name: Report node flagged for kured
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} flagged /var/run/reboot-required; kured will
          cordon/drain/reboot/uncordon it (one node at a time).
      when: reboot_required | bool

- name: Update OS packages on application hosts (rolling)
  # app_servers = plex, gitlab, nextcloud, immich, immich-ml (see hosts.yml).
  hosts: app_servers
  become: true
  serial: 1  # One host at a time
  tasks:
    - name: Display current host being updated
      ansible.builtin.debug:
        msg: "=== Updating application host: {{ inventory_hostname }} ==="

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    - name: Check for available updates
      ansible.builtin.command: apt list --upgradable
      register: upgradable_packages
      changed_when: false

    - name: Display available updates
      ansible.builtin.debug:
        msg: "{{ upgradable_packages.stdout_lines }}"
      when: upgradable_packages.stdout_lines | length > 1

    - name: Upgrade packages (safe upgrade)
      ansible.builtin.apt:
        upgrade: safe
        autoclean: true
        autoremove: true
      register: apt_upgrade

    - name: Display upgrade summary
      ansible.builtin.debug:
        msg:
          - "Packages upgraded: {{ apt_upgrade.changed }}"
          - "{{ apt_upgrade.stdout_lines | default([]) }}"

    - name: Check and reboot if needed
      ansible.builtin.include_tasks: _reboot-if-needed.yml

    - name: Verify services after reboot
      ansible.builtin.service:
        name: ssh
        state: started
      when: reboot_required | bool

- name: Update summary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "========================================="
          - "Package Update Complete"
          - "========================================="
          - "Updated hosts:"
          - "  - Base infrastructure (Proxmox, DNS, SMTP)"
          - "  - K3s cluster nodes (kernel reboots delegated to kured, one node at a time)"
          - "  - Application hosts (Plex, GitLab, Nextcloud, Immich, immich-ml)"
          - "Check the output above for any hosts that required reboots."
