---
# Full system update playbook
# Updates both OS packages AND applications in a single operation
# Performs rolling updates to minimize service disruption
#
# Phase 1: OS packages (rolling, one host at a time)
# Phase 2-5: Applications (imported from update-applications.yml)

# NOTE: Inventory order is NOT a safety mechanism here. The reboot protections
# live in _reboot-if-needed.yml: pve-nas-01 sets proxmox_self_reboot_safe: false
# so its reboot is always DEFERRED to an operator, and the CI executor
# self-host detection defers/detaches the reboot of whichever host runs the
# executor VM (covering pve-prec-01 when it hosts the runner).
- name: Full system update - OS packages (rolling)
  hosts: base_managed
  become: true
  serial: 1  # One host at a time for safety
  tasks:
    # Shared with update-packages.yml play 1 — apt upgrade, reboot routing, nfsd recovery.
    - name: Upgrade packages and handle the reboot
      ansible.builtin.include_tasks: _apt-upgrade-and-reboot.yml
      vars:
        apt_upgrade_phase_label: "=== Updating {{ inventory_hostname }} - Phase 1: OS Packages ==="

# Phase 2-5: Import application updates (single source of truth)
- name: Full system update - Applications
  ansible.builtin.import_playbook: update-applications.yml

- name: Full system update - Final summary
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    ansible_become: false
  tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "========================================="
          - "Full System Update Complete"
          - "========================================="
          - "- OS packages updated on base infrastructure hosts (Proxmox, DNS, mail). K3s nodes and application VMs use separate update-packages.yml playbook."
          - "- AdGuard Home updated on DNS servers"
          - "- adguardhome-sync updated on dns-01"
          - "- Tailscale updated on Proxmox hosts"
          - "- Plex Media Server updated"
          - "- Ansible collections updated"
          - ""
          - "Verify deployment with: task infra:verify"
