---
# Full system update playbook
# Updates both OS packages AND applications in a single operation
# Performs rolling updates to minimize service disruption
#
# Phase 1: OS packages (rolling, one host at a time)
# Phase 2-5: Applications (imported from update-applications.yml)

- name: Full system update - OS packages (rolling)
  hosts: base_managed
  become: true
  serial: 1  # One host at a time for safety
  tasks:
    - name: Display current host being updated
      ansible.builtin.debug:
        msg: "=== Updating {{ inventory_hostname }} - Phase 1: OS Packages ==="

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    - name: Check for available package updates
      ansible.builtin.command: apt list --upgradable
      register: upgradable_packages
      changed_when: false

    - name: Display available package updates
      ansible.builtin.debug:
        msg: "{{ upgradable_packages.stdout_lines }}"
      when: upgradable_packages.stdout_lines | length > 1

    - name: Upgrade packages (safe upgrade)
      ansible.builtin.apt:
        upgrade: safe
        autoclean: true
        autoremove: true
      register: apt_upgrade

    - name: Display package upgrade summary
      ansible.builtin.debug:
        msg:
          - "Packages upgraded: {{ apt_upgrade.changed }}"
          - "{{ apt_upgrade.stdout_lines | default([]) }}"

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Display reboot requirement
      ansible.builtin.debug:
        msg: "WARNING: {{ inventory_hostname }} requires reboot after package updates"
      when: reboot_required.stat.exists

    - name: Pause for manual reboot decision
      ansible.builtin.pause:
        prompt: |
          {{ inventory_hostname }} requires a reboot after package updates.
          Press ENTER to reboot now and continue with application updates, or Ctrl+C then 'A' to abort.
      when:
        - reboot_required.stat.exists
        - not (auto_reboot | default(false))

    - name: Reboot host if required
      ansible.builtin.reboot:
        reboot_timeout: 300
        msg: "Rebooting {{ inventory_hostname }} after package updates"
      when: reboot_required.stat.exists

    - name: Wait for host to come back online
      ansible.builtin.wait_for_connection:
        timeout: 300
      when: reboot_required.stat.exists

    - name: Verify SSH service after reboot
      ansible.builtin.service:
        name: ssh
        state: started
      when: reboot_required.stat.exists

# Phase 2-5: Import application updates (single source of truth)
- name: Full system update - Applications
  ansible.builtin.import_playbook: update-applications.yml

- name: Full system update - Final summary
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    ansible_become: false
  tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "========================================="
          - "Full System Update Complete"
          - "========================================="
          - "- OS packages updated on all hosts"
          - "- AdGuard Home updated on DNS servers"
          - "- adguardhome-sync updated on dns-01"
          - "- Tailscale updated on Proxmox hosts"
          - "- Plex Media Server updated"
          - "- Ansible collections updated"
          - ""
          - "Verify deployment with: task deploy:verify"
