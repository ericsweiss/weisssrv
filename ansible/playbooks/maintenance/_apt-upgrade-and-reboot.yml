---
# Shared OS-patch phase: apt upgrade, the reboot decision
# (_reboot-if-needed.yml), then the nfsd stop-hang recovery. Included by
# update-packages.yml and update-full.yml. Optional var: apt_upgrade_phase_label.

- name: Upgrade packages
  ansible.builtin.include_tasks: _apt-upgrade.yml

- name: Check and reboot if needed
  ansible.builtin.include_tasks: _reboot-if-needed.yml

- name: Verify SSH service after reboot
  ansible.builtin.service:
    name: ssh
    state: started
  when: reboot_required | bool

- name: Ensure the NFS server is healthy after the upgrade (recover nfsd stop-hang)
  ansible.builtin.include_tasks: _ensure-nfs-server-healthy.yml
