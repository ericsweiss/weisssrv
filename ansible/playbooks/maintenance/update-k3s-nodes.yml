---
# Rolling k3s binary upgrade, serial:1 per play (servers, then agents).
# Cordon only, never drain — see the note above the cordon task.

- name: Pre-flight checks
  hosts: k3s
  gather_facts: true
  tasks:
    - name: Check k3s service status
      ansible.builtin.systemd:
        name: "{{ 'k3s' if k3s_role == 'server' else 'k3s-agent' }}"
      check_mode: true

    - name: Verify kubectl access (servers only)
      ansible.builtin.command: k3s kubectl get nodes
      changed_when: false
      when: k3s_role == 'server'
      delegate_to: "{{ groups['k3s_servers'][0] }}"
      run_once: true

    - name: Display cluster node status
      ansible.builtin.command: k3s kubectl get nodes -o wide
      changed_when: false
      delegate_to: "{{ groups['k3s_servers'][0] }}"
      run_once: true
      register: node_status

    - name: Show current cluster state
      ansible.builtin.debug:
        msg: "{{ node_status.stdout_lines }}"
      run_once: true

- name: Update k3s server nodes
  hosts: k3s_servers
  become: true
  serial: 1  # One server at a time for HA
  tasks:
    - name: Display current node being updated
      ansible.builtin.debug:
        msg: "=== Updating k3s server: {{ inventory_hostname }} ==="

    # Shared with the k3s role: get_url to /root/k3s-install.sh with the
    # tag-pinned URL + k3s_install_script_checksum — no `curl | sh`, so the
    # root-run installer is verified before it executes.
    - name: Detect k3s version and stage install script
      ansible.builtin.include_role:
        name: weisssrv.infra.k3s
        tasks_from: install-script.yml

    - name: Skip if version matches
      ansible.builtin.meta: end_host
      when: k3s_installed_version is defined and k3s_installed_version == k3s_version

    # Wrapped in block/always to guarantee the node is uncordoned even if
    # any task fails mid-sequence (e.g., upgrade failure, restart timeout).
    - name: Upgrade k3s server with guaranteed uncordon
      block:
        # CRITICAL: restarting this server's k3s briefly drops its etcd member,
        # so it must not run while kured is mid-reboot of another server — two
        # of three down loses quorum. The check runs before the cordon and is
        # re-asserted right before the restart to shrink the check-to-act window.
        - name: Serialize against kured before cordoning/upgrading this server (etcd quorum)
          ansible.builtin.include_tasks: _wait-no-kured-server-reboot.yml
          vars:
            kured_clear_reason: "before upgrading {{ inventory_hostname }}"
            kured_clear_delegate: "{{ k3s_delegate_server }}"

        # No drain: containerd persists running pods across a kubelet restart,
        # and draining the executor's own node would deadlock the CI job. The
        # cordon blocks new scheduling for the minute or two the upgrade takes.
        - name: Cordon node before upgrade
          ansible.builtin.command: k3s kubectl cordon {{ inventory_hostname }}
          changed_when: true
          delegate_to: "{{ k3s_delegate_server }}"

        - name: Upgrade k3s server binary (staged installer)
          ansible.builtin.command: /root/k3s-install.sh server
          environment:
            INSTALL_K3S_VERSION: "{{ k3s_version }}"
            INSTALL_K3S_SKIP_START: "true"
          changed_when: true

        - name: Re-assert kured is not rebooting any server right before the k3s restart
          ansible.builtin.include_tasks: _wait-no-kured-server-reboot.yml
          vars:
            kured_clear_reason: "before restarting k3s on {{ inventory_hostname }}"
            kured_clear_delegate: "{{ k3s_delegate_server }}"

        - name: Restart k3s service
          ansible.builtin.systemd:
            name: k3s
            state: restarted
            daemon_reload: true

        # /readyz gates on the apiserver being fully ready to serve. A plain
        # `kubectl get nodes` can pass while etcd is still rejoining, letting
        # serial:1 advance to the next server too early.
        - name: Wait for k3s API healthy (/readyz)
          ansible.builtin.command: k3s kubectl --request-timeout=5s get --raw=/readyz
          register: k3s_ready
          retries: 30
          delay: 10
          until: k3s_ready.rc == 0
          changed_when: false

        - name: Verify new k3s version
          ansible.builtin.command: k3s --version
          register: k3s_new_version
          changed_when: false

        - name: Display upgrade result
          ansible.builtin.debug:
            msg: "Server {{ inventory_hostname }} upgraded to: {{ k3s_new_version.stdout }}"

      always:
        - name: Uncordon node and wait for Ready (always runs)
          ansible.builtin.include_tasks: _uncordon-and-wait-ready.yml

- name: Update k3s agent nodes
  hosts: k3s_agents
  become: true
  serial: 1  # One agent at a time to minimize disruption
  tasks:
    - name: Display current node being updated
      ansible.builtin.debug:
        msg: "=== Updating k3s agent: {{ inventory_hostname }} ==="

    # Version detection + staged installer download (see server play note).
    - name: Detect k3s version and stage install script
      ansible.builtin.include_role:
        name: weisssrv.infra.k3s
        tasks_from: install-script.yml

    - name: Skip if version matches
      ansible.builtin.meta: end_host
      when: k3s_installed_version is defined and k3s_installed_version == k3s_version

    # Special handling for nodes with persistent storage
    - name: Check if node has persistent workloads
      ansible.builtin.command: >
        k3s kubectl get pods --all-namespaces --field-selector spec.nodeName={{ inventory_hostname }}
        -o jsonpath='{.items[?(@.spec.volumes[*].persistentVolumeClaim)].metadata.name}'
      register: persistent_pods
      changed_when: false
      delegate_to: "{{ k3s_delegate_server }}"

    - name: Warn about persistent workloads
      ansible.builtin.debug:
        msg: "WARNING: Node {{ inventory_hostname }} has pods with persistent storage: {{ persistent_pods.stdout }}"
      when: persistent_pods.stdout != ""

    # Wrapped in block/always to guarantee the node is uncordoned even if
    # any task fails mid-sequence (e.g., upgrade failure, restart timeout).
    - name: Upgrade k3s agent with guaranteed uncordon
      block:
        - name: Cordon node before upgrade
          ansible.builtin.command: k3s kubectl cordon {{ inventory_hostname }}
          changed_when: true
          delegate_to: "{{ k3s_delegate_server }}"

        # The "agent" argument is REQUIRED: without it the installer sets up
        # server mode and creates k3s.service instead of k3s-agent.service.
        - name: Upgrade k3s agent binary (staged installer)
          ansible.builtin.command: /root/k3s-install.sh agent
          environment:
            INSTALL_K3S_VERSION: "{{ k3s_version }}"
            INSTALL_K3S_SKIP_START: "true"
            K3S_URL: "https://{{ k3s_api_vip }}:{{ k3s_api_port }}"
            # Lower-privilege agent token, so an upgrade rewrites the agent env
            # file with it rather than the cluster token — docs/19 "Agent token".
            K3S_TOKEN: "{{ k3s_agent_token }}"
          changed_when: true
          # no_log censors the whole result, so the failure is reported by the
          # assert below instead — it names the host, version and rc.
          no_log: true
          failed_when: false
          register: k3s_agent_install

        - name: Verify the staged k3s agent installer succeeded
          ansible.builtin.assert:
            that:
              - (k3s_agent_install.rc | default(1)) == 0
            fail_msg: >-
              /root/k3s-install.sh agent failed on {{ inventory_hostname }} for
              k3s {{ k3s_version }} (rc={{ k3s_agent_install.rc | default('?') }}).
              Re-run it by hand on the node to see the output; it is censored
              here because K3S_TOKEN is in the task environment.
          when: not (k3s_agent_install.skipped | default(false))

        # Agents must never run k3s.service (the server unit); it may not exist
        # on a clean agent install, hence the stat.
        - name: Check if k3s.service exists (server service on agent node)
          ansible.builtin.stat:
            path: /etc/systemd/system/k3s.service
          register: k3s_server_service

        - name: Stop and disable k3s.service if present (wrong service for agent)
          ansible.builtin.systemd:
            name: k3s
            state: stopped
            enabled: false
            daemon_reload: true
          when: k3s_server_service.stat.exists

        # Cordon, never drain: the CI executor pod always runs on an agent, and
        # draining it deadlocks the job. containerd keeps containers alive
        # across a kubelet restart.
        - name: Restart k3s-agent service
          ansible.builtin.systemd:
            name: k3s-agent
            state: restarted
            daemon_reload: true

        - name: Wait for agent to register
          ansible.builtin.command: k3s kubectl get node {{ inventory_hostname }}
          register: k3s_agent_ready
          retries: 30
          delay: 10
          until: k3s_agent_ready.rc == 0
          changed_when: false
          delegate_to: "{{ k3s_delegate_server }}"

        - name: Wait for pods to stabilize on upgraded node
          # Mirrors list_unhealthy_pods in scripts/maintenance-lib.sh so this
          # gate and post-maintenance-verify.sh agree. Inlined because the task
          # delegates to a k3s server, which has no copy of the repo.
          ansible.builtin.shell: |
            set -o pipefail
            k3s kubectl get pods --all-namespaces \
              --field-selector spec.nodeName={{ inventory_hostname }} \
              --no-headers 2>/dev/null \
            | awk -v runner_ns='{{ maintenance_ci_runner_namespaces | default([]) | join(" ") }}' \
                  -v runner_prefix='{{ maintenance_ci_executor_pod_prefix | default("runner-") }}' '
                BEGIN { n = split(runner_ns, ns, " "); for (i = 1; i <= n; i++) runner[ns[i]] = 1 }
                $4 == "Completed" || $4 == "Succeeded" || $4 == "Error" || $4 == "Failed" { next }
                # Runner JOB pods are pipeline state, not cluster health.
                ($1 in runner) && index($2, runner_prefix) == 1 { next }
                { split($3, a, "/"); if ($4 != "Running" || a[1] != a[2]) print }' \
            | wc -l
          args:
            executable: /bin/bash
          register: unhealthy_on_node
          retries: 30
          delay: 10
          until: unhealthy_on_node.stdout | int == 0
          changed_when: false
          delegate_to: "{{ k3s_delegate_server }}"

        - name: Verify new k3s version
          ansible.builtin.command: k3s --version
          register: k3s_new_version
          changed_when: false

        - name: Display upgrade result
          ansible.builtin.debug:
            msg: "Agent {{ inventory_hostname }} upgraded to: {{ k3s_new_version.stdout }}"

      always:
        - name: Uncordon node and wait for Ready (always runs)
          ansible.builtin.include_tasks: _uncordon-and-wait-ready.yml

- name: Post-upgrade verification
  hosts: k3s_servers
  run_once: true
  tasks:
    - name: Display final cluster state
      ansible.builtin.command: k3s kubectl get nodes -o wide
      changed_when: false
      register: final_nodes

    - name: Show final node status
      ansible.builtin.debug:
        msg: "{{ final_nodes.stdout_lines }}"

    # No `|| true`: the awk filter exits 0 on no match anyway, so a kubectl
    # failure still reds the task instead of reading as "all nodes Ready".
    - name: Check for NotReady nodes
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get nodes --no-headers | awk '$2 !~ /^Ready/ {print $1}'
      args:
        executable: /bin/bash
      changed_when: false
      register: not_ready_nodes

    - name: Assert every node is Ready
      ansible.builtin.assert:
        that:
          - not_ready_nodes.stdout == ""
        fail_msg: "Nodes not ready after the rolling upgrade: {{ not_ready_nodes.stdout }}"
        success_msg: "All nodes Ready"

    - name: Display pod status summary
      ansible.builtin.command: k3s kubectl get pods --all-namespaces -o wide
      changed_when: false
      register: pod_status

    - name: Show pod summary
      ansible.builtin.debug:
        msg: "{{ pod_status.stdout_lines }}"

    - name: Check for unhealthy pods
      # Mirrors list_unhealthy_pods, like the stabilization wait above.
      # No failed_when: a kubectl failure reds the task instead of reading
      # as "no unhealthy pods".
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get pods --all-namespaces --no-headers \
        | awk -v runner_ns='{{ maintenance_ci_runner_namespaces | default([]) | join(" ") }}' \
              -v runner_prefix='{{ maintenance_ci_executor_pod_prefix | default("runner-") }}' '
            BEGIN { n = split(runner_ns, ns, " "); for (i = 1; i <= n; i++) runner[ns[i]] = 1 }
            $4 == "Completed" || $4 == "Succeeded" || $4 == "Error" || $4 == "Failed" { next }
            # Runner JOB pods are pipeline state, not cluster health.
            ($1 in runner) && index($2, runner_prefix) == 1 { next }
            { split($3, a, "/"); if ($4 != "Running" || a[1] != a[2]) print $1" "$2 }'
      args:
        executable: /bin/bash
      register: unhealthy_pods
      retries: 6
      delay: 10
      until: unhealthy_pods.stdout == ""
      changed_when: false

    - name: Assert no unhealthy pods remain
      ansible.builtin.assert:
        that:
          - unhealthy_pods.stdout == ""
        fail_msg: "Unhealthy pods after the rolling upgrade: {{ unhealthy_pods.stdout_lines }}"
        success_msg: "No unhealthy pods"
