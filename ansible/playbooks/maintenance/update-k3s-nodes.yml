---
# K3s node update playbook
# Performs rolling updates of k3s nodes with proper pod evacuation
# This handles k3s binary upgrades with zero-downtime pod migration

- name: Pre-flight checks
  hosts: k3s
  gather_facts: true
  tasks:
    - name: Check k3s service status
      ansible.builtin.systemd:
        name: "{{ 'k3s' if k3s_role == 'server' else 'k3s-agent' }}"
      check_mode: true
      register: k3s_service

    - name: Verify kubectl access (servers only)
      ansible.builtin.command: k3s kubectl get nodes
      changed_when: false
      when: k3s_role == 'server'
      delegate_to: "{{ groups['k3s_servers'][0] }}"
      run_once: true

    - name: Display cluster node status
      ansible.builtin.command: k3s kubectl get nodes -o wide
      changed_when: false
      delegate_to: "{{ groups['k3s_servers'][0] }}"
      run_once: true
      register: node_status

    - name: Show current cluster state
      ansible.builtin.debug:
        msg: "{{ node_status.stdout_lines }}"
      run_once: true

- name: Update k3s server nodes
  hosts: k3s_servers
  become: true
  serial: 1  # One server at a time for HA
  vars:
    # Delegate target for kubectl against the cluster: a server OTHER than the
    # one being upgraded; falls back to k3s_servers[0] when it is the only one.
    # Lazily templated per task, so it tracks inventory_hostname per host.
    k3s_delegate_server: "{{ (groups['k3s_servers'] | difference([inventory_hostname]) | first) | default(groups['k3s_servers'][0]) }}"
  tasks:
    - name: Display current node being updated
      ansible.builtin.debug:
        msg: "=== Updating k3s server: {{ inventory_hostname }} ==="

    # Version detection + staged installer download shared with the k3s role:
    # get_url to /root/k3s-install.sh (0700) with the tag-pinned URL and the
    # optional k3s_install_script_checksum from all.yml — no `curl | sh`, so
    # the root-run installer is integrity-checkable before it executes.
    - name: Detect k3s version and stage install script
      ansible.builtin.include_role:
        name: weisssrv.infra.k3s
        tasks_from: install-script.yml

    - name: Skip if version matches
      ansible.builtin.meta: end_host
      when: k3s_installed_version is defined and k3s_installed_version == k3s_version

    # Wrapped in block/always to guarantee the node is uncordoned even if
    # any task fails mid-sequence (e.g., upgrade failure, restart timeout).
    - name: Upgrade k3s server with guaranteed uncordon
      block:
        # etcd-quorum: restarting this server's k3s briefly drops its etcd member.
        # Do NOT do that while kured is mid-reboot of ANOTHER server — two of three
        # down loses quorum. Check before the cordon+upgrade, and RE-ASSERT right
        # before the restart to shrink the check->act window (residual sub-second
        # TOCTOU is covered by single-fault etcd tolerance + kured's concurrency:1).
        - name: Serialize against kured before cordoning/upgrading this server (etcd quorum)
          ansible.builtin.include_tasks: _wait-no-kured-server-reboot.yml
          vars:
            kured_clear_reason: "before upgrading {{ inventory_hostname }}"
            kured_clear_delegate: "{{ k3s_delegate_server }}"

        # NO drain: a k3s service restart keeps running pods (containerd persists
        # the containers across a kubelet restart), and draining the executor's
        # own node would deadlock the CI job. Cordon just blocks new scheduling
        # for the ~1-2 min the binary upgrade takes.
        # Note: when this node is the one running the CI executor pod, the
        # runner-manager's kubelet exec/log stream to that pod may blip for the
        # seconds the node's kubelet restarts. The container (and the job process)
        # survives — observed OK — so the brief stream gap is tolerated.
        - name: Cordon node before upgrade
          ansible.builtin.command: k3s kubectl cordon {{ inventory_hostname }}
          changed_when: true
          delegate_to: "{{ k3s_delegate_server }}"

        - name: Upgrade k3s server binary (staged installer)
          ansible.builtin.command: /root/k3s-install.sh server
          environment:
            INSTALL_K3S_VERSION: "{{ k3s_version }}"
            INSTALL_K3S_SKIP_START: "true"
          changed_when: true

        - name: Re-assert kured is not rebooting any server right before the k3s restart
          ansible.builtin.include_tasks: _wait-no-kured-server-reboot.yml
          vars:
            kured_clear_reason: "before restarting k3s on {{ inventory_hostname }}"
            kured_clear_delegate: "{{ k3s_delegate_server }}"

        - name: Restart k3s service
          ansible.builtin.systemd:
            name: weisssrv.infra.k3s
            state: restarted
            daemon_reload: true

        # /readyz (stricter than /healthz) gates on the apiserver being fully
        # ready to serve — same gate as the k3s role's "Wait for k3s API healthy"
        # handler. A plain `kubectl get nodes` can pass while etcd is still
        # rejoining, letting serial:1 advance to the next server too early.
        - name: Wait for k3s API healthy (/readyz)
          ansible.builtin.command: k3s kubectl --request-timeout=5s get --raw=/readyz
          register: k3s_ready
          retries: 30
          delay: 10
          until: k3s_ready.rc == 0
          changed_when: false

        - name: Verify new k3s version
          ansible.builtin.command: k3s --version
          register: k3s_new_version
          changed_when: false

        - name: Display upgrade result
          ansible.builtin.debug:
            msg: "Server {{ inventory_hostname }} upgraded to: {{ k3s_new_version.stdout }}"

      always:
        - name: Uncordon node and wait for Ready (always runs)
          ansible.builtin.include_tasks: _uncordon-and-wait-ready.yml

- name: Update k3s agent nodes
  hosts: k3s_agents
  become: true
  serial: 1  # One agent at a time to minimize disruption
  vars:
    # Same lazily-templated delegate target as the server play; for agents the
    # difference() filter is a no-op, so this resolves to k3s_servers[0].
    k3s_delegate_server: "{{ (groups['k3s_servers'] | difference([inventory_hostname]) | first) | default(groups['k3s_servers'][0]) }}"
  tasks:
    - name: Display current node being updated
      ansible.builtin.debug:
        msg: "=== Updating k3s agent: {{ inventory_hostname }} ==="

    # Version detection + staged installer download (see server play note).
    - name: Detect k3s version and stage install script
      ansible.builtin.include_role:
        name: weisssrv.infra.k3s
        tasks_from: install-script.yml

    - name: Skip if version matches
      ansible.builtin.meta: end_host
      when: k3s_installed_version is defined and k3s_installed_version == k3s_version

    # Special handling for nodes with persistent storage
    - name: Check if node has persistent workloads
      ansible.builtin.command: >
        k3s kubectl get pods --all-namespaces --field-selector spec.nodeName={{ inventory_hostname }}
        -o jsonpath='{.items[?(@.spec.volumes[*].persistentVolumeClaim)].metadata.name}'
      register: persistent_pods
      changed_when: false
      delegate_to: "{{ k3s_delegate_server }}"

    - name: Warn about persistent workloads
      ansible.builtin.debug:
        msg: "WARNING: Node {{ inventory_hostname }} has pods with persistent storage: {{ persistent_pods.stdout }}"
      when: persistent_pods.stdout != ""

    # Wrapped in block/always to guarantee the node is uncordoned even if
    # any task fails mid-sequence (e.g., upgrade failure, restart timeout).
    - name: Upgrade k3s agent with guaranteed uncordon
      block:
        - name: Cordon node before upgrade
          ansible.builtin.command: k3s kubectl cordon {{ inventory_hostname }}
          changed_when: true
          delegate_to: "{{ k3s_delegate_server }}"

        # CRITICAL: Must pass "agent" argument to install script, otherwise it installs
        # as server mode and creates k3s.service instead of k3s-agent.service.
        # The agent also needs K3S_URL and K3S_TOKEN to know which cluster to join.
        - name: Upgrade k3s agent binary (staged installer)
          ansible.builtin.command: /root/k3s-install.sh agent
          environment:
            INSTALL_K3S_VERSION: "{{ k3s_version }}"
            INSTALL_K3S_SKIP_START: "true"
            K3S_URL: "https://{{ k3s_api_vip }}:{{ k3s_api_port }}"
            # Use the (opt-in) agent token so a node-version upgrade rewrites the
            # agent env file with the lower-privilege token, not the cluster
            # token. Falls back to k3s_token when K3S_AGENT_TOKEN is unset, so
            # this is behaviour-preserving until the feature is enabled — see
            # docs/19 "Agent token".
            K3S_TOKEN: "{{ k3s_agent_token }}"
          changed_when: true
          no_log: true

        # SAFEGUARD: Ensure k3s.service (server) is disabled and stopped on agent nodes.
        # This protects against:
        # 1. Previous incorrect upgrades that installed server mode on agents
        # 2. Any future bugs that might accidentally install k3s server
        # The k3s.service file may not exist on clean agent installs, so we check first.
        - name: Check if k3s.service exists (server service on agent node)
          ansible.builtin.stat:
            path: /etc/systemd/system/k3s.service
          register: k3s_server_service

        - name: Stop and disable k3s.service if present (wrong service for agent)
          ansible.builtin.systemd:
            name: weisssrv.infra.k3s
            state: stopped
            enabled: false
            daemon_reload: true
          when: k3s_server_service.stat.exists
          failed_when: false  # Don't fail if service doesn't exist in systemd

        # No drain: this agent is cordoned, not drained. Per the constraints the CI
        # executor pod is ALWAYS on an agent, so this is the path most likely to run
        # under the executor's OWN node — and a kubelet (k3s-agent) restart is safe
        # for it: containerd keeps the container and the running job process alive
        # across the restart; only exec/log streaming blips for a few seconds. A
        # drain here would evict the executor and re-introduce the very self-deadlock
        # this rework removes — do NOT add one.
        - name: Restart k3s-agent service
          ansible.builtin.systemd:
            name: k3s-agent
            state: restarted
            daemon_reload: true

        - name: Wait for agent to register
          ansible.builtin.command: k3s kubectl get node {{ inventory_hostname }}
          register: k3s_agent_ready
          retries: 30
          delay: 10
          until: k3s_agent_ready.rc == 0
          changed_when: false
          delegate_to: "{{ k3s_delegate_server }}"

        - name: Wait for pods to stabilize on upgraded node
          # Mirror scripts/maintenance-lib.sh:42-46 list_unhealthy_pods so this
          # gate and post-maintenance-verify.sh agree: skip terminal BATCH pods
          # (Completed/Succeeded/Error/Failed — never-GC'd CI/Job pods), but still
          # flag Pending/CrashLoopBackOff/Evicted/OOMKilled and Running-but-not-ready.
          # A phase-only field-selector (the prior form) wrongly counted terminal
          # Error/Failed pods (failing on a leftover CI runner pod) AND missed
          # CrashLoop/not-ready (phase=Running). Inlined (not sourced) because this
          # task is delegate_to a k3s server where the repo lib is not present.
          ansible.builtin.shell: |
            set -o pipefail
            k3s kubectl get pods --all-namespaces \
              --field-selector spec.nodeName={{ inventory_hostname }} \
              --no-headers 2>/dev/null \
            | awk '
                $4 == "Completed" || $4 == "Succeeded" || $4 == "Error" || $4 == "Failed" { next }
                { split($3, a, "/"); if ($4 != "Running" || a[1] != a[2]) print }' \
            | wc -l
          args:
            executable: /bin/bash
          register: unhealthy_on_node
          retries: 30
          delay: 10
          until: unhealthy_on_node.stdout | int == 0
          changed_when: false
          delegate_to: "{{ k3s_delegate_server }}"

        - name: Verify new k3s version
          ansible.builtin.command: k3s --version
          register: k3s_new_version
          changed_when: false

        - name: Display upgrade result
          ansible.builtin.debug:
            msg: "Agent {{ inventory_hostname }} upgraded to: {{ k3s_new_version.stdout }}"

      always:
        - name: Uncordon node and wait for Ready (always runs)
          ansible.builtin.include_tasks: _uncordon-and-wait-ready.yml

- name: Post-upgrade verification
  hosts: k3s_servers
  run_once: true
  tasks:
    - name: Display final cluster state
      ansible.builtin.command: k3s kubectl get nodes -o wide
      changed_when: false
      register: final_nodes

    - name: Show final node status
      ansible.builtin.debug:
        msg: "{{ final_nodes.stdout_lines }}"

    - name: Check for NotReady nodes
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get nodes --no-headers | grep -v " Ready" | awk '{print $1}' || true
      args:
        executable: /bin/bash
      changed_when: false
      register: not_ready_nodes

    - name: Warn if nodes are NotReady
      ansible.builtin.debug:
        msg: "WARNING: Nodes not ready: {{ not_ready_nodes.stdout }}"
      when: not_ready_nodes.stdout != ""

    - name: Display pod status summary
      ansible.builtin.command: k3s kubectl get pods --all-namespaces -o wide
      changed_when: false
      register: pod_status

    - name: Show pod summary
      ansible.builtin.debug:
        msg: "{{ pod_status.stdout_lines }}"

    - name: Check for unhealthy pods
      # Same terminal-skip semantics as scripts/maintenance-lib.sh:42-46 (and the
      # stabilization wait above) so this warning does not re-list never-GC'd
      # terminal Error/Failed CI pods that the verify intentionally ignores, while
      # still surfacing Pending/CrashLoop/Evicted/not-ready pods.
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get pods --all-namespaces --no-headers 2>/dev/null \
        | awk '
            $4 == "Completed" || $4 == "Succeeded" || $4 == "Error" || $4 == "Failed" { next }
            { split($3, a, "/"); if ($4 != "Running" || a[1] != a[2]) print $1" "$2 }'
      args:
        executable: /bin/bash
      changed_when: false
      register: unhealthy_pods

    - name: Warn if pods are unhealthy
      ansible.builtin.debug:
        msg: "WARNING: Unhealthy pods detected: {{ unhealthy_pods.stdout_lines }}"
      when: unhealthy_pods.stdout != ""
