---
# Recover nfsd if a package upgrade left it down: `apt upgrade` restarts
# nfs-server and its *stop* can hang, leaving 2049 dead and every NFS-over-TLS
# pod in ContainerCreating.
#
# Health is the TCP listener on 2049, NOT the unit state: nfs-server is
# Type=oneshot, so service_facts reports "stopped" for a healthy nfsd.
# Recovery is reset-failed + a bounded START (restart re-enters the hanging stop
# path) + re-export. No-op where nfs-server is not enabled. Include AFTER the
# upgrade + reboot check. Runbook: docs/12.

- name: Gather service facts (to detect whether this host runs nfs-server)
  ansible.builtin.service_facts:

- name: Ensure the NFS server is serving after the package upgrade
  # Gate on the nfsd unit being ENABLED (not merely present, and NOT `static` —
  # static means "no [Install]", i.e. not something the operator enabled, so we
  # must not start it on a host where NFS serving was intentionally left off).
  # Accept either the canonical `nfs-server.service` (what service_facts reports
  # on this NAS) or its `nfs-kernel-server.service` alias, for portability.
  # We deliberately do NOT gate on `.state` — see the oneshot note above.
  when:
    - >-
      ('nfs-server.service' in ansible_facts.services
       and ansible_facts.services['nfs-server.service'].status == 'enabled')
      or ('nfs-kernel-server.service' in ansible_facts.services
          and ansible_facts.services['nfs-kernel-server.service'].status == 'enabled')
  block:
    - name: Probe nfsd, recovering it if TCP 2049 is not serving
      block:
        - name: Wait briefly for the NFS TCP listener (127.0.0.1:2049)
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: 2049
            state: started
            timeout: 5
          changed_when: false

      rescue:
        # We land here only when the probe above actually timed out — nfsd is
        # not serving on 2049, the upgrade stop-hang signature.
        - name: Reset failed state (a hung nfsd stop leaves the unit failed)
          ansible.builtin.command: systemctl reset-failed nfs-server nfs-mountd
          changed_when: true
          failed_when: false

        - name: Start nfs-server (started, not restarted, to avoid the stop-hang)
          ansible.builtin.systemd:
            name: nfs-server.service
            state: started
          # Bound the start so a wedged nfsd makes maintenance fail loudly
          # instead of hanging this task indefinitely.
          async: 90
          poll: 5

        - name: Re-export all filesystems
          ansible.builtin.command: exportfs -ra
          changed_when: true

    - name: Fail loud if nfsd is still not serving on TCP 2049 after recovery
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 2049
        state: started
        timeout: 20
      changed_when: false
      # On timeout this fails the play with a clear "Timeout waiting for
      # 127.0.0.1:2049" — every NFS-over-TLS client (downloads, recipes,
      # grafana, ...) would fail to mount. Investigate:
      #   systemctl status nfs-server ; journalctl -u nfs-server ; exportfs -v
