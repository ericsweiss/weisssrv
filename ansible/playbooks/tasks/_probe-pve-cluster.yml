---
# CRITICAL: loop the INCLUDE around one delegated task, never delegate_to inside
# a loop — an unreachable delegate there ends the host's task sequence with rc 0
# (ignore_unreachable does not cover it) and the caller reports green having
# reconciled nothing. One Proxmox host is routinely out.
# Queries `pvesh get /cluster/resources` on pve_probe_host, skipped once an
# earlier host answered. Caller contract: loop_var pve_probe_host; reads/sets
# pve_cluster_json and pve_probe_results ("host: rc=N" per host probed).

- name: Query the Proxmox cluster resource list from {{ pve_probe_host }}
  ansible.builtin.command: pvesh get /cluster/resources --type vm --output-format json
  delegate_to: "{{ pve_probe_host }}"
  register: pve_probe
  changed_when: false
  failed_when: false
  check_mode: false
  ignore_unreachable: true
  when: pve_cluster_json | default('') | length == 0

- name: Record the probe outcome
  ansible.builtin.set_fact:
    pve_cluster_json: >-
      {{ pve_probe.stdout if (pve_probe.rc | default(1)) == 0
         else (pve_cluster_json | default('')) }}
    pve_probe_results: >-
      {{ (pve_probe_results | default([]))
         + [pve_probe_host ~ ': '
            ~ ('unreachable' if (pve_probe.unreachable | default(false))
               else 'rc=' ~ (pve_probe.rc | default('?') | string))] }}
  when: not (pve_probe.skipped | default(false))
