---
# Re-deploy the SMTP relay credential to the hosts site.yml does not reach.
#
# site.yml carries postfix_null_client for `proxmox` and `dns` only. Every other
# consumer gets the role from its own app playbook, and those cannot be scoped
# with `--tags postfix_null_client`: the role is listed untagged there, so the
# tag selects zero of its tasks. On plex/immich/immich-ml/nextcloud/gitlab the
# run then dies in base's `tags: [always]` fact detection (those plays are
# gather_facts: false and the fact-gathering pre_task is untagged); on k3s.yml
# facts ARE gathered, so it exits 0 having rotated nothing — the worse failure.
# Running the app playbooks untagged works but reconfigures the entire app,
# which a credential rotation neither needs nor wants.
#
# This play is the narrow alternative: the role, and only the role, on exactly
# the hosts the app playbooks would give it. Unreachable is deliberately fatal —
# a host silently left on the revoked credential is the failure being closed.
#
# GitLab ALSO stores the credential in /etc/gitlab/gitlab.rb, which only the
# gitlab role templates; `task gitlab:deploy` is a separate step (docs/15).
#
# scripts/test_mail_credential_rotation.py fails if this host pattern drifts
# from the set of playbooks that carry the role.
- name: Rotate the SMTP relay credential on the app VMs and k3s nodes
  hosts: plex:immich:immich-ml:nextcloud:gitlab:k3s
  become: true
  # Explicit, not inherited: postfix_null_client branches on os_family, and the
  # app playbooks' deferred-gathering pattern is exactly what breaks --tags here.
  gather_facts: true
  roles:
    - weisssrv.infra.postfix_null_client
