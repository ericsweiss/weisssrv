---
# CRITICAL: re-deploy the SMTP relay credential to the hosts site.yml does not reach.
# site.yml tags postfix_null_client for `proxmox` and `dns` only; on every other
# consumer the tag selects zero tasks, and on k3s.yml that exits 0 having rotated
# nothing. Unreachable is fatal here, because a host left on the revoked credential is
# the failure being closed. GitLab needs `task gitlab:deploy` as well. See docs/15.
# scripts/test_mail_credential_rotation.py fails if this host pattern drifts.
- name: Rotate the SMTP relay credential on the app VMs and k3s nodes
  hosts: plex:immich:immich-ml:nextcloud:gitlab:k3s
  become: true
  # Explicit, not inherited: postfix_null_client branches on os_family, and the
  # app playbooks' deferred-gathering pattern is exactly what breaks --tags here.
  gather_facts: true
  roles:
    - weisssrv.infra.postfix_null_client
