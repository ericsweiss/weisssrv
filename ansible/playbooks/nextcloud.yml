---
# Provisions the Nextcloud VM and deploys the Docker Compose stack; state rides
# ZFS zvol passthrough disks only, no NFS. Prerequisites, SSO setup and the
# first-deploy order: docs/35-nextcloud.md.

- name: Provision Nextcloud VM
  hosts: nextcloud
  gather_facts: false
  roles:
    - weisssrv.infra.proxmox_vm

- name: Deploy Nextcloud
  hosts: nextcloud
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait for Nextcloud VM to be reachable
      ansible.builtin.wait_for_connection:
        timeout: 300
      when: not ansible_check_mode

    - name: Guard against unreachable host in check mode
      ansible.builtin.include_tasks: tasks/_check-mode-reachable.yml
      vars:
        reachable_check_timeout: 10

    - name: Gather facts after connection is established
      ansible.builtin.setup:
  roles:
    - weisssrv.infra.base
    - weisssrv.infra.postfix_null_client
    # Exposes the backup wrapper's nextcloud_backup.prom textfile; ordered
    # before nextcloud so the exporter is in place when the wrapper lands.
    # Shared with site.yml; scripts/test_shared_role_playbook_sync.py keeps the two in step.
    - weisssrv.infra.node_exporter_host
    # Shared with site.yml; scripts/test_shared_role_playbook_sync.py keeps the two in step.
    - weisssrv.infra.alloy_host
    # tlshd for the xprtsec=tls backup mount; must precede the app role, which
    # mounts by hostname. Client-only.
    - role: weisssrv.infra.nfs_tls
      vars:
        nfs_tls_enabled: "{{ nextcloud_backup_nfs_enabled | default(false) }}"
    - weisssrv.infra.nextcloud
    - weisssrv.infra.proxmox_firewall

# weisssrv.infra.base above rewrites authorized_keys, so a re-provisioned guest
# loses the pinned cert-distribution key. Re-seed it from the cert authority
# here, before the next renewal strands the target (docs/15).
- name: Re-seed the cert-distribution key on nextcloud
  hosts: dns_primary
  become: true
  gather_facts: false
  tasks:
    - name: Re-seed nextcloud as a cert-distribution target
      ansible.builtin.include_tasks: tasks/_reseed-cert-target.yml
      vars:
        reseed_cert_target_host: nextcloud
