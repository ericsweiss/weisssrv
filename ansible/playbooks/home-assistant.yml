---
# Deploys Home Assistant CONFIG FILES over SSH/SCP — HAOS itself is not
# Ansible-manageable.
#
# Usage: task home-assistant:deploy-config

- name: Deploy Home Assistant Configuration
  # NOT `hosts: home`: HAOS is not a real Ansible target (port 22222, root with
  # no sudo, no guaranteed Python). The role runs from the controller, which
  # holds the SSH key, and shells out to SCP/SSH.
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - ../inventories/prod/group_vars/all.yml
    # Explicit because the play targets localhost: host_vars/<host>.yml
    # autoloading does not apply, and the role asserts home_assistant_host_key.
    - ../inventories/prod/host_vars/home.yml
  roles:
    - weisssrv.infra.home_assistant
