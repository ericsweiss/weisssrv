---
# Creates MISSING ZFS DATASETS on the NAS after interactive confirmation.
# It never creates, destroys or modifies a POOL; a missing pool aborts the run.
# Prerequisites and first-run order: docs/44-storage-bootstrap.md.

- name: Storage Infrastructure Bootstrap - Pre-flight Checks
  hosts: nas
  become: true
  gather_facts: true
  tasks:
    - name: Display warning banner
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "              STORAGE BOOTSTRAP PLAYBOOK"
          - "================================================================"
          - ""
          - "This playbook creates MISSING ZFS DATASETS only."
          - "ZFS pools are NEVER created here - the run aborts with the"
          - "manual zpool create recipe if a pool is missing."
          - ""
          - "Use cases:"
          - "  - Initial NAS setup (brand new hardware)"
          - "  - Complete disaster recovery"
          - "  - Adding datasets to an existing pool"
          - ""
          - "This playbook will:"
          - "  1. Detect existing infrastructure"
          - "  2. Show you what will be created"
          - "  3. Ask for confirmation before proceeding"
          - "================================================================"

- name: Phase 1 - Detect Existing Infrastructure
  hosts: nas
  become: true
  gather_facts: true
  tasks:
    - name: Check if ZFS kernel module is loaded
      ansible.builtin.shell: set -o pipefail && lsmod | grep -q zfs
      args:
        executable: /bin/bash
      register: zfs_module
      changed_when: false
      failed_when: false

    - name: Detect existing ZFS pools
      ansible.builtin.command: zpool list -H -o name
      register: existing_pools
      changed_when: false
      failed_when: false

    - name: Parse existing pools
      ansible.builtin.set_fact:
        existing_pool_list: "{{ existing_pools.stdout_lines | default([]) }}"

    - name: Detect existing ZFS datasets for each configured pool
      ansible.builtin.command: "zfs list -H -o name -r {{ item.name }}"
      loop: "{{ nas_storage_zfs_pools }}"
      loop_control:
        label: "{{ item.name }}"
      register: existing_datasets
      changed_when: false
      failed_when: false

    - name: Parse existing datasets
      ansible.builtin.set_fact:
        existing_dataset_map: >-
          {{
            existing_dataset_map | default({}) | combine({
              item.item.name: item.stdout_lines | default([])
            })
          }}
      loop: "{{ existing_datasets.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Check if critical directories exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: critical_dirs
      loop:
        - /mnt/tank
        - /mnt/ssd
        - /mnt/nvme
        - /export

    - name: Check if bind sources exist
      ansible.builtin.stat:
        path: "{{ item.bind_source }}"
      loop: "{{ nas_storage_exports }}"
      loop_control:
        label: "{{ item.bind_source | default('N/A') }}"
      register: bind_sources
      when: item.bind_source is defined

    - name: Display infrastructure detection results
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "INFRASTRUCTURE DETECTION RESULTS"
          - "================================================================"
          - ""
          - "ZFS Kernel Module: {{ 'LOADED' if zfs_module.rc == 0 else 'NOT LOADED' }}"
          - ""
          - "Existing ZFS Pools:"
          - "{{ (existing_pool_list | length > 0) | ternary(existing_pool_list | map('regex_replace', '^', '  - ') | join('\n'), '  (none found)') }}"
          - ""
          - "Existing ZFS Datasets:"
          - >-
            {% for pool, datasets in existing_dataset_map.items() %}
            {{ pool }}:
            {% for ds in datasets %}
              - {{ ds }}
            {% endfor %}
            {% endfor %}
          - ""
          - "Critical Directories:"
          - >-
            {% for dir in critical_dirs.results %}
            {{ dir.item }}: {{ 'EXISTS' if dir.stat.exists else 'MISSING' }}
            {% endfor %}
          - ""
          - "Bind Sources:"
          - >-
            {% for src in bind_sources.results | selectattr('stat', 'defined') %}
            {{ src.item.bind_source }}: {{ 'EXISTS' if src.stat.exists else 'MISSING' }}
            {% endfor %}
          - "================================================================"

    # Without the module the detection above is meaningless: zpool/zfs list both
    # fail silently and every configured pool looks missing.
    - name: Assert the ZFS kernel module is loaded
      ansible.builtin.assert:
        that:
          - zfs_module.rc == 0
        fail_msg: >-
          ZFS kernel module is not loaded on {{ inventory_hostname }}; pool and
          dataset detection above is meaningless. See
          docs/44-storage-bootstrap.md before re-running.
        quiet: true

- name: Phase 2 - Determine Required Actions
  hosts: nas
  become: true
  tasks:
    - name: Determine pools that need creation
      ansible.builtin.set_fact:
        pools_to_create: >-
          {{
            nas_storage_zfs_pools | map(attribute='name') | list |
            difference(existing_pool_list | default([]))
          }}

    - name: Determine datasets that need creation
      ansible.builtin.set_fact:
        datasets_to_create: >-
          {%- set result = [] -%}
          {%- for pool in nas_storage_zfs_pools -%}
            {%- for dataset in pool.datasets -%}
              {%- if dataset.name not in (existing_dataset_map[pool.name] | default([])) -%}
                {%- set _ = result.append(dataset.name) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ result }}

    - name: Display required actions
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "REQUIRED ACTIONS"
          - "================================================================"
          - ""
          - "ZFS Pools to Create:"
          - "{{ (pools_to_create | length > 0) | ternary(pools_to_create | map('regex_replace', '^', '  WARNING: ') | join('\n'), '  All pools exist') }}"
          - ""
          - "ZFS Datasets to Create:"
          - >-
            {{ (datasets_to_create | length > 0) |
            ternary(datasets_to_create | map('regex_replace', '^', '  WARNING: ') | join('\n'),
            '  All datasets exist') }}
          - ""
          - "Directories to Create:"
          - "  - /export (if missing)"
          - "  - Bind mount targets under /export/"
          - "  - Bind source directories (if missing)"
          - ""
          - "Services to Configure:"
          - "  - NFS exports (/etc/exports)"
          - "  - Samba shares (smb.conf)"
          - "  - MergerFS union mounts"
          - "================================================================"

    - name: Abort - ZFS pools must be created manually
      ansible.builtin.fail:
        msg: |
          ZFS pool creation is not automated. Missing pools: {{ pools_to_create | join(', ') }}

          Create each one by hand, then re-run this playbook:

            zpool create -o ashift=12 \
                         -O acltype=posixacl \
                         -O compression=zstd \
                         -O normalization=formD \
                         -O relatime=on \
                         -O xattr=sa \
                         -m /mnt/POOLNAME \
                         POOLNAME raidz2 /dev/disk/by-id/...

          Pool geometry and the tier rationale: docs/06-zfs.md.
      when: pools_to_create | length > 0

- name: Phase 3 - Interactive Confirmation
  hosts: nas
  become: true
  tasks:
    - name: Confirm dataset creation
      ansible.builtin.pause:
        prompt: |

          ================================================================
          CONFIRMATION REQUIRED
          ================================================================

          This playbook will create the following ZFS datasets:
          {{ datasets_to_create | map('regex_replace', '^', '  - ') | join('\n') }}

          WARNING: This operation will:
            - Create ZFS datasets with configured properties
            - Set mountpoints, compression, recordsize, etc.
            - NOT destroy any existing data
            - NOT format any existing filesystems

          Existing datasets will be SKIPPED (safe).

          Do you want to proceed? [yes/NO]
      register: confirmation
      when: datasets_to_create | length > 0

    - name: Verify confirmation
      ansible.builtin.assert:
        that:
          - confirmation.user_input | lower == 'yes'
        fail_msg: "User did not confirm. Aborting."
      when: datasets_to_create | length > 0

- name: Phase 4 - Create ZFS Datasets
  hosts: nas
  become: true
  tasks:
    # Encrypted datasets carry `encryption:` but no keyformat/keylocation, so a
    # bare `zfs create -o encryption=...` fails. They are created by hand per
    # docs/32-zfs-encryption.md and skipped here.
    - name: Create missing ZFS datasets
      ansible.builtin.command: >
        zfs create
        {% for prop, value in item.1.properties.items() %}
        -o {{ prop }}={{ value }}
        {% endfor %}
        {{ item.1.name }}
      loop: "{{ nas_storage_zfs_pools | subelements('datasets') }}"
      loop_control:
        label: "{{ item.1.name }}"
      when:
        - item.1.name in datasets_to_create
        - "'encryption' not in item.1.properties"
      changed_when: true  # Creating a dataset is always a change
      register: dataset_creation

    # Same loop+when shape as the create task above: ansible-lint's mock
    # templating rejects a standalone `vars:` subelements expression, but is
    # fine with the loop/when form the create task already uses.
    - name: List encrypted datasets that require manual creation
      ansible.builtin.debug:
        msg: >-
          SKIPPED (encrypted — create manually with keyformat/keylocation per
          docs/32-zfs-encryption.md, then re-run): {{ item.1.name }}
      loop: "{{ nas_storage_zfs_pools | subelements('datasets') }}"
      loop_control:
        label: "{{ item.1.name }}"
      when:
        - item.1.name in datasets_to_create
        - "'encryption' in item.1.properties"

    - name: Display dataset creation results
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "ZFS DATASET CREATION COMPLETE"
          - "================================================================"
          - "Created {{ _created | length }} datasets (encrypted ones skipped — see above)"
          - "{{ _created | map('regex_replace', '^', '  - ') | join('\n') }}"
      vars:
        _created: >-
          {{ dataset_creation.results | selectattr('changed', 'defined')
             | selectattr('changed') | map(attribute='item.1.name') | list }}
      when: datasets_to_create | length > 0

- name: Phase 5 - Create Directory Structure
  hosts: nas
  become: true
  tasks:
    - name: Create required groups
      ansible.builtin.group:
        name: "{{ item }}"
        gid: "{{ '2000' if item == 'media' else omit }}"
        state: present
      loop:
        - media

    - name: Ensure admin user is in media group
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups: media
        append: true

    - name: Create /export root directory
      ansible.builtin.file:
        path: /export
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create bind mount target directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
        mode: "{{ item.mode | default('0755') }}"
      loop: "{{ nas_storage_exports }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Create bind source directories (if they don't exist)
      ansible.builtin.file:
        path: "{{ item.bind_source }}"
        state: directory
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
        mode: "{{ item.mode | default('0755') }}"
      loop: "{{ nas_storage_exports }}"
      loop_control:
        label: "{{ item.bind_source | default('N/A') }}"
      when: item.bind_source is defined

    # mergerfs mounts over its target and refuses to start on a missing
    # branch; the role creates neither.
    - name: Create the mergerfs branch directories
      ansible.builtin.file:
        path: "{{ item.1 }}"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ nas_storage_media_group | default('media') }}"
        mode: "02775"
      loop: "{{ nas_storage_mergerfs_mounts | default([]) | subelements('sources') }}"
      loop_control:
        label: "{{ item.1 }}"

    # Subdirectories inside the branches, plus the media-mover destination,
    # which is not a mergerfs source.
    - name: Create the media tier subdirectories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ nas_storage_media_group | default('media') }}"
        mode: "02775"
      loop:
        - /mnt/nvme/media/downloads
        - /mnt/nvme/media/library
        - /mnt/tank/media/library

- name: Phase 6 - Configure Storage Services
  hosts: nas
  become: true
  tasks:
    - name: Run NFS configuration
      ansible.builtin.include_role:
        name: weisssrv.infra.nas_storage
        tasks_from: nfs.yml

    - name: Run MergerFS configuration
      ansible.builtin.include_role:
        name: weisssrv.infra.nas_storage
        tasks_from: mergerfs.yml
      when: nas_storage_mergerfs_mounts | default([]) | length > 0

    - name: Run Samba configuration
      ansible.builtin.include_role:
        name: weisssrv.infra.nas_storage
        tasks_from: samba.yml
      when: nas_storage_samba_shares | default([]) | length > 0

    - name: Run media-mover configuration
      ansible.builtin.include_role:
        name: weisssrv.infra.nas_storage
        tasks_from: media_mover.yml
      when: nas_storage_media_mover_enabled | default(false)

- name: Phase 7 - Verification
  hosts: nas
  become: true
  tasks:
    - name: Verify ZFS datasets are mounted
      ansible.builtin.command: zfs list -H -o name,mounted
      register: mounted_datasets
      changed_when: false

    - name: Verify NFS exports are active
      ansible.builtin.command: showmount -e localhost
      register: nfs_verification
      changed_when: false
      failed_when: false

    - name: Assert every declared NFS export is live
      ansible.builtin.assert:
        that:
          - nfs_verification.rc == 0
          - nfs_verification.stdout_lines | length > 1
          - nas_storage_exports | map(attribute='path')
            | difference(nfs_verification.stdout | regex_findall('^(/\S+)', multiline=True))
            | length == 0
        fail_msg: >-
          showmount -e localhost did not list every declared export, so the k3s
          NFS PVs will not mount. Check `systemctl status nfs-server` and
          `exportfs -v` before running `task infra:verify`.

    - name: Verify MergerFS mounts
      ansible.builtin.command: findmnt -t fuse.mergerfs -o TARGET,SOURCE
      register: mergerfs_verification
      changed_when: false
      failed_when: false

    - name: Display final status
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "STORAGE BOOTSTRAP COMPLETE"
          - "================================================================"
          - ""
          - "ZFS Datasets Mounted:"
          - "{{ mounted_datasets.stdout_lines | map('regex_replace', '^', '  ') | join('\n') }}"
          - ""
          - "NFS Exports:"
          - "{{ nfs_verification.stdout_lines | map('regex_replace', '^', '  ') | join('\n') }}"
          - ""
          - "MergerFS Mounts:"
          - "{{ mergerfs_verification.stdout_lines | default(['  (none or check failed)']) | map('regex_replace', '^', '  ') | join('\n') }}"
          - ""
          - "Next steps:"
          - "  1. Run postflight verification:"
          - "     task infra:verify"
          - "  2. Review ZFS pool health:"
          - "     zpool status"
          - "  3. Check SMART disk health:"
          - "     smartctl -H /dev/disk/by-id/..."
          - "================================================================"
