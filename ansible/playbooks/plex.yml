---
# Provisions the Plex LXC and deploys Plex Media Server. Prerequisites, storage
# paths, first-run order and the task commands: docs/20-plex-deployment.md.

- name: Provision Plex LXC container
  hosts: plex
  gather_facts: false
  roles:
    - weisssrv.infra.proxmox_lxc

- name: Deploy Plex Media Server
  hosts: plex
  become: true
  gather_facts: false
  # In check mode, the container may not exist (LXC creation is skipped).
  # gather_facts is deferred until after the guard so a missing container
  # ends the host cleanly instead of failing the play UNREACHABLE up front.
  pre_tasks:
    - name: Guard against unreachable host in check mode
      ansible.builtin.include_tasks: tasks/_check-mode-reachable.yml

    - name: Gather facts after connection is established
      ansible.builtin.setup:

  roles:
    - weisssrv.infra.base
    - weisssrv.infra.postfix_null_client
    - weisssrv.infra.plex
    # Shared with site.yml; scripts/test_shared_role_playbook_sync.py keeps the two in step.
    # node_exporter_host is intentionally absent: this guest is not in the
    # node-exporter-host scrape roster (exporters/node-exporter-host.yaml).
    - weisssrv.infra.alloy_host
    - weisssrv.infra.proxmox_firewall

# weisssrv.infra.base above rewrites authorized_keys, so a re-provisioned guest
# loses the pinned cert-distribution key. Re-seed it from the cert authority
# here, before the next renewal strands the target (docs/15).
- name: Re-seed the cert-distribution key on plex
  hosts: dns_primary
  become: true
  gather_facts: false
  tasks:
    - name: Re-seed plex as a cert-distribution target
      ansible.builtin.include_tasks: tasks/_reseed-cert-target.yml
      vars:
        reseed_cert_target_host: plex
