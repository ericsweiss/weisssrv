---
# Plex Media Server deployment playbook
#
# This playbook provisions the Plex LXC container and deploys Plex Media Server.
#
# Prerequisites:
#   - pve-nas-01 must have storage mounts ready:
#     - /mnt/ssd/appdata/plex (Plex config)
#     - /mnt/nvme/fast/plex-transcode (transcoding temp)
#     - /mnt/media (mergerfs media library)
#   - Directories must exist with correct permissions (eric:media, 1000:2000)
#
# Usage:
#   task plex:deploy              # Full deployment
#   task plex:check               # Dry-run

- name: Provision Plex LXC container
  hosts: plex
  gather_facts: false
  roles:
    - weisssrv.infra.proxmox_lxc

- name: Deploy Plex Media Server
  hosts: plex
  become: true
  gather_facts: false
  # In check mode, the container may not exist (LXC creation is skipped).
  # gather_facts is deferred until after the guard so a missing container
  # ends the host cleanly instead of failing the play UNREACHABLE up front.
  pre_tasks:
    - name: Guard against unreachable host in check mode
      ansible.builtin.include_tasks: tasks/_check-mode-reachable.yml

    - name: Gather facts after connection is established
      ansible.builtin.setup:

  roles:
    - weisssrv.infra.base
    - weisssrv.infra.postfix_null_client
    - weisssrv.infra.plex
    # Also in site.yml; listed here so a standalone deploy stays in sync.
    # node_exporter_host is intentionally absent: LXC guests get their host
    # metrics from the Proxmox host's exporter.
    - weisssrv.infra.alloy_host
    - weisssrv.infra.proxmox_firewall
