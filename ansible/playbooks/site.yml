---
# Base infrastructure playbook (Proxmox hosts, DNS, mail, NAS, firewall,
# host-level observability). k3s, Plex, GitLab, and Home Assistant have
# dedicated playbooks with separate lifecycles.

- name: Deploy base configuration to all managed hosts
  hosts: base_managed
  become: true
  roles:
    - role: base
      tags: [base]
    - role: nic_tuning
      tags: [nic_tuning, network]

- name: Deploy Proxmox host configuration
  hosts: proxmox
  become: true
  roles:
    - role: qol
      tags: [qol]
    - role: postfix_null_client
      tags: [postfix_null_client]
    - role: tailscale
      tags: [tailscale]
      when: tailscale_enabled | bool
    - role: proxmox_firewall
      tags: [proxmox_firewall]

- name: Deploy DNS server configuration
  hosts: dns
  become: true
  serial: 1  # one resolver at a time — never restart unbound/AdGuard on both at once
  roles:
    - role: postfix_null_client
      tags: [postfix_null_client]
    - role: unbound
      tags: [unbound]
    - role: unbound_exporter
      tags: [unbound_exporter]
    - role: adguard_home
      tags: [adguard_home]

- name: Deploy certificate management and sync
  hosts: dns
  become: true
  serial: 1  # acme reload restarts AdGuardHome — keep the other resolver up
  roles:
    - role: acme_certs
      tags: [acme_certs]
    - role: adguard_sync
      tags: [adguard_sync]

# NAS storage runs AFTER certificate management: nfs_tls's preflight fails loud
# if the wildcard cert/key aren't present on pve-nas-01, and those are
# distributed by the acme_certs play above (cert_distribution_targets). Running
# the NAS play earlier would fail a fresh `site.yml` bootstrap before the cert
# exists. (storage.yml is the standalone NAS playbook for re-runs once the cert
# is already distributed.) Nothing in the DNS/cert plays above depends on NAS
# storage, and the proxmox play still precedes this one.
- name: Deploy NAS storage configuration
  hosts: pve-nas-01
  become: true
  roles:
    # Opt-in NFSv4-over-TLS daemon; tasks self-guard on nfs_tls_enabled, so this
    # is a no-op unless set in host_vars/pve-nas-01 (matches storage.yml). Runs
    # BEFORE nas_storage so tlshd is installed + verified before nas_storage
    # (re)publishes any xprtsec=tls export — otherwise a TLS-required export
    # could be live without a working handshake daemon if nfs_tls later fails.
    - role: nfs_tls
      tags: [nfs_tls]
    - role: nas_storage
      tags: [nas_storage]
    - role: zfs_exporter
      tags: [zfs_exporter]

- name: Deploy DNS guest firewall rules
  hosts: dns
  roles:
    - role: proxmox_firewall
      tags: [proxmox_firewall]

- name: Deploy SMTP relay configuration
  hosts: mail
  become: true
  roles:
    - role: smtp_relay
      tags: [smtp_relay]

- name: Deploy SMTP guest firewall rules
  hosts: mail
  roles:
    - role: proxmox_firewall
      tags: [proxmox_firewall]

- name: Deploy host-level metrics (node_exporter on bare metal, DNS, mail, and GitLab hosts)
  hosts: proxmox:dns:mail:gitlab_servers
  become: true
  roles:
    - role: node_exporter_host
      tags: [node_exporter_host]

- name: Deploy host-side log collection (Alloy → Loki)
  hosts: base_managed:plex_servers:gitlab_servers:k3s_servers:k3s_agents
  become: true
  roles:
    - role: alloy_host
      tags: [alloy_host]

# Deploy guest firewall rules for unmanaged VMs (Home Assistant, etc.)
# These VMs can't run Ansible directly; firewall rules are deployed via
# delegation to a Proxmox host (the /etc/pve/ filesystem is clustered)
- name: Deploy guest firewall rules for unmanaged VMs
  hosts: services
  gather_facts: false
  roles:
    - role: proxmox_firewall
      tags: [proxmox_firewall]

# k3s guest .fw files (VMIDs 202-207, 222-227) are otherwise written only by
# playbooks/k3s.yml (hosts: k3s), which has no CI deploy job. Run them here under
# --tags proxmox_firewall so an inventory-only guest_security_groups edit in
# hosts.yml deploys via deploy-ansible-firewall. The role self-gates on
# vmid + guest_security_groups, so it is a safe no-op for any k3s host without
# security groups; cluster.fw is run_once-guarded, so this only writes guest .fw.
- name: Deploy k3s guest firewall rules
  hosts: k3s
  gather_facts: false
  roles:
    - role: proxmox_firewall
      tags: [proxmox_firewall]
