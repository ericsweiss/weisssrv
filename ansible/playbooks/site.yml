---
# Base infrastructure playbook (Proxmox hosts, DNS, mail, NAS, firewall,
# host-level observability). k3s, Plex, GitLab, Home Assistant, Nextcloud,
# Immich, and Immich ML have dedicated playbooks with separate lifecycles.

# smtp-relay has no dedicated playbook, so its create path is codified here.
# Runs FIRST (purely delegated, gather_facts: false): the base_managed play
# below connects directly to smtp-relay and would mark a lost container
# UNREACHABLE, excluding it from every subsequent play.
- name: Provision SMTP relay LXC container
  hosts: mail
  gather_facts: false
  roles:
    - role: weisssrv.infra.proxmox_lxc
      tags: [proxmox_lxc]

# Runs after the SMTP provisioning play above (which must own the first
# connection attempt to smtp-relay) and before anything is deployed. Its
# companion gate is imported at the very bottom of this file.
- name: Probe reachability before deploying
  ansible.builtin.import_playbook: _reachability-probe.yml

- name: Deploy base configuration to all managed hosts
  # The reachability contract, referenced by every multi-host play below:
  #   - `!deploy_skipped` drops what the probe could not reach; left in, such a
  #     host fails on the first task templating an ungathered fact, which the
  #     gate's deploy_expected_absent_hosts downgrade cannot undo.
  #   - `ignore_unreachable` covers a host that dies BETWEEN probe and play, so
  #     the hosts that ARE up still converge. `--tags` does not suppress fact
  #     gathering, so this bites even for plays a tag-scoped run selects nothing
  #     from.
  #   - The single-host plays below (mail, pve-nas-01) deliberately carry
  #     NEITHER: skipping their one host means the deploy did nothing, which
  #     must stay red.
  # See _reachability-probe.yml for why exit 0 is not proof of a deploy.
  hosts: base_managed:!deploy_skipped
  become: true
  ignore_unreachable: true
  roles:
    - role: weisssrv.infra.base
      tags: [base]
    - role: weisssrv.infra.nic_tuning
      tags: [nic_tuning, network]

- name: Deploy Proxmox host configuration
  hosts: proxmox:!deploy_skipped
  become: true
  # See the reachability note on the base_managed play above.
  ignore_unreachable: true
  roles:
    - role: weisssrv.infra.qol
      tags: [qol]
    - role: weisssrv.infra.postfix_null_client
      tags: [postfix_null_client]
    # dm-crypt plain-mode random-key encrypted swap on the six bare-metal hosts.
    # Config-only; activation is deferred to each host's next reboot (no live
    # switchover); self-gates on encrypted_swap_enabled.
    - role: weisssrv.infra.encrypted_swap
      tags: [encrypted_swap]
    # ZFS ARC cap on the COMPUTE hosts only (proxmox_role != 'nas'):
    # pve-nas-01's ARC is owned by nas_storage on the storage playbook lifecycle.
    # Self-gates on zfs_arc_cap_max_bytes (group_vars/proxmox.yml). Protects the
    # VFIO-passthrough host (pinned guest RAM) from an uncapped ARC — docs/43.
    - role: weisssrv.infra.zfs_arc_cap
      tags: [zfs_arc_cap]
      when: proxmox_role != 'nas'
    # Host-side GPU VFIO codification (IOMMU cmdline + vfio-pci bind + nouveau
    # blacklist). Self-gates on vfio_passthrough_enabled (set only on
    # pve-prec-01 in hosts.yml); STAGES config + prints reboot-required, never
    # reboots — the operator applies it in a maintenance window (docs/43).
    - role: weisssrv.infra.vfio_passthrough
      tags: [vfio_passthrough]
      when: vfio_passthrough_enabled | default(false)
    - role: weisssrv.infra.tailscale
      tags: [tailscale]
      when: tailscale_enabled | bool
    # tlshd for the xprtsec=tls tank-proxmox mount. Client-only here:
    # server-mode pve-nas-01 is EXCLUDED so its cert/key-dependent setup runs in
    # the NAS play below, after acme_certs distributes the wildcard cert.
    - role: weisssrv.infra.nfs_tls
      tags: [nfs_tls]
      when: not (nfs_tls_is_server | default(false))
    - role: weisssrv.infra.proxmox_firewall
      tags: [proxmox_firewall]

- name: Deploy DNS server configuration
  hosts: dns:!deploy_skipped
  become: true
  serial: 1  # one resolver at a time — never restart unbound/AdGuard on both at once
  # See the base_managed play above. It matters more here: with serial: 1 an
  # unreachable dns-01 is a batch of one, and a failed batch ends the play — so
  # the OTHER resolver would never be reconciled.
  ignore_unreachable: true
  roles:
    - role: weisssrv.infra.postfix_null_client
      tags: [postfix_null_client]
    - role: weisssrv.infra.unbound
      tags: [unbound]
    - role: weisssrv.infra.unbound_exporter
      tags: [unbound_exporter]
    - role: weisssrv.infra.adguard_home
      tags: [adguard_home]

- name: Deploy certificate management and sync
  hosts: dns:!deploy_skipped
  become: true
  serial: 1  # acme reload restarts AdGuardHome — keep the other resolver up
  # Same serial-batch reasoning as the DNS play above.
  ignore_unreachable: true
  roles:
    - role: weisssrv.infra.acme_certs
      tags: [acme_certs]
    - role: weisssrv.infra.adguard_sync
      tags: [adguard_sync]

# MUST run AFTER certificate management: nfs_tls's preflight fails loud without
# the wildcard cert/key, which the acme_certs play above distributes — so an
# earlier NAS play breaks a fresh site.yml bootstrap. (storage.yml is the
# standalone NAS playbook for re-runs once the cert is distributed.)
- name: Deploy NAS storage configuration
  hosts: pve-nas-01
  become: true
  roles:
    # BEFORE nas_storage, so tlshd is verified before any xprtsec=tls export is
    # (re)published — otherwise a TLS-required export could go live without a
    # working handshake daemon.
    - role: weisssrv.infra.nfs_tls
      tags: [nfs_tls]
    - role: weisssrv.infra.nas_storage
      tags: [nas_storage]
    # Nightly offsite B2 backup (restic + rclone). Runs after nas_storage (needs
    # the archsync snapshots + tank/backups/apps landing zone); chains OnSuccess=
    # after archive-backup.service. No-op while restic_offsite_enabled is false.
    - role: weisssrv.infra.restic_offsite
      tags: [restic_offsite]
    # Declarative storage.cfg + vzdump jobs (tank-proxmox target). Cluster-wide
    # config, so it runs from this single node; no-op while its lists are empty.
    - role: weisssrv.infra.proxmox_backup
      tags: [proxmox_backup]
    - role: weisssrv.infra.zfs_exporter
      tags: [zfs_exporter]

- name: Deploy DNS guest firewall rules
  hosts: dns:!deploy_skipped
  # See the reachability note on the base_managed play above.
  ignore_unreachable: true
  roles:
    - role: weisssrv.infra.proxmox_firewall
      tags: [proxmox_firewall]

- name: Deploy SMTP relay configuration
  hosts: mail
  become: true
  roles:
    - role: weisssrv.infra.smtp_relay
      tags: [smtp_relay]

- name: Deploy SMTP guest firewall rules
  hosts: mail
  roles:
    - role: weisssrv.infra.proxmox_firewall
      tags: [proxmox_firewall]

- name: Deploy host-level metrics (node_exporter on bare metal, DNS, mail, GitLab, Nextcloud, Immich, and k3s-server hosts)
  hosts: proxmox:dns:mail:gitlab_servers:nextcloud_servers:immich_servers:k3s_servers:!deploy_skipped
  become: true
  # App VMs are provisioned by their own deploy jobs, which need this one to
  # succeed first — so on a first deploy the VM does not exist yet. Skipping is
  # safe: their own playbook also ships node_exporter_host, and a genuinely-down
  # host surfaces via NodeDown.
  ignore_unreachable: true
  roles:
    - role: weisssrv.infra.node_exporter_host
      tags: [node_exporter_host]

- name: Deploy host-side log collection (Alloy → Loki)
  hosts: base_managed:plex_servers:gitlab_servers:nextcloud_servers:immich_servers:immich_ml_servers:k3s_servers:k3s_agents:!deploy_skipped
  become: true
  # Same first-deploy ordering as the metrics play above.
  ignore_unreachable: true
  roles:
    - role: weisssrv.infra.alloy_host
      tags: [alloy_host]

# Guests that cannot run Ansible: the .fw writes are delegated to a Proxmox
# host (/etc/pve is clustered). windows_vms is included so an inventory-only
# guest_security_groups edit still deploys 155.fw via deploy-ansible-firewall.
# The two groups differ on ansible_become, but the .fw write carries its own
# explicit become: true, so both render.
- name: Deploy guest firewall rules for delegation-only VMs
  hosts: services:windows_vms
  gather_facts: false
  roles:
    - role: weisssrv.infra.proxmox_firewall
      tags: [proxmox_firewall]

# The k3s guest .fw files are otherwise written only by k3s.yml, which has no CI
# deploy job — so they run here too, letting an inventory-only edit deploy via
# deploy-ansible-firewall. cluster.fw is run_once-guarded, so this writes guest
# .fw only.
- name: Deploy k3s guest firewall rules
  hosts: k3s
  gather_facts: false
  roles:
    - role: weisssrv.infra.proxmox_firewall
      tags: [proxmox_firewall]

# Last, so every play has had its chance to converge: fail the run if any
# base_managed host was skipped as unreachable above, or has stopped answering
# since the probe. Carries the probe's host pattern (NOT localhost, which
# --limit empties) so the scoped CI jobs are gated too.
- name: Gate on the reachability ledger
  ansible.builtin.import_playbook: _reachability-gate.yml
