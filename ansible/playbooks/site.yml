---
# Base infrastructure playbook (Proxmox hosts, DNS, mail, NAS, firewall,
# host-level observability). k3s, Plex, GitLab, Home Assistant, Nextcloud,
# Immich, and Immich ML have dedicated playbooks with separate lifecycles.

# smtp-relay has no dedicated playbook (dns/plex/gitlab provision via their
# own), so codify its create path here — otherwise rebuilding the container
# after loss is a manual, undocumented step. proxmox_lxc is idempotent and
# handles the container living on another node after an HA migration. Runs
# FIRST (gather_facts:false, purely delegated to pve-opt-01): the base_managed
# play below connects directly to smtp-relay and would mark a lost container
# UNREACHABLE, excluding it from every subsequent play — so provisioning must
# happen before that first connection attempt.
- name: Provision SMTP relay LXC container
  hosts: mail
  gather_facts: false
  roles:
    - role: proxmox_lxc
      tags: [proxmox_lxc]

- name: Deploy base configuration to all managed hosts
  hosts: base_managed
  become: true
  roles:
    - role: base
      tags: [base]
    - role: nic_tuning
      tags: [nic_tuning, network]

- name: Deploy Proxmox host configuration
  hosts: proxmox
  become: true
  roles:
    - role: qol
      tags: [qol]
    - role: postfix_null_client
      tags: [postfix_null_client]
    # dm-crypt plain-mode random-key encrypted swap on the six bare-metal hosts.
    # Config-only; activation is deferred to each host's next reboot (no live
    # switchover); self-gates on encrypted_swap_enabled.
    - role: encrypted_swap
      tags: [encrypted_swap]
    # ZFS ARC cap on the COMPUTE hosts only (proxmox_role != 'nas'):
    # pve-nas-01's ARC is owned by nas_storage on the storage playbook lifecycle.
    # Self-gates on zfs_arc_cap_max_bytes (group_vars/proxmox.yml). Protects the
    # VFIO-passthrough host (pinned guest RAM) from an uncapped ARC — docs/43.
    - role: zfs_arc_cap
      tags: [zfs_arc_cap]
      when: proxmox_role != 'nas'
    # Host-side GPU VFIO codification (IOMMU cmdline + vfio-pci bind + nouveau
    # blacklist). Self-gates on vfio_passthrough_enabled (set only on
    # pve-prec-01 in hosts.yml); STAGES config + prints reboot-required, never
    # reboots — the operator applies it in a maintenance window (docs/43).
    - role: vfio_passthrough
      tags: [vfio_passthrough]
      when: vfio_passthrough_enabled | default(false)
    - role: tailscale
      tags: [tailscale]
      when: tailscale_enabled | bool
    # tlshd on every PVE host (client mode; truststore only) — prerequisite
    # for the tank-proxmox storage.cfg entry mounting with xprtsec=tls on all
    # nodes. Tasks self-guard on nfs_tls_enabled (group_vars/proxmox.yml).
    # Server-mode pve-nas-01 (nfs_tls_is_server) is EXCLUDED here so its
    # cert/key-dependent setup runs only in the NAS play below, after acme_certs
    # distributes the wildcard cert — preserving the fresh-bootstrap ordering
    # documented on the NAS play. Client-only hosts need just the CA bundle.
    - role: nfs_tls
      tags: [nfs_tls]
      when: not (nfs_tls_is_server | default(false))
    - role: proxmox_firewall
      tags: [proxmox_firewall]

- name: Deploy DNS server configuration
  hosts: dns
  become: true
  serial: 1  # one resolver at a time — never restart unbound/AdGuard on both at once
  roles:
    - role: postfix_null_client
      tags: [postfix_null_client]
    - role: unbound
      tags: [unbound]
    - role: unbound_exporter
      tags: [unbound_exporter]
    - role: adguard_home
      tags: [adguard_home]

- name: Deploy certificate management and sync
  hosts: dns
  become: true
  serial: 1  # acme reload restarts AdGuardHome — keep the other resolver up
  roles:
    - role: acme_certs
      tags: [acme_certs]
    - role: adguard_sync
      tags: [adguard_sync]

# NAS storage runs AFTER certificate management: nfs_tls's preflight fails loud
# if the wildcard cert/key aren't present on pve-nas-01, and those are
# distributed by the acme_certs play above (cert_distribution_targets). Running
# the NAS play earlier would fail a fresh `site.yml` bootstrap before the cert
# exists. (storage.yml is the standalone NAS playbook for re-runs once the cert
# is already distributed.) Nothing in the DNS/cert plays above depends on NAS
# storage, and the proxmox play still precedes this one.
- name: Deploy NAS storage configuration
  hosts: pve-nas-01
  become: true
  roles:
    # Opt-in NFSv4-over-TLS daemon; tasks self-guard on nfs_tls_enabled, so this
    # is a no-op unless set in host_vars/pve-nas-01 (matches storage.yml). Runs
    # BEFORE nas_storage so tlshd is installed + verified before nas_storage
    # (re)publishes any xprtsec=tls export — otherwise a TLS-required export
    # could be live without a working handshake daemon if nfs_tls later fails.
    - role: nfs_tls
      tags: [nfs_tls]
    - role: nas_storage
      tags: [nas_storage]
    # Nightly offsite B2 backup (restic + rclone). Runs after nas_storage (needs
    # the archsync snapshots + tank/backups/apps landing zone); chains OnSuccess=
    # after archive-backup.service. No-op while restic_offsite_enabled is false.
    - role: restic_offsite
      tags: [restic_offsite]
    # Declarative storage.cfg + vzdump jobs (tank-proxmox target). Cluster-wide
    # config, so it runs from this single node; no-op while its lists are empty.
    - role: proxmox_backup
      tags: [proxmox_backup]
    - role: zfs_exporter
      tags: [zfs_exporter]

- name: Deploy DNS guest firewall rules
  hosts: dns
  roles:
    - role: proxmox_firewall
      tags: [proxmox_firewall]

- name: Deploy SMTP relay configuration
  hosts: mail
  become: true
  roles:
    - role: smtp_relay
      tags: [smtp_relay]

- name: Deploy SMTP guest firewall rules
  hosts: mail
  roles:
    - role: proxmox_firewall
      tags: [proxmox_firewall]

- name: Deploy host-level metrics (node_exporter on bare metal, DNS, mail, GitLab, Nextcloud, Immich, and k3s-server hosts)
  hosts: proxmox:dns:mail:gitlab_servers:nextcloud_servers:immich_servers:k3s_servers
  become: true
  # App VMs (nextcloud, immich) are provisioned by their own deploy jobs, which
  # need deploy-ansible-base to succeed first — so on a first deploy the VM does
  # not exist yet and this metrics play would otherwise fail the whole base
  # deploy with UNREACHABLE. Skip unreachable hosts here (their own playbook also
  # deploys node_exporter_host); a genuinely-down host surfaces via NodeDown, not
  # by failing every base deploy.
  ignore_unreachable: true
  roles:
    - role: node_exporter_host
      tags: [node_exporter_host]

- name: Deploy host-side log collection (Alloy → Loki)
  hosts: base_managed:plex_servers:gitlab_servers:nextcloud_servers:immich_servers:immich_ml_servers:k3s_servers:k3s_agents
  become: true
  # Same first-deploy ordering as the metrics play above: skip a not-yet-provisioned
  # app VM instead of failing the base deploy (the app's own playbook ships alloy_host).
  ignore_unreachable: true
  roles:
    - role: alloy_host
      tags: [alloy_host]

# Deploy guest firewall rules for VMs that can't run Ansible directly (Home
# Assistant, the Windows 11 VM): firewall rules are deployed via delegation to a
# Proxmox host (the /etc/pve/ filesystem is clustered). windows_vms is included
# so an inventory-only guest_security_groups edit still deploys 155.fw via
# deploy-ansible-firewall (which runs `site.yml --tags proxmox_firewall`). The
# services hosts inherit ansible_become: false and windows_vms true, but the
# guest .fw write carries its own explicit become: true, so both render.
- name: Deploy guest firewall rules for delegation-only VMs
  hosts: services:windows_vms
  gather_facts: false
  roles:
    - role: proxmox_firewall
      tags: [proxmox_firewall]

# k3s guest .fw files (VMIDs 202-207, 222-227) are otherwise written only by
# playbooks/k3s.yml (hosts: k3s), which has no CI deploy job. Run them here under
# --tags proxmox_firewall so an inventory-only guest_security_groups edit in
# hosts.yml deploys via deploy-ansible-firewall. The role self-gates on
# vmid + guest_security_groups, so it is a safe no-op for any k3s host without
# security groups; cluster.fw is run_once-guarded, so this only writes guest .fw.
- name: Deploy k3s guest firewall rules
  hosts: k3s
  gather_facts: false
  roles:
    - role: proxmox_firewall
      tags: [proxmox_firewall]
