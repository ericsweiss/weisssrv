---
# Configure autostart and boot order for existing VMs and LXC containers
# This is a one-time setup task for existing infrastructure
# New VMs/containers will have autostart configured during provisioning
#
# HAOS (vm 154) is deliberately not covered: it is Proxmox-HA-managed, so HA
# starts it and onboot is moot.

- name: Configure autostart and boot order for LXC containers
  hosts: lxc_containers
  gather_facts: false
  vars:
    desired_onboot: "onboot: {{ proxmox_autostart_enabled | default(true) | ternary(1, 0) }}"
    desired_startup: "startup: order={{ proxmox_startup_order | default(100) }},up={{ proxmox_startup_delay | default(0) }}"
  tasks:
    - name: Determine container ID
      ansible.builtin.set_fact:
        container_id: "{{ vmid }}"

    - name: Find which Proxmox host has this container
      ansible.builtin.shell: |
        pct status {{ container_id }} 2>/dev/null && echo "found"
      register: pve_check
      delegate_to: "{{ item }}"
      loop: "{{ groups['proxmox'] }}"
      failed_when: false
      changed_when: false
      when: groups['proxmox'] is defined

    - name: Set Proxmox host variable
      ansible.builtin.set_fact:
        container_pve_host: "{{ item.item }}"
      loop: "{{ pve_check.results }}"
      when:
        - pve_check is defined
        - item.rc == 0
        - "'found' in item.stdout"

    - name: Read current container config
      delegate_to: "{{ container_pve_host }}"
      ansible.builtin.command: pct config {{ container_id }}
      register: current_config
      changed_when: false
      when: container_pve_host is defined

    # Only write (and report changed) when the config actually differs.
    # An unset onboot/startup key never matches the desired line, so the
    # first run converges it; subsequent runs are no-ops.
    - name: Configure autostart and boot order for LXC container
      delegate_to: "{{ container_pve_host }}"
      ansible.builtin.command: >-
        pct set {{ container_id }}
        --onboot {{ proxmox_autostart_enabled | default(true) | ternary(1, 0) }}
        --startup order={{ proxmox_startup_order | default(100) }},up={{ proxmox_startup_delay | default(0) }}
      changed_when: true
      when:
        - container_pve_host is defined
        - desired_onboot not in current_config.stdout_lines
          or desired_startup not in current_config.stdout_lines

    - name: Display configuration
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ container_id }}):
          {{ 'on ' + container_pve_host + ' - order=' + (proxmox_startup_order | default(100) | string) +
          ', delay=' + (proxmox_startup_delay | default(0) | string) + 's'
          if container_pve_host is defined else 'not found on any Proxmox host' }}

- name: Configure autostart and boot order for VMs (k3s + gitlab)
  hosts: k3s:gitlab_servers
  gather_facts: false
  vars:
    desired_onboot: "onboot: {{ proxmox_autostart_enabled | default(true) | ternary(1, 0) }}"
    desired_startup: "startup: order={{ proxmox_startup_order | default(100) }},up={{ proxmox_startup_delay | default(0) }}"
  tasks:
    - name: Determine VM ID
      ansible.builtin.set_fact:
        vm_id: "{{ vmid }}"

    - name: Check if VM exists
      delegate_to: "{{ proxmox_host }}"
      ansible.builtin.shell: |
        qm status {{ vm_id }} 2>/dev/null
      register: vm_check
      failed_when: false
      changed_when: false
      when: proxmox_host is defined

    - name: Read current VM config
      delegate_to: "{{ proxmox_host }}"
      ansible.builtin.command: qm config {{ vm_id }}
      register: current_config
      changed_when: false
      when:
        - proxmox_host is defined
        - vm_check.rc == 0

    - name: Configure autostart and boot order for VM
      delegate_to: "{{ proxmox_host }}"
      ansible.builtin.command: >-
        qm set {{ vm_id }}
        --onboot {{ proxmox_autostart_enabled | default(true) | ternary(1, 0) }}
        --startup order={{ proxmox_startup_order | default(100) }},up={{ proxmox_startup_delay | default(0) }}
      changed_when: true
      when:
        - proxmox_host is defined
        - vm_check.rc == 0
        - desired_onboot not in current_config.stdout_lines
          or desired_startup not in current_config.stdout_lines

    - name: Display configuration
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ vm_id }}) on {{ proxmox_host }}:
          {{ 'order=' + (proxmox_startup_order | default(100) | string) +
          ', delay=' + (proxmox_startup_delay | default(0) | string) + 's'
          if (vm_check.rc | default(1)) == 0 else 'does not exist - skipped' }}
      when: proxmox_host is defined
