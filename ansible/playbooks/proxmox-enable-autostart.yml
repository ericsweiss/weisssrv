---
# Idempotent reconcile of onboot/startup order against the inventory; re-run
# after any proxmox_autostart_* or proxmox_lxc_* edit. HAOS (154) is
# deliberately not covered: Proxmox HA starts it, so onboot is moot.

# CRITICAL: the LXC play mirrors proxmox_lxc's precedence exactly. Neutral
# proxmox_autostart_* names win when set, then per-container proxmox_lxc_* host_vars,
# then the role defaults (true / 100 / 0). Reading only the neutral names would
# reconcile plex to onboot=1 and flatten the DNS -> SMTP -> apps boot order.
- name: Configure autostart and boot order for LXC containers
  hosts: lxc_containers
  gather_facts: false
  vars:
    lxc_onboot: "{{ proxmox_autostart_enabled | default(proxmox_lxc_onboot | default(true)) }}"
    lxc_startup_order: "{{ proxmox_startup_order | default(proxmox_lxc_startup_order | default(100)) }}"
    lxc_startup_delay: "{{ proxmox_startup_delay | default(proxmox_lxc_startup_delay | default(0)) }}"
    desired_onboot: "onboot: {{ lxc_onboot | ternary(1, 0) }}"
    desired_startup: "startup: order={{ lxc_startup_order }},up={{ lxc_startup_delay }}"
  tasks:
    - name: Determine container ID
      ansible.builtin.set_fact:
        container_id: "{{ vmid }}"

    # CRITICAL: one delegated cluster query per host, never a looped delegate_to. A
    # looped delegate that is unreachable ends the host's task sequence rc 0 and the
    # reconcile reports green having changed nothing. pvesh answers cluster-wide, so
    # the first host that answers returns the guest's real node.
    - name: Query the cluster for this container's current node
      ansible.builtin.include_tasks: tasks/_probe-pve-cluster.yml
      loop: "{{ [proxmox_host] + (groups['proxmox'] | difference([proxmox_host])) }}"
      loop_control:
        loop_var: pve_probe_host

    # The two when: conditions are order-dependent: the length check is what keeps
    # `from_json` from being handed the empty string when every probe failed. Do not
    # reorder them or collapse them into one `and`.
    - name: Set Proxmox host variable
      vars:
        pve_container_entry: >-
          {{ (pve_cluster_json | default('') | from_json)
             | selectattr('vmid', 'equalto', container_id | int) | list }}
      ansible.builtin.set_fact:
        container_pve_host: "{{ pve_container_entry | map(attribute='node') | first }}"
      when:
        - pve_cluster_json | default('') | length > 0
        - pve_container_entry | length > 0

    # Terminal: an undetermined node means nothing below runs, and a silent
    # green run here is exactly how a guest ends up with onboot unset.
    - name: Fail when the container's Proxmox node could not be determined
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} ({{ container_id }}) was not found in any
          Proxmox cluster resource list — autostart NOT reconciled.
          Probes: {{ pve_probe_results | default([]) | join('; ') }}
      when: container_pve_host is not defined

    - name: Read current container config
      delegate_to: "{{ container_pve_host }}"
      ansible.builtin.command: pct config {{ container_id }}
      register: current_config
      changed_when: false
      check_mode: false

    # Only write (and report changed) when the config actually differs.
    # An unset onboot/startup key never matches the desired line, so the
    # first run converges it; subsequent runs are no-ops.
    - name: Configure autostart and boot order for LXC container
      delegate_to: "{{ container_pve_host }}"
      ansible.builtin.command: >-
        pct set {{ container_id }}
        --onboot {{ lxc_onboot | ternary(1, 0) }}
        --startup order={{ lxc_startup_order }},up={{ lxc_startup_delay }}
      changed_when: true
      when:
        - desired_onboot not in current_config.stdout_lines
          or desired_startup not in current_config.stdout_lines

    - name: Display configuration
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ container_id }}) on {{ container_pve_host }}:
          onboot={{ lxc_onboot | ternary(1, 0) }},
          order={{ lxc_startup_order }}, delay={{ lxc_startup_delay }}s

# Node-pinned app VMs carry proxmox_autostart_* in hosts.yml and are
# reconciled here too.
- name: Configure autostart and boot order for VMs (k3s + app VMs)
  hosts: k3s:gitlab_servers:nextcloud_servers:immich_servers:windows_vms
  gather_facts: false
  vars:
    desired_onboot: "onboot: {{ proxmox_autostart_enabled | default(true) | ternary(1, 0) }}"
    desired_startup: "startup: order={{ proxmox_startup_order | default(100) }},up={{ proxmox_startup_delay | default(0) }}"
  tasks:
    - name: Determine VM ID
      ansible.builtin.set_fact:
        vm_id: "{{ vmid }}"

    # Terminal, not a `when: proxmox_host is defined` guard on every task below:
    # those made a guest with no proxmox_host report green having reconciled
    # nothing. It also seeds the probe loop's first host.
    - name: Assert the VM declares a Proxmox host
      ansible.builtin.assert:
        that:
          - proxmox_host is defined
          - proxmox_host | default('') | trim | length > 0
        fail_msg: >-
          {{ inventory_hostname }} ({{ vm_id }}) has no proxmox_host in the
          inventory — autostart NOT reconciled.

    # Same shape as the LXC play above: one delegated cluster query per host
    # (never a looped delegate_to), and the API answers cluster-wide so this
    # returns the guest's real node even after a migration.
    - name: Query the cluster for this VM's current node
      ansible.builtin.include_tasks: tasks/_probe-pve-cluster.yml
      loop: "{{ [proxmox_host] + (groups['proxmox'] | difference([proxmox_host])) }}"
      loop_control:
        loop_var: pve_probe_host

    # The two when: conditions are order-dependent: the length check is what keeps
    # `from_json` from being handed the empty string when every probe failed. Do not
    # reorder them or collapse them into one `and`.
    - name: Set Proxmox host variable
      vars:
        pve_vm_entry: >-
          {{ (pve_cluster_json | default('') | from_json)
             | selectattr('vmid', 'equalto', vm_id | int) | list }}
      ansible.builtin.set_fact:
        vm_pve_host: "{{ pve_vm_entry | map(attribute='node') | first }}"
      when:
        - pve_cluster_json | default('') | length > 0
        - pve_vm_entry | length > 0

    - name: Fail when the VM's Proxmox node could not be determined
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} ({{ vm_id }}) was not found in any Proxmox
          cluster resource list — autostart NOT reconciled.
          Probes: {{ pve_probe_results | default([]) | join('; ') }}
      when: vm_pve_host is not defined

    - name: Read current VM config
      delegate_to: "{{ vm_pve_host }}"
      ansible.builtin.command: qm config {{ vm_id }}
      register: current_config
      changed_when: false
      check_mode: false

    - name: Configure autostart and boot order for VM
      delegate_to: "{{ vm_pve_host }}"
      ansible.builtin.command: >-
        qm set {{ vm_id }}
        --onboot {{ proxmox_autostart_enabled | default(true) | ternary(1, 0) }}
        --startup order={{ proxmox_startup_order | default(100) }},up={{ proxmox_startup_delay | default(0) }}
      changed_when: true
      when:
        - desired_onboot not in current_config.stdout_lines
          or desired_startup not in current_config.stdout_lines

    - name: Display configuration
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ vm_id }}) on {{ vm_pve_host }}:
          onboot={{ proxmox_autostart_enabled | default(true) | ternary(1, 0) }},
          order={{ proxmox_startup_order | default(100) }},
          delay={{ proxmox_startup_delay | default(0) }}s
