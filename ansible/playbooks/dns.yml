---
# DNS stack deployment playbook
# Runs serially to avoid taking down both DNS servers simultaneously

- name: Provision DNS LXC containers
  hosts: dns
  gather_facts: false
  serial: 1  # Provision one at a time
  roles:
    - proxmox_lxc

- name: Deploy DNS server configuration
  hosts: dns
  become: true
  serial: 1  # Deploy one DNS server at a time
  roles:
    - base
    - postfix_null_client
    - unbound
    - unbound_exporter
    - adguard_home

- name: Deploy certificate and sync management
  hosts: dns
  become: true
  serial: 1  # Deploy one DNS server at a time
  roles:
    - acme_certs
    - adguard_sync

- name: Deploy guest firewall rules
  hosts: dns
  roles:
    - proxmox_firewall
