---
# DNS stack deployment playbook
# Runs serially to avoid taking down both DNS servers simultaneously

- name: Provision DNS LXC containers
  hosts: dns
  gather_facts: false
  serial: 1  # Provision one at a time
  roles:
    - weisssrv.infra.proxmox_lxc

- name: Deploy DNS server configuration
  hosts: dns
  become: true
  serial: 1  # Deploy one DNS server at a time
  roles:
    - weisssrv.infra.base
    - weisssrv.infra.postfix_null_client
    - weisssrv.infra.unbound
    - weisssrv.infra.unbound_exporter
    - weisssrv.infra.adguard_home
    # Also in site.yml; listed here so a standalone deploy stays in sync.
    - weisssrv.infra.node_exporter_host
    - weisssrv.infra.alloy_host

- name: Deploy certificate and sync management
  hosts: dns
  become: true
  serial: 1  # Deploy one DNS server at a time
  roles:
    - weisssrv.infra.acme_certs
    - weisssrv.infra.adguard_sync

- name: Deploy guest firewall rules
  hosts: dns
  roles:
    - weisssrv.infra.proxmox_firewall
