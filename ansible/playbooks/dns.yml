---
# DNS stack deployment playbook
# Runs serially to avoid taking down both DNS servers simultaneously

- name: Provision DNS LXC containers
  hosts: dns
  gather_facts: false
  serial: 1  # Provision one at a time
  roles:
    - proxmox_lxc

- name: Deploy DNS server configuration
  hosts: dns
  become: true
  serial: 1  # Deploy one DNS server at a time
  roles:
    - base
    - postfix_null_client
    - unbound
    - unbound_exporter
    - adguard_home
    # Host-level observability. site.yml deploys node_exporter_host (to dns via
    # proxmox:dns:mail:gitlab_servers) and alloy_host (to dns via base_managed)
    # in dedicated plays; include them here so a standalone `task dns:deploy`
    # keeps host metrics + log shipping in sync with the role.
    - node_exporter_host
    - alloy_host

- name: Deploy certificate and sync management
  hosts: dns
  become: true
  serial: 1  # Deploy one DNS server at a time
  roles:
    - acme_certs
    - adguard_sync

- name: Deploy guest firewall rules
  hosts: dns
  roles:
    - proxmox_firewall
