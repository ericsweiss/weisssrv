---
# Full k3s cluster deployment
# Deploys base configuration, then k3s server(s), then k3s agents

- name: Deploy base configuration to k3s nodes
  hosts: k3s
  become: true
  roles:
    - weisssrv.infra.base
    - weisssrv.infra.qol
    - weisssrv.infra.postfix_null_client
    # Also in site.yml; listed here so a standalone deploy stays in sync.
    - weisssrv.infra.alloy_host

# MUST precede the server/agent plays: the k3s role's off-node etcd-snapshot
# task asserts tlshd is active and mounts an xprtsec=tls export. Group-wide —
# agents mount the NAS-backed PVs, servers the etcd-snapshot export. nfs_tls
# needs only apt + the CA truststore from the base play.
- name: Deploy NFSv4-over-TLS daemon on NFS-mounting k3s nodes
  hosts: k3s
  become: true
  roles:
    - weisssrv.infra.nfs_tls

- name: Deploy k3s server(s)
  hosts: k3s_servers
  become: true
  serial: 1  # One server at a time for safe cluster formation
  roles:
    - weisssrv.infra.k3s

- name: Deploy k3s agents
  hosts: k3s_agents
  become: true
  # One agent at a time: an agent config / kubelet-arg change fires the
  # Restart k3s-agent handler, and Traefik ingress + the MetalLB L2 speaker run
  # on the agents, so a simultaneous cluster-wide kubelet bounce can blip the
  # .100/.101 VIPs. Matches the server play above and maintenance/update-k3s-nodes.yml.
  serial: 1
  roles:
    - weisssrv.infra.k3s

# Also in site.yml; listed here so a standalone deploy stays in sync — without
# it the servers' etcd-snapshot textfile metric (EtcdSnapshotStale) is
# unexposed. Agents are covered by the in-cluster node-exporter DaemonSet.
- name: Deploy host-level metrics on k3s servers
  hosts: k3s_servers
  become: true
  roles:
    - weisssrv.infra.node_exporter_host

# gather_facts: false to match site.yml's equivalent play — the role is purely
# delegated and self-gates on vmid + guest_security_groups, so gathering on all
# nine VMs buys nothing.
- name: Deploy guest firewall rules
  hosts: k3s
  gather_facts: false
  roles:
    - weisssrv.infra.proxmox_firewall

- name: Verify cluster health
  hosts: k3s_servers[0]
  become: true
  tasks:
    - name: Get node status
      ansible.builtin.command: k3s kubectl get nodes -o wide
      register: node_status
      changed_when: false

    - name: Display cluster status
      ansible.builtin.debug:
        msg: "{{ node_status.stdout_lines }}"

    # Fail loud on any node whose STATUS column does not begin with 'Ready'
    # (Ready,SchedulingDisabled — a cordoned-but-healthy node — still passes),
    # mirroring scripts/post-maintenance-verify.sh. STATUS is the 2nd column of
    # `get nodes -o wide`; skip the header row.
    - name: Fail if any node is not Ready
      ansible.builtin.assert:
        that:
          - item.split()[1] is match('^Ready')
        fail_msg: "Node not Ready: {{ item }}"
        quiet: true
      loop: "{{ node_status.stdout_lines[1:] }}"
      loop_control:
        label: "{{ item.split()[0] }}"

    - name: Get pod status across all namespaces
      ansible.builtin.command: k3s kubectl get pods -A
      register: pod_status
      changed_when: false

    - name: Display pod status
      ansible.builtin.debug:
        msg: "{{ pod_status.stdout_lines }}"

    - name: Display next steps
      ansible.builtin.debug:
        msg: |
          K3s cluster deployment complete!

          Next steps:
          1. Get kubeconfig: task k3s:kubeconfig
          2. Platform controllers (MetalLB, Traefik, external-dns) and apps
             reconcile automatically via Flux from kubernetes/ — run
             task flux:status to watch.
