---
# NAS storage deployment playbook

- name: Deploy NAS storage configuration
  hosts: nas
  become: true
  roles:
    # Opt-in NFSv4-over-TLS daemon, no-op unless nfs_tls_enabled is true.
    # Runs BEFORE nas_storage so tlshd is up before any xprtsec=tls export.
    - weisssrv.infra.nfs_tls
    - weisssrv.infra.nas_storage
    # Nightly offsite B2 backup (restic + rclone), after nas_storage so the
    # snapshots and landing zone exist. No-op while restic_offsite_enabled is
    # false.
    - weisssrv.infra.restic_offsite
    # Declarative storage.cfg + vzdump jobs (tank-proxmox target). Cluster-wide
    # config, so it runs from this single node; no-op while its lists are empty.
    - weisssrv.infra.proxmox_backup
    - weisssrv.infra.zfs_exporter
    # Shared with site.yml; scripts/test_shared_role_playbook_sync.py keeps the two in step.
    - weisssrv.infra.node_exporter_host
    - weisssrv.infra.alloy_host
