---
# NAS storage deployment playbook

- name: Deploy NAS storage configuration
  hosts: pve-nas-01
  become: true
  roles:
    # Opt-in NFSv4-over-TLS daemon. The role's tasks are individually guarded by
    # `nfs_tls_enabled | default(false)`, so this is a no-op unless that var is
    # set true in host_vars/pve-nas-01 (or group_vars). Runs BEFORE nas_storage
    # so tlshd is installed + verified before nas_storage (re)publishes any
    # xprtsec=tls export (avoids a TLS-required export with no handshake daemon).
    - nfs_tls
    - nas_storage
    # Declarative storage.cfg + vzdump jobs (tank-proxmox target). Cluster-wide
    # config, so it runs from this single node; no-op while its lists are empty.
    - proxmox_backup
    - zfs_exporter
    # site.yml deploys node_exporter_host (to pve-nas-01 via proxmox) and
    # alloy_host (via base_managed) in dedicated plays; include them here so a
    # standalone `task storage:deploy` keeps host metrics + log shipping in sync.
    - node_exporter_host
    - alloy_host
