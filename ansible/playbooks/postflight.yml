---
# Post-deployment verification playbook
# Verifies critical services are functioning after deployment

- name: Verify SSH access to all hosts
  hosts: base_managed
  gather_facts: false
  become: false
  tasks:
    - name: Verify SSH connectivity
      ansible.builtin.ping:

- name: Verify base system health
  hosts: base_managed
  become: true
  tasks:
    - name: Check disk space (fail if root <10% free)
      ansible.builtin.assert:
        that:
          - item.size_available > (item.size_total * 0.10)
        fail_msg: "{{ item.mount }} has less than 10% free space"
      loop: "{{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') }}"
      loop_control:
        label: "{{ item.mount }}"

    - name: Verify SSH service is running
      ansible.builtin.service:
        name: ssh
        state: started
      check_mode: true
      register: postflight_service_check
      failed_when: postflight_service_check is changed

    - name: Verify admin user can sudo
      ansible.builtin.command: sudo -n true
      become: false
      changed_when: false
      when: base_admin_user | default(admin_user) != 'root'

- name: Verify Proxmox host services
  hosts: proxmox
  become: true
  tasks:
    - name: Verify Tailscale is running
      ansible.builtin.command: tailscale status
      changed_when: false
      register: tailscale_status
      failed_when: tailscale_status.rc != 0

    - name: Verify Postfix is running
      ansible.builtin.service:
        name: postfix
        state: started
      check_mode: true
      register: postflight_service_check
      failed_when: postflight_service_check is changed

- name: Verify DNS services
  hosts: dns
  become: true
  tasks:
    - name: Verify Unbound is running
      ansible.builtin.service:
        name: unbound
        state: started
      check_mode: true
      register: postflight_service_check
      failed_when: postflight_service_check is changed

    - name: Test DNS resolution via Unbound
      ansible.builtin.command: dig @127.0.0.1 -p {{ unbound_port }} google.com +short
      changed_when: false
      register: dns_test
      failed_when: dns_test.rc != 0 or dns_test.stdout == ""

    - name: Verify AdGuard Home is running
      ansible.builtin.service:
        name: AdGuardHome
        state: started
      check_mode: true
      register: postflight_service_check
      failed_when: postflight_service_check is changed

    - name: Test AdGuard Home API (401 is OK - means it's running)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ adguard_home_http_port }}/control/status"
        method: GET
        status_code: [200, 401]
        validate_certs: false
      register: adguard_status

    - name: Verify AdGuard Home DNS is responding
      ansible.builtin.command: dig @127.0.0.1 -p 53 google.com +short
      changed_when: false
      register: adguard_dns_test
      failed_when: adguard_dns_test.rc != 0 or adguard_dns_test.stdout == ""

- name: Verify certificate distribution SSH access (dns-01 only)
  hosts: dns-01
  become: true
  tasks:
    # Exercise the SAME pinned-key path the cert-reload script uses:
    # StrictHostKeyChecking=yes against /root/.ssh/known_hosts (populated by
    # acme_certs), so a changed/unknown host key fails loudly here exactly as
    # the real cert push would — accept-new would mask that. Loops over every
    # cert_distribution_target rather than two hardcoded hosts.
    #
    # The payload is NOT an arbitrary command: every sudo target pins the key
    # with command="sudo /usr/local/sbin/cert-receive",restrict, so the receiver
    # replaces it. Assert its refusal — `ssh -n` must give rc 3 + "FAIL: empty
    # bundle", which proves host-key pin + key auth + forced command + sudoers +
    # receiver install. ssh's own 255 and any other receiver rc stay errors.
    #
    # ssh_no_sudo targets (HAOS) have no receiver and no forced command — their
    # authorized_keys is pasted by hand — so there the payload really does run
    # and `echo success` is the correct assertion.
    - name: Test SSH to each certificate distribution target
      ansible.builtin.command: >-
        ssh -n -i /home/{{ acme_certs_ssh_user }}/.ssh/id_ed25519_certs
        -o BatchMode=yes
        -o StrictHostKeyChecking=yes
        -o UserKnownHostsFile=/root/.ssh/known_hosts
        -o ConnectTimeout=5
        -p {{ item.ssh_port | default(22) }}
        {{ item.ssh_user | default(acme_certs_ssh_user) }}@{{ item.ip }} 'echo success'
      changed_when: false
      # infra:verify is routinely run with --check; without this the command is
      # skipped, cert_target_ssh has no rc/stdout, and failed_when explodes.
      check_mode: false
      register: cert_target_ssh
      failed_when: >-
        (item.ssh_no_sudo | default(false))
        | ternary('success' not in cert_target_ssh.stdout,
                  cert_target_ssh.rc != 3
                  or 'FAIL: empty bundle' not in cert_target_ssh.stderr)
      loop: "{{ acme_certs_distribution_targets }}"
      loop_control:
        label: "{{ item.host }} ({{ item.ip }})"

    - name: Verify AdGuard Home Sync timer is enabled
      ansible.builtin.systemd:
        name: adguardhome-sync.timer
        enabled: true
      check_mode: true
      register: postflight_service_check
      failed_when: postflight_service_check is changed

    # The timer being enabled says nothing about whether the DynamicUser +
    # LoadCredential + StateDirectory sandbox can actually start on the real
    # (unprivileged) dns-01 LXC. Trigger one run and confirm it did not fail at
    # the exec/sandbox stage. An app-level failure (unreachable origin) is fine;
    # a systemd exec-class status (217 USER, 226 NAMESPACE, 238 STATE_DIRECTORY,
    # 243 CREDENTIALS) means the sandbox itself could not be set up.
    - name: Trigger one adguardhome-sync run to exercise the sandbox  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl start adguardhome-sync.service
      changed_when: false
      failed_when: false

    - name: Read adguardhome-sync exec status  # noqa: command-instead-of-module
      ansible.builtin.command: >-
        systemctl show adguardhome-sync.service --property=ExecMainStatus --value
      register: adguardhome_sync_status
      changed_when: false

    - name: Assert adguardhome-sync started under its sandbox
      ansible.builtin.assert:
        that:
          - adguardhome_sync_status.stdout | trim not in ['217', '226', '238', '243']
        fail_msg: >-
          adguardhome-sync.service failed at the exec/sandbox stage
          (ExecMainStatus={{ adguardhome_sync_status.stdout | trim }}) — a
          DynamicUser/LoadCredential/StateDirectory primitive could not be set
          up on this host.

- name: Verify SMTP relay
  hosts: mail
  become: true
  tasks:
    - name: Verify Postfix is running
      ansible.builtin.service:
        name: postfix
        state: started
      check_mode: true
      register: postflight_service_check
      failed_when: postflight_service_check is changed

    - name: Test Postfix is accepting connections on submission port
      ansible.builtin.wait_for:
        port: 587
        host: 127.0.0.1
        timeout: 5

    - name: Test SASL authentication is configured
      ansible.builtin.command: postconf -h smtp_sasl_auth_enable
      changed_when: false
      register: sasl_config
      failed_when: "'yes' not in sasl_config.stdout"

- name: Verify NAS storage
  hosts: pve-nas-01
  become: true
  tasks:
    - name: Check ZFS pool health (all pools)
      ansible.builtin.command: "zpool status {{ item }}"
      changed_when: false
      register: zpool_health
      failed_when: >
        zpool_health.rc != 0 or
        'DEGRADED' in zpool_health.stdout or
        'FAULTED' in zpool_health.stdout or
        'UNAVAIL' in zpool_health.stdout
      loop:
        - tank
        - ssd
        - nvme
        - archive
      loop_control:
        label: "{{ item }}"

    - name: Display ZFS pool status
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ zpool_health.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ssd/pve is the encryption root under the `ssd` Proxmox storage id: every
    # guest root disk created there inherits its encryption. An id recreated
    # against the pool root (encryption=off) would silently land new disks in
    # plaintext, which is why proxmox_backup_storage pins `pool: ssd/pve`
    # (create-fixed) and this asserts the property itself.
    - name: Check ssd/pve is encrypted
      ansible.builtin.command: zfs get -H -o value encryption ssd/pve
      changed_when: false
      register: postflight_ssd_pve_encryption
      failed_when: postflight_ssd_pve_encryption.stdout | trim != 'aes-256-gcm'

    - name: Verify ZFS datasets are mounted
      ansible.builtin.command: zfs list -H -o name,mounted,canmount
      changed_when: false
      register: zfs_datasets
      failed_when: false

    - name: Check critical datasets are mounted
      ansible.builtin.assert:
        that:
          - "'yes' in item"
        fail_msg: "Critical ZFS dataset not mounted: {{ item }}"
      loop: "{{ zfs_datasets.stdout_lines }}"
      # Skip zvols (mounted column '-') and datasets deliberately kept unmounted
      # with canmount=off (e.g. ssd/appdata/mealie, kept unmounted so the NFS
      # bind exports the real directory rather than a shadowing mount).
      when: >
        (
          'tank/media' in item or
          'tank/share' in item or
          'ssd/appdata' in item or
          'nvme/media' in item
        ) and item is not regex('.*\t-$')
          and item is not regex('.*\toff$')

    - name: Verify MergerFS mounts
      ansible.builtin.command: findmnt -t fuse.mergerfs -o TARGET,SOURCE
      changed_when: false
      # NOT `nas_storage_mergerfs_mounts`: a registered var is a host fact for
      # the rest of the run and outranks host_vars, so registering that name
      # would shadow pve-nas-01's real mergerfs table with a command result.
      register: postflight_mergerfs_check
      failed_when: postflight_mergerfs_check.rc != 0

    - name: Display MergerFS mounts
      ansible.builtin.debug:
        msg: "{{ postflight_mergerfs_check.stdout_lines }}"

    - name: Check disk space on critical mounts
      ansible.builtin.command: df -h
      changed_when: false
      register: disk_space

    - name: Display disk space
      ansible.builtin.debug:
        msg: "{{ disk_space.stdout_lines }}"

    - name: Check SMART health for HDD disks
      ansible.builtin.command: "smartctl -H {{ item }}"
      changed_when: false
      register: smart_health
      failed_when: "'PASSED' not in smart_health.stdout"
      loop: "{{ nas_storage_smartd_tank_disks }}"
      loop_control:
        label: "{{ item | basename }}"
      when: nas_storage_smartd_enabled | default(true)

    - name: Check SMART health for SSD disks
      ansible.builtin.command: "smartctl -H {{ item }}"
      changed_when: false
      register: smart_ssd_health
      failed_when: "'PASSED' not in smart_ssd_health.stdout"
      loop: "{{ nas_storage_smartd_ssd_disks }}"
      loop_control:
        label: "{{ item | basename }}"
      when: nas_storage_smartd_enabled | default(true)

    - name: Check SMART health for NVMe disks
      ansible.builtin.command: "smartctl -H {{ item }}"
      changed_when: false
      register: smart_nvme_health
      failed_when: "'PASSED' not in smart_nvme_health.stdout"
      loop: "{{ nas_storage_smartd_nvme_disks }}"
      loop_control:
        label: "{{ item | basename }}"
      when: nas_storage_smartd_enabled | default(true)

    - name: Check SMART health for archive pool disks
      ansible.builtin.command: "smartctl -H {{ item }}"
      changed_when: false
      register: smart_archive_health
      failed_when: "'PASSED' not in smart_archive_health.stdout"
      loop: "{{ nas_storage_smartd_archive_disks | default([]) }}"
      loop_control:
        label: "{{ item | basename }}"
      when:
        - nas_storage_smartd_enabled | default(true)
        - nas_storage_smartd_archive_disks is defined
        - nas_storage_smartd_archive_disks | length > 0

    - name: Verify smartd service is running
      ansible.builtin.service:
        name: smartd
        state: started
      check_mode: true
      register: postflight_service_check
      failed_when: postflight_service_check is changed
      when: nas_storage_smartd_enabled | default(true)

    - name: Check Proxmox backup job status
      ansible.builtin.command: pvesh get /cluster/backup --output-format=json
      changed_when: false
      register: backup_jobs
      failed_when: false

    - name: Display backup job configuration
      ansible.builtin.debug:
        msg: "{{ backup_jobs.stdout | from_json }}"
      when: backup_jobs.rc == 0

    - name: Verify NFS server is running
      ansible.builtin.service:
        name: nfs-kernel-server
        state: started
      check_mode: true
      register: postflight_service_check
      failed_when: postflight_service_check is changed

    # Every k3s NFS PV mounts with xprtsec=tls; if the handshake daemon is
    # down, new TLS mounts fail cluster-wide even though nfsd itself is up.
    - name: Verify tlshd is running (NFS-over-TLS handshake daemon)
      ansible.builtin.service:
        name: tlshd
        state: started
      check_mode: true
      register: postflight_service_check
      failed_when: postflight_service_check is changed
      when: nfs_tls_enabled | default(false)

    - name: Check NFS exports are active
      ansible.builtin.command: showmount -e localhost
      changed_when: false
      # Renamed for the same reason as postflight_mergerfs_check above: plain
      # `nas_storage_exports` is pve-nas-01's export table in host_vars.
      register: postflight_nfs_exports_check
      failed_when: "'/export' not in postflight_nfs_exports_check.stdout"

    - name: Verify Samba is running
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
      check_mode: true
      register: postflight_service_check
      failed_when: postflight_service_check is changed
      loop:
        - smbd
        - nmbd

    - name: Verify nas user exists in Samba
      ansible.builtin.command: pdbedit -L
      changed_when: false
      register: samba_users
      failed_when: "'nas' not in samba_users.stdout"

    - name: Verify media-mover timer is enabled
      ansible.builtin.systemd:
        name: media-mover.timer
        enabled: true
      check_mode: true
      register: postflight_service_check
      failed_when: postflight_service_check is changed
      when: nas_storage_media_mover_enabled | default(false)

    - name: Check last media-mover run status
      ansible.builtin.command: systemctl status media-mover.service
      changed_when: false
      register: mover_status
      failed_when: false
      when: nas_storage_media_mover_enabled | default(false)

    - name: Display media-mover last run
      ansible.builtin.debug:
        msg: "{{ mover_status.stdout_lines | select('search', 'Active|Main PID|Status') | list }}"
      when: nas_storage_media_mover_enabled | default(false) and mover_status.rc == 0

# gitlab_servers included: the gitlab VM carries the gitlab-repos zvol via the
# same vm_additional_disks mechanism as the k3s agents. nextcloud_servers and
# immich_servers likewise carry three passthrough zvols each — five of the six
# on encrypted pools that must be unlocked before pve-start-encrypted-guests
# starts the guest, so this is exactly where docs/32's failure mode (a guest
# started with an unmounted passthrough disk, writing into the empty
# mountpoint directory) has to be caught. The tasks already loop
# `vm_additional_disks | default([])`, so the host pattern is the only change.
- name: Verify persistent storage mounts (k3s + gitlab + nextcloud + immich)
  hosts: k3s:gitlab_servers:nextcloud_servers:immich_servers
  become: true
  tasks:
    - name: Verify additional disk mount points
      ansible.builtin.command: "findmnt {{ item.mount_point }}"
      loop: "{{ vm_additional_disks | default([]) }}"
      loop_control:
        label: "{{ item.name }} -> {{ item.mount_point }}"
      changed_when: false
      register: mount_check
      failed_when: mount_check.rc != 0
      when: vm_additional_disks is defined

    - name: Check disk space on persistent mounts
      ansible.builtin.command: "df -h {{ item.mount_point }}"
      loop: "{{ vm_additional_disks | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false
      when: vm_additional_disks is defined

# The NAS server-side tlshd check lives in the 'Verify NAS storage' play above;
# this play asserts the client side: every k3s node that could mount a NAS export
# runs the handshake daemon (agents for the app PVs, servers for the off-node
# etcd-snapshot copy), and any live pve-nas-01 mount is actually TLS (a plaintext
# one means a client slipped past the require-TLS export lines). The servers'
# etcd-snapshot mount is on-demand, so the live-mount loop is often empty there.
- name: Verify NFSv4-over-TLS on k3s nodes
  hosts: k3s
  become: true
  tasks:
    - name: Verify tlshd handshake daemon is running
      ansible.builtin.service:
        name: tlshd
        state: started
      check_mode: true
      register: postflight_service_check
      failed_when: postflight_service_check is changed
      when: nfs_tls_enabled | default(false)

    # Pods (and their NFS PVs) float across agents, so an agent may legitimately
    # carry zero NAS mounts. Read /proc/mounts directly (xprtsec surfaces there);
    # grep rc=1 (no match) is tolerated so the assert loop is simply empty.
    - name: Gather live NFS mounts to pve-nas-01
      ansible.builtin.command:
        cmd: "grep pve-nas-01.{{ internal_domain }}: /proc/mounts"
      changed_when: false
      failed_when: false
      register: nas_nfs_mounts
      when: nfs_tls_enabled | default(false)

    - name: Assert every pve-nas-01 NFS mount carries xprtsec=tls
      ansible.builtin.assert:
        that:
          - "'xprtsec=tls' in item"
        fail_msg: "NFS mount to pve-nas-01 without xprtsec=tls: {{ item }}"
        success_msg: "pve-nas-01 NFS mount is TLS: {{ item.split()[0] }}"
      loop: "{{ nas_nfs_mounts.stdout_lines | default([]) }}"
      loop_control:
        label: "{{ item.split()[0] }}"
      when:
        - nfs_tls_enabled | default(false)
        - nas_nfs_mounts.stdout_lines | default([]) | length > 0

- name: Display verification summary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Summary
      ansible.builtin.debug:
        msg: >-
          Post-deployment verification completed — review the task output
          above for failures or skips (plays may be skipped under --limit
          or --tags).
