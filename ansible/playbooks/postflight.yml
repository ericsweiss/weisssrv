---
# Post-deployment verification. Every probe is read-only, so each play sets
# check_mode: false and runs under --check; the only state touched is one
# adguardhome-sync run, triggered to exercise the service sandbox.

- name: Verify SSH access to all hosts
  hosts: base_managed
  gather_facts: false
  become: false
  tasks:
    - name: Verify SSH connectivity
      ansible.builtin.ping:

- name: Verify base system health
  hosts: base_managed
  become: true
  check_mode: false
  vars:
    postflight_active_units:
      - ssh
  tasks:
    - name: Check disk space (fail if root <10% free)
      ansible.builtin.assert:
        that:
          - item.size_available > (item.size_total * 0.10)
        fail_msg: "{{ item.mount }} has less than 10% free space"
      loop: "{{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') }}"
      loop_control:
        label: "{{ item.mount }}"

    # Unit state is asserted, never enforced, so a unit a deploy left stopped
    # fails this verification instead of being started by it.
    - name: Read the state of the units this play verifies  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-active {{ item }}"
      changed_when: false
      failed_when: false
      register: postflight_unit_state
      loop: "{{ postflight_active_units }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert every verified unit is active
      ansible.builtin.assert:
        that:
          - item.stdout | trim == 'active'
        fail_msg: >-
          {{ inventory_hostname }}: {{ item.item }} is
          {{ item.stdout | trim | default('not loaded', true) }}, not active.
        quiet: true
      loop: "{{ postflight_unit_state.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify admin user can sudo
      ansible.builtin.command: sudo -n true
      become: false
      changed_when: false
      when: base_admin_user | default(admin_user) != 'root'

- name: Verify Proxmox host services
  hosts: proxmox
  become: true
  check_mode: false
  vars:
    postflight_active_units:
      - postfix
  tasks:
    - name: Verify Tailscale is running
      ansible.builtin.command: tailscale status
      changed_when: false
      register: tailscale_status
      failed_when: tailscale_status.rc != 0
      when: tailscale_enabled | default(false) | bool

    # Subnet routers only. Without this ACCEPT first in nat POSTROUTING, bridged
    # guest traffic is masqueraded a second time and every VIP on the router's
    # own host black-holes over Tailscale (docs/34).
    - name: Read the nat POSTROUTING chain
      ansible.builtin.command: iptables -w 5 -t nat -S POSTROUTING
      changed_when: false
      register: postflight_nat_postrouting
      when: tailscale_advertise_routes | default([]) | length > 0

    - name: Verify the bridged-traffic masquerade bypass comes first
      ansible.builtin.assert:
        that:
          - postflight_nat_postrouting.stdout_lines | length > 1
          - postflight_nat_postrouting.stdout_lines[1] == postflight_bridge_masq_rule
        fail_msg: >-
          nat POSTROUTING does not start with the bridged-traffic ACCEPT -
          check tailscale-bridge-masq-fix.timer on this host.
      vars:
        postflight_bridge_masq_rule: >-
          -A POSTROUTING -m physdev --physdev-is-bridged -m mark --mark
          0x40000/0xff0000 -j ACCEPT
      when: tailscale_advertise_routes | default([]) | length > 0

    - name: Read the state of the units this play verifies  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-active {{ item }}"
      changed_when: false
      failed_when: false
      register: postflight_unit_state
      loop: "{{ postflight_active_units }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert every verified unit is active
      ansible.builtin.assert:
        that:
          - item.stdout | trim == 'active'
        fail_msg: >-
          {{ inventory_hostname }}: {{ item.item }} is
          {{ item.stdout | trim | default('not loaded', true) }}, not active.
        quiet: true
      loop: "{{ postflight_unit_state.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"

- name: Verify DNS services
  hosts: dns
  become: true
  check_mode: false
  vars:
    postflight_active_units:
      - unbound
      - AdGuardHome
  tasks:
    - name: Read the state of the units this play verifies  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-active {{ item }}"
      changed_when: false
      failed_when: false
      register: postflight_unit_state
      loop: "{{ postflight_active_units }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert every verified unit is active
      ansible.builtin.assert:
        that:
          - item.stdout | trim == 'active'
        fail_msg: >-
          {{ inventory_hostname }}: {{ item.item }} is
          {{ item.stdout | trim | default('not loaded', true) }}, not active.
        quiet: true
      loop: "{{ postflight_unit_state.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Test DNS resolution via Unbound
      ansible.builtin.command: dig @127.0.0.1 -p {{ unbound_port }} google.com +short
      changed_when: false
      register: dns_test
      failed_when: dns_test.rc != 0 or dns_test.stdout == ""

    - name: Test AdGuard Home API (401 is OK - means it's running)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ adguard_home_http_port }}/control/status"
        method: GET
        status_code: [200, 401]
        validate_certs: false

    - name: Verify AdGuard Home DNS is responding
      ansible.builtin.command: dig @127.0.0.1 -p 53 google.com +short
      changed_when: false
      register: adguard_dns_test
      failed_when: adguard_dns_test.rc != 0 or adguard_dns_test.stdout == ""

- name: Verify certificate distribution SSH access (the cert primary only)
  hosts: dns_primary
  become: true
  check_mode: false
  tasks:
    # An entry with an empty host_key is skipped by the cert play, so the target
    # silently stops receiving the wildcard until it expires.
    - name: Assert every certificate distribution target has a pinned host key
      ansible.builtin.assert:
        that: item.host_key | default('') | length > 0
        fail_msg: >-
          {{ item.host }} ({{ item.ip }}) has no host_key, so it is NOT
          receiving the wildcard certificate. Run `task certs:show-host-keys`,
          paste the value in, and re-run `task dns:deploy`.
        quiet: true
      loop: "{{ acme_certs_distribution_targets | default([]) }}"
      loop_control:
        label: "{{ item.host }}"

    # Exercises the same pinned-key path as the cert-reload script. On sudo
    # targets the forced command replaces the payload, so rc 3 + "FAIL: empty
    # bundle" is the pass; ssh_no_sudo targets (HAOS) really run `echo success`.
    - name: Test SSH to each certificate distribution target
      ansible.builtin.command: >-
        ssh -n -i /home/{{ acme_certs_ssh_user }}/.ssh/id_ed25519_certs
        -o BatchMode=yes
        -o StrictHostKeyChecking=yes
        -o UserKnownHostsFile=/root/.ssh/known_hosts
        -o ConnectTimeout=5
        -p {{ item.ssh_port | default(22) }}
        {{ item.ssh_user | default(acme_certs_ssh_user) }}@{{ item.ip }} 'echo success'
      changed_when: false
      register: cert_target_ssh
      failed_when: >-
        (item.ssh_no_sudo | default(false))
        | ternary('success' not in cert_target_ssh.stdout,
                  cert_target_ssh.rc != 3
                  or 'FAIL: empty bundle' not in cert_target_ssh.stderr)
      loop: "{{ acme_certs_distribution_targets }}"
      loop_control:
        label: "{{ item.host }} ({{ item.ip }})"

    - name: Read whether the AdGuard Home Sync timer is enabled  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-enabled adguardhome-sync.timer
      changed_when: false
      failed_when: false
      register: postflight_sync_timer
      when: adguard_sync_enabled | default(false) | bool

    - name: Assert the AdGuard Home Sync timer is enabled
      ansible.builtin.assert:
        that:
          - postflight_sync_timer.stdout | trim == 'enabled'
        fail_msg: >-
          {{ inventory_hostname }}: adguardhome-sync.timer is
          {{ postflight_sync_timer.stdout | trim | default('not loaded', true) }},
          not enabled.
        quiet: true
      when: adguard_sync_enabled | default(false) | bool

    # Only way to prove the DynamicUser/LoadCredential/StateDirectory sandbox
    # can start on the unprivileged dns-01 LXC. It pushes dns-01's config to
    # dns-02, so set postflight_exercise_sync=false to skip it.
    - name: Read adguardhome-sync invocation before the trigger  # noqa: command-instead-of-module
      ansible.builtin.command: >-
        systemctl show adguardhome-sync.service --property=InvocationID --value
      register: adguardhome_sync_invocation_before
      changed_when: false
      when:
        - adguard_sync_enabled | default(false) | bool
        - postflight_exercise_sync | default(true) | bool

    - name: Trigger one adguardhome-sync run to exercise the sandbox  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl start adguardhome-sync.service
      changed_when: true
      failed_when: false
      when:
        - adguard_sync_enabled | default(false) | bool
        - postflight_exercise_sync | default(true) | bool

    # A refused start job (masked unit, job rejected before exec) leaves
    # ExecMainStatus holding the previous run, so a changed InvocationID is
    # what proves this invocation ran. Both reads carry the trigger's guards.
    - name: Read adguardhome-sync invocation after the trigger  # noqa: command-instead-of-module
      ansible.builtin.command: >-
        systemctl show adguardhome-sync.service --property=InvocationID --value
      register: adguardhome_sync_invocation_after
      changed_when: false
      when:
        - adguard_sync_enabled | default(false) | bool
        - postflight_exercise_sync | default(true) | bool

    - name: Read adguardhome-sync exec status  # noqa: command-instead-of-module
      ansible.builtin.command: >-
        systemctl show adguardhome-sync.service --property=ExecMainStatus --value
      register: adguardhome_sync_status
      changed_when: false
      when:
        - adguard_sync_enabled | default(false) | bool
        - postflight_exercise_sync | default(true) | bool

    - name: Assert adguardhome-sync started under its sandbox
      ansible.builtin.assert:
        that:
          - adguardhome_sync_status is not skipped
          - >-
            adguardhome_sync_invocation_after.stdout | trim
            != adguardhome_sync_invocation_before.stdout | trim
          - adguardhome_sync_status.stdout | trim not in ['217', '226', '238', '243']
        fail_msg: >-
          adguardhome-sync.service either did not start (masked, or the job was
          refused before exec, leaving ExecMainStatus stale and the sandbox
          unexercised) or failed at the exec/sandbox stage
          (ExecMainStatus={{ adguardhome_sync_status.stdout | trim }}): a
          DynamicUser/LoadCredential/StateDirectory primitive could not be set
          up on this host.
      when:
        - adguard_sync_enabled | default(false) | bool
        - postflight_exercise_sync | default(true) | bool

- name: Verify SMTP relay
  hosts: mail
  become: true
  check_mode: false
  vars:
    postflight_active_units:
      - postfix
  tasks:
    - name: Read the state of the units this play verifies  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-active {{ item }}"
      changed_when: false
      failed_when: false
      register: postflight_unit_state
      loop: "{{ postflight_active_units }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert every verified unit is active
      ansible.builtin.assert:
        that:
          - item.stdout | trim == 'active'
        fail_msg: >-
          {{ inventory_hostname }}: {{ item.item }} is
          {{ item.stdout | trim | default('not loaded', true) }}, not active.
        quiet: true
      loop: "{{ postflight_unit_state.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Test Postfix is accepting connections on submission port
      ansible.builtin.wait_for:
        port: 587
        host: 127.0.0.1
        timeout: 5

    - name: Test SASL authentication is configured
      ansible.builtin.command: postconf -h smtp_sasl_auth_enable
      changed_when: false
      register: sasl_config
      failed_when: "'yes' not in sasl_config.stdout"

- name: Verify NAS storage
  hosts: nas
  become: true
  check_mode: false
  vars:
    postflight_critical_dataset_prefixes:
      - tank/media
      - tank/share
      - ssd/appdata
      - nvme/media
    # tlshd: every k3s NFS PV mounts with xprtsec=tls, so a down handshake
    # daemon fails new TLS mounts cluster-wide even while nfsd itself is up.
    postflight_active_units: >-
      {{ ['nfs-kernel-server', 'smbd', 'nmbd']
         + (['smartd'] if (nas_storage_smartd_enabled | default(true)) else [])
         + (['tlshd'] if (nfs_tls_enabled | default(false)) else []) }}
  tasks:
    - name: Assert the inventory declares at least one ZFS pool
      ansible.builtin.assert:
        that:
          - nas_storage_zfs_pools | default([]) | length > 0
        fail_msg: >-
          nas_storage_zfs_pools is empty on {{ inventory_hostname }}; the pool
          health check below would iterate over nothing and pass vacuously.
        quiet: true

    - name: Check ZFS pool health (all pools)
      ansible.builtin.command: "zpool status {{ item }}"
      changed_when: false
      register: zpool_health
      failed_when: >
        zpool_health.rc != 0 or
        'DEGRADED' in zpool_health.stdout or
        'FAULTED' in zpool_health.stdout or
        'UNAVAIL' in zpool_health.stdout
      loop: "{{ nas_storage_zfs_pools | default([]) | map(attribute='name') | list }}"
      loop_control:
        label: "{{ item }}"

    - name: Display ZFS pool status
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ zpool_health.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ssd/pve is the encryption root every guest root disk inherits. A storage
    # id recreated against the pool root (encryption=off) would silently land
    # new disks in plaintext, so the property itself is asserted.
    - name: Check ssd/pve is encrypted
      ansible.builtin.command: zfs get -H -o value encryption ssd/pve
      changed_when: false
      register: postflight_ssd_pve_encryption
      failed_when: postflight_ssd_pve_encryption.stdout | trim != 'aes-256-gcm'

    - name: Verify ZFS datasets are mounted
      ansible.builtin.command: zfs list -H -o name,mounted,canmount
      changed_when: false
      register: zfs_datasets

    - name: Assert zfs list returned datasets
      ansible.builtin.assert:
        that:
          - zfs_datasets.stdout_lines | length > 0
        fail_msg: "zfs list returned no datasets; the mount check below cannot fail"
        quiet: true

    - name: Assert every critical dataset prefix appears in the listing
      ansible.builtin.assert:
        that:
          - zfs_datasets.stdout_lines | select('search', item) | list | length > 0
        fail_msg: >-
          No dataset matching '{{ item }}' in `zfs list`; the mount check below
          would pass vacuously for it. Update the prefix list or the inventory.
        quiet: true
      loop: "{{ postflight_critical_dataset_prefixes }}"

    - name: Check critical datasets are mounted
      ansible.builtin.assert:
        that:
          # The `mounted` COLUMN, not a substring of the whole tab-joined line:
          # a dataset whose NAME embeds "yes" would otherwise pass unmounted.
          - item.split('\t')[1] == 'yes'
        fail_msg: "Critical ZFS dataset not mounted: {{ item }}"
      loop: "{{ zfs_datasets.stdout_lines }}"
      # Skip zvols (mounted column '-') and datasets deliberately kept unmounted
      # with canmount=off (e.g. ssd/appdata/mealie, kept unmounted so the NFS
      # bind exports the real directory rather than a shadowing mount).
      when: >
        postflight_critical_dataset_prefixes | select('in', item) | list | length > 0
        and item is not regex('.*\t-$')
        and item is not regex('.*\toff$')

    - name: Verify MergerFS mounts
      ansible.builtin.command: findmnt -t fuse.mergerfs -o TARGET,SOURCE
      changed_when: false
      # NOT `nas_storage_mergerfs_mounts`: a registered var is a host fact for
      # the rest of the run and outranks host_vars, so registering that name
      # would shadow pve-nas-01's real mergerfs table with a command result.
      register: postflight_mergerfs_check
      failed_when: postflight_mergerfs_check.rc != 0

    - name: Display MergerFS mounts
      ansible.builtin.debug:
        msg: "{{ postflight_mergerfs_check.stdout_lines }}"

    - name: Check disk space on critical mounts
      ansible.builtin.command: df -h
      changed_when: false
      register: disk_space

    - name: Display disk space
      ansible.builtin.debug:
        msg: "{{ disk_space.stdout_lines }}"

    # One task over every declared disk class, so a new class needs no new task.
    - name: Check SMART health for every declared disk
      ansible.builtin.command: "smartctl -H {{ item }}"
      changed_when: false
      register: smart_health
      failed_when: "'PASSED' not in smart_health.stdout"
      loop: >-
        {{ (nas_storage_smartd_tank_disks | default([]))
           + (nas_storage_smartd_ssd_disks | default([]))
           + (nas_storage_smartd_nvme_disks | default([]))
           + (nas_storage_smartd_archive_disks | default([])) }}
      loop_control:
        label: "{{ item | basename }}"
      when: nas_storage_smartd_enabled | default(true)

    - name: Read the state of the units this play verifies  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-active {{ item }}"
      changed_when: false
      failed_when: false
      register: postflight_unit_state
      loop: "{{ postflight_active_units }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert every verified unit is active
      ansible.builtin.assert:
        that:
          - item.stdout | trim == 'active'
        fail_msg: >-
          {{ inventory_hostname }}: {{ item.item }} is
          {{ item.stdout | trim | default('not loaded', true) }}, not active.
        quiet: true
      loop: "{{ postflight_unit_state.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check Proxmox backup job status
      ansible.builtin.command: pvesh get /cluster/backup --output-format=json
      changed_when: false
      register: backup_jobs
      failed_when: false

    - name: Display backup job configuration
      ansible.builtin.debug:
        msg: "{{ backup_jobs.stdout | from_json }}"
      when: backup_jobs.rc == 0

    - name: Check NFS exports are active
      ansible.builtin.command: showmount -e localhost
      changed_when: false
      # Renamed for the same reason as postflight_mergerfs_check above: plain
      # `nas_storage_exports` is pve-nas-01's export table in host_vars.
      register: postflight_nfs_exports_check
      failed_when: "'/export' not in postflight_nfs_exports_check.stdout"

    - name: Verify nas user exists in Samba
      ansible.builtin.command: pdbedit -L
      changed_when: false
      register: samba_users
      failed_when: "'nas' not in samba_users.stdout"

    - name: Read whether the media-mover timer is enabled  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-enabled media-mover.timer
      changed_when: false
      failed_when: false
      register: postflight_mover_timer
      when: nas_storage_media_mover_enabled | default(false)

    - name: Assert the media-mover timer is enabled
      ansible.builtin.assert:
        that:
          - postflight_mover_timer.stdout | trim == 'enabled'
        fail_msg: >-
          {{ inventory_hostname }}: media-mover.timer is
          {{ postflight_mover_timer.stdout | trim | default('not loaded', true) }},
          not enabled.
        quiet: true
      when: nas_storage_media_mover_enabled | default(false)

    - name: Check last media-mover run status
      ansible.builtin.command: systemctl status media-mover.service
      changed_when: false
      register: mover_status
      failed_when: false
      when: nas_storage_media_mover_enabled | default(false)

    - name: Display media-mover last run
      ansible.builtin.debug:
        msg: "{{ mover_status.stdout_lines | select('search', 'Active|Main PID|Status') | list }}"
      when: nas_storage_media_mover_enabled | default(false) and mover_status.rc == 0

# App VMs carry passthrough zvols through the same vm_additional_disks mechanism
# as the k3s agents, most on encrypted pools. Catches docs/32's failure mode: a
# guest started with an unmounted disk, writing into the empty mountpoint.
- name: Verify persistent storage mounts (k3s + gitlab + nextcloud + immich)
  hosts: k3s:gitlab_servers:nextcloud_servers:immich_servers
  become: true
  check_mode: false
  tasks:
    - name: Verify additional disk mount points
      ansible.builtin.command: "findmnt {{ item.mount_point }}"
      loop: "{{ vm_additional_disks | default([]) }}"
      loop_control:
        label: "{{ item.name }} -> {{ item.mount_point }}"
      changed_when: false
      register: mount_check
      failed_when: mount_check.rc != 0
      when: vm_additional_disks is defined

    - name: Check disk space on persistent mounts
      ansible.builtin.command: "df -h {{ item.mount_point }}"
      loop: "{{ vm_additional_disks | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false
      when: vm_additional_disks is defined

# Client side of the tlshd check ('Verify NAS storage' above covers the server):
# every k3s node that could mount a NAS export runs the handshake daemon and any
# live pve-nas-01 mount is TLS. The servers' on-demand mount is often absent.
- name: Verify NFSv4-over-TLS on k3s nodes
  hosts: k3s
  become: true
  check_mode: false
  vars:
    postflight_active_units: >-
      {{ ['tlshd'] if (nfs_tls_enabled | default(false)) else [] }}
  tasks:
    - name: Read the state of the units this play verifies  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-active {{ item }}"
      changed_when: false
      failed_when: false
      register: postflight_unit_state
      loop: "{{ postflight_active_units }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert every verified unit is active
      ansible.builtin.assert:
        that:
          - item.stdout | trim == 'active'
        fail_msg: >-
          {{ inventory_hostname }}: {{ item.item }} is
          {{ item.stdout | trim | default('not loaded', true) }}, not active.
        quiet: true
      loop: "{{ postflight_unit_state.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"

    # Pods (and their NFS PVs) float across agents, so an agent may legitimately
    # carry zero NAS mounts. Read /proc/mounts directly (xprtsec surfaces there);
    # grep rc=1 (no match) is tolerated so the assert loop is simply empty.
    - name: Gather live NFS mounts to the NAS
      ansible.builtin.command:
        cmd: "grep {{ (groups['nas'] | first) ~ '.' ~ internal_domain }}: /proc/mounts"
      changed_when: false
      # rc 1 is "no match"; anything else is a broken probe, which would empty
      # the assert loop below and report green.
      failed_when: nas_nfs_mounts.rc not in [0, 1]
      register: nas_nfs_mounts
      when: nfs_tls_enabled | default(false)

    - name: Assert every NAS NFS mount carries xprtsec=tls
      ansible.builtin.assert:
        that:
          - "'xprtsec=tls' in item"
        fail_msg: "NFS mount to the NAS without xprtsec=tls: {{ item }}"
        success_msg: "NAS NFS mount is TLS: {{ item.split()[0] }}"
      loop: "{{ nas_nfs_mounts.stdout_lines | default([]) }}"
      loop_control:
        label: "{{ item.split()[0] }}"
      when:
        - nfs_tls_enabled | default(false)
        - nas_nfs_mounts.stdout_lines | default([]) | length > 0

- name: Display verification summary
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Summary
      ansible.builtin.debug:
        msg: >-
          Post-deployment verification completed — review the task output
          above for failures or skips (plays may be skipped under --limit
          or --tags).
