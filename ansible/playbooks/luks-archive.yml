---
# Deploy boot-time LUKS-open mechanism for the archive ZFS pool.
#
# Only pve-nas-01 holds the archive pool — the role is gated internally
# on luks_archive_devices being non-empty (apt installs, dir creates,
# env file deploys all skip on hosts with an empty list), but limiting
# the play's host scope avoids running the prerequisite apt-cache update
# on every compute node. Use `--limit` to target a different NAS if the
# pool ever lives elsewhere.
#
# Run via the Taskfile wrappers (which handle Connect token + SSH key
# injection from 1Password automatically):
#   task luks-archive:bootstrap                # before any device is LUKS-formatted
#   task luks-archive:apply                    # after rolling conversion; activates services
# See docs/32-zfs-encryption.md §LUKS for the rolling-conversion workflow.

- name: Deploy LUKS-archive boot-time unlock
  hosts: pve-nas-01
  become: true
  vars:
    # Same Connect token as zfs_encryption — single token shared across
    # both roles.
    luks_archive_connect_token: >-
      {{ lookup('ansible.builtin.env', 'ZFS_ENCRYPTION_CONNECT_TOKEN', default='') }}
  roles:
    - role: luks_archive
