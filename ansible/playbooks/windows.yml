---
# Builds the Win11 VM shell and its guest firewall. The VM is created STOPPED;
# Windows is installed from the Proxmox console (docs/39-windows-vm.md).

# CRITICAL: gather_facts MUST stay false. The guest is ansible_connection:
# local, so facts would describe the operator's workstation. Provisioning
# delegates to the Proxmox host.

- name: Provision Windows VM
  hosts: windows_vms
  gather_facts: false
  roles:
    - weisssrv.infra.proxmox_vm

- name: Deploy Windows guest firewall rules
  hosts: windows_vms
  gather_facts: false
  roles:
    - weisssrv.infra.proxmox_firewall
