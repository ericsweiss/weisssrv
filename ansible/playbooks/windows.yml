---
# Builds the Win11 VM SHELL and its guest firewall. The VM is created STOPPED —
# Windows is installed INTERACTIVELY from the Proxmox console (docs/39, which
# also lists the ISO prerequisite).
#
# gather_facts MUST stay false: the guest is ansible_connection: local, so facts
# would be the operator's workstation. Every provisioning task delegates to the
# Proxmox host and escalates there.
#
# Usage: task windows:provision (see also :provision-check, :status, :verify)

- name: Provision Windows VM
  hosts: windows_vms
  gather_facts: false
  roles:
    - weisssrv.infra.proxmox_vm

- name: Deploy Windows guest firewall rules
  hosts: windows_vms
  gather_facts: false
  roles:
    - weisssrv.infra.proxmox_firewall
