---
# Prints the SSH host keys of acme_certs_distribution_targets, ready to paste
# into _acme_certs_targets in group_vars/dns.yml. Cert pushes use
# StrictHostKeyChecking=yes, so a rebuilt host fails until its key is updated.

- name: Show SSH host keys for cert distribution targets
  hosts: dns_primary
  gather_facts: false
  become: false
  tasks:
    - name: Capture each target's ed25519 host key via ssh-keyscan
      ansible.builtin.command:
        cmd: "ssh-keyscan -t ed25519 -T 5 -p {{ item.ssh_port | default(22) }} {{ item.ip }}"
      loop: "{{ acme_certs_distribution_targets }}"
      loop_control:
        label: "{{ item.host }} ({{ item.ip }}:{{ item.ssh_port | default(22) }})"
      register: ssh_keyscans
      changed_when: false
      # Don't abort on a single unreachable target; render NOT_AVAILABLE
      # for it so the operator sees which one didn't respond.
      failed_when: false

    - name: Render paste-ready host_key values
      ansible.builtin.debug:
        msg: |
          Paste each host_key into the matching acme_certs_distribution_targets
          entry in host_vars/dns-01.yml, replacing the empty placeholder.
          Lines starting with NOT_AVAILABLE indicate the target did not
          respond to ssh-keyscan within 5s; check the target is up and
          re-run.

          {% for r in ssh_keyscans.results %}
          {% set key_line = (r.stdout_lines | default([])) | reject('match', '^#') | first | default('') %}
          {% set key_value = key_line.split(' ', 1)[1] | default('NOT_AVAILABLE') if key_line else 'NOT_AVAILABLE' %}
          - host: {{ r.item.host }}
            host_key: "{{ key_value }}"
          {% endfor %}
