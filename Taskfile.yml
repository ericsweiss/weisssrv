    cmds:
      - ssh eric@{{.IMMICH_IP}} "sudo docker compose --project-directory /mnt/immich-app/compose logs -f --tail=200"

  immich:restart:
    desc: Restart the Immich compose stack
    cmds:
      - ssh eric@{{.IMMICH_IP}} "sudo systemctl restart immich-compose.service"

  # === Immich ML (GPU LXC) Deployment Tasks ===

  immich-ml:deploy:
    desc: Deploy the Immich GPU ML LXC (provisions the container and installs the OpenVINO stack)
    dir: "{{.ANSIBLE_DIR}}"
    # Anchors shared with immich-ml:deploy-check so dry-run and deploy can't diverge.
    env: &immich_ml_env
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      # immich-ml.yml runs alloy_host, which asserts the Loki push creds.
      # The immich_ml role itself needs no secrets.
      LOKI_PUSH_USER: op://Homelab/Loki Push Auth/username
      LOKI_PUSH_PASSWORD: op://Homelab/Loki Push Auth/password
    preconditions: &immich_ml_deploy_preconditions
      - sh: command -v ansible-playbook
        msg: "ansible-playbook is not installed"
      # `op account list`, not `op whoami` — see the note on infra:deploy's preconditions.
      - sh: op account list 2>/dev/null
        msg: "1Password CLI not authenticated. Run: eval $(op signin)"
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/immich-ml.yml {{.CLI_ARGS}}

  immich-ml:deploy-check:
    desc: Check mode - show what the Immich ML deployment would change
    dir: "{{.ANSIBLE_DIR}}"
    env: *immich_ml_env
    preconditions: *immich_ml_deploy_preconditions
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/immich-ml.yml --check --diff {{.CLI_ARGS}}

  immich-ml:status:
    desc: Show the Immich ML stack status (compose ps + GPU device + /ping)
    cmds:
      - echo "=== Immich ML compose stack ==="
      - ssh eric@{{.IMMICH_ML_IP}} "sudo docker compose --project-directory /opt/immich-ml/compose ps" || echo "Immich ML LXC not reachable or stack not up"
      - echo ""
      - echo "=== GPU device (/dev/dri) ==="
      - ssh eric@{{.IMMICH_ML_IP}} "ls -la /dev/dri" || echo "/dev/dri not present in the container"
      - echo ""
      # Probed over SSH on the LXC loopback — sg-immich-ml admits :3003 from
      # the Immich VM only (the endpoint is authless; least privilege), so a
      # direct probe from the operator's LAN source is firewall-dropped by design.
      - echo "=== ML /ping (127.0.0.1:3003 in the LXC) ==="
      - ssh eric@{{.IMMICH_ML_IP}} "curl -s --max-time 10 http://127.0.0.1:3003/ping" || echo "ML service not responding"

  immich-ml:verify:
    desc: Smoke-test the Immich ML LXC (compose up, /dev/dri present, /ping answers) — exits non-zero on failure
    cmds:
      - |
        set -eu
        HOST="{{.IMMICH_ML_IP}}"
        fail=0
        echo -n "compose stack running... "
        if ssh eric@"$HOST" "sudo docker compose --project-directory /opt/immich-ml/compose ps --status running --quiet" 2>/dev/null | grep -q .; then
          echo "PASS"
        else
          echo "FAIL (no running containers)"; fail=1
        fi
        echo -n "GPU device /dev/dri present... "
        if ssh eric@"$HOST" "test -e /dev/dri/renderD128" 2>/dev/null; then
          echo "PASS"
        else
          echo "FAIL (renderD128 missing — LXC device passthrough)"; fail=1
        fi
        # Probed on the LXC loopback: sg-immich-ml admits :3003 from the Immich
        # VM only, so a probe from the operator's LAN source is dropped by design.
        echo -n "ML /ping answers... "
        if ssh eric@"$HOST" "curl -sf --max-time 10 http://127.0.0.1:3003/ping" >/dev/null 2>&1; then
          echo "PASS"
        else
          echo "FAIL (ML service not responding)"; fail=1
        fi
        [ "$fail" -eq 0 ] || { echo "=== immich-ml verification FAILED ==="; exit 1; }
        echo "=== immich-ml verification passed ==="

  immich-ml:console:
    desc: SSH to the Immich ML LXC
    cmds:
      - ssh eric@{{.IMMICH_ML_IP}}

  immich-ml:logs:
    desc: Tail the Immich ML compose logs
    cmds:
      - ssh eric@{{.IMMICH_ML_IP}} "sudo docker compose --project-directory /opt/immich-ml/compose logs -f --tail=200"

  immich-ml:restart:
    desc: Restart the Immich ML compose stack
    cmds:
      - ssh eric@{{.IMMICH_ML_IP}} "sudo systemctl restart immich-ml-compose.service"


  # === Windows 11 VM Tasks ===
  # Provisions the VM SHELL only (OVMF/TPM/q35 + VirtIO + install/driver ISOs).
  # Windows itself is installed + activated interactively via the Proxmox
  # console — see docs/39-windows-vm.md. The VM is created STOPPED.
  windows:provision:
    desc: Provision the Windows 11 VM shell + guest firewall (VM created stopped)
    dir: "{{.ANSIBLE_DIR}}"
    # SSH_PUBLIC_KEY resolves the lazy ssh_authorized_keys lookup in all.yml even
    # though the windows path never consumes it (no cloud-init). op run keeps the
    # wrapper consistent with the other provisioning tasks.
    env: &windows_env
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    preconditions: &windows_preconditions
      - sh: command -v ansible-playbook
        msg: "ansible-playbook is not installed"
      # `op account list`, not `op whoami` — see the note on infra:deploy's preconditions.
      - sh: op account list 2>/dev/null
        msg: "1Password CLI not authenticated. Run: eval $(op signin)"
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/windows.yml {{.CLI_ARGS}}

  windows:provision-check:
    desc: Check mode - show what Windows VM provisioning would change
    dir: "{{.ANSIBLE_DIR}}"
    env: *windows_env
    preconditions: *windows_preconditions
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/windows.yml --check --diff {{.CLI_ARGS}}

  windows:status:
    desc: Show the Windows VM status (qm status + config) on pve-nas-01
    cmds:
      - echo "=== Windows VM ({{.WINDOWS_VM_ID}}) status ==="
      - ssh eric@pve-nas-01 "sudo qm status {{.WINDOWS_VM_ID}}" || echo "VM not found — run 'task windows:provision'"
      - echo ""
      - echo "=== Windows VM config ==="
      - ssh eric@pve-nas-01 "sudo qm config {{.WINDOWS_VM_ID}}" || true

  windows:verify:
    desc: Verify Windows RDP reachability (fails until Windows is installed + running)
    cmds:
      - |
        echo "=== Windows VM Smoke Test ==="
        echo -n "RDP 3389 ({{.WINDOWS_IP}})... "
        if nc -z -w 5 {{.WINDOWS_IP}} 3389 2>/dev/null; then
          echo "PASS (RDP reachable — Windows is installed + running)"
        else
          # Non-zero on purpose: this is a post-install smoke test, so an
          # unreachable RDP is a real FAIL that must be detected (not silently
          # swallowed). Before Windows is installed the VM is created stopped,
          # so this failing is expected — see docs/39.
          echo "FAIL (no RDP — VM stopped or Windows not yet installed; see docs/39)"
          exit 1
        fi
