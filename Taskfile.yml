  # === Proxmox Management Tasks ===
  proxmox:configure-autostart:
    desc: Configure autostart and boot order for existing VMs/containers (one-time setup)
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i {{.INVENTORY}} playbooks/proxmox-enable-autostart.yml {{.CLI_ARGS}}

  proxmox:ha:
    desc: Configure Proxmox HA rules, resources, and storage replication
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i {{.INVENTORY}} playbooks/proxmox-ha.yml {{.CLI_ARGS}}

  proxmox:ha-check:
    desc: Check mode - show what Proxmox HA configuration would change
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i {{.INVENTORY}} playbooks/proxmox-ha.yml --check --diff {{.CLI_ARGS}}

  proxmox:ha-status:
    desc: Show Proxmox HA and replication status
    cmds:
      # First verify we can reach at least one Proxmox host
      - |
        REACHABLE_HOST=""
        for host in {{.PVE_HOSTS}}; do
          if ssh -o ConnectTimeout=2 -o BatchMode=yes "$host" "true" 2>/dev/null; then
            REACHABLE_HOST="$host"
            break
          fi
        done
        if [ -z "$REACHABLE_HOST" ]; then
          echo "ERROR: Cannot reach any Proxmox host"
          exit 1
        fi
        echo "Connected to cluster via $REACHABLE_HOST"
        echo ""
        echo "=== HA Manager Status ==="
        ssh -o BatchMode=yes "$REACHABLE_HOST" "sudo ha-manager status" 2>/dev/null || echo "(No HA manager status available)"
        echo ""
        echo "=== HA Resources ==="
        OUTPUT=$(ssh -o BatchMode=yes "$REACHABLE_HOST" "sudo ha-manager config" 2>/dev/null | grep -E '^(ct|vm):' || true)
        if [ -n "$OUTPUT" ]; then
          echo "$OUTPUT"
        else
          echo "(No HA resources configured)"
        fi
        echo ""
        # Note: ha-manager rules list requires Proxmox 9+
        echo "=== HA Rules (Node Affinity) ==="
        ssh -o BatchMode=yes "$REACHABLE_HOST" "sudo ha-manager rules list" 2>/dev/null || echo "(No HA rules configured or Proxmox < 9)"
        echo ""
        echo "=== Storage Replication Jobs ==="
        ssh -o BatchMode=yes "$REACHABLE_HOST" "sudo pvesr list" 2>/dev/null || echo "(No replication jobs configured)"
      - echo ""
      # Replication status must be checked on source nodes (pve-nas-01 is not a source)
      - echo "=== Replication Status (all source nodes) ==="
      - |
        for host in pve-laptop-01 pve-opt-01 pve-opt-02 pve-opt-03 pve-prec-01; do
          echo "--- $host ---"
          if ssh -o ConnectTimeout=2 -o BatchMode=yes "$host" "true" 2>/dev/null; then
            ssh -o BatchMode=yes "$host" "sudo pvesr status" 2>/dev/null || echo "(No replication status)"
          else
            echo "(Cannot reach $host)"
          fi
          echo ""
        done

  # === Terraform Tasks ===
  # State stored in GitLab-managed Terraform state (HTTP backend)
  # CI uses CI_JOB_TOKEN (automatic), local uses project access token from 1Password
  terraform:init:
    desc: Initialize Terraform (with GitLab state backend)
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    env:
      # GitLab Terraform state backend configuration
      # GITLAB_PROJECT_ID defined in top-level vars
      TF_HTTP_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/cloudflare"
      TF_HTTP_LOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/cloudflare/lock"
      TF_HTTP_UNLOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/cloudflare/lock"
      TF_HTTP_USERNAME: "terraform"
      TF_HTTP_PASSWORD: "op://Homelab/GitLab Terraform State Token/credential"
      TF_HTTP_LOCK_METHOD: "POST"
      TF_HTTP_UNLOCK_METHOD: "DELETE"
    preconditions:
      - sh: command -v terraform
        msg: "terraform is not installed. Install via: https://www.terraform.io/downloads"
      - sh: command -v op
        msg: "1Password CLI is not installed"
      - sh: op whoami 2>/dev/null
        msg: "1Password CLI not authenticated. Run: eval $(op signin)"
    cmds:
      - op run -- terraform init {{.CLI_ARGS}}

  terraform:plan:
    desc: Plan Terraform changes
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    env:
      TF_VAR_cloudflare_api_token: op://Homelab/Cloudflare DNS Token/credential
      TF_VAR_cloudflare_account_id: op://Homelab/Cloudflare DNS Token/username
      TF_HTTP_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/cloudflare"
      TF_HTTP_LOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/cloudflare/lock"
      TF_HTTP_UNLOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/cloudflare/lock"
      TF_HTTP_USERNAME: "terraform"
      TF_HTTP_PASSWORD: "op://Homelab/GitLab Terraform State Token/credential"
      TF_HTTP_LOCK_METHOD: "POST"
      TF_HTTP_UNLOCK_METHOD: "DELETE"
    preconditions:
      - sh: command -v terraform
        msg: "terraform is not installed. Install via: https://www.terraform.io/downloads"
      - sh: command -v op
        msg: "1Password CLI is not installed"
      - sh: op whoami 2>/dev/null
        msg: "1Password CLI not authenticated. Run: eval $(op signin)"
    cmds:
      - op run -- terraform plan {{.CLI_ARGS}}

  terraform:apply:
    desc: Apply Terraform changes
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    env:
      TF_VAR_cloudflare_api_token: op://Homelab/Cloudflare DNS Token/credential
      TF_VAR_cloudflare_account_id: op://Homelab/Cloudflare DNS Token/username
      TF_HTTP_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/cloudflare"
      TF_HTTP_LOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/cloudflare/lock"
      TF_HTTP_UNLOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/cloudflare/lock"
      TF_HTTP_USERNAME: "terraform"
      TF_HTTP_PASSWORD: "op://Homelab/GitLab Terraform State Token/credential"
      TF_HTTP_LOCK_METHOD: "POST"
      TF_HTTP_UNLOCK_METHOD: "DELETE"
    preconditions:
      - sh: command -v terraform
        msg: "terraform is not installed. Install via: https://www.terraform.io/downloads"
      - sh: command -v op
        msg: "1Password CLI is not installed"
      - sh: op whoami 2>/dev/null
        msg: "1Password CLI not authenticated. Run: eval $(op signin)"
    cmds:
      - op run -- terraform apply {{.CLI_ARGS}}

  terraform:validate:
    desc: Validate Terraform configuration (alias for validate-local)
    cmds:
      - task: terraform:validate-local

  terraform:fmt:
    desc: Format Terraform files
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    cmds:
      - terraform fmt -recursive

  terraform:fmt-check:
    desc: Check Terraform formatting
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    cmds:
      - terraform fmt -check -recursive

  terraform:validate-local:
    desc: Validate Terraform syntax (no backend auth required)
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    cmds:
      - |
        set -euo pipefail
        # Use isolated data dir so backend-free init doesn't corrupt real state
        TF_DATA_DIR="$(mktemp -d)" || { echo "ERROR: failed to create temp Terraform data dir"; exit 1; }
        trap 'rm -rf "$TF_DATA_DIR"' EXIT
        TF_DATA_DIR="$TF_DATA_DIR" terraform init -backend=false -input=false > /dev/null
        TF_DATA_DIR="$TF_DATA_DIR" terraform validate

  # === Utility Tasks ===
  collect-state:
    desc: Collect redacted cluster state
    cmds:
      - ./scripts/collect-state.sh {{.CLI_ARGS}}

  lint:
    desc: Run all linters (no auth required) — Ansible, Terraform, Flux, Python scripts
    cmds:
      - task: ansible:lint
      - task: terraform:fmt-check
      - task: terraform:validate-local
      - task: flux:lint
      - task: scripts:test

  scripts:test:
    desc: Run Python unit tests for scripts/ (pytest)
    cmds:
      - python3 -m pytest scripts/ -v
    preconditions:
      - sh: python3 -c "import pytest" 2>/dev/null
        msg: "pytest not installed. pip install pytest"

  # === 1Password Integration ===
  op:check:
    desc: Verify 1Password CLI is authenticated
    cmds:
      - op account get

  secrets:show:
    desc: Display secret references (not values) - scans Taskfile and playbooks
    cmds:
      - |
        echo "Secret references in use (from Taskfile.yml):"
        echo ""
        # Extract unique 1Password references from Taskfile
        # Format: op://Vault/Item Name/field (item names and fields can contain spaces)
        # Stop at quotes, parentheses, or backticks; trim trailing whitespace
        grep -oE "op://Homelab/[^\"'\`\)\(]+" Taskfile.yml | sed 's/[[:space:]]*$//' | grep -E "^op://Homelab/[^/]+/[^/]+$" | sort -u | sed 's/^/  - /'
        echo ""
        echo "Secret references in playbooks (if any):"
        # Also check ansible playbooks for 1Password references
        find ansible/playbooks -name "*.yml" -type f -exec grep -hoE "op://Homelab/[^\"'\`\)\(]+" {} \; 2>/dev/null | sed 's/[[:space:]]*$//' | grep -E "^op://Homelab/[^/]+/[^/]+$" | sort -u | sed 's/^/  - /' || echo "  (none found)"
        echo ""
        echo "To verify all secrets exist in 1Password:"
        echo "  op whoami && op item list --vault Homelab"

  # === Download Clients / Media Stack Tasks ===
  # New architecture: Each download client (nzbget, qbittorrent) runs independently
  # with its own optional Gluetun VPN sidecar. VPN configuration is managed
  # declaratively in the YAML manifests and deployed via Flux.

  downloads:status:
    desc: Show status of download clients and media stack
    cmds:
      - echo "=== Download Clients Namespace ==="
      - kubectl get pods -n downloads -o wide
      - echo ""
      - echo "=== Services ==="
      - kubectl get svc -n downloads
      - echo ""
      - echo "=== PVCs ==="
      - kubectl get pvc -n downloads
      - echo ""
      - echo "=== VPN ConfigMaps ==="
      - 'echo "NZBGet VPN:"'
      - kubectl get configmap nzbget-vpn-config -n downloads -o jsonpath='{.data}' 2>/dev/null || echo "  Not configured"
      - echo ""
      - 'echo "qBittorrent VPN:"'
      - kubectl get configmap qbittorrent-vpn-config -n downloads -o jsonpath='{.data}' 2>/dev/null || echo "  Not configured"
      - echo ""
      - echo "=== IngressRoutes ==="
      - kubectl get ingressroute -n downloads

  downloads:vpn-status:
    desc: Check VPN connection status for all download clients
    cmds:
      - echo "=== NZBGet VPN Status ==="
      - |
        VPN_ENABLED=$(kubectl get configmap nzbget-vpn-config -n downloads -o jsonpath='{.data.vpn_enabled}' 2>/dev/null || echo "unknown")
        VPN_PROVIDER=$(kubectl get configmap nzbget-vpn-config -n downloads -o jsonpath='{.data.vpn_provider}' 2>/dev/null || echo "unknown")
        echo "VPN Enabled: $VPN_ENABLED"
        echo "Provider: $VPN_PROVIDER"
        if [ "$VPN_ENABLED" = "true" ]; then
          echo "Gluetun logs (last 10 lines):"
          kubectl logs -n downloads -l app.kubernetes.io/name=nzbget -c gluetun --tail=10 2>/dev/null || echo "  Cannot get logs"
          echo "Public IP:"
          kubectl exec -n downloads deployment/nzbget -c gluetun -- wget -qO- https://checkip.amazonaws.com 2>/dev/null || echo "  Cannot reach checkip.amazonaws.com"
        fi
      - echo ""
      - echo "=== qBittorrent VPN Status ==="
      - |
        VPN_ENABLED=$(kubectl get configmap qbittorrent-vpn-config -n downloads -o jsonpath='{.data.vpn_enabled}' 2>/dev/null || echo "unknown")
        VPN_PROVIDER=$(kubectl get configmap qbittorrent-vpn-config -n downloads -o jsonpath='{.data.vpn_provider}' 2>/dev/null || echo "unknown")
        echo "VPN Enabled: $VPN_ENABLED"
        echo "Provider: $VPN_PROVIDER"
        if [ "$VPN_ENABLED" = "true" ]; then
          echo "Gluetun logs (last 10 lines):"
          kubectl logs -n downloads -l app.kubernetes.io/name=qbittorrent -c gluetun --tail=10 2>/dev/null || echo "  Cannot get logs"
          echo "Public IP:"
          kubectl exec -n downloads deployment/qbittorrent -c gluetun -- wget -qO- https://checkip.amazonaws.com 2>/dev/null || echo "  Cannot reach checkip.amazonaws.com"
        fi

  downloads:restart:
    desc: Restart all download clients and media apps
    cmds:
      - echo "Restarting download clients..."
      - kubectl rollout restart deployment/nzbget -n downloads
      - kubectl rollout restart deployment/qbittorrent -n downloads
      - echo "Restarting *arr apps..."
      - kubectl rollout restart deployment/prowlarr -n downloads
      - kubectl rollout restart deployment/sonarr -n downloads
      - kubectl rollout restart deployment/radarr -n downloads
      - kubectl rollout restart deployment/lidarr -n downloads
      - kubectl rollout restart deployment/pulsarr -n downloads
      - echo "Waiting for pods to be ready..."
      - kubectl wait --namespace downloads --for=condition=ready pod --all --timeout=300s

  downloads:logs:
    desc: "View logs for a specific app (task downloads:logs APP=nzbget [CONTAINER=gluetun])"
    vars:
      APP: '{{.APP | default "nzbget"}}'
      CONTAINER: '{{.CONTAINER | default ""}}'
    cmds:
      - |
        APP="{{.APP}}"
        CONTAINER="{{.CONTAINER}}"

        case "$APP" in
          nzbget|qbittorrent)
            if [ -n "$CONTAINER" ]; then
              echo "=== $APP / $CONTAINER logs ==="
              kubectl logs -n downloads -l app.kubernetes.io/name="$APP" -c "$CONTAINER" -f
            else
              echo "=== $APP logs (main container) ==="
              kubectl logs -n downloads -l app.kubernetes.io/name="$APP" -c "$APP" -f
            fi
            ;;
          nzbget-vpn|qbittorrent-vpn)
            REAL_APP="${APP%-vpn}"
            echo "=== $REAL_APP / gluetun logs ==="
            kubectl logs -n downloads -l app.kubernetes.io/name="$REAL_APP" -c gluetun -f
            ;;
          *)
            echo "=== $APP logs ==="
            kubectl logs -n downloads -l app.kubernetes.io/name="$APP" -f
            ;;
        esac

  downloads:shell:
    desc: "Open shell in app container (task downloads:shell APP=nzbget [CONTAINER=gluetun])"
    vars:
      APP: '{{.APP | default "nzbget"}}'
      CONTAINER: '{{.CONTAINER | default ""}}'
    cmds:
      - |
        APP="{{.APP}}"
        CONTAINER="{{.CONTAINER}}"

        case "$APP" in
          nzbget|qbittorrent)
            if [ -n "$CONTAINER" ]; then
              echo "Opening shell in $APP / $CONTAINER..."
              kubectl exec -it -n downloads deployment/"$APP" -c "$CONTAINER" -- /bin/sh
            else
              echo "Opening shell in $APP..."
              kubectl exec -it -n downloads deployment/"$APP" -c "$APP" -- /bin/sh
            fi
            ;;
          *)
            echo "Opening shell in $APP..."
            kubectl exec -it -n downloads deployment/"$APP" -- /bin/sh
            ;;
        esac

  downloads:delete:
    desc: Delete download clients and media stack (preserves namespace, PVCs, and secrets)
    dir: ./kubernetes/apps/download-clients
    cmds:
      - echo "Deleting workloads (preserving namespace, storage, and secrets)..."
      - |
        # Delete only workload resources, NOT namespace/storage/secrets.
        # Flux will recreate these within ~1 minute on the next reconcile
        # unless the apps Kustomization is suspended first (see echo block below).
        kubectl delete deployment -n downloads -l app.kubernetes.io/part-of=download-clients --ignore-not-found
        kubectl delete ingressroute -n downloads --all --ignore-not-found
      - |
        echo ""
        echo "Workloads deleted. Namespace, PVCs, and secrets preserved."
        echo "Flux will recreate the workloads on next reconcile (~1 minute)."
        echo "To keep them deleted, suspend the apps Kustomization first:"
        echo "  task flux:suspend -- flux-system/kustomization/apps"
        echo ""
        echo "To fully remove everything:"
        echo "  task flux:suspend -- flux-system/kustomization/apps"
        echo "  kubectl delete namespace downloads"

  # === Recipe Management Stack Tasks ===
  # Mealie (recipe management) and Bar Assistant (cocktail recipes)
  # Data services pinned to NAS node for NFS locality and backup consistency

  recipes:status:
    desc: Show status of recipe management stack
    cmds:
      - echo "=== Recipes Namespace ==="
      - kubectl get pods -n recipes -o wide
      - echo ""
      - echo "=== Services ==="
      - kubectl get svc -n recipes
      - echo ""
      - echo "=== PVCs ==="
      - kubectl get pvc -n recipes
      - echo ""
      - echo "=== IngressRoutes ==="
      - kubectl get ingressroute -n recipes

  recipes:restart:
    desc: Restart all recipe apps
    cmds:
      - echo "Restarting Mealie..."
      - kubectl rollout restart deployment/mealie -n recipes
      - kubectl rollout restart deployment/mealie-postgres -n recipes
      - echo "Restarting Bar Assistant..."
      - kubectl rollout restart deployment/bar-assistant -n recipes
      - kubectl rollout restart deployment/bar-assistant-redis -n recipes
      - kubectl rollout restart deployment/bar-assistant-meilisearch -n recipes
      - kubectl rollout restart deployment/salt-rim -n recipes
      - echo "Waiting for pods to be ready..."
      - kubectl wait --namespace recipes --for=condition=ready pod --all --timeout=300s

  recipes:logs:
    desc: "View logs for a specific app (task recipes:logs APP=mealie)"
    vars:
      APP: '{{.APP | default "mealie"}}'
    cmds:
      - |
        APP="{{.APP}}"
        echo "=== $APP logs ==="
        kubectl logs -n recipes -l app.kubernetes.io/name="$APP" -f

  recipes:shell:
    desc: "Open shell in app container (task recipes:shell APP=mealie)"
    vars:
      APP: '{{.APP | default "mealie"}}'
    cmds:
      - |
        APP="{{.APP}}"
        echo "Opening shell in $APP..."
        kubectl exec -it -n recipes deployment/"$APP" -- /bin/sh

  recipes:delete:
    desc: Delete recipe stack (preserves namespace, PVCs, and secrets)
    dir: ./kubernetes/apps/recipes
    cmds:
      - echo "Deleting workloads (preserving namespace, storage, and secrets)..."
      - |
        # Delete only workload resources, NOT namespace/storage/secrets
        kubectl delete deployment -n recipes --all --ignore-not-found
        kubectl delete statefulset -n recipes --all --ignore-not-found
        kubectl delete ingressroute -n recipes --all --ignore-not-found
      - |
        echo ""
        echo "Workloads deleted. Namespace, PVCs, and secrets preserved."
        echo "Flux will recreate the workloads on next reconcile (~1 minute)."
        echo "To keep them deleted, suspend the apps Kustomization first:"
        echo "  task flux:suspend -- flux-system/kustomization/apps"
        echo ""
        echo "To fully remove everything:"
        echo "  kubectl delete namespace recipes"

  # === Home Assistant Tasks ===
  # Home Assistant runs as a standalone VM on Proxmox (not in k3s)
  # Traefik provides ingress via IngressRoute + Service/EndpointSlice

  home-assistant:status:
    desc: Show Home Assistant VM and ingress status
    cmds:
      - echo "=== Home Assistant VM Status ==="
      - |
        # Find first reachable Proxmox host (HA-resilient)
        REACHABLE_HOST=""
        for host in {{.PVE_HOSTS}}; do
          if ssh -o ConnectTimeout=2 -o BatchMode=yes "$host" "true" 2>/dev/null; then
            REACHABLE_HOST="$host"
            break
          fi
        done
        if [ -z "$REACHABLE_HOST" ]; then
          echo "Cannot reach any Proxmox host"
        else
          # Try HA manager first to detect which node VM {{.HA_VM_ID}} is on
          CURRENT_NODE=$(ssh -o BatchMode=yes "$REACHABLE_HOST" "sudo ha-manager status 2>/dev/null | grep 'service vm:{{.HA_VM_ID}}'" 2>/dev/null | sed 's/.*(\([^,]*\),.*/\1/')
          if [ -z "$CURRENT_NODE" ]; then
            # HA not configured or VM not in HA - query cluster resources for authoritative node
            echo "HA not configured for VM {{.HA_VM_ID}}, querying cluster resources..."
            CURRENT_NODE=$(ssh -o BatchMode=yes "$REACHABLE_HOST" "sudo pvesh get /cluster/resources --type vm --output-format json 2>/dev/null" 2>/dev/null | \
              python3 -c "import sys,json; data=json.load(sys.stdin); vms=[v for v in data if v.get('vmid')=={{.HA_VM_ID}}]; print(vms[0]['node'] if vms else '')" 2>/dev/null)
            # Convert node name to hostname (e.g., pve-nas-01 format)
            if [ -n "$CURRENT_NODE" ]; then
              CURRENT_NODE="pve-${CURRENT_NODE#pve-}"  # Ensure pve- prefix
            fi
          fi
          if [ -z "$CURRENT_NODE" ]; then
            echo "Cannot find VM {{.HA_VM_ID}} on any node"
          else
            echo "Connected to cluster via $REACHABLE_HOST"
            echo "VM {{.HA_VM_ID}} is on node: $CURRENT_NODE"
            ssh "$CURRENT_NODE" "sudo qm status {{.HA_VM_ID}}" 2>/dev/null || echo "Cannot reach node $CURRENT_NODE"
          fi
        fi
      - echo ""
      - echo "=== Network Connectivity ==="
      - |
        if curl -s --connect-timeout 2 http://{{.HA_VM_IP}}:8123 >/dev/null 2>&1; then
          echo "Home Assistant HTTP: OK ({{.HA_VM_IP}}:8123)"
        else
          echo "Home Assistant HTTP: UNREACHABLE"
        fi
      - echo ""
      - echo "=== Kubernetes Resources ==="
      - kubectl get service home-assistant-backend -o wide 2>/dev/null || echo "Service not found"
      - kubectl get endpointslice home-assistant-backend 2>/dev/null || echo "EndpointSlice not found"
      - kubectl get ingressroute -A 2>/dev/null | grep -E "NAME|home-assistant" || echo "IngressRoutes not found"
      - echo ""
      - echo "=== Traefik Routing Test ==="
      - |
        echo "Internal (home.esweiss.com):"
        curl -sk --connect-timeout 5 https://home.esweiss.com -o /dev/null -w "  HTTP Status: %{http_code}\n" 2>/dev/null || echo "  UNREACHABLE"
        echo "External (home.ericsweiss.com):"
        curl -sk --connect-timeout 5 https://home.ericsweiss.com -o /dev/null -w "  HTTP Status: %{http_code}\n" 2>/dev/null || echo "  UNREACHABLE"

  home-assistant:vm-start:
    desc: Start the Home Assistant VM
    cmds:
      - |
        CURRENT_NODE=$(scripts/find-pve-host-for-vm.sh {{.HA_VM_ID}} {{.PVE_HOSTS}})
        echo "Starting VM {{.HA_VM_ID}} on $CURRENT_NODE..."
        ssh "$CURRENT_NODE" "sudo qm start {{.HA_VM_ID}}"
      - echo "Waiting for Home Assistant to be reachable..."
      - |
        for i in $(seq 1 30); do
          if curl -s --connect-timeout 2 http://{{.HA_VM_IP}}:8123 >/dev/null 2>&1; then
            echo "Home Assistant is up!"
            exit 0
          fi
          echo "Waiting... ($i/30)"
          sleep 5
        done
        echo "Warning: Home Assistant may still be starting"

  home-assistant:vm-stop:
    desc: Stop the Home Assistant VM gracefully
    cmds:
      - |
        CURRENT_NODE=$(scripts/find-pve-host-for-vm.sh {{.HA_VM_ID}} {{.PVE_HOSTS}})
        echo "Stopping VM {{.HA_VM_ID}} on $CURRENT_NODE..."
        ssh "$CURRENT_NODE" "sudo qm shutdown {{.HA_VM_ID}}"
        echo "Sent shutdown signal to Home Assistant VM"

  home-assistant:vm-restart:
    desc: Restart the Home Assistant VM
    cmds:
      - |
        CURRENT_NODE=$(scripts/find-pve-host-for-vm.sh {{.HA_VM_ID}} {{.PVE_HOSTS}})
        echo "Restarting VM {{.HA_VM_ID}} on $CURRENT_NODE..."
        # qm reset avoids QEMU Guest Agent timeout when HAOS lacks proper agent config.
        if ssh "$CURRENT_NODE" "sudo qm reset {{.HA_VM_ID}}"; then
          echo "Sent reset signal to Home Assistant VM"
        else
          echo "ERROR: Failed to restart VM {{.HA_VM_ID}} on $CURRENT_NODE"
          exit 1
        fi

  home-assistant:console:
    desc: Open SSH console to Home Assistant (if SSH add-on installed)
    cmds:
      - |
        echo "Connecting to Home Assistant..."
        echo "Note: Requires SSH add-on to be installed in Home Assistant"
        ssh root@{{.HA_VM_IP}} -p 22222 || echo "SSH connection failed. Is the SSH add-on installed and configured?"

  home-assistant:logs:
    desc: View Home Assistant core logs via API (requires long-lived access token)
    vars:
      TOKEN: '{{.TOKEN | default ""}}'
    cmds:
      - |
        TOKEN="{{.TOKEN}}"
        if [ -z "$TOKEN" ]; then
          echo "Usage: task home-assistant:logs TOKEN=<long-lived-access-token>"
          echo ""
          echo "To get a token:"
          echo "1. Go to https://home.esweiss.com/profile"
          echo "2. Scroll to 'Long-Lived Access Tokens'"
          echo "3. Create a new token"
          exit 1
        fi
        curl -s -H "Authorization: Bearer $TOKEN" \
          https://home.esweiss.com/api/error_log | head -100

  home-assistant:snapshot:
    desc: Create a Proxmox snapshot of the Home Assistant VM
    vars:
      NAME: '{{.NAME | default "manual"}}'
      DESC: '{{.DESC | default "Manual snapshot"}}'
    cmds:
      - |
        NAME="{{.NAME}}"
        DESC="{{.DESC}}"
        CURRENT_NODE=$(scripts/find-pve-host-for-vm.sh {{.HA_VM_ID}} {{.PVE_HOSTS}})
        echo "Creating snapshot '$NAME' of Home Assistant VM on $CURRENT_NODE..."
        ssh "$CURRENT_NODE" "sudo qm snapshot {{.HA_VM_ID}} '${NAME}' --description '${DESC}'"
        echo "Snapshot created successfully"
        echo ""
        echo "To list snapshots: ssh $CURRENT_NODE 'sudo qm listsnapshot {{.HA_VM_ID}}'"
        echo "To rollback: ssh $CURRENT_NODE \"sudo qm rollback {{.HA_VM_ID}} '${NAME}'\""

  home-assistant:deploy-config:
    desc: Deploy Home Assistant configuration via Ansible with 1Password secrets
    dir: "{{.ANSIBLE_DIR}}"
    env:
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      ADMIN_EMAIL: op://Homelab/Email Config/root_alias
      HA_OIDC_CLIENT_ID: op://Homelab/Home Assistant SSO/authentik-client-id
      HA_OIDC_CLIENT_SECRET: op://Homelab/Home Assistant SSO/authentik-client-secret
    cmds:
      - |
        echo "Deploying Home Assistant configuration..."
        echo ""
        op run -- ansible-playbook -i {{.INVENTORY}} -e "ansible_become=false" playbooks/home-assistant.yml
        echo ""
        echo "Configuration deployed successfully!"
        echo ""
        echo "Next steps:"
        echo "  1. Review changes via Home Assistant UI"
        echo "  2. Configuration has been validated automatically"
        echo "  3. Restart Home Assistant: task home-assistant:vm-restart"
        echo ""
        echo "Or restart now with: task home-assistant:restart-after-config"

  home-assistant:restart-after-config:
    desc: Restart Home Assistant after configuration deployment
    cmds:
      - echo "Restarting Home Assistant..."
      - task: home-assistant:vm-restart
      - echo "Waiting for Home Assistant to come back online..."
      - sleep 30
      - echo "Testing connectivity..."
      - task: home-assistant:status

  # =============================================================================
  # GitLab Deployment Tasks
  # =============================================================================

  gitlab:deploy:
    desc: Deploy GitLab (provisions VM and installs GitLab)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      GITLAB_ROOT_PASSWORD: op://Homelab/GitLab/root-password
      GITLAB_SAML_CERT_FINGERPRINT: op://Homelab/GitLab SSO/saml-cert-fingerprint
      GITLAB_API_TOKEN: op://Homelab/GitLab API Token/credential
    preconditions:
      - sh: command -v ansible-playbook
        msg: "ansible-playbook is not installed"
      - sh: op whoami 2>/dev/null
        msg: "1Password CLI not authenticated. Run: eval $(op signin)"
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/gitlab.yml {{.CLI_ARGS}}

  gitlab:deploy-check:
    desc: Check mode - show what GitLab deployment would change
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      GITLAB_ROOT_PASSWORD: op://Homelab/GitLab/root-password
      GITLAB_SAML_CERT_FINGERPRINT: op://Homelab/GitLab SSO/saml-cert-fingerprint
      GITLAB_API_TOKEN: op://Homelab/GitLab API Token/credential
    preconditions:
      - sh: command -v ansible-playbook
        msg: "ansible-playbook is not installed"
      - sh: op whoami 2>/dev/null
        msg: "1Password CLI not authenticated. Run: eval $(op signin)"
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/gitlab.yml --check --diff {{.CLI_ARGS}}

  gitlab:status:
    desc: Show GitLab status
    cmds:
      - echo "=== GitLab VM Status ==="
      - ssh gitlab "sudo gitlab-ctl status" || echo "GitLab VM not reachable or not installed"
      - echo ""
      - echo "=== GitLab IngressRoutes ==="
      - kubectl get ingressroute -n gitlab 2>/dev/null || echo "No IngressRoutes found"
      - echo ""
      - echo "=== GitLab Runner Pods ==="
      - kubectl get pods -n gitlab-runner -o wide 2>/dev/null || echo "No runners found"
      - echo ""
      - echo "=== GitLab Runner HelmReleases (Flux-managed) ==="
      - kubectl get helmrelease -n gitlab-runner 2>/dev/null || echo "No HelmReleases found"
      - echo ""
      - echo "=== GitLab Agent ==="
      - kubectl get pods -n gitlab-agent 2>/dev/null || echo "No agent pods found"
      - kubectl get helmrelease -n gitlab-agent 2>/dev/null || echo "No agent HelmRelease found"

  gitlab:verify:
    desc: Run GitLab smoke tests (web UI, registry, pages, SSH)
    # Requires bash for 'local' keyword in shell functions (dash doesn't support it)
    shell: bash
    vars:
      GITLAB_VM_IP: "192.168.0.153"
    cmds:
      - |
        echo "=== GitLab Smoke Tests ==="
        echo ""
        PASS=0
        FAIL=0

        # Helper function to check HTTP status (2xx or 3xx = success)
        check_http_ok() {
          local url="$1"
          local status
          status=$(curl -sI --max-time 10 "$url" 2>/dev/null | head -1 | grep -oE 'HTTP/[0-9.]+ [0-9]+' | grep -oE '[0-9]+$')
          if [ -n "$status" ] && [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
            return 0
          fi
          return 1
        }

        # Test 1: GitLab Web UI (external)
        echo -n "GitLab Web UI (git.ericsweiss.com)... "
        if check_http_ok "https://git.ericsweiss.com"; then
          echo "PASS"
          PASS=$((PASS + 1))
        else
          echo "FAIL"
          FAIL=$((FAIL + 1))
        fi

        # Test 2: GitLab Web UI (internal)
        echo -n "GitLab Web UI (git.esweiss.com)... "
        if check_http_ok "https://git.esweiss.com"; then
          echo "PASS"
          PASS=$((PASS + 1))
        else
          echo "FAIL"
          FAIL=$((FAIL + 1))
        fi

        # Test 3: Container Registry (401 is expected without auth, proves registry is running)
        echo -n "Container Registry (registry.git.ericsweiss.com)... "
        registry_status=$(curl -sI --max-time 10 "https://registry.git.ericsweiss.com/v2/" 2>/dev/null | head -1 | grep -oE 'HTTP/[0-9.]+ [0-9]+' | grep -oE '[0-9]+$')
        if [ -n "$registry_status" ] && { [ "$registry_status" -eq 401 ] || { [ "$registry_status" -ge 200 ] && [ "$registry_status" -lt 400 ]; }; }; then
          echo "PASS"
          PASS=$((PASS + 1))
        else
          echo "FAIL"
          FAIL=$((FAIL + 1))
        fi

        # Test 4: GitLab Pages (optional - only works if pages are deployed)
        # 404 is acceptable (pages service running but no content), 5xx is failure
        echo -n "GitLab Pages (pages.git.ericsweiss.com)... "
        pages_status=$(curl -sI --max-time 10 "https://pages.git.ericsweiss.com" 2>/dev/null | head -1 | grep -oE 'HTTP/[0-9.]+ [0-9]+' | grep -oE '[0-9]+$')
        if [ -n "$pages_status" ] && [ "$pages_status" -lt 500 ]; then
          echo "PASS"
          PASS=$((PASS + 1))
        else
          echo "SKIP (pages service not responding - may not be configured yet)"
          # Don't increment FAIL - Pages test is optional until content is deployed
        fi

        # Test 5: SSH port 22 (internal, from LAN)
        echo -n "Git SSH port 22 ({{.GITLAB_VM_IP}})... "
        if nc -z -w 5 {{.GITLAB_VM_IP}} 22 2>/dev/null; then
          echo "PASS"
          PASS=$((PASS + 1))
        else
          echo "FAIL"
          FAIL=$((FAIL + 1))
        fi

        # Test 6: SSH port 2222 (external)
        echo -n "Git SSH port 2222 ({{.GITLAB_VM_IP}})... "
        if nc -z -w 5 {{.GITLAB_VM_IP}} 2222 2>/dev/null; then
          echo "PASS"
          PASS=$((PASS + 1))
        else
          echo "FAIL"
          FAIL=$((FAIL + 1))
        fi

        # Test 7: GitLab health check (internal API)
        echo -n "GitLab health check (readiness)... "
        if curl -s --max-time 10 "https://git.esweiss.com/-/readiness" 2>/dev/null | grep -q '"status":"ok"'; then
          echo "PASS"
          PASS=$((PASS + 1))
        else
          echo "FAIL"
          FAIL=$((FAIL + 1))
        fi

        # Test 8: Web IDE extension host route reachable.
        # Uses /-/health (nginx-served, no IP allowlist) instead of /-/readiness because
        # readiness is gated by gitlab_rails['monitoring_whitelist'] = LAN-only, and
        # *.ide.git.ericsweiss.com resolves through Cloudflare → WAN → hairpin NAT, so
        # GitLab may see the public IP and 404 the readiness probe.
        # A green Test 8 proves DNS+Cloudflare+Traefik+IngressRoute+nginx are wired for
        # the new wildcard host. It does NOT validate the application_settings flip.
        # To confirm the CVE-2026-5816 mitigation:
        #   ssh gitlab "sudo gitlab-rails runner 'puts ApplicationSetting.last.vscode_extension_marketplace_single_origin_fallback_enabled'"
        # Expected: false
        echo -n "Web IDE extension host route (probe.ide.git.ericsweiss.com)... "
        if check_http_ok "https://probe.ide.git.ericsweiss.com/-/health"; then
          echo "PASS"
          PASS=$((PASS + 1))
        else
          echo "FAIL"
          FAIL=$((FAIL + 1))
        fi

        echo ""
        echo "=== Results: $PASS passed, $FAIL failed ==="
        if [ $FAIL -gt 0 ]; then
          exit 1
        fi

  gitlab:backup:
    desc: Create GitLab backup
    cmds:
      - echo "Creating GitLab backup..."
      - ssh gitlab "sudo gitlab-backup create"
      - echo ""
      - 'echo "Backup complete. List backups with:"'
      - echo "  ssh gitlab 'sudo ls -la /var/opt/gitlab/backups/'"

  gitlab:console:
    desc: SSH to GitLab VM
    cmds:
      - ssh gitlab

  gitlab:logs:
    desc: View GitLab logs
    cmds:
      - ssh gitlab "sudo gitlab-ctl tail"

  gitlab:reconfigure:
    desc: Reconfigure GitLab after changes
    cmds:
      - ssh gitlab "sudo gitlab-ctl reconfigure"

