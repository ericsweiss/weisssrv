# https://taskfile.dev
version: '3'

vars:
  ANSIBLE_DIR: ./ansible
  TERRAFORM_DIR: ./terraform
  INVENTORY: ./inventories/prod
  # Home Assistant VM configuration
  HA_VM_ID: "154"
  HA_VM_IP: "192.168.0.154"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # === Ansible Tasks ===
  ansible:install-collections:
    desc: Install Ansible Galaxy collections
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-galaxy collection install -r requirements.yml

  ansible:ping:
    desc: Ping all managed hosts
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible -i {{.INVENTORY}} all -m ping -e "ansible_become=false"

  ansible:lint:
    desc: Lint Ansible playbooks and roles
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-lint playbooks/ roles/

  ansible:test:
    desc: Run Molecule tests for Ansible roles (all or specific)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
    preconditions:
      # Check for molecule in pyenv (preferred) or system python
      # Matches the logic in test-all-roles.sh
      - sh: ~/.pyenv/versions/3.13.5/bin/molecule --version 2>/dev/null || python3 -m molecule --version 2>/dev/null
        msg: "molecule not installed. Run: pip install molecule molecule-docker (or install via pyenv)"
      - sh: docker info 2>/dev/null
        msg: "Docker is not running. Start Docker Desktop first."
    cmds:
      - ./test-all-roles.sh {{.CLI_ARGS}}

  # === Integration Tests ===
  ansible:test-integration:
    desc: Run all integration tests (multi-role scenarios)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
    preconditions:
      - sh: ~/.pyenv/versions/3.13.5/bin/molecule --version 2>/dev/null || python3 -m molecule --version 2>/dev/null
        msg: "molecule not installed. Run: pip install molecule molecule-docker (or install via pyenv)"
      - sh: docker info 2>/dev/null
        msg: "Docker is not running. Start Docker Desktop first."
    cmds:
      - task: ansible:test-integration-dns
      - task: ansible:test-integration-mail
      - task: ansible:test-integration-base
      - task: ansible:test-integration-storage
      - task: ansible:test-integration-certs

  ansible:test-integration-dns:
    desc: Run DNS stack integration test (unbound + adguard_home + adguard_sync)
    dir: "{{.ANSIBLE_DIR}}/integration-tests/dns-stack"
    env:
      ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
    preconditions:
      - sh: ~/.pyenv/versions/3.13.5/bin/molecule --version 2>/dev/null || python3 -m molecule --version 2>/dev/null
        msg: "molecule not installed"
      - sh: docker info 2>/dev/null
        msg: "Docker is not running"
    cmds:
      - if [ -x ~/.pyenv/versions/3.13.5/bin/molecule ]; then ~/.pyenv/versions/3.13.5/bin/molecule test; else python3 -m molecule test; fi

  ansible:test-integration-mail:
    desc: Run mail stack integration test (smtp_relay + postfix_null_client)
    dir: "{{.ANSIBLE_DIR}}/integration-tests/mail-stack"
    env:
      ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
    preconditions:
      - sh: ~/.pyenv/versions/3.13.5/bin/molecule --version 2>/dev/null || python3 -m molecule --version 2>/dev/null
        msg: "molecule not installed"
      - sh: docker info 2>/dev/null
        msg: "Docker is not running"
    cmds:
      - if [ -x ~/.pyenv/versions/3.13.5/bin/molecule ]; then ~/.pyenv/versions/3.13.5/bin/molecule test; else python3 -m molecule test; fi

  ansible:test-integration-base:
    desc: Run base infrastructure integration test (base + qol + tailscale)
    dir: "{{.ANSIBLE_DIR}}/integration-tests/base-infrastructure"
    env:
      ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
    preconditions:
      - sh: ~/.pyenv/versions/3.13.5/bin/molecule --version 2>/dev/null || python3 -m molecule --version 2>/dev/null
        msg: "molecule not installed"
      - sh: docker info 2>/dev/null
        msg: "Docker is not running"
    cmds:
      - if [ -x ~/.pyenv/versions/3.13.5/bin/molecule ]; then ~/.pyenv/versions/3.13.5/bin/molecule test; else python3 -m molecule test; fi

  ansible:test-integration-storage:
    desc: Run storage stack integration test (nas_storage + Samba client, NFS server-side only)
    dir: "{{.ANSIBLE_DIR}}/integration-tests/storage-stack"
    env:
      ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
    preconditions:
      - sh: ~/.pyenv/versions/3.13.5/bin/molecule --version 2>/dev/null || python3 -m molecule --version 2>/dev/null
        msg: "molecule not installed"
      - sh: docker info 2>/dev/null
        msg: "Docker is not running"
    cmds:
      - ~/.pyenv/versions/3.13.5/bin/molecule test || python3 -m molecule test

  ansible:test-integration-certs:
    desc: Run certificate distribution integration test (acme_certs multi-host)
    dir: "{{.ANSIBLE_DIR}}/integration-tests/cert-distribution"
    env:
      ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
    preconditions:
      - sh: ~/.pyenv/versions/3.13.5/bin/molecule --version 2>/dev/null || python3 -m molecule --version 2>/dev/null
        msg: "molecule not installed"
      - sh: docker info 2>/dev/null
        msg: "Docker is not running"
    cmds:
      - if [ -x ~/.pyenv/versions/3.13.5/bin/molecule ]; then ~/.pyenv/versions/3.13.5/bin/molecule test; else python3 -m molecule test; fi

  # === Kubernetes Validation Tasks ===
  kubernetes:lint:
    desc: Validate Kubernetes manifests with kubeconform
    preconditions:
      - sh: command -v kubeconform
        msg: "kubeconform not installed. Run: brew install kubeconform (or download from GitHub)"
    cmds:
      - |
        find kubernetes/apps kubernetes/bootstrap -name "*.yaml" \
          ! -name "values.yaml" \
          ! -name "kustomization.yaml" \
          -exec kubeconform -summary -strict \
            -ignore-missing-schemas \
            -kubernetes-version 1.35.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{ "{{.Group}}" }}/{{ "{{.ResourceKind}}" }}_{{ "{{.ResourceAPIVersion}}" }}.json' \
            {} +

  kubernetes:validate-helm:
    desc: Validate Helm values by templating charts
    preconditions:
      - sh: command -v helm
        msg: "helm not installed. Run: brew install helm"
    cmds:
      - helm repo add traefik https://traefik.github.io/charts 2>/dev/null || true
      - helm repo add metallb https://metallb.github.io/metallb 2>/dev/null || true
      - helm repo add jetstack https://charts.jetstack.io 2>/dev/null || true
      - helm repo add authentik https://charts.goauthentik.io 2>/dev/null || true
      - helm repo update
      - echo "Validating Traefik values..."
      - helm template traefik traefik/traefik -f kubernetes/apps/traefik/values.yaml --namespace traefik > /dev/null && echo "  OK"
      - echo "Validating MetalLB values..."
      - helm template metallb metallb/metallb -f kubernetes/bootstrap/metallb/values.yaml --namespace metallb-system > /dev/null && echo "  OK"
      - echo "Validating cert-manager values..."
      - helm template cert-manager jetstack/cert-manager -f kubernetes/apps/cert-manager/values.yaml --namespace cert-manager > /dev/null && echo "  OK"
      - echo "Validating Authentik values..."
      - helm template authentik authentik/authentik -f kubernetes/apps/authentik/values.yaml --namespace authentik --set authentik.secret_key=dummy --set authentik.postgresql.password=dummy > /dev/null && echo "  OK"
      - echo "All Helm values validated successfully"

  # === Deployment Tasks ===
  deploy:all:
    desc: Deploy base infrastructure (Proxmox, DNS, NAS, mail - excludes k3s)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SMTP_GMAIL_USER: op://Homelab/SMTP Relay Gmail/username
      SMTP_GMAIL_PASSWORD: op://Homelab/SMTP Relay Gmail/password
      ADGUARD_ADMIN_PASSWORD: op://Homelab/AdGuard Home/password
      ADGUARD_ADMIN_PASSWORD_HASH: op://Homelab/AdGuard Home/password_hash
      TAILSCALE_AUTH_KEY: op://Homelab/Tailscale Auth Key/credential
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      SAMBA_NAS_PASSWORD: op://Homelab/Samba NAS User/password
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
    preconditions:
      - sh: command -v ansible-playbook
        msg: "ansible-playbook is not installed. Install Ansible first (pip install ansible or brew install ansible), then run: task ansible:install-collections"
      - sh: command -v op
        msg: "1Password CLI is not installed. Install via: https://developer.1password.com/docs/cli/get-started/"
      - sh: op whoami 2>/dev/null
        msg: "1Password CLI not authenticated. Run: eval $(op signin)"
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/site.yml {{.CLI_ARGS}}

  deploy:base:
    desc: Deploy base configuration only
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/base.yml {{.CLI_ARGS}}

  deploy:base-first-run:
    desc: First-time base deployment (prompts for sudo password)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/base.yml -K {{.CLI_ARGS}}

  deploy:dns:
    desc: Deploy DNS stack (Unbound + AdGuard Home)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      ADGUARD_ADMIN_PASSWORD: op://Homelab/AdGuard Home/password
      ADGUARD_ADMIN_PASSWORD_HASH: op://Homelab/AdGuard Home/password_hash
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/dns.yml {{.CLI_ARGS}}

  deploy:storage:
    desc: Deploy NAS storage configuration
    dir: "{{.ANSIBLE_DIR}}"
    env:
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      SAMBA_NAS_PASSWORD: op://Homelab/Samba NAS User/password
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/storage.yml {{.CLI_ARGS}}

  deploy:check:
    desc: Check mode - show what would change
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SMTP_GMAIL_USER: op://Homelab/SMTP Relay Gmail/username
      SMTP_GMAIL_PASSWORD: op://Homelab/SMTP Relay Gmail/password
      ADGUARD_ADMIN_PASSWORD: op://Homelab/AdGuard Home/password
      ADGUARD_ADMIN_PASSWORD_HASH: op://Homelab/AdGuard Home/password_hash
      TAILSCALE_AUTH_KEY: op://Homelab/Tailscale Auth Key/credential
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      SAMBA_NAS_PASSWORD: op://Homelab/Samba NAS User/password
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/site.yml --check --diff {{.CLI_ARGS}}

  deploy:verify:
    desc: Run post-deployment verification
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i {{.INVENTORY}} playbooks/postflight.yml {{.CLI_ARGS}}

  # === Plex Deployment Tasks ===
  deploy:plex:
    desc: Deploy Plex Media Server (provisions LXC container and installs Plex)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/plex.yml {{.CLI_ARGS}}

  deploy:plex-check:
    desc: Check mode - show what Plex deployment would change
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/plex.yml --check --diff {{.CLI_ARGS}}

  # === K3s Deployment Tasks ===
  k3s:provision-vms:
    desc: Provision k3s VMs on Proxmox (creates VMs only)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/k3s-provision-vms.yml {{.CLI_ARGS}}

  k3s:deploy:
    desc: Deploy k3s cluster (full deployment)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      K3S_TOKEN: op://Homelab/K3s Cluster Token/credential
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/k3s.yml {{.CLI_ARGS}}

  k3s:kubeconfig:
    desc: Fetch kubeconfig from k3s cluster
    cmds:
      - |
        echo "Fetching kubeconfig from k3s server..."
        SSH_STDERR=$(mktemp)
        KUBECONFIG_DATA=$(ssh eric@192.168.0.222 "sudo cat /etc/rancher/k3s/k3s.yaml" 2>"$SSH_STDERR")
        SSH_RC=$?
        if [ $SSH_RC -ne 0 ]; then
          echo "ERROR: Failed to fetch kubeconfig from k3s server (exit code: $SSH_RC)"
          cat "$SSH_STDERR"
          rm -f "$SSH_STDERR"
          exit 1
        fi
        rm -f "$SSH_STDERR"
        if [ -z "$KUBECONFIG_DATA" ]; then
          echo "ERROR: Kubeconfig data is empty"
          exit 1
        fi
        echo "$KUBECONFIG_DATA" | \
          sed 's/127.0.0.1/192.168.0.161/g; s/0.0.0.0/192.168.0.161/g' > ~/.kube/config-k3s
        chmod 600 ~/.kube/config-k3s
        echo "Kubeconfig saved to ~/.kube/config-k3s (permissions: 600)"
        echo "Run: export KUBECONFIG=~/.kube/config-k3s"

  # === K3s Workload Deployment Tasks ===
  k3s:deploy-metallb:
    desc: Deploy MetalLB load balancer with IP pools
    dir: ./kubernetes
    vars:
      METALLB_VERSION:
        sh: grep 'metallb:' ../ansible/inventories/prod/group_vars/all.yml | awk '{print $2}' | tr -d '"'
    preconditions:
      - sh: command -v kubectl
        msg: "kubectl is not installed"
      - sh: command -v helm
        msg: "helm is not installed. Install via: https://helm.sh/docs/intro/install/"
      - sh: kubectl cluster-info 2>/dev/null
        msg: "Cannot connect to k3s cluster. Run: export KUBECONFIG=~/.kube/config-k3s"
    cmds:
      - echo "Deploying MetalLB version {{.METALLB_VERSION}}"
      - helm repo add metallb https://metallb.github.io/metallb --force-update
      - helm repo update metallb
      - helm upgrade --install metallb metallb/metallb -n metallb-system --create-namespace -f bootstrap/metallb/values.yaml --version "{{.METALLB_VERSION}}" --wait
      - |
        echo "Waiting for MetalLB webhook to be ready..."
        kubectl wait --namespace metallb-system \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=120s
      - kubectl apply -f bootstrap/metallb/ip-pool.yaml
      - echo "MetalLB deployed successfully"

  k3s:deploy-traefik:
    desc: Deploy Traefik ingress controller
    dir: ./kubernetes/apps/traefik
    vars:
      TRAEFIK_VERSION:
        sh: grep 'traefik:' ../../../ansible/inventories/prod/group_vars/all.yml | awk '{print $2}' | tr -d '"'
    cmds:
      - echo "Deploying Traefik chart version {{.TRAEFIK_VERSION}}"
      - helm repo add traefik https://traefik.github.io/charts --force-update
      - helm repo update traefik
      - kubectl apply -f namespace.yaml
      - helm upgrade --install traefik traefik/traefik -n traefik -f values.yaml --version "{{.TRAEFIK_VERSION}}" --wait
      - kubectl apply -f traefik-internal-service.yaml
      - echo "Traefik deployed successfully"

  k3s:deploy-cert-manager:
    desc: Deploy cert-manager with Let's Encrypt ClusterIssuer
    dir: ./kubernetes/apps/cert-manager
    vars:
      CERT_MANAGER_VERSION:
        sh: grep 'cert_manager:' ../../../ansible/inventories/prod/group_vars/all.yml | awk '{print $2}' | tr -d '"'
    env:
      CLOUDFLARE_API_TOKEN: op://Homelab/Cloudflare DNS Token/credential
    cmds:
      - echo "Deploying cert-manager version {{.CERT_MANAGER_VERSION}}"
      - helm repo add jetstack https://charts.jetstack.io --force-update
      - helm repo update jetstack
      - kubectl apply -f namespace.yaml
      - helm upgrade --install cert-manager jetstack/cert-manager -n cert-manager -f values.yaml --version "{{.CERT_MANAGER_VERSION}}" --wait
      - |
        echo "Creating Cloudflare API token secret..."
        op run -- sh -c 'kubectl create secret generic cloudflare-api-token \
          --namespace=cert-manager \
          --from-literal=api-token="$CLOUDFLARE_API_TOKEN" \
          --dry-run=client -o yaml | kubectl apply -f -'
      - kubectl apply -k .
      - echo "cert-manager deployed successfully"

  k3s:deploy-external-dns:
    desc: Deploy external-dns for automatic Cloudflare DNS management
    dir: ./kubernetes/apps/external-dns
    vars:
      EXTERNAL_DNS_VERSION:
        sh: grep 'external_dns:' ../../../ansible/inventories/prod/group_vars/all.yml | awk '{print $2}' | tr -d '"'
    env:
      CLOUDFLARE_API_TOKEN: op://Homelab/Cloudflare DNS Token/credential
    cmds:
      - echo "Deploying external-dns chart version {{.EXTERNAL_DNS_VERSION}}"
      - helm repo add external-dns https://kubernetes-sigs.github.io/external-dns --force-update
      - helm repo update external-dns
      - kubectl apply -f namespace.yaml
      - |
        echo "Creating Cloudflare API token secret..."
        op run -- sh -c 'kubectl create secret generic cloudflare-api-token \
          --namespace=external-dns \
          --from-literal=api-token="$CLOUDFLARE_API_TOKEN" \
          --dry-run=client -o yaml | kubectl apply -f -'
      - helm upgrade --install external-dns external-dns/external-dns -n external-dns -f values.yaml --version "{{.EXTERNAL_DNS_VERSION}}" --wait
      - echo "external-dns deployed successfully"

  k3s:deploy-ddns:
    desc: Deploy Cloudflare DDNS CronJob for public IP updates
    dir: ./kubernetes/apps/cloudflare-ddns
    env:
      CLOUDFLARE_API_TOKEN: op://Homelab/Cloudflare DNS Token/credential
    cmds:
      - |
        echo "Creating Cloudflare API token secret in default namespace..."
        op run -- sh -c 'kubectl create secret generic cloudflare-api-token \
          --namespace=default \
          --from-literal=api-token="$CLOUDFLARE_API_TOKEN" \
          --dry-run=client -o yaml | kubectl apply -f -'
      - kubectl apply -f cronjob.yaml
      - echo "DDNS CronJob deployed successfully"

  k3s:deploy-ingress-routes:
    desc: Deploy Traefik IngressRoutes for all services
    dir: ./kubernetes/apps/ingress-routes
    cmds:
      - kubectl apply -k .
      - echo "IngressRoutes deployed successfully"

  k3s:deploy-authentik:
    desc: Deploy Authentik SSO identity provider
    dir: ./kubernetes/apps/authentik
    vars:
      AUTHENTIK_VERSION:
        sh: grep '^authentik_version:' ../../../ansible/inventories/prod/group_vars/all.yml | awk '{print $2}' | tr -d '"'
      POSTGRESQL_VERSION:
        sh: grep '^postgresql_version:' ../../../ansible/inventories/prod/group_vars/all.yml | awk '{print $2}' | tr -d '"'
    env:
      AUTHENTIK_SECRET_KEY: op://Homelab/Authentik Secrets/secret-key
      AUTHENTIK_POSTGRESQL_PASSWORD: op://Homelab/Authentik Secrets/postgresql-password
      AUTHENTIK_POSTGRESQL_ADMIN_PASSWORD: op://Homelab/Authentik Secrets/postgresql-admin-password
      # SMTP credentials for email notifications (uses same creds as other services)
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
    cmds:
      - echo "Deploying Authentik version {{.AUTHENTIK_VERSION}}"
      - helm repo add authentik https://charts.goauthentik.io --force-update
      - helm repo update authentik
      - kubectl apply -f namespace.yaml
      - kubectl apply -f storage.yaml
      - |
        echo "Creating Authentik secrets from 1Password..."
        op run -- sh -c 'kubectl create secret generic authentik-secrets \
          --namespace=authentik \
          --from-literal=secret-key="$AUTHENTIK_SECRET_KEY" \
          --from-literal=postgresql-password="$AUTHENTIK_POSTGRESQL_PASSWORD" \
          --from-literal=postgresql-admin-password="$AUTHENTIK_POSTGRESQL_ADMIN_PASSWORD" \
          --from-literal=smtp-username="$SMTP_RELAY_USER" \
          --from-literal=smtp-password="$SMTP_RELAY_PASSWORD" \
          --dry-run=client -o yaml | kubectl apply -f -'
      - |
        echo "Installing Authentik via Helm..."
        op run -- sh -c 'helm upgrade --install authentik authentik/authentik \
          -n authentik \
          -f values.yaml \
          --version "{{.AUTHENTIK_VERSION}}" \
          --set authentik.secret_key="$AUTHENTIK_SECRET_KEY" \
          --set server.image.tag="{{.AUTHENTIK_VERSION}}" \
          --set worker.image.tag="{{.AUTHENTIK_VERSION}}" \
          --set postgresql.image.tag="{{.POSTGRESQL_VERSION}}" \
          --wait --timeout 10m'
      - |
        echo "Waiting for Authentik server to be ready..."
        kubectl rollout status deployment/authentik-server -n authentik --timeout=300s
      - kubectl apply -k .
      - echo "Authentik deployed successfully"

  authentik:status:
    desc: Show Authentik SSO status
    cmds:
      - echo "=== Authentik Namespace ==="
      - kubectl get pods -n authentik -o wide
      - echo ""
      - echo "=== Services ==="
      - kubectl get svc -n authentik
      - echo ""
      - echo "=== PVCs ==="
      - kubectl get pvc -n authentik
      - echo ""
      - echo "=== IngressRoutes ==="
      - kubectl get ingressroute -n authentik

  authentik:logs:
    desc: "View Authentik logs (task authentik:logs [COMPONENT=server])"
    vars:
      COMPONENT: '{{.COMPONENT | default "server"}}'
    cmds:
      - |
        COMPONENT="{{.COMPONENT}}"
        echo "=== Authentik $COMPONENT logs ==="
        kubectl logs -n authentik -l app.kubernetes.io/name=authentik,app.kubernetes.io/component=$COMPONENT -f

  authentik:restart:
    desc: Restart Authentik server and worker
    cmds:
      - echo "Restarting Authentik..."
      - kubectl rollout restart deployment -n authentik -l app.kubernetes.io/name=authentik
      - kubectl rollout restart statefulset -n authentik -l app.kubernetes.io/name=authentik
      - echo "Waiting for rollout to complete..."
      - kubectl rollout status deployment/authentik-server -n authentik --timeout=300s
      - kubectl rollout status deployment/authentik-worker -n authentik --timeout=300s
      - kubectl rollout status statefulset/authentik-postgresql -n authentik --timeout=300s

  k3s:deploy-workloads:
    desc: Deploy ALL k3s platform workloads in correct order
    cmds:
      - task: k3s:deploy-metallb
      - task: k3s:deploy-traefik
      - task: k3s:deploy-cert-manager
      - task: k3s:deploy-external-dns
      - task: k3s:deploy-ddns
      - task: k3s:deploy-ingress-routes
      - task: k3s:deploy-authentik
      - echo "K3s platform workloads deployed successfully"

  k3s:backup:
    desc: Create etcd snapshot on k3s server
    cmds:
      - |
        SNAPSHOT_NAME="manual-$(date +%Y%m%d-%H%M%S)"
        echo "Creating etcd snapshot: $SNAPSHOT_NAME"
        ssh eric@192.168.0.222 "sudo k3s etcd-snapshot save --name $SNAPSHOT_NAME"
        echo "Snapshot created successfully"
        echo ""
        echo "To list snapshots:"
        echo "  ssh eric@192.168.0.222 'sudo k3s etcd-snapshot ls'"
        echo ""
        echo "Snapshots are stored in: /var/lib/rancher/k3s/server/db/snapshots/"

  k3s:status:
    desc: Show k3s cluster and workload status
    preconditions:
      - sh: command -v kubectl
        msg: "kubectl is not installed. Install via: https://kubernetes.io/docs/tasks/tools/"
      - sh: kubectl cluster-info 2>/dev/null
        msg: "Cannot connect to k3s cluster. Run: export KUBECONFIG=~/.kube/config-k3s"
    cmds:
      - echo "=== K3s Cluster Status ==="
      - kubectl get nodes -o wide
      - echo ""
      - echo "=== Platform Services ==="
      - echo "MetalLB -"
      - kubectl get pods -n metallb-system 2>/dev/null || echo "  Not installed"
      - kubectl get ipaddresspool -n metallb-system 2>/dev/null || true
      - echo ""
      - echo "Traefik -"
      - kubectl get pods -n traefik 2>/dev/null || echo "  Not installed"
      - kubectl get svc -n traefik 2>/dev/null || true
      - echo ""
      - echo "cert-manager -"
      - kubectl get pods -n cert-manager 2>/dev/null || echo "  Not installed"
      - kubectl get certificate -A 2>/dev/null || true
      - echo ""
      - echo "external-dns -"
      - kubectl get pods -n external-dns 2>/dev/null || echo "  Not installed"
      - echo ""
      - echo "DDNS CronJob -"
      - kubectl get cronjob cloudflare-ddns -n default 2>/dev/null || echo "  Not installed"
      - echo ""
      - echo "Authentik SSO -"
      - kubectl get pods -n authentik 2>/dev/null || echo "  Not installed"
      - kubectl get svc -n authentik 2>/dev/null || true
      - echo ""
      - echo "IngressRoutes -"
      - kubectl get ingressroute -A 2>/dev/null || echo "  None configured"

