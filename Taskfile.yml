# https://taskfile.dev
version: '3'

# Host/IP roster (PVE_HOSTS hostnames, K3S_SERVERS IPs, etc.) is generated from
# ansible/inventories/prod/hosts.yml into scripts/hosts.env and loaded here as
# both env vars and template vars ({{.PVE_HOSTS}} / {{.K3S_SERVERS}}). Single
# source of truth — run `task hosts:sync` after editing hosts.yml.
dotenv: ['scripts/hosts.env']

vars:
  ANSIBLE_DIR: ./ansible
  TERRAFORM_DIR: ./terraform
  INVENTORY: ./inventories/prod
  # GitLab project ID for Terraform state backend
  # Find at: git.ericsweiss.com/eric/weisssrv (shown on project overview page)
  GITLAB_PROJECT_ID: "1"
  # VM/LXC IPs come from scripts/hosts.env (dotenv) as {{.GITLAB_IP}},
  # {{.NEXTCLOUD_IP}}, {{.HOME_ASSISTANT_IP}}, {{.IMMICH_IP}}, {{.IMMICH_ML_IP}}
  # and {{.WINDOWS_IP}} — single source of truth (hosts.yml, guarded by the
  # hosts-env sync check in the repo-sync-checks CI job). Only the Proxmox VM IDs, which hosts.env does not
  # carry, are kept here.
  HA_VM_ID: "154"
  WINDOWS_VM_ID: "155"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # === Ansible Tasks ===
  ansible:install-collections:
    desc: Install Ansible Galaxy collections
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-galaxy collection install -r requirements.yml

  ansible:ping:
    desc: Ping all managed hosts
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible -i {{.INVENTORY}} all -m ping -e "ansible_become=false"

  ansible:lint:
    desc: Lint ansible/ (roles are linted in weisssrv-lib) — mirrors the CI ansible-lint job
    cmds:
      - |
        set -e
        # Same shape as the CI ansible-lint job: cwd = repo root, target
        # `ansible/`, config discovered at ./.ansible-lint, and the collection
        # installed under .ansible-home/collections (which .ansible-lint
        # excludes, so the library's own files are not reported here).
        #
        # Resolve ansible-lint via the shared helper (PATH, then validated
        # pyenv glob; no `python3 -m` step — its module is `ansiblelint`).
        LINT=$({{.ROOT_DIR}}/scripts/resolve-tool.sh ansible-lint) \
          || { echo "ERROR: ansible-lint not found (pip install ansible-lint)"; exit 1; }
        DEP_PATH="{{.ROOT_DIR}}/.ansible-home/collections"
        # Singular ONLY — ansible-compat hard-errors on the legacy plural.
        unset ANSIBLE_COLLECTIONS_PATHS
        # Exported BEFORE the install so galaxy's already-installed check reads
        # this path — otherwise a copy elsewhere on the machine satisfies (and
        # silently skips) a dependency that lint then fails to resolve.
        export ANSIBLE_COLLECTIONS_PATH="{{.ROOT_DIR}}:$DEP_PATH"
        if [ -n "${WEISSSRV_COLLECTION_PATH:-}" ]; then
          # Coordinated weisssrv-lib bump: lint against a LOCAL library checkout
          # instead of the tag in ansible/requirements.yml, e.g.
          #   WEISSSRV_COLLECTION_PATH=../weisssrv-lib task ansible:lint
          # Point it at the repo root (the directory holding
          # ansible_collections/). It is installed rather than resolved in place
          # so the copy sits inside the excluded path.
          echo "ansible:lint: using local collection from $WEISSSRV_COLLECTION_PATH"
          # The galaxy deps still come from the pin file, minus the git entry —
          # during a coordinated bump requirements.yml already names a tag that
          # has not been cut, so installing it would fail.
          REQ=$(mktemp)
          python3 -c "import sys, yaml; d = yaml.safe_load(open('ansible/requirements.yml')); \
            d['collections'] = [c for c in d['collections'] if not str(c.get('name', '')).startswith('git+')]; \
            yaml.safe_dump(d, open(sys.argv[1], 'w'))" "$REQ"
          ansible-galaxy collection install -r "$REQ" -p "$DEP_PATH"
          rm -f "$REQ"
          ansible-galaxy collection install --force \
            "$WEISSSRV_COLLECTION_PATH/ansible_collections/weisssrv/infra" -p "$DEP_PATH"
          # Invalidate the pin stamp: the tree now holds a local checkout, not
          # the pinned tag, so the next plain `task ansible:lint` must reinstall
          # rather than read a matching stamp and lint the checkout by accident.
          rm -f "$DEP_PATH/.requirements-sha256"
        else
          # Install cache keyed on the CONTENT of requirements.yml, not on the
          # directory existing, so a bumped pin reinstalls. `task
          # ansible:install-collections` does not refresh it (it installs to the
          # user-global path); editing requirements.yml or deleting
          # .ansible-home/ does.
          STAMP="$DEP_PATH/.requirements-sha256"
          WANT=$(shasum -a 256 ansible/requirements.yml 2>/dev/null \
                 || sha256sum ansible/requirements.yml)
          WANT=${WANT%% *}
          HAVE=$(cat "$STAMP" 2>/dev/null || true)
          if [ ! -d "$DEP_PATH/ansible_collections/weisssrv/infra" ] || [ "$WANT" != "$HAVE" ]; then
            if [ -n "$HAVE" ] && [ "$WANT" != "$HAVE" ]; then
              echo "ansible:lint: ansible/requirements.yml changed — reinstalling the collection"
            fi
            # --force: a same-version reinstall over an existing tree is a
            # no-op to galaxy otherwise, which is the very case a moved branch
            # ref produces.
            if ! ansible-galaxy collection install --force \
                 -r ansible/requirements.yml -p "$DEP_PATH"; then
              echo "ERROR: could not install the collection pinned in ansible/requirements.yml." >&2
              echo "       During a coordinated weisssrv-lib bump that tag does not exist yet —" >&2
              echo "       lint against the library checkout instead:" >&2
              echo "         WEISSSRV_COLLECTION_PATH=../weisssrv-lib task ansible:lint" >&2
              exit 1
            fi
            # Stamped only after a SUCCESSFUL install, so a failed one retries.
            printf '%s\n' "$WANT" > "$STAMP"
          fi
        fi
        # Unquoted: $LINT may be a bare command or a pyenv path (single word here).
        $LINT ansible/

  # === Integration Tests ===
  # Per-ROLE molecule scenarios live in weisssrv-lib with the roles; what runs
  # here is the multi-role stacks this cluster composes from them.
  ansible:test:
    desc: Alias for ansible:test-integration (per-role scenarios run in weisssrv-lib)
    cmds:
      - task: ansible:test-integration

  ansible:test-integration:
    desc: Run every integration test (multi-role stacks)
    dir: "{{.ANSIBLE_DIR}}"
    preconditions:
      - sh: "{{.ROOT_DIR}}/scripts/resolve-tool.sh molecule molecule >/dev/null"
        msg: "molecule not installed. Run: pip install molecule molecule-docker (or install via pyenv)"
      - sh: docker info 2>/dev/null
        msg: "Docker is not running. Start Docker Desktop first."
    cmds:
      - task: ansible:test-integration-dns
      - task: ansible:test-integration-mail
      - task: ansible:test-integration-base
      - task: ansible:test-integration-storage
      - task: ansible:test-integration-certs

  # Internal helper: runs `molecule test` from {{.MOLECULE_DIR}}.
  # Resolves molecule via PATH, then python3 -m molecule, then pyenv.
  _molecule-run:
    internal: true
    dir: "{{.MOLECULE_DIR}}"
    preconditions:
      - sh: "{{.ROOT_DIR}}/scripts/resolve-tool.sh molecule molecule >/dev/null"
        msg: "molecule not installed"
      - sh: docker info 2>/dev/null
        msg: "Docker is not running"
    cmds:
      - |
        # Shared resolver (PATH -> python3 -m molecule -> validated pyenv glob).
        MOL=$({{.ROOT_DIR}}/scripts/resolve-tool.sh molecule molecule) \
          || { echo "ERROR: molecule not found"; exit 1; }
        # Unquoted: $MOL may be "python3 -m molecule", which must word-split.
        $MOL test

  ansible:test-integration-dns:
    desc: Run DNS stack integration test (unbound + adguard_home + adguard_sync)
    cmds:
      - task: _molecule-run
        vars: {MOLECULE_DIR: "{{.ANSIBLE_DIR}}/integration-tests/dns-stack"}

  ansible:test-integration-mail:
    desc: Run mail stack integration test (smtp_relay + postfix_null_client)
    cmds:
      - task: _molecule-run
        vars: {MOLECULE_DIR: "{{.ANSIBLE_DIR}}/integration-tests/mail-stack"}

  ansible:test-integration-base:
    desc: Run base infrastructure integration test (base + qol + tailscale)
    cmds:
      - task: _molecule-run
        vars: {MOLECULE_DIR: "{{.ANSIBLE_DIR}}/integration-tests/base-infrastructure"}

  ansible:test-integration-storage:
    desc: Run storage stack integration test (nas_storage + Samba client, NFS server-side only)
    cmds:
      - task: _molecule-run
        vars: {MOLECULE_DIR: "{{.ANSIBLE_DIR}}/integration-tests/storage-stack"}

  ansible:test-integration-certs:
    desc: Run certificate distribution integration test (acme_certs multi-host)
    cmds:
      - task: _molecule-run
        vars: {MOLECULE_DIR: "{{.ANSIBLE_DIR}}/integration-tests/cert-distribution"}

  # === Kubernetes Validation Tasks ===
  # flux:lint builds every Flux Kustomization and runs kubeconform on the
  # output; HelmReleases are validated as Flux CRDs (chart templates render
  # server-side in helm-controller, not during local lint).
  kubernetes:lint:
    desc: "Validate all Flux-managed Kubernetes manifests (alias for flux:lint)"
    cmds:
      - task: flux:lint

  # === Infrastructure Deployment Tasks ===
  infra:deploy:
    desc: Deploy base infrastructure (Proxmox, DNS, NAS, mail - excludes k3s)
    dir: "{{.ANSIBLE_DIR}}"
    # Anchor shared with infra:check so dry-run and deploy can never
    # diverge on which secrets are injected.
    env: &infra_env
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SMTP_GMAIL_USER: op://Homelab/SMTP Relay Gmail/username
      SMTP_GMAIL_PASSWORD: op://Homelab/SMTP Relay Gmail/password
      ADGUARD_ADMIN_PASSWORD: op://Homelab/AdGuard Home/password
      TAILSCALE_AUTH_KEY: op://Homelab/Tailscale Auth Key/credential
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      SAMBA_NAS_PASSWORD: op://Homelab/Samba NAS User/password
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
      LOKI_PUSH_USER: op://Homelab/Loki Push Auth/username
      LOKI_PUSH_PASSWORD: op://Homelab/Loki Push Auth/password
      # site.yml runs restic_offsite on pve-nas-01, whose secret-shape assert
      # dereferences all three. Without them the whole-estate converge aborts
      # the NAS play before proxmox_backup/zfs_exporter. Same restricted
      # hide-only key fields storage:deploy uses (docs/42).
      B2_KEY_ID: op://Homelab/B2 Archive Backup/restic_key_id
      B2_APPLICATION_KEY: op://Homelab/B2 Archive Backup/restic_application_key
      RESTIC_REPO_PASSWORD: op://Homelab/B2 Archive Backup/restic_repo_password
    preconditions:
      - sh: command -v ansible-playbook
        msg: "ansible-playbook is not installed. Install Ansible first (pip install ansible or brew install ansible), then run: task ansible:install-collections"
      - sh: command -v op
        msg: "1Password CLI is not installed. Install via: https://developer.1password.com/docs/cli/get-started/"
      # `op account list`, not `op whoami`: with the desktop-app integration
      # (no OP_SESSION_* set) whoami reports "not signed in" in the
      # non-interactive shell Task uses for preconditions, while `op run` in
      # that same shell works.
      - sh: op account list 2>/dev/null
        msg: "1Password CLI not authenticated. Run: eval $(op signin)"
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/site.yml {{.CLI_ARGS}}

  infra:base:
    desc: Deploy base configuration only
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/base.yml {{.CLI_ARGS}}

  infra:base-first-run:
    desc: First-time base deployment (prompts for sudo password)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/base.yml -K {{.CLI_ARGS}}

  dns:deploy:
    desc: Deploy DNS stack (Unbound + AdGuard Home)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      ADGUARD_ADMIN_PASSWORD: op://Homelab/AdGuard Home/password
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
      # dns.yml now runs alloy_host, which asserts the Loki push creds.
      LOKI_PUSH_USER: op://Homelab/Loki Push Auth/username
      LOKI_PUSH_PASSWORD: op://Homelab/Loki Push Auth/password
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/dns.yml {{.CLI_ARGS}}

  mail:rotate-credential:
    desc: Re-deploy the SMTP relay credential to the app VMs and k3s nodes (docs/15)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      # postfix_null_client only: the relay credential pair plus admin_email,
      # which postfix_null_client_aliases.root resolves from.
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/rotate-mail-credential.yml {{.CLI_ARGS}}

  storage:deploy:
    desc: Deploy NAS storage configuration
    dir: "{{.ANSIBLE_DIR}}"
    env:
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      SAMBA_NAS_PASSWORD: op://Homelab/Samba NAS User/password
      # storage.yml now runs alloy_host on pve-nas-01, which asserts the Loki push creds.
      LOKI_PUSH_USER: op://Homelab/Loki Push Auth/username
      LOKI_PUSH_PASSWORD: op://Homelab/Loki Push Auth/password
      # restic_offsite secrets (docs/42): the RESTRICTED hide-only key fields —
      # scripts/b2-bucket-drift.py keeps the bucket-settings key on b2_key_id/b2_application_key.
      B2_KEY_ID: op://Homelab/B2 Archive Backup/restic_key_id
      B2_APPLICATION_KEY: op://Homelab/B2 Archive Backup/restic_application_key
      RESTIC_REPO_PASSWORD: op://Homelab/B2 Archive Backup/restic_repo_password
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/storage.yml {{.CLI_ARGS}}

  infra:check:
    desc: Check mode - show what would change
    dir: "{{.ANSIBLE_DIR}}"
    env: *infra_env
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/site.yml --check --diff {{.CLI_ARGS}}

  infra:verify:
    desc: Run post-deployment verification
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i {{.INVENTORY}} playbooks/postflight.yml {{.CLI_ARGS}}

  # === Plex Deployment Tasks ===
  plex:deploy:
    desc: Deploy Plex Media Server (provisions LXC container and installs Plex)
    dir: "{{.ANSIBLE_DIR}}"
    # Anchor shared with plex:check so dry-run and deploy can't diverge.
    env: &plex_env
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      PLEX_PFX_PASSPHRASE: op://Homelab/Plex Custom Certificate/password
      # plex.yml now runs alloy_host, which asserts the Loki push creds.
      LOKI_PUSH_USER: op://Homelab/Loki Push Auth/username
      LOKI_PUSH_PASSWORD: op://Homelab/Loki Push Auth/password
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/plex.yml {{.CLI_ARGS}}

  plex:check:
    desc: Check mode - show what Plex deployment would change
    dir: "{{.ANSIBLE_DIR}}"
    env: *plex_env
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/plex.yml --check --diff {{.CLI_ARGS}}

  # === Certificate distribution tasks ===
  certs:show-host-keys:
    desc: Capture SSH host keys for acme_certs_distribution_targets (paste into host_vars/dns-01.yml)
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i {{.INVENTORY}} playbooks/show-cert-host-keys.yml {{.CLI_ARGS}}

  # === ZFS Encryption Tasks ===
  zfs:encrypt:
    desc: Deploy ZFS-encryption mechanism + activate boot units for hosts with zfs_encryption_pools set
    dir: "{{.ANSIBLE_DIR}}"
    env:
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      ZFS_ENCRYPTION_CONNECT_TOKEN: op://Homelab/ZFS Encryption Connect Token/credential
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/zfs-encryption.yml {{.CLI_ARGS}}

  # === K3s Deployment Tasks ===
  k3s:provision-vms:
    desc: Provision k3s VMs on Proxmox (creates VMs only)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/k3s-provision-vms.yml {{.CLI_ARGS}}

  k3s:deploy:
    desc: Deploy k3s cluster (full deployment)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      K3S_TOKEN: op://Homelab/K3s Cluster Token/credential
      # Lower-privilege worker-join token (ANS-D-2). Agents join with this
      # worker-only token instead of the cluster token; servers advertise it via
      # agent-token in the server config. See docs/19 "Agent token".
      K3S_AGENT_TOKEN: op://Homelab/K3s Agent Token/credential
      # k3s.yml runs alloy_host on the k3s nodes, which asserts the Loki push
      # creds are present (https endpoint). Inject them like infra:deploy does.
      LOKI_PUSH_USER: op://Homelab/Loki Push Auth/username
      LOKI_PUSH_PASSWORD: op://Homelab/Loki Push Auth/password
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/k3s.yml {{.CLI_ARGS}}

  k3s:kubeconfig:
    desc: Fetch kubeconfig from k3s cluster
    cmds:
      - |
        echo "Fetching kubeconfig from k3s server..."
        # The kube-vip API VIP is read from cluster-config, not spelled here:
        # it is the same value as k3s_api_vip in group_vars/k3s.yml and
        # check-cluster-literals.py holds the two equal.
        API_VIP=$(scripts/cluster-config-value.sh cluster_api_vip) || exit 1
        # First-reachable entry point via the shared helper (targets are
        # eric@<ip>, so $SERVER already carries the user; no eric@ prefix below).
        TARGETS=""
        for ip in {{.K3S_SERVERS}}; do TARGETS="$TARGETS eric@$ip"; done
        # shellcheck disable=SC2086
        SERVER=$(scripts/find-reachable-host.sh $TARGETS) || {
          echo "ERROR: Cannot reach any k3s server ({{.K3S_SERVERS}})"
          exit 1
        }
        SSH_STDERR=$(mktemp)
        KUBECONFIG_DATA=$(ssh "$SERVER" "sudo cat /etc/rancher/k3s/k3s.yaml" 2>"$SSH_STDERR")
        SSH_RC=$?
        if [ $SSH_RC -ne 0 ]; then
          echo "ERROR: Failed to fetch kubeconfig from k3s server $SERVER (exit code: $SSH_RC)"
          cat "$SSH_STDERR"
          rm -f "$SSH_STDERR"
          exit 1
        fi
        rm -f "$SSH_STDERR"
        if [ -z "$KUBECONFIG_DATA" ]; then
          echo "ERROR: Kubeconfig data is empty"
          exit 1
        fi
        mkdir -p ~/.kube
        echo "$KUBECONFIG_DATA" | \
          sed "s/127.0.0.1/$API_VIP/g; s/0.0.0.0/$API_VIP/g" > ~/.kube/config-k3s
        chmod 600 ~/.kube/config-k3s
        echo "Kubeconfig saved to ~/.kube/config-k3s (permissions: 600)"
        echo "Run: export KUBECONFIG=~/.kube/config-k3s"

  # === K3s Cluster Operations ===
  authentik:add-user:
    desc: Scaffold a managed authentik user into terraform/authentik/users.tf (task authentik:add-user -- <username> --name "Full Name" --email a@b.c [--groups app-x,app-y])
    cmds:
      - python3 scripts/authentik-add-user.py {{.CLI_ARGS}}

  authentik:status:
    desc: Show Authentik SSO status
    cmds:
      - echo "=== Authentik Namespace ==="
      - kubectl get pods -n authentik -o wide
      - echo ""
      - echo "=== Services ==="
      - kubectl get svc -n authentik
      - echo ""
      - echo "=== PVCs ==="
      - kubectl get pvc -n authentik
      - echo ""
      - echo "=== IngressRoutes ==="
      - kubectl get ingressroute -n authentik

  authentik:logs:
    desc: "View Authentik logs (task authentik:logs [COMPONENT=server])"
    vars:
      COMPONENT: '{{.COMPONENT | default "server"}}'
    cmds:
      - |
        COMPONENT="{{.COMPONENT}}"
        echo "=== Authentik $COMPONENT logs ==="
        kubectl logs -n authentik -l app.kubernetes.io/name=authentik,app.kubernetes.io/component=$COMPONENT -f

  authentik:restart:
    desc: Restart Authentik server and worker
    cmds:
      - echo "Restarting Authentik..."
      - kubectl rollout restart deployment -n authentik -l app.kubernetes.io/name=authentik
      - echo "Waiting for rollout to complete..."
      - kubectl rollout status deployment/authentik-server -n authentik --timeout=300s
      - kubectl rollout status deployment/authentik-worker -n authentik --timeout=300s

  # ── Hermes Agent ──────────────────────────────────────────────────────
  hermes:status:
    desc: Show Hermes Agent status
    cmds:
      - echo "=== Hermes Namespace ==="
      - kubectl get pods -n hermes -o wide
      - echo ""
      - echo "=== Services ==="
      - kubectl get svc -n hermes
      - echo ""
      - echo "=== PVC ==="
      - kubectl get pvc -n hermes
      - echo ""
      - echo "=== IngressRoutes ==="
      - kubectl get ingressroute -n hermes
      - echo ""
      - echo "=== ExternalSecrets ==="
      - kubectl get externalsecrets -n hermes

  hermes:logs:
    desc: "View Hermes logs (task hermes:logs [COMPONENT=dashboard|gateway])"
    vars:
      COMPONENT: '{{.COMPONENT | default "dashboard"}}'
    cmds:
      - |
        COMPONENT="{{.COMPONENT}}"
        echo "=== Hermes $COMPONENT logs ==="
        kubectl logs -n hermes deploy/hermes -c "$COMPONENT" -f

  hermes:restart:
    desc: Restart Hermes Agent (gateway + dashboard)
    cmds:
      - echo "Restarting Hermes..."
      - kubectl rollout restart deployment/hermes -n hermes
      - echo "Waiting for rollout to complete..."
      - kubectl rollout status deployment/hermes -n hermes --timeout=300s

  hermes:shell:
    desc: "Open a shell in the Hermes dashboard container (task hermes:shell [COMPONENT=dashboard|gateway])"
    vars:
      COMPONENT: '{{.COMPONENT | default "dashboard"}}'
    cmds:
      - kubectl exec -it -n hermes deploy/hermes -c "{{.COMPONENT}}" -- /bin/sh

  hermes:codex-login:
    desc: "One-time ChatGPT-subscription login for the Codex runtime (device-code flow; see docs/37)"
    cmds:
      - echo "Starting Codex device-code login in the gateway container."
      - echo "Open the printed URL in your browser, sign in to ChatGPT, and enter the code."
      - kubectl exec -it -n hermes deploy/hermes -c gateway -- codex login --device-auth

  # ── Hindsight (Hermes long-term memory; cluster-internal, no ingress) ──
  hindsight:status:
    desc: Show Hindsight status (pods, service, PVC, VPA)
    cmds:
      - echo "=== Hindsight Namespace ==="
      - kubectl get pods -n hindsight -o wide
      - echo ""
      - echo "=== Service ==="
      - kubectl get svc -n hindsight
      - echo ""
      - echo "=== PVC ==="
      - kubectl get pvc -n hindsight
      - echo ""
      - echo "=== VPA ==="
      - kubectl get vpa -n hindsight

  hindsight:logs:
    desc: "Tail Hindsight logs (task hindsight:logs [COMPONENT=hindsight|llama])"
    vars:
      COMPONENT: '{{.COMPONENT | default "hindsight"}}'
    cmds:
      - kubectl logs -n hindsight deploy/hindsight -c "{{.COMPONENT}}" --tail=100 -f

  hindsight:restart:
    desc: Restart Hindsight (pod delete; Flux-managed, replicas:1 + Recreate)
    cmds:
      # Pod delete, NOT `kubectl rollout restart`: the Deployment is
      # Flux-kustomize-managed, so restartedAt is drift the controller reverts.
      - kubectl delete pod -n hindsight -l app.kubernetes.io/name=hindsight
      - kubectl wait --namespace hindsight --for=condition=ready pod -l app.kubernetes.io/name=hindsight --timeout=300s

  # ── Homarr (homelab dashboard) ────────────────────────────────────────
  homarr:status:
    desc: Show Homarr status (pods, service, PVC, ingress, ExternalSecrets)
    cmds:
      - echo "=== Homarr Namespace ==="
      - kubectl get pods -n homarr -o wide
      - echo ""
      - echo "=== Service ==="
      - kubectl get svc -n homarr
      - echo ""
      - echo "=== PVC ==="
      - kubectl get pvc -n homarr
      - echo ""
      - echo "=== IngressRoutes ==="
      - kubectl get ingressroute -n homarr
      - echo ""
      - echo "=== ExternalSecrets ==="
      - kubectl get externalsecrets -n homarr

  homarr:logs:
    desc: Tail Homarr logs
    cmds:
      - kubectl logs -n homarr deploy/homarr --tail=100 -f

  homarr:restart:
    desc: Restart Homarr (pod delete; Flux-managed, replicas:1 + Recreate)
    cmds:
      - kubectl delete pod -n homarr -l app.kubernetes.io/name=homarr
      - kubectl wait --namespace homarr --for=condition=ready pod -l app.kubernetes.io/name=homarr --timeout=300s

  # ── Observability ────────────────────────────────────────────────────
  observability:status:
    desc: Show observability namespace health
    cmds:
      - kubectl get pods -n observability -o wide
      - kubectl get svc -n observability
      - kubectl get pvc -n observability
      - kubectl get helmreleases -n observability
      - kubectl get externalsecrets -n observability
      - kubectl get servicemonitors -n observability

  observability:logs:
    desc: View observability component logs
    vars:
      COMPONENT: '{{.COMPONENT | default "prometheus"}}'
    cmds:
      - kubectl logs -n observability -l app.kubernetes.io/name={{.COMPONENT}} --tail=100 -f {{.CLI_ARGS}}

  observability:restart:
    desc: Restart observability pods
    cmds:
      - kubectl rollout restart deployment -n observability
      - kubectl rollout restart statefulset -n observability
      - kubectl rollout restart daemonset -n observability

  observability:silence:
    desc: "Create an Alertmanager silence (ALERT=alertname, DURATION=2H — units S/M/H/d; works with BSD or GNU date)"
    vars:
      ALERT: '{{.ALERT | default "Watchdog"}}'
      DURATION: '{{.DURATION | default "2H"}}'
    cmds:
      - |
        RESP=$(mktemp)
        PF_PID=""
        cleanup() { [ -n "$PF_PID" ] && kill "$PF_PID" 2>/dev/null; rm -f "$RESP"; }
        trap cleanup EXIT
        # Portable end-time: BSD date (macOS) first, GNU date (Linux/CI) as the
        # fallback — same two-arm pattern collect-state.sh uses. DURATION uses
        # BSD units (S/M/H/d); the GNU arm maps them.
        END=$(date -u -v+{{.DURATION}} '+%Y-%m-%dT%H:%M:%S.000Z' 2>/dev/null || true)
        if [ -z "$END" ]; then
          GNU_DUR=$(printf '%s' '{{.DURATION}}' | sed -E 's/^([0-9]+)S$/\1 seconds/; s/^([0-9]+)M$/\1 minutes/; s/^([0-9]+)H$/\1 hours/; s/^([0-9]+)d$/\1 days/')
          case "$GNU_DUR" in
            *' seconds'|*' minutes'|*' hours'|*' days') ;;
            *) echo "ERROR: Invalid DURATION '{{.DURATION}}' (use S/M/H/d, e.g. 2H)"; exit 1 ;;
          esac
          END=$(date -u -d "+$GNU_DUR" '+%Y-%m-%dT%H:%M:%S.000Z' 2>/dev/null || true)
        fi
        if [ -z "$END" ]; then echo "ERROR: could not compute an end time for DURATION '{{.DURATION}}' with either BSD or GNU date"; exit 1; fi
        START=$(date -u '+%Y-%m-%dT%H:%M:%S.000Z')
        kubectl port-forward -n observability svc/kube-prometheus-stack-alertmanager 9093:9093 &
        PF_PID=$!
        for _i in 1 2 3 4 5; do
          if curl -s -o /dev/null http://localhost:9093/ 2>/dev/null; then break; fi
          if ! kill -0 "$PF_PID" 2>/dev/null; then
            echo "ERROR: port-forward process died — is Alertmanager running?"
            exit 1
          fi
          sleep 1
        done
        if ! curl -s -o /dev/null http://localhost:9093/ 2>/dev/null; then
          echo "ERROR: port-forward not ready after 5s — is Alertmanager running?"
          exit 1
        fi
        ALERT_VALUE=$(printf '%s' '{{.ALERT}}' | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read())[1:-1])') || {
          echo "ERROR: Failed to JSON-encode alert name"; exit 1;
        }
        if [ -z "$ALERT_VALUE" ]; then echo "ERROR: Alert name resolved to empty string"; exit 1; fi
        HTTP_CODE=$(curl -s -o "$RESP" -w '%{http_code}' -X POST http://localhost:9093/api/v2/silences -H "Content-Type: application/json" -d "{
          \"matchers\": [{\"name\": \"alertname\", \"value\": \"$ALERT_VALUE\", \"isRegex\": false}],
          \"startsAt\": \"$START\",
          \"endsAt\": \"$END\",
          \"createdBy\": \"task-cli\",
          \"comment\": \"Silenced via task observability:silence\"
        }")
        if [ "$HTTP_CODE" -ne 200 ]; then
          echo "ERROR: Alertmanager API returned HTTP $HTTP_CODE"
          cat "$RESP" 2>/dev/null
          exit 1
        fi
        python3 -m json.tool "$RESP"

  k3s:backup:
    desc: Create etcd snapshot on k3s server
    cmds:
      - |
        set -eo pipefail
        SNAPSHOT_NAME="manual-$(date +%Y%m%d-%H%M%S)"
        # First-reachable entry point via the shared helper (targets are
        # eric@<ip>, so $SERVER already carries the user).
        TARGETS=""
        for ip in {{.K3S_SERVERS}}; do TARGETS="$TARGETS eric@$ip"; done
        # shellcheck disable=SC2086
        SERVER=$(scripts/find-reachable-host.sh $TARGETS) || {
          echo "ERROR: Cannot reach any k3s server ({{.K3S_SERVERS}})"
          exit 1
        }
        echo "Creating etcd snapshot: $SNAPSHOT_NAME (via $SERVER)"
        ssh "$SERVER" "sudo k3s etcd-snapshot save --name $SNAPSHOT_NAME"
        echo "Snapshot created successfully"
        echo ""
        echo "To list snapshots:"
        echo "  ssh $SERVER 'sudo k3s etcd-snapshot ls'"
        echo ""
        echo "Snapshots are stored in: /var/lib/rancher/k3s/server/db/snapshots/"

  k3s:status:
    desc: Show k3s cluster and workload status
    preconditions:
      - sh: command -v kubectl
        msg: "kubectl is not installed. Install via: https://kubernetes.io/docs/tasks/tools/"
      - sh: kubectl cluster-info 2>/dev/null
        msg: "Cannot connect to k3s cluster. Run: export KUBECONFIG=~/.kube/config-k3s"
    cmds:
      - echo "=== K3s Cluster Status ==="
      - kubectl get nodes -o wide
      - echo ""
      - echo "=== Platform Services ==="
      - echo "MetalLB -"
      - kubectl get pods -n metallb-system 2>/dev/null || echo "  Not installed"
      - kubectl get ipaddresspool -n metallb-system 2>/dev/null || true
      - echo ""
      - echo "Traefik -"
      - kubectl get pods -n traefik 2>/dev/null || echo "  Not installed"
      - kubectl get svc -n traefik 2>/dev/null || true
      - echo ""
      - echo "cert-manager -"
      - kubectl get pods -n cert-manager 2>/dev/null || echo "  Not installed"
      - kubectl get certificate -A 2>/dev/null || true
      - echo ""
      - echo "external-dns -"
      - kubectl get pods -n external-dns 2>/dev/null || echo "  Not installed"
      - echo ""
      - echo "DDNS CronJob -"
      - kubectl get cronjob cloudflare-ddns -n cloudflare-ddns 2>/dev/null || echo "  Not installed"
      - echo ""
      - echo "Authentik SSO -"
      - kubectl get pods -n authentik 2>/dev/null || echo "  Not installed"
      - kubectl get svc -n authentik 2>/dev/null || true
      - echo ""
      - echo "IngressRoutes -"
      - kubectl get ingressroute -A 2>/dev/null || echo "  None configured"

  # === Flux GitOps ===
  # All Kubernetes workloads (platform + apps) are reconciled by Flux.
  # Deployment is `git push` — these tasks are for bootstrap, validation,
  # and operational control (suspend/resume, force reconcile, secret rotation).

  flux:install-cli:
    desc: Install flux CLI via brew (macOS)
    cmds:
      - |
        if ! command -v flux &>/dev/null; then
          brew install fluxcd/tap/flux
        fi
        flux --version

  flux:bootstrap:
    desc: "One-time bootstrap of Flux into the cluster. Accepts BRANCH (default: main) to target a different branch."
    vars:
      BRANCH: '{{.BRANCH | default "main"}}'
    preconditions:
      - sh: command -v flux
        msg: "flux CLI not installed. Run: task flux:install-cli"
      - sh: kubectl cluster-info 2>/dev/null
        msg: "Cannot reach cluster. Ensure KUBECONFIG points at the k3s cluster"
      # `op account list`, not `op whoami` — see the note on infra:deploy's preconditions.
      - sh: op account list 2>/dev/null
        msg: "1Password CLI not signed in. Run: eval $(op signin)"
      - sh: kubectl -n external-secrets get secret op-credentials 2>/dev/null
        msg: "Bootstrap Secret 'op-credentials' not found in external-secrets namespace. Run `task flux:bootstrap-onepassword` for instructions."
      - sh: kubectl -n external-secrets get secret onepassword-connect-token 2>/dev/null
        msg: "Bootstrap Secret 'onepassword-connect-token' not found in external-secrets namespace. Run `task flux:bootstrap-onepassword` for instructions."
    cmds:
      - |
        set -eo pipefail
        if [ ! -t 0 ]; then
          echo "ERROR: flux:bootstrap requires an interactive TTY (prompts for confirmation)."
          exit 1
        fi
        echo "Bootstrapping Flux to git.ericsweiss.com/eric/weisssrv, branch {{.BRANCH}}"
        echo "This will create a commit on the branch and push it (first push of the branch)."
        read -r -p "Continue? [y/N] " confirm
        [ "$confirm" = "y" ] || { echo "Aborted by user"; exit 1; }
      - |
        set -eo pipefail
        # Explicit read + non-empty validation. Otherwise a silent op read
        # failure would run flux bootstrap with GITLAB_TOKEN="" and fail with
        # an opaque auth error instead of surfacing the real cause.
        GITLAB_TOKEN="$(op read 'op://Homelab/Flux GitLab PAT/credential')"
        if [ -z "$GITLAB_TOKEN" ]; then
          echo "ERROR: op read returned an empty token for 'Flux GitLab PAT'"
          exit 1
        fi
        export GITLAB_TOKEN
        flux bootstrap gitlab \
          --hostname=git.ericsweiss.com \
          --owner=eric \
          --repository=weisssrv \
          --branch={{.BRANCH}} \
          --path=kubernetes/clusters/weisssrv \
          --deploy-token-auth \
          --interval=1m

  flux:bootstrap-onepassword:
    desc: Print instructions for creating the 1Password Connect bootstrap secrets (one-time manual setup)
    cmds:
      - |
        echo "1Password Connect bootstrap (one-time manual setup):"
        echo ""
        echo "1. Create Connect server: op connect server create weisssrv-connect --vaults Homelab"
        echo "   (writes 1password-credentials.json to the current directory)"
        echo "2. Create the token + k8s secrets: task flux:bootstrap-onepassword-apply"
        echo ""
        echo "Or do step 2 by hand:"
        echo "   op connect token create weisssrv-eso --server weisssrv-connect --vaults Homelab"
        echo "   kubectl create namespace external-secrets --dry-run=client -o yaml | kubectl apply -f -"
        echo "   kubectl -n external-secrets create secret generic op-credentials \\"
        echo "     --from-file=1password-credentials.json=./1password-credentials.json"
        echo "   kubectl -n external-secrets create secret generic onepassword-connect-token \\"
        echo "     --from-literal=token=<TOKEN>"

  flux:bootstrap-onepassword-apply:
    desc: Create the 1Password Connect bootstrap secrets in the cluster (needs ./1password-credentials.json from `op connect server create`)
    preconditions:
      - sh: command -v op
        msg: "1Password CLI is not installed. Install via: https://developer.1password.com/docs/cli/get-started/"
      # `op account list`, not `op whoami` — see the note on infra:deploy's preconditions.
      - sh: op account list 2>/dev/null
        msg: "1Password CLI not authenticated. Run: eval $(op signin)"
      - sh: command -v kubectl
        msg: "kubectl not found"
      - sh: kubectl cluster-info 2>/dev/null
        msg: "Cannot reach cluster. Ensure KUBECONFIG points at the k3s cluster"
      - sh: test -f ./1password-credentials.json
        msg: "./1password-credentials.json not found. Run: op connect server create weisssrv-connect --vaults Homelab (see task flux:bootstrap-onepassword)"
    cmds:
      - |
        set -eo pipefail
        # Mint the Connect token fresh — it is deliberately NOT stored as a
        # 1Password item (docs/15 inventory), so there is nothing to `op read`.
        # Non-empty validation mirrors the flux:bootstrap GITLAB_TOKEN pattern.
        TOKEN="$(op connect token create weisssrv-eso --server weisssrv-connect --vaults Homelab)"
        if [ -z "$TOKEN" ]; then
          echo "ERROR: op connect token create returned an empty token"
          exit 1
        fi
        TOKEN_FILE=$(mktemp)
        trap 'rm -f "$TOKEN_FILE"' EXIT
        printf '%s' "$TOKEN" > "$TOKEN_FILE"
        kubectl create namespace external-secrets --dry-run=client -o yaml | kubectl apply -f -
        kubectl -n external-secrets create secret generic op-credentials \
          --from-file=1password-credentials.json=./1password-credentials.json \
          --dry-run=client -o yaml | kubectl apply -f -
        kubectl -n external-secrets create secret generic onepassword-connect-token \
          --from-file=token="$TOKEN_FILE" \
          --dry-run=client -o yaml | kubectl apply -f -
        echo "Bootstrap secrets created. Continue with: task flux:bootstrap"

  flux:reconcile:
    desc: Trigger full reconciliation of Flux-managed resources (source → infra chain → apps)
    # Anchor shared by the flux:* operational tasks so the install hint stays in one place.
    preconditions: &flux_preconditions
      - sh: command -v flux
        msg: "flux CLI not installed. Run: task flux:install-cli"
      - sh: command -v kubectl
        msg: "kubectl not found"
      - sh: python3 -c "import yaml" 2>/dev/null
        msg: "PyYAML not installed (pip install pyyaml) — needed to derive the child Kustomization order"
    cmds:
      - flux reconcile source git flux-system
      # Root first: it applies the child Kustomization CRs themselves, so
      # edits under kubernetes/clusters/weisssrv/ take effect immediately
      # instead of waiting for the root's own interval.
      - flux reconcile kustomization flux-system
      # Children derived from kubernetes/clusters/weisssrv/*.yaml in dependsOn
      # order, never hand-listed — a missing stage (e.g. infrastructure-crds)
      # would reconcile controllers against the pre-bump CRD set.
      #
      # Per-stage error capture, NOT `set -e` over a `while read` pipeline: one
      # stage that cannot reach Ready must never stop the loop —
      # infrastructure-metrics-server is Ready=False BY DESIGN until an operator
      # runs `task k3s:deploy`, and it sorts early enough to strand every later
      # stage. A `for` over a captured list also keeps the accumulator out of a
      # subshell.
      - |
        set -u
        STAGES=$(python3 scripts/flux-child-kustomizations.py) || {
          echo "ERROR: could not derive the child Kustomization list from kubernetes/clusters/weisssrv/" >&2
          exit 1
        }
        FAILED=""
        for ks in $STAGES; do
          [ -n "$ks" ] || continue
          # --timeout caps a stage that CANNOT become Ready at 2m rather than
          # the CLI's 5m default, so a known-open cutover costs minutes, not
          # a quarter hour, before the remaining stages get their turn.
          if flux reconcile kustomization "$ks" --timeout=2m; then
            continue
          fi
          echo "WARN: $ks did not reach Ready — continuing with the remaining stages"
          FAILED="$FAILED $ks"
        done
        if [ -n "$FAILED" ]; then
          echo ""
          echo "ERROR: stage(s) did not reconcile to Ready:$FAILED"
          echo "  Every OTHER stage above was still reconciled."
          echo "  infrastructure-metrics-server is EXPECTED here until the k3s"
          echo "  --disable=metrics-server deploy lands — docs/33-autoscaling.md"
          echo "  § metrics-server, and the open follow-up in docs/16-next-steps.md."
          exit 1
        fi
        echo "All Flux stages reconciled."

  flux:verify:
    desc: Run flux check and show status of all managed resources
    preconditions: *flux_preconditions
    cmds:
      - flux check
      - flux get all -A
      - task: flux:verify-live-policy

  flux:verify-live-policy:
    desc: Run the live-state policy checks (CPU limits + secret ownership) and WARN — never abort flux:verify
    preconditions: *flux_preconditions
    cmds:
      # Both checks always run and are aggregated: go-task stops at the first
      # failing command, so stacking them would report only one per run. They
      # WARN rather than fail because flux:verify is the post-deploy/DR gate and
      # both findings need one-time operator action. The standalone tasks below
      # keep their non-zero exit for scripted/CI use.
      - |
        set -u
        rc=0
        echo "=== Live CPU-limit policy (docs/33-autoscaling.md) ==="
        # pods AND the workload templates: with pods alone the script's
        # memory-limit-drift half short-circuits with a "not checked" note. The
        # VPAs come along so a container whose limits an active VPA rewrites at
        # admission is skipped instead of reported as unfixable drift.
        kubectl get pods,deployments,statefulsets,daemonsets,verticalpodautoscalers \
          -A -o json | python3 scripts/check-live-cpu-limits.py || rc=1
        echo ""
        echo "=== Secret ownership / rotation coverage (docs/29-flux-operations.md) ==="
        kubectl get secrets -A -o json | python3 scripts/check-unmanaged-secrets.py || rc=1
        if [ "$rc" -ne 0 ]; then
          echo ""
          echo "############################################################"
          echo "WARNING: live-state policy findings above (flux:verify is NOT failed by them)."
          echo "Each needs a one-time operator action; re-run to confirm:"
          echo "  task flux:verify-cpu-limits        # exits non-zero until the stale SSA"
          echo "                                    # field owners are released (docs/33)"
          echo "  task flux:verify-unmanaged-secrets # exits non-zero until the hand-applied"
          echo "                                    # Secrets are removed (docs/29)"
          echo "############################################################"
        fi

  flux:verify-unmanaged-secrets:
    desc: Assert every live Secret is owned by ESO/Flux/Helm/a controller (rotation coverage)
    preconditions: *flux_preconditions
    cmds:
      # A hand-applied Secret is outside the ExternalSecret lifecycle, so
      # `task flux:rotate-secret` and docs/15 never touch it and a superseded
      # credential can outlive its rotation. Nothing in git can see it.
      - kubectl get secrets -A -o json | python3 scripts/check-unmanaged-secrets.py

  flux:verify-cpu-limits:
    desc: Assert the LIVE cluster imposes no CPU limits (git-vs-cluster drift, docs/33)
    preconditions: *flux_preconditions
    cmds:
      # flux:lint proves the policy in git; this proves it in the cluster. The
      # two disagree whenever a retired field manager still co-owns limits.cpu
      # under server-side apply — a state no static lint can see. The workload
      # templates come along so the script's memory-limit-drift half runs too
      # (pods alone leave it skipped), and the VPAs so that half can tell a
      # stale pod from one whose limits an active VPA legitimately rewrote.
      - >-
        kubectl get pods,deployments,statefulsets,daemonsets,verticalpodautoscalers
        -A -o json | python3 scripts/check-live-cpu-limits.py

  flux:status:
    desc: Concise health summary
    preconditions: *flux_preconditions
    cmds:
      - flux get kustomizations -A
      - flux get helmreleases -A
      - kubectl get externalsecrets -A

  flux:suspend:
    desc: "Suspend a Flux resource (usage: task flux:suspend -- <ns>/<kind>/<name>)"
    preconditions: *flux_preconditions
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task flux:suspend -- <ns>/<kind>/<name>"
          echo "Example: task flux:suspend -- authentik/helmrelease/authentik"
          exit 1
        fi
        set -eo pipefail
        IFS='/' read -r NS KIND NAME <<< "{{.CLI_ARGS}}"
        flux suspend "$KIND" "$NAME" -n "$NS"

  flux:resume:
    desc: "Resume a suspended Flux resource (usage: task flux:resume -- <ns>/<kind>/<name>)"
    preconditions: *flux_preconditions
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task flux:resume -- <ns>/<kind>/<name>"
          exit 1
        fi
        set -eo pipefail
        IFS='/' read -r NS KIND NAME <<< "{{.CLI_ARGS}}"
        flux resume "$KIND" "$NAME" -n "$NS"

  flux:refresh-secret:
    desc: "Force an ExternalSecret to re-fetch from 1Password (usage: task flux:refresh-secret -- <ns>/<name>)"
    cmds:
      - |
        set -eo pipefail
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task flux:refresh-secret -- <ns>/<name>"
          exit 1
        fi
        if ! [[ "{{.CLI_ARGS}}" =~ ^[a-z0-9-]+/[a-z0-9-]+$ ]]; then
          echo "ERROR: CLI_ARGS must be <namespace>/<name> (lowercase, dashes, digits only)"
          exit 1
        fi
        IFS='/' read -r NS NAME <<< "{{.CLI_ARGS}}"
        kubectl annotate --overwrite -n "$NS" externalsecret "$NAME" force-sync="$(date +%s)"
        kubectl wait -n "$NS" externalsecret "$NAME" --for=condition=Ready --timeout=60s

  flux:rotate-secret:
    desc: "Refresh ExternalSecret + restart consuming pods (usage: task flux:rotate-secret -- <app>)"
    cmds:
      - |
        # `set -e` is critical: without it, a failed flux:refresh-secret would
        # still proceed to rollout-restart pods that then come back up with
        # the OLD cached secret, and the operator would think rotation worked.
        set -eo pipefail
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task flux:rotate-secret -- <app>"
          echo "Known apps: authentik, downloads, recipes, gitlab-runner, gitlab-runner-privileged, gitlab-agent, registry-cache, observability-exporters"
          exit 1
        fi
        APP="{{.CLI_ARGS}}"
        case "$APP" in
          authentik)
            task flux:refresh-secret -- authentik/authentik-secrets
            # Bitnami postgresql subchart labels its StatefulSet with
            # app.kubernetes.io/name=postgresql (NOT authentik); match by
            # instance label instead so we catch both server and postgres.
            kubectl rollout restart deployment -n authentik -l app.kubernetes.io/instance=authentik
            kubectl rollout restart statefulset -n authentik -l app.kubernetes.io/instance=authentik
            ;;
          downloads|vpn)
            task flux:refresh-secret -- downloads/vpn-credentials
            # gluetun-control-auth (control-server config.toml + exporter apikey)
            # is a SEPARATE ExternalSecret with a 24h refreshInterval, and Reloader
            # ignores Secret changes — so it must be force-synced here too, else a
            # bare pod restart just re-reads the stale apikey and the rotation is a
            # silent no-op until the next 24h refresh.
            task flux:refresh-secret -- downloads/gluetun-control-auth
            # Only nzbget + qbittorrent consume these Secrets (Gluetun sidecars +
            # the qbittorrent gluetun-exporter); the other *arr apps don't need
            # them and restarting them wastes time.
            kubectl rollout restart deployment -n downloads -l app.kubernetes.io/name=nzbget
            kubectl rollout restart deployment -n downloads -l app.kubernetes.io/name=qbittorrent
            ;;
          recipes)
            task flux:refresh-secret -- recipes/recipes-secrets
            kubectl rollout restart deployment -n recipes
            ;;
          gitlab-runner)
            task flux:refresh-secret -- gitlab-runner/gitlab-runner-token
            kubectl rollout restart deployment/gitlab-runner -n gitlab-runner
            ;;
          gitlab-runner-privileged)
            task flux:refresh-secret -- gitlab-runner-privileged/gitlab-runner-privileged-token
            kubectl rollout restart deployment/gitlab-runner-privileged -n gitlab-runner-privileged
            ;;
          gitlab-agent)
            task flux:refresh-secret -- gitlab-agent/gitlab-agent-token
            kubectl rollout restart deployment -n gitlab-agent
            ;;
          registry-cache)
            task flux:refresh-secret -- registry-cache/registry-cache-secrets
            kubectl rollout restart deployment/registry-cache -n registry-cache
            ;;
          observability-exporters)
            task flux:refresh-secret -- observability/observability-exporter-secrets
            # Restart by name, not `-n observability` wholesale: the namespace also
            # holds grafana/prometheus/loki. Every consumer below takes the value
            # via env secretKeyRef, so a refresh is invisible until the pod
            # restarts (Reloader ignores Secrets — ignoreSecrets: true). The
            # ServiceMonitor bearer tokens in the same Secret are picked up by
            # Prometheus itself (mounted Secret + config-reloader), so Prometheus
            # is deliberately not restarted here.
            kubectl rollout restart -n observability \
              deployment/proxmox-exporter deployment/plex-exporter \
              deployment/adguard-exporter-dns01 deployment/adguard-exporter-dns02 \
              deployment/exportarr-sonarr deployment/exportarr-radarr \
              deployment/exportarr-lidarr deployment/exportarr-prowlarr
            ;;
          *)
            echo "Unknown app: $APP"
            exit 1
            ;;
        esac

  flux:sync-versions:
    desc: Regenerate kubernetes/infrastructure/sources/versions-configmap.yaml from all.yml
    preconditions:
      - sh: python3 -c "import yaml" 2>/dev/null
        msg: "PyYAML not installed (pip install pyyaml)"
    cmds:
      - |
        python3 scripts/generate-versions-configmap.py \
          --vars-file ansible/inventories/prod/group_vars/all.yml \
          --output kubernetes/infrastructure/sources/versions-configmap.yaml \
          --nested-key helm_chart_versions \
          --regen-command "task flux:sync-versions"

  hosts:sync:
    desc: Regenerate scripts/hosts.env from ansible/inventories/prod/hosts.yml (host/IP roster)
    preconditions:
      - sh: python3 -c "import yaml" 2>/dev/null
        msg: "PyYAML not installed (pip install pyyaml)"
    cmds:
      - |
        python3 scripts/generate-hosts-env.py \
          --inventory ansible/inventories/prod/hosts.yml \
          --map scripts/hosts-env-map.yml \
          --regen-command "task hosts:sync"

  flux:dev-apply:
    desc: "Dev helper: kustomize build + envsubst + kubectl apply for a path (Flux will revert if it differs from committed state)"
    preconditions:
      - sh: command -v kustomize
        msg: "kustomize not found"
      - sh: command -v kubectl
        msg: "kubectl not found"
      - sh: command -v envsubst
        msg: "envsubst not found (install gettext)"
      - sh: python3 -c "import yaml" 2>/dev/null
        msg: "PyYAML not installed (pip install pyyaml)"
    cmds:
      - |
        set -eo pipefail
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task flux:dev-apply -- <path-to-kustomization-dir>"
          exit 1
        fi
        # Load both substitution ConfigMaps into env so ${var} placeholders
        # resolve the same way Flux's kustomize-controller does at reconcile
        # time. Without this, `kustomize build` emits literal ${gluetun_version}
        # / ${cluster_internal_domain} and kubectl applies a broken image tag or
        # an empty hostname to the cluster.
        # Shared extraction (scripts/flux-env.sh) — same block CI uses.
        VERSIONS_CONFIGMAP=kubernetes/infrastructure/sources/versions-configmap.yaml
        VARS=$(scripts/flux-env.sh export-versions "$VERSIONS_CONFIGMAP") || exit 1
        eval "$VARS"
        echo "WARNING: Flux will revert this if it differs from committed state."
        kustomize build "{{.CLI_ARGS}}" | envsubst "$FLUX_ENVSUBST_VARS" | kubectl apply -f -

  flux:lint:
    desc: Build every Flux Kustomization + envsubst from both ConfigMaps + kubeconform
    preconditions:
      - sh: command -v kustomize
        msg: "kustomize not installed. brew install kustomize or see https://kubectl.docs.kubernetes.io/installation/kustomize/"
      - sh: command -v kubeconform
        msg: "kubeconform not installed. brew install kubeconform or see https://github.com/yannh/kubeconform"
      - sh: command -v envsubst
        msg: "envsubst not installed. brew install gettext"
      - sh: command -v helm
        msg: "helm not installed. brew install helm (used to schema-validate value-heavy HelmReleases)"
      - sh: python3 -c "import yaml" 2>/dev/null
        msg: "Python PyYAML not installed. pip install pyyaml"
    cmds:
      - |
        set -eo pipefail
        FAILED=0
        # Mirror CI's postBuild substitution: extract the keys of BOTH
        # substitution ConfigMaps (cluster-versions + cluster-config), export
        # them so envsubst resolves ${var} placeholders before kubeconform runs.
        # Without this, a typo in a placeholder slips past lint because
        # kubeconform sees the literal string as a valid string. The extraction
        # + k8s-version derivation is shared with CI via scripts/flux-env.sh
        # (which wraps the vendored scripts/flux-render.sh, the single-file
        # entry point both the library CI template and this task call) so the
        # two paths can't drift.
        VERSIONS_CONFIGMAP=kubernetes/infrastructure/sources/versions-configmap.yaml
        VARS=$(scripts/flux-env.sh export-versions "$VERSIONS_CONFIGMAP") || exit 1
        eval "$VARS"

        # kubeconform schema version: derive MAJOR.MINOR.0 from k3s_version in
        # the versions ConfigMap (shared helper), mirroring the CI flux-lint
        # job so local and CI always validate against the same API schemas.
        K8S_VER=$(scripts/flux-env.sh k8s-version "$VERSIONS_CONFIGMAP")
        echo "kubeconform -kubernetes-version: $K8S_VER (from versions-configmap k3s_version)"

        # Accumulate the full rendered corpus so the HPA/VPA invariant check
        # (below) sees standalone HPAs + VPAs across every namespace at once.
        RENDER_ALL=$(mktemp)
        trap 'rm -f "$RENDER_ALL"' EXIT

        for ks in kubernetes/clusters/weisssrv/*.yaml; do
          [ -f "$ks" ] || continue
          NAME=$(basename "$ks" .yaml)
          [ "$NAME" = "kustomization" ] && continue
          SRCPATH=$(python3 -c "
        import yaml
        with open('$ks') as f:
            doc = yaml.safe_load(f)
        print(doc.get('spec', {}).get('path', '') or '')
        ") || { echo "ERROR: failed to parse $ks"; FAILED=1; continue; }
          if [ -z "$SRCPATH" ]; then continue; fi
          SRCPATH="${SRCPATH#./}"
          echo "=== Validating $ks (path $SRCPATH) ==="
          if ! RAW=$(kustomize build "$SRCPATH" 2>&1); then
            echo "ERROR: kustomize build failed for $SRCPATH:"
            echo "$RAW"
            FAILED=1
            continue
          fi
          # Check every ${var} placeholder in the pre-substitution output
          # against the exported ConfigMap keys. envsubst renders missing vars
          # as empty string, so we must validate against the RAW input to catch
          # typos (Flux's kustomize-controller does the same thing silently by
          # default — our lint is intentionally stricter).
          # Flux's Go envsubst PARSE-errors on `${` followed by anything that
          # cannot start a variable name, and silently EATS `${1}`-style refs;
          # the GNU envsubst below ignores both, so a literal "${" inside a
          # ConfigMap script reaches the live cluster as a post-build failure.
          # `$${` is Flux's escape and is exempt.
          MALFORMED=$(printf '%s\n' "$RAW" | sed 's/\$\$[{]/__FLUX_ESCAPED__/g' | grep -nE '\$\{[^A-Za-z_]' || true)
          if [ -n "$MALFORMED" ]; then
            echo "ERROR: $SRCPATH renders a \${ sequence Flux's envsubst mishandles (escape as \$\${ or assemble at runtime):"
            echo "$MALFORMED" | head -5 | sed 's/^/  /'
            FAILED=1
            continue
          fi
          MISSING=""
          # Strip Flux's `$${` escape first (mirrors the CI template + the
          # MALFORMED check above): an escaped sequence still CONTAINS
          # `${var}` textually and would false-positive as a missing key.
          for ref in $(echo "$RAW" | sed 's/\$\$[{]/__FLUX_ESCAPED__/g' | grep -oE '\$\{[A-Za-z_][A-Za-z0-9_]*\}' | sort -u); do
            varname=${ref#\$\{}
            varname=${varname%\}}
            if [ -z "${!varname+x}" ]; then
              MISSING="$MISSING $varname"
            fi
          done
          MISSING=$(echo "$MISSING" | tr ' ' '\n' | grep -v '^$' | sort -u || true)
          if [ -n "$MISSING" ]; then
            echo "ERROR: placeholders in $SRCPATH reference keys in neither substitution ConfigMap:"
            echo "$MISSING" | sed 's/^/  - /'
            FAILED=1
            continue
          fi
          # printf '%s\n' (NOT echo): rendered manifests carry Grafana
          # dashboard JSON with thousands of literal \n inside block scalars,
          # and echo would expand those into real newlines and corrupt the
          # YAML stream (see the deploy-verify note for the full rationale).
          RENDERED=$(printf '%s\n' "$RAW" | envsubst "$FLUX_ENVSUBST_VARS")
          printf '%s\n---\n' "$RENDERED" >> "$RENDER_ALL"
          if ! printf '%s\n' "$RENDERED" | kubeconform -strict -ignore-missing-schemas \
              -kubernetes-version "$K8S_VER" \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{`{{.Group}}`}}/{{`{{.ResourceKind}}`}}_{{`{{.ResourceAPIVersion}}`}}.json' \
              -summary; then
            FAILED=1
          fi
        done

        # The tenants tree is a Kustomize aggregator, not a Flux Kustomization
        # with a spec.path, so the loop above never renders it and the corpus
        # gates below never saw a tenant's own SecretStore/ClusterSecretStore or
        # NetworkPolicy — precisely the resources a tenant repo contributes.
        # Append it explicitly. (kustomize emits a `---`-separated stream; the
        # separator below keeps it from fusing with the last document.)
        echo "=== Adding the tenants tree to the corpus ==="
        if ! kustomize build kubernetes/clusters/weisssrv/tenants >> "$RENDER_ALL"; then
          echo "ERROR: kustomize build failed for kubernetes/clusters/weisssrv/tenants"
          FAILED=1
        fi
        printf '\n---\n' >> "$RENDER_ALL"

        # HPA/VPA invariant: no workload may have both an HPA and a VPA driving
        # the same resource (docs/33-autoscaling.md). Covers standalone HPAs in
        # the corpus; --require-chart-native-vpas also statically asserts the
        # chart-native-HPA workloads (Traefik/authentik/Connect, whose HPA lives
        # inside a HelmRelease) each have a memory-only VPA in the rendered corpus.
        echo "=== Checking HPA/VPA invariant ==="
        if ! python3 scripts/check-hpa-vpa-invariant.py --require-chart-native-vpas \
             --policy-config scripts/autoscaling-policy.yaml < "$RENDER_ALL"; then
          FAILED=1
        fi

        # Scrape/NetworkPolicy invariant: a namespace that enables a
        # ServiceMonitor/PodMonitor (directly or via a chart's values) while
        # running an ingress-deny policy must also admit the observability
        # namespace, or the scrape is REJECTed and only TargetDown reveals it.
        echo "=== Checking scrape/NetworkPolicy invariant ==="
        if ! python3 scripts/check-scrape-netpol.py < "$RENDER_ALL"; then
          FAILED=1
        fi

        # Ingress default-deny mandate: every namespace that owns a workload
        # must carry a namespace-wide ingress-deny policy. The scrape gate above
        # cannot cover this — it only inspects namespaces that ALREADY run one,
        # so an unfenced namespace is invisible to it. The sanctioned exceptions
        # live in the script with their reasons, so a third one fails here.
        echo "=== Checking ingress default-deny coverage ==="
        if ! python3 scripts/check-default-deny-coverage.py < "$RENDER_ALL"; then
          FAILED=1
        fi

        # ClusterSecretStore scoping: cluster-scoped stores must declare
        # spec.conditions, and those conditions must admit every namespace that
        # actually consumes the store (directly or via a ClusterExternalSecret).
        echo "=== Checking ClusterSecretStore scoping ==="
        if ! python3 scripts/check-secretstore-scope.py < "$RENDER_ALL"; then
          FAILED=1
        fi

        # storageClassName invariant: every claim must pin its class. An
        # omitted field is rewritten by the DefaultStorageClass admission plugin
        # at create time, landing the PVC on the unbacked-up VM bootdisk.
        echo "=== Checking claim storageClassName ==="
        if ! python3 scripts/check-pvc-storageclass.py < "$RENDER_ALL"; then
          FAILED=1
        fi

        # NFS-over-TLS invariant: the nas_storage exports REJECT plaintext and
        # the server certificate has no IP SAN, so a PV that drops xprtsec=tls
        # or names the NAS by IP does not degrade — it fails to mount, after the
        # pod is already scheduled.
        echo "=== Checking NFS PersistentVolume TLS ==="
        if ! python3 scripts/check-nfs-tls.py < "$RENDER_ALL"; then
          FAILED=1
        fi

        echo "=== Building cluster root kubernetes/clusters/weisssrv/ ==="
        if ! kustomize build kubernetes/clusters/weisssrv >/dev/null; then
          echo "ERROR: cluster root kustomization failed to build"
          FAILED=1
        fi

        # Schema-validate the value-heavy HelmReleases' .spec.values via
        # `helm template` (kustomize build emits HelmReleases verbatim, so a
        # typo in a chart values key would otherwise slip past kubeconform —
        # the HelmRelease CRD treats .spec.values as a free-form object).
        # Needs network (helm repo add/update). Covers traefik (whose
        # values.schema.json catches key typos), kube-prometheus-stack, authentik.
        echo "=== Schema-validating HelmRelease values blocks (helm template) ==="
        # --versions-configmap takes ONE file, so hand it the union of the two:
        # a values block spells both chart versions and cluster hostnames as
        # placeholders, and an unresolved one renders as an empty string that
        # the chart's schema then accepts.
        MERGED_CM=$(mktemp)
        if scripts/flux-env.sh merged-configmap "$VERSIONS_CONFIGMAP" > "$MERGED_CM"; then
          if ! python3 scripts/validate-helm-values.py --kubeconform \
               --releases scripts/helm-values-releases.yaml \
               --versions-configmap "$MERGED_CM" \
               --policy-config scripts/autoscaling-policy.yaml; then
            FAILED=1
          fi
        else
          echo "ERROR: could not merge the substitution ConfigMaps"
          FAILED=1
        fi
        rm -f "$MERGED_CM"

        exit $FAILED

  # === Maintenance Tasks ===
  # --- Base Infrastructure ---
  maintenance:update-packages:
    desc: Update OS packages on all hosts (rolling, interactive)
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i {{.INVENTORY}} playbooks/maintenance/update-packages.yml {{.CLI_ARGS}}

  maintenance:update-applications:
    desc: Update base applications (AdGuard, Tailscale, Plex, Ansible collections)
    dir: "{{.ANSIBLE_DIR}}"
    # Anchor shared by the base-update variants so they can't drift on secrets.
    # Must stay equal to the maintenance-update-applications job's `variables:`
    # in .gitlab-ci.yml — same playbook, and an op:// ref present on only one
    # path resolves a different branch of the LXC authorized_keys guard
    # (group_vars/dns.yml, mail.yml) than the other.
    env: &base_app_env
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      ADGUARD_ADMIN_PASSWORD: op://Homelab/AdGuard Home/password
      TAILSCALE_AUTH_KEY: op://Homelab/Tailscale Auth Key/credential
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
      # Twin of the CI jobs' env: the plex role fail-louds without it.
      PLEX_PFX_PASSPHRASE: op://Homelab/Plex Custom Certificate/password
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/maintenance/update-applications.yml {{.CLI_ARGS}}

  maintenance:update-full:
    desc: Full base update - OS packages + applications (rolling, interactive)
    dir: "{{.ANSIBLE_DIR}}"
    env: *base_app_env
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/maintenance/update-full.yml {{.CLI_ARGS}}

  maintenance:update-full-auto:
    desc: Full base update - OS packages + applications (rolling, auto-reboot)
    dir: "{{.ANSIBLE_DIR}}"
    env: *base_app_env
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/maintenance/update-full.yml -e auto_reboot=true {{.CLI_ARGS}}

  maintenance:update-plex:
    desc: Update Plex Media Server only (apt latest)
    dir: "{{.ANSIBLE_DIR}}"
    env: *base_app_env
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/maintenance/update-applications.yml --limit plex {{.CLI_ARGS}}

  # --- K3s Cluster ---
  maintenance:update-k3s-nodes:
    desc: Rolling k3s binary upgrades (cordon/upgrade/restart/uncordon; kernel reboots via kured)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      K3S_TOKEN: op://Homelab/K3s Cluster Token/credential
      # Agent token (ANS-D-2) enabled — keep node upgrades on the lower-privilege
      # token (see docs/19 "Agent token").
      K3S_AGENT_TOKEN: op://Homelab/K3s Agent Token/credential
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/maintenance/update-k3s-nodes.yml {{.CLI_ARGS}}

  # --- Version Discovery Tasks ---
  maintenance:check-versions:
    desc: Check all services for available version updates
    env:
      GITHUB_TOKEN: op://Homelab/GitHub Token/credential
    # Anchor shared by both check-versions tasks. Without them a 1Password auth
    # failure was indistinguishable from "nothing to update": `op run` also
    # exits 1 when unauthenticated or unable to resolve a reference, and the
    # `[ $RC -le 1 ]` convention below (0 = up to date, 1 = updates available)
    # then swallowed it into a silent exit 0.
    preconditions: &check_versions_preconditions
      - sh: command -v op
        msg: "1Password CLI is not installed. Install via: https://developer.1password.com/docs/cli/get-started/"
      # `op account list`, not `op whoami` — see the note on infra:deploy's preconditions.
      - sh: op account list 2>/dev/null
        msg: "1Password CLI not authenticated. Run: eval $(op signin)"
    cmds:
      # The script's own rc is carried out-of-band in a temp file so it can be
      # told apart from op's. A missing/empty file means op (or the
      # interpreter) failed before the script exited, and the documented
      # 0-or-1 convention must NOT be applied to that.
      - |
        rc_file=$(mktemp)
        trap 'rm -f "$rc_file"' EXIT
        op run -- sh -c 'python3 ./scripts/check-versions.py {{.CLI_ARGS}}; echo $? > '"$rc_file" || true
        rc=$(cat "$rc_file" 2>/dev/null || true)
        if [ -z "$rc" ]; then
          echo "ERROR: check-versions.py did not run to completion (op run / interpreter failure above)" >&2
          exit 2
        fi
        # 0 = up to date, 1 = updates available (scripts/check-versions.py).
        [ "$rc" -le 1 ] || exit "$rc"

  maintenance:check-versions-json:
    desc: Check all versions and output as JSON
    env:
      GITHUB_TOKEN: op://Homelab/GitHub Token/credential
    preconditions: *check_versions_preconditions
    cmds:
      # Same out-of-band rc handling as check-versions; stdout stays pure JSON.
      - |
        rc_file=$(mktemp)
        trap 'rm -f "$rc_file"' EXIT
        op run -- sh -c 'python3 ./scripts/check-versions.py --json {{.CLI_ARGS}}; echo $? > '"$rc_file" || true
        rc=$(cat "$rc_file" 2>/dev/null || true)
        if [ -z "$rc" ]; then
          echo "ERROR: check-versions.py did not run to completion (op run / interpreter failure above)" >&2
          exit 2
        fi
        [ "$rc" -le 1 ] || exit "$rc"

  maintenance:update-version:
    desc: "Update a single service version in all.yml + regenerate ConfigMap (task maintenance:update-version SERVICE=gluetun)"
    vars:
      SERVICE: '{{.SERVICE | default ""}}'
    env:
      GITHUB_TOKEN: op://Homelab/GitHub Token/credential
    cmds:
      - |
        SERVICE="{{.SERVICE}}"
        if [ -z "$SERVICE" ]; then
          echo "Usage: task maintenance:update-version SERVICE=<name>"
          echo ""
          echo "Available services:"
          op run -- python3 ./scripts/check-versions.py --list
          exit 1
        fi
        op run -- python3 ./scripts/check-versions.py --update "$SERVICE"
      - task: flux:sync-versions
      - echo "all.yml + versions-configmap.yaml updated. Commit both and raise MR."

  maintenance:update-all-versions:
    desc: Update all outdated service versions in all.yml + regenerate ConfigMap
    env:
      GITHUB_TOKEN: op://Homelab/GitHub Token/credential
    cmds:
      - op run -- python3 ./scripts/check-versions.py --update-all
      - task: flux:sync-versions
      - echo "all.yml + versions-configmap.yaml updated. Commit both and raise MR."

  maintenance:update-cluster:
    desc: Complete k3s cluster update (nodes + version bump + Flux reconcile)
    cmds:
      - echo "==================================="
      - echo "K3s Cluster Full Update"
      - echo "==================================="
      - echo ""
      - echo "Phase 1 - Update k3s binaries on nodes (rolling)"
      - task: maintenance:update-k3s-nodes
      - echo ""
      - echo "Phase 2 - Check for new versions across managed services"
      - task: maintenance:check-versions
      - echo ""
      - echo "Phase 3 - Bump all outdated versions in all.yml"
      - task: maintenance:update-all-versions
      - echo ""
      - echo "Phase 4 - Regenerate cluster-versions ConfigMap from all.yml"
      - task: flux:sync-versions
      - echo ""
      - 'echo "NOTE - commit + push all.yml and versions-configmap.yaml so Flux"'
      - echo "reconciles the new versions into the cluster."
      - echo ""
      - echo "==================================="
      - echo "Cluster update staging complete."
      - echo "==================================="
      - echo ""
      - echo "Verify cluster status with 'task flux:status'"

  # === Disaster Recovery Tasks ===
  disaster-recovery:storage-bootstrap:
    desc: Bootstrap storage from scratch (INTERACTIVE - for disaster recovery only)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      SAMBA_NAS_PASSWORD: op://Homelab/Samba NAS User/password
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/bootstrap/storage-bootstrap.yml --limit pve-nas-01 {{.CLI_ARGS}}

  # === Proxmox Management Tasks ===
  proxmox:configure-autostart:
    desc: Configure autostart and boot order for existing VMs/containers (one-time setup)
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i {{.INVENTORY}} playbooks/proxmox-enable-autostart.yml {{.CLI_ARGS}}

  proxmox:ha:
    desc: Configure Proxmox HA rules, resources, and storage replication
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i {{.INVENTORY}} playbooks/proxmox-ha.yml {{.CLI_ARGS}}

  proxmox:ha-check:
    desc: Check mode - show what Proxmox HA configuration would change
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i {{.INVENTORY}} playbooks/proxmox-ha.yml --check --diff {{.CLI_ARGS}}

  proxmox:ha-status:
    desc: Show Proxmox HA and replication status
    cmds:
      # First verify we can reach at least one Proxmox host
      - |
        # First-reachable Proxmox host via the shared helper. Bare hostnames
        # (no user@) so ssh-config resolves the login user, as before.
        # shellcheck disable=SC2086
        REACHABLE_HOST=$(scripts/find-reachable-host.sh {{.PVE_HOSTS}}) || {
          echo "ERROR: Cannot reach any Proxmox host"
          exit 1
        }
        echo "Connected to cluster via $REACHABLE_HOST"
        echo ""
        echo "=== HA Manager Status ==="
        ssh -o BatchMode=yes "$REACHABLE_HOST" "sudo ha-manager status" 2>/dev/null || echo "(No HA manager status available)"
        echo ""
        echo "=== HA Resources ==="
        OUTPUT=$(ssh -o BatchMode=yes "$REACHABLE_HOST" "sudo ha-manager config" 2>/dev/null | grep -E '^(ct|vm):' || true)
        if [ -n "$OUTPUT" ]; then
          echo "$OUTPUT"
        else
          echo "(No HA resources configured)"
        fi
        echo ""
        # Note: ha-manager rules list requires Proxmox 9+
        echo "=== HA Rules (Node Affinity) ==="
        ssh -o BatchMode=yes "$REACHABLE_HOST" "sudo ha-manager rules list" 2>/dev/null || echo "(No HA rules configured or Proxmox < 9)"
        echo ""
        echo "=== Storage Replication Jobs ==="
        ssh -o BatchMode=yes "$REACHABLE_HOST" "sudo pvesr list" 2>/dev/null || echo "(No replication jobs configured)"
      - echo ""
      # Replication status must be checked on source nodes (pve-nas-01 is not a source)
      - echo "=== Replication Status (all source nodes) ==="
      - |
        # Source nodes = all PVE hosts except pve-nas-01 (replication targets it).
        for host in {{.PVE_HOSTS}}; do
          [ "$host" = "pve-nas-01" ] && continue
          echo "--- $host ---"
          if ssh -o ConnectTimeout=2 -o BatchMode=yes "$host" "true" 2>/dev/null; then
            ssh -o BatchMode=yes "$host" "sudo pvesr status" 2>/dev/null || echo "(No replication status)"
          else
            echo "(Cannot reach $host)"
          fi
          echo ""
        done

  # === Terraform Tasks ===
  # State stored in GitLab-managed Terraform state (HTTP backend)
  # CI uses CI_JOB_TOKEN (automatic), local uses project access token from 1Password
  #
  # Every module is addressed by a `terraform:<module>-*` name. The unprefixed
  # terraform:init/plan/apply are ALIASES for the cloudflare ones, kept because
  # the docs and README wrappers use them — the prefixed names are canonical, so
  # the module a command targets is never implicit.
  terraform:cloudflare-init:
    desc: Initialize Terraform for the cloudflare DNS module (GitLab state backend)
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    # Anchor shared by the cloudflare init/plan/apply tasks — the GitLab state backend
    # (GITLAB_PROJECT_ID defined in top-level vars) + Cloudflare vars live in
    # one place. terraform init ignores the TF_VAR_* values, and op run
    # resolves them from the same vault the shared preconditions require.
    env: &tf_state_env
      TF_VAR_cloudflare_api_token: op://Homelab/Cloudflare Terraform Token/credential
      TF_VAR_cloudflare_account_id: op://Homelab/Cloudflare Terraform Token/username
      TF_HTTP_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/cloudflare"
      TF_HTTP_LOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/cloudflare/lock"
      TF_HTTP_UNLOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/cloudflare/lock"
      TF_HTTP_USERNAME: "terraform"
      TF_HTTP_PASSWORD: "op://Homelab/GitLab Terraform State Token/credential"
      TF_HTTP_LOCK_METHOD: "POST"
      TF_HTTP_UNLOCK_METHOD: "DELETE"
    # Anchor shared by the cloudflare plan/apply tasks (same terraform + op-auth checks).
    preconditions: &tf_preconditions
      - sh: command -v terraform
        msg: "terraform is not installed. Install via: https://www.terraform.io/downloads"
      - sh: command -v op
        msg: "1Password CLI is not installed"
      # `op account list`, not `op whoami` — see the note on infra:deploy's preconditions.
      - sh: op account list 2>/dev/null
        msg: "1Password CLI not authenticated. Run: eval $(op signin)"
    cmds:
      - op run -- terraform init {{.CLI_ARGS}}

  terraform:cloudflare-plan:
    desc: Plan cloudflare DNS changes
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    env: *tf_state_env
    preconditions: *tf_preconditions
    cmds:
      - op run -- terraform plan {{.CLI_ARGS}}

  terraform:cloudflare-apply:
    desc: Apply cloudflare DNS changes (interactive confirm; CI also auto-applies on main)
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    env: *tf_state_env
    preconditions: *tf_preconditions
    cmds:
      - op run -- terraform apply {{.CLI_ARGS}}

  # Unprefixed aliases for the cloudflare module — see the note above.
  terraform:init:
    desc: "Alias for terraform:cloudflare-init"
    cmds:
      - task: terraform:cloudflare-init
        vars: {CLI_ARGS: "{{.CLI_ARGS}}"}

  terraform:plan:
    desc: "Alias for terraform:cloudflare-plan"
    cmds:
      - task: terraform:cloudflare-plan
        vars: {CLI_ARGS: "{{.CLI_ARGS}}"}

  terraform:apply:
    desc: "Alias for terraform:cloudflare-apply"
    cmds:
      - task: terraform:cloudflare-apply
        vars: {CLI_ARGS: "{{.CLI_ARGS}}"}

  # --- Tailscale ACL module (separate state name; SUPERVISED apply) ---
  # Mirrors the cloudflare terraform:* tasks but points at terraform/tailscale,
  # its own GitLab state name (does not collide with cloudflare), and the
  # Tailscale OAuth creds (scope acl). apply is a supervised operator step — a
  # bad ACL can sever tailnet/SSH. See terraform/tailscale/README.md.
  terraform:tailscale-init:
    desc: Initialize Terraform for the tailscale ACL module (GitLab state backend)
    dir: "{{.TERRAFORM_DIR}}/tailscale"
    # Anchor shared by terraform:tailscale-init/plan/apply — Tailscale OAuth vars
    # + the tailscale-specific HTTP state name in one place.
    env: &tf_tailscale_env
      TF_VAR_tailscale_oauth_client_id: op://Homelab/Tailscale OAuth/client id
      TF_VAR_tailscale_oauth_client_secret: op://Homelab/Tailscale OAuth/credential
      TF_HTTP_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/tailscale"
      TF_HTTP_LOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/tailscale/lock"
      TF_HTTP_UNLOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/tailscale/lock"
      TF_HTTP_USERNAME: "terraform"
      TF_HTTP_PASSWORD: "op://Homelab/GitLab Terraform State Token/credential"
      TF_HTTP_LOCK_METHOD: "POST"
      TF_HTTP_UNLOCK_METHOD: "DELETE"
    preconditions: *tf_preconditions
    cmds:
      - op run -- terraform init {{.CLI_ARGS}}

  terraform:tailscale-plan:
    desc: "Plan tailscale ACL changes (review the diff vs the live tailnet ACL)"
    dir: "{{.TERRAFORM_DIR}}/tailscale"
    env: *tf_tailscale_env
    preconditions: *tf_preconditions
    cmds:
      - op run -- terraform plan {{.CLI_ARGS}}

  terraform:tailscale-apply:
    desc: "SUPERVISED: apply the tailscale ACL — overwrites the live tailnet ACL; read terraform/tailscale/README.md and complete the pre-apply checklist first. Do NOT pass -auto-approve."
    dir: "{{.TERRAFORM_DIR}}/tailscale"
    env: *tf_tailscale_env
    preconditions: *tf_preconditions
    cmds:
      # Hard guard: a bad tailnet ACL can sever SSH/tailnet, so the apply MUST be
      # supervised (review the plan, type `yes`). Refuse -auto-approve so the plan
      # review cannot be bypassed by an errant flag / copy-paste.
      - |
        case " {{.CLI_ARGS}} " in
          *-auto-approve*)
            echo "Refusing -auto-approve: the Tailscale ACL apply is supervised. Review the plan and type 'yes'." >&2
            exit 1
            ;;
        esac
        op run -- terraform apply {{.CLI_ARGS}}

  # --- Authentik SSO module (separate state name; SUPERVISED apply) ---
  # Mirrors the cloudflare/tailscale terraform:* tasks but points at
  # terraform/authentik, its own GitLab state name, and the authentik API
  # token + per-provider OAuth2 client secrets (the same 1Password items the
  # apps consume). Changing an OAuth2/SAML provider can break a login, so read the
  # plan before confirming — the same care terraform:cloudflare-apply takes, not a
  # separate ceremony.
  terraform:authentik-init:
    desc: Initialize Terraform for the authentik SSO module (GitLab state backend)
    dir: "{{.TERRAFORM_DIR}}/authentik"
    # Anchor shared by terraform:authentik-init/plan/import/apply — authentik API
    # token + OAuth2 client secrets + the authentik-specific HTTP state name
    # in one place.
    env: &tf_authentik_env
      TF_VAR_authentik_token: op://Homelab/Authentik Terraform Token/credential
      TF_VAR_oauth2_client_secret_mealie: op://Homelab/Mealie SSO/oidc-client-secret
      TF_VAR_oauth2_client_secret_bar_assistant: op://Homelab/Bar Assistant SSO/authentik-client-secret
      TF_VAR_oauth2_client_secret_home_assistant: op://Homelab/Home Assistant SSO/authentik-client-secret
      TF_VAR_oauth2_client_secret_grafana: op://Homelab/Grafana SSO/oidc-client-secret
      TF_VAR_oauth2_client_secret_nextcloud: op://Homelab/Nextcloud SSO/client-secret
      TF_VAR_oauth2_client_secret_immich: op://Homelab/Immich SSO/client-secret
      TF_VAR_oauth2_client_secret_hermes_dashboard: op://Homelab/Hermes Secrets/hermes-dashboard-oidc-client-secret
      TF_VAR_oauth2_client_secret_homarr: op://Homelab/Homarr SSO/client-secret
      TF_VAR_basic_auth_nzbget_username: op://Homelab/NZBGet/username
      TF_VAR_basic_auth_nzbget_password: op://Homelab/NZBGet/password
      TF_VAR_basic_auth_adguard_username: op://Homelab/AdGuard Home/username
      TF_VAR_basic_auth_adguard_password: op://Homelab/AdGuard Home/password
      TF_HTTP_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/authentik"
      TF_HTTP_LOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/authentik/lock"
      TF_HTTP_UNLOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/authentik/lock"
      TF_HTTP_USERNAME: "terraform"
      TF_HTTP_PASSWORD: "op://Homelab/GitLab Terraform State Token/credential"
      TF_HTTP_LOCK_METHOD: "POST"
      TF_HTTP_UNLOCK_METHOD: "DELETE"
    preconditions: *tf_preconditions
    cmds:
      - op run -- terraform init {{.CLI_ARGS}}

  terraform:authentik-plan:
    desc: "Plan authentik SSO changes (read-only diff vs the live authentik objects)"
    dir: "{{.TERRAFORM_DIR}}/authentik"
    env: *tf_authentik_env
    preconditions: *tf_preconditions
    cmds:
      - op run -- terraform plan {{.CLI_ARGS}}

  terraform:authentik-apply:
    desc: "SUPERVISED: apply authentik SSO changes (applications/providers/groups) — review terraform:authentik-plan first"
    dir: "{{.TERRAFORM_DIR}}/authentik"
    env: *tf_authentik_env
    preconditions: *tf_preconditions
    cmds:
      # Hard guard: this module owns every SSO application/provider, so an
      # unreviewed apply can lock the estate out of Authentik. Interactive
      # confirmation, and never -auto-approve (terraform's own prompt is the
      # second gate). CI never runs this task — SSO changes are operator-driven.
      - |
        set -eu
        if [ ! -t 0 ]; then
          echo "ERROR: terraform:authentik-apply is a supervised operator step; run it from a terminal." >&2
          exit 2
        fi
        # Unanchored — see terraform:unifi-apply for why the space-delimited
        # form lets `-auto-approve=true` through.
        case " {{.CLI_ARGS}} " in
          *auto-approve*)
            echo "ERROR: -auto-approve is refused here; approve the plan interactively." >&2
            exit 2 ;;
        esac
        echo "About to apply terraform/authentik — this rewrites live SSO applications, providers and groups."
        printf 'Type "apply" to continue: '
        read -r confirm
        [ "$confirm" = "apply" ] || { echo "Aborted."; exit 1; }
      - op run -- terraform apply {{.CLI_ARGS}}

  terraform:authentik-import:
    desc: "One-time/DR state bootstrap: terraform-import every resource in imports.tf (read-only against the API; writes only Terraform state)"
    dir: "{{.TERRAFORM_DIR}}/authentik"
    env: *tf_authentik_env
    preconditions: *tf_preconditions
    cmds:
      - op run -- ./import.sh

  # --- UniFi network module (separate state name; SUPERVISED apply) ---
  # Mirrors the tailscale/authentik terraform:* tasks but points at
  # terraform/unifi, its own GitLab state name, and the UniFi controller API key
  # plus the four SSID pre-shared keys (the 1Password items docs/46 has the
  # operator create on the bench). This module owns the VLANs, the zone firewall
  # and the WLANs: an unreviewed apply can take the whole house off the network
  # and leave no path back to the controller, so read the plan before
  # confirming. See terraform/unifi/README.md.
  terraform:unifi-init:
    desc: Initialize Terraform for the UniFi network module (GitLab state backend)
    dir: "{{.TERRAFORM_DIR}}/unifi"
    # Anchor shared by terraform:unifi-init/plan/apply — the controller
    # credentials, the per-SSID passphrases and the unifi-specific HTTP state
    # name in one place. Each SSID is its own variable because one TF_VAR cannot
    # carry four separate op:// references; adding a WLAN adds a line here AND
    # in the unifi-drift-plan job (terraform/unifi/README.md § Adding a VLAN).
    # TF_VAR_unifi_api_url is the PRODUCTION gateway address — while the gateway
    # is still on the bench, override it per invocation rather than editing the
    # 1Password item (docs/46 § Bench pre-provisioning).
    env: &tf_unifi_env
      TF_VAR_unifi_api_url: op://Homelab/UniFi Controller/url
      TF_VAR_unifi_api_key: op://Homelab/UniFi Controller/api-key
      TF_VAR_wlan_passphrase_home: op://Homelab/WiFi TheRevengers/password
      TF_VAR_wlan_passphrase_iot: op://Homelab/WiFi 3601-IoT/password
      TF_VAR_wlan_passphrase_guest: op://Homelab/WiFi kugel-tikka-masala/password
      TF_VAR_wlan_passphrase_work: op://Homelab/WiFi 3601-Work/password
      TF_HTTP_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/unifi"
      TF_HTTP_LOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/unifi/lock"
      TF_HTTP_UNLOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/{{.GITLAB_PROJECT_ID}}/terraform/state/unifi/lock"
      TF_HTTP_USERNAME: "terraform"
      TF_HTTP_PASSWORD: "op://Homelab/GitLab Terraform State Token/credential"
      TF_HTTP_LOCK_METHOD: "POST"
      TF_HTTP_UNLOCK_METHOD: "DELETE"
    preconditions: *tf_preconditions
    cmds:
      - op run -- terraform init {{.CLI_ARGS}}

  terraform:unifi-plan:
    desc: "Plan UniFi network changes (read-only diff vs the live controller: networks, zones, policies, WLANs)"
    dir: "{{.TERRAFORM_DIR}}/unifi"
    env: *tf_unifi_env
    preconditions: *tf_preconditions
    cmds:
      - op run -- terraform plan {{.CLI_ARGS}}

  terraform:unifi-apply:
    desc: "SUPERVISED: apply UniFi network changes (VLANs/zones/firewall policies/WLANs) — review terraform:unifi-plan first"
    dir: "{{.TERRAFORM_DIR}}/unifi"
    env: *tf_unifi_env
    preconditions: *tf_preconditions
    cmds:
      # Hard guard: this module owns every VLAN, the zone-based firewall and the
      # SSIDs, so an unreviewed apply can sever routing to the controller itself
      # (recovery is then physical). Interactive confirmation, and never
      # -auto-approve (terraform's own prompt is the second gate). CI never runs
      # this task — unifi-drift-plan plans and stops.
      - |
        set -eu
        if [ ! -t 0 ]; then
          echo "ERROR: terraform:unifi-apply is a supervised operator step; run it from a terminal." >&2
          exit 2
        fi
        # Unanchored on purpose: Task shell-quotes each CLI arg before
        # interpolation, so a space-delimited pattern misses the equally valid
        # `-auto-approve=true` (it renders as '-auto-approve=true', quotes and
        # all). Matches terraform:tailscale-apply.
        case " {{.CLI_ARGS}} " in
          *auto-approve*)
            echo "ERROR: -auto-approve is refused here; approve the plan interactively." >&2
            exit 2 ;;
        esac
        echo "About to apply terraform/unifi — this rewrites live VLANs, firewall zones/policies and WLANs."
        printf 'Type "apply" to continue: '
        read -r confirm
        [ "$confirm" = "apply" ] || { echo "Aborted."; exit 1; }
      - op run -- terraform apply {{.CLI_ARGS}}

  terraform:unifi-import:
    desc: "One-time/DR state bootstrap: terraform-import one pre-existing controller object (read-only against the API; writes only Terraform state) — usage: task terraform:unifi-import -- <address> <id>"
    dir: "{{.TERRAFORM_DIR}}/unifi"
    env: *tf_unifi_env
    preconditions: *tf_preconditions
    cmds:
      # No import.sh counterpart to authentik's: that root imports a fixed
      # inventory from imports.tf, while the UniFi ids are read off the live
      # controller one object at a time, so the address and id arrive as
      # CLI_ARGS. The ordered sequence — Default network first, then the rest —
      # is terraform/unifi/README.md § Adopting the live site.
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task terraform:unifi-import -- <address> <id>"
          echo "Example: task terraform:unifi-import -- 'module.network.unifi_network.this[\"default\"]' name=Default"
          exit 1
        fi
      - op run -- terraform import {{.CLI_ARGS}}

  terraform:unifi-state:
    desc: "Run a `terraform state` subcommand against the UniFi state (state surgery / read-only state inspection) — usage: task terraform:unifi-state -- show <address>"
    dir: "{{.TERRAFORM_DIR}}/unifi"
    env: *tf_unifi_env
    preconditions: *tf_preconditions
    cmds:
      # `state list/show/rm` never touch the controller, but they DO read the
      # GitLab HTTP state backend, whose credentials live only in this env
      # anchor — `terraform init` does not persist TF_HTTP_USERNAME/PASSWORD, so
      # a bare `op run -- terraform state ...` answers 401. The `state`
      # subcommand is HARDCODED below: a generic terraform passthrough would
      # let `apply`/`destroy` run with these credentials and WITHOUT
      # terraform:unifi-apply's supervised guard. `state rm` stops
      # managing an object and leaves it live (terraform/unifi/README.md
      # § Guardrails); `state show` is the only way to read a module-internal
      # address (docs/46 zone probe).
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task terraform:unifi-state -- <state subcommand> [args]"
          echo "Example: task terraform:unifi-state -- show 'module.network.data.unifi_firewall_zone.builtin[\"internal\"]'"
          exit 1
        fi
      - op run -- terraform state {{.CLI_ARGS}}

  # --- Backblaze B2 offsite-backup bucket settings (raw API; SUPERVISED apply) ---
  # scripts/b2-bucket-drift.py is the codified bucket config (it replaced the
  # terraform/b2 module after the Backblaze provider's READ path went blind
  # against B2's current API and terraform plan reported a permanent phantom
  # diff). Same 1Password item the restic_offsite role consumes; apply is a
  # supervised operator step — a bad lifecycle rule could start expiring
  # backup data.
  b2:drift:
    desc: "Drift-check the B2 backup bucket settings against scripts/b2-bucket-drift.py (read-only)"
    # Anchor shared by b2:drift/apply — the bucket-settings app key.
    env: &b2_env
      B2_APPLICATION_KEY_ID: op://Homelab/B2 Archive Backup/b2_key_id
      B2_APPLICATION_KEY: op://Homelab/B2 Archive Backup/b2_application_key
    preconditions: &b2_preconditions
      - sh: command -v op
        msg: "1Password CLI is not installed"
      # `op account list`, not `op whoami` — see the note on infra:deploy's preconditions.
      - sh: op account list 2>/dev/null
        msg: "1Password CLI not authenticated. Run: eval $(op signin)"
    cmds:
      - op run -- python3 scripts/b2-bucket-drift.py --config scripts/b2-bucket.json

  b2:apply:
    desc: "SUPERVISED: reconcile the B2 bucket to the codified settings — review the drift output first; a bad lifecycle rule can expire backup data"
    env: *b2_env
    preconditions: *b2_preconditions
    cmds:
      - op run -- python3 scripts/b2-bucket-drift.py --config scripts/b2-bucket.json --apply

  terraform:validate:
    desc: Validate Terraform configuration (alias for validate-local)
    cmds:
      - task: terraform:validate-local

  terraform:fmt:
    desc: Format Terraform files (all modules)
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      # Run from terraform/ so -recursive covers every module (cloudflare +
      # tailscale + authentik + unifi), matching the CI terraform-fmt job.
      - terraform fmt -recursive

  terraform:fmt-check:
    desc: Check Terraform formatting (all modules)
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - terraform fmt -check -recursive

  terraform:validate-local:
    desc: Validate Terraform syntax for every module (no backend auth required)
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - |
        set -euo pipefail
        # Validate every module under terraform/ (mirrors the CI
        # terraform-validate job). Isolated data dir per module so
        # backend-free init doesn't corrupt real state.
        TMP_ROOT="$(mktemp -d)" || { echo "ERROR: failed to create temp Terraform data dir"; exit 1; }
        trap 'rm -rf "$TMP_ROOT"' EXIT
        for mod in */; do
          [ -f "${mod}versions.tf" ] || continue
          echo "=== terraform validate ${mod} ==="
          TF_DATA_DIR="$TMP_ROOT/${mod%/}"
          mkdir -p "$TF_DATA_DIR"
          ( cd "$mod" \
            && TF_DATA_DIR="$TF_DATA_DIR" terraform init -backend=false -input=false > /dev/null \
            && TF_DATA_DIR="$TF_DATA_DIR" terraform validate )
        done

  # === Utility Tasks ===
  collect-state:
    desc: Collect redacted cluster state
    cmds:
      - ./scripts/collect-state.sh {{.CLI_ARGS}}

  diagnose:network:
    desc: "Network-instability diagnostics across all hosts (cluster/HA/ARP/bond/corosync/kube-vip/MetalLB — docs/34)"
    cmds:
      - bash scripts/diagnose-network-issues.sh {{.CLI_ARGS}}

  lint:
    desc: Run all linters (no auth required) — mirrors the CI lint stage
    cmds:
      - task: ansible:lint
      - task: terraform:fmt-check
      - task: terraform:validate-local
      - task: flux:lint
      - task: lint:shellcheck
      - task: lint:ruff
      - task: lint:yamllint
      - task: lint:coverage-checks
      - task: lint:sync-checks
      - task: lint:flux-version-pin
      - task: lint:kubectl-version-pin
      - task: lint:busybox-version-pin
      - task: lint:ci-policy
      - task: lint:netpol-except-parity
      - task: lint:cluster-literals
      - task: lint:tailscale-policy
      - task: lint:doc-links
      - task: lint:taskfile-smoke
      # promtool/amtool gate — CI runs it as prometheus-config-lint, so leaving
      # it out of `lint` meant a clean local run could still red the pipeline.
      - task: lint:prometheus-config
      # scripts:test runs LAST, and deliberately so — it is NOT weakened here,
      # only re-ordered. Its vendored-byte-identity arm is red BY DESIGN in the
      # window between a weisssrv-lib change and the pin bump that adopts it,
      # and go-task stops the whole list at the first failing command. Sitting
      # fifth, that known-temporary red meant every gate after it never ran, so
      # a real regression in any of them could hide behind it until the bump
      # landed. Invoked through the shell rather than `- task:` so the failure
      # can name its own resolution instead of go-task's bare exit line.
      - |
        task scripts:test || {
          echo ""
          echo "ERROR: scripts:test failed — see the pytest output above."
          echo "  If the failing case is"
          echo "  test_vendored_byte_identity::test_registered_copies_are_reconciled,"
          echo "  this is the EXPECTED state between a weisssrv-lib change and the pin"
          echo "  bump that adopts it. Resolution: bump variables.WEISSSRV_LIB_REF in"
          echo "  .gitlab-ci.yml, run scripts/check-lib-pins.py --fix, and bump the"
          echo "  collection version: in ansible/requirements.yml (CLAUDE.md § Repo"
          echo "  family). ANY OTHER failure here is a real regression."
          echo "  Every other lint gate has already run above."
          exit 1
        }

  lint:shellcheck:
    desc: ShellCheck scripts/*.sh and terraform/*/*.sh (mirrors the CI shellcheck job)
    preconditions:
      - sh: command -v shellcheck
        msg: "shellcheck not installed. brew install shellcheck"
    cmds:
      # Exactly the CI shellcheck job's direct_globs
      # (`scripts/*.sh terraform/*/*.sh`, find_dir empty). ansible/*.sh is gone —
      # the roles' shell moved to the weisssrv.infra collection, where the
      # library's own pipeline shellchecks it along with the *.sh.j2 templates.
      - shellcheck --severity=warning --exclude=SC1091,SC2034 scripts/*.sh
      - shellcheck --severity=warning --exclude=SC1091,SC2034 terraform/*/*.sh

  lint:ruff:
    desc: Ruff over scripts/ and the in-manifest Python (mirrors the CI python-lint job)
    preconditions:
      - sh: command -v ruff
        msg: "ruff not installed. pip install ruff"
    cmds:
      # `scripts kubernetes` and `--config ruff.toml` are verbatim the CI
      # python-lint include's `targets` / `config` inputs. Directory form, not a
      # file list: ruff resolves its own excludes when it walks a directory, and
      # explicitly-named files bypass them. kubernetes/ is in scope because two
      # real programs ship inside manifests (gitlab-runner-reaper,
      # cloudflare-ddns) as ConfigMap-mounted files.
      - ruff check --config ruff.toml scripts kubernetes

  lint:yamllint:
    desc: Baseline YAML syntax check (mirrors CI yaml-lint job, plus Taskfile.yml)
    preconditions:
      - sh: command -v yamllint
        msg: "yamllint not installed. pip install yamllint"
    cmds:
      # Same target set as the CI yaml-lint include, plus Taskfile.yml, which
      # CI does not lint.
      - yamllint -d relaxed ansible/
      - yamllint -d relaxed kubernetes/
      - yamllint -d relaxed .gitlab-ci.yml
      - yamllint -d relaxed .gitlab/
      - yamllint -d relaxed Taskfile.yml

  lint:coverage-checks:
    desc: Deploy-coverage, integration-matrix and backup-artifact-app gates (mirror the CI lint stage)
    preconditions:
      - sh: python3 -c "import yaml" 2>/dev/null
        msg: "PyYAML not installed (pip install pyyaml)"
    cmds:
      - bash scripts/check-deploy-coverage.sh
      - python3 scripts/check-deploy-host-coverage.py
      # CI_FILE: the matrix lives in its own included file, so its `changes:`
      # trigger can name a file that only it lives in.
      - CI_FILE=.gitlab/ci/integration-jobs.yml bash scripts/check-integration-matrix-coverage.sh
      # The NAS-side collector's app list (host_vars) and BackupArtifactStale's
      # per-app absent() arms (Flux-reconciled rule) are edited on separate
      # lifecycles; nothing else notices when they diverge. Both paths are
      # arguments because the script is vendored from weisssrv-lib — which side
      # of the pair lives where is site layout.
      - >-
        python3 scripts/check-backup-artifact-apps.py
        --host-vars ansible/inventories/prod/host_vars/pve-nas-01.yml
        --rules kubernetes/infrastructure/observability/rules/scripts.yaml
      # A role FQCN passed to a systemd/service task resolves to a unit that
      # does not exist, and `failed_when: false` turns that into a permanent
      # silent no-op. ansible-lint checks module ARGUMENTS, not unit names.
      - python3 scripts/check-ansible-service-names.py

  lint:tailscale-policy:
    desc: Validate terraform/tailscale/policy.hujson (syntax, tag declarations, route approvals)
    cmds:
      # The module reads policy.hujson with file(), so terraform fmt/validate
      # never parse it and the only other reader is the Tailscale API during the
      # supervised apply — the one place a stray comma, an undeclared tag or an
      # un-approved subnet route must not be discovered. Run from CI's
      # repo-policy-checks through `task`, so there is one copy of this code.
      - python3 scripts/check-tailscale-policy.py

  lint:sync-checks:
    desc: Generated-file freshness (hosts.env, versions-configmap) — mirrors the CI repo-sync-checks job
    preconditions:
      - sh: python3 -c "import yaml" 2>/dev/null
        msg: "PyYAML not installed (pip install pyyaml)"
    cmds:
      # Both generators write in place, so each check saves the committed file,
      # re-runs its sync task, diffs, and restores from an EXIT trap — without
      # the trap a generator that exits non-zero leaves the TRACKED file
      # regenerated or truncated. (EXIT only: go-task's shell rejects INT/TERM.)
      - |
        set -eu
        overall=0
        check_sync() {
          target="$1"; fixup="$2"
          committed=$(mktemp); generated=$(mktemp)
          cp "$target" "$committed"
          trap 'cp "$committed" "$target" 2>/dev/null || true; rm -f "$committed" "$generated"' EXIT
          $fixup
          cp "$target" "$generated"
          cp "$committed" "$target"
          if ! diff -q "$committed" "$generated" >/dev/null 2>&1; then
            echo "ERROR: $target is out of sync with its source"
            echo "Run: $fixup and commit the result."
            diff -u "$committed" "$generated" || true
            overall=1
          else
            echo "$target is in sync"
          fi
          rm -f "$committed" "$generated"
          # Disarm: the restore window is closed, and leaving it armed would run
          # a cp from an already-deleted temp on normal shell exit.
          trap - EXIT
        }
        check_sync scripts/hosts.env "task hosts:sync"
        check_sync kubernetes/infrastructure/sources/versions-configmap.yaml "task flux:sync-versions"
        exit "$overall"

  lint:flux-version-pin:
    desc: Check the deploy-verify FLUX_VERSION pin against versions-configmap (mirrors the flux-version-pin check in CI repo-policy-checks)
    cmds:
      - |
        set -eu
        PIN=$(sed -n 's/^ *FLUX_VERSION="\([0-9.]*\)"$/\1/p' .gitlab-ci.yml | head -1)
        CM=$(sed -n 's/^ *flux_version: *//p' kubernetes/infrastructure/sources/versions-configmap.yaml | head -1)
        echo "deploy-verify FLUX_VERSION pin: ${PIN:-<not found>} / versions-configmap flux_version: ${CM:-<not found>}"
        [ -n "$PIN" ] || { echo "Could not extract FLUX_VERSION pin from .gitlab-ci.yml"; exit 1; }
        [ -n "$CM" ] || { echo "Could not extract flux_version from versions-configmap.yaml"; exit 1; }
        [ "$PIN" = "$CM" ] || { echo "FLUX_VERSION pin (${PIN}) drifted from versions-configmap flux_version (${CM}) — bump the deploy-verify version + sha256 pair in .gitlab-ci.yml"; exit 1; }

  lint:kubectl-version-pin:
    desc: Check the CI kubectl pin stays within +/-1 minor of k3s_version (mirrors the kubectl-version-pin check in CI repo-policy-checks)
    cmds:
      - python3 scripts/check-kubectl-version-pin.py
    preconditions:
      - sh: command -v python3
        msg: "python3 not installed"

  lint:busybox-version-pin:
    desc: Check post-maintenance-verify.sh's busybox image against busybox_version in all.yml
    cmds:
      - |
        set -eu
        # The DNS probe is a plain kubectl run, so it cannot use Flux's
        # ${busybox_version} substitution — this gate is what keeps it in step.
        PIN=$(sed -n 's/.*--image=busybox:\([0-9.]*\).*/\1/p' scripts/post-maintenance-verify.sh | head -1)
        AV=$(sed -n 's/^busybox_version: *"\{0,1\}\([0-9.]*\)"\{0,1\} *$/\1/p' ansible/inventories/prod/group_vars/all.yml | head -1)
        echo "post-maintenance-verify busybox: ${PIN:-<not found>} / all.yml busybox_version: ${AV:-<not found>}"
        [ -n "$PIN" ] || { echo "Could not extract the busybox image pin from scripts/post-maintenance-verify.sh"; exit 1; }
        [ -n "$AV" ] || { echo "Could not extract busybox_version from group_vars/all.yml"; exit 1; }
        [ "$PIN" = "$AV" ] || { echo "busybox pin (${PIN}) drifted from busybox_version (${AV}) — bump scripts/post-maintenance-verify.sh"; exit 1; }

  lint:cluster-literals:
    desc: "Cluster identity is cluster-config placeholders, not literals — and that ConfigMap matches the Ansible inventory"
    preconditions:
      - sh: python3 -c "import yaml" 2>/dev/null
        msg: "PyYAML not installed (pip install pyyaml)"
    cmds:
      - python3 scripts/check-cluster-literals.py

  lint:ci-policy:
    desc: "CI-file policy: deploy jobs trigger on the collection pin, and include-input pins match variables: (mirrors the collection-pin-trigger + ci-pin-parity checks in CI repo-policy-checks)"
    preconditions:
      - sh: python3 -c "import yaml" 2>/dev/null
        msg: "PyYAML not installed (pip install pyyaml)"
    cmds:
      # Both gates fire only on a .gitlab-ci.yml edit — exactly the change where
      # a green `task lint` is most likely to be taken as proof the pipeline is
      # clean. They live in scripts/ so this task and repo-policy-checks run the
      # same code rather than two copies of it.
      - python3 scripts/check-collection-pin-trigger.py
      - bash scripts/check-ci-pin-parity.sh

  lint:netpol-except-parity:
    desc: Assert every NetworkPolicy RFC1918 except-list matches the substituted source
    cmds:
      - python3 scripts/check-netpol-except-parity.py --config scripts/netpol-except.yaml
    preconditions:
      - sh: python3 -c "import yaml" 2>/dev/null
        msg: "PyYAML not installed (pip install pyyaml)"

  lint:doc-links:
    desc: Resolve relative Markdown cross-links in docs/ + top-level READMEs (mirrors CI docs-link-check)
    cmds:
      - python3 scripts/check-doc-links.py
    preconditions:
      - sh: command -v python3
        msg: "python3 not installed"

  lint:taskfile-smoke:
    desc: Assert every Taskfile-referenced script + the hosts.env dotenv target exists (mirrors the taskfile check in CI repo-policy-checks)
    cmds:
      - bash scripts/check-taskfile.sh

  lint:prometheus-config:
    desc: Validate kube-prometheus alert rules + Alertmanager config (promtool/amtool; mirrors CI prometheus-config-lint)
    preconditions:
      - sh: command -v promtool
        msg: "promtool not installed (ships in the prometheus release tarball)"
      - sh: command -v amtool
        msg: "amtool not installed (ships in the alertmanager release tarball)"
      - sh: python3 -c "import yaml" 2>/dev/null
        msg: "PyYAML not installed (pip install pyyaml)"
    cmds:
      - bash scripts/lint-prometheus-config.sh
      # Syntax vs behaviour: check-config proves the file parses, this proves
      # where each alert actually lands and that the inhibit pairs still bind.
      - python3 scripts/check-alertmanager-behaviour.py --config scripts/alertmanager-behaviour.yaml

  scripts:test:
    desc: Run Python unit tests for scripts/ (pytest)
    cmds:
      - python3 -m pytest scripts/ -v
    preconditions:
      - sh: python3 -c "import pytest" 2>/dev/null
        msg: "pytest not installed. pip install pytest"
      # test_vendored_byte_identity.py compares this repo's vendored script
      # copies against weisssrv-lib and NEVER skips (a skip would let a vendored
      # copy drift unnoticed), so a sibling checkout is a hard requirement of
      # this task — and of `task lint`, which runs it. Without this precondition
      # a fresh single-repo clone fails the headline pre-MR gate on a bare
      # pytest assertion whose plausible "fixes" all break the byte-identity
      # invariant.
      - sh: test -d "${WEISSSRV_LIB_PATH:-../weisssrv-lib}/scripts"
        msg: |
          weisssrv-lib checkout not found at ${WEISSSRV_LIB_PATH:-../weisssrv-lib}.
          scripts/test_vendored_byte_identity.py compares the vendored scripts
          against the library and never skips. Fix with either:
            git clone https://git.ericsweiss.com/eric/weisssrv-lib.git ../weisssrv-lib
            export WEISSSRV_LIB_PATH=/path/to/weisssrv-lib
          The gate compares at the tag in variables.WEISSSRV_LIB_REF
          (.gitlab-ci.yml) and falls back to the checkout's working tree when
          that tag has not been cut yet. See
          .claude/skills/weisssrv-development/references/cluster-access.md.

  # === 1Password Integration ===
  op:check:
    desc: Verify 1Password CLI is authenticated
    cmds:
      - op account get

  secrets:show:
    desc: Display secret references (not values) - scans Taskfile, playbooks, and group_vars/host_vars
    cmds:
      - |
        echo "Secret references in use (from Taskfile.yml):"
        echo ""
        # Extract unique 1Password references from Taskfile
        # Format: op://Vault/Item Name/field (item names and fields can contain spaces)
        # Stop at quotes, parentheses, or backticks; trim trailing whitespace
        grep -oE "op://Homelab/[^\"'\`\)\(]+" Taskfile.yml | sed 's/[[:space:]]*$//' | grep -E "^op://Homelab/[^/]+/[^/]+$" | sort -u | sed 's/^/  - /'
        echo ""
        echo "Secret references in playbooks (if any):"
        # Also check ansible playbooks for 1Password references
        find ansible/playbooks -name "*.yml" -type f -exec grep -hoE "op://Homelab/[^\"'\`\)\(]+" {} \; 2>/dev/null | sed 's/[[:space:]]*$//' | grep -E "^op://Homelab/[^/]+/[^/]+$" | sort -u | sed 's/^/  - /' || echo "  (none found)"
        echo ""
        echo "Secret references in group_vars/host_vars:"
        # The op:// strings live in this Taskfile's per-task env: blocks and in
        # the matching CI job variables:, not in one inventory dict.
        # docs/15-credential-rotation.md is the authoritative item inventory.
        find ansible/inventories/prod/group_vars ansible/inventories/prod/host_vars -name "*.yml" -type f -exec grep -hoE "op://Homelab/[^\"'\`\)\(]+" {} \; 2>/dev/null | sed 's/[[:space:]]*$//' | grep -E "^op://Homelab/[^/]+/[^/]+$" | sort -u | sed 's/^/  - /' || echo "  (none found)"
        echo ""
        echo "To verify all secrets exist in 1Password:"
        echo "  op account list && op item list --vault Homelab"

  # === Download Clients / Media Stack Tasks ===
  # Each download client (nzbget, qbittorrent) runs independently with its own
  # optional Gluetun VPN sidecar, configured in the manifests and deployed by Flux.

  downloads:status:
    desc: Show status of download clients and media stack
    cmds:
      - echo "=== Download Clients Namespace ==="
      - kubectl get pods -n downloads -o wide
      - echo ""
      - echo "=== Services ==="
      - kubectl get svc -n downloads
      - echo ""
      - echo "=== PVCs ==="
      - kubectl get pvc -n downloads
      - echo ""
      - echo "=== VPN ConfigMaps ==="
      - 'echo "NZBGet VPN:"'
      - kubectl get configmap nzbget-vpn-config -n downloads -o jsonpath='{.data}' 2>/dev/null || echo "  Not configured"
      - echo ""
      - 'echo "qBittorrent VPN:"'
      - kubectl get configmap qbittorrent-vpn-config -n downloads -o jsonpath='{.data}' 2>/dev/null || echo "  Not configured"
      - echo ""
      - echo "=== IngressRoutes ==="
      - kubectl get ingressroute -n downloads

  downloads:vpn:
    desc: "Toggle a client's VPN live (task downloads:vpn -- APP=<nzbget|qbittorrent> STATE=<on|off>)"
    vars:
      APP: '{{.APP | default ""}}'
      STATE: '{{.STATE | default ""}}'
    cmds:
      # Live, GitOps-safe VPN toggle. The per-app vpn-config ConfigMaps carry the
      # kustomize.toolkit.fluxcd.io/ssa: IfNotPresent annotation, so this
      # kubectl patch is NOT drift-reverted by Flux; Reloader rolls the pod on
      # the ConfigMap change. Accepts both `-- APP=.. STATE=..` (CLI_ARGS) and
      # the native `APP=.. STATE=..` go-task var form.
      - |
        set -eo pipefail
        APP="{{.APP}}"; STATE="{{.STATE}}"
        usage() {
          echo "Usage: task downloads:vpn -- APP=<nzbget|qbittorrent> STATE=<on|off>"
          echo "  e.g. task downloads:vpn -- APP=nzbget STATE=on"
        }
        for kv in {{.CLI_ARGS}}; do
          case "$kv" in
            APP=*) APP="${kv#APP=}";;
            STATE=*) STATE="${kv#STATE=}";;
            *) echo "ERROR: unexpected argument '$kv' (expected KEY=value)"; usage; exit 1;;
          esac
        done
        case "$APP" in nzbget|qbittorrent) ;; *) echo "ERROR: APP must be nzbget or qbittorrent"; usage; exit 1;; esac
        case "$STATE" in
          on)  VAL=true;;
          off) VAL=false;;
          *) echo "ERROR: STATE must be on or off"; usage; exit 1;;
        esac
        CM="$APP-vpn-config"
        CUR=$(kubectl get configmap "$CM" -n downloads -o jsonpath='{.data.vpn_enabled}' 2>/dev/null || echo "")
        if [ "$CUR" = "$VAL" ]; then
          echo "$APP VPN already $STATE (vpn_enabled=$VAL) — nothing to do."
          exit 0
        fi
        # Pre-flight the provider credentials BEFORE enabling the VPN. Turning it
        # on rolls the pod through gluetun's settings validation; if the
        # ConfigMap's vpn_provider points at a provider whose vpn-credentials
        # keys aren't wired, that validation fails and the pod CrashLoopBackOffs
        # (and under the Recreate strategy the app is fully DOWN until reverted).
        # Same single-source check downloads:vpn-provider uses (the provider is
        # read from the CM here, i.e. the one the pod would actually start with).
        if [ "$VAL" = "true" ]; then
          # rc=2 means the ConfigMap's vpn_provider is empty or unrecognised.
          # That is a refusal, not "nothing missing": the check reads the live
          # value, so a hand-patched/renamed/blanked provider is exactly the
          # input the pre-flight exists to stop.
          set +e
          MISSING=$(scripts/vpn-credcheck.sh "$APP")
          CRED_RC=$?
          set -e
          if [ "$CRED_RC" -ne 0 ]; then
            PROV=$(kubectl get configmap "$CM" -n downloads -o jsonpath='{.data.vpn_provider}' 2>/dev/null || echo "")
            echo "ERROR: cannot enable VPN — credential pre-flight failed (rc=$CRED_RC) for provider '$PROV'."
            echo "       Fix the ConfigMap's vpn_provider (or teach scripts/vpn-credcheck.sh"
            echo "       the provider's required keys) before enabling; gluetun would fail"
            echo "       settings validation and $APP would be fully down under Recreate."
            exit 1
          fi
          if [ -n "$MISSING" ]; then
            PROV=$(kubectl get configmap "$CM" -n downloads -o jsonpath='{.data.vpn_provider}' 2>/dev/null || echo "")
            echo "ERROR: cannot enable VPN — provider '$PROV' is not fully wired;"
            echo "       vpn-credentials is missing: $MISSING"
            echo "       Enabling now would roll $APP into CrashLoopBackOff (gluetun"
            echo "       settings validation fails on the missing OPENVPN_*_SECRETFILE)."
            echo "       Populate 1Password + uncomment the provider block in"
            echo "       externalsecret.yaml first (docs/21), or pick a wired provider:"
            echo "         task downloads:vpn-provider -- APP=$APP PROVIDER=<privadovpn|vpnunlimited>"
            exit 1
          fi
        fi
        if [ "$APP" = "qbittorrent" ] && [ "$VAL" = "false" ]; then
          echo "WARNING: qbittorrent keeps its gluetun-exporter + PodMonitor when the VPN is"
          echo "         off, so gluetun_vpn_status=0 and VPNDown will fire after 15m. This"
          echo "         live toggle is for short-lived ops; for a durable VPN-off qbittorrent"
          echo "         also drop the exporter + PodMonitor in git (README § Per-App VPN Control)."
        fi
        GEN_BEFORE=$(kubectl get deployment "$APP" -n downloads -o jsonpath='{.metadata.generation}' 2>/dev/null || echo "0")
        echo "Patching $CM: vpn_enabled=$VAL ..."
        kubectl patch configmap "$CM" -n downloads --type merge -p "{\"data\":{\"vpn_enabled\":\"$VAL\"}}"
        # We only reach here on a real vpn_enabled change (the idempotent case
        # exited above), so Reloader MUST bump the deployment generation. Watch
        # for it and treat a 60s no-change as a failure — otherwise `rollout
        # status` would run against the unchanged (already-complete) generation
        # and report a premature, false success before the pod adopts the value.
        echo "Waiting for Reloader to roll deployment/$APP ..."
        i=0; ROLLED=false
        while [ "$i" -lt 30 ]; do
          GEN_NOW=$(kubectl get deployment "$APP" -n downloads -o jsonpath='{.metadata.generation}' 2>/dev/null || echo "0")
          if [ "$GEN_NOW" != "$GEN_BEFORE" ]; then ROLLED=true; break; fi
          i=$((i+1)); sleep 2
        done
        if [ "$ROLLED" != "true" ]; then
          echo "ERROR: Reloader did not roll deployment/$APP within 60s (generation still $GEN_BEFORE)."
          echo "       The vpn_enabled patch applied, but the pod has NOT restarted to adopt it."
          echo "       Check Reloader (kubectl logs -n reloader deploy/reloader), then force it:"
          echo "         kubectl rollout restart deployment/$APP -n downloads"
          exit 1
        fi
        kubectl rollout status deployment/"$APP" -n downloads --timeout=180s
        echo "$APP VPN is now: vpn_enabled=$(kubectl get configmap "$CM" -n downloads -o jsonpath='{.data.vpn_enabled}')"
        if [ "$VAL" = "true" ]; then
          echo "Verify egress with: task downloads:verify-vpn"
        fi

  downloads:vpn-provider:
    desc: "Switch a client's VPN provider live (task downloads:vpn-provider -- APP=<nzbget|qbittorrent> PROVIDER=<privadovpn|vpnunlimited> [COUNTRIES=<country[,country]>])"
    vars:
      APP: '{{.APP | default ""}}'
      PROVIDER: '{{.PROVIDER | default ""}}'
      COUNTRIES: '{{.COUNTRIES | default ""}}'
    cmds:
      # Live provider switch (GitOps-safe, same IfNotPresent + Reloader path as
      # downloads:vpn). Validates PROVIDER against the wired providers and
      # normalises the alias to gluetun's exact VPN_SERVICE_PROVIDER string.
      # NOTE: multi-word COUNTRIES need the native form (quoting), e.g.
      #   task downloads:vpn-provider APP=qbittorrent PROVIDER=privadovpn COUNTRIES="United States"
      - |
        set -eo pipefail
        APP="{{.APP}}"; PROVIDER="{{.PROVIDER}}"; COUNTRIES="{{.COUNTRIES}}"
        usage() {
          echo "Usage: task downloads:vpn-provider -- APP=<nzbget|qbittorrent> PROVIDER=<privadovpn|vpnunlimited> [COUNTRIES=<country[,country]>]"
          echo "  privadovpn  -> gluetun 'privado'       (OpenVPN user/pass; wired)"
          echo "  vpnunlimited-> gluetun 'vpn unlimited'  (OpenVPN client cert/key; operator must populate 1P, see docs/21)"
        }
        for kv in {{.CLI_ARGS}}; do
          case "$kv" in
            APP=*) APP="${kv#APP=}";;
            PROVIDER=*) PROVIDER="${kv#PROVIDER=}";;
            COUNTRIES=*) COUNTRIES="${kv#COUNTRIES=}";;
            # A bare (non KEY=value) token means a multi-word COUNTRIES value was
            # word-split by the `--` form (e.g. `COUNTRIES=United States` -> tokens
            # `COUNTRIES=United` + `States`). Left unhandled this silently truncates
            # the country to "United", which gluetun then can't match — rolling a
            # VPN-on app onto a server-less config and taking egress down. Reject it
            # and point at the native quoted form, which preserves the whole value.
            *)
              echo "ERROR: unexpected token '$kv' — a multi-word COUNTRIES value is word-split by the '--' form."
              echo "       Use the native quoted form for multi-word countries, e.g.:"
              echo "         task downloads:vpn-provider APP=qbittorrent PROVIDER=privadovpn COUNTRIES=\"United States\""
              usage
              exit 1
              ;;
          esac
        done
        case "$APP" in nzbget|qbittorrent) ;; *) echo "ERROR: APP must be nzbget or qbittorrent"; usage; exit 1;; esac
        # PROVIDER is whitelisted (alias -> gluetun's exact string) here, so only
        # a known GLUE value ever reaches the kubectl patch below. Note the real
        # provider name "vpn unlimited" CONTAINS A SPACE — GLUE is always used
        # double-quoted (JSON payload, comparisons, script arg) for that reason.
        case "$PROVIDER" in
          privado|privadovpn) GLUE="privado";;
          vpnunlimited|vpn-unlimited|"vpn unlimited") GLUE="vpn unlimited";;
          *) echo "ERROR: unknown/unwired PROVIDER '$PROVIDER'"; usage; exit 1;;
        esac
        # COUNTRIES is the one free-form user value that reaches the JSON patch.
        # Restrict it to a country-name charset (letters, digits, spaces, commas
        # for the list form, plus . - ') so a stray quote/brace/backslash/$ can't
        # break the merge-patch JSON or the shell. Strip the allowed chars and
        # reject if anything survives.
        if [ -n "$COUNTRIES" ]; then
          BAD=$(printf '%s' "$COUNTRIES" | tr -d "A-Za-z0-9 ,.'-")
          if [ -n "$BAD" ]; then
            echo "ERROR: COUNTRIES contains unsupported characters: '$BAD'"
            echo "       Allowed: letters, digits, spaces, commas, '.', '-', apostrophe."
            echo "       e.g. COUNTRIES=Netherlands  or  COUNTRIES=\"United States,Canada\""
            usage
            exit 1
          fi
        fi
        CM="$APP-vpn-config"
        VPN_ENABLED=$(kubectl get configmap "$CM" -n downloads -o jsonpath='{.data.vpn_enabled}' 2>/dev/null || echo "")
        # Pre-flight the target provider against the credentials ACTUALLY wired,
        # not just the alias allowlist above: switching a VPN-ON app to a provider
        # with no creds takes it fully down until someone switches back. Refuse
        # while the app is ON; when OFF, stage the selection with a warning.
        # scripts/vpn-credcheck.sh is shared with downloads:vpn (docs/21).
        set +e
        MISSING=$(scripts/vpn-credcheck.sh "$APP" "$GLUE")
        CRED_RC=$?
        set -e
        if [ "$CRED_RC" -ne 0 ]; then
          # rc=2: the alias map above resolved PROVIDER to a gluetun string the
          # credential check does not know — the two lists have drifted. Refuse
          # in both VPN-on and VPN-off cases; staging an unmappable provider only
          # defers the crash-loop.
          echo "ERROR: credential pre-flight failed (rc=$CRED_RC) for gluetun provider '$GLUE'."
          echo "       The PROVIDER alias map and scripts/vpn-credcheck.sh have drifted;"
          echo "       add '$GLUE' and its required vpn-credentials keys there (docs/21)."
          exit 1
        fi
        if [ -n "$MISSING" ]; then
          if [ "$VPN_ENABLED" = "true" ]; then
            echo "ERROR: provider '$GLUE' is not fully wired — vpn-credentials is missing: $MISSING"
            echo "       $APP has the VPN ON, so switching now would roll it into CrashLoopBackOff"
            echo "       (gluetun settings validation fails on the missing OPENVPN_*_SECRETFILE)."
            echo "       Populate 1Password + uncomment the provider block in externalsecret.yaml first (docs/21)."
            exit 1
          fi
          echo "WARNING: provider '$GLUE' is not fully wired — vpn-credentials is missing: $MISSING"
          echo "         Saving the selection, but 'task downloads:vpn -- APP=$APP STATE=on' will"
          echo "         crash-loop until 1Password is populated (docs/21)."
        fi
        # Detect whether this patch actually changes anything. Unlike
        # downloads:vpn there is no early idempotency exit here, so a no-op
        # re-set (same provider/country) would leave the deployment generation
        # unchanged — we must NOT treat that as a failed roll below.
        CUR_PROVIDER=$(kubectl get configmap "$CM" -n downloads -o jsonpath='{.data.vpn_provider}' 2>/dev/null || echo "")
        CUR_COUNTRIES=$(kubectl get configmap "$CM" -n downloads -o jsonpath='{.data.server_countries}' 2>/dev/null || echo "")
        CHANGED=false
        if [ "$CUR_PROVIDER" != "$GLUE" ]; then CHANGED=true; fi
        if [ -n "$COUNTRIES" ] && [ "$CUR_COUNTRIES" != "$COUNTRIES" ]; then CHANGED=true; fi
        GEN_BEFORE=$(kubectl get deployment "$APP" -n downloads -o jsonpath='{.metadata.generation}' 2>/dev/null || echo "0")
        if [ -n "$COUNTRIES" ]; then
          PATCH="{\"data\":{\"vpn_provider\":\"$GLUE\",\"server_countries\":\"$COUNTRIES\"}}"
        else
          PATCH="{\"data\":{\"vpn_provider\":\"$GLUE\"}}"
        fi
        echo "Patching $CM: vpn_provider=$GLUE${COUNTRIES:+, server_countries=$COUNTRIES} ..."
        kubectl patch configmap "$CM" -n downloads --type merge -p "$PATCH"
        if [ "$VPN_ENABLED" != "true" ]; then
          echo "$APP vpn_enabled=$VPN_ENABLED — provider saved; turn the VPN on with: task downloads:vpn -- APP=$APP STATE=on"
          exit 0
        fi
        if [ "$CHANGED" = "true" ]; then
          # A real change: Reloader MUST bump the generation. Treat a 60s
          # no-change as a failure instead of falling through to a premature,
          # false `rollout status` success against the unchanged generation.
          echo "Waiting for Reloader to roll deployment/$APP ..."
          i=0; ROLLED=false
          while [ "$i" -lt 30 ]; do
            GEN_NOW=$(kubectl get deployment "$APP" -n downloads -o jsonpath='{.metadata.generation}' 2>/dev/null || echo "0")
            if [ "$GEN_NOW" != "$GEN_BEFORE" ]; then ROLLED=true; break; fi
            i=$((i+1)); sleep 2
          done
          if [ "$ROLLED" != "true" ]; then
            echo "ERROR: Reloader did not roll deployment/$APP within 60s (generation still $GEN_BEFORE)."
            echo "       The provider patch applied, but the pod has NOT restarted to adopt it."
            echo "       Check Reloader (kubectl logs -n reloader deploy/reloader), then force it:"
            echo "         kubectl rollout restart deployment/$APP -n downloads"
            exit 1
          fi
          # A switch to an unpopulated provider (e.g. vpnunlimited before its 1P
          # cert/key exist) makes gluetun fail to start — rollout status then
          # times out and this exits non-zero (the app is briefly down under
          # Recreate).
          kubectl rollout status deployment/"$APP" -n downloads --timeout=180s
        else
          echo "$APP already on provider '$GLUE'${COUNTRIES:+ / '$COUNTRIES'} — no roll needed."
        fi
        echo "Provider now: $(kubectl get configmap "$CM" -n downloads -o jsonpath='{.data.vpn_provider}')"
        echo "Public IP via $APP's tunnel:"
        kubectl exec -n downloads deployment/"$APP" -c gluetun -- wget -qO- -T 10 https://checkip.amazonaws.com 2>/dev/null || echo "  (could not fetch public IP — see task downloads:vpn-status)"

  downloads:vpn-status:
    desc: Check VPN connection status for all download clients
    cmds:
      - echo "=== NZBGet VPN Status ==="
      - |
        VPN_ENABLED=$(kubectl get configmap nzbget-vpn-config -n downloads -o jsonpath='{.data.vpn_enabled}' 2>/dev/null || echo "unknown")
        VPN_PROVIDER=$(kubectl get configmap nzbget-vpn-config -n downloads -o jsonpath='{.data.vpn_provider}' 2>/dev/null || echo "unknown")
        echo "VPN Enabled: $VPN_ENABLED"
        echo "Provider: $VPN_PROVIDER"
        if [ "$VPN_ENABLED" = "true" ]; then
          echo "Gluetun logs (last 10 lines):"
          kubectl logs -n downloads -l app.kubernetes.io/name=nzbget -c gluetun --tail=10 2>/dev/null || echo "  Cannot get logs"
          echo "Public IP:"
          kubectl exec -n downloads deployment/nzbget -c gluetun -- wget -qO- https://checkip.amazonaws.com 2>/dev/null || echo "  Cannot reach checkip.amazonaws.com"
        fi
      - echo ""
      - echo "=== qBittorrent VPN Status ==="
      - |
        VPN_ENABLED=$(kubectl get configmap qbittorrent-vpn-config -n downloads -o jsonpath='{.data.vpn_enabled}' 2>/dev/null || echo "unknown")
        VPN_PROVIDER=$(kubectl get configmap qbittorrent-vpn-config -n downloads -o jsonpath='{.data.vpn_provider}' 2>/dev/null || echo "unknown")
        echo "VPN Enabled: $VPN_ENABLED"
        echo "Provider: $VPN_PROVIDER"
        if [ "$VPN_ENABLED" = "true" ]; then
          echo "Gluetun logs (last 10 lines):"
          kubectl logs -n downloads -l app.kubernetes.io/name=qbittorrent -c gluetun --tail=10 2>/dev/null || echo "  Cannot get logs"
          echo "Public IP:"
          kubectl exec -n downloads deployment/qbittorrent -c gluetun -- wget -qO- https://checkip.amazonaws.com 2>/dev/null || echo "  Cannot reach checkip.amazonaws.com"
        fi
      - echo ""
      - echo "=== Live VPN Ops (GitOps-safe; changes stick, Reloader rolls the pod) ==="
      - 'echo "  task downloads:vpn -- APP=<nzbget|qbittorrent> STATE=<on|off>"'
      - 'echo "  task downloads:vpn-provider -- APP=<...> PROVIDER=<privadovpn|vpnunlimited> [COUNTRIES=<...>]"'
      - 'echo "  Resync git default: kubectl delete configmap <app>-vpn-config -n downloads && task flux:reconcile"'

  downloads:verify-vpn:
    desc: Assert VPN egress differs from LAN egress and the NetworkPolicy blocks direct LAN access from VPN-routed pods
    cmds:
      - |
        set -eo pipefail
        FAILED=0
        # Reference (non-VPN) egress IP from prowlarr — its netpol allows
        # TCP 443 out, and it does NOT ride the Gluetun tunnel.
        LAN_IP=$(kubectl exec -n downloads deployment/prowlarr -- \
          sh -c 'wget -qO- -T 10 https://checkip.amazonaws.com' 2>/dev/null || true)
        if [ -z "$LAN_IP" ]; then
          echo "ERROR: could not determine the non-VPN egress IP (via prowlarr)"
          exit 1
        fi
        echo "Non-VPN egress IP (prowlarr): $LAN_IP"
        for APP in nzbget qbittorrent; do
          VPN_ENABLED=$(kubectl get configmap "$APP-vpn-config" -n downloads -o jsonpath='{.data.vpn_enabled}' 2>/dev/null || echo "unknown")
          if [ "$VPN_ENABLED" != "true" ]; then
            echo "SKIP: $APP vpn_enabled=$VPN_ENABLED"
            continue
          fi
          VPN_IP=$(kubectl exec -n downloads deployment/"$APP" -c gluetun -- \
            wget -qO- -T 10 https://checkip.amazonaws.com 2>/dev/null || true)
          if [ -z "$VPN_IP" ]; then
            echo "FAIL: $APP: could not fetch the VPN egress IP"
            FAILED=1
          elif [ "$VPN_IP" = "$LAN_IP" ]; then
            echo "FAIL: $APP egress IP $VPN_IP equals the non-VPN egress IP — VPN leak"
            FAILED=1
          else
            echo "OK: $APP egress IP $VPN_IP differs from the non-VPN egress IP"
          fi
        done
        # LAN containment: gluetun's own firewall deliberately permits RFC1918
        # (FIREWALL_OUTBOUND_SUBNETS), so the allow-gluetun-vpn-egress
        # NetworkPolicy is the ONLY layer blocking LAN access from these pods.
        # A netpol drop manifests as a connect timeout (no RST), so any
        # successful fetch here means the policy is not containing LAN egress.
        echo "Checking NetworkPolicy LAN containment from qbittorrent (expect timeout)..."
        if kubectl exec -n downloads deployment/qbittorrent -c gluetun -- \
             wget -q -O /dev/null -T 5 --no-check-certificate https://192.168.0.1/ 2>/dev/null; then
          echo "FAIL: qbittorrent pod reached 192.168.0.1:443 directly — NetworkPolicy not containing LAN egress"
          FAILED=1
        else
          echo "OK: direct LAN connect from the qbittorrent pod was blocked"
        fi
        exit $FAILED

  downloads:restart:
    desc: Restart all download clients and media apps
    cmds:
      # Pod delete, NOT `kubectl rollout restart`: these Deployments are
      # Flux-kustomize-managed, so the restartedAt pod-template annotation a
      # rollout restart adds is drift the kustomize-controller reverts on the
      # next reconcile — re-rolling every pod a second time. All Deployments
      # here are replicas:1 + Recreate, so a pod delete is a clean restart.
      # Pods carry app.kubernetes.io/name (part-of=media-stack is
      # Deployment-metadata-only; it is not propagated to pod templates).
      - echo "Restarting download clients and *arr apps (pod delete)..."
      - kubectl delete pod -n downloads -l 'app.kubernetes.io/name in (nzbget,qbittorrent,prowlarr,sonarr,radarr,lidarr,pulsarr)'
      - echo "Waiting for pods to be ready..."
      - kubectl wait --namespace downloads --for=condition=ready pod --all --timeout=300s

  downloads:logs:
    desc: "View logs for a specific app (task downloads:logs APP=nzbget [CONTAINER=gluetun])"
    vars:
      APP: '{{.APP | default "nzbget"}}'
      CONTAINER: '{{.CONTAINER | default ""}}'
    cmds:
      - |
        APP="{{.APP}}"
        CONTAINER="{{.CONTAINER}}"

        case "$APP" in
          nzbget|qbittorrent)
            if [ -n "$CONTAINER" ]; then
              echo "=== $APP / $CONTAINER logs ==="
              kubectl logs -n downloads -l app.kubernetes.io/name="$APP" -c "$CONTAINER" -f
            else
              echo "=== $APP logs (main container) ==="
              kubectl logs -n downloads -l app.kubernetes.io/name="$APP" -c "$APP" -f
            fi
            ;;
          nzbget-vpn|qbittorrent-vpn)
            REAL_APP="${APP%-vpn}"
            echo "=== $REAL_APP / gluetun logs ==="
            kubectl logs -n downloads -l app.kubernetes.io/name="$REAL_APP" -c gluetun -f
            ;;
          *)
            echo "=== $APP logs ==="
            kubectl logs -n downloads -l app.kubernetes.io/name="$APP" -f
            ;;
        esac

  downloads:shell:
    desc: "Open shell in app container (task downloads:shell APP=nzbget [CONTAINER=gluetun])"
    vars:
      APP: '{{.APP | default "nzbget"}}'
      CONTAINER: '{{.CONTAINER | default ""}}'
    cmds:
      - |
        APP="{{.APP}}"
        CONTAINER="{{.CONTAINER}}"

        case "$APP" in
          nzbget|qbittorrent)
            if [ -n "$CONTAINER" ]; then
              echo "Opening shell in $APP / $CONTAINER..."
              kubectl exec -it -n downloads deployment/"$APP" -c "$CONTAINER" -- /bin/sh
            else
              echo "Opening shell in $APP..."
              kubectl exec -it -n downloads deployment/"$APP" -c "$APP" -- /bin/sh
            fi
            ;;
          *)
            echo "Opening shell in $APP..."
            kubectl exec -it -n downloads deployment/"$APP" -- /bin/sh
            ;;
        esac

  downloads:delete:
    desc: Delete download clients and media stack (preserves namespace, PVCs, and secrets)
    dir: ./kubernetes/apps/download-clients
    cmds:
      - echo "Deleting workloads (preserving namespace, storage, and secrets)..."
      - |
        # Delete only workload resources, NOT namespace/storage/secrets.
        # Flux will recreate these within ~1 minute on the next reconcile
        # unless the apps Kustomization is suspended first (see echo block below).
        # part-of=media-stack is the label kustomization.yaml applies to every
        # resource in this namespace.
        kubectl delete deployment -n downloads -l app.kubernetes.io/part-of=media-stack --ignore-not-found
        kubectl delete ingressroute -n downloads --all --ignore-not-found
        echo "Remaining Deployments (should be none until Flux recreates them):"
        kubectl get deployment -n downloads
      - |
        echo ""
        echo "Workloads deleted. Namespace, PVCs, and secrets preserved."
        echo "Flux will recreate the workloads on next reconcile (~1 minute)."
        echo "To keep them deleted, suspend the apps Kustomization first:"
        echo "  task flux:suspend -- flux-system/kustomization/apps"
        echo ""
        echo "To fully remove everything:"
        echo "  task flux:suspend -- flux-system/kustomization/apps"
        echo "  kubectl delete namespace downloads"

  # === wg-easy WireGuard VPN Tasks ===
  # Internet-exit VPN for the user + friends/family (kubernetes/apps/wg-easy).
  # Admin UI: vpn.esweiss.com (internal, Authentik). Endpoint: vpn.ericsweiss.com:51820/udp.
  # Namespaced `wg-easy:` after the app; `downloads:vpn*` is the unrelated
  # Gluetun egress tunnel.

  wg-easy:status:
    desc: Show status of the wg-easy VPN (pods, services, VIP, PVC, ingress)
    cmds:
      - echo "=== wg-easy Namespace ==="
      - kubectl get pods -n wg-easy -o wide
      - echo ""
      - echo "=== Services (LoadBalancer VIP) ==="
      - kubectl get svc -n wg-easy
      - echo ""
      - echo "=== PVC ==="
      - kubectl get pvc -n wg-easy
      - echo ""
      - echo "=== IngressRoute ==="
      - kubectl get ingressroute -n wg-easy

  wg-easy:peers:
    desc: Show live WireGuard peers/handshakes (kubectl exec wg show)
    cmds:
      - kubectl exec -n wg-easy deployment/wg-easy -- wg show 2>/dev/null || echo "wg0 not up yet (no clients configured, or pod not ready)"

  wg-easy:logs:
    desc: Tail wg-easy logs
    cmds:
      - kubectl logs -n wg-easy deployment/wg-easy --tail=50 -f

  wg-easy:restart:
    desc: Restart the wg-easy pod (pod delete; Flux-managed, replicas:1 + Recreate)
    cmds:
      # Pod delete, NOT `kubectl rollout restart`: the Deployment is
      # Flux-kustomize-managed, so a rollout restart's restartedAt annotation is
      # drift the kustomize-controller reverts. replicas:1 + Recreate => a pod
      # delete is a clean restart.
      - kubectl delete pod -n wg-easy -l app.kubernetes.io/name=wg-easy
      - kubectl wait --namespace wg-easy --for=condition=ready pod -l app.kubernetes.io/name=wg-easy --timeout=180s

  # === Recipe Management Stack Tasks ===
  # Mealie (recipe management) and Bar Assistant (cocktail recipes)
  # Data services pinned to NAS node for NFS locality and backup consistency

  recipes:status:
    desc: Show status of recipe management stack
    cmds:
      - echo "=== Recipes Namespace ==="
      - kubectl get pods -n recipes -o wide
      - echo ""
      - echo "=== Services ==="
      - kubectl get svc -n recipes
      - echo ""
      - echo "=== PVCs ==="
      - kubectl get pvc -n recipes
      - echo ""
      - echo "=== IngressRoutes ==="
      - kubectl get ingressroute -n recipes

  recipes:restart:
    desc: Restart all recipe apps
    cmds:
      # Pod delete, NOT `kubectl rollout restart`: these Deployments are
      # Flux-kustomize-managed, so the restartedAt pod-template annotation a
      # rollout restart adds is drift the kustomize-controller reverts on the
      # next reconcile — the trailing `kubectl wait` would then pass on the OLD
      # ready pods, masking a no-op restart. A pod delete is a clean restart
      # (Deployments here are replicas:1) and leaves no drift to revert.
      # Matches downloads:restart.
      - echo "Restarting recipe apps (pod delete)..."
      - kubectl delete pod -n recipes --all
      - echo "Waiting for pods to be ready..."
      - kubectl wait --namespace recipes --for=condition=ready pod --all --timeout=300s

  recipes:logs:
    desc: "View logs for a specific app (task recipes:logs APP=mealie)"
    vars:
      APP: '{{.APP | default "mealie"}}'
    cmds:
      - |
        APP="{{.APP}}"
        echo "=== $APP logs ==="
        kubectl logs -n recipes -l app.kubernetes.io/name="$APP" -f

  recipes:shell:
    desc: "Open shell in app container (task recipes:shell APP=mealie)"
    vars:
      APP: '{{.APP | default "mealie"}}'
    cmds:
      - |
        APP="{{.APP}}"
        echo "Opening shell in $APP..."
        kubectl exec -it -n recipes deployment/"$APP" -- /bin/sh

  recipes:delete:
    desc: Delete recipe stack (preserves namespace, PVCs, and secrets)
    dir: ./kubernetes/apps/recipes
    cmds:
      - echo "Deleting workloads (preserving namespace, storage, and secrets)..."
      - |
        # Delete only workload resources, NOT namespace/storage/secrets
        kubectl delete deployment -n recipes --all --ignore-not-found
        kubectl delete statefulset -n recipes --all --ignore-not-found
        kubectl delete ingressroute -n recipes --all --ignore-not-found
      - |
        echo ""
        echo "Workloads deleted. Namespace, PVCs, and secrets preserved."
        echo "Flux will recreate the workloads on next reconcile (~1 minute)."
        echo "To keep them deleted, suspend the apps Kustomization first:"
        echo "  task flux:suspend -- flux-system/kustomization/apps"
        echo ""
        echo "To fully remove everything:"
        echo "  kubectl delete namespace recipes"

  # === Home Assistant Tasks ===
  # Home Assistant runs as a standalone VM on Proxmox (not in k3s)
  # Traefik provides ingress via IngressRoute + Service/EndpointSlice

  home-assistant:status:
    desc: Show Home Assistant VM and ingress status
    cmds:
      - echo "=== Home Assistant VM Status ==="
      - |
        # Locate the VM's current node via the shared, hardened helper
        # (HA-resilient: ha-manager -> cluster resources -> per-host qm scan).
        CURRENT_NODE=$(scripts/find-pve-host-for-vm.sh {{.HA_VM_ID}} {{.PVE_HOSTS}} || true)
        if [ -z "$CURRENT_NODE" ]; then
          echo "Cannot find VM {{.HA_VM_ID}} on any reachable Proxmox host"
        else
          echo "VM {{.HA_VM_ID}} is on node: $CURRENT_NODE"
          ssh "$CURRENT_NODE" "sudo qm status {{.HA_VM_ID}}" 2>/dev/null || echo "Cannot reach node $CURRENT_NODE"
        fi
      - echo ""
      - echo "=== Network Connectivity ==="
      - |
        if curl -s --connect-timeout 2 http://{{.HOME_ASSISTANT_IP}}:8123 >/dev/null 2>&1; then
          echo "Home Assistant HTTP: OK ({{.HOME_ASSISTANT_IP}}:8123)"
        else
          echo "Home Assistant HTTP: UNREACHABLE"
        fi
      - echo ""
      - echo "=== Kubernetes Resources ==="
      - kubectl get service home-assistant-backend -n default -o wide 2>/dev/null || echo "Service not found"
      - kubectl get endpointslice home-assistant-backend -n default 2>/dev/null || echo "EndpointSlice not found"
      - kubectl get ingressroute -A 2>/dev/null | grep -E "NAME|home-assistant" || echo "IngressRoutes not found"
      - echo ""
      - echo "=== Traefik Routing Test ==="
      - |
        echo "Internal (home.esweiss.com):"
        curl -sk --connect-timeout 5 https://home.esweiss.com -o /dev/null -w "  HTTP Status: %{http_code}\n" 2>/dev/null || echo "  UNREACHABLE"
        echo "External (home.ericsweiss.com):"
        curl -sk --connect-timeout 5 https://home.ericsweiss.com -o /dev/null -w "  HTTP Status: %{http_code}\n" 2>/dev/null || echo "  UNREACHABLE"

  home-assistant:vm-start:
    desc: Start the Home Assistant VM
    cmds:
      - |
        set -eo pipefail
        CURRENT_NODE=$(scripts/find-pve-host-for-vm.sh {{.HA_VM_ID}} {{.PVE_HOSTS}})
        if [ -z "$CURRENT_NODE" ]; then
          echo "ERROR: Cannot find VM {{.HA_VM_ID}} on any reachable Proxmox host"
          exit 1
        fi
        echo "Starting VM {{.HA_VM_ID}} on $CURRENT_NODE..."
        ssh "$CURRENT_NODE" "sudo qm start {{.HA_VM_ID}}"
      - echo "Waiting for Home Assistant to be reachable..."
      - |
        for i in $(seq 1 30); do
          if curl -s --connect-timeout 2 http://{{.HOME_ASSISTANT_IP}}:8123 >/dev/null 2>&1; then
            echo "Home Assistant is up!"
            exit 0
          fi
          echo "Waiting... ($i/30)"
          sleep 5
        done
        echo "Warning: Home Assistant may still be starting"

  home-assistant:vm-stop:
    desc: Stop the Home Assistant VM gracefully
    cmds:
      - |
        set -eo pipefail
        CURRENT_NODE=$(scripts/find-pve-host-for-vm.sh {{.HA_VM_ID}} {{.PVE_HOSTS}})
        echo "Stopping VM {{.HA_VM_ID}} on $CURRENT_NODE..."
        if ssh "$CURRENT_NODE" "sudo qm shutdown {{.HA_VM_ID}}"; then
          echo "Sent shutdown signal to Home Assistant VM"
        else
          echo "ERROR: Failed to stop VM {{.HA_VM_ID}} on $CURRENT_NODE"
          exit 1
        fi

  home-assistant:vm-restart:
    desc: "Restart the Home Assistant VM (graceful shutdown + start; FORCE=1 hard-resets a wedged guest)"
    vars:
      FORCE: '{{.FORCE | default "0"}}'
    cmds:
      - |
        set -eo pipefail
        CURRENT_NODE=$(scripts/find-pve-host-for-vm.sh {{.HA_VM_ID}} {{.PVE_HOSTS}})
        if [ "{{.FORCE}}" = "1" ]; then
          echo "FORCE=1: hard-resetting VM {{.HA_VM_ID}} on $CURRENT_NODE (recorder DB may lose recent history)..."
          ssh "$CURRENT_NODE" "sudo qm reset {{.HA_VM_ID}}"
          echo "Sent reset signal to Home Assistant VM"
          exit 0
        fi
        # Graceful ACPI shutdown + start — the same mechanism vm-stop uses.
        # A hard `qm reset` on every restart risks recorder-DB corruption;
        # keep it behind FORCE=1 for a wedged guest. `qm reboot` is NOT used
        # because it waits on the QEMU Guest Agent, which HAOS lacks proper
        # config for. The VM is Proxmox-HA-managed, so shutdown/start proxy
        # through ha-manager.
        echo "Shutting down VM {{.HA_VM_ID}} on $CURRENT_NODE..."
        ssh "$CURRENT_NODE" "sudo qm shutdown {{.HA_VM_ID}} --timeout 120"
        for i in $(seq 1 30); do
          STATUS=$(ssh "$CURRENT_NODE" "sudo qm status {{.HA_VM_ID}}" 2>/dev/null || true)
          case "$STATUS" in *stopped*) break ;; esac
          echo "Waiting for shutdown... ($i/30)"
          sleep 5
        done
        STATUS=$(ssh "$CURRENT_NODE" "sudo qm status {{.HA_VM_ID}}" 2>/dev/null || true)
        case "$STATUS" in
          *stopped*) ;;
          *)
            echo "ERROR: VM {{.HA_VM_ID}} did not stop cleanly (status: ${STATUS:-unknown})."
            echo "Re-run with FORCE=1 to hard-reset: task home-assistant:vm-restart FORCE=1"
            exit 1
            ;;
        esac
        echo "Starting VM {{.HA_VM_ID}} on $CURRENT_NODE..."
        ssh "$CURRENT_NODE" "sudo qm start {{.HA_VM_ID}}"
        echo "Restart complete"

  home-assistant:console:
    desc: Open SSH console to Home Assistant (if SSH add-on installed)
    cmds:
      - |
        echo "Connecting to Home Assistant..."
        echo "Note: Requires SSH add-on to be installed in Home Assistant"
        ssh root@{{.HOME_ASSISTANT_IP}} -p 22222 || echo "SSH connection failed. Is the SSH add-on installed and configured?"

  home-assistant:logs:
    desc: View Home Assistant core logs via API (reads token from HA_TOKEN env var)
    cmds:
      - |
        if [ -z "$HA_TOKEN" ]; then
          echo "Usage: HA_TOKEN=<long-lived-access-token> task home-assistant:logs"
          echo ""
          echo "To get a token:"
          echo "1. Go to https://home.esweiss.com/profile"
          echo "2. Scroll to 'Long-Lived Access Tokens'"
          echo "3. Create a new token"
          echo ""
          echo "Tip: 'export HA_TOKEN=...' (or read it from 1Password) keeps the"
          echo "token out of process listings — it's sent via curl --config below."
          exit 1
        fi
        # Pass the bearer token via curl's stdin config, never argv, so it does
        # not appear in ps/process listings. Capture the body and check curl's
        # exit (--fail-with-body => non-zero on HTTP >=400) rather than piping
        # straight into head, which would mask a network/HTTP error and emit the
        # error page as if it were the logs.
        resp=$(curl -sS --fail-with-body --config - https://home.esweiss.com/api/error_log <<EOF
        header = "Authorization: Bearer $HA_TOKEN"
        EOF
        ) || { echo "ERROR: failed to fetch Home Assistant logs (network error or HTTP >=400)" >&2; exit 1; }
        printf '%s\n' "$resp" | head -100

  home-assistant:snapshot:
    desc: Create a Proxmox snapshot of the Home Assistant VM
    vars:
      NAME: '{{.NAME | default "manual"}}'
      DESC: '{{.DESC | default "Manual snapshot"}}'
    cmds:
      - |
        set -eo pipefail
        NAME="{{.NAME}}"
        DESC="{{.DESC}}"
        # NAME is interpolated into a remote `qm snapshot` command; pin it to the
        # Proxmox snapshot-name charset so it can't break out of the quoting.
        if ! printf '%s' "$NAME" | grep -qE '^[A-Za-z0-9][A-Za-z0-9_-]*$'; then
          echo "ERROR: NAME must match ^[A-Za-z0-9][A-Za-z0-9_-]*$ (Proxmox snapshot-name rules)"
          exit 1
        fi
        # DESC is wrapped in single quotes remotely; reject single quotes so it
        # can't terminate the quoting and inject into the root qm command.
        case "$DESC" in
          *\'*) echo "ERROR: DESC must not contain a single quote"; exit 1 ;;
        esac
        CURRENT_NODE=$(scripts/find-pve-host-for-vm.sh {{.HA_VM_ID}} {{.PVE_HOSTS}})
        echo "Creating snapshot '$NAME' of Home Assistant VM on $CURRENT_NODE..."
        if ssh "$CURRENT_NODE" "sudo qm snapshot {{.HA_VM_ID}} '${NAME}' --description '${DESC}'"; then
          echo "Snapshot created successfully"
        else
          echo "ERROR: Failed to create snapshot of VM {{.HA_VM_ID}} on $CURRENT_NODE"
          exit 1
        fi
        echo ""
        echo "To list snapshots: ssh $CURRENT_NODE 'sudo qm listsnapshot {{.HA_VM_ID}}'"
        echo "To rollback: ssh $CURRENT_NODE \"sudo qm rollback {{.HA_VM_ID}} '${NAME}'\""

  home-assistant:deploy-config:
