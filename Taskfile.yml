    desc: Run the Immich database backup (pg_dumpall + freshness metric)
    cmds:
      - echo "Creating Immich database backup..."
      - ssh eric@{{.IMMICH_IP}} "sudo /usr/local/sbin/immich-backup-run.sh"
      - echo ""
      - 'echo "Backup complete. List backups with:"'
