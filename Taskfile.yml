      IMMICH_OAUTH_CLIENT_ID: op://Homelab/Immich SSO/client-id
      IMMICH_OAUTH_CLIENT_SECRET: op://Homelab/Immich SSO/client-secret
    preconditions: &immich_deploy_preconditions
      - sh: command -v ansible-playbook
        msg: "ansible-playbook is not installed"
