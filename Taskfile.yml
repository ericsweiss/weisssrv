  immich:status:
    desc: Show Immich status (compose stack + IngressRoutes)
    cmds:
      - echo "=== Immich compose stack ==="
      - ssh eric@{{.IMMICH_IP}} "sudo docker compose --project-directory /mnt/immich-app/compose ps" || echo "Immich VM not reachable or stack not up"
      - echo ""
      - echo "=== Immich IngressRoutes ==="
      - kubectl get ingressroute -n default 2>/dev/null | grep -i immich || echo "No Immich IngressRoutes found"
      - echo ""
      - echo "=== Immich ServiceMonitor ==="
      - kubectl get servicemonitor -n observability immich 2>/dev/null || echo "No Immich ServiceMonitor found"

  immich:verify:
    desc: Run Immich smoke tests (web UI both hosts, health, metrics, DB, mounts)
    # Task's built-in interpreter (mvdan/sh) supports the 'local' keyword used
    # in the helpers below. IMMICH_IP comes from the scripts/hosts.env dotenv.
    cmds:
      - |
        echo "=== Immich Smoke Tests ==="
        echo ""
        PASS=0
        FAIL=0

        check_http_ok() {
          local url="$1"
          local status
          status=$(curl -sI --max-time 10 "$url" 2>/dev/null | head -1 | grep -oE 'HTTP/[0-9.]+ [0-9]+' | grep -oE '[0-9]+$')
          if [ -n "$status" ] && [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
            return 0
          fi
          return 1
        }

        # Test 1: Web UI (external)
        echo -n "Immich Web UI (photos.ericsweiss.com)... "
        if check_http_ok "https://photos.ericsweiss.com"; then
          echo "PASS"; PASS=$((PASS + 1))
        else
          echo "FAIL"; FAIL=$((FAIL + 1))
        fi

        # Test 2: Web UI (internal)
        echo -n "Immich Web UI (photos.esweiss.com)... "
        if check_http_ok "https://photos.esweiss.com"; then
          echo "PASS"; PASS=$((PASS + 1))
        else
          echo "FAIL"; FAIL=$((FAIL + 1))
        fi

        # Test 3: Server health endpoint (unauthenticated)
        echo -n "Immich health (/api/server/ping)... "
        if curl -s --max-time 10 "https://photos.esweiss.com/api/server/ping" 2>/dev/null | grep -q 'pong'; then
          echo "PASS"; PASS=$((PASS + 1))
        else
          echo "FAIL"; FAIL=$((FAIL + 1))
        fi

        # Test 4: Native metrics served on the API port (8081). Probed over SSH on
        # the VM's loopback — sg-immich scopes 8081/8082 to the k3s scrapers only
        # (least-privilege), so a direct probe from the operator's LAN/tailnet
        # source is firewall-dropped by design. The in-cluster ServiceMonitor +
        # ImmichDown alert cover scrape reachability from the k3s nodes.
        echo -n "Immich API metrics (127.0.0.1:8081 on the VM)... "
        if ssh eric@{{.IMMICH_IP}} "curl -s --max-time 10 http://127.0.0.1:8081/metrics" 2>/dev/null | grep -q '.'; then
          echo "PASS"; PASS=$((PASS + 1))
        else
          echo "FAIL"; FAIL=$((FAIL + 1))
        fi

        # Test 5: Database container healthy
        echo -n "Postgres container healthy... "
        if ssh eric@{{.IMMICH_IP}} "sudo docker compose --project-directory /mnt/immich-app/compose exec -T database pg_isready -U postgres -d immich" 2>/dev/null | grep -q 'accepting connections'; then
          echo "PASS"; PASS=$((PASS + 1))
        else
          echo "FAIL"; FAIL=$((FAIL + 1))
        fi

        # Test 6: The three zvol mounts are present
        echo -n "zvol mounts (app/postgres/data)... "
        if ssh eric@{{.IMMICH_IP}} "mountpoint -q /mnt/immich-app && mountpoint -q /mnt/immich-postgres && mountpoint -q /mnt/immich-data" 2>/dev/null; then
          echo "PASS"; PASS=$((PASS + 1))
        else
          echo "FAIL"; FAIL=$((FAIL + 1))
        fi

        echo ""
        echo "=== Results: $PASS passed, $FAIL failed ==="
        if [ $FAIL -gt 0 ]; then
          exit 1
        fi

