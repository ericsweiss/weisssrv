# https://taskfile.dev
version: '3'

vars:
  ANSIBLE_DIR: ./ansible
  TERRAFORM_DIR: ./terraform
  INVENTORY: ./inventories/prod

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # === Ansible Tasks ===
  ansible:install-collections:
    desc: Install Ansible Galaxy collections
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-galaxy collection install -r requirements.yml

  ansible:ping:
    desc: Ping all managed hosts
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible -i {{.INVENTORY}} all -m ping -e "ansible_become=false"

  ansible:lint:
    desc: Lint Ansible playbooks and roles
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-lint playbooks/ roles/

  # === Deployment Tasks ===
  deploy:all:
    desc: Deploy base infrastructure (Proxmox, DNS, NAS, mail - excludes k3s)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SMTP_GMAIL_USER: op://Homelab/SMTP Relay Gmail/username
      SMTP_GMAIL_PASSWORD: op://Homelab/SMTP Relay Gmail/password
      ADGUARD_ADMIN_PASSWORD: op://Homelab/AdGuard Home/password
      ADGUARD_ADMIN_PASSWORD_HASH: op://Homelab/AdGuard Home/password_hash
      TAILSCALE_AUTH_KEY: op://Homelab/Tailscale Auth Key/credential
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      SAMBA_NAS_PASSWORD: op://Homelab/Samba NAS User/password
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/site.yml {{.CLI_ARGS}}

  deploy:base:
    desc: Deploy base configuration only
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/base.yml {{.CLI_ARGS}}

  deploy:base-first-run:
    desc: First-time base deployment (prompts for sudo password)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/base.yml -K {{.CLI_ARGS}}

  deploy:dns:
    desc: Deploy DNS stack (Unbound + AdGuard Home)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      ADGUARD_ADMIN_PASSWORD: op://Homelab/AdGuard Home/password
      ADGUARD_ADMIN_PASSWORD_HASH: op://Homelab/AdGuard Home/password_hash
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/dns.yml {{.CLI_ARGS}}

  deploy:storage:
    desc: Deploy NAS storage configuration
    dir: "{{.ANSIBLE_DIR}}"
    env:
      SAMBA_NAS_PASSWORD: op://Homelab/Samba NAS User/password
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/storage.yml {{.CLI_ARGS}}

  deploy:check:
    desc: Check mode - show what would change
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SMTP_GMAIL_USER: op://Homelab/SMTP Relay Gmail/username
      SMTP_GMAIL_PASSWORD: op://Homelab/SMTP Relay Gmail/password
      ADGUARD_ADMIN_PASSWORD: op://Homelab/AdGuard Home/password
      ADGUARD_ADMIN_PASSWORD_HASH: op://Homelab/AdGuard Home/password_hash
      TAILSCALE_AUTH_KEY: op://Homelab/Tailscale Auth Key/credential
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      SAMBA_NAS_PASSWORD: op://Homelab/Samba NAS User/password
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/site.yml --check --diff {{.CLI_ARGS}}

  deploy:verify:
    desc: Run post-deployment verification
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i {{.INVENTORY}} playbooks/postflight.yml {{.CLI_ARGS}}

  # === Plex Deployment Tasks ===
  deploy:plex:
    desc: Deploy Plex Media Server (provisions LXC container and installs Plex)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/plex.yml {{.CLI_ARGS}}

  deploy:plex-check:
    desc: Check mode - show what Plex deployment would change
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/plex.yml --check --diff {{.CLI_ARGS}}

  # === K3s Deployment Tasks ===
  k3s:provision-vms:
    desc: Provision k3s VMs on Proxmox (creates VMs only)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/k3s-provision-vms.yml {{.CLI_ARGS}}

  k3s:deploy:
    desc: Deploy k3s cluster (full deployment)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      K3S_TOKEN: op://Homelab/K3s Cluster Token/credential
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/k3s.yml {{.CLI_ARGS}}

  k3s:kubeconfig:
    desc: Fetch kubeconfig from k3s cluster
    cmds:
      - |
        ssh eric@192.168.0.222 "sudo cat /etc/rancher/k3s/k3s.yaml" | \
          sed 's/127.0.0.1/192.168.0.161/g; s/0.0.0.0/192.168.0.161/g' > ~/.kube/config-k3s
        echo "Kubeconfig saved to ~/.kube/config-k3s"
        echo "Run: export KUBECONFIG=~/.kube/config-k3s"

  # === K3s Workload Deployment Tasks ===
  k3s:deploy-metallb:
    desc: Deploy MetalLB load balancer with IP pools
    dir: ./kubernetes
    cmds:
      - helm repo add metallb https://metallb.github.io/metallb --force-update
      - helm repo update metallb
      - helm upgrade --install metallb metallb/metallb -n metallb-system --create-namespace -f bootstrap/metallb/values.yaml --wait
      - |
        echo "Waiting for MetalLB webhook to be ready..."
        kubectl wait --namespace metallb-system \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=120s
      - kubectl apply -f bootstrap/metallb/ip-pool.yaml
      - echo "MetalLB deployed successfully"

  k3s:deploy-traefik:
    desc: Deploy Traefik ingress controller
    dir: ./kubernetes/apps/traefik
    cmds:
      - helm repo add traefik https://traefik.github.io/charts --force-update
      - helm repo update traefik
      - kubectl apply -f namespace.yaml
      - helm upgrade --install traefik traefik/traefik -n traefik -f values.yaml --wait
      - kubectl apply -f traefik-internal-service.yaml
      - echo "Traefik deployed successfully"

  k3s:deploy-cert-manager:
    desc: Deploy cert-manager with Let's Encrypt ClusterIssuer
    dir: ./kubernetes/apps/cert-manager
    env:
      CLOUDFLARE_API_TOKEN: op://Homelab/Cloudflare DNS Token/credential
    cmds:
      - helm repo add jetstack https://charts.jetstack.io --force-update
      - helm repo update jetstack
      - kubectl apply -f namespace.yaml
      - helm upgrade --install cert-manager jetstack/cert-manager -n cert-manager -f values.yaml --wait
      - |
        echo "Creating Cloudflare API token secret..."
        op run -- sh -c 'kubectl create secret generic cloudflare-api-token \
          --namespace=cert-manager \
          --from-literal=api-token="$CLOUDFLARE_API_TOKEN" \
          --dry-run=client -o yaml | kubectl apply -f -'
      - kubectl apply -k .
      - echo "cert-manager deployed successfully"

  k3s:deploy-external-dns:
    desc: Deploy external-dns for automatic Cloudflare DNS management
    dir: ./kubernetes/apps/external-dns
    env:
      CLOUDFLARE_API_TOKEN: op://Homelab/Cloudflare DNS Token/credential
    cmds:
      - helm repo add external-dns https://kubernetes-sigs.github.io/external-dns --force-update
      - helm repo update external-dns
      - kubectl apply -f namespace.yaml
      - |
        echo "Creating Cloudflare API token secret..."
        op run -- sh -c 'kubectl create secret generic cloudflare-api-token \
          --namespace=external-dns \
          --from-literal=api-token="$CLOUDFLARE_API_TOKEN" \
          --dry-run=client -o yaml | kubectl apply -f -'
      - helm upgrade --install external-dns external-dns/external-dns -n external-dns -f values.yaml --wait
      - echo "external-dns deployed successfully"

  k3s:deploy-ddns:
    desc: Deploy Cloudflare DDNS CronJob for public IP updates
    dir: ./kubernetes/apps/cloudflare-ddns
    env:
      CLOUDFLARE_API_TOKEN: op://Homelab/Cloudflare DNS Token/credential
    cmds:
      - |
        echo "Creating Cloudflare API token secret in default namespace..."
        op run -- sh -c 'kubectl create secret generic cloudflare-api-token \
          --namespace=default \
          --from-literal=api-token="$CLOUDFLARE_API_TOKEN" \
          --dry-run=client -o yaml | kubectl apply -f -'
      - kubectl apply -f cronjob.yaml
      - echo "DDNS CronJob deployed successfully"

  k3s:deploy-ingress-routes:
    desc: Deploy Traefik IngressRoutes for all services
    dir: ./kubernetes/apps/ingress-routes
    cmds:
      - kubectl apply -k .
      - echo "IngressRoutes deployed successfully"

  k3s:deploy-authentik:
    desc: Deploy Authentik SSO identity provider
    dir: ./kubernetes/apps/authentik
    vars:
      AUTHENTIK_VERSION:
        sh: grep '^authentik_version:' ../../../ansible/inventories/prod/group_vars/all.yml | awk '{print $2}' | tr -d '"'
    env:
      AUTHENTIK_SECRET_KEY: op://Homelab/Authentik Secrets/secret-key
      AUTHENTIK_POSTGRESQL_PASSWORD: op://Homelab/Authentik Secrets/postgresql-password
      AUTHENTIK_POSTGRESQL_ADMIN_PASSWORD: op://Homelab/Authentik Secrets/postgresql-admin-password
      # SMTP credentials for email notifications (uses same creds as other services)
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
    cmds:
      - echo "Deploying Authentik version {{.AUTHENTIK_VERSION}}"
      - helm repo add authentik https://charts.goauthentik.io --force-update
      - helm repo update authentik
      - kubectl apply -f namespace.yaml
      - kubectl apply -f storage.yaml
      - |
        echo "Creating Authentik secrets from 1Password..."
        op run -- sh -c 'kubectl create secret generic authentik-secrets \
          --namespace=authentik \
          --from-literal=secret-key="$AUTHENTIK_SECRET_KEY" \
          --from-literal=postgresql-password="$AUTHENTIK_POSTGRESQL_PASSWORD" \
          --from-literal=postgresql-admin-password="$AUTHENTIK_POSTGRESQL_ADMIN_PASSWORD" \
          --from-literal=smtp-username="$SMTP_RELAY_USER" \
          --from-literal=smtp-password="$SMTP_RELAY_PASSWORD" \
          --dry-run=client -o yaml | kubectl apply -f -'
      - |
        echo "Installing Authentik via Helm..."
        op run -- sh -c 'helm upgrade --install authentik authentik/authentik \
          -n authentik \
          -f values.yaml \
          --version "{{.AUTHENTIK_VERSION}}" \
          --set authentik.secret_key="$AUTHENTIK_SECRET_KEY" \
          --set server.image.tag="{{.AUTHENTIK_VERSION}}" \
          --set worker.image.tag="{{.AUTHENTIK_VERSION}}" \
          --wait --timeout 10m'
      - |
        echo "Waiting for Authentik server to be ready..."
        kubectl wait --namespace authentik \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/name=authentik,app.kubernetes.io/component=server \
          --timeout=300s
      - kubectl apply -k .
      - echo "Authentik deployed successfully"

  k3s:deploy-workloads:
    desc: Deploy ALL k3s platform workloads in correct order
    cmds:
      - task: k3s:deploy-metallb
      - task: k3s:deploy-traefik
      - task: k3s:deploy-cert-manager
      - task: k3s:deploy-external-dns
      - task: k3s:deploy-ddns
      - task: k3s:deploy-ingress-routes
      - task: k3s:deploy-authentik
      - echo "K3s platform workloads deployed successfully"

  k3s:status:
    desc: Show k3s cluster and workload status
    cmds:
      - echo "=== K3s Cluster Status ==="
      - kubectl get nodes -o wide
      - echo ""
      - echo "=== Platform Services ==="
      - echo "MetalLB -"
      - kubectl get pods -n metallb-system 2>/dev/null || echo "  Not installed"
      - kubectl get ipaddresspool -n metallb-system 2>/dev/null || true
      - echo ""
      - echo "Traefik -"
      - kubectl get pods -n traefik 2>/dev/null || echo "  Not installed"
      - kubectl get svc -n traefik 2>/dev/null || true
      - echo ""
      - echo "cert-manager -"
      - kubectl get pods -n cert-manager 2>/dev/null || echo "  Not installed"
      - kubectl get certificate -A 2>/dev/null || true
      - echo ""
      - echo "external-dns -"
      - kubectl get pods -n external-dns 2>/dev/null || echo "  Not installed"
      - echo ""
      - echo "DDNS CronJob -"
      - kubectl get cronjob cloudflare-ddns -n default 2>/dev/null || echo "  Not installed"
      - echo ""
      - echo "Authentik SSO -"
      - kubectl get pods -n authentik 2>/dev/null || echo "  Not installed"
      - kubectl get svc -n authentik 2>/dev/null || true
      - echo ""
      - echo "IngressRoutes -"
      - kubectl get ingressroute -A 2>/dev/null || echo "  None configured"

  # === Maintenance Tasks ===
  maintenance:update-packages:
    desc: Update OS packages on all hosts (rolling, interactive)
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i {{.INVENTORY}} playbooks/maintenance/update-packages.yml {{.CLI_ARGS}}

  maintenance:update-packages-auto:
    desc: Update OS packages on all hosts (rolling, auto-reboot)
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i {{.INVENTORY}} playbooks/maintenance/update-packages.yml -e auto_reboot=true {{.CLI_ARGS}}

  maintenance:update-applications:
    desc: Update homelab applications to versions in versions.yml
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      ADGUARD_ADMIN_PASSWORD: op://Homelab/AdGuard Home/password
      ADGUARD_ADMIN_PASSWORD_HASH: op://Homelab/AdGuard Home/password_hash
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/maintenance/update-applications.yml {{.CLI_ARGS}}

  maintenance:update-full:
    desc: Full system update - packages + applications (rolling, interactive)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      ADGUARD_ADMIN_PASSWORD: op://Homelab/AdGuard Home/password
      ADGUARD_ADMIN_PASSWORD_HASH: op://Homelab/AdGuard Home/password_hash
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/maintenance/update-full.yml {{.CLI_ARGS}}

  maintenance:update-full-auto:
    desc: Full system update - packages + applications (rolling, auto-reboot)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      ADGUARD_ADMIN_PASSWORD: op://Homelab/AdGuard Home/password
      ADGUARD_ADMIN_PASSWORD_HASH: op://Homelab/AdGuard Home/password_hash
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/maintenance/update-full.yml -e auto_reboot=true {{.CLI_ARGS}}

  # === Disaster Recovery Tasks ===
  disaster-recovery:storage-bootstrap:
    desc: Bootstrap storage from scratch (INTERACTIVE - for disaster recovery only)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      SAMBA_NAS_PASSWORD: op://Homelab/Samba NAS User/password
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/bootstrap/storage-bootstrap.yml --limit pve-nas-01 {{.CLI_ARGS}}

  # === Proxmox Management Tasks ===
  proxmox:configure-autostart:
    desc: Configure autostart and boot order for existing VMs/containers (one-time setup)
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i {{.INVENTORY}} playbooks/proxmox-enable-autostart.yml {{.CLI_ARGS}}

  # === Terraform Tasks ===
  terraform:init:
    desc: Initialize Terraform
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    cmds:
      - terraform init

  terraform:plan:
    desc: Plan Terraform changes
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    cmds:
      - |
        terraform plan \
          -var="cloudflare_api_token=$(op read 'op://Homelab/Cloudflare DNS Token/credential')" \
          -var="cloudflare_account_id=$(op read 'op://Homelab/Cloudflare DNS Token/username')" \
          {{.CLI_ARGS}}

  terraform:apply:
    desc: Apply Terraform changes
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    cmds:
      - |
        terraform apply \
          -var="cloudflare_api_token=$(op read 'op://Homelab/Cloudflare DNS Token/credential')" \
          -var="cloudflare_account_id=$(op read 'op://Homelab/Cloudflare DNS Token/username')" \
          {{.CLI_ARGS}}

  terraform:validate:
    desc: Validate Terraform configuration
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    cmds:
      - terraform validate

  terraform:fmt:
    desc: Format Terraform files
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    cmds:
      - terraform fmt -recursive

  terraform:fmt-check:
    desc: Check Terraform formatting
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    cmds:
      - terraform fmt -check -recursive

  # === Utility Tasks ===
  collect-state:
    desc: Collect redacted cluster state
    cmds:
      - ./scripts/collect-state.sh {{.CLI_ARGS}}

  lint:
    desc: Run all linters
    cmds:
      - task: ansible:lint
      - task: terraform:fmt-check
      - task: terraform:init
      - task: terraform:validate

  # === 1Password Integration ===
  op:check:
    desc: Verify 1Password CLI is authenticated
    cmds:
      - op account get

  secrets:show:
    desc: Display secret references (not values)
    cmds:
      - |
        echo "Secret references in use:"
        echo "  - op://Homelab/Cloudflare DNS Token/credential"
        echo "  - op://Homelab/Cloudflare DNS Token/account_id"
        echo "  - op://Homelab/SMTP Relay Gmail/password"
        echo "  - op://Homelab/SMTP Relay Gmail/username"
        echo "  - op://Homelab/AdGuard Home/password"
        echo "  - op://Homelab/Tailscale Auth Key/credential"
        echo "  - op://Homelab/PrivadoVPN Credentials/openvpn-user"
        echo "  - op://Homelab/PrivadoVPN Credentials/openvpn-password"
        echo "  - op://Homelab/VPN Unlimited Credentials/openvpn-user"
        echo "  - op://Homelab/VPN Unlimited Credentials/openvpn-password"
        echo "  - op://Homelab/Mealie Secrets/postgres-password"
        echo "  - op://Homelab/Mealie SSO/oidc-client-id"
        echo "  - op://Homelab/Mealie SSO/oidc-client-secret"
        echo "  - op://Homelab/OpenAI API Key/api-key"
        echo "  - op://Homelab/Bar Assistant Secrets/meilisearch-master-key"
        echo "  - op://Homelab/Bar Assistant SSO/authentik-client-id"
        echo "  - op://Homelab/Bar Assistant SSO/authentik-client-secret"
        echo "  - op://Homelab/Home Assistant SSO/authentik-client-id"
        echo "  - op://Homelab/Home Assistant SSO/authentik-client-secret"

  # === Download Clients / Media Stack Tasks ===
  # New architecture: Each download client (nzbget, qbittorrent) runs independently
  # with its own optional Gluetun VPN sidecar. VPN can be enabled/disabled per-app.

  downloads:deploy:
    desc: Deploy download clients and media management stack
    dir: ./kubernetes/apps/download-clients
    cmds:
      - kubectl apply -f namespace.yaml
      - |
        echo "Creating VPN credentials secret (using PrivadoVPN by default)..."
        # Validate 1Password is signed in and credentials are not empty
        if ! op whoami &>/dev/null; then
          echo "ERROR: 1Password CLI not signed in. Run 'eval \$(op signin)' first."
          exit 1
        fi
        VPN_USER=$(op read 'op://Homelab/PrivadoVPN Credentials/openvpn-user')
        VPN_PASS=$(op read 'op://Homelab/PrivadoVPN Credentials/openvpn-password')
        if [ -z "$VPN_USER" ] || [ -z "$VPN_PASS" ]; then
          echo "ERROR: VPN credentials are empty. Check 1Password item 'PrivadoVPN Credentials'."
          exit 1
        fi
        kubectl create secret generic vpn-credentials \
          --namespace=downloads \
          --from-literal=openvpn-user="$VPN_USER" \
          --from-literal=openvpn-password="$VPN_PASS" \
          --dry-run=client -o yaml | kubectl apply -f -
      - |
        echo "Reading versions from centralized configuration..."
        # Read versions from ansible/inventories/prod/group_vars/all.yml
        # Using grep + awk to extract values (no yq dependency required)
        VARS_FILE="../../../ansible/inventories/prod/group_vars/all.yml"
        export GLUETUN_VERSION=$(grep '^gluetun_version:' "$VARS_FILE" | awk '{print $2}' | tr -d '"')
        export NZBGET_VERSION=$(grep '^nzbget_version:' "$VARS_FILE" | awk '{print $2}' | tr -d '"')
        export QBITTORRENT_VERSION=$(grep '^qbittorrent_version:' "$VARS_FILE" | awk '{print $2}' | tr -d '"')
        export PROWLARR_VERSION=$(grep '^prowlarr_version:' "$VARS_FILE" | awk '{print $2}' | tr -d '"')
        export SONARR_VERSION=$(grep '^sonarr_version:' "$VARS_FILE" | awk '{print $2}' | tr -d '"')
        export RADARR_VERSION=$(grep '^radarr_version:' "$VARS_FILE" | awk '{print $2}' | tr -d '"')
        export LIDARR_VERSION=$(grep '^lidarr_version:' "$VARS_FILE" | awk '{print $2}' | tr -d '"')
        export PULSARR_VERSION=$(grep '^pulsarr_version:' "$VARS_FILE" | awk '{print $2}' | tr -d '"')

        echo "Versions: Gluetun=$GLUETUN_VERSION, NZBGet=$NZBGET_VERSION, qBittorrent=$QBITTORRENT_VERSION"
        echo "         Prowlarr=$PROWLARR_VERSION, Sonarr=$SONARR_VERSION, Radarr=$RADARR_VERSION"
        echo "         Lidarr=$LIDARR_VERSION, Pulsarr=$PULSARR_VERSION"

        # Validate all version variables are non-empty
        if [ -z "$GLUETUN_VERSION" ] || [ -z "$NZBGET_VERSION" ] || [ -z "$QBITTORRENT_VERSION" ] || \
           [ -z "$PROWLARR_VERSION" ] || [ -z "$SONARR_VERSION" ] || [ -z "$RADARR_VERSION" ] || \
           [ -z "$LIDARR_VERSION" ] || [ -z "$PULSARR_VERSION" ]; then
          echo "ERROR: One or more version variables are empty. Check $VARS_FILE format."
          exit 1
        fi

        # Apply manifests with version substitution
        # Only substitute our specific version variables (prevents envsubst from replacing other $ references)
        ENVSUBST_VARS='$GLUETUN_VERSION $NZBGET_VERSION $QBITTORRENT_VERSION $PROWLARR_VERSION $SONARR_VERSION $RADARR_VERSION $LIDARR_VERSION $PULSARR_VERSION'
        for file in nzbget.yaml qbittorrent.yaml prowlarr.yaml sonarr.yaml radarr.yaml lidarr.yaml pulsarr.yaml; do
          envsubst "$ENVSUBST_VARS" < "$file" | kubectl apply -f -
        done

        # Apply remaining resources without substitution
        kubectl apply -f storage.yaml
        kubectl apply -f certificate.yaml
        kubectl apply -f ingress-routes.yaml
        kubectl apply -f ingress-routes-ha-bypass.yaml
      - |
        echo "Waiting for NZBGet to be ready..."
        kubectl wait --namespace downloads \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/name=nzbget \
          --timeout=300s || echo "Warning: NZBGet not ready yet"
      - |
        echo "Waiting for qBittorrent to be ready..."
        kubectl wait --namespace downloads \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/name=qbittorrent \
          --timeout=300s || echo "Warning: qBittorrent not ready yet"
      - echo "Download clients and media stack deployed successfully"

  downloads:status:
    desc: Show status of download clients and media stack
    cmds:
      - echo "=== Download Clients Namespace ==="
      - kubectl get pods -n downloads -o wide
      - echo ""
      - echo "=== Services ==="
      - kubectl get svc -n downloads
      - echo ""
      - echo "=== PVCs ==="
      - kubectl get pvc -n downloads
      - echo ""
      - echo "=== VPN ConfigMaps ==="
      - 'echo "NZBGet VPN:"'
      - kubectl get configmap nzbget-vpn-config -n downloads -o jsonpath='{.data}' 2>/dev/null || echo "  Not configured"
      - echo ""
      - 'echo "qBittorrent VPN:"'
      - kubectl get configmap qbittorrent-vpn-config -n downloads -o jsonpath='{.data}' 2>/dev/null || echo "  Not configured"
      - echo ""
      - echo "=== IngressRoutes ==="
      - kubectl get ingressroute -n downloads

  downloads:vpn-status:
    desc: Check VPN connection status for all download clients
    cmds:
      - echo "=== NZBGet VPN Status ==="
      - |
        VPN_ENABLED=$(kubectl get configmap nzbget-vpn-config -n downloads -o jsonpath='{.data.vpn_enabled}' 2>/dev/null || echo "unknown")
        VPN_PROVIDER=$(kubectl get configmap nzbget-vpn-config -n downloads -o jsonpath='{.data.vpn_provider}' 2>/dev/null || echo "unknown")
        echo "VPN Enabled: $VPN_ENABLED"
        echo "Provider: $VPN_PROVIDER"
        if [ "$VPN_ENABLED" = "true" ]; then
          echo "Gluetun logs (last 10 lines):"
          kubectl logs -n downloads -l app.kubernetes.io/name=nzbget -c gluetun --tail=10 2>/dev/null || echo "  Cannot get logs"
          echo "Public IP:"
          kubectl exec -n downloads deployment/nzbget -c gluetun -- wget -qO- https://checkip.amazonaws.com 2>/dev/null || echo "  Cannot reach checkip.amazonaws.com"
        fi
      - echo ""
      - echo "=== qBittorrent VPN Status ==="
      - |
        VPN_ENABLED=$(kubectl get configmap qbittorrent-vpn-config -n downloads -o jsonpath='{.data.vpn_enabled}' 2>/dev/null || echo "unknown")
        VPN_PROVIDER=$(kubectl get configmap qbittorrent-vpn-config -n downloads -o jsonpath='{.data.vpn_provider}' 2>/dev/null || echo "unknown")
        echo "VPN Enabled: $VPN_ENABLED"
        echo "Provider: $VPN_PROVIDER"
        if [ "$VPN_ENABLED" = "true" ]; then
          echo "Gluetun logs (last 10 lines):"
          kubectl logs -n downloads -l app.kubernetes.io/name=qbittorrent -c gluetun --tail=10 2>/dev/null || echo "  Cannot get logs"
          echo "Public IP:"
          kubectl exec -n downloads deployment/qbittorrent -c gluetun -- wget -qO- https://checkip.amazonaws.com 2>/dev/null || echo "  Cannot reach checkip.amazonaws.com"
        fi

  downloads:vpn:
    desc: "Enable/disable VPN for an app (task downloads:vpn APP=nzbget ENABLED=true PROVIDER=privado)"
    vars:
      APP: '{{.APP | default ""}}'
      ENABLED: '{{.ENABLED | default "true"}}'
      PROVIDER: '{{.PROVIDER | default "privado"}}'
    cmds:
      - |
        APP="{{.APP}}"
        ENABLED="{{.ENABLED}}"
        PROVIDER="{{.PROVIDER}}"

        if [ -z "$APP" ]; then
          echo "Usage: task downloads:vpn APP=<nzbget|qbittorrent> ENABLED=<true|false> [PROVIDER=<privado|vpn-unlimited>]"
          echo ""
          echo "Examples:"
          echo "  task downloads:vpn APP=nzbget ENABLED=true                    # Enable VPN with current provider"
          echo "  task downloads:vpn APP=nzbget ENABLED=true PROVIDER=privado   # Enable with PrivadoVPN"
          echo "  task downloads:vpn APP=nzbget ENABLED=false                   # Disable VPN (direct internet)"
          echo "  task downloads:vpn APP=qbittorrent ENABLED=true PROVIDER=vpn-unlimited"
          exit 1
        fi

        if [ "$APP" != "nzbget" ] && [ "$APP" != "qbittorrent" ]; then
          echo "ERROR: APP must be 'nzbget' or 'qbittorrent'"
          exit 1
        fi

        CONFIGMAP="${APP}-vpn-config"

        # Update credentials if enabling VPN
        if [ "$ENABLED" = "true" ]; then
          # Validate 1Password is signed in
          if ! op whoami &>/dev/null; then
            echo "ERROR: 1Password CLI not signed in. Run 'eval \$(op signin)' first."
            exit 1
          fi
          case "$PROVIDER" in
            privado)
              echo "Updating VPN credentials (PrivadoVPN)..."
              VPN_USER=$(op read 'op://Homelab/PrivadoVPN Credentials/openvpn-user')
              VPN_PASS=$(op read 'op://Homelab/PrivadoVPN Credentials/openvpn-password')
              ;;
            vpn-unlimited|keepsolid)
              echo "Updating VPN credentials (VPN Unlimited)..."
              VPN_USER=$(op read 'op://Homelab/VPN Unlimited Credentials/openvpn-user')
              VPN_PASS=$(op read 'op://Homelab/VPN Unlimited Credentials/openvpn-password')
              PROVIDER="vpn unlimited"
              ;;
            *)
              echo "ERROR: Unknown provider: $PROVIDER"
              echo "Supported providers: privado, vpn-unlimited"
              exit 1
              ;;
          esac
          # Validate credentials are not empty
          if [ -z "$VPN_USER" ] || [ -z "$VPN_PASS" ]; then
            echo "ERROR: VPN credentials are empty. Check 1Password item."
            exit 1
          fi
          kubectl create secret generic vpn-credentials \
            --namespace=downloads \
            --from-literal=openvpn-user="$VPN_USER" \
            --from-literal=openvpn-password="$VPN_PASS" \
            --dry-run=client -o yaml | kubectl apply -f -
        fi

        # Update the ConfigMap
        kubectl patch configmap "$CONFIGMAP" -n downloads -p "{\"data\":{\"vpn_enabled\":\"$ENABLED\",\"vpn_provider\":\"$PROVIDER\"}}"

        # Restart the deployment
        kubectl rollout restart deployment/"$APP" -n downloads
        kubectl rollout status deployment/"$APP" -n downloads --timeout=180s

        if [ "$ENABLED" = "true" ]; then
          echo "$APP VPN enabled ($PROVIDER)"
        else
          echo "$APP VPN disabled"
        fi

  downloads:vpn-credentials:
    desc: "Update VPN credentials (task downloads:vpn-credentials PROVIDER=privado)"
    vars:
      PROVIDER: '{{.PROVIDER | default "privado"}}'
    cmds:
      - |
        PROVIDER="{{.PROVIDER}}"
        # Validate 1Password is signed in
        if ! op whoami &>/dev/null; then
          echo "ERROR: 1Password CLI not signed in. Run 'eval \$(op signin)' first."
          exit 1
        fi
        case "$PROVIDER" in
          privado)
            VPN_USER=$(op read 'op://Homelab/PrivadoVPN Credentials/openvpn-user')
            VPN_PASS=$(op read 'op://Homelab/PrivadoVPN Credentials/openvpn-password')
            ;;
          vpn-unlimited|keepsolid)
            VPN_USER=$(op read 'op://Homelab/VPN Unlimited Credentials/openvpn-user')
            VPN_PASS=$(op read 'op://Homelab/VPN Unlimited Credentials/openvpn-password')
            ;;
          *)
            echo "ERROR: Unknown provider: $PROVIDER"
            echo "Supported providers: privado, vpn-unlimited"
            exit 1
            ;;
        esac
        # Validate credentials are not empty
        if [ -z "$VPN_USER" ] || [ -z "$VPN_PASS" ]; then
          echo "ERROR: VPN credentials are empty. Check 1Password item."
          exit 1
        fi
        kubectl create secret generic vpn-credentials \
          --namespace=downloads \
          --from-literal=openvpn-user="$VPN_USER" \
          --from-literal=openvpn-password="$VPN_PASS" \
          --dry-run=client -o yaml | kubectl apply -f -
        echo "VPN credentials updated for $PROVIDER"

  downloads:restart:
    desc: Restart all download clients and media apps
    cmds:
      - echo "Restarting download clients..."
      - kubectl rollout restart deployment/nzbget -n downloads
      - kubectl rollout restart deployment/qbittorrent -n downloads
      - echo "Restarting *arr apps..."
      - kubectl rollout restart deployment/prowlarr -n downloads
      - kubectl rollout restart deployment/sonarr -n downloads
      - kubectl rollout restart deployment/radarr -n downloads
      - kubectl rollout restart deployment/lidarr -n downloads
      - kubectl rollout restart deployment/pulsarr -n downloads
      - echo "Waiting for pods to be ready..."
      - kubectl wait --namespace downloads --for=condition=ready pod --all --timeout=300s

  downloads:logs:
    desc: "View logs for a specific app (task downloads:logs APP=nzbget [CONTAINER=gluetun])"
    vars:
      APP: '{{.APP | default "nzbget"}}'
      CONTAINER: '{{.CONTAINER | default ""}}'
    cmds:
      - |
        APP="{{.APP}}"
        CONTAINER="{{.CONTAINER}}"

        case "$APP" in
          nzbget|qbittorrent)
            if [ -n "$CONTAINER" ]; then
              echo "=== $APP / $CONTAINER logs ==="
              kubectl logs -n downloads -l app.kubernetes.io/name="$APP" -c "$CONTAINER" -f
            else
              echo "=== $APP logs (main container) ==="
              kubectl logs -n downloads -l app.kubernetes.io/name="$APP" -c "$APP" -f
            fi
            ;;
          nzbget-vpn|qbittorrent-vpn)
            REAL_APP="${APP%-vpn}"
            echo "=== $REAL_APP / gluetun logs ==="
            kubectl logs -n downloads -l app.kubernetes.io/name="$REAL_APP" -c gluetun -f
            ;;
          *)
            echo "=== $APP logs ==="
            kubectl logs -n downloads -l app.kubernetes.io/name="$APP" -f
            ;;
        esac

  downloads:shell:
    desc: "Open shell in app container (task downloads:shell APP=nzbget [CONTAINER=gluetun])"
    vars:
      APP: '{{.APP | default "nzbget"}}'
      CONTAINER: '{{.CONTAINER | default ""}}'
    cmds:
      - |
        APP="{{.APP}}"
        CONTAINER="{{.CONTAINER}}"

        case "$APP" in
          nzbget|qbittorrent)
            if [ -n "$CONTAINER" ]; then
              echo "Opening shell in $APP / $CONTAINER..."
              kubectl exec -it -n downloads deployment/"$APP" -c "$CONTAINER" -- /bin/sh
            else
              echo "Opening shell in $APP..."
              kubectl exec -it -n downloads deployment/"$APP" -c "$APP" -- /bin/sh
            fi
            ;;
          *)
            echo "Opening shell in $APP..."
            kubectl exec -it -n downloads deployment/"$APP" -- /bin/sh
            ;;
        esac

  downloads:delete:
    desc: Delete download clients and media stack (preserves namespace, PVCs, and secrets)
    dir: ./kubernetes/apps/download-clients
    cmds:
      - echo "Deleting workloads (preserving namespace, storage, and secrets)..."
      - |
        # Delete only workload resources, NOT namespace/storage/secrets
        # This allows safe redeploy with 'task downloads:deploy'
        kubectl delete -f nzbget.yaml --ignore-not-found
        kubectl delete -f qbittorrent.yaml --ignore-not-found
        kubectl delete -f prowlarr.yaml --ignore-not-found
        kubectl delete -f sonarr.yaml --ignore-not-found
        kubectl delete -f radarr.yaml --ignore-not-found
        kubectl delete -f lidarr.yaml --ignore-not-found
        kubectl delete -f pulsarr.yaml --ignore-not-found
        kubectl delete -f ingress-routes.yaml --ignore-not-found
        kubectl delete -f ingress-routes-ha-bypass.yaml --ignore-not-found
      - |
        echo ""
        echo "Workloads deleted. Namespace, PVCs, and secrets preserved."
        echo "Re-deploy with: task downloads:deploy"
        echo ""
        echo "To fully remove everything:"
        echo "  kubectl delete namespace downloads"

  # === Recipe Management Stack Tasks ===
  # Mealie (recipe management) and Bar Assistant (cocktail recipes)
  # Data services pinned to NAS node for NFS locality and backup consistency

  recipes:deploy:
    desc: Deploy Mealie and Bar Assistant recipe management stack
    dir: ./kubernetes/apps/recipes
    cmds:
      - kubectl apply -f namespace.yaml
      - kubectl apply -f storage.yaml
      - |
        # Create secrets from 1Password using op run wrapper
        # op run handles authentication automatically (prompts if needed)
        op run --no-masking -- sh -c '
          echo "Creating secrets from 1Password..."

          # Read all secrets from 1Password (required secrets - no fallbacks)
          # This ensures idempotent deployments and supports credential rotation
          echo "Reading secrets from 1Password..."

          # Required for all deployments
          SMTP_USER=$(op read "op://Homelab/SMTP Relay Auth/username")
          SMTP_PASS=$(op read "op://Homelab/SMTP Relay Auth/password")
          MEALIE_PG_PASS=$(op read "op://Homelab/Mealie Secrets/postgres-password")
          MEILI_KEY=$(op read "op://Homelab/Bar Assistant Secrets/meilisearch-master-key")

          # SSO secrets (REQUIRED - password login is disabled, SSO is the only way to log in)
          MEALIE_OIDC_CLIENT_ID=$(op read "op://Homelab/Mealie SSO/oidc-client-id")
          MEALIE_OIDC_CLIENT_SECRET=$(op read "op://Homelab/Mealie SSO/oidc-client-secret")
          BA_CLIENT_ID=$(op read "op://Homelab/Bar Assistant SSO/authentik-client-id")
          BA_CLIENT_SECRET=$(op read "op://Homelab/Bar Assistant SSO/authentik-client-secret")

          # Optional: OpenAI for recipe parsing (deployment proceeds without this)
          MEALIE_OPENAI_KEY=$(op read "op://Homelab/OpenAI API Key/api-key" 2>/dev/null || echo "")

          # Validate required secrets are not empty
          MISSING=""
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASS" ]; then
            MISSING="$MISSING\n  - SMTP Relay Auth (username, password)"
          fi
          if [ -z "$MEALIE_PG_PASS" ]; then
            MISSING="$MISSING\n  - Mealie Secrets (postgres-password)"
          fi
          if [ -z "$MEILI_KEY" ]; then
            MISSING="$MISSING\n  - Bar Assistant Secrets (meilisearch-master-key)"
          fi
          if [ -z "$MEALIE_OIDC_CLIENT_ID" ] || [ -z "$MEALIE_OIDC_CLIENT_SECRET" ]; then
            MISSING="$MISSING\n  - Mealie SSO (oidc-client-id, oidc-client-secret)"
          fi
          if [ -z "$BA_CLIENT_ID" ] || [ -z "$BA_CLIENT_SECRET" ]; then
            MISSING="$MISSING\n  - Bar Assistant SSO (authentik-client-id, authentik-client-secret)"
          fi

          if [ -n "$MISSING" ]; then
            echo "ERROR: Required 1Password secrets are missing:$MISSING"
            echo ""
            echo "Create these items in 1Password vault Homelab before deploying."
            echo "SSO secrets are REQUIRED - password login is disabled in both apps."
            echo "See docs/22-recipes-deployment.md and docs/23-recipes-sso-setup.md for setup instructions."
            exit 1
          fi

          # Warn about optional secrets
          if [ -z "$MEALIE_OPENAI_KEY" ]; then
            echo "NOTE: OpenAI API key not found. Recipe parsing from images will be disabled."
            echo "      Add API key to OpenAI API Key 1Password item to enable."
          fi

          # Create Mealie secrets
          kubectl create secret generic mealie-secrets \
            --namespace=recipes \
            --from-literal=postgres-password="$MEALIE_PG_PASS" \
            --from-literal=smtp-username="$SMTP_USER" \
            --from-literal=smtp-password="$SMTP_PASS" \
            --from-literal=oidc-client-id="$MEALIE_OIDC_CLIENT_ID" \
            --from-literal=oidc-client-secret="$MEALIE_OIDC_CLIENT_SECRET" \
            --from-literal=openai-api-key="$MEALIE_OPENAI_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Create Bar Assistant secrets
          kubectl create secret generic bar-assistant-secrets \
            --namespace=recipes \
            --from-literal=meilisearch-master-key="$MEILI_KEY" \
            --from-literal=smtp-username="$SMTP_USER" \
            --from-literal=smtp-password="$SMTP_PASS" \
            --from-literal=authentik-client-id="$BA_CLIENT_ID" \
            --from-literal=authentik-client-secret="$BA_CLIENT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Secrets created/updated successfully"
        '
      - |
        echo "Reading versions from centralized configuration..."
        VARS_FILE="../../../ansible/inventories/prod/group_vars/all.yml"
        export MEALIE_VERSION=$(grep '^mealie_version:' "$VARS_FILE" | awk '{print $2}' | tr -d '"')
        export BAR_ASSISTANT_VERSION=$(grep '^bar_assistant_version:' "$VARS_FILE" | awk '{print $2}' | tr -d '"')
        export SALT_RIM_VERSION=$(grep '^salt_rim_version:' "$VARS_FILE" | awk '{print $2}' | tr -d '"')

        echo "Versions: Mealie=$MEALIE_VERSION, Bar Assistant=$BAR_ASSISTANT_VERSION, Salt Rim=$SALT_RIM_VERSION"

        if [ -z "$MEALIE_VERSION" ] || [ -z "$BAR_ASSISTANT_VERSION" ] || [ -z "$SALT_RIM_VERSION" ]; then
          echo "ERROR: One or more version variables are empty. Check $VARS_FILE format."
          exit 1
        fi

        # Apply manifests with version substitution
        ENVSUBST_VARS='$MEALIE_VERSION $BAR_ASSISTANT_VERSION $SALT_RIM_VERSION'
        envsubst "$ENVSUBST_VARS" < mealie.yaml | kubectl apply -f -
        envsubst "$ENVSUBST_VARS" < bar-assistant.yaml | kubectl apply -f -

        # Apply ingress routes (no substitution needed)
        kubectl apply -f ingress-routes.yaml
      - |
        echo "Waiting for Mealie PostgreSQL to be ready..."
        kubectl wait --namespace recipes \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/name=mealie-postgres \
          --timeout=180s || echo "Warning: Mealie PostgreSQL not ready yet"
      - |
        echo "Waiting for Mealie to be ready..."
        kubectl wait --namespace recipes \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/name=mealie \
          --timeout=300s || echo "Warning: Mealie not ready yet"
      - |
        echo "Waiting for Bar Assistant to be ready..."
        kubectl wait --namespace recipes \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/name=bar-assistant \
          --timeout=300s || echo "Warning: Bar Assistant not ready yet"
      - echo "Recipe management stack deployed successfully"

  recipes:status:
    desc: Show status of recipe management stack
    cmds:
      - echo "=== Recipes Namespace ==="
      - kubectl get pods -n recipes -o wide
      - echo ""
      - echo "=== Services ==="
      - kubectl get svc -n recipes
      - echo ""
      - echo "=== PVCs ==="
      - kubectl get pvc -n recipes
      - echo ""
      - echo "=== IngressRoutes ==="
      - kubectl get ingressroute -n recipes

  recipes:restart:
    desc: Restart all recipe apps
    cmds:
      - echo "Restarting Mealie..."
      - kubectl rollout restart deployment/mealie -n recipes
      - kubectl rollout restart deployment/mealie-postgres -n recipes
      - echo "Restarting Bar Assistant..."
      - kubectl rollout restart deployment/bar-assistant -n recipes
      - kubectl rollout restart deployment/bar-assistant-redis -n recipes
      - kubectl rollout restart deployment/bar-assistant-meilisearch -n recipes
      - kubectl rollout restart deployment/salt-rim -n recipes
      - echo "Waiting for pods to be ready..."
      - kubectl wait --namespace recipes --for=condition=ready pod --all --timeout=300s

  recipes:logs:
    desc: "View logs for a specific app (task recipes:logs APP=mealie)"
    vars:
      APP: '{{.APP | default "mealie"}}'
    cmds:
      - |
        APP="{{.APP}}"
        echo "=== $APP logs ==="
        kubectl logs -n recipes -l app.kubernetes.io/name="$APP" -f

  recipes:shell:
    desc: "Open shell in app container (task recipes:shell APP=mealie)"
    vars:
      APP: '{{.APP | default "mealie"}}'
    cmds:
      - |
        APP="{{.APP}}"
        echo "Opening shell in $APP..."
        kubectl exec -it -n recipes deployment/"$APP" -- /bin/sh

  recipes:delete:
    desc: Delete recipe stack (preserves namespace, PVCs, and secrets)
    dir: ./kubernetes/apps/recipes
    cmds:
      - echo "Deleting workloads (preserving namespace, storage, and secrets)..."
      - |
        # Delete only workload resources, NOT namespace/storage/secrets
        kubectl delete -f mealie.yaml --ignore-not-found
        kubectl delete -f bar-assistant.yaml --ignore-not-found
        kubectl delete -f ingress-routes.yaml --ignore-not-found
      - |
        echo ""
        echo "Workloads deleted. Namespace, PVCs, and secrets preserved."
        echo "Re-deploy with: task recipes:deploy"
        echo ""
        echo "To fully remove everything:"
        echo "  kubectl delete namespace recipes"

  # === Home Assistant Tasks ===
  # Home Assistant runs as a standalone VM on Proxmox (not in k3s)
  # Traefik provides ingress via IngressRoute + Service/EndpointSlice

  home-assistant:status:
    desc: Show Home Assistant VM and ingress status
    cmds:
      - echo "=== Home Assistant VM Status ==="
      - |
        ssh pve-nas-01 "sudo qm status 154" 2>/dev/null || echo "Cannot reach Proxmox host"
      - echo ""
      - echo "=== Network Connectivity ==="
      - |
        if curl -s --connect-timeout 2 http://192.168.0.154:8123 >/dev/null 2>&1; then
          echo "Home Assistant HTTP: OK (192.168.0.154:8123)"
        else
          echo "Home Assistant HTTP: UNREACHABLE"
        fi
      - echo ""
      - echo "=== Kubernetes Resources ==="
      - kubectl get service home-assistant-backend -o wide 2>/dev/null || echo "Service not found"
      - kubectl get endpointslice home-assistant-backend 2>/dev/null || echo "EndpointSlice not found"
      - kubectl get ingressroute -A 2>/dev/null | grep -E "NAME|home-assistant" || echo "IngressRoutes not found"
      - echo ""
      - echo "=== Traefik Routing Test ==="
      - |
        echo "Internal (home.esweiss.com):"
        curl -sk --connect-timeout 5 https://home.esweiss.com -o /dev/null -w "  HTTP Status: %{http_code}\n" 2>/dev/null || echo "  UNREACHABLE"
        echo "External (home.ericsweiss.com):"
        curl -sk --connect-timeout 5 https://home.ericsweiss.com -o /dev/null -w "  HTTP Status: %{http_code}\n" 2>/dev/null || echo "  UNREACHABLE"

  home-assistant:vm-start:
    desc: Start the Home Assistant VM
    cmds:
      - ssh pve-nas-01 "sudo qm start 154"
      - echo "Waiting for Home Assistant to be reachable..."
      - |
        for i in $(seq 1 30); do
          if curl -s --connect-timeout 2 http://192.168.0.154:8123 >/dev/null 2>&1; then
            echo "Home Assistant is up!"
            exit 0
          fi
          echo "Waiting... ($i/30)"
          sleep 5
        done
        echo "Warning: Home Assistant may still be starting"

  home-assistant:vm-stop:
    desc: Stop the Home Assistant VM gracefully
    cmds:
      - ssh pve-nas-01 "sudo qm shutdown 154"
      - echo "Sent shutdown signal to Home Assistant VM"

  home-assistant:vm-restart:
    desc: Restart the Home Assistant VM
    cmds:
      - ssh pve-nas-01 "sudo qm reboot 154"
      - echo "Sent reboot signal to Home Assistant VM"

  home-assistant:console:
    desc: Open SSH console to Home Assistant (if SSH add-on installed)
    cmds:
      - |
        echo "Connecting to Home Assistant..."
        echo "Note: Requires SSH add-on to be installed in Home Assistant"
        ssh root@192.168.0.154 -p 22222 || echo "SSH connection failed. Is the SSH add-on installed and configured?"

  home-assistant:logs:
    desc: View Home Assistant core logs via API (requires long-lived access token)
    vars:
      TOKEN: '{{.TOKEN | default ""}}'
    cmds:
      - |
        TOKEN="{{.TOKEN}}"
        if [ -z "$TOKEN" ]; then
          echo "Usage: task home-assistant:logs TOKEN=<long-lived-access-token>"
          echo ""
          echo "To get a token:"
          echo "1. Go to https://home.esweiss.com/profile"
          echo "2. Scroll to 'Long-Lived Access Tokens'"
          echo "3. Create a new token"
          exit 1
        fi
        curl -s -H "Authorization: Bearer $TOKEN" \
          https://home.esweiss.com/api/error_log | head -100

  home-assistant:snapshot:
    desc: Create a Proxmox snapshot of the Home Assistant VM
    vars:
      NAME: '{{.NAME | default "manual"}}'
      DESC: '{{.DESC | default "Manual snapshot"}}'
    cmds:
      - |
        NAME="{{.NAME}}"
        DESC="{{.DESC}}"
        echo "Creating snapshot '$NAME' of Home Assistant VM..."
        ssh pve-nas-01 "sudo qm snapshot 154 $NAME --description '$DESC'"
        echo "Snapshot created successfully"
        echo ""
        echo "To list snapshots: ssh pve-nas-01 'sudo qm listsnapshot 154'"
        echo "To rollback: ssh pve-nas-01 'sudo qm rollback 154 $NAME'"

  home-assistant:deploy:
    desc: Deploy Home Assistant ingress and configuration
    cmds:
      - task: home-assistant:deploy-ingress
      - task: home-assistant:deploy-config
      - |
        echo ""
        echo "============================================"
        echo "Home Assistant deployment complete!"
        echo "============================================"
        echo ""
        echo "To restart and apply changes:"
        echo "  task home-assistant:restart-after-config"
        echo ""
        echo "To check status:"
        echo "  task home-assistant:status"

  home-assistant:deploy-ingress:
    desc: Deploy/update Home Assistant IngressRoute and backend service
    dir: ./kubernetes/apps/ingress-routes
    cmds:
      - kubectl apply -f services.yaml
      - kubectl apply -f home-assistant.yaml
      - |
        echo "Home Assistant ingress deployed"
        echo ""
        echo "Verify with: task home-assistant:status"

  home-assistant:deploy-config:
    desc: Deploy Home Assistant configuration via Ansible with 1Password secrets
    dir: "{{.ANSIBLE_DIR}}"
    env:
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      ADMIN_EMAIL: op://Homelab/Email Config/root_alias
      HA_OIDC_CLIENT_ID: op://Homelab/Home Assistant SSO/authentik-client-id
      HA_OIDC_CLIENT_SECRET: op://Homelab/Home Assistant SSO/authentik-client-secret
    cmds:
      - |
        echo "Deploying Home Assistant configuration..."
        echo ""
        op run -- ansible-playbook -i {{.INVENTORY}} -e "ansible_become=false" playbooks/home-assistant.yml
        echo ""
        echo "Configuration deployed successfully!"
        echo ""
        echo "Next steps:"
        echo "  1. Review changes via Home Assistant UI"
        echo "  2. Configuration has been validated automatically"
        echo "  3. Restart Home Assistant: task home-assistant:vm-restart"
        echo ""
        echo "Or restart now with: task home-assistant:restart-after-config"

  home-assistant:restart-after-config:
    desc: Restart Home Assistant after configuration deployment
    cmds:
      - echo "Restarting Home Assistant..."
      - task: home-assistant:vm-restart
      - echo "Waiting for Home Assistant to come back online..."
      - sleep 30
      - echo "Testing connectivity..."
      - task: home-assistant:status

