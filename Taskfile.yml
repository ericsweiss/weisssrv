  nextcloud:verify:
    desc: Run Nextcloud smoke tests (web UI both hosts, occ status, exporter)
    # Task's built-in interpreter (mvdan/sh) supports the 'local' keyword used below.
    cmds:
      - |
        echo "=== Nextcloud Smoke Tests ==="
        echo ""
        PASS=0
        FAIL=0

        check_http_ok() {
          local url="$1"
          local status
          status=$(curl -sI --max-time 10 "$url" 2>/dev/null | head -1 | grep -oE 'HTTP/[0-9.]+ [0-9]+' | grep -oE '[0-9]+$')
          if [ -n "$status" ] && [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
            return 0
          fi
          return 1
        }

        # Test 1: Web UI (external) — SSO-only, so a 302 redirect to Authentik is a pass.
        echo -n "Nextcloud Web UI (cloud.ericsweiss.com)... "
        if check_http_ok "https://cloud.ericsweiss.com"; then
          echo "PASS"; PASS=$((PASS + 1))
        else
          echo "FAIL"; FAIL=$((FAIL + 1))
        fi

        # Test 2: Web UI (internal)
        echo -n "Nextcloud Web UI (cloud.esweiss.com)... "
        if check_http_ok "https://cloud.esweiss.com"; then
          echo "PASS"; PASS=$((PASS + 1))
        else
          echo "FAIL"; FAIL=$((FAIL + 1))
        fi

        # Test 3: occ reports the instance installed
        echo -n "Nextcloud occ status (installed)... "
        if ssh eric@{{.NEXTCLOUD_IP}} "sudo docker compose -f /mnt/nextcloud-app/compose/docker-compose.yml exec -T -u www-data nextcloud php occ status --output=json" 2>/dev/null | grep -q '"installed":true'; then
          echo "PASS"; PASS=$((PASS + 1))
        else
          echo "FAIL"; FAIL=$((FAIL + 1))
        fi

        # Test 4: exporter metrics on :9205. sg-nextcloud scopes :9205 to
        # k3s_nodes (the in-cluster Prometheus scrape source), so the deploy host
        # is firewall-blocked by design — check via the VM's loopback instead,
        # the same way the occ test reaches the VM.
        echo -n "Nextcloud exporter (:9205 on {{.NEXTCLOUD_IP}})... "
        if ssh eric@{{.NEXTCLOUD_IP}} "curl -s --max-time 10 http://localhost:9205/metrics" 2>/dev/null | grep -q '^nextcloud_up'; then
          echo "PASS"; PASS=$((PASS + 1))
        else
          echo "FAIL"; FAIL=$((FAIL + 1))
        fi

        echo ""
        echo "=== Results: $PASS passed, $FAIL failed ==="
        if [ $FAIL -gt 0 ]; then
          exit 1
        fi

  nextcloud:backup:
    desc: Run the Nextcloud PostgreSQL backup now (also seeds the freshness metric)
    cmds:
