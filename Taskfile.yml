# https://taskfile.dev
version: '3'

# The host/IP roster is generated from ansible/inventories/prod/hosts.yml into
# scripts/hosts.env and loaded here as both env vars and template vars. Run
# `task hosts:sync` after editing hosts.yml.
dotenv: ['scripts/hosts.env']

# One file per task namespace; task names are unchanged (`flux:lint` is `lint:`
# in taskfiles/flux.yml). The root vars: and dotenv reach every included file.
# A task calls another namespace's with a leading colon: `:flux:sync-versions`.
includes:
  ansible: taskfiles/ansible.yml
  authentik: taskfiles/authentik.yml
  b2: taskfiles/b2.yml
  downloads: taskfiles/downloads.yml
  flux: taskfiles/flux.yml
  gitlab: taskfiles/gitlab.yml
  hermes: taskfiles/hermes.yml
  hindsight: taskfiles/hindsight.yml
  home-assistant: taskfiles/home-assistant.yml
  homarr: taskfiles/homarr.yml
  immich: taskfiles/immich.yml
  immich-ml: taskfiles/immich-ml.yml
  infra: taskfiles/infra.yml
  k3s: taskfiles/k3s.yml
  lint: taskfiles/lint.yml
  maintenance: taskfiles/maintenance.yml
  nextcloud: taskfiles/nextcloud.yml
  observability: taskfiles/observability.yml
  plex: taskfiles/plex.yml
  proxmox: taskfiles/proxmox.yml
  recipes: taskfiles/recipes.yml
  terraform: taskfiles/terraform.yml
  uptime-kuma: taskfiles/uptime-kuma.yml
  wg-easy: taskfiles/wg-easy.yml
  windows: taskfiles/windows.yml

vars:
  ANSIBLE_DIR: ./ansible
  TERRAFORM_DIR: ./terraform
  INVENTORY: ./inventories/prod
  # GitLab project ID for the Terraform state backend. Shown on the project
  # overview page at git.ericsweiss.com/eric/weisssrv.
  GITLAB_PROJECT_ID: "1"
  # VM/LXC IPs come from scripts/hosts.env (dotenv) as {{.GITLAB_IP}},
  # {{.NEXTCLOUD_IP}} and friends. Only the Proxmox VM IDs, which hosts.env
  # does not carry, are kept here.
  HA_VM_ID: "154"
  WINDOWS_VM_ID: "155"
  # Flux's entrypoint and the generated versions ConfigMap, spelled once so
  # every namespace file reads the same paths.
  CLUSTER_DIR: kubernetes/clusters/weisssrv
  VERSIONS_CM: kubernetes/infrastructure/sources/versions-configmap.yaml
  # weisssrv-lib checkout at the pinned ref: the source the vendored copies are
  # re-copied from and what the byte-identity gate compares against. Read by
  # lib:sync and scripts:test only; no deploy path touches it.
  LIB_DIR: .weisssrv-lib
  LIB_URL: https://git.ericsweiss.com/eric/weisssrv-lib.git
  # Single source for the ref: variables.WEISSSRV_LIB_REF in .gitlab-ci.yml.
  LIB_REF:
    sh: awk -F'"' '/WEISSSRV_LIB_REF/{print $2; exit}' .gitlab-ci.yml

# Anchors aliased by the tasks below. YAML anchors do not cross files, so each
# namespace file carries the precondition list it uses.
x-preconditions:
  op: &op_preconditions
    - sh: command -v ansible-playbook
      msg: "ansible-playbook not installed. pip install ansible, then: task ansible:install-collections"
    - sh: command -v op
      msg: "1Password CLI not installed: https://developer.1password.com/docs/cli/get-started/"
    # `op account list`, not `op whoami`: with the desktop-app integration whoami
    # reports "not signed in" in the non-interactive shell Task uses here.
    - sh: op account list 2>/dev/null
      msg: "1Password CLI not authenticated. Run: eval $(op signin)"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  lib:sync:
    desc: "Clone/refresh {{.LIB_DIR}} at LIB_REF — the source the vendored copies are checked against"
    cmds:
      - |
        set -eo pipefail
        if [ -d "{{.LIB_DIR}}/.git" ]; then
          git -C "{{.LIB_DIR}}" fetch --tags --force origin
        else
          git clone --no-checkout "{{.LIB_URL}}" "{{.LIB_DIR}}"
        fi
        # LIB_REF must be a release tag. origin/<ref> is a MOVING branch, and
        # the vendored byte-identity gate then compares against wherever it
        # points.
        if git -C "{{.LIB_DIR}}" rev-parse -q --verify "refs/tags/{{.LIB_REF}}^{commit}" >/dev/null; then
          git -C "{{.LIB_DIR}}" checkout --detach "{{.LIB_REF}}"
        else
          echo "WARNING: {{.LIB_REF}} is not a tag in the library; taking the branch origin/{{.LIB_REF}}" >&2
          git -C "{{.LIB_DIR}}" checkout --detach "origin/{{.LIB_REF}}"
        fi
        git -C "{{.LIB_DIR}}" --no-pager log -1 --oneline

  kubernetes:lint:
    desc: "Validate all Flux-managed Kubernetes manifests (alias for flux:lint)"
    cmds:
      - task: flux:lint

  dns:deploy:
    desc: Deploy DNS stack (Unbound + AdGuard Home)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      ADGUARD_ADMIN_PASSWORD: op://Homelab/AdGuard Home/password
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
      # dns.yml runs alloy_host, which asserts the Loki push creds.
      LOKI_PUSH_USER: op://Homelab/Loki Push Auth/username
      LOKI_PUSH_PASSWORD: op://Homelab/Loki Push Auth/password
    preconditions: *op_preconditions
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/dns.yml {{.CLI_ARGS}}

  mail:deploy:
    desc: Deploy the SMTP relay on its own (provision, configure, firewall)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      SMTP_GMAIL_USER: op://Homelab/SMTP Relay Gmail/username
      SMTP_GMAIL_PASSWORD: op://Homelab/SMTP Relay Gmail/password
      # alloy_host asserts the Loki push creds.
      LOKI_PUSH_USER: op://Homelab/Loki Push Auth/username
      LOKI_PUSH_PASSWORD: op://Homelab/Loki Push Auth/password
      # The cert-distribution re-seed play runs from dns-01.
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
    preconditions: *op_preconditions
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/mail.yml {{.CLI_ARGS}}

  mail:rotate-credential:
    desc: Re-deploy the SMTP relay credential to the app VMs and k3s nodes (docs/15)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      # postfix_null_client only: the relay credential pair plus admin_email,
      # which postfix_null_client_aliases.root resolves from.
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
    preconditions: *op_preconditions
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/rotate-mail-credential.yml {{.CLI_ARGS}}

  storage:deploy:
    desc: Deploy NAS storage configuration
    dir: "{{.ANSIBLE_DIR}}"
    env:
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      SAMBA_NAS_PASSWORD: op://Homelab/Samba NAS User/password
      # storage.yml runs alloy_host on pve-nas-01, which asserts the Loki push creds.
      LOKI_PUSH_USER: op://Homelab/Loki Push Auth/username
      LOKI_PUSH_PASSWORD: op://Homelab/Loki Push Auth/password
      # restic_offsite secrets (docs/42): the RESTRICTED hide-only key fields —
      # scripts/b2-bucket-drift.py keeps the bucket-settings key on b2_key_id/b2_application_key.
      B2_KEY_ID: op://Homelab/B2 Archive Backup/restic_key_id
      B2_APPLICATION_KEY: op://Homelab/B2 Archive Backup/restic_application_key
      RESTIC_REPO_PASSWORD: op://Homelab/B2 Archive Backup/restic_repo_password
    preconditions: *op_preconditions
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/storage.yml {{.CLI_ARGS}}

  certs:show-host-keys:
    desc: Capture SSH host keys for acme_certs_distribution_targets (paste into host_vars/dns-01.yml)
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i {{.INVENTORY}} playbooks/show-cert-host-keys.yml {{.CLI_ARGS}}

  zfs:encrypt:
    desc: Deploy ZFS-encryption mechanism + activate boot units for hosts with zfs_encryption_pools set
    dir: "{{.ANSIBLE_DIR}}"
    env:
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      ZFS_ENCRYPTION_CONNECT_TOKEN: op://Homelab/ZFS Encryption Connect Token/credential
    preconditions: *op_preconditions
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/zfs-encryption.yml {{.CLI_ARGS}}

  hosts:sync:
    desc: Regenerate scripts/hosts.env from ansible/inventories/prod/hosts.yml (host/IP roster)
    preconditions:
      - sh: python3 -c "import yaml" 2>/dev/null
        msg: "PyYAML not installed (pip install pyyaml)"
    cmds:
      - |
        python3 scripts/generate-hosts-env.py \
          --inventory ansible/inventories/prod/hosts.yml \
          --map scripts/hosts-env-map.yml \
          --regen-command "task hosts:sync"

  disaster-recovery:storage-bootstrap:
    desc: Bootstrap storage from scratch (INTERACTIVE - for disaster recovery only)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      SAMBA_NAS_PASSWORD: op://Homelab/Samba NAS User/password
    preconditions: *op_preconditions
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/bootstrap/storage-bootstrap.yml --limit pve-nas-01 {{.CLI_ARGS}}

  collect-state:
    desc: Collect redacted cluster state
    # collect-state.sh's SSH_COLLECT_TIMEOUT backstop is inert without a
    # timeout(1); every ssh then runs unbounded and a wedged host hangs the run.
    preconditions:
      # Anchors aliased by diagnose:network, which needs both guards.
      - &needs_timeout
        sh: command -v timeout >/dev/null 2>&1 || command -v gtimeout >/dev/null 2>&1
        msg: |
          This task needs a wall-clock backstop: neither timeout(1) nor
          gtimeout(1) is on PATH, so every ssh/kubectl probe would run UNBOUNDED.
          macOS: brew install coreutils
      # An empty roster reports every host unreachable instead of naming the
      # stale scripts/hosts.env. collect-state.sh reads PVE_HOSTS,
      # diagnose-network-issues.sh PVE_IPS.
      - &needs_roster
        sh: '[ -n "$PVE_HOSTS" ] && [ -n "$PVE_IPS" ]'
        msg: "scripts/hosts.env carries no Proxmox roster. Run: task hosts:sync"
    cmds:
      - ./scripts/collect-state.sh {{.CLI_ARGS}}

  diagnose:network:
    desc: "Network-instability diagnostics across all hosts (cluster/HA/ARP/bond/corosync/kube-vip/MetalLB — docs/34)"
    # shell-lib.sh's timeout_cmd runs the probe unbounded when neither binary is
    # present, so a wedged host hangs the whole sweep.
    preconditions: [*needs_timeout, *needs_roster]
    cmds:
      - bash scripts/diagnose-network-issues.sh {{.CLI_ARGS}}

  lint:
    desc: Run all linters (no auth required) — mirrors the CI lint stage
    cmds:
      - task: ansible:lint
      - task: terraform:fmt-check
      - task: terraform:validate-local
      - task: terraform:tflint
      - task: flux:lint
      - task: lint:shellcheck
      - task: lint:ruff
      - task: lint:yamllint
      - task: lint:coverage-checks
      - task: lint:sync-checks
      - task: lint:lib-pins
      - task: lint:version-coverage
      - task: lint:version-checksums
      - task: lint:partner-pins
      - task: lint:helm-repo-parity
      - task: lint:flux-version-pin
      - task: lint:kubectl-version-pin
      - task: lint:busybox-version-pin
      - task: lint:image-gc-threshold
      - task: lint:ci-policy
      - task: lint:deploy-preflight
      - task: lint:netpol-except-parity
      - task: lint:vpn-provider-parity
      - task: lint:kustomization-coverage
      - task: lint:cluster-literals
      - task: lint:cluster-invariants
      - task: lint:dashboards
      - task: lint:role-inputs
      - task: lint:comment-length
      - task: lint:tailnet-dns-parity
      - task: lint:tailscale-policy
      - task: lint:doc-links
      - task: lint:runbook-anchors
      - task: lint:upstream-rule-mirror
      - task: lint:unifi-doc-parity
      - task: lint:tenant-wiring
      - task: lint:secret-rotation
      - task: lint:guest-endpoint-parity
      - task: lint:host-log-staleness
      - task: lint:taskfile-smoke
      # promtool/amtool gate; CI runs the same checks as prometheus-config-lint.
      - task: lint:prometheus-config
      # Last: its vendored-byte-identity arm is red by design between a
      # weisssrv-lib change and the pin bump that adopts it, and go-task stops
      # the list at the first failure.
      - |
        task scripts:test || {
          echo "ERROR: scripts:test failed. A test_vendored_byte_identity failure is"
          echo "expected mid-bump (CLAUDE.md § Repo family). Anything else is a regression."
          exit 1
        }

  scripts:test:
    desc: Run Python unit tests for scripts/ (pytest)
    cmds:
      - python3 -m pytest scripts/ -v
    preconditions:
      - sh: python3 -c "import pytest" 2>/dev/null
        msg: "pytest not installed. pip install pytest"
      - sh: command -v jq
        msg: "jq not installed. brew install jq (the deploy-verify classifiers in scripts/test_deploy_verify_lib.py need it)"
      - sh: python3 -c "import jinja2" 2>/dev/null
        msg: "Jinja2 not installed. pip install jinja2 (test_vendored_smoke.py imports check-role-inputs.py, which requires it)"
      # test_vendored_byte_identity.py compares this repo's vendored script
      # copies against weisssrv-lib and NEVER skips, so a sibling checkout is a
      # hard requirement of this task, checked in the gate's resolution order.
      - sh: test -d "${WEISSSRV_LIB_PATH:-../weisssrv-lib}/scripts" || test -d "{{.LIB_DIR}}/scripts"
        msg: |
          weisssrv-lib checkout not found at ${WEISSSRV_LIB_PATH:-../weisssrv-lib}
          or {{.LIB_DIR}}.
          scripts/test_vendored_byte_identity.py compares the vendored scripts
          against the library and never skips. Fix with either:
            task lib:sync
            export WEISSSRV_LIB_PATH=/path/to/weisssrv-lib
          The gate compares at the tag in variables.WEISSSRV_LIB_REF
          (.gitlab-ci.yml) and falls back to the checkout's working tree when
          that tag has not been cut yet. See
          .claude/skills/weisssrv-development/references/cluster-access.md.

  op:check:
    desc: Verify 1Password CLI is authenticated
    cmds:
      - op account get

  secrets:show:
    desc: Display secret references (not values) - scans the Taskfile tree, CI, playbooks, and group_vars/host_vars
    cmds:
      - |
        # op:// refs live in this Taskfile tree's per-task env: blocks and the
        # matching CI job variables:. The inventory scan is a canary — a literal
        # there is a finding. docs/15-credential-rotation.md is the item inventory.
        show() {
          label="$1"; shift
          echo "$label"
          refs=$("$@" | sed 's/[[:space:]]*$//' | grep -E "^op://Homelab/[^/]+/[^/]+$" | sort -u || true)
          if [ -n "$refs" ]; then
            printf '%s\n' "$refs" | sed 's/^/  - /'
          else
            echo "  (none found)"
          fi
        }
        scan_tree() {
          find "$@" -name "*.yml" -type f -exec grep -hoE "op://Homelab/[^\"'\`\)\(]+" {} \; 2>/dev/null
        }
        show "Secret references in use (from the Taskfile tree):" \
          scan_tree Taskfile.yml taskfiles
        echo ""
        show "Secret references in playbooks (if any):" \
          scan_tree ansible/playbooks
        echo ""
        show "Secret references in group_vars/host_vars:" \
          scan_tree ansible/inventories/prod/group_vars ansible/inventories/prod/host_vars
        echo ""
        show "Secret references in the CI pipeline:" \
          scan_tree .gitlab-ci.yml .gitlab/ci
        echo ""
        echo "Composed inside include:d weisssrv-lib CI fragments (the scans above cannot see these):"
        # Split at the field so these echoes are not themselves scan hits.
        echo "  - op://Homelab/SSH Key/""private key"
        echo "    (deploy-base ssh_key_item/ssh_key_field defaults)"
        echo "  docs/15-credential-rotation.md is the item inventory."
        echo ""
        echo "To verify all secrets exist in 1Password:"
        echo "  op account list && op item list --vault Homelab"

  # Shared app-operations templates. The per-app namespaces call these with vars
  # instead of carrying a copy; scripts/test_taskfile_tree.py fails when an app
  # namespace ships without a :status task.

  _app:status:
    internal: true
    # SECTIONS is one `Header|resource` pair per line; `pods` is listed -o wide.
    cmds:
      - |
        printf '%s\n' '{{.SECTIONS}}' | {
          first=1
          while IFS='|' read -r label resource; do
            [ -n "$label" ] || continue
            [ "$first" = "1" ] || echo ""
            first=0
            echo "=== $label ==="
            if [ "$resource" = "pods" ]; then
              kubectl get pods -n {{.NS}} -o wide
            else
              kubectl get "$resource" -n {{.NS}}
            fi
          done
        }

  _app:restart:
    internal: true
    vars:
      TIMEOUT: '{{.TIMEOUT | default "300s"}}'
      WAIT_SELECTOR: '{{.WAIT_SELECTOR | default .SELECTOR}}'
    cmds:
      # Pod delete, not `kubectl rollout restart`: docs/29 § Restarting a Flux-managed workload.
      - |
        {{if .BANNER}}echo "{{.BANNER}}"{{end}}
        kubectl delete pod -n {{.NS}} {{.SELECTOR}}
        {{if .BANNER}}echo "Waiting for pods to be ready..."{{end}}
        kubectl wait --namespace {{.NS}} --for=condition=ready pod {{.WAIT_SELECTOR}} --timeout={{.TIMEOUT}}

  _app:logs:
    internal: true
    vars:
      TAIL: '{{.TAIL | default "100"}}'
    cmds:
      - kubectl logs -n {{.NS}} {{.TARGET}} {{if .CONTAINER}}-c "{{.CONTAINER}}" {{end}}--tail={{.TAIL}} -f
