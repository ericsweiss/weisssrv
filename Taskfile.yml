# https://taskfile.dev
version: '3'

vars:
  ANSIBLE_DIR: ./ansible
  TERRAFORM_DIR: ./terraform
  INVENTORY: ./inventories/prod

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # === Ansible Tasks ===
  ansible:install-collections:
    desc: Install Ansible Galaxy collections
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-galaxy collection install -r requirements.yml

  ansible:ping:
    desc: Ping all managed hosts
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible -i {{.INVENTORY}} all -m ping -e "ansible_become=false"

  ansible:lint:
    desc: Lint Ansible playbooks and roles
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-lint playbooks/ roles/

  # === Deployment Tasks ===
  deploy:all:
    desc: Deploy base infrastructure (Proxmox, DNS, NAS, mail - excludes k3s)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SMTP_GMAIL_USER: op://Homelab/SMTP Relay Gmail/username
      SMTP_GMAIL_PASSWORD: op://Homelab/SMTP Relay Gmail/password
      ADGUARD_ADMIN_PASSWORD: op://Homelab/AdGuard Home/password
      ADGUARD_ADMIN_PASSWORD_HASH: op://Homelab/AdGuard Home/password_hash
      TAILSCALE_AUTH_KEY: op://Homelab/Tailscale Auth Key/credential
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      SAMBA_NAS_PASSWORD: op://Homelab/Samba NAS User/password
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/site.yml {{.CLI_ARGS}}

  deploy:base:
    desc: Deploy base configuration only
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/base.yml {{.CLI_ARGS}}

  deploy:base-first-run:
    desc: First-time base deployment (prompts for sudo password)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/base.yml -K {{.CLI_ARGS}}

  deploy:dns:
    desc: Deploy DNS stack (Unbound + AdGuard Home)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      ADGUARD_ADMIN_PASSWORD: op://Homelab/AdGuard Home/password
      ADGUARD_ADMIN_PASSWORD_HASH: op://Homelab/AdGuard Home/password_hash
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/dns.yml {{.CLI_ARGS}}

  deploy:storage:
    desc: Deploy NAS storage configuration
    dir: "{{.ANSIBLE_DIR}}"
    env:
      SAMBA_NAS_PASSWORD: op://Homelab/Samba NAS User/password
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/storage.yml {{.CLI_ARGS}}

  deploy:check:
    desc: Check mode - show what would change
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SMTP_GMAIL_USER: op://Homelab/SMTP Relay Gmail/username
      SMTP_GMAIL_PASSWORD: op://Homelab/SMTP Relay Gmail/password
      ADGUARD_ADMIN_PASSWORD: op://Homelab/AdGuard Home/password
      ADGUARD_ADMIN_PASSWORD_HASH: op://Homelab/AdGuard Home/password_hash
      TAILSCALE_AUTH_KEY: op://Homelab/Tailscale Auth Key/credential
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      SAMBA_NAS_PASSWORD: op://Homelab/Samba NAS User/password
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/site.yml --check --diff {{.CLI_ARGS}}

  deploy:verify:
    desc: Run post-deployment verification
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i {{.INVENTORY}} playbooks/postflight.yml {{.CLI_ARGS}}

  # === Plex Deployment Tasks ===
  deploy:plex:
    desc: Deploy Plex Media Server (provisions LXC container and installs Plex)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/plex.yml {{.CLI_ARGS}}

  deploy:plex-check:
    desc: Check mode - show what Plex deployment would change
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/plex.yml --check --diff {{.CLI_ARGS}}

  # === K3s Deployment Tasks ===
  k3s:provision-vms:
    desc: Provision k3s VMs on Proxmox (creates VMs only)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/k3s-provision-vms.yml {{.CLI_ARGS}}

  k3s:deploy:
    desc: Deploy k3s cluster (full deployment)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      K3S_TOKEN: op://Homelab/K3s Cluster Token/credential
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/k3s.yml {{.CLI_ARGS}}

  k3s:kubeconfig:
    desc: Fetch kubeconfig from k3s cluster
    cmds:
      - |
        ssh eric@192.168.0.202 "sudo cat /etc/rancher/k3s/k3s.yaml" | \
          sed 's/127.0.0.1/192.168.0.161/g' > ~/.kube/config-k3s
        echo "Kubeconfig saved to ~/.kube/config-k3s"
        echo "Run: export KUBECONFIG=~/.kube/config-k3s"

  # === K3s Workload Deployment Tasks ===
  k3s:deploy-metallb:
    desc: Deploy MetalLB load balancer with IP pools
    dir: ./kubernetes
    cmds:
      - helm repo add metallb https://metallb.github.io/metallb --force-update
      - helm repo update metallb
      - helm upgrade --install metallb metallb/metallb -n metallb-system --create-namespace --wait
      - |
        echo "Waiting for MetalLB webhook to be ready..."
        kubectl wait --namespace metallb-system \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=120s
      - kubectl apply -f bootstrap/metallb/ip-pool.yaml
      - 'echo "MetalLB deployed with IP pools (public .100, internal .101)"'

  k3s:deploy-traefik:
    desc: Deploy Traefik ingress controller
    dir: ./kubernetes/apps/traefik
    cmds:
      - helm repo add traefik https://traefik.github.io/charts --force-update
      - helm repo update traefik
      - kubectl apply -f namespace.yaml
      - helm upgrade --install traefik traefik/traefik -n traefik -f values.yaml --wait
      - kubectl apply -f traefik-internal-service.yaml
      - |
        echo "Verifying Traefik LoadBalancer IP..."
        kubectl get svc -n traefik traefik -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
        echo ""
      - 'echo "Traefik deployed on 192.168.0.100 (public) and 192.168.0.101 (internal)"'

  k3s:deploy-cert-manager:
    desc: Deploy cert-manager with Let's Encrypt ClusterIssuer
    dir: ./kubernetes/apps/cert-manager
    env:
      CLOUDFLARE_API_TOKEN: op://Homelab/Cloudflare DNS Token/credential
    cmds:
      - helm repo add jetstack https://charts.jetstack.io --force-update
      - helm repo update jetstack
      - kubectl apply -f namespace.yaml
      - helm upgrade --install cert-manager jetstack/cert-manager -n cert-manager -f values.yaml --wait
      - |
        echo "Creating Cloudflare API token secret..."
        op run -- sh -c 'kubectl create secret generic cloudflare-api-token \
          --namespace=cert-manager \
          --from-literal=api-token="$CLOUDFLARE_API_TOKEN" \
          --dry-run=client -o yaml | kubectl apply -f -'
      - kubectl apply -k .
      - 'echo "cert-manager deployed with letsencrypt-prod ClusterIssuer"'
      - 'echo "Certificates will be issued automatically (check with: kubectl get certificate -A)"'

  k3s:deploy-external-dns:
    desc: Deploy external-dns for automatic Cloudflare DNS management
    dir: ./kubernetes/apps/external-dns
    env:
      CLOUDFLARE_API_TOKEN: op://Homelab/Cloudflare DNS Token/credential
    cmds:
      - helm repo add external-dns https://kubernetes-sigs.github.io/external-dns --force-update
      - helm repo update external-dns
      - kubectl apply -f namespace.yaml
      - |
        echo "Creating Cloudflare API token secret..."
        op run -- sh -c 'kubectl create secret generic cloudflare-api-token \
          --namespace=external-dns \
          --from-literal=api-token="$CLOUDFLARE_API_TOKEN" \
          --dry-run=client -o yaml | kubectl apply -f -'
      - helm upgrade --install external-dns external-dns/external-dns -n external-dns -f values.yaml --wait
      - echo "external-dns deployed - DNS records will sync to Cloudflare automatically"

  k3s:deploy-ddns:
    desc: Deploy Cloudflare DDNS CronJob for public IP updates
    dir: ./kubernetes/apps/cloudflare-ddns
    env:
      CLOUDFLARE_API_TOKEN: op://Homelab/Cloudflare DNS Token/credential
    cmds:
      - |
        echo "Creating Cloudflare API token secret in default namespace..."
        op run -- sh -c 'kubectl create secret generic cloudflare-api-token \
          --namespace=default \
          --from-literal=api-token="$CLOUDFLARE_API_TOKEN" \
          --dry-run=client -o yaml | kubectl apply -f -'
      - kubectl apply -f cronjob.yaml
      - echo "DDNS CronJob deployed - runs every 5 minutes to update public IP"

  k3s:deploy-ingress-routes:
    desc: Deploy Traefik IngressRoutes for all services
    dir: ./kubernetes/apps/ingress-routes
    cmds:
      - kubectl apply -k .
      - echo "IngressRoutes deployed for all services"
      - kubectl get ingressroute -A

  k3s:deploy-authentik:
    desc: Deploy Authentik SSO identity provider
    dir: ./kubernetes/apps/authentik
    env:
      AUTHENTIK_SECRET_KEY: op://Homelab/Authentik Secrets/secret-key
      AUTHENTIK_POSTGRESQL_PASSWORD: op://Homelab/Authentik Secrets/postgresql-password
      AUTHENTIK_POSTGRESQL_ADMIN_PASSWORD: op://Homelab/Authentik Secrets/postgresql-admin-password
      # SMTP credentials for email notifications (uses same creds as other services)
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
    cmds:
      - helm repo add authentik https://charts.goauthentik.io --force-update
      - helm repo update authentik
      - kubectl apply -f namespace.yaml
      - |
        echo "Creating Authentik secrets from 1Password..."
        op run -- sh -c 'kubectl create secret generic authentik-secrets \
          --namespace=authentik \
          --from-literal=secret-key="$AUTHENTIK_SECRET_KEY" \
          --from-literal=postgresql-password="$AUTHENTIK_POSTGRESQL_PASSWORD" \
          --from-literal=postgresql-admin-password="$AUTHENTIK_POSTGRESQL_ADMIN_PASSWORD" \
          --from-literal=smtp-username="$SMTP_RELAY_USER" \
          --from-literal=smtp-password="$SMTP_RELAY_PASSWORD" \
          --dry-run=client -o yaml | kubectl apply -f -'
      - |
        echo "Installing Authentik via Helm..."
        op run -- sh -c 'helm upgrade --install authentik authentik/authentik \
          -n authentik \
          -f values.yaml \
          --set authentik.secret_key="$AUTHENTIK_SECRET_KEY" \
          --wait --timeout 10m'
      - |
        echo "Waiting for Authentik server to be ready..."
        kubectl wait --namespace authentik \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/name=authentik,app.kubernetes.io/component=server \
          --timeout=300s
      - kubectl apply -k .
      - echo ""
      - echo "=== Authentik SSO deployed successfully ==="
      - echo ""
      - 'echo "Next steps:"'
      - 'echo "  1. Add DNS rewrite in AdGuard Home: auth.esweiss.com -> 192.168.0.100"'
      - 'echo "  2. Complete initial setup: https://auth.esweiss.com/if/flow/initial-setup/"'
      - 'echo "  3. Create akadmin password and store in 1Password"'
      - 'echo "  4. Configure SSO providers for other services"'
      - echo ""
      - kubectl get pods -n authentik
      - kubectl get svc -n authentik

  k3s:deploy-workloads:
    desc: Deploy ALL k3s platform workloads in correct order
    cmds:
      - echo "=== Deploying K3s Platform Workloads ==="
      - echo ""
      - 'echo "Step 1/7 - MetalLB (LoadBalancer support)"'
      - task: k3s:deploy-metallb
      - echo ""
      - 'echo "Step 2/7 - Traefik (Ingress controller)"'
      - task: k3s:deploy-traefik
      - echo ""
      - 'echo "Step 3/7 - cert-manager (TLS certificates)"'
      - task: k3s:deploy-cert-manager
      - echo ""
      - 'echo "Step 4/7 - external-dns (Cloudflare DNS)"'
      - task: k3s:deploy-external-dns
      - echo ""
      - 'echo "Step 5/7 - DDNS CronJob (Public IP updates)"'
      - task: k3s:deploy-ddns
      - echo ""
      - 'echo "Step 6/7 - IngressRoutes (Service routing)"'
      - task: k3s:deploy-ingress-routes
      - echo ""
      - 'echo "Step 7/7 - Authentik SSO (Identity Provider)"'
      - task: k3s:deploy-authentik
      - echo ""
      - echo "=== All K3s workloads deployed successfully ==="

  k3s:status:
    desc: Show k3s cluster and workload status
    cmds:
      - echo "=== K3s Cluster Status ==="
      - kubectl get nodes -o wide
      - echo ""
      - echo "=== Platform Services ==="
      - echo "MetalLB -"
      - kubectl get pods -n metallb-system 2>/dev/null || echo "  Not installed"
      - kubectl get ipaddresspool -n metallb-system 2>/dev/null || true
      - echo ""
      - echo "Traefik -"
      - kubectl get pods -n traefik 2>/dev/null || echo "  Not installed"
      - kubectl get svc -n traefik 2>/dev/null || true
      - echo ""
      - echo "cert-manager -"
      - kubectl get pods -n cert-manager 2>/dev/null || echo "  Not installed"
      - kubectl get certificate -A 2>/dev/null || true
      - echo ""
      - echo "external-dns -"
      - kubectl get pods -n external-dns 2>/dev/null || echo "  Not installed"
      - echo ""
      - echo "DDNS CronJob -"
      - kubectl get cronjob cloudflare-ddns -n default 2>/dev/null || echo "  Not installed"
      - echo ""
      - echo "Authentik SSO -"
      - kubectl get pods -n authentik 2>/dev/null || echo "  Not installed"
      - kubectl get svc -n authentik 2>/dev/null || true
      - echo ""
      - echo "IngressRoutes -"
      - kubectl get ingressroute -A 2>/dev/null || echo "  None configured"

  # === Maintenance Tasks ===
  maintenance:update-packages:
    desc: Update OS packages on all hosts (rolling, interactive)
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i {{.INVENTORY}} playbooks/maintenance/update-packages.yml {{.CLI_ARGS}}

  maintenance:update-packages-auto:
    desc: Update OS packages on all hosts (rolling, auto-reboot)
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i {{.INVENTORY}} playbooks/maintenance/update-packages.yml -e auto_reboot=true {{.CLI_ARGS}}

  maintenance:update-applications:
    desc: Update homelab applications to versions in versions.yml
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      ADGUARD_ADMIN_PASSWORD: op://Homelab/AdGuard Home/password
      ADGUARD_ADMIN_PASSWORD_HASH: op://Homelab/AdGuard Home/password_hash
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/maintenance/update-applications.yml {{.CLI_ARGS}}

  maintenance:update-full:
    desc: Full system update - packages + applications (rolling, interactive)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      ADGUARD_ADMIN_PASSWORD: op://Homelab/AdGuard Home/password
      ADGUARD_ADMIN_PASSWORD_HASH: op://Homelab/AdGuard Home/password_hash
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/maintenance/update-full.yml {{.CLI_ARGS}}

  maintenance:update-full-auto:
    desc: Full system update - packages + applications (rolling, auto-reboot)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      ADGUARD_ADMIN_PASSWORD: op://Homelab/AdGuard Home/password
      ADGUARD_ADMIN_PASSWORD_HASH: op://Homelab/AdGuard Home/password_hash
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/maintenance/update-full.yml -e auto_reboot=true {{.CLI_ARGS}}

  # === Disaster Recovery Tasks ===
  disaster-recovery:storage-bootstrap:
    desc: Bootstrap storage from scratch (INTERACTIVE - for disaster recovery only)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      SAMBA_NAS_PASSWORD: op://Homelab/Samba NAS User/password
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/bootstrap/storage-bootstrap.yml --limit pve-nas-01 {{.CLI_ARGS}}

  # === Proxmox Management Tasks ===
  proxmox:configure-autostart:
    desc: Configure autostart and boot order for existing VMs/containers (one-time setup)
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i {{.INVENTORY}} playbooks/proxmox-enable-autostart.yml {{.CLI_ARGS}}

  # === Terraform Tasks ===
  terraform:init:
    desc: Initialize Terraform
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    cmds:
      - terraform init

  terraform:plan:
    desc: Plan Terraform changes
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    cmds:
      - |
        terraform plan \
          -var="cloudflare_api_token=$(op read 'op://Homelab/Cloudflare DNS Token/credential')" \
          -var="cloudflare_account_id=$(op read 'op://Homelab/Cloudflare DNS Token/username')" \
          {{.CLI_ARGS}}

  terraform:apply:
    desc: Apply Terraform changes
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    cmds:
      - |
        terraform apply \
          -var="cloudflare_api_token=$(op read 'op://Homelab/Cloudflare DNS Token/credential')" \
          -var="cloudflare_account_id=$(op read 'op://Homelab/Cloudflare DNS Token/username')" \
          {{.CLI_ARGS}}

  terraform:validate:
    desc: Validate Terraform configuration
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    cmds:
      - terraform validate

  terraform:fmt:
    desc: Format Terraform files
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    cmds:
      - terraform fmt -recursive

  terraform:fmt-check:
    desc: Check Terraform formatting
    dir: "{{.TERRAFORM_DIR}}/cloudflare"
    cmds:
      - terraform fmt -check -recursive

  # === Utility Tasks ===
  collect-state:
    desc: Collect redacted cluster state
    cmds:
      - ./scripts/collect-state.sh {{.CLI_ARGS}}

  lint:
    desc: Run all linters
    cmds:
      - task: ansible:lint
      - task: terraform:fmt-check
      - task: terraform:init
      - task: terraform:validate

  # === 1Password Integration ===
  op:check:
    desc: Verify 1Password CLI is authenticated
    cmds:
      - op account get

  secrets:show:
    desc: Display secret references (not values)
    cmds:
      - |
        echo "Secret references in use:"
        echo "  - op://Homelab/Cloudflare DNS Token/credential"
        echo "  - op://Homelab/Cloudflare DNS Token/account_id"
        echo "  - op://Homelab/SMTP Relay Gmail/password"
        echo "  - op://Homelab/SMTP Relay Gmail/username"
        echo "  - op://Homelab/AdGuard Home/password"
        echo "  - op://Homelab/Tailscale Auth Key/credential"
