---
# Relaxed yamllint profile — the baseline syntax check for a whole-tree
# yaml-lint job. yamllint's shipped `relaxed` keeps line-length at warning level
# and disables the comment rules outright; the rules block below then disables
# line-length as well, because inline documentation comments run long, and
# re-enables document-start as a warning.
#
# Nothing applies this file unless the consumer VENDORS it. The yaml-lint
# template's default `config: "-d relaxed"` selects yamllint's OWN shipped
# relaxed profile, which is not this one — it keeps line-length as a warning and
# has no document-start rule. Both templates vendor this file as `.yamllint` and
# pass `-c .yamllint`; weisssrv does not, and lints on the shipped `-d relaxed`.
# Copy it into a consumer repo as `.yamllint` and point the job's `config` input
# at it.
extends: relaxed

rules:
  line-length: disable
  document-start:
    present: true
    level: warning
