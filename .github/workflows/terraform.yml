name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'

env:
  TF_VERSION: '1.5'

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/cloudflare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      # Note: Actual plan requires secrets injection
      # In production, use 1Password Connect or GitHub secrets
      - name: Terraform Plan (dry run)
        if: github.event_name == 'pull_request'
        run: |
          echo "Terraform plan skipped - requires credentials"
          echo "To enable in production, configure 1Password Connect or GitHub secrets"
