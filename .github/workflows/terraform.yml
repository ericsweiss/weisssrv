name: Terraform (DISABLED - See GitLab CI)

# =============================================================================
# DISABLED: CI/CD has moved to self-hosted GitLab
# Canonical source: https://git.ericsweiss.com/eric/weisssrv
# This workflow is retained for reference only.
# =============================================================================

on:
  workflow_dispatch:  # Manual trigger only (disabled for normal operations)
  # Previously triggered on push/PR - now handled by GitLab CI
  # push:
  #   branches: [main]
  #   paths:
  #     - 'terraform/**'
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - 'terraform/**'

env:
  TF_VERSION: '1.5'

jobs:
  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/cloudflare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      # Note: terraform plan is run locally with `task terraform:plan`
      # which uses 1Password CLI for credential injection.
      # GitHub Actions cannot access 1Password without additional setup.
