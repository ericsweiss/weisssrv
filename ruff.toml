# Shared ruff profile for the weisssrv family: passed to ci/lint/python-lint.yml
# as `config`, or vendored to a repo root as `ruff.toml`. target-version tracks
# the lowest Python any consumer supports (cli/pyproject.toml: >=3.9).
target-version = "py39"

[lint]
# Correctness rules only — the family runs no formatter, so layout rules stay
# out; they would bury the findings that matter.
select = ["E4", "E7", "E9", "F", "W", "B"]
