# https://taskfile.dev
# Credential-age measurement. The rotations themselves stay owner work: each
# item's procedure is docs/15 § Item detail.
version: '3'

tasks:
  age:
    desc: "Report Homelab items past the rotation age docs/15 declares (read-only: titles and timestamps, never a field value)"
    preconditions:
      - sh: command -v op
        msg: "1Password CLI is not installed"
      # `op account list`, not `op whoami` — see the note on infra:deploy's preconditions.
      - sh: op account list 2>/dev/null
        msg: "1Password CLI not authenticated. Run: eval $(op signin)"
    cmds:
      # No `op run`: the script shells out to `op item list` itself, so there is
      # no op:// reference to resolve and no field value ever leaves the vault.
      - python3 scripts/check-credential-age.py
