# https://taskfile.dev
# Immich photo library VM (docs/36).
version: '3'

tasks:
  deploy:
    desc: Deploy Immich (provisions the VM and installs the compose stack)
    dir: "{{.ANSIBLE_DIR}}"
    # Anchors shared with immich:deploy-check so dry-run and deploy can't diverge.
    env: &immich_env
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      # immich.yml runs alloy_host, which asserts the Loki push creds.
      LOKI_PUSH_USER: op://Homelab/Loki Push Auth/username
      LOKI_PUSH_PASSWORD: op://Homelab/Loki Push Auth/password
      # Immich stack secrets.
      IMMICH_DB_PASSWORD: op://Homelab/Immich Secrets/postgres-password
      IMMICH_OAUTH_CLIENT_ID: op://Homelab/Immich SSO/client-id
      IMMICH_OAUTH_CLIENT_SECRET: op://Homelab/Immich SSO/client-secret
    preconditions: &immich_deploy_preconditions
      - sh: command -v ansible-playbook
        msg: "ansible-playbook is not installed"
      # `op account list`, not `op whoami` — see the note on infra:deploy's preconditions.
      - sh: op account list 2>/dev/null
        msg: "1Password CLI not authenticated. Run: eval $(op signin)"
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/immich.yml {{.CLI_ARGS}}

  deploy-check:
    desc: Check mode - show what the Immich deployment would change
    dir: "{{.ANSIBLE_DIR}}"
    env: *immich_env
    preconditions: *immich_deploy_preconditions
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/immich.yml --check --diff {{.CLI_ARGS}}

  status:
    desc: Show Immich status (compose stack + IngressRoutes)
    cmds:
      - echo "=== Immich compose stack ==="
      - ssh eric@{{.IMMICH_IP}} "sudo docker compose --project-directory /mnt/immich-app/compose ps" || echo "Immich VM not reachable or stack not up"
      - echo ""
      - echo "=== Immich IngressRoutes ==="
      - kubectl get ingressroute -n default 2>/dev/null | grep -i immich || echo "No Immich IngressRoutes found"
      - echo ""
      - echo "=== Immich ServiceMonitor ==="
      - kubectl get servicemonitor -n observability immich 2>/dev/null || echo "No Immich ServiceMonitor found"

  verify:
    desc: Run Immich smoke tests (web UI both hosts, health, metrics, DB, mounts)
    cmds:
      - bash scripts/verify-immich.sh

  backup:
    desc: Run the Immich database backup (pg_dumpall + freshness metric)
    cmds:
      - echo "Creating Immich database backup..."
      - ssh eric@{{.IMMICH_IP}} "sudo /usr/local/sbin/immich-backup-run.sh"
      - echo ""
      - 'echo "Backup complete. List backups with:"'
      - echo "  ssh eric@{{.IMMICH_IP}} 'sudo ls -la /mnt/backups-offsite/'"

  console:
    desc: SSH to the Immich VM
    cmds:
      - ssh eric@{{.IMMICH_IP}}

  logs:
    desc: Tail the Immich compose logs
    cmds:
      - ssh eric@{{.IMMICH_IP}} "sudo docker compose --project-directory /mnt/immich-app/compose logs -f --tail=200"

  restart:
    desc: Restart the Immich compose stack
    cmds:
      - ssh eric@{{.IMMICH_IP}} "sudo systemctl restart immich-compose.service"
