# https://taskfile.dev
# Base infrastructure deployment: Proxmox, DNS, NAS and mail. Excludes k3s,
# which is taskfiles/k3s.yml.
version: '3'

# Anchors aliased by the tasks below. YAML anchors do not cross files, so each
# namespace file carries the precondition list it uses.
x-preconditions:
  op: &op_preconditions
    - sh: command -v ansible-playbook
      msg: "ansible-playbook not installed. pip install ansible, then: task ansible:install-collections"
    - sh: command -v op
      msg: "1Password CLI not installed: https://developer.1password.com/docs/cli/get-started/"
    # `op account list`, not `op whoami`: with the desktop-app integration whoami
    # reports "not signed in" in the non-interactive shell Task uses here.
    - sh: op account list 2>/dev/null
      msg: "1Password CLI not authenticated. Run: eval $(op signin)"

tasks:
  deploy:
    desc: Deploy base infrastructure (Proxmox, DNS, NAS, mail - excludes k3s)
    dir: "{{.ANSIBLE_DIR}}"
    # Anchor shared with infra:check so dry-run and deploy can never
    # diverge on which secrets are injected.
    env: &infra_env
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SMTP_GMAIL_USER: op://Homelab/SMTP Relay Gmail/username
      SMTP_GMAIL_PASSWORD: op://Homelab/SMTP Relay Gmail/password
      ADGUARD_ADMIN_PASSWORD: op://Homelab/AdGuard Home/password
      TAILSCALE_AUTH_KEY: op://Homelab/Tailscale Auth Key/credential
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      SAMBA_NAS_PASSWORD: op://Homelab/Samba NAS User/password
      DNS01_SSH_PRIVATE_KEY: op://Homelab/DNS-01 SSH Key/private key
      DNS01_SSH_PUBLIC_KEY: op://Homelab/DNS-01 SSH Key/public key
      LOKI_PUSH_USER: op://Homelab/Loki Push Auth/username
      LOKI_PUSH_PASSWORD: op://Homelab/Loki Push Auth/password
      # site.yml runs restic_offsite on pve-nas-01, whose secret-shape assert
      # dereferences all three; without them the whole-estate converge aborts the
      # NAS play. Same hide-only key fields storage:deploy uses (docs/42).
      B2_KEY_ID: op://Homelab/B2 Archive Backup/restic_key_id
      B2_APPLICATION_KEY: op://Homelab/B2 Archive Backup/restic_application_key
      RESTIC_REPO_PASSWORD: op://Homelab/B2 Archive Backup/restic_repo_password
    preconditions: *op_preconditions
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/site.yml {{.CLI_ARGS}}

  base:
    desc: Deploy base configuration only
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    preconditions: *op_preconditions
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/base.yml {{.CLI_ARGS}}

  base-first-run:
    desc: First-time base deployment (prompts for sudo password)
    dir: "{{.ANSIBLE_DIR}}"
    env:
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
    preconditions: *op_preconditions
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/base.yml -K {{.CLI_ARGS}}

  check:
    desc: Check mode - show what would change
    dir: "{{.ANSIBLE_DIR}}"
    env: *infra_env
    preconditions: *op_preconditions
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/site.yml --check --diff {{.CLI_ARGS}}

  verify:
    desc: Run post-deployment verification
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i {{.INVENTORY}} playbooks/postflight.yml {{.CLI_ARGS}}
