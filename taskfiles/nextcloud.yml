# https://taskfile.dev
# Nextcloud VM (docs/35).
version: '3'

tasks:
  deploy:
    desc: Deploy Nextcloud (provisions VM and installs the compose stack)
    dir: "{{.ANSIBLE_DIR}}"
    # Anchors shared with nextcloud:deploy-check so dry-run and deploy can't diverge.
    env: &nextcloud_env
      ROOT_EMAIL_ALIAS: op://Homelab/Email Config/root_alias
      SMTP_RELAY_USER: op://Homelab/SMTP Relay Auth/username
      SMTP_RELAY_PASSWORD: op://Homelab/SMTP Relay Auth/password
      SSH_PUBLIC_KEY: op://Homelab/SSH Key/public key
      # nextcloud.yml runs alloy_host, which asserts the Loki push creds.
      LOKI_PUSH_USER: op://Homelab/Loki Push Auth/username
      LOKI_PUSH_PASSWORD: op://Homelab/Loki Push Auth/password
      NEXTCLOUD_ADMIN_PASSWORD: op://Homelab/Nextcloud Secrets/admin-password
      NEXTCLOUD_POSTGRES_PASSWORD: op://Homelab/Nextcloud Secrets/postgres-password
      NEXTCLOUD_SERVERINFO_TOKEN: op://Homelab/Nextcloud Secrets/serverinfo-token
      NEXTCLOUD_OIDC_CLIENT_ID: op://Homelab/Nextcloud SSO/client-id
      NEXTCLOUD_OIDC_CLIENT_SECRET: op://Homelab/Nextcloud SSO/client-secret
    preconditions: &nextcloud_deploy_preconditions
      - sh: command -v ansible-playbook
        msg: "ansible-playbook is not installed"
      # `op account list`, not `op whoami` — see the note on infra:deploy's preconditions.
      - sh: op account list 2>/dev/null
        msg: "1Password CLI not authenticated. Run: eval $(op signin)"
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/nextcloud.yml {{.CLI_ARGS}}

  deploy-check:
    desc: Check mode - show what Nextcloud deployment would change
    dir: "{{.ANSIBLE_DIR}}"
    env: *nextcloud_env
    preconditions: *nextcloud_deploy_preconditions
    cmds:
      - op run -- ansible-playbook -i {{.INVENTORY}} playbooks/nextcloud.yml --check --diff {{.CLI_ARGS}}

  status:
    desc: Show Nextcloud status
    cmds:
      - echo "=== Nextcloud compose stack ==="
      - ssh eric@{{.NEXTCLOUD_IP}} "sudo docker compose -f /mnt/nextcloud-app/compose/docker-compose.yml ps" || echo "Nextcloud VM not reachable or not installed"
      - echo ""
      - echo "=== Nextcloud IngressRoutes ==="
      - kubectl get ingressroute -n default nextcloud nextcloud-internal 2>/dev/null || echo "No IngressRoutes found"

  verify:
    desc: Run Nextcloud smoke tests (web UI both hosts, occ status, exporter)
    cmds:
      - bash scripts/verify-nextcloud.sh

  backup:
    desc: Run the Nextcloud PostgreSQL backup now (also seeds the freshness metric)
    cmds:
      - echo "Running Nextcloud database backup..."
      - ssh eric@{{.NEXTCLOUD_IP}} "sudo /usr/local/sbin/nextcloud-backup-run.sh"
      - echo ""
      - 'echo "Backup complete. List dumps with:"'
      - echo "  ssh eric@{{.NEXTCLOUD_IP}} 'sudo ls -la /mnt/backups-offsite/'"

  console:
    desc: SSH to the Nextcloud VM
    cmds:
      - ssh eric@{{.NEXTCLOUD_IP}}

  logs:
    desc: Tail the Nextcloud compose logs
    cmds:
      - ssh eric@{{.NEXTCLOUD_IP}} "sudo docker compose -f /mnt/nextcloud-app/compose/docker-compose.yml logs -f --tail=100"

  restart:
    desc: Restart the Nextcloud compose stack
    cmds:
      - ssh eric@{{.NEXTCLOUD_IP}} "sudo systemctl restart nextcloud-compose.service"
