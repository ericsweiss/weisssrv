# GitLab reads a custom Secret Detection ruleset only from this path, ignoring
# `SECRET_DETECTION_RULESET_PATH`, so .gitleaks.toml reaches the scan through
# the passthrough below.
[secrets]
  description = "Custom Secret Detection ruleset for weisssrv"
  [[secrets.passthrough]]
    type = "file"
    target = "gitleaks.toml"
    value = ".gitleaks.toml"
