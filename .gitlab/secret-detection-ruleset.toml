# GitLab Secret Detection custom ruleset for weisssrv.
#
# GitLab's Secret-Detection job runs gitleaks under the hood. The previously
# used `SECRET_DETECTION_RULESET_PATH` variable is NOT a documented GitLab
# variable and was silently ignored, so `.gitleaks.toml` had no effect.
#
# Per GitLab docs (Custom rulesets schema), the supported mechanism is a
# `[[secrets.passthrough]]` entry in `.gitlab/secret-detection-ruleset.toml`
# that points at the actual gitleaks config.
# https://docs.gitlab.com/ee/user/application_security/secret_detection/pipeline/#custom-rulesets-schema
[secrets]
  description = "Custom Secret Detection ruleset for weisssrv"
  [[secrets.passthrough]]
    type = "file"
    target = "gitleaks.toml"
    value = ".gitleaks.toml"
