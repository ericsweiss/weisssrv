---
# Shared molecule/integration job templates, extracted from .gitlab-ci.yml so
# the SAME definitions serve both pipelines that run these tests:
#   - the parent pipeline's static full matrices (molecule-tests /
#     integration-tests: main, web, and the scheduled full-test run), and
#   - the MR-scoped targeted CHILD pipeline generated by
#     scripts/generate-molecule-pipeline.py (molecule-plan -> molecule-trigger
#     in .gitlab-ci.yml), whose generated YAML `include: local:`s this file and
#     extends the same templates.
# Keep this file self-contained: a child pipeline includes ONLY this file, so
# nothing here may `!reference` anchors that live in .gitlab-ci.yml.
# .molecule-base's needs: are all optional — inside a child pipeline those
# upstream jobs don't exist and the needs are ignored.

.molecule-base:
  stage: test
  # Set HERE, not inherited: the main .gitlab-ci.yml's `default: tags:` does
  # NOT reach a child pipeline that includes only this file — pipeline 777's
  # untagged child jobs were grabbed by the shared NON-privileged runner and
  # died instantly (no privileged DinD). Same for interruptible (parent
  # default: true): a newer MR push must still auto-cancel the child's jobs.
  tags: [infrastructure]
  interruptible: true
  # Backstop for infra-class scheduling failures (a pod that briefly can't be
  # placed during transition churn surfaces as runner_system_failure — wide
  # molecule fan-outs can exhaust schedulable CPU/memory and time a job pod
  # out Pending before any test runs). The primary fix is right-sizing the
  # job resources + quota (gitlab-runner-privileged) so these are rare;
  # deliberately NOT retrying script_failure (a failing test must not be
  # masked — transient in-container start storms are handled by the in-job
  # destroy+jitter loop in each test job) or stuck_or_timeout_failure (a
  # genuinely hung test should fail fast, not burn another full timeout).
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  needs:
    # build-molecule-ci emits a dotenv pinning MOLECULE_CI_IMAGE to the image
    # digest (overriding the :latest fallback below); artifacts:true consumes it.
    - job: build-molecule-ci
      optional: true
      artifacts: true
    # build-molecule-test rebuilds the role container. Optional need (no
    # artifacts) so WHEN it runs the matrix waits for the push before pulling by
    # SHA tag — otherwise the SHA pull below misses and falls back to the
    # previous main's :latest (a pull-before-push race when only test rebuilt).
    - job: build-molecule-test
      optional: true
    # Gate the expensive privileged-DinD fan-out (the 37-job molecule +
    # integration matrix) behind the two fastest correctness lints, so an MR
    # with a syntax/lint error doesn't burn the whole matrix on the scarce
    # privileged runner. optional: true — both lints are path-gated (skipped
    # when their paths don't change), and this deliberately leans runner-capacity
    # savings over the ~1-2 min it adds to a green pipeline's critical path.
    - job: ansible-lint
      optional: true
    - job: yaml-lint
      optional: true
  # Pre-built CI runner image (docker-cli + molecule + ansible + collections
  # baked in) — saves ~2 min of apt/pip/galaxy per job vs python:3.11.
  # `image:` only supports single-var expansion ($VAR), not bash defaults, so
  # the :latest fallback lives in the variables block below; the build job's
  # dotenv digest pin (above) overrides it on the hot path (anti-retag race).
  image: $MOLECULE_CI_IMAGE
  services:
    # --insecure-registry: the in-cluster pull-through cache (kubernetes/apps/
    # registry-cache, docs/27) is plaintext HTTP, network-fenced to this
    # namespace; every fresh DinD daemon needs the flag to pull from it.
    - name: docker:24.0-dind
      command: ["--insecure-registry=registry-cache.registry-cache.svc.cluster.local:5000"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    ANSIBLE_FORCE_COLOR: "1"
    PY_COLORS: "1"
    ANSIBLE_CALLBACKS_ENABLED: junit
    JUNIT_OUTPUT_DIR: "$CI_PROJECT_DIR/junit"
    MOLECULE_IMAGE: "${CI_REGISTRY_IMAGE}/molecule-test"
    # In-cluster pull-through registry cache: each molecule job's fresh DinD
    # cold-pulls the molecule-test image; after the first job warms the cache,
    # the other ~40 hit the LAN cache instead of the GitLab registry.
    REGISTRY_CACHE: "registry-cache.registry-cache.svc.cluster.local:5000"
    # Fallback when build-molecule-ci is skipped this pipeline; its
    # dotenv artifact (when present) overrides this with the digest pin.
    MOLECULE_CI_IMAGE: "${CI_REGISTRY_IMAGE}/molecule-ci:latest"
  before_script:
    # Wait for DinD sidecar — with the pre-built CI image, the script
    # starts before DinD is ready (no apt-get delay to absorb startup).
    - |
      for i in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        echo "Waiting for DinD... ($i)"
        sleep 1
      done
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Cache-first pull, SHA tag before :latest: when build-molecule-test
    # rebuilt the image this pipeline, jobs must use the SHA build, not a stale
    # :latest (the anti-retag race). Every cache pull
    # is timeout-bounded and falls back to the direct registry, so a cache
    # outage can never break or stall CI — it only loses the warm hit.
    - |
      cache_ref() { echo "${REGISTRY_CACHE}/${1#"${CI_REGISTRY}"/}"; }
      pull_via_cache() {  # $1 = full direct ref; tags cache hit back to $1
        local ref="$1" cref
        cref="$(cache_ref "$ref")"
        if timeout 25 docker pull "$cref" 2>/dev/null; then
          docker tag "$cref" "$ref"
          return 0
        fi
        docker pull "$ref" 2>/dev/null
      }
      if pull_via_cache "${MOLECULE_IMAGE}:${CI_COMMIT_SHORT_SHA}"; then
        docker tag "${MOLECULE_IMAGE}:${CI_COMMIT_SHORT_SHA}" "${MOLECULE_IMAGE}:latest"
      else
        pull_via_cache "${MOLECULE_IMAGE}:latest" || docker pull "${MOLECULE_IMAGE}:latest"
      fi
    - mkdir -p "$CI_PROJECT_DIR/junit"
  artifacts:
    when: always
    reports:
      junit: junit/*.xml
  # 30m, not 20m: the in-job wrapper retries molecule up to 4 attempts and the
  # heaviest scenarios run ~8-11m per attempt, so 20m could not fit even two
  # full attempts — a first-attempt flake on a heavy role was an automatic
  # timeout. 30m fits two heavy attempts (or three median ones) with margin
  # while still bounding a genuine hang.
  timeout: 30m


.molecule-test-job:
  extends: .molecule-base
  script:
    - cd "ansible/roles/$ROLE"
    # In-job destroy + jitter retry (see scripts/molecule-retry.sh for the why:
    # container-start storms under a full fan-out). The retry policy (max
    # attempts + 20-65s jitter) lives in that ONE script, shared with
    # integration-tests. The default scenarios inherit shared config from
    # ansible/molecule/base.yml via -c; the self-contained non-default scenarios
    # (k3s/agent, resolv_conf/empty-search) keep their full molecule.yml, no -c.
    - |
      base_opt=""
      [ "$SCENARIO" = "default" ] && base_opt="-c $CI_PROJECT_DIR/ansible/molecule/base.yml"
      MOL_BASE="$base_opt" MOL_SCEN="-s $SCENARIO" \
        bash "$CI_PROJECT_DIR/scripts/molecule-retry.sh"
    # Runs only when molecule SUCCEEDED (last script step): downgrade the
    # scenario's DECLARED negative-path failures in the junit report so a
    # green job uploads a green report. Undeclared failures stay red; failed
    # jobs never reach this line and keep their raw reports.
    - python3 "$CI_PROJECT_DIR/scripts/sanitize-junit-expected-failures.py"
      --junit-dir "$CI_PROJECT_DIR/junit"
      --expectations "$CI_PROJECT_DIR/ansible/roles/$ROLE/molecule/$SCENARIO/expected-junit-failures.txt"

.integration-test-job:
  extends: .molecule-base
  # Multi-container scenarios run 2-3 systemd containers through full
  # role stacks; base-infrastructure alone is ~12m idle and blew the
  # inherited 20m ceiling under pipeline fan-out contention (361).
  timeout: 35m
  script:
    - cd "ansible/integration-tests/$TEST"
    # Same shared destroy+jitter retry as molecule-tests (scripts/molecule-retry.sh)
    # — multi-container scenarios are the most start-storm-prone. No base/scenario
    # opts here (each integration test has a single molecule.yml).
    - bash "$CI_PROJECT_DIR/scripts/molecule-retry.sh"
    # Same declared-failure junit sanitation as .molecule-test-job (no stack
    # declares expectations today — the absent file is a no-op).
    - python3 "$CI_PROJECT_DIR/scripts/sanitize-junit-expected-failures.py"
      --junit-dir "$CI_PROJECT_DIR/junit"
      --expectations "$CI_PROJECT_DIR/ansible/integration-tests/$TEST/molecule/default/expected-junit-failures.txt"
