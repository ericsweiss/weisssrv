# NOTE: CI jobs do NOT currently use this agent's kubeconfig — the k8s-touching
# jobs read a long-lived kubeconfig from 1Password. The ci_access grant below is
# retained for a future migration to the agent's scoped, short-lived credential;
# until then it is unused by the pipeline.
ci_access:
  projects:
    - id: eric/weisssrv

# Lets GitLab query cluster resources for the dashboard.
observability:
  logging:
    level: warn

# remote_development off: agentk >= v19 hard-fails at startup on its synchronous
# apiserver probe, which races NetworkPolicy enforcement. Unused here (no Web
# IDE / remote workspaces).
remote_development:
  enabled: false
