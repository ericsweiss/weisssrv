# No ci_access grant: nothing in CI uses the agent's kubeconfig, and its
# ServiceAccount is cluster-admin — a standing grant hands every MR pipeline
# that identity. Re-add it with the migration tracked in docs/16.
observability:
  logging:
    level: warn

# remote_development off: agentk >= v19 hard-fails at startup on its synchronous
# apiserver probe, which races NetworkPolicy enforcement. No GitLab Workspaces
# here; the browser Web IDE and its ide.git extension host need no agent grant.
remote_development:
  enabled: false
