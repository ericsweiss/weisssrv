---
# Local guardrails: run `pre-commit install` once, then these run on every
# commit. They mirror the fast, tool-light CI lint-stage checks (secret scan,
# yamllint, whitespace/EOF, plus the repo's dangling-script + doc-link gates) so
# problems surface before a push + CI round-trip. Heavier tool-dependent jobs
# (flux:lint, molecule, prometheus-config, the *.sh.j2 shellcheck pass) stay
# CI-only. Revs are pinned.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks   # honors the repo-root .gitleaks.toml

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        # -d relaxed matches the CI yaml-lint job / `task lint:yamllint`
        # (this repo has no .yamllint config file).
        args: [-d, relaxed]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      - id: check-yaml
        # --unsafe: syntax-only parse (no tag construction) so the GitLab CI
        # `!reference` and Ansible `!vault` custom tags don't false-fail.
        args: [--allow-multiple-documents, --unsafe]

  - repo: local
    hooks:
      # The repo's own tool-free lint gates (bash + Python stdlib), same as the
      # CI taskfile-smoke / docs-link-check jobs.
      - id: check-taskfile
        name: Taskfile-referenced scripts resolve
        entry: bash scripts/check-taskfile.sh
        language: system
        files: ^Taskfile\.yml$
        pass_filenames: false
      - id: check-doc-links
        name: Docs relative Markdown links resolve
        entry: python3 scripts/check-doc-links.py
        language: system
        files: \.md$
        pass_filenames: false
