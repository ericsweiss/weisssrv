---
# Local guardrails: `pre-commit install` once, then these run on every commit,
# mirroring the fast tool-light CI lint checks. The tool-dependent jobs
# (flux:lint, molecule, prometheus-config, *.sh.j2 shellcheck) stay CI-only.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks   # honors the repo-root .gitleaks.toml

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        # The same profile the CI yaml-lint job and `task lint:yamllint`
        # select with -c.
        args: [-c, lint/yamllint-relaxed.yml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The two mutating hooks skip the byte-identical weisssrv-lib copies in
      # scripts/vendored-manifest.yml: a normalisation there reds
      # test_vendored_byte_identity.py, and the fix is upstream + re-vendor.
      - id: end-of-file-fixer
        exclude: &vendored_copies >-
          (?x)^( lint/yamllint-relaxed\.yml | ruff\.toml | scripts/(
          b2-bucket-drift\.py | check-alertmanager-behaviour\.py |
          check-backup-artifact-apps\.py |
          check-default-deny-coverage\.py | check-deploy-coverage\.sh |
          check-doc-links\.py | check-hpa-vpa-invariant\.py |
          check-kubectl-version-pin\.py | check-lib-pins\.py |
          check-netpol-except-parity\.py | check-pvc-storageclass\.py |
          check-scrape-netpol\.py | check-secretstore-scope\.py |
          check-taskfile\.sh | check-versions\.py |
          find-pve-host-for-vm\.sh | find-reachable-host\.sh |
          flux-env\.sh | flux-render\.sh | generate-hosts-env\.py |
          generate-versions-configmap\.py | kubeconform-skipped\.py |
          lint-prometheus-config\.sh | molecule-retry\.sh |
          resolve-tool\.sh | sanitize-junit-expected-failures\.py |
          shell-lib\.sh | test_check_lib_pins\.py |
          validate-helm-values\.py | version-bump-mr\.py |
          version-check-ci\.py
          ) )$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: *vendored_copies
      - id: check-merge-conflict
      - id: check-yaml
        # --unsafe: syntax-only parse (no tag construction) so the GitLab CI
        # `!reference` and Ansible `!vault` custom tags don't false-fail.
        args: [--allow-multiple-documents, --unsafe]

  - repo: local
    hooks:
      # The repo's own gates, the same ones `task lint` and the CI lint stage
      # run. `always_run` keeps each on a deletion-only commit, which
      # pre-commit's staged-file list leaves out.
      - id: check-taskfile
        name: Taskfile-referenced scripts resolve
        entry: bash scripts/check-taskfile.sh
        language: system
        files: ^(Taskfile\.yml|taskfiles/.*\.ya?ml|scripts/)
        pass_filenames: false
        always_run: true
      - id: check-doc-links
        name: Docs relative Markdown links resolve
        entry: python3 scripts/check-doc-links.py
        language: system
        files: \.md$
        pass_filenames: false
        always_run: true
      # A gate that imports PyYAML needs `language: python` with the pin below:
      # `language: system` runs it against whatever the committer's python3 has.
      - id: check-cluster-literals
        name: "Cluster identity stays a ${cluster_*} placeholder"
        entry: python scripts/check-cluster-literals.py
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        files: ^(ansible/inventories/|kubernetes/|scripts/check-cluster-literals\.py)
        pass_filenames: false
        always_run: true
      - id: check-netpol-except-parity
        name: NetworkPolicy egress fence holds
        entry: python scripts/check-netpol-except-parity.py --config scripts/netpol-except.yaml
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        files: ^(kubernetes/|scripts/)
        pass_filenames: false
        always_run: true
      # A pytest module, not a script: the resource-list checks live in a suite.
      # An emptied `resources:` list prunes every object its Kustomization
      # applied, so it is armed on every commit rather than only in CI.
      - id: kustomization-coverage
        name: Every manifest is listed and every kustomization renders something
        entry: python -m pytest scripts/test_kustomization_coverage.py -q -p no:cacheprovider
        language: python
        additional_dependencies: ["pyyaml==6.0.2", "pytest==9.1.1"]
        files: ^kubernetes/
        pass_filenames: false
        always_run: true
      - id: flux-version-pin
        name: One Flux version across the inventory and the manifests
        entry: python scripts/check-flux-version-pin.py
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        files: ^(kubernetes/|ansible/inventories/prod/group_vars/all\.yml|scripts/check-flux-version-pin\.py)
        pass_filenames: false
        always_run: true
      - id: version-coverage
        name: Every pin is in the version registry
        entry: python scripts/check-versions.py --check-coverage
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        files: ^(ansible/inventories/prod/group_vars/all\.yml|scripts/version-registry\.py|scripts/check-versions\.py)
        pass_filenames: false
        always_run: true
      - id: check-runbook-anchors
        name: Alert runbook_url targets resolve
        entry: python3 scripts/check-runbook-anchors.py
        language: system
        files: ^(docs/|kubernetes/)
        pass_filenames: false
        always_run: true
      - id: check-skill-refs
        name: Skill-cited repo paths resolve
        entry: python3 scripts/check-skill-refs.py
        language: system
        files: ^(\.claude/|docs/|scripts/)
        pass_filenames: false
        always_run: true
