# gitleaks allowlist for the weisssrv homelab repo.
#
# This is consumed by GitLab's secret_detection job (which uses gitleaks under
# the hood) via the passthrough in `.gitlab/secret-detection-ruleset.toml`.
#
# Scope of exclusions (see `paths` and `regexes` blocks below):
#   - `docs/*.md` and `ansible/roles/*/molecule/*` are scanned with default
#     rules but suppressed via PATH allowlist. Both trees are full of
#     placeholder-shaped strings (bracketed examples, fixture credentials)
#     that gitleaks's defaults flag heavily. Trade-off: a real secret
#     committed under either path won't be caught here — but those trees
#     are operator-authored and reviewed independently, and the
#     `regexes` content patterns below still silence the most common
#     false-positives outside those paths (1Password op:// refs, doc
#     placeholders like `[your-...]`, anchored molecule fixture tokens).
#
# `useDefault = true` is REQUIRED — without it gitleaks loads only the rules
# defined in this file (which has none), disabling all detection.

title = "weisssrv allowlist"

[extend]
useDefault = true

[allowlist]
description = "weisssrv homelab false positives"
regexes = [
  # 1Password reference URIs — not secrets, just pointers to vault items.
  '''op://[A-Za-z0-9_ /-]+''',
  # Documentation placeholders like [your-cloudflare-api-token].
  '''\[your-[a-z0-9-]+\]''',
  # Molecule fixtures — anchored at start of token so a real secret prefixed
  # with "prodtestkey_…" or similar can't be silenced. Combined with the
  # `paths` allowlist below this is also scoped to molecule/doc trees.
  '''^(test|fake|dummy|example)[-_]?(password|token|key|secret)[A-Za-z0-9_-]*''',
  # acme_certs molecule generates a throwaway ed25519 keypair labelled
  # "kest-ssh-key-for-molecule-testing"; allow the comment marker.
  '''kest-ssh-key-for-molecule-testing''',
]

paths = [
  # Generated cluster snapshots (gitignored, but never trip on a stray copy).
  '''CLUSTER_STATUS\.txt''',
  '''cluster-state-.*\.txt''',
  # Molecule fixture files always carry placeholder credentials.
  '''ansible/roles/.*/molecule/.*''',
  '''ansible/integration-tests/.*/molecule/.*''',
  # Doc walk-throughs use bracketed placeholders that look secret-shaped.
  '''docs/.*\.md''',
]
