# gitleaks allowlist for the weisssrv homelab repo.
#
# This is consumed by GitLab's secret_detection job (which uses gitleaks under
# the hood) via the passthrough in `.gitlab/secret-detection-ruleset.toml`.
#
# A declared fork of weisssrv-lib's `lint/gitleaks.toml` (declared in this
# repo's `scripts/vendored-manifest.yml`, which is what gates the divergence):
# the shared rules and the shared false-positive shapes come from there, the
# path exclusions and the fixture anchors below are this repo's.
#
# Exclusion policy: nothing is excluded by PATH except generated/third-party
# trees. Docs and test fixtures stay fully in scope and are allowlisted by
# CONTENT, anchored on each shape's own body, so a real secret added to one is
# still caught.
#
# `useDefault = true` is REQUIRED — without it gitleaks loads only the rules
# defined in this file (which has none), disabling all detection.

title = "weisssrv allowlist"

[extend]
useDefault = true

[[allowlists]]
description = "weisssrv homelab false positives"
regexes = [
  # 1Password reference URIs — not secrets, just pointers to vault items.
  '''op://[A-Za-z0-9_ /-]+''',
  # Documentation placeholders like [your-cloudflare-api-token].
  '''\[your-[a-z0-9-]+\]''',
  # Test/fixture tokens — anchored at start of token so a real secret prefixed
  # with "prodtestkey_…" or similar can't be silenced.
  '''^(test|fake|dummy|example)[-_]?(password|token|key|secret)[A-Za-z0-9_-]*''',
  # Published supply-chain pins (public by construction, but they trip the
  # entropy rule). Exact values, so rotating a pinned key forces a review here.
  '''^3FEF9748469ADBE15DA7CA80AC2D62742012EA22$''',
  '''^0e88171d9f8b7630763f70cbf69f2a01b4ba8ea1d8e79487f59c162db255eb84$''',
]

paths = [
  # Generated cluster snapshots (gitignored; guards a stray copy).
  '''CLUSTER_STATUS\.txt''',
  '''cluster-state-.*\.txt''',
  # Vendored galaxy collections (gitignored) — third-party, not ours to scan.
  '''\.ansible-home/''',
  # Terraform module/provider cache (gitignored) — third-party.
  '''\.terraform/''',
  # Byte-compiled fixtures: the compiled form loses the shape the anchors match.
  '''__pycache__/''',
]

# Synthetic key material from this repo's own tests, matched by CONTENT so the
# files holding it stay in scope for every rule.
[[allowlists]]
description = "weisssrv synthetic test fixtures"
regexes = [
  # cert-distribution molecule — mock acme.sh private keys.
  '''MIIEvgIBADANBgkqhkiGTestPrivateKey''',
  # test_collect_state_lib.py — redaction-suite inputs, patterns not credentials.
  '''^glpat-abc123def456$''',
  '''^glrt-AbC_123-xyz$''',
  '''7the8keymaterial''',
]

# Tracked strings that name a thing rather than hold one. Each is listed as an
# exact value so a real secret in the same position still fires.
[[allowlists]]
description = "identifiers the default rules misread as values"
regexes = [
  # terraform/authentik — attribute NAMES, not the passwords they point at.
  '''^"(nzbget|adguard)_password"$''',
  # docs/42 — a dm-crypt cipher spec.
  '''^aes-xts-plain64$''',
]
