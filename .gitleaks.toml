# gitleaks allowlist for the weisssrv homelab repo.
#
# This is consumed by GitLab's secret_detection job (which uses gitleaks under
# the hood) via the passthrough in `.gitlab/secret-detection-ruleset.toml`.
#
# Scope of exclusions:
#   - `docs/*.md` is scanned normally — the `regexes` content allowlist below
#     covers the placeholder shapes docs use (1Password op:// refs, doc
#     placeholders like `[your-...]`), so a real secret committed under docs/ is
#     still caught.
#   - The molecule trees (`ansible/roles/*/molecule/*`,
#     `ansible/integration-tests/*/molecule/*`) are NOT excluded wholesale.
#     Several scenarios inline THROWAWAY PEM private keys (acme_certs, nfs_tls,
#     the cert/mail integration tests) that trip only gitleaks's `private-key`
#     rule, so the rule-scoped allowlist below suppresses ONLY that rule under
#     those paths. Every OTHER rule — cloud keys, provider tokens, high-entropy
#     strings — still scans the molecule trees, so a real secret pasted into a
#     `secrets:` fixture (the most likely place) is still caught.
#
# `useDefault = true` is REQUIRED — without it gitleaks loads only the rules
# defined in this file (which has none), disabling all detection.

title = "weisssrv allowlist"

[extend]
useDefault = true

[[allowlists]]
description = "weisssrv homelab false positives"
regexes = [
  # 1Password reference URIs — not secrets, just pointers to vault items.
  '''op://[A-Za-z0-9_ /-]+''',
  # Documentation placeholders like [your-cloudflare-api-token].
  '''\[your-[a-z0-9-]+\]''',
  # Test/fixture tokens — anchored at start of token so a real secret prefixed
  # with "prodtestkey_…" or similar can't be silenced.
  '''^(test|fake|dummy|example)[-_]?(password|token|key|secret)[A-Za-z0-9_-]*''',
]

paths = [
  # Generated cluster snapshots (gitignored, but never trip on a stray copy).
  '''CLUSTER_STATUS\.txt''',
  '''cluster-state-.*\.txt''',
]

# Rule-scoped allowlist: suppress ONLY the default `private-key` rule under the
# molecule trees (the throwaway PEM fixtures), not the whole path. A global
# allowlist with `targetRules` never redefines the default rule (re-declaring
# `[[rules]] id = "private-key"` merges on current gitleaks but would silently
# DISABLE the detector on any version with replace semantics — fail-open),
# and if a runner's gitleaks were too old for targetRules the fixtures would
# fail the job loudly instead (fail-closed). Every other rule still scans the
# molecule trees, and private-key still fires everywhere else.
[[allowlists]]
description = "molecule throwaway PEM private keys"
targetRules = ["private-key"]
paths = [
  '''ansible/roles/.*/molecule/.*''',
  '''ansible/integration-tests/.*/molecule/.*''',
]
