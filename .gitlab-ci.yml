deploy-gitlab-verify:
  stage: deploy
  # The verify script only runs curl + /dev/tcp checks — it needs no Ansible,
  # SSH key, kubeconfig, or 1Password, so it deliberately does NOT extend the
  # heavy .deploy-base (which pip-installs Ansible + collections and materializes
  # the SSH private key into ~/.ssh). Slim image + curl; interruptible:false
  # kept because it is still a deploy-stage job (default is interruptible:true).
  image: python:3.11-slim
  interruptible: false
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
  needs:
    - job: validation-gate
    - job: deploy-gitlab
      optional: true
    # Ingress/runner deploys are now Flux-managed; reconciliation typically
    # completes within 1-2 minutes of the push that triggered this pipeline.
  script:
    - |
      echo "=== GitLab Verification ==="
      # Each check records its own failure instead of exiting immediately —
      # an operator wants to see EVERY failing component in one run, not
      # stop at the first one. Final summary surfaces exit code.
      # With allow_failure: true on the job, a non-zero exit yields a yellow
      # warning-style status in the pipeline UI but doesn't block the pipeline.
      EXIT=0

      echo "Testing GitLab web UI..."
      if ! curl_err=$(curl -sf --max-time 30 "https://git.ericsweiss.com/-/readiness" 2>&1); then
        echo "ERROR: GitLab readiness check failed: $curl_err"
        EXIT=1
      else
        echo "GitLab web UI: OK"
      fi

      echo "Testing Container Registry..."
      REGISTRY_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://registry.git.ericsweiss.com/v2/)
      if [ "$REGISTRY_CODE" = "200" ] || [ "$REGISTRY_CODE" = "401" ]; then
        echo "Container registry: OK (HTTP $REGISTRY_CODE)"
      else
        echo "Container registry: FAILED (HTTP $REGISTRY_CODE)"
        EXIT=1
      fi

      echo "Testing SSH connectivity..."
      if timeout 5 bash -c 'cat < /dev/null > /dev/tcp/192.168.0.153/22' 2>/dev/null; then
        echo "SSH port 22: OK"
      else
        echo "ERROR: SSH port 22 on 192.168.0.153 not reachable"
        EXIT=1
      fi

      echo ""
      echo "=== GitLab Verification Complete (exit=$EXIT) ==="
      exit $EXIT
  environment:
    name: production/gitlab-verify
  rules:
    # Inherit deploy-gitlab's rules verbatim so this verify job appears in
    # the pipeline if and only if deploy-gitlab does. Avoids drift between
    # deploy and verify trigger paths.
    - !reference [deploy-gitlab, rules]
  allow_failure: true

# Post-Deploy Verification

deploy-verify:
  stage: deploy
  extends: .k3s-deploy-base
  needs:
    - job: validation-gate
    - job: deploy-terraform
      optional: true
    - job: deploy-ansible-base
      optional: true
    - job: deploy-ansible-proxmox
      optional: true
    - job: deploy-ansible-firewall
      optional: true
    - job: deploy-ansible-dns
      optional: true
    - job: deploy-ansible-storage
      optional: true
    - job: deploy-ansible-mail
      optional: true
    - job: deploy-ansible-certs
      optional: true
    - job: deploy-plex
      optional: true
    - job: deploy-gitlab
      optional: true
    - job: deploy-nextcloud
      optional: true
    - job: deploy-immich-ml
      optional: true
    - job: deploy-home-assistant-config
      optional: true
    - job: deploy-gitlab-verify
      optional: true
    # Kubernetes workloads (k3s platform, Authentik, downloads, recipes,
    # ingress routes, runners) are Flux-managed; Flux typically reconciles
    # within 1-2 minutes of this push. deploy-verify checks cluster health
    # below and reports Flux reconciliation state via `flux get all -A`.
  script:
    - |
      # Install flux CLI alongside the kubectl already provisioned by
      # .k3s-deploy-base. Flux is the source of truth for k8s workload state,
      # so verification queries Flux CRs rather than individual Deployments.
      # Version + checksum are pinned together (supply-chain); bump both in
      # one change. check-versions tracks flux_version in all.yml, and the
      # guard below fails the job if this pin drifts from it.
      FLUX_VERSION="2.9.0"
      grep -q "flux_version: ${FLUX_VERSION}" kubernetes/infrastructure/sources/versions-configmap.yaml \
        || { echo "FLUX_VERSION ${FLUX_VERSION} drifted from versions-configmap flux_version"; exit 1; }
      curl -fsSL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz" -o /tmp/flux.tar.gz
      echo "7aa9779fc7ec6d030e609dab7dbed8c6fc9e3a7f4670834ad02369268aaf341f  /tmp/flux.tar.gz" | sha256sum -c -
      tar xzf /tmp/flux.tar.gz -C /usr/local/bin flux
      flux --version
    - bash scripts/deploy-verify.sh
  rules:
    # Inherit each deploy-* job's rules verbatim so this verify job appears
    # in the pipeline if and only if at least one deploy-* job does.
    # GitLab evaluates rules in order, first match wins; each !reference
    # expansion contributes that job's `if:`+`changes:` triplet, and the
    # `if: schedule|web when: never` rules at the top of each block apply
    # equally to verify (we don't want verify on schedules/web pipelines
    # any more than the deploys themselves).
    - !reference [deploy-terraform, rules]
    - !reference [deploy-ansible-base, rules]
    - !reference [deploy-ansible-proxmox, rules]
    - !reference [deploy-ansible-firewall, rules]
    - !reference [deploy-ansible-dns, rules]
    - !reference [deploy-ansible-storage, rules]
    - !reference [deploy-ansible-mail, rules]
    - !reference [deploy-ansible-certs, rules]
    - !reference [deploy-plex, rules]
    - !reference [deploy-gitlab, rules]
    - !reference [deploy-nextcloud, rules]
    - !reference [deploy-immich-ml, rules]
    - !reference [deploy-home-assistant-config, rules]
    # Flux-only changes (kubernetes/ manifests with no Ansible or all.yml edit)
    # match none of the deploy-* rules above, so the live Flux reconcile +
    # server-side dry-run below would never run for the most common GitOps
    # change. Trigger verify directly on kubernetes/ edits. schedule/web are
    # already excluded by the when:never guards in the referenced blocks
    # (rules are first-match-wins, and those guards come first).
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - kubernetes/**/*
  # No allow_failure: the verification explicitly fails if nodes aren't Ready,
  # Flux reconciliation times out, any Flux resource is not Ready, server-side
  # dry-run rejects manifests, or GitLab is unreachable. ExternalSecret
  # readiness is a hard failure on steady-state clusters (all Kustomizations
  # were Ready pre-reconcile) and a warning during bootstrap/recovery.

# MAINTENANCE STAGE - Manual approval required
# All maintenance jobs use resource_group to prevent concurrent execution.
# Only one maintenance job can run at a time across the entire infrastructure.
#
# Recommended execution order (when running multiple):
#   1. update-packages       — OS packages on all hosts (may reboot)
#   2. update-applications   — App upgrades (needs clean OS)
#   3. update-k3s-nodes      — k3s binary upgrade (needs stable OS)
#   4. k3s-provision         — Only when adding new VMs
#   5. proxmox-ha            — HA rules (rarely changes)
#   6. home-assistant-restart — Only when needed
#   7. verify                — Always last

# 1. OS package updates - MANUAL (all hosts, auto-reboot in CI)
# For interactive mode, use: task maintenance:update-packages
maintenance-update-packages:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  script:
    - cd ansible
    - bash ../scripts/maintenance-run-with-verify.sh
        op run -- ansible-playbook -i inventories/prod playbooks/maintenance/update-packages.yml -e auto_reboot=true -e self_reboot_delay=5400
  environment:
    name: production/maintenance-packages
    action: prepare
  rules:
    - !reference [.maintenance-manual-rules, rules]

# 2. Application updates - MANUAL (AdGuard, Tailscale, Plex)
maintenance-update-applications:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    ADGUARD_ADMIN_PASSWORD: "op://Homelab/AdGuard Home/password"
    TAILSCALE_AUTH_KEY: "op://Homelab/Tailscale Auth Key/credential"
  script:
    - cd ansible
    - bash ../scripts/maintenance-run-with-verify.sh
        op run -- ansible-playbook -i inventories/prod playbooks/maintenance/update-applications.yml
  environment:
    name: production/maintenance-applications
    action: prepare
  rules:
    - !reference [.maintenance-manual-rules, rules]

# 3. K3s node updates - MANUAL (cordon/upgrade/restart; no drain — kernel reboots via kured)
maintenance-update-k3s-nodes:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  variables:
    K3S_TOKEN: "op://Homelab/K3s Cluster Token/credential"
    # Lower-privilege agent token (ANS-D-2). Without it, group_vars/k3s.yml
    # falls back to the cluster token and node upgrades would rewrite the
    # agents' env files with the full token. See docs/19 "Agent token".
    K3S_AGENT_TOKEN: "op://Homelab/K3s Agent Token/credential"
  script:
    - cd ansible
    - bash ../scripts/maintenance-run-with-verify.sh
        op run -- ansible-playbook -i inventories/prod playbooks/maintenance/update-k3s-nodes.yml
  environment:
    name: production/k3s-nodes
    action: prepare
  rules:
    - !reference [.maintenance-manual-rules, rules]

# 4. K3s VM provisioning - MANUAL (creates/modifies VMs)
maintenance-k3s-provision:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  variables:
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    K3S_TOKEN: "op://Homelab/K3s Cluster Token/credential"
    # Lower-privilege agent token (ANS-D-2). Servers advertise it (agent-token)
    # and agents join with it instead of the cluster token. See docs/19
    # "Agent token".
    K3S_AGENT_TOKEN: "op://Homelab/K3s Agent Token/credential"
  script:
    - cd ansible
    # k3s-provision is two playbooks; chain them inside `bash -c` so the
    # wrapper sees a single command unit. set -e inside the inline script
    # ensures the second playbook is skipped if the first fails.
    - bash ../scripts/maintenance-run-with-verify.sh bash -c
        'set -e;
         op run -- ansible-playbook -i inventories/prod playbooks/k3s-provision-vms.yml;
         op run -- ansible-playbook -i inventories/prod playbooks/k3s.yml'
  environment:
    name: production/k3s-provision
    action: prepare
  rules:
    - !reference [.maintenance-manual-rules, rules]

# NOTE: maintenance-update-full removed from CI — superseded by:
#   maintenance-update-packages (broader host coverage) + maintenance-update-applications
# The Taskfile still has task maintenance:update-full for local use.

# 5. Proxmox HA - MANUAL (affects VM placement)
maintenance-proxmox-ha:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  script:
    - cd ansible
    - bash ../scripts/maintenance-run-with-verify.sh
        op run -- ansible-playbook -i inventories/prod playbooks/proxmox-ha.yml
  environment:
    name: production/proxmox-ha
    action: prepare
  rules:
    - !reference [.maintenance-manual-rules, rules]

# 6. Home Assistant restart - MANUAL (restarts HA VM)
maintenance-home-assistant-restart:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  script:
    # The HA restart sub-script handles ha-manager + readiness loop;
    # the wrapper guarantees verify runs after.
    - bash scripts/maintenance-run-with-verify.sh bash scripts/maintenance-ha-restart.sh
  environment:
    name: production/home-assistant-restart
    action: prepare
  rules:
    - !reference [.maintenance-manual-rules, rules]

# Optional: single-button "run all 6 ops in sequence". Delegates the
# 6-op sequence to scripts/maintenance-all-ops.sh and wraps it in
# maintenance-run-with-verify.sh so the post-maintenance verify
# always runs at the end (even if a sub-op failed).
maintenance-run-all:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  variables:
    # Union of secrets needed by the six ops invoked below.
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    ADGUARD_ADMIN_PASSWORD: "op://Homelab/AdGuard Home/password"
    TAILSCALE_AUTH_KEY: "op://Homelab/Tailscale Auth Key/credential"
    K3S_TOKEN: "op://Homelab/K3s Cluster Token/credential"
    # Lower-privilege agent token (ANS-D-2) — required by the k3s node-update
    # and provision ops below, or they'd fall back to the cluster token.
    K3S_AGENT_TOKEN: "op://Homelab/K3s Agent Token/credential"
  script:
    # The all-ops sub-script handles the 6 ops; the wrapper guarantees
    # verify runs after, even if any op failed.
    - bash scripts/maintenance-run-with-verify.sh bash scripts/maintenance-all-ops.sh
  environment:
    name: production/maintenance-run-all
    action: prepare
  rules:
    - !reference [.maintenance-manual-rules, rules]

# 7. Post-maintenance verification - MANUAL ad-hoc cluster health check
# The maintenance ops + maintenance-run-all already invoke
# scripts/post-maintenance-verify.sh as the last step of their own job,
# so verify runs strictly after each op without any cross-job needs/stage
# coordination. This standalone job is just an ad-hoc "check cluster
# health right now" button; click it any time to re-run the same script
# without triggering an actual maintenance op.
maintenance-verify:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  script:
    - bash scripts/post-maintenance-verify.sh
  rules:
    - !reference [.maintenance-manual-rules, rules]

# VERSION CHECK - Runs early, soft-fail on PRs

version-check:
  # Every other lint-stage job sets needs: [] so it starts immediately instead
  # of waiting out the whole build stage (multi-minute image builds) it has no
  # dependency on. version-check is soft-fail everywhere, so an earlier start is
  # strictly beneficial.
  needs: []
  stage: lint
  image: python:3.11
  before_script:
    # Install the 1Password CLI only when OP_SERVICE_ACCOUNT_TOKEN is present
    # (forks / outside MRs don't get the masked variable). The CLI is only
    # needed for the MR auto-comment path; without the token the job still
    # runs and still emits the version-report.json artifact. We inline the
    # apt install here (rather than `extends`/`!reference` .install-1password)
    # so it can be conditional — a YAML `!reference` can't live inside a shell
    # `if`, and unconditionally installing it on every schedule/MR/main run
    # would add a useless apt round-trip when no token is available.
    - |
      if [ -n "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
        apt-get update -qq
        apt-get install -y -qq curl gnupg
        curl -sS https://downloads.1password.com/linux/keys/1password.asc | \
          gpg --dearmor --output /usr/share/keyrings/1password-archive-keyring.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main" \
          > /etc/apt/sources.list.d/1password.list
        apt-get update -qq && apt-get install -y -qq 1password-cli
        op --version
      fi
  script:
    - pip install --quiet "pyyaml==${PYYAML_VERSION}" requests==2.32.3
    # GITLAB_API_TOKEN drives version-check-ci.py's post_mr_comment(). Without
    # it the script gracefully skips the comment and only writes the
    # version-report.json artifact (graceful-skip lives in version-check-ci.py).
    # Gate the op read on the token so non-token pipelines still run cleanly.
    - |
      if [ -n "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
        export GITLAB_API_TOKEN=$(op read "op://Homelab/GitLab API Token/credential")
      fi
    - python3 ./scripts/version-check-ci.py
  artifacts:
    paths:
      - version-report.json
    expire_in: 7 days
    when: always
  rules:
    # Run on schedule (weekly check). Soft-fail: rc=1 just means updates are
    # available, which must not red the scheduled pipeline.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: true
    # Manual trigger on web pipelines (must precede main rule to avoid auto-run).
    # allow_failure: rules-based `when: manual` defaults to allow_failure: false,
    # which would leave every web pipeline "blocked" until this job is played.
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    # Run on MRs as informational (soft-fail)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      allow_failure: true
    # Run on pushes to main as informational (soft-fail)
    - if: '$CI_COMMIT_BRANCH == "main"'
      allow_failure: true

# VERSION BUMP BOT - weekly scheduled version-pin MR
#
# Where version-check REPORTS what is outdated, this job ACTS on it: it runs the
# same `task maintenance:update-all-versions` an operator runs by hand, then hands
# the working tree to scripts/version-bump-mr.py, which keeps exactly ONE open bot
# MR in sync with it. Three outcomes, all idempotent, and it NEVER merges:
#
#   bumps + branch content changed   -> force-push bot/version-bumps, create the
#                                       MR or refresh the open one
#   bumps + branch content identical -> nothing (no push, no MR churn, so a
#                                       weekly re-run does not re-notify)
#   no bumps + an open bot MR        -> close it
#
# INLINE, NOT `include:`d — deliberate, and temporary. This is
# eric/weisssrv-lib's ci/maintenance/version-bump-bot.yml reproduced in the
# template's exact shape (same job name, stage, image class, variables, script
# ORDER — setup, check, MR manager — and rules), because weisssrv pins the shared
# library at v0.1.1 (see the include: block above) and that template first ships
# in v0.2.0. Bumping the shared ref is its own change: every one of the seven
# included jobs needs parity evidence and weisssrv-app-template has to move in
# lockstep (docs/13 "Shared CI library"), so it does not ride along with a new
# job. When the ref does move to >= v0.2.0, delete this job and add:
#
#   - project: eric/weisssrv-lib
#     ref: <tag>
#     file: /ci/maintenance/version-bump-bot.yml
#     inputs:
#       image: python:3.11
#       setup_command: <this job's before_script>
#       check_command: <this job's first script step>
#       paths: "<PINS_FILE> <VERSIONS_CONFIGMAP>"
#       report_path: version-bump-report.txt
#
# and keep the local `rules:` + `artifacts:` overrides (the template has no input
# for either). scripts/version-bump-mr.py is already vendored BYTE-IDENTICAL from
# the library, and the template reads its path from the consumer tree, so the
# script itself does not change in that swap.
version-bump-bot:
  # Consumes no artifacts (every input comes from the repo + 1Password at
  # runtime), so it starts immediately instead of waiting out the build stage.
  needs: []
  stage: maintenance
  # Full image, NOT python:3.11-slim: the bot commits and force-pushes a branch,
  # and the slim images ship no git.
  image: python:3.11
  # Pushes a branch and mutates an MR; a mid-run cancel can leave the branch
  # pushed but its MR unrefreshed. Same opt-out every deploy/maintenance job
  # takes from the workflow-level auto_cancel.
  interruptible: false
  # Infra-class retries only — a genuinely broken check must fail loudly rather
  # than re-run the whole upstream sweep three times.
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  variables:
    # Full clone: pushing a branch built on a shallow checkout is rejected as a
    # "shallow update".
    GIT_DEPTH: "0"
    # A PAT with `api` + `write_repository`, masked (the value lands in the push
    # URL). CI_JOB_TOKEN CANNOT do this job: it cannot push, and the Merge
    # requests API is read-only for job tokens. Item of record, scopes and
    # rotation: docs/15-credential-rotation.md ("GitLab Version Bump Bot Token").
    BOT_TOKEN: "$VERSION_BUMP_BOT_TOKEN"
    # The only two files the bot is allowed to commit — the version-pin pair that
    # `task maintenance:update-all-versions` rewrites. Scoping the pathspec (vs
    # the template's default ".") means an unrelated tracked change in the
    # checkout can never be swept into the bot's commit.
    PINS_FILE: ansible/inventories/prod/group_vars/all.yml
    VERSIONS_CONFIGMAP: kubernetes/infrastructure/sources/versions-configmap.yaml
    # The captured report is embedded verbatim in the MR description — keep
    # go-task's ANSI escapes out of it. (check-versions.py already self-disables
    # colour on a non-tty.)
    NO_COLOR: "1"
  before_script:
    # 1Password CLI: `task maintenance:update-all-versions` runs its checker
    # under `op run --` to inject GITHUB_TOKEN (GitHub API rate-limit headroom).
    - !reference [.install-1password, before_script]
    # PyYAML: check-versions.py reads all.yml, generate-versions-configmap.py
    # writes the ConfigMap from it.
    - pip install --no-cache-dir --quiet "PyYAML==${PYYAML_VERSION}"
    - |
      # go-task, pinned + sha256 like every other downloaded binary in this
      # pipeline (same pair as repo-policy-checks — keep them in step). The bot
      # drives the Taskfile rather than the scripts directly so the unattended
      # path and the documented operator path can never drift.
      TASK_VERSION="v3.52.0"
      TASK_SHA256="02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd"
      curl -fsSL "https://github.com/go-task/task/releases/download/${TASK_VERSION}/task_linux_amd64.tar.gz" -o /tmp/task.tar.gz
      echo "${TASK_SHA256}  /tmp/task.tar.gz" | sha256sum -c -
      tar xzf /tmp/task.tar.gz -C /usr/local/bin task
      task --version
  script:
    # STEP 1 — the library template's `check_command`: rewrite the pins in place.
    #
    # EXIT CODES. check-versions.py --update-all does NOT signal "updates found"
    # with rc=1 (the trap the library template warns about, which would need an
    # explicit `|| true`): it exits 0 whether or not it wrote a bump, and 2 only
    # when a service errored upstream or a pin could not be written. So no
    # blanket `|| true` — that would hide a broken checker. Instead:
    #
    #   rc=0             normal path; go-task already ran flux:sync-versions.
    #   rc!=0 + bumps    ship what did resolve, but go-task aborted BEFORE its
    #                    flux:sync-versions step, so regenerate the ConfigMap
    #                    here — committing all.yml without it would red the bot
    #                    MR's own repo-sync-checks and leave Flux on stale pins.
    #                    The report (embedded in the MR body) carries the
    #                    checker's WARNING block naming what errored.
    #   rc!=0 + no bumps re-raise. A checker that errored is not a trustworthy
    #                    "everything is up to date" signal, and STEP 2 would act
    #                    on it by closing a still-valid open bot MR.
    - |
      # pipefail explicitly, not assumed from the runner's shell preamble: `tee`
      # always exits 0, so without it every rc below would read as success and
      # the "no bumps" branch would close a live MR on a broken run.
      set -o pipefail
      rc=0
      task maintenance:update-all-versions 2>&1 | tee version-bump-report.txt || rc=$?
      if [ "$rc" -ne 0 ]; then
        python3 scripts/generate-versions-configmap.py
        if git diff --quiet -- "$PINS_FILE"; then
          echo "ERROR: version check exited ${rc} and wrote no bumps — refusing to treat that as 'all up to date'." >&2
          exit "$rc"
        fi
        echo "WARNING: version check exited ${rc}; shipping the pins that did resolve (see the report block in the MR)."
      fi
    # STEP 2 — create / refresh / close the single bot MR. Never merges.
    # Untracked files (the report artifact) are ignored; only the tracked pin
    # pair is committed.
    - |
      python3 scripts/version-bump-mr.py \
        --branch "bot/version-bumps" \
        --target-branch "main" \
        --title "chore(deps): version bumps" \
        --commit-message "chore(deps): update pinned versions" \
        --paths "$PINS_FILE $VERSIONS_CONFIGMAP" \
        --report-path version-bump-report.txt
  artifacts:
    # The MR description embeds the first 4000 chars of this report and points
    # at "the job artifact" for the rest, so it has to outlive the default
    # expiry of a weekly MR that sits unreviewed for a while.
    paths:
      - version-bump-report.txt
    expire_in: 30 days
    when: always
  rules:
    # Its OWN schedule (SCHEDULE_TYPE=version-bump), following the SCHEDULE_TYPE
    # convention the full-test canary already uses: an unattended MR-opening bot
    # must not also fire on the weekly version-check schedule or the full-test
    # canary. Token-guarded because `op run` cannot resolve the GitHub Token
    # reference without it — the run would be pointless (and rate-limited).
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "version-bump" && $OP_SERVICE_ACCOUNT_TOKEN'
    # Manual button on a web pipeline — the documented "run it by hand" path.
    # allow_failure: rules-based `when: manual` defaults to allow_failure: false,
    # which would leave every web pipeline "blocked" until this job is played.
    - if: '$CI_PIPELINE_SOURCE == "web" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true
