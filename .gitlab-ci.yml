# ------------------------------------------------------------------------------
# K3s Platform (MetalLB, Traefik, cert-manager, external-dns, DDNS)
# ------------------------------------------------------------------------------

deploy-k3s-platform:
  stage: deploy
  extends: .k3s-deploy-base
  needs:
    - job: validation-gate
    - job: deploy-terraform
      optional: true
  script:
    - |
      VARS_FILE="ansible/inventories/prod/group_vars/all.yml"

      # Add Helm repos
      helm repo add metallb https://metallb.github.io/metallb
      helm repo add traefik https://traefik.github.io/charts
      helm repo add jetstack https://charts.jetstack.io
      helm repo add external-dns https://kubernetes-sigs.github.io/external-dns
      helm repo update

      # MetalLB
      echo "Deploying MetalLB..."
      helm upgrade --install metallb metallb/metallb \
        -n metallb-system --create-namespace \
        -f kubernetes/bootstrap/metallb/values.yaml \
        --version "$(yq -r '.helm_chart_versions.metallb' $VARS_FILE)" \
        --wait --timeout 5m
      kubectl apply -f kubernetes/bootstrap/metallb/ip-pool.yaml

      # cert-manager
      echo "Deploying cert-manager..."
      helm upgrade --install cert-manager jetstack/cert-manager \
        -n cert-manager --create-namespace \
        -f kubernetes/apps/cert-manager/values.yaml \
        --version "$(yq -r '.helm_chart_versions.cert_manager' $VARS_FILE)" \
        --wait --timeout 5m
      kubectl apply -f kubernetes/apps/cert-manager/cluster-issuer.yaml

      # Traefik
      echo "Deploying Traefik..."
      CF_TOKEN=$(op read "op://Homelab/Cloudflare DNS Token/credential")
      helm upgrade --install traefik traefik/traefik \
        -n traefik --create-namespace \
        -f kubernetes/apps/traefik/values.yaml \
        --version "$(yq -r '.helm_chart_versions.traefik' $VARS_FILE)" \
        --set env[0].name=CF_DNS_API_TOKEN \
        --set env[0].value="$CF_TOKEN" \
        --wait --timeout 5m

      # external-dns
      echo "Deploying external-dns..."
      kubectl apply -f kubernetes/apps/external-dns/namespace.yaml
      kubectl create secret generic cloudflare-api-token \
        --namespace=external-dns \
        --from-literal=api-token="$CF_TOKEN" \
        --dry-run=client -o yaml | kubectl apply -f -
      helm upgrade --install external-dns external-dns/external-dns \
        -n external-dns \
        -f kubernetes/apps/external-dns/values.yaml \
        --version "$(yq -r '.helm_chart_versions.external_dns' $VARS_FILE)" \
        --wait --timeout 5m

      # DDNS CronJob
      echo "Deploying DDNS..."
      # One-time migration: clean up legacy DDNS resources from default namespace
      kubectl delete cronjob cloudflare-ddns -n default --ignore-not-found
      kubectl delete secret cloudflare-api-token -n default --ignore-not-found
      kubectl create namespace cloudflare-ddns --dry-run=client -o yaml | kubectl apply -f -
      kubectl create secret generic cloudflare-api-token \
        --namespace=cloudflare-ddns \
        --from-literal=api-token="$CF_TOKEN" \
        --dry-run=client -o yaml | kubectl apply -f -
      kubectl apply -f kubernetes/apps/cloudflare-ddns/cronjob.yaml

      # External services (backend endpoints for non-cluster services)
      echo "Deploying external service endpoints..."
      kubectl apply -f kubernetes/apps/ingress-routes/services.yaml

      # Base IngressRoutes and middleware
      echo "Deploying IngressRoutes..."
      kubectl apply -f kubernetes/apps/ingress-routes/middleware.yaml
      kubectl apply -f kubernetes/apps/ingress-routes/router.yaml
      kubectl apply -f kubernetes/apps/traefik/traefik-internal-service.yaml 2>/dev/null || true

      echo "K3s platform deployment complete"
  environment:
    name: production/k3s-platform
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - kubernetes/bootstrap/**
        - kubernetes/apps/traefik/**
        - kubernetes/apps/cert-manager/**
        - kubernetes/apps/external-dns/**
        - kubernetes/apps/cloudflare-ddns/**
        - kubernetes/apps/ingress-routes/middleware.yaml
        - kubernetes/apps/ingress-routes/router.yaml
        - kubernetes/apps/ingress-routes/services.yaml
        - ansible/inventories/prod/group_vars/all.yml

# ------------------------------------------------------------------------------
# K3s CoreDNS (HA configuration)
# ------------------------------------------------------------------------------

deploy-k3s-coredns:
  stage: deploy
  extends: .k3s-deploy-base
  needs:
    - job: validation-gate
    - job: deploy-k3s-platform
      optional: true
  script:
    - kubectl apply -f kubernetes/apps/coredns/helmchartconfig.yaml
    - |
      # Wait for HelmChartConfig reconciliation and verify ready replicas
      echo "Waiting for CoreDNS to reach 2 ready replicas..."
      for i in $(seq 1 24); do
        READY=$(kubectl get deployment/coredns -n kube-system -o jsonpath='{.status.readyReplicas}' 2>/dev/null)
        READY=${READY:-0}
        if [ "$READY" -ge 2 ]; then
          echo "CoreDNS has $READY ready replicas after $((i * 5))s"
          break
        fi
        echo "CoreDNS readyReplicas: $READY/2 (attempt $i)..."
        sleep 5
      done
      FINAL=$(kubectl get deployment/coredns -n kube-system -o jsonpath='{.status.readyReplicas}' 2>/dev/null)
      FINAL=${FINAL:-0}
      if [ "$FINAL" -lt 2 ]; then
        echo "ERROR: CoreDNS only has $FINAL/2 ready replicas after 120s"
        exit 1
      fi
      echo "CoreDNS HelmChartConfig applied ($FINAL replicas ready with topology spread)"
  environment:
    name: production/k3s-coredns
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - kubernetes/apps/coredns/**

# ------------------------------------------------------------------------------
# K3s Applications
# ------------------------------------------------------------------------------

deploy-k3s-authentik:
  stage: deploy
  extends: .k3s-deploy-base
  needs:
    - job: validation-gate
    - job: deploy-k3s-platform
      optional: true
  script:
    - |
      cd kubernetes/apps/authentik
      helm repo add authentik https://charts.goauthentik.io
      helm repo update

      VARS_FILE="../../../ansible/inventories/prod/group_vars/all.yml"
      AUTHENTIK_VERSION=$(yq -r '.authentik_version' $VARS_FILE)
      POSTGRESQL_VERSION=$(yq -r '.postgresql_version' $VARS_FILE)

      echo "Deploying Authentik ${AUTHENTIK_VERSION} (PostgreSQL ${POSTGRESQL_VERSION})..."

      # Deploy namespace and storage first
      kubectl apply -f namespace.yaml
      kubectl apply -f storage.yaml

      # Get secrets from 1Password
      AUTHENTIK_SECRET_KEY=$(op read "op://Homelab/Authentik Secrets/secret-key")
      AUTHENTIK_PG_PASS=$(op read "op://Homelab/Authentik Secrets/postgresql-password")
      AUTHENTIK_PG_ADMIN_PASS=$(op read "op://Homelab/Authentik Secrets/postgresql-admin-password")
      SMTP_USER=$(op read "op://Homelab/SMTP Relay Auth/username")
      SMTP_PASS=$(op read "op://Homelab/SMTP Relay Auth/password")

      # Create/update authentik-secrets (required by values.yaml secretKeyRef)
      kubectl create secret generic authentik-secrets \
        --namespace=authentik \
        --from-literal=secret-key="$AUTHENTIK_SECRET_KEY" \
        --from-literal=postgresql-password="$AUTHENTIK_PG_PASS" \
        --from-literal=postgresql-admin-password="$AUTHENTIK_PG_ADMIN_PASS" \
        --from-literal=smtp-username="$SMTP_USER" \
        --from-literal=smtp-password="$SMTP_PASS" \
        --dry-run=client -o yaml | kubectl apply -f -

      # Deploy Helm chart with version pinning
      helm upgrade --install authentik authentik/authentik \
        -n authentik \
        -f values.yaml \
        --version "$AUTHENTIK_VERSION" \
        --set authentik.secret_key="$AUTHENTIK_SECRET_KEY" \
        --set authentik.postgresql.password="$AUTHENTIK_PG_PASS" \
        --set server.image.tag="$AUTHENTIK_VERSION" \
        --set worker.image.tag="$AUTHENTIK_VERSION" \
        --set postgresql.image.tag="$POSTGRESQL_VERSION" \
        --wait --timeout 10m

      # Deploy middleware, certificate, and ingress routes
      kubectl apply -f middleware.yaml
      kubectl apply -f certificate.yaml
      kubectl apply -f ingress-route.yaml

      echo "Authentik deployment complete"
  environment:
    name: production/k3s-authentik
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - kubernetes/apps/authentik/**
        - ansible/inventories/prod/group_vars/all.yml

deploy-downloads:
  stage: deploy
  extends: .k3s-deploy-base
  needs:
    - job: validation-gate
    - job: deploy-k3s-platform
      optional: true
  script:
    - |
      cd kubernetes/apps/download-clients
      VARS_FILE="../../../ansible/inventories/prod/group_vars/all.yml"

      # Export versions for envsubst
      export GLUETUN_VERSION=$(yq -r '.gluetun_version' $VARS_FILE)
      export NZBGET_VERSION=$(yq -r '.nzbget_version' $VARS_FILE)
      export QBITTORRENT_VERSION=$(yq -r '.qbittorrent_version' $VARS_FILE)
      export PROWLARR_VERSION=$(yq -r '.prowlarr_version' $VARS_FILE)
      export SONARR_VERSION=$(yq -r '.sonarr_version' $VARS_FILE)
      export RADARR_VERSION=$(yq -r '.radarr_version' $VARS_FILE)
      export LIDARR_VERSION=$(yq -r '.lidarr_version' $VARS_FILE)
      export PULSARR_VERSION=$(yq -r '.pulsarr_version' $VARS_FILE)

      # Fail fast if any version variable is empty (prevents deploying with blank image tags)
      test -n "$GLUETUN_VERSION" || { echo "ERROR: GLUETUN_VERSION is empty"; exit 1; }
      test -n "$NZBGET_VERSION" || { echo "ERROR: NZBGET_VERSION is empty"; exit 1; }
      test -n "$QBITTORRENT_VERSION" || { echo "ERROR: QBITTORRENT_VERSION is empty"; exit 1; }
      test -n "$PROWLARR_VERSION" || { echo "ERROR: PROWLARR_VERSION is empty"; exit 1; }
      test -n "$SONARR_VERSION" || { echo "ERROR: SONARR_VERSION is empty"; exit 1; }
      test -n "$RADARR_VERSION" || { echo "ERROR: RADARR_VERSION is empty"; exit 1; }
      test -n "$LIDARR_VERSION" || { echo "ERROR: LIDARR_VERSION is empty"; exit 1; }
      test -n "$PULSARR_VERSION" || { echo "ERROR: PULSARR_VERSION is empty"; exit 1; }

      echo "Deploying downloads stack..."
      echo "Versions: Gluetun=$GLUETUN_VERSION, NZBGet=$NZBGET_VERSION, qBittorrent=$QBITTORRENT_VERSION"
      echo "          Prowlarr=$PROWLARR_VERSION, Sonarr=$SONARR_VERSION, Radarr=$RADARR_VERSION"
      echo "          Lidarr=$LIDARR_VERSION, Pulsarr=$PULSARR_VERSION"

      kubectl apply -f namespace.yaml

      # Create VPN secret
      VPN_USER=$(op read "op://Homelab/PrivadoVPN Credentials/openvpn-user")
      VPN_PASS=$(op read "op://Homelab/PrivadoVPN Credentials/openvpn-password")
      kubectl create secret generic vpn-credentials \
        --namespace=downloads \
        --from-literal=openvpn-user="$VPN_USER" \
        --from-literal=openvpn-password="$VPN_PASS" \
        --dry-run=client -o yaml | kubectl apply -f -

      # Apply manifests with restricted envsubst (only substitute known version variables)
      # Note: gluetun is a sidecar defined in nzbget.yaml and qbittorrent.yaml
      ENVSUBST_VARS='$GLUETUN_VERSION $NZBGET_VERSION $QBITTORRENT_VERSION $PROWLARR_VERSION $SONARR_VERSION $RADARR_VERSION $LIDARR_VERSION $PULSARR_VERSION'
      for manifest in storage.yaml vpn-common.yaml nzbget.yaml qbittorrent.yaml prowlarr.yaml sonarr.yaml radarr.yaml lidarr.yaml pulsarr.yaml certificate.yaml ingress-routes.yaml ingress-routes-ha-bypass.yaml; do
        if [ -f "$manifest" ]; then
          envsubst "$ENVSUBST_VARS" < "$manifest" | kubectl apply -f -
        fi
      done

      echo "Downloads stack deployment complete"
  environment:
    name: production/k3s-downloads
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - kubernetes/apps/download-clients/**
        - ansible/inventories/prod/group_vars/all.yml

deploy-recipes:
  stage: deploy
  extends: .k3s-deploy-base
  needs:
    - job: validation-gate
    - job: deploy-k3s-platform
      optional: true
  script:
    - |
      cd kubernetes/apps/recipes
      VARS_FILE="../../../ansible/inventories/prod/group_vars/all.yml"

      # Export versions for envsubst
      export MEALIE_VERSION=$(yq -r '.mealie_version' $VARS_FILE)
      export MEALIE_POSTGRESQL_VERSION=$(yq -r '.mealie_postgresql_version' $VARS_FILE)
      export BAR_ASSISTANT_VERSION=$(yq -r '.bar_assistant_version' $VARS_FILE)
      export SALT_RIM_VERSION=$(yq -r '.salt_rim_version' $VARS_FILE)

      # Fail fast if any version variable is empty (prevents deploying with blank image tags)
      test -n "$MEALIE_VERSION" || { echo "ERROR: MEALIE_VERSION is empty"; exit 1; }
      test -n "$MEALIE_POSTGRESQL_VERSION" || { echo "ERROR: MEALIE_POSTGRESQL_VERSION is empty"; exit 1; }
      test -n "$BAR_ASSISTANT_VERSION" || { echo "ERROR: BAR_ASSISTANT_VERSION is empty"; exit 1; }
      test -n "$SALT_RIM_VERSION" || { echo "ERROR: SALT_RIM_VERSION is empty"; exit 1; }

      echo "Deploying recipes stack..."
      echo "Versions: Mealie=$MEALIE_VERSION (PG=$MEALIE_POSTGRESQL_VERSION), Bar Assistant=$BAR_ASSISTANT_VERSION, Salt Rim=$SALT_RIM_VERSION"

      kubectl apply -f namespace.yaml
      kubectl apply -f storage.yaml

      # Create secrets (must include all keys referenced by manifests)
      MEALIE_PG_PASS=$(op read "op://Homelab/Mealie Secrets/postgres-password")
      MEALIE_OIDC_ID=$(op read "op://Homelab/Mealie SSO/oidc-client-id")
      MEALIE_OIDC_SECRET=$(op read "op://Homelab/Mealie SSO/oidc-client-secret")
      OPENAI_KEY=$(op read "op://Homelab/OpenAI API Key/api-key" 2>/dev/null || echo "")
      SMTP_USER=$(op read "op://Homelab/SMTP Relay Auth/username")
      SMTP_PASS=$(op read "op://Homelab/SMTP Relay Auth/password")
      BAR_MEILI_KEY=$(op read "op://Homelab/Bar Assistant Secrets/meilisearch-master-key")
      BAR_OIDC_ID=$(op read "op://Homelab/Bar Assistant SSO/authentik-client-id")
      BAR_OIDC_SECRET=$(op read "op://Homelab/Bar Assistant SSO/authentik-client-secret")

      kubectl create secret generic mealie-secrets \
        --namespace=recipes \
        --from-literal=postgres-password="$MEALIE_PG_PASS" \
        --from-literal=smtp-username="$SMTP_USER" \
        --from-literal=smtp-password="$SMTP_PASS" \
        --from-literal=oidc-client-id="$MEALIE_OIDC_ID" \
        --from-literal=oidc-client-secret="$MEALIE_OIDC_SECRET" \
        --from-literal=openai-api-key="$OPENAI_KEY" \
        --dry-run=client -o yaml | kubectl apply -f -

      kubectl create secret generic bar-assistant-secrets \
        --namespace=recipes \
        --from-literal=meilisearch-master-key="$BAR_MEILI_KEY" \
        --from-literal=smtp-username="$SMTP_USER" \
        --from-literal=smtp-password="$SMTP_PASS" \
        --from-literal=authentik-client-id="$BAR_OIDC_ID" \
        --from-literal=authentik-client-secret="$BAR_OIDC_SECRET" \
        --dry-run=client -o yaml | kubectl apply -f -

      # Apply manifests with restricted envsubst (only substitute known version variables)
      # Note: mealie-postgres is defined in mealie.yaml
      ENVSUBST_VARS='$MEALIE_VERSION $MEALIE_POSTGRESQL_VERSION $BAR_ASSISTANT_VERSION $SALT_RIM_VERSION'
      for manifest in mealie.yaml bar-assistant.yaml certificate.yaml ingress-routes.yaml; do
        if [ -f "$manifest" ]; then
          envsubst "$ENVSUBST_VARS" < "$manifest" | kubectl apply -f -
        fi
      done

      echo "Recipes stack deployment complete"
  environment:
    name: production/k3s-recipes
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - kubernetes/apps/recipes/**
        - ansible/inventories/prod/group_vars/all.yml

