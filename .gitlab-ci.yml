    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/requirements.yml
        - ansible/playbooks/home-assistant.yml
        - ansible/inventories/prod/host_vars/home.yml
        # The VM definition for this play's host.
        - ansible/inventories/prod/hosts.yml

deploy-gitlab-verify:
  # verify stage, no `needs:`, `when: always` — a `needs:` on deploy-gitlab would
  # skip this job whenever that deploy failed, i.e. when it matters most.
  stage: verify
  when: always
  # curl and netcat only: no Ansible, SSH key, kubeconfig or 1Password, so it
  # does not extend the heavy .deploy-base. Infrastructure runner pods egress
  # unrestricted and SNAT to a node IP, which sg-gitlab admits on :22 and :2222.
  image: python:3.13-slim
  interruptible: false
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates netcat-openbsd
  script:
    - |
      set -eo pipefail
      # GITLAB_IP for the two SSH probes comes from the generated host roster,
      # the same file .deploy-base sources; `set -a` exports it to the script.
      set -a; . ./scripts/hosts.env; set +a
      [ -n "${GITLAB_IP:-}" ] || { echo "ERROR: scripts/hosts.env exported no GITLAB_IP" >&2; exit 1; }
      bash scripts/verify-gitlab.sh
  environment:
    name: production/gitlab-verify
  rules:
    # deploy-gitlab's rules verbatim, so this job exists if and only if that
    # deploy does.
    - !reference [deploy-gitlab, rules]
  # No allow_failure, matching deploy-verify: a deploy that leaves GitLab down
  # must not report as a yellow warning on a green pipeline.

# Post-Deploy Verification

deploy-verify:
  # verify stage, no `needs:`, `when: always` — it must run even when a deploy
  # job failed, and on a gate-blocked pipeline it verifies a deploy that was
  # never attempted. Read-only, so that is harmless (docs/13 § Verify Stage).
  stage: verify
  when: always
  extends: .k3s-deploy-base
  script:
    # The pin below, flux_version in the versions ConfigMap and the committed
    # gotk-components.yaml header are one version in three places.
    - python3 scripts/check-flux-version-pin.py
    - |
      set -eo pipefail
      # flux CLI alongside the kubectl .k3s-deploy-base installs: verification
      # queries Flux CRs. Version and sha256 are one pin, so bump both.
      FLUX_VERSION="2.9.0"
      dl=$(mktemp -d)
      curl -fsSL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz" -o "$dl/flux.tar.gz"
      echo "7aa9779fc7ec6d030e609dab7dbed8c6fc9e3a7f4670834ad02369268aaf341f  $dl/flux.tar.gz" | sha256sum -c -
      tar xzf "$dl/flux.tar.gz" -C /usr/local/bin flux
      rm -rf "$dl"
      flux --version
    - bash scripts/deploy-verify.sh
  rules:
    # Each deploy-* job's rules verbatim, so this job exists if and only if at
    # least one deploy-* job does. First match wins, and each block's leading
    # schedule/web `when: never` applies here too.
    - !reference [deploy-terraform, rules]
    - !reference [deploy-ansible-base, rules]
    - !reference [deploy-ansible-proxmox, rules]
    - !reference [deploy-ansible-firewall, rules]
    - !reference [deploy-ansible-dns, rules]
    - !reference [deploy-ansible-storage, rules]
    - !reference [deploy-ansible-mail, rules]
    - !reference [deploy-ansible-certs, rules]
    - !reference [deploy-plex, rules]
    - !reference [deploy-gitlab, rules]
    - !reference [deploy-nextcloud, rules]
    - !reference [deploy-immich, rules]
    - !reference [deploy-immich-ml, rules]
    - !reference [deploy-home-assistant-config, rules]
    # A kubernetes/-only change matches none of the deploy-* rules above, so the
    # live Flux reconcile below would never run for the most common GitOps
    # change. schedule/web stay excluded by the guards in the blocks above.
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - kubernetes/**/*
  # No allow_failure: the script fails if nodes are not Ready, a Flux resource
  # is not Ready or times out, a server-side dry-run rejects a manifest, or
  # GitLab is unreachable.

# Host-side half of post-deploy verification, which deploy-verify above does not
# cover: postflight.yml's read-only probes (SSH reachability, root filesystem
# headroom, service state, pool and mount health) across the managed fleet.
deploy-verify-hosts:
  stage: verify
  # Same contract as deploy-verify: no `needs:` and `when: always`, so it runs
  # even when a deploy job failed. postflight_exercise_sync=false keeps every
  # probe read-only: the sandbox exercise pushes dns-01's config to dns-02.
  when: always
  extends: .deploy-base
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/postflight.yml -e postflight_exercise_sync=false
  environment:
    name: production/verify-hosts
  # deploy-verify's rules verbatim, so the two halves of verification exist for
  # the same pipelines. Those entries carry their own schedule/web guards.
  rules:
    - !reference [deploy-verify, rules]
  # No allow_failure: a deploy that leaves a host unreachable or a pool degraded
  # must not report as a warning on a green pipeline.

# MAINTENANCE STAGE - manual approval required. One shared resource_group, so
# only one maintenance job runs at a time. That group is disjoint from the deploy
# jobs', so do not play one while a deploy pipeline is in flight (docs/12).

# 1. OS package updates - MANUAL (all hosts, auto-reboot in CI). Interactive
# equivalent: task maintenance:update-packages.
maintenance-update-packages:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  script:
    - cd ansible
    - bash ../scripts/maintenance-run-with-verify.sh
        op run -- ansible-playbook -i inventories/prod playbooks/maintenance/update-packages.yml -e auto_reboot=true -e self_reboot_delay=5400
  environment:
    name: production/maintenance-packages
    action: prepare
  rules:
    - !reference [.maintenance-manual-rules, rules]

# 2. Application updates - MANUAL (AdGuard, Tailscale, Plex)
maintenance-update-applications:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  # Must stay equal to the `&base_app_env` anchor on `task
  # maintenance:update-applications`: same playbook, and an op:// ref present on
  # only one path takes a different branch of the LXC authorized_keys guard.
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    ADGUARD_ADMIN_PASSWORD: "op://Homelab/AdGuard Home/password"
    TAILSCALE_AUTH_KEY: "op://Homelab/Tailscale Auth Key/credential"
    DNS01_SSH_PRIVATE_KEY: "op://Homelab/DNS-01 SSH Key/private key"
    DNS01_SSH_PUBLIC_KEY: "op://Homelab/DNS-01 SSH Key/public key"
    # Required: the plex role fail-louds without it (cert-reload script).
    PLEX_PFX_PASSPHRASE: "op://Homelab/Plex Custom Certificate/password"
  script:
    - cd ansible
    - bash ../scripts/maintenance-run-with-verify.sh
        op run -- ansible-playbook -i inventories/prod playbooks/maintenance/update-applications.yml
  environment:
    name: production/maintenance-applications
    action: prepare
  rules:
    - !reference [.maintenance-manual-rules, rules]

# 3. K3s node updates - MANUAL (cordon/upgrade/restart; no drain, kernel reboots
# go through kured)
maintenance-update-k3s-nodes:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  variables:
    K3S_TOKEN: "op://Homelab/K3s Cluster Token/credential"
    # Lower-privilege agent token (ANS-D-2). Without it, group_vars/k3s.yml
    # falls back to the cluster token and node upgrades would rewrite the
    # agents' env files with the full token. See docs/19 "Agent token".
    K3S_AGENT_TOKEN: "op://Homelab/K3s Agent Token/credential"
  script:
    - cd ansible
    - bash ../scripts/maintenance-run-with-verify.sh
        op run -- ansible-playbook -i inventories/prod playbooks/maintenance/update-k3s-nodes.yml
  environment:
    name: production/k3s-nodes
    action: prepare
  rules:
    - !reference [.maintenance-manual-rules, rules]

# 4. K3s VM provisioning - MANUAL (creates/modifies VMs)
maintenance-k3s-provision:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  variables:
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    K3S_TOKEN: "op://Homelab/K3s Cluster Token/credential"
    # Lower-privilege agent token (ANS-D-2). Servers advertise it (agent-token)
    # and agents join with it instead of the cluster token. See docs/19
    # "Agent token".
    K3S_AGENT_TOKEN: "op://Homelab/K3s Agent Token/credential"
  script:
    - cd ansible
    # Two playbooks chained inside `bash -c` so the wrapper sees one command
    # unit; its `set -e` skips the second if the first fails.
    - bash ../scripts/maintenance-run-with-verify.sh bash -c
        'set -e;
         op run -- ansible-playbook -i inventories/prod playbooks/k3s-provision-vms.yml;
         op run -- ansible-playbook -i inventories/prod playbooks/k3s.yml'
  environment:
    name: production/k3s-provision
    action: prepare
  rules:
    - !reference [.maintenance-manual-rules, rules]

# 5. Proxmox HA - MANUAL (affects VM placement)
maintenance-proxmox-ha:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  script:
    - cd ansible
    - bash ../scripts/maintenance-run-with-verify.sh
        op run -- ansible-playbook -i inventories/prod playbooks/proxmox-ha.yml
  environment:
    name: production/proxmox-ha
    action: prepare
  rules:
    - !reference [.maintenance-manual-rules, rules]

# 6. Home Assistant restart - MANUAL (restarts HA VM)
maintenance-home-assistant-restart:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  script:
    # The sub-script handles ha-manager + the readiness loop; the wrapper
    # guarantees verify runs after.
    - bash scripts/maintenance-run-with-verify.sh bash scripts/maintenance-ha-restart.sh
  environment:
    name: production/home-assistant-restart
    action: prepare
  rules:
    - !reference [.maintenance-manual-rules, rules]

# Single-button "run all 6 ops in sequence": scripts/maintenance-all-ops.sh,
# wrapped so the post-maintenance verify always runs at the end.
maintenance-run-all:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  variables:
    # Union of secrets needed by the six ops invoked below.
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    ADGUARD_ADMIN_PASSWORD: "op://Homelab/AdGuard Home/password"
    TAILSCALE_AUTH_KEY: "op://Homelab/Tailscale Auth Key/credential"
    K3S_TOKEN: "op://Homelab/K3s Cluster Token/credential"
    # Lower-privilege agent token (ANS-D-2) — required by the k3s node-update
    # and provision ops below, or they'd fall back to the cluster token.
    K3S_AGENT_TOKEN: "op://Homelab/K3s Agent Token/credential"
    # Required: update-applications runs the plex role, which fail-louds without
    # it (cert-reload script).
    PLEX_PFX_PASSPHRASE: "op://Homelab/Plex Custom Certificate/password"
    DNS01_SSH_PRIVATE_KEY: "op://Homelab/DNS-01 SSH Key/private key"
    DNS01_SSH_PUBLIC_KEY: "op://Homelab/DNS-01 SSH Key/public key"
  script:
    - bash scripts/maintenance-run-with-verify.sh bash scripts/maintenance-all-ops.sh
  environment:
    name: production/maintenance-run-all
    action: prepare
  rules:
    - !reference [.maintenance-manual-rules, rules]

# 7. Ad-hoc "check cluster health right now" button. Every maintenance op
# already runs this script as its own last step; this just runs it again
# without triggering an op.
maintenance-verify:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  script:
    - bash scripts/post-maintenance-verify.sh
  rules:
    - !reference [.maintenance-manual-rules, rules]

# Deliberate fork of weisssrv-lib's ci/maintenance/version-bump-bot.yml, and the
# only library job this repo defines locally: the library job takes no
# variables / before_script / rules inputs (docs/13 § Version bump bot).
version-bump-bot:
  # Consumes no artifacts (every input comes from the repo + 1Password at
  # runtime), so it starts immediately instead of waiting out earlier stages.
  needs: []
  stage: maintenance
  # Full image, NOT python:3.13-slim: the bot commits and force-pushes a branch,
  # and the slim images ship no git.
  image: python:3.13
  # Force-pushes a branch and mutates one MR, so it must neither race itself nor
  # be cancelled mid-push. Its own group, never infrastructure-maintenance: it
  # touches no host and must not queue behind a long maintenance op.
  resource_group: version-bump-bot
  interruptible: false
  # Infra-class retries only — a genuinely broken check must fail loudly rather
  # than re-run the whole upstream sweep three times.
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  variables:
    # Full clone: pushing a branch built on a shallow checkout is rejected as a
    # "shallow update".
    GIT_DEPTH: "0"
    # A PAT with `api` + `write_repository`, masked (the value lands in the push
    # URL). CI_JOB_TOKEN cannot push and is read-only on the Merge requests API.
    # Item of record and rotation: docs/15-credential-rotation.md.
    BOT_TOKEN: "$VERSION_BUMP_BOT_TOKEN"
    # The only two files the bot may commit. A scoped pathspec (vs the template's
    # default ".") keeps an unrelated tracked change out of the bot's commit.
    PINS_FILE: ansible/inventories/prod/group_vars/all.yml
    VERSIONS_CONFIGMAP: kubernetes/infrastructure/sources/versions-configmap.yaml
    # The captured report is embedded verbatim in the MR description — keep
    # go-task's ANSI escapes out of it. (check-versions.py already self-disables
    # colour on a non-tty.)
    NO_COLOR: "1"
    # Exit codes from `task maintenance:update-all-versions` that mean the
    # checker ran: 1 updates available, 2 some upstream errored. Mirrors the
    # library job's check_soft_fail_exit_codes input.
    CHECK_SOFT_FAIL_EXIT_CODES: "1 2"
  before_script:
    # 1Password CLI: `task maintenance:update-all-versions` runs its checker
    # under `op run --` to inject GITHUB_TOKEN (GitHub API rate-limit headroom).
    - !reference [.install-1password, before_script]
    - pip install --no-cache-dir --quiet "PyYAML==${PYYAML_VERSION}"
    - |
      set -eo pipefail
      # go-task, pinned + sha256 (same pair as check-repo-policies — keep them in
      # step). The bot drives the Taskfile, not the scripts, so the unattended
      # path and the operator path cannot drift.
      TASK_VERSION="v3.52.0"
      TASK_SHA256="02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd"
      dl=$(mktemp -d)
      curl -fsSL "https://github.com/go-task/task/releases/download/${TASK_VERSION}/task_linux_amd64.tar.gz" -o "$dl/task.tar.gz"
      echo "${TASK_SHA256}  $dl/task.tar.gz" | sha256sum -c -
      tar xzf "$dl/task.tar.gz" -C /usr/local/bin task
      rm -rf "$dl"
      task --version
  script:
    # STEP 1 — rewrite the pins in place. The tri-state handling below ships the
    # bumps that resolved but re-raises an error that produced none, because
    # STEP 2 would close a live bot MR (docs/13 § Version bump bot).
    - |
      # pipefail explicitly: `tee` always exits 0, so without it every rc below
      # reads as success and the "no bumps" branch closes a live MR.
      set -o pipefail
      rc=0
      task maintenance:update-all-versions 2>&1 | tee version-bump-report.txt || rc=$?
      # Only a status the checker itself defines is soft; a shell or runner code
      # (126/127/137) fails here instead of reading as a bump.
      case " $CHECK_SOFT_FAIL_EXIT_CODES " in
        *" $rc "*) ;;
        *) [ "$rc" -eq 0 ] || { echo "ERROR: version check exited ${rc}, which is not one of CHECK_SOFT_FAIL_EXIT_CODES (${CHECK_SOFT_FAIL_EXIT_CODES})." >&2; exit "$rc"; } ;;
      esac
      if [ "$rc" -ne 0 ]; then
        task flux:sync-versions
        if git diff --quiet -- "$PINS_FILE"; then
          echo "ERROR: version check exited ${rc} and wrote no bumps — refusing to treat that as 'all up to date'." >&2
          exit "$rc"
        fi
        echo "WARNING: version check exited ${rc}; shipping the pins that did resolve (see the report block in the MR)."
      fi
    # STEP 2 — create / refresh / close the single bot MR. Never merges, and
    # commits only the tracked pin pair.
    - |
      python3 scripts/version-bump-mr.py \
        --branch "bot/version-bumps" \
        --target-branch "main" \
        --title "chore(deps): version bumps" \
        --commit-message "chore(deps): update pinned versions" \
        --paths "$PINS_FILE $VERSIONS_CONFIGMAP" \
        --report-path version-bump-report.txt
  artifacts:
    # The MR description embeds the first 4000 chars and points at this artifact
    # for the rest, so it must outlive a weekly MR that sits unreviewed.
    paths:
      - version-bump-report.txt
    expire_in: 30 days
    when: always
  rules:
    # Its own schedule (SCHEDULE_TYPE=version-bump): an unattended MR-opening bot
    # must not fire on the version-check schedule. main-only, because the
    # registry's check_command entries are shell this job runs beside the PAT.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "version-bump" && $OP_SERVICE_ACCOUNT_TOKEN && $CI_COMMIT_BRANCH == "main"'
    # Manual button on a web pipeline — the documented "run it by hand" path.
    # allow_failure: rules-based `when: manual` defaults to allow_failure: false,
    # which would leave every web pipeline "blocked" until this job is played.
    - if: '$CI_PIPELINE_SOURCE == "web" && $OP_SERVICE_ACCOUNT_TOKEN && $CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
