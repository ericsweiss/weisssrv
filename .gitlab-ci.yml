python-tests:
  # Runs pytest against scripts/. test_*.py live next to the scripts they
  # exercise (version-update tooling, the ConfigMap generator, the HPA/VPA
  # invariant guard).
  stage: test
  needs: []  # run in parallel with lint stage
  image: python:3.11-slim
  before_script:
    # git is required by test_check_deploy_coverage.py (it builds throwaway git
    # repos to exercise check-deploy-coverage.sh); the slim image omits it.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git jq
    - pip install --quiet "pytest==${PYTEST_VERSION}" "pyyaml==${PYYAML_VERSION}"
  script:
    - pytest scripts/ -v --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # The pytest suite validates real tree files beyond scripts/: test_adguard_api_body.py
    # asserts on ansible/roles/adguard_home/tasks/api_base_config.yml, and
    # test_check_molecule_matrix_coverage.py smoke-tests the live .gitlab-ci.yml matrix +
    # molecule/integration dirs. Those paths must be in `changes:` or an MR that edits
    # only them would skip the tests that guard them.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-python-tests, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-python-tests, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'

flux-lint:
  needs: []
  # Renders every top-level Flux Kustomization, substitutes postBuild vars
  # from kubernetes/infrastructure/sources/versions-configmap.yaml, verifies
  # zero unsubstituted ${var} placeholders remain, then validates with
  # kubeconform. Also schema-validates the value-heavy HelmReleases'
  # .spec.values via `helm template` (kustomize build emits HelmReleases
  # verbatim, so a chart values-key typo would otherwise be unchecked).
  stage: lint
  image: python:3.11-slim
  # Cache the pinned lint binaries across runs, keyed on .gitlab-ci.yml (where
  # the versions + sha256s live), so a bump busts the cache. No-op without a
  # runner cache backend. The versions-extraction is shared with deploy-verify
  # via scripts/flux-render.sh; the binaries are the download-heavy part.
  cache:
    key:
      prefix: flux-lint
      files:
        - .gitlab-ci.yml
    paths:
      - .cache/flux-lint-tools
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl gettext-base
    - pip install --quiet "pyyaml==${PYYAML_VERSION}"
    - |
      # The cache holds VERIFIED TARBALLS, not extracted binaries: every run —
      # cache hit or miss — re-checks each tarball against its pinned sha256
      # and re-extracts, so a tampered/mutated runner cache can never smuggle
      # an unverified binary onto PATH. Download only on miss/corruption.
      # before_script and script share one shell, so the export persists.
      TOOLS_CACHE="${CI_PROJECT_DIR}/.cache/flux-lint-tools"
      TOOLS_BIN=/usr/local/bin
      mkdir -p "$TOOLS_CACHE"
      fetch_verified() { # <file> <url> <sha256>
        if ! echo "$3  $TOOLS_CACHE/$1" | sha256sum -c - >/dev/null 2>&1; then
          curl -fsSL -o "$TOOLS_CACHE/$1" "$2"
          echo "$3  $TOOLS_CACHE/$1" | sha256sum -c -
        fi
      }
      fetch_verified kubeconform.tar.gz \
        https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
        95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
      tar xzf "$TOOLS_CACHE/kubeconform.tar.gz" -C "$TOOLS_BIN" kubeconform
      fetch_verified kustomize.tar.gz \
        "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
        "${KUSTOMIZE_SHA256}"
      tar xzf "$TOOLS_CACHE/kustomize.tar.gz" -C "$TOOLS_BIN" kustomize
      # helm: schema-validates HelmRelease .spec.values (scripts/validate-helm-values.py).
      # Tarball unpacks to linux-amd64/helm (unlike kubeconform/kustomize bare binaries).
      fetch_verified helm.tar.gz https://get.helm.sh/helm-v3.18.4-linux-amd64.tar.gz \
        f8180838c23d7c7d797b208861fecb591d9ce1690d8704ed1e4cb8e2add966c1
      tar xzf "$TOOLS_CACHE/helm.tar.gz" -C "$TOOLS_BIN" --strip-components=1 linux-amd64/helm
      kubeconform -v && kustomize version && helm version --short && envsubst --version | head -1
  script:
    - |
      set -eo pipefail
      FAILED=0
      # Extract cluster-versions ConfigMap keys and export as env so envsubst
      # can substitute ${var} placeholders in rendered manifests. This mirrors
      # what Flux's kustomize-controller does at reconcile time (postBuild).
      # Shared with Taskfile flux:lint via scripts/flux-render.sh so the two
      # paths can't drift.
      VERSIONS_CONFIGMAP=kubernetes/infrastructure/sources/versions-configmap.yaml
      VARS=$(bash scripts/flux-render.sh export-versions "$VERSIONS_CONFIGMAP") \
        || { echo "ERROR: failed to extract version keys from $VERSIONS_CONFIGMAP"; exit 1; }
      eval "$VARS"

      # Accumulate the full rendered corpus so the HPA/VPA invariant check
      # (below) sees standalone HPAs + VPAs across every namespace at once.
      # Mirrors the Taskfile flux:lint RENDER_ALL pattern.
      RENDER_ALL=$(mktemp)
      trap 'rm -f "$RENDER_ALL"' EXIT

      # kubeconform schema version derived from k3s_version (shared helper) so
      # local lint + CI validate against the same MAJOR.MINOR.0 API schemas.
      K8S_VER=$(bash scripts/flux-render.sh k8s-version "$VERSIONS_CONFIGMAP")
      echo "kubeconform -kubernetes-version: $K8S_VER (from versions-configmap k3s_version)"
      # Iterate every Flux Kustomization under clusters/weisssrv/ and validate
      # the target path it points at. This picks up new top-level Kustomizations
      # automatically without CI edits.
      for ks in kubernetes/clusters/weisssrv/*.yaml; do
        [ -f "$ks" ] || continue
        NAME=$(basename "$ks" .yaml)
        [ "$NAME" = "kustomization" ] && continue
        if ! SRCPATH=$(python3 -c "
      import yaml, sys
      with open('$ks') as f:
          doc = yaml.safe_load(f)
      print(doc.get('spec', {}).get('path', '') or '')
      "); then
          echo "ERROR: failed to parse $ks"
          FAILED=1
          continue
        fi
        [ -z "$SRCPATH" ] && continue
        SRCPATH="${SRCPATH#./}"
        echo "=== Building + validating $ks (path $SRCPATH) ==="
        if ! RAW=$(kustomize build "$SRCPATH" 2>&1); then
          echo "ERROR: kustomize build failed for $SRCPATH:"
          echo "$RAW"
          FAILED=1
          continue
        fi
        # Check every ${var} reference in the pre-substitution output against
        # the exported ConfigMap keys. envsubst renders unknown vars as empty
        # string (so post-substitution grep wouldn't catch them) — Flux has
        # the same silent-empty default behavior. Our lint is intentionally
        # stricter so typos in version keys fail CI.
        MISSING=""
        for ref in $(echo "$RAW" | grep -oE '\$\{[A-Za-z_][A-Za-z0-9_]*\}' | sort -u); do
          varname=${ref#\$\{}
          varname=${varname%\}}
          if [ -z "${!varname+x}" ]; then
            MISSING="$MISSING $varname"
          fi
        done
        MISSING=$(echo "$MISSING" | tr ' ' '\n' | grep -v '^$' | sort -u || true)
        if [ -n "$MISSING" ]; then
          echo "ERROR: placeholders in $SRCPATH reference keys not in versions-configmap:"
          echo "$MISSING" | sed 's/^/  - /'
          FAILED=1
          continue
        fi
        # printf '%s\n' (NOT echo): rendered manifests carry Grafana dashboard
        # JSON with thousands of literal \n inside block scalars, and echo would
        # expand those into real newlines and corrupt the YAML stream (same
        # rationale as the deploy-verify dry-run block).
        RENDERED=$(printf '%s\n' "$RAW" | envsubst "$FLUX_ENVSUBST_VARS")
        printf '%s\n---\n' "$RENDERED" >> "$RENDER_ALL"
        # KNOWN GAP: -ignore-missing-schemas silently SKIPS any CR whose schema
        # is absent from (or unreachable in) the datreeio CRDs-catalog. Most CRDs
        # we use (IngressRoute, VPA, ExternalSecret, ServiceMonitor, Certificate)
        # are in the catalog, but a CR for a kind not in the catalog is unchecked.
        # Tracked as a follow-up (vendor CRD JSON schemas + a second strict pass).
        if ! printf '%s\n' "$RENDERED" | kubeconform -strict -ignore-missing-schemas \
            -kubernetes-version "$K8S_VER" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -summary; then
          FAILED=1
        fi
      done

      # [informational] Track which rendered kinds kubeconform could NOT schema-
      # validate because -ignore-missing-schemas skipped them (no schema in the
      # datreeio catalog). Every kind in use today IS covered, but nothing else
      # signals when a NEW CRD-backed kind starts slipping through unvalidated.
      # scripts/kubeconform-skipped.py lists any skipped kinds over the whole
      # corpus so that shows up at review time. Never fails the gate (|| true) —
      # the per-Kustomization passes above are the gate.
      echo "=== kubeconform unvalidated-kind tracking (informational) ==="
      # -verbose is load-bearing: without it kubeconform's JSON omits
      # valid/skipped resources entirely and the tracker always reports
      # "no skips".
      kubeconform -verbose -ignore-missing-schemas -kubernetes-version "$K8S_VER" \
        -schema-location default \
        -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
        -output json < "$RENDER_ALL" 2>/dev/null | python3 scripts/kubeconform-skipped.py || true

      # HPA/VPA invariant: no workload may have both an HPA and a VPA driving
      # the same resource (docs/33-autoscaling.md). --require-chart-native-vpas
      # also statically asserts the chart-native-HPA workloads
      # (Traefik/authentik/Connect) each have a memory-only VPA in the rendered
      # corpus. MUST match the Taskfile flux:lint invocation — without the flag
      # the gate would silently skip the chart-native assertion.
      echo "=== Checking HPA/VPA invariant ==="
      if ! python3 scripts/check-hpa-vpa-invariant.py --require-chart-native-vpas < "$RENDER_ALL"; then
        FAILED=1
      fi

      # Also build the cluster root to catch malformed top-level kustomization.yaml
      # (the loop above validates target paths, not the cluster root itself).
      echo "=== Building cluster root kubernetes/clusters/weisssrv/ ==="
      if ! kustomize build kubernetes/clusters/weisssrv >/dev/null; then
        echo "ERROR: cluster root kustomization failed to build"
        FAILED=1
      fi

      # Schema-validate the value-heavy HelmReleases' .spec.values via
      # `helm template` — kustomize build above emits HelmReleases verbatim, so
      # a typo in a chart values key (.spec.values is a free-form object in the
      # HelmRelease CRD) would otherwise be unchecked. Needs network (helm repo
      # add/update). Covers traefik (values.schema.json catches key typos),
      # kube-prometheus-stack, authentik. MUST match the Taskfile flux:lint call.
      echo "=== Schema-validating HelmRelease values blocks (helm template) ==="
      if ! python3 scripts/validate-helm-values.py --kubeconform; then
        FAILED=1
      fi

      exit $FAILED
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-flux-lint, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-flux-lint, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Validate the kube-prometheus-stack alert rules (PromQL in HelmRelease values)
# and the Alertmanager config (ExternalSecret template) that kubeconform /
# flux-lint can't parse. Without this, a bad expr or malformed route only
# surfaces post-merge when the prometheus-operator admission webhook rejects the
# rendered CR (failing the whole HelmRelease upgrade). See docs/33.
prometheus-config-lint:
  needs: []
  stage: lint
  image: python:3.11-slim
  # Cache promtool + amtool across runs, keyed on .gitlab-ci.yml (versions +
  # sha256s live there). No-op without a runner cache backend.
  cache:
    key:
      prefix: prom-tools
      files:
        - .gitlab-ci.yml
    paths:
      - .cache/prom-tools
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl
    - pip install --quiet "pyyaml==${PYYAML_VERSION}"
    - |
      set -eo pipefail
      # promtool (prometheus) + amtool (alertmanager), pinned + sha256 like every
      # other downloaded binary in this pipeline. The cache holds VERIFIED
      # TARBALLS: every run — hit or miss — re-checks the pinned sha256 and
      # re-extracts, so a mutated runner cache can't smuggle in an unverified
      # binary. set -eo pipefail so a failing sha256sum -c aborts the block.
      TOOLS_CACHE="${CI_PROJECT_DIR}/.cache/prom-tools"
      mkdir -p "$TOOLS_CACHE"
      fetch_verified() { # <file> <url> <sha256>
        if ! echo "$3  $TOOLS_CACHE/$1" | sha256sum -c - >/dev/null 2>&1; then
          curl -fsSL -o "$TOOLS_CACHE/$1" "$2"
          echo "$3  $TOOLS_CACHE/$1" | sha256sum -c -
        fi
      }
      PROM_VERSION="3.6.0"
      fetch_verified prom.tar.gz \
        "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
        2002ef4a55a64161affccd2786c7081d4e3b3a8d08786a98b3bb110971414916
      tar xzf "$TOOLS_CACHE/prom.tar.gz" -C /usr/local/bin --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"
      AM_VERSION="0.28.1"
      fetch_verified am.tar.gz \
        "https://github.com/prometheus/alertmanager/releases/download/v${AM_VERSION}/alertmanager-${AM_VERSION}.linux-amd64.tar.gz" \
        5ac7ab5e4b8ee5ce4d8fb0988f9cb275efcc3f181b4b408179fafee121693311
      tar xzf "$TOOLS_CACHE/am.tar.gz" -C /usr/local/bin --strip-components=1 "alertmanager-${AM_VERSION}.linux-amd64/amtool"
      promtool --version && amtool --version
  script:
    - bash scripts/lint-prometheus-config.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-prometheus-config, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-prometheus-config, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ============================================================================
# TEST STAGE - Unit and integration tests
# ============================================================================

# NOTE: Molecule/integration tests require Docker-in-Docker, which needs a privileged
# runner. All weisssrv jobs (including these) run on the infrastructure runner
# (gitlab-runner-privileged Helm release, tags: infrastructure) which has privileged=true.
# The runner is Flux-managed: edit kubernetes/apps/gitlab-runner-privileged/release.yaml
# and push; Flux reconciles within ~1 min (or run `task flux:reconcile` to force).

# Molecule unit tests — one parallel job per role/scenario. Each role with a
# molecule/ directory gets its own CI job via parallel:matrix.
# Full static matrix — main, web, and the scheduled full-test run. MR
# pipelines run the TARGETED subset instead via molecule-plan/molecule-trigger
# below (the generated child extends the same .molecule-test-job template).
molecule-tests:
  extends: .molecule-test-job
  parallel:
    matrix:
      # Each role/scenario combo gets its own parallel job. Roles with a
      # single scenario use "default". k3s has two scenarios (default +
      # agent) that run as separate jobs to halve wall time.
      - ROLE: acme_certs
        SCENARIO: default
      - ROLE: alloy_host
        SCENARIO: default
      - ROLE: adguard_home
        SCENARIO: default
      - ROLE: adguard_home
        SCENARIO: tls
      - ROLE: adguard_sync
        SCENARIO: default
      - ROLE: base
        SCENARIO: default
      - ROLE: gitlab
        SCENARIO: default
      # immich: render/contract scenario (immich_skip_install) — asserts the
      # compose/config/.env/nginx/systemd/backup-wrapper renders without a real
      # Docker runtime.
      - ROLE: immich
        SCENARIO: default
      # immich_ml: render/contract scenario (skip_immich_ml_deploy) — asserts
      # the OpenVINO compose (image lockstep on immich_version, /dev/dri, port
      # 3003) + systemd unit render without a Docker runtime or GPU.
      - ROLE: immich_ml
        SCENARIO: default
      # home_assistant: contract test for the two Jinja2 templates
      # (configuration.yaml.j2, secrets.yaml.j2). The role's scp/ssh
      # path against the live HAOS appliance can't be exercised in a
      # container — HAOS isn't a Linux distro you can run in Docker —
      # so the scenario flips home_assistant_render_only=true to skip
      # the deploy half and asserts on the rendered output.
      - ROLE: home_assistant
        SCENARIO: default
      - ROLE: k3s
        SCENARIO: default
      - ROLE: k3s
        SCENARIO: agent
      - ROLE: nas_storage
        SCENARIO: default
      # restic_offsite is the nightly B2 offsite-backup role on pve-nas-01; its
      # hermetic scenario runs against a local file repo + fake archsync snapshot
      # tree (no network), asserting subcommands/metric names/0600 secret files/
      # timer enable + the freshness-guard abort (docs/42).
      - ROLE: restic_offsite
        SCENARIO: default
      # encrypted_swap is the dm-crypt random-key swap role (NAS + compute hosts);
      # its scenario contract-tests the crypttab/systemd render on the skip path.
      - ROLE: encrypted_swap
        SCENARIO: default
      - ROLE: nextcloud
        SCENARIO: default
      - ROLE: nfs_tls
        SCENARIO: default
      - ROLE: nic_tuning
        SCENARIO: default
      - ROLE: plex
        SCENARIO: default
      - ROLE: postfix_null_client
        SCENARIO: default
      - ROLE: qol
        SCENARIO: default
      - ROLE: smtp_relay
        SCENARIO: default
      - ROLE: tailscale
        SCENARIO: default
      - ROLE: unbound
        SCENARIO: default
      # apt_signed_repo is the shared signed-apt-repo pipeline backing
      # alloy_host + gitlab + plex; its scenario hermetically tests both the
      # accept (correct fingerprint) and reject (wrong fingerprint) paths.
      - ROLE: apt_signed_repo
        SCENARIO: default
      # docker_engine is the shared pinned-Docker-Engine install pipeline
      # backing immich + immich_ml + nextcloud; its scenario renders + asserts
      # the journald daemon.json on the skip-install path (no real repo/daemon).
      - ROLE: docker_engine
        SCENARIO: default
      # compose_app is the shared compose-lifecycle super-role backing immich +
      # immich_ml + nextcloud (compose systemd unit + write_prom_metrics lib +
      # nginx task-flow); its scenario asserts the rendered unit body (empty and
      # non-empty RequiresMountsFor) and the metrics lib without a Docker runtime.
      - ROLE: compose_app
        SCENARIO: default
      # prometheus_exporter is the shared install pipeline backing
      # zfs_exporter + unbound_exporter; its scenario contract-tests both
      # artifact branches (tarball + deb) on the skip path.
      - ROLE: prometheus_exporter
        SCENARIO: default
      - ROLE: zfs_exporter
        SCENARIO: default
      - ROLE: unbound_exporter
        SCENARIO: default
      - ROLE: node_exporter_host
        SCENARIO: default
      - ROLE: textfile_collector
        SCENARIO: default
      - ROLE: resolv_conf
        SCENARIO: default
      - ROLE: resolv_conf
        SCENARIO: empty-search
      # zvol_mount uses loop devices in prepare; works under privileged DinD.
      - ROLE: zvol_mount
        SCENARIO: default
      - ROLE: proxmox_firewall
        SCENARIO: default
      - ROLE: proxmox_vm
        SCENARIO: default
      - ROLE: proxmox_lxc
        SCENARIO: default
      - ROLE: proxmox_ha
        SCENARIO: default
      - ROLE: proxmox_backup
        SCENARIO: default
      # zfs_encryption: validates template rendering, file modes, systemd
      # ordering hooks, and per-pool service enable. Cannot exercise
      # `zfs load-key` (no kernel module in container) or live Connect
      # calls (no fixture endpoint), but covers the deploy contract end
      # to end with mocked inputs.
      - ROLE: zfs_encryption
        SCENARIO: default
  rules:
    # full-test schedule canary (must precede the schedule when:never rule —
    # first-match-wins): catches external-dependency rot (apt/galaxy/upstream
    # installers) without waiting for an unrelated ansible MR to turn red.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "full-test"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # NO merge_request_event clause: MR pipelines run the targeted child
    # (molecule-plan/molecule-trigger, gated on .paths-molecule-any) instead
    # of this full matrix.
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-molecule, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'

integration-tests:
  extends: .integration-test-job
  parallel:
    matrix:
      - TEST:
          - base-infrastructure
          - cert-distribution
          - dns-stack
          - mail-stack
          - storage-stack
  rules:
    # full-test schedule canary — same rationale as molecule-tests.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "full-test"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # NO merge_request_event clause: MRs use the targeted child pipeline.
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-integration, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ---- MR-targeted molecule child pipeline -----------------------------------
# On MRs the full 41+5 matrix is replaced by a GENERATED child pipeline running
# only the scenarios affected by the diff (scripts/generate-molecule-pipeline.py:
# role dirs -> their scenarios, provider roles -> dependent roles transitively,
# integration stacks by exercised role, all.yml -> integration only, global
# inputs -> everything; unknown role dirs fail loudly, over-selects when in
# doubt). Full coverage still runs on every merge to main + the scheduled
# full-test pipeline, so a cross-role regression a targeted MR run missed is
# caught before any deploy (deploys are main-only, behind validation-gate).
molecule-plan:
  stage: test
  image: python:3.11-slim
  needs: []
  variables:
    # Full clone so the MR diff base is always reachable (same rationale as
    # repo-policy-checks' merge-base guard).
    GIT_DEPTH: 0
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - pip install --no-cache-dir --quiet "PyYAML==${PYYAML_VERSION}"
  script:
    - python3 scripts/generate-molecule-pipeline.py "$CI_MERGE_REQUEST_DIFF_BASE_SHA" -o molecule-child.yml
    - cat molecule-child.yml
  artifacts:
    paths:
      - molecule-child.yml
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-molecule-any, changes]

molecule-trigger:
  stage: test
  needs:
    - job: molecule-plan
    # Forward build-molecule-ci's dotenv digest pin into the trigger job so the
    # child's jobs resolve the exact rebuilt CI image (not a racy :latest) when
    # the image changed in this MR. optional: the build only runs on docker/
    # changes; without it the child falls back to :latest via .molecule-base.
    - job: build-molecule-ci
      optional: true
      artifacts: true
    # Parity with the static matrix's anti-retag guard: when docker/molecule-test
    # changed, the child's SHA-tag pull must not race the image push — hold the
    # trigger until the build lands. optional: absent on non-image MRs.
    - job: build-molecule-test
      optional: true
  trigger:
    include:
      - artifact: molecule-child.yml
        job: molecule-plan
    # depend: this job's result mirrors the child pipeline's — a red child
    # reds the MR pipeline, so targeted tests gate MRs exactly like the full
    # matrix used to.
    strategy: depend
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-molecule-any, changes]
# ============================================================================
# SECURITY STAGE - Secret detection and scanning
# ============================================================================

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  # .molecule-base + the molecule/integration job templates live in an
  # includable file so the generated MR child pipeline (molecule-plan ->
  # molecule-trigger) reuses the exact same job definitions.
  - local: .gitlab/ci/molecule-jobs.gitlab-ci.yml

secret_detection:
  stage: security
  needs: []  # run in parallel with lint/test stages
  variables:
    SECRET_DETECTION_HISTORIC_SCAN: "false"
    # Custom gitleaks config is loaded via `.gitlab/secret-detection-ruleset.toml`
    # which `[[secrets.passthrough]]`s `.gitleaks.toml`. The previously-used
    # `SECRET_DETECTION_RULESET_PATH` variable is not a documented GitLab
    # variable and was silently ignored. `.gitleaks.toml` carries
    # content-allowlist regexes (`op://`, `[your-...]`, anchored test/fake
    # fixture tokens) that cover the placeholder shapes docs use — `docs/*.md`
    # is scanned normally — plus a rule-scoped allowlist that exempts ONLY the
    # `private-key` rule under the molecule/integration-test trees (throwaway
    # PEM fixtures); every other rule still scans those paths, so a real cloud
    # key/token committed there IS caught. Details in `.gitleaks.toml`.
    # Require modern CPU (gitleaks binary uses POPCNT/SSE4.2 - OptiPlex Core 2 Quads crash with SIGILL)
    # OPERATIONAL INVARIANT: this job is pinned to esweiss.com/cpu=modern nodes.
    # If no modern-CPU node is schedulable the job sits Pending and is NOT a
    # passed scan — a skipped/pending secret_detection must be investigated, not
    # treated as green. validation-gate needs it non-optionally so this can't be
    # silently lost on a main pipeline.
    KUBERNETES_NODE_SELECTOR_CPU: "esweiss.com/cpu=modern"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    # Run on schedules so anything that snuck in via tags/branch merges that
    # didn't trigger a normal pipeline still gets scanned (security best practice).
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ============================================================================
# GATE STAGE - Validation gate for deploy jobs
# ============================================================================
# All deploy jobs depend on this gate (non-optional). The gate lists every
# lint/test/security job as a dependency. GitLab CI `optional: true` semantics
# (https://docs.gitlab.com/ci/yaml/#needsoptional):
#
#   - If the needed job was NOT created (rules excluded it): dependency is ignored
#   - If the needed job IS in the pipeline and SUCCEEDS: dependency satisfied
#   - If the needed job IS in the pipeline and FAILS: the dependent job is BLOCKED
#
# Jobs with `changes:` path filters use optional:true (may not exist in pipeline).
# Jobs that ALWAYS run on main pushes (no path filter) are non-optional.
#
# Net effect: all applicable checks must pass before any deploy job runs.

# Fan-in for the parallel test matrices. molecule-tests (one job per role) and
# integration-tests (one per stack) are `parallel: matrix` jobs, so a `needs:`
# on either expands to ONE entry PER matrix instance (currently 41 + 5 = 46).
# Listed directly in validation-gate alongside its scalar needs the total
# exceeded GitLab's hard cap of 50 needs-per-job, so the main pipeline failed
# to even be created ("one job can only need 50 others"). TWO thin fan-ins —
# one per matrix — collapse those 46 into two dependencies, keeping each
# aggregator's expanded-need count (41 / 5) comfortably under the cap with
# per-group headroom (a single combined fan-in had crept to 46/50; four more
# molecule roles would have broken main pipeline creation). Gating is
# unchanged — a failed matrix instance leaves its (non-optional-by-default)
# dependency unmet, its aggregator is skipped, and validation-gate (which
# needs both non-optionally) is skipped in turn, blocking every deploy job.
# optional:true on each matrix keeps a path-filtered no-op pipeline green.
#
# interruptible:false on both (not the default true): on main, a second merge
# landing while a fan-in / validation-gate is still running must NOT
# auto-cancel it (workflow auto_cancel is on_new_commit:interruptible), or the
# first merge's deploy jobs would be left with an unmet need and silently
# never run. NOTE this protection is necessary but NOT sufficient: the matrix
# jobs UPSTREAM of the fan-ins stay interruptible (deliberately — MR pipelines
# rely on auto-cancel to free runner capacity), so a rapid second merge can
# still cancel the first pipeline's running matrices, skip its fan-ins + gate,
# and orphan its deploys — and the second pipeline's `changes:` are computed
# against its own parent, so the first merge's paths are NOT re-covered. That
# chain is exactly why the "serialize merges — never rapid-merge" operating
# rule exists; these flags only harden the tail of the pipeline, not the
# matrices. Deploys are already serialized by resource_group.
test-aggregate-molecule:
  stage: security
  image: alpine:3.23
  interruptible: false
  needs:
    # artifacts: false — this is a status-only fan-in (script is a bare echo).
    # The matrix extends .molecule-base and emits junit artifacts; without
    # this, GitLab would download them from all 41 instances here for no
    # reason.
    - job: molecule-tests
      optional: true
      artifacts: false
  script:
    - echo "molecule test matrix complete"
  # These rules MUST stay identical to validation-gate's below: it needs this
  # job non-optionally, so if this job is created for a pipeline where that gate
  # is not (or vice versa), pipeline creation fails. Same rules => co-present.
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main"'

test-aggregate-integration:
  stage: security
  image: alpine:3.23
  interruptible: false
  needs:
    - job: integration-tests
      optional: true
      artifacts: false
  script:
    - echo "integration test matrix complete"
  # Rules identical to validation-gate's — see test-aggregate-molecule.
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main"'

validation-gate:
  stage: gate
  image: alpine:3.23
  # interruptible:false (not the default true): once this deploy gate is running
  # on main, a newer commit must not auto-cancel it (workflow auto_cancel is
  # on_new_commit:interruptible) — otherwise the first pipeline's not-yet-started
  # deploy jobs, which all `needs: validation-gate`, would be orphaned and never
  # deploy. Enforces the "serialize merges" discipline the deploys rely on
  # (resource_group already serializes the deploys themselves).
  interruptible: false
  needs:
    # -- Path-filtered jobs (may not exist in pipeline) --
    - job: shellcheck
      optional: true
    - job: yaml-lint
      optional: true
    - job: ansible-lint
      optional: true
    - job: terraform-fmt
      optional: true
    - job: terraform-validate
      optional: true
    - job: terraform-plan
      optional: true
    - job: repo-sync-checks
      optional: true
    - job: flux-lint
      optional: true
    - job: prometheus-config-lint
      optional: true
    - job: repo-policy-checks
      optional: true
    - job: docs-link-check
      optional: true
    # tailscale-drift-plan / authentik-drift-plan are deliberately NOT here:
    # they are advisory (allow_failure) like pr-agent-review, so they can
    # never block the gate.
    - job: python-tests
      optional: true
    # molecule-tests + integration-tests are fanned in via the two
    # test-aggregate-* jobs (see their comment above) so this gate's expanded
    # needs stay under GitLab's hard 50-per-job cap. Both aggregators carry the
    # SAME rules as this gate (skip-schedule-web + main-only), so all three are
    # always created together. These needs are intentionally NON-optional: if
    # that shared-rules invariant is ever broken, a loud pipeline-creation
    # failure is safer than optional's silent skip, which would let deploy run
    # with the test matrices un-gated. Keep the rule blocks identical (or make
    # these optional) if you change any of them.
    - job: test-aggregate-molecule
    - job: test-aggregate-integration
    # -- Always-run jobs (no path filter, always present on main pushes) --
    - job: secret_detection
  script:
    # Guard: every deploy-* job gates on `$CI_COMMIT_BRANCH == "main" &&
    # $OP_SERVICE_ACCOUNT_TOKEN`. If the token is unset/empty those jobs are
    # silently never created and main goes green having deployed nothing.
    # Fail loudly here (this gate always runs on main, no token guard) so a
    # missing CI/CD variable surfaces as a red pipeline instead of a no-op.
    - |
      if [ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
        echo "ERROR: OP_SERVICE_ACCOUNT_TOKEN is unset/empty on a main pipeline." >&2
        echo "       All deploy-* jobs gate on this token and would be silently skipped," >&2
        echo "       deploying nothing while the pipeline reports success." >&2
        echo "       Set the OP_SERVICE_ACCOUNT_TOKEN CI/CD variable (masked, protected)." >&2
        exit 1
      fi
    - echo "All applicable checks passed - deploy jobs may proceed"
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main"'

# ============================================================================
# DEPLOY STAGE - Auto-deploy on merge to main
#
# Each Ansible deploy job sets a per-job resource_group so GitLab serializes it
# across pipelines (two rapid pushes to main can't run the same Ansible play
# against the same hosts at once). Per-job (not one shared group) keeps
# within-pipeline parallelism: jobs targeting different hosts still run
# concurrently. (deploy-terraform relies on its HTTP state lock instead; the
# read-only deploy-verify job needs no serialization.)
# ============================================================================

# ------------------------------------------------------------------------------
# Terraform
# ------------------------------------------------------------------------------

deploy-terraform:
  extends: .terraform-http-backend
  stage: deploy
  interruptible: false
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]
  needs:
    - job: validation-gate
    - job: terraform-plan
      artifacts: true
  before_script:
    - !reference [.install-1password-alpine, before_script]
  script:
    - cd terraform/cloudflare
    # -lockfile=readonly: CI must not rewrite .terraform.lock.hcl (provider
    # hashes are committed; a CI-side change would mask supply-chain drift).
    - terraform init -lockfile=readonly
    - |
      export TF_VAR_cloudflare_api_token=$(op read "op://Homelab/Cloudflare Terraform Token/credential")
      export TF_VAR_cloudflare_account_id=$(op read "op://Homelab/Cloudflare Terraform Token/username")
      terraform apply -auto-approve -lock-timeout=120s tfplan
  environment:
    name: production/cloudflare
  rules:
    - !reference [.skip-schedule-web, rules]
    # Cloudflare-only: an unrelated terraform/tailscale change must not fire a
    # Cloudflare plan+apply (which could revert out-of-band Cloudflare drift).
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-terraform-cloudflare, changes]

# ------------------------------------------------------------------------------
# Ansible Infrastructure
# ------------------------------------------------------------------------------

deploy-ansible-base:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-base
  needs:
    - job: validation-gate
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    # LOKI_PUSH_USER/PASSWORD now come from the shared .deploy-base (alloy_host
    # needs them on any site.yml-based deploy, not just this job).
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/base.yml
    # base.yml doesn't include node_exporter_host or alloy_host (those live
    # in site.yml); when changes touch them we follow up with a tag-scoped
    # site.yml run so the rules block below stays honest. Idempotent if
    # neither role changed; the tag filter skips everything else in site.yml.
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --tags node_exporter_host,alloy_host
  environment:
    name: production/ansible-base
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/base/**/*
        - ansible/roles/nic_tuning/**/*
        # Transitive: resolv_conf is invoked by base when skip_dns_config=false.
        - ansible/roles/resolv_conf/**/*
        # node_exporter_host + alloy_host live in site.yml and run on the
        # same host set base does. The script above runs site.yml with
        # --tags node_exporter_host,alloy_host as a second step so these
        # changes actually deploy when this rule fires.
        - ansible/roles/node_exporter_host/**/*
        - ansible/roles/alloy_host/**/*
        # apt_signed_repo is the shared signed-repo helper alloy_host includes;
        # list it so a helper-only change still triggers the base deploy (same
        # pattern prometheus_exporter uses under deploy-ansible-dns/storage).
        - ansible/roles/apt_signed_repo/**/*
        # textfile_collector is the shared unit/timer scaffold node_exporter_host
        # includes for its corosync/zpool/smartmon collectors; list it so a
        # helper-only change still triggers the node_exporter_host deploy.
        - ansible/roles/textfile_collector/**/*
        # encrypted_swap runs in site.yml's proxmox play (dm-crypt random-key
        # swap on all six hosts) — a role-only change must trigger this deploy.
        - ansible/roles/encrypted_swap/**/*
        - ansible/playbooks/base.yml
        # all.yml triggers deploy for alloy_host_version (host-side apt pin
        # applied by the tag-scoped site.yml follow-up above) and other
        # base-consumed pins; unrelated bumps re-run an idempotent play
        # (deploy-gitlab precedent).
        - ansible/inventories/prod/group_vars/all.yml
        - ansible/playbooks/site.yml
        - ansible/inventories/prod/group_vars/proxmox.yml
        # hosts.yml: host roster/IP/topology changes must redeploy the base play
        - ansible/inventories/prod/hosts.yml
        - ansible/inventories/prod/host_vars/pve-nas-01.yml

# Proxmox host configuration (qol, postfix_null_client, tailscale)
deploy-ansible-proxmox:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-proxmox
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    TAILSCALE_AUTH_KEY: "op://Homelab/Tailscale Auth Key/credential"
  script:
    - cd ansible
    # Deploy qol, postfix_null_client, tailscale to proxmox hosts
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --limit proxmox --tags qol,postfix_null_client,tailscale
  environment:
    name: production/ansible-proxmox
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/qol/**/*
        - ansible/roles/tailscale/**/*
        - ansible/roles/postfix_null_client/**/*
        # This job RUNS site.yml plays (--limit proxmox); a change to those
        # plays must redeploy too (idempotent, so extra triggers are safe).
        - ansible/playbooks/site.yml
        # Inventory inputs of the proxmox-host plays (NOT all.yml: its
        # tailscale/plex pins deploy via manual maintenance jobs by design).
        - ansible/inventories/prod/group_vars/proxmox.yml
        - ansible/inventories/prod/hosts.yml

deploy-ansible-firewall:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-firewall
  needs:
    - job: validation-gate
    - job: deploy-ansible-proxmox
      optional: true
  script:
    - cd ansible
    # Firewall is applied to proxmox hosts, dns, and mail via site.yml
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --tags proxmox_firewall
  environment:
    name: production/ansible-firewall
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/proxmox_firewall/**/*
        # Per-guest firewall assignments (guest_security_groups / firewall_ipsets)
        # live ONLY in hosts.yml, not the role — without this an inventory-only
        # firewall edit silently never deploys. site.yml now has a `hosts: k3s`
        # firewall play so --tags proxmox_firewall also reaches k3s guest .fw.
        # The ipset/security-group render reads the ENTIRE inventory (every
        # host's ansible_host + firewall_ipsets membership), so any inventory
        # file can change the rendered firewall — trigger on all of it.
        - ansible/inventories/prod/**/*
        # The proxmox_firewall plays (proxmox/dns/mail/services/k3s — which host
        # groups + tags they target) live in site.yml, which this job RUNS as
        # `site.yml --tags proxmox_firewall`. A change to those plays must also
        # redeploy; without this a future firewall-play edit would merge unrun.
        - ansible/playbooks/site.yml

deploy-ansible-dns:
