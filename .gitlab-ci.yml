      export TF_VAR_wlan_passphrase_iot=$(op read "op://Homelab/WiFi Panopticon/password")
      export TF_VAR_wlan_passphrase_guest=$(op read "op://Homelab/WiFi kugel-tikka-masala/password")
      export TF_VAR_wlan_passphrase_work=$(op read "op://Homelab/WiFi DunderMiffLAN/password")
      # Plan only, never apply — surfaces drift instead of silently reverting it.
