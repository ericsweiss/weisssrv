# GitLab CI/CD Pipeline for weisssrv Homelab Infrastructure
#
# Canonical source: https://git.ericsweiss.com/eric/weisssrv
# GitHub mirror: https://github.com/ericsweiss/weisssrv (read-only)
#
# Pipeline Features:
# - Full validation suite (lint, test, security)
# - Auto-deployment on merge to main (after tests pass)
# - 1Password integration for all secrets
# - Service restarts: automatic
# - Machine reboots: manual approval required (maintenance jobs auto-reboot when triggered)
#
# Required CI/CD Variables (Settings > CI/CD > Variables):
# - OP_SERVICE_ACCOUNT_TOKEN (masked, protected) - 1Password service account
#
# Optional CI/CD Variables:
# - GH_API_TOKEN (masked) - For version checker API rate limits
#
# Pipeline triggers:
# - Merge requests: Validation only (no deploy)
# - Push to main: Validation + auto-deploy
# - Scheduled: Version checking and secret detection only (all other jobs excluded via when: never)
# - Manual (web): Lint, validate, test, security stages only (deploy/gate/maintenance excluded)

stages:
  - build
  - lint
  - validate
  - test
  - security
  - ai-review
  - gate
  - deploy
  - maintenance

# ============================================================================
# Default settings
# ============================================================================
default:
  image: python:3.11-slim
  # All weisssrv jobs run on the privileged infrastructure runner.
  # The shared non-privileged runner (k8s-deploy) is for other GitLab projects.
  tags: [infrastructure]

# ============================================================================
# Workflow rules - when to run the pipeline
# ============================================================================
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ============================================================================
# Templates for reuse
# ============================================================================
.ansible-base:
  variables:
    # GitLab checkout is world-writable, causing Ansible to ignore ansible.cfg
    # Use absolute roles path; config is copied to a secure temp file in before_script
    ANSIBLE_ROLES_PATH: ${CI_PROJECT_DIR}/ansible/roles
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq git
    - |
      # Copy ansible.cfg to unpredictable temp path (avoids symlink attacks in /tmp)
      export ANSIBLE_CONFIG="$(mktemp /tmp/ansible-XXXXXXXXXX.cfg)"
      install -m 600 ansible/ansible.cfg "$ANSIBLE_CONFIG"
      trap "rm -f '$ANSIBLE_CONFIG'" EXIT
    - pip install --quiet ansible==11.6.0 ansible-lint==25.12.2
    - ansible-galaxy collection install -r ansible/requirements.yml

.install-1password:
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl gnupg openssh-client
    - |
      # Install 1Password CLI
      curl -sS https://downloads.1password.com/linux/keys/1password.asc | \
        gpg --dearmor --output /usr/share/keyrings/1password-archive-keyring.gpg
      echo "deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main" \
        > /etc/apt/sources.list.d/1password.list
      apt-get update -qq && apt-get install -y -qq 1password-cli
    - op --version

.install-1password-alpine:
  before_script:
    - apk add --no-cache curl bash gnupg jq
    - |
      curl -sS https://downloads.1password.com/linux/keys/1password.asc | gpg --dearmor > /etc/apk/keys/1password.gpg
      echo "https://downloads.1password.com/linux/alpinelinux/stable" >> /etc/apk/repositories
      apk add --no-cache 1password-cli
    - op --version

.deploy-base:
  extends: .install-1password
  variables:
    ANSIBLE_ROLES_PATH: ${CI_PROJECT_DIR}/ansible/roles
  before_script:
    - !reference [.install-1password, before_script]
    - pip install --quiet ansible==11.6.0
    - |
      # Copy ansible.cfg to secure temp path (world-writable checkout causes Ansible to ignore it)
      export ANSIBLE_CONFIG="$(mktemp /tmp/ansible-XXXXXXXXXX.cfg)"
      install -m 600 ansible/ansible.cfg "$ANSIBLE_CONFIG"
      trap "rm -f '$ANSIBLE_CONFIG'" EXIT
    - |
      # Setup SSH from 1Password
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      op read "op://Homelab/SSH Key/private key" > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      # Add known hosts for all infrastructure (Proxmox hosts, services, k3s VMs)
      ssh-keyscan -H 192.168.0.102 192.168.0.103 192.168.0.104 192.168.0.105 192.168.0.106 192.168.0.107 >> ~/.ssh/known_hosts 2>/dev/null || true
      ssh-keyscan -H 192.168.0.150 192.168.0.151 192.168.0.152 192.168.0.153 192.168.0.154 192.168.0.160 >> ~/.ssh/known_hosts 2>/dev/null || true
      ssh-keyscan -H 192.168.0.202 192.168.0.203 192.168.0.204 192.168.0.205 192.168.0.206 192.168.0.207 >> ~/.ssh/known_hosts 2>/dev/null || true
      ssh-keyscan -H 192.168.0.222 192.168.0.223 192.168.0.227 >> ~/.ssh/known_hosts 2>/dev/null || true
    - ansible-galaxy collection install -r ansible/requirements.yml

.k3s-deploy-base:
  extends: .install-1password
  # Use Debian-based image (Alpine musl resolver has issues with k8s ndots:5)
  image: python:3.11-slim
  before_script:
    - !reference [.install-1password, before_script]
    - apt-get install -y -qq jq
    - |
      # Install kubectl (pinned checksum for supply-chain integrity).
      # helm and yq removed — Flux manages chart deployments; no CI job needs them
      # jq comes from apt above — used by deploy-verify to parse kubectl JSON output (Flux CR readiness checks).
      curl -fsSL "https://dl.k8s.io/release/v1.35.2/bin/linux/amd64/kubectl" -o /tmp/kubectl
      echo "924eb50779153f20cb668117d141440b95df2f325a64452d78dff9469145e277  /tmp/kubectl" | sha256sum -c -
      install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
    - |
      # Setup kubeconfig from 1Password (stored as base64 to preserve YAML formatting).
      # Only the verify jobs still need this; all workload deploys are Flux-managed.
      set -eo pipefail
      mkdir -p ~/.kube
      KUBECONFIG_B64=$(op read "op://Homelab/K3s Kubeconfig/kubeconfig")
      if [ -z "$KUBECONFIG_B64" ]; then
        echo "ERROR: op read returned empty kubeconfig. Is OP_SERVICE_ACCOUNT_TOKEN set?"
        exit 1
      fi
      echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
      chmod 600 ~/.kube/config
      export KUBECONFIG="$HOME/.kube/config"
      echo "Kubeconfig written ($(wc -c < ~/.kube/config) bytes), KUBECONFIG=$KUBECONFIG"
    # Skipping `kubectl cluster-info` — requires list perms on kube-system
    # services, which the runner ServiceAccount lacks. Per-job kubectl calls
    # target narrower scopes and use the K3s Kubeconfig credentials.
    - kubectl version --output=yaml --request-timeout=5s

.changes-ansible:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ansible/**
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ansible/**
    - if: '$CI_PIPELINE_SOURCE == "web"'

.changes-terraform:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - terraform/**
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - terraform/**
    - if: '$CI_PIPELINE_SOURCE == "web"'

.changes-kubernetes:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - kubernetes/**
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - kubernetes/**
    - if: '$CI_PIPELINE_SOURCE == "web"'

.changes-scripts:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - scripts/**
        - ansible/roles/**/*.sh
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - scripts/**
        - ansible/roles/**/*.sh
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ============================================================================
# BUILD STAGE - Container images
# ============================================================================

build-molecule-images:
  # Builds both CI images:
  # - molecule-test: the container molecule spins up (has all role apt deps)
  # - molecule-ci: the GitLab CI runner image (has docker-cli + molecule + ansible)
  # Only rebuilds when Dockerfiles or requirements change.
  stage: build
  image: python:3.11
  services:
    - docker:24.0-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apt-get update -qq && apt-get install -y -qq docker.io
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # molecule-test: the container roles run inside
    - docker build -t "${CI_REGISTRY_IMAGE}/molecule-test:${CI_COMMIT_SHORT_SHA}" docker/molecule-test/
    - docker push "${CI_REGISTRY_IMAGE}/molecule-test:${CI_COMMIT_SHORT_SHA}"
    # molecule-ci: the GitLab CI runner image (docker-cli + pip deps + collections)
    - docker build -t "${CI_REGISTRY_IMAGE}/molecule-ci:${CI_COMMIT_SHORT_SHA}" -f docker/molecule-ci/Dockerfile .
    - docker push "${CI_REGISTRY_IMAGE}/molecule-ci:${CI_COMMIT_SHORT_SHA}"
    # Only push :latest on main — MR pipelines use SHA tags to avoid
    # overwriting :latest with unmerged branch images.
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "${CI_REGISTRY_IMAGE}/molecule-test:${CI_COMMIT_SHORT_SHA}" "${CI_REGISTRY_IMAGE}/molecule-test:latest"
        docker push "${CI_REGISTRY_IMAGE}/molecule-test:latest"
        docker tag "${CI_REGISTRY_IMAGE}/molecule-ci:${CI_COMMIT_SHORT_SHA}" "${CI_REGISTRY_IMAGE}/molecule-ci:latest"
        docker push "${CI_REGISTRY_IMAGE}/molecule-ci:latest"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - docker/molecule-test/**
        - docker/molecule-ci/**
        - requirements.txt
        - ansible/requirements.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - docker/molecule-test/**
        - docker/molecule-ci/**
        - requirements.txt
        - ansible/requirements.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# ============================================================================
# LINT STAGE - Code quality checks
# ============================================================================

shellcheck:
  needs: []
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - echo "Running ShellCheck..."
    - shellcheck --severity=warning --exclude=SC1091,SC2034 scripts/*.sh
    - |
      # Also lint shell scripts shipped in Ansible roles
      find ansible/roles -name '*.sh' -type f | while read -r script; do
        echo "Checking: $script"
        shellcheck --severity=warning --exclude=SC1091,SC2034 "$script"
      done
    - echo "ShellCheck passed"
  rules:
    - !reference [.changes-scripts, rules]

yaml-lint:
  needs: []
  stage: lint
  before_script:
    - apt-get update -qq
    - pip install --quiet yamllint==1.37.1
  script:
    - yamllint -d relaxed ansible/
    - yamllint -d relaxed kubernetes/
    - yamllint -d relaxed .gitlab-ci.yml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ansible/**
        - kubernetes/**
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ansible/**
        - kubernetes/**
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'

ansible-lint:
  needs: []
  stage: lint
  extends: .ansible-base
  script:
    - cd ansible
    - |
      export SSH_PUBLIC_KEY="ssh-ed25519 AAAA_PLACEHOLDER_FOR_CI_SYNTAX_CHECK"
      export SMTP_RELAY_USER="ci-placeholder"
      export SMTP_RELAY_PASSWORD="ci-placeholder"
      for playbook in playbooks/*.yml playbooks/*/*.yml; do
        if [ -f "$playbook" ]; then
          # Skip task include files (convention: prefix with underscore)
          # POSIX-compatible pattern match (works in sh, not just bash)
          case "$(basename "$playbook")" in
            _*)
              echo "Skipping task include: $playbook"
              continue
              ;;
          esac
          echo "Checking syntax: $playbook"
          ansible-playbook --syntax-check -i inventories/prod "$playbook"
        fi
      done
    - ansible-lint playbooks/ roles/
    - |
      echo "Validating proxmox_ha role structure..."
      for task_file in roles/proxmox_ha/tasks/*.yml; do
        echo "Validating YAML: $task_file"
        python3 -c "import yaml; yaml.safe_load(open('$task_file'))"
      done
      for f in main.yml rules.yml resources.yml replication.yml; do
        test -f "roles/proxmox_ha/tasks/$f" || { echo "ERROR: $f missing"; exit 1; }
        echo "  Found: $f"
      done
  rules:
    - !reference [.changes-ansible, rules]

terraform-fmt:
  needs: []
  stage: lint
  image:
    name: hashicorp/terraform:1.5
    entrypoint: [""]
  script:
    - cd terraform/cloudflare
    - terraform fmt -check -recursive
  rules:
    - !reference [.changes-terraform, rules]

# ============================================================================
# AI-REVIEW STAGE - AI-powered code review on MRs
# ============================================================================

# PR-Agent by Qodo - AI code review
# Requires: GitLab API Token and OpenAI API Key in 1Password
pr-agent-review:
  stage: ai-review
  needs:
    # Wait for lint + security only — no need to block on slow test jobs.
    # AI review benefits from knowing the code is lint-clean and secret-safe
    # but doesn't depend on molecule/integration test results.
    - job: shellcheck
      optional: true
    - job: yaml-lint
      optional: true
    - job: ansible-lint
      optional: true
    - job: terraform-fmt
      optional: true
    - job: flux-versions-sync
      optional: true
    - job: flux-lint
      optional: true
    - job: secret_detection
  image: codiumai/pr-agent:latest
  variables:
    CONFIG__GIT_PROVIDER: "gitlab"
    GITLAB__URL: "https://git.ericsweiss.com"
    # Model configuration: GPT-5.3-Codex (OpenAI's most capable agentic coding model)
    # GPT-5.4 is now available but gpt-5.3-codex is optimized specifically for code review
    # See: https://qodo-merge-docs.qodo.ai/usage-guide/changing_a_model/
    CONFIG__MODEL: "gpt-5.3-codex"
    # Maximize review depth: use full context window and extended effort
    CONFIG__MAX_MODEL_TOKENS: "128000"
    PR_REVIEWER__NUM_CODE_SUGGESTIONS: "6"
    PR_REVIEWER__EXTRA_INSTRUCTIONS: "Be thorough. Review every file. Flag all bugs, security issues, and documentation drift."
    PR_CODE_SUGGESTIONS__NUM_CODE_SUGGESTIONS: "6"
  before_script:
    - !reference [.install-1password, before_script]
  script:
    - |
      # Get secrets from 1Password
      export GITLAB__PERSONAL_ACCESS_TOKEN=$(op read "op://Homelab/GitLab API Token/credential")
      export OPENAI__KEY=$(op read "op://Homelab/OpenAI API Key/api-key")

      echo "Running AI code review on MR !${CI_MERGE_REQUEST_IID}..."
      echo "Model: gpt-5.3-codex"

      # Run full review
      python -m pr_agent.cli \
        --pr_url="https://git.ericsweiss.com/eric/weisssrv/-/merge_requests/${CI_MERGE_REQUEST_IID}" \
        review

      # Suggest improvements
      python -m pr_agent.cli \
        --pr_url="https://git.ericsweiss.com/eric/weisssrv/-/merge_requests/${CI_MERGE_REQUEST_IID}" \
        improve

      echo "AI review complete"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $OP_SERVICE_ACCOUNT_TOKEN'
  allow_failure: true  # Don't block MRs on AI review
  timeout: 30m

# ============================================================================
# VALIDATE STAGE - Schema and configuration validation
# ============================================================================

terraform-validate:
  needs: []
  stage: validate
  image:
    name: hashicorp/terraform:1.5
    entrypoint: [""]
  script:
    - cd terraform/cloudflare
    - terraform init -backend=false
    - terraform validate
  rules:
    - !reference [.changes-terraform, rules]

terraform-plan:
  needs: []
  stage: validate
  image:
    name: hashicorp/terraform:1.5
    entrypoint: [""]
  variables:
    TF_HTTP_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/cloudflare"
    TF_HTTP_LOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/cloudflare/lock"
    TF_HTTP_UNLOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/cloudflare/lock"
    TF_HTTP_USERNAME: "gitlab-ci-token"
    TF_HTTP_PASSWORD: "${CI_JOB_TOKEN}"
    TF_HTTP_LOCK_METHOD: "POST"
    TF_HTTP_UNLOCK_METHOD: "DELETE"
    TF_HTTP_RETRY_WAIT_MIN: "5"
  before_script:
    - !reference [.install-1password-alpine, before_script]
  script:
    - cd terraform/cloudflare
    - terraform init
    - |
      export TF_VAR_cloudflare_api_token=$(op read "op://Homelab/Cloudflare DNS Token/credential")
      export TF_VAR_cloudflare_account_id=$(op read "op://Homelab/Cloudflare DNS Token/username")
      terraform plan -input=false -no-color -out=tfplan
    # Generate plan report for MR widget (shows resource change counts in merge requests)
    - terraform show -json tfplan | jq -r '
        ([.resource_changes[]?.change.actions?]|flatten)|
        {"create":(map(select(.=="create"))|length),
         "update":(map(select(.=="update"))|length),
         "delete":(map(select(.=="delete"))|length)}
      ' > tfplan.json
  artifacts:
    paths:
      - terraform/cloudflare/tfplan
    reports:
      terraform: terraform/cloudflare/tfplan.json
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - terraform/**
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - terraform/**

flux-versions-sync:
  needs: []
  # Fails if kubernetes/infrastructure/sources/versions-configmap.yaml is out
  # of sync with ansible/inventories/prod/group_vars/all.yml. Run
  # `task flux:sync-versions` locally to regenerate and commit.
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install --quiet pyyaml
  script:
    # Compare committed ConfigMap against a freshly-generated one. The
    # generator writes in-place, so we save + restore the committed file
    # to keep the workspace clean for other jobs (e.g., flux-lint).
    - |
      set -eo pipefail
      TARGET=kubernetes/infrastructure/sources/versions-configmap.yaml
      cp "$TARGET" /tmp/committed.yaml
      python3 scripts/generate-versions-configmap.py
      cp "$TARGET" /tmp/generated.yaml
      cp /tmp/committed.yaml "$TARGET"   # restore workspace
      if ! diff -q /tmp/committed.yaml /tmp/generated.yaml >/dev/null 2>&1; then
        echo "ERROR: versions-configmap.yaml is out of sync with all.yml"
        echo "Run: task flux:sync-versions and commit the result."
        diff -u /tmp/committed.yaml /tmp/generated.yaml || true
        exit 1
      fi
      echo "versions-configmap.yaml is in sync with all.yml"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ansible/inventories/prod/group_vars/all.yml
        - kubernetes/infrastructure/sources/versions-configmap.yaml
        - scripts/generate-versions-configmap.py
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ansible/inventories/prod/group_vars/all.yml
        - kubernetes/infrastructure/sources/versions-configmap.yaml
        - scripts/generate-versions-configmap.py
    - if: '$CI_PIPELINE_SOURCE == "web"'

python-tests:
  # Runs pytest against scripts/. Both test files are kept near the scripts
  # they exercise: test_check_versions.py for the version-update tooling and
  # test_generate_versions_configmap.py for the ConfigMap generator.
  stage: test
  needs: []  # run in parallel with lint stage
  image: python:3.11-slim
  before_script:
    - pip install --quiet pytest pyyaml
  script:
    - pytest scripts/ -v --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - scripts/**
        - ansible/inventories/prod/group_vars/all.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - scripts/**
        - ansible/inventories/prod/group_vars/all.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'

flux-lint:
  needs: []
  # Renders every top-level Flux Kustomization, substitutes postBuild vars
  # from kubernetes/infrastructure/sources/versions-configmap.yaml, verifies
  # zero unsubstituted ${var} placeholders remain, then validates with
  # kubeconform. Replaces the old per-chart helm template + find-based
  # kubeconform jobs.
  stage: lint
  image: python:3.11-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl gettext-base
    - pip install --quiet pyyaml
    - |
      KUBECONFORM_SHA256="95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73"
      curl -fsSL -o /tmp/kubeconform.tar.gz \
        https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
      echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
      tar xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      curl -fsSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz -o /tmp/kustomize.tar.gz
      echo "3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7  /tmp/kustomize.tar.gz" | sha256sum -c -
      tar xzf /tmp/kustomize.tar.gz -C /usr/local/bin kustomize
      kubeconform -v && kustomize version && envsubst --version | head -1
  script:
    - |
      set -eo pipefail
      FAILED=0
      # Extract cluster-versions ConfigMap keys and export as env so envsubst
      # can substitute ${var} placeholders in rendered manifests. This mirrors
      # what Flux's kustomize-controller does at reconcile time (postBuild).
      VERSIONS_CONFIGMAP=kubernetes/infrastructure/sources/versions-configmap.yaml
      VARS_OUTPUT=$(python3 -c "
      import yaml
      with open('$VERSIONS_CONFIGMAP') as f:
          doc = yaml.safe_load(f)
      for k, v in doc.get('data', {}).items():
          print(f'{k}\t{v}')
      ") || { echo "ERROR: Failed to extract version keys from $VERSIONS_CONFIGMAP"; exit 1; }
      if [ -z "$VARS_OUTPUT" ]; then
        echo "ERROR: No version keys found in $VERSIONS_CONFIGMAP"
        exit 1
      fi
      while IFS=$'\t' read -r k v; do
        [ -n "$k" ] && export "$k=$v"
      done <<< "$VARS_OUTPUT"
      ENVSUBST_VARS=$(echo "$VARS_OUTPUT" | awk -F'\t' '{printf "${%s} ", $1}')

      # Iterate every Flux Kustomization under clusters/weisssrv/ and validate
      # the target path it points at. This picks up new top-level Kustomizations
      # automatically without CI edits.
      for ks in kubernetes/clusters/weisssrv/*.yaml; do
        [ -f "$ks" ] || continue
        NAME=$(basename "$ks" .yaml)
        [ "$NAME" = "kustomization" ] && continue
        if ! SRCPATH=$(python3 -c "
      import yaml, sys
      with open('$ks') as f:
          doc = yaml.safe_load(f)
      print(doc.get('spec', {}).get('path', '') or '')
      "); then
          echo "ERROR: failed to parse $ks"
          FAILED=1
          continue
        fi
        [ -z "$SRCPATH" ] && continue
        SRCPATH="${SRCPATH#./}"
        echo "=== Building + validating $ks (path $SRCPATH) ==="
        if ! RAW=$(kustomize build "$SRCPATH" 2>&1); then
          echo "ERROR: kustomize build failed for $SRCPATH:"
          echo "$RAW"
          FAILED=1
          continue
        fi
        # Check every ${var} reference in the pre-substitution output against
        # the exported ConfigMap keys. envsubst renders unknown vars as empty
        # string (so post-substitution grep wouldn't catch them) — Flux has
        # the same silent-empty default behavior. Our lint is intentionally
        # stricter so typos in version keys fail CI.
        MISSING=""
        for ref in $(echo "$RAW" | grep -oE '\$\{[A-Za-z_][A-Za-z0-9_]*\}' | sort -u); do
          varname=${ref#\$\{}
          varname=${varname%\}}
          if [ -z "${!varname+x}" ]; then
            MISSING="$MISSING $varname"
          fi
        done
        MISSING=$(echo "$MISSING" | tr ' ' '\n' | grep -v '^$' | sort -u || true)
        if [ -n "$MISSING" ]; then
          echo "ERROR: placeholders in $SRCPATH reference keys not in versions-configmap:"
          echo "$MISSING" | sed 's/^/  - /'
          FAILED=1
          continue
        fi
        RENDERED=$(echo "$RAW" | envsubst "$ENVSUBST_VARS")
        if ! echo "$RENDERED" | kubeconform -strict -ignore-missing-schemas \
            -kubernetes-version 1.35.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -summary; then
          FAILED=1
        fi
      done

      # Also build the cluster root to catch malformed top-level kustomization.yaml
      # (the loop above validates target paths, not the cluster root itself).
      echo "=== Building cluster root kubernetes/clusters/weisssrv/ ==="
      if ! kustomize build kubernetes/clusters/weisssrv >/dev/null; then
        echo "ERROR: cluster root kustomization failed to build"
        FAILED=1
      fi

      exit $FAILED
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - kubernetes/**
        - ansible/inventories/prod/group_vars/all.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - kubernetes/**
        - ansible/inventories/prod/group_vars/all.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ============================================================================
# TEST STAGE - Unit and integration tests
# ============================================================================

# NOTE: Molecule/integration tests require Docker-in-Docker, which needs a privileged
# runner. All weisssrv jobs (including these) run on the infrastructure runner
# (gitlab-runner-privileged Helm release, tags: infrastructure) which has privileged=true.
# The runner is Flux-managed: edit kubernetes/apps/gitlab-runner-privileged/release.yaml
# and push; Flux reconciles within ~1 min (or run `task flux:reconcile` to force).

# Molecule unit tests — one parallel job per role. Each role that has a
# molecule/ directory gets its own CI job via parallel:matrix, so all 15
# roles test simultaneously instead of sequentially (~3-5 min each vs
# ~45 min total serial). The zvol_mount role needs kernel loopback devices
# unavailable in DinD; it's excluded here and tested locally only.
# 18 roles total (15 original + zfs_exporter + unbound_exporter + alloy_host).
.molecule-base:
  stage: test
  needs:
    - job: build-molecule-images
      optional: true
  # Pre-built CI runner image: has docker-cli, molecule, ansible, and all
  # pip deps + ansible collections baked in. Eliminates ~2 min of apt-get +
  # pip install + galaxy install per job vs the generic python:3.11 image.
  image: ${CI_REGISTRY_IMAGE}/molecule-ci:latest
  services:
    - docker:24.0-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    ANSIBLE_FORCE_COLOR: "1"
    PY_COLORS: "1"
    ANSIBLE_CALLBACKS_ENABLED: junit
    JUNIT_OUTPUT_DIR: "$CI_PROJECT_DIR/junit"
    MOLECULE_IMAGE: "${CI_REGISTRY_IMAGE}/molecule-test"
  before_script:
    # Wait for DinD sidecar — with the pre-built CI image, the script
    # starts before DinD is ready (no apt-get delay to absorb startup).
    - |
      for i in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        echo "Waiting for DinD... ($i)"
        sleep 1
      done
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if docker pull "${MOLECULE_IMAGE}:${CI_COMMIT_SHORT_SHA}" 2>/dev/null; then
        docker tag "${MOLECULE_IMAGE}:${CI_COMMIT_SHORT_SHA}" "${MOLECULE_IMAGE}:latest"
      else
        docker pull "${MOLECULE_IMAGE}:latest"
      fi
    - mkdir -p "$CI_PROJECT_DIR/junit"
  artifacts:
    when: always
    reports:
      junit: junit/*.xml
  timeout: 20m

molecule-tests:
  extends: .molecule-base
  retry:
    max: 2
    when: script_failure
  script:
    - cd "ansible/roles/$ROLE"
    - molecule test -s "$SCENARIO" || exit 1
  parallel:
    matrix:
      # Each role/scenario combo gets its own parallel job. Roles with a
      # single scenario use "default". k3s has two scenarios (default +
      # agent) that run as separate jobs to halve wall time.
      - ROLE: acme_certs
        SCENARIO: default
      - ROLE: alloy_host
        SCENARIO: default
      - ROLE: adguard_home
        SCENARIO: default
      - ROLE: adguard_sync
        SCENARIO: default
      - ROLE: base
        SCENARIO: default
      - ROLE: gitlab
        SCENARIO: default
      - ROLE: k3s
        SCENARIO: default
      - ROLE: k3s
        SCENARIO: agent
      - ROLE: nas_storage
        SCENARIO: default
      - ROLE: nic_tuning
        SCENARIO: default
      - ROLE: plex
        SCENARIO: default
      - ROLE: postfix_null_client
        SCENARIO: default
      - ROLE: qol
        SCENARIO: default
      - ROLE: smtp_relay
        SCENARIO: default
      - ROLE: tailscale
        SCENARIO: default
      - ROLE: unbound
        SCENARIO: default
      - ROLE: zfs_exporter
        SCENARIO: default
      - ROLE: unbound_exporter
        SCENARIO: default
      # zvol_mount excluded: needs kernel loopback devices (test locally)
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ansible/roles/**
        - ansible/playbooks/**
        - ansible/inventories/prod/group_vars/**
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ansible/roles/**
        - ansible/playbooks/**
        - ansible/inventories/prod/group_vars/**
    - if: '$CI_PIPELINE_SOURCE == "web"'

integration-tests:
  extends: .molecule-base
  retry:
    max: 2
    when: script_failure
  script:
    - cd "ansible/integration-tests/$TEST"
    - molecule test || exit 1
  parallel:
    matrix:
      - TEST:
          - base-infrastructure
          - cert-distribution
          - dns-stack
          - mail-stack
          - storage-stack
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ansible/integration-tests/**
        - ansible/roles/**
        - ansible/inventories/**
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ansible/integration-tests/**
        - ansible/roles/**
        - ansible/inventories/**
    - if: '$CI_PIPELINE_SOURCE == "web"'
  timeout: 20m

# ============================================================================
# SECURITY STAGE - Secret detection and scanning
# ============================================================================

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: security
  needs: []  # run in parallel with lint/test stages
  variables:
    SECRET_DETECTION_HISTORIC_SCAN: "false"
    SECRET_DETECTION_EXCLUDED_PATHS: "docs/,ansible/roles/*/molecule/"
    # Require modern CPU (gitleaks binary uses POPCNT/SSE4.2 - OptiPlex Core 2 Quads crash with SIGILL)
    KUBERNETES_NODE_SELECTOR_CPU: "esweiss.com/cpu=modern"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ============================================================================
# GATE STAGE - Validation gate for deploy jobs
# ============================================================================
# All deploy jobs depend on this gate (non-optional). The gate lists every
# lint/test/security job as a dependency. GitLab CI `optional: true` semantics
# (https://docs.gitlab.com/ci/yaml/#needsoptional):
#
#   - If the needed job was NOT created (rules excluded it): dependency is ignored
#   - If the needed job IS in the pipeline and SUCCEEDS: dependency satisfied
#   - If the needed job IS in the pipeline and FAILS: the dependent job is BLOCKED
#
# Jobs with `changes:` path filters use optional:true (may not exist in pipeline).
# Jobs that ALWAYS run on main pushes (no path filter) are non-optional.
#
# Net effect: all applicable checks must pass before any deploy job runs.

validation-gate:
  stage: gate
  image: alpine:latest
  needs:
    # -- Path-filtered jobs (may not exist in pipeline) --
    - job: shellcheck
      optional: true
    - job: yaml-lint
      optional: true
    - job: ansible-lint
      optional: true
    - job: terraform-fmt
      optional: true
    - job: terraform-validate
      optional: true
    - job: terraform-plan
      optional: true
    - job: flux-versions-sync
      optional: true
    - job: flux-lint
      optional: true
    - job: python-tests
      optional: true
    - job: molecule-tests
      optional: true
    - job: integration-tests
      optional: true
    # -- Always-run jobs (no path filter, always present on main pushes) --
    - job: secret_detection
  script:
    - echo "All applicable checks passed - deploy jobs may proceed"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'

# ============================================================================
# DEPLOY STAGE - Auto-deploy on merge to main
# ============================================================================

# ------------------------------------------------------------------------------
# Terraform
# ------------------------------------------------------------------------------

deploy-terraform:
  stage: deploy
  image:
    name: hashicorp/terraform:1.5
    entrypoint: [""]
  variables:
    TF_HTTP_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/cloudflare"
    TF_HTTP_LOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/cloudflare/lock"
    TF_HTTP_UNLOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/cloudflare/lock"
    TF_HTTP_USERNAME: "gitlab-ci-token"
    TF_HTTP_PASSWORD: "${CI_JOB_TOKEN}"
    TF_HTTP_LOCK_METHOD: "POST"
    TF_HTTP_UNLOCK_METHOD: "DELETE"
    TF_HTTP_RETRY_WAIT_MIN: "5"
  needs:
    - job: validation-gate
    - job: terraform-plan
      artifacts: true
  before_script:
    - !reference [.install-1password-alpine, before_script]
  script:
    - cd terraform/cloudflare
    - terraform init
    - |
      export TF_VAR_cloudflare_api_token=$(op read "op://Homelab/Cloudflare DNS Token/credential")
      export TF_VAR_cloudflare_account_id=$(op read "op://Homelab/Cloudflare DNS Token/username")
      terraform apply -auto-approve tfplan
  environment:
    name: production/cloudflare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - terraform/**

