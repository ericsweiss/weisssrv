# GitLab CI/CD Pipeline for weisssrv Homelab Infrastructure
#
# Canonical source: https://git.ericsweiss.com/eric/weisssrv
# GitHub mirror: https://github.com/ericsweiss/weisssrv (read-only)
#
# Pipeline Features:
# - Full validation suite (lint, test, security)
# - Auto-deployment on merge to main (after tests pass)
# - 1Password integration for all secrets
# - Service restarts: automatic
# - Machine reboots: manual approval required (maintenance jobs auto-reboot when triggered)
#
# Required CI/CD Variables (Settings > CI/CD > Variables):
# - OP_SERVICE_ACCOUNT_TOKEN (masked, protected) - 1Password service account
#
# Optional CI/CD Variables:
# - GH_API_TOKEN (masked) - For version checker API rate limits
#
# Pipeline triggers:
# - Merge requests: Validation only (no deploy)
# - Push to main: Validation + auto-deploy
# - Scheduled: Version checking and secret detection only (all other jobs excluded via when: never)
# - Manual (web): Lint, validate, test, security stages only (deploy/gate/maintenance excluded)

stages:
  - build
  - lint
  - validate
  - test
  - security
  - ai-review
  - gate
  - deploy
  # All maintenance jobs (6 ops, maintenance-run-all wrapper, and the
  # ad-hoc maintenance-verify cluster-health button) are in this single
  # stage. Each maintenance op embeds the verify script as its final
  # step (see scripts/post-maintenance-verify.sh) so verify always runs
  # right after the op in the same CI job — no cross-job needs/stage
  # gymnastics, and no GitLab manual-job semantic quirks to navigate.
  - maintenance

# ============================================================================
# Default settings
# ============================================================================
default:
  image: python:3.11-slim
  # All weisssrv jobs run on the privileged infrastructure runner.
  # The shared non-privileged runner (k8s-deploy) is for other GitLab projects.
  tags: [infrastructure]
  # Cancel jobs when the same branch gets a newer pipeline. Deploy/maintenance
  # jobs override this to false to ensure they always complete.
  interruptible: true

# ============================================================================
# Workflow rules - when to run the pipeline
# ============================================================================
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ============================================================================
# Templates for reuse
# ============================================================================
.ansible-base:
  variables:
    # GitLab checkout is world-writable, causing Ansible to ignore ansible.cfg
    # Use absolute roles path; config is copied to a secure temp file in before_script
    ANSIBLE_ROLES_PATH: ${CI_PROJECT_DIR}/ansible/roles
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq git
    - |
      # Copy ansible.cfg to unpredictable temp path (avoids symlink attacks in /tmp)
      export ANSIBLE_CONFIG="$(mktemp /tmp/ansible-XXXXXXXXXX.cfg)"
      install -m 600 ansible/ansible.cfg "$ANSIBLE_CONFIG"
      trap "rm -f '$ANSIBLE_CONFIG'" EXIT
    - pip install --quiet ansible==11.6.0 ansible-lint==25.12.2
    - ansible-galaxy collection install -r ansible/requirements.yml

.install-1password:
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl gnupg openssh-client
    - |
      # Install 1Password CLI
      curl -sS https://downloads.1password.com/linux/keys/1password.asc | \
        gpg --dearmor --output /usr/share/keyrings/1password-archive-keyring.gpg
      echo "deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main" \
        > /etc/apt/sources.list.d/1password.list
      apt-get update -qq && apt-get install -y -qq 1password-cli
    - op --version

.install-1password-alpine:
  before_script:
    - apk add --no-cache curl bash gnupg jq
    - |
      # 1Password's apk repo is signed with their published RSA key; fetch the
      # public key into /etc/apk/keys under its exact filename so apk can verify
      # the index. The older `curl 1password.asc | gpg --dearmor` form broke once
      # 1Password moved to this RSA key — apk reported "UNTRUSTED signature" and
      # 1password-cli became unselectable. See 1password.dev/cli/get-started.
      curl -sSf https://downloads.1password.com/linux/keys/alpinelinux/support@1password.com-61ddfc31.rsa.pub \
        -o /etc/apk/keys/support@1password.com-61ddfc31.rsa.pub
      echo "https://downloads.1password.com/linux/alpinelinux/stable/" >> /etc/apk/repositories
      apk update
      apk add --no-cache 1password-cli
    - op --version

.deploy-base:
  extends: .install-1password
  # Deploys touch shared infrastructure; never cancel a running deploy when a new
  # pipeline starts — wait for it to complete instead.
  interruptible: false
  # Runner-pod casualties (scheduling timeout, NoExecute taint eviction
  # when a node degrades mid-job — pipeline 355 lost deploy-ansible-base
  # to DeletionByTaintManager) are environmental, and the playbooks are
  # idempotent: retry instead of failing the whole needs chain.
  retry:
    max: 2
    when:
      - runner_system_failure
  variables:
    ANSIBLE_ROLES_PATH: ${CI_PROJECT_DIR}/ansible/roles
  before_script:
    - !reference [.install-1password, before_script]
    - pip install --quiet ansible==11.6.0
    - |
      # Copy ansible.cfg to secure temp path (world-writable checkout causes Ansible to ignore it)
      export ANSIBLE_CONFIG="$(mktemp /tmp/ansible-XXXXXXXXXX.cfg)"
      install -m 600 ansible/ansible.cfg "$ANSIBLE_CONFIG"
      trap "rm -f '$ANSIBLE_CONFIG'" EXIT
    - |
      # Setup SSH from 1Password
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      op read "op://Homelab/SSH Key/private key" > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      # ----------------------------------------------------------------
      # ssh-keyscan to populate known_hosts: this is TOFU (trust on
      # first use) — the runner blindly accepts whatever fingerprint
      # the host serves at the moment of the keyscan. Each CI runner
      # is ephemeral, so there's no persistent known_hosts to inherit
      # from a prior trusted handshake; fetching fresh per-job is the
      # only way to drive Ansible without baking host keys into the
      # runner image (which has its own staleness/rotation problems).
      #
      # Threat model: an attacker would need to MITM both the runner's
      # network path AND the target host's network path simultaneously
      # for the same job window. On a single-LAN single-operator
      # homelab this is a high bar, and the blast radius is bounded
      # to the tasks the deploy pipeline already runs as root via the
      # SSH key fetched from 1Password. We accept this trade-off in
      # exchange for not having to maintain a host_key store in CI.
      #
      # Strict pinning IS enforced on the operator path:
      #   - ansible/ansible.cfg uses StrictHostKeyChecking=accept-new
      #     + UserKnownHostsFile=~/.ssh/known_hosts (TOFU on first
      #     contact, then strict on every subsequent connection from
      #     that workstation).
      #   - Cert distribution (acme_certs role) is fully pinned via
      #     ansible/inventories/prod/host_vars/dns-01.yml host_key
      #     fields — populated via `task certs:show-host-keys`.
      # See those locations for the strict-pinning surface area.
      # ----------------------------------------------------------------
      # Add known hosts for all infrastructure (Proxmox hosts, services, k3s VMs)
      ssh-keyscan -H 192.168.0.102 192.168.0.103 192.168.0.104 192.168.0.105 192.168.0.106 192.168.0.107 >> ~/.ssh/known_hosts 2>/dev/null || true
      ssh-keyscan -H 192.168.0.150 192.168.0.151 192.168.0.152 192.168.0.153 192.168.0.154 192.168.0.160 >> ~/.ssh/known_hosts 2>/dev/null || true
      ssh-keyscan -H 192.168.0.202 192.168.0.203 192.168.0.204 192.168.0.205 192.168.0.206 192.168.0.207 >> ~/.ssh/known_hosts 2>/dev/null || true
      ssh-keyscan -H 192.168.0.222 192.168.0.223 192.168.0.227 >> ~/.ssh/known_hosts 2>/dev/null || true
    - ansible-galaxy collection install -r ansible/requirements.yml

# Maintenance jobs need both ansible (from .deploy-base) and kubectl
# (so each job can call scripts/post-maintenance-verify.sh after its
# playbook). Extends .deploy-base, then layers in the kubectl install
# + kubeconfig setup that .k3s-deploy-base does.
.maintenance-base:
  extends: .deploy-base
  before_script:
    - !reference [.deploy-base, before_script]
    - apt-get install -y -qq jq
    - |
      # kubectl install (matches .k3s-deploy-base, same pinned checksum)
      curl -fsSL "https://dl.k8s.io/release/v1.35.2/bin/linux/amd64/kubectl" -o /tmp/kubectl
      echo "924eb50779153f20cb668117d141440b95df2f325a64452d78dff9469145e277  /tmp/kubectl" | sha256sum -c -
      install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
    - |
      # Kubeconfig from 1Password (base64-encoded; matches .k3s-deploy-base)
      set -eo pipefail
      mkdir -p ~/.kube
      KUBECONFIG_B64=$(op read "op://Homelab/K3s Kubeconfig/kubeconfig")
      if [ -z "$KUBECONFIG_B64" ]; then
        echo "ERROR: op read returned empty kubeconfig. Is OP_SERVICE_ACCOUNT_TOKEN set?"
        exit 1
      fi
      echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
      chmod 600 ~/.kube/config
      export KUBECONFIG="$HOME/.kube/config"

.k3s-deploy-base:
  extends: .install-1password
  # Use Debian-based image (Alpine musl resolver has issues with k8s ndots:5)
  image: python:3.11-slim
  # k3s deploys/verifies touch the cluster; never interrupt mid-run.
  interruptible: false
  before_script:
    - !reference [.install-1password, before_script]
    - apt-get install -y -qq jq
    - |
      # Install kubectl (pinned checksum for supply-chain integrity).
      # helm and yq removed — Flux manages chart deployments; no CI job needs them
      # jq comes from apt above — used by deploy-verify to parse kubectl JSON output (Flux CR readiness checks).
      curl -fsSL "https://dl.k8s.io/release/v1.35.2/bin/linux/amd64/kubectl" -o /tmp/kubectl
      echo "924eb50779153f20cb668117d141440b95df2f325a64452d78dff9469145e277  /tmp/kubectl" | sha256sum -c -
      install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
    - |
      # Setup kubeconfig from 1Password (stored as base64 to preserve YAML formatting).
      # Only the verify jobs still need this; all workload deploys are Flux-managed.
      set -eo pipefail
      mkdir -p ~/.kube
      KUBECONFIG_B64=$(op read "op://Homelab/K3s Kubeconfig/kubeconfig")
      if [ -z "$KUBECONFIG_B64" ]; then
        echo "ERROR: op read returned empty kubeconfig. Is OP_SERVICE_ACCOUNT_TOKEN set?"
        exit 1
      fi
      echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
      chmod 600 ~/.kube/config
      export KUBECONFIG="$HOME/.kube/config"
      echo "Kubeconfig written ($(wc -c < ~/.kube/config) bytes), KUBECONFIG=$KUBECONFIG"
    # Skipping `kubectl cluster-info` — requires list perms on kube-system
    # services, which the runner ServiceAccount lacks. Per-job kubectl calls
    # target narrower scopes and use the K3s Kubeconfig credentials.
    - kubectl version --output=yaml --request-timeout=5s

# ============================================================================
# BUILD STAGE - Container images
# ============================================================================

build-molecule-images:
  # Pushes images consumed by later jobs in this pipeline; do not interrupt.
  interruptible: false
  # Builds both CI images:
  # - molecule-test: the container molecule spins up (has all role apt deps)
  # - molecule-ci: the GitLab CI runner image (has docker-cli + molecule + ansible)
  # Only rebuilds when Dockerfiles or requirements change.
  stage: build
  image: python:3.11
  services:
    - docker:24.0-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apt-get update -qq && apt-get install -y -qq docker.io
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # molecule-test: the container roles run inside
    - docker build -t "${CI_REGISTRY_IMAGE}/molecule-test:${CI_COMMIT_SHORT_SHA}" docker/molecule-test/
    - docker push "${CI_REGISTRY_IMAGE}/molecule-test:${CI_COMMIT_SHORT_SHA}"
    # molecule-ci: the GitLab CI runner image (docker-cli + pip deps + collections)
    - docker build -t "${CI_REGISTRY_IMAGE}/molecule-ci:${CI_COMMIT_SHORT_SHA}" -f docker/molecule-ci/Dockerfile .
    - docker push "${CI_REGISTRY_IMAGE}/molecule-ci:${CI_COMMIT_SHORT_SHA}"
    # Capture the immutable digest for both images and emit them as
    # dotenv variables. Downstream jobs that `needs:` this build use
    # the digest reference (`<image>@sha256:...`) instead of `:latest`,
    # so a same-pipeline rebuild can't be raced by anyone retagging
    # `:latest` mid-flight.
    - MOLECULE_TEST_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${CI_REGISTRY_IMAGE}/molecule-test:${CI_COMMIT_SHORT_SHA}")
    - MOLECULE_CI_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${CI_REGISTRY_IMAGE}/molecule-ci:${CI_COMMIT_SHORT_SHA}")
    - echo "MOLECULE_TEST_IMAGE=${MOLECULE_TEST_DIGEST}" > molecule-images.env
    - echo "MOLECULE_CI_IMAGE=${MOLECULE_CI_DIGEST}" >> molecule-images.env
    - cat molecule-images.env
    # Only push :latest on main — MR pipelines use SHA tags to avoid
    # overwriting :latest with unmerged branch images. The digest pin
    # above is the load-bearing reference; :latest is only used as a
    # fallback for pipelines where build doesn't run (Dockerfile/reqs
    # unchanged), and even then it's the previous main's image.
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "${CI_REGISTRY_IMAGE}/molecule-test:${CI_COMMIT_SHORT_SHA}" "${CI_REGISTRY_IMAGE}/molecule-test:latest"
        docker push "${CI_REGISTRY_IMAGE}/molecule-test:latest"
        docker tag "${CI_REGISTRY_IMAGE}/molecule-ci:${CI_COMMIT_SHORT_SHA}" "${CI_REGISTRY_IMAGE}/molecule-ci:latest"
        docker push "${CI_REGISTRY_IMAGE}/molecule-ci:latest"
      fi
  artifacts:
    reports:
      dotenv: molecule-images.env
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - docker/molecule-test/**/*
        - docker/molecule-ci/**/*
        - requirements.txt
        - ansible/requirements.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - docker/molecule-test/**/*
        - docker/molecule-ci/**/*
        - requirements.txt
        - ansible/requirements.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# ============================================================================
# LINT STAGE - Code quality checks
# ============================================================================

shellcheck:
  needs: []
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - echo "Running ShellCheck..."
    - shellcheck --severity=warning --exclude=SC1091,SC2034 scripts/*.sh
    - |
      # Also lint shell scripts shipped in Ansible roles
      find ansible/roles -name '*.sh' -type f | while read -r script; do
        echo "Checking: $script"
        shellcheck --severity=warning --exclude=SC1091,SC2034 "$script"
      done
    - |
      # Lint shell-script Jinja templates (*.sh.j2) shipped in roles —
      # including the boot-time crypto-unlock units. We can't render real
      # values in CI, so neutralize Jinja first. The {% %} strip + the {{ }} and
      # literal-brace substitutions are safe everywhere; the {# #} comment-RANGE
      # delete is NOT — it eats bash ${#arr[@]} (array length) and corrupts the
      # body. So for {% raw %}-wrapped scripts (whose body is literal bash) drop
      # the comment-RANGE rule and instead delete only FULL-LINE {# ... #} Jinja
      # comments (anchored ^...$, so it can't touch a mid-line ${#...}), while
      # still neutralizing any {{ }} that sits OUTSIDE the raw block (e.g. quoted
      # header vars). Plain templates keep the full neutralizer. Either way this
      # catches shell logic/quoting bugs in the body, not Jinja correctness.
      # CONSTRAINT: a MULTI-LINE or inline {# #} Jinja comment in the out-of-raw
      # header of a {% raw %}-wrapped *.sh.j2 is still not stripped (only full-line
      # ones are); keep header comments to single full lines. (Out-of-raw {{ }}
      # expressions are fine in any quantity — still neutralized to JINJA.)
      rendered=$(mktemp)
      find ansible/roles -name '*.sh.j2' -type f | while read -r tmpl; do
        echo "Checking: $tmpl"
        if grep -Eq '^[[:space:]]*\{%-?[[:space:]]*raw[[:space:]]*-?%\}[[:space:]]*$' "$tmpl"; then
          sed -E \
            -e '/^[[:space:]]*\{#.*#\}[[:space:]]*$/d' \
            -e '/\{%.*%\}/d' \
            -e 's/\{\{"\{"\}\}/{/g' \
            -e 's/\{\{"\}"\}\}/}/g' \
            -e 's/\{\{[^}]*\}\}/JINJA/g' "$tmpl" > "$rendered"
        else
          sed -E \
            -e '/\{#/,/#\}/d' \
            -e '/\{%.*%\}/d' \
            -e 's/\{\{"\{"\}\}/{/g' \
            -e 's/\{\{"\}"\}\}/}/g' \
            -e 's/\{\{[^}]*\}\}/JINJA/g' "$tmpl" > "$rendered"
        fi
        shellcheck --severity=warning --exclude=SC1091,SC2034 "$rendered"
      done
      rm -f "$rendered"
    - echo "ShellCheck passed"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - scripts/**/*
        - ansible/roles/**/*.sh
        - ansible/roles/**/*.sh.j2
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - scripts/**/*
        - ansible/roles/**/*.sh
        - ansible/roles/**/*.sh.j2
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Catches role changes that aren't mapped to any deploy-* job. Fails
# loudly with a list of unmapped roles + the two ways to resolve. See
# scripts/check-deploy-coverage.sh for the gate logic and the
# INTENTIONALLY_UNMAPPED_ROLES list.
deploy-coverage-check:
  needs: []
  stage: lint
  # Switched from `alpine:3.19` to `python:3.11-slim` because the runner
  # pod's `apk add ... dl-cdn.alpinelinux.org` started returning DNS lookup
  # errors mid-pipeline. python:3.11-slim is Debian-based, ships bash +
  # coreutils + python3, and we only need to apt-get git + PyYAML (one
  # round-trip vs apk's six-package install). Same effective dependency
  # set, no Alpine CDN dependency.
  image: python:3.11-slim
  variables:
    # The script `git merge-base --is-ancestor BASE_REF HEAD` guard
    # rejects unrelated histories — which a default depth-20 GitLab
    # CI clone surfaces as a false positive whenever the MR base is
    # >20 commits behind HEAD. GIT_DEPTH: 0 forces a full clone so
    # the merge-base is always reachable.
    GIT_DEPTH: 0
  before_script:
    # python3 + PyYAML: scripts/check-deploy-coverage.sh parses
    # .gitlab-ci.yml as YAML to extract deploy-job rules (scoped to
    # name=deploy-* AND stage=deploy). Plain `grep -oE` would match
    # paths inside lint/test job rules and report false coverage.
    - apt-get update -qq && apt-get install -y --no-install-recommends git
    - pip install --no-cache-dir --quiet PyYAML
  script:
    - bash scripts/check-deploy-coverage.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ansible/roles/**/*
        - ansible/playbooks/**/*
        # Covers group_vars/, host_vars/, hosts.yml, and any other
        # top-level inventory file under ansible/inventories/prod/.
        - ansible/inventories/prod/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ansible/roles/**/*
        - ansible/playbooks/**/*
        - ansible/inventories/prod/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# Fails if a molecule scenario (ansible/roles/*/molecule/*/) or an integration
# test (ansible/integration-tests/*/) exists on disk with no corresponding
# entry in the molecule-tests / integration-tests parallel:matrix. Prevents a
# new role's tests from silently never running in CI. See
# scripts/check-molecule-matrix-coverage.sh.
molecule-matrix-coverage-check:
  needs: []
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install --no-cache-dir --quiet PyYAML
  script:
    - bash scripts/check-molecule-matrix-coverage.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ansible/roles/**/molecule/**/*
        - ansible/integration-tests/**/*
        - scripts/check-molecule-matrix-coverage.sh
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ansible/roles/**/molecule/**/*
        - ansible/integration-tests/**/*
        - scripts/check-molecule-matrix-coverage.sh
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'

# deploy-verify hardcodes FLUX_VERSION + tarball sha256 as a pin pair
# (supply-chain), with a runtime guard against versions-configmap. But
# deploy-verify only runs on main, so a flux_version bump that forgets
# the CI pin would surface AFTER merge. This job runs the same drift
# check in MR pipelines so the incomplete bump fails before merge.
flux-version-pin-check:
  needs: []
  stage: lint
  image: python:3.11-slim
  script:
    - |
      set -eu
      PIN=$(sed -n 's/^ *FLUX_VERSION="\([0-9.]*\)"$/\1/p' .gitlab-ci.yml | head -1)
      CM=$(sed -n 's/^ *flux_version: *//p' kubernetes/infrastructure/sources/versions-configmap.yaml | head -1)
      echo "deploy-verify FLUX_VERSION pin: ${PIN:-<not found>} / versions-configmap flux_version: ${CM:-<not found>}"
      [ -n "$PIN" ] || { echo "Could not extract FLUX_VERSION pin from .gitlab-ci.yml"; exit 1; }
      [ -n "$CM" ] || { echo "Could not extract flux_version from versions-configmap.yaml"; exit 1; }
      [ "$PIN" = "$CM" ] || { echo "FLUX_VERSION pin (${PIN}) drifted from versions-configmap flux_version (${CM}) — bump the deploy-verify version + sha256 pair in .gitlab-ci.yml"; exit 1; }
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab-ci.yml
        - kubernetes/infrastructure/sources/versions-configmap.yaml
        - ansible/inventories/prod/group_vars/all.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - .gitlab-ci.yml
        - kubernetes/infrastructure/sources/versions-configmap.yaml
        - ansible/inventories/prod/group_vars/all.yml

yaml-lint:
  needs: []
  stage: lint
  before_script:
    - apt-get update -qq
    - pip install --quiet yamllint==1.37.1
  script:
    - yamllint -d relaxed ansible/
    - yamllint -d relaxed kubernetes/
    - yamllint -d relaxed .gitlab-ci.yml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ansible/**/*
        - kubernetes/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ansible/**/*
        - kubernetes/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'

ansible-lint:
  needs: []
  stage: lint
  extends: .ansible-base
  script:
    - cd ansible
    - |
      export SSH_PUBLIC_KEY="ssh-ed25519 AAAA_PLACEHOLDER_FOR_CI_SYNTAX_CHECK"
      export SMTP_RELAY_USER="ci-placeholder"
      export SMTP_RELAY_PASSWORD="ci-placeholder"
      for playbook in playbooks/*.yml playbooks/*/*.yml; do
        if [ -f "$playbook" ]; then
          # Skip task include files (convention: prefix with underscore)
          # POSIX-compatible pattern match (works in sh, not just bash)
          case "$(basename "$playbook")" in
            _*)
              echo "Skipping task include: $playbook"
              continue
              ;;
          esac
          echo "Checking syntax: $playbook"
          ansible-playbook --syntax-check -i inventories/prod "$playbook"
        fi
      done
    - ansible-lint playbooks/ roles/
    - |
      echo "Validating proxmox_ha role structure..."
      for task_file in roles/proxmox_ha/tasks/*.yml; do
        echo "Validating YAML: $task_file"
        python3 -c "import yaml; yaml.safe_load(open('$task_file'))"
      done
      for f in main.yml rules.yml resources.yml replication.yml; do
        test -f "roles/proxmox_ha/tasks/$f" || { echo "ERROR: $f missing"; exit 1; }
        echo "  Found: $f"
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ansible/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ansible/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'

terraform-fmt:
  needs: []
  stage: lint
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]
  script:
    - cd terraform/cloudflare
    - terraform fmt -check -recursive
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - terraform/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - terraform/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ============================================================================
# AI-REVIEW STAGE - AI-powered code review on MRs
# ============================================================================

# PR-Agent by Qodo - AI code review
# Requires: GitLab API Token and OpenAI API Key in 1Password
pr-agent-review:
  stage: ai-review
  needs:
    # Wait for lint + security only — no need to block on slow test jobs.
    # AI review benefits from knowing the code is lint-clean and secret-safe
    # but doesn't depend on molecule/integration test results.
    - job: shellcheck
      optional: true
    - job: yaml-lint
      optional: true
    - job: ansible-lint
      optional: true
    - job: terraform-fmt
      optional: true
    - job: flux-versions-sync
      optional: true
    - job: flux-lint
      optional: true
    - job: secret_detection
  # Pinned by digest to prevent supply-chain surprises on a job that handles
  # both a GitLab PAT and an OpenAI key. Bump alongside upstream releases.
  image: codiumai/pr-agent:0.34@sha256:1c1743e93bf6627cd14528cd4defe82465f17860e8f20e6c0ac6558971f61c61
  variables:
    CONFIG__GIT_PROVIDER: "gitlab"
    GITLAB__URL: "https://git.ericsweiss.com"
    # CONFIG__MODEL pinned to gpt-5.3-codex (code-review-tuned).
    # See: https://qodo-merge-docs.qodo.ai/usage-guide/changing_a_model/
    CONFIG__MODEL: "gpt-5.3-codex"
    # Maximize review depth: use full context window and maximum effort
    CONFIG__MAX_MODEL_TOKENS: "128000"
    CONFIG__REASONING_EFFORT: "high"
    PR_REVIEWER__NUM_CODE_SUGGESTIONS: "6"
    PR_REVIEWER__EXTRA_INSTRUCTIONS: "Be thorough. Review every file. Flag all bugs, security issues, and documentation drift."
    PR_CODE_SUGGESTIONS__NUM_CODE_SUGGESTIONS: "6"
  before_script:
    - !reference [.install-1password, before_script]
  script:
    - |
      # Get secrets from 1Password
      export GITLAB__PERSONAL_ACCESS_TOKEN=$(op read "op://Homelab/GitLab API Token/credential")
      export OPENAI__KEY=$(op read "op://Homelab/OpenAI API Key/api-key")

      echo "Running AI code review on MR !${CI_MERGE_REQUEST_IID}..."
      echo "Model: gpt-5.3-codex"

      # Run full review
      python -m pr_agent.cli \
        --pr_url="https://git.ericsweiss.com/eric/weisssrv/-/merge_requests/${CI_MERGE_REQUEST_IID}" \
        review

      # Suggest improvements
      python -m pr_agent.cli \
        --pr_url="https://git.ericsweiss.com/eric/weisssrv/-/merge_requests/${CI_MERGE_REQUEST_IID}" \
        improve

      echo "AI review complete"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # OPERATIONAL INVARIANT: the && $OP_SERVICE_ACCOUNT_TOKEN guard means this
    # job is never CREATED when the token is unset (e.g. fork MRs). An absent
    # AI review is therefore expected, not a failure — a missing pr-agent-review
    # on such an MR is not a regression. validation-gate does NOT need this job
    # (AI review is advisory), so its absence never blocks deploys.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $OP_SERVICE_ACCOUNT_TOKEN'
  allow_failure: true  # Don't block MRs on AI review
  timeout: 30m

# ============================================================================
# VALIDATE STAGE - Schema and configuration validation
# ============================================================================

terraform-validate:
  needs: []
  stage: validate
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]
  script:
    - cd terraform/cloudflare
    - terraform init -backend=false
    - terraform validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - terraform/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - terraform/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'

terraform-plan:
  needs: []
  stage: validate
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]
  variables:
    TF_HTTP_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/cloudflare"
    TF_HTTP_LOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/cloudflare/lock"
    TF_HTTP_UNLOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/cloudflare/lock"
    TF_HTTP_USERNAME: "gitlab-ci-token"
    TF_HTTP_PASSWORD: "${CI_JOB_TOKEN}"
    TF_HTTP_LOCK_METHOD: "POST"
    TF_HTTP_UNLOCK_METHOD: "DELETE"
    TF_HTTP_RETRY_WAIT_MIN: "5"
  before_script:
    - !reference [.install-1password-alpine, before_script]
  script:
    - cd terraform/cloudflare
    # -lockfile=readonly: CI must not rewrite .terraform.lock.hcl (provider
    # hashes are committed; a CI-side change would mask supply-chain drift).
    - terraform init -lockfile=readonly
    - |
      export TF_VAR_cloudflare_api_token=$(op read "op://Homelab/Cloudflare DNS Token/credential")
      export TF_VAR_cloudflare_account_id=$(op read "op://Homelab/Cloudflare DNS Token/username")
      terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan
    # Generate plan report for MR widget (shows resource change counts in merge requests)
    - terraform show -json tfplan | jq -r '
        ([.resource_changes[]?.change.actions?]|flatten)|
        {"create":(map(select(.=="create"))|length),
         "update":(map(select(.=="update"))|length),
         "delete":(map(select(.=="delete"))|length)}
      ' > tfplan.json
  artifacts:
    paths:
      - terraform/cloudflare/tfplan
    reports:
      terraform: terraform/cloudflare/tfplan.json
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # OPERATIONAL INVARIANT: the && $OP_SERVICE_ACCOUNT_TOKEN guard means a
    # terraform/ change on a tokenless pipeline (e.g. fork MR) produces NO plan
    # — the MR widget will simply lack a Terraform report. That's an expected
    # skip, not a clean plan. validation-gate needs this job optionally, so a
    # token-gated skip can't silently mask drift on a real (token-bearing) run.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - terraform/**/*
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - terraform/**/*

flux-versions-sync:
  needs: []
  # Fails if kubernetes/infrastructure/sources/versions-configmap.yaml is out
  # of sync with ansible/inventories/prod/group_vars/all.yml. Run
  # `task flux:sync-versions` locally to regenerate and commit.
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install --quiet pyyaml
  script:
    # Compare committed ConfigMap against a freshly-generated one. The
    # generator writes in-place, so we save + restore the committed file
    # to keep the workspace clean for other jobs (e.g., flux-lint).
    - |
      set -eo pipefail
      TARGET=kubernetes/infrastructure/sources/versions-configmap.yaml
      cp "$TARGET" /tmp/committed.yaml
      python3 scripts/generate-versions-configmap.py
      cp "$TARGET" /tmp/generated.yaml
      cp /tmp/committed.yaml "$TARGET"   # restore workspace
      if ! diff -q /tmp/committed.yaml /tmp/generated.yaml >/dev/null 2>&1; then
        echo "ERROR: versions-configmap.yaml is out of sync with all.yml"
        echo "Run: task flux:sync-versions and commit the result."
        diff -u /tmp/committed.yaml /tmp/generated.yaml || true
        exit 1
      fi
      echo "versions-configmap.yaml is in sync with all.yml"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ansible/inventories/prod/group_vars/all.yml
        - kubernetes/infrastructure/sources/versions-configmap.yaml
        - scripts/generate-versions-configmap.py
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ansible/inventories/prod/group_vars/all.yml
        - kubernetes/infrastructure/sources/versions-configmap.yaml
        - scripts/generate-versions-configmap.py
    - if: '$CI_PIPELINE_SOURCE == "web"'

python-tests:
  # Runs pytest against scripts/. test_*.py live next to the scripts they
  # exercise (version-update tooling, the ConfigMap generator, the HPA/VPA
  # invariant guard).
  stage: test
  needs: []  # run in parallel with lint stage
  image: python:3.11-slim
  before_script:
    # git is required by test_check_deploy_coverage.py (it builds throwaway git
    # repos to exercise check-deploy-coverage.sh); the slim image omits it.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - pip install --quiet pytest pyyaml
  script:
    - pytest scripts/ -v --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - scripts/**/*
        - ansible/inventories/prod/group_vars/all.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - scripts/**/*
        - ansible/inventories/prod/group_vars/all.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'

flux-lint:
  needs: []
  # Renders every top-level Flux Kustomization, substitutes postBuild vars
  # from kubernetes/infrastructure/sources/versions-configmap.yaml, verifies
  # zero unsubstituted ${var} placeholders remain, then validates with
  # kubeconform. Replaces the old per-chart helm template + find-based
  # kubeconform jobs.
  stage: lint
  image: python:3.11-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl gettext-base
    - pip install --quiet pyyaml
    - |
      KUBECONFORM_SHA256="95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73"
      curl -fsSL -o /tmp/kubeconform.tar.gz \
        https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
      echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
      tar xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      curl -fsSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz -o /tmp/kustomize.tar.gz
      echo "3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7  /tmp/kustomize.tar.gz" | sha256sum -c -
      tar xzf /tmp/kustomize.tar.gz -C /usr/local/bin kustomize
      kubeconform -v && kustomize version && envsubst --version | head -1
  script:
    - |
      set -eo pipefail
      FAILED=0
      # Extract cluster-versions ConfigMap keys and export as env so envsubst
      # can substitute ${var} placeholders in rendered manifests. This mirrors
      # what Flux's kustomize-controller does at reconcile time (postBuild).
      VERSIONS_CONFIGMAP=kubernetes/infrastructure/sources/versions-configmap.yaml
      VARS_OUTPUT=$(python3 -c "
      import yaml
      with open('$VERSIONS_CONFIGMAP') as f:
          doc = yaml.safe_load(f)
      for k, v in doc.get('data', {}).items():
          print(f'{k}\t{v}')
      ") || { echo "ERROR: Failed to extract version keys from $VERSIONS_CONFIGMAP"; exit 1; }
      if [ -z "$VARS_OUTPUT" ]; then
        echo "ERROR: No version keys found in $VERSIONS_CONFIGMAP"
        exit 1
      fi
      while IFS=$'\t' read -r k v; do
        [ -n "$k" ] && export "$k=$v"
      done <<< "$VARS_OUTPUT"
      ENVSUBST_VARS=$(echo "$VARS_OUTPUT" | awk -F'\t' '{printf "${%s} ", $1}')

      # Accumulate the full rendered corpus so the HPA/VPA invariant check
      # (below) sees standalone HPAs + VPAs across every namespace at once.
      # Mirrors the Taskfile flux:lint RENDER_ALL pattern.
      RENDER_ALL=$(mktemp)
      trap 'rm -f "$RENDER_ALL"' EXIT

      # Iterate every Flux Kustomization under clusters/weisssrv/ and validate
      # the target path it points at. This picks up new top-level Kustomizations
      # automatically without CI edits.
      for ks in kubernetes/clusters/weisssrv/*.yaml; do
        [ -f "$ks" ] || continue
        NAME=$(basename "$ks" .yaml)
        [ "$NAME" = "kustomization" ] && continue
        if ! SRCPATH=$(python3 -c "
      import yaml, sys
      with open('$ks') as f:
          doc = yaml.safe_load(f)
      print(doc.get('spec', {}).get('path', '') or '')
      "); then
          echo "ERROR: failed to parse $ks"
          FAILED=1
          continue
        fi
        [ -z "$SRCPATH" ] && continue
        SRCPATH="${SRCPATH#./}"
        echo "=== Building + validating $ks (path $SRCPATH) ==="
        if ! RAW=$(kustomize build "$SRCPATH" 2>&1); then
          echo "ERROR: kustomize build failed for $SRCPATH:"
          echo "$RAW"
          FAILED=1
          continue
        fi
        # Check every ${var} reference in the pre-substitution output against
        # the exported ConfigMap keys. envsubst renders unknown vars as empty
        # string (so post-substitution grep wouldn't catch them) — Flux has
        # the same silent-empty default behavior. Our lint is intentionally
        # stricter so typos in version keys fail CI.
        MISSING=""
        for ref in $(echo "$RAW" | grep -oE '\$\{[A-Za-z_][A-Za-z0-9_]*\}' | sort -u); do
          varname=${ref#\$\{}
          varname=${varname%\}}
          if [ -z "${!varname+x}" ]; then
            MISSING="$MISSING $varname"
          fi
        done
        MISSING=$(echo "$MISSING" | tr ' ' '\n' | grep -v '^$' | sort -u || true)
        if [ -n "$MISSING" ]; then
          echo "ERROR: placeholders in $SRCPATH reference keys not in versions-configmap:"
          echo "$MISSING" | sed 's/^/  - /'
          FAILED=1
          continue
        fi
        RENDERED=$(echo "$RAW" | envsubst "$ENVSUBST_VARS")
        printf '%s\n---\n' "$RENDERED" >> "$RENDER_ALL"
        if ! echo "$RENDERED" | kubeconform -strict -ignore-missing-schemas \
            -kubernetes-version 1.35.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -summary; then
          FAILED=1
        fi
      done

      # HPA/VPA invariant: no workload may have both an HPA and a VPA driving
      # the same resource (docs/33-autoscaling.md). --require-chart-native-vpas
      # also statically asserts the chart-native-HPA workloads
      # (Traefik/authentik/Connect) each have a memory-only VPA in the rendered
      # corpus. MUST match the Taskfile flux:lint invocation — without the flag
      # the gate would silently skip the chart-native assertion.
      echo "=== Checking HPA/VPA invariant ==="
      if ! python3 scripts/check-hpa-vpa-invariant.py --require-chart-native-vpas < "$RENDER_ALL"; then
        FAILED=1
      fi

      # Also build the cluster root to catch malformed top-level kustomization.yaml
      # (the loop above validates target paths, not the cluster root itself).
      echo "=== Building cluster root kubernetes/clusters/weisssrv/ ==="
      if ! kustomize build kubernetes/clusters/weisssrv >/dev/null; then
        echo "ERROR: cluster root kustomization failed to build"
        FAILED=1
      fi

      exit $FAILED
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - kubernetes/**/*
        - ansible/inventories/prod/group_vars/all.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - kubernetes/**/*
        - ansible/inventories/prod/group_vars/all.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ============================================================================
# TEST STAGE - Unit and integration tests
# ============================================================================

# NOTE: Molecule/integration tests require Docker-in-Docker, which needs a privileged
# runner. All weisssrv jobs (including these) run on the infrastructure runner
# (gitlab-runner-privileged Helm release, tags: infrastructure) which has privileged=true.
# The runner is Flux-managed: edit kubernetes/apps/gitlab-runner-privileged/release.yaml
# and push; Flux reconciles within ~1 min (or run `task flux:reconcile` to force).

# Molecule unit tests — one parallel job per role/scenario. Each role with a
# molecule/ directory gets its own CI job via parallel:matrix.
.molecule-base:
  stage: test
  needs:
    - job: build-molecule-images
      optional: true
      # When build-molecule-images runs (Dockerfile/requirements changes
      # in this pipeline), it emits a dotenv setting MOLECULE_CI_IMAGE
      # to the pinned digest (e.g.
      # `<registry>/molecule-ci@sha256:abc...`). The `image:` reference
      # below picks that up so this same-pipeline run is digest-pinned
      # and immune to anyone retagging :latest mid-flight. When build
      # doesn't run (most pipelines, Dockerfile unchanged), the dotenv
      # is absent and the image falls back to the :latest tag from the
      # previous main build — same behavior as before, but only on the
      # cold path. The MOLECULE_IMAGE (test target) is independently
      # pinned to ${CI_COMMIT_SHORT_SHA} below.
      artifacts: true
  # Pre-built CI runner image: has docker-cli, molecule, ansible, and all
  # pip deps + ansible collections baked in. Eliminates ~2 min of apt-get +
  # pip install + galaxy install per job vs the generic python:3.11 image.
  #
  # `image:` only supports single-variable expansion ($VAR), not bash
  # default-value syntax. The fallback to :latest happens in two layers:
  # (a) MOLECULE_CI_IMAGE is set to the :latest tag in the `variables:`
  # block below (cold path — no Docker rebuild this pipeline); (b) when
  # build-molecule-images runs in the same pipeline its dotenv artifact
  # overrides this with the SHA-digest-pinned reference (hot path —
  # protects against retagging races).
  image: $MOLECULE_CI_IMAGE
  services:
    - docker:24.0-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    ANSIBLE_FORCE_COLOR: "1"
    PY_COLORS: "1"
    ANSIBLE_CALLBACKS_ENABLED: junit
    JUNIT_OUTPUT_DIR: "$CI_PROJECT_DIR/junit"
    MOLECULE_IMAGE: "${CI_REGISTRY_IMAGE}/molecule-test"
    # Fallback when build-molecule-images is skipped this pipeline; its
    # dotenv artifact (when present) overrides this with the digest pin.
    MOLECULE_CI_IMAGE: "${CI_REGISTRY_IMAGE}/molecule-ci:latest"
  before_script:
    # Wait for DinD sidecar — with the pre-built CI image, the script
    # starts before DinD is ready (no apt-get delay to absorb startup).
    - |
      for i in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        echo "Waiting for DinD... ($i)"
        sleep 1
      done
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if docker pull "${MOLECULE_IMAGE}:${CI_COMMIT_SHORT_SHA}" 2>/dev/null; then
        docker tag "${MOLECULE_IMAGE}:${CI_COMMIT_SHORT_SHA}" "${MOLECULE_IMAGE}:latest"
      else
        docker pull "${MOLECULE_IMAGE}:latest"
      fi
    - mkdir -p "$CI_PROJECT_DIR/junit"
  artifacts:
    when: always
    reports:
      junit: junit/*.xml
  timeout: 20m

molecule-tests:
  extends: .molecule-base
  retry:
    max: 2
    when:
      - script_failure
      # Wide molecule fan-outs can exhaust schedulable CPU/memory and
      # the job pod times out Pending (runner_system_failure) before
      # any test runs — retry instead of failing the pipeline.
      - runner_system_failure
  script:
    - cd "ansible/roles/$ROLE"
    # In-job retry with destroy + jitter. Under full pipeline fan-out,
    # simultaneous systemd-container starts on a shared node race cgroup
    # setup and die at prepare ("Container X is not running" — pipelines
    # 360/361/365, several roles, always the same second). Job-level
    # retry re-rolls the same dice (all attempts land in the same
    # storm); destroy + a randomized 15-45s sleep de-conflicts the
    # restart instead. $RANDOM is per-shell and the runner pod start
    # times differ, so the jitter genuinely spreads.
    - |
      attempt=1; max=3
      until molecule test -s "$SCENARIO"; do
        rc=$?
        attempt=$((attempt+1))
        if [ "$attempt" -gt "$max" ]; then exit "$rc"; fi
        echo "molecule attempt $((attempt-1)) failed (rc=$rc); destroying + retrying ($attempt/$max)"
        molecule destroy -s "$SCENARIO" || true
        sleep $(( (RANDOM % 31) + 15 ))
      done
  parallel:
    matrix:
      # Each role/scenario combo gets its own parallel job. Roles with a
      # single scenario use "default". k3s has two scenarios (default +
      # agent) that run as separate jobs to halve wall time.
      - ROLE: acme_certs
        SCENARIO: default
      - ROLE: alloy_host
        SCENARIO: default
      - ROLE: adguard_home
        SCENARIO: default
      - ROLE: adguard_sync
        SCENARIO: default
      - ROLE: base
        SCENARIO: default
      - ROLE: gitlab
        SCENARIO: default
      # home_assistant: contract test for the two Jinja2 templates
      # (configuration.yaml.j2, secrets.yaml.j2). The role's scp/ssh
      # path against the live HAOS appliance can't be exercised in a
      # container — HAOS isn't a Linux distro you can run in Docker —
      # so the scenario flips home_assistant_render_only=true to skip
      # the deploy half and asserts on the rendered output.
      - ROLE: home_assistant
        SCENARIO: default
      - ROLE: k3s
        SCENARIO: default
      - ROLE: k3s
        SCENARIO: agent
      - ROLE: nas_storage
        SCENARIO: default
      - ROLE: nfs_tls
        SCENARIO: default
      - ROLE: nic_tuning
        SCENARIO: default
      - ROLE: plex
        SCENARIO: default
      - ROLE: postfix_null_client
        SCENARIO: default
      - ROLE: qol
        SCENARIO: default
      - ROLE: smtp_relay
        SCENARIO: default
      - ROLE: tailscale
        SCENARIO: default
      - ROLE: unbound
        SCENARIO: default
      # prometheus_exporter is the shared install pipeline backing
      # zfs_exporter + unbound_exporter; its scenario contract-tests both
      # artifact branches (tarball + deb) on the skip path.
      - ROLE: prometheus_exporter
        SCENARIO: default
      - ROLE: zfs_exporter
        SCENARIO: default
      - ROLE: unbound_exporter
        SCENARIO: default
      # zvol_mount uses loop devices in prepare; works under privileged DinD.
      - ROLE: node_exporter_host
        SCENARIO: default
      - ROLE: resolv_conf
        SCENARIO: default
      - ROLE: resolv_conf
        SCENARIO: empty-search
      - ROLE: zvol_mount
        SCENARIO: default
      - ROLE: proxmox_firewall
        SCENARIO: default
      - ROLE: proxmox_vm
        SCENARIO: default
      - ROLE: proxmox_lxc
        SCENARIO: default
      - ROLE: proxmox_ha
        SCENARIO: default
      # zfs_encryption: validates template rendering, file modes, systemd
      # ordering hooks, and per-pool service enable. Cannot exercise
      # `zfs load-key` (no kernel module in container) or live Connect
      # calls (no fixture endpoint), but covers the deploy contract end
      # to end with mocked inputs.
      - ROLE: zfs_encryption
        SCENARIO: default
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ansible/roles/**/*
        - ansible/playbooks/**/*
        - ansible/inventories/prod/group_vars/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ansible/roles/**/*
        - ansible/playbooks/**/*
        - ansible/inventories/prod/group_vars/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'

integration-tests:
  extends: .molecule-base
  # Multi-container scenarios run 2-3 systemd containers through full
  # role stacks; base-infrastructure alone is ~12m idle and blew the
  # inherited 20m ceiling under pipeline fan-out contention (361).
  timeout: 35m
  retry:
    max: 2
    when:
      - script_failure
      # Same pod-scheduling-timeout tolerance as molecule-tests.
      - runner_system_failure
  script:
    - cd "ansible/integration-tests/$TEST"
    # Same in-job destroy+jitter retry as molecule-tests (see comment
    # there) — multi-container scenarios are the most start-storm-prone.
    - |
      attempt=1; max=3
      until molecule test; do
        rc=$?
        attempt=$((attempt+1))
        if [ "$attempt" -gt "$max" ]; then exit "$rc"; fi
        echo "molecule attempt $((attempt-1)) failed (rc=$rc); destroying + retrying ($attempt/$max)"
        molecule destroy || true
        sleep $(( (RANDOM % 31) + 15 ))
      done
  parallel:
    matrix:
      - TEST:
          - base-infrastructure
          - cert-distribution
          - dns-stack
          - mail-stack
          - storage-stack
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ansible/integration-tests/**/*
        - ansible/roles/**/*
        - ansible/inventories/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ansible/integration-tests/**/*
        - ansible/roles/**/*
        - ansible/inventories/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ============================================================================
# SECURITY STAGE - Secret detection and scanning
# ============================================================================

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: security
  needs: []  # run in parallel with lint/test stages
  variables:
    SECRET_DETECTION_HISTORIC_SCAN: "false"
    # Custom gitleaks config is loaded via `.gitlab/secret-detection-ruleset.toml`
    # which `[[secrets.passthrough]]`s `.gitleaks.toml`. The previously-used
    # `SECRET_DETECTION_RULESET_PATH` variable is not a documented GitLab
    # variable and was silently ignored. `.gitleaks.toml` carries both
    # content-allowlist regexes (`op://`, `[your-...]`, anchored test/fake
    # fixture tokens) AND a path-allowlist that exempts `docs/*.md` +
    # `ansible/roles/*/molecule/*` wholesale — those trees are noisy with
    # placeholder-shaped strings. Trade-off (a real secret committed under
    # those paths won't be caught here) is documented in `.gitleaks.toml`
    # header.
    # Require modern CPU (gitleaks binary uses POPCNT/SSE4.2 - OptiPlex Core 2 Quads crash with SIGILL)
    # OPERATIONAL INVARIANT: this job is pinned to esweiss.com/cpu=modern nodes.
    # If no modern-CPU node is schedulable the job sits Pending and is NOT a
    # passed scan — a skipped/pending secret_detection must be investigated, not
    # treated as green. validation-gate needs it non-optionally so this can't be
    # silently lost on a main pipeline.
    KUBERNETES_NODE_SELECTOR_CPU: "esweiss.com/cpu=modern"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    # Run on schedules so anything that snuck in via tags/branch merges that
    # didn't trigger a normal pipeline still gets scanned (security best practice).
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ============================================================================
# GATE STAGE - Validation gate for deploy jobs
# ============================================================================
# All deploy jobs depend on this gate (non-optional). The gate lists every
# lint/test/security job as a dependency. GitLab CI `optional: true` semantics
# (https://docs.gitlab.com/ci/yaml/#needsoptional):
#
#   - If the needed job was NOT created (rules excluded it): dependency is ignored
#   - If the needed job IS in the pipeline and SUCCEEDS: dependency satisfied
#   - If the needed job IS in the pipeline and FAILS: the dependent job is BLOCKED
#
# Jobs with `changes:` path filters use optional:true (may not exist in pipeline).
# Jobs that ALWAYS run on main pushes (no path filter) are non-optional.
#
# Net effect: all applicable checks must pass before any deploy job runs.

validation-gate:
  stage: gate
  image: alpine:3.23
  needs:
    # -- Path-filtered jobs (may not exist in pipeline) --
    - job: shellcheck
      optional: true
    - job: yaml-lint
      optional: true
    - job: ansible-lint
      optional: true
    - job: terraform-fmt
      optional: true
    - job: terraform-validate
      optional: true
    - job: terraform-plan
      optional: true
    - job: flux-versions-sync
      optional: true
    - job: flux-lint
      optional: true
    - job: flux-version-pin-check
      optional: true
    - job: python-tests
      optional: true
    - job: molecule-tests
      optional: true
    - job: integration-tests
      optional: true
    - job: deploy-coverage-check
      optional: true
    - job: molecule-matrix-coverage-check
      optional: true
    # -- Always-run jobs (no path filter, always present on main pushes) --
    - job: secret_detection
  script:
    # Guard: every deploy-* job gates on `$CI_COMMIT_BRANCH == "main" &&
    # $OP_SERVICE_ACCOUNT_TOKEN`. If the token is unset/empty those jobs are
    # silently never created and main goes green having deployed nothing.
    # Fail loudly here (this gate always runs on main, no token guard) so a
    # missing CI/CD variable surfaces as a red pipeline instead of a no-op.
    - |
      if [ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
        echo "ERROR: OP_SERVICE_ACCOUNT_TOKEN is unset/empty on a main pipeline." >&2
        echo "       All deploy-* jobs gate on this token and would be silently skipped," >&2
        echo "       deploying nothing while the pipeline reports success." >&2
        echo "       Set the OP_SERVICE_ACCOUNT_TOKEN CI/CD variable (masked, protected)." >&2
        exit 1
      fi
    - echo "All applicable checks passed - deploy jobs may proceed"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'

# ============================================================================
# DEPLOY STAGE - Auto-deploy on merge to main
# ============================================================================

# ------------------------------------------------------------------------------
# Terraform
# ------------------------------------------------------------------------------

deploy-terraform:
  stage: deploy
  interruptible: false
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]
  variables:
    TF_HTTP_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/cloudflare"
    TF_HTTP_LOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/cloudflare/lock"
    TF_HTTP_UNLOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/cloudflare/lock"
    TF_HTTP_USERNAME: "gitlab-ci-token"
    TF_HTTP_PASSWORD: "${CI_JOB_TOKEN}"
    TF_HTTP_LOCK_METHOD: "POST"
    TF_HTTP_UNLOCK_METHOD: "DELETE"
    TF_HTTP_RETRY_WAIT_MIN: "5"
  needs:
    - job: validation-gate
    - job: terraform-plan
      artifacts: true
  before_script:
    - !reference [.install-1password-alpine, before_script]
  script:
    - cd terraform/cloudflare
    # -lockfile=readonly: CI must not rewrite .terraform.lock.hcl (provider
    # hashes are committed; a CI-side change would mask supply-chain drift).
    - terraform init -lockfile=readonly
    - |
      export TF_VAR_cloudflare_api_token=$(op read "op://Homelab/Cloudflare DNS Token/credential")
      export TF_VAR_cloudflare_account_id=$(op read "op://Homelab/Cloudflare DNS Token/username")
      terraform apply -auto-approve -lock-timeout=120s tfplan
  environment:
    name: production/cloudflare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - terraform/**/*

# ------------------------------------------------------------------------------
# Ansible Infrastructure
# ------------------------------------------------------------------------------

deploy-ansible-base:
  stage: deploy
  extends: .deploy-base
  needs:
    - job: validation-gate
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    # alloy_host renders loki.write basic_auth from these; without them
    # the role renders a credential-less config and every host's journal
    # shipping 401s against the loki-push-auth middleware (pipeline 355
    # silently clobbered the fleet's alloy configs exactly this way).
    # The role now asserts these are non-empty.
    LOKI_PUSH_USER: "op://Homelab/Loki Push Auth/username"
    LOKI_PUSH_PASSWORD: "op://Homelab/Loki Push Auth/password"
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/base.yml
    # base.yml doesn't include node_exporter_host or alloy_host (those live
    # in site.yml); when changes touch them we follow up with a tag-scoped
    # site.yml run so the rules block below stays honest. Idempotent if
    # neither role changed; the tag filter skips everything else in site.yml.
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --tags node_exporter_host,alloy_host
  environment:
    name: production/ansible-base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/base/**/*
        - ansible/roles/nic_tuning/**/*
        # Transitive: resolv_conf is invoked by base when skip_dns_config=false.
        - ansible/roles/resolv_conf/**/*
        # node_exporter_host + alloy_host live in site.yml and run on the
        # same host set base does. The script above runs site.yml with
        # --tags node_exporter_host,alloy_host as a second step so these
        # changes actually deploy when this rule fires (previously the
        # rule advertised coverage that base.yml alone did not provide).
        - ansible/roles/node_exporter_host/**/*
        - ansible/roles/alloy_host/**/*
        - ansible/playbooks/base.yml
        - ansible/playbooks/site.yml
        - ansible/inventories/prod/group_vars/proxmox.yml
        - ansible/inventories/prod/host_vars/pve-nas-01.yml

# Proxmox host configuration (qol, postfix_null_client, tailscale)
deploy-ansible-proxmox:
  stage: deploy
  extends: .deploy-base
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    TAILSCALE_AUTH_KEY: "op://Homelab/Tailscale Auth Key/credential"
  script:
    - cd ansible
    # Deploy qol, postfix_null_client, tailscale to proxmox hosts
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --limit proxmox --tags qol,postfix_null_client,tailscale
  environment:
    name: production/ansible-proxmox
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/qol/**/*
        - ansible/roles/tailscale/**/*
        - ansible/roles/postfix_null_client/**/*

deploy-ansible-firewall:
  stage: deploy
  extends: .deploy-base
  needs:
    - job: validation-gate
    - job: deploy-ansible-proxmox
      optional: true
  script:
    - cd ansible
    # Firewall is applied to proxmox hosts, dns, and mail via site.yml
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --tags proxmox_firewall
  environment:
    name: production/ansible-firewall
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/proxmox_firewall/**/*

deploy-ansible-dns:
  stage: deploy
  extends: .deploy-base
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    ADGUARD_ADMIN_PASSWORD: "op://Homelab/AdGuard Home/password"
    DNS01_SSH_PRIVATE_KEY: "op://Homelab/DNS-01 SSH Key/private key"
    DNS01_SSH_PUBLIC_KEY: "op://Homelab/DNS-01 SSH Key/public key"
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/dns.yml
  environment:
    name: production/ansible-dns
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/unbound/**/*
        - ansible/roles/adguard_home/**/*
        - ansible/roles/adguard_sync/**/*
        - ansible/roles/postfix_null_client/**/*
        # Transitive: resolv_conf used by adguard_home; unbound_exporter
        # invoked from dns.yml.
        - ansible/roles/resolv_conf/**/*
        - ansible/roles/unbound_exporter/**/*
        # unbound_exporter is a thin wrapper over prometheus_exporter (the
        # shared install pipeline), so a change to the shared role must
        # redeploy dns too. It also backs zfs_exporter, so the same path is
        # listed under deploy-ansible-storage.
        - ansible/roles/prometheus_exporter/**/*
        - ansible/playbooks/dns.yml
        # DNS group/host vars: lxc settings, ssh policy, cert distribution
        # targets — all consumed by the dns playbook, so a vars-only change
        # must trigger a redeploy.
        - ansible/inventories/prod/group_vars/dns.yml
        - ansible/inventories/prod/host_vars/dns-01.yml
        - ansible/inventories/prod/host_vars/dns-02.yml

deploy-ansible-storage:
  stage: deploy
  extends: .deploy-base
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
  variables:
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SAMBA_NAS_PASSWORD: "op://Homelab/Samba NAS User/password"
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/storage.yml
  environment:
    name: production/ansible-storage
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/nas_storage/**/*
        # zfs_exporter is invoked from storage.yml; nfs_tls is the
        # opt-in NFSv4-over-TLS daemon that runs on the same NAS host
        # plus the k3s NFS clients (cert paths shared with acme_certs).
        - ansible/roles/zfs_exporter/**/*
        # zfs_exporter is a thin wrapper over prometheus_exporter (the
        # shared install pipeline), so a change to the shared role must
        # redeploy storage too. It also backs unbound_exporter, so the
        # same path is listed under deploy-ansible-dns.
        - ansible/roles/prometheus_exporter/**/*
        - ansible/roles/nfs_tls/**/*
        - ansible/playbooks/storage.yml

deploy-ansible-mail:
  stage: deploy
  extends: .deploy-base
  needs:
    - job: validation-gate
    - job: deploy-ansible-dns
      optional: true
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    SMTP_GMAIL_USER: "op://Homelab/SMTP Relay Gmail/username"
    SMTP_GMAIL_PASSWORD: "op://Homelab/SMTP Relay Gmail/password"
    DNS01_SSH_PUBLIC_KEY: "op://Homelab/DNS-01 SSH Key/public key"
  script:
    - cd ansible
    # Mail roles are deployed via site.yml with host targeting
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --limit mail
  environment:
    name: production/ansible-mail
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/smtp_relay/**/*
        - ansible/roles/postfix_null_client/**/*
        # Mail group vars: relay/null-client settings consumed by the
        # site.yml --limit mail run, so a vars-only change must trigger
        # a redeploy (mirrors group_vars/dns.yml on the dns job).
        - ansible/inventories/prod/group_vars/mail.yml

deploy-ansible-certs:
  stage: deploy
  extends: .deploy-base
  needs:
    - job: validation-gate
    - job: deploy-ansible-dns
      optional: true
    - job: deploy-ansible-mail
      optional: true
  variables:
    DNS01_SSH_PRIVATE_KEY: "op://Homelab/DNS-01 SSH Key/private key"
    DNS01_SSH_PUBLIC_KEY: "op://Homelab/DNS-01 SSH Key/public key"
  script:
    - cd ansible
    # Certificate roles are deployed via site.yml with host targeting
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --limit dns --tags acme_certs
  environment:
    name: production/ansible-certs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/acme_certs/**/*
        # host_vars/dns-01.yml carries the pinned host_key entries that
        # acme_certs uses for cert distribution; a change to those
        # fingerprints needs a redeploy.
        - ansible/inventories/prod/host_vars/dns-01.yml

# ------------------------------------------------------------------------------
# Ansible Applications (VMs/LXC)
# ------------------------------------------------------------------------------

deploy-plex:
  stage: deploy
  extends: .deploy-base
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
  variables:
    # plex.yml runs postfix_null_client, which renders mail_aliases
    # (root -> admin_email -> ROOT_EMAIL_ALIAS); without it the aliases
    # task fails with AnsibleUndefinedVariable. Mirrors the other deploy jobs.
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    # Plex custom-certificate PFX passphrase (matches the value configured
    # in Plex Settings -> Network -> "Custom certificate encryption key").
    # The plex role asserts this is non-empty before re-keying.
    PLEX_PFX_PASSPHRASE: "op://Homelab/Plex Custom Certificate/password"
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/plex.yml
  environment:
    name: production/plex
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/plex/**/*
        - ansible/roles/proxmox_lxc/**/*
        - ansible/playbooks/plex.yml

deploy-gitlab:
  stage: deploy
  extends: .deploy-base
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
  variables:
    # GitLab role reads secrets from env vars via lookup('ansible.builtin.env', ...)
    # op run resolves op:// references in environment variables at runtime
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    GITLAB_ROOT_PASSWORD: "op://Homelab/GitLab/root-password"
    GITLAB_SAML_CERT_FINGERPRINT: "op://Homelab/GitLab SSO/saml-cert-fingerprint"
    # Personal Access Token used by the role's Web IDE Application Settings
    # API calls (vscode_extension_marketplace_*). The gitlab role asserts
    # this is set and resolved (not still an op:// reference) before the
    # API block runs.
    GITLAB_API_TOKEN: "op://Homelab/GitLab API Token/credential"
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/gitlab.yml
    - |
      # Wait for GitLab API to come back after reconfigure (up to 5 min)
      echo "Waiting for GitLab API..."
      gitlab_healthy=false
      start_ts=$(date +%s)
      while true; do
        if curl -sf --max-time 5 https://git.ericsweiss.com/-/readiness > /dev/null 2>&1; then
          elapsed=$(( $(date +%s) - start_ts ))
          echo "GitLab API healthy after ${elapsed}s"
          gitlab_healthy=true
          break
        fi
        elapsed=$(( $(date +%s) - start_ts ))
        if [ "$elapsed" -ge 300 ]; then break; fi
        [ $((elapsed % 20)) -lt 3 ] && echo "Still waiting... (${elapsed}s)"
        sleep 2
      done
      if [ "$gitlab_healthy" != "true" ]; then
        echo "ERROR: GitLab API did not become healthy in 300s"
        exit 1
      fi
  environment:
    name: production/gitlab
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/gitlab/**/*
        # zvol_mount is invoked by the gitlab role for the
        # /mnt/gitlab-repos persistent volume.
        - ansible/roles/zvol_mount/**/*
        - ansible/playbooks/gitlab.yml
        # gitlab_servers group vars (postfix null-client, kernel tuning) are
        # consumed by the gitlab playbook, so a vars-only change must redeploy.
        - ansible/inventories/prod/group_vars/gitlab_servers.yml
        # all.yml triggers deploy for gitlab_version changes; may also trigger
        # on unrelated version bumps but the playbook is idempotent and safe to re-run
        - ansible/inventories/prod/group_vars/all.yml

deploy-home-assistant-config:
  stage: deploy
  extends: .deploy-base
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
  variables:
    # Home Assistant role reads secrets from env vars via lookup('ansible.builtin.env', ...)
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    ADMIN_EMAIL: "op://Homelab/Email Config/root_alias"
    HA_OIDC_CLIENT_ID: "op://Homelab/Home Assistant SSO/authentik-client-id"
    HA_OIDC_CLIENT_SECRET: "op://Homelab/Home Assistant SSO/authentik-client-secret"
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod -e "ansible_become=false" playbooks/home-assistant.yml
  environment:
    name: production/home-assistant
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/home_assistant/**/*
        - ansible/playbooks/home-assistant.yml
        - ansible/inventories/prod/host_vars/home.yml

deploy-gitlab-verify:
  stage: deploy
  extends: .deploy-base
  needs:
    - job: validation-gate
    - job: deploy-gitlab
      optional: true
    # Ingress/runner deploys are now Flux-managed; reconciliation typically
    # completes within 1-2 minutes of the push that triggered this pipeline.
  script:
    - |
      echo "=== GitLab Verification ==="
      # Each check records its own failure instead of exiting immediately —
      # an operator wants to see EVERY failing component in one run, not
      # stop at the first one. Final summary surfaces exit code.
      # With allow_failure: true on the job, a non-zero exit yields a yellow
      # warning-style status in the pipeline UI but doesn't block the pipeline.
      EXIT=0

      echo "Testing GitLab web UI..."
      if ! curl_err=$(curl -sf --max-time 30 "https://git.ericsweiss.com/-/readiness" 2>&1); then
        echo "ERROR: GitLab readiness check failed: $curl_err"
        EXIT=1
      else
        echo "GitLab web UI: OK"
      fi

      echo "Testing Container Registry..."
      REGISTRY_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://registry.git.ericsweiss.com/v2/)
      if [ "$REGISTRY_CODE" = "200" ] || [ "$REGISTRY_CODE" = "401" ]; then
        echo "Container registry: OK (HTTP $REGISTRY_CODE)"
      else
        echo "Container registry: FAILED (HTTP $REGISTRY_CODE)"
        EXIT=1
      fi

      echo "Testing SSH connectivity..."
      if timeout 5 bash -c 'cat < /dev/null > /dev/tcp/192.168.0.153/22' 2>/dev/null; then
        echo "SSH port 22: OK"
      else
        echo "ERROR: SSH port 22 on 192.168.0.153 not reachable"
        EXIT=1
      fi

      echo ""
      echo "=== GitLab Verification Complete (exit=$EXIT) ==="
      exit $EXIT
  environment:
    name: production/gitlab-verify
  rules:
    # Inherit deploy-gitlab's rules verbatim so this verify job appears in
    # the pipeline if and only if deploy-gitlab does. Avoids drift between
    # deploy and verify trigger paths.
    - !reference [deploy-gitlab, rules]
  allow_failure: true

# ------------------------------------------------------------------------------
# Post-Deploy Verification
# ------------------------------------------------------------------------------

deploy-verify:
  stage: deploy
  extends: .k3s-deploy-base
  needs:
    - job: validation-gate
    - job: deploy-terraform
      optional: true
    - job: deploy-ansible-base
      optional: true
    - job: deploy-ansible-proxmox
      optional: true
    - job: deploy-ansible-firewall
      optional: true
    - job: deploy-ansible-dns
      optional: true
    - job: deploy-ansible-storage
      optional: true
    - job: deploy-ansible-mail
      optional: true
    - job: deploy-ansible-certs
      optional: true
    - job: deploy-plex
      optional: true
    - job: deploy-gitlab
      optional: true
    - job: deploy-home-assistant-config
      optional: true
    - job: deploy-gitlab-verify
      optional: true
    # Kubernetes workloads (k3s platform, Authentik, downloads, recipes,
    # ingress routes, runners) are Flux-managed; Flux typically reconciles
    # within 1-2 minutes of this push. deploy-verify checks cluster health
    # below and reports Flux reconciliation state via `flux get all -A`.
  script:
    - |
      # Install flux CLI alongside the kubectl already provisioned by
      # .k3s-deploy-base. Flux is the source of truth for k8s workload state,
      # so verification queries Flux CRs rather than individual Deployments.
      # Version + checksum are pinned together (supply-chain); bump both in
      # one change. check-versions tracks flux_version in all.yml, and the
      # guard below fails the job if this pin drifts from it.
      FLUX_VERSION="2.8.8"
      grep -q "flux_version: ${FLUX_VERSION}" kubernetes/infrastructure/sources/versions-configmap.yaml \
        || { echo "FLUX_VERSION ${FLUX_VERSION} drifted from versions-configmap flux_version"; exit 1; }
      curl -fsSL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz" -o /tmp/flux.tar.gz
      echo "3791d8fbb73b967ada021186f7b46686a2b180ce206d3c279c3f2ad183877a7f  /tmp/flux.tar.gz" | sha256sum -c -
      tar xzf /tmp/flux.tar.gz -C /usr/local/bin flux
      flux --version
    - |
      set -eo pipefail

      # Install tools needed for server-side dry-run validation.
      # These are already in the flux-lint job's before_script but deploy-verify
      # extends .k3s-deploy-base (kubectl + jq only), so we install them here.
      apt-get install -y -qq gettext-base > /dev/null 2>&1
      pip install --quiet pyyaml
      curl -fsSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz -o /tmp/kustomize.tar.gz
      echo "3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7  /tmp/kustomize.tar.gz" | sha256sum -c -
      tar xzf /tmp/kustomize.tar.gz -C /usr/local/bin kustomize

      # Bounded retry helper for transient startup states.
      # Suppresses output during polling; on timeout, prints the last
      # failed attempt's output for diagnostics.
      wait_for() {
        local desc="$1" timeout="$2" interval="$3"; shift 3
        local start_ts last_output
        start_ts=$(date +%s)
        while true; do
          last_output=$("$@" 2>&1) && return 0
          local elapsed=$(( $(date +%s) - start_ts ))
          if [ "$elapsed" -ge "$timeout" ]; then
            echo "wait_for: $desc timed out after ${elapsed}s"
            echo "Last check output:"
            echo "$last_output"
            return 1
          fi
          echo "wait_for: $desc not ready (${elapsed}s/${timeout}s)..."
          sleep "$interval"
        done
      }

      echo "=== Post-Deployment Verification ==="

      # jq filter fragment: select items whose Ready condition is missing or not True.
      # Used by multiple check functions below.
      JQ_NOT_READY='select((.status.conditions // []) | map(select(.type == "Ready")) | (length == 0 or .[0].status != "True"))'

      echo "Checking node status..."
      check_nodes_ready() {
        NODE_OUTPUT=$(kubectl get nodes --no-headers)
        [ -z "$NODE_OUTPUT" ] && return 1
        NOT_READY=$(echo "$NODE_OUTPUT" | awk '$2 != "Ready" {count++} END {print count+0}')
        [ "$NOT_READY" -eq 0 ]
      }
      if ! wait_for "all nodes Ready" 60 5 check_nodes_ready; then
        echo "ERROR: Node(s) not Ready after 60s"
        kubectl get nodes --no-headers
        exit 1
      fi
      kubectl get nodes --no-headers

      EXIT=0

      echo ""
      echo "=== Server-side dry-run validation ==="
      # Validate rendered manifests against the cluster API without applying.
      # Catches CRD field mismatches and API validation issues that kubeconform
      # (offline schema) cannot detect. Runs before Flux reconcile so issues
      # are surfaced even if Flux itself would fail to apply them.
      VERSIONS_CONFIGMAP=kubernetes/infrastructure/sources/versions-configmap.yaml
      if [ ! -f "$VERSIONS_CONFIGMAP" ]; then
        echo "ERROR: $VERSIONS_CONFIGMAP not found"
        exit 1
      fi
      VARS_OUTPUT=$(python3 -c "
      import yaml
      with open('$VERSIONS_CONFIGMAP') as f:
          doc = yaml.safe_load(f)
      for k, v in doc.get('data', {}).items():
          print(f'{k}\t{v}')
      ") || { echo "ERROR: failed to extract version keys for dry-run"; exit 1; }
      if [ -n "$VARS_OUTPUT" ]; then
        while IFS=$'\t' read -r k v; do
          [ -n "$k" ] && export "$k=$v"
        done <<< "$VARS_OUTPUT"
        ENVSUBST_VARS=$(echo "$VARS_OUTPUT" | awk -F'\t' '{printf "${%s} ", $1}')
        for ks in kubernetes/clusters/weisssrv/*.yaml; do
          NAME=$(basename "$ks" .yaml)
          [ "$NAME" = "kustomization" ] && continue
          # Python source must reach python3 -c with NO leading whitespace, or
          # it raises IndentationError at module level. The YAML `- |` literal
          # block strips a 6-space indent from each line, so the Python lines
          # below MUST be at exactly 6 spaces (matching the script block's
          # content indent), not aligned with the surrounding bash if-block.
          if ! SRCPATH=$(python3 -c "
      import yaml
      with open('$ks') as f:
          doc = yaml.safe_load(f)
      print(doc.get('spec',{}).get('path','') or '')
      "); then
            echo "    ERROR: failed to parse $ks"
            EXIT=1
            continue
          fi
          [ -z "$SRCPATH" ] && continue
          SRCPATH=${SRCPATH#./}
          echo "  dry-run: $SRCPATH"
          # IMPORTANT: use `printf '%s\n'` (NOT `echo`) when piping captured
          # YAML through commands. `echo` interprets backslash escapes by
          # default in bash; the rendered manifests contain Grafana dashboard
          # JSON with thousands of `\n` literals inside `|` block scalars,
          # and echo turns those into actual newlines — corrupting line
          # numbering and breaking the YAML parser ("did not find expected
          # comment or line break" mid-stream). printf '%s' preserves bytes.
          # Split kustomize stderr into a tmpfile so warnings/deprecation
          # notices on stderr don't contaminate the YAML stream that goes
          # to envsubst/kubectl. (`2>&1` would mix them in and create
          # spurious YAML parse errors downstream.)
          KS_ERR=$(mktemp)
          if ! RAW=$(kustomize build "$SRCPATH" 2>"$KS_ERR"); then
            echo "    FAIL: kustomize build failed for $SRCPATH"
            head -120 <"$KS_ERR"
            rm -f "$KS_ERR"
            EXIT=1
            continue
          fi
          rm -f "$KS_ERR"
          RENDERED=$(printf '%s\n' "$RAW" | envsubst "$ENVSUBST_VARS")
          # Use server-side apply (SSA) for dry-run validation. Plain
          # `apply --dry-run=server` requires the legacy
          # `kubectl.kubernetes.io/last-applied-configuration` annotation
          # (resources Flux owns don't have it) and computes a strategic
          # merge patch in the kubectl client. SSA sends the manifest to
          # the API server which computes the diff itself, no client-side
          # patch construction. --force-conflicts makes the dry-run win
          # field-ownership disputes with kustomize-controller; nothing is
          # persisted (it's still --dry-run=server).
          # Wrap the assignment in `if` so a non-zero kubectl exit doesn't
          # abort the script via `set -e` before we check DRYRUN_RC.
          if DRYRUN_ERR=$(printf '%s\n' "$RENDERED" | kubectl apply \
            --server-side --dry-run=server --force-conflicts \
            --field-manager=ci-deploy-verify -f - 2>&1); then
            DRYRUN_RC=0
          else
            DRYRUN_RC=$?
          fi
          if [ "$DRYRUN_RC" -ne 0 ]; then
            echo "    FAIL: server-side dry-run rejected manifests from $SRCPATH"
            # Filter for actual error lines; fall back to raw output if no
            # match. `|| true` keeps grep's no-match exit (1) from aborting
            # the script under `set -o pipefail`. Also catches kubectl
            # error patterns we didn't enumerate (e.g. "forbidden",
            # "timeout") via the fallback path.
            FILTERED_ERR=$(grep -iE "error|invalid|did not find|cannot|forbidden|timeout" \
              <<<"$DRYRUN_ERR" || true)
            # Use here-string (<<<) instead of `printf | head` so head's
            # early stdin close doesn't SIGPIPE the writer and trip
            # `set -o pipefail`.
            if [ -n "$FILTERED_ERR" ]; then
              head -30 <<<"$FILTERED_ERR"
            else
              head -30 <<<"$DRYRUN_ERR"
            fi
            EXIT=1
          fi
        done
      fi

      # Snapshot pre-reconcile state to distinguish steady-state from bootstrap.
      # If all Kustomizations are already Ready, this is a steady-state push and
      # non-Ready ExternalSecrets should be treated as failures. During bootstrap
      # or recovery (some Kustomizations not yet Ready), ESO may still be starting
      # and ES non-readiness is expected.
      PRE_KS_NOT_READY=$(kubectl get kustomizations.kustomize.toolkit.fluxcd.io -A -o json 2>/dev/null \
        | jq "[.items[] | $JQ_NOT_READY] | length" 2>/dev/null || echo "999")
      STEADY_STATE=false
      if [ "$PRE_KS_NOT_READY" -eq 0 ]; then
        STEADY_STATE=true
        echo "Cluster is steady-state (all Kustomizations were Ready pre-reconcile)"
      else
        echo "Cluster is in bootstrap/recovery ($PRE_KS_NOT_READY Kustomization(s) not Ready pre-reconcile)"
      fi

      echo ""
      echo "=== Triggering Flux reconciliation ==="
      # Force Flux to reconcile the current commit before checking status.
      # Without this, we would check stale state from the previous reconcile cycle.
      echo "Triggering Flux source reconciliation..."
      if ! flux reconcile source git flux-system --timeout=2m; then
        echo "ERROR: Flux source reconciliation failed or timed out"
        EXIT=1
      fi
      echo "Triggering root kustomization reconciliation..."
      if ! flux reconcile kustomization flux-system --timeout=3m --with-source; then
        echo "ERROR: Flux root kustomization reconciliation failed or timed out"
        EXIT=1
      fi
      # Allow downstream kustomizations time to reconcile after the root
      sleep 15

      echo ""
      echo "Flux controllers:"
      flux check

      echo ""
      echo "Flux Kustomizations:"
      flux get kustomizations -A

      echo ""
      echo "Flux HelmReleases:"
      flux get helmreleases -A

      echo ""
      echo "ExternalSecrets:"
      kubectl get externalsecrets -A

      echo ""
      echo "ExternalSecret readiness:"
      check_externalsecrets_ready() {
        ES_COUNT=$(kubectl get externalsecrets -A -o json 2>/dev/null \
          | jq "[.items[] | $JQ_NOT_READY] | length" 2>/dev/null || echo "999")
        [ "$ES_COUNT" -eq 0 ]
      }
      if ! wait_for "ExternalSecrets ready" 90 10 check_externalsecrets_ready; then
        ES_NOT_READY=$(kubectl get externalsecrets -A -o json 2>/dev/null \
          | jq "[.items[] | $JQ_NOT_READY] | length" 2>/dev/null || echo "999")
        kubectl get externalsecrets -A -o json 2>/dev/null \
          | jq -r ".items[] | $JQ_NOT_READY | \"  \(.metadata.namespace)/\(.metadata.name)\"" 2>/dev/null || true
        if [ "$STEADY_STATE" = "true" ]; then
          echo "ERROR: $ES_NOT_READY ExternalSecret(s) not Ready on a steady-state cluster"
          EXIT=1
        else
          echo "WARNING: $ES_NOT_READY ExternalSecret(s) not Ready (bootstrap/recovery)"
        fi
      else
        echo "All ExternalSecrets ready"
      fi

      # Fail if any Flux resource (Kustomization, HelmRelease, GitRepository,
      # HelmRepository, etc.) is not Ready.
      #
      # Query the CRDs directly via kubectl -o json because `flux get all`
      # only produces tabular output (json output was requested in fluxcd/flux2
      # discussions #1904 / #3535 but hasn't been implemented). An earlier
      # text-based implementation merged stderr into stdout and counted
      # warnings as outages — we use structured jq against the API instead.
      echo ""
      echo "Checking for non-Ready Flux resources..."
      FLUX_KINDS="kustomizations.kustomize.toolkit.fluxcd.io,helmreleases.helm.toolkit.fluxcd.io,gitrepositories.source.toolkit.fluxcd.io,helmrepositories.source.toolkit.fluxcd.io,ocirepositories.source.toolkit.fluxcd.io"
      check_flux_resources_ready() {
        FLUX_ALL=$(kubectl get $FLUX_KINDS -A -o json 2>/dev/null) || return 1
        NOT_READY=$(echo "$FLUX_ALL" | jq "[.items[] | $JQ_NOT_READY] | length")
        [ "$NOT_READY" -eq 0 ]
      }
      # 5 min headroom — major chart bumps (kube-prometheus-stack, Loki) can
      # take 2-4 min to reconcile through HelmRelease + child CRD updates +
      # rollout, and verify runs immediately after `git push` of those bumps.
      if ! wait_for "Flux resources ready" 300 10 check_flux_resources_ready; then
        FLUX_ALL=$(kubectl get $FLUX_KINDS -A -o json 2>/dev/null || echo '{"items":[]}')
        NOT_READY_COUNT=$(echo "$FLUX_ALL" | jq "[.items[] | $JQ_NOT_READY] | length")
        echo "ERROR: $NOT_READY_COUNT Flux resource(s) not Ready:"
        echo "$FLUX_ALL" | jq -r ".items[] | $JQ_NOT_READY | \"  \(.kind)/\(.metadata.namespace)/\(.metadata.name): \((.status.conditions // []) | map(select(.type == \"Ready\")) | .[0].message // \"no Ready condition\")\""
        EXIT=1
      else
        echo "All Flux resources ready"
      fi

      # Gate specifically on the top-level Flux Kustomizations — if any is
      # stuck (any child HelmRelease failing), the above broad check catches
      # it too, but naming them explicitly yields clear failure signals in
      # the pipeline output.
      check_top_kustomizations_ready() {
        for ks_name in infrastructure-sources infrastructure-controllers infrastructure-configs infrastructure-observability apps; do
          KS_READY=$(kubectl -n flux-system get kustomization "$ks_name" \
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "Unknown")
          if [ "$KS_READY" != "True" ]; then return 1; fi
        done
      }
      if ! wait_for "top-level Kustomizations ready" 180 5 check_top_kustomizations_ready; then
        for ks_name in infrastructure-sources infrastructure-controllers infrastructure-configs infrastructure-observability apps; do
          KS_READY=$(kubectl -n flux-system get kustomization "$ks_name" \
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "Unknown")
          if [ "$KS_READY" != "True" ]; then
            echo "ERROR: flux-system/$ks_name Kustomization not Ready (status=$KS_READY)"
            EXIT=1
          fi
        done
      else
        echo "All top-level Kustomizations ready"
      fi

      echo ""
      echo "=== Observability Stack ==="
      check_obs_pods_healthy() {
        OBS_PODS=$(kubectl get pods -n observability --no-headers 2>/dev/null || true)
        [ -z "$OBS_PODS" ] && return 1
        echo "$OBS_PODS" | awk '$3 !~ /^(Running|Completed)$/ {exit 1}' || return 1
        echo "$OBS_PODS" | awk '$3=="Running"{split($2,a,"/"); if(a[1]!=a[2]) exit 1}' || return 1
      }
      # Long timeout in steady state covers chart-upgrade rollouts; short
      # timeout in bootstrap/recovery so we drop into the WARNING branch
      # below quickly instead of burning the full budget when the namespace
      # is legitimately empty.
      OBS_PODS_WAIT=240
      [ "$STEADY_STATE" != "true" ] && OBS_PODS_WAIT=30
      if ! wait_for "observability pods healthy" "$OBS_PODS_WAIT" 10 check_obs_pods_healthy; then
        OBS_PODS=$(kubectl get pods -n observability --no-headers 2>/dev/null || true)
        if [ -z "$OBS_PODS" ]; then
          if [ "$STEADY_STATE" = "true" ]; then
            echo "ERROR: No pods in observability namespace on a steady-state cluster"
            EXIT=1
          else
            echo "WARNING: No pods in observability namespace (bootstrap/recovery)"
          fi
        else
          OBS_BAD=$(echo "$OBS_PODS" | awk '$3 !~ /^(Running|Completed)$/')
          if [ -n "$OBS_BAD" ]; then
            # In bootstrap/recovery, pods may legitimately be Pending,
            # ContainerCreating, or initializing mid-rollout — warn for
            # those. Anything not on the transient-state allowlist (any
            # form of CrashLoopBackOff, ImagePullBackOff, InvalidImageName,
            # OOMKilled, etc.) is a real bug even during bootstrap.
            # Steady-state always fails on any non-Running pod.
            OBS_NON_TRANSIENT=$(echo "$OBS_BAD" | awk '$3 !~ /^(Pending|ContainerCreating|PodInitializing|Terminating|Init:[0-9]+\/[0-9]+)$/')
            if [ "$STEADY_STATE" = "true" ] || [ -n "$OBS_NON_TRANSIENT" ]; then
              echo "ERROR: Observability pods in failing state:"
              echo "$OBS_BAD"
              EXIT=1
            else
              echo "WARNING: Some observability pods not yet Running (bootstrap/recovery):"
              echo "$OBS_BAD"
            fi
          else
            OBS_UNREADY=$(echo "$OBS_PODS" | awk '$3=="Running"{split($2,a,"/"); if(a[1]!=a[2]) print}')
            if [ -n "$OBS_UNREADY" ]; then
              echo "WARNING: Some observability pods have unready containers:"
              echo "$OBS_UNREADY"
              if [ "$STEADY_STATE" = "true" ]; then EXIT=1; fi
            fi
          fi
        fi
      else
        echo "All observability pods healthy"
      fi
      check_obs_helmreleases_ready() {
        OBS_HR_JSON=$(kubectl get helmreleases -n observability -o json 2>/dev/null || echo '{"items":[]}')
        OBS_HR_COUNT=$(echo "$OBS_HR_JSON" | jq '.items | length' 2>/dev/null || echo "0")
        [ "${OBS_HR_COUNT:-0}" -eq 0 ] && return 1
        OBS_HR_BAD=$(echo "$OBS_HR_JSON" | jq -r ".items[] | $JQ_NOT_READY | .metadata.name" 2>/dev/null || true)
        [ -z "$OBS_HR_BAD" ]
      }
      # Same pattern as the pods wait above: long budget in steady state for
      # chart-upgrade reconciliation, short budget in bootstrap/recovery so
      # the WARNING branch handles the legitimately-empty case without delay.
      OBS_HR_WAIT=300
      [ "$STEADY_STATE" != "true" ] && OBS_HR_WAIT=30
      if ! wait_for "observability HelmReleases ready" "$OBS_HR_WAIT" 10 check_obs_helmreleases_ready; then
        OBS_HR_JSON=$(kubectl get helmreleases -n observability -o json 2>/dev/null || echo '{"items":[]}')
        OBS_HR_COUNT=$(echo "$OBS_HR_JSON" | jq '.items | length' 2>/dev/null || echo "0")
        if [ "${OBS_HR_COUNT:-0}" -eq 0 ]; then
          if [ "$STEADY_STATE" = "true" ]; then
            echo "ERROR: No HelmReleases in observability namespace on a steady-state cluster"
            EXIT=1
          else
            echo "WARNING: No HelmReleases in observability namespace (bootstrap/recovery)"
          fi
        else
          OBS_HR_BAD=$(echo "$OBS_HR_JSON" | jq -r ".items[] | $JQ_NOT_READY | .metadata.name" 2>/dev/null || true)
          # In bootstrap/recovery, HelmReleases may still be reconciling on
          # first install — warn instead of failing hard. But hard-failure
          # reasons (InstallFailed/UpgradeFailed/etc.) AND any HR with a
          # non-zero .status.failures (controller has retried at least once)
          # are real bugs even during bootstrap, so always fail on those.
          # The .status.failures check catches degraded HRs whose Ready
          # condition reason doesn't match the explicit allowlist.
          OBS_HR_FAILED=$(echo "$OBS_HR_JSON" | jq -r '
            .items[]
            | (.status.conditions // [] | map(select(.type=="Ready")) | .[0]) as $ready
            | select(
                $ready.status != "True"
                and (
                  (($ready.reason // "") | test("InstallFailed|UpgradeFailed|TestFailed|RollbackFailed"))
                  or ((.status.failures // 0) > 0)
                )
              )
            | .metadata.name' 2>/dev/null || true)
          if [ "$STEADY_STATE" = "true" ] || [ -n "$OBS_HR_FAILED" ]; then
            echo "ERROR: Not all observability HelmReleases are Ready:"
            echo "$OBS_HR_BAD"
            EXIT=1
          else
            echo "WARNING: Some observability HelmReleases still reconciling (bootstrap/recovery):"
            echo "$OBS_HR_BAD"
          fi
        fi
      else
        echo "All observability HelmReleases ready"
      fi

      echo ""
      echo "LoadBalancer services:"
      kubectl get svc -A | grep LoadBalancer || true

      echo ""
      echo "Checking GitLab health..."
      gitlab_ok=false
      start_ts=$(date +%s)
      last_err=""
      while true; do
        if curl_out=$(curl -sf --max-time 5 https://git.ericsweiss.com/-/readiness 2>&1); then
          gitlab_ok=true
          break
        fi
        last_err=$curl_out
        elapsed=$(( $(date +%s) - start_ts ))
        if [ "$elapsed" -ge 60 ]; then break; fi
        echo "GitLab health probe failed (${elapsed}s elapsed), retrying..."
        sleep 3
      done
      if [ "$gitlab_ok" = "true" ]; then
        echo "GitLab API: OK"
      else
        echo "ERROR: GitLab health check failed after 60s of retries"
        echo "Last curl error: ${last_err:-<empty>}"
        EXIT=1
      fi

      echo ""
      echo "=== Verification Complete (exit=$EXIT) ==="
      exit $EXIT
  rules:
    # Inherit each deploy-* job's rules verbatim so this verify job appears
    # in the pipeline if and only if at least one deploy-* job does.
    # GitLab evaluates rules in order, first match wins; each !reference
    # expansion contributes that job's `if:`+`changes:` triplet, and the
    # `if: schedule|web when: never` rules at the top of each block apply
    # equally to verify (we don't want verify on schedules/web pipelines
    # any more than the deploys themselves).
    - !reference [deploy-terraform, rules]
    - !reference [deploy-ansible-base, rules]
    - !reference [deploy-ansible-proxmox, rules]
    - !reference [deploy-ansible-firewall, rules]
    - !reference [deploy-ansible-dns, rules]
    - !reference [deploy-ansible-storage, rules]
    - !reference [deploy-ansible-mail, rules]
    - !reference [deploy-ansible-certs, rules]
    - !reference [deploy-plex, rules]
    - !reference [deploy-gitlab, rules]
    - !reference [deploy-home-assistant-config, rules]
  # No allow_failure: the verification explicitly fails if nodes aren't Ready,
  # Flux reconciliation times out, any Flux resource is not Ready, server-side
  # dry-run rejects manifests, or GitLab is unreachable. ExternalSecret
  # readiness is a hard failure on steady-state clusters (all Kustomizations
  # were Ready pre-reconcile) and a warning during bootstrap/recovery.

# ============================================================================
# MAINTENANCE STAGE - Manual approval required
# All maintenance jobs use resource_group to prevent concurrent execution.
# Only one maintenance job can run at a time across the entire infrastructure.
#
# Recommended execution order (when running multiple):
#   1. update-packages       — OS packages on all hosts (may reboot)
#   2. update-applications   — App upgrades (needs clean OS)
#   3. update-k3s-nodes      — k3s binary upgrade (needs stable OS)
#   4. k3s-provision         — Only when adding new VMs
#   5. proxmox-ha            — HA rules (rarely changes)
#   6. home-assistant-restart — Only when needed
#   7. verify                — Always last
#
# NOTE: maintenance-update-full removed from CI — superseded by
# update-packages + update-applications. Taskfile version kept for local use.
# ============================================================================

# 1. OS package updates - MANUAL (all hosts, auto-reboot in CI)
# For interactive mode, use: task maintenance:update-packages
maintenance-update-packages:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  script:
    - cd ansible
    - bash ../scripts/maintenance-run-with-verify.sh
        op run -- ansible-playbook -i inventories/prod playbooks/maintenance/update-packages.yml -e auto_reboot=true
  environment:
    name: production/maintenance-packages
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# 2. Application updates - MANUAL (AdGuard, Tailscale, Plex)
maintenance-update-applications:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    ADGUARD_ADMIN_PASSWORD: "op://Homelab/AdGuard Home/password"
    TAILSCALE_AUTH_KEY: "op://Homelab/Tailscale Auth Key/credential"
  script:
    - cd ansible
    - bash ../scripts/maintenance-run-with-verify.sh
        op run -- ansible-playbook -i inventories/prod playbooks/maintenance/update-applications.yml
  environment:
    name: production/maintenance-applications
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# 3. K3s node updates - MANUAL (drains/cordons nodes)
maintenance-update-k3s-nodes:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  variables:
    K3S_TOKEN: "op://Homelab/K3s Cluster Token/credential"
  script:
    - cd ansible
    - bash ../scripts/maintenance-run-with-verify.sh
        op run -- ansible-playbook -i inventories/prod playbooks/maintenance/update-k3s-nodes.yml
  environment:
    name: production/k3s-nodes
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# 4. K3s VM provisioning - MANUAL (creates/modifies VMs)
maintenance-k3s-provision:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  variables:
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    K3S_TOKEN: "op://Homelab/K3s Cluster Token/credential"
  script:
    - cd ansible
    # k3s-provision is two playbooks; chain them inside `bash -c` so the
    # wrapper sees a single command unit. set -e inside the inline script
    # ensures the second playbook is skipped if the first fails.
    - bash ../scripts/maintenance-run-with-verify.sh bash -c
        'set -e;
         op run -- ansible-playbook -i inventories/prod playbooks/k3s-provision-vms.yml;
         op run -- ansible-playbook -i inventories/prod playbooks/k3s.yml'
  environment:
    name: production/k3s-provision
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# NOTE: maintenance-update-full removed from CI — superseded by:
#   maintenance-update-packages (broader host coverage) + maintenance-update-applications
# The Taskfile still has task maintenance:update-full for local use.

# 5. Proxmox HA - MANUAL (affects VM placement)
maintenance-proxmox-ha:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  script:
    - cd ansible
    - bash ../scripts/maintenance-run-with-verify.sh
        op run -- ansible-playbook -i inventories/prod playbooks/proxmox-ha.yml
  environment:
    name: production/proxmox-ha
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# 6. Home Assistant restart - MANUAL (restarts HA VM)
maintenance-home-assistant-restart:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  script:
    # The HA restart sub-script handles ha-manager + readiness loop;
    # the wrapper guarantees verify runs after.
    - bash scripts/maintenance-run-with-verify.sh bash scripts/maintenance-ha-restart.sh
  environment:
    name: production/home-assistant-restart
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# Optional: single-button "run all 6 ops in sequence". Delegates the
# 6-op sequence to scripts/maintenance-all-ops.sh and wraps it in
# maintenance-run-with-verify.sh so the post-maintenance verify
# always runs at the end (even if a sub-op failed).
maintenance-run-all:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  variables:
    # Union of secrets needed by the six ops invoked below.
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    ADGUARD_ADMIN_PASSWORD: "op://Homelab/AdGuard Home/password"
    TAILSCALE_AUTH_KEY: "op://Homelab/Tailscale Auth Key/credential"
    K3S_TOKEN: "op://Homelab/K3s Cluster Token/credential"
  script:
    # The all-ops sub-script handles the 6 ops; the wrapper guarantees
    # verify runs after, even if any op failed.
    - bash scripts/maintenance-run-with-verify.sh bash scripts/maintenance-all-ops.sh
  environment:
    name: production/maintenance-run-all
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      # GitLab quirk: rules-based `when: manual` defaults to
      # `allow_failure: false` (top-level `when: manual` defaults to
      # true). Without this explicit `allow_failure: true`, every main
      # pipeline would PAUSE waiting for someone to play this manual
      # job — blocking unrelated CI flow. Failures are still surfaced
      # in the GitLab UI when the job is actually played.
      allow_failure: true

# 7. Post-maintenance verification - MANUAL ad-hoc cluster health check
# The maintenance ops + maintenance-run-all already invoke
# scripts/post-maintenance-verify.sh as the last step of their own job,
# so verify runs strictly after each op without any cross-job needs/stage
# coordination. This standalone job is just an ad-hoc "check cluster
# health right now" button; click it any time to re-run the same script
# without triggering an actual maintenance op.
maintenance-verify:
  stage: maintenance
  extends: .maintenance-base
  resource_group: infrastructure-maintenance
  script:
    - bash scripts/post-maintenance-verify.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# ============================================================================
# VERSION CHECK - Runs early, soft-fail on PRs
# ============================================================================

version-check:
  stage: lint
  image: python:3.11
  before_script:
    # Install the 1Password CLI only when OP_SERVICE_ACCOUNT_TOKEN is present
    # (forks / outside MRs don't get the masked variable). The CLI is only
    # needed for the MR auto-comment path; without the token the job still
    # runs and still emits the version-report.json artifact. We inline the
    # apt install here (rather than `extends`/`!reference` .install-1password)
    # so it can be conditional — a YAML `!reference` can't live inside a shell
    # `if`, and unconditionally installing it on every schedule/MR/main run
    # would add a useless apt round-trip when no token is available.
    - |
      if [ -n "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
        apt-get update -qq
        apt-get install -y -qq curl gnupg
        curl -sS https://downloads.1password.com/linux/keys/1password.asc | \
          gpg --dearmor --output /usr/share/keyrings/1password-archive-keyring.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main" \
          > /etc/apt/sources.list.d/1password.list
        apt-get update -qq && apt-get install -y -qq 1password-cli
        op --version
      fi
  script:
    - pip install --quiet pyyaml==6.0.2 requests==2.32.3
    # GITLAB_API_TOKEN drives version-check-ci.py's post_mr_comment(). Without
    # it the script gracefully skips the comment and only writes the
    # version-report.json artifact (graceful-skip lives in version-check-ci.py).
    # Gate the op read on the token so non-token pipelines still run cleanly.
    - |
      if [ -n "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
        export GITLAB_API_TOKEN=$(op read "op://Homelab/GitLab API Token/credential")
      fi
    - python3 ./scripts/version-check-ci.py
  artifacts:
    paths:
      - version-report.json
    expire_in: 7 days
    when: always
  rules:
    # Run on schedule (weekly check). Soft-fail: rc=1 just means updates are
    # available, which must not red the scheduled pipeline.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: true
    # Manual trigger on web pipelines (must precede main rule to avoid auto-run)
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    # Run on MRs as informational (soft-fail)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      allow_failure: true
    # Run on pushes to main as informational (soft-fail)
    - if: '$CI_COMMIT_BRANCH == "main"'
      allow_failure: true
