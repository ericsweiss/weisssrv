---
# GitLab CI/CD pipeline for the weisssrv homelab. Stages, the job matrix per
# pipeline source and the deploy/verify contract are docs/13-ci-cd.md.
# OP_SERVICE_ACCOUNT_TOKEN must be masked and protected (docs/13 § Variables).

stages:
  - lint
  - validate
  - test
  - security
  # After security, not first: the image builds are privileged DinD jobs that
  # push to the registry, so nothing is published before yamllint, flux-lint
  # and Secret Detection have run. Neither build job carries a `needs:`.
  - build
  - ai-review
  - gate
  - deploy
  # Separate stage, not a deploy-stage job with `needs:` — any `needs:` makes a
  # job ignore stage order, and a need that was created then FAILED blocks it.
  # Both verify jobs carry no needs + `when: always` (docs/13 § Verify Stage).
  - verify
  # Every maintenance op runs scripts/post-maintenance-verify.sh as its own last
  # step, so verify needs no cross-job sequencing (docs/12-runbooks.md).
  - maintenance

default:
  image: python:3.13-slim
  # The privileged infrastructure runner. The shared non-privileged runner
  # (k8s-deploy) serves other GitLab projects.
  tags: [infrastructure]
  # Deploy/maintenance jobs override this to false so they always complete.
  interruptible: true

variables:
  # Single source for the weisssrv-lib pin. `include:` cannot read it (includes
  # resolve before job variables exist), so each entry repeats the tag as a
  # literal; check-lib-pins.py holds them equal. Bump here, then `--fix`.
  WEISSSRV_LIB_REF: "v0.18.1"
  # Single source for the Ansible pin. check-deploy-playbooks reads it as a
  # variable; the deploy-base include repeats it as a literal input (includes
  # resolve before this block), which check-ci-pin-parity.sh holds equal to it.
  ANSIBLE_VERSION: "14.4.0"
  # Single source for the kustomize pin (flux-lint, deploy-verify) and the
  # pytest/PyYAML/ruff pins the lint and test jobs install. Include inputs repeat
  # the literals, and check-repo-policies' ci-pin-parity check fails on drift.
  KUSTOMIZE_VERSION: "5.8.3"
  KUSTOMIZE_SHA256: "cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61"
  # promtool + amtool for prometheus-config-lint, pinned with the sha256 the job
  # verifies each downloaded tarball against.
  PROMTOOL_VERSION: "3.6.0"
  PROMTOOL_SHA256: "2002ef4a55a64161affccd2786c7081d4e3b3a8d08786a98b3bb110971414916"
  AMTOOL_VERSION: "0.28.1"
  AMTOOL_SHA256: "5ac7ab5e4b8ee5ce4d8fb0988f9cb275efcc3f181b4b408179fafee121693311"
  PYTEST_VERSION: "9.1.1"
  PYYAML_VERSION: "6.0.2"
  RUFF_VERSION: "0.16.0"
  # check-doc-links' backticked-path pass: a cited repo path must resolve.
  CHECK_DOC_LINKS_PATHS: "1"
  # fnmatch exceptions for cited paths that are not files here: the library's
  # own docs, lint profiles and molecule scaffolding, the GitLab-hosted
  # terraform states, a gitignored plan file. Keep equal to taskfiles/lint.yml.
  CHECK_DOC_LINKS_IGNORE: "docs/[A-Z]* lint/* molecule/default/expected-junit-failures.txt docker/molecule-ci/requirements.txt terraform/state/* */tfplan */check-vendored-copies.py"
  # Digest-pinned: these images run in jobs that have already been handed vault
  # credentials, so a repointed upstream tag would execute there. Lint-only jobs
  # float. CI is on 3.13, above ansible 14's floor; CronJobs run 3.14.
  PY_JOB_IMAGE: "python:3.13-slim@sha256:8d9d0b8bcf6506481eae4907c18f5e3e7902e629f5f6d684f9e7c32e85e3ddf0"
  TF_JOB_IMAGE: "hashicorp/terraform:1.16.5@sha256:c7926feace05d0f7e73542842bf3945924e955a1f782cf000ccbb8d18fa42d77"
  # git reads these three as config, so ansible-galaxy's clone of the
  # weisssrv.infra collection authenticates with the job token and no
  # ~/.gitconfig. Only credential-less URLs are rewritten.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "url.https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/.insteadOf"
  GIT_CONFIG_VALUE_0: "https://${CI_SERVER_HOST}/"

workflow:
  # MR refs cancel on a new commit (interruptible); main never cancels — a
  # cancelled main pipeline strands its deploys. Deploy ordering also needs each
  # resource group set to oldest_first out-of-band (docs/13, docs/17).
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# .dep-cache, .install-1password, .install-1password-alpine and .deploy-base
# come from the shared CI library (see the include: block), used via
# `extends:` / `!reference`.

# Shared "never on scheduled or web pipelines" rule preamble, pulled in via
# `- !reference [.skip-schedule-web, rules]`.
.skip-schedule-web:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never

# Shared rules for every manual maintenance-stage job: skip schedule/web, then
# a manual button on main (op-token guarded). A nested !reference to
# .skip-schedule-web resolves fine.
.maintenance-manual-rules:
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      # Rules-based `when: manual` defaults to allow_failure: false, which would
      # PAUSE every main pipeline until someone plays these buttons. A played
      # job still surfaces its failure in the UI.
      allow_failure: true

# Shared `changes:` path lists, pulled by each job's rules as
# `changes: !reference [.paths-<x>, changes]`, so a path edit happens once.
# !reference, not YAML anchors: anchors do not cross an include boundary.
.paths-build-hermes-agent:
  changes:
    # The build's only real inputs: the pin and the build notes. NOT gated on
    # .gitlab-ci.yml, so an unrelated CI edit cannot trigger a multi-minute DinD
    # rebuild and re-push.
    - docker/hermes-agent/**/*
    - ansible/inventories/prod/group_vars/all.yml
.paths-build-camofox-browser:
  changes:
    # Same rationale as .paths-build-hermes-agent: the pin and the build notes
    # are the only real inputs, and .gitlab-ci.yml is not one.
    - docker/camofox-browser/**/*
    - ansible/inventories/prod/group_vars/all.yml
.paths-generated-files:
  # Union for check-generated-files: each check inside the job is cheap enough
  # that firing both on either trigger set is free.
  changes:
    - ansible/inventories/prod/hosts.yml
    - scripts/hosts.env
    - scripts/generate-hosts-env.py
    - scripts/hosts-env-map.yml
    - ansible/inventories/prod/group_vars/all.yml
    - kubernetes/infrastructure/sources/versions-configmap.yaml
    - scripts/generate-versions-configmap.py
    # The job's own script block, so an edit to it re-runs it.
    - .gitlab-ci.yml
.paths-repo-policy:
  # Union for check-repo-policies, a superset of every constituent check's own
  # trigger set: a check may run on a path it does not care about (seconds), but
  # can never be missed on one it does.
  changes:
    - ansible/**/*
    - scripts/**/*
    - .gitlab-ci.yml
    - .gitlab/**/*
    # netpol-except-parity, backup-artifact-apps and cluster-literals all read
    # manifests under kubernetes/.
    - kubernetes/**/*
    - Taskfile.yml
    - taskfiles/**/*
    # runbook-anchors resolves every alert's runbook_url into these pages.
    - docs/**/*.md
    # tailscale-policy-syntax's subject: the ACL the supervised apply pushes.
    - terraform/tailscale/policy.hujson
    # unifi-doc-parity reads terraform/unifi/main.tf against docs/46.
    - terraform/unifi/**/*
.paths-role-inputs:
  changes:
    - ansible/inventories/prod/**/*
    - ansible/playbooks/**/*
    - ansible/requirements.yml
    - scripts/check-role-inputs.py
    - .gitlab-ci.yml
# The Cloudflare-only jobs gate on just that module, so an unrelated tailscale
# change cannot fire a Cloudflare plan+apply. terraform-fmt/validate come from
# the library and cover terraform/**/*.
.paths-terraform-lint:
  changes:
    - terraform/**/*
    - .tflint.hcl
    - .gitlab-ci.yml
.paths-terraform-cloudflare:
  changes:
    - terraform/cloudflare/**/*
.paths-b2-drift:
  changes:
    - scripts/b2-bucket-drift.py
    # The desired bucket settings the script reconciles against.
    - scripts/b2-bucket.json
.paths-unifi-settings-drift:
  changes:
    - scripts/unifi-settings-drift.py
    # The codified console-owned settings the script compares against.
    - scripts/unifi-settings.json
.paths-prometheus-config:
  changes:
    - kubernetes/infrastructure/observability/kube-prometheus-stack/release.yaml
    - kubernetes/infrastructure/observability/kube-prometheus-stack/alertmanager-config.yaml
    # Every custom alert is a standalone PrometheusRule CR here. flux-lint and
    # kubeconform validate the CR schema and never parse `expr`, so without this
    # a rule-only MR gets no promtool check at all.
    - kubernetes/infrastructure/observability/rules/**/*
    - scripts/extract-prometheus-config.py
    - scripts/lint-prometheus-config.sh
    - scripts/check-alertmanager-behaviour.py
    # Its route cases / alert inventory — the site data the gate asserts against.
    - scripts/alertmanager-behaviour.yaml
    # promtool unit tests + vendored upstream rules run by the lint script.
    - scripts/prometheus-rule-tests/**/*
    # The job's own definition — the promtool/amtool image and the script argv
    # live here, so an MR that changes how the gate runs must re-run the gate.
    - .gitlab-ci.yml
# The integration-matrix gate's inputs: the scenario tree it walks, the matrix
# file it parses, the gate itself and the ci_yaml helper it imports.
.paths-integration-matrix:
  changes:
    - ansible/integration-tests/**/*
    - .gitlab/ci/integration-jobs.yml
    - scripts/check-integration-matrix-coverage.py
    - scripts/ci_yaml.py
    - .gitlab-ci.yml
.paths-deploy-playbooks:
  # Everything check-deploy-playbooks' answer depends on: the playbooks and
  # tags it walks, the inventory `--list-tasks` parses, the collection pin it
  # installs, the gate itself, and the deploy jobs it reads the invocations of.
  changes:
    - ansible/playbooks/**/*
    - ansible/inventories/prod/**/*
    - ansible/requirements.yml
    - ansible/ansible.cfg
    - scripts/check-deploy-preflight.py
    # Imported from its own directory by the gate.
    - scripts/ci_yaml.py
    - scripts/ci_playbook_invocations.py
    - .gitlab-ci.yml
# .deploy-base comes from the library (see the include: block). .dep-cache,
# which it extends, also sets ANSIBLE_COLLECTIONS_PATH — the path the playbooks'
# FQCN roles resolve from, so dropping it moves collection resolution silently.

# Ansible (from .deploy-base) plus kubectl, so each maintenance job can call
# scripts/post-maintenance-verify.sh after its playbook.
.maintenance-base:
  extends: .deploy-base
  # Manual buttons that consume no artifacts — every input comes from 1Password
  # at runtime — so an empty needs lets an operator play them immediately.
  needs: []
  # Must stay BELOW the detached self-host reboot's 5400s (90m) fallback timer:
  # GitLab has to cancel a runaway job (firing the after_script re-arm) before
  # that timer reboots the executor's own host mid-run.
  timeout: 70m
  before_script:
    - !reference [.deploy-base, before_script]
    - !reference [.kubectl-setup, before_script]
  after_script:
    # Re-arm a DETACHED self-host reboot to fire at job end (+60s) and disarm the
    # long fallback timer. Runs on cancel too, so a cancelled run cannot leave a
    # 90-min timer ticking. No-op when the run armed nothing.
    - bash scripts/maintenance-rearm-self-reboot.sh || true

.k3s-deploy-base:
  # The `extends` and the `!reference` below are BOTH required: a job-level
  # before_script REPLACES the extended one, so the !reference is what runs the
  # op install, while the extends keeps any other key the fragment grows.
  extends: .install-1password
  # Debian, not Alpine: the musl resolver misbehaves with k8s ndots:5.
  # Digest-pinned: these jobs hold a cluster-admin kubeconfig.
  image: $PY_JOB_IMAGE
  # k3s deploys/verifies touch the cluster; never interrupt mid-run.
  interruptible: false
  before_script:
    - !reference [.install-1password, before_script]
    - !reference [.kubectl-setup, before_script]
    # The gates these jobs pipe `kubectl -o json` into import PyYAML through
    # gate_common.py, and the slim image ships none.
    - pip install --quiet "pyyaml==${PYYAML_VERSION}"
    # Not `kubectl cluster-info`: it needs list perms on kube-system services
    # that the runner ServiceAccount lacks.
    - kubectl version --output=yaml --request-timeout=5s

# BUILD STAGE - Container images

# Shared by the two app-image builds (hermes-agent, camofox-browser). The docker
# CLI, buildx, the dind-ready wait and the registry login come from the library
# fragment; a pin bump rolls Flux before the build finishes (docs/37).
.build-image-base:
  extends: .docker-dind
  # Pushes images consumed later in this pipeline; do not interrupt.
  interruptible: false
  # Infra-class retries only. NOT script_failure: a broken Dockerfile must fail
  # fast rather than burn three full builds — transient dep pulls are covered by
  # each job's own bounded build retry, which reuses cached layers.
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  stage: build
  image: python:3.13

# Upstream Hermes Agent publishes no container image: this clones it at the
# pinned tag, builds their Dockerfile, then layers docker/hermes-agent/
# Dockerfile.codex on top. Every pipeline builds; only main pushes (docs/37).
build-hermes-agent:
  extends: .build-image-base
  variables:
    HERMES_UPSTREAM_REPO: "https://github.com/NousResearch/hermes-agent.git"
    # Pinned to cpu=modern: this build EXECUTES the CLIs it installs and they
    # SIGILL on the legacy nodes (docs/25 § Node labels).
    KUBERNETES_NODE_SELECTOR_CPU: "esweiss.com/cpu=modern"
  script:
    - |
      # all.yml is the single source of the pins. No YAML lib in this image, so
      # grep the scalars.
      HERMES_VERSION=$(grep -E '^hermes_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_VERSION" ]; then echo "could not read hermes_version from all.yml"; exit 1; fi
      # Published tag (<version>-rN): the local patch revision.
      HERMES_IMAGE_VERSION=$(grep -E '^hermes_image_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_image_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_IMAGE_VERSION" ]; then echo "could not read hermes_image_version from all.yml"; exit 1; fi
      case "$HERMES_IMAGE_VERSION" in
        "${HERMES_VERSION}-r"*) ;;
        *) echo "hermes_image_version ($HERMES_IMAGE_VERSION) must be ${HERMES_VERSION}-r<N> — bump them in lockstep"; exit 1 ;;
      esac
      HERMES_CODEX_VERSION=$(grep -E '^hermes_codex_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_codex_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_CODEX_VERSION" ]; then echo "could not read hermes_codex_version from all.yml"; exit 1; fi
      HERMES_CLAUDE_VERSION=$(grep -E '^hermes_claude_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_claude_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_CLAUDE_VERSION" ]; then echo "could not read hermes_claude_version from all.yml"; exit 1; fi
      # 1Password CLI, baked in for Hermes' 1Password skill.
      HERMES_OP_VERSION=$(grep -E '^hermes_op_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_op_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_OP_VERSION" ]; then echo "could not read hermes_op_version from all.yml"; exit 1; fi
      echo "Building Hermes Agent ${HERMES_VERSION} (Codex CLI ${HERMES_CODEX_VERSION}, Claude Code CLI ${HERMES_CLAUDE_VERSION}, 1Password CLI ${HERMES_OP_VERSION})"
      ref="${CI_REGISTRY_IMAGE}/hermes-agent"
      rm -rf /tmp/hermes-src
      git clone --depth 1 --branch "$HERMES_VERSION" "$HERMES_UPSTREAM_REPO" /tmp/hermes-src
      HERMES_SHA=$(git -C /tmp/hermes-src rev-parse HEAD)
      # An upstream tag is mutable: without this check a moved tag would publish
      # attacker-controlled steps into an image Flux deploys. Bump hermes_git_sha
      # whenever hermes_version changes.
      HERMES_EXPECTED_SHA=$(grep -E '^hermes_git_sha:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_git_sha:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_EXPECTED_SHA" ]; then echo "hermes_git_sha not pinned in all.yml — refusing to build"; exit 1; fi
      if [ "$HERMES_SHA" != "$HERMES_EXPECTED_SHA" ]; then
        echo "SECURITY: tag ${HERMES_VERSION} resolved to ${HERMES_SHA}, but all.yml pins ${HERMES_EXPECTED_SHA}."
        echo "The upstream tag may have moved. Refusing to build."
        echo "task maintenance:update-all-versions does not move this pin: bump hermes_image_version to ${HERMES_VERSION}-r1 and re-resolve hermes_git_sha from the PEELED tag commit — git ls-remote \"$HERMES_UPSTREAM_REPO\" \"refs/tags/${HERMES_VERSION}^{}\"."
        exit 1
      fi
      echo "Upstream ${HERMES_VERSION} -> ${HERMES_SHA} (matches pinned hermes_git_sha)"
      # Local patches applied to the SHA-verified tree. `git apply` fails loudly
      # if one has drifted, so a hermes bump must re-verify every patch.
      for p in docker/hermes-agent/patches/*.patch; do
        [ -e "$p" ] || continue
        echo "Applying local patch: $p"
        git -C /tmp/hermes-src apply -p1 --verbose "$CI_PROJECT_DIR/$p"
      done
      cache_args=""
      if [ "$CI_PIPELINE_SOURCE" != "schedule" ]; then
        cache_args="--cache-from ${ref}:latest --build-arg BUILDKIT_INLINE_CACHE=1"
      fi
      # Stage 1 builds upstream to an intermediate tag; stage 2 layers the CLI
      # wrapper as the final image carrying the tags the cluster pulls. One retry
      # loop covers both (either can hit a transient registry/npm hiccup).
      upstream_ref="${ref}:upstream-${CI_COMMIT_SHORT_SHA}"
      attempt=1; max=3
      # shellcheck disable=SC2086  # intentional word-split of cache_args
      until docker build $cache_args \
              --build-arg HERMES_GIT_SHA="$HERMES_SHA" \
              -t "$upstream_ref" \
              /tmp/hermes-src \
            && docker build \
              --build-arg HERMES_IMAGE="$upstream_ref" \
              --build-arg HERMES_CODEX_VERSION="$HERMES_CODEX_VERSION" \
              --build-arg HERMES_CLAUDE_VERSION="$HERMES_CLAUDE_VERSION" \
              --build-arg HERMES_OP_VERSION="$HERMES_OP_VERSION" \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              -t "${ref}:${HERMES_VERSION}" \
              -t "${ref}:${HERMES_IMAGE_VERSION}" \
              -t "${ref}:${CI_COMMIT_SHORT_SHA}" \
              -f docker/hermes-agent/Dockerfile.codex \
              docker/hermes-agent; do
        attempt=$((attempt+1))
        if [ "$attempt" -gt "$max" ]; then echo "hermes build failed after ${max} attempts"; exit 1; fi
        echo "build attempt $((attempt-1)) failed; retrying (${attempt}/${max})..."
        sleep $(( (RANDOM % 20) + 10 ))
      done
      # Pushed only on main: :<version> (what the cluster pulls), :<sha> for
      # traceability, :latest for the layer cache.
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker push "${ref}:${CI_COMMIT_SHORT_SHA}"
        docker push "${ref}:${HERMES_VERSION}"
        # The build already -t's this tag; the re-tag guards against its tag
        # list drifting from what the cluster pulls.
        docker tag "${ref}:${CI_COMMIT_SHORT_SHA}" "${ref}:${HERMES_IMAGE_VERSION}"
        docker push "${ref}:${HERMES_IMAGE_VERSION}"
        docker tag "${ref}:${CI_COMMIT_SHORT_SHA}" "${ref}:latest"
        docker push "${ref}:latest"
        # Read the tag back from the REGISTRY: "the tag the cluster needs was
        # never published" becomes a red build job, not an ImagePullBackOff.
        docker buildx imagetools inspect "${ref}:${HERMES_IMAGE_VERSION}" >/dev/null \
          || { echo "PUBLISH VERIFY FAILED: ${ref}:${HERMES_IMAGE_VERSION} is not resolvable in the registry"; exit 1; }
        echo "Registry serves ${ref}:${HERMES_IMAGE_VERSION}"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-build-hermes-agent, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-build-hermes-agent, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# The browser server behind Hermes' camofox tool, built the same way as
# build-hermes-agent (pinned tag verified against a pinned commit) but from
# upstream's Dockerfile unmodified — the image is complete as shipped.
build-camofox-browser:
  extends: .build-image-base
  variables:
    CAMOFOX_UPSTREAM_REPO: "https://github.com/jo-inc/camofox-browser.git"
  script:
    - |
      # all.yml is the single source of the pins; no YAML lib in this image.
      CAMOFOX_VERSION=$(grep -E '^hermes_camofox_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_camofox_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$CAMOFOX_VERSION" ]; then echo "could not read hermes_camofox_version from all.yml"; exit 1; fi
      echo "Building camofox-browser ${CAMOFOX_VERSION}"
      ref="${CI_REGISTRY_IMAGE}/camofox-browser"
      rm -rf /tmp/camofox-src
      # The pin is the bare semver (the image tag); the upstream git tag
      # carries the leading "v".
      git clone --depth 1 --branch "v${CAMOFOX_VERSION}" "$CAMOFOX_UPSTREAM_REPO" /tmp/camofox-src
      CAMOFOX_SHA=$(git -C /tmp/camofox-src rev-parse HEAD)
      # A moved upstream tag must not publish attacker-controlled steps into an
      # image Flux deploys. Bump hermes_camofox_git_sha with the version.
      CAMOFOX_EXPECTED_SHA=$(grep -E '^hermes_camofox_git_sha:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_camofox_git_sha:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$CAMOFOX_EXPECTED_SHA" ]; then echo "hermes_camofox_git_sha not pinned in all.yml — refusing to build"; exit 1; fi
      if [ "$CAMOFOX_SHA" != "$CAMOFOX_EXPECTED_SHA" ]; then
        echo "SECURITY: tag v${CAMOFOX_VERSION} resolved to ${CAMOFOX_SHA}, but all.yml pins ${CAMOFOX_EXPECTED_SHA}."
        echo "The upstream tag may have moved. Refusing to build."
        echo "task maintenance:update-all-versions does not move this pin: re-resolve hermes_camofox_git_sha from the PEELED tag commit — git ls-remote \"$CAMOFOX_UPSTREAM_REPO\" \"refs/tags/v${CAMOFOX_VERSION}^{}\"."
        exit 1
      fi
      echo "Upstream v${CAMOFOX_VERSION} -> ${CAMOFOX_SHA} (matches pinned hermes_camofox_git_sha)"
      cache_args=""
      if [ "$CI_PIPELINE_SOURCE" != "schedule" ]; then
        cache_args="--cache-from ${ref}:latest --build-arg BUILDKIT_INLINE_CACHE=1"
      fi
      # Bounded retry: the build pulls the Camoufox release zip + yt-dlp, so a
      # transient blip re-attempts cheaply on cached layers.
      attempt=1; max=3
      # shellcheck disable=SC2086  # intentional word-split of cache_args
      until docker build $cache_args \
              -t "${ref}:${CAMOFOX_VERSION}" \
              -t "${ref}:${CI_COMMIT_SHORT_SHA}" \
              /tmp/camofox-src; do
        attempt=$((attempt+1))
        if [ "$attempt" -gt "$max" ]; then echo "camofox build failed after ${max} attempts"; exit 1; fi
        echo "build attempt $((attempt-1)) failed; retrying (${attempt}/${max})..."
        sleep $(( (RANDOM % 20) + 10 ))
      done
      # Pushed only on main: :<version> (what the cluster pulls), :<sha> for
      # traceability, :latest for the layer cache.
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker push "${ref}:${CI_COMMIT_SHORT_SHA}"
        docker push "${ref}:${CAMOFOX_VERSION}"
        docker tag "${ref}:${CI_COMMIT_SHORT_SHA}" "${ref}:latest"
        docker push "${ref}:latest"
        # Publish verify, same as build-hermes-agent: the Deployment pulls
        # exactly ${hermes_camofox_version}.
        docker buildx imagetools inspect "${ref}:${CAMOFOX_VERSION}" >/dev/null \
          || { echo "PUBLISH VERIFY FAILED: ${ref}:${CAMOFOX_VERSION} is not resolvable in the registry"; exit 1; }
        echo "Registry serves ${ref}:${CAMOFOX_VERSION}"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-build-camofox-browser, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-build-camofox-browser, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# LINT STAGE - Code quality checks

# Two consolidated micro-check jobs: generated-file freshness and repo-policy
# invariants. Each job's paths anchor is the union of its checks' inputs, and
# the driver runs every check before failing.
check-generated-files:
  needs: []
  stage: lint
  image: python:3.13-slim
  before_script:
    - pip install --quiet "pyyaml==${PYYAML_VERSION}"
  script:
    - |
      # errexit explicit here so run_check's `set +e`/`set -e` pair restores a
      # known state rather than whatever the runner preamble left.
      set -euo pipefail
      overall=0; failed=""

      run_check() {
        name="$1"; shift
        printf 'section_start:%s:%s[collapsed=true]\r\033[0K== %s\n' "$(date +%s)" "$name" "$name"
        # Not `"$@" || rc=$?`: bash suppresses errexit throughout an AND-OR
        # list, so a check's own `set -e` never fires and a crashed helper reads
        # as a pass. `set +e` is what lets the driver report every check.
        set +e
        ( set -eo pipefail; "$@" )
        rc=$?
        set -e
        printf 'section_end:%s:%s\r\033[0K\n' "$(date +%s)" "$name"
        if [ "$rc" -ne 0 ]; then overall=1; failed="$failed $name"; echo "FAILED: $name (rc=$rc)"; fi
      }

      # hosts.env freshness. Generate to a temp path rather than in place: the
      # workspace stays clean for the other checks, and the argv (which the
      # generated header embeds) mirrors `task hosts:sync`.
      check_hosts_env() {
        set -eo pipefail
        python3 scripts/generate-hosts-env.py \
          --inventory ansible/inventories/prod/hosts.yml \
          --map scripts/hosts-env-map.yml \
          --output /tmp/generated.env \
          --regen-command "task hosts:sync"
        if ! diff -u scripts/hosts.env /tmp/generated.env; then
          echo "ERROR: scripts/hosts.env is out of sync with hosts.yml"
          echo "Run: task hosts:sync and commit the result."
          return 1
        fi
        echo "scripts/hosts.env is in sync with hosts.yml"
      }

      # versions-configmap freshness: same shape, argv mirroring
      # `task flux:sync-versions`.
      check_versions_configmap() {
        set -eo pipefail
        python3 scripts/generate-versions-configmap.py \
          --vars-file ansible/inventories/prod/group_vars/all.yml \
          --output /tmp/generated.yaml \
          --nested-key helm_chart_versions \
          --regen-command "task flux:sync-versions"
        if ! diff -u kubernetes/infrastructure/sources/versions-configmap.yaml /tmp/generated.yaml; then
          echo "ERROR: versions-configmap.yaml is out of sync with all.yml"
          echo "Run: task flux:sync-versions and commit the result."
          return 1
        fi
        echo "versions-configmap.yaml is in sync with all.yml"
      }

      run_check hosts-env-sync check_hosts_env
      run_check flux-versions-sync check_versions_configmap
      [ "$overall" -eq 0 ] || echo "Failed sync checks:$failed"
      exit "$overall"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-generated-files, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-generated-files, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'

check-repo-policies:
  needs: []
  stage: lint
  # python:3.13-slim (not alpine): these checks need bash + coreutils.
  image: python:3.13-slim
  variables:
    # check-deploy-coverage.sh's `git merge-base --is-ancestor` guard rejects
    # unrelated histories, which a depth-20 clone produces whenever the MR base
    # is >20 commits behind HEAD. A full clone keeps the merge-base reachable.
    GIT_DEPTH: 0
  before_script:
    # git for check-deploy-coverage.sh; curl for the go-task download; PyYAML for
    # the coverage scripts.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates
    - pip install --no-cache-dir --quiet "PyYAML==${PYYAML_VERSION}"
    - |
      set -eo pipefail
      # go-task, pinned + sha256 like every other downloaded binary here.
      TASK_VERSION="v3.52.0"
      TASK_SHA256="02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd"
      dl=$(mktemp -d)
      curl -fsSL "https://github.com/go-task/task/releases/download/${TASK_VERSION}/task_linux_amd64.tar.gz" -o "$dl/task.tar.gz"
      echo "${TASK_SHA256}  $dl/task.tar.gz" | sha256sum -c -
      tar xzf "$dl/task.tar.gz" -C /usr/local/bin task
      rm -rf "$dl"
      task --version
  script:
    - |
      # errexit explicit here so run_check's `set +e`/`set -e` pair restores a
      # known state rather than whatever the runner preamble left.
      set -euo pipefail
      overall=0; failed=""

      run_check() {
        name="$1"; shift
        printf 'section_start:%s:%s[collapsed=true]\r\033[0K== %s\n' "$(date +%s)" "$name" "$name"
        # Not `"$@" || rc=$?`: bash suppresses errexit throughout an AND-OR
        # list, so a check's own `set -e` never fires and a crashed helper reads
        # as a pass. `set +e` is what lets the driver report every check.
        set +e
        ( set -eo pipefail; "$@" )
        rc=$?
        set -e
        printf 'section_end:%s:%s\r\033[0K\n' "$(date +%s)" "$name"
        if [ "$rc" -ne 0 ]; then overall=1; failed="$failed $name"; echo "FAILED: $name (rc=$rc)"; fi
      }

      # Every check below runs a scripts/ file or a `task lint` sub-task, so
      # `task lint` runs the SAME code: an inline heredoc would be reachable
      # only from this job.

      check_taskfile() { task --list >/dev/null && bash scripts/check-taskfile.sh; }

      # policy.hujson is read with terraform's file(), so fmt/validate never
      # parse it; the only other reader is the Tailscale API at apply time.
      check_tailscale_policy() { task lint:tailscale-policy; }

      # MR-only: the comparison needs the diff base, and no other pipeline
      # source sets it. A version pin that moved without its paired checksum,
      # digest or git SHA builds something nobody verified.
      check_partner_pins() {
        if [ -z "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
          echo "not a merge-request pipeline — no diff base to compare against"
          return 0
        fi
        python3 scripts/check-versions.py --check-partner-pins "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      }

      run_check deploy-coverage bash scripts/check-deploy-coverage.sh
      run_check deploy-host-coverage python3 scripts/check-deploy-host-coverage.py
      run_check collection-pin-trigger python3 scripts/check-collection-pin-trigger.py
      # --host-vars/--rules: the script is vendored, so which file holds each
      # side of the pair is site layout rather than a script default.
      run_check backup-artifact-apps python3 scripts/check-backup-artifact-apps.py --host-vars ansible/inventories/prod/host_vars/pve-nas-01.yml --rules kubernetes/infrastructure/observability/rules/scripts.yaml
      # --config: the script is vendored; its except-lists and
      # peer-less-egress allowlist are site data.
      run_check netpol-except-parity python3 scripts/check-netpol-except-parity.py --config scripts/netpol-except.yaml
      run_check cluster-literals python3 scripts/check-cluster-literals.py
      # Via the task: the rules directory and the probe-target allowlist are
      # one argv, kept in taskfiles/lint.yml.
      run_check cluster-invariants task lint:cluster-invariants
      run_check dashboards python3 scripts/check-dashboards.py
      run_check runbook-anchors python3 scripts/check-runbook-anchors.py
      run_check upstream-rule-mirror python3 scripts/check-upstream-rule-mirror.py
      run_check unifi-doc-parity python3 scripts/check-unifi-doc-parity.py
      run_check tenant-wiring python3 scripts/check-tenant-wiring.py
      run_check secret-rotation python3 scripts/check-secret-rotation-coverage.py
      run_check guest-endpoint-parity python3 scripts/check-guest-endpoint-parity.py
      run_check host-log-staleness python3 scripts/generate-host-log-staleness.py --check
      run_check tailnet-dns-parity python3 scripts/check-tailnet-dns-parity.py
      run_check vpn-provider-parity python3 scripts/check-vpn-provider-parity.py
      run_check lib-pins python3 scripts/check-lib-pins.py
      # Network: re-downloads each checksum-coupled artefact and re-hashes it.
      run_check version-checksums python3 scripts/check-version-checksums.py
      run_check partner-pins check_partner_pins
      run_check helm-repo-parity python3 scripts/check-helm-repo-parity.py
      run_check ansible-service-names python3 scripts/check-ansible-service-names.py
      run_check image-gc-threshold python3 scripts/check-image-gc-threshold.py
      run_check kubectl-version-pin python3 scripts/check-kubectl-version-pin.py
      run_check flux-version-pin task lint:flux-version-pin
      run_check busybox-version-pin task lint:busybox-version-pin
      run_check ci-pin-parity bash scripts/check-ci-pin-parity.sh
      run_check tailscale-policy-syntax check_tailscale_policy
      run_check taskfile-smoke check_taskfile
      [ "$overall" -eq 0 ] || echo "Failed policy checks:$failed"
      exit "$overall"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-repo-policy, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-repo-policy, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# A scenario directory with no `parallel:matrix` entry never runs, and reads as
# green because nothing executed it. Its own job so a failure names itself and
# a path only check-repo-policies triggers on does not re-run it.
check-integration-matrix:
  needs: []
  stage: lint
  image: python:3.13-slim
  before_script:
    - pip install --no-cache-dir --quiet "PyYAML==${PYYAML_VERSION}"
  script:
    # --ci-file: the matrix lives in its own included file, so its `changes:`
    # trigger can name a file that only it lives in.
    - python3 scripts/check-integration-matrix-coverage.py --ci-file .gitlab/ci/integration-jobs.yml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-integration-matrix, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-integration-matrix, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'

# tflint over all four roots, mirroring `task lint`'s terraform:tflint. It
# catches what fmt/validate do not: deprecated syntax, unused declarations and
# provider-specific rules. No .tflint.hcl today, so --init fetches no plugins.
terraform-tflint:
  needs: []
  stage: lint
  image:
    name: ghcr.io/terraform-linters/tflint:v0.61.0@sha256:b835d64d66abfdbc146694b918eb3cd733ec772465ad511464d4e8bebbdd6732
    entrypoint: [""]
  script:
    - cd terraform
    - tflint --init
    - tflint --recursive --minimum-failure-severity=error
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-terraform-lint, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-terraform-lint, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# The collection's roles assert their required inputs, and an opt-in role whose
# flag is set nowhere runs anyway. Both fail on every host the role touches, so
# the hand-edited inventory is gated here. Mirrors `task lint:role-inputs`.
check-role-inputs:
  needs: []
  stage: lint
  # Full image, not slim: ansible-galaxy installs weisssrv.infra from a git+ URL.
  image: python:3.13
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - pip install --quiet "ansible==${ANSIBLE_VERSION}" "pyyaml==${PYYAML_VERSION}"
    # --force: galaxy skips an already-installed collection, so a warm cache
    # would check against the previous release's roles after a pin bump.
    - for i in 1 2 3; do ansible-galaxy collection install --force -r ansible/requirements.yml -p .ansible-home/collections && break; [ "$i" = 3 ] && exit 1; echo "galaxy install failed (attempt $i) — retrying in 20s"; sleep 20; done
  script:
    # --allow-unknown: chart versions the Flux substitution reads, whose names
    # carry a role's prefix. Same argv as `task lint:role-inputs`.
    - >-
      python3 scripts/check-role-inputs.py
      --roles-dir .ansible-home/collections/ansible_collections/weisssrv/infra/roles
      --inventory ansible/inventories/prod
      --playbooks ansible/playbooks
      --allow-unknown "gitlab_runner_helm_version=a chart version the Flux substitution reads, not a role variable"
      --allow-unknown "gitlab_agent_helm_version=a chart version the Flux substitution reads, not a role variable"
      --allow-unknown "tailscale_operator=a chart version the Flux substitution reads, not a role variable"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-role-inputs, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-role-inputs, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Validates the alert rules (PromQL in HelmRelease values and PrometheusRule
# CRs) and the Alertmanager config, which kubeconform and flux-lint cannot
# parse. A bad expr otherwise fails the HelmRelease upgrade post-merge (docs/33).
prometheus-config-lint:
  needs: []
  stage: lint
  image: python:3.13-slim
  # The promtool unit tests dominate this job: promtool re-evaluates the whole
  # rule corpus once per evaluation_interval, per test file. Shard the files
  # across parallel instances so wall time is the slowest shard, not the sum.
  parallel: 4
  variables:
    # promtool unit-tests the extracted rules against this directory's
    # *.test.yaml; `task lint:prometheus-config` points at the same one.
    RULE_TESTS_DIR: "scripts/prometheus-rule-tests"
    # Every custom alert is a standalone PrometheusRule here, so a renamed or
    # moved tree must red the gate instead of extracting zero rules.
    RULES_DIR: "kubernetes/infrastructure/observability/rules"
    REQUIRE_RULES_DIR: "1"
  # Cache promtool + amtool across runs, keyed on .gitlab-ci.yml (the versions
  # and sha256s live here).
  cache:
    key:
      prefix: prom-tools
      files:
        - .gitlab-ci.yml
    paths:
      - .cache/prom-tools
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl
    - pip install --quiet "pyyaml==${PYYAML_VERSION}"
    - |
      set -eo pipefail
      # promtool (prometheus) + amtool (alertmanager), pinned + sha256. The
      # cache holds verified tarballs: every run re-checks the pinned sha256 and
      # re-extracts, so a mutated runner cache cannot smuggle in a binary.
      TOOLS_CACHE="${CI_PROJECT_DIR}/.cache/prom-tools"
      mkdir -p "$TOOLS_CACHE"
      fetch_verified() { # <file> <url> <sha256>
        if ! echo "$3  $TOOLS_CACHE/$1" | sha256sum -c - >/dev/null 2>&1; then
          curl -fsSL -o "$TOOLS_CACHE/$1" "$2"
          echo "$3  $TOOLS_CACHE/$1" | sha256sum -c -
        fi
      }
      fetch_verified prom.tar.gz \
        "https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}/prometheus-${PROMTOOL_VERSION}.linux-amd64.tar.gz" \
        "$PROMTOOL_SHA256"
      tar xzf "$TOOLS_CACHE/prom.tar.gz" -C /usr/local/bin --strip-components=1 "prometheus-${PROMTOOL_VERSION}.linux-amd64/promtool"
      fetch_verified am.tar.gz \
        "https://github.com/prometheus/alertmanager/releases/download/v${AMTOOL_VERSION}/alertmanager-${AMTOOL_VERSION}.linux-amd64.tar.gz" \
        "$AMTOOL_SHA256"
      tar xzf "$TOOLS_CACHE/am.tar.gz" -C /usr/local/bin --strip-components=1 "alertmanager-${AMTOOL_VERSION}.linux-amd64/amtool"
      promtool --version && amtool --version
  script:
    - |
      set -eo pipefail
      # This shard's slice of the unit tests, round-robin over the file list.
      # Every *.rules.yaml goes into each shard: the *.test.yaml files load them
      # by name, relative to their own directory.
      shard="${CI_PROJECT_DIR}/.rule-tests-shard"
      rm -rf "$shard"; mkdir -p "$shard"
      cp "$RULE_TESTS_DIR"/*.rules.yaml "$shard"/
      index=0; copied=0
      for test_file in "$RULE_TESTS_DIR"/*.test.yaml; do
        if [ "$(( index % CI_NODE_TOTAL + 1 ))" = "$CI_NODE_INDEX" ]; then
          cp "$test_file" "$shard"/
          copied=$(( copied + 1 ))
        fi
        index=$(( index + 1 ))
      done
      echo "shard ${CI_NODE_INDEX}/${CI_NODE_TOTAL}: ${copied} of ${index} unit-test file(s)"
      RULE_TESTS_DIR="$shard" bash scripts/lint-prometheus-config.sh
    - |
      # Behavioural half of the gate, first shard only: amtool check-config
      # accepts a route reorder that silences Watchdog and a one-sided alertname
      # rename that unbinds an inhibit pair. Pairs with `task lint:prometheus-config`.
      if [ "${CI_NODE_INDEX:-1}" = "1" ]; then
        python3 scripts/check-alertmanager-behaviour.py --config scripts/alertmanager-behaviour.yaml
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-prometheus-config, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-prometheus-config, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ansible-lint and the AI reviewer (pr-agent-review) are generated from the
# shared CI library templates — see the include: block below.

# VALIDATE STAGE - Schema and configuration validation

terraform-plan:
  extends: .terraform-http-backend
  needs: []
  stage: validate
  image:
    name: $TF_JOB_IMAGE
    entrypoint: [""]
  before_script:
    - !reference [.install-1password-alpine, before_script]
  script:
    - cd terraform/cloudflare
    # -lockfile=readonly: CI must not rewrite .terraform.lock.hcl (provider
    # hashes are committed; a CI-side change would mask supply-chain drift).
    - terraform init -lockfile=readonly
    - |
      # Assign, then export: `export VAR=$(...)` returns export's status, so a
      # failed vault read would pass silently and surface later as a provider
      # auth error instead of "the vault read failed".
      set -eo pipefail
      TF_VAR_cloudflare_api_token=$(op read "op://Homelab/Cloudflare Terraform Token/credential")
      TF_VAR_cloudflare_account_id=$(op read "op://Homelab/Cloudflare Terraform Token/username")
      export TF_VAR_cloudflare_api_token TF_VAR_cloudflare_account_id
      terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan
  artifacts:
    # CRITICAL: NO human download — a saved plan stores every TF_VAR value in
    # the clear, including the Cloudflare Terraform token. deploy-terraform
    # still receives it through needs:artifacts, which `access` does not gate.
    # `access` gates artifacts:reports too, so this job publishes no Terraform
    # MR report; the delete count is enforced by deploy-terraform's guard.
    access: none
    paths:
      - terraform/cloudflare/tfplan
    # 1 week: deploy-terraform consumes this plan a stage later, and a retried
    # or long-held pipeline would otherwise apply a GC'd plan.
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # Inert while OP_SERVICE_ACCOUNT_TOKEN is protected: the token is absent on
    # merge-request refs, so a Cloudflare change gets no pre-merge plan. Kept so
    # the preview returns if the variable is ever unprotected (docs/13).
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-terraform-cloudflare, changes]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-terraform-cloudflare, changes]

# Schedule is the real detector: no changes: filter, so it catches out-of-band
# console edits when nothing in-repo changed. Referenced, not extended:
# `extends` REPLACES a job's own rules: rather than merging.

# CRITICAL: no $OP_SERVICE_ACCOUNT_TOKEN guard here. A guard REMOVES the job
# when the credential is revoked or rescoped, so out-of-band drift goes
# undetected behind a green pipeline; unguarded, the vault read reds the job.
.drift-schedule-rule:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# Read-only drift check for the B2 backup-bucket settings against the raw B2 API
# rather than terraform, whose provider read path returns empty attributes.
# Reconciling is the supervised `task b2:apply`.
b2-drift-plan:
  needs: []
  stage: validate
  image: $PY_JOB_IMAGE
  before_script:
    - !reference [.install-1password, before_script]
  script:
    - |
      # Assign, then export: `export VAR=$(...)` returns export's status, so a
      # failed vault read would pass silently. A failed vault read exits 2, the
      # code reserved for a broken detector.
      set -eo pipefail
      B2_APPLICATION_KEY_ID=$(op read "op://Homelab/B2 Archive Backup/b2_key_id") || exit 2
      B2_APPLICATION_KEY=$(op read "op://Homelab/B2 Archive Backup/b2_application_key") || exit 2
      export B2_APPLICATION_KEY_ID B2_APPLICATION_KEY
      # --config is explicit: the script's default is CWD-relative and this job
      # runs from the repo root, where b2-bucket.json does not exist.
      python3 scripts/b2-bucket-drift.py --config scripts/b2-bucket.json
  # b2-bucket-drift.py INVERTS terraform's codes (0 clean, 1 drift, 2 error), so
  # the advisory pass is exit_codes:[1]. An API/auth error (2) fails RED rather
  # than masquerading as allowed drift.
  allow_failure:
    exit_codes: [1]
  rules:
    # Schedule is the real detector: no changes: filter, so it catches
    # out-of-band Backblaze-console edits when nothing in-repo changed.
    - !reference [.drift-schedule-rule, rules]
    # Post-merge validation of a drift-script change against the live bucket. No
    # merge_request_event rule, for the same credential reason as the drift plans
    # above; the script and its config are covered pre-merge by python-tests.
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-b2-drift, changes]

# The console-owned UniFi settings terraform ignores (IPS posture), compared
# against scripts/unifi-settings.json (docs/46).
unifi-settings-drift:
  needs: []
  stage: validate
  image: $PY_JOB_IMAGE
  before_script:
    - !reference [.install-1password, before_script]
  script:
    - |
      # Assign, then export: `export VAR=$(...)` returns export's status, so a
      # failed vault read would pass silently. A failed vault read exits 2, the
      # code reserved for a broken detector.
      set -eo pipefail
      UNIFI_API_URL=$(op read "op://Homelab/UniFi Controller/url") || exit 2
      UNIFI_API_KEY=$(op read "op://Homelab/UniFi Controller/api-key") || exit 2
      # The console serves its own certificate on the LAN address it is.
      export UNIFI_API_URL UNIFI_API_KEY UNIFI_ALLOW_INSECURE=1
      python3 scripts/unifi-settings-drift.py
  # 0 clean, 1 drift, 2 error: the advisory pass is exit_codes:[1], so an
  # auth/API error stays RED instead of reading as allowed drift.
  allow_failure:
    exit_codes: [1]
  rules:
    # Schedule is the real detector: no changes: filter, so it catches
    # out-of-band console edits when nothing in-repo changed.
    - !reference [.drift-schedule-rule, rules]
    # Post-merge validation of a change to the gate or its config. No
    # merge_request_event rule: the credential is protected.
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-unifi-settings-drift, changes]

# Live-vs-git drift no static gate can see: CPU limits a retired field manager
# still co-owns under server-side apply, and Secrets outside the ExternalSecret
# lifecycle. The kubectl argv mirror taskfiles/flux.yml's two verify tasks.
cluster-drift-plan:
  extends: .k3s-deploy-base
  needs: []
  stage: validate
  script:
    - |
      set -uo pipefail
      rc=0
      kubectl get pods,deployments,statefulsets,daemonsets,verticalpodautoscalers -A -o json | python3 scripts/check-live-cpu-limits.py || rc=$?
      secrets_rc=0
      kubectl get secrets -A -o json | python3 scripts/check-unmanaged-secrets.py || secrets_rc=$?
      [ "$secrets_rc" -gt "$rc" ] && rc=$secrets_rc
      exit "$rc"
  # 0 clean, 1 drift, 2 error: the advisory pass is exit_codes:[1], so an
  # auth/API error stays RED instead of reading as allowed drift.
  allow_failure:
    exit_codes: [1]
  rules:
    # Schedule only, like the other drift detectors: the credentials are
    # protected and the subject is the live cluster, not the branch.
    - !reference [.drift-schedule-rule, rules]

# Pre-merge dry run of what the deploy jobs will do, which are otherwise
# main-only (docs/13 § Validate Stage). Credential-free by design: it never runs
# `op run`, so it runs on a merge-request ref where the vault token is absent.
check-deploy-playbooks:
  needs: []
  stage: validate
  # Full image, not slim: ansible-galaxy installs weisssrv.infra from a git+ URL.
  image: python:3.13
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - pip install --quiet "ansible==${ANSIBLE_VERSION}" "pyyaml==${PYYAML_VERSION}"
    # --force: galaxy skips an already-installed collection, so a warm cache
    # would preflight against the previous release's roles after a pin bump.
    - for i in 1 2 3; do ansible-galaxy collection install --force -r ansible/requirements.yml && break; [ "$i" = 3 ] && exit 1; echo "galaxy install failed (attempt $i) — retrying in 20s"; sleep 20; done
  script:
    # --require-tag-selections: every deploy job here is tag-driven, so a run
    # that resolved no selection inspected nothing. It does not cover an op://
    # variable a job forgets to declare, or a call inside a wrapper script.
    - python3 scripts/check-deploy-preflight.py --require-tag-selections
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-deploy-playbooks, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-deploy-playbooks, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'

# TEST STAGE - Integration tests. The matrix and its `.paths-integration`
# trigger list both live in .gitlab/ci/integration-jobs.yml (included below), so
# an edit to either re-runs the suite without naming this file.

# Shared CI library (eric/weisssrv-lib) at a pinned tag; only inputs that differ
# from a library default are passed (docs/13 § Shared CI library). Every entry
# repeats the pin because `include:` resolves before `variables:` exists.
include:
  # Local: the integration-test matrix, split out so its `changes:` trigger can
  # name a file that only it lives in (see the header there).
  - local: .gitlab/ci/integration-jobs.yml

  # Reusable fragments, no jobs of their own. terraform-http-backend's defaults
  # describe this instance and the cloudflare state; the three drift-plan jobs
  # override the TF_HTTP_*ADDRESS vars for their own state names.
  - project: eric/weisssrv-lib
    ref: v0.18.1
    file:
      - /ci/templates/dep-cache.yml
      - /ci/templates/install-1password.yml
      - /ci/templates/terraform-http-backend.yml

  # deploy-base: the `.deploy-base` every Ansible deploy and maintenance job
  # extends — op CLI, ansible, a 0600 ansible.cfg, the SSH key, a TOFU keyscan
  # of hosts.env, the collection install. ci-pin-parity holds ansible_version equal.
  - project: eric/weisssrv-lib
    ref: v0.18.1
    file: /ci/deploy/deploy-base.yml
    inputs:
      op_vault: "Homelab"
      ansible_version: "14.4.0"
      apt_packages: "git"
      ansible_dir: "ansible"
      hosts_env: "scripts/hosts.env"
      tags: ["infrastructure"]

  # docker-dind: the `.docker-dind` fragment both image builds extend.
  # dind_service is held at 24.0 — its embedded BuildKit frontend accepts
  # upstream hermes' symbolic `COPY --chmod`, which 27.x rejects.
  - project: eric/weisssrv-lib
    ref: v0.18.1
    file: /ci/templates/docker-dind.yml
    inputs:
      dind_service: "docker:24.0-dind@sha256:167bad11bade46d4d9a88646ed7f9b11014dfdb898ba75c5a390eb03f21f0c45"

  # kubectl-setup: the `.kubectl-setup` fragment every kubectl-using job pulls
  # into its before_script. The vendored check-kubectl-version-pin.py reads
  # kubectl_version from here and holds it within one minor of k3s_version.
  - project: eric/weisssrv-lib
    ref: v0.18.1
    file: /ci/deploy/kubectl-setup.yml
    inputs:
      op_vault: "Homelab"
      kubeconfig_item: "K3s Kubeconfig"
      kubectl_version: "v1.37.1"
      kubectl_sha256: "65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8"

  # secret_detection overrides GitLab's managed job: MR/main/schedule rules, and
  # cpu_selector pins the scan to modern-CPU nodes (gitleaks SIGILLs without
  # POPCNT). Findings block the merge via allow_failure: false, not a needs:.
  - project: eric/weisssrv-lib
    ref: v0.18.1
    file:
      - /ci/security/secret-detection.yml
    inputs:
      cpu_selector: "esweiss.com/cpu=modern"

  # terraform validate/fmt: the exact patch the plan/apply jobs run, pinned by
  # digest so a per-node image cache cannot serve a different one. The roots'
  # required_version floor admits both this image and the workstation toolchain.
  - project: eric/weisssrv-lib
    ref: v0.18.1
    file: /ci/validate/terraform.yml
    inputs:
      image: hashicorp/terraform:1.16.5@sha256:c7926feace05d0f7e73542842bf3945924e955a1f782cf000ccbb8d18fa42d77

  # terraform-drift-plan: one read-only `terraform plan -detailed-exitcode` per
  # supervised module. tags is explicit — the template default is any runner,
  # and these need the infrastructure runner's network reach.
  - project: eric/weisssrv-lib
    ref: v0.18.1
    file: /ci/validate/terraform-drift-plan.yml
    inputs:
      image: $TF_JOB_IMAGE
      job_name: tailscale-drift-plan
      module_dir: "terraform/tailscale"
      state_name: "tailscale"
      tags: ["infrastructure"]
      changes:
        - "terraform/tailscale/**/*"
      secrets_exports: |
        TF_VAR_tailscale_oauth_client_id=$(op read "op://Homelab/Tailscale OAuth/client id")
        TF_VAR_tailscale_oauth_client_secret=$(op read "op://Homelab/Tailscale OAuth/credential")
        export TF_VAR_tailscale_oauth_client_id TF_VAR_tailscale_oauth_client_secret

  - project: eric/weisssrv-lib
    ref: v0.18.1
    file: /ci/validate/terraform-drift-plan.yml
    inputs:
      image: $TF_JOB_IMAGE
      job_name: authentik-drift-plan
      module_dir: "terraform/authentik"
      state_name: "authentik"
      tags: ["infrastructure"]
      changes:
        - "terraform/authentik/**/*"
      secrets_exports: |
        TF_VAR_authentik_token=$(op read "op://Homelab/Authentik Terraform Token/credential")
        TF_VAR_oauth2_client_secret_mealie=$(op read "op://Homelab/Mealie SSO/oidc-client-secret")
        TF_VAR_oauth2_client_secret_bar_assistant=$(op read "op://Homelab/Bar Assistant SSO/authentik-client-secret")
        TF_VAR_oauth2_client_secret_home_assistant=$(op read "op://Homelab/Home Assistant SSO/authentik-client-secret")
        TF_VAR_oauth2_client_secret_grafana=$(op read "op://Homelab/Grafana SSO/oidc-client-secret")
        TF_VAR_oauth2_client_secret_nextcloud=$(op read "op://Homelab/Nextcloud SSO/client-secret")
        TF_VAR_oauth2_client_secret_immich=$(op read "op://Homelab/Immich SSO/client-secret")
        TF_VAR_oauth2_client_secret_hermes_dashboard=$(op read "op://Homelab/Hermes Secrets/hermes-dashboard-oidc-client-secret")
        TF_VAR_oauth2_client_secret_homarr=$(op read "op://Homelab/Homarr SSO/client-secret")
        TF_VAR_basic_auth_nzbget_username=$(op read "op://Homelab/NZBGet/username")
        TF_VAR_basic_auth_nzbget_password=$(op read "op://Homelab/NZBGet/password")
        TF_VAR_basic_auth_adguard_username=$(op read "op://Homelab/AdGuard Home/username")
        TF_VAR_basic_auth_adguard_password=$(op read "op://Homelab/AdGuard Home/password")
        TF_VAR_user_identities=$(op read "op://Homelab/Authentik User Identities/notesPlain")
        export TF_VAR_authentik_token TF_VAR_oauth2_client_secret_mealie \
          TF_VAR_oauth2_client_secret_bar_assistant TF_VAR_oauth2_client_secret_home_assistant \
          TF_VAR_oauth2_client_secret_grafana TF_VAR_oauth2_client_secret_nextcloud \
          TF_VAR_oauth2_client_secret_immich TF_VAR_oauth2_client_secret_hermes_dashboard \
          TF_VAR_oauth2_client_secret_homarr TF_VAR_basic_auth_nzbget_username \
          TF_VAR_basic_auth_nzbget_password TF_VAR_basic_auth_adguard_username \
          TF_VAR_basic_auth_adguard_password TF_VAR_user_identities

  # One variable per SSID; keep in step with the Taskfile's &tf_unifi_env anchor.
  - project: eric/weisssrv-lib
    ref: v0.18.1
    file: /ci/validate/terraform-drift-plan.yml
    inputs:
      image: $TF_JOB_IMAGE
      job_name: unifi-drift-plan
      module_dir: "terraform/unifi"
      state_name: "unifi"
      tags: ["infrastructure"]
      changes:
        - "terraform/unifi/**/*"
      secrets_exports: |
        TF_VAR_unifi_api_url=$(op read "op://Homelab/UniFi Controller/url")
        TF_VAR_unifi_api_key=$(op read "op://Homelab/UniFi Controller/api-key")
        TF_VAR_wlan_passphrase_home=$(op read "op://Homelab/WiFi TheRevengers/password")
        TF_VAR_wlan_passphrase_iot=$(op read "op://Homelab/WiFi Panopticon/password")
        TF_VAR_wlan_passphrase_guest=$(op read "op://Homelab/WiFi kugel-tikka-masala/password")
        TF_VAR_wlan_passphrase_work=$(op read "op://Homelab/WiFi DunderMiffLAN/password")
        export TF_VAR_unifi_api_url TF_VAR_unifi_api_key TF_VAR_wlan_passphrase_home \
          TF_VAR_wlan_passphrase_iot TF_VAR_wlan_passphrase_guest TF_VAR_wlan_passphrase_work

  # yaml-lint: the family profile at lint/yamllint-relaxed.yml, not the template
  # default `-d relaxed` (yamllint's own shipped profile). `targets:` and
  # `changes:` must name the same surface — widen both together.
  - project: eric/weisssrv-lib
    ref: v0.18.1
    file: /ci/lint/yaml-lint.yml
    inputs:
      config: "-c lint/yamllint-relaxed.yml"
      targets: "ansible/ kubernetes/ terraform/ scripts/ lint/ .gitlab-ci.yml .gitlab/ Taskfile.yml taskfiles/"
      changes:
        - "ansible/**/*"
        - "kubernetes/**/*"
        - "terraform/**/*"
        - "scripts/**/*"
        - ".gitlab-ci.yml"
        - ".gitlab/**/*"
        - "Taskfile.yml"
        - "taskfiles/**/*"
        - "lint/**/*"

  # comment-length: the whole tree at the library's limits, with this repo's
  # scope config. `changes:` takes the library default `["**/*"]`: the
  # convention applies to every file.
  - project: eric/weisssrv-lib
    ref: v0.18.1
    file: /ci/lint/comment-length.yml
    inputs:
      # `paths` empty so the config is the only source of roots, which is the
      # invocation `task lint:comment-length` runs.
      paths: ""
      config: "--config scripts/comment-length.yaml"

  # shellcheck: `find_dir` empty and no `ansible/*.sh` — the roles' shell ships
  # in the collection, where the library's own pipeline checks it. What is left
  # is scripts/ plus the terraform helper scripts.
  - project: eric/weisssrv-lib
    ref: v0.18.1
    file: /ci/lint/shellcheck.yml
    inputs:
      direct_globs: "scripts/*.sh terraform/*/*.sh"
      find_dir: ""
      changes:
        - "scripts/**/*"
        - "terraform/*/*.sh"
        # The job's direct_globs/find_dir inputs live here, so a change to how
        # the gate runs has to re-run it.
        - ".gitlab-ci.yml"

  # ansible-lint: playbooks, inventories and the integration scenarios. Its
  # syntax-check rule runs `ansible-playbook --syntax-check` per playbook. No
  # `config:` input: ansible-lint finds ./.ansible-lint from its own cwd.
  - project: eric/weisssrv-lib
    ref: v0.18.1
    file: /ci/lint/ansible-lint.yml
    inputs:
      targets: "ansible/"
      galaxy_requirements: "ansible/requirements.yml"
      # collections_path is empty: this repo ships no in-repo collection, so the
      # only search path is the galaxy install of weisssrv.infra.
      collections_path: ""
      # Full image, not slim: galaxy installs the collection from a git+ URL,
      # which needs the git executable.
      image: python:3.13
      changes:
        - "ansible/**/*"
        - ".ansible-lint"
        - "lint/yamllint-relaxed.yml"
        - ".gitlab-ci.yml"

  # python-lint: ruff over the helper scripts with the vendored ruff.toml profile.
  # ruff_version is explicit so a library default bump cannot move CI off
  # requirements.txt. `changes:` must name the same surface as `targets:` — widen both.
  - project: eric/weisssrv-lib
    ref: v0.18.1
    file: /ci/lint/python-lint.yml
    inputs:
      targets: "scripts kubernetes"
      config: "--config ruff.toml"
      ruff_version: "0.16.0"
      changes:
        - "scripts/**/*.py"
        - "kubernetes/**/*.py"
        - "ruff.toml"
        - ".gitlab-ci.yml"

  # lint-docs-links: `changes:` is the library default plus this file, which
  # carries the job's image, ref and CHECK_DOC_LINKS_* inputs.
  - project: eric/weisssrv-lib
    ref: v0.18.1
    file: /ci/lint/docs-link-check.yml
    inputs:
      job_name: lint-docs-links
      changes:
        - "**/*.md"
        - "scripts/check-doc-links.py"
        - ".gitlab-ci.yml"

  # version-check: reports available pin updates and changes nothing. `changes`
  # is not passed — the library default `["**/*"]` matches every MR, `[]` would
  # delete the job. rc=1 (updates available) stays yellow; rc=2 reds the sweep.
  - project: eric/weisssrv-lib
    ref: v0.18.1
    file: /ci/maintenance/version-check.yml
    inputs:
      setup_command: 'pip install --quiet "pyyaml==${PYYAML_VERSION}" requests==2.34.2'
      check_command: "python3 ./scripts/version-check-ci.py"
      soft_fail_exit_codes: [1]

  # python-tests: pytest scripts/. Most of the suite are drift guards reading
  # files outside scripts/, so the `changes:` list below is hand-maintained by
  # tracing opens under `pytest scripts/`. setup_command clones the library.
  - project: eric/weisssrv-lib
    ref: v0.18.1
    file: /ci/test/python-tests.yml
    inputs:
      # The template default is 3.11-slim; ansible 14 needs >= 3.12, so the job
      # runs this pipeline's digest-pinned python image.
      image: $PY_JOB_IMAGE
      pytest_version: "9.1.1"
      pyyaml_version: "6.0.2"
      # git for the setup_command clone. jq and kustomize come from
      # ci-fetch-tools.py into $CI_PROJECT_DIR/.bin: the deploy-verify and
      # collect-state suites read jq, test_flux_corpus_gates.py runs kustomize.
      apt_packages: "git"
      # ansible-core via the ansible pin: test_deploy_preflight.py drives
      # `ansible-playbook --list-tasks` and FAILS rather than skips without it.
      pip_packages: "ansible==$ANSIBLE_VERSION"
      # setup_command runs BEFORE the template's pip install, so it installs the
      # same ansible pin to get ansible-galaxy, then the collection the
      # playbooks' weisssrv.infra.* roles resolve from. No -p: the default path.
      setup_command: 'git clone --depth 1 --branch "$WEISSSRV_LIB_REF" "$CI_SERVER_URL/eric/weisssrv-lib.git" "$WEISSSRV_LIB_PATH" && python3 scripts/ci-fetch-tools.py jq kustomize && pip install --user --quiet "ansible==$ANSIBLE_VERSION" && ansible-galaxy collection install "$WEISSSRV_LIB_PATH/ansible_collections/weisssrv/infra"'
      changes:
        - "scripts/**/*"
        - "ansible/inventories/prod/**/*"
        - "ansible/playbooks/**/*"
        - "ansible/integration-tests/**/*"
        - "ansible/requirements.yml"
        - "ansible/README.md"
        - "ansible/TESTING.md"
        # Vendored copies gate themselves, so an edit must run its own gate.
        - "ruff.toml"
        - "lint/yamllint-relaxed.yml"
        - ".gitleaks.toml"
        - ".editorconfig"
        - ".pre-commit-config.yaml"
        - ".gitlab/secret-detection-ruleset.toml"
        # test_site_configs.py pins these against the job's version variables.
        - "requirements.txt"
        - "kubernetes/clusters/weisssrv/**/*"
        - "kubernetes/infrastructure/observability/**/*"
        - "kubernetes/infrastructure/configs/**/*"
        - "kubernetes/infrastructure/sources/**/*"
        - "kubernetes/apps/**/*"
        - "kubernetes/components/**/*"
        - "kubernetes/infrastructure/controllers/**/*"
        - "kubernetes/infrastructure/crds/**/*"
        - "kubernetes/README.md"
        # test_terraform_roots.py and test_site_configs.py read every root past
        # main.tf — versions.tf, variables.tf and each module `?ref=` pin.
        - "terraform/**/*"
        - "docker/*/README.md"
        - "docs/**/*"
        - "README.md"
        - "CLAUDE.md"
        - "AGENTS.md"
        - ".cursorrules"
        - ".claude/**/*"
        - "Taskfile.yml"
        - "taskfiles/**/*"
        - ".gitlab-ci.yml"
        - ".gitlab/ci/**/*"
        # test_repo_hygiene.py asserts .gitignore hides a saved tfplan.
        - ".gitignore"

  # flux-lint: substitute mode (postBuild substitution from the cluster versions
  # ConfigMap; needs a root runner for gettext-base). extra_validation runs
  # scripts/flux-corpus-gates.sh, the same gates `task flux:lint` runs.
  - project: eric/weisssrv-lib
    ref: v0.18.1
    file: /ci/validate/flux-lint.yml
    inputs:
      substitute: true
      kubeconform_version: "0.8.0"
      kubeconform_sha256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
      kustomize_version: "5.8.3"
      kustomize_sha256: "cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61"
      helm_version: "3.22.0"
      helm_sha256: "1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb"
      pyyaml_version: "6.0.2"
      cluster_dir: "kubernetes/clusters/weisssrv"
      versions_configmap: "kubernetes/infrastructure/sources/versions-configmap.yaml"
      # flux-env.sh wraps flux-render.sh and adds the second substitution
      # ConfigMap (cluster-config) this cluster needs (docs/13-ci-cd.md).
      flux_render_script: "scripts/flux-env.sh"
      skipped_script: "scripts/kubeconform-skipped.py"
      # Same CRD-catalog commit taskfiles/flux.yml pins, so the local gate and
      # this job accept one schema set. test_site_configs.py holds them equal.
      crd_catalog_ref: "ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2"
      # Baseline of kinds allowed to validate against no schema. Set, so an
      # unreachable catalog reds the job instead of degrading it to core kinds.
      expected_skipped_file: "scripts/kubeconform-expected-skipped.txt"
      # The library default is the first two entries only; the rest are the gate
      # scripts and site data this job's behaviour is defined by. Without them an
      # MR that loosens a policy file skips flux-lint and merges green.
      changes:
        - "kubernetes/**/*"
        - "ansible/inventories/prod/group_vars/all.yml"
        - "scripts/autoscaling-policy.yaml"
        - "scripts/helm-values-releases.yaml"
        - "scripts/check-hpa-vpa-invariant.py"
        - "scripts/check-scrape-netpol.py"
        - "scripts/check-default-deny-coverage.py"
        - "scripts/check-dockerconfigjson.py"
        - "scripts/check-secretstore-scope.py"
        - "scripts/check-pvc-storageclass.py"
        - "scripts/check-ephemeral-storage-cap.py"
        - "scripts/check-nfs-tls.py"
        # Imported from its own directory by the corpus gates above.
        - "scripts/gate_common.py"
        - "scripts/validate-helm-values.py"
        - "scripts/flux-render.sh"
        - "scripts/flux-env.sh"
        - "scripts/kubeconform-skipped.py"
        - "scripts/kubeconform-expected-skipped.txt"
        - "scripts/flux-corpus-gates.sh"
        - "scripts/check-grafana-sidecar-init.py"
        # This file carries the job's own inputs: the extra_validation argv and
        # the kubeconform/kustomize/helm pins. ci-pin-parity covers the kustomize
        # pin only, so without this a changed gate merges without running.
        - ".gitlab-ci.yml"
      extra_validation: 'scripts/flux-corpus-gates.sh "$RENDER_ALL" "$VERSIONS_CONFIGMAP" || FAILED=1; python3 scripts/check-grafana-sidecar-init.py || FAILED=1'

  # pr-agent-review (ai-review stage): advisory AI review of the MR, on masked
  # CI variables rather than 1Password. `gate` decides whether the job is
  # created, so it must name an unprotected variable (docs/13).
  - project: eric/weisssrv-lib
    ref: v0.18.1
    file: /ci/review/pr-agent.yml
    inputs:
      secrets_source: "env"
      gate: '$OPENAI__KEY && $GITLAB__PERSONAL_ACCESS_TOKEN'
      # Lint + secret detection only: AI review benefits from knowing the code
      # is lint-clean and secret-safe, and must not wait on the DinD suite.
      needs:
        - job: shellcheck
          optional: true
        - job: yaml-lint
          optional: true
        - job: ansible-lint
          optional: true
        - job: terraform-fmt
          optional: true
        - job: check-generated-files
          optional: true
        - job: flux-lint
          optional: true
        - job: secret_detection

# Additive override of the library-generated job, which exposes no variables
# input: where its setup_command clones the library, and the roles inside that
# clone. Without WEISSSRV_INFRA_ROLES test_doc_inventories.py skips its gate.
python-tests:
  variables:
    WEISSSRV_LIB_PATH: "$CI_PROJECT_DIR/.tmp/weisssrv-lib"
    WEISSSRV_INFRA_ROLES: "$CI_PROJECT_DIR/.tmp/weisssrv-lib/ansible_collections/weisssrv/infra/roles"

# Additive override: the library job carries `needs: []`, which makes it a
# second fan-out root competing for the runner pod quota. Queued behind
# yaml-lint instead, optional because yaml-lint is path-filtered.
comment-length:
  needs:
    - job: yaml-lint
      optional: true

# GATE STAGE - validation gate for deploy jobs. Every deploy job needs it
# non-optionally, and it needs every applicable lint/validate/test/build/security
# job. `optional: true` tolerates a job the rules never created.

# Fan-in for the integration-tests matrix: a `needs:` on a `parallel: matrix`
# job expands to one entry per instance and GitLab caps a job at 50 needs.
# interruptible:false so a second merge cannot orphan the first merge's deploys.
test-aggregate-integration:
  stage: security
  image: alpine:3.23
  interruptible: false
  needs:
    # artifacts: false — status-only fan-in (the script is a bare echo); without
    # it GitLab would download every instance's junit artifact for no reason.
    - job: integration-tests
      optional: true
      artifacts: false
  script:
    - echo "integration test matrix complete"
  # These rules MUST stay identical to validation-gate's below: it needs this
  # job non-optionally, so if this job is created for a pipeline where that gate
  # is not (or vice versa), pipeline creation fails. Same rules => co-present.
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main"'

validation-gate:
  stage: gate
  image: alpine:3.23
  # interruptible:false: a newer commit must not auto-cancel a running gate, or
  # the first pipeline's deploy jobs are orphaned on an unmet need.
  interruptible: false
  needs:
    # Path-filtered jobs (may not exist in pipeline)
    - job: shellcheck
      optional: true
    - job: yaml-lint
      optional: true
    - job: ansible-lint
      optional: true
    - job: terraform-fmt
      optional: true
    - job: terraform-validate
      optional: true
    - job: terraform-tflint
      optional: true
    - job: terraform-plan
      optional: true
    - job: check-generated-files
      optional: true
    - job: flux-lint
      optional: true
    - job: prometheus-config-lint
      optional: true
    - job: check-deploy-playbooks
      optional: true
    - job: check-repo-policies
      optional: true
    - job: check-integration-matrix
      optional: true
    - job: lint-docs-links
      optional: true
    - job: python-lint
      optional: true
    - job: comment-length
      optional: true
    - job: check-role-inputs
      optional: true
    # Image builds: both are path-gated (optional), and both trigger on the same
    # all.yml that drives the deploys — without these, the pipeline that bumps
    # an image pin can fail its build and still run the whole deploy stage.
    - job: build-hermes-agent
      optional: true
    - job: build-camofox-browser
      optional: true
    # The drift plans are deliberately NOT here: they are advisory
    # (allow_failure) like pr-agent-review, so they could never block the gate.
    - job: python-tests
      optional: true
    # integration-tests is fanned in via test-aggregate-integration, which
    # carries the same rules as this gate. Non-optional: a broken invariant
    # should fail pipeline creation loudly rather than un-gate the deploy.
    - job: test-aggregate-integration
    # Always-run jobs (no path filter, always present on main pushes)
    - job: secret_detection
  script:
    # Every deploy-* job gates on $OP_SERVICE_ACCOUNT_TOKEN, so an unset token
    # silently creates none of them and main goes green having deployed nothing.
    # This gate has no token guard, so it can fail loudly instead.
    - |
      if [ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
        echo "ERROR: OP_SERVICE_ACCOUNT_TOKEN is unset/empty on a main pipeline." >&2
        echo "       All deploy-* jobs gate on this token and would be silently skipped," >&2
        echo "       deploying nothing while the pipeline reports success." >&2
        echo "       Set the OP_SERVICE_ACCOUNT_TOKEN CI/CD variable (masked, protected)." >&2
        exit 1
      fi
    - echo "All applicable checks passed - deploy jobs may proceed"
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main"'

# DEPLOY STAGE - auto-deploy on merge to main. Each Ansible deploy job sets a
# per-job resource_group, so two pipelines never run the same play against the
# same hosts. deploy-terraform uses its HTTP state lock instead.

# The ordering every guest-app deploy needs: the fleet-wide plays touch these
# guests too, and a firewall/dns/cert run overlapping an in-flight app deploy
# on the same host causes sudo-prompt timeouts and mid-reconfigure probes.
.guest-app-needs:
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
    - job: deploy-ansible-firewall
      optional: true
    - job: deploy-ansible-dns
      optional: true
    - job: deploy-ansible-certs
      optional: true

# Terraform

deploy-terraform:
  extends: .terraform-http-backend
  stage: deploy
  interruptible: false
  image:
    name: $TF_JOB_IMAGE
    entrypoint: [""]
  needs:
    - job: validation-gate
    - job: terraform-plan
      artifacts: true
  before_script:
    - !reference [.install-1password-alpine, before_script]
  script:
    - cd terraform/cloudflare
    # -lockfile=readonly: CI must not rewrite .terraform.lock.hcl (provider
    # hashes are committed; a CI-side change would mask supply-chain drift).
    - terraform init -lockfile=readonly
    - |
      # Fail closed on deletions: `prevent_destroy` covers only the records
      # flagged protected, and this apply is unattended on every merge. Counted
      # from the binary plan; a replacement counts as delete+create.
      set -eo pipefail
      deletes=$(terraform show -json tfplan | jq '[.resource_changes[]?.change.actions? | select(index("delete"))] | length')
      if [ "$deletes" -ne 0 ] && [ "${ALLOW_DNS_DELETE:-0}" != "1" ]; then
        echo "saved plan deletes ${deletes} resource(s). Review it, then apply deliberately with task terraform:cloudflare-apply (or set ALLOW_DNS_DELETE=1 and retry this job)." >&2
        exit 1
      fi
    - |
      # Assign, then export: `export VAR=$(...)` returns export's status, so a
      # failed vault read would pass silently.
      set -eo pipefail
      TF_VAR_cloudflare_api_token=$(op read "op://Homelab/Cloudflare Terraform Token/credential")
      TF_VAR_cloudflare_account_id=$(op read "op://Homelab/Cloudflare Terraform Token/username")
      export TF_VAR_cloudflare_api_token TF_VAR_cloudflare_account_id
      terraform apply -auto-approve -lock-timeout=120s tfplan
  environment:
    name: production/cloudflare
  rules:
    - !reference [.skip-schedule-web, rules]
    # Cloudflare-only: an unrelated terraform/tailscale change must not fire a
    # Cloudflare plan+apply (which could revert out-of-band Cloudflare drift).
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-terraform-cloudflare, changes]

# Ansible Infrastructure

deploy-ansible-base:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-base
  needs:
    - job: validation-gate
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    # LOKI_PUSH_USER/PASSWORD come from the shared .deploy-base: alloy_host
    # needs them on any site.yml-based deploy, not just this job.
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/base.yml
    # node_exporter_host, alloy_host and encrypted_swap live in site.yml, not
    # base.yml, so this tag-scoped follow-up deploys them. A role missing from
    # the tag list deploys nothing while the job stays green.
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --tags node_exporter_host,alloy_host,encrypted_swap
  environment:
    name: production/ansible-base
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        # THE COLLECTION PIN, watched by every deploy job: a role change reaches
        # this repo only as a version bump here, and a bump re-runs the fleet's
        # (idempotent) plays.
        - ansible/requirements.yml
        - ansible/playbooks/base.yml
        # all.yml carries alloy_host_version and the other base-consumed pins.
        # An unrelated bump re-runs an idempotent play.
        - ansible/inventories/prod/group_vars/all.yml
        - ansible/playbooks/site.yml
        - ansible/inventories/prod/group_vars/proxmox.yml
        # hosts.yml: host roster/IP/topology changes must redeploy the base play
        - ansible/inventories/prod/hosts.yml
        # Per-host overrides: the triggers above never see an inventory-only
        # edit. Listed per file, not as a glob, because the deploy-coverage
        # gate ignores wildcards by design.
        - ansible/inventories/prod/host_vars/pve-nas-01.yml
        # Hardware-trait groups carrying the nic_tuning/swap overrides.
        - ansible/inventories/prod/group_vars/e1000e_hosts.yml
        - ansible/inventories/prod/group_vars/small_ram_hosts.yml
        - ansible/inventories/prod/group_vars/bonded_hosts.yml

# Proxmox host configuration (qol, postfix_null_client, tailscale)
deploy-ansible-proxmox:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-proxmox
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
    # nfs_tls server mode on pve-nas-01 asserts the acme_certs-distributed
    # wildcard cert and key, so certificates must land first.
    - job: deploy-ansible-certs
      optional: true
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    TAILSCALE_AUTH_KEY: "op://Homelab/Tailscale Auth Key/credential"
  script:
    - cd ansible
    # Every role enabled for this host set must stay in the tag list or it
    # deploys nowhere while the job stays green. nfs_tls also reaches pve-nas-01
    # via site.yml's NAS play, in server mode, so it needs the acme_certs cert.
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --limit proxmox --tags qol,postfix_null_client,tailscale,zfs_arc_cap,vfio_passthrough,nfs_tls
  environment:
    name: production/ansible-proxmox
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/requirements.yml
        # This job RUNS site.yml plays (--limit proxmox); a change to those
        # plays must redeploy too (idempotent, so extra triggers are safe).
        - ansible/playbooks/site.yml
        # Inventory inputs of the proxmox-host plays (NOT all.yml: its
        # tailscale/plex pins deploy via manual maintenance jobs by design).
        - ansible/inventories/prod/group_vars/proxmox.yml
        - ansible/inventories/prod/hosts.yml
        # zfs_arc_cap is deployed here and nowhere else: proxmox.yml plus the
        # small_ram_hosts override. The coverage gate ignores wildcards, so
        # list each file.
        - ansible/inventories/prod/host_vars/pve-nas-01.yml
        - ansible/inventories/prod/group_vars/e1000e_hosts.yml
        - ansible/inventories/prod/group_vars/small_ram_hosts.yml

deploy-ansible-firewall:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-firewall
  needs:
    - job: validation-gate
    - job: deploy-ansible-proxmox
      optional: true
  script:
    - cd ansible
    # Firewall is applied to proxmox hosts, dns, and mail via site.yml
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --tags proxmox_firewall
  environment:
    name: production/ansible-firewall
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/requirements.yml
        # The ipset/security-group render reads the ENTIRE inventory (every
        # host's ansible_host and firewall_ipsets membership), and per-guest
        # assignments live only in hosts.yml — so trigger on all of it.
        - ansible/inventories/prod/**/*
        # This job RUNS site.yml's proxmox_firewall plays, so a change to which
        # host groups they target must redeploy.
        - ansible/playbooks/site.yml
        # Named explicitly: the coverage gate refuses to let a `**` glob confer
        # coverage on a group_vars file. `services` is the HAOS group, which
        # only this job reaches (delegating to a Proxmox host to write the .fw).
        - ansible/inventories/prod/group_vars/services.yml
        # Same reason: pve-opt-02 host_vars selects that node's firewall
        # implementation, which only this job renders into host.fw.
        - ansible/inventories/prod/host_vars/pve-opt-02.yml

deploy-ansible-dns:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-dns
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    ADGUARD_ADMIN_PASSWORD: "op://Homelab/AdGuard Home/password"
    DNS01_SSH_PRIVATE_KEY: "op://Homelab/DNS-01 SSH Key/private key"
    DNS01_SSH_PUBLIC_KEY: "op://Homelab/DNS-01 SSH Key/public key"
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/dns.yml
  environment:
    name: production/ansible-dns
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/requirements.yml
        - ansible/playbooks/dns.yml
        # all.yml carries the unbound_exporter / adguard pins dns.yml consumes.
        # An unrelated bump re-runs an idempotent play.
        - ansible/inventories/prod/group_vars/all.yml
        # DNS group/host vars: lxc settings, ssh policy, cert distribution
        # targets — all consumed by the dns playbook, so a vars-only change
        # must trigger a redeploy.
        - ansible/inventories/prod/group_vars/dns.yml
        - ansible/inventories/prod/host_vars/dns-01.yml
        - ansible/inventories/prod/host_vars/dns-02.yml
        # hosts.yml: DNS host IPs/roster
        - ansible/inventories/prod/hosts.yml

deploy-ansible-storage:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-storage
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
    # storage.yml runs nfs_tls in server mode on pve-nas-01, which asserts the
    # acme_certs-distributed wildcard cert and key.
    - job: deploy-ansible-certs
      optional: true
  variables:
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SAMBA_NAS_PASSWORD: "op://Homelab/Samba NAS User/password"
    # B2 offsite backup (restic_offsite on pve-nas-01), read from env by
    # host_vars/pve-nas-01.yml. The restic_* fields are the restricted hide-only
    # key; b2_key_id/b2_application_key stay the full key (docs/42 Step 0).
    B2_KEY_ID: "op://Homelab/B2 Archive Backup/restic_key_id"
    B2_APPLICATION_KEY: "op://Homelab/B2 Archive Backup/restic_application_key"
    RESTIC_REPO_PASSWORD: "op://Homelab/B2 Archive Backup/restic_repo_password"
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/storage.yml
  environment:
    name: production/ansible-storage
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/requirements.yml
        # pve-nas-01 host_vars carry the NFS exports, zvols and vzdump config
        # the storage play renders.
        - ansible/inventories/prod/host_vars/pve-nas-01.yml
        - ansible/inventories/prod/group_vars/proxmox.yml
        - ansible/inventories/prod/hosts.yml
        - ansible/playbooks/storage.yml
        # all.yml carries the restic/rclone/zfs_exporter pins, which have no
        # other deploy path. An unrelated bump re-runs an idempotent play.
        - ansible/inventories/prod/group_vars/all.yml

deploy-ansible-mail:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-mail
  needs:
    - job: validation-gate
    - job: deploy-ansible-dns
      optional: true
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    SMTP_GMAIL_USER: "op://Homelab/SMTP Relay Gmail/username"
    SMTP_GMAIL_PASSWORD: "op://Homelab/SMTP Relay Gmail/password"
    # Required: this run includes base on smtp-relay, whose SSH-lockout guard
    # fails the deploy when base_ssh_authorized_keys is empty.
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
  script:
    - cd ansible
    # Mail roles are deployed via site.yml with host targeting
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --limit mail
  environment:
    name: production/ansible-mail
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/requirements.yml
        # Relay/null-client settings the run consumes, plus the host roster.
        - ansible/inventories/prod/group_vars/mail.yml
        - ansible/inventories/prod/host_vars/smtp-relay.yml
        - ansible/inventories/prod/hosts.yml
        # This job RUNS site.yml plays (--limit mail).
        - ansible/playbooks/site.yml

deploy-ansible-certs:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-certs
  variables:
    # acme_certs asserts acme_certs_email on dns-01, resolved from admin_email
    # <- ROOT_EMAIL_ALIAS. The SSH-key fields cannot come through op run (see
    # the script: block).
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
  needs:
    - job: validation-gate
    - job: deploy-ansible-dns
      optional: true
    - job: deploy-ansible-mail
      optional: true
  script:
    - cd ansible
    # `op run` resolves an SSH-KEY item's key fields to EMPTY for a
    # service-account token, so these cannot be op:// refs in `variables:`.
    # `op read` does resolve them.
    - |
      DNS01_SSH_PRIVATE_KEY="$(op read 'op://Homelab/DNS-01 SSH Key/private key')"
      DNS01_SSH_PUBLIC_KEY="$(op read 'op://Homelab/DNS-01 SSH Key/public key')"
      if [ -z "$DNS01_SSH_PRIVATE_KEY" ] || [ -z "$DNS01_SSH_PUBLIC_KEY" ]; then
        echo "ERROR: op read returned empty DNS-01 SSH Key material (check the service account's vault access to 'DNS-01 SSH Key')." >&2
        exit 1
      fi
      export DNS01_SSH_PRIVATE_KEY DNS01_SSH_PUBLIC_KEY
    # Certificate roles via site.yml; op run resolves the remaining op:// vars.
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --limit dns --tags acme_certs
  environment:
    name: production/ansible-certs
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/requirements.yml
        # dns-01 host_vars carry the pinned host_key entries acme_certs uses for
        # cert distribution.
        - ansible/inventories/prod/host_vars/dns-01.yml
        # This job RUNS site.yml plays (--limit dns --tags acme_certs).
        - ansible/playbooks/site.yml
        # Cert-distribution target addresses.
        - ansible/inventories/prod/hosts.yml
        # A mail-only merge runs base on smtp-relay, which drops the pinned
        # cert-distribution key; this job re-seeds it.
        - ansible/inventories/prod/group_vars/mail.yml
        - ansible/inventories/prod/host_vars/smtp-relay.yml

# Ansible Applications (VMs/LXC)

deploy-plex:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-plex
  needs: !reference [.guest-app-needs, needs]
  variables:
    # Required: plex.yml runs postfix_null_client, whose aliases task fails
    # undefined without it.
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    # Required: the plex role asserts it before re-keying. Matches Plex
    # Settings -> Network -> "Custom certificate encryption key".
    PLEX_PFX_PASSPHRASE: "op://Homelab/Plex Custom Certificate/password"
    # Required: the base role rewrites the LXC's authorized_keys, and plex.yml's
    # last play re-pins the cert-distribution key from this value.
    DNS01_SSH_PUBLIC_KEY: "op://Homelab/DNS-01 SSH Key/public key"
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/plex.yml
  environment:
    name: production/plex
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/requirements.yml
        - ansible/playbooks/plex.yml
        # Inventory inputs of the plex play (LXC definition + app vars).
        - ansible/inventories/prod/group_vars/plex_servers.yml
        - ansible/inventories/prod/host_vars/plex.yml
        - ansible/inventories/prod/hosts.yml

deploy-gitlab:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-gitlab
  needs: !reference [.guest-app-needs, needs]
  variables:
    # The gitlab role reads these from env; op run resolves the op:// refs.
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    GITLAB_ROOT_PASSWORD: "op://Homelab/GitLab/root-password"
    GITLAB_SAML_CERT_FINGERPRINT: "op://Homelab/GitLab SSO/saml-cert-fingerprint"
    # Instance-admin PAT for the role's /application/settings API calls. The
    # name must not be GITLAB_API_TOKEN: that project-level masked variable
    # outranks a job's variables: block, so the op:// ref would not resolve.
    GITLAB_ADMIN_API_TOKEN: "op://Homelab/GitLab API Token/credential"
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/gitlab.yml
    - |
      # Wait for the GitLab API to come back after the reconfigure (up to 5 min).
      echo "Waiting for GitLab API..."
      gitlab_healthy=false
      start_ts=$(date +%s)
      while true; do
        if curl -sf --max-time 5 "${CI_SERVER_URL}/-/readiness" > /dev/null 2>&1; then
          elapsed=$(( $(date +%s) - start_ts ))
          echo "GitLab API healthy after ${elapsed}s"
          gitlab_healthy=true
          break
        fi
        elapsed=$(( $(date +%s) - start_ts ))
        if [ "$elapsed" -ge 300 ]; then break; fi
        [ $((elapsed % 20)) -lt 3 ] && echo "Still waiting... (${elapsed}s)"
        sleep 2
      done
      if [ "$gitlab_healthy" != "true" ]; then
        echo "ERROR: GitLab API did not become healthy in 300s"
        exit 1
      fi
  environment:
    name: production/gitlab
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/requirements.yml
        - ansible/playbooks/gitlab.yml
        # Group vars the gitlab playbook consumes, the VM definition, and the
        # gitlab_version pin. An unrelated bump re-runs an idempotent play.
        - ansible/inventories/prod/group_vars/gitlab_servers.yml
        - ansible/inventories/prod/hosts.yml
        - ansible/inventories/prod/group_vars/all.yml

deploy-nextcloud:
