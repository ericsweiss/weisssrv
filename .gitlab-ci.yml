deploy-gitlab-runner:
  stage: deploy
  extends: .k3s-deploy-base
  needs:
    - job: validation-gate
    - job: deploy-k3s-platform
      optional: true
    - job: deploy-gitlab
      optional: true
    - job: deploy-gitlab-ingress
      optional: true
  script:
    - |
      cd kubernetes/apps/gitlab-runner
      VARS_FILE="../../../ansible/inventories/prod/group_vars/all.yml"
      RUNNER_VERSION=$(yq -r '.gitlab_runner_helm_version' $VARS_FILE)
      RUNNER_TOKEN=$(op read "op://Homelab/GitLab Runner/runner-token")

      echo "Deploying GitLab Runner ${RUNNER_VERSION}..."
      helm repo add gitlab https://charts.gitlab.io
      helm repo update

      kubectl apply -f namespace.yaml

      # Create temporary values file with token (avoids exposing token in process args)
      echo "runnerToken: \"$RUNNER_TOKEN\"" > /tmp/runner-token.yaml
      helm upgrade --install gitlab-runner gitlab/gitlab-runner \
        -n gitlab-runner \
        -f values.yaml \
        -f /tmp/runner-token.yaml \
        --version "$RUNNER_VERSION"
      rm -f /tmp/runner-token.yaml

      echo "GitLab Runner upgrade submitted (pod will restart after this job completes)"
  environment:
    name: production/k3s-gitlab-runner
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - kubernetes/apps/gitlab-runner/**
        - ansible/inventories/prod/group_vars/all.yml

