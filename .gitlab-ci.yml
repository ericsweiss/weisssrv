deploy-ansible-certs:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-certs
  variables:
    # acme_certs asserts acme_certs_email on dns-01, and that resolves from
    # admin_email <- ROOT_EMAIL_ALIAS. Every other deploy job injects this op:// ref; it was
    # missing here, so `op run` left admin_email undefined and the play failed
    # the "Validate required acme.sh variables" assert (the SSH-key fields, by
    # contrast, are handled via `op read` in script below).
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
  needs:
    - job: validation-gate
    - job: deploy-ansible-dns
      optional: true
    - job: deploy-ansible-mail
      optional: true
  script:
    - cd ansible
    # `op run` does NOT inject an SSH-KEY item's private/public key fields into
    # the environment for a service-account token (it resolves them to empty),
    # so acme_certs saw DNS01_SSH_* unset. `op read` DOES resolve them — the same
    # call .deploy-base uses to fetch the SSH connection key — so read them
    # explicitly here, then run ansible. (Not in `variables:` as op:// refs,
    # because that path goes through op run's broken SSH-key injection.)
    - |
      DNS01_SSH_PRIVATE_KEY="$(op read 'op://Homelab/DNS-01 SSH Key/private key')"
      DNS01_SSH_PUBLIC_KEY="$(op read 'op://Homelab/DNS-01 SSH Key/public key')"
      if [ -z "$DNS01_SSH_PRIVATE_KEY" ] || [ -z "$DNS01_SSH_PUBLIC_KEY" ]; then
        echo "ERROR: op read returned empty DNS-01 SSH Key material (check the service account's vault access to 'DNS-01 SSH Key')." >&2
        exit 1
      fi
      export DNS01_SSH_PRIVATE_KEY DNS01_SSH_PUBLIC_KEY
    # Certificate roles via site.yml; op run resolves the remaining op:// vars.
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --limit dns --tags acme_certs
  environment:
    name: production/ansible-certs
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
    # Collection pin (see deploy-ansible-base).
        - ansible/requirements.yml
        # host_vars/dns-01.yml carries the pinned host_key entries that
        # acme_certs uses for cert distribution; a change to those
        # fingerprints needs a redeploy.
        - ansible/inventories/prod/host_vars/dns-01.yml
        # This job RUNS site.yml plays (--limit dns --tags acme_certs); a
        # change to those plays must redeploy too.
        - ansible/playbooks/site.yml
        # hosts.yml: cert-distribution target addresses.
        - ansible/inventories/prod/hosts.yml

