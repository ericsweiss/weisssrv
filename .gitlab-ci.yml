deploy-gitlab:
  stage: deploy
  extends: .deploy-base
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
  variables:
    # GitLab role reads secrets from env vars via lookup('ansible.builtin.env', ...)
    # op run resolves op:// references in environment variables at runtime
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    GITLAB_ROOT_PASSWORD: "op://Homelab/GitLab/root-password"
    GITLAB_SAML_CERT_FINGERPRINT: "op://Homelab/GitLab SSO/saml-cert-fingerprint"
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/gitlab.yml
    - |
      # Wait for GitLab API to come back after reconfigure (up to 5 min)
      echo "Waiting for GitLab API..."
      gitlab_healthy=false
      start_ts=$(date +%s)
      while true; do
        if curl -sf --max-time 5 https://git.ericsweiss.com/-/readiness > /dev/null 2>&1; then
          elapsed=$(( $(date +%s) - start_ts ))
          echo "GitLab API healthy after ${elapsed}s"
          gitlab_healthy=true
          break
        fi
        elapsed=$(( $(date +%s) - start_ts ))
        if [ "$elapsed" -ge 300 ]; then break; fi
        [ $((elapsed % 20)) -lt 3 ] && echo "Still waiting... (${elapsed}s)"
        sleep 2
      done
      if [ "$gitlab_healthy" != "true" ]; then
        echo "ERROR: GitLab API did not become healthy in 300s"
        exit 1
      fi
  environment:
    name: production/gitlab
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/gitlab/**
        - ansible/playbooks/gitlab.yml
        # all.yml triggers deploy for gitlab_version changes; may also trigger
        # on unrelated version bumps but the playbook is idempotent and safe to re-run
        - ansible/inventories/prod/group_vars/all.yml

deploy-home-assistant-config:
  stage: deploy
  extends: .deploy-base
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
  variables:
    # Home Assistant role reads secrets from env vars via lookup('ansible.builtin.env', ...)
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    ADMIN_EMAIL: "op://Homelab/Email Config/root_alias"
    HA_OIDC_CLIENT_ID: "op://Homelab/Home Assistant SSO/authentik-client-id"
    HA_OIDC_CLIENT_SECRET: "op://Homelab/Home Assistant SSO/authentik-client-secret"
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod -e "ansible_become=false" playbooks/home-assistant.yml
  environment:
    name: production/home-assistant
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/home_assistant/**
        - ansible/playbooks/home-assistant.yml

deploy-gitlab-verify:
  stage: deploy
  extends: .deploy-base
  needs:
    - job: validation-gate
    - job: deploy-gitlab
      optional: true
    # Ingress/runner deploys are now Flux-managed; reconciliation typically
    # completes within 1-2 minutes of the push that triggered this pipeline.
  script:
    - |
      echo "=== GitLab Verification ==="
      # Each check records its own failure instead of exiting immediately —
      # an operator wants to see EVERY failing component in one run, not
      # stop at the first one. Final summary surfaces exit code.
      # With allow_failure: true on the job, a non-zero exit yields a yellow
      # warning-style status in the pipeline UI but doesn't block the pipeline.
      EXIT=0

      echo "Testing GitLab web UI..."
      if ! curl_err=$(curl -sf --max-time 30 "https://git.ericsweiss.com/-/readiness" 2>&1); then
        echo "ERROR: GitLab readiness check failed: $curl_err"
        EXIT=1
      else
        echo "GitLab web UI: OK"
      fi

      echo "Testing Container Registry..."
      REGISTRY_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://registry.git.ericsweiss.com/v2/)
      if [ "$REGISTRY_CODE" = "200" ] || [ "$REGISTRY_CODE" = "401" ]; then
        echo "Container registry: OK (HTTP $REGISTRY_CODE)"
      else
        echo "Container registry: FAILED (HTTP $REGISTRY_CODE)"
        EXIT=1
      fi

      echo "Testing SSH connectivity..."
      if timeout 5 bash -c 'cat < /dev/null > /dev/tcp/192.168.0.153/22' 2>/dev/null; then
        echo "SSH port 22: OK"
      else
        echo "ERROR: SSH port 22 on 192.168.0.153 not reachable"
        EXIT=1
      fi

      echo ""
      echo "=== GitLab Verification Complete (exit=$EXIT) ==="
      exit $EXIT
  environment:
    name: production/gitlab-verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/gitlab/**
        - kubernetes/apps/vm-ingress/gitlab*.yaml
        - kubernetes/apps/vm-ingress/services-gitlab.yaml
        - kubernetes/apps/gitlab-runner/**
        - kubernetes/apps/gitlab-runner-privileged/**
  allow_failure: true

# ------------------------------------------------------------------------------
# Post-Deploy Verification
# ------------------------------------------------------------------------------

deploy-verify:
  stage: deploy
  extends: .k3s-deploy-base
  needs:
    - job: validation-gate
    - job: deploy-terraform
      optional: true
    - job: deploy-ansible-base
      optional: true
    - job: deploy-ansible-proxmox
      optional: true
    - job: deploy-ansible-firewall
      optional: true
    - job: deploy-ansible-dns
      optional: true
    - job: deploy-ansible-storage
      optional: true
    - job: deploy-ansible-mail
      optional: true
    - job: deploy-ansible-certs
      optional: true
    - job: deploy-plex
      optional: true
    - job: deploy-gitlab
      optional: true
    - job: deploy-home-assistant-config
      optional: true
    - job: deploy-gitlab-verify
      optional: true
    # Kubernetes workloads (k3s platform, Authentik, downloads, recipes,
    # ingress routes, runners) are Flux-managed; Flux typically reconciles
    # within 1-2 minutes of this push. deploy-verify checks cluster health
    # below and reports Flux reconciliation state via `flux get all -A`.
  script:
    - |
      # Install flux CLI alongside the kubectl already provisioned by
      # .k3s-deploy-base. Flux is the source of truth for k8s workload state,
      # so verification queries Flux CRs rather than individual Deployments.
      FLUX_VERSION="2.8.5"
      curl -fsSL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz" -o /tmp/flux.tar.gz
      echo "63c178ba938a5443265b2ce02691c005acf4ef6188d4dbb9b9d87333558948c4  /tmp/flux.tar.gz" | sha256sum -c -
      tar xzf /tmp/flux.tar.gz -C /usr/local/bin flux
      flux --version
    - |
      set -eo pipefail

      # Install tools needed for server-side dry-run validation.
      # These are already in the flux-lint job's before_script but deploy-verify
      # extends .k3s-deploy-base (kubectl + jq only), so we install them here.
      apt-get install -y -qq gettext-base > /dev/null 2>&1
      pip install --quiet pyyaml
      curl -fsSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz -o /tmp/kustomize.tar.gz
      echo "3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7  /tmp/kustomize.tar.gz" | sha256sum -c -
      tar xzf /tmp/kustomize.tar.gz -C /usr/local/bin kustomize

      # Bounded retry helper for transient startup states.
      # Suppresses output during polling; on timeout, prints the last
      # failed attempt's output for diagnostics.
      wait_for() {
        local desc="$1" timeout="$2" interval="$3"; shift 3
        local start_ts last_output
        start_ts=$(date +%s)
        while true; do
          last_output=$("$@" 2>&1) && return 0
          local elapsed=$(( $(date +%s) - start_ts ))
          if [ "$elapsed" -ge "$timeout" ]; then
            echo "wait_for: $desc timed out after ${elapsed}s"
            echo "Last check output:"
            echo "$last_output"
            return 1
          fi
          echo "wait_for: $desc not ready (${elapsed}s/${timeout}s)..."
          sleep "$interval"
        done
      }

      echo "=== Post-Deployment Verification ==="

      # jq filter fragment: select items whose Ready condition is missing or not True.
      # Used by multiple check functions below.
      JQ_NOT_READY='select((.status.conditions // []) | map(select(.type == "Ready")) | (length == 0 or .[0].status != "True"))'

      echo "Checking node status..."
      check_nodes_ready() {
        NODE_OUTPUT=$(kubectl get nodes --no-headers)
        [ -z "$NODE_OUTPUT" ] && return 1
        NOT_READY=$(echo "$NODE_OUTPUT" | awk '$2 != "Ready" {count++} END {print count+0}')
        [ "$NOT_READY" -eq 0 ]
      }
      if ! wait_for "all nodes Ready" 60 5 check_nodes_ready; then
        echo "ERROR: Node(s) not Ready after 60s"
        kubectl get nodes --no-headers
        exit 1
      fi
      kubectl get nodes --no-headers

      EXIT=0

      echo ""
      echo "=== Server-side dry-run validation ==="
      # Validate rendered manifests against the cluster API without applying.
      # Catches CRD field mismatches and API validation issues that kubeconform
      # (offline schema) cannot detect. Runs before Flux reconcile so issues
      # are surfaced even if Flux itself would fail to apply them.
      VERSIONS_CONFIGMAP=kubernetes/infrastructure/sources/versions-configmap.yaml
      if [ ! -f "$VERSIONS_CONFIGMAP" ]; then
        echo "ERROR: $VERSIONS_CONFIGMAP not found"
        exit 1
      fi
      VARS_OUTPUT=$(python3 -c "
      import yaml
      with open('$VERSIONS_CONFIGMAP') as f:
          doc = yaml.safe_load(f)
      for k, v in doc.get('data', {}).items():
          print(f'{k}\t{v}')
      ") || { echo "ERROR: failed to extract version keys for dry-run"; exit 1; }
      if [ -n "$VARS_OUTPUT" ]; then
        while IFS=$'\t' read -r k v; do
          [ -n "$k" ] && export "$k=$v"
        done <<< "$VARS_OUTPUT"
        ENVSUBST_VARS=$(echo "$VARS_OUTPUT" | awk -F'\t' '{printf "${%s} ", $1}')
        for ks in kubernetes/clusters/weisssrv/*.yaml; do
          NAME=$(basename "$ks" .yaml)
          [ "$NAME" = "kustomization" ] && continue
          if ! SRCPATH=$(python3 -c "
          import yaml
          with open('$ks') as f:
              doc = yaml.safe_load(f)
          print(doc.get('spec',{}).get('path','') or '')
          "); then
            echo "    ERROR: failed to parse $ks"
            EXIT=1
            continue
          fi
          [ -z "$SRCPATH" ] && continue
          SRCPATH=${SRCPATH#./}
          echo "  dry-run: $SRCPATH"
          RAW=$(kustomize build "$SRCPATH" 2>&1) || { echo "    FAIL: kustomize build failed for $SRCPATH"; echo "$RAW"; EXIT=1; continue; }
          RENDERED=$(echo "$RAW" | envsubst "$ENVSUBST_VARS")
          if ! echo "$RENDERED" | kubectl apply --dry-run=server -f - > /dev/null 2>&1; then
            echo "    FAIL: server-side dry-run rejected manifests from $SRCPATH"
            # Re-run for diagnostic output; || true prevents set -eo pipefail
            # from aborting before the remaining checks complete.
            DRYRUN_ERR="$(echo "$RENDERED" | kubectl apply --dry-run=server -f - 2>&1 || true)"
            echo "$DRYRUN_ERR" | head -20
            EXIT=1
          fi
        done
      fi

      # Snapshot pre-reconcile state to distinguish steady-state from bootstrap.
      # If all Kustomizations are already Ready, this is a steady-state push and
      # non-Ready ExternalSecrets should be treated as failures. During bootstrap
      # or recovery (some Kustomizations not yet Ready), ESO may still be starting
      # and ES non-readiness is expected.
      PRE_KS_NOT_READY=$(kubectl get kustomizations.kustomize.toolkit.fluxcd.io -A -o json 2>/dev/null \
        | jq "[.items[] | $JQ_NOT_READY] | length" 2>/dev/null || echo "999")
      STEADY_STATE=false
      if [ "$PRE_KS_NOT_READY" -eq 0 ]; then
        STEADY_STATE=true
        echo "Cluster is steady-state (all Kustomizations were Ready pre-reconcile)"
      else
        echo "Cluster is in bootstrap/recovery ($PRE_KS_NOT_READY Kustomization(s) not Ready pre-reconcile)"
      fi

      echo ""
      echo "=== Triggering Flux reconciliation ==="
      # Force Flux to reconcile the current commit before checking status.
      # Without this, we would check stale state from the previous reconcile cycle.
      echo "Triggering Flux source reconciliation..."
      if ! flux reconcile source git flux-system --timeout=2m; then
        echo "ERROR: Flux source reconciliation failed or timed out"
        EXIT=1
      fi
      echo "Triggering root kustomization reconciliation..."
      if ! flux reconcile kustomization flux-system --timeout=3m --with-source; then
        echo "ERROR: Flux root kustomization reconciliation failed or timed out"
        EXIT=1
      fi
      # Allow downstream kustomizations time to reconcile after the root
      sleep 15

      echo ""
      echo "Flux controllers:"
      flux check

      echo ""
      echo "Flux Kustomizations:"
      flux get kustomizations -A

      echo ""
      echo "Flux HelmReleases:"
      flux get helmreleases -A

      echo ""
      echo "ExternalSecrets:"
      kubectl get externalsecrets -A

      echo ""
      echo "ExternalSecret readiness:"
      check_externalsecrets_ready() {
        ES_COUNT=$(kubectl get externalsecrets -A -o json 2>/dev/null \
          | jq "[.items[] | $JQ_NOT_READY] | length" 2>/dev/null || echo "999")
        [ "$ES_COUNT" -eq 0 ]
      }
      if ! wait_for "ExternalSecrets ready" 90 10 check_externalsecrets_ready; then
        ES_NOT_READY=$(kubectl get externalsecrets -A -o json 2>/dev/null \
          | jq "[.items[] | $JQ_NOT_READY] | length" 2>/dev/null || echo "999")
        kubectl get externalsecrets -A -o json 2>/dev/null \
          | jq -r ".items[] | $JQ_NOT_READY | \"  \(.metadata.namespace)/\(.metadata.name)\"" 2>/dev/null || true
        if [ "$STEADY_STATE" = "true" ]; then
          echo "ERROR: $ES_NOT_READY ExternalSecret(s) not Ready on a steady-state cluster"
          EXIT=1
        else
          echo "WARNING: $ES_NOT_READY ExternalSecret(s) not Ready (bootstrap/recovery)"
        fi
      else
        echo "All ExternalSecrets ready"
      fi

      # Fail if any Flux resource (Kustomization, HelmRelease, GitRepository,
      # HelmRepository, etc.) is not Ready.
      #
      # Query the CRDs directly via kubectl -o json because `flux get all`
      # only produces tabular output (json output was requested in fluxcd/flux2
      # discussions #1904 / #3535 but hasn't been implemented). An earlier
      # text-based implementation merged stderr into stdout and counted
      # warnings as outages — we use structured jq against the API instead.
      echo ""
      echo "Checking for non-Ready Flux resources..."
      FLUX_KINDS="kustomizations.kustomize.toolkit.fluxcd.io,helmreleases.helm.toolkit.fluxcd.io,gitrepositories.source.toolkit.fluxcd.io,helmrepositories.source.toolkit.fluxcd.io,ocirepositories.source.toolkit.fluxcd.io"
      check_flux_resources_ready() {
        FLUX_ALL=$(kubectl get $FLUX_KINDS -A -o json 2>/dev/null) || return 1
        NOT_READY=$(echo "$FLUX_ALL" | jq "[.items[] | $JQ_NOT_READY] | length")
        [ "$NOT_READY" -eq 0 ]
      }
      if ! wait_for "Flux resources ready" 90 10 check_flux_resources_ready; then
        FLUX_ALL=$(kubectl get $FLUX_KINDS -A -o json 2>/dev/null || echo '{"items":[]}')
        NOT_READY_COUNT=$(echo "$FLUX_ALL" | jq "[.items[] | $JQ_NOT_READY] | length")
        echo "ERROR: $NOT_READY_COUNT Flux resource(s) not Ready:"
        echo "$FLUX_ALL" | jq -r ".items[] | $JQ_NOT_READY | \"  \(.kind)/\(.metadata.namespace)/\(.metadata.name): \((.status.conditions // []) | map(select(.type == \"Ready\")) | .[0].message // \"no Ready condition\")\""
        EXIT=1
      else
        echo "All Flux resources ready"
      fi

      # Gate specifically on the top-level Flux Kustomizations — if any is
      # stuck (any child HelmRelease failing), the above broad check catches
      # it too, but naming them explicitly yields clear failure signals in
      # the pipeline output.
      check_top_kustomizations_ready() {
        for ks_name in infrastructure-sources infrastructure-controllers infrastructure-configs infrastructure-observability apps; do
          KS_READY=$(kubectl -n flux-system get kustomization "$ks_name" \
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "Unknown")
          if [ "$KS_READY" != "True" ]; then return 1; fi
        done
      }
      if ! wait_for "top-level Kustomizations ready" 60 5 check_top_kustomizations_ready; then
        for ks_name in infrastructure-sources infrastructure-controllers infrastructure-configs infrastructure-observability apps; do
          KS_READY=$(kubectl -n flux-system get kustomization "$ks_name" \
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "Unknown")
          if [ "$KS_READY" != "True" ]; then
            echo "ERROR: flux-system/$ks_name Kustomization not Ready (status=$KS_READY)"
            EXIT=1
          fi
        done
      else
        echo "All top-level Kustomizations ready"
      fi

      echo ""
      echo "=== Observability Stack ==="
      check_obs_pods_healthy() {
        OBS_PODS=$(kubectl get pods -n observability --no-headers 2>/dev/null || true)
        [ -z "$OBS_PODS" ] && return 1
        echo "$OBS_PODS" | awk '$3 !~ /^(Running|Completed)$/ {exit 1}' || return 1
        echo "$OBS_PODS" | awk '$3=="Running"{split($2,a,"/"); if(a[1]!=a[2]) exit 1}' || return 1
      }
      if ! wait_for "observability pods healthy" 120 10 check_obs_pods_healthy; then
        OBS_PODS=$(kubectl get pods -n observability --no-headers 2>/dev/null || true)
        if [ -z "$OBS_PODS" ]; then
          if [ "$STEADY_STATE" = "true" ]; then
            echo "ERROR: No pods in observability namespace on a steady-state cluster"
            EXIT=1
          else
            echo "WARNING: No pods in observability namespace (bootstrap/recovery)"
          fi
        else
          OBS_BAD=$(echo "$OBS_PODS" | awk '$3 !~ /^(Running|Completed)$/')
          if [ -n "$OBS_BAD" ]; then
            echo "ERROR: Not all observability pods are Running/Completed:"
            echo "$OBS_BAD"
            EXIT=1
          else
            OBS_UNREADY=$(echo "$OBS_PODS" | awk '$3=="Running"{split($2,a,"/"); if(a[1]!=a[2]) print}')
            if [ -n "$OBS_UNREADY" ]; then
              echo "WARNING: Some observability pods have unready containers:"
              echo "$OBS_UNREADY"
              if [ "$STEADY_STATE" = "true" ]; then EXIT=1; fi
            fi
          fi
        fi
      else
        echo "All observability pods healthy"
      fi
      check_obs_helmreleases_ready() {
        OBS_HR_JSON=$(kubectl get helmreleases -n observability -o json 2>/dev/null || echo '{"items":[]}')
        OBS_HR_COUNT=$(echo "$OBS_HR_JSON" | jq '.items | length' 2>/dev/null || echo "0")
        [ "${OBS_HR_COUNT:-0}" -eq 0 ] && return 1
        OBS_HR_BAD=$(echo "$OBS_HR_JSON" | jq -r ".items[] | $JQ_NOT_READY | .metadata.name" 2>/dev/null || true)
        [ -z "$OBS_HR_BAD" ]
      }
      if ! wait_for "observability HelmReleases ready" 90 10 check_obs_helmreleases_ready; then
        OBS_HR_JSON=$(kubectl get helmreleases -n observability -o json 2>/dev/null || echo '{"items":[]}')
        OBS_HR_COUNT=$(echo "$OBS_HR_JSON" | jq '.items | length' 2>/dev/null || echo "0")
        if [ "${OBS_HR_COUNT:-0}" -eq 0 ]; then
          if [ "$STEADY_STATE" = "true" ]; then
            echo "ERROR: No HelmReleases in observability namespace on a steady-state cluster"
            EXIT=1
          else
            echo "WARNING: No HelmReleases in observability namespace (bootstrap/recovery)"
          fi
        else
          OBS_HR_BAD=$(echo "$OBS_HR_JSON" | jq -r ".items[] | $JQ_NOT_READY | .metadata.name" 2>/dev/null || true)
          echo "ERROR: Not all observability HelmReleases are Ready:"
          echo "$OBS_HR_BAD"
          EXIT=1
        fi
      else
        echo "All observability HelmReleases ready"
      fi

      echo ""
      echo "LoadBalancer services:"
      kubectl get svc -A | grep LoadBalancer || true

      echo ""
      echo "Checking GitLab health..."
      gitlab_ok=false
      start_ts=$(date +%s)
      last_err=""
      while true; do
        if curl_out=$(curl -sf --max-time 5 https://git.ericsweiss.com/-/readiness 2>&1); then
          gitlab_ok=true
          break
        fi
        last_err=$curl_out
        elapsed=$(( $(date +%s) - start_ts ))
        if [ "$elapsed" -ge 60 ]; then break; fi
        echo "GitLab health probe failed (${elapsed}s elapsed), retrying..."
        sleep 3
      done
      if [ "$gitlab_ok" = "true" ]; then
        echo "GitLab API: OK"
      else
        echo "ERROR: GitLab health check failed after 60s of retries"
        echo "Last curl error: ${last_err:-<empty>}"
        EXIT=1
      fi

      echo ""
      echo "=== Verification Complete (exit=$EXIT) ==="
      exit $EXIT
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/**
        - terraform/**
        - kubernetes/**
        - scripts/**
  # No allow_failure: the verification explicitly fails if nodes aren't Ready,
  # Flux reconciliation times out, any Flux resource is not Ready, server-side
  # dry-run rejects manifests, or GitLab is unreachable. ExternalSecret
  # readiness is a hard failure on steady-state clusters (all Kustomizations
  # were Ready pre-reconcile) and a warning during bootstrap/recovery.

# ============================================================================
# MAINTENANCE STAGE - Manual approval required
# All maintenance jobs use resource_group to prevent concurrent execution.
# Only one maintenance job can run at a time across the entire infrastructure.
#
# Recommended execution order (when running multiple):
#   1. update-packages       — OS packages on all hosts (may reboot)
#   2. update-applications   — App upgrades (needs clean OS)
#   3. update-k3s-nodes      — k3s binary upgrade (needs stable OS)
#   4. k3s-provision         — Only when adding new VMs
#   5. proxmox-ha            — HA rules (rarely changes)
#   6. home-assistant-restart — Only when needed
#   7. verify                — Always last
#
# NOTE: maintenance-update-full removed from CI — superseded by
# update-packages + update-applications. Taskfile version kept for local use.
# ============================================================================

# 1. OS package updates - MANUAL (all hosts, auto-reboot in CI)
# For interactive mode, use: task maintenance:update-packages
maintenance-update-packages:
  stage: maintenance
  extends: .deploy-base
  resource_group: infrastructure-maintenance
  script:
    - cd ansible
    - |
      echo "Running OS package updates on all hosts (rolling)..."
      op run -- ansible-playbook -i inventories/prod playbooks/maintenance/update-packages.yml -e auto_reboot=true
  environment:
    name: production/maintenance-packages
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# 2. Application updates - MANUAL (AdGuard, Tailscale, Plex)
maintenance-update-applications:
  stage: maintenance
  extends: .deploy-base
  resource_group: infrastructure-maintenance
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    ADGUARD_ADMIN_PASSWORD: "op://Homelab/AdGuard Home/password"
    TAILSCALE_AUTH_KEY: "op://Homelab/Tailscale Auth Key/credential"
  script:
    - cd ansible
    - |
      echo "Running application updates (AdGuard, Tailscale, Plex)..."
      op run -- ansible-playbook -i inventories/prod playbooks/maintenance/update-applications.yml
  environment:
    name: production/maintenance-applications
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# 3. K3s node updates - MANUAL (drains/cordons nodes)
maintenance-update-k3s-nodes:
  stage: maintenance
  extends: .deploy-base
  resource_group: infrastructure-maintenance
  variables:
    K3S_TOKEN: "op://Homelab/K3s Cluster Token/credential"
  script:
    - cd ansible
    - |
      echo "Running K3s node rolling update..."
      op run -- ansible-playbook -i inventories/prod playbooks/maintenance/update-k3s-nodes.yml
  environment:
    name: production/k3s-nodes
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# 4. K3s VM provisioning - MANUAL (creates/modifies VMs)
maintenance-k3s-provision:
  stage: maintenance
  extends: .deploy-base
  resource_group: infrastructure-maintenance
  variables:
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    K3S_TOKEN: "op://Homelab/K3s Cluster Token/credential"
  script:
    - cd ansible
    - |
      echo "Provisioning K3s VMs and deploying k3s cluster..."
      op run -- ansible-playbook -i inventories/prod playbooks/k3s-provision-vms.yml
      op run -- ansible-playbook -i inventories/prod playbooks/k3s.yml
  environment:
    name: production/k3s-provision
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# NOTE: maintenance-update-full removed from CI — superseded by:
#   maintenance-update-packages (broader host coverage) + maintenance-update-applications
# The Taskfile still has task maintenance:update-full for local use.

# 5. Proxmox HA - MANUAL (affects VM placement)
maintenance-proxmox-ha:
  stage: maintenance
  extends: .deploy-base
  resource_group: infrastructure-maintenance
  script:
    - cd ansible
    - |
      echo "Configuring Proxmox HA rules and resources..."
      op run -- ansible-playbook -i inventories/prod playbooks/proxmox-ha.yml
  environment:
    name: production/proxmox-ha
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# 6. Home Assistant restart - MANUAL (restarts HA VM)
maintenance-home-assistant-restart:
  stage: maintenance
  extends: .deploy-base
  resource_group: infrastructure-maintenance
  script:
    - cd ansible
    - |
      echo "Restarting Home Assistant VM..."
      # VM 154 is HA-managed and can migrate to any Proxmox node.
      # ha-manager is cluster-aware — it locates the node hosting the VM
      # and restarts it there, so targeting any Proxmox node works.
      op run -- ansible proxmox[0] -i inventories/prod -m shell -a \
        "ha-manager restart vm:154"
      echo "Waiting for Home Assistant to come back online..."
      sleep 30
      echo "Restart complete - check status via GitLab environments or Home Assistant URL"
  environment:
    name: production/home-assistant-restart
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# 7. Post-maintenance verification - MANUAL
# Trigger after maintenance to validate cluster health. Fails on critical issues.
maintenance-verify:
  stage: maintenance
  extends: .k3s-deploy-base
  resource_group: infrastructure-maintenance
  script:
    - |
      echo "=== Post-Maintenance Verification ==="
      ERRORS=0

      echo "Checking k3s node status..."
      NODE_OUTPUT=$(kubectl get nodes --no-headers)
      echo "$NODE_OUTPUT"
      NOT_READY=$(echo "$NODE_OUTPUT" | awk '$2 != "Ready" {count++} END {print count+0}')
      if [ "$NOT_READY" -gt 0 ]; then
        echo "ERROR: $NOT_READY node(s) not Ready"
        ERRORS=$((ERRORS + 1))
      else
        echo "All nodes Ready"
      fi

      echo ""
      echo "Checking for unhealthy pods..."
      # Check non-Running/non-Succeeded pods
      UNHEALTHY=$(kubectl get pods -A --field-selector=status.phase!=Running,status.phase!=Succeeded --no-headers 2>/dev/null | wc -l)
      # Check for Running pods with non-ready containers (CrashLoopBackOff, etc.)
      # $3 is READY column (e.g. "1/1"), split on "/" and compare numerator vs denominator
      DEGRADED=$(kubectl get pods -A --no-headers 2>/dev/null | awk '$4 != "Completed" && $4 != "Succeeded" {split($3, a, "/"); if (a[1] != a[2]) print}' | wc -l)
      if [ "$UNHEALTHY" -gt 0 ] || [ "$DEGRADED" -gt 0 ]; then
        echo "ERROR: $UNHEALTHY non-running + $DEGRADED degraded pod(s):"
        kubectl get pods -A --field-selector=status.phase!=Running,status.phase!=Succeeded 2>/dev/null || true
        kubectl get pods -A --no-headers 2>/dev/null | awk '$4 != "Completed" && $4 != "Succeeded" {split($3, a, "/"); if (a[1] != a[2]) print}' || true
        ERRORS=$((ERRORS + 1))
      else
        echo "All pods healthy"
      fi

      echo ""
      echo "Checking critical deployments..."
      for dep in traefik:traefik coredns:kube-system cert-manager:cert-manager metallb-controller:metallb-system authentik-server:authentik; do
        name="${dep%%:*}"
        ns="${dep##*:}"
        AVAIL=$(kubectl get deployment "$name" -n "$ns" -o jsonpath='{.status.availableReplicas}' 2>/dev/null)
        DESIRED=$(kubectl get deployment "$name" -n "$ns" -o jsonpath='{.spec.replicas}' 2>/dev/null)
        if [ -n "$AVAIL" ] && [ "$AVAIL" -ge "${DESIRED:-1}" ] 2>/dev/null; then
          echo "  $name ($ns): $AVAIL/$DESIRED available"
        else
          echo "  ERROR: $name ($ns): ${AVAIL:-0}/${DESIRED:-?} available"
          ERRORS=$((ERRORS + 1))
        fi
      done

      echo ""
      echo "Checking GitLab health..."
      if curl -sf --max-time 10 https://git.ericsweiss.com/-/readiness > /dev/null 2>&1; then
        echo "GitLab: OK"
      else
        echo "ERROR: GitLab health check failed"
        ERRORS=$((ERRORS + 1))
      fi

      echo ""
      echo "Checking cluster DNS (internal service resolution)..."
      # Verify CoreDNS can resolve internal k8s services — uses nslookup exit code via marker
      DNS_OUTPUT=$(kubectl run dns-verify-$CI_JOB_ID --attach --rm --restart=Never --timeout=30s \
          --image=busybox:1.37 --command -- sh -c \
          "nslookup kubernetes.default.svc.cluster.local > /dev/null 2>&1 && echo DNS_PASS || echo DNS_FAIL" 2>&1 || true)
      if echo "$DNS_OUTPUT" | grep -q "DNS_PASS"; then
        echo "Cluster DNS: OK (kubernetes.default.svc.cluster.local resolves)"
      else
        echo "ERROR: Cluster DNS cannot resolve kubernetes.default.svc.cluster.local"
        ERRORS=$((ERRORS + 1))
      fi

      echo ""
      if [ "$ERRORS" -gt 0 ]; then
        echo "=== VERIFICATION FAILED: $ERRORS critical issue(s) ==="
        exit 1
      fi
      echo "=== Post-Maintenance Verification Passed ==="
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# ============================================================================
# VERSION CHECK - Runs early, soft-fail on PRs
# ============================================================================

version-check:
  stage: lint
  image: python:3.11
  script:
    - pip install --quiet pyyaml==6.0.2 requests==2.32.3
    - python3 ./scripts/version-check-ci.py
  artifacts:
    paths:
      - version-report.json
    expire_in: 7 days
    when: always
  rules:
    # Run on schedule (weekly check)
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # Manual trigger on web pipelines (must precede main rule to avoid auto-run)
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    # Run on MRs as informational (soft-fail)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      allow_failure: true
    # Run on pushes to main as informational (soft-fail)
    - if: '$CI_COMMIT_BRANCH == "main"'
      allow_failure: true
