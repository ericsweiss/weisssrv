    - job: deploy-ansible-dns
      optional: true
    - job: deploy-ansible-certs
      optional: true
  variables:
    # plex.yml runs postfix_null_client, which renders postfix_null_client_aliases
    # (root -> admin_email -> ROOT_EMAIL_ALIAS); without it the aliases
    # task fails with AnsibleUndefinedVariable. Mirrors the other deploy jobs.
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
