deploy-gitlab:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-gitlab
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
  variables:
    # GitLab role reads secrets from env vars via lookup('ansible.builtin.env', ...)
    # op run resolves op:// references in environment variables at runtime
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    GITLAB_ROOT_PASSWORD: "op://Homelab/GitLab/root-password"
    GITLAB_SAML_CERT_FINGERPRINT: "op://Homelab/GitLab SSO/saml-cert-fingerprint"
    # Personal Access Token used by the role's Web IDE Application Settings
    # API calls (vscode_extension_marketplace_*). The gitlab role asserts
    # this is set and resolved (not still an op:// reference) before the
    # API block runs.
    GITLAB_API_TOKEN: "op://Homelab/GitLab API Token/credential"
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/gitlab.yml
    - |
      # Wait for GitLab API to come back after reconfigure (up to 5 min)
      echo "Waiting for GitLab API..."
      gitlab_healthy=false
      start_ts=$(date +%s)
      while true; do
        if curl -sf --max-time 5 https://git.ericsweiss.com/-/readiness > /dev/null 2>&1; then
          elapsed=$(( $(date +%s) - start_ts ))
          echo "GitLab API healthy after ${elapsed}s"
          gitlab_healthy=true
          break
        fi
        elapsed=$(( $(date +%s) - start_ts ))
        if [ "$elapsed" -ge 300 ]; then break; fi
        [ $((elapsed % 20)) -lt 3 ] && echo "Still waiting... (${elapsed}s)"
        sleep 2
      done
      if [ "$gitlab_healthy" != "true" ]; then
        echo "ERROR: GitLab API did not become healthy in 300s"
        exit 1
      fi
  environment:
    name: production/gitlab
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/gitlab/**/*
        # apt_signed_repo: shared signed-repo helper the gitlab role includes
        # for the GitLab omnibus apt repo — a helper-only change must deploy it.
        - ansible/roles/apt_signed_repo/**/*
        # zvol_mount is invoked by the gitlab role for the
        # /mnt/gitlab-repos persistent volume.
        - ansible/roles/zvol_mount/**/*
        # nfs_tls: the backup NFS mount requires xprtsec=tls (tlshd on the VM).
        - ansible/roles/nfs_tls/**/*
        - ansible/playbooks/gitlab.yml
        # gitlab_servers group vars (postfix null-client, kernel tuning) are
        # consumed by the gitlab playbook, so a vars-only change must redeploy.
        - ansible/inventories/prod/group_vars/gitlab_servers.yml
        # hosts.yml: VM definition (IP/zvols/resources) for this play's host
        - ansible/inventories/prod/hosts.yml
        # all.yml triggers deploy for gitlab_version changes; may also trigger
        # on unrelated version bumps but the playbook is idempotent and safe to re-run
        - ansible/inventories/prod/group_vars/all.yml

