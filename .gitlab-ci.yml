# GitLab CI/CD Pipeline for weisssrv Homelab Infrastructure
#
# Canonical source: https://git.ericsweiss.com/eric/weisssrv
# GitHub mirror: https://github.com/ericsweiss/weisssrv (read-only)
#
# Restart/reboot policy:
# - Service restarts: automatic (during deploys)
# - Machine reboots: manual approval required (maintenance jobs auto-reboot when triggered)
#
# Required CI/CD Variables (Settings > CI/CD > Variables):
# - OP_SERVICE_ACCOUNT_TOKEN (must be masked AND PROTECTED) - 1Password service
#   account. Protection is a project setting this file cannot assert; the whole
#   pipeline is written for it, so verify it in Settings > CI/CD > Variables.
#   Protected means it is absent on merge-request refs, so no MR job can read
#   the vault with a branch's own code: every op:// consumer here is main-only.
#   The cost, accepted deliberately, is that terraform-plan no longer previews
#   on MRs — see the credential-scope note on that job (and docs/13).
#
# Optional CI/CD Variables:
# - GH_API_TOKEN (masked) - For version checker API rate limits
#
# Pipeline triggers — what each pipeline source runs:
#
#   merge_request_event  lint + validate + test + security + AI review,
#                        including the credential-free deploy-preflight and the
#                        advisory version-check. Never deploys; the drift plans
#                        do not run, and terraform-plan's MR rule is inert while
#                        OP_SERVICE_ACCOUNT_TOKEN is protected.
#   main                 the same checks, then validation-gate, the deploy jobs
#                        each path-gated on its own inputs, and the verify stage
#                        (which runs even when a deploy failed).
#   schedule             version-check, secret detection and the four drift
#                        plans (tailscale, authentik, unifi, b2 — docs/13
#                        § Validate Stage). Everything else is when: never,
#                        except two typed schedules:
#                          SCHEDULE_TYPE=full-test    integration tests,
#                                                     unfiltered, as an
#                                                     external-dependency canary
#                          SCHEDULE_TYPE=version-bump version-bump-bot
#   web                  lint + validate + test only — the cheap jobs run, the
#                        expensive ones (image builds, integration tests,
#                        repo-policy-checks, version-check) are manual buttons.
#                        secret_detection has no web rule, so the security stage
#                        is empty. Deploy, gate, verify and maintenance stages
#                        are excluded; the maintenance ops are manual buttons on
#                        main.
#
# Roles live in the weisssrv.infra collection (weisssrv-lib), so this pipeline
# has no molecule matrix: the library tests the roles, ansible/requirements.yml
# pins the version, and the five integration stacks here test role COMBINATIONS
# against this repo's prod inventory.

stages:
  - build
  - lint
  - validate
  - test
  - security
  - ai-review
  - gate
  - deploy
  # Post-deploy verification. A SEPARATE stage after deploy, not a deploy-stage
  # job with `needs:` on the deploys: in GitLab a job that declares ANY `needs:`
  # starts as soon as those needs complete and ignores stage order, and a need
  # that was CREATED and then FAILED blocks the dependent job (`optional: true`
  # only tolerates a need that was never created). Both jobs here therefore
  # carry NO `needs:` — stage ordering alone sequences them — plus
  # `when: always`, so a failed deploy stage still gets verified. Three of six
  # main pipelines in one 6h window previously deployed a partial change set
  # with zero verification because one deploy job failed.
  - verify
  # All maintenance jobs (6 ops, maintenance-run-all wrapper, and the
  # ad-hoc maintenance-verify cluster-health button) are in this single
  # stage. Each maintenance op embeds the verify script as its final
  # step (see scripts/post-maintenance-verify.sh) so verify always runs
  # right after the op in the same CI job — no cross-job needs/stage
  # gymnastics, and no GitLab manual-job semantic quirks to navigate.
  - maintenance

# Default settings
default:
  image: python:3.11-slim
  # All weisssrv jobs run on the privileged infrastructure runner.
  # The shared non-privileged runner (k8s-deploy) is for other GitLab projects.
  tags: [infrastructure]
  # Cancel jobs when the same branch gets a newer pipeline. Deploy/maintenance
  # jobs override this to false to ensure they always complete.
  interruptible: true

# Global variables
variables:
  # Single source for the weisssrv-lib pin. `include:` CANNOT read this — it is
  # resolved before job variables exist — so each include entry repeats the tag
  # as a literal and scripts/check-lib-pins.py enforces that they all equal this
  # value and that it is a release tag. Bump here, then `--fix`. See the comment
  # on the include block.
  WEISSSRV_LIB_REF: "v0.15.0"
  # Single source for the Ansible pin the deploy jobs (.deploy-base) pip-install.
  # Keep in step with requirements.txt's ansible pin.
  ANSIBLE_VERSION: "11.6.0"
  # Single source for the kustomize pin used by flux-lint and deploy-verify, and
  # for the pytest/PyYAML pins the lint/test/verify jobs install. Jobs read the
  # variables; `include:` inputs cannot (they resolve before this block exists),
  # so those entries repeat the literals and repo-policy-checks' ci-pin-parity
  # check fails the pipeline if a copy drifts.
  KUSTOMIZE_VERSION: "5.4.3"
  KUSTOMIZE_SHA256: "3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7"
  PYTEST_VERSION: "9.1.1"
  PYYAML_VERSION: "6.0.2"
  # ansible-galaxy resolves the weisssrv.infra collection from a git+https
  # source on this instance. git reads these three as config, so the clone
  # authenticates with the job token without writing a ~/.gitconfig. The
  # rewrite matches only credential-less URLs, and the runner's own checkout URL
  # already carries userinfo, so it is untouched.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "url.https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/.insteadOf"
  GIT_CONFIG_VALUE_0: "https://${CI_SERVER_HOST}/"

# Workflow rules - when to run the pipeline
workflow:
  # AUTHORITATIVE description of this pipeline's cancellation policy; other jobs
  # point here rather than restating it.
  #
  # MR refs: `on_new_commit: interruptible` — a new push cancels the previous
  # pipeline's interruptible jobs (the heavy DinD integration matrix) instead of
  # letting them pile up on the scarce privileged runner. GitLab's default is
  # "conservative", which stops cancelling as soon as any non-interruptible job
  # has started, so it would leave that matrix running.
  #
  # main: `on_new_commit: none` (the rule below) — a merged pipeline always runs
  # to completion. Under the aggressive setting a second merge cancelled the
  # first's still-running interruptible jobs, which skipped validation-gate and
  # left the first merge's deploys unmet and never run, with its `changes:` not
  # re-covered by the second pipeline. Rapid merges instead QUEUE at the deploy
  # jobs' resource_groups.
  #
  # Those groups are PER TARGET, so one target is never deployed by two
  # pipelines at once. Merge ORDER additionally depends on each group's process
  # mode being `oldest_first`, which is an out-of-band project setting (Resource
  # Groups API), not codified here — a project restore resets every group to
  # `unordered`, so re-apply it as part of the DR checklist (docs/17). None of
  # this is whole-pipeline atomicity either — two pipelines' Ansible runs can
  # still meet on one host once the earlier one frees a group, and the
  # maintenance ops sit in their own group so a maintenance run can overlap a
  # deploy against the same hosts — which is why "serialize merges" is an
  # operating rule (docs/13). A single repo-wide group would close it at the
  # cost of serialising the app-deploy fan-out inside every pipeline.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Templates for reuse
#
# .dep-cache, .install-1password and .install-1password-alpine now come from the
# shared CI library's ci/templates/ fragments (see the include: block); they are
# used exactly as before, via `extends:` / `!reference`.

# Shared "never on scheduled or web pipelines" rule preamble. Deploy/
# maintenance/gate jobs start their rules with this so the policy lives in
# one place. Pull in via `- !reference [.skip-schedule-web, rules]`.
.skip-schedule-web:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never

# Shared rules for every manual maintenance-stage job: skip schedule/web
# pipelines, then a manual button on main (op-token guarded). Pull in via
# `rules: - !reference [.maintenance-manual-rules, rules]` (nested !reference
# to .skip-schedule-web is fine — see deploy-verify's rules for precedent).
.maintenance-manual-rules:
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      # GitLab quirk: rules-based `when: manual` defaults to
      # `allow_failure: false` (top-level `when: manual` defaults to
      # true). Without this explicit `allow_failure: true`, every main
      # pipeline would PAUSE waiting for someone to play these manual jobs
      # — blocking unrelated CI flow. Failures are still surfaced in the
      # GitLab UI when a job is actually played.
      allow_failure: true

# Shared `changes:` path lists for the lint/validate/test jobs. Each job's
# merge_request_event and main rules pull the SAME list via
# `changes: !reference [.paths-<x>, changes]`, so a path edit happens once
# instead of in two hand-synced copies (which silently drift — a job just stops
# running on one trigger). Hidden jobs (dot-prefixed) are template fragments,
# never scheduled. NOT plain YAML anchors: the pipeline stays anchor-free
# (extends/!reference only) so anchors can never be referenced across an
# include boundary, where they do not resolve.
.paths-build-hermes-agent:
  changes:
    # The build clones upstream at hermes_version and builds THEIR Dockerfile,
    # so the only real build inputs are the pin (all.yml) and the build notes
    # under docker/hermes-agent/. Deliberately NOT gated on .gitlab-ci.yml so an
    # unrelated CI edit can't trigger a multi-minute DinD rebuild + re-push of
    # the :<version>/:latest tags.
    - docker/hermes-agent/**/*
    - ansible/inventories/prod/group_vars/all.yml
.paths-build-camofox-browser:
  changes:
    # Same rationale as .paths-build-hermes-agent: the build clones upstream at
    # v<hermes_camofox_version> and builds THEIR Dockerfile unmodified, so the
    # only real inputs are the pin (all.yml) and the build notes under
    # docker/camofox-browser/. Not gated on .gitlab-ci.yml.
    - docker/camofox-browser/**/*
    - ansible/inventories/prod/group_vars/all.yml
.paths-repo-sync:
  # Union for repo-sync-checks (generated-file freshness): each check inside
  # the job is cheap enough that firing both on either trigger set is free.
  changes:
    - ansible/inventories/prod/hosts.yml
    - scripts/hosts.env
    - scripts/generate-hosts-env.py
    - ansible/inventories/prod/group_vars/all.yml
    - kubernetes/infrastructure/sources/versions-configmap.yaml
    - scripts/generate-versions-configmap.py
.paths-repo-policy:
  # Union for repo-policy-checks (repo-invariant asserts: deploy coverage,
  # kubectl/flux/busybox/CI version pins, NetworkPolicy except-list parity,
  # Taskfile smoke). Superset of every constituent check's own trigger set — a
  # check may run on a path it doesn't care about (seconds of work), but can
  # never be missed on one it does.
  changes:
    - ansible/playbooks/**/*
    - ansible/inventories/prod/**/*
    - ansible/integration-tests/**/*
    - ansible/requirements.yml
    - scripts/**/*
    - .gitlab-ci.yml
    # integration-matrix-coverage reads the matrix out of this file.
    - .gitlab/ci/**/*
    # netpol-except-parity reads every NetworkPolicy; backup-artifact-apps reads
    # BackupArtifactStale's absent() arms out of the kube-prometheus-stack
    # release; cluster-literals reads every substituted manifest plus
    # cluster-config.yaml. All live under kubernetes/.
    - kubernetes/**/*
    - Taskfile.yml
    # tailscale-policy-syntax's subject: the ACL the supervised apply pushes.
    - terraform/tailscale/policy.hujson
# Cloudflare-only jobs (terraform-plan, deploy-terraform) gate on just the
# cloudflare module so an unrelated tailscale change can't fire a Cloudflare
# plan+apply. (terraform-fmt / terraform-validate come from the shared CI
# library and use its default terraform/**/* changes filter across all modules.)
.paths-terraform-cloudflare:
  changes:
    - terraform/cloudflare/**/*
.paths-terraform-tailscale:
  changes:
    - terraform/tailscale/**/*
.paths-terraform-authentik:
  changes:
    - terraform/authentik/**/*
.paths-terraform-unifi:
  changes:
    - terraform/unifi/**/*
.paths-b2-drift:
  changes:
    - scripts/b2-bucket-drift.py
    # The desired bucket settings the script reconciles against.
    - scripts/b2-bucket.json
.paths-prometheus-config:
  changes:
    - kubernetes/infrastructure/observability/kube-prometheus-stack/release.yaml
    - kubernetes/infrastructure/observability/kube-prometheus-stack/alertmanager-config.yaml
    # Every custom alert now lives in standalone PrometheusRule CRs here, so
    # without this an MR editing only a rule file would get no promtool check
    # and no unit-test run — flux-lint/kubeconform validate the CR schema and
    # never parse `expr`.
    - kubernetes/infrastructure/observability/rules/**/*
    - scripts/extract-prometheus-config.py
    - scripts/lint-prometheus-config.sh
    - scripts/check-alertmanager-behaviour.py
    # Its route cases / alert inventory — the site data the gate asserts against.
    - scripts/alertmanager-behaviour.yaml
    # promtool unit tests + vendored upstream rules run by the lint script.
    - scripts/prometheus-rule-tests/**/*
    # The job's own definition — the promtool/amtool image and the script argv
    # live here, so an MR that changes how the gate runs must re-run the gate.
    - .gitlab-ci.yml
.paths-deploy-preflight:
  # Everything deploy-preflight's answer depends on: the playbooks and tags it
  # walks, the inventory `--list-tasks` parses, the collection pin it installs,
  # and the deploy jobs it reads the invocations out of.
  changes:
    - ansible/playbooks/**/*
    - ansible/inventories/prod/**/*
    - ansible/requirements.yml
    - ansible/ansible.cfg
    - .gitlab-ci.yml
.paths-integration:
  changes:
    - ansible/integration-tests/**/*
    # Every integration converge include_tasks's
    # ansible/molecule/tasks/container-warmup.yml, and _shared/prepare.yml
    # re-imports ansible/molecule/prepare-common.yml.
    - ansible/molecule/**/*
    # The roles under test now ship in weisssrv.infra: the pin is the suite's
    # real input, alongside the prod all.yml the converges vars_files.
    - ansible/requirements.yml
    - ansible/inventories/prod/group_vars/all.yml
    # The shared in-job retry wrapper the suite runs through.
    - scripts/molecule-retry.sh
    # The matrix's own definition. NOT `.gitlab-ci.yml`: this is a ~14-minute
    # privileged-DinD fan-out on the critical path to validation-gate, and
    # naming the whole pipeline file fired it on every CI-only edit.
    - .gitlab/ci/integration-jobs.yml

# LOCAL COPY OF A LIBRARY TEMPLATE — keep it that way.
#
# This fragment is the render of weisssrv-lib `/ci/deploy/deploy-base.yml` with
# op_vault=Homelab, ansible_version=${ANSIBLE_VERSION}, apt_packages=git,
# ansible_dir=ansible, hosts_env=scripts/hosts.env. It is kept here only until
# the library tag that ships that file is pinned; at the next WEISSSRV_LIB_REF
# bump this whole block is DELETED and replaced by an include entry, and the
# swap must stay mechanical — so any behaviour change belongs in the library
# first (the cluster template carries the same fragment and had already drifted
# from this one on the git install and the LOKI_PUSH_* hoist).
#
# .dep-cache (shared CI library fragment): reuse pip wheels + the galaxy
# collections across deploy jobs — every job extending this pip-installs ansible
# and galaxy-installs weisssrv.infra + its dependencies. Its
# ANSIBLE_COLLECTIONS_PATH is where the roles the playbooks address by FQCN are
# resolved from — that variable, not the caching, is what this repo depends on:
# the k3s runner configures no distributed cache backend, so the cache itself is
# a measured no-op (a pod-local archive of ~5,500 files, discarded with the pod).
# Dropping the fragment would silently move collection resolution to the galaxy
# default, so it stays until a baked `ansible-deploy` image (a library
# follow-up) sets the path explicitly.
.deploy-base:
  extends: [.install-1password, .dep-cache]
  # A deploy needs the privileged infrastructure runner: an untagged job lands
  # on the shared non-root runner, where the apt install and the SSH reach to
  # the hosts both fail. Same value as the pipeline default, stated explicitly
  # because the library template makes it an input.
  tags: [infrastructure]
  # Deploys touch shared infrastructure; never cancel a running deploy when a new
  # pipeline starts — wait for it to complete instead.
  interruptible: false
  # Runner-pod casualties (scheduling timeout, NoExecute taint eviction when a
  # node degrades mid-job) are environmental, and the playbooks are idempotent:
  # retry instead of failing the whole needs chain.
  retry:
    max: 2
    when:
      - runner_system_failure
  variables:
    # alloy_host renders loki.write basic_auth from these and asserts they are
    # non-empty — absent, a deploy clobbers the fleet's alloy configs. On the
    # shared base so EVERY deploy job that may run alloy_host (e.g.
    # deploy-ansible-mail via site.yml --limit) has them.
    LOKI_PUSH_USER: "op://Homelab/Loki Push Auth/username"
    LOKI_PUSH_PASSWORD: "op://Homelab/Loki Push Auth/password"
  before_script:
    - !reference [.install-1password, before_script]
    # ansible-galaxy installs weisssrv.infra from a git+ URL, so the deploy
    # image needs git.
    - apt-get install -y --no-install-recommends git
    - pip install --quiet "ansible==${ANSIBLE_VERSION}"
    - |
      # Copy ansible.cfg to secure temp path (world-writable checkout causes Ansible to ignore it)
      export ANSIBLE_CONFIG="$(mktemp /tmp/ansible-XXXXXXXXXX.cfg)"
      install -m 600 ansible/ansible.cfg "$ANSIBLE_CONFIG"
      trap "rm -f '$ANSIBLE_CONFIG'" EXIT
    - |
      # Setup SSH from 1Password. umask 077 in a subshell so the key file is
      # never created with the default 0644 mode (no chmod race window).
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      (umask 077; op read "op://Homelab/SSH Key/private key" > ~/.ssh/id_ed25519)
      # TOFU keyscan: ephemeral runners have no known_hosts to inherit, so we
      # fetch fresh per job rather than bake host keys into the image. Accepted
      # on a single-LAN homelab (MITM would need both network paths in the job
      # window). Strict pinning lives on the operator path: ansible.cfg
      # (StrictHostKeyChecking=accept-new) + host_vars/dns-01.yml host_key for
      # acme_certs cert distribution.
      # Add known hosts for all infrastructure (Proxmox hosts, services, k3s
      # VMs). ALL_SSH_IPS is generated from ansible/inventories/prod/hosts.yml
      # (scripts/hosts.env; the hosts-env-sync job guards it against drift), so
      # a new node is keyscanned automatically without editing this list.
      . scripts/hosts.env
      # shellcheck disable=SC2086  # word-split ALL_SSH_IPS into one keyscan
      ssh-keyscan -H $ALL_SSH_IPS >> ~/.ssh/known_hosts 2>/dev/null || true
    # Retried: the fleet deploy includes a GitLab reconfigure, and a sibling
    # job cloning the collection through it mid-restart gets a 5xx (live on
    # pipeline #1307). Matches the library deploy-base at the next ref bump.
    - for i in 1 2 3; do ansible-galaxy collection install -r ansible/requirements.yml && break; [ "$i" = 3 ] && exit 1; echo "galaxy install failed (attempt $i) — retrying in 20s"; sleep 20; done

# Shared kubectl install (pinned checksum) + kubeconfig fetch from 1Password.
# Pulled into .maintenance-base and .k3s-deploy-base via
# `- !reference [.kubectl-setup, before_script]` so the version, checksum, and
# kubeconfig logic live in one place.
#
# Also a local copy of a library template — the render of weisssrv-lib
# `/ci/deploy/kubectl-setup.yml` with op_vault=Homelab and the pinned
# kubectl_version/kubectl_sha256 below. Same rule as .deploy-base above: change
# it in the library, then swap this block for the include at the next
# WEISSSRV_LIB_REF bump. check-kubectl-version-pin.py reads the version literal
# out of this block, so the pin must survive the swap as an include input.
.kubectl-setup:
  before_script:
    - |
      # Install kubectl (pinned checksum for supply-chain integrity).
      curl -fsSL "https://dl.k8s.io/release/v1.35.2/bin/linux/amd64/kubectl" -o /tmp/kubectl
      echo "924eb50779153f20cb668117d141440b95df2f325a64452d78dff9469145e277  /tmp/kubectl" | sha256sum -c -
      install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
    - |
      # Kubeconfig from 1Password (base64-encoded to preserve YAML formatting).
      set -eo pipefail
      mkdir -p ~/.kube
      KUBECONFIG_B64=$(op read "op://Homelab/K3s Kubeconfig/kubeconfig")
      if [ -z "$KUBECONFIG_B64" ]; then
        echo "ERROR: op read returned an empty kubeconfig. Is OP_SERVICE_ACCOUNT_TOKEN set?" >&2
        exit 1
      fi
      # umask 077 subshell: never create the kubeconfig world-readable.
      (umask 077; echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config)
      export KUBECONFIG="$HOME/.kube/config"
      echo "Kubeconfig written ($(wc -c < ~/.kube/config) bytes), KUBECONFIG=$KUBECONFIG"

# Maintenance jobs need both ansible (from .deploy-base) and kubectl
# (so each job can call scripts/post-maintenance-verify.sh after its
# playbook). Extends .deploy-base, then layers in the kubectl install
# + kubeconfig setup that .k3s-deploy-base does.
.maintenance-base:
  extends: .deploy-base
  # Maintenance ops are manual, ad-hoc buttons in the last (maintenance) stage.
  # They consume NO artifacts from earlier jobs (all inputs come from 1Password
  # at runtime), so an empty needs lets an operator play them immediately
  # without waiting on the entire build/test/deploy graph to complete first.
  needs: []
  # Cap below the detached self-host reboot's 5400s (90m) fallback timer: GitLab
  # must cancel a runaway job (-> the after_script re-arm fires) BEFORE that timer
  # could go off mid-run and reboot the executor's own host. The longest job
  # (maintenance-run-all) is ~30-45m, so 70m is comfortable headroom.
  timeout: 70m
  before_script:
    - !reference [.deploy-base, before_script]
    - apt-get install -y -qq jq
    - !reference [.kubectl-setup, before_script]
  after_script:
    # If the run armed a DETACHED self-host reboot (the executor's own Proxmox
    # host needed a reboot), re-arm it to fire promptly (+60s) now that the job is
    # ending and disarm the long fallback timer. Runs on success, failure, AND
    # cancel (so a cancelled run can't leave a 90-min timer ticking), and anchors
    # the reboot to the real job-end instead of a fixed-delay guess. No-op if the
    # run armed nothing (marker absent). Best-effort: the long fallback timer
    # armed during the run still covers the reboot if this step fails.
    - bash scripts/maintenance-rearm-self-reboot.sh || true

.k3s-deploy-base:
  # The `extends` and the `!reference` below are BOTH required and neither is
  # redundant: a job-level before_script REPLACES the extended one, so the
  # !reference is what actually runs the op install, while the extends keeps any
  # non-before_script key the fragment grows. Do not "clean up" either.
  extends: .install-1password
  # Use Debian-based image (Alpine musl resolver has issues with k8s ndots:5)
  image: python:3.11-slim
  # k3s deploys/verifies touch the cluster; never interrupt mid-run.
  interruptible: false
  before_script:
    - !reference [.install-1password, before_script]
    # jq is used by deploy-verify to parse kubectl JSON output (Flux CR
    # readiness checks). helm and yq are not installed — Flux manages chart
    # deployments, so no CI job needs them.
    - apt-get install -y -qq jq
    - !reference [.kubectl-setup, before_script]
    # Skipping `kubectl cluster-info` — requires list perms on kube-system
    # services, which the runner ServiceAccount lacks. Per-job kubectl calls
    # target narrower scopes and use the K3s Kubeconfig credentials.
    - kubectl version --output=yaml --request-timeout=5s

# BUILD STAGE - Container images

# The two app images (hermes-agent, camofox-browser) share this base: the
# pinned static docker CLI + buildx plugin installs, the dind-ready wait, and
# registry login. Each job owns its own build/tag/push block — they differ in
# build-args, tag sets and upstream verification. The molecule CI/test images
# are published by weisssrv-lib and consumed from its registry (see the
# integration jobs).
#
# KNOWN RACE, not closed here. The image pin and the versions ConfigMap that
# Flux substitutes it from are the SAME file (group_vars/all.yml), so the merge
# that bumps a pin both triggers the build and tells Flux to roll. Flux
# reconciles from git in ~1 minute; a multi-stage DinD build takes several. The
# Deployment therefore rolls to a tag that is still building, and the pods sit
# in ImagePullBackOff until the push lands.
#
# It is self-healing (the pin is `-rN`-suffixed and immutable per bump, so
# kubelet's next pull attempt succeeds) and CI cannot order itself against Flux
# — Flux polls git, not the pipeline. What IS enforced: the publish verify at
# the end of each build job proves the tag the cluster pulls actually reached
# the registry, so the non-self-healing variant (a tag that is never published
# at all) fails the pipeline red. Closing the race itself needs Flux
# ImagePolicy/ImageUpdateAutomation or a digest pin written by the build; until
# then, expect a few minutes of ImagePullBackOff on a hermes/camofox pin bump
# and do not roll it back on sight (docs/37).
.build-image-base:
  # Pushes images consumed by later jobs in this pipeline; do not interrupt.
  interruptible: false
  # Infra-class retries only. NOT script_failure: a genuinely broken Dockerfile
  # must fail fast, not burn three full image builds — transient external-dep
  # pulls (base image, apt, pip, npm) are handled cheaply by each job's own
  # bounded build retry, which reuses cached layers on a re-attempt.
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  stage: build
  image: python:3.11
  services:
    # DinD daemon 24.0 (digest-pinned): its embedded BuildKit frontend accepts
    # upstream hermes' symbolic `COPY --chmod`, which the 27.x builtin frontend
    # rejects. The static docker CLI installed below stays 27.5.1 (newer client,
    # older daemon is fine). This daemon runs privileged.
    - name: docker:24.0-dind@sha256:167bad11bade46d4d9a88646ed7f9b11014dfdb898ba75c5a390eb03f21f0c45
      # Explicit: the runner derives a service alias from the image name, and a
      # digest-bearing name must still answer at the `docker` host DOCKER_HOST
      # points at.
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # Daemon-embedded BuildKit; enables --cache-from + inline cache.
    DOCKER_BUILDKIT: "1"
  before_script:
    # Install the static docker CLI (NOT docker.io: that Debian package ships
    # only the daemon, no CLI). Pinned version + sha256 to match the checksum
    # discipline used for every other downloaded binary in this pipeline.
    - |
      ARCH=$(dpkg --print-architecture)
      case "$ARCH" in
        amd64) DOCKER_ARCH=x86_64; DOCKER_SHA256=4f798b3ee1e0140eab5bf30b0edc4e84f4cdb53255a429dc3bbae9524845d640 ;;
        arm64) DOCKER_ARCH=aarch64; DOCKER_SHA256=e6b53725a73763ab3f988c73f8772eaed429754c1a579db5ff11f21990fd1817 ;;
        *) echo "unsupported arch: $ARCH"; exit 1 ;;
      esac
      curl -fsSL "https://download.docker.com/linux/static/stable/${DOCKER_ARCH}/docker-27.5.1.tgz" -o /tmp/docker.tgz
      echo "${DOCKER_SHA256}  /tmp/docker.tgz" | sha256sum -c -
      tar xz --strip-components=1 -C /usr/local/bin -f /tmp/docker.tgz docker/docker
      rm /tmp/docker.tgz
      docker --version
      # Wait for the dind service daemon to accept connections before building;
      # it can lag the job start, otherwise `docker build` fails with
      # "Cannot connect to the Docker daemon at tcp://docker:2375".
      for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; echo "waiting for docker daemon ($i/30)..."; sleep 2; done
      docker info >/dev/null 2>&1 || { echo "docker daemon did not become ready"; exit 1; }
    - |
      # Docker buildx CLI plugin (pinned + sha256, same discipline as the static
      # CLI above). Required by BOTH builds: the base exports DOCKER_BUILDKIT=1,
      # so every `docker build` routes through the daemon's embedded BuildKit and
      # fails with "buildx component is missing" without the plugin — hermes also
      # needs it for upstream's BuildKit-only COPY --link/--chmod.
      BUILDX_ARCH=$(dpkg --print-architecture)
      BUILDX_VERSION=v0.35.0
      case "$BUILDX_ARCH" in
        amd64) BUILDX_SHA256=d41ece72044243b4f58b343441ae37446d9c29a7d6b5e11c61847bbcf8f7dfda ;;
        arm64) BUILDX_SHA256=c4248d6cbc4a619a7e0b4609c11e509ad4ac0b475e1c64817c0ac20c5d90c766 ;;
        *) echo "unsupported arch: $BUILDX_ARCH"; exit 1 ;;
      esac
      curl -fsSL "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-${BUILDX_ARCH}" -o /tmp/docker-buildx
      echo "${BUILDX_SHA256}  /tmp/docker-buildx" | sha256sum -c -
      mkdir -p "$HOME/.docker/cli-plugins"
      install -m 0755 /tmp/docker-buildx "$HOME/.docker/cli-plugins/docker-buildx"
      rm /tmp/docker-buildx
      docker buildx version
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# build-hermes-agent: NousResearch Hermes Agent publishes no container image, so
# we build our own into the GitLab registry. The job clones the upstream repo at
# the pinned tag (hermes_version in all.yml) and builds THEIR self-contained
# Dockerfile (baking the commit SHA via HERMES_GIT_SHA) to a local intermediate
# tag, then layers a thin wrapper (docker/hermes-agent/Dockerfile.codex) that
# bakes in the pinned OpenAI Codex CLI (hermes_codex_version) — Hermes' LLM engine
# is the Codex app-server runtime, so the `codex` CLI must be on PATH. The wrapper
# is the FINAL image, tagged ${CI_REGISTRY_IMAGE}/hermes-agent:<hermes_version>;
# the in-cluster Deployment pulls that tag via the internal registry host. The
# two-stage build runs on every pipeline (proving it builds); nothing is pushed
# on an MR — the :<hermes_version>, :latest, and :<commit-sha> tags are all
# pushed only on main so an unmerged branch can't repoint a running deployment.
build-hermes-agent:
  extends: .build-image-base
  variables:
    HERMES_UPSTREAM_REPO: "https://github.com/NousResearch/hermes-agent.git"
    # The image build EXECUTES the CLIs it installs (`codex --version` /
    # `claude --version` verification steps), and the Claude CLI's native
    # binary SIGILLs on the legacy OptiPlex Core 2 Quads — pin the build to
    # modern-CPU nodes, same invariant as secret_detection's gitleaks pin.
    KUBERNETES_NODE_SELECTOR_CPU: "esweiss.com/cpu=modern"
  script:
    - |
      # Read the pinned tag from all.yml (same single-source pattern the other
      # version-gated jobs use). No YAML lib in this image — grep the scalar.
      HERMES_VERSION=$(grep -E '^hermes_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_VERSION" ]; then echo "could not read hermes_version from all.yml"; exit 1; fi
      # Codex + Claude Code CLI versions baked into the image by the wrapper
      # (see below).
      # Published tag (<version>-rN): the local patch revision — see all.yml.
      HERMES_IMAGE_VERSION=$(grep -E '^hermes_image_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_image_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_IMAGE_VERSION" ]; then echo "could not read hermes_image_version from all.yml"; exit 1; fi
      case "$HERMES_IMAGE_VERSION" in
        "${HERMES_VERSION}-r"*) ;;
        *) echo "hermes_image_version ($HERMES_IMAGE_VERSION) must be ${HERMES_VERSION}-r<N> — bump them in lockstep"; exit 1 ;;
      esac
      HERMES_CODEX_VERSION=$(grep -E '^hermes_codex_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_codex_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_CODEX_VERSION" ]; then echo "could not read hermes_codex_version from all.yml"; exit 1; fi
      HERMES_CLAUDE_VERSION=$(grep -E '^hermes_claude_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_claude_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_CLAUDE_VERSION" ]; then echo "could not read hermes_claude_version from all.yml"; exit 1; fi
      # 1Password CLI (op) version — baked in for Hermes' 1Password skill.
      HERMES_OP_VERSION=$(grep -E '^hermes_op_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_op_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_OP_VERSION" ]; then echo "could not read hermes_op_version from all.yml"; exit 1; fi
      echo "Building Hermes Agent ${HERMES_VERSION} (Codex CLI ${HERMES_CODEX_VERSION}, Claude Code CLI ${HERMES_CLAUDE_VERSION}, 1Password CLI ${HERMES_OP_VERSION})"
      ref="${CI_REGISTRY_IMAGE}/hermes-agent"
      rm -rf /tmp/hermes-src
      git clone --depth 1 --branch "$HERMES_VERSION" "$HERMES_UPSTREAM_REPO" /tmp/hermes-src
      HERMES_SHA=$(git -C /tmp/hermes-src rev-parse HEAD)
      # Verify the tag resolves to the immutable commit pinned alongside it in
      # all.yml. A tag is mutable upstream; without this check a moved or
      # compromised tag would let CI build+publish attacker-controlled steps into
      # an image Flux deploys. Bump hermes_git_sha whenever hermes_version changes.
      HERMES_EXPECTED_SHA=$(grep -E '^hermes_git_sha:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_git_sha:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_EXPECTED_SHA" ]; then echo "hermes_git_sha not pinned in all.yml — refusing to build"; exit 1; fi
      if [ "$HERMES_SHA" != "$HERMES_EXPECTED_SHA" ]; then
        echo "SECURITY: tag ${HERMES_VERSION} resolved to ${HERMES_SHA}, but all.yml pins ${HERMES_EXPECTED_SHA}."
        echo "The upstream tag may have moved. Refusing to build. Re-verify upstream and update hermes_git_sha."
        exit 1
      fi
      echo "Upstream ${HERMES_VERSION} -> ${HERMES_SHA} (matches pinned hermes_git_sha)"
      # Local patches (docker/hermes-agent/patches/*.patch), applied to the
      # SHA-verified tree before the build. Reviewed in THIS repo, so the
      # supply-chain property holds: pinned upstream + explicit local diffs.
      # git apply fails loudly if a patch has drifted — a hermes version bump
      # must re-verify every patch (or drop ones that were upstreamed).
      for p in docker/hermes-agent/patches/*.patch; do
        [ -e "$p" ] || continue
        echo "Applying local patch: $p"
        git -C /tmp/hermes-src apply -p1 --verbose "$CI_PROJECT_DIR/$p"
      done
      cache_args=""
      if [ "$CI_PIPELINE_SOURCE" != "schedule" ]; then
        cache_args="--cache-from ${ref}:latest --build-arg BUILDKIT_INLINE_CACHE=1"
      fi
      # Two-stage build, both on every pipeline (proves the image builds);
      # publish ONLY on main. Stage 1 builds upstream's self-contained Dockerfile
      # to a local intermediate tag. Stage 2 layers our thin CLI wrapper
      # (docker/hermes-agent/Dockerfile.codex — `npm i -g` of the pinned Codex +
      # Claude Code CLIs) on top as the FINAL image, carrying the load-bearing
      # :<version>/:<sha> tags the cluster pulls. Node 22 + npm are already in
      # the base, so the wrapper only adds the pinned CLIs. A single retry loop
      # covers both builds (either can hit a transient registry/npm hiccup). MR
      # pipelines are build-only, so an MR can never publish a registry image.
      upstream_ref="${ref}:upstream-${CI_COMMIT_SHORT_SHA}"
      attempt=1; max=3
      # shellcheck disable=SC2086  # intentional word-split of cache_args
      until docker build $cache_args \
              --build-arg HERMES_GIT_SHA="$HERMES_SHA" \
              -t "$upstream_ref" \
              /tmp/hermes-src \
            && docker build \
              --build-arg HERMES_IMAGE="$upstream_ref" \
              --build-arg HERMES_CODEX_VERSION="$HERMES_CODEX_VERSION" \
              --build-arg HERMES_CLAUDE_VERSION="$HERMES_CLAUDE_VERSION" \
              --build-arg HERMES_OP_VERSION="$HERMES_OP_VERSION" \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              -t "${ref}:${HERMES_VERSION}" \
              -t "${ref}:${HERMES_IMAGE_VERSION}" \
              -t "${ref}:${CI_COMMIT_SHORT_SHA}" \
              -f docker/hermes-agent/Dockerfile.codex \
              docker/hermes-agent; do
        attempt=$((attempt+1))
        if [ "$attempt" -gt "$max" ]; then echo "hermes build failed after ${max} attempts"; exit 1; fi
        echo "build attempt $((attempt-1)) failed; retrying (${attempt}/${max})..."
        sleep $(( (RANDOM % 20) + 10 ))
      done
      # The load-bearing tags (:<version> that the cluster pulls, :<sha> for
      # traceability, and :latest for the layer cache) are pushed only on main.
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker push "${ref}:${CI_COMMIT_SHORT_SHA}"
        docker push "${ref}:${HERMES_VERSION}"
        # The tag the cluster actually pulls (<version>-rN local patch
        # revision). The build already -t's it; the explicit re-tag guards
        # against the build's tag list drifting.
        docker tag "${ref}:${CI_COMMIT_SHORT_SHA}" "${ref}:${HERMES_IMAGE_VERSION}"
        docker push "${ref}:${HERMES_IMAGE_VERSION}"
        docker tag "${ref}:${CI_COMMIT_SHORT_SHA}" "${ref}:latest"
        docker push "${ref}:latest"
        # Read the tag back from the REGISTRY. The Deployment pulls exactly
        # ${hermes_image_version}, so this turns "the tag the cluster needs was
        # never published" into a red build job instead of an ImagePullBackOff
        # an operator has to diagnose in-cluster. buildx is installed above.
        docker buildx imagetools inspect "${ref}:${HERMES_IMAGE_VERSION}" >/dev/null \
          || { echo "PUBLISH VERIFY FAILED: ${ref}:${HERMES_IMAGE_VERSION} is not resolvable in the registry"; exit 1; }
        echo "Registry serves ${ref}:${HERMES_IMAGE_VERSION}"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-build-hermes-agent, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-build-hermes-agent, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# build-camofox-browser: jo-inc/camofox-browser (the anti-detection browser
# server behind Hermes' camofox tool — the third container of the hermes pod)
# publishes no container image, so we build our own into the GitLab registry.
# Same supply-chain shape as build-hermes-agent: clone upstream at the pinned
# tag (v<hermes_camofox_version> in all.yml), verify the tag resolves to the
# pinned immutable commit (hermes_camofox_git_sha), then build THEIR Dockerfile
# unmodified — no wrapper layer (the image is complete as shipped: Camoufox
# binary + yt-dlp + plugins are baked at build time). Its Dockerfile uses no
# BuildKit-only syntax, but the base still routes through BuildKit
# (DOCKER_BUILDKIT=1), so the buildx plugin the base installs is required here
# too. Build on every pipeline (proves it builds); the load-bearing
# :<version>/:latest tags push only on main so an unmerged branch can't repoint
# a running deployment.
build-camofox-browser:
  extends: .build-image-base
  variables:
    CAMOFOX_UPSTREAM_REPO: "https://github.com/jo-inc/camofox-browser.git"
  script:
    - |
      # Read the pins from all.yml (same single-source pattern as
      # build-hermes-agent; no YAML lib in this image — grep the scalars).
      CAMOFOX_VERSION=$(grep -E '^hermes_camofox_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_camofox_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$CAMOFOX_VERSION" ]; then echo "could not read hermes_camofox_version from all.yml"; exit 1; fi
      echo "Building camofox-browser ${CAMOFOX_VERSION}"
      ref="${CI_REGISTRY_IMAGE}/camofox-browser"
      rm -rf /tmp/camofox-src
      # The pin is the bare semver (the image tag); the upstream git tag
      # carries the leading "v".
      git clone --depth 1 --branch "v${CAMOFOX_VERSION}" "$CAMOFOX_UPSTREAM_REPO" /tmp/camofox-src
      CAMOFOX_SHA=$(git -C /tmp/camofox-src rev-parse HEAD)
      # Verify the tag resolves to the immutable commit pinned alongside it in
      # all.yml — a moved or compromised upstream tag must not let CI publish
      # attacker-controlled steps into an image Flux deploys (this container
      # browses the web with persistent cookies). Bump hermes_camofox_git_sha
      # whenever hermes_camofox_version changes.
      CAMOFOX_EXPECTED_SHA=$(grep -E '^hermes_camofox_git_sha:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_camofox_git_sha:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$CAMOFOX_EXPECTED_SHA" ]; then echo "hermes_camofox_git_sha not pinned in all.yml — refusing to build"; exit 1; fi
      if [ "$CAMOFOX_SHA" != "$CAMOFOX_EXPECTED_SHA" ]; then
        echo "SECURITY: tag v${CAMOFOX_VERSION} resolved to ${CAMOFOX_SHA}, but all.yml pins ${CAMOFOX_EXPECTED_SHA}."
        echo "The upstream tag may have moved. Refusing to build. Re-verify upstream and update hermes_camofox_git_sha."
        exit 1
      fi
      echo "Upstream v${CAMOFOX_VERSION} -> ${CAMOFOX_SHA} (matches pinned hermes_camofox_git_sha)"
      cache_args=""
      if [ "$CI_PIPELINE_SOURCE" != "schedule" ]; then
        cache_args="--cache-from ${ref}:latest --build-arg BUILDKIT_INLINE_CACHE=1"
      fi
      # Bounded retry: the build pulls the Camoufox release zip + yt-dlp at
      # image-build time, so a transient GitHub/registry blip re-attempts
      # cheaply on cached layers while a real Dockerfile error still fails.
      attempt=1; max=3
      # shellcheck disable=SC2086  # intentional word-split of cache_args
      until docker build $cache_args \
              -t "${ref}:${CAMOFOX_VERSION}" \
              -t "${ref}:${CI_COMMIT_SHORT_SHA}" \
              /tmp/camofox-src; do
        attempt=$((attempt+1))
        if [ "$attempt" -gt "$max" ]; then echo "camofox build failed after ${max} attempts"; exit 1; fi
        echo "build attempt $((attempt-1)) failed; retrying (${attempt}/${max})..."
        sleep $(( (RANDOM % 20) + 10 ))
      done
      # The load-bearing tags (:<version> that the cluster pulls, :<sha> for
      # traceability, and :latest for the layer cache) are pushed only on main.
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker push "${ref}:${CI_COMMIT_SHORT_SHA}"
        docker push "${ref}:${CAMOFOX_VERSION}"
        docker tag "${ref}:${CI_COMMIT_SHORT_SHA}" "${ref}:latest"
        docker push "${ref}:latest"
        # Read the tag back from the registry — same rationale as
        # build-hermes-agent's publish verify: the Deployment pulls exactly
        # ${hermes_camofox_version}.
        docker buildx imagetools inspect "${ref}:${CAMOFOX_VERSION}" >/dev/null \
          || { echo "PUBLISH VERIFY FAILED: ${ref}:${CAMOFOX_VERSION} is not resolvable in the registry"; exit 1; }
        echo "Registry serves ${ref}:${CAMOFOX_VERSION}"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-build-camofox-browser, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-build-camofox-browser, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# LINT STAGE - Code quality checks

# Two consolidated micro-check jobs — generated-file freshness and repo-policy
# invariants. Each job's paths anchor is the UNION of its constituent checks'
# inputs, and the driver runs EVERY check before failing, so one push surfaces
# every violation. The per-check scripts also run individually in `task lint`.
# The heavyweight linters (ansible-lint/yaml-lint/shellcheck/flux-lint/
# prometheus-config-lint) stay separate — at >=1 min each, parallelism beats
# pod overhead.
repo-sync-checks:
  needs: []
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install --quiet "pyyaml==${PYYAML_VERSION}"
  script:
    - |
      set -uo pipefail
      overall=0; failed=""

      run_check() {
        name="$1"; shift
        printf 'section_start:%s:%s[collapsed=true]\r\033[0K== %s\n' "$(date +%s)" "$name" "$name"
        rc=0; "$@" || rc=$?
        printf 'section_end:%s:%s\r\033[0K\n' "$(date +%s)" "$name"
        if [ "$rc" -ne 0 ]; then overall=1; failed="$failed $name"; echo "FAILED: $name (rc=$rc)"; fi
      }

      # hosts.env freshness: compare the committed file against a freshly
      # generated one. The generator writes in place, so save + restore to
      # keep the workspace clean for other checks/jobs.
      check_hosts_env() {
        set -eo pipefail
        TARGET=scripts/hosts.env
        cp "$TARGET" /tmp/committed.env
        python3 scripts/generate-hosts-env.py
        cp "$TARGET" /tmp/generated.env
        cp /tmp/committed.env "$TARGET"   # restore workspace
        if ! diff -q /tmp/committed.env /tmp/generated.env >/dev/null 2>&1; then
          echo "ERROR: scripts/hosts.env is out of sync with hosts.yml"
          echo "Run: task hosts:sync and commit the result."
          diff -u /tmp/committed.env /tmp/generated.env || true
          return 1
        fi
        echo "scripts/hosts.env is in sync with hosts.yml"
      }

      # versions-configmap freshness: same save/generate/diff/restore pattern.
      check_versions_configmap() {
        set -eo pipefail
        TARGET=kubernetes/infrastructure/sources/versions-configmap.yaml
        cp "$TARGET" /tmp/committed.yaml
        python3 scripts/generate-versions-configmap.py
        cp "$TARGET" /tmp/generated.yaml
        cp /tmp/committed.yaml "$TARGET"   # restore workspace
        if ! diff -q /tmp/committed.yaml /tmp/generated.yaml >/dev/null 2>&1; then
          echo "ERROR: versions-configmap.yaml is out of sync with all.yml"
          echo "Run: task flux:sync-versions and commit the result."
          diff -u /tmp/committed.yaml /tmp/generated.yaml || true
          return 1
        fi
        echo "versions-configmap.yaml is in sync with all.yml"
      }

      run_check hosts-env-sync check_hosts_env
      run_check flux-versions-sync check_versions_configmap
      [ "$overall" -eq 0 ] || echo "Failed sync checks:$failed"
      exit "$overall"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-repo-sync, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-repo-sync, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'

repo-policy-checks:
  needs: []
  stage: lint
  # python:3.11-slim (not alpine): ships bash + coreutils + python3, which these
  # checks need.
  image: python:3.11-slim
  variables:
    # check-deploy-coverage.sh's `git merge-base --is-ancestor` guard rejects
    # unrelated histories — which a default depth-20 clone surfaces as a false
    # positive whenever the MR base is >20 commits behind HEAD. GIT_DEPTH: 0
    # forces a full clone so the merge-base is always reachable.
    GIT_DEPTH: 0
  before_script:
    # git for check-deploy-coverage.sh; curl/ca-certificates for the go-task
    # download; PyYAML for the coverage scripts' YAML parsing.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates
    - pip install --no-cache-dir --quiet "PyYAML==${PYYAML_VERSION}"
    - |
      # go-task, pinned + sha256 like every other downloaded binary in this pipeline.
      TASK_VERSION="v3.52.0"
      TASK_SHA256="02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd"
      curl -fsSL "https://github.com/go-task/task/releases/download/${TASK_VERSION}/task_linux_amd64.tar.gz" -o /tmp/task.tar.gz
      echo "${TASK_SHA256}  /tmp/task.tar.gz" | sha256sum -c -
      tar xzf /tmp/task.tar.gz -C /usr/local/bin task
      task --version
  script:
    - |
      set -uo pipefail
      overall=0; failed=""

      run_check() {
        name="$1"; shift
        printf 'section_start:%s:%s[collapsed=true]\r\033[0K== %s\n' "$(date +%s)" "$name" "$name"
        rc=0; "$@" || rc=$?
        printf 'section_end:%s:%s\r\033[0K\n' "$(date +%s)" "$name"
        if [ "$rc" -ne 0 ]; then overall=1; failed="$failed $name"; echo "FAILED: $name (rc=$rc)"; fi
      }

      # Every deploy job that runs an Ansible playbook must ALSO trigger on
      # ansible/requirements.yml. The roles ship in weisssrv.infra, so the
      # collection pin is the only in-repo signal that a role changed; a job
      # that misses it goes on deploying the old version, silently.
      # check-deploy-coverage.sh cannot see this — requirements.yml is not a
      # role/playbook/inventory path.
      #
      # Lives in scripts/ rather than inline here so `task lint` can run the
      # SAME code: an inline heredoc is reachable only from this job, and both
      # this check and ci-pin-parity fire exactly on a .gitlab-ci.yml edit —
      # precisely when a green local run is most likely to be trusted.

      # deploy-verify FLUX_VERSION pin must match the versions-configmap.
      check_flux_version_pin() {
        set -eu
        PIN=$(sed -n 's/^ *FLUX_VERSION="\([0-9.]*\)"$/\1/p' .gitlab-ci.yml | head -1)
        CM=$(sed -n 's/^ *flux_version: *//p' kubernetes/infrastructure/sources/versions-configmap.yaml | head -1)
        echo "deploy-verify FLUX_VERSION pin: ${PIN:-<not found>} / versions-configmap flux_version: ${CM:-<not found>}"
        [ -n "$PIN" ] || { echo "Could not extract FLUX_VERSION pin from .gitlab-ci.yml"; return 1; }
        [ -n "$CM" ] || { echo "Could not extract flux_version from versions-configmap.yaml"; return 1; }
        [ "$PIN" = "$CM" ] || { echo "FLUX_VERSION pin (${PIN}) drifted from versions-configmap flux_version (${CM}) — bump the deploy-verify version + sha256 pair in .gitlab-ci.yml"; return 1; }
      }

      # post-maintenance-verify's busybox image vs the busybox_version pin
      # (mirrors task lint:busybox-version-pin). The script runs kubectl outside
      # Flux, so no ${busybox_version} substitution reaches it.
      check_busybox_version_pin() {
        set -eu
        PIN=$(sed -n 's/.*--image=busybox:\([0-9.]*\).*/\1/p' scripts/post-maintenance-verify.sh | head -1)
        AV=$(sed -n 's/^busybox_version: *"\{0,1\}\([0-9.]*\)"\{0,1\} *$/\1/p' ansible/inventories/prod/group_vars/all.yml | head -1)
        echo "post-maintenance-verify busybox: ${PIN:-<not found>} / all.yml busybox_version: ${AV:-<not found>}"
        [ -n "$PIN" ] || { echo "Could not extract the busybox image pin from scripts/post-maintenance-verify.sh"; return 1; }
        [ -n "$AV" ] || { echo "Could not extract busybox_version from group_vars/all.yml"; return 1; }
        [ "$PIN" = "$AV" ] || { echo "busybox pin (${PIN}) drifted from all.yml busybox_version (${AV})"; return 1; }
      }

      # ci-pin-parity also lives in scripts/ (see the note above
      # check_flux_version_pin): both it and collection-pin-trigger are the two
      # checks `task lint` used to be missing, and an inline function is
      # unreachable from there.

      check_taskfile() { task --list >/dev/null && bash scripts/check-taskfile.sh; }

      # policy.hujson is read with terraform's file(), so fmt/validate never
      # parse it and the only other reader is the Tailscale API during the
      # SUPERVISED apply. Run through `task` so the gate has one implementation.
      check_tailscale_policy() { task lint:tailscale-policy; }

      run_check deploy-coverage bash scripts/check-deploy-coverage.sh
      run_check deploy-host-coverage python3 scripts/check-deploy-host-coverage.py
      run_check collection-pin-trigger python3 scripts/check-collection-pin-trigger.py
      # CI_FILE: the matrix lives in its own included file (see .paths-integration).
      run_check integration-matrix-coverage env CI_FILE=.gitlab/ci/integration-jobs.yml bash scripts/check-integration-matrix-coverage.sh
      # --host-vars/--rules: vendored from weisssrv-lib, so which file holds
      # each side of the pair is site layout rather than a script default.
      run_check backup-artifact-apps python3 scripts/check-backup-artifact-apps.py --host-vars ansible/inventories/prod/host_vars/pve-nas-01.yml --rules kubernetes/infrastructure/observability/rules/scripts.yaml
      # --config: the script is vendored from weisssrv-lib; its canonical
      # except-lists and peer-less-egress allowlist are site data.
      run_check netpol-except-parity python3 scripts/check-netpol-except-parity.py --config scripts/netpol-except.yaml
      run_check cluster-literals python3 scripts/check-cluster-literals.py
      run_check ansible-service-names python3 scripts/check-ansible-service-names.py
      run_check kubectl-version-pin python3 scripts/check-kubectl-version-pin.py
      run_check flux-version-pin check_flux_version_pin
      run_check busybox-version-pin check_busybox_version_pin
      run_check ci-pin-parity bash scripts/check-ci-pin-parity.sh
      run_check tailscale-policy-syntax check_tailscale_policy
      run_check taskfile-smoke check_taskfile
      [ "$overall" -eq 0 ] || echo "Failed policy checks:$failed"
      exit "$overall"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-repo-policy, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-repo-policy, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# ansible-lint and the AI reviewer (pr-agent-review) are generated from the
# shared CI library templates — see the include: block below.

# VALIDATE STAGE - Schema and configuration validation

terraform-plan:
  extends: .terraform-http-backend
  needs: []
  stage: validate
  image:
    name: hashicorp/terraform:1.15.9
    entrypoint: [""]
  before_script:
    - !reference [.install-1password-alpine, before_script]
  script:
    - cd terraform/cloudflare
    # -lockfile=readonly: CI must not rewrite .terraform.lock.hcl (provider
    # hashes are committed; a CI-side change would mask supply-chain drift).
    - terraform init -lockfile=readonly
    - |
      export TF_VAR_cloudflare_api_token=$(op read "op://Homelab/Cloudflare Terraform Token/credential")
      export TF_VAR_cloudflare_account_id=$(op read "op://Homelab/Cloudflare Terraform Token/username")
      terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan
    # Generate plan report for MR widget (shows resource change counts in merge requests)
    - terraform show -json tfplan | jq -r '
        ([.resource_changes[]?.change.actions?]|flatten)|
        {"create":(map(select(.=="create"))|length),
         "update":(map(select(.=="update"))|length),
         "delete":(map(select(.=="delete"))|length)}
      ' > tfplan.json
  artifacts:
    # The binary plan embeds rendered resource attributes; restrict download to
    # developer+ (default is any project member). deploy-terraform still consumes
    # it via needs:artifacts — access only gates UI/API download, not job needs.
    access: developer
    paths:
      - terraform/cloudflare/tfplan
    reports:
      terraform: terraform/cloudflare/tfplan.json
    # 1 day (not 1 hour): deploy-terraform consumes this tfplan in a later stage;
    # a slow/retried pipeline could otherwise have the plan GC'd before apply.
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # CREDENTIAL SCOPE. This assumes OP_SERVICE_ACCOUNT_TOKEN is masked AND
    # protected — a GitLab project setting this file cannot assert (docs/13 §
    # the credential note). Under that posture the token is absent on a
    # merge_request_event ref and this rule cannot match — no job in this
    # pipeline reads 1Password with code from the branch under review. The rule
    # is kept, not deleted, so the MR preview returns by itself if the variable
    # is ever unprotected; treat it as INERT while the protection stands. The
    # accepted cost is that a Cloudflare change gets no pre-merge plan and is
    # first seen in deploy-terraform's apply on main — `task terraform:plan` is
    # the local substitute. The token guard also means a tokenless main pipeline
    # gets NO plan; that is an expected skip, not a clean plan, and
    # validation-gate needs this job optionally so it cannot mask drift.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-terraform-cloudflare, changes]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-terraform-cloudflare, changes]

# Read-only drift `terraform plan` for the tailscale ACL module against live
# state. Never applies (apply stays supervised — see terraform/tailscale/README.md).
# A non-empty plan = the live tailnet ACL drifted from policy.hujson (e.g. an
# Admin-console hot-fix); allow_failure so that drift, or a plan hiccup, surfaces
# without blocking CI. Mirrors terraform-plan's op-injected creds + TF_HTTP_*
# state backend, scoped to the tailscale module + its own state name.
tailscale-drift-plan:
  # Shared HTTP-backend auth/lock settings come from .terraform-http-backend;
  # only the tailscale state path is overridden here.
  extends: .terraform-http-backend
  needs: []
  stage: validate
  image:
    name: hashicorp/terraform:1.15.9
    entrypoint: [""]
  variables:
    TF_HTTP_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/tailscale"
    TF_HTTP_LOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/tailscale/lock"
    TF_HTTP_UNLOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/tailscale/lock"
  before_script:
    - !reference [.install-1password-alpine, before_script]
  script:
    - cd terraform/tailscale
    # -lockfile=readonly: CI must not rewrite .terraform.lock.hcl (committed
    # provider hashes; a CI-side change would mask supply-chain drift).
    - terraform init -lockfile=readonly
    - |
      export TF_VAR_tailscale_oauth_client_id=$(op read "op://Homelab/Tailscale OAuth/client id")
      export TF_VAR_tailscale_oauth_client_secret=$(op read "op://Homelab/Tailscale OAuth/credential")
      # Plan only, never apply — surfaces drift instead of silently reverting it.
      # -detailed-exitcode: drift exits 2 (plain plan exits 0 on a non-empty
      # diff), so allow_failure can render the yellow drift signal.
      terraform plan -input=false -no-color -lock-timeout=120s -detailed-exitcode
  # Drift (exit 2) is the advisory yellow; apply stays supervised. But a BROKEN
  # detector — plan error, expired creds, unreachable endpoint, state lock — exits
  # 1, and a blanket `allow_failure: true` would paint that the same yellow,
  # silently masking real drift behind a permanently-broken plan. Scope the pass
  # to exit 2 only, so exit 1 fails RED and is visible.
  allow_failure:
    exit_codes: [2]
  rules:
    # Schedule is the real detector: no changes: filter, so it catches
    # out-of-band Admin-console edits when nothing in-repo changed.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $OP_SERVICE_ACCOUNT_TOKEN'
    # Post-merge, before the supervised apply. Deliberately NO merge_request_event
    # rule: this job materializes vault secrets into a job that runs the branch's
    # own code, and an advisory drift signal is not worth that on an unmerged ref
    # (terraform-plan is the one job that keeps its MR rule — see it for why).
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-terraform-tailscale, changes]

