  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - kubernetes/apps/gitlab-runner-privileged/**
        - ansible/inventories/prod/group_vars/all.yml

deploy-gitlab-verify:
  stage: deploy
  extends: .deploy-base
  needs:
    - job: validation-gate
    - job: deploy-gitlab
      optional: true
    - job: deploy-gitlab-ingress
      optional: true
    - job: deploy-gitlab-runner
      optional: true
    - job: deploy-gitlab-runner-privileged
      optional: true
  script:
    - |
      echo "=== GitLab Verification ==="

      # Test web UI accessibility
      echo "Testing GitLab web UI..."
      curl -sf --max-time 30 "https://git.ericsweiss.com/-/readiness" || \
        echo "WARNING: GitLab health check failed (may need more time to start)"

      # Test Container Registry
      echo "Testing Container Registry..."
      curl -sf --max-time 10 "https://registry.git.ericsweiss.com/v2/" || \
        echo "WARNING: Registry check failed"

      # Test SSH connectivity (port 22 internal)
      echo "Testing SSH connectivity..."
      timeout 5 bash -c 'cat < /dev/null > /dev/tcp/192.168.0.153/22' 2>&1 && echo "SSH port open" || echo "WARNING: SSH port check failed"

      echo ""
      echo "=== GitLab Verification Complete ==="
      echo "Note: Some checks may fail if GitLab is still starting up"
  environment:
    name: production/gitlab-verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/gitlab/**
        - kubernetes/apps/gitlab/**
        - kubernetes/apps/gitlab-runner/**
        - kubernetes/apps/gitlab-runner-privileged/**
  allow_failure: true

# ------------------------------------------------------------------------------
# Post-Deploy Verification
# ------------------------------------------------------------------------------

deploy-verify:
  stage: deploy
  extends: .k3s-deploy-base
  needs:
    - job: validation-gate
    - job: deploy-terraform
      optional: true
    - job: deploy-ansible-base
      optional: true
    - job: deploy-ansible-proxmox
      optional: true
    - job: deploy-ansible-firewall
      optional: true
    - job: deploy-ansible-dns
      optional: true
    - job: deploy-ansible-storage
      optional: true
    - job: deploy-ansible-mail
      optional: true
    - job: deploy-ansible-certs
      optional: true
    - job: deploy-plex
      optional: true
    - job: deploy-gitlab
      optional: true
    - job: deploy-home-assistant-config
      optional: true
    - job: deploy-k3s-platform
      optional: true
    - job: deploy-k3s-authentik
      optional: true
    - job: deploy-downloads
      optional: true
    - job: deploy-recipes
      optional: true
    - job: deploy-gitlab-ingress
      optional: true
    - job: deploy-home-assistant-ingress
      optional: true
    - job: deploy-plex-ingress
      optional: true
    - job: deploy-adguard-ingress
      optional: true
    - job: deploy-gitlab-runner
      optional: true
    - job: deploy-gitlab-runner-privileged
      optional: true
    - job: deploy-gitlab-verify
      optional: true
    - job: deploy-k3s-coredns
      optional: true
  script:
    - |
      echo "=== Post-Deployment Verification ==="

      # Wait for runner deployments to finish rolling out (guard for missing deployments)
      echo "Waiting for GitLab Runner deployments to be ready..."
      for dep in gitlab-runner gitlab-runner-privileged; do
        if kubectl get deployment "$dep" -n gitlab-runner > /dev/null 2>&1; then
          kubectl rollout status deployment/"$dep" -n gitlab-runner --timeout=300s
          echo "  $dep: ready"
        else
          echo "  $dep: not deployed (skipping)"
        fi
      done
      echo "Runner rollout checks complete"

      if kubectl get namespace gitlab-runner > /dev/null 2>&1; then
        echo ""
        echo "Runner pod status:"
        kubectl get pods -n gitlab-runner -o wide

        echo ""
        echo "Helm releases:"
        helm list -n gitlab-runner
      else
        echo "gitlab-runner namespace not found (skipping runner checks)"
      fi

      echo ""
      echo "Checking node status..."
      kubectl get nodes

      echo ""
      echo "Checking critical pods..."
      kubectl get pods -A | grep -E "(traefik|metallb|cert-manager|authentik)" | head -20

      echo ""
      echo "Checking LoadBalancer services..."
      kubectl get svc -A | grep LoadBalancer

      echo ""
      echo "Checking IngressRoutes..."
      kubectl get ingressroute -A 2>/dev/null | head -20 || echo "No IngressRoutes found"

      echo ""
      echo "Checking GitLab health..."
      gitlab_ok=false
      start_ts=$(date +%s)
      while true; do
        if curl -sf --max-time 5 https://git.ericsweiss.com/-/readiness > /dev/null 2>&1; then
          gitlab_ok=true
          break
        fi
        elapsed=$(( $(date +%s) - start_ts ))
        if [ "$elapsed" -ge 60 ]; then break; fi
        echo "GitLab health probe failed (${elapsed}s elapsed), retrying..."
        sleep 3
      done
      if [ "$gitlab_ok" = "true" ]; then
        echo "GitLab API: OK"
      else
        echo "ERROR: GitLab health check failed after 60s of retries"
        exit 1
      fi

      echo ""
      echo "=== Verification Complete ==="
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
  allow_failure: true

# ============================================================================
# MAINTENANCE STAGE - Manual approval required
# All maintenance jobs use resource_group to prevent concurrent execution.
# Only one maintenance job can run at a time across the entire infrastructure.
# ============================================================================

# K3s VM provisioning - MANUAL (creates/modifies VMs)
maintenance-k3s-provision:
  stage: maintenance
  extends: .deploy-base
  resource_group: infrastructure-maintenance
  variables:
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    K3S_TOKEN: "op://Homelab/K3s Cluster Token/credential"
  script:
    - cd ansible
    - |
      echo "Provisioning K3s VMs and deploying k3s cluster..."
      op run -- ansible-playbook -i inventories/prod playbooks/k3s-provision-vms.yml
      op run -- ansible-playbook -i inventories/prod playbooks/k3s.yml
  environment:
    name: production/k3s-provision
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# NOTE: maintenance-update-full removed from CI — superseded by:
#   maintenance-update-packages (broader host coverage) + maintenance-update-applications
# The Taskfile still has task maintenance:update-full for local use.

# K3s node updates - MANUAL (drains/cordons nodes)
maintenance-update-k3s-nodes:
  stage: maintenance
  extends: .deploy-base
  resource_group: infrastructure-maintenance
  variables:
    K3S_TOKEN: "op://Homelab/K3s Cluster Token/credential"
  script:
    - cd ansible
    - |
      echo "Running K3s node rolling update..."
      op run -- ansible-playbook -i inventories/prod playbooks/maintenance/update-k3s-nodes.yml
  environment:
    name: production/k3s-nodes
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# OS package updates - MANUAL (updates all hosts including k3s nodes and app VMs)
# Note: CI runs with auto_reboot=true (non-interactive). For interactive mode, use: task maintenance:update-packages
maintenance-update-packages:
  stage: maintenance
  extends: .deploy-base
  resource_group: infrastructure-maintenance
  script:
    - cd ansible
    - |
      echo "Running OS package updates on all hosts (rolling)..."
      op run -- ansible-playbook -i inventories/prod playbooks/maintenance/update-packages.yml -e auto_reboot=true
  environment:
    name: production/maintenance-packages
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# Application updates - MANUAL (AdGuard, Tailscale, Plex)
maintenance-update-applications:
  stage: maintenance
  extends: .deploy-base
  resource_group: infrastructure-maintenance
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    ADGUARD_ADMIN_PASSWORD: "op://Homelab/AdGuard Home/password"
    TAILSCALE_AUTH_KEY: "op://Homelab/Tailscale Auth Key/credential"
  script:
    - cd ansible
    - |
      echo "Running application updates (AdGuard, Tailscale, Plex)..."
      op run -- ansible-playbook -i inventories/prod playbooks/maintenance/update-applications.yml
  environment:
    name: production/maintenance-applications
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# Proxmox HA - MANUAL (affects VM placement)
maintenance-proxmox-ha:
  stage: maintenance
  extends: .deploy-base
  resource_group: infrastructure-maintenance
  script:
    - cd ansible
    - |
      echo "Configuring Proxmox HA rules and resources..."
      op run -- ansible-playbook -i inventories/prod playbooks/proxmox-ha.yml
  environment:
    name: production/proxmox-ha
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# Home Assistant restart - MANUAL (restarts HA VM)
maintenance-home-assistant-restart:
  stage: maintenance
  extends: .deploy-base
  resource_group: infrastructure-maintenance
  script:
    - cd ansible
    - |
      echo "Restarting Home Assistant VM..."
      # Restart via ansible ad-hoc command to first Proxmox host
      op run -- ansible proxmox[0] -i inventories/prod -m shell -a \
        "pvesh create /nodes/\$(hostname -s)/qemu/154/status/reboot"
      echo "Waiting for Home Assistant to come back online..."
      sleep 30
      echo "Restart complete - check status via GitLab environments or Home Assistant URL"
  environment:
    name: production/home-assistant-restart
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# Post-maintenance infrastructure verification - MANUAL
# Trigger after maintenance jobs complete to validate cluster health.
# Fails the job if critical checks don't pass (nodes not Ready, pods degraded, GitLab down).
maintenance-verify:
  stage: maintenance
  extends: .k3s-deploy-base
  resource_group: infrastructure-maintenance
  script:
    - |
      echo "=== Post-Maintenance Verification ==="
      ERRORS=0

      echo "Checking k3s node status..."
      kubectl get nodes -o wide
      NOT_READY=$(kubectl get nodes --no-headers 2>/dev/null | awk '$2 != "Ready" {count++} END {print count+0}')
      if [ "$NOT_READY" -gt 0 ]; then
        echo "ERROR: $NOT_READY node(s) not Ready"
        ERRORS=$((ERRORS + 1))
      else
        echo "All nodes Ready"
      fi

      echo ""
      echo "Checking for unhealthy pods..."
      # Check non-Running/non-Succeeded pods
      UNHEALTHY=$(kubectl get pods -A --field-selector=status.phase!=Running,status.phase!=Succeeded --no-headers 2>/dev/null | wc -l)
      # Check for Running pods with non-ready containers (CrashLoopBackOff, etc.)
      # $3 is READY column (e.g. "1/1"), split on "/" and compare numerator vs denominator
      DEGRADED=$(kubectl get pods -A --no-headers 2>/dev/null | awk '$4 != "Completed" && $4 != "Succeeded" {split($3, a, "/"); if (a[1] != a[2]) print}' | wc -l)
      if [ "$UNHEALTHY" -gt 0 ] || [ "$DEGRADED" -gt 0 ]; then
        echo "ERROR: $UNHEALTHY non-running + $DEGRADED degraded pod(s):"
        kubectl get pods -A --field-selector=status.phase!=Running,status.phase!=Succeeded 2>/dev/null || true
        kubectl get pods -A --no-headers 2>/dev/null | awk '$4 != "Completed" && $4 != "Succeeded" {split($3, a, "/"); if (a[1] != a[2]) print}' || true
        ERRORS=$((ERRORS + 1))
      else
        echo "All pods healthy"
      fi

      echo ""
      echo "Checking critical deployments..."
      for dep in traefik:traefik coredns:kube-system cert-manager:cert-manager metallb-controller:metallb-system authentik-server:authentik; do
        name="${dep%%:*}"
        ns="${dep##*:}"
        AVAIL=$(kubectl get deployment "$name" -n "$ns" -o jsonpath='{.status.availableReplicas}' 2>/dev/null)
        DESIRED=$(kubectl get deployment "$name" -n "$ns" -o jsonpath='{.spec.replicas}' 2>/dev/null)
        if [ -n "$AVAIL" ] && [ "$AVAIL" -ge "${DESIRED:-1}" ] 2>/dev/null; then
          echo "  $name ($ns): $AVAIL/$DESIRED available"
        else
          echo "  ERROR: $name ($ns): ${AVAIL:-0}/${DESIRED:-?} available"
          ERRORS=$((ERRORS + 1))
        fi
      done

      echo ""
      echo "Checking GitLab health..."
      if curl -sf --max-time 10 https://git.ericsweiss.com/-/readiness > /dev/null 2>&1; then
        echo "GitLab: OK"
      else
        echo "ERROR: GitLab health check failed"
        ERRORS=$((ERRORS + 1))
      fi

      echo ""
      echo "Checking cluster DNS (internal service resolution)..."
      # Verify CoreDNS can resolve internal k8s services — uses nslookup exit code via marker
      DNS_OUTPUT=$(kubectl run dns-verify-$CI_JOB_ID --attach --rm --restart=Never --timeout=30s \
          --image=busybox:1.36 --command -- sh -c \
          "nslookup kubernetes.default.svc.cluster.local > /dev/null 2>&1 && echo DNS_PASS || echo DNS_FAIL" 2>&1 || true)
      if echo "$DNS_OUTPUT" | grep -q "DNS_PASS"; then
        echo "Cluster DNS: OK (kubernetes.default.svc.cluster.local resolves)"
      else
        echo "ERROR: Cluster DNS cannot resolve kubernetes.default.svc.cluster.local"
        ERRORS=$((ERRORS + 1))
      fi

      echo ""
      if [ "$ERRORS" -gt 0 ]; then
        echo "=== VERIFICATION FAILED: $ERRORS critical issue(s) ==="
        exit 1
      fi
      echo "=== Post-Maintenance Verification Passed ==="
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      allow_failure: true

# ============================================================================
# VERSION CHECK - Runs early, soft-fail on PRs
# ============================================================================

version-check:
  stage: lint
  image: python:3.11
  script:
    - pip install --quiet pyyaml requests
    - python3 ./scripts/version-check-ci.py
  artifacts:
    paths:
      - version-report.json
    expire_in: 7 days
    when: always
  rules:
    # Run on schedule (weekly check)
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # Manual trigger on web pipelines (must precede main rule to avoid auto-run)
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    # Run on MRs as informational (soft-fail)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      allow_failure: true
    # Run on pushes to main as informational (soft-fail)
    - if: '$CI_COMMIT_BRANCH == "main"'
      allow_failure: true
