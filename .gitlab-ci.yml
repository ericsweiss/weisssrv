# GitLab CI/CD Pipeline for weisssrv Homelab Infrastructure
#
# Canonical source: https://git.ericsweiss.com/eric/weisssrv
# GitHub mirror: https://github.com/ericsweiss/weisssrv (read-only)
#
# Restart/reboot policy:
# - Service restarts: automatic (during deploys)
# - Machine reboots: manual approval required (maintenance jobs auto-reboot when triggered)
#
# Required CI/CD Variables (Settings > CI/CD > Variables):
# - OP_SERVICE_ACCOUNT_TOKEN (masked) - 1Password service account. NOT protected
#   today; see the credential-scope note on terraform-plan before changing that.
#
# Optional CI/CD Variables:
# - GH_API_TOKEN (masked) - For version checker API rate limits
#
# Pipeline triggers — what each pipeline source runs:
#
#   merge_request_event  lint + validate + test + AI review, and terraform-plan.
#                        Never deploys; the drift plans do not run either.
#   main                 the same checks, then validation-gate and the deploy
#                        jobs each path-gated on its own inputs.
#   schedule             version-check, secret detection and the four drift
#                        plans. Everything else is when: never, except two
#                        typed schedules:
#                          SCHEDULE_TYPE=full-test    integration tests,
#                                                     unfiltered, as an
#                                                     external-dependency canary
#                          SCHEDULE_TYPE=version-bump version-bump-bot
#   web                  lint/validate/test/security only — the cheap jobs run,
#                        the expensive ones (image builds, integration tests,
#                        repo-policy-checks) are manual buttons. Deploy, gate
#                        and maintenance stages are excluded; the maintenance
#                        ops are manual buttons on main.
#
# Roles live in the weisssrv.infra collection (weisssrv-lib), so this pipeline
# has no molecule matrix: the library tests the roles, ansible/requirements.yml
# pins the version, and the five integration stacks here test role COMBINATIONS
# against this repo's prod inventory.

stages:
  - build
  - lint
  - validate
  - test
  - security
  - ai-review
  - gate
  - deploy
  # All maintenance jobs (6 ops, maintenance-run-all wrapper, and the
  # ad-hoc maintenance-verify cluster-health button) are in this single
  # stage. Each maintenance op embeds the verify script as its final
  # step (see scripts/post-maintenance-verify.sh) so verify always runs
  # right after the op in the same CI job — no cross-job needs/stage
  # gymnastics, and no GitLab manual-job semantic quirks to navigate.
  - maintenance

# Default settings
default:
  image: python:3.11-slim
  # All weisssrv jobs run on the privileged infrastructure runner.
  # The shared non-privileged runner (k8s-deploy) is for other GitLab projects.
  tags: [infrastructure]
  # Cancel jobs when the same branch gets a newer pipeline. Deploy/maintenance
  # jobs override this to false to ensure they always complete.
  interruptible: true

# Global variables
variables:
  # Single source for the weisssrv-lib pin. `include:` CANNOT read this — it is
  # resolved before job variables exist — so each include entry repeats the tag
  # as a literal and scripts/check-lib-pins.py enforces that they all equal this
  # value and that it is a release tag. Bump here, then `--fix`. See the comment
  # on the include block.
  WEISSSRV_LIB_REF: "v0.6.0"
  # Single source for the Ansible pin the deploy jobs (.deploy-base) pip-install.
  # Keep in step with requirements.txt's ansible pin.
  ANSIBLE_VERSION: "11.6.0"
  # Single source for the kustomize pin used by flux-lint and deploy-verify, and
  # for the pytest/PyYAML pins the lint/test/verify jobs install. Jobs read the
  # variables; `include:` inputs cannot (they resolve before this block exists),
  # so those entries repeat the literals and repo-policy-checks' ci-pin-parity
  # check fails the pipeline if a copy drifts.
  KUSTOMIZE_VERSION: "5.4.3"
  KUSTOMIZE_SHA256: "3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7"
  PYTEST_VERSION: "9.1.1"
  PYYAML_VERSION: "6.0.2"
  # ansible-galaxy resolves the weisssrv.infra collection from a git+https
  # source on this instance. git reads these three as config, so the clone
  # authenticates with the job token without writing a ~/.gitconfig. The
  # rewrite matches only credential-less URLs, and the runner's own checkout URL
  # already carries userinfo, so it is untouched.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "url.https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/.insteadOf"
  GIT_CONFIG_VALUE_0: "https://${CI_SERVER_HOST}/"

# Workflow rules - when to run the pipeline
workflow:
  # AUTHORITATIVE description of this pipeline's cancellation policy; other jobs
  # point here rather than restating it.
  #
  # MR refs: `on_new_commit: interruptible` — a new push cancels the previous
  # pipeline's interruptible jobs (the heavy DinD integration matrix) instead of
  # letting them pile up on the scarce privileged runner. GitLab's default is
  # "conservative", which stops cancelling as soon as any non-interruptible job
  # has started, so it would leave that matrix running.
  #
  # main: `on_new_commit: none` (the rule below) — a merged pipeline always runs
  # to completion. Under the aggressive setting a second merge cancelled the
  # first's still-running interruptible jobs, which skipped validation-gate and
  # left the first merge's deploys unmet and never run, with its `changes:` not
  # re-covered by the second pipeline. Rapid merges instead QUEUE at the deploy
  # jobs' resource_groups.
  #
  # Those groups are PER TARGET and oldest_first: one target is never deployed by
  # two pipelines at once, and always in merge order. That is not whole-pipeline
  # atomicity — two pipelines' Ansible runs can still meet on one host once the
  # earlier one frees a group — which is why "serialize merges" is an operating
  # rule (docs/13). A single repo-wide group would close it at the cost of
  # serialising the app-deploy fan-out inside every pipeline.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Templates for reuse
#
# .dep-cache, .install-1password and .install-1password-alpine now come from the
# shared CI library's ci/templates/ fragments (see the include: block); they are
# used exactly as before, via `extends:` / `!reference`.

# Shared "never on scheduled or web pipelines" rule preamble. Deploy/
# maintenance/gate jobs start their rules with this so the policy lives in
# one place. Pull in via `- !reference [.skip-schedule-web, rules]`.
.skip-schedule-web:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never

# Shared rules for every manual maintenance-stage job: skip schedule/web
# pipelines, then a manual button on main (op-token guarded). Pull in via
# `rules: - !reference [.maintenance-manual-rules, rules]` (nested !reference
# to .skip-schedule-web is fine — see deploy-verify's rules for precedent).
.maintenance-manual-rules:
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      # GitLab quirk: rules-based `when: manual` defaults to
      # `allow_failure: false` (top-level `when: manual` defaults to
      # true). Without this explicit `allow_failure: true`, every main
      # pipeline would PAUSE waiting for someone to play these manual jobs
      # — blocking unrelated CI flow. Failures are still surfaced in the
      # GitLab UI when a job is actually played.
      allow_failure: true

# Shared `changes:` path lists for the lint/validate/test jobs. Each job's
# merge_request_event and main rules pull the SAME list via
# `changes: !reference [.paths-<x>, changes]`, so a path edit happens once
# instead of in two hand-synced copies (which silently drift — a job just stops
# running on one trigger). Hidden jobs (dot-prefixed) are template fragments,
# never scheduled. NOT plain YAML anchors: the pipeline stays anchor-free
# (extends/!reference only) so anchors can never be referenced across an
# include boundary, where they do not resolve.
.paths-build-hermes-agent:
  changes:
    # The build clones upstream at hermes_version and builds THEIR Dockerfile,
    # so the only real build inputs are the pin (all.yml) and the build notes
    # under docker/hermes-agent/. Deliberately NOT gated on .gitlab-ci.yml so an
    # unrelated CI edit can't trigger a multi-minute DinD rebuild + re-push of
    # the :<version>/:latest tags.
    - docker/hermes-agent/**/*
    - ansible/inventories/prod/group_vars/all.yml
.paths-build-camofox-browser:
  changes:
    # Same rationale as .paths-build-hermes-agent: the build clones upstream at
    # v<hermes_camofox_version> and builds THEIR Dockerfile unmodified, so the
    # only real inputs are the pin (all.yml) and the build notes under
    # docker/camofox-browser/. Not gated on .gitlab-ci.yml.
    - docker/camofox-browser/**/*
    - ansible/inventories/prod/group_vars/all.yml
.paths-repo-sync:
  # Union for repo-sync-checks (generated-file freshness): each check inside
  # the job is cheap enough that firing both on either trigger set is free.
  changes:
    - ansible/inventories/prod/hosts.yml
    - scripts/hosts.env
    - scripts/generate-hosts-env.py
    - ansible/inventories/prod/group_vars/all.yml
    - kubernetes/infrastructure/sources/versions-configmap.yaml
    - scripts/generate-versions-configmap.py
.paths-repo-policy:
  # Union for repo-policy-checks (repo-invariant asserts: deploy coverage,
  # kubectl/flux/busybox/CI version pins, NetworkPolicy except-list parity,
  # Taskfile smoke). Superset of every constituent check's own trigger set — a
  # check may run on a path it doesn't care about (seconds of work), but can
  # never be missed on one it does.
  changes:
    - ansible/playbooks/**/*
    - ansible/inventories/prod/**/*
    - ansible/integration-tests/**/*
    - ansible/requirements.yml
    - scripts/**/*
    - .gitlab-ci.yml
    # netpol-except-parity reads every NetworkPolicy; backup-artifact-apps reads
    # BackupArtifactStale's absent() arms out of the kube-prometheus-stack
    # release. Both live under kubernetes/.
    - kubernetes/**/*
    - Taskfile.yml
# Cloudflare-only jobs (terraform-plan, deploy-terraform) gate on just the
# cloudflare module so an unrelated tailscale change can't fire a Cloudflare
# plan+apply. (terraform-fmt / terraform-validate come from the shared CI
# library and use its default terraform/**/* changes filter across all modules.)
.paths-terraform-cloudflare:
  changes:
    - terraform/cloudflare/**/*
.paths-terraform-tailscale:
  changes:
    - terraform/tailscale/**/*
.paths-terraform-authentik:
  changes:
    - terraform/authentik/**/*
.paths-b2-drift:
  changes:
    - scripts/b2-bucket-drift.py
    # The desired bucket settings the script reconciles against.
    - scripts/b2-bucket.json
.paths-prometheus-config:
  changes:
    - kubernetes/infrastructure/observability/kube-prometheus-stack/release.yaml
    - kubernetes/infrastructure/observability/kube-prometheus-stack/alertmanager-config.yaml
    # Every custom alert now lives in standalone PrometheusRule CRs here, so
    # without this an MR editing only a rule file would get no promtool check
    # and no unit-test run — flux-lint/kubeconform validate the CR schema and
    # never parse `expr`.
    - kubernetes/infrastructure/observability/rules/**/*
    - scripts/extract-prometheus-config.py
    - scripts/lint-prometheus-config.sh
    - scripts/check-alertmanager-behaviour.py
    # promtool unit tests + vendored upstream rules run by the lint script.
    - scripts/prometheus-rule-tests/**/*
.paths-integration:
  changes:
    - ansible/integration-tests/**/*
    # Every integration converge include_tasks's
    # ansible/molecule/tasks/container-warmup.yml, and _shared/prepare.yml
    # re-imports ansible/molecule/prepare-common.yml.
    - ansible/molecule/**/*
    # The roles under test now ship in weisssrv.infra: the pin is the suite's
    # real input, alongside the prod all.yml the converges vars_files.
    - ansible/requirements.yml
    - ansible/inventories/prod/group_vars/all.yml
    # The shared in-job retry wrapper the suite runs through.
    - scripts/molecule-retry.sh
    - .gitlab-ci.yml

.deploy-base:
  # .dep-cache (shared CI library fragment): reuse pip wheels + the galaxy
  # collections across deploy jobs — every job extending this pip-installs
  # ansible and galaxy-installs weisssrv.infra + its dependencies. Its
  # ANSIBLE_COLLECTIONS_PATH is where the roles the playbooks address by FQCN
  # are resolved from.
  extends: [.install-1password, .dep-cache]
  # Deploys touch shared infrastructure; never cancel a running deploy when a new
  # pipeline starts — wait for it to complete instead.
  interruptible: false
  # Runner-pod casualties (scheduling timeout, NoExecute taint eviction when a
  # node degrades mid-job) are environmental, and the playbooks are idempotent:
  # retry instead of failing the whole needs chain.
  retry:
    max: 2
    when:
      - runner_system_failure
  variables:
    # alloy_host renders loki.write basic_auth from these and asserts they are
    # non-empty — absent, a deploy clobbers the fleet's alloy configs. On the
    # shared base so EVERY deploy job that may run alloy_host (e.g.
    # deploy-ansible-mail via site.yml --limit) has them.
    LOKI_PUSH_USER: "op://Homelab/Loki Push Auth/username"
    LOKI_PUSH_PASSWORD: "op://Homelab/Loki Push Auth/password"
  before_script:
    - !reference [.install-1password, before_script]
    # ansible-galaxy installs weisssrv.infra from a git+ URL, so the deploy
    # image needs git.
    - apt-get install -y --no-install-recommends git
    - pip install --quiet "ansible==${ANSIBLE_VERSION}"
    - |
      # Copy ansible.cfg to secure temp path (world-writable checkout causes Ansible to ignore it)
      export ANSIBLE_CONFIG="$(mktemp /tmp/ansible-XXXXXXXXXX.cfg)"
      install -m 600 ansible/ansible.cfg "$ANSIBLE_CONFIG"
      trap "rm -f '$ANSIBLE_CONFIG'" EXIT
    - |
      # Setup SSH from 1Password. umask 077 in a subshell so the key file is
      # never created with the default 0644 mode (no chmod race window).
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      (umask 077; op read "op://Homelab/SSH Key/private key" > ~/.ssh/id_ed25519)
      # TOFU keyscan: ephemeral runners have no known_hosts to inherit, so we
      # fetch fresh per job rather than bake host keys into the image. Accepted
      # on a single-LAN homelab (MITM would need both network paths in the job
      # window). Strict pinning lives on the operator path: ansible.cfg
      # (StrictHostKeyChecking=accept-new) + host_vars/dns-01.yml host_key for
      # acme_certs cert distribution.
      # Add known hosts for all infrastructure (Proxmox hosts, services, k3s
      # VMs). ALL_SSH_IPS is generated from ansible/inventories/prod/hosts.yml
      # (scripts/hosts.env; the hosts-env-sync job guards it against drift), so
      # a new node is keyscanned automatically without editing this list.
      . scripts/hosts.env
      # shellcheck disable=SC2086  # word-split ALL_SSH_IPS into one keyscan
      ssh-keyscan -H $ALL_SSH_IPS >> ~/.ssh/known_hosts 2>/dev/null || true
    - ansible-galaxy collection install -r ansible/requirements.yml

# Shared kubectl install (pinned checksum) + kubeconfig fetch from 1Password.
# Pulled into .maintenance-base and .k3s-deploy-base via
# `- !reference [.kubectl-setup, before_script]` so the version, checksum, and
# kubeconfig logic live in one place.
.kubectl-setup:
  before_script:
    - |
      # Install kubectl (pinned checksum for supply-chain integrity).
      curl -fsSL "https://dl.k8s.io/release/v1.35.2/bin/linux/amd64/kubectl" -o /tmp/kubectl
      echo "924eb50779153f20cb668117d141440b95df2f325a64452d78dff9469145e277  /tmp/kubectl" | sha256sum -c -
      install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
    - |
      # Kubeconfig from 1Password (base64-encoded to preserve YAML formatting).
      set -eo pipefail
      mkdir -p ~/.kube
      KUBECONFIG_B64=$(op read "op://Homelab/K3s Kubeconfig/kubeconfig")
      if [ -z "$KUBECONFIG_B64" ]; then
        echo "ERROR: op read returned empty kubeconfig. Is OP_SERVICE_ACCOUNT_TOKEN set?"
        exit 1
      fi
      # umask 077 subshell: never create the kubeconfig world-readable.
      (umask 077; echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config)
      export KUBECONFIG="$HOME/.kube/config"
      echo "Kubeconfig written ($(wc -c < ~/.kube/config) bytes), KUBECONFIG=$KUBECONFIG"

# Maintenance jobs need both ansible (from .deploy-base) and kubectl
# (so each job can call scripts/post-maintenance-verify.sh after its
# playbook). Extends .deploy-base, then layers in the kubectl install
# + kubeconfig setup that .k3s-deploy-base does.
.maintenance-base:
  extends: .deploy-base
  # Maintenance ops are manual, ad-hoc buttons in the last (maintenance) stage.
  # They consume NO artifacts from earlier jobs (all inputs come from 1Password
  # at runtime), so an empty needs lets an operator play them immediately
  # without waiting on the entire build/test/deploy graph to complete first.
  needs: []
  # Cap below the detached self-host reboot's 5400s (90m) fallback timer: GitLab
  # must cancel a runaway job (-> the after_script re-arm fires) BEFORE that timer
  # could go off mid-run and reboot the executor's own host. The longest job
  # (maintenance-run-all) is ~30-45m, so 70m is comfortable headroom.
  timeout: 70m
  before_script:
    - !reference [.deploy-base, before_script]
    - apt-get install -y -qq jq
    - !reference [.kubectl-setup, before_script]
  after_script:
    # If the run armed a DETACHED self-host reboot (the executor's own Proxmox
    # host needed a reboot), re-arm it to fire promptly (+60s) now that the job is
    # ending and disarm the long fallback timer. Runs on success, failure, AND
    # cancel (so a cancelled run can't leave a 90-min timer ticking), and anchors
    # the reboot to the real job-end instead of a fixed-delay guess. No-op if the
    # run armed nothing (marker absent). Best-effort: the long fallback timer
    # armed during the run still covers the reboot if this step fails.
    - bash scripts/maintenance-rearm-self-reboot.sh || true

.k3s-deploy-base:
  extends: .install-1password
  # Use Debian-based image (Alpine musl resolver has issues with k8s ndots:5)
  image: python:3.11-slim
  # k3s deploys/verifies touch the cluster; never interrupt mid-run.
  interruptible: false
  before_script:
    - !reference [.install-1password, before_script]
    # jq is used by deploy-verify to parse kubectl JSON output (Flux CR
    # readiness checks). helm and yq are not installed — Flux manages chart
    # deployments, so no CI job needs them.
    - apt-get install -y -qq jq
    - !reference [.kubectl-setup, before_script]
    # Skipping `kubectl cluster-info` — requires list perms on kube-system
    # services, which the runner ServiceAccount lacks. Per-job kubectl calls
    # target narrower scopes and use the K3s Kubeconfig credentials.
    - kubectl version --output=yaml --request-timeout=5s

# BUILD STAGE - Container images

# The two app images (hermes-agent, camofox-browser) share this base: the
# pinned static docker CLI install, the dind-ready wait, registry login, and a
# build_and_push helper with registry-backed BuildKit layer caching + a bounded
# in-script build retry. The molecule CI/test images are published by
# weisssrv-lib and consumed from its registry (see the integration jobs).
.build-image-base:
  # Pushes images consumed by later jobs in this pipeline; do not interrupt.
  interruptible: false
  # Infra-class retries only. NOT script_failure: a genuinely broken Dockerfile
  # must fail fast, not burn three full image builds — transient external-dep
  # pulls (base image, apt, pip, galaxy) are handled cheaply by the in-script
  # build_and_push retry below, which reuses cached layers on a re-attempt.
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  stage: build
  image: python:3.11
  services:
    # DinD daemon 24.0 (digest-pinned): its embedded BuildKit frontend accepts
    # upstream hermes' symbolic `COPY --chmod`, which the 27.x builtin frontend
    # rejects. The static docker CLI installed below stays 27.5.1 (newer client,
    # older daemon is fine). This daemon runs privileged.
    - name: docker:24.0-dind@sha256:167bad11bade46d4d9a88646ed7f9b11014dfdb898ba75c5a390eb03f21f0c45
      # Explicit: the runner derives a service alias from the image name, and a
      # digest-bearing name must still answer at the `docker` host DOCKER_HOST
      # points at.
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # Daemon-embedded BuildKit; enables --cache-from + inline cache.
    DOCKER_BUILDKIT: "1"
  before_script:
    # Install the static docker CLI (NOT docker.io: that Debian package ships
    # only the daemon, no CLI). Pinned version + sha256 to match the checksum
    # discipline used for every other downloaded binary in this pipeline.
    - |
      ARCH=$(dpkg --print-architecture)
      case "$ARCH" in
        amd64) DOCKER_ARCH=x86_64; DOCKER_SHA256=4f798b3ee1e0140eab5bf30b0edc4e84f4cdb53255a429dc3bbae9524845d640 ;;
        arm64) DOCKER_ARCH=aarch64; DOCKER_SHA256=e6b53725a73763ab3f988c73f8772eaed429754c1a579db5ff11f21990fd1817 ;;
        *) echo "unsupported arch: $ARCH"; exit 1 ;;
      esac
      curl -fsSL "https://download.docker.com/linux/static/stable/${DOCKER_ARCH}/docker-27.5.1.tgz" -o /tmp/docker.tgz
      echo "${DOCKER_SHA256}  /tmp/docker.tgz" | sha256sum -c -
      tar xz --strip-components=1 -C /usr/local/bin -f /tmp/docker.tgz docker/docker
      rm /tmp/docker.tgz
      docker --version
      # Wait for the dind service daemon to accept connections before building;
      # it can lag the job start, otherwise `docker build` fails with
      # "Cannot connect to the Docker daemon at tcp://docker:2375".
      for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; echo "waiting for docker daemon ($i/30)..."; sleep 2; done
      docker info >/dev/null 2>&1 || { echo "docker daemon did not become ready"; exit 1; }
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      # build_and_push <image-short-name> <docker-build-args...>
      # Builds ${CI_REGISTRY_IMAGE}/<image>:<sha>, pushing it (and :latest on
      # main). Seeds a registry layer cache from the previous :latest and embeds
      # inline cache metadata for the next run — EXCEPT on the full-test schedule
      # canary, which must rebuild from scratch to exercise fresh external deps.
      # The build+push is wrapped in a bounded retry so a transient dep pull /
      # registry blip re-attempts (cheap: cached layers) while a real build error
      # still fails after the attempts (job-level retry omits script_failure).
      build_and_push() {
        img="$1"; shift
        ref="${CI_REGISTRY_IMAGE}/${img}"
        cache_args=""
        if [ "$CI_PIPELINE_SOURCE" != "schedule" ]; then
          cache_args="--cache-from ${ref}:latest --build-arg BUILDKIT_INLINE_CACHE=1"
        fi
        attempt=1; max=3
        # shellcheck disable=SC2086  # word-split cache_args + trailing build args
        until docker build $cache_args -t "${ref}:${CI_COMMIT_SHORT_SHA}" "$@" \
              && docker push "${ref}:${CI_COMMIT_SHORT_SHA}"; do
          attempt=$((attempt+1))
          if [ "$attempt" -gt "$max" ]; then
            echo "docker build/push of ${img} failed after ${max} attempts"; return 1
          fi
          echo "build/push ${img} attempt $((attempt-1)) failed; retrying (${attempt}/${max})..."
          sleep $(( (RANDOM % 20) + 10 ))
        done
        # :latest only on main — MR pipelines use SHA tags so they never
        # overwrite :latest with unmerged branch images. The SHA tag (and, for
        # molecule-ci, its digest dotenv) is the load-bearing reference; :latest
        # is the fallback for pipelines where the build didn't run.
        if [ "$CI_COMMIT_BRANCH" = "main" ]; then
          docker tag "${ref}:${CI_COMMIT_SHORT_SHA}" "${ref}:latest"
          docker push "${ref}:latest"
        fi
      }

# build-hermes-agent: NousResearch Hermes Agent publishes no container image, so
# we build our own into the GitLab registry. The job clones the upstream repo at
# the pinned tag (hermes_version in all.yml) and builds THEIR self-contained
# Dockerfile (baking the commit SHA via HERMES_GIT_SHA) to a local intermediate
# tag, then layers a thin wrapper (docker/hermes-agent/Dockerfile.codex) that
# bakes in the pinned OpenAI Codex CLI (hermes_codex_version) — Hermes' LLM engine
# is the Codex app-server runtime, so the `codex` CLI must be on PATH. The wrapper
# is the FINAL image, tagged ${CI_REGISTRY_IMAGE}/hermes-agent:<hermes_version>;
# the in-cluster Deployment pulls that tag via the internal registry host. The
# two-stage build runs on every pipeline (proving it builds); nothing is pushed
# on an MR — the :<hermes_version>, :latest, and :<commit-sha> tags are all
# pushed only on main so an unmerged branch can't repoint a running deployment.
build-hermes-agent:
  extends: .build-image-base
  variables:
    HERMES_UPSTREAM_REPO: "https://github.com/NousResearch/hermes-agent.git"
    # The image build EXECUTES the CLIs it installs (`codex --version` /
    # `claude --version` verification steps), and the Claude CLI's native
    # binary SIGILLs on the legacy OptiPlex Core 2 Quads — pin the build to
    # modern-CPU nodes, same invariant as secret_detection's gitleaks pin.
    KUBERNETES_NODE_SELECTOR_CPU: "esweiss.com/cpu=modern"
  script:
    - |
      # Install the Docker buildx CLI plugin (pinned + sha256, matching the
      # checksum discipline used for the static docker CLI in .build-image-base).
      # The static docker binary ships no buildx plugin, and upstream Hermes's
      # Dockerfile uses BuildKit-only features (COPY --link / --chmod), so the
      # classic builder cannot build it and DOCKER_BUILDKIT=1 `docker build`
      # fails with "buildx component is missing". Installing the plugin lets
      # `docker build` route through the daemon's embedded BuildKit.
      BUILDX_ARCH=$(dpkg --print-architecture)
      BUILDX_VERSION=v0.35.0
      case "$BUILDX_ARCH" in
        amd64) BUILDX_SHA256=d41ece72044243b4f58b343441ae37446d9c29a7d6b5e11c61847bbcf8f7dfda ;;
        arm64) BUILDX_SHA256=c4248d6cbc4a619a7e0b4609c11e509ad4ac0b475e1c64817c0ac20c5d90c766 ;;
        *) echo "unsupported arch: $BUILDX_ARCH"; exit 1 ;;
      esac
      curl -fsSL "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-${BUILDX_ARCH}" -o /tmp/docker-buildx
      echo "${BUILDX_SHA256}  /tmp/docker-buildx" | sha256sum -c -
      mkdir -p "$HOME/.docker/cli-plugins"
      install -m 0755 /tmp/docker-buildx "$HOME/.docker/cli-plugins/docker-buildx"
      rm /tmp/docker-buildx
      docker buildx version
    - |
      # Read the pinned tag from all.yml (same single-source pattern the other
      # version-gated jobs use). No YAML lib in this image — grep the scalar.
      HERMES_VERSION=$(grep -E '^hermes_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_VERSION" ]; then echo "could not read hermes_version from all.yml"; exit 1; fi
      # Codex + Claude Code CLI versions baked into the image by the wrapper
      # (see below).
      # Published tag (<version>-rN): the local patch revision — see all.yml.
      HERMES_IMAGE_VERSION=$(grep -E '^hermes_image_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_image_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_IMAGE_VERSION" ]; then echo "could not read hermes_image_version from all.yml"; exit 1; fi
      case "$HERMES_IMAGE_VERSION" in
        "${HERMES_VERSION}-r"*) ;;
        *) echo "hermes_image_version ($HERMES_IMAGE_VERSION) must be ${HERMES_VERSION}-r<N> — bump them in lockstep"; exit 1 ;;
      esac
      HERMES_CODEX_VERSION=$(grep -E '^hermes_codex_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_codex_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_CODEX_VERSION" ]; then echo "could not read hermes_codex_version from all.yml"; exit 1; fi
      HERMES_CLAUDE_VERSION=$(grep -E '^hermes_claude_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_claude_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_CLAUDE_VERSION" ]; then echo "could not read hermes_claude_version from all.yml"; exit 1; fi
      # 1Password CLI (op) version — baked in for Hermes' 1Password skill.
      HERMES_OP_VERSION=$(grep -E '^hermes_op_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_op_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_OP_VERSION" ]; then echo "could not read hermes_op_version from all.yml"; exit 1; fi
      echo "Building Hermes Agent ${HERMES_VERSION} (Codex CLI ${HERMES_CODEX_VERSION}, Claude Code CLI ${HERMES_CLAUDE_VERSION}, 1Password CLI ${HERMES_OP_VERSION})"
      ref="${CI_REGISTRY_IMAGE}/hermes-agent"
      rm -rf /tmp/hermes-src
      git clone --depth 1 --branch "$HERMES_VERSION" "$HERMES_UPSTREAM_REPO" /tmp/hermes-src
      HERMES_SHA=$(git -C /tmp/hermes-src rev-parse HEAD)
      # Verify the tag resolves to the immutable commit pinned alongside it in
      # all.yml. A tag is mutable upstream; without this check a moved or
      # compromised tag would let CI build+publish attacker-controlled steps into
      # an image Flux deploys. Bump hermes_git_sha whenever hermes_version changes.
      HERMES_EXPECTED_SHA=$(grep -E '^hermes_git_sha:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_git_sha:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_EXPECTED_SHA" ]; then echo "hermes_git_sha not pinned in all.yml — refusing to build"; exit 1; fi
      if [ "$HERMES_SHA" != "$HERMES_EXPECTED_SHA" ]; then
        echo "SECURITY: tag ${HERMES_VERSION} resolved to ${HERMES_SHA}, but all.yml pins ${HERMES_EXPECTED_SHA}."
        echo "The upstream tag may have moved. Refusing to build. Re-verify upstream and update hermes_git_sha."
        exit 1
      fi
      echo "Upstream ${HERMES_VERSION} -> ${HERMES_SHA} (matches pinned hermes_git_sha)"
      # Local patches (docker/hermes-agent/patches/*.patch), applied to the
      # SHA-verified tree before the build. Reviewed in THIS repo, so the
      # supply-chain property holds: pinned upstream + explicit local diffs.
      # git apply fails loudly if a patch has drifted — a hermes version bump
      # must re-verify every patch (or drop ones that were upstreamed).
      for p in docker/hermes-agent/patches/*.patch; do
        [ -e "$p" ] || continue
        echo "Applying local patch: $p"
        git -C /tmp/hermes-src apply -p1 --verbose "$CI_PROJECT_DIR/$p"
      done
      cache_args=""
      if [ "$CI_PIPELINE_SOURCE" != "schedule" ]; then
        cache_args="--cache-from ${ref}:latest --build-arg BUILDKIT_INLINE_CACHE=1"
      fi
      # Two-stage build, both on every pipeline (proves the image builds);
      # publish ONLY on main. Stage 1 builds upstream's self-contained Dockerfile
      # to a local intermediate tag. Stage 2 layers our thin CLI wrapper
      # (docker/hermes-agent/Dockerfile.codex — `npm i -g` of the pinned Codex +
      # Claude Code CLIs) on top as the FINAL image, carrying the load-bearing
      # :<version>/:<sha> tags the cluster pulls. Node 22 + npm are already in
      # the base, so the wrapper only adds the pinned CLIs. A single retry loop
      # covers both builds (either can hit a transient registry/npm hiccup). MR
      # pipelines are build-only, so an MR can never publish a registry image.
      upstream_ref="${ref}:upstream-${CI_COMMIT_SHORT_SHA}"
      attempt=1; max=3
      # shellcheck disable=SC2086  # intentional word-split of cache_args
      until docker build $cache_args \
              --build-arg HERMES_GIT_SHA="$HERMES_SHA" \
              -t "$upstream_ref" \
              /tmp/hermes-src \
            && docker build \
              --build-arg HERMES_IMAGE="$upstream_ref" \
              --build-arg HERMES_CODEX_VERSION="$HERMES_CODEX_VERSION" \
              --build-arg HERMES_CLAUDE_VERSION="$HERMES_CLAUDE_VERSION" \
              --build-arg HERMES_OP_VERSION="$HERMES_OP_VERSION" \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              -t "${ref}:${HERMES_VERSION}" \
              -t "${ref}:${HERMES_IMAGE_VERSION}" \
              -t "${ref}:${CI_COMMIT_SHORT_SHA}" \
              -f docker/hermes-agent/Dockerfile.codex \
              docker/hermes-agent; do
        attempt=$((attempt+1))
        if [ "$attempt" -gt "$max" ]; then echo "hermes build failed after ${max} attempts"; exit 1; fi
        echo "build attempt $((attempt-1)) failed; retrying (${attempt}/${max})..."
        sleep $(( (RANDOM % 20) + 10 ))
      done
      # The load-bearing tags (:<version> that the cluster pulls, :<sha> for
      # traceability, and :latest for the layer cache) are pushed only on main.
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker push "${ref}:${CI_COMMIT_SHORT_SHA}"
        docker push "${ref}:${HERMES_VERSION}"
        # The tag the cluster actually pulls (<version>-rN local patch
        # revision) — without this push the deployment's tag never exists and
        # hermes ImagePullBackOffs (observed on the v2026.7.20-r1 rollout,
        # unblocked live by a server-side crane retag of :<sha>). The build
        # already -t's this tag; the explicit re-tag is belt-and-braces against
        # the build's tag list drifting.
        docker tag "${ref}:${CI_COMMIT_SHORT_SHA}" "${ref}:${HERMES_IMAGE_VERSION}"
        docker push "${ref}:${HERMES_IMAGE_VERSION}"
        docker tag "${ref}:${CI_COMMIT_SHORT_SHA}" "${ref}:latest"
        docker push "${ref}:latest"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-build-hermes-agent, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-build-hermes-agent, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# build-camofox-browser: jo-inc/camofox-browser (the anti-detection browser
# server behind Hermes' camofox tool — the third container of the hermes pod)
# publishes no container image, so we build our own into the GitLab registry.
# Same supply-chain shape as build-hermes-agent: clone upstream at the pinned
# tag (v<hermes_camofox_version> in all.yml), verify the tag resolves to the
# pinned immutable commit (hermes_camofox_git_sha), then build THEIR Dockerfile
# unmodified — no wrapper layer (the image is complete as shipped: Camoufox
# binary + yt-dlp + plugins are baked at build time). Unlike hermes-agent's
# Dockerfile, camofox's uses no BuildKit-only syntax, so the base's builder
# path suffices and no buildx CLI plugin install is needed (same as the
# molecule image builds). Build on every pipeline (proves it builds); the
# load-bearing :<version>/:latest tags push only on main so an unmerged branch
# can't repoint a running deployment.
build-camofox-browser:
  extends: .build-image-base
  variables:
    CAMOFOX_UPSTREAM_REPO: "https://github.com/jo-inc/camofox-browser.git"
  script:
    - |
      # Install the Docker buildx CLI plugin (pinned + sha256). The base
      # template exports DOCKER_BUILDKIT=1 globally, so EVERY `docker build`
      # here requires the buildx component even for a Dockerfile with no
      # BuildKit-only syntax — same reason build-hermes-agent installs it.
      BUILDX_ARCH=$(dpkg --print-architecture)
      BUILDX_VERSION=v0.35.0
      case "$BUILDX_ARCH" in
        amd64) BUILDX_SHA256=d41ece72044243b4f58b343441ae37446d9c29a7d6b5e11c61847bbcf8f7dfda ;;
        arm64) BUILDX_SHA256=c4248d6cbc4a619a7e0b4609c11e509ad4ac0b475e1c64817c0ac20c5d90c766 ;;
        *) echo "unsupported arch: $BUILDX_ARCH"; exit 1 ;;
      esac
      curl -fsSL "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-${BUILDX_ARCH}" -o /tmp/docker-buildx
      echo "${BUILDX_SHA256}  /tmp/docker-buildx" | sha256sum -c -
      mkdir -p "$HOME/.docker/cli-plugins"
      install -m 0755 /tmp/docker-buildx "$HOME/.docker/cli-plugins/docker-buildx"
      rm /tmp/docker-buildx
      docker buildx version
    - |
      # Read the pins from all.yml (same single-source pattern as
      # build-hermes-agent; no YAML lib in this image — grep the scalars).
      CAMOFOX_VERSION=$(grep -E '^hermes_camofox_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_camofox_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$CAMOFOX_VERSION" ]; then echo "could not read hermes_camofox_version from all.yml"; exit 1; fi
      echo "Building camofox-browser ${CAMOFOX_VERSION}"
      ref="${CI_REGISTRY_IMAGE}/camofox-browser"
      rm -rf /tmp/camofox-src
      # The pin is the bare semver (the image tag); the upstream git tag
      # carries the leading "v".
      git clone --depth 1 --branch "v${CAMOFOX_VERSION}" "$CAMOFOX_UPSTREAM_REPO" /tmp/camofox-src
      CAMOFOX_SHA=$(git -C /tmp/camofox-src rev-parse HEAD)
      # Verify the tag resolves to the immutable commit pinned alongside it in
      # all.yml — a moved or compromised upstream tag must not let CI publish
      # attacker-controlled steps into an image Flux deploys (this container
      # browses the web with persistent cookies). Bump hermes_camofox_git_sha
      # whenever hermes_camofox_version changes.
      CAMOFOX_EXPECTED_SHA=$(grep -E '^hermes_camofox_git_sha:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_camofox_git_sha:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$CAMOFOX_EXPECTED_SHA" ]; then echo "hermes_camofox_git_sha not pinned in all.yml — refusing to build"; exit 1; fi
      if [ "$CAMOFOX_SHA" != "$CAMOFOX_EXPECTED_SHA" ]; then
        echo "SECURITY: tag v${CAMOFOX_VERSION} resolved to ${CAMOFOX_SHA}, but all.yml pins ${CAMOFOX_EXPECTED_SHA}."
        echo "The upstream tag may have moved. Refusing to build. Re-verify upstream and update hermes_camofox_git_sha."
        exit 1
      fi
      echo "Upstream v${CAMOFOX_VERSION} -> ${CAMOFOX_SHA} (matches pinned hermes_camofox_git_sha)"
      cache_args=""
      if [ "$CI_PIPELINE_SOURCE" != "schedule" ]; then
        cache_args="--cache-from ${ref}:latest --build-arg BUILDKIT_INLINE_CACHE=1"
      fi
      # Bounded retry: the build pulls the Camoufox release zip + yt-dlp at
      # image-build time, so a transient GitHub/registry blip re-attempts
      # cheaply on cached layers while a real Dockerfile error still fails.
      attempt=1; max=3
      # shellcheck disable=SC2086  # intentional word-split of cache_args
      until docker build $cache_args \
              -t "${ref}:${CAMOFOX_VERSION}" \
              -t "${ref}:${CI_COMMIT_SHORT_SHA}" \
              /tmp/camofox-src; do
        attempt=$((attempt+1))
        if [ "$attempt" -gt "$max" ]; then echo "camofox build failed after ${max} attempts"; exit 1; fi
        echo "build attempt $((attempt-1)) failed; retrying (${attempt}/${max})..."
        sleep $(( (RANDOM % 20) + 10 ))
      done
      # The load-bearing tags (:<version> that the cluster pulls, :<sha> for
      # traceability, and :latest for the layer cache) are pushed only on main.
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker push "${ref}:${CI_COMMIT_SHORT_SHA}"
        docker push "${ref}:${CAMOFOX_VERSION}"
        docker tag "${ref}:${CI_COMMIT_SHORT_SHA}" "${ref}:latest"
        docker push "${ref}:latest"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-build-camofox-browser, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-build-camofox-browser, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# LINT STAGE - Code quality checks

# Two consolidated micro-check jobs — generated-file freshness and repo-policy
# invariants. Each job's paths anchor is the UNION of its constituent checks'
# inputs, and the driver runs EVERY check before failing, so one push surfaces
# every violation. The per-check scripts also run individually in `task lint`.
# The heavyweight linters (ansible-lint/yaml-lint/shellcheck/flux-lint/
# prometheus-config-lint) stay separate — at >=1 min each, parallelism beats
# pod overhead.
repo-sync-checks:
  needs: []
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install --quiet "pyyaml==${PYYAML_VERSION}"
  script:
    - |
      set -uo pipefail
      overall=0; failed=""

      run_check() {
        name="$1"; shift
        printf 'section_start:%s:%s[collapsed=true]\r\033[0K== %s\n' "$(date +%s)" "$name" "$name"
        rc=0; "$@" || rc=$?
        printf 'section_end:%s:%s\r\033[0K\n' "$(date +%s)" "$name"
        if [ "$rc" -ne 0 ]; then overall=1; failed="$failed $name"; echo "FAILED: $name (rc=$rc)"; fi
      }

      # hosts.env freshness: compare the committed file against a freshly
      # generated one. The generator writes in place, so save + restore to
      # keep the workspace clean for other checks/jobs.
      check_hosts_env() {
        set -eo pipefail
        TARGET=scripts/hosts.env
        cp "$TARGET" /tmp/committed.env
        python3 scripts/generate-hosts-env.py
        cp "$TARGET" /tmp/generated.env
        cp /tmp/committed.env "$TARGET"   # restore workspace
        if ! diff -q /tmp/committed.env /tmp/generated.env >/dev/null 2>&1; then
          echo "ERROR: scripts/hosts.env is out of sync with hosts.yml"
          echo "Run: task hosts:sync and commit the result."
          diff -u /tmp/committed.env /tmp/generated.env || true
          return 1
        fi
        echo "scripts/hosts.env is in sync with hosts.yml"
      }

      # versions-configmap freshness: same save/generate/diff/restore pattern.
      check_versions_configmap() {
        set -eo pipefail
        TARGET=kubernetes/infrastructure/sources/versions-configmap.yaml
        cp "$TARGET" /tmp/committed.yaml
        python3 scripts/generate-versions-configmap.py
        cp "$TARGET" /tmp/generated.yaml
        cp /tmp/committed.yaml "$TARGET"   # restore workspace
        if ! diff -q /tmp/committed.yaml /tmp/generated.yaml >/dev/null 2>&1; then
          echo "ERROR: versions-configmap.yaml is out of sync with all.yml"
          echo "Run: task flux:sync-versions and commit the result."
          diff -u /tmp/committed.yaml /tmp/generated.yaml || true
          return 1
        fi
        echo "versions-configmap.yaml is in sync with all.yml"
      }

      run_check hosts-env-sync check_hosts_env
      run_check flux-versions-sync check_versions_configmap
      [ "$overall" -eq 0 ] || echo "Failed sync checks:$failed"
      exit "$overall"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-repo-sync, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-repo-sync, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'

repo-policy-checks:
  needs: []
  stage: lint
  # python:3.11-slim (not alpine): apk installs from dl-cdn.alpinelinux.org
  # returned DNS lookup errors mid-pipeline; the Debian image ships bash +
  # coreutils + python3.
  image: python:3.11-slim
  variables:
    # check-deploy-coverage.sh's `git merge-base --is-ancestor` guard rejects
    # unrelated histories — which a default depth-20 clone surfaces as a false
    # positive whenever the MR base is >20 commits behind HEAD. GIT_DEPTH: 0
    # forces a full clone so the merge-base is always reachable.
    GIT_DEPTH: 0
  before_script:
    # git for check-deploy-coverage.sh; curl/ca-certificates for the go-task
    # download; PyYAML for the coverage scripts' YAML parsing.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates
    - pip install --no-cache-dir --quiet "PyYAML==${PYYAML_VERSION}"
    - |
      # go-task, pinned + sha256 like every other downloaded binary in this pipeline.
      TASK_VERSION="v3.52.0"
      TASK_SHA256="02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd"
      curl -fsSL "https://github.com/go-task/task/releases/download/${TASK_VERSION}/task_linux_amd64.tar.gz" -o /tmp/task.tar.gz
      echo "${TASK_SHA256}  /tmp/task.tar.gz" | sha256sum -c -
      tar xzf /tmp/task.tar.gz -C /usr/local/bin task
      task --version
  script:
    - |
      set -uo pipefail
      overall=0; failed=""

      run_check() {
        name="$1"; shift
        printf 'section_start:%s:%s[collapsed=true]\r\033[0K== %s\n' "$(date +%s)" "$name" "$name"
        rc=0; "$@" || rc=$?
        printf 'section_end:%s:%s\r\033[0K\n' "$(date +%s)" "$name"
        if [ "$rc" -ne 0 ]; then overall=1; failed="$failed $name"; echo "FAILED: $name (rc=$rc)"; fi
      }

      # Every deploy job that runs an Ansible playbook must ALSO trigger on
      # ansible/requirements.yml. The roles ship in weisssrv.infra, so the
      # collection pin is the only in-repo signal that a role changed; a job
      # that misses it goes on deploying the old version, silently.
      # check-deploy-coverage.sh cannot see this — requirements.yml is not a
      # role/playbook/inventory path.
      #
      # Lives in scripts/ rather than inline here so `task lint` can run the
      # SAME code: an inline heredoc is reachable only from this job, and both
      # this check and ci-pin-parity fire exactly on a .gitlab-ci.yml edit —
      # precisely when a green local run is most likely to be trusted.

      # deploy-verify FLUX_VERSION pin must match the versions-configmap.
      check_flux_version_pin() {
        set -eu
        PIN=$(sed -n 's/^ *FLUX_VERSION="\([0-9.]*\)"$/\1/p' .gitlab-ci.yml | head -1)
        CM=$(sed -n 's/^ *flux_version: *//p' kubernetes/infrastructure/sources/versions-configmap.yaml | head -1)
        echo "deploy-verify FLUX_VERSION pin: ${PIN:-<not found>} / versions-configmap flux_version: ${CM:-<not found>}"
        [ -n "$PIN" ] || { echo "Could not extract FLUX_VERSION pin from .gitlab-ci.yml"; return 1; }
        [ -n "$CM" ] || { echo "Could not extract flux_version from versions-configmap.yaml"; return 1; }
        [ "$PIN" = "$CM" ] || { echo "FLUX_VERSION pin (${PIN}) drifted from versions-configmap flux_version (${CM}) — bump the deploy-verify version + sha256 pair in .gitlab-ci.yml"; return 1; }
      }

      # post-maintenance-verify's busybox image vs the busybox_version pin
      # (mirrors task lint:busybox-version-pin). The script runs kubectl outside
      # Flux, so no ${busybox_version} substitution reaches it.
      check_busybox_version_pin() {
        set -eu
        PIN=$(sed -n 's/.*--image=busybox:\([0-9.]*\).*/\1/p' scripts/post-maintenance-verify.sh | head -1)
        AV=$(sed -n 's/^busybox_version: *"\{0,1\}\([0-9.]*\)"\{0,1\} *$/\1/p' ansible/inventories/prod/group_vars/all.yml | head -1)
        echo "post-maintenance-verify busybox: ${PIN:-<not found>} / all.yml busybox_version: ${AV:-<not found>}"
        [ -n "$PIN" ] || { echo "Could not extract the busybox image pin from scripts/post-maintenance-verify.sh"; return 1; }
        [ -n "$AV" ] || { echo "Could not extract busybox_version from group_vars/all.yml"; return 1; }
        [ "$PIN" = "$AV" ] || { echo "busybox pin (${PIN}) drifted from all.yml busybox_version (${AV})"; return 1; }
      }

      # ci-pin-parity also lives in scripts/ (see the note above
      # check_flux_version_pin): both it and collection-pin-trigger are the two
      # checks `task lint` used to be missing, and an inline function is
      # unreachable from there.

      check_taskfile() { task --list >/dev/null && bash scripts/check-taskfile.sh; }

      run_check deploy-coverage bash scripts/check-deploy-coverage.sh
      run_check deploy-host-coverage python3 scripts/check-deploy-host-coverage.py
      run_check collection-pin-trigger python3 scripts/check-collection-pin-trigger.py
      run_check integration-matrix-coverage bash scripts/check-integration-matrix-coverage.sh
      run_check backup-artifact-apps python3 scripts/check-backup-artifact-apps.py
      run_check netpol-except-parity python3 scripts/check-netpol-except-parity.py
      run_check kubectl-version-pin python3 scripts/check-kubectl-version-pin.py
      run_check flux-version-pin check_flux_version_pin
      run_check busybox-version-pin check_busybox_version_pin
      run_check ci-pin-parity bash scripts/check-ci-pin-parity.sh
      run_check taskfile-smoke check_taskfile
      [ "$overall" -eq 0 ] || echo "Failed policy checks:$failed"
      exit "$overall"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-repo-policy, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-repo-policy, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# ansible-lint and the AI reviewer (pr-agent-review) are generated from the
# shared CI library templates — see the include: block below.

# VALIDATE STAGE - Schema and configuration validation

terraform-plan:
  extends: .terraform-http-backend
  needs: []
  stage: validate
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]
  before_script:
    - !reference [.install-1password-alpine, before_script]
  script:
    - cd terraform/cloudflare
    # -lockfile=readonly: CI must not rewrite .terraform.lock.hcl (provider
    # hashes are committed; a CI-side change would mask supply-chain drift).
    - terraform init -lockfile=readonly
    - |
      export TF_VAR_cloudflare_api_token=$(op read "op://Homelab/Cloudflare Terraform Token/credential")
      export TF_VAR_cloudflare_account_id=$(op read "op://Homelab/Cloudflare Terraform Token/username")
      terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan
    # Generate plan report for MR widget (shows resource change counts in merge requests)
    - terraform show -json tfplan | jq -r '
        ([.resource_changes[]?.change.actions?]|flatten)|
        {"create":(map(select(.=="create"))|length),
         "update":(map(select(.=="update"))|length),
         "delete":(map(select(.=="delete"))|length)}
      ' > tfplan.json
  artifacts:
    # The binary plan embeds rendered resource attributes; restrict download to
    # developer+ (default is any project member). deploy-terraform still consumes
    # it via needs:artifacts — access only gates UI/API download, not job needs.
    access: developer
    paths:
      - terraform/cloudflare/tfplan
    reports:
      terraform: terraform/cloudflare/tfplan.json
    # 1 day (not 1 hour): deploy-terraform consumes this tfplan in a later stage;
    # a slow/retried pipeline could otherwise have the plan GC'd before apply.
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # CREDENTIAL SCOPE, accepted deliberately. This is the ONLY job that reads
    # 1Password secrets on a merge_request_event ref, and it keeps that rule
    # because it is the only pre-merge preview of a change deploy-terraform
    # auto-applies on main. OP_SERVICE_ACCOUNT_TOKEN is a project variable, so
    # it is in every MR job's environment regardless — the exposure closes by
    # marking it PROTECTED in project settings, which also removes this plan
    # from MRs and needs pr-agent-review's gate switched to $OPENAI__KEY in the
    # same change (docs/13). The token guard means a tokenless pipeline gets NO
    # plan; that is an expected skip, not a clean plan, and validation-gate
    # needs this job optionally so it cannot mask drift on a real run.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-terraform-cloudflare, changes]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-terraform-cloudflare, changes]

# Read-only drift `terraform plan` for the tailscale ACL module against live
# state. Never applies (apply stays supervised — see terraform/tailscale/README.md).
# A non-empty plan = the live tailnet ACL drifted from policy.hujson (e.g. an
# Admin-console hot-fix); allow_failure so that drift, or a plan hiccup, surfaces
# without blocking CI. Mirrors terraform-plan's op-injected creds + TF_HTTP_*
# state backend, scoped to the tailscale module + its own state name.
tailscale-drift-plan:
  # Shared HTTP-backend auth/lock settings come from .terraform-http-backend;
  # only the tailscale state path is overridden here.
  extends: .terraform-http-backend
  needs: []
  stage: validate
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]
  variables:
    TF_HTTP_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/tailscale"
    TF_HTTP_LOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/tailscale/lock"
    TF_HTTP_UNLOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/tailscale/lock"
  before_script:
    - !reference [.install-1password-alpine, before_script]
  script:
    - cd terraform/tailscale
    # -lockfile=readonly: CI must not rewrite .terraform.lock.hcl (committed
    # provider hashes; a CI-side change would mask supply-chain drift).
    - terraform init -lockfile=readonly
    - |
      export TF_VAR_tailscale_oauth_client_id=$(op read "op://Homelab/Tailscale OAuth/client id")
      export TF_VAR_tailscale_oauth_client_secret=$(op read "op://Homelab/Tailscale OAuth/credential")
      # Plan only, never apply — surfaces drift instead of silently reverting it.
      # -detailed-exitcode: drift exits 2 (plain plan exits 0 on a non-empty
      # diff), so allow_failure can actually render the yellow drift signal.
      terraform plan -input=false -no-color -lock-timeout=120s -detailed-exitcode
  # Advisory drift signal only — never blocks CI (apply stays supervised).
  allow_failure: true
  rules:
    # Schedule is the real detector: no changes: filter, so it catches
    # out-of-band Admin-console edits when nothing in-repo changed.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $OP_SERVICE_ACCOUNT_TOKEN'
    # Post-merge, before the supervised apply. Deliberately NO merge_request_event
    # rule: this job materializes vault secrets into a job that runs the branch's
    # own code, and an advisory drift signal is not worth that on an unmerged ref
    # (terraform-plan is the one job that keeps its MR rule — see it for why).
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-terraform-tailscale, changes]

# Read-only drift `terraform plan` for the authentik SSO module against the
# live authentik objects. Never applies from CI: the apply is `task
# terraform:authentik-apply`, which refuses to run non-interactively (see
# terraform/authentik/README.md). A non-empty plan = an Admin-UI edit drifted
# from the codified state; allow_failure so drift, or a plan hiccup, surfaces
# without blocking CI. Mirrors tailscale-drift-plan (op-injected creds +
# TF_HTTP_* backend), scoped to the authentik module + its own state name.
authentik-drift-plan:
  # Shared HTTP-backend auth/lock settings come from .terraform-http-backend;
  # only the authentik state path is overridden here.
  extends: .terraform-http-backend
  needs: []
  stage: validate
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]
  variables:
    TF_HTTP_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/authentik"
    TF_HTTP_LOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/authentik/lock"
    TF_HTTP_UNLOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/authentik/lock"
  before_script:
    - !reference [.install-1password-alpine, before_script]
  script:
    - cd terraform/authentik
    # -lockfile=readonly: CI must not rewrite .terraform.lock.hcl (committed
    # provider hashes; a CI-side change would mask supply-chain drift).
    - terraform init -lockfile=readonly
    - |
      export TF_VAR_authentik_token=$(op read "op://Homelab/Authentik Terraform Token/credential")
      export TF_VAR_oauth2_client_secret_mealie=$(op read "op://Homelab/Mealie SSO/oidc-client-secret")
      export TF_VAR_oauth2_client_secret_bar_assistant=$(op read "op://Homelab/Bar Assistant SSO/authentik-client-secret")
      export TF_VAR_oauth2_client_secret_home_assistant=$(op read "op://Homelab/Home Assistant SSO/authentik-client-secret")
      export TF_VAR_oauth2_client_secret_grafana=$(op read "op://Homelab/Grafana SSO/oidc-client-secret")
      export TF_VAR_oauth2_client_secret_nextcloud=$(op read "op://Homelab/Nextcloud SSO/client-secret")
      export TF_VAR_oauth2_client_secret_immich=$(op read "op://Homelab/Immich SSO/client-secret")
      export TF_VAR_oauth2_client_secret_hermes_dashboard=$(op read "op://Homelab/Hermes Secrets/hermes-dashboard-oidc-client-secret")
      export TF_VAR_oauth2_client_secret_homarr=$(op read "op://Homelab/Homarr SSO/client-secret")
      export TF_VAR_basic_auth_nzbget_username=$(op read "op://Homelab/NZBGet/username")
      export TF_VAR_basic_auth_nzbget_password=$(op read "op://Homelab/NZBGet/password")
      export TF_VAR_basic_auth_adguard_username=$(op read "op://Homelab/AdGuard Home/username")
      export TF_VAR_basic_auth_adguard_password=$(op read "op://Homelab/AdGuard Home/password")
      # Plan only, never apply — surfaces drift instead of silently reverting it.
      # -detailed-exitcode: drift exits 2 (plain plan exits 0 on a non-empty
      # diff), so allow_failure can actually render the yellow drift signal.
      terraform plan -input=false -no-color -lock-timeout=120s -detailed-exitcode
  # Advisory drift signal only — never blocks CI (apply stays supervised).
  allow_failure: true
  rules:
    # Schedule is the real detector: no changes: filter, so it catches
    # out-of-band Admin-UI edits when nothing in-repo changed.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $OP_SERVICE_ACCOUNT_TOKEN'
    # Post-merge, before the supervised apply. NO merge_request_event rule: this
    # job reads thirteen vault items (every OIDC client secret among them) and
    # must not do that in a job running an unmerged branch's code.
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-terraform-authentik, changes]

# Read-only drift check for the B2 backup-bucket settings against the live
# bucket via the raw B2 API (scripts/b2-bucket-drift.py — the codified config;
# it replaced the terraform/b2 module after the Backblaze provider's READ path
# started returning empty attributes against B2's current API, which made
# terraform plan report a permanent phantom diff). Never applies: reconciling
# is the supervised `task b2:apply`. A DRIFT result = an out-of-band
# Backblaze-console edit; allow_failure so drift, or an API hiccup, surfaces
# without blocking CI.
b2-drift-plan:
  needs: []
  stage: validate
  image: python:3.11-slim
  before_script:
    - !reference [.install-1password, before_script]
  script:
    - |
      export B2_APPLICATION_KEY_ID=$(op read "op://Homelab/B2 Archive Backup/b2_key_id")
      export B2_APPLICATION_KEY=$(op read "op://Homelab/B2 Archive Backup/b2_application_key")
      python3 scripts/b2-bucket-drift.py
  # Advisory drift signal only — never blocks CI (apply stays supervised).
  allow_failure: true
  rules:
    # Schedule is the real detector: no changes: filter, so it catches
    # out-of-band Backblaze-console edits when nothing in-repo changed.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $OP_SERVICE_ACCOUNT_TOKEN'
    # Post-merge validation of a drift-script change against the live bucket.
    # NO merge_request_event rule — same credential-scope reasoning as the two
    # drift plans above; the script and its bucket config are covered pre-merge
    # by python-tests.
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-b2-drift, changes]

# Validate the kube-prometheus-stack alert rules (PromQL in HelmRelease values)
# and the Alertmanager config (ExternalSecret template) that kubeconform /
# flux-lint can't parse. Without this, a bad expr or malformed route only
# surfaces post-merge when the prometheus-operator admission webhook rejects the
# rendered CR (failing the whole HelmRelease upgrade). See docs/33.
prometheus-config-lint:
  needs: []
  stage: lint
  image: python:3.11-slim
  # Cache promtool + amtool across runs, keyed on .gitlab-ci.yml (versions +
  # sha256s live there). No-op without a runner cache backend.
  cache:
    key:
      prefix: prom-tools
      files:
        - .gitlab-ci.yml
    paths:
      - .cache/prom-tools
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl
    - pip install --quiet "pyyaml==${PYYAML_VERSION}"
    - |
      set -eo pipefail
      # promtool (prometheus) + amtool (alertmanager), pinned + sha256 like every
      # other downloaded binary in this pipeline. The cache holds VERIFIED
      # TARBALLS: every run — hit or miss — re-checks the pinned sha256 and
      # re-extracts, so a mutated runner cache can't smuggle in an unverified
      # binary. set -eo pipefail so a failing sha256sum -c aborts the block.
      TOOLS_CACHE="${CI_PROJECT_DIR}/.cache/prom-tools"
      mkdir -p "$TOOLS_CACHE"
      fetch_verified() { # <file> <url> <sha256>
        if ! echo "$3  $TOOLS_CACHE/$1" | sha256sum -c - >/dev/null 2>&1; then
          curl -fsSL -o "$TOOLS_CACHE/$1" "$2"
          echo "$3  $TOOLS_CACHE/$1" | sha256sum -c -
        fi
      }
      PROM_VERSION="3.6.0"
      fetch_verified prom.tar.gz \
        "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
        2002ef4a55a64161affccd2786c7081d4e3b3a8d08786a98b3bb110971414916
      tar xzf "$TOOLS_CACHE/prom.tar.gz" -C /usr/local/bin --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"
      AM_VERSION="0.28.1"
      fetch_verified am.tar.gz \
        "https://github.com/prometheus/alertmanager/releases/download/v${AM_VERSION}/alertmanager-${AM_VERSION}.linux-amd64.tar.gz" \
        5ac7ab5e4b8ee5ce4d8fb0988f9cb275efcc3f181b4b408179fafee121693311
      tar xzf "$TOOLS_CACHE/am.tar.gz" -C /usr/local/bin --strip-components=1 "alertmanager-${AM_VERSION}.linux-amd64/amtool"
      promtool --version && amtool --version
  script:
    - bash scripts/lint-prometheus-config.sh
    # Behavioural half of the gate: amtool check-config accepts a route reorder
    # that silences Watchdog and a one-sided alertname rename that unbinds an
    # inhibit pair. Same pairing as `task lint:prometheus-config`.
    - python3 scripts/check-alertmanager-behaviour.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-prometheus-config, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-prometheus-config, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'

# TEST STAGE - Integration tests

# The role molecule matrix lives in weisssrv-lib, which owns the roles. What
# stays here are the five multi-container stack tests: they exercise ROLE
# COMBINATIONS against this repo's prod group_vars, which is a weisssrv
# property the library cannot test.
#
# They need Docker-in-Docker, so they run on the privileged infrastructure
# runner (gitlab-runner-privileged Helm release, tags: infrastructure). That
# runner is Flux-managed: edit kubernetes/apps/gitlab-runner-privileged/
# release.yaml and push.
.integration-test-job:
  stage: test
  # Backstop for infra-class scheduling failures (a job pod that can't be placed
  # during transition churn surfaces as runner_system_failure). Deliberately NOT
  # script_failure (a failing test must not be masked — transient container
  # start storms are handled by the in-job destroy+jitter loop in
  # scripts/molecule-retry.sh) and NOT stuck_or_timeout_failure (a hung test
  # should fail fast, not burn another full timeout).
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  needs:
    # Gate the expensive privileged-DinD fan-out behind the two fastest
    # correctness lints, so an MR with a syntax/lint error doesn't burn the
    # suite on the scarce privileged runner. optional: both are path-gated.
    - job: ansible-lint
      optional: true
    - job: yaml-lint
      optional: true
  # The library's pre-built CI runner image (docker-cli + molecule + ansible +
  # its dependency collections baked in), pinned to the same tag as every other
  # library include. `image:` expands $VAR but not bash defaults, so the ref
  # lives in the variables block below.
  image: $MOLECULE_CI_IMAGE
  services:
    # Digest-pinned (multi-arch index), matching the library's molecule jobs.
    #
    # --insecure-registry: the in-cluster pull-through cache (kubernetes/apps/
    # registry-cache, docs/27) is plaintext HTTP, network-fenced to this
    # namespace; every fresh DinD daemon needs the flag to pull from it.
    - name: docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
      # Explicit: the runner derives a service alias from the image name, and a
      # digest-bearing name must still answer at the `docker` host DOCKER_HOST
      # points at.
      alias: docker
      command: ["--insecure-registry=registry-cache.registry-cache.svc.cluster.local:5000"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    ANSIBLE_FORCE_COLOR: "1"
    PY_COLORS: "1"
    ANSIBLE_CALLBACKS_ENABLED: junit
    JUNIT_OUTPUT_DIR: "$CI_PROJECT_DIR/junit"
    # Both images are published by weisssrv-lib's release pipeline under the
    # release tag; weisssrv must stay on that project's CI/CD job-token
    # allowlist for these cross-project pulls to authenticate.
    MOLECULE_CI_IMAGE: "$CI_REGISTRY/eric/weisssrv-lib/molecule-ci:$WEISSSRV_LIB_REF"
    # Read by the scenarios' `platforms[].image` (they carry the same tag as a
    # fallback default for a local run), so this job's pull and the containers
    # molecule starts are the same build.
    MOLECULE_TEST_IMAGE: "$CI_REGISTRY/eric/weisssrv-lib/molecule-test:$WEISSSRV_LIB_REF"
    # In-cluster pull-through registry cache: the first job's fresh DinD
    # cold-pulls the test image, the rest hit the LAN cache.
    REGISTRY_CACHE: "registry-cache.registry-cache.svc.cluster.local:5000"
  before_script:
    # Wait for the DinD sidecar — with a pre-built CI image the script starts
    # before DinD is ready (no apt-get delay to absorb its startup).
    - |
      for i in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        echo "Waiting for DinD... ($i)"
        sleep 1
      done
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Pre-pull the test image into this job's DinD so the scenarios
    # (pre_build_image: true) start containers without pulling. Cache first,
    # timeout-bounded, falling back to the direct registry — a cache outage only
    # loses the warm hit.
    - |
      cref="${REGISTRY_CACHE}/${MOLECULE_TEST_IMAGE#"${CI_REGISTRY}"/}"
      if timeout 25 docker pull "$cref" 2>/dev/null; then
        docker tag "$cref" "$MOLECULE_TEST_IMAGE"
      else
        docker pull "$MOLECULE_TEST_IMAGE"
      fi
    # weisssrv.infra itself is installed by molecule's own `dependency` step
    # (each scenario points it at ansible/requirements.yml) — deliberately not
    # duplicated here, so the pin has one installer.
    - mkdir -p "$CI_PROJECT_DIR/junit"
  artifacts:
    when: always
    reports:
      junit: junit/*.xml
  # Multi-container scenarios run 2-3 systemd containers through full role
  # stacks; base-infrastructure alone is ~12m idle, and the in-job wrapper
  # retries molecule up to 4 attempts.
  timeout: 35m
  script:
    - cd "ansible/integration-tests/$TEST"
    # Shared destroy+jitter retry (scripts/molecule-retry.sh) — multi-container
    # scenarios are the most start-storm-prone. No base/scenario opts: each
    # integration test has a single molecule.yml.
    - bash "$CI_PROJECT_DIR/scripts/molecule-retry.sh"
    # Downgrade the scenario's DECLARED negative-path failures in the junit
    # report so a green job uploads a green report (no stack declares any
    # today — the absent file is a no-op). Runs only on success; a failed job
    # never reaches this line and keeps its raw report.
    - python3 "$CI_PROJECT_DIR/scripts/sanitize-junit-expected-failures.py"
      --junit-dir "$CI_PROJECT_DIR/junit"
      --expectations "$CI_PROJECT_DIR/ansible/integration-tests/$TEST/molecule/default/expected-junit-failures.txt"

integration-tests:
  extends: .integration-test-job
  parallel:
    matrix:
      - TEST:
          - base-infrastructure
          - cert-distribution
          - dns-stack
          - mail-stack
          - storage-stack
  rules:
    # full-test schedule canary (must precede the schedule when:never rule —
    # first match wins): catches external-dependency rot (apt/galaxy/upstream
    # installers) without waiting for an unrelated MR to turn red.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "full-test"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-integration, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-integration, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# SHARED CI LIBRARY (eric/weisssrv-lib)
#
# The generic lint/validate/test/security/review jobs and the reusable
# `.dep-cache` / `.install-1password*` / `.terraform-http-backend` fragments are
# consumed from the library via include:project at a pinned tag. Only the inputs
# that differ from a library default are passed.
#
# THE PIN IS REPEATED, AND THAT IS NOT A CHOICE. `include:` resolves at
# pipeline-CREATION time, before this file's `variables:` block exists, so
# `ref: $WEISSSRV_LIB_REF` silently does not work. (A project-level CI/CD
# variable IS readable there, but it would move the pin out of git, where a
# library bump stops showing up in a diff and cannot be reverted as an MR.)
# variables.WEISSSRV_LIB_REF is the single source of truth and
# scripts/check-lib-pins.py fails the pipeline if any entry drifts from it or
# pins a branch; `--fix` rewrites them. Bump the variable, then run --fix.
#
# GitLab's managed Secret-Detection template is pulled in by the library's
# secret-detection component, which overrides that job — including it directly
# here as well would be redundant.
include:
  # Reusable fragments, no jobs of their own. terraform-http-backend's defaults
  # already describe this instance and the cloudflare state; the two drift-plan
  # jobs override the three TF_HTTP_*ADDRESS vars for their own state names.
  - project: eric/weisssrv-lib
    ref: v0.6.0
    file:
      - /ci/templates/dep-cache.yml
      - /ci/templates/install-1password.yml
      - /ci/templates/terraform-http-backend.yml

  # These take the library defaults verbatim, so they share ONE entry (`file:`
  # accepts a list; `inputs:` bind per ENTRY, so anything parameterized needs
  # its own entry below).
  #   terraform: emits BOTH terraform-fmt (lint) and terraform-validate
  #     (validate) over terraform/ and terraform/*/.
  #   secret_detection: overrides GitLab's managed job (modern-CPU node
  #     selector, allow_failure, MR/main/schedule rules); the hard block comes
  #     from validation-gate needing this job non-optionally.
  - project: eric/weisssrv-lib
    ref: v0.6.0
    file:
      - /ci/validate/terraform.yml
      - /ci/security/secret-detection.yml

  # yaml-lint: the library default targets `.gitlab/ci/`, which this repo no
  # longer has; lint all of `.gitlab/` (the GitLab agent config) instead.
  - project: eric/weisssrv-lib
    ref: v0.6.0
    file: /ci/lint/yaml-lint.yml
    inputs:
      targets: "ansible/ kubernetes/ .gitlab-ci.yml .gitlab/"
      changes:
        - "ansible/**/*"
        - "kubernetes/**/*"
        - ".gitlab-ci.yml"
        - ".gitlab/**/*"

  # shellcheck: `find_dir` is empty and `ansible/*.sh` is gone from the default
  # globs — the shell the roles ship now lives in the weisssrv.infra collection,
  # where the library's own pipeline shellchecks it. What is left is scripts/
  # plus the terraform helper scripts the default set missed.
  - project: eric/weisssrv-lib
    ref: v0.6.0
    file: /ci/lint/shellcheck.yml
    inputs:
      direct_globs: "scripts/*.sh terraform/*/*.sh"
      find_dir: ""
      changes:
        - "scripts/**/*"
        - "terraform/*/*.sh"

  # ansible-lint: playbooks, inventories and the integration scenarios. The
  # roles they address by FQCN come from the collection, so the pin is installed
  # first (galaxy_requirements). ansible-lint's own syntax-check rule runs
  # `ansible-playbook --syntax-check` per playbook, so no separate loop.
  #
  # No `config:` input: the job runs from the repo root, and ansible-lint only
  # walks UP from its cwd, so the config lives at ./.ansible-lint (moved there
  # from ansible/, where a root-cwd run never saw it). It is in `changes:` so an
  # edit to the profile re-runs the job.
  - project: eric/weisssrv-lib
    ref: v0.6.0
    file: /ci/lint/ansible-lint.yml
    inputs:
      targets: "ansible/"
      galaxy_requirements: "ansible/requirements.yml"
      # Full image, not slim: galaxy installs the collection from a git+ URL,
      # which needs the git executable.
      image: python:3.13
      changes:
        - "ansible/**/*"
        - ".ansible-lint"
        - ".gitlab-ci.yml"

  # python-lint: ruff over the helper scripts, using the library's shared
  # profile vendored to this repo's root as ruff.toml.
  - project: eric/weisssrv-lib
    ref: v0.6.0
    file: /ci/lint/python-lint.yml
    inputs:
      targets: "scripts"
      config: "--config ruff.toml"
      changes:
        - "scripts/**/*.py"
        - "ruff.toml"
        - ".gitlab-ci.yml"

  # docs-link-check: runs weisssrv's repo-local scripts/check-doc-links.py, which
  # scans every TRACKED *.md (role/app/agent READMEs link into docs/ too), so the
  # trigger list has to be `**/*.md`-wide — the library default only covers
  # docs/ + the top-level READMEs.
  - project: eric/weisssrv-lib
    ref: v0.6.0
    file: /ci/lint/docs-link-check.yml
    inputs:
      changes:
        - "**/*.md"
        - "scripts/check-doc-links.py"
        - "scripts/test_check_doc_links.py"

  # version-check: reports available pin updates and changes nothing — the
  # read-only half of the pair whose other half is version-bump-bot (a local job
  # below). Only the two commands differ from the library defaults.
  #
  # `changes` is deliberately NOT passed: the library default is `["**/*"]`,
  # which matches every merge request. Passing `[]` would match NOTHING and
  # delete the job silently.
  #
  # No credential input exists by design: `setup_command` and `check_command`
  # come from the branch under review, so a token fetched here would be readable
  # by that code. GITLAB_API_TOKEN stays a masked CI variable holding a project
  # token (weisssrv-bot, Reporter + api) — enough to post the MR comment, unable
  # to push. Without it, version-check-ci.py skips the comment and still writes
  # the report; that graceful skip lives in the script, not in this job.
  - project: eric/weisssrv-lib
    ref: v0.6.0
    file: /ci/maintenance/version-check.yml
    inputs:
      setup_command: 'pip install --quiet "pyyaml==${PYYAML_VERSION}" requests==2.34.2'
      check_command: "python3 ./scripts/version-check-ci.py"

  # python-tests: pytest scripts/. Most of the suite are drift guards that read
  # files OUTSIDE scripts/, so the library default `changes` (scripts/ + docs)
  # leaves them unable to fire on their own subject.
  #
  # GOAL: every repo file a scripts/test_*.py reads matches a pattern below, so a
  # guard fires on its own subject. Derived by TRACING, not by reading the tests:
  # a sys.addaudithook over `pytest scripts/` recorded every open, and each path
  # was matched with Ruby File.fnmatch under GitLab's flags
  # (PATHNAME|DOTMATCH|EXTGLOB). Re-run that trace when adding a test rather than
  # guessing its inputs — the list is hand-maintained and only as current as the
  # last trace.
  #
  # The pytest/PyYAML pins are passed rather than left to the template defaults
  # so the variables: block above is their single source (repo-policy-checks'
  # ci-pin-parity check enforces the equality).
  #
  # setup_command clones the library at the pinned tag:
  # scripts/test_vendored_byte_identity.py compares this repo's vendored script
  # copies against it and never skips, so the checkout is a hard requirement of
  # the job (WEISSSRV_LIB_PATH points at it — see the job override below).
  - project: eric/weisssrv-lib
    ref: v0.6.0
    file: /ci/test/python-tests.yml
    inputs:
      pytest_version: "9.1.1"
      pyyaml_version: "6.0.2"
      setup_command: 'git clone --depth 1 --branch "$WEISSSRV_LIB_REF" "$CI_SERVER_URL/eric/weisssrv-lib.git" "$WEISSSRV_LIB_PATH"'
      changes:
        - "scripts/**/*"
        - "ansible/inventories/prod/**/*"
        - "ansible/playbooks/**/*"
        - "ansible/integration-tests/**/*"
        - "ansible/requirements.yml"
        - "ansible/README.md"
        - "ansible/TESTING.md"
        # test_vendored_byte_identity.py gates ruff.toml itself (VENDORED_PATHS),
        # so an edit to that file must be able to run its own gate.
        - "ruff.toml"
        - "kubernetes/clusters/weisssrv/**/*"
        - "kubernetes/infrastructure/observability/**/*"
        - "kubernetes/infrastructure/configs/**/*"
        - "kubernetes/infrastructure/sources/**/*"
        - "kubernetes/apps/**/*"
        - "kubernetes/README.md"
        - "terraform/*/README.md"
        - "docker/*/README.md"
        - "docs/**/*"
        - "README.md"
        - "CLAUDE.md"
        - "AGENTS.md"
        - ".cursorrules"
        - ".claude/**/*"
        - "Taskfile.yml"
        - ".gitlab-ci.yml"

  # flux-lint: substitute mode (postBuild var substitution from the cluster
  # versions ConfigMap; needs a root runner for gettext-base). Version pins +
  # cluster paths are passed explicitly. extra_validation carries weisssrv's HPA/VPA invariant,
  # scrape/NetworkPolicy invariant, secret-store scoping, PVC storage class and
  # helm-values checks, which call weisssrv-local scripts (kept in scripts/),
  # running with $RENDER_ALL / $FAILED in scope. The site data those two gates
  # read lives outside them (scripts/helm-values-releases.yaml,
  # scripts/autoscaling-policy.yaml), so both paths must be passed here exactly
  # as `task flux:lint` passes them — an omitted --releases is a FileNotFoundError
  # and an omitted --policy-config silently asserts zero chart-native targets.
  - project: eric/weisssrv-lib
    ref: v0.6.0
    file: /ci/validate/flux-lint.yml
    inputs:
      substitute: true
      kubeconform_version: "0.6.7"
      kubeconform_sha256: "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73"
      kustomize_version: "5.4.3"
      kustomize_sha256: "3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7"
      helm_version: "3.18.4"
      helm_sha256: "f8180838c23d7c7d797b208861fecb591d9ce1690d8704ed1e4cb8e2add966c1"
      pyyaml_version: "6.0.2"
      cluster_dir: "kubernetes/clusters/weisssrv"
      versions_configmap: "kubernetes/infrastructure/sources/versions-configmap.yaml"
      flux_render_script: "scripts/flux-render.sh"
      skipped_script: "scripts/kubeconform-skipped.py"
      # The library default is the first two entries only. Everything after them
      # is a file this job's behaviour is DEFINED by but which lives outside
      # kubernetes/: the two site-data files the gates read (autoscaling-policy
      # decides which workloads must carry a chart-native VPA;
      # helm-values-releases decides which HelmReleases get `helm template`d),
      # the gate scripts themselves, and the two scripts passed above as
      # flux_render_script / skipped_script. Without them an MR that loosens a
      # policy file or a gate skips flux-lint entirely and merges green — the
      # externalisation that put the site data in scripts/ is exactly what moved
      # it out of the default list's reach.
      changes:
        - "kubernetes/**/*"
        - "ansible/inventories/prod/group_vars/all.yml"
        - "scripts/autoscaling-policy.yaml"
        - "scripts/helm-values-releases.yaml"
        - "scripts/check-hpa-vpa-invariant.py"
        - "scripts/check-scrape-netpol.py"
        - "scripts/check-secretstore-scope.py"
        - "scripts/check-pvc-storageclass.py"
        - "scripts/validate-helm-values.py"
        - "scripts/flux-render.sh"
        - "scripts/kubeconform-skipped.py"
      extra_validation: 'echo "=== Checking HPA/VPA invariant ==="; python3 scripts/check-hpa-vpa-invariant.py --require-chart-native-vpas --policy-config scripts/autoscaling-policy.yaml < "$RENDER_ALL" || FAILED=1; echo "=== Checking scrape/NetworkPolicy invariant ==="; python3 scripts/check-scrape-netpol.py < "$RENDER_ALL" || FAILED=1; echo "=== Checking ClusterSecretStore scoping ==="; python3 scripts/check-secretstore-scope.py < "$RENDER_ALL" || FAILED=1; echo "=== Checking PVC storageClassName ==="; python3 scripts/check-pvc-storageclass.py < "$RENDER_ALL" || FAILED=1; echo "=== Schema-validating HelmRelease values blocks (helm template) ==="; python3 scripts/validate-helm-values.py --kubeconform --releases scripts/helm-values-releases.yaml --policy-config scripts/autoscaling-policy.yaml || FAILED=1'

  # pr-agent-review (ai-review stage): advisory AI review of the MR. Both
  # credentials are masked CI variables (OPENAI__KEY, the
  # GITLAB__PERSONAL_ACCESS_TOKEN project access token weisssrv-review-bot,
  # Developer + api) — secrets_source: env deliberately keeps 1Password out of a
  # job whose CI config comes from the branch under review.
  #
  # `gate` decides whether the job is CREATED at all; an absent review on a
  # gate-less pipeline is expected, not a regression. It stays
  # $OP_SERVICE_ACCOUNT_TOKEN (the "trusted pipeline" marker this repo already
  # uses); if that variable is ever marked protected it must move to
  # $OPENAI__KEY in the same change or the reviewer disappears from MRs.
  # Model, reasoning effort and both timeouts are the library defaults.
  - project: eric/weisssrv-lib
    ref: v0.6.0
    file: /ci/review/pr-agent.yml
    inputs:
      secrets_source: "env"
      gate: "$OP_SERVICE_ACCOUNT_TOKEN"
      # Lint + secret detection only: AI review benefits from knowing the code
      # is lint-clean and secret-safe, and must not wait on the DinD suite.
      needs:
        - job: shellcheck
          optional: true
        - job: yaml-lint
          optional: true
        - job: ansible-lint
          optional: true
        - job: terraform-fmt
          optional: true
        - job: repo-sync-checks
          optional: true
        - job: flux-lint
          optional: true
        - job: secret_detection

# Additive override of the library-generated job: the checkout path its
# setup_command writes and test_vendored_byte_identity.py reads. Declared here
# rather than as an input because the template exposes no variables input.
python-tests:
  variables:
    WEISSSRV_LIB_PATH: "$CI_PROJECT_DIR/.tmp/weisssrv-lib"

# GATE STAGE - Validation gate for deploy jobs
# All deploy jobs depend on this gate (non-optional). The gate lists every
# lint/test/security job as a dependency. GitLab CI `optional: true` semantics
# (https://docs.gitlab.com/ci/yaml/#needsoptional):
#
#   - If the needed job was NOT created (rules excluded it): dependency is ignored
#   - If the needed job IS in the pipeline and SUCCEEDS: dependency satisfied
#   - If the needed job IS in the pipeline and FAILS: the dependent job is BLOCKED
#
# Jobs with `changes:` path filters use optional:true (may not exist in pipeline).
# Jobs that ALWAYS run on main pushes (no path filter) are non-optional.
#
# Net effect: all applicable checks must pass before any deploy job runs.

# Fan-in for the integration-tests matrix. `parallel: matrix` means a `needs:`
# on it expands to ONE entry PER instance, and GitLab caps a job at 50 needs;
# this thin aggregator collapses the matrix into a single dependency on
# validation-gate and keeps that headroom. Gating is unchanged — a failed
# instance leaves this job's (non-optional-by-default) dependency unmet, so this
# job is skipped and validation-gate with it, blocking every deploy job.
# optional:true keeps a path-filtered no-op pipeline green.
#
# interruptible:false (not the default true): on main, a second merge landing
# while this or validation-gate is running must not auto-cancel it, or the first
# merge's deploy jobs are orphaned with an unmet need. The matrix upstream stays
# interruptible on purpose, so this hardens the tail only — see the workflow
# block for why "serialize merges" is still an operating rule.
test-aggregate-integration:
  stage: security
  image: alpine:3.23
  interruptible: false
  needs:
    # artifacts: false — status-only fan-in (the script is a bare echo); without
    # it GitLab would download every instance's junit artifact for no reason.
    - job: integration-tests
      optional: true
      artifacts: false
  script:
    - echo "integration test matrix complete"
  # These rules MUST stay identical to validation-gate's below: it needs this
  # job non-optionally, so if this job is created for a pipeline where that gate
  # is not (or vice versa), pipeline creation fails. Same rules => co-present.
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main"'

validation-gate:
  stage: gate
  image: alpine:3.23
  # interruptible:false (not the default true): once this deploy gate is running
  # on main, a newer commit must not auto-cancel it (workflow auto_cancel is
  # on_new_commit:interruptible) — otherwise the first pipeline's not-yet-started
  # deploy jobs, which all `needs: validation-gate`, would be orphaned and never
  # deploy. Enforces the "serialize merges" discipline the deploys rely on
  # (resource_group already serializes the deploys themselves).
  interruptible: false
  needs:
    # Path-filtered jobs (may not exist in pipeline)
    - job: shellcheck
      optional: true
    - job: yaml-lint
      optional: true
    - job: ansible-lint
      optional: true
    - job: terraform-fmt
      optional: true
    - job: terraform-validate
      optional: true
    - job: terraform-plan
      optional: true
    - job: repo-sync-checks
      optional: true
    - job: flux-lint
      optional: true
    - job: prometheus-config-lint
      optional: true
    - job: repo-policy-checks
      optional: true
    - job: docs-link-check
      optional: true
    - job: python-lint
      optional: true
    # The drift plans are deliberately NOT here: they are advisory
    # (allow_failure) like pr-agent-review, so they could never block the gate.
    - job: python-tests
      optional: true
    # integration-tests is fanned in via test-aggregate-integration (see its
    # comment above) so this gate's expanded needs stay under GitLab's hard
    # 50-per-job cap. That aggregator carries the SAME rules as this gate
    # (skip-schedule-web + main-only), so the two are always created together.
    # This need is intentionally NON-optional: if that shared-rules invariant is
    # ever broken, a loud pipeline-creation failure is safer than optional's
    # silent skip, which would let deploys run with the suite un-gated.
    - job: test-aggregate-integration
    # Always-run jobs (no path filter, always present on main pushes)
    - job: secret_detection
  script:
    # Guard: every deploy-* job gates on `$CI_COMMIT_BRANCH == "main" &&
    # $OP_SERVICE_ACCOUNT_TOKEN`. If the token is unset/empty those jobs are
    # silently never created and main goes green having deployed nothing.
    # Fail loudly here (this gate always runs on main, no token guard) so a
    # missing CI/CD variable surfaces as a red pipeline instead of a no-op.
    - |
      if [ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
        echo "ERROR: OP_SERVICE_ACCOUNT_TOKEN is unset/empty on a main pipeline." >&2
        echo "       All deploy-* jobs gate on this token and would be silently skipped," >&2
        echo "       deploying nothing while the pipeline reports success." >&2
        echo "       Set the OP_SERVICE_ACCOUNT_TOKEN CI/CD variable (masked, protected)." >&2
        exit 1
      fi
    - echo "All applicable checks passed - deploy jobs may proceed"
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main"'

# DEPLOY STAGE - Auto-deploy on merge to main
#
# Each Ansible deploy job sets a per-job resource_group so GitLab serializes it
# across pipelines (two rapid pushes to main can't run the same Ansible play
# against the same hosts at once). Per-job (not one shared group) keeps
# within-pipeline parallelism: jobs targeting different hosts still run
# concurrently. (deploy-terraform relies on its HTTP state lock instead; the
# read-only deploy-verify job needs no serialization.)

# Terraform

deploy-terraform:
  extends: .terraform-http-backend
  stage: deploy
  interruptible: false
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]
  needs:
    - job: validation-gate
    - job: terraform-plan
      artifacts: true
  before_script:
    - !reference [.install-1password-alpine, before_script]
  script:
    - cd terraform/cloudflare
    # -lockfile=readonly: CI must not rewrite .terraform.lock.hcl (provider
    # hashes are committed; a CI-side change would mask supply-chain drift).
    - terraform init -lockfile=readonly
    - |
      export TF_VAR_cloudflare_api_token=$(op read "op://Homelab/Cloudflare Terraform Token/credential")
      export TF_VAR_cloudflare_account_id=$(op read "op://Homelab/Cloudflare Terraform Token/username")
      terraform apply -auto-approve -lock-timeout=120s tfplan
  environment:
    name: production/cloudflare
  rules:
    - !reference [.skip-schedule-web, rules]
    # Cloudflare-only: an unrelated terraform/tailscale change must not fire a
    # Cloudflare plan+apply (which could revert out-of-band Cloudflare drift).
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-terraform-cloudflare, changes]

# Ansible Infrastructure

deploy-ansible-base:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-base
  needs:
    - job: validation-gate
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    # LOKI_PUSH_USER/PASSWORD now come from the shared .deploy-base (alloy_host
    # needs them on any site.yml-based deploy, not just this job).
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/base.yml
    # node_exporter_host, alloy_host and encrypted_swap live in site.yml, not
    # base.yml, and run on the same host set — so this tag-scoped follow-up is
    # what actually deploys them. Every role named here must stay in the tag
    # list: a role missing from it deploys nothing while the job stays green.
    # Idempotent; the tag filter skips the rest of site.yml. encrypted_swap
    # writes crypttab/fstab and activates on the host's next reboot.
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --tags node_exporter_host,alloy_host,encrypted_swap
  environment:
    name: production/ansible-base
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        # THE COLLECTION PIN. Every role these plays run ships in
        # weisssrv.infra, so a role change reaches this repo as a version bump
        # in ansible/requirements.yml and nothing else — it is the only
        # role-side trigger any deploy job has, and every one of them watches
        # it. A bump re-runs the fleet's plays, which are idempotent.
        - ansible/requirements.yml
        - ansible/playbooks/base.yml
        # all.yml triggers deploy for alloy_host_version (host-side apt pin
        # applied by the tag-scoped site.yml follow-up above) and other
        # base-consumed pins; unrelated bumps re-run an idempotent play
        # (deploy-gitlab precedent).
        - ansible/inventories/prod/group_vars/all.yml
        - ansible/playbooks/site.yml
        - ansible/inventories/prod/group_vars/proxmox.yml
        # hosts.yml: host roster/IP/topology changes must redeploy the base play
        - ansible/inventories/prod/hosts.yml
        # Proxmox-host host_vars (e.g. per-NIC nic_tuning overrides) must
        # likewise redeploy the base play so the change actually lands — the
        # role/all.yml/proxmox.yml triggers above never see a host_vars-only
        # edit. Listed explicitly per host (not a pve-*.yml glob) so the
        # deploy-coverage gate credits each path — it ignores wildcards by design.
        - ansible/inventories/prod/host_vars/pve-opt-01.yml
        - ansible/inventories/prod/host_vars/pve-opt-02.yml
        - ansible/inventories/prod/host_vars/pve-opt-03.yml
        - ansible/inventories/prod/host_vars/pve-prec-01.yml
        - ansible/inventories/prod/host_vars/pve-nas-01.yml
        - ansible/inventories/prod/host_vars/pve-laptop-01.yml

# Proxmox host configuration (qol, postfix_null_client, tailscale)
deploy-ansible-proxmox:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-proxmox
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    TAILSCALE_AUTH_KEY: "op://Homelab/Tailscale Auth Key/credential"
  script:
    - cd ansible
    # Deploy qol, postfix_null_client, tailscale, zfs_arc_cap, vfio_passthrough,
    # nfs_tls to proxmox hosts. nfs_tls was missing from this tag list while
    # group_vars/proxmox.yml enables it fleet-wide: site.yml applies it to the
    # five non-NAS hosts (pve-nas-01 gets the server-mode setup from
    # storage.yml), and no job ran that tag, so tlshd went unmanaged on five of
    # six hosts while the path-level coverage gate stayed green off the storage
    # job. Same shape as the encrypted_swap gap noted on deploy-ansible-base.
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --limit proxmox --tags qol,postfix_null_client,tailscale,zfs_arc_cap,vfio_passthrough,nfs_tls
  environment:
    name: production/ansible-proxmox
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
    # Collection pin (see deploy-ansible-base).
        - ansible/requirements.yml
        # This job RUNS site.yml plays (--limit proxmox); a change to those
        # plays must redeploy too (idempotent, so extra triggers are safe).
        - ansible/playbooks/site.yml
        # Inventory inputs of the proxmox-host plays (NOT all.yml: its
        # tailscale/plex pins deploy via manual maintenance jobs by design).
        - ansible/inventories/prod/group_vars/proxmox.yml
        - ansible/inventories/prod/hosts.yml
        # Proxmox-host host_vars. Required because zfs_arc_cap is deployed HERE
        # and nowhere else, while per-host ARC caps live in these files — without
        # them a cap change triggers only deploy-ansible-base (which runs
        # nic_tuning, not this play) and never actually lands. The
        # deploy-coverage gate cannot catch that: it asks whether a path maps to
        # SOME job, not whether it maps to the job that applies it.
        # Listed explicitly per host, not a pve-*.yml glob, so that gate credits
        # each path — it ignores wildcards by design.
        - ansible/inventories/prod/host_vars/pve-nas-01.yml
        - ansible/inventories/prod/host_vars/pve-laptop-01.yml
        - ansible/inventories/prod/host_vars/pve-opt-01.yml
        - ansible/inventories/prod/host_vars/pve-opt-02.yml
        - ansible/inventories/prod/host_vars/pve-opt-03.yml
        - ansible/inventories/prod/host_vars/pve-prec-01.yml

deploy-ansible-firewall:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-firewall
  needs:
    - job: validation-gate
    - job: deploy-ansible-proxmox
      optional: true
  script:
    - cd ansible
    # Firewall is applied to proxmox hosts, dns, and mail via site.yml
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --tags proxmox_firewall
  environment:
    name: production/ansible-firewall
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
    # Collection pin (see deploy-ansible-base).
        - ansible/requirements.yml
        # Per-guest firewall assignments (guest_security_groups / firewall_ipsets)
        # live ONLY in hosts.yml, not the role — without this an inventory-only
        # firewall edit silently never deploys. site.yml now has a `hosts: k3s`
        # firewall play so --tags proxmox_firewall also reaches k3s guest .fw.
        # The ipset/security-group render reads the ENTIRE inventory (every
        # host's ansible_host + firewall_ipsets membership), so any inventory
        # file can change the rendered firewall — trigger on all of it.
        - ansible/inventories/prod/**/*
        # The proxmox_firewall plays (proxmox/dns/mail/services/k3s — which host
        # groups + tags they target) live in site.yml, which this job RUNS as
        # `site.yml --tags proxmox_firewall`. A change to those plays must also
        # redeploy; without this a future firewall-play edit would merge unrun.
        - ansible/playbooks/site.yml
        # Named explicitly, not just covered by the inventory glob above: the
        # coverage gate deliberately refuses to let a `**` glob confer coverage
        # on a group_vars file, so that every one names the job that rolls it
        # out. `services` is the HAOS group — Ansible never connects to it, and
        # this job is the only one that reaches it (by delegating to a Proxmox
        # host to write the guest .fw).
        - ansible/inventories/prod/group_vars/services.yml

