# GitLab CI/CD Pipeline for weisssrv Homelab Infrastructure
#
# Canonical source: https://git.ericsweiss.com/eric/weisssrv
# GitHub mirror: https://github.com/ericsweiss/weisssrv (read-only)
#
# Restart/reboot policy:
# - Service restarts: automatic (during deploys)
# - Machine reboots: manual approval required (maintenance jobs auto-reboot when triggered)
#
# Required CI/CD Variables (Settings > CI/CD > Variables):
# - OP_SERVICE_ACCOUNT_TOKEN (masked, protected) - 1Password service account
#
# Optional CI/CD Variables:
# - GH_API_TOKEN (masked) - For version checker API rate limits
#
# Pipeline triggers:
# - Merge requests: Validation only (no deploy)
# - Push to main: Validation + auto-deploy
# - Scheduled: Version checking, secret detection, and the advisory
#   tailscale-drift-plan / authentik-drift-plan (token-guarded); all other jobs
#   excluded via when: never,
#   EXCEPT a schedule with SCHEDULE_TYPE=full-test, which also runs the molecule
#   image builds + molecule/integration tests as an external-dependency canary
# - Manual (web): Lint, validate, test, security stages only (deploy/gate/maintenance excluded)

stages:
  - build
  - lint
  - validate
  - test
  - security
  - ai-review
  - gate
  - deploy
  # All maintenance jobs (6 ops, maintenance-run-all wrapper, and the
  # ad-hoc maintenance-verify cluster-health button) are in this single
  # stage. Each maintenance op embeds the verify script as its final
  # step (see scripts/post-maintenance-verify.sh) so verify always runs
  # right after the op in the same CI job — no cross-job needs/stage
  # gymnastics, and no GitLab manual-job semantic quirks to navigate.
  - maintenance

# Default settings
default:
  image: python:3.11-slim
  # All weisssrv jobs run on the privileged infrastructure runner.
  # The shared non-privileged runner (k8s-deploy) is for other GitLab projects.
  tags: [infrastructure]
  # Cancel jobs when the same branch gets a newer pipeline. Deploy/maintenance
  # jobs override this to false to ensure they always complete.
  interruptible: true

# Global variables
variables:
  # Single source for the Ansible pin used by the lint (.ansible-base) and
  # deploy (.deploy-base) pip installs. Keep in step with requirements.txt's
  # ansible pin (which the molecule-ci image builds from).
  ANSIBLE_VERSION: "11.6.0"
  # Single source for the kustomize pin used by flux-lint and deploy-verify.
  KUSTOMIZE_VERSION: "5.4.3"
  KUSTOMIZE_SHA256: "3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7"
  # Single source for the pytest/PyYAML pins pip-installed by the lint/test/
  # verify jobs. PYYAML_VERSION also matches the version-check job's pin so
  # every job parses YAML with the same library version.
  PYTEST_VERSION: "9.1.1"
  PYYAML_VERSION: "6.0.2"

# Workflow rules - when to run the pipeline
workflow:
  # Aggressively cancel superseded MR pipelines. GitLab's default auto-cancel is
  # "conservative": it stops cancelling a pipeline the moment any NON-interruptible
  # job (the molecule image builds, the deploy-* jobs) has started — so on a busy MR,
  # every push left the previous pipeline's heavy but interruptible molecule/
  # integration jobs running, piling up on the shared k3s runners and starving
  # them (the systemd-in-DinD containers then time out — the "Container is not
  # running" flakes get worse the more commits are pushed). on_new_commit:
  # interruptible cancels those interruptible jobs on the next push while leaving
  # the non-interruptible image-build/deploy jobs untouched.
  #
  # That aggression is correct for an MR ref and WRONG for main. auto_cancel is
  # evaluated per-ref, so it never touches another MR's pipeline — but on main it
  # orphaned merged work: the molecule matrices upstream of the fan-ins stay
  # interruptible on purpose, so a second merge landing during the first one's
  # matrices cancelled them, which skipped the fan-ins, which skipped
  # validation-gate, which left every deploy job of the FIRST merge unmet and
  # never run. The second pipeline computes `changes:` against its own parent, so
  # the first merge's paths are not re-covered either — the change merges and
  # silently never reaches a host. interruptible:false on the fan-ins hardened
  # the tail but could not fix that, and it is what the "never rapid-merge"
  # operating rule was working around.
  #
  # `on_new_commit: none` for main means a merged pipeline always runs to
  # completion; rapid merges then QUEUE at the deploy jobs' resource_groups
  # rather than cancelling each other. MR refs keep the aggressive setting.
  #
  # Those groups are PER TARGET, not one repo-wide group, and the resource_groups
  # API sets them oldest_first: a given target is never deployed by two pipelines
  # at once and always in merge order, so the last run per target is the newest
  # merge. What that deliberately does NOT buy is whole-pipeline atomicity — once
  # the first merge's deploy-ansible-base frees its group the second merge's can
  # start while the first's per-app deploys are still running, and base targets
  # every host, so two Ansible runs can meet on one box. A single repo-wide group
  # would close that at the cost of serialising the app-deploy fan-out within
  # every pipeline; per-target was chosen knowingly.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Templates for reuse

# Persist the pip download cache + the ansible-galaxy collections across jobs so
# the pip/galaxy installs in .ansible-base and .deploy-base stop re-fetching the
# same pinned artifacts from PyPI/galaxy on every run (network round-trips that
# add wall-clock time AND re-expose the pipeline to upstream transient failures,
# e.g. a galaxy 500/timeout). Both env vars point the tools at cached dirs under
# the build root; the cache key includes the pin files so a dependency bump
# busts it. No-op (just no cache hits) when the runner has no distributed cache
# backend — safe either way. Pulled in via `extends`.
.dep-cache:
  variables:
    PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/pip"
    ANSIBLE_COLLECTIONS_PATH: "${CI_PROJECT_DIR}/.cache/ansible-collections"
  cache:
    key:
      files:
        - requirements.txt
        - ansible/requirements.yml
    paths:
      - .cache/pip
      - .cache/ansible-collections

.ansible-base:
  extends: .dep-cache
  variables:
    # GitLab checkout is world-writable, causing Ansible to ignore ansible.cfg
    # Use absolute roles path; config is copied to a secure temp file in before_script
    ANSIBLE_ROLES_PATH: ${CI_PROJECT_DIR}/ansible/roles
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq git
    - |
      # Copy ansible.cfg to unpredictable temp path (avoids symlink attacks in /tmp)
      export ANSIBLE_CONFIG="$(mktemp /tmp/ansible-XXXXXXXXXX.cfg)"
      install -m 600 ansible/ansible.cfg "$ANSIBLE_CONFIG"
      trap "rm -f '$ANSIBLE_CONFIG'" EXIT
    # black<26.5.0: ansible-lint's jinja rule imports black, and the black 26.5.x
    # wheels ship a broken mypyc extension (ImportError: undefined symbol
    # CPyMndule_black___resources) that makes ansible-lint fail to load. Pin below
    # it (ansible-lint only needs black>=24.3.0); lift once 26.5.x is fixed.
    - pip install --quiet "ansible==${ANSIBLE_VERSION}" ansible-lint==25.12.2 'black<26.5.0'
    - ansible-galaxy collection install -r ansible/requirements.yml

.install-1password:
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl gnupg openssh-client
    - |
      # Install 1Password CLI.
      #
      # SUPPLY-CHAIN PIN: TLS alone does not prove the signing key is authentic
      # (a compromised/MITM'd endpoint could serve a substituted key that then
      # signs a malicious apt repo). So verify the downloaded key's fingerprint
      # against 1Password's published code-signing key BEFORE trusting it.
      # This RSA4096 code-signing key (created 2017-05-18, expires 2032-05-16) is
      # long-lived; the fingerprint was obtained with:
      #   curl -sSf https://downloads.1password.com/linux/keys/1password.asc \
      #     | gpg --show-keys --with-fingerprint --with-colons \
      #     | awk -F: '/^fpr:/{print $10; exit}'
      OP_APT_KEY_FPR="3FEF9748469ADBE15DA7CA80AC2D62742012EA22"
      op_key="$(mktemp)"
      curl -sSf https://downloads.1password.com/linux/keys/1password.asc -o "$op_key"
      # Collect the fingerprint of EVERY primary (pub) key in the downloaded
      # material — not only the first — and require the set to be EXACTLY the one
      # expected key. `gpg --dearmor` trusts every key in the file, so a bundle
      # that prepends the genuine 1Password key before an injected primary key
      # would otherwise pass a first-match check and still install the extra key.
      got_fprs="$(gpg --show-keys --with-fingerprint --with-colons "$op_key" \
        | awk -F: '/^pub:/ {p=1; next} /^fpr:/ && p {print $10; p=0}')"
      if [ "$got_fprs" != "$OP_APT_KEY_FPR" ]; then
        echo "ERROR: 1Password apt key material did not verify. Expected exactly:" >&2
        echo "  $OP_APT_KEY_FPR" >&2
        echo "Got:" >&2
        echo "$got_fprs" | sed 's/^/  /' >&2
        rm -f "$op_key"
        exit 1
      fi
      gpg --dearmor --output /usr/share/keyrings/1password-archive-keyring.gpg < "$op_key"
      rm -f "$op_key"
      echo "deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main" \
        > /etc/apt/sources.list.d/1password.list
      apt-get update -qq && apt-get install -y -qq 1password-cli
    - op --version

.install-1password-alpine:
  before_script:
    - apk add --no-cache curl bash gnupg jq
    - |
      # 1Password's apk repo is signed with their published RSA key; fetch the
      # public key into /etc/apk/keys under its exact filename so apk can verify
      # the index. The older `curl 1password.asc | gpg --dearmor` form broke once
      # 1Password moved to this RSA key — apk reported "UNTRUSTED signature" and
      # 1password-cli became unselectable. See 1password.dev/cli/get-started.
      #
      # SUPPLY-CHAIN PIN: TLS alone does not prove the key is authentic, so verify
      # the downloaded RSA public key's SHA-256 checksum against the known-good
      # value BEFORE adding the repo / installing. This apk key is a bare RSA
      # public key (not a GPG key), so we pin its content hash rather than a GPG
      # fingerprint; recompute with `curl -sSf <url> | sha256sum` if 1Password
      # ever rotates it.
      OP_APK_KEY_SHA256="0e88171d9f8b7630763f70cbf69f2a01b4ba8ea1d8e79487f59c162db255eb84"
      op_apk_key="/etc/apk/keys/support@1password.com-61ddfc31.rsa.pub"
      op_apk_key_tmp="$(mktemp)"
      curl -sSf https://downloads.1password.com/linux/keys/alpinelinux/support@1password.com-61ddfc31.rsa.pub \
        -o "$op_apk_key_tmp"
      # Verify BEFORE moving into /etc/apk/keys: never let unverified key material
      # sit in the trusted keys dir, and don't clobber a pre-existing valid key on
      # a mismatched re-download.
      if ! echo "${OP_APK_KEY_SHA256}  ${op_apk_key_tmp}" | sha256sum -c - ; then
        echo "ERROR: 1Password apk key checksum mismatch (expected $OP_APK_KEY_SHA256)" >&2
        rm -f "$op_apk_key_tmp"
        exit 1
      fi
      install -m 0644 "$op_apk_key_tmp" "$op_apk_key"
      rm -f "$op_apk_key_tmp"
      echo "https://downloads.1password.com/linux/alpinelinux/stable/" >> /etc/apk/repositories
      apk update
      apk add --no-cache 1password-cli
    - op --version

# Shared "never on scheduled or web pipelines" rule preamble. Deploy/
# maintenance/gate jobs start their rules with this so the policy lives in
# one place. Pull in via `- !reference [.skip-schedule-web, rules]`.
.skip-schedule-web:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never

# Shared rules for every manual maintenance-stage job: skip schedule/web
# pipelines, then a manual button on main (op-token guarded). Pull in via
# `rules: - !reference [.maintenance-manual-rules, rules]` (nested !reference
# to .skip-schedule-web is fine — see deploy-verify's rules for precedent).
.maintenance-manual-rules:
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      when: manual
      # GitLab quirk: rules-based `when: manual` defaults to
      # `allow_failure: false` (top-level `when: manual` defaults to
      # true). Without this explicit `allow_failure: true`, every main
      # pipeline would PAUSE waiting for someone to play these manual jobs
      # — blocking unrelated CI flow. Failures are still surfaced in the
      # GitLab UI when a job is actually played.
      allow_failure: true

# Shared `changes:` path lists for the lint/validate/test jobs. Each job's
# merge_request_event and main rules pull the SAME list via
# `changes: !reference [.paths-<x>, changes]`, so a path edit happens once
# instead of in two hand-synced copies (which silently drift — a job just stops
# running on one trigger). Hidden jobs (dot-prefixed) are template fragments,
# never scheduled. NOT plain YAML anchors: the pipeline stays anchor-free
# (extends/!reference only) so the planned include:-file split remains safe
# (docs/16 ARCH-4 — anchors are file-local and would break across includes).
# The two molecule CI images have DISJOINT inputs, so each build job gates on
# only its own — a requirements.txt pip bump must not rebuild molecule-test's
# ~40-package apt layer, and a molecule-test apt change must not rebuild
# molecule-ci's pip+galaxy layers.
.paths-build-molecule-test:
  changes:
    - docker/molecule-test/**/*
.paths-build-molecule-ci:
  changes:
    - docker/molecule-ci/**/*
    - requirements.txt
    - ansible/requirements.yml
.paths-build-hermes-agent:
  changes:
    # The build clones upstream at hermes_version and builds THEIR Dockerfile,
    # so the only real build inputs are the pin (all.yml) and the build notes
    # under docker/hermes-agent/. Deliberately NOT gated on .gitlab-ci.yml —
    # matching the sibling build jobs (.paths-build-molecule-{test,ci}) — so an
    # unrelated CI edit can't trigger a multi-minute DinD rebuild + re-push of
    # the :<version>/:latest tags.
    - docker/hermes-agent/**/*
    - ansible/inventories/prod/group_vars/all.yml
.paths-build-camofox-browser:
  changes:
    # Same rationale as .paths-build-hermes-agent: the build clones upstream at
    # v<hermes_camofox_version> and builds THEIR Dockerfile unmodified, so the
    # only real inputs are the pin (all.yml) and the build notes under
    # docker/camofox-browser/. Not gated on .gitlab-ci.yml.
    - docker/camofox-browser/**/*
    - ansible/inventories/prod/group_vars/all.yml
.paths-molecule-any:
  # Union of .paths-molecule + .paths-integration — the trigger set for the MR
  # targeted child pipeline (molecule-plan/molecule-trigger). The generator
  # decides WHICH scenarios run; this union only decides whether planning is
  # needed at all, so it must be a superset of both suites' trigger sets.
  changes:
    - ansible/roles/**/*
    - ansible/molecule/**/*
    - ansible/integration-tests/**/*
    - ansible/playbooks/maintenance/**/*
    - ansible/inventories/prod/group_vars/all.yml
    - docker/molecule-test/**/*
    - docker/molecule-ci/**/*
    - requirements.txt
    - ansible/requirements.yml
    - scripts/molecule-retry.sh
    - .gitlab/ci/molecule-jobs.gitlab-ci.yml
    - scripts/generate-molecule-pipeline.py
    - .gitlab-ci.yml
.paths-repo-sync:
  # Union for repo-sync-checks (generated-file freshness): each check inside
  # the job is cheap enough that firing both on either trigger set is free.
  changes:
    - ansible/inventories/prod/hosts.yml
    - scripts/hosts.env
    - scripts/generate-hosts-env.py
    - ansible/inventories/prod/group_vars/all.yml
    - kubernetes/infrastructure/sources/versions-configmap.yaml
    - scripts/generate-versions-configmap.py
.paths-repo-policy:
  # Union for repo-policy-checks (repo-invariant asserts: molecule-matrix
  # coverage, deploy coverage, kubectl/flux version pins, Taskfile smoke).
  # Superset of every constituent check's old trigger set — a check may run
  # on a path it doesn't care about (seconds of work), but can never be
  # missed on one it does.
  changes:
    - ansible/roles/**/*
    - ansible/playbooks/**/*
    - ansible/inventories/prod/**/*
    - ansible/integration-tests/**/*
    - scripts/**/*
    - .gitlab-ci.yml
    - kubernetes/infrastructure/sources/versions-configmap.yaml
    # backup-artifact-apps reads BackupArtifactStale's absent() arms from here;
    # without this path a change to the ALERT half of that invariant does not
    # trigger the check that pairs it with the collector's app list.
    - kubernetes/infrastructure/observability/kube-prometheus-stack/release.yaml
    - Taskfile.yml
.paths-ansible:
  changes:
    - ansible/**/*
# Cloudflare-only jobs (terraform-plan, deploy-terraform) gate on just the
# cloudflare module so an unrelated tailscale change can't fire a Cloudflare
# plan+apply. (terraform-fmt / terraform-validate come from the shared CI
# library and use its default terraform/**/* changes filter across all modules.)
.paths-terraform-cloudflare:
  changes:
    - terraform/cloudflare/**/*
.paths-terraform-tailscale:
  changes:
    - terraform/tailscale/**/*
.paths-terraform-authentik:
  changes:
    - terraform/authentik/**/*
.paths-b2-drift:
  changes:
    - scripts/b2-bucket-drift.py
    - scripts/test_b2_bucket_drift.py
.paths-prometheus-config:
  changes:
    - kubernetes/infrastructure/observability/kube-prometheus-stack/release.yaml
    - kubernetes/infrastructure/observability/kube-prometheus-stack/alertmanager-config.yaml
    - scripts/extract-prometheus-config.py
    - scripts/lint-prometheus-config.sh
    # promtool unit tests + vendored upstream rules run by the lint script.
    - scripts/prometheus-rule-tests/**/*
.paths-molecule:
  changes:
    - ansible/roles/**/*
    - ansible/molecule/**/*
    # The ONLY playbook any molecule scenario consumes:
    # k3s/molecule/default/verify.yml include_tasks's
    # playbooks/maintenance/_reboot-if-needed.yml. Other playbooks are
    # exercised by integration-tests + deploy jobs, never by molecule — and
    # prod group_vars/host_vars are NOT inputs either (every default scenario
    # builds its own inventory in ansible/molecule/base.yml; version pins the
    # scenarios need are duplicated into each molecule.yml or role defaults).
    # A pure version bump therefore no longer fires this 43-job matrix.
    - ansible/playbooks/maintenance/**/*
    # Test-image/dependency changes must run the suite they feed
    # (the build-molecule-test/ci jobs fire on these paths).
    - docker/molecule-test/**/*
    - docker/molecule-ci/**/*
    - requirements.txt
    - ansible/requirements.yml
    # The shared in-job retry wrapper both suites run through.
    - scripts/molecule-retry.sh
    # The shared job templates both the static matrices and the generated
    # child extend — a template edit must re-run the suites.
    - .gitlab/ci/molecule-jobs.gitlab-ci.yml
    # .gitlab-ci.yml defines the matrix + the plan/trigger wiring: a CI-only
    # change must re-run the suites (the generator also global-triggers on it)
    # rather than pass green and break the NEXT ansible MR.
    - .gitlab-ci.yml
.paths-integration:
  changes:
    - ansible/integration-tests/**/*
    - ansible/roles/**/*
    # Every integration converge include_tasks's
    # ansible/molecule/tasks/container-warmup.yml, and _shared/prepare.yml
    # re-imports ansible/molecule/prepare-common.yml — an edit there must
    # re-run this suite, not just the molecule matrix.
    - ansible/molecule/**/*
    # Integration converges vars_files prod group_vars/all.yml (unlike
    # molecule). host_vars/hosts.yml are NOT sourced — scoped to all.yml so
    # host_vars edits don't fire the 5-job suite.
    - ansible/inventories/prod/group_vars/all.yml
    - docker/molecule-test/**/*
    - docker/molecule-ci/**/*
    - requirements.txt
    - ansible/requirements.yml
    - scripts/molecule-retry.sh
    - .gitlab/ci/molecule-jobs.gitlab-ci.yml
    - .gitlab-ci.yml

# GitLab HTTP state backend (project-scoped Terraform state + lock) shared by
# terraform-plan and deploy-terraform via `extends`. Edit the path/auth once.
.terraform-http-backend:
  variables:
    TF_HTTP_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/cloudflare"
    TF_HTTP_LOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/cloudflare/lock"
    TF_HTTP_UNLOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/cloudflare/lock"
    TF_HTTP_USERNAME: "gitlab-ci-token"
    TF_HTTP_PASSWORD: "${CI_JOB_TOKEN}"
    TF_HTTP_LOCK_METHOD: "POST"
    TF_HTTP_UNLOCK_METHOD: "DELETE"
    TF_HTTP_RETRY_WAIT_MIN: "5"

.deploy-base:
  # .dep-cache: reuse pip wheels + galaxy collections across deploy jobs (the
  # 12 jobs extending this each pip-install ansible + galaxy-install collections).
  extends: [.install-1password, .dep-cache]
  # Deploys touch shared infrastructure; never cancel a running deploy when a new
  # pipeline starts — wait for it to complete instead.
  interruptible: false
  # Runner-pod casualties (scheduling timeout, NoExecute taint eviction
  # when a node degrades mid-job — pipeline 355 lost deploy-ansible-base
  # to DeletionByTaintManager) are environmental, and the playbooks are
  # idempotent: retry instead of failing the whole needs chain.
  retry:
    max: 2
    when:
      - runner_system_failure
  variables:
    ANSIBLE_ROLES_PATH: ${CI_PROJECT_DIR}/ansible/roles
    # alloy_host renders loki.write basic_auth from these and asserts they are
    # non-empty (pipeline 355 silently clobbered the fleet's alloy configs when
    # they were missing). Defined on the shared base so EVERY deploy job that
    # may run alloy_host (e.g. deploy-ansible-mail via site.yml --limit) has
    # them, not just deploy-ansible-base.
    LOKI_PUSH_USER: "op://Homelab/Loki Push Auth/username"
    LOKI_PUSH_PASSWORD: "op://Homelab/Loki Push Auth/password"
  before_script:
    - !reference [.install-1password, before_script]
    - pip install --quiet "ansible==${ANSIBLE_VERSION}"
    - |
      # Copy ansible.cfg to secure temp path (world-writable checkout causes Ansible to ignore it)
      export ANSIBLE_CONFIG="$(mktemp /tmp/ansible-XXXXXXXXXX.cfg)"
      install -m 600 ansible/ansible.cfg "$ANSIBLE_CONFIG"
      trap "rm -f '$ANSIBLE_CONFIG'" EXIT
    - |
      # Setup SSH from 1Password. umask 077 in a subshell so the key file is
      # never created with the default 0644 mode (no chmod race window).
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      (umask 077; op read "op://Homelab/SSH Key/private key" > ~/.ssh/id_ed25519)
      # TOFU keyscan: ephemeral runners have no known_hosts to inherit, so we
      # fetch fresh per job rather than bake host keys into the image. Accepted
      # on a single-LAN homelab (MITM would need both network paths in the job
      # window). Strict pinning lives on the operator path: ansible.cfg
      # (StrictHostKeyChecking=accept-new) + host_vars/dns-01.yml host_key for
      # acme_certs cert distribution.
      # Add known hosts for all infrastructure (Proxmox hosts, services, k3s
      # VMs). ALL_SSH_IPS is generated from ansible/inventories/prod/hosts.yml
      # (scripts/hosts.env; the hosts-env-sync job guards it against drift), so
      # a new node is keyscanned automatically without editing this list.
      . scripts/hosts.env
      # shellcheck disable=SC2086  # word-split ALL_SSH_IPS into one keyscan
      ssh-keyscan -H $ALL_SSH_IPS >> ~/.ssh/known_hosts 2>/dev/null || true
    - ansible-galaxy collection install -r ansible/requirements.yml

# Shared kubectl install (pinned checksum) + kubeconfig fetch from 1Password.
# Pulled into .maintenance-base and .k3s-deploy-base via
# `- !reference [.kubectl-setup, before_script]` so the version, checksum, and
# kubeconfig logic live in one place.
.kubectl-setup:
  before_script:
    - |
      # Install kubectl (pinned checksum for supply-chain integrity).
      curl -fsSL "https://dl.k8s.io/release/v1.35.2/bin/linux/amd64/kubectl" -o /tmp/kubectl
      echo "924eb50779153f20cb668117d141440b95df2f325a64452d78dff9469145e277  /tmp/kubectl" | sha256sum -c -
      install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
    - |
      # Kubeconfig from 1Password (base64-encoded to preserve YAML formatting).
      set -eo pipefail
      mkdir -p ~/.kube
      KUBECONFIG_B64=$(op read "op://Homelab/K3s Kubeconfig/kubeconfig")
      if [ -z "$KUBECONFIG_B64" ]; then
        echo "ERROR: op read returned empty kubeconfig. Is OP_SERVICE_ACCOUNT_TOKEN set?"
        exit 1
      fi
      # umask 077 subshell: never create the kubeconfig world-readable.
      (umask 077; echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config)
      export KUBECONFIG="$HOME/.kube/config"
      echo "Kubeconfig written ($(wc -c < ~/.kube/config) bytes), KUBECONFIG=$KUBECONFIG"

# Maintenance jobs need both ansible (from .deploy-base) and kubectl
# (so each job can call scripts/post-maintenance-verify.sh after its
# playbook). Extends .deploy-base, then layers in the kubectl install
# + kubeconfig setup that .k3s-deploy-base does.
.maintenance-base:
  extends: .deploy-base
  # Maintenance ops are manual, ad-hoc buttons in the last (maintenance) stage.
  # They consume NO artifacts from earlier jobs (all inputs come from 1Password
  # at runtime), so an empty needs lets an operator play them immediately
  # without waiting on the entire build/test/deploy graph to complete first.
  needs: []
  # Cap below the detached self-host reboot's 5400s (90m) fallback timer: GitLab
  # must cancel a runaway job (-> the after_script re-arm fires) BEFORE that timer
  # could go off mid-run and reboot the executor's own host. The longest job
  # (maintenance-run-all) is ~30-45m, so 70m is comfortable headroom.
  timeout: 70m
  before_script:
    - !reference [.deploy-base, before_script]
    - apt-get install -y -qq jq
    - !reference [.kubectl-setup, before_script]
  after_script:
    # If the run armed a DETACHED self-host reboot (the executor's own Proxmox
    # host needed a reboot), re-arm it to fire promptly (+60s) now that the job is
    # ending and disarm the long fallback timer. Runs on success, failure, AND
    # cancel (so a cancelled run can't leave a 90-min timer ticking), and anchors
    # the reboot to the real job-end instead of a fixed-delay guess. No-op if the
    # run armed nothing (marker absent). Best-effort: the long fallback timer
    # armed during the run still covers the reboot if this step fails.
    - bash scripts/maintenance-rearm-self-reboot.sh || true

.k3s-deploy-base:
  extends: .install-1password
  # Use Debian-based image (Alpine musl resolver has issues with k8s ndots:5)
  image: python:3.11-slim
  # k3s deploys/verifies touch the cluster; never interrupt mid-run.
  interruptible: false
  before_script:
    - !reference [.install-1password, before_script]
    # jq is used by deploy-verify to parse kubectl JSON output (Flux CR
    # readiness checks). helm and yq are not installed — Flux manages chart
    # deployments, so no CI job needs them.
    - apt-get install -y -qq jq
    - !reference [.kubectl-setup, before_script]
    # Skipping `kubectl cluster-info` — requires list perms on kube-system
    # services, which the runner ServiceAccount lacks. Per-job kubectl calls
    # target narrower scopes and use the K3s Kubeconfig credentials.
    - kubectl version --output=yaml --request-timeout=5s

# BUILD STAGE - Container images

# The two CI images are built by separate jobs (build-molecule-test,
# build-molecule-ci) so each rebuilds only when ITS OWN inputs change — a
# requirements.txt pip bump no longer rebuilds molecule-test's ~40-package apt
# layer, and vice-versa. Both share this base: the pinned static docker CLI
# install, the dind-ready wait, registry login, and a build_and_push helper with
# registry-backed BuildKit layer caching + a bounded in-script build retry.
.build-molecule-base:
  # Pushes images consumed by later jobs in this pipeline; do not interrupt.
  interruptible: false
  # Infra-class retries only. NOT script_failure: a genuinely broken Dockerfile
  # must fail fast, not burn three full image builds — transient external-dep
  # pulls (base image, apt, pip, galaxy) are handled cheaply by the in-script
  # build_and_push retry below, which reuses cached layers on a re-attempt.
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  stage: build
  image: python:3.11
  services:
    - docker:24.0-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # Daemon-embedded BuildKit (dind 24.0) — no buildx CLI plugin needed (the
    # static docker binary lacks it). Enables --cache-from + inline cache.
    DOCKER_BUILDKIT: "1"
  before_script:
    # Install the static docker CLI (NOT docker.io: the Trixie docker.io package
    # ships only the daemon, no CLI — see docker/molecule-ci/Dockerfile). Pinned
    # version + sha256 to match the checksum discipline used for every other
    # downloaded binary in this pipeline.
    - |
      ARCH=$(dpkg --print-architecture)
      case "$ARCH" in
        amd64) DOCKER_ARCH=x86_64; DOCKER_SHA256=4f798b3ee1e0140eab5bf30b0edc4e84f4cdb53255a429dc3bbae9524845d640 ;;
        arm64) DOCKER_ARCH=aarch64; DOCKER_SHA256=e6b53725a73763ab3f988c73f8772eaed429754c1a579db5ff11f21990fd1817 ;;
        *) echo "unsupported arch: $ARCH"; exit 1 ;;
      esac
      curl -fsSL "https://download.docker.com/linux/static/stable/${DOCKER_ARCH}/docker-27.5.1.tgz" -o /tmp/docker.tgz
      echo "${DOCKER_SHA256}  /tmp/docker.tgz" | sha256sum -c -
      tar xz --strip-components=1 -C /usr/local/bin -f /tmp/docker.tgz docker/docker
      rm /tmp/docker.tgz
      docker --version
      # Wait for the dind service daemon to accept connections before building;
      # it can lag the job start, otherwise `docker build` fails with
      # "Cannot connect to the Docker daemon at tcp://docker:2375".
      for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; echo "waiting for docker daemon ($i/30)..."; sleep 2; done
      docker info >/dev/null 2>&1 || { echo "docker daemon did not become ready"; exit 1; }
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      # build_and_push <image-short-name> <docker-build-args...>
      # Builds ${CI_REGISTRY_IMAGE}/<image>:<sha>, pushing it (and :latest on
      # main). Seeds a registry layer cache from the previous :latest and embeds
      # inline cache metadata for the next run — EXCEPT on the full-test schedule
      # canary, which must rebuild from scratch to exercise fresh external deps.
      # The build+push is wrapped in a bounded retry so a transient dep pull /
      # registry blip re-attempts (cheap: cached layers) while a real build error
      # still fails after the attempts (job-level retry omits script_failure).
      build_and_push() {
        img="$1"; shift
        ref="${CI_REGISTRY_IMAGE}/${img}"
        cache_args=""
        if [ "$CI_PIPELINE_SOURCE" != "schedule" ]; then
          cache_args="--cache-from ${ref}:latest --build-arg BUILDKIT_INLINE_CACHE=1"
        fi
        attempt=1; max=3
        # shellcheck disable=SC2086  # word-split cache_args + trailing build args
        until docker build $cache_args -t "${ref}:${CI_COMMIT_SHORT_SHA}" "$@" \
              && docker push "${ref}:${CI_COMMIT_SHORT_SHA}"; do
          attempt=$((attempt+1))
          if [ "$attempt" -gt "$max" ]; then
            echo "docker build/push of ${img} failed after ${max} attempts"; return 1
          fi
          echo "build/push ${img} attempt $((attempt-1)) failed; retrying (${attempt}/${max})..."
          sleep $(( (RANDOM % 20) + 10 ))
        done
        # :latest only on main — MR pipelines use SHA tags so they never
        # overwrite :latest with unmerged branch images. The SHA tag (and, for
        # molecule-ci, its digest dotenv) is the load-bearing reference; :latest
        # is the fallback for pipelines where the build didn't run.
        if [ "$CI_COMMIT_BRANCH" = "main" ]; then
          docker tag "${ref}:${CI_COMMIT_SHORT_SHA}" "${ref}:latest"
          docker push "${ref}:latest"
        fi
      }

# molecule-test: the container molecule spins up (has all role apt deps). apt-
# only build; rebuilt only when docker/molecule-test/** changes.
build-molecule-test:
  extends: .build-molecule-base
  script:
    - build_and_push molecule-test docker/molecule-test/
  rules:
    # full-test schedule canary: rebuild from scratch so build-time external deps
    # (apt) are exercised. Must precede the schedule when:never (first-match).
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "full-test"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-build-molecule-test, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-build-molecule-test, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# molecule-ci: the GitLab CI runner image (docker-cli + pip deps + collections).
# Rebuilt only when docker/molecule-ci/**, requirements.txt, or
# ansible/requirements.yml change. Emits the MOLECULE_CI_IMAGE digest dotenv.
build-molecule-ci:
  extends: .build-molecule-base
  script:
    - build_and_push molecule-ci -f docker/molecule-ci/Dockerfile .
    # Capture the immutable digest of the CI runner image and emit it as a
    # dotenv var. The .molecule-base `image:` reference consumes MOLECULE_CI_IMAGE
    # so a same-pipeline rebuild can't be raced by anyone retagging :latest
    # mid-flight. The molecule-TEST image needs no digest dotenv: the molecule
    # jobs pull it by its immutable `:${CI_COMMIT_SHORT_SHA}` tag (see
    # .molecule-base before_script), which already pins the test target per
    # pipeline.
    - MOLECULE_CI_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${CI_REGISTRY_IMAGE}/molecule-ci:${CI_COMMIT_SHORT_SHA}")
    - echo "MOLECULE_CI_IMAGE=${MOLECULE_CI_DIGEST}" > molecule-images.env
    - cat molecule-images.env
  artifacts:
    reports:
      dotenv: molecule-images.env
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "full-test"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-build-molecule-ci, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-build-molecule-ci, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# build-hermes-agent: NousResearch Hermes Agent publishes no container image, so
# we build our own into the GitLab registry. The job clones the upstream repo at
# the pinned tag (hermes_version in all.yml) and builds THEIR self-contained
# Dockerfile (baking the commit SHA via HERMES_GIT_SHA) to a local intermediate
# tag, then layers a thin wrapper (docker/hermes-agent/Dockerfile.codex) that
# bakes in the pinned OpenAI Codex CLI (hermes_codex_version) — Hermes' LLM engine
# is the Codex app-server runtime, so the `codex` CLI must be on PATH. The wrapper
# is the FINAL image, tagged ${CI_REGISTRY_IMAGE}/hermes-agent:<hermes_version>;
# the in-cluster Deployment pulls that tag via the internal registry host. The
# two-stage build runs on every pipeline (proving it builds); nothing is pushed
# on an MR — the :<hermes_version>, :latest, and :<commit-sha> tags are all
# pushed only on main so an unmerged branch can't repoint a running deployment.
build-hermes-agent:
  extends: .build-molecule-base
  variables:
    HERMES_UPSTREAM_REPO: "https://github.com/NousResearch/hermes-agent.git"
    # The image build EXECUTES the CLIs it installs (`codex --version` /
    # `claude --version` verification steps), and the Claude CLI's native
    # binary SIGILLs on the legacy OptiPlex Core 2 Quads ("Illegal
    # instruction", pipeline 854) — pin the build to modern-CPU nodes, same
    # invariant as secret_detection's gitleaks pin above.
    KUBERNETES_NODE_SELECTOR_CPU: "esweiss.com/cpu=modern"
  script:
    - |
      # Install the Docker buildx CLI plugin (pinned + sha256, matching the
      # checksum discipline used for the static docker CLI in .build-molecule-base).
      # The static docker binary ships no buildx plugin, and upstream Hermes's
      # Dockerfile uses BuildKit-only features (COPY --link / --chmod), so the
      # classic builder cannot build it and DOCKER_BUILDKIT=1 `docker build`
      # fails with "buildx component is missing". Installing the plugin lets
      # `docker build` route through the daemon's embedded BuildKit (dind 24.0).
      BUILDX_ARCH=$(dpkg --print-architecture)
      BUILDX_VERSION=v0.35.0
      case "$BUILDX_ARCH" in
        amd64) BUILDX_SHA256=d41ece72044243b4f58b343441ae37446d9c29a7d6b5e11c61847bbcf8f7dfda ;;
        arm64) BUILDX_SHA256=c4248d6cbc4a619a7e0b4609c11e509ad4ac0b475e1c64817c0ac20c5d90c766 ;;
        *) echo "unsupported arch: $BUILDX_ARCH"; exit 1 ;;
      esac
      curl -fsSL "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-${BUILDX_ARCH}" -o /tmp/docker-buildx
      echo "${BUILDX_SHA256}  /tmp/docker-buildx" | sha256sum -c -
      mkdir -p "$HOME/.docker/cli-plugins"
      install -m 0755 /tmp/docker-buildx "$HOME/.docker/cli-plugins/docker-buildx"
      rm /tmp/docker-buildx
      docker buildx version
    - |
      # Read the pinned tag from all.yml (same single-source pattern the other
      # version-gated jobs use). No YAML lib in this image — grep the scalar.
      HERMES_VERSION=$(grep -E '^hermes_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_VERSION" ]; then echo "could not read hermes_version from all.yml"; exit 1; fi
      # Codex + Claude Code CLI versions baked into the image by the wrapper
      # (see below).
      # Published tag (<version>-rN): the local patch revision — see all.yml.
      HERMES_IMAGE_VERSION=$(grep -E '^hermes_image_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_image_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_IMAGE_VERSION" ]; then echo "could not read hermes_image_version from all.yml"; exit 1; fi
      case "$HERMES_IMAGE_VERSION" in
        "${HERMES_VERSION}-r"*) ;;
        *) echo "hermes_image_version ($HERMES_IMAGE_VERSION) must be ${HERMES_VERSION}-r<N> — bump them in lockstep"; exit 1 ;;
      esac
      HERMES_CODEX_VERSION=$(grep -E '^hermes_codex_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_codex_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_CODEX_VERSION" ]; then echo "could not read hermes_codex_version from all.yml"; exit 1; fi
      HERMES_CLAUDE_VERSION=$(grep -E '^hermes_claude_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_claude_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_CLAUDE_VERSION" ]; then echo "could not read hermes_claude_version from all.yml"; exit 1; fi
      # 1Password CLI (op) version — baked in for Hermes' 1Password skill.
      HERMES_OP_VERSION=$(grep -E '^hermes_op_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_op_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_OP_VERSION" ]; then echo "could not read hermes_op_version from all.yml"; exit 1; fi
      echo "Building Hermes Agent ${HERMES_VERSION} (Codex CLI ${HERMES_CODEX_VERSION}, Claude Code CLI ${HERMES_CLAUDE_VERSION}, 1Password CLI ${HERMES_OP_VERSION})"
      ref="${CI_REGISTRY_IMAGE}/hermes-agent"
      rm -rf /tmp/hermes-src
      git clone --depth 1 --branch "$HERMES_VERSION" "$HERMES_UPSTREAM_REPO" /tmp/hermes-src
      HERMES_SHA=$(git -C /tmp/hermes-src rev-parse HEAD)
      # Verify the tag resolves to the immutable commit pinned alongside it in
      # all.yml. A tag is mutable upstream; without this check a moved or
      # compromised tag would let CI build+publish attacker-controlled steps into
      # an image Flux deploys. Bump hermes_git_sha whenever hermes_version changes.
      HERMES_EXPECTED_SHA=$(grep -E '^hermes_git_sha:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_git_sha:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$HERMES_EXPECTED_SHA" ]; then echo "hermes_git_sha not pinned in all.yml — refusing to build"; exit 1; fi
      if [ "$HERMES_SHA" != "$HERMES_EXPECTED_SHA" ]; then
        echo "SECURITY: tag ${HERMES_VERSION} resolved to ${HERMES_SHA}, but all.yml pins ${HERMES_EXPECTED_SHA}."
        echo "The upstream tag may have moved. Refusing to build. Re-verify upstream and update hermes_git_sha."
        exit 1
      fi
      echo "Upstream ${HERMES_VERSION} -> ${HERMES_SHA} (matches pinned hermes_git_sha)"
      # Local patches (docker/hermes-agent/patches/*.patch), applied to the
      # SHA-verified tree before the build. Reviewed in THIS repo, so the
      # supply-chain property holds: pinned upstream + explicit local diffs.
      # git apply fails loudly if a patch has drifted — a hermes version bump
      # must re-verify every patch (or drop ones that were upstreamed).
      for p in docker/hermes-agent/patches/*.patch; do
        [ -e "$p" ] || continue
        echo "Applying local patch: $p"
        git -C /tmp/hermes-src apply -p1 --verbose "$CI_PROJECT_DIR/$p"
      done
      cache_args=""
      if [ "$CI_PIPELINE_SOURCE" != "schedule" ]; then
        cache_args="--cache-from ${ref}:latest --build-arg BUILDKIT_INLINE_CACHE=1"
      fi
      # Two-stage build, both on every pipeline (proves the image builds);
      # publish ONLY on main. Stage 1 builds upstream's self-contained Dockerfile
      # to a local intermediate tag. Stage 2 layers our thin CLI wrapper
      # (docker/hermes-agent/Dockerfile.codex — `npm i -g` of the pinned Codex +
      # Claude Code CLIs) on top as the FINAL image, carrying the load-bearing
      # :<version>/:<sha> tags the cluster pulls. Node 22 + npm are already in
      # the base, so the wrapper only adds the pinned CLIs. A single retry loop
      # covers both builds (either can hit a transient registry/npm hiccup). MR
      # pipelines are build-only, so an MR can never publish a registry image.
      upstream_ref="${ref}:upstream-${CI_COMMIT_SHORT_SHA}"
      attempt=1; max=3
      # shellcheck disable=SC2086  # intentional word-split of cache_args
      until docker build $cache_args \
              --build-arg HERMES_GIT_SHA="$HERMES_SHA" \
              -t "$upstream_ref" \
              /tmp/hermes-src \
            && docker build \
              --build-arg HERMES_IMAGE="$upstream_ref" \
              --build-arg HERMES_CODEX_VERSION="$HERMES_CODEX_VERSION" \
              --build-arg HERMES_CLAUDE_VERSION="$HERMES_CLAUDE_VERSION" \
              --build-arg HERMES_OP_VERSION="$HERMES_OP_VERSION" \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              -t "${ref}:${HERMES_VERSION}" \
              -t "${ref}:${HERMES_IMAGE_VERSION}" \
              -t "${ref}:${CI_COMMIT_SHORT_SHA}" \
              -f docker/hermes-agent/Dockerfile.codex \
              docker/hermes-agent; do
        attempt=$((attempt+1))
        if [ "$attempt" -gt "$max" ]; then echo "hermes build failed after ${max} attempts"; exit 1; fi
        echo "build attempt $((attempt-1)) failed; retrying (${attempt}/${max})..."
        sleep $(( (RANDOM % 20) + 10 ))
      done
      # The load-bearing tags (:<version> that the cluster pulls, :<sha> for
      # traceability, and :latest for the layer cache) are pushed only on main.
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker push "${ref}:${CI_COMMIT_SHORT_SHA}"
        docker push "${ref}:${HERMES_VERSION}"
        # The tag the cluster actually pulls (<version>-rN local patch
        # revision) — without this push the deployment's tag never exists and
        # hermes ImagePullBackOffs (observed on the v2026.7.20-r1 rollout,
        # unblocked live by a server-side crane retag of :<sha>). The build
        # already -t's this tag; the explicit re-tag is belt-and-braces against
        # the build's tag list drifting.
        docker tag "${ref}:${CI_COMMIT_SHORT_SHA}" "${ref}:${HERMES_IMAGE_VERSION}"
        docker push "${ref}:${HERMES_IMAGE_VERSION}"
        docker tag "${ref}:${CI_COMMIT_SHORT_SHA}" "${ref}:latest"
        docker push "${ref}:latest"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-build-hermes-agent, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-build-hermes-agent, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# build-camofox-browser: jo-inc/camofox-browser (the anti-detection browser
# server behind Hermes' camofox tool — the third container of the hermes pod)
# publishes no container image, so we build our own into the GitLab registry.
# Same supply-chain shape as build-hermes-agent: clone upstream at the pinned
# tag (v<hermes_camofox_version> in all.yml), verify the tag resolves to the
# pinned immutable commit (hermes_camofox_git_sha), then build THEIR Dockerfile
# unmodified — no wrapper layer (the image is complete as shipped: Camoufox
# binary + yt-dlp + plugins are baked at build time). Unlike hermes-agent's
# Dockerfile, camofox's uses no BuildKit-only syntax, so the base's builder
# path suffices and no buildx CLI plugin install is needed (same as the
# molecule image builds). Build on every pipeline (proves it builds); the
# load-bearing :<version>/:latest tags push only on main so an unmerged branch
# can't repoint a running deployment.
build-camofox-browser:
  extends: .build-molecule-base
  variables:
    CAMOFOX_UPSTREAM_REPO: "https://github.com/jo-inc/camofox-browser.git"
  script:
    - |
      # Install the Docker buildx CLI plugin (pinned + sha256). The base
      # template exports DOCKER_BUILDKIT=1 globally, so EVERY `docker build`
      # here requires the buildx component even for a Dockerfile with no
      # BuildKit-only syntax — same reason build-hermes-agent installs it
      # (learned the hard way: 3x "buildx component is missing" retries).
      BUILDX_ARCH=$(dpkg --print-architecture)
      BUILDX_VERSION=v0.35.0
      case "$BUILDX_ARCH" in
        amd64) BUILDX_SHA256=d41ece72044243b4f58b343441ae37446d9c29a7d6b5e11c61847bbcf8f7dfda ;;
        arm64) BUILDX_SHA256=c4248d6cbc4a619a7e0b4609c11e509ad4ac0b475e1c64817c0ac20c5d90c766 ;;
        *) echo "unsupported arch: $BUILDX_ARCH"; exit 1 ;;
      esac
      curl -fsSL "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-${BUILDX_ARCH}" -o /tmp/docker-buildx
      echo "${BUILDX_SHA256}  /tmp/docker-buildx" | sha256sum -c -
      mkdir -p "$HOME/.docker/cli-plugins"
      install -m 0755 /tmp/docker-buildx "$HOME/.docker/cli-plugins/docker-buildx"
      rm /tmp/docker-buildx
      docker buildx version
    - |
      # Read the pins from all.yml (same single-source pattern as
      # build-hermes-agent; no YAML lib in this image — grep the scalars).
      CAMOFOX_VERSION=$(grep -E '^hermes_camofox_version:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_camofox_version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$CAMOFOX_VERSION" ]; then echo "could not read hermes_camofox_version from all.yml"; exit 1; fi
      echo "Building camofox-browser ${CAMOFOX_VERSION}"
      ref="${CI_REGISTRY_IMAGE}/camofox-browser"
      rm -rf /tmp/camofox-src
      # The pin is the bare semver (the image tag); the upstream git tag
      # carries the leading "v".
      git clone --depth 1 --branch "v${CAMOFOX_VERSION}" "$CAMOFOX_UPSTREAM_REPO" /tmp/camofox-src
      CAMOFOX_SHA=$(git -C /tmp/camofox-src rev-parse HEAD)
      # Verify the tag resolves to the immutable commit pinned alongside it in
      # all.yml — a moved or compromised upstream tag must not let CI publish
      # attacker-controlled steps into an image Flux deploys (this container
      # browses the web with persistent cookies). Bump hermes_camofox_git_sha
      # whenever hermes_camofox_version changes.
      CAMOFOX_EXPECTED_SHA=$(grep -E '^hermes_camofox_git_sha:' ansible/inventories/prod/group_vars/all.yml | head -1 | sed -E 's/^hermes_camofox_git_sha:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
      if [ -z "$CAMOFOX_EXPECTED_SHA" ]; then echo "hermes_camofox_git_sha not pinned in all.yml — refusing to build"; exit 1; fi
      if [ "$CAMOFOX_SHA" != "$CAMOFOX_EXPECTED_SHA" ]; then
        echo "SECURITY: tag v${CAMOFOX_VERSION} resolved to ${CAMOFOX_SHA}, but all.yml pins ${CAMOFOX_EXPECTED_SHA}."
        echo "The upstream tag may have moved. Refusing to build. Re-verify upstream and update hermes_camofox_git_sha."
        exit 1
      fi
      echo "Upstream v${CAMOFOX_VERSION} -> ${CAMOFOX_SHA} (matches pinned hermes_camofox_git_sha)"
      cache_args=""
      if [ "$CI_PIPELINE_SOURCE" != "schedule" ]; then
        cache_args="--cache-from ${ref}:latest --build-arg BUILDKIT_INLINE_CACHE=1"
      fi
      # Bounded retry: the build pulls the Camoufox release zip + yt-dlp at
      # image-build time, so a transient GitHub/registry blip re-attempts
      # cheaply on cached layers while a real Dockerfile error still fails.
      attempt=1; max=3
      # shellcheck disable=SC2086  # intentional word-split of cache_args
      until docker build $cache_args \
              -t "${ref}:${CAMOFOX_VERSION}" \
              -t "${ref}:${CI_COMMIT_SHORT_SHA}" \
              /tmp/camofox-src; do
        attempt=$((attempt+1))
        if [ "$attempt" -gt "$max" ]; then echo "camofox build failed after ${max} attempts"; exit 1; fi
        echo "build attempt $((attempt-1)) failed; retrying (${attempt}/${max})..."
        sleep $(( (RANDOM % 20) + 10 ))
      done
      # The load-bearing tags (:<version> that the cluster pulls, :<sha> for
      # traceability, and :latest for the layer cache) are pushed only on main.
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker push "${ref}:${CI_COMMIT_SHORT_SHA}"
        docker push "${ref}:${CAMOFOX_VERSION}"
        docker tag "${ref}:${CI_COMMIT_SHORT_SHA}" "${ref}:latest"
        docker push "${ref}:latest"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-build-camofox-browser, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-build-camofox-browser, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# LINT STAGE - Code quality checks

# Two consolidated micro-check jobs — generated-file freshness and repo-policy
# invariants. Each job's paths anchor is the UNION of its constituent checks'
# inputs, and the driver runs EVERY check before failing, so one push surfaces
# every violation. The per-check scripts also run individually in `task lint`.
# The heavyweight linters (ansible-lint/yaml-lint/shellcheck/flux-lint/
# prometheus-config-lint) stay separate — at >=1 min each, parallelism beats
# pod overhead.
repo-sync-checks:
  needs: []
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install --quiet "pyyaml==${PYYAML_VERSION}"
  script:
    - |
      set -uo pipefail
      overall=0; failed=""

      run_check() {
        name="$1"; shift
        printf 'section_start:%s:%s[collapsed=true]\r\033[0K== %s\n' "$(date +%s)" "$name" "$name"
        rc=0; "$@" || rc=$?
        printf 'section_end:%s:%s\r\033[0K\n' "$(date +%s)" "$name"
        if [ "$rc" -ne 0 ]; then overall=1; failed="$failed $name"; echo "FAILED: $name (rc=$rc)"; fi
      }

      # hosts.env freshness: compare the committed file against a freshly
      # generated one. The generator writes in place, so save + restore to
      # keep the workspace clean for other checks/jobs.
      check_hosts_env() {
        set -eo pipefail
        TARGET=scripts/hosts.env
        cp "$TARGET" /tmp/committed.env
        python3 scripts/generate-hosts-env.py
        cp "$TARGET" /tmp/generated.env
        cp /tmp/committed.env "$TARGET"   # restore workspace
        if ! diff -q /tmp/committed.env /tmp/generated.env >/dev/null 2>&1; then
          echo "ERROR: scripts/hosts.env is out of sync with hosts.yml"
          echo "Run: task hosts:sync and commit the result."
          diff -u /tmp/committed.env /tmp/generated.env || true
          return 1
        fi
        echo "scripts/hosts.env is in sync with hosts.yml"
      }

      # versions-configmap freshness: same save/generate/diff/restore pattern.
      check_versions_configmap() {
        set -eo pipefail
        TARGET=kubernetes/infrastructure/sources/versions-configmap.yaml
        cp "$TARGET" /tmp/committed.yaml
        python3 scripts/generate-versions-configmap.py
        cp "$TARGET" /tmp/generated.yaml
        cp /tmp/committed.yaml "$TARGET"   # restore workspace
        if ! diff -q /tmp/committed.yaml /tmp/generated.yaml >/dev/null 2>&1; then
          echo "ERROR: versions-configmap.yaml is out of sync with all.yml"
          echo "Run: task flux:sync-versions and commit the result."
          diff -u /tmp/committed.yaml /tmp/generated.yaml || true
          return 1
        fi
        echo "versions-configmap.yaml is in sync with all.yml"
      }

      run_check hosts-env-sync check_hosts_env
      run_check flux-versions-sync check_versions_configmap
      [ "$overall" -eq 0 ] || echo "Failed sync checks:$failed"
      exit "$overall"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-repo-sync, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-repo-sync, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'

repo-policy-checks:
  needs: []
  stage: lint
  # python:3.11-slim (not alpine): apk installs from dl-cdn.alpinelinux.org
  # returned DNS lookup errors mid-pipeline; the Debian image ships bash +
  # coreutils + python3.
  image: python:3.11-slim
  variables:
    # check-deploy-coverage.sh's `git merge-base --is-ancestor` guard rejects
    # unrelated histories — which a default depth-20 clone surfaces as a false
    # positive whenever the MR base is >20 commits behind HEAD. GIT_DEPTH: 0
    # forces a full clone so the merge-base is always reachable.
    GIT_DEPTH: 0
  before_script:
    # git for check-deploy-coverage.sh; curl/ca-certificates for the go-task
    # download; PyYAML for the coverage scripts' YAML parsing.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates
    - pip install --no-cache-dir --quiet "PyYAML==${PYYAML_VERSION}"
    - |
      # go-task, pinned + sha256 like every other downloaded binary in this pipeline.
      TASK_VERSION="v3.52.0"
      TASK_SHA256="02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd"
      curl -fsSL "https://github.com/go-task/task/releases/download/${TASK_VERSION}/task_linux_amd64.tar.gz" -o /tmp/task.tar.gz
      echo "${TASK_SHA256}  /tmp/task.tar.gz" | sha256sum -c -
      tar xzf /tmp/task.tar.gz -C /usr/local/bin task
      task --version
  script:
    - |
      set -uo pipefail
      overall=0; failed=""

      run_check() {
        name="$1"; shift
        printf 'section_start:%s:%s[collapsed=true]\r\033[0K== %s\n' "$(date +%s)" "$name" "$name"
        rc=0; "$@" || rc=$?
        printf 'section_end:%s:%s\r\033[0K\n' "$(date +%s)" "$name"
        if [ "$rc" -ne 0 ]; then overall=1; failed="$failed $name"; echo "FAILED: $name (rc=$rc)"; fi
      }

      # deploy-verify FLUX_VERSION pin must match the versions-configmap.
      check_flux_version_pin() {
        set -eu
        PIN=$(sed -n 's/^ *FLUX_VERSION="\([0-9.]*\)"$/\1/p' .gitlab-ci.yml | head -1)
        CM=$(sed -n 's/^ *flux_version: *//p' kubernetes/infrastructure/sources/versions-configmap.yaml | head -1)
        echo "deploy-verify FLUX_VERSION pin: ${PIN:-<not found>} / versions-configmap flux_version: ${CM:-<not found>}"
        [ -n "$PIN" ] || { echo "Could not extract FLUX_VERSION pin from .gitlab-ci.yml"; return 1; }
        [ -n "$CM" ] || { echo "Could not extract flux_version from versions-configmap.yaml"; return 1; }
        [ "$PIN" = "$CM" ] || { echo "FLUX_VERSION pin (${PIN}) drifted from versions-configmap flux_version (${CM}) — bump the deploy-verify version + sha256 pair in .gitlab-ci.yml"; return 1; }
      }

      check_taskfile() { task --list >/dev/null && bash scripts/check-taskfile.sh; }

      run_check molecule-matrix-coverage bash scripts/check-molecule-matrix-coverage.sh
      run_check deploy-coverage bash scripts/check-deploy-coverage.sh
      run_check deploy-host-coverage python3 scripts/check-deploy-host-coverage.py
      run_check env-secret-coverage python3 scripts/check-env-secret-coverage.py
      run_check backup-artifact-apps python3 scripts/check-backup-artifact-apps.py
      run_check kubectl-version-pin python3 scripts/check-kubectl-version-pin.py
      run_check flux-version-pin check_flux_version_pin
      run_check taskfile-smoke check_taskfile
      [ "$overall" -eq 0 ] || echo "Failed policy checks:$failed"
      exit "$overall"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-repo-policy, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-repo-policy, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

ansible-lint:
  needs: []
  stage: lint
  extends: .ansible-base
  script:
    - cd ansible
    - |
      export SSH_PUBLIC_KEY="ssh-ed25519 AAAA_PLACEHOLDER_FOR_CI_SYNTAX_CHECK"
      export SMTP_RELAY_USER="ci-placeholder"
      export SMTP_RELAY_PASSWORD="ci-placeholder"
      for playbook in playbooks/*.yml playbooks/*/*.yml; do
        if [ -f "$playbook" ]; then
          # Skip task include files (convention: prefix with underscore)
          # POSIX-compatible pattern match (works in sh, not just bash)
          case "$(basename "$playbook")" in
            _*)
              echo "Skipping task include: $playbook"
              continue
              ;;
          esac
          echo "Checking syntax: $playbook"
          ansible-playbook --syntax-check -i inventories/prod "$playbook"
        fi
      done
    - ansible-lint playbooks/ roles/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-ansible, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-ansible, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'

# AI-REVIEW STAGE - AI-powered code review on MRs

# PR-Agent by Qodo - AI code review
# Requires: GitLab API Token and OpenAI API Key in 1Password
pr-agent-review:
  stage: ai-review
  needs:
    # Wait for lint + security only — no need to block on slow test jobs.
    # AI review benefits from knowing the code is lint-clean and secret-safe
    # but doesn't depend on molecule/integration test results.
    - job: shellcheck
      optional: true
    - job: yaml-lint
      optional: true
    - job: ansible-lint
      optional: true
    - job: terraform-fmt
      optional: true
    - job: repo-sync-checks
      optional: true
    - job: flux-lint
      optional: true
    - job: secret_detection
  # Pinned by digest to prevent supply-chain surprises on a job that handles
  # both a GitLab PAT and an OpenAI key. Bump alongside upstream releases.
  image: codiumai/pr-agent:0.34@sha256:1c1743e93bf6627cd14528cd4defe82465f17860e8f20e6c0ac6558971f61c61
  variables:
    CONFIG__GIT_PROVIDER: "gitlab"
    GITLAB__URL: "https://git.ericsweiss.com"
    # CONFIG__MODEL: gpt-5.5 — OpenAI's latest. There is no gpt-5.5-codex (the
    # codex line tops out at gpt-5.3-codex); gpt-5.5 supports xhigh reasoning.
    # See: https://qodo-merge-docs.qodo.ai/usage-guide/changing_a_model/
    CONFIG__MODEL: "gpt-5.5"
    # Use (most of) gpt-5.5's ~1M context for deep review. Its window is 1.05M
    # total = ~922k input + 128k output; get_max_tokens() returns TOTAL context
    # and does NOT reserve output, so cap usage at 900k to stay under the input
    # limit (with headroom for the system prompt). This is the operational cap
    # that get_max_tokens min()s against.
    CONFIG__MAX_MODEL_TOKENS: "900000"
    # gpt-5.5 shipped after pr-agent 0.34, so it is absent from pr-agent's
    # MAX_TOKENS table — declare the model's context window explicitly or
    # get_max_tokens() errors out ("Model gpt-5.5 is not defined in MAX_TOKENS").
    # Set to the full ~1.05M window; MAX_MODEL_TOKENS above is the real cap.
    # (Reasoning + temperature-omission still apply via the gpt-5* prefix check.)
    CONFIG__CUSTOM_MODEL_MAX_TOKENS: "1050000"
    # 'high', not 'xhigh': the litellm bundled in pr-agent 0.34 only allows
    # reasoning_effort='xhigh' for gpt-5.1-codex-max and gpt-5.2 — for gpt-5.5 it
    # raises UnsupportedParamsError, which makes pr-agent fall back to o4-mini.
    # 'high' is litellm's max for gpt-5.5; revisit if pr-agent ships a newer
    # litellm that knows gpt-5.5 supports xhigh.
    CONFIG__REASONING_EFFORT: "high"
    # Per-LLM-call timeout (litellm). 120s timed out immediately; 600s was not
    # enough either — measured on weisssrv-lib!4, one `improve` call on a
    # 52k-token diff took 1478s, timed out at 600, RETRIED, and the retry ate the
    # job budget. This repo's MRs are far larger (this branch's own diff is ~8.8x
    # that one), so size the call timeout above the slow case and let the job
    # timeout below be the real bound. A too-small value does not fail fast — it
    # fails, retries, and fails again having done the work twice.
    CONFIG__AI_TIMEOUT: "1800"
    PR_REVIEWER__NUM_CODE_SUGGESTIONS: "6"
    PR_REVIEWER__EXTRA_INSTRUCTIONS: "Be thorough. Review every file. Flag all bugs, security issues, and documentation drift."
    PR_CODE_SUGGESTIONS__NUM_CODE_SUGGESTIONS: "6"
  before_script:
    - !reference [.install-1password, before_script]
  script:
    - |
      # Get secrets from 1Password
      export GITLAB__PERSONAL_ACCESS_TOKEN=$(op read "op://Homelab/GitLab API Token/credential")
      export OPENAI__KEY=$(op read "op://Homelab/OpenAI API Key/api-key")

      echo "Running AI code review on MR !${CI_MERGE_REQUEST_IID}..."
      echo "Model: gpt-5.5 (high reasoning, 900k context, 1800s call timeout)"

      # Run full review
      python -m pr_agent.cli \
        --pr_url="https://git.ericsweiss.com/eric/weisssrv/-/merge_requests/${CI_MERGE_REQUEST_IID}" \
        review

      # Suggest improvements
      python -m pr_agent.cli \
        --pr_url="https://git.ericsweiss.com/eric/weisssrv/-/merge_requests/${CI_MERGE_REQUEST_IID}" \
        improve

      echo "AI review complete"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # OPERATIONAL INVARIANT: the && $OP_SERVICE_ACCOUNT_TOKEN guard means this
    # job is never CREATED when the token is unset (e.g. fork MRs). An absent
    # AI review is therefore expected, not a failure — a missing pr-agent-review
    # on such an MR is not a regression. validation-gate does NOT need this job
    # (AI review is advisory), so its absence never blocks deploys.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $OP_SERVICE_ACCOUNT_TOKEN'
  allow_failure: true  # Don't block MRs on AI review
  # Must exceed CONFIG__AI_TIMEOUT times the number of passes (review + improve
  # = 2 x 1800s = 60m), plus the 1Password install and clone. At 45m the job
  # killed a call that had not yet hit its own timeout, which discards the output
  # of the pass that already finished. allow_failure means it never blocks — and
  # that is exactly why a failure here is easy to miss: the pipeline stays GREEN
  # and the review comment simply never appears. Check the job, not the pipeline.
  timeout: 90m

# VALIDATE STAGE - Schema and configuration validation

terraform-plan:
  extends: .terraform-http-backend
  needs: []
  stage: validate
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]
  before_script:
    - !reference [.install-1password-alpine, before_script]
  script:
    - cd terraform/cloudflare
    # -lockfile=readonly: CI must not rewrite .terraform.lock.hcl (provider
    # hashes are committed; a CI-side change would mask supply-chain drift).
    - terraform init -lockfile=readonly
    - |
      export TF_VAR_cloudflare_api_token=$(op read "op://Homelab/Cloudflare Terraform Token/credential")
      export TF_VAR_cloudflare_account_id=$(op read "op://Homelab/Cloudflare Terraform Token/username")
      terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan
    # Generate plan report for MR widget (shows resource change counts in merge requests)
    - terraform show -json tfplan | jq -r '
        ([.resource_changes[]?.change.actions?]|flatten)|
        {"create":(map(select(.=="create"))|length),
         "update":(map(select(.=="update"))|length),
         "delete":(map(select(.=="delete"))|length)}
      ' > tfplan.json
  artifacts:
    # The binary plan embeds rendered resource attributes; restrict download to
    # developer+ (default is any project member). deploy-terraform still consumes
    # it via needs:artifacts — access only gates UI/API download, not job needs.
    access: developer
    paths:
      - terraform/cloudflare/tfplan
    reports:
      terraform: terraform/cloudflare/tfplan.json
    # 1 day (not 1 hour): deploy-terraform consumes this tfplan in a later stage;
    # a slow/retried pipeline could otherwise have the plan GC'd before apply.
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # OPERATIONAL INVARIANT: the && $OP_SERVICE_ACCOUNT_TOKEN guard means a
    # terraform/ change on a tokenless pipeline (e.g. fork MR) produces NO plan
    # — the MR widget will simply lack a Terraform report. That's an expected
    # skip, not a clean plan. validation-gate needs this job optionally, so a
    # token-gated skip can't silently mask drift on a real (token-bearing) run.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-terraform-cloudflare, changes]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-terraform-cloudflare, changes]

# Read-only drift `terraform plan` for the tailscale ACL module against live
# state. Never applies (apply stays supervised — see terraform/tailscale/README.md).
# A non-empty plan = the live tailnet ACL drifted from policy.hujson (e.g. an
# Admin-console hot-fix); allow_failure so that drift, or a plan hiccup, surfaces
# without blocking CI. Mirrors terraform-plan's op-injected creds + TF_HTTP_*
# state backend, scoped to the tailscale module + its own state name.
tailscale-drift-plan:
  # Shared HTTP-backend auth/lock settings come from .terraform-http-backend;
  # only the tailscale state path is overridden here.
  extends: .terraform-http-backend
  needs: []
  stage: validate
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]
  variables:
    TF_HTTP_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/tailscale"
    TF_HTTP_LOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/tailscale/lock"
    TF_HTTP_UNLOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/tailscale/lock"
  before_script:
    - !reference [.install-1password-alpine, before_script]
  script:
    - cd terraform/tailscale
    # -lockfile=readonly: CI must not rewrite .terraform.lock.hcl (committed
    # provider hashes; a CI-side change would mask supply-chain drift).
    - terraform init -lockfile=readonly
    - |
      export TF_VAR_tailscale_oauth_client_id=$(op read "op://Homelab/Tailscale OAuth/client id")
      export TF_VAR_tailscale_oauth_client_secret=$(op read "op://Homelab/Tailscale OAuth/credential")
      # Plan only, never apply — surfaces drift instead of silently reverting it.
      # -detailed-exitcode: drift exits 2 (plain plan exits 0 on a non-empty
      # diff), so allow_failure can actually render the yellow drift signal.
      terraform plan -input=false -no-color -lock-timeout=120s -detailed-exitcode
  # Advisory drift signal only — never blocks CI (apply stays supervised).
  allow_failure: true
  rules:
    # Periodic drift detection on the schedule (token available on the protected
    # main branch). No changes: filter — the point is to catch out-of-band
    # Admin-console edits when nothing in-repo changed.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $OP_SERVICE_ACCOUNT_TOKEN'
    # And validate a tailscale-module change against live state before its
    # supervised apply. Token-guarded like terraform-plan (fork MRs lack it).
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-terraform-tailscale, changes]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-terraform-tailscale, changes]

# Read-only drift `terraform plan` for the authentik SSO module against the
# live authentik objects. Never applies (every apply is a supervised manual
# step — see terraform/authentik/README.md; there is deliberately no
# terraform:authentik-apply task yet). A non-empty plan = an Admin-UI edit
# drifted from the codified state; allow_failure so drift, or a plan hiccup,
# surfaces without blocking CI. Mirrors tailscale-drift-plan (op-injected
# creds + TF_HTTP_* backend), scoped to the authentik module + its own state
# name. KNOWN ADVISORY DIFF: until the approved Sonarr basic-auth clear is
# applied, this job exits 2 (yellow) with exactly that one in-place update —
# designed signal, not a failure (README "The Sonarr exception").
authentik-drift-plan:
  # Shared HTTP-backend auth/lock settings come from .terraform-http-backend;
  # only the authentik state path is overridden here.
  extends: .terraform-http-backend
  needs: []
  stage: validate
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]
  variables:
    TF_HTTP_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/authentik"
    TF_HTTP_LOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/authentik/lock"
    TF_HTTP_UNLOCK_ADDRESS: "https://git.ericsweiss.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/authentik/lock"
  before_script:
    - !reference [.install-1password-alpine, before_script]
  script:
    - cd terraform/authentik
    # -lockfile=readonly: CI must not rewrite .terraform.lock.hcl (committed
    # provider hashes; a CI-side change would mask supply-chain drift).
    - terraform init -lockfile=readonly
    - |
      export TF_VAR_authentik_token=$(op read "op://Homelab/Authentik Terraform Token/credential")
      export TF_VAR_oauth2_client_secret_mealie=$(op read "op://Homelab/Mealie SSO/oidc-client-secret")
      export TF_VAR_oauth2_client_secret_bar_assistant=$(op read "op://Homelab/Bar Assistant SSO/authentik-client-secret")
      export TF_VAR_oauth2_client_secret_home_assistant=$(op read "op://Homelab/Home Assistant SSO/authentik-client-secret")
      export TF_VAR_oauth2_client_secret_grafana=$(op read "op://Homelab/Grafana SSO/oidc-client-secret")
      export TF_VAR_oauth2_client_secret_nextcloud=$(op read "op://Homelab/Nextcloud SSO/client-secret")
      export TF_VAR_oauth2_client_secret_immich=$(op read "op://Homelab/Immich SSO/client-secret")
      export TF_VAR_oauth2_client_secret_hermes_dashboard=$(op read "op://Homelab/Hermes Secrets/hermes-dashboard-oidc-client-secret")
      export TF_VAR_oauth2_client_secret_homarr=$(op read "op://Homelab/Homarr SSO/client-secret")
      export TF_VAR_basic_auth_nzbget_username=$(op read "op://Homelab/NZBGet/username")
      export TF_VAR_basic_auth_nzbget_password=$(op read "op://Homelab/NZBGet/password")
      export TF_VAR_basic_auth_adguard_username=$(op read "op://Homelab/AdGuard Home/username")
      export TF_VAR_basic_auth_adguard_password=$(op read "op://Homelab/AdGuard Home/password")
      # Plan only, never apply — surfaces drift instead of silently reverting it.
      # -detailed-exitcode: drift exits 2 (plain plan exits 0 on a non-empty
      # diff), so allow_failure can actually render the yellow drift signal.
      terraform plan -input=false -no-color -lock-timeout=120s -detailed-exitcode
  # Advisory drift signal only — never blocks CI (apply stays supervised).
  allow_failure: true
  rules:
    # Periodic drift detection on the schedule (token available on the protected
    # main branch). No changes: filter — the point is to catch out-of-band
    # Admin-UI edits when nothing in-repo changed.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $OP_SERVICE_ACCOUNT_TOKEN'
    # And validate an authentik-module change against live state before its
    # supervised apply. Token-guarded like terraform-plan (fork MRs lack it).
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-terraform-authentik, changes]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-terraform-authentik, changes]

# Read-only drift check for the B2 backup-bucket settings against the live
# bucket via the raw B2 API (scripts/b2-bucket-drift.py — the codified config;
# it replaced the terraform/b2 module after the Backblaze provider's READ path
# started returning empty attributes against B2's current API, which made
# terraform plan report a permanent phantom diff). Never applies: reconciling
# is the supervised `task b2:apply`. A DRIFT result = an out-of-band
# Backblaze-console edit; allow_failure so drift, or an API hiccup, surfaces
# without blocking CI.
b2-drift-plan:
  needs: []
  stage: validate
  image: python:3.11-slim
  before_script:
    - !reference [.install-1password, before_script]
  script:
    - |
      export B2_APPLICATION_KEY_ID=$(op read "op://Homelab/B2 Archive Backup/b2_key_id")
      export B2_APPLICATION_KEY=$(op read "op://Homelab/B2 Archive Backup/b2_application_key")
      python3 scripts/b2-bucket-drift.py
  # Advisory drift signal only — never blocks CI (apply stays supervised).
  allow_failure: true
  rules:
    # Periodic drift detection on the schedule (token available on the protected
    # main branch). No changes: filter — the point is to catch out-of-band
    # Backblaze-console edits when nothing in-repo changed.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $OP_SERVICE_ACCOUNT_TOKEN'
    # And validate a drift-script change against the live bucket before merge.
    # Token-guarded like terraform-plan (fork MRs lack it).
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-b2-drift, changes]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-b2-drift, changes]

# Validate the kube-prometheus-stack alert rules (PromQL in HelmRelease values)
# and the Alertmanager config (ExternalSecret template) that kubeconform /
# flux-lint can't parse. Without this, a bad expr or malformed route only
# surfaces post-merge when the prometheus-operator admission webhook rejects the
# rendered CR (failing the whole HelmRelease upgrade). See docs/33.
prometheus-config-lint:
  needs: []
  stage: lint
  image: python:3.11-slim
  # Cache promtool + amtool across runs, keyed on .gitlab-ci.yml (versions +
  # sha256s live there). No-op without a runner cache backend.
  cache:
    key:
      prefix: prom-tools
      files:
        - .gitlab-ci.yml
    paths:
      - .cache/prom-tools
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl
    - pip install --quiet "pyyaml==${PYYAML_VERSION}"
    - |
      set -eo pipefail
      # promtool (prometheus) + amtool (alertmanager), pinned + sha256 like every
      # other downloaded binary in this pipeline. The cache holds VERIFIED
      # TARBALLS: every run — hit or miss — re-checks the pinned sha256 and
      # re-extracts, so a mutated runner cache can't smuggle in an unverified
      # binary. set -eo pipefail so a failing sha256sum -c aborts the block.
      TOOLS_CACHE="${CI_PROJECT_DIR}/.cache/prom-tools"
      mkdir -p "$TOOLS_CACHE"
      fetch_verified() { # <file> <url> <sha256>
        if ! echo "$3  $TOOLS_CACHE/$1" | sha256sum -c - >/dev/null 2>&1; then
          curl -fsSL -o "$TOOLS_CACHE/$1" "$2"
          echo "$3  $TOOLS_CACHE/$1" | sha256sum -c -
        fi
      }
      PROM_VERSION="3.6.0"
      fetch_verified prom.tar.gz \
        "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
        2002ef4a55a64161affccd2786c7081d4e3b3a8d08786a98b3bb110971414916
      tar xzf "$TOOLS_CACHE/prom.tar.gz" -C /usr/local/bin --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"
      AM_VERSION="0.28.1"
      fetch_verified am.tar.gz \
        "https://github.com/prometheus/alertmanager/releases/download/v${AM_VERSION}/alertmanager-${AM_VERSION}.linux-amd64.tar.gz" \
        5ac7ab5e4b8ee5ce4d8fb0988f9cb275efcc3f181b4b408179fafee121693311
      tar xzf "$TOOLS_CACHE/am.tar.gz" -C /usr/local/bin --strip-components=1 "alertmanager-${AM_VERSION}.linux-amd64/amtool"
      promtool --version && amtool --version
  script:
    - bash scripts/lint-prometheus-config.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-prometheus-config, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-prometheus-config, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'

# TEST STAGE - Unit and integration tests

# NOTE: Molecule/integration tests require Docker-in-Docker, which needs a privileged
# runner. All weisssrv jobs (including these) run on the infrastructure runner
# (gitlab-runner-privileged Helm release, tags: infrastructure) which has privileged=true.
# The runner is Flux-managed: edit kubernetes/apps/gitlab-runner-privileged/release.yaml
# and push; Flux reconciles within ~1 min (or run `task flux:reconcile` to force).

# Molecule unit tests — one parallel job per role/scenario. Each role with a
# molecule/ directory gets its own CI job via parallel:matrix.
# Full static matrix — main, web, and the scheduled full-test run. MR
# pipelines run the TARGETED subset instead via molecule-plan/molecule-trigger
# below (the generated child extends the same .molecule-test-job template).
molecule-tests:
  extends: .molecule-test-job
  parallel:
    matrix:
      # Each role/scenario combo gets its own parallel job. Roles with a
      # single scenario use "default". k3s has two scenarios (default +
      # agent) that run as separate jobs to halve wall time.
      - ROLE: acme_certs
        SCENARIO: default
      - ROLE: alloy_host
        SCENARIO: default
      - ROLE: adguard_home
        SCENARIO: default
      - ROLE: adguard_home
        SCENARIO: tls
      - ROLE: adguard_sync
        SCENARIO: default
      - ROLE: base
        SCENARIO: default
      - ROLE: gitlab
        SCENARIO: default
      # immich: render/contract scenario (immich_skip_install) — asserts the
      # compose/config/.env/nginx/systemd/backup-wrapper renders without a real
      # Docker runtime.
      - ROLE: immich
        SCENARIO: default
      # immich_ml: render/contract scenario (skip_immich_ml_deploy) — asserts
      # the OpenVINO compose (image lockstep on immich_version, /dev/dri, port
      # 3003) + systemd unit render without a Docker runtime or GPU.
      - ROLE: immich_ml
        SCENARIO: default
      # home_assistant: contract test for the two Jinja2 templates
      # (configuration.yaml.j2, secrets.yaml.j2). The role's scp/ssh
      # path against the live HAOS appliance can't be exercised in a
      # container — HAOS isn't a Linux distro you can run in Docker —
      # so the scenario flips home_assistant_render_only=true to skip
      # the deploy half and asserts on the rendered output.
      - ROLE: home_assistant
        SCENARIO: default
      - ROLE: k3s
        SCENARIO: default
      - ROLE: k3s
        SCENARIO: agent
      - ROLE: nas_storage
        SCENARIO: default
      # restic_offsite is the nightly B2 offsite-backup role on pve-nas-01; its
      # hermetic scenario runs against a local file repo + fake archsync snapshot
      # tree (no network), asserting subcommands/metric names/0600 secret files/
      # timer enable + the freshness-guard abort (docs/42).
      - ROLE: restic_offsite
        SCENARIO: default
      # encrypted_swap is the dm-crypt random-key swap role (NAS + compute hosts);
      # its scenario contract-tests the crypttab/systemd render on the skip path.
      - ROLE: encrypted_swap
        SCENARIO: default
      - ROLE: zfs_arc_cap
        SCENARIO: default
      - ROLE: vfio_passthrough
        SCENARIO: default
      - ROLE: nextcloud
        SCENARIO: default
      - ROLE: nfs_tls
        SCENARIO: default
      - ROLE: nic_tuning
        SCENARIO: default
      - ROLE: plex
        SCENARIO: default
      - ROLE: postfix_null_client
        SCENARIO: default
      - ROLE: qol
        SCENARIO: default
      - ROLE: smtp_relay
        SCENARIO: default
      - ROLE: tailscale
        SCENARIO: default
      - ROLE: unbound
        SCENARIO: default
      # apt_signed_repo is the shared signed-apt-repo pipeline backing
      # alloy_host + gitlab + plex; its scenario hermetically tests both the
      # accept (correct fingerprint) and reject (wrong fingerprint) paths.
      - ROLE: apt_signed_repo
        SCENARIO: default
      # docker_engine is the shared pinned-Docker-Engine install pipeline
      # backing immich + immich_ml + nextcloud; its scenario renders + asserts
      # the journald daemon.json on the skip-install path (no real repo/daemon).
      - ROLE: docker_engine
        SCENARIO: default
      # compose_app is the shared compose-lifecycle super-role backing immich +
      # immich_ml + nextcloud (compose systemd unit + write_prom_metrics lib +
      # nginx task-flow); its scenario asserts the rendered unit body (empty and
      # non-empty RequiresMountsFor) and the metrics lib without a Docker runtime.
      - ROLE: compose_app
        SCENARIO: default
      # prometheus_exporter is the shared install pipeline backing
      # zfs_exporter + unbound_exporter; its scenario contract-tests both
      # artifact branches (tarball + deb) on the skip path.
      - ROLE: prometheus_exporter
        SCENARIO: default
      - ROLE: zfs_exporter
        SCENARIO: default
      - ROLE: unbound_exporter
        SCENARIO: default
      - ROLE: node_exporter_host
        SCENARIO: default
      - ROLE: textfile_collector
        SCENARIO: default
      - ROLE: resolv_conf
        SCENARIO: default
      - ROLE: resolv_conf
        SCENARIO: empty-search
      # zvol_mount uses loop devices in prepare; works under privileged DinD.
      - ROLE: zvol_mount
        SCENARIO: default
      - ROLE: proxmox_firewall
        SCENARIO: default
      - ROLE: proxmox_vm
        SCENARIO: default
      - ROLE: proxmox_lxc
        SCENARIO: default
      - ROLE: proxmox_ha
        SCENARIO: default
      - ROLE: proxmox_backup
        SCENARIO: default
      # zfs_encryption: validates template rendering, file modes, systemd
      # ordering hooks, and per-pool service enable. Cannot exercise
      # `zfs load-key` (no kernel module in container) or live Connect
      # calls (no fixture endpoint), but covers the deploy contract end
      # to end with mocked inputs.
      - ROLE: zfs_encryption
        SCENARIO: default
  rules:
    # full-test schedule canary (must precede the schedule when:never rule —
    # first-match-wins): catches external-dependency rot (apt/galaxy/upstream
    # installers) without waiting for an unrelated ansible MR to turn red.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "full-test"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # NO merge_request_event clause: MR pipelines run the targeted child
    # (molecule-plan/molecule-trigger, gated on .paths-molecule-any) instead
    # of this full matrix.
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-molecule, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'

integration-tests:
  extends: .integration-test-job
  parallel:
    matrix:
      - TEST:
          - base-infrastructure
          - cert-distribution
          - dns-stack
          - mail-stack
          - storage-stack
  rules:
    # full-test schedule canary — same rationale as molecule-tests.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "full-test"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # NO merge_request_event clause: MRs use the targeted child pipeline.
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-integration, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'

# MR-targeted molecule child pipeline
# On MRs the full 43+5 matrix is replaced by a GENERATED child pipeline running
# only the scenarios affected by the diff (scripts/generate-molecule-pipeline.py:
# role dirs -> their scenarios, provider roles -> dependent roles transitively,
# integration stacks by exercised role, all.yml -> integration only, global
# inputs -> everything; unknown role dirs fail loudly, over-selects when in
# doubt). Full coverage still runs on every merge to main + the scheduled
# full-test pipeline, so a cross-role regression a targeted MR run missed is
# caught before any deploy (deploys are main-only, behind validation-gate).
molecule-plan:
  stage: test
  image: python:3.11-slim
  needs: []
  variables:
    # Full clone so the MR diff base is always reachable (same rationale as
    # repo-policy-checks' merge-base guard).
    GIT_DEPTH: 0
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - pip install --no-cache-dir --quiet "PyYAML==${PYYAML_VERSION}"
  script:
    - python3 scripts/generate-molecule-pipeline.py "$CI_MERGE_REQUEST_DIFF_BASE_SHA" -o molecule-child.yml
    - cat molecule-child.yml
  artifacts:
    paths:
      - molecule-child.yml
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-molecule-any, changes]

molecule-trigger:
  stage: test
  needs:
    - job: molecule-plan
    # Forward build-molecule-ci's dotenv digest pin into the trigger job so the
    # child's jobs resolve the exact rebuilt CI image (not a racy :latest) when
    # the image changed in this MR. optional: the build only runs on docker/
    # changes; without it the child falls back to :latest via .molecule-base.
    - job: build-molecule-ci
      optional: true
      artifacts: true
    # Parity with the static matrix's anti-retag guard: when docker/molecule-test
    # changed, the child's SHA-tag pull must not race the image push — hold the
    # trigger until the build lands. optional: absent on non-image MRs.
    - job: build-molecule-test
      optional: true
  trigger:
    include:
      - artifact: molecule-child.yml
        job: molecule-plan
    # depend: this job's result mirrors the child pipeline's — a red child
    # reds the MR pipeline, so targeted tests gate MRs exactly like the full
    # matrix used to.
    strategy: depend
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-molecule-any, changes]
# SECURITY STAGE - Secret detection and scanning

include:
  # Secret-Detection (gitleaks) is pulled in by the shared library's
  # secret-detection component below, which overrides the managed job — so it is
  # NOT included directly here (a second include of the same managed template
  # would be redundant).
  #
  # .molecule-base + the molecule/integration job templates stay LOCAL: the
  # generated MR child pipeline (molecule-plan -> molecule-trigger) includes ONLY
  # this file, so moving it into the shared library would break the "child
  # includes just this file" invariant (docs/16 ARCH-4) and re-introduce the
  # default: tags non-inheritance bug pipeline 777 hit.
  - local: .gitlab/ci/molecule-jobs.gitlab-ci.yml

  # Shared CI library (eric/weisssrv-lib @ v0.1.1) — the generic/parameterizable
  # lint/validate/test/security jobs, consumed via include:project + pinned tag.
  # Inputs reproduce weisssrv's prior INLINE behavior job-for-job: the default
  # tags:[infrastructure] keeps every job on the privileged infrastructure
  # runner, and each `changes:` path list matches the old .paths-* anchor. The
  # adoption MR description carries the job-by-job parity evidence.
  # yaml-lint: defaults reproduce weisssrv's four `yamllint -d relaxed <target>`
  # invocations + .paths-yaml-lint.
  - project: eric/weisssrv-lib
    ref: v0.1.1
    file: /ci/lint/yaml-lint.yml
  # shellcheck: defaults reproduce the scripts/ + ansible/*.sh globs, the
  # ansible/roles find, the *.sh.j2 Jinja neutralizer, and .paths-shellcheck.
  - project: eric/weisssrv-lib
    ref: v0.1.1
    file: /ci/lint/shellcheck.yml
  # docs-link-check: runs weisssrv's repo-local scripts/check-doc-links.py, which
  # scans every TRACKED *.md (role/app/agent READMEs link into docs/ too), so the
  # trigger list has to be `**/*.md`-wide — the library default only covers
  # docs/ + the top-level READMEs.
  - project: eric/weisssrv-lib
    ref: v0.1.1
    file: /ci/lint/docs-link-check.yml
    inputs:
      changes:
        - "**/*.md"
        - "scripts/check-doc-links.py"
        - "scripts/test_check_doc_links.py"
  # terraform: one include emits BOTH terraform-fmt (lint stage) and
  # terraform-validate (validate stage); defaults reproduce fmt_dir terraform/,
  # module_glob terraform/*/, and .paths-terraform.
  - project: eric/weisssrv-lib
    ref: v0.1.1
    file: /ci/validate/terraform.yml
  # secret_detection: overrides GitLab's managed Secret-Detection job. Defaults
  # (cpu_selector esweiss.com/cpu=modern, allow_failure true, MR/main/schedule
  # rules) match weisssrv's inline job; the hard block still comes from
  # validation-gate needing this job non-optionally.
  - project: eric/weisssrv-lib
    ref: v0.1.1
    file: /ci/security/secret-detection.yml
  # python-tests: pytest scripts/. Most of the suite are drift guards that read
  # files OUTSIDE scripts/, so the library default `changes` (scripts/ + docs)
  # leaves them unable to fire on their own subject.
  #
  # GOAL: every repo file a scripts/test_*.py reads matches a pattern below, so a
  # guard fires on its own subject.
  #
  # Derived by TRACING, not by reading the tests: a sys.addaudithook over
  # `pytest scripts/` recorded every open, and each path was matched with Ruby
  # File.fnmatch under GitLab's flags (PATHNAME|DOTMATCH|EXTGLOB). Reasoning
  # about which paths a test "should" read under-swept twice — the trace found
  # 523 opened files and 67 unmatched after the second attempt, including
  # roles/*/handlers/ + meta/ (test_flux_render) and
  # infrastructure/sources/versions-configmap.yaml (test_generate_versions_configmap,
  # i.e. the version-substitution map itself). Now 522/523; the one residual is a
  # bare relative "tasks" that is not a repo path. Re-run the trace when adding a
  # test rather than guessing its inputs.
  #
  # NOT a closed invariant: the list is hand-maintained and only as current as
  # the last trace. A meta-gate asserting it was rejected — every implementation
  # missed paths built from string constants inside functions, which would be one
  # more gate that cannot fail on part of its subject.
  - project: eric/weisssrv-lib
    ref: v0.1.1
    file: /ci/test/python-tests.yml
    inputs:
      changes:
        - "scripts/**/*"
        - "ansible/inventories/prod/**/*"
        - "ansible/roles/**/molecule/**/*"
        - "ansible/roles/*/tasks/**/*"
        - "ansible/roles/*/templates/**/*"
        - "ansible/roles/*/defaults/**/*"
        - "ansible/roles/*/handlers/**/*"
        - "ansible/roles/*/meta/**/*"
        - "ansible/roles/*/README.md"
        - "ansible/playbooks/**/*"
        - "ansible/integration-tests/**/*"
        - "ansible/README.md"
        - "ansible/TESTING.md"
        - "kubernetes/clusters/weisssrv/**/*"
        - "kubernetes/infrastructure/observability/**/*"
        - "kubernetes/infrastructure/configs/**/*"
        - "kubernetes/infrastructure/sources/**/*"
        - "kubernetes/apps/**/*"
        - "kubernetes/README.md"
        - "terraform/*/README.md"
        - "docker/*/README.md"
        - "docs/**/*"
        - "README.md"
        - "CLAUDE.md"
        - "AGENTS.md"
        - ".cursorrules"
        - ".claude/**/*"
        - "Taskfile.yml"
        - ".gitlab-ci.yml"
  # flux-lint: substitute mode (postBuild var substitution from the cluster
  # versions ConfigMap; needs a root runner for gettext-base). Version pins +
  # cluster paths are passed explicitly (equal to the library defaults); the
  # default `changes` already equals .paths-flux-lint. extra_validation carries
  # weisssrv's HPA/VPA invariant, scrape/NetworkPolicy invariant, secret-store
  # scoping and helm-values checks, which call weisssrv-local scripts (kept in
  # scripts/), running with $RENDER_ALL / $FAILED in scope.
  - project: eric/weisssrv-lib
    ref: v0.1.1
    file: /ci/validate/flux-lint.yml
    inputs:
      substitute: true
      kubeconform_version: "0.6.7"
      kubeconform_sha256: "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73"
      kustomize_version: "5.4.3"
      kustomize_sha256: "3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7"
      helm_version: "3.18.4"
      helm_sha256: "f8180838c23d7c7d797b208861fecb591d9ce1690d8704ed1e4cb8e2add966c1"
      pyyaml_version: "6.0.2"
      cluster_dir: "kubernetes/clusters/weisssrv"
      versions_configmap: "kubernetes/infrastructure/sources/versions-configmap.yaml"
      flux_render_script: "scripts/flux-render.sh"
      skipped_script: "scripts/kubeconform-skipped.py"
      extra_validation: 'echo "=== Checking HPA/VPA invariant ==="; python3 scripts/check-hpa-vpa-invariant.py --require-chart-native-vpas < "$RENDER_ALL" || FAILED=1; echo "=== Checking scrape/NetworkPolicy invariant ==="; python3 scripts/check-scrape-netpol.py < "$RENDER_ALL" || FAILED=1; echo "=== Checking ClusterSecretStore scoping ==="; python3 scripts/check-secretstore-scope.py < "$RENDER_ALL" || FAILED=1; echo "=== Checking PVC storageClassName ==="; python3 scripts/check-pvc-storageclass.py < "$RENDER_ALL" || FAILED=1; echo "=== Schema-validating HelmRelease values blocks (helm template) ==="; python3 scripts/validate-helm-values.py --kubeconform || FAILED=1'

# GATE STAGE - Validation gate for deploy jobs
# All deploy jobs depend on this gate (non-optional). The gate lists every
# lint/test/security job as a dependency. GitLab CI `optional: true` semantics
# (https://docs.gitlab.com/ci/yaml/#needsoptional):
#
#   - If the needed job was NOT created (rules excluded it): dependency is ignored
#   - If the needed job IS in the pipeline and SUCCEEDS: dependency satisfied
#   - If the needed job IS in the pipeline and FAILS: the dependent job is BLOCKED
#
# Jobs with `changes:` path filters use optional:true (may not exist in pipeline).
# Jobs that ALWAYS run on main pushes (no path filter) are non-optional.
#
# Net effect: all applicable checks must pass before any deploy job runs.

# Fan-in for the parallel test matrices. molecule-tests (one job per role) and
# integration-tests (one per stack) are `parallel: matrix` jobs, so a `needs:`
# on either expands to ONE entry PER matrix instance (currently 43 + 5 = 48).
# Listed directly in validation-gate alongside its scalar needs the total
# exceeded GitLab's hard cap of 50 needs-per-job, so the main pipeline failed
# to even be created ("one job can only need 50 others"). TWO thin fan-ins —
# one per matrix — collapse those 48 into two dependencies, keeping each
# aggregator's expanded-need count (43 / 5) comfortably under the cap with
# per-group headroom (a single combined fan-in would sit at 48/50 today, two
# molecule scenarios away from breaking main pipeline creation). Gating is
# unchanged — a failed matrix instance leaves its (non-optional-by-default)
# dependency unmet, its aggregator is skipped, and validation-gate (which
# needs both non-optionally) is skipped in turn, blocking every deploy job.
# optional:true on each matrix keeps a path-filtered no-op pipeline green.
#
# interruptible:false on both (not the default true): on main, a second merge
# landing while a fan-in / validation-gate is still running must NOT
# auto-cancel it (workflow auto_cancel is on_new_commit:interruptible), or the
# first merge's deploy jobs would be left with an unmet need and silently
# never run. NOTE this protection is necessary but NOT sufficient: the matrix
# jobs UPSTREAM of the fan-ins stay interruptible (deliberately — MR pipelines
# rely on auto-cancel to free runner capacity), so a rapid second merge can
# still cancel the first pipeline's running matrices, skip its fan-ins + gate,
# and orphan its deploys — and the second pipeline's `changes:` are computed
# against its own parent, so the first merge's paths are NOT re-covered. That
# chain is exactly why the "serialize merges — never rapid-merge" operating
# rule exists; these flags only harden the tail of the pipeline, not the
# matrices. Deploys are already serialized by resource_group.
test-aggregate-molecule:
  stage: security
  image: alpine:3.23
  interruptible: false
  needs:
    # artifacts: false — this is a status-only fan-in (script is a bare echo).
    # The matrix extends .molecule-base and emits junit artifacts; without
    # this, GitLab would download them from all 43 instances here for no
    # reason.
    - job: molecule-tests
      optional: true
      artifacts: false
  script:
    - echo "molecule test matrix complete"
  # These rules MUST stay identical to validation-gate's below: it needs this
  # job non-optionally, so if this job is created for a pipeline where that gate
  # is not (or vice versa), pipeline creation fails. Same rules => co-present.
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main"'

test-aggregate-integration:
  stage: security
  image: alpine:3.23
  interruptible: false
  needs:
    - job: integration-tests
      optional: true
      artifacts: false
  script:
    - echo "integration test matrix complete"
  # Rules identical to validation-gate's — see test-aggregate-molecule.
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main"'

validation-gate:
  stage: gate
  image: alpine:3.23
  # interruptible:false (not the default true): once this deploy gate is running
  # on main, a newer commit must not auto-cancel it (workflow auto_cancel is
  # on_new_commit:interruptible) — otherwise the first pipeline's not-yet-started
  # deploy jobs, which all `needs: validation-gate`, would be orphaned and never
  # deploy. Enforces the "serialize merges" discipline the deploys rely on
  # (resource_group already serializes the deploys themselves).
  interruptible: false
  needs:
    # Path-filtered jobs (may not exist in pipeline)
    - job: shellcheck
      optional: true
    - job: yaml-lint
      optional: true
    - job: ansible-lint
      optional: true
    - job: terraform-fmt
      optional: true
    - job: terraform-validate
      optional: true
    - job: terraform-plan
      optional: true
    - job: repo-sync-checks
      optional: true
    - job: flux-lint
      optional: true
    - job: prometheus-config-lint
      optional: true
    - job: repo-policy-checks
      optional: true
    - job: docs-link-check
      optional: true
    # tailscale-drift-plan / authentik-drift-plan are deliberately NOT here:
    # they are advisory (allow_failure) like pr-agent-review, so they can
    # never block the gate.
    - job: python-tests
      optional: true
    # molecule-tests + integration-tests are fanned in via the two
    # test-aggregate-* jobs (see their comment above) so this gate's expanded
    # needs stay under GitLab's hard 50-per-job cap. Both aggregators carry the
    # SAME rules as this gate (skip-schedule-web + main-only), so all three are
    # always created together. These needs are intentionally NON-optional: if
    # that shared-rules invariant is ever broken, a loud pipeline-creation
    # failure is safer than optional's silent skip, which would let deploy run
    # with the test matrices un-gated. Keep the rule blocks identical (or make
    # these optional) if you change any of them.
    - job: test-aggregate-molecule
    - job: test-aggregate-integration
    # Always-run jobs (no path filter, always present on main pushes)
    - job: secret_detection
  script:
    # Guard: every deploy-* job gates on `$CI_COMMIT_BRANCH == "main" &&
    # $OP_SERVICE_ACCOUNT_TOKEN`. If the token is unset/empty those jobs are
    # silently never created and main goes green having deployed nothing.
    # Fail loudly here (this gate always runs on main, no token guard) so a
    # missing CI/CD variable surfaces as a red pipeline instead of a no-op.
    - |
      if [ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
        echo "ERROR: OP_SERVICE_ACCOUNT_TOKEN is unset/empty on a main pipeline." >&2
        echo "       All deploy-* jobs gate on this token and would be silently skipped," >&2
        echo "       deploying nothing while the pipeline reports success." >&2
        echo "       Set the OP_SERVICE_ACCOUNT_TOKEN CI/CD variable (masked, protected)." >&2
        exit 1
      fi
    - echo "All applicable checks passed - deploy jobs may proceed"
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main"'

# DEPLOY STAGE - Auto-deploy on merge to main
#
# Each Ansible deploy job sets a per-job resource_group so GitLab serializes it
# across pipelines (two rapid pushes to main can't run the same Ansible play
# against the same hosts at once). Per-job (not one shared group) keeps
# within-pipeline parallelism: jobs targeting different hosts still run
# concurrently. (deploy-terraform relies on its HTTP state lock instead; the
# read-only deploy-verify job needs no serialization.)

# Terraform

deploy-terraform:
  extends: .terraform-http-backend
  stage: deploy
  interruptible: false
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]
  needs:
    - job: validation-gate
    - job: terraform-plan
      artifacts: true
  before_script:
    - !reference [.install-1password-alpine, before_script]
  script:
    - cd terraform/cloudflare
    # -lockfile=readonly: CI must not rewrite .terraform.lock.hcl (provider
    # hashes are committed; a CI-side change would mask supply-chain drift).
    - terraform init -lockfile=readonly
    - |
      export TF_VAR_cloudflare_api_token=$(op read "op://Homelab/Cloudflare Terraform Token/credential")
      export TF_VAR_cloudflare_account_id=$(op read "op://Homelab/Cloudflare Terraform Token/username")
      terraform apply -auto-approve -lock-timeout=120s tfplan
  environment:
    name: production/cloudflare
  rules:
    - !reference [.skip-schedule-web, rules]
    # Cloudflare-only: an unrelated terraform/tailscale change must not fire a
    # Cloudflare plan+apply (which could revert out-of-band Cloudflare drift).
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-terraform-cloudflare, changes]

# Ansible Infrastructure

deploy-ansible-base:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-base
  needs:
    - job: validation-gate
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    # LOKI_PUSH_USER/PASSWORD now come from the shared .deploy-base (alloy_host
    # needs them on any site.yml-based deploy, not just this job).
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/base.yml
    # base.yml doesn't include node_exporter_host, alloy_host, or
    # encrypted_swap (those live in site.yml); when changes touch them we
    # follow up with a tag-scoped site.yml run so the rules block below stays
    # honest. Idempotent if none changed; the tag filter skips everything else
    # in site.yml. encrypted_swap was listed in the TRIGGERS below but missing
    # from this tag list, so the job went green on every role change while the
    # role never executed on any host (caught when the NAS reboot activated
    # nothing: /etc/crypttab empty fleet-wide). The role writes the crypttab +
    # fstab + boot finalize config idempotently; encrypted swap activates on each
    # host's next reboot (there is no live switchover).
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --tags node_exporter_host,alloy_host,encrypted_swap
  environment:
    name: production/ansible-base
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/base/**/*
        - ansible/roles/nic_tuning/**/*
        # Transitive: resolv_conf is invoked by base when skip_dns_config=false.
        - ansible/roles/resolv_conf/**/*
        # node_exporter_host + alloy_host live in site.yml and run on the
        # same host set base does. The script above runs site.yml with
        # --tags node_exporter_host,alloy_host as a second step so these
        # changes actually deploy when this rule fires.
        - ansible/roles/node_exporter_host/**/*
        - ansible/roles/alloy_host/**/*
        # apt_signed_repo is the shared signed-repo helper alloy_host includes;
        # list it so a helper-only change still triggers the base deploy (same
        # pattern prometheus_exporter uses under deploy-ansible-dns/storage).
        - ansible/roles/apt_signed_repo/**/*
        # textfile_collector is the shared unit/timer scaffold node_exporter_host
        # includes for its corosync/zpool/smartmon collectors; list it so a
        # helper-only change still triggers the node_exporter_host deploy.
        - ansible/roles/textfile_collector/**/*
        # encrypted_swap runs in site.yml's proxmox play (dm-crypt random-key
        # swap on all six hosts) — a role-only change must trigger this deploy.
        - ansible/roles/encrypted_swap/**/*
        - ansible/playbooks/base.yml
        # all.yml triggers deploy for alloy_host_version (host-side apt pin
        # applied by the tag-scoped site.yml follow-up above) and other
        # base-consumed pins; unrelated bumps re-run an idempotent play
        # (deploy-gitlab precedent).
        - ansible/inventories/prod/group_vars/all.yml
        - ansible/playbooks/site.yml
        - ansible/inventories/prod/group_vars/proxmox.yml
        # hosts.yml: host roster/IP/topology changes must redeploy the base play
        - ansible/inventories/prod/hosts.yml
        # Proxmox-host host_vars (e.g. per-NIC nic_tuning overrides) must
        # likewise redeploy the base play so the change actually lands — the
        # role/all.yml/proxmox.yml triggers above never see a host_vars-only
        # edit. Listed explicitly per host (not a pve-*.yml glob) so the
        # deploy-coverage gate credits each path — it ignores wildcards by design.
        - ansible/inventories/prod/host_vars/pve-opt-01.yml
        - ansible/inventories/prod/host_vars/pve-opt-02.yml
        - ansible/inventories/prod/host_vars/pve-opt-03.yml
        - ansible/inventories/prod/host_vars/pve-nas-01.yml

# Proxmox host configuration (qol, postfix_null_client, tailscale)
deploy-ansible-proxmox:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-proxmox
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    TAILSCALE_AUTH_KEY: "op://Homelab/Tailscale Auth Key/credential"
  script:
    - cd ansible
    # Deploy qol, postfix_null_client, tailscale, zfs_arc_cap, vfio_passthrough,
    # nfs_tls to proxmox hosts. nfs_tls was missing from this tag list while
    # group_vars/proxmox.yml enables it fleet-wide: site.yml applies it to the
    # five non-NAS hosts (pve-nas-01 gets the server-mode setup from
    # storage.yml), and no job ran that tag, so tlshd went unmanaged on five of
    # six hosts while the path-level coverage gate stayed green off the storage
    # job. Same shape as the encrypted_swap gap noted on deploy-ansible-base.
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --limit proxmox --tags qol,postfix_null_client,tailscale,zfs_arc_cap,vfio_passthrough,nfs_tls
  environment:
    name: production/ansible-proxmox
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/qol/**/*
        - ansible/roles/tailscale/**/*
        - ansible/roles/postfix_null_client/**/*
        - ansible/roles/zfs_arc_cap/**/*
        - ansible/roles/vfio_passthrough/**/*
        # tlshd (client mode) on the five non-NAS Proxmox hosts — the tank-proxmox
        # storage.cfg entry mounts with xprtsec=tls on every node, so all six need
        # it; deploy-ansible-storage only reaches pve-nas-01.
        - ansible/roles/nfs_tls/**/*
        # This job RUNS site.yml plays (--limit proxmox); a change to those
        # plays must redeploy too (idempotent, so extra triggers are safe).
        - ansible/playbooks/site.yml
        # Inventory inputs of the proxmox-host plays (NOT all.yml: its
        # tailscale/plex pins deploy via manual maintenance jobs by design).
        - ansible/inventories/prod/group_vars/proxmox.yml
        - ansible/inventories/prod/hosts.yml

deploy-ansible-firewall:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-firewall
  needs:
    - job: validation-gate
    - job: deploy-ansible-proxmox
      optional: true
  script:
    - cd ansible
    # Firewall is applied to proxmox hosts, dns, and mail via site.yml
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --tags proxmox_firewall
  environment:
    name: production/ansible-firewall
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/proxmox_firewall/**/*
        # Per-guest firewall assignments (guest_security_groups / firewall_ipsets)
        # live ONLY in hosts.yml, not the role — without this an inventory-only
        # firewall edit silently never deploys. site.yml now has a `hosts: k3s`
        # firewall play so --tags proxmox_firewall also reaches k3s guest .fw.
        # The ipset/security-group render reads the ENTIRE inventory (every
        # host's ansible_host + firewall_ipsets membership), so any inventory
        # file can change the rendered firewall — trigger on all of it.
        - ansible/inventories/prod/**/*
        # The proxmox_firewall plays (proxmox/dns/mail/services/k3s — which host
        # groups + tags they target) live in site.yml, which this job RUNS as
        # `site.yml --tags proxmox_firewall`. A change to those plays must also
        # redeploy; without this a future firewall-play edit would merge unrun.
        - ansible/playbooks/site.yml
        # Named explicitly, not just covered by the inventory glob above: the
        # coverage gate deliberately refuses to let a `**` glob confer coverage
        # on a group_vars file, so that every one names the job that rolls it
        # out. `services` is the HAOS group — Ansible never connects to it, and
        # this job is the only one that reaches it (by delegating to a Proxmox
        # host to write the guest .fw).
        - ansible/inventories/prod/group_vars/services.yml

deploy-ansible-dns:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-dns
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    ADGUARD_ADMIN_PASSWORD: "op://Homelab/AdGuard Home/password"
    DNS01_SSH_PRIVATE_KEY: "op://Homelab/DNS-01 SSH Key/private key"
    DNS01_SSH_PUBLIC_KEY: "op://Homelab/DNS-01 SSH Key/public key"
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/dns.yml
  environment:
    name: production/ansible-dns
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/unbound/**/*
        - ansible/roles/adguard_home/**/*
        - ansible/roles/adguard_sync/**/*
        - ansible/roles/postfix_null_client/**/*
        # Transitive: resolv_conf used by adguard_home; unbound_exporter
        # invoked from dns.yml.
        - ansible/roles/resolv_conf/**/*
        - ansible/roles/unbound_exporter/**/*
        # unbound_exporter is a thin wrapper over prometheus_exporter (the
        # shared install pipeline), so a change to the shared role must
        # redeploy dns too. It also backs zfs_exporter, so the same path is
        # listed under deploy-ansible-storage.
        - ansible/roles/prometheus_exporter/**/*
        - ansible/playbooks/dns.yml
        # all.yml triggers deploy for unbound_exporter_version /
        # adguard-stack pins consumed by dns.yml; unrelated bumps re-run an
        # idempotent play (deploy-gitlab precedent).
        - ansible/inventories/prod/group_vars/all.yml
        # DNS group/host vars: lxc settings, ssh policy, cert distribution
        # targets — all consumed by the dns playbook, so a vars-only change
        # must trigger a redeploy.
        - ansible/inventories/prod/group_vars/dns.yml
        - ansible/inventories/prod/host_vars/dns-01.yml
        - ansible/inventories/prod/host_vars/dns-02.yml
        # hosts.yml: DNS host IPs/roster
        - ansible/inventories/prod/hosts.yml

deploy-ansible-storage:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-storage
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
  variables:
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SAMBA_NAS_PASSWORD: "op://Homelab/Samba NAS User/password"
    # B2 offsite backup (restic_offsite role, runs on pve-nas-01 via storage.yml).
    # The role reads these from env via the secrets: dict / lookup('ansible.builtin.env');
    # restic_repo_password doubles as the restic repo password.
    # restic_* fields = the RESTRICTED hide-only key (no deleteFiles). The
    # b2_key_id/b2_application_key fields on the same item stay the FULL
    # bucket-settings key for scripts/b2-bucket-drift.py (lifecycle/SSE +
    # retention reads/writes the restricted key lacks) — capability split per
    # docs/42 Step 0.
    B2_KEY_ID: "op://Homelab/B2 Archive Backup/restic_key_id"
    B2_APPLICATION_KEY: "op://Homelab/B2 Archive Backup/restic_application_key"
    RESTIC_REPO_PASSWORD: "op://Homelab/B2 Archive Backup/restic_repo_password"
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/storage.yml
  environment:
    name: production/ansible-storage
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/nas_storage/**/*
        # zfs_exporter is invoked from storage.yml; nfs_tls is the
        # opt-in NFSv4-over-TLS daemon that runs on the same NAS host
        # plus the k3s NFS clients (cert paths shared with acme_certs).
        - ansible/roles/zfs_exporter/**/*
        # zfs_exporter is a thin wrapper over prometheus_exporter (the
        # shared install pipeline), so a change to the shared role must
        # redeploy storage too. It also backs unbound_exporter, so the
        # same path is listed under deploy-ansible-dns.
        - ansible/roles/prometheus_exporter/**/*
        - ansible/roles/nfs_tls/**/*
        # Declarative storage.cfg + vzdump jobs — runs from storage.yml on
        # pve-nas-01 (cluster-wide config, idempotent).
        - ansible/roles/proxmox_backup/**/*
        # restic_offsite is the nightly B2 backup role, deployed on pve-nas-01
        # via storage.yml (chained after archive-backup). A role-only change
        # must redeploy storage.
        - ansible/roles/restic_offsite/**/*
        # Inventory inputs: pve-nas-01 host_vars carry the NFS exports, zvol + vzdump config the storage play renders
        - ansible/inventories/prod/host_vars/pve-nas-01.yml
        - ansible/inventories/prod/group_vars/proxmox.yml
        - ansible/inventories/prod/hosts.yml
        - ansible/playbooks/storage.yml
        # all.yml triggers deploy for restic_version/rclone_version/
        # zfs_exporter_version bumps (host-side pins with no other deploy
        # path); may also fire on unrelated bumps but the playbook is
        # idempotent — mirrors the deploy-gitlab/nextcloud/immich precedent.
        - ansible/inventories/prod/group_vars/all.yml

deploy-ansible-mail:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-mail
  needs:
    - job: validation-gate
    - job: deploy-ansible-dns
      optional: true
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    SMTP_GMAIL_USER: "op://Homelab/SMTP Relay Gmail/username"
    SMTP_GMAIL_PASSWORD: "op://Homelab/SMTP Relay Gmail/password"
    DNS01_SSH_PUBLIC_KEY: "op://Homelab/DNS-01 SSH Key/public key"
  script:
    - cd ansible
    # Mail roles are deployed via site.yml with host targeting
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --limit mail
  environment:
    name: production/ansible-mail
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/smtp_relay/**/*
        - ansible/roles/postfix_null_client/**/*
        # textfile_collector is the shared unit/timer scaffold smtp_relay includes
        # for its postfix queue collector; list it so a helper-only change still
        # triggers the mail deploy.
        - ansible/roles/textfile_collector/**/*
        # Mail group vars: relay/null-client settings consumed by the
        # site.yml --limit mail run, so a vars-only change must trigger
        # a redeploy (mirrors group_vars/dns.yml on the dns job).
        - ansible/inventories/prod/group_vars/mail.yml
        # smtp-relay host_vars + host roster
        - ansible/inventories/prod/host_vars/smtp-relay.yml
        - ansible/inventories/prod/hosts.yml
        # This job RUNS site.yml plays (--limit mail); a change to those
        # plays must redeploy too.
        - ansible/playbooks/site.yml

deploy-ansible-certs:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-certs
  variables:
    # acme_certs asserts acme_email on dns-01, and acme_email <- admin_email <-
    # ROOT_EMAIL_ALIAS. Every other deploy job injects this op:// ref; it was
    # missing here, so `op run` left admin_email undefined and the play failed
    # the "Validate required acme.sh variables" assert (the SSH-key fields, by
    # contrast, are handled via `op read` in script below).
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
  needs:
    - job: validation-gate
    - job: deploy-ansible-dns
      optional: true
    - job: deploy-ansible-mail
      optional: true
  script:
    - cd ansible
    # `op run` does NOT inject an SSH-KEY item's private/public key fields into
    # the environment for a service-account token (it resolves them to empty),
    # so acme_certs saw DNS01_SSH_* unset. `op read` DOES resolve them — the same
    # call .deploy-base uses to fetch the SSH connection key — so read them
    # explicitly here, then run ansible. (Not in `variables:` as op:// refs,
    # because that path goes through op run's broken SSH-key injection.)
    - |
      DNS01_SSH_PRIVATE_KEY="$(op read 'op://Homelab/DNS-01 SSH Key/private key')"
      DNS01_SSH_PUBLIC_KEY="$(op read 'op://Homelab/DNS-01 SSH Key/public key')"
      if [ -z "$DNS01_SSH_PRIVATE_KEY" ] || [ -z "$DNS01_SSH_PUBLIC_KEY" ]; then
        echo "ERROR: op read returned empty DNS-01 SSH Key material (check the service account's vault access to 'DNS-01 SSH Key')." >&2
        exit 1
      fi
      export DNS01_SSH_PRIVATE_KEY DNS01_SSH_PUBLIC_KEY
    # Certificate roles via site.yml; op run resolves the remaining op:// vars.
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --limit dns --tags acme_certs
  environment:
    name: production/ansible-certs
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/acme_certs/**/*
        # host_vars/dns-01.yml carries the pinned host_key entries that
        # acme_certs uses for cert distribution; a change to those
        # fingerprints needs a redeploy.
        - ansible/inventories/prod/host_vars/dns-01.yml
        # This job RUNS site.yml plays (--limit dns --tags acme_certs); a
        # change to those plays must redeploy too.
        - ansible/playbooks/site.yml
        # hosts.yml: cert-distribution target addresses.
        - ansible/inventories/prod/hosts.yml

# Ansible Applications (VMs/LXC)

deploy-plex:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-plex
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
  variables:
    # plex.yml runs postfix_null_client, which renders mail_aliases
    # (root -> admin_email -> ROOT_EMAIL_ALIAS); without it the aliases
    # task fails with AnsibleUndefinedVariable. Mirrors the other deploy jobs.
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    # Plex custom-certificate PFX passphrase (matches the value configured
    # in Plex Settings -> Network -> "Custom certificate encryption key").
    # The plex role asserts this is non-empty before re-keying.
    PLEX_PFX_PASSPHRASE: "op://Homelab/Plex Custom Certificate/password"
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/plex.yml
  environment:
    name: production/plex
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/plex/**/*
        # apt_signed_repo: shared signed-repo helper plex includes (Debian
        # non-free repo pin) — a helper-only change must still deploy plex.
        - ansible/roles/apt_signed_repo/**/*
        - ansible/roles/proxmox_lxc/**/*
        # base + postfix_null_client + proxmox_firewall are first-class roles in
        # this app's playbook, and this is the ONLY job that runs them on this
        # host: deploy-ansible-base runs base.yml (hosts: base_managed, which
        # excludes the app guests) and deploy-ansible-firewall's site.yml plays
        # cover the Proxmox/DNS/mail/k3s guests, not this one. Without these
        # paths an ssh-hardening, sshd, common-packages or guest-firewall change
        # merged green while never reaching this host — the gap
        # scripts/check-deploy-host-coverage.py now fails on.
        - ansible/roles/base/**/*
        - ansible/roles/postfix_null_client/**/*
        - ansible/roles/proxmox_firewall/**/*
        - ansible/playbooks/plex.yml
        # Inventory inputs of the plex play (LXC definition + app vars).
        - ansible/inventories/prod/group_vars/plex_servers.yml
        - ansible/inventories/prod/host_vars/plex.yml
        - ansible/inventories/prod/hosts.yml

deploy-gitlab:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-gitlab
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
  variables:
    # GitLab role reads secrets from env vars via lookup('ansible.builtin.env', ...)
    # op run resolves op:// references in environment variables at runtime
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    GITLAB_ROOT_PASSWORD: "op://Homelab/GitLab/root-password"
    GITLAB_SAML_CERT_FINGERPRINT: "op://Homelab/GitLab SSO/saml-cert-fingerprint"
    # Personal Access Token used by the role's Web IDE Application Settings
    # API calls (vscode_extension_marketplace_*). The gitlab role asserts
    # this is set and resolved (not still an op:// reference) before the
    # API block runs.
    GITLAB_API_TOKEN: "op://Homelab/GitLab API Token/credential"
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/gitlab.yml
    - |
      # Wait for GitLab API to come back after reconfigure (up to 5 min)
      echo "Waiting for GitLab API..."
      gitlab_healthy=false
      start_ts=$(date +%s)
      while true; do
        if curl -sf --max-time 5 https://git.ericsweiss.com/-/readiness > /dev/null 2>&1; then
          elapsed=$(( $(date +%s) - start_ts ))
          echo "GitLab API healthy after ${elapsed}s"
          gitlab_healthy=true
          break
        fi
        elapsed=$(( $(date +%s) - start_ts ))
        if [ "$elapsed" -ge 300 ]; then break; fi
        [ $((elapsed % 20)) -lt 3 ] && echo "Still waiting... (${elapsed}s)"
        sleep 2
      done
      if [ "$gitlab_healthy" != "true" ]; then
        echo "ERROR: GitLab API did not become healthy in 300s"
        exit 1
      fi
  environment:
    name: production/gitlab
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        - ansible/roles/gitlab/**/*
        # apt_signed_repo: shared signed-repo helper the gitlab role includes
        # for the GitLab omnibus apt repo — a helper-only change must deploy it.
        - ansible/roles/apt_signed_repo/**/*
        # zvol_mount is invoked by the gitlab role for the
        # /mnt/gitlab-repos persistent volume.
        - ansible/roles/zvol_mount/**/*
        # nfs_tls: the backup NFS mount requires xprtsec=tls (tlshd on the VM).
        - ansible/roles/nfs_tls/**/*
        # base + postfix_null_client + proxmox_firewall are first-class roles in
        # this app's playbook, and this is the ONLY job that runs them on this
        # host: deploy-ansible-base runs base.yml (hosts: base_managed, which
        # excludes the app guests) and deploy-ansible-firewall's site.yml plays
        # cover the Proxmox/DNS/mail/k3s guests, not this one. Without these
        # paths an ssh-hardening, sshd, common-packages or guest-firewall change
        # merged green while never reaching this host — the gap
        # scripts/check-deploy-host-coverage.py now fails on.
        - ansible/roles/base/**/*
        - ansible/roles/postfix_null_client/**/*
        - ansible/roles/proxmox_firewall/**/*
        - ansible/playbooks/gitlab.yml
        # gitlab_servers group vars (postfix null-client, kernel tuning) are
        # consumed by the gitlab playbook, so a vars-only change must redeploy.
        - ansible/inventories/prod/group_vars/gitlab_servers.yml
        # hosts.yml: VM definition (IP/zvols/resources) for this play's host
        - ansible/inventories/prod/hosts.yml
        # all.yml triggers deploy for gitlab_version changes; may also trigger
        # on unrelated version bumps but the playbook is idempotent and safe to re-run
        - ansible/inventories/prod/group_vars/all.yml

