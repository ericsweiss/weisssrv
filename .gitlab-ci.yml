# Read-only drift check for the B2 backup-bucket settings against the live
# bucket via the raw B2 API (scripts/b2-bucket-drift.py — the codified config;
# it replaced the terraform/b2 module after the Backblaze provider's READ path
# started returning empty attributes against B2's current API, which made
# terraform plan report a permanent phantom diff). Never applies: reconciling
# is the supervised `task b2:apply`. A DRIFT result = an out-of-band
# Backblaze-console edit; allow_failure so drift, or an API hiccup, surfaces
# without blocking CI.
b2-drift-plan:
  needs: []
  stage: validate
  image: python:3.11-slim
  before_script:
    - !reference [.install-1password, before_script]
  script:
    - |
      export B2_APPLICATION_KEY_ID=$(op read "op://Homelab/B2 Archive Backup/b2_key_id")
      export B2_APPLICATION_KEY=$(op read "op://Homelab/B2 Archive Backup/b2_application_key")
      # --config is explicit: the script's default is CWD-relative, and this job
      # runs from the repo root where b2-bucket.json does not exist (it lives in
      # scripts/), so the bare invocation dies on a missing-file error before it
      # ever reaches B2.
      python3 scripts/b2-bucket-drift.py --config scripts/b2-bucket.json
  # b2-bucket-drift.py INVERTS terraform's codes (0 clean, 1 drift, 2 error — see
  # its --help), so the advisory pass is exit_codes:[1], not [2]. Drift (1) is the
  # yellow signal; an API/auth ERROR (2) fails RED instead of masquerading as
  # allowed drift. Repair stays supervised.
  allow_failure:
    exit_codes: [1]
  rules:
    # Schedule is the real detector: no changes: filter, so it catches
    # out-of-band Backblaze-console edits when nothing in-repo changed.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $OP_SERVICE_ACCOUNT_TOKEN'
    # Post-merge validation of a drift-script change against the live bucket.
    # NO merge_request_event rule — same credential-scope reasoning as the two
    # drift plans above; the script and its bucket config are covered pre-merge
    # by python-tests.
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-b2-drift, changes]

# Validate the kube-prometheus-stack alert rules (PromQL in HelmRelease values)
# and the Alertmanager config (ExternalSecret template) that kubeconform /
# flux-lint can't parse. Without this, a bad expr or malformed route only
# surfaces post-merge when the prometheus-operator admission webhook rejects the
# rendered CR (failing the whole HelmRelease upgrade). See docs/33.
prometheus-config-lint:
  needs: []
  stage: lint
  image: python:3.11-slim
  # Cache promtool + amtool across runs, keyed on .gitlab-ci.yml (versions +
  # sha256s live there). No-op without a runner cache backend.
  cache:
    key:
      prefix: prom-tools
      files:
        - .gitlab-ci.yml
    paths:
      - .cache/prom-tools
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl
    - pip install --quiet "pyyaml==${PYYAML_VERSION}"
    - |
      set -eo pipefail
      # promtool (prometheus) + amtool (alertmanager), pinned + sha256 like every
      # other downloaded binary in this pipeline. The cache holds VERIFIED
      # TARBALLS: every run — hit or miss — re-checks the pinned sha256 and
      # re-extracts, so a mutated runner cache can't smuggle in an unverified
      # binary. set -eo pipefail so a failing sha256sum -c aborts the block.
      TOOLS_CACHE="${CI_PROJECT_DIR}/.cache/prom-tools"
      mkdir -p "$TOOLS_CACHE"
      fetch_verified() { # <file> <url> <sha256>
        if ! echo "$3  $TOOLS_CACHE/$1" | sha256sum -c - >/dev/null 2>&1; then
          curl -fsSL -o "$TOOLS_CACHE/$1" "$2"
          echo "$3  $TOOLS_CACHE/$1" | sha256sum -c -
        fi
      }
      PROM_VERSION="3.6.0"
      fetch_verified prom.tar.gz \
        "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
        2002ef4a55a64161affccd2786c7081d4e3b3a8d08786a98b3bb110971414916
      tar xzf "$TOOLS_CACHE/prom.tar.gz" -C /usr/local/bin --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"
      AM_VERSION="0.28.1"
      fetch_verified am.tar.gz \
        "https://github.com/prometheus/alertmanager/releases/download/v${AM_VERSION}/alertmanager-${AM_VERSION}.linux-amd64.tar.gz" \
        5ac7ab5e4b8ee5ce4d8fb0988f9cb275efcc3f181b4b408179fafee121693311
      tar xzf "$TOOLS_CACHE/am.tar.gz" -C /usr/local/bin --strip-components=1 "alertmanager-${AM_VERSION}.linux-amd64/amtool"
      promtool --version && amtool --version
  script:
    - bash scripts/lint-prometheus-config.sh
    # Behavioural half of the gate: amtool check-config accepts a route reorder
    # that silences Watchdog and a one-sided alertname rename that unbinds an
    # inhibit pair. Same pairing as `task lint:prometheus-config`.
    - python3 scripts/check-alertmanager-behaviour.py --config scripts/alertmanager-behaviour.yaml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-prometheus-config, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-prometheus-config, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Pre-merge dry run of what the deploy jobs will do. The Ansible deploys are
# main-only, so a deploy-breaking change used to be first observed against live
# infrastructure — three of six main pipelines in one 6h window failed in the
# deploy stage and needed a four-MR hotfix chain (!215 -> !216 -> !217 -> !219).
#
# CREDENTIAL-FREE BY DESIGN. The obvious version of this job — the same
# playbooks under `op run` with `--check --diff` — is deliberately NOT what runs
# here, for three reasons: it would materialize the 1Password service-account
# token and the deploy SSH private key into a job whose CI config and playbook
# code come from the branch under review; that token is PROTECTED, so such a job
# would never be created on an MR ref anyway; and `--check` fidelity is poor
# against the collection's roles, where command/shell/API tasks largely skip
# under check_mode, so a green run would be weak evidence.
#
# What it does check, offline: the collection pin resolves and installs (the
# !213/!218 class), every playbook a deploy job names exists, and every `--tags`
# selection those jobs pass reaches a real task. That last one is the hazard
# this file documents but nothing enforced: a tag that matches nothing makes
# ansible-playbook exit 0 having done nothing, so the deploy job stays green
# while deploying nothing at all.
#
# It also asserts its own COMPLETENESS: every `ansible-playbook` occurrence in a
# candidate job's script must be parsed into an invocation. Coverage that shrinks
# because the parser cannot read a job's shape is the failure this gate would
# otherwise reproduce — the thing it exists to prevent.
#
# NOT covered, and worth stating plainly:
#   * an op:// variable a job forgets to declare (the !216/!217 class) —
#     inventory vars are templated lazily, so only a real run evaluates them;
#   * invocations a job DELEGATES to a wrapper script. The parser reads
#     `job['script']` only, so `maintenance-run-all` (whose whole script is
#     `bash scripts/maintenance-run-with-verify.sh bash scripts/maintenance-all-ops.sh`)
#     contributes zero invocations and its completeness assertion passes
#     vacuously at 0-of-0. The six `ansible-playbook` calls inside
#     maintenance-all-ops.sh duplicate the individual maintenance jobs today, so
#     coverage is not actually lost — but a playbook or `--tags` added ONLY
#     there would go unchecked. Closing it means following `bash scripts/*.sh`
#     targets, which would also make that 0-of-0 assertion meaningful.
deploy-preflight:
  needs: []
  stage: validate
  # Full image, not slim: ansible-galaxy installs weisssrv.infra from a git+ URL.
  image: python:3.13
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - pip install --quiet "ansible==${ANSIBLE_VERSION}" "pyyaml==${PYYAML_VERSION}"
    - for i in 1 2 3; do ansible-galaxy collection install -r ansible/requirements.yml && break; [ "$i" = 3 ] && exit 1; echo "galaxy install failed (attempt $i) — retrying in 20s"; sleep 20; done
  script:
    - |
      python3 - <<'PREFLIGHT'
      import re
      import shlex
      import subprocess
      import sys
      from pathlib import Path

      import yaml

      class Loader(yaml.SafeLoader):
          pass

      # The pipeline uses !reference throughout; resolve every unknown tag to None.
      Loader.add_multi_constructor("!", lambda *_: None)

      ANSIBLE_DIR = Path("ansible")
      pipeline = yaml.load(Path(".gitlab-ci.yml").read_text(), Loader=Loader)

      VALUE_FLAGS = ("-i", "--inventory", "--inventory-file", "-e", "--extra-vars")

      def invocations(text):
          """Every `ansible-playbook` call in a job's script -> (inventory, playbook, argv).

          Split on the binary name and read the argv, rather than matching a
          fixed argument ORDER: the old positional regex required the playbook
          to be the token straight after `-i <inv>`, so it skipped
          `-i <inv> -e "..." <playbook>` entirely, and its `[^\\n]*` tail
          swallowed a second invocation whenever a YAML flow scalar folded two
          `op run --` calls onto one line. Both shapes are in this file.
          """
          found = []
          for segment in text.split("ansible-playbook")[1:]:
              # The next shell command is not part of this argv.
              segment = re.split(r"[;&|\n]", segment, maxsplit=1)[0]
              try:
                  tokens = shlex.split(segment)
              except ValueError:
                  # An unbalanced quote is the tail of the enclosing `bash -c '...'`.
                  tokens = segment.replace('"', " ").replace("'", " ").split()
              inventory = None
              playbook = None
              index = 0
              while index < len(tokens):
                  token = tokens[index]
                  if token in VALUE_FLAGS:
                      if token.startswith("-i") or token.startswith("--inventory"):
                          inventory = tokens[index + 1] if index + 1 < len(tokens) else None
                      index += 2
                      continue
                  if playbook is None and not token.startswith("-") and token.endswith(".yml"):
                      playbook = token
                  index += 1
              if playbook:
                  found.append((inventory, playbook, " ".join(tokens)))
          return found

      TAGS = re.compile(r"--(?:skip-)?tags[= ]+(?P<tags>[A-Za-z0-9_,.-]+)")
      # `--list-tasks` prints one `TAGS: [a, b]` per selected task. `always`
      # tasks are printed for ANY selection, so presence of output proves
      # nothing — the requested tag must appear in a task's own tag list.
      TASK_TAGS = re.compile(r"TAGS: \[([^\]]*)\]")

      failures = []
      playbooks = set()
      selections = 0

      for name, job in pipeline.items():
          if not isinstance(job, dict) or name.startswith("."):
              continue
          # extends is a string OR a list; a job naming several parents must
          # not slip the preflight.
          parents = job.get("extends") or []
          if isinstance(parents, str):
              parents = [parents]
          if not {".deploy-base", ".maintenance-base"}.intersection(parents):
              continue
          script = "\n".join(str(line) for line in job.get("script") or [])
          parsed = invocations(script)
          # Refuse to shrink silently. A shape the parser cannot read used to
          # cost coverage with no output at all — the headline assertion (a
          # `--tags` selection that reaches no task) simply went unchecked for
          # that job while the summary line still printed a count.
          written = script.count("ansible-playbook")
          if len(parsed) < written:
              failures.append(
                  f"{name}: parsed {len(parsed)} of {written} `ansible-playbook` "
                  "invocation(s) — this job is written in a shape the preflight "
                  "parser does not understand, so its playbook/tag checks were "
                  "skipped. Fix invocations() rather than the job."
              )
          for inventory, playbook, argv in parsed:
              if not (ANSIBLE_DIR / playbook).is_file():
                  failures.append(f"{name}: playbook ansible/{playbook} does not exist")
                  continue
              playbooks.add(playbook)
              tags = sorted({
                  t
                  for m in TAGS.finditer(argv)
                  for t in m.group("tags").split(",")
                  if t
              })
              inventory_argv = ["-i", inventory] if inventory else []
              for tag in tags:
                  selections += 1
                  proc = subprocess.run(
                      ["ansible-playbook", *inventory_argv, playbook,
                       "--list-tasks", "--tags", tag],
                      cwd=ANSIBLE_DIR, capture_output=True, text=True,
                  )
                  if proc.returncode != 0:
                      failures.append(
                          f"{name}: --list-tasks failed for {playbook} --tags {tag}\n"
                          f"{proc.stderr.strip()}"
                      )
                      continue
                  selected = any(
                      tag in [t.strip() for t in m.group(1).split(",")]
                      for m in TASK_TAGS.finditer(proc.stdout)
                  )
                  if selected:
                      print(f"OK   {name}: {playbook} --tags {tag}")
                  else:
                      failures.append(
                          f"{name}: `--tags {tag}` on {playbook} selects NO task — "
                          "that deploy step is a silent no-op"
                      )

      if not playbooks:
          failures.append(
              "preflight resolved 0 playbooks — candidate-job selection or "
              "invocation parsing is no longer inspecting the deploy jobs"
          )
      if selections == 0:
          failures.append(
              "preflight resolved 0 tag selections — the silent-no-op tag "
              "guard inspected nothing"
          )

      print(f"\n{len(playbooks)} playbook(s), {selections} tag selection(s) checked")
      if failures:
          print("", file=sys.stderr)
          for f in failures:
              print(f"FAIL {f}", file=sys.stderr)
          sys.exit(1)
      PREFLIGHT
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: !reference [.paths-deploy-preflight, changes]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.paths-deploy-preflight, changes]
    - if: '$CI_PIPELINE_SOURCE == "web"'

# TEST STAGE - Integration tests
#
# The matrix itself lives in .gitlab/ci/integration-jobs.yml (included
# below) so `.paths-integration` can trigger on that file instead of this
# one — see the header there.

# SHARED CI LIBRARY (eric/weisssrv-lib)
#
# The generic lint/validate/test/security/review jobs and the reusable
# `.dep-cache` / `.install-1password*` / `.terraform-http-backend` fragments are
# consumed from the library via include:project at a pinned tag. Only the inputs
# that differ from a library default are passed.
#
# THE PIN IS REPEATED, AND THAT IS NOT A CHOICE. `include:` resolves at
# pipeline-CREATION time, before this file's `variables:` block exists, so
# `ref: $WEISSSRV_LIB_REF` silently does not work. (A project-level CI/CD
# variable IS readable there, but it would move the pin out of git, where a
# library bump stops showing up in a diff and cannot be reverted as an MR.)
# variables.WEISSSRV_LIB_REF is the single source of truth and
# scripts/check-lib-pins.py fails the pipeline if any entry drifts from it or
# pins a branch; `--fix` rewrites them. Bump the variable, then run --fix.
#
# GitLab's managed Secret-Detection template is pulled in by the library's
# secret-detection component, which overrides that job — including it directly
# here as well would be redundant.
include:
  # Local: the integration-test matrix, split out so its `changes:` trigger can
  # name a file that only it lives in (see the header there).
  - local: .gitlab/ci/integration-jobs.yml

  # Reusable fragments, no jobs of their own. terraform-http-backend's defaults
  # already describe this instance and the cloudflare state; the three
  # terraform drift-plan jobs (tailscale, authentik, unifi) override the three
  # TF_HTTP_*ADDRESS vars for their own state names.
  - project: eric/weisssrv-lib
    ref: v0.15.0
    file:
      - /ci/templates/dep-cache.yml
      - /ci/templates/install-1password.yml
      - /ci/templates/terraform-http-backend.yml

  # These take the library defaults verbatim, so they share ONE entry (`file:`
  # accepts a list; `inputs:` bind per ENTRY, so anything parameterized needs
  # its own entry below).
  #   terraform: emits BOTH terraform-fmt (lint) and terraform-validate
  #     (validate) over terraform/ and terraform/*/.
  #   secret_detection: overrides GitLab's managed job (modern-CPU node
  #     selector, allow_failure, MR/main/schedule rules); the hard block comes
  #     from validation-gate needing this job non-optionally.
  - project: eric/weisssrv-lib
    ref: v0.15.0
    file:
      - /ci/security/secret-detection.yml

  # terraform validate: pinned to the exact patch release the local plan/apply
  # jobs run. The floating :1.15 tag plus per-node IfNotPresent image caches is
  # how a plan file gets written by 1.15.9 and refused by a 1.15.8 apply — it
  # failed the 2026-08-23 deploy pipeline until the stale image was swept off
  # every agent node. One version, spelled everywhere.
  - project: eric/weisssrv-lib
    ref: v0.15.0
    file: /ci/validate/terraform.yml
    inputs:
      image: hashicorp/terraform:1.15.9

  # yaml-lint: the library default targets `.gitlab/ci/` only; lint all of
  # `.gitlab/` so the agent config is covered alongside the CI fragments.
  - project: eric/weisssrv-lib
    ref: v0.15.0
    file: /ci/lint/yaml-lint.yml
    inputs:
      targets: "ansible/ kubernetes/ .gitlab-ci.yml .gitlab/"
      changes:
        - "ansible/**/*"
        - "kubernetes/**/*"
        - ".gitlab-ci.yml"
        - ".gitlab/**/*"

  # shellcheck: `find_dir` is empty and `ansible/*.sh` is gone from the default
  # globs — the shell the roles ship now lives in the weisssrv.infra collection,
  # where the library's own pipeline shellchecks it. What is left is scripts/
  # plus the terraform helper scripts the default set missed.
  - project: eric/weisssrv-lib
    ref: v0.15.0
    file: /ci/lint/shellcheck.yml
    inputs:
      direct_globs: "scripts/*.sh terraform/*/*.sh"
      find_dir: ""
      changes:
        - "scripts/**/*"
        - "terraform/*/*.sh"

  # ansible-lint: playbooks, inventories and the integration scenarios. The
  # roles they address by FQCN come from the collection, so the pin is installed
  # first (galaxy_requirements). ansible-lint's own syntax-check rule runs
  # `ansible-playbook --syntax-check` per playbook, so no separate loop.
  #
  # No `config:` input: the job runs from the repo root and ansible-lint only
  # walks UP from its cwd, so the config is ./.ansible-lint. It is in `changes:`
  # so a profile edit re-runs the job.
  - project: eric/weisssrv-lib
    ref: v0.15.0
    file: /ci/lint/ansible-lint.yml
    inputs:
      targets: "ansible/"
      galaxy_requirements: "ansible/requirements.yml"
      # Full image, not slim: galaxy installs the collection from a git+ URL,
      # which needs the git executable.
      image: python:3.13
      changes:
        - "ansible/**/*"
        - ".ansible-lint"
        - ".gitlab-ci.yml"

  # python-lint: ruff over the helper scripts, using the library's shared
  # profile vendored to this repo's root as ruff.toml.
  - project: eric/weisssrv-lib
    ref: v0.15.0
    file: /ci/lint/python-lint.yml
    inputs:
      targets: "scripts kubernetes"
      config: "--config ruff.toml"
      changes:
        - "scripts/**/*.py"
        - "kubernetes/**/*.py"
        - "ruff.toml"
        - ".gitlab-ci.yml"

  # docs-link-check: runs weisssrv's repo-local scripts/check-doc-links.py, which
  # scans every TRACKED *.md (role/app/agent READMEs link into docs/ too), so the
  # trigger list has to be `**/*.md`-wide — the library default only covers
  # docs/ + the top-level READMEs.
  - project: eric/weisssrv-lib
    ref: v0.15.0
    file: /ci/lint/docs-link-check.yml
    inputs:
      changes:
        - "**/*.md"
        - "scripts/check-doc-links.py"

  # version-check: reports available pin updates and changes nothing — the
  # read-only half of the pair whose other half is version-bump-bot (a local job
  # below). Only the two commands differ from the library defaults.
  #
  # `changes` is deliberately NOT passed: the library default is `["**/*"]`,
  # which matches every merge request. Passing `[]` would match NOTHING and
  # delete the job silently.
  #
  # No credential input exists by design: `setup_command` and `check_command`
  # come from the branch under review, so a token fetched here would be readable
  # by that code. GITLAB_API_TOKEN stays a masked CI variable holding a project
  # token (weisssrv-bot, Reporter + api) — enough to post the MR comment, unable
  # to push. Without it, version-check-ci.py skips the comment and still writes
  # the report; that graceful skip lives in the script, not in this job.
  # NOTE: because this is a project-level masked variable it outranks any job's
  # variables: block, so the gitlab DEPLOY path must NOT reuse the name — it reads
  # its admin PAT from GITLAB_ADMIN_API_TOKEN (see the deploy-gitlab job) to avoid
  # being silently shadowed by this project token.
  - project: eric/weisssrv-lib
    ref: v0.15.0
    file: /ci/maintenance/version-check.yml
    inputs:
      setup_command: 'pip install --quiet "pyyaml==${PYYAML_VERSION}" requests==2.34.2'
      check_command: "python3 ./scripts/version-check-ci.py"

  # python-tests: pytest scripts/. Most of the suite are drift guards that read
  # files OUTSIDE scripts/, so the library default `changes` (scripts/ + docs)
  # leaves them unable to fire on their own subject.
  #
  # GOAL: every repo file a scripts/test_*.py reads matches a pattern below, so a
  # guard fires on its own subject. Derived by TRACING, not by reading the tests:
  # a sys.addaudithook over `pytest scripts/` recorded every open, and each path
  # was matched with Ruby File.fnmatch under GitLab's flags
  # (PATHNAME|DOTMATCH|EXTGLOB). Re-run that trace when adding a test rather than
  # guessing its inputs — the list is hand-maintained and only as current as the
  # last trace.
  #
  # The pytest/PyYAML pins are passed rather than left to the template defaults
  # so the variables: block above is their single source (repo-policy-checks'
  # ci-pin-parity check enforces the equality).
  #
  # setup_command clones the library at the pinned tag:
  # scripts/test_vendored_byte_identity.py compares this repo's vendored script
  # copies against it and never skips, so the checkout is a hard requirement of
  # the job (WEISSSRV_LIB_PATH points at it — see the job override below).
  - project: eric/weisssrv-lib
    ref: v0.15.0
    file: /ci/test/python-tests.yml
    inputs:
      pytest_version: "9.1.1"
      pyyaml_version: "6.0.2"
      setup_command: 'git clone --depth 1 --branch "$WEISSSRV_LIB_REF" "$CI_SERVER_URL/eric/weisssrv-lib.git" "$WEISSSRV_LIB_PATH"'
      changes:
        - "scripts/**/*"
        - "ansible/inventories/prod/**/*"
        - "ansible/playbooks/**/*"
        - "ansible/integration-tests/**/*"
        - "ansible/requirements.yml"
        - "ansible/README.md"
        - "ansible/TESTING.md"
        # test_vendored_byte_identity.py gates ruff.toml itself (VENDORED_PATHS),
        # so an edit to that file must be able to run its own gate.
        - "ruff.toml"
        - "kubernetes/clusters/weisssrv/**/*"
        - "kubernetes/infrastructure/observability/**/*"
        - "kubernetes/infrastructure/configs/**/*"
        - "kubernetes/infrastructure/sources/**/*"
        - "kubernetes/apps/**/*"
        - "kubernetes/components/**/*"
        - "kubernetes/infrastructure/controllers/**/*"
        - "kubernetes/infrastructure/crds/**/*"
        - "kubernetes/README.md"
        - "terraform/*/main.tf"
        - "terraform/tailscale/policy.hujson"
        - "terraform/*/README.md"
        - "docker/*/README.md"
        - "docs/**/*"
        - "README.md"
        - "CLAUDE.md"
        - "AGENTS.md"
        - ".cursorrules"
        - ".claude/**/*"
        - "Taskfile.yml"
        - ".gitlab-ci.yml"

  # flux-lint: substitute mode (postBuild var substitution from the cluster
  # versions ConfigMap; needs a root runner for gettext-base). Version pins +
  # cluster paths are passed explicitly. extra_validation carries weisssrv's HPA/VPA invariant,
  # scrape/NetworkPolicy invariant, ingress default-deny coverage, secret-store
  # scoping, PVC storage class and helm-values checks, which call weisssrv-local scripts (kept in scripts/),
  # running with $RENDER_ALL / $FAILED in scope. It also appends the tenants
  # tree to $RENDER_ALL first: the template's loop renders Flux Kustomizations
  # by spec.path, and tenants/ is a plain Kustomize aggregator, so a tenant's
  # own SecretStore/NetworkPolicy would otherwise never reach the corpus gates. The site data those two gates
  # read lives outside them (scripts/helm-values-releases.yaml,
  # scripts/autoscaling-policy.yaml), so both paths must be passed here exactly
  # as `task flux:lint` passes them — an omitted --releases is a FileNotFoundError
  # and an omitted --policy-config silently asserts zero chart-native targets.
  - project: eric/weisssrv-lib
    ref: v0.15.0
    file: /ci/validate/flux-lint.yml
    inputs:
      substitute: true
      kubeconform_version: "0.6.7"
      kubeconform_sha256: "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73"
      kustomize_version: "5.4.3"
      kustomize_sha256: "3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7"
      helm_version: "3.18.4"
      helm_sha256: "f8180838c23d7c7d797b208861fecb591d9ce1690d8704ed1e4cb8e2add966c1"
      pyyaml_version: "6.0.2"
      cluster_dir: "kubernetes/clusters/weisssrv"
      versions_configmap: "kubernetes/infrastructure/sources/versions-configmap.yaml"
      # flux-env.sh, not the vendored flux-render.sh directly: this cluster
      # substitutes from TWO ConfigMaps (cluster-versions + cluster-config) and
      # the library template calls a single `<script> export-versions <cm>`
      # entry point. flux-env.sh is that entry point and reads the sibling
      # cluster-config.yaml alongside whatever versions_configmap names.
      flux_render_script: "scripts/flux-env.sh"
      skipped_script: "scripts/kubeconform-skipped.py"
      # The library default is the first two entries only. Everything after them
      # is a file this job's behaviour is DEFINED by but which lives outside
      # kubernetes/: the two site-data files the gates read (autoscaling-policy
      # decides which workloads must carry a chart-native VPA;
      # helm-values-releases decides which HelmReleases get `helm template`d),
      # the gate scripts themselves, and the two scripts passed above as
      # flux_render_script / skipped_script. Without them an MR that loosens a
      # policy file or a gate skips flux-lint entirely and merges green — the
      # externalisation that put the site data in scripts/ is exactly what moved
      # it out of the default list's reach.
      changes:
        - "kubernetes/**/*"
        - "ansible/inventories/prod/group_vars/all.yml"
        - "scripts/autoscaling-policy.yaml"
        - "scripts/helm-values-releases.yaml"
        - "scripts/check-hpa-vpa-invariant.py"
        - "scripts/check-scrape-netpol.py"
        - "scripts/check-default-deny-coverage.py"
        - "scripts/check-secretstore-scope.py"
        - "scripts/check-pvc-storageclass.py"
        - "scripts/check-nfs-tls.py"
        - "scripts/validate-helm-values.py"
        - "scripts/flux-render.sh"
        # The two-ConfigMap wrapper the job actually calls, and the vendored
        # parser underneath it.
        - "scripts/flux-env.sh"
        - "scripts/kubeconform-skipped.py"
        # The job's own inputs live in this file: the extra_validation argv and
        # the kubeconform/kustomize/helm pins. Without this an MR that changes
        # flux-lint's configuration never re-runs flux-lint to prove the changed
        # gate still passes, and validation-gate's optional need lets it merge
        # green. (check-ci-pin-parity.sh covers the kustomize pin only; the
        # kubeconform and helm pins have no other guard.) yaml-lint,
        # ansible-lint, python-lint and python-tests already list it.
        - ".gitlab-ci.yml"
      extra_validation: 'echo "=== Adding the tenants tree to the corpus ==="; kustomize build kubernetes/clusters/weisssrv/tenants >> "$RENDER_ALL" || FAILED=1; printf "\n---\n" >> "$RENDER_ALL"; echo "=== Checking HPA/VPA invariant ==="; python3 scripts/check-hpa-vpa-invariant.py --require-chart-native-vpas --policy-config scripts/autoscaling-policy.yaml < "$RENDER_ALL" || FAILED=1; echo "=== Checking scrape/NetworkPolicy invariant ==="; python3 scripts/check-scrape-netpol.py < "$RENDER_ALL" || FAILED=1; echo "=== Checking ingress default-deny coverage ==="; python3 scripts/check-default-deny-coverage.py < "$RENDER_ALL" || FAILED=1; echo "=== Checking ClusterSecretStore scoping ==="; python3 scripts/check-secretstore-scope.py < "$RENDER_ALL" || FAILED=1; echo "=== Checking PVC storageClassName ==="; python3 scripts/check-pvc-storageclass.py < "$RENDER_ALL" || FAILED=1; echo "=== Checking NFS PersistentVolume TLS ==="; python3 scripts/check-nfs-tls.py < "$RENDER_ALL" || FAILED=1; echo "=== Schema-validating HelmRelease values blocks (helm template) ==="; MERGED_CM=$(mktemp); scripts/flux-env.sh merged-configmap "$VERSIONS_CONFIGMAP" > "$MERGED_CM" && python3 scripts/validate-helm-values.py --kubeconform --releases scripts/helm-values-releases.yaml --versions-configmap "$MERGED_CM" --policy-config scripts/autoscaling-policy.yaml || FAILED=1; rm -f "$MERGED_CM"'

  # pr-agent-review (ai-review stage): advisory AI review of the MR. Both
  # credentials are masked CI variables (OPENAI__KEY, the
  # GITLAB__PERSONAL_ACCESS_TOKEN project access token weisssrv-review-bot,
  # Developer + api) — secrets_source: env deliberately keeps 1Password out of a
  # job whose CI config comes from the branch under review.
  #
  # `gate` decides whether the job is CREATED at all; an absent review on a
  # gate-less pipeline is expected, not a regression. It is $OPENAI__KEY — the
  # job's own credential, so the gate now tracks whether the review can actually
  # run. It used to be $OP_SERVICE_ACCOUNT_TOKEN as a "trusted pipeline" marker;
  # that variable is PROTECTED, so it is absent on merge-request refs and would
  # delete the reviewer from every MR (docs/13 § Vault reads on merge-request
  # pipelines). Model, reasoning effort and both timeouts are the library
  # defaults.
  - project: eric/weisssrv-lib
    ref: v0.15.0
    file: /ci/review/pr-agent.yml
    inputs:
      secrets_source: "env"
      gate: "$OPENAI__KEY"
      # Lint + secret detection only: AI review benefits from knowing the code
      # is lint-clean and secret-safe, and must not wait on the DinD suite.
      needs:
        - job: shellcheck
          optional: true
        - job: yaml-lint
          optional: true
        - job: ansible-lint
          optional: true
        - job: terraform-fmt
          optional: true
        - job: repo-sync-checks
          optional: true
        - job: flux-lint
          optional: true
        - job: secret_detection

# Additive override of the library-generated job: the checkout path its
# setup_command writes and test_vendored_byte_identity.py reads. Declared here
# rather than as an input because the template exposes no variables input.
python-tests:
  variables:
    WEISSSRV_LIB_PATH: "$CI_PROJECT_DIR/.tmp/weisssrv-lib"

# GATE STAGE - Validation gate for deploy jobs
# All deploy jobs depend on this gate (non-optional). The gate lists every
# lint/test/security job as a dependency. GitLab CI `optional: true` semantics
# (https://docs.gitlab.com/ci/yaml/#needsoptional):
#
#   - If the needed job was NOT created (rules excluded it): dependency is ignored
#   - If the needed job IS in the pipeline and SUCCEEDS: dependency satisfied
#   - If the needed job IS in the pipeline and FAILS: the dependent job is BLOCKED
#
# Jobs with `changes:` path filters use optional:true (may not exist in pipeline).
# Jobs that ALWAYS run on main pushes (no path filter) are non-optional.
#
# Net effect: all applicable checks must pass before any deploy job runs.

# Fan-in for the integration-tests matrix. `parallel: matrix` means a `needs:`
# on it expands to ONE entry PER instance, and GitLab caps a job at 50 needs;
# this thin aggregator collapses the matrix into a single dependency on
# validation-gate and keeps that headroom. Gating is unchanged — a failed
# instance leaves this job's (non-optional-by-default) dependency unmet, so this
# job is skipped and validation-gate with it, blocking every deploy job.
# optional:true keeps a path-filtered no-op pipeline green.
#
# interruptible:false (not the default true): on main, a second merge landing
# while this or validation-gate is running must not auto-cancel it, or the first
# merge's deploy jobs are orphaned with an unmet need. The matrix upstream stays
# interruptible on purpose, so this hardens the tail only — see the workflow
# block for why "serialize merges" is still an operating rule.
test-aggregate-integration:
  stage: security
  image: alpine:3.23
  interruptible: false
  needs:
    # artifacts: false — status-only fan-in (the script is a bare echo); without
    # it GitLab would download every instance's junit artifact for no reason.
    - job: integration-tests
      optional: true
      artifacts: false
  script:
    - echo "integration test matrix complete"
  # These rules MUST stay identical to validation-gate's below: it needs this
  # job non-optionally, so if this job is created for a pipeline where that gate
  # is not (or vice versa), pipeline creation fails. Same rules => co-present.
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main"'

validation-gate:
  stage: gate
  image: alpine:3.23
  # interruptible:false (not the default true): once this deploy gate is running
  # on main, a newer commit must not auto-cancel it (workflow auto_cancel is
  # on_new_commit:interruptible) — otherwise the first pipeline's not-yet-started
  # deploy jobs, which all `needs: validation-gate`, would be orphaned and never
  # deploy. Enforces the "serialize merges" discipline the deploys rely on
  # (resource_group already serializes the deploys themselves).
  interruptible: false
  needs:
    # Path-filtered jobs (may not exist in pipeline)
    - job: shellcheck
      optional: true
    - job: yaml-lint
      optional: true
    - job: ansible-lint
      optional: true
    - job: terraform-fmt
      optional: true
    - job: terraform-validate
      optional: true
    - job: terraform-plan
      optional: true
    - job: repo-sync-checks
      optional: true
    - job: flux-lint
      optional: true
    - job: prometheus-config-lint
      optional: true
    - job: deploy-preflight
      optional: true
    - job: repo-policy-checks
      optional: true
    - job: docs-link-check
      optional: true
    - job: python-lint
      optional: true
    # The drift plans are deliberately NOT here: they are advisory
    # (allow_failure) like pr-agent-review, so they could never block the gate.
    - job: python-tests
      optional: true
    # integration-tests is fanned in via test-aggregate-integration (see its
    # comment above) so this gate's expanded needs stay under GitLab's hard
    # 50-per-job cap. That aggregator carries the SAME rules as this gate
    # (skip-schedule-web + main-only), so the two are always created together.
    # This need is intentionally NON-optional: if that shared-rules invariant is
    # ever broken, a loud pipeline-creation failure is safer than optional's
    # silent skip, which would let deploys run with the suite un-gated.
    - job: test-aggregate-integration
    # Always-run jobs (no path filter, always present on main pushes)
    - job: secret_detection
  script:
    # Guard: every deploy-* job gates on `$CI_COMMIT_BRANCH == "main" &&
    # $OP_SERVICE_ACCOUNT_TOKEN`. If the token is unset/empty those jobs are
    # silently never created and main goes green having deployed nothing.
    # Fail loudly here (this gate always runs on main, no token guard) so a
    # missing CI/CD variable surfaces as a red pipeline instead of a no-op.
    - |
      if [ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
        echo "ERROR: OP_SERVICE_ACCOUNT_TOKEN is unset/empty on a main pipeline." >&2
        echo "       All deploy-* jobs gate on this token and would be silently skipped," >&2
        echo "       deploying nothing while the pipeline reports success." >&2
        echo "       Set the OP_SERVICE_ACCOUNT_TOKEN CI/CD variable (masked, protected)." >&2
        exit 1
      fi
    - echo "All applicable checks passed - deploy jobs may proceed"
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main"'

# DEPLOY STAGE - Auto-deploy on merge to main
#
# Each Ansible deploy job sets a per-job resource_group so GitLab serializes it
# across pipelines (two rapid pushes to main can't run the same Ansible play
# against the same hosts at once). Per-job (not one shared group) keeps
# within-pipeline parallelism: jobs targeting different hosts still run
# concurrently. (deploy-terraform relies on its HTTP state lock instead; the
# read-only deploy-verify job needs no serialization.)

# Terraform

deploy-terraform:
  extends: .terraform-http-backend
  stage: deploy
  interruptible: false
  image:
    name: hashicorp/terraform:1.15.9
    entrypoint: [""]
  needs:
    - job: validation-gate
    - job: terraform-plan
      artifacts: true
  before_script:
    - !reference [.install-1password-alpine, before_script]
  script:
    - cd terraform/cloudflare
    # -lockfile=readonly: CI must not rewrite .terraform.lock.hcl (provider
    # hashes are committed; a CI-side change would mask supply-chain drift).
    - terraform init -lockfile=readonly
    - |
      export TF_VAR_cloudflare_api_token=$(op read "op://Homelab/Cloudflare Terraform Token/credential")
      export TF_VAR_cloudflare_account_id=$(op read "op://Homelab/Cloudflare Terraform Token/username")
      terraform apply -auto-approve -lock-timeout=120s tfplan
  environment:
    name: production/cloudflare
  rules:
    - !reference [.skip-schedule-web, rules]
    # Cloudflare-only: an unrelated terraform/tailscale change must not fire a
    # Cloudflare plan+apply (which could revert out-of-band Cloudflare drift).
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes: !reference [.paths-terraform-cloudflare, changes]

# Ansible Infrastructure

deploy-ansible-base:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-base
  needs:
    - job: validation-gate
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    # LOKI_PUSH_USER/PASSWORD now come from the shared .deploy-base (alloy_host
    # needs them on any site.yml-based deploy, not just this job).
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/base.yml
    # node_exporter_host, alloy_host and encrypted_swap live in site.yml, not
    # base.yml, and run on the same host set — so this tag-scoped follow-up is
    # what actually deploys them. Every role named here must stay in the tag
    # list: a role missing from it deploys nothing while the job stays green.
    # Idempotent; the tag filter skips the rest of site.yml. encrypted_swap
    # writes crypttab/fstab and activates on the host's next reboot.
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --tags node_exporter_host,alloy_host,encrypted_swap
  environment:
    name: production/ansible-base
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
        # THE COLLECTION PIN. Every role these plays run ships in
        # weisssrv.infra, so a role change reaches this repo as a version bump
        # in ansible/requirements.yml and nothing else — it is the only
        # role-side trigger any deploy job has, and every one of them watches
        # it. A bump re-runs the fleet's plays, which are idempotent.
        - ansible/requirements.yml
        - ansible/playbooks/base.yml
        # all.yml triggers deploy for alloy_host_version (host-side apt pin
        # applied by the tag-scoped site.yml follow-up above) and other
        # base-consumed pins; unrelated bumps re-run an idempotent play
        # (deploy-gitlab precedent).
        - ansible/inventories/prod/group_vars/all.yml
        - ansible/playbooks/site.yml
        - ansible/inventories/prod/group_vars/proxmox.yml
        # hosts.yml: host roster/IP/topology changes must redeploy the base play
        - ansible/inventories/prod/hosts.yml
        # Proxmox-host host_vars (e.g. per-NIC nic_tuning overrides) must
        # likewise redeploy the base play so the change actually lands — the
        # role/all.yml/proxmox.yml triggers above never see a host_vars-only
        # edit. Listed explicitly per host (not a pve-*.yml glob) so the
        # deploy-coverage gate credits each path — it ignores wildcards by design.
        - ansible/inventories/prod/host_vars/pve-opt-01.yml
        - ansible/inventories/prod/host_vars/pve-opt-02.yml
        - ansible/inventories/prod/host_vars/pve-opt-03.yml
        - ansible/inventories/prod/host_vars/pve-prec-01.yml
        - ansible/inventories/prod/host_vars/pve-nas-01.yml
        - ansible/inventories/prod/host_vars/pve-laptop-01.yml

# Proxmox host configuration (qol, postfix_null_client, tailscale)
deploy-ansible-proxmox:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-proxmox
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    TAILSCALE_AUTH_KEY: "op://Homelab/Tailscale Auth Key/credential"
  script:
    - cd ansible
    # Deploy qol, postfix_null_client, tailscale, zfs_arc_cap, vfio_passthrough,
    # nfs_tls to the proxmox hosts. Every role enabled for this host set must
    # stay in the tag list or it deploys nowhere while the job stays green
    # (deploy-preflight asserts each tag reaches a real task). nfs_tls here
    # covers the five non-NAS hosts; pve-nas-01 gets server mode from storage.yml.
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --limit proxmox --tags qol,postfix_null_client,tailscale,zfs_arc_cap,vfio_passthrough,nfs_tls
  environment:
    name: production/ansible-proxmox
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
    # Collection pin (see deploy-ansible-base).
        - ansible/requirements.yml
        # This job RUNS site.yml plays (--limit proxmox); a change to those
        # plays must redeploy too (idempotent, so extra triggers are safe).
        - ansible/playbooks/site.yml
        # Inventory inputs of the proxmox-host plays (NOT all.yml: its
        # tailscale/plex pins deploy via manual maintenance jobs by design).
        - ansible/inventories/prod/group_vars/proxmox.yml
        - ansible/inventories/prod/hosts.yml
        # Proxmox-host host_vars. Required because zfs_arc_cap is deployed HERE
        # and nowhere else, while per-host ARC caps live in these files — without
        # them a cap change triggers only deploy-ansible-base (which runs
        # nic_tuning, not this play) and never actually lands. The
        # deploy-coverage gate cannot catch that: it asks whether a path maps to
        # SOME job, not whether it maps to the job that applies it.
        # Listed explicitly per host, not a pve-*.yml glob, so that gate credits
        # each path — it ignores wildcards by design.
        - ansible/inventories/prod/host_vars/pve-nas-01.yml
        - ansible/inventories/prod/host_vars/pve-laptop-01.yml
        - ansible/inventories/prod/host_vars/pve-opt-01.yml
        - ansible/inventories/prod/host_vars/pve-opt-02.yml
        - ansible/inventories/prod/host_vars/pve-opt-03.yml
        - ansible/inventories/prod/host_vars/pve-prec-01.yml

deploy-ansible-firewall:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-firewall
  needs:
    - job: validation-gate
    - job: deploy-ansible-proxmox
      optional: true
  script:
    - cd ansible
    # Firewall is applied to proxmox hosts, dns, and mail via site.yml
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --tags proxmox_firewall
  environment:
    name: production/ansible-firewall
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
    # Collection pin (see deploy-ansible-base).
        - ansible/requirements.yml
        # Per-guest firewall assignments (guest_security_groups / firewall_ipsets)
        # live ONLY in hosts.yml, not the role — without this an inventory-only
        # firewall edit silently never deploys. site.yml now has a `hosts: k3s`
        # firewall play so --tags proxmox_firewall also reaches k3s guest .fw.
        # The ipset/security-group render reads the ENTIRE inventory (every
        # host's ansible_host + firewall_ipsets membership), so any inventory
        # file can change the rendered firewall — trigger on all of it.
        - ansible/inventories/prod/**/*
        # The proxmox_firewall plays (proxmox/dns/mail/services/k3s — which host
        # groups + tags they target) live in site.yml, which this job RUNS as
        # `site.yml --tags proxmox_firewall`. A change to those plays must also
        # redeploy; without this a future firewall-play edit would merge unrun.
        - ansible/playbooks/site.yml
        # Named explicitly, not just covered by the inventory glob above: the
        # coverage gate deliberately refuses to let a `**` glob confer coverage
        # on a group_vars file, so that every one names the job that rolls it
        # out. `services` is the HAOS group — Ansible never connects to it, and
        # this job is the only one that reaches it (by delegating to a Proxmox
        # host to write the guest .fw).
        - ansible/inventories/prod/group_vars/services.yml

deploy-ansible-dns:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-dns
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    ADGUARD_ADMIN_PASSWORD: "op://Homelab/AdGuard Home/password"
    DNS01_SSH_PRIVATE_KEY: "op://Homelab/DNS-01 SSH Key/private key"
    DNS01_SSH_PUBLIC_KEY: "op://Homelab/DNS-01 SSH Key/public key"
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/dns.yml
  environment:
    name: production/ansible-dns
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
    # Collection pin (see deploy-ansible-base).
        - ansible/requirements.yml
        - ansible/playbooks/dns.yml
        # all.yml triggers deploy for unbound_exporter_version /
        # adguard-stack pins consumed by dns.yml; unrelated bumps re-run an
        # idempotent play (deploy-gitlab precedent).
        - ansible/inventories/prod/group_vars/all.yml
        # DNS group/host vars: lxc settings, ssh policy, cert distribution
        # targets — all consumed by the dns playbook, so a vars-only change
        # must trigger a redeploy.
        - ansible/inventories/prod/group_vars/dns.yml
        - ansible/inventories/prod/host_vars/dns-01.yml
        - ansible/inventories/prod/host_vars/dns-02.yml
        # hosts.yml: DNS host IPs/roster
        - ansible/inventories/prod/hosts.yml

deploy-ansible-storage:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-storage
  needs:
    - job: validation-gate
    - job: deploy-ansible-base
      optional: true
  variables:
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
    SAMBA_NAS_PASSWORD: "op://Homelab/Samba NAS User/password"
    # B2 offsite backup (restic_offsite role, runs on pve-nas-01 via storage.yml).
    # The role reads these from env via lookup('ansible.builtin.env') in
    # host_vars/pve-nas-01.yml; restic_repo_password doubles as the restic repo
    # password.
    # restic_* fields = the RESTRICTED hide-only key (no deleteFiles). The
    # b2_key_id/b2_application_key fields on the same item stay the FULL
    # bucket-settings key for scripts/b2-bucket-drift.py (lifecycle/SSE +
    # retention reads/writes the restricted key lacks) — capability split per
    # docs/42 Step 0.
    B2_KEY_ID: "op://Homelab/B2 Archive Backup/restic_key_id"
    B2_APPLICATION_KEY: "op://Homelab/B2 Archive Backup/restic_application_key"
    RESTIC_REPO_PASSWORD: "op://Homelab/B2 Archive Backup/restic_repo_password"
  script:
    - cd ansible
    - op run -- ansible-playbook -i inventories/prod playbooks/storage.yml
  environment:
    name: production/ansible-storage
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
    # Collection pin (see deploy-ansible-base).
        - ansible/requirements.yml
        # Inventory inputs: pve-nas-01 host_vars carry the NFS exports, zvol + vzdump config the storage play renders
        - ansible/inventories/prod/host_vars/pve-nas-01.yml
        - ansible/inventories/prod/group_vars/proxmox.yml
        - ansible/inventories/prod/hosts.yml
        - ansible/playbooks/storage.yml
        # all.yml triggers deploy for restic_version/rclone_version/
        # zfs_exporter_version bumps (host-side pins with no other deploy
        # path); may also fire on unrelated bumps but the playbook is
        # idempotent — mirrors the deploy-gitlab/nextcloud/immich precedent.
        - ansible/inventories/prod/group_vars/all.yml

deploy-ansible-mail:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-mail
  needs:
    - job: validation-gate
    - job: deploy-ansible-dns
      optional: true
  variables:
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
    SMTP_RELAY_USER: "op://Homelab/SMTP Relay Auth/username"
    SMTP_RELAY_PASSWORD: "op://Homelab/SMTP Relay Auth/password"
    SMTP_GMAIL_USER: "op://Homelab/SMTP Relay Gmail/username"
    SMTP_GMAIL_PASSWORD: "op://Homelab/SMTP Relay Gmail/password"
    DNS01_SSH_PUBLIC_KEY: "op://Homelab/DNS-01 SSH Key/public key"
    # site.yml --limit mail runs base on smtp-relay, which manages the admin
    # authorized_keys from ssh_authorized_keys (built from SSH_PUBLIC_KEY). Without
    # it base_ssh_authorized_keys is empty and base's SSH-lockout guard fails the
    # deploy. Every other deploy-ansible-* job that runs base injects this too.
    SSH_PUBLIC_KEY: "op://Homelab/SSH Key/public key"
  script:
    - cd ansible
    # Mail roles are deployed via site.yml with host targeting
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --limit mail
  environment:
    name: production/ansible-mail
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
    # Collection pin (see deploy-ansible-base).
        - ansible/requirements.yml
        # Mail group vars: relay/null-client settings consumed by the
        # site.yml --limit mail run, so a vars-only change must trigger
        # a redeploy (mirrors group_vars/dns.yml on the dns job).
        - ansible/inventories/prod/group_vars/mail.yml
        # smtp-relay host_vars + host roster
        - ansible/inventories/prod/host_vars/smtp-relay.yml
        - ansible/inventories/prod/hosts.yml
        # This job RUNS site.yml plays (--limit mail); a change to those
        # plays must redeploy too.
        - ansible/playbooks/site.yml

deploy-ansible-certs:
  stage: deploy
  extends: .deploy-base
  resource_group: deploy-ansible-certs
  variables:
    # acme_certs asserts acme_certs_email on dns-01, resolved from admin_email
    # <- ROOT_EMAIL_ALIAS. The SSH-key fields cannot come through op run (see
    # the `op read` block in script: below).
    ROOT_EMAIL_ALIAS: "op://Homelab/Email Config/root_alias"
  needs:
    - job: validation-gate
    - job: deploy-ansible-dns
      optional: true
    - job: deploy-ansible-mail
      optional: true
  script:
    - cd ansible
    # `op run` does NOT inject an SSH-KEY item's private/public key fields into
    # the environment for a service-account token (it resolves them to empty),
    # so acme_certs saw DNS01_SSH_* unset. `op read` DOES resolve them — the same
    # call .deploy-base uses to fetch the SSH connection key — so read them
    # explicitly here, then run ansible. (Not in `variables:` as op:// refs,
    # because that path goes through op run's broken SSH-key injection.)
    - |
      DNS01_SSH_PRIVATE_KEY="$(op read 'op://Homelab/DNS-01 SSH Key/private key')"
      DNS01_SSH_PUBLIC_KEY="$(op read 'op://Homelab/DNS-01 SSH Key/public key')"
      if [ -z "$DNS01_SSH_PRIVATE_KEY" ] || [ -z "$DNS01_SSH_PUBLIC_KEY" ]; then
        echo "ERROR: op read returned empty DNS-01 SSH Key material (check the service account's vault access to 'DNS-01 SSH Key')." >&2
        exit 1
      fi
      export DNS01_SSH_PRIVATE_KEY DNS01_SSH_PUBLIC_KEY
    # Certificate roles via site.yml; op run resolves the remaining op:// vars.
    - op run -- ansible-playbook -i inventories/prod playbooks/site.yml --limit dns --tags acme_certs
  environment:
    name: production/ansible-certs
  rules:
    - !reference [.skip-schedule-web, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $OP_SERVICE_ACCOUNT_TOKEN'
      changes:
    # Collection pin (see deploy-ansible-base).
        - ansible/requirements.yml
        # host_vars/dns-01.yml carries the pinned host_key entries that
        # acme_certs uses for cert distribution; a change to those
        # fingerprints needs a redeploy.
        - ansible/inventories/prod/host_vars/dns-01.yml
        # This job RUNS site.yml plays (--limit dns --tags acme_certs); a
        # change to those plays must redeploy too.
        - ansible/playbooks/site.yml
        # hosts.yml: cert-distribution target addresses.
        - ansible/inventories/prod/hosts.yml

